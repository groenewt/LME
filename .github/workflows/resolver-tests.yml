name: Resolver Unit Tests

# Fast, hermetic unit tests for the manifest render resolver
# (ansible/roles/podman/filter_plugins/lme_manifests.py) -- the single source of
# truth for every derived quadlet value (userns bases, cert owners, unit names,
# PublishPort=/Volume= assembly, enable gating, JVM heap -> memory caps).
#
# No ansible/podman runtime and no deployment: the FilterModule is imported
# directly and the real manifests (manifests/*) are fed in as data. Runs on the
# GitHub-hosted ubuntu-latest runner (NOT the self-hosted Azure runners the
# integration workflows use), so it never queues waiting for a deploy host.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ansible/roles/podman/filter_plugins/**'
      - 'manifests/**'
      - 'testing/tests/unit/**'
      - '.github/workflows/resolver-tests.yml'
  pull_request:
    paths:
      - 'ansible/roles/podman/filter_plugins/**'
      - 'manifests/**'
      - 'testing/tests/unit/**'
      - '.github/workflows/resolver-tests.yml'

jobs:
  resolver-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies
        # Only what the unit tests import: pytest + PyYAML (to load the manifests).
        # Deliberately NOT testing/tests/requirements.txt -- that drags in
        # selenium/paramiko/requests for the live integration suites.
        run: pip install pytest pyyaml

      - name: Run resolver unit tests
        run: pytest -v testing/tests/unit/
