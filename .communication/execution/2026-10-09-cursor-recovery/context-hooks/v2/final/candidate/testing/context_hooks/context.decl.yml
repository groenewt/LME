denominator_rule: Never shrink expectation denominator when graph data, selected service, collector, or evidence is missing. Runtime discovery cannot remove expected rows. Campaign coverage metadata is not the runtime denominator.
expected_refusal_rule: A passed expected-refusal control cannot qualify a positive deployment assertion.
query_authorization_rule: Query truth cannot authorize an effect. Check independent current actor/action/scope grant and pool lease at the transition boundary.
live_qualification_rule: Synthetic-control success cannot satisfy live_query_qualification or release effects.
