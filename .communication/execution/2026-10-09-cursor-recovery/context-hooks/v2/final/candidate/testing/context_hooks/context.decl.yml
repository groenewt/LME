  rule: Retain raw observation.state including stale. Add validity.status=stale. Do not coerce to known_false or empty. Do not serialize stale into the older strict observation enum. Until the current consumer schema declares validity, record typed unresolved-binding blocker. Qualification is blocked. executed remains the actual execution fact.
  illustrative_mapping:
    raw_observation_state: known_true
    validity_status: stale
    current_eligibility: unresolved
    qualification: blocked
    executed: preserve_independently
  canonical_change_owner: C1 shared schema with matrix and context consumers
  blocker: BIND-STALE-VALIDITY-SCHEMA
constraint_unknown_semantics:
  all: All operands must be known true. Any known false refutes; otherwise incomplete.
  any: A known true satisfies the truth predicate. If all known false, refuted; otherwise incomplete.
  exactly_one: Exactly one known true and all remaining known false; incomplete otherwise.
  not: Invert only known truth; preserve incomplete state.
  implies: Declared truth implication is separate from action authorization.
  cardinality: Unknown population cannot satisfy bounds.
  authorization_rule: Predicate truth cannot widen actor, provider, root, or resource permission.
