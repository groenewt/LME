---
schema_version: 1
artifact_kind: private_integration_proposal
product_authority: false
edits_shared_source: false
canonical_writer: Claude Secondary
shared_schema_owner: C1
task_id: CONTEXT-HOOKS-MODEL-V2
author_task: AUTH-MODEL-HOOKS
depends_on_contracts:
  - AUTH-MODEL-CORE
  - AUTH-MODEL-PROVENANCE
source_edition:
  branch: develop
  commit: f39bd3254fa1f73d71e715644e1a7699f0f3fdf1
  tree: 2f89396ee8730eb07ebd8b9f3c76c61472ef921b
consumed_model:
  path: packet/context/target-model-contract.yaml
  sha256: 4261123770dc557e6490e085f2ef0156d525ca8c961c4ebfd93fba815df761db
not_competing_interfaces:
  - invocation_context schema
  - expected-projection interface owned by Matrix G
  - second desired-state resolver
  - replacement HTTP or SPARQL transport
first_deployment_cut:
  rule: Only prerequisites of the selected effect gate that action. Complete system-model elaboration is not a first-observation barrier.
  include:
    - AUTH-MODEL-CORE identity, relation, and constraint contracts consumed as resolved input
    - AUTH-MODEL-PROVENANCE source-selection and run/attempt bindings
    - this hook consumer at the four named seams
    - MX-CONTEXT-HOOK-QUERY-EVIDENCE binding once G emits the current expected projection
  exclude_from_immediate_gate:
    - remaining AUTH-MODEL-* domain contracts
    - Malcolm, database-profile, collection, and route whole-system obligations
    - live Fuseki qualification
    - prototype grammar completion
seams:
  - id: LME-HOOK-EXPECTATION
    phase: expectation
    obligation: Materialize all expected hook, query, and transition assertions from the resolved model before discovering runtime rows.
    exact_existing_home:
      - path: testing/acceptance/run_acceptance.yml
        source_excerpt: packet/source/lme-run-acceptance-seams.yaml
        insertion: After load-time gates and before "Run each case" (excerpt lines 216-220 / source lines 216-220).
      - path: testing/e2e/matrix
        owner: G
        status: Matrix owner is repairing the real expected-projection interface; bind join keys and result fields from packet/context/matrix-row-interface.yaml. Do not mint a parallel projection.
      - path: manifests/global.yml
        source_excerpt: packet/source/lme-global-ownership-seams.yaml
        insertion: C1 extends lme_config_registry (excerpt lines 558-578) with YAML fragment pointers for QueryContract, HookContract, and ExpectedAssertion. No second reader.
    proposed_include:
      - candidate/testing/context_hooks/tasks/validate.yml
    required_input: hook_resolved_projection from existing loader output
    matrix_assertion_ids:
      - MX-CONTEXT-HOOK-QUERY-EVIDENCE
      - MX-KNOWLEDGE-REALIZATION
      - MX-GATE-REQUIRED-STATUS
    must_not:
      - shrink expected assertions when graph, service, collector, or evidence is missing
      - treat campaign coverage metadata 84/251/10 as a runtime denominator
  - id: LME-HOOK-PRECASE
    phase: precase
    obligation: Bind case instance, source, and the full runtime tuple; maintain the denominator when any dependency is missing.
    exact_existing_home:
      - path: testing/acceptance/one_case_acceptance.yml
        source_excerpt: packet/source/lme-one_case_acceptance.yml
        insertion: After "Prepare per-case work dir" and pin materialization (lines 31-38) and before "Compose the nested probe argv" (lines 67-76).
      - path: testing/acceptance/CASE-SCHEMA.yml
        source_excerpt: packet/source/lme-CASE-SCHEMA.yml
        owner: G
        change: Admit a context-hook case kind only through G/C1 schema extension. Current kinds remain resolve_admission, loader_projection, backup_negative, custody_negative. This candidate must not be silently dropped into cases/*.yml.
    proposed_include:
      - candidate/testing/context_hooks/tasks/validate.yml
    bind:
      - case_id
      - instance_id
      - requirement_ids
      - source_binding
      - branch_binding
      - pool_binding
    instance_id: unresolved_until_admitted_projection
  - id: LME-HOOK-PREEFFECT
    phase: preeffect
    obligation: Validate query, observation freshness, current grants, and leases against the exact invocation. Query evidence cannot grant root or provider export.
    exact_existing_home:
      - path: testing/acceptance/one_case_acceptance.yml
        insertion: Immediately before "Invoke the REAL caller" command argv (lines 78-85).
      - path: candidate/testing/context_hooks/tasks/execute.yml
        insertion: Existing private argv composition; live command remains gated on unresolved Telephone and C1 slots.
    proposed_include:
      - candidate/testing/context_hooks/tasks/validate.yml
      - candidate/testing/context_hooks/tasks/execute.yml
    authorization:
      independent_of_query_truth: true
      required:
        - AuthorityGrant current actor/action/scope
        - PoolLease current generation and fencing
    argv_shape:
      subcommand: select
      positionals: 0
      required_options:
        - --file
        - --accept
        - --dataset
        - --binding
      graph_flag: ignored_by_SELECT_cannot_establish_scope
      ansible_module: ansible.builtin.command
      argv_key: argv
      environment: explicit_map_only
  - id: LME-HOOK-RESULT
    phase: result
    obligation: Bind original result, first failure, effect/capture/readback status, and retained recovery obligations to every expected assertion.
    exact_existing_home:
      - path: testing/acceptance/one_case_acceptance.yml
        insertion: When appending the real-caller verdict (lines 152-177). Add model result fields without replacing G verdict grammar.
      - path: testing/acceptance/run_acceptance.yml
        insertion: Receipt assembly (excerpt lines 332-357). Keep REJECTED-as-expected as G GREEN grammar; hook control_qualification and deployment_qualification stay distinct. A passed expected-refusal control cannot qualify a positive deployment assertion.
    proposed_include:
      - candidate/testing/context_hooks/tasks/classify.yml
    result_fields:
      - required
      - applicable
      - executed
      - status
      - evidence
    observation_mapping:
      preserve_stale: true
      validity_status: stale
      older_enum: do_not_serialize_stale_as_false_or_empty
      blocker: BIND-STALE-VALIDITY-SCHEMA
      owner: C1_with_matrix_and_context_consumers
c1_owned_registration:
  files:
    - manifests/global.yml
    - ansible/roles/podman/filter_plugins/lme_manifests.py
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/load_manifests.yml
  work:
    - Freeze admitted vocabulary and schema revision before any RDF predicate is emitted. Coordination entity IDs are not registered RDF identities.
    - Emit one resolved projection containing selected RuntimeContext, QueryContract, HookContract, Transition, and ExpectedAssertion records.
    - Do not authorize this packet to edit those files. Source snippets are evidence, not permission.
  slots:
    - admitted_vocabulary
    - resolved_context_projection
    - registered_dataset
telephone_owner_task:
  id: TELEPHONE-SELECT-EFFECT-AND-CAPTURE
  separate_from_this_packet: true
  replacement_transport: forbidden
  facts:
    - SELECT calls query_once without Effect.request
    - Effect emitter observations are non-durable; emitter failure warns and returns ok
    - CLI OptionParser has no deadline, row, byte, or retry flags
    - Wrapper sources GRAPH_STACK_ENV or stack.env when present
    - File.read loses automatic file identity
    - --graph is ignored by SELECT
    - Redaction does not cover nested maps or lists
  required_before_live_qualification:
    - TELEPHONE-SELECT-EFFECT-REQUEST
    - TELEPHONE-SELECT-DURABLE-CAPTURE
    - TELEPHONE-SELECT-BOUNDS
    - TELEPHONE-CLI-ENV-FILE-SOURCE
g_owned_matrix_binding:
  interface: packet/context/matrix-row-interface.yaml
  join_keys:
    - case_id
    - instance_id
    - requirement_ids
    - source_binding
    - branch_binding
    - pool_binding
  assertion_ids:
    - MX-CONTEXT-HOOK-QUERY-EVIDENCE
    - MX-GATE-DESCRIPTOR-CONTEXT
    - MX-GATE-REQUIRED-STATUS
    - MX-KNOWLEDGE-REALIZATION
    - MX-LINEAGE-CROSS-STAGE-STALE
    - MX-LOGIC-RELATIONS-SETS
    - MX-OCR-CURRENT-PROVIDERS
    - MX-ARCH-05
  overlay_ids_not_runtime_instances:
    - MX-OP-CURSOR-DAG-CONTEXT-HOOKS-20261009
    - MX-OP-MATRIX-EXECUTION-AND-CONTEXT-HOOKS-20261009
    - MX-OP-FULL-SYSTEM-MODELING-20261009
  runners_currently_blocked:
    - BIND-D10-RUNNER
    - BIND-D03-RUNNER
    - BIND-D01-RUNNER
  instance_id: unresolved_until_admitted_projection
acceptance_entrypoints:
  - testing/acceptance/run_acceptance.yml
  - testing/acceptance/one_case_acceptance.yml
  - existing loader resolve.yml plus deploy gate after C1 projection exists
  - testing/e2e/deploy_gate.sh remains the deployment gate; this candidate does not replace it
existing_ansible_invocation_precedent:
  path: testing/acceptance/one_case_acceptance.yml
  module: ansible.builtin.command
  argv: bpe_argv
  note: Hook live invocation must use the same argv form against the selected Fuseki CLI executable supplied in the resolved projection, never a shell string and never a new transport.
synthetic_controls:
  playbook: candidate/testing/context_hooks/controls/run_controls.yml
  evidence_class: synthetic-control
  cannot_satisfy:
    - live_query_qualification
    - release_effects
    - graph_registration
  execution_status: unrun
unresolved_actions:
  - owner: C1
    action: Admit vocabulary, QueryContract/HookContract fragment pointers, and resolved projection emission.
  - owner: C identity/secrets and platform
    action: Register reader binding identity and ACL; never copy credential values into this consumer.
  - owner: Graph projection owner
    action: Supply named-graph snapshot, population, and control witnesses.
  - owner: Matrix G
    action: Finish expected-projection interface repair and bind instance_id from admitted resolved configuration.
  - owner: MAIN
    action: Admit current actor/action/scope grant and pool lease for any live query.
  - owner: Telephone
    action: Separate scoped task for SELECT effect request, durable capture, bounds, and explicit environment without undeclared env-file sourcing.
  - owner: G
    action: CASE-SCHEMA kind admission if hook cases enter the existing acceptance runner.
qualification:
  shared_source_edited: false
  runtime_qualification: false
  live_query: unexecuted
  canonical_registration: pending_C1
