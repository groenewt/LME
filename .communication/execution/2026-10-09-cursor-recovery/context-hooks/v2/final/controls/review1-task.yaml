- provider-output/author.yaml
- receipts/author1-source-validation.yaml
task: Independently review the complete frozen candidate against the original implementation task and
  source evidence. Report runnable correctness and omissions with exact files and lines. Do not accept
  labels, an integration essay, fixture success or source review as deployment proof. You are a fresh
  independent reviewer, not the author.
review_focus:
- id: R-CALLABLE
  obligation: Tasks/macros/controls are callable through existing Ansible and Fuseki CLI paths. Check
    actual Jinja/Ansible syntax, loop/include semantics, variable timing/types, result parsing and refusal
    behavior. No new desired-state engine or HTTP/query transport.
- id: R-ONE-AUTHORITY
  obligation: One resolved canonical input, no second merge/private model/default registry. All emitted
    values and structural atoms YAML sourced; reusable real macros rather than renamed monolith or giant
    scalar program.
- id: R-QUERY
  obligation: Typed finite graph/term query generation with admission and digest. Reject injected grammar/control
    chars/caller fragments, positional operands, extra operands and unsupported operation. SELECT ignores
    --graph; scoped named graphs must exist in generated query. No arbitrary REGEX/SERVICE/update/open
    scan.
- id: R-CONTEXT
  obligation: Exact matrix case and bound runtime instance, requirement/source/query/schema/model/dataset/principal/ACL/task/ticket/resource/branch/dependency/pool
    tuple. Independent active authority and pool checks at effect boundary; graph facts do not grant action.
    Absent/stale bindings cannot pass.
- id: R-GEOMETRY
  obligation: Preserve declared spatial, semantic and lexical frames with units/CRS/axes/transform/generation.
    Candidate geometry requires exact full nonspatial rejoin. No invented geographic meaning for lexical
    bytes or frame collision shortcut.
- id: R-OUTPUT
  obligation: Zero/nonzero exit, timeout/unavailable/error, malformed/truncated output, bytes/rows/cardinality,
    duplicate/missing columns, known-present/known-absent/population controls, raw payload versus stdout
    framing versus parsed values all separate. Raw stale plus explicit validity preserved and older incompatible
    interface blocks.
- id: R-CAPTURE
  obligation: Do not pretend current SELECT has durable effect wrapping; identify upstream gap and enforcement
    boundaries. Required capture/readback uncertainty blocks live qualification, does not erase observed
    command outcome. No declared limit credited as enforced without actual path.
- id: R-CONTROLS
  obligation: Deterministic controls exercise the same actual render/validate/classify tasks, with positive/negative
    mutations, no replacement evaluator or live fallback. Test source/context/expected-value changes;
    nested secret canaries remain out of diagnostics. Expected refusal does not qualify positive deployment.
    Require a reachable successful positive component control with measured graph/result semantics, while
    retaining synthetic-not-live qualification. An all-blocked suite or supplied eligibility booleans
    cannot prove the consumer.
- id: R-LIFECYCLE
  obligation: Separate entity/revision/incarnation/invocation/attempt/occurrence/claim/evidence. Recovery
    obligations and unknown effect remain visible. No expectation shrinkage or blanket unrelated model
    completion prerequisite to first deploy.
- id: R-INTEGRATION
  obligation: Exact source-bound existing seam changes at EXPECTATION/PRECASE/PREEFFECT/RESULT, existing
    schema/owner/dependency keys, declared C1 producer and Telephone owner gaps. Integration proposal
    must be actionable, not alternate acceptance runner.
handback:
  path: provider-output/review.yaml
  required_fields:
  - provider and session identity
  - candidate freeze identity
  - 'verdict: accepted or changes_required or blocked'
  - findings with severity, exact file/line, failing trigger, impact, concrete correction and required
    control
  - required control coverage with implemented/unimplemented/unexecuted distinguished
  - tests actually executed; none permitted in this review
  - source/model/matrix compatibility and concrete owner-bound integration dependencies
  - no live qualification and no full-formal-OCR claim
  stop_rule: If required Read/Write/edit action is rejected, stop and record exact refusal; do not change
    tools or permissions to bypass.
limitations:
- This one author/reviewer cycle is not the full campaign OCR mapping/review/discourse workflow.
- Reviewer source inspection does not establish managed-runner or live graph execution.
- Current matrix source producer is separately owned; no invented invocation_context or runtime denominator.
