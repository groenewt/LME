---
# Source projection/evaluation of one declared fixture. Not a second
# desired-state resolver. MAIN supplies connection/interpreter/temp/output.
- name: Refuse undefined executor identity inputs
  action: "{{ rh_route_component_values.interfaces.assert_module }}"
  args:
    that:
      - rh_route_component_candidate_path is string
      - rh_route_component_predecessor_path is string
      - rh_route_component_controls_dir is string
      - rh_route_component_temp_dir is string
      - rh_route_component_digest_algorithm is string
      - rh_route_component_core_leg is string
      - rh_route_component_fixture is mapping
      - rh_route_component_values is mapping
      - rh_route_component_sites is mapping
      - rh_route_component_holder is mapping
      - rh_route_component_paths is mapping
    fail_msg: "{{ rh_route_component_values.render.messages.missing_apply_input }}"
    quiet: "{{ rh_route_component_values.render.assert.quiet }}"

- name: Bind the fixture selector and declared source identity
  action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
  args:
    _fx: "{{ rh_route_component_fixture }}"
    _sites: "{{ rh_route_component_sites }}"
    _vals: "{{ rh_route_component_values }}"
    _predicate_executed: "{{ rh_route_component_values.render.booleans.false_value }}"
    _outcome_observed: "{{ rh_route_component_values.render.booleans.false_value }}"
    _inner_present: "{{ rh_route_component_values.render.booleans.false_value }}"
    _include_run: "{{ rh_route_component_values.render.mappings.empty }}"
    _inner_result: "{{ rh_route_component_values.render.mappings.empty }}"
    _include_failed_key_present: "{{ rh_route_component_values.render.booleans.false_value }}"
    _include_reported_failed: "{{ rh_route_component_values.render.booleans.false_value }}"
    _include_failed_evidence: "{{ rh_route_component_values.render.result_shape.key_absent }}"
    _inner_failed_evidence: "{{ rh_route_component_values.render.evidence.inner_register_absent }}"
    _failed_result: "{{ rh_route_component_values.render.mappings.empty }}"
    _failure_generic: "{{ rh_route_component_values.render.messages.prerequisite_failure }}"
    _failure_informative: "{{ rh_route_component_values.render.strings.empty }}"
    _failure_cause: "{{ rh_route_component_values.render.messages.prerequisite_failure }}"
    _erk: "{{ rh_route_component_values.render.strings.empty }}"
    _failed_result_safe: "{{ rh_route_component_values.render.mappings.empty }}"

- name: Dispatch one fixture with durable evidence
  block:
    - name: Refuse a missing source or site selector
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - _fx[_vals.render.fixture_keys.site] in _sites.sites
          - _fx[_vals.render.fixture_keys.source] in _sites.sources
          - _fx[_vals.render.fixture_keys.kind] in _vals.render.kinds.fixture_kind_ids
          - rh_route_component_digest_algorithm == _vals.digest_algorithm
          - rh_route_component_core_leg in (_vals.managed_core_legs | map(attribute=_vals.render.core_leg_keys.id) | list)
          - (_fx[_vals.render.fixture_keys.kind] == _vals.render.kinds.assert) or (_vals.render.site_keys.expected_result_key in _sites.sites[_fx[_vals.render.fixture_keys.site]])
        fail_msg: "{{ _vals.render.messages.selector_unknown }}"
        quiet: "{{ _vals.render.assert.quiet }}"

    - name: Bind selected site, per-source expression identity, and whole-file path
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _site: "{{ _sites.sites[_fx[_vals.render.fixture_keys.site]] }}"
        _srcdecl: "{{ _sites.sources[_fx[_vals.render.fixture_keys.source]] }}"
        _src_path: "{{ { _vals.render.source_ids.candidate: rh_route_component_candidate_path, _vals.render.source_ids.predecessor: rh_route_component_predecessor_path }[_fx[_vals.render.fixture_keys.source]] }}"
        _site_src: "{{ _sites.sites[_fx[_vals.render.fixture_keys.site]].sources[_fx[_vals.render.fixture_keys.source]] }}"
        _task_path: "{{ rh_route_component_temp_dir ~ _vals.render.path.join ~ _fx[_vals.render.fixture_keys.id] ~ rh_route_component_values.render.temp_suffixes.task }}"
        _anc_path: "{{ rh_route_component_temp_dir ~ _vals.render.path.join ~ _fx[_vals.render.fixture_keys.id] ~ rh_route_component_values.render.temp_suffixes.ancestor }}"
        _obs_path: "{{ rh_route_component_temp_dir ~ _vals.render.path.join ~ _fx[_vals.render.fixture_keys.id] ~ rh_route_component_values.render.temp_suffixes.observations }}"
        _expr_path: "{{ rh_route_component_temp_dir ~ _vals.render.path.join ~ _fx[_vals.render.fixture_keys.id] ~ rh_route_component_values.render.temp_suffixes.expression }}"
        _span_path: "{{ rh_route_component_controls_dir ~ _vals.render.path.join ~ _vals.control_files[_vals.render.control_file_keys.span] }}"
        _pred_neg: "{{ _fx[_vals.render.fixture_keys.predecessor_negative] if _vals.render.fixture_keys.predecessor_negative in _fx else _vals.render.fixture_defaults.predecessor_negative }}"

    - name: Refuse a site that is not present on the selected source
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - _site_src[_vals.render.source_decl_keys.present]
        fail_msg: "{{ _vals.render.messages.source_not_present }}"
        quiet: "{{ _vals.render.assert.quiet }}"

    - name: Bind whole-file digest and byte length before any evaluation
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _src_sha: "{{ [lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip)] | map(_vals.interfaces.hash_filter, rh_route_component_digest_algorithm) | first }}"
        _src_bytes: "{{ lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip) | length }}"

    - name: Refuse source drift
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - _src_sha == _srcdecl[_vals.render.source_decl_keys.sha256]
          - ([_src_bytes] | map(_vals.interfaces.int_filter) | first) == ([_srcdecl[_vals.render.source_decl_keys.bytes]] | map(_vals.interfaces.int_filter) | first)
          - _src_path.endswith(_vals.source_paths[_fx[_vals.render.fixture_keys.source]])
        fail_msg: "{{ _vals.render.messages.source_drift }}"
        quiet: "{{ _vals.render.assert.quiet }}"

    - name: Count exact task-name hits in the bound source
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _hits_json: "{{ lookup(_vals.interfaces.template_lookup, _span_path) }}"
      vars:
        rh_span_schema: "{{ _vals.render }}"
        rh_span_action: "{{ _vals.render.actions.count_task }}"
        rh_span_source_text: "{{ lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip) }}"
        rh_span_task_name: "{{ _site[_vals.render.site_keys.task_name] }}"

    - name: Refuse missing or duplicate task selectors
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - ([_hits_json] | map(_vals.interfaces.from_json_filter) | first) | length == _vals.render.selector_hit_count
        fail_msg: "{{ _vals.render.messages.selector_hits }}"
        quiet: "{{ _vals.render.assert.quiet }}"

    - name: Project the selected source task into executor temp
      action: "{{ rh_route_component_values.interfaces.template_module }}"
      args:
        src: "{{ _span_path }}"
        dest: "{{ _task_path }}"
      vars:
        rh_span_schema: "{{ _vals.render }}"
        rh_span_action: "{{ _vals.render.actions.extract_task }}"
        rh_span_source_text: "{{ lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip) }}"
        rh_span_task_name: "{{ _site[_vals.render.site_keys.task_name] }}"
        rh_span_assert_module: "{{ _vals.interfaces.assert_module }}"

    - name: Bind YAML-decoded set_fact expression identity
      when: _fx[_vals.render.fixture_keys.kind] != _vals.render.kinds.assert
      block:
        - name: Decode extracted task with the declared runtime loader
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _decoded: "{{ [lookup(_vals.interfaces.file_lookup, _task_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip)] | map(_vals.interfaces.from_yaml_filter) | first }}"
        - name: Measure decoded set_fact scalar
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _parsed_len: "{{ _decoded | length }}"
            _parsed_name: "{{ _decoded[0][_vals.render.task_keys.name] }}"
            _expr_scalar: "{{ _decoded[0][_site[_vals.render.site_keys.module]][_site[_vals.render.site_keys.fact]] }}"
            _expr_sha: "{{ [_decoded[0][_site[_vals.render.site_keys.module]][_site[_vals.render.site_keys.fact]]] | map(_vals.interfaces.hash_filter, rh_route_component_digest_algorithm) | first }}"
            _expr_bytes: "{{ _decoded[0][_site[_vals.render.site_keys.module]][_site[_vals.render.site_keys.fact]] | length }}"
        - name: Refuse a parsed task that is not one selected named item
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - ([_parsed_len] | map(_vals.interfaces.int_filter) | first) == _vals.render.selector_hit_count
              - _parsed_name == _site[_vals.render.site_keys.task_name]
            fail_msg: "{{ _vals.render.messages.parsed_task_shape }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Refuse decoded set_fact identity drift
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _expr_sha == _site_src[_vals.render.source_decl_keys.expression_sha256]
              - ([_expr_bytes] | map(_vals.interfaces.int_filter) | first) == ([_site_src[_vals.render.source_decl_keys.expression_bytes]] | map(_vals.interfaces.int_filter) | first)
            fail_msg: "{{ _vals.render.messages.expression_drift }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Persist the decoded expression scalar for identity evidence
          action: "{{ rh_route_component_values.interfaces.copy_module }}"
          args:
            dest: "{{ _expr_path }}"
            content: "{{ _expr_scalar }}"

    - name: Bind and isolate the parsed candidate that-item
      when: _fx[_vals.render.fixture_keys.kind] == _vals.render.kinds.assert
      block:
        - name: Decode extracted assert with the declared runtime loader
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _decoded: "{{ [lookup(_vals.interfaces.file_lookup, _task_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip)] | map(_vals.interfaces.from_yaml_filter) | first }}"
        - name: Select the exact that-item from the parsed source assert
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _parsed_len: "{{ _decoded | length }}"
            _parsed_name: "{{ _decoded[0][_vals.render.task_keys.name] }}"
            _that_hits: "{{ _decoded[0][_site[_vals.render.site_keys.module]][_vals.render.task_keys.that] | select(_vals.render.jinja_tests.equalto, _site[_vals.render.site_keys.exact_that_item]) | list }}"
        - name: Refuse a parsed task that is not one selected named item
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - ([_parsed_len] | map(_vals.interfaces.int_filter) | first) == _vals.render.selector_hit_count
              - _parsed_name == _site[_vals.render.site_keys.task_name]
            fail_msg: "{{ _vals.render.messages.parsed_task_shape }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Refuse a missing isolated that-item
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _that_hits | length > _vals.render.integers.zero
            fail_msg: "{{ _vals.render.messages.missing_that_item }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Refuse a duplicate isolated that-item
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _that_hits | length == _vals.render.selector_hit_count
            fail_msg: "{{ _vals.render.messages.that_item_not_isolated }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Measure decoded that-item identity
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _extracted_that: "{{ _that_hits[0] if _vals.render.isolation.that_is_sequence_of_one_extracted_item else _that_hits }}"
            _expr_sha: "{{ [_that_hits[0]] | map(_vals.interfaces.hash_filter, rh_route_component_digest_algorithm) | first }}"
            _expr_bytes: "{{ _that_hits[0] | length }}"
        - name: Refuse decoded that-item identity drift
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _extracted_that == _site[_vals.render.site_keys.exact_that_item]
              - _expr_sha == _site_src[_vals.render.source_decl_keys.expression_sha256]
              - ([_expr_bytes] | map(_vals.interfaces.int_filter) | first) == ([_site_src[_vals.render.source_decl_keys.expression_bytes]] | map(_vals.interfaces.int_filter) | first)
            fail_msg: "{{ _vals.render.messages.expression_drift }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Persist the decoded that-item scalar for identity evidence
          action: "{{ rh_route_component_values.interfaces.copy_module }}"
          args:
            dest: "{{ _expr_path }}"
            content: "{{ _extracted_that }}"
        - name: Project the isolation assert from the extracted that-item
          action: "{{ rh_route_component_values.interfaces.template_module }}"
          args:
            src: "{{ _span_path }}"
            dest: "{{ _task_path }}"
          vars:
            rh_span_schema: "{{ _vals.render }}"
            rh_span_action: "{{ _vals.render.actions.isolate_assert }}"
            rh_span_task_name: "{{ _site[_vals.render.site_keys.task_name] }}"
            rh_span_module: "{{ _site[_vals.render.site_keys.module] }}"
            rh_span_extracted_that_item: "{{ _extracted_that }}"

    - name: Project synthetic observation variables for the extracted task
      action: "{{ rh_route_component_values.interfaces.template_module }}"
      args:
        src: "{{ _span_path }}"
        dest: "{{ _obs_path }}"
      vars:
        rh_span_schema: "{{ _vals.render }}"
        rh_span_action: "{{ _vals.render.actions.observation_facts }}"
        rh_span_values: "{{ _vals }}"
        rh_span_fixture: "{{ _fx }}"
        rh_span_holder: "{{ rh_route_component_holder }}"
        rh_span_paths: "{{ rh_route_component_paths }}"
        rh_span_app_kind: "{{ rh_route_component_fixtures_root.app_kind }}"

    - name: Load projected observations
      ansible.builtin.include_vars:
        file: "{{ _obs_path }}"

    - name: Bind production rh with any declared assertion overlay
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        rh: "{{ _vals.rh if _fx[_vals.render.fixture_keys.kind] != _vals.render.kinds.assert else (_vals.rh | combine(rh_route_component_assert_overlay, recursive=_vals.render.combine.recursive)) }}"

    - name: Unbind the inner assertion register before include
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        rh_route_component_inner_assert: "{{ _vals.render.mappings.empty }}"

    - name: Project, bind, and include the ancestor-chain source task before the token decision
      when: _fx[_vals.render.fixture_keys.kind] == _vals.render.kinds.token
      block:
        - name: Bind ancestor site identity for this source
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _anc_site: "{{ _sites.sites[_sites.selector_index.ancestor] }}"
            _anc_src: "{{ _sites.sites[_sites.selector_index.ancestor].sources[_fx[_vals.render.fixture_keys.source]] }}"
        - name: Count ancestor task hits
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _anc_hits_json: "{{ lookup(_vals.interfaces.template_lookup, _span_path) }}"
          vars:
            rh_span_schema: "{{ _vals.render }}"
            rh_span_action: "{{ _vals.render.actions.count_task }}"
            rh_span_source_text: "{{ lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip) }}"
            rh_span_task_name: "{{ _anc_site[_vals.render.site_keys.task_name] }}"
        - name: Refuse missing or duplicate ancestor selector
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _anc_src[_vals.render.source_decl_keys.present]
              - ([_anc_hits_json] | map(_vals.interfaces.from_json_filter) | first) | length == _vals.render.selector_hit_count
            fail_msg: "{{ _vals.render.messages.ancestor_hits }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Project ancestor task
          action: "{{ rh_route_component_values.interfaces.template_module }}"
          args:
            src: "{{ _span_path }}"
            dest: "{{ _anc_path }}"
          vars:
            rh_span_schema: "{{ _vals.render }}"
            rh_span_action: "{{ _vals.render.actions.extract_task }}"
            rh_span_source_text: "{{ lookup(_vals.interfaces.file_lookup, _src_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip) }}"
            rh_span_task_name: "{{ _anc_site[_vals.render.site_keys.task_name] }}"
            rh_span_assert_module: "{{ _vals.interfaces.assert_module }}"
        - name: Decode ancestor task with the declared runtime loader
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _anc_decoded: "{{ [lookup(_vals.interfaces.file_lookup, _anc_path, rstrip=_vals.render.file_lookup.rstrip, lstrip=_vals.render.file_lookup.lstrip)] | map(_vals.interfaces.from_yaml_filter) | first }}"
        - name: Measure decoded ancestor expression identity
          action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
          args:
            _anc_parsed_len: "{{ _anc_decoded | length }}"
            _anc_parsed_name: "{{ _anc_decoded[0][_vals.render.task_keys.name] }}"
            _anc_expr_sha: "{{ [_anc_decoded[0][_anc_site[_vals.render.site_keys.module]][_anc_site[_vals.render.site_keys.fact]]] | map(_vals.interfaces.hash_filter, rh_route_component_digest_algorithm) | first }}"
            _anc_expr_bytes: "{{ _anc_decoded[0][_anc_site[_vals.render.site_keys.module]][_anc_site[_vals.render.site_keys.fact]] | length }}"
        - name: Refuse a parsed ancestor task that is not one selected named item
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - ([_anc_parsed_len] | map(_vals.interfaces.int_filter) | first) == _vals.render.selector_hit_count
              - _anc_parsed_name == _anc_site[_vals.render.site_keys.task_name]
            fail_msg: "{{ _vals.render.messages.parsed_task_shape }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Refuse ancestor expression drift
          action: "{{ rh_route_component_values.interfaces.assert_module }}"
          args:
            that:
              - _anc_expr_sha == _anc_src[_vals.render.source_decl_keys.expression_sha256]
              - ([_anc_expr_bytes] | map(_vals.interfaces.int_filter) | first) == ([_anc_src[_vals.render.source_decl_keys.expression_bytes]] | map(_vals.interfaces.int_filter) | first)
            fail_msg: "{{ _vals.render.messages.expression_drift }}"
            quiet: "{{ _vals.render.assert.quiet }}"
        - name: Evaluate the projected ancestor task
          ansible.builtin.include_tasks:
            file: "{{ _anc_path }}"

    - name: Evaluate the projected source component
      ansible.builtin.include_tasks:
        file: "{{ _task_path }}"
      register: _proj_run
      ignore_errors: "{{ (_fx[_vals.render.fixture_keys.kind] == _vals.render.kinds.assert) and _vals.render.ignore_errors_on_assert_kind }}"

    - name: Bind include-run and inner assertion register before classification
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _include_run: "{{ lookup(_vals.interfaces.vars_lookup, _vals.render.registers.include_run) }}"
        _inner_result: "{{ lookup(_vals.interfaces.vars_lookup, _vals.render.registers.inner_assert) }}"

    - name: Classify inner-register and include-result key presence
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _inner_present: "{{ _inner_result is mapping and ([_vals.render.observation_keys.failed] | select(_vals.render.jinja_tests.contained_in, _inner_result) | list | length == _vals.render.integers.one) }}"
        _include_failed_key_present: "{{ _include_run is mapping and ([_vals.render.observation_keys.failed] | select(_vals.render.jinja_tests.contained_in, _include_run) | list | length == _vals.render.integers.one) }}"

    - name: Bind include failed evidence when the failed key is present
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _include_reported_failed: "{{ _include_run[_vals.render.observation_keys.failed] | bool }}"
        _include_failed_evidence: "{{ _include_run[_vals.render.observation_keys.failed] }}"
      when: _include_failed_key_present | bool

    - name: Bind include failed absence when the failed key is missing
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _include_reported_failed: "{{ _vals.render.booleans.false_value }}"
        _include_failed_evidence: "{{ _vals.render.result_shape.key_absent }}"
      when: not (_include_failed_key_present | bool)

    - name: Bind inner failed evidence when the failed key is present
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _inner_failed_evidence: "{{ _inner_result[_vals.render.observation_keys.failed] }}"
      when: _inner_present | bool

    - name: Bind inner failed absence when the failed key is missing
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _inner_failed_evidence: "{{ _vals.render.evidence.inner_register_absent }}"
      when: not (_inner_present | bool)

    - name: Refuse include failure before a present inner assertion register
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - _vals.render.booleans.false_value
        fail_msg: "{{ _vals.render.messages.include_failed_before_inner }}"
        quiet: "{{ _vals.render.assert.quiet }}"
      when:
        - _fx[_vals.render.fixture_keys.kind] == _vals.render.kinds.assert
        - _include_reported_failed | bool
        - not (_inner_present | bool)

    - name: Mark the projected source predicate as executed
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _predicate_executed: "{{ _vals.render.booleans.true_value }}"

    - name: Bind expected result key when the selected site declares it
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        _erk: "{{ _site[_vals.render.site_keys.expected_result_key] }}"
      when: _vals.render.site_keys.expected_result_key in _site

    - name: Bind observed result against the declared expected value
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
