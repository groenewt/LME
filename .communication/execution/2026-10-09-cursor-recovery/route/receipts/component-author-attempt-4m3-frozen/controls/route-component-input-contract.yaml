---
# Executor-supplied interface for controls/exercise-route-predicates.yml.
# No ambient private defaults. MAIN's managed Ansible transport supplies every
# input below. This child does not name a launcher or historical executor path.
schema_version: 1
node: route_component_input_contract
playbook: "controls/exercise-route-predicates.yml"
apply_tasks: "controls/apply-route-predicate.yml"
span_macros: "controls/route-declared-span.j2"
values_control_file: "route-component-values.yaml"
connection_interface: "ansible_connection"
interpreter_interface: "ansible_python_interpreter"
digest_algorithm: "sha256"
required_supplied_inputs:
  - name: "rh_route_component_inventory_hosts"
    type: "string"
    role: "Ansible hosts pattern for this play"
  - name: "rh_route_component_connection"
    type: "string"
    equals_declared: "route-component-values.yaml interfaces.local_connection"
    value: "local"
  - name: "rh_route_component_python_interpreter"
    type: "string"
    role: "absolute interpreter path of the managed core leg"
  - name: "rh_route_component_controls_dir"
    type: "string"
    role: "absolute directory containing these control files"
  - name: "rh_route_component_candidate_path"
    type: "string"
    role: "absolute path of candidate9b5ba6f9 reap_staging.yml.after.partial"
    expected_sha256: "9b5ba6f936cf2411b4dc18cefe2ddc5a221dbba4f3912310f9d257a842cef134"
    expected_bytes: 303440
  - name: "rh_route_component_predecessor_path"
    type: "string"
    role: "absolute path of predecessor reap_staging.yml.after.partial"
    expected_sha256: "c6ae3aa9b5d73add63a7b4374f3dffe2a563ce9aef9eb72fe1952919a0e4e865"
    expected_bytes: 300626
  - name: "rh_route_component_temp_dir"
    type: "string"
    role: "absolute directory for source projections and observation YAML"
  - name: "rh_route_component_output_path"
    type: "string"
    role: "absolute path written after managed execution"
  - name: "rh_route_component_digest_algorithm"
    type: "string"
    equals_declared: "route-component-values.yaml digest_algorithm"
    value: "sha256"
  - name: "rh_route_component_core_leg"
    type: "string"
    enum:
      - "core_2_17_14"
      - "core_2_19_11"
    role: "which managed ansible-core leg this invocation is"
  - name: "rh_route_component_gather_facts"
    type: "boolean"
    equals_declared: "route-component-values.yaml render.play.gather_facts"
    value: false
  - name: "rh_route_component_become"
    type: "boolean"
    equals_declared: "route-component-values.yaml render.play.become"
    value: false
  - name: "rh_route_component_values_filename"
    type: "string"
    equals_declared: "route-component-values.yaml control_files[render.control_file_keys.values_name] and render.bootstrap.values_filename"
    value: "route-component-values.yaml"
    role: "basename of the values control file; MAIN must supply it because the first include_vars cannot read values.yaml to learn its own filename"
  - name: "rh_route_component_path_join"
    type: "string"
    equals_declared: "route-component-values.yaml render.path.join"
    value: "/"
    role: "path-join separator used at bootstrap include_vars before values load; after load must equal render.path.join"
producer_consumer_closure:
  production_policy:
    producer: "packet/context/s68.yaml and packet/context/r55.yaml"
    consumer: "extracted candidate/predecessor task vars _bs _lz _ob _dh _rec and rh.controller.bootstrap.path_admission.case_sensitive"
    words:
      - "path_admission.case_sensitive true (s68 :4463; r55 path_admission_grammar enum [true] :3643)"
      - "transaction.temp_name (s68 :8457)"
      - "leaf_listing.listed present (s68 :8861)"
      - "combination table (s68 :9032-9035)"
      - "dead_rule.cgroup_input (s68 :9136-9138)"
      - "proof.holder_quiescent_cgroup_from (s68 :8722)"
      - "token_regex, proc_root, cgroup_root, proc_paths, populated_regex, decimal_ere, record_parse.check_order"
      - "leaf_listing.record_separator LF (s68 :8859)"
      - "leaf_listing.not_listed.status 0 (s68 :8862)"
  observations:
    producer: "controls/route-component-fixtures.yaml atoms projected by route-declared-span.j2 observation_facts from route-component-values.yaml render"
    consumer: "the same register/fact names the extracted source tasks already read"
    not_policy: "fixture dest/registry/token/cgroup path identities are observation bindings, not s68 policy replacements"
  source_projection:
    producer: "bound candidate or predecessor file bytes after sha256 and bytes match; per-source YAML-decoded expression scalars"
    consumer: "native ansible.builtin.include_tasks with declared file key of the extracted named set_fact task, or isolation projection of the parsed candidate that-item"
    include_interface: "action-plugin include_tasks/include_vars bind file from YAML; not action plus args.file"
    runtime_decode: "ansible.builtin.from_yaml of the extracted task then the selected set_fact or that-item; coordinator Psych hashes remain the declared expected pairs until MAIN measures the same path"
    refusal: "missing/duplicate selector, whole-file drift, per-source expression sha256/bytes drift, or source not present"
  ancestor_dependency:
    producer: "extracted task Bind each observed holder's ancestor chains with per-source expression identity"
    consumer: "token decision _rh_reap_anc.paths"
  expected_outcomes:
    producer: "fixtures[].expected"
    consumer: "apply-route-predicate.yml comparison after source evaluation and a present inner failed key for assert kind"
    not_producer: "route-declared-span.j2 does not compute known/dead/combination cells"
    not_expected_negative: "prerequisite, source-binding, dispatch, projection, or absent inner-register failures are status blocked or failed, never a passed refuse"
campaign_legs:
  - "core_2_17_14"
  - "core_2_19_11"
note: "Each invocation names one leg. Both remain required campaign executions. Unique() case-sensitivity is ansible-core behavior under the extracted candidate expression."
unexecuted_until_managed_run:
  required: true
  applicable: true
  executed: false
  status: "blocked"
not_in_this_interface:
  - "launcher path"
  - "historical executor path"
  - "product implementation"
  - "whole-consumer loader/lifecycle"
  - "B in-lock SAME-INPUT"
  - "C1 successor reservation"
  - "profile/topology matrix"
