# packet/task.yaml ROUTE-OP2D-CASEFOLDED-REGISTRY-UNIQUENESS counterexample suffixes
# (valid mktemp trail bodies under s68 transaction.temp_name.trail '.XXXXXXXX').
task_counterexample:
  finding_id: "ROUTE-OP2D-CASEFOLDED-REGISTRY-UNIQUENESS"
  temp_trail_bodies:
    - "aB3dE5fG"
    - "Ab3dE5fG"
  trail_separator: "."
  placeholder: "XXXXXXXX"
r55:
  path_admission_grammar_case_sensitive_enum:
    - true
# rh tree actually read by the extracted candidate task vars (_bs, _lz, _ob, _dh,
# _rec). Producer: s68/r55 words above. Consumer: candidate set_fact expressions.
# Isolated case_sensitive that-item does not require the Admit pin-by-value rh.
rh:
  controller:
    bootstrap:
      path_admission:
        charset: "A-Za-z0-9._/+-"
        regex: '^/[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*$'
        separator: "/"
        case_sensitive: true
      bundle:
        staging_infix: "staging"
        staging_retention:
          lease:
            token_regex: '^L[0-9a-f]{32}-[0-9a-f]{32}-[0-9]+-[1-9][0-9]*-[0-9]+$'
            proc_root: "/proc"
            cgroup_root: "/sys/fs/cgroup"
            events_file: "cgroup.events"
            populated_regex: '^populated [01]$'
            proc_paths:
              join: "/"
              pid_placeholder:
                segment: "<pid>"
                ere: '^[1-9][0-9]*$'
              reaper_reads:
                record_holder_presence:
                  of_segments:
                    - "<pid>"
                  follow: false
                  absent_when: "not_found"
          recovery:
            retired_controller_machine_ids: []
    entry_generation:
      render:
        n10:
          write_bound:
            obligations:
              record_fields:
                token: "token"
                device_bytes: "device_bytes"
                metadata_copies: "metadata_copies"
                destination: "destination"
                paths: "paths"
                lease: "lease"
              recovery_path_roles:
                - "staging"
                - "local_temp"
                - "remote_temp"
              transaction:
                temp_name:
                  lead: "."
                  from: "token"
                  trail: ".XXXXXXXX"
                grammar:
                  decimal_ere: "(0|[1-9][0-9]*)"
                record_parse:
                  check_order:
                    - "unreadable"
                    - "not_one_json_object"
                    - "keys_not_record_fields"
                    - "device_bytes_not_device_to_nonneg_integer"
                    - "metadata_copies_not_device_to_nonneg_integer"
                    - "token_not_token_regex"
                    - "token_not_file_name"
                    - "destination_not_admitted_path"
                    - "paths_not_role_to_admitted_path"
                    - "staging_not_token_staging_name"
                    - "lease_not_lease_record_fields"
                    - "lease_token_not_record_token"
            lifetime:
              dead_holder:
                proof:
                  holder_quiescent: "lease_quiescence_proof"
                  holder_quiescent_cgroup_from:
                    - "relock"
                    - "dead_rule"
                    - "cgroup_input"
                relock:
                  namespace:
                    proc_view:
                      line_prefix: "NSpid:"
                      lines: 1
                      fields_after_prefix: 1
                      field_grammar_from:
                        - "transaction"
                        - "grammar"
                        - "decimal_ere"
                    cgroup_view:
                      rows: 1
                      fields:
                        - "target"
                        - "fstype"
                        - "fsroot"
                      separator: " "
                      fstype: "cgroup2"
                      fsroot: "/"
                  process_visibility:
                    proc_mount_unrestricted:
                      rows: 1
                      fields:
                        - "options"
                      split: ","
                      hidepid_allowed:
                        - "hidepid=noaccess"
                      hidepid_absent: "allowed"
                  proc_stat:
                    start_field: 22
                    after_comm_first: 3
                  absence_proof:
                    leaf_listing:
                      listed: "present"
                    each_ancestor:
                      type_probe:
                        equals: "directory"
                        follows_links: false
                      searchable:
                        ansible_consumer:
                          proven_when:
                            - "exists"
                            - "isdir"
                            - "not_islnk"
                            - "executable"
                    leaf_absent:
                      ansible_consumer:
                        follow: false
                        absent_when: "exists_false"
                        exists_false_only_on: "not_found"
                        failed_or_missing: "unknown"
                    cgroup_first_absent_segment:
                      segment_absent:
                        ansible_consumer_from:
                          - "leaf_absent"
                          - "ansible_consumer"
                      consumer:
                        combination:
                          none:
                            present: "present"
                            gone: "gone"
                            unknown: "unknown"
                          gone:
                            present: "unknown"
                            gone: "unknown"
                            unknown: "gone"
                          unknown:
                            present: "unknown"
                            gone: "unknown"
                            unknown: "unknown"
                  dead_rule:
                    cgroup_input:
                      term: "cgroup_proven_absent_or_unpopulated"
                      from:
                        - "absence_proof"
                        - "cgroup_first_absent_segment"
                        - "consumer"
                        - "combination"
                      holds_on: "gone"
                      absent_route_cells:
                        - ["none", "gone"]
                        - ["gone", "unknown"]
                      unpopulated_route_cells:
                        - ["none", "gone"]
                      leaf_alone: "never"
                      other_cells: "retained"
observation_texts:
  proc_view_status: "NSpid: 1\n"
  events_unpopulated: "populated 0\n"
  events_populated: "populated 1\n"
  type_probe_stdout: "directory\n"
  proc_mount_options: "rw\n"
  empty_listing: ""
  unknown_listing_record: "bad/name"
