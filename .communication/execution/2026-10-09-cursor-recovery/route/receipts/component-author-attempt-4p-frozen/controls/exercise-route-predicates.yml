---
# Playbook for MAIN's existing managed Ansible transport. It does not import a
# launcher, guess executor paths, or treat template parsing as qualification.
# Runtime tests remain unexecuted until MAIN invokes this file.
- name: Exercise route component predicates from admitted candidate expressions
  hosts: "{{ rh_route_component_inventory_hosts }}"
  gather_facts: "{{ rh_route_component_gather_facts }}"
  become: "{{ rh_route_component_become }}"
  vars:
    ansible_connection: "{{ rh_route_component_connection }}"
    ansible_python_interpreter: "{{ rh_route_component_python_interpreter }}"
  tasks:
    - name: Load declared production values
      ansible.builtin.include_vars:
        file: "{{ rh_route_component_controls_dir ~ rh_route_component_path_join ~ rh_route_component_values_filename }}"
        name: rh_route_component_values

    - name: Refuse undefined executor-supplied interface values
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - rh_route_component_inventory_hosts is string
          - rh_route_component_connection is string
          - rh_route_component_python_interpreter is string
          - rh_route_component_controls_dir is string
          - rh_route_component_candidate_path is string
          - rh_route_component_predecessor_path is string
          - rh_route_component_temp_dir is string
          - rh_route_component_output_path is string
          - rh_route_component_digest_algorithm is string
          - rh_route_component_core_leg is string
          - rh_route_component_gather_facts is boolean
          - rh_route_component_become is boolean
          - rh_route_component_values_filename is string
          - rh_route_component_path_join is string
        fail_msg: "{{ rh_route_component_values.render.messages.missing_executor_input }}"
        quiet: "{{ rh_route_component_values.render.assert.quiet }}"

    - name: Load declared executor contract
      ansible.builtin.include_vars:
        file: "{{ rh_route_component_controls_dir ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.contract] }}"
        name: rh_route_component_contract

    - name: Load declared expression sites
      ansible.builtin.include_vars:
        file: "{{ rh_route_component_controls_dir ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.sites] }}"
        name: rh_route_component_sites

    - name: Load declared fixtures
      ansible.builtin.include_vars:
        file: "{{ rh_route_component_controls_dir ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.fixtures] }}"
        name: rh_route_component_fixtures_root

    - name: Refuse connection, digest, play, and values-filename atoms outside the declared contract
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - rh_route_component_connection == rh_route_component_values.interfaces.local_connection
          - rh_route_component_digest_algorithm == rh_route_component_values.digest_algorithm
          - rh_route_component_gather_facts == rh_route_component_values.render.play.gather_facts
          - rh_route_component_become == rh_route_component_values.render.play.become
          - rh_route_component_core_leg in (rh_route_component_values.managed_core_legs | map(attribute=rh_route_component_values.render.core_leg_keys.id) | list)
          - rh_route_component_values.render.control_file_keys.values_name in rh_route_component_values.control_files
          - rh_route_component_values_filename == rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.values_name]
          - rh_route_component_values_filename == rh_route_component_values.render.bootstrap.values_filename
          - rh_route_component_values_filename == rh_route_component_contract.values_control_file
          - rh_route_component_path_join == rh_route_component_values.render.path.join
          - rh_route_component_values.render.record_separator_name in rh_route_component_values.render.record_separators
          - rh_route_component_values.render.record_separators[rh_route_component_values.render.record_separator_name] == rh_route_component_values.render.record_separator
          - rh_route_component_values.render.fixture_keys.id in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.fixture_keys.site in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.fixture_keys.source in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.fixture_keys.kind in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.fixture_keys.expected in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.fixture_keys.predecessor_negative in rh_route_component_fixtures_root.fixtures[0]
          - rh_route_component_values.render.path_keys.dest in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.registry_dir in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.lock_name in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.ouid in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.uid_number in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.k1_segment in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.leaf_segment in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.cgroup_path_n2 in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.path_keys.cgroup_path_n1 in rh_route_component_fixtures_root.paths
          - rh_route_component_values.render.holder_keys.token in rh_route_component_fixtures_root.holder
          - rh_route_component_values.render.holder_keys.pid in rh_route_component_fixtures_root.holder
          - rh_route_component_sites.selector_index.ancestor in rh_route_component_sites.sites
          - rh_route_component_sites.selector_index.registry in rh_route_component_sites.sites
          - rh_route_component_sites.selector_index.token in rh_route_component_sites.sites
          - rh_route_component_sites.selector_index.case_sensitive_assert in rh_route_component_sites.sites
          - rh_route_component_values.render.site_keys.expected_result_key in rh_route_component_sites.sites[rh_route_component_sites.selector_index.registry]
          - rh_route_component_values.render.site_keys.expected_result_key in rh_route_component_sites.sites[rh_route_component_sites.selector_index.token]
          - rh_route_component_values.packet_bindings.candidate_sha256 == rh_route_component_sites.sources.candidate.sha256
          - rh_route_component_values.packet_bindings.predecessor_sha256 == rh_route_component_sites.sources.predecessor.sha256
          - rh_route_component_values.render.boolean_keys.true_name not in rh_route_component_values.render.booleans
          - rh_route_component_values.render.boolean_keys.false_name not in rh_route_component_values.render.booleans
          - rh_route_component_values.render.booleans.true_value is boolean
          - rh_route_component_values.render.booleans.false_value is boolean
          - rh_route_component_values.render.booleans.true_value | bool
          - not (rh_route_component_values.render.booleans.false_value | bool)
          - rh_route_component_values.render.result_shape.key_absent == rh_route_component_values.render.evidence.inner_register_absent
          - rh_route_component_values.render.include.failed_result_msg_key == rh_route_component_values.render.failure_cause.generic_key
          - rh_route_component_values.render.failure_cause.exception_key is string
          - rh_route_component_values.render.failure_cause.message_key is string
          - rh_route_component_values.render.failure_cause.reason_key is string
          - rh_route_component_values.render.failure_cause.pair_separator is string
          - rh_route_component_values.render.isolation.enabled is boolean
          - rh_route_component_values.render.isolation.enabled | bool
          - rh_route_component_values.render.isolation.ignore_errors is boolean
          - rh_route_component_values.render.isolation.ignore_errors | bool
          - rh_route_component_values.render.isolation.add_quiet is boolean
          - not (rh_route_component_values.render.isolation.add_quiet | bool)
          - rh_route_component_values.render.isolation.add_failed_when is boolean
          - not (rh_route_component_values.render.isolation.add_failed_when | bool)
          - rh_route_component_values.render.task_keys.ignore_errors is string
          - rh_route_component_values.render.jinja_tests.equalto is string
          - rh_route_component_values.render.jinja_tests.contained_in is string
          - rh_route_component_values.render.registers.inner_assert is string
          - rh_route_component_values.render.registers.include_run is string
          - rh_route_component_values.render.actions.include_eval is string
          - rh_route_component_values.render.eval_include.task_name is string
          - rh_route_component_values.render.temp_suffixes.eval is string
          - rh_route_component_values.render.site_keys.fact in rh_route_component_sites.sites[rh_route_component_sites.selector_index.registry]
          - rh_route_component_values.render.site_keys.fact in rh_route_component_sites.sites[rh_route_component_sites.selector_index.token]
          - rh_route_component_sites.sites[rh_route_component_sites.selector_index.registry][rh_route_component_values.render.site_keys.fact] is string
          - rh_route_component_sites.sites[rh_route_component_sites.selector_index.token][rh_route_component_values.render.site_keys.fact] is string
          - rh_route_component_values.render.site_keys.observed_holder_key in rh_route_component_sites.sites[rh_route_component_sites.selector_index.token]
          - rh_route_component_values.render.site_keys.observed_holder_key not in rh_route_component_sites.sites[rh_route_component_sites.selector_index.registry]
          - rh_route_component_sites.sites[rh_route_component_sites.selector_index.token][rh_route_component_values.render.site_keys.observed_holder_key] == rh_route_component_values.render.holder_keys.token
          - rh_route_component_values.render.view_stdout_modes.cgroup_view_row is string
          - rh_route_component_values.render.view_stdout_modes.declared is string
          - rh_route_component_values.render.schema_only_keys.stdout_mode in rh_route_component_values.render.view_bound[rh_route_component_values.render.view_section_keys.cgv]
          - rh_route_component_values.render.schema_only_keys.stdout_mode in rh_route_component_values.render.view_unbound[rh_route_component_values.render.view_section_keys.cgv]
          - rh_route_component_values.render.view_bound[rh_route_component_values.render.view_section_keys.cgv][rh_route_component_values.render.schema_only_keys.stdout_mode] == rh_route_component_values.render.view_stdout_modes.cgroup_view_row
          - rh_route_component_values.render.view_unbound[rh_route_component_values.render.view_section_keys.cgv][rh_route_component_values.render.schema_only_keys.stdout_mode] == rh_route_component_values.render.view_stdout_modes.declared
          - rh_route_component_values.render.task_split.maxsplit == rh_route_component_values.render.integers.one
          - rh_route_component_contract.playbook == (rh_route_component_values.render.path.controls_prefix ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.exercise])
          - rh_route_component_contract.apply_tasks == (rh_route_component_values.render.path.controls_prefix ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.apply])
          - rh_route_component_contract.span_macros == (rh_route_component_values.render.path.controls_prefix ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.span])
          - rh_route_component_values.render.dict_attr_keys.keys_name in rh_route_component_values.render.evidence
          - rh_route_component_sites.sources.candidate.path == rh_route_component_values.source_paths.candidate
          - rh_route_component_sites.sources.predecessor.path == rh_route_component_values.source_paths.predecessor
          - rh_route_component_values.rh.controller.bootstrap.path_admission.case_sensitive in rh_route_component_values.r55.path_admission_grammar_case_sensitive_enum
          - rh_route_component_values.rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.temp_name.trail == (rh_route_component_values.task_counterexample.trail_separator ~ rh_route_component_values.task_counterexample.placeholder)
          - rh_route_component_fixtures_root.fixtures | length > rh_route_component_values.render.integers.zero
        fail_msg: "{{ rh_route_component_values.render.messages.interface_outside_contract }}"
        quiet: "{{ rh_route_component_values.render.assert.quiet }}"

    - name: Refuse campaign_legs that is not the declared two-item core-leg sequence
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - rh_route_component_contract.campaign_legs == (rh_route_component_values.managed_core_legs | map(attribute=rh_route_component_values.render.core_leg_keys.id) | list)
          - rh_route_component_contract.campaign_legs | length == rh_route_component_values.render.integers.two
        fail_msg: "{{ rh_route_component_values.render.messages.contract_legs }}"
        quiet: "{{ rh_route_component_values.render.assert.quiet }}"

    - name: Refuse include and filter declarations that are not the supported native interface
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - rh_route_component_values.interfaces.include_tasks_module == rh_route_component_values.render.include.tasks_module
          - rh_route_component_values.interfaces.include_vars_module == rh_route_component_values.render.include.vars_module
          - rh_route_component_values.interfaces.include_file_argument == rh_route_component_values.render.include.file_key
          - rh_route_component_values.interfaces.hash_filter == rh_route_component_values.render.filters.hash
          - rh_route_component_values.interfaces.b64encode_filter == rh_route_component_values.render.filters.b64encode
          - rh_route_component_values.interfaces.from_yaml_filter == rh_route_component_values.render.filters.from_yaml
          - rh_route_component_values.interfaces.from_json_filter == rh_route_component_values.render.filters.from_json
          - rh_route_component_values.interfaces.to_json_filter == rh_route_component_values.render.filters.to_json
          - rh_route_component_values.interfaces.bool_filter == rh_route_component_values.render.filters.bool
          - rh_route_component_values.interfaces.combine_filter == rh_route_component_values.render.filters.combine
          - rh_route_component_values.interfaces.int_filter == rh_route_component_values.render.filters.int
          - rh_route_component_values.interfaces.join_filter == rh_route_component_values.render.filters.join
          - rh_route_component_sites.expression_identity.runtime_from_yaml_filter == rh_route_component_values.interfaces.from_yaml_filter
          - rh_route_component_sites.expression_identity.runtime_hash_filter == rh_route_component_values.interfaces.hash_filter
          - rh_route_component_sites.expression_identity.coordinator_chomp == rh_route_component_values.render.file_lookup.rstrip
          - rh_route_component_sites.expression_identity.coordinator_strip == rh_route_component_values.render.file_lookup.lstrip
        fail_msg: "{{ rh_route_component_values.render.messages.include_interface_mismatch }}"
        quiet: "{{ rh_route_component_values.render.assert.quiet }}"

    - name: Bind fixture holder identity and paths
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        rh_route_component_holder: "{{ rh_route_component_fixtures_root.holder }}"
        rh_route_component_paths: "{{ rh_route_component_fixtures_root.paths }}"
        rh_route_component_evidence: "{{ rh_route_component_values.render.lists.empty }}"

    - name: Apply each declared fixture through the projected source component
      ansible.builtin.include_tasks:
        file: "{{ rh_route_component_controls_dir ~ rh_route_component_values.render.path.join ~ rh_route_component_values.control_files[rh_route_component_values.render.control_file_keys.apply] }}"
      loop: "{{ rh_route_component_fixtures_root.fixtures }}"
      loop_control:
        loop_var: rh_route_component_fixture
        label: "{{ rh_route_component_fixture[rh_route_component_values.render.fixture_keys.id] }}"
      register: rh_route_component_dispatch
      ignore_errors: "{{ rh_route_component_values.render.include.continue_after_failure }}"

    - name: Record dispatch failures that never produced apply evidence
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        rh_route_component_evidence: "{{ rh_route_component_evidence + [{ rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].id: item.item[rh_route_component_values.render.fixture_keys.id], rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].required: rh_route_component_values.render.evidence.required, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].applicable: rh_route_component_values.render.evidence.applicable, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].executed: rh_route_component_values.render.booleans.false_value, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].dispatch_attempted: rh_route_component_values.render.booleans.true_value, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].predicate_executed: rh_route_component_values.render.booleans.false_value, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].outcome_observed: rh_route_component_values.render.booleans.false_value, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].status: rh_route_component_values.render.evidence.status_blocked, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].failure_class: rh_route_component_values.render.evidence.failure_classes.dispatch, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].source: item.item[rh_route_component_values.render.fixture_keys.source], rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].site: item.item[rh_route_component_values.render.fixture_keys.site], rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].core_leg: rh_route_component_core_leg, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].evidence: (([{ rh_route_component_values.render.failure_cause.generic_key: rh_route_component_values.render.messages.include_file_unspecified, rh_route_component_values.render.failure_cause.exception_key: rh_route_component_values.render.strings.empty }] | map(rh_route_component_values.interfaces.combine_filter, item) | first)[rh_route_component_values.render.failure_cause.exception_key] | string ~ rh_route_component_values.render.failure_cause.pair_separator ~ ([{ rh_route_component_values.render.failure_cause.generic_key: rh_route_component_values.render.messages.include_file_unspecified, rh_route_component_values.render.failure_cause.exception_key: rh_route_component_values.render.strings.empty }] | map(rh_route_component_values.interfaces.combine_filter, item) | first)[rh_route_component_values.render.failure_cause.generic_key] | string if (([{ rh_route_component_values.render.failure_cause.generic_key: rh_route_component_values.render.messages.include_file_unspecified, rh_route_component_values.render.failure_cause.exception_key: rh_route_component_values.render.strings.empty }] | map(rh_route_component_values.interfaces.combine_filter, item) | first)[rh_route_component_values.render.failure_cause.exception_key] | string != rh_route_component_values.render.strings.empty) else ([{ rh_route_component_values.render.failure_cause.generic_key: rh_route_component_values.render.messages.include_file_unspecified, rh_route_component_values.render.failure_cause.exception_key: rh_route_component_values.render.strings.empty }] | map(rh_route_component_values.interfaces.combine_filter, item) | first)[rh_route_component_values.render.failure_cause.generic_key]) }] }}"
      loop: "{{ rh_route_component_dispatch.results | default(rh_route_component_values.render.lists.empty) }}"
      when:
        - item is mapping and ([rh_route_component_values.render.observation_keys.failed] | select(rh_route_component_values.render.jinja_tests.contained_in, item) | list | length == rh_route_component_values.render.integers.one) and (item[rh_route_component_values.render.observation_keys.failed] | bool)
        - rh_route_component_evidence | map(attribute=rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].id) | list | select(rh_route_component_values.render.jinja_tests.equalto, item.item[rh_route_component_values.render.fixture_keys.id]) | list | length == rh_route_component_values.render.integers.zero

    - name: Bind execution evidence mapping from declared keys
      action: "{{ rh_route_component_values.interfaces.set_fact_module }}"
      args:
        rh_route_component_report: "{{ { rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].schema_version: rh_route_component_values.render.evidence.schema_version, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].node: rh_route_component_values.render.evidence.node, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].core_leg: rh_route_component_core_leg, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].digest_algorithm: rh_route_component_digest_algorithm, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].candidate_sha256: rh_route_component_values.packet_bindings.candidate_sha256, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].predecessor_sha256: rh_route_component_values.packet_bindings.predecessor_sha256, rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].fixtures: rh_route_component_evidence } }}"

    - name: Write execution evidence to the executor-supplied output path
      action: "{{ rh_route_component_values.interfaces.copy_module }}"
      args:
        dest: "{{ rh_route_component_output_path }}"
        content: "{{ [rh_route_component_report] | map(rh_route_component_values.interfaces.to_json_filter) | first }}"

    - name: Refuse a required fixture whose observed mapping is not the declared expected value
      action: "{{ rh_route_component_values.interfaces.assert_module }}"
      args:
        that:
          - rh_route_component_evidence | selectattr(rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].required, rh_route_component_values.render.jinja_tests.equalto, rh_route_component_values.render.evidence.required) | rejectattr(rh_route_component_values.render.evidence[rh_route_component_values.render.dict_attr_keys.keys_name].status, rh_route_component_values.render.jinja_tests.equalto, rh_route_component_values.render.evidence.status_passed) | list | length == rh_route_component_values.render.integers.zero
        fail_msg: "{{ rh_route_component_values.render.messages.required_fixture_failed }}"
        quiet: "{{ rh_route_component_values.render.assert.quiet }}"
