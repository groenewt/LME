---
# Exact selected task/expression identity for source projection. Selectors are
# unique task names from candidate9b5ba6f9 / predecessor c6ae3aa9. Evaluation
# refuses missing or duplicate hits and refuses whole-file or per-source
# decoded-scalar expression drift. Declared sha256/bytes are coordinator Psych
# measurements. MAIN must re-measure with the same from_yaml path apply uses.
schema_version: 1
node: route_component_expression_sites
digest_algorithm: "sha256"
expression_identity:
  coordinator_loader: "Ruby Psych YAML decode of the selected set_fact or that-item UTF-8 scalar"
  coordinator_chomp: false
  coordinator_strip: false
  coordinator_raw_span: false
  runtime_loader: "ansible.builtin.from_yaml of the extracted one-item task file, then the selected set_fact fact or isolated that-item"
  runtime_hash_filter: "hash"
  runtime_from_yaml_filter: "from_yaml"
  coordinator_runtime_equivalence_proven: false
  main_must_measure_with_runtime_loader: true
  unresolved_measurement_is_main_validation_dependency: true
sources:
