    id: "candidate"
    path: "candidate/testing/remote_harness/tasks/reap_staging.yml.after.partial"
    sha256: "9b5ba6f936cf2411b4dc18cefe2ddc5a221dbba4f3912310f9d257a842cef134"
    bytes: 303440
  predecessor:
