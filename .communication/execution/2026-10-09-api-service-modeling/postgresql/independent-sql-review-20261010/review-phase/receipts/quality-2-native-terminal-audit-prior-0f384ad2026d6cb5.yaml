    head -n 1 tmp/quality-2/coverage-parts/publicsource-paths.txt

    tail -n 1 tmp/quality-2/coverage-parts/publicsource-paths.txt

    yq -r ''.frozen_candidate_validation_members[0].path'' review-output/quality-2/coverage.yaml

    yq -r ''.frozen_candidate_validation_members[-1].path'' review-output/quality-2/coverage.yaml

