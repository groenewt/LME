- command: 'set -e

    OUT=tmp/principal-2

    # denominator counts from declared YAML

    yq ''.members | length'' input-manifest.yaml > "$OUT/manifest-member-count.txt"

    yq ''[.members[].path] | map(select(startswith("packet/publicsource/"))) | length''
