    yq ''[.members[].path] | map(select(startswith("packet/frozen/"))) | length''
    input-manifest.yaml > "$OUT/frozen-count.txt"

    yq ''[.members[].path] | map(select(test("^packet/[^/]+\\.yaml$"))) | length''
    input-manifest.yaml > "$OUT/packet-root-yaml-count.txt"

    yq ''{source_manifest_sha256, member_count: (.members|length)}'' input-manifest.yaml
    > "$OUT/manifest-head.yaml"

    # identities

    yq ''{union_rows, prior_rows, current_rows, file_count: (.files|length)}'' packet/public-source-identities.yaml
    > "$OUT/identities-meta.yaml"

    # frozen map members

    yq ''{actors, regular_files, bytes, member_count: (.members|length)}'' frozen-map/manifest.yaml
    > "$OUT/frozen-map-meta.yaml"

    printf ''manifest members: ''; cat "$OUT/manifest-member-count.txt"

    printf ''publicsource: ''; cat "$OUT/publicsource-count.txt"

    printf ''frozen: ''; cat "$OUT/frozen-count.txt"

    printf ''packet-root yaml: ''; cat "$OUT/packet-root-yaml-count.txt"

    echo ''--- identities ---''; cat "$OUT/identities-meta.yaml"

    echo ''--- frozen-map ---''; cat "$OUT/frozen-map-meta.yaml"

    '
