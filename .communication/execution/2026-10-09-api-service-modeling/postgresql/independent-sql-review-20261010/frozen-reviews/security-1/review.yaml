    source_byte_end: 24220
    v18_source_packet_path: packet/publicsource/version18/src/backend/catalog/system_functions.sql
    v18_source_line: 804
    v18_source_byte_start: 24755
    grammar_v18: packet/publicsource/version18/src/backend/parser/gram.y
    grammar_v18_line_start: 8011
    grammar_v18_line_end: 8086
    grammar_v17: packet/publicsource/version17/src/backend/parser/gram.y
    grammar_v17_line_start: 7910
    grammar_v17_line_end: 7985
    grant_sgml: packet/publicsource/version18/doc/src/sgml/ref/grant.sgml
    grant_sgml_line_start: 100
    grant_sgml_line_end: 102
    catalog: packet/publicsource/version17/src/include/catalog/pg_auth_members.h
    catalog_line_start: 30
    catalog_line_end: 39
    field_keys: packet/frozen/candidate/values.yaml
  observed: >-
    Independently sliced GRANT pg_read_all_settings TO pg_monitor; at v17
    bytes 24179-24220 and v18 bytes 24755-24796. grants.yaml emits
    object_kind ROLE, object_kind_explicit false, privileges empty,
    grant_option false. declared_values.field_keys.grant has grant_option
    only. pg_auth_members has admin_option, inherit_option, set_option,
    grantor. gram.y GrantRoleStmt on both pins has WITH grant_role_opt_list
    and GRANTED BY. grant.sgml synopsis names WITH ADMIN|INHERIT|SET
    OPTION|TRUE|FALSE.
  expected_behavior: >-
    Role-membership contracts should retain GrantRoleStmt options and
    pg_auth_members columns from declared YAML keys, or those fields must
    be declared excluded from emission.
  uncertainty: >-
    No admitted SQL instance uses WITH ADMIN/INHERIT/SET or GRANTED BY.
    Default membership option values at GRANT execution were not observed
    in a live database.
- id: security_definer_absent_from_grant_schema
  severity: high
  status: open
  required: true
  applicable: true
  executed: true
  evidence:
    v17_dblink: packet/publicsource/version17/contrib/dblink/dblink--1.2.sql
    v18_dblink: packet/publicsource/version18/contrib/dblink/dblink--1.2.sql
    dblink_line_start: 18
    dblink_line_end: 32
    grants_yaml: packet/frozen/candidate/grants.yaml
    grants_yaml_line_start: 144
    grants_yaml_line_end: 174
    field_keys: packet/frozen/candidate/values.yaml
    security_definer_sql_file_count: 2
  observed: >-
    dblink_connect_u is LANGUAGE C SECURITY DEFINER and then
    REVOKE ALL ... FROM public. Independently sliced the v17 REVOKE at
    bytes 973-1032; grants.yaml keeps grantee spelling public and has no
    security_definer field. field_keys.grant has no definer/invoker atom.
    Grep found SECURITY DEFINER only in the two dblink--1.2.sql files.
  expected_behavior: >-
    Auth modeling of a REVOKE that exists to constrain a SECURITY DEFINER
    routine must retain the definer property or declare it out of the
    grant schema. Treating the REVOKE as an ordinary privilege row hides
    the privilege-bypass shape.
  uncertainty: >-
    Runtime restriction of non-superuser non-password dblink connections
    was not executed. C-language body of dblink_connect is not an admitted
    packet member.
