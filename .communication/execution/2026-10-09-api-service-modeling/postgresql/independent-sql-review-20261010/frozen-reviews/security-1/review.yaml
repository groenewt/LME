- id: grant_role_membership_options_unemitted
  severity: high
  status: open
  required: true
  applicable: true
  executed: true
  evidence:
    grants_yaml: packet/frozen/candidate/grants.yaml
    grants_yaml_line_start: 3456
    grants_yaml_line_end: 3502
    source_packet_path: packet/publicsource/version17/src/backend/catalog/system_functions.sql
    source_line_start: 784
    source_line_end: 788
