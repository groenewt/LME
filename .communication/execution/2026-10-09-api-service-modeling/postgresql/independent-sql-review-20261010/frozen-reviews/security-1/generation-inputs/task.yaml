task:
- Independently review the assigned focus using the unchanged approved SQL packet
  and exact frozen-map reports. Verify claims against original source/candidate bytes,
  trace YAML values through reusable Jinja, and report evidence-backed defects with
  severity, expected behavior, exact packet-relative spans and uncertainty.
- Read actual packet content; preserve full 1143-source union and all 71 frozen candidate/validation
  files as the accounting denominator. Mark every member you did not examine as unexamined;
  do not infer complete semantic review from file hashes or metadata.
- Return a complete review with findings and per-requirement status; preserve every
  declared source denominator, unexamined member and open semantic gap. Frozen maps
  are navigation aids and fallible claims, not acceptance evidence. Do not patch the
  candidate or read peer reviews before discourse.
- Create YAML reports only, with values sourced from declared YAML; reusable Jinja
  only if genuinely needed. No Python/Ruby/Perl/custom generator programs or executable
  YAML scalars, even for read-only offsets or metadata. Use installed read-only tools
  and j2 where needed. Actual command transcripts may be quoted as evidence, never
  executable automation. No invented controls or test execution. Use scoped Read/Grep/Glob
  and installed read-only tools under normal review.
- The frozen candidate contains historical absolute paths. Treat them strictly as
  provenance metadata. Bind content reads to the packet-relative counterpart or mark
  unavailable. Never follow parent, global skill, private, sibling, old session/cache/log
  or host paths.
- You are not alone. Preserve every other actor and all immutable input/configuration
  files. Own only your review-output directory and new tmp.
- No source fetch, web, MCP, root, SSH, live database, dependency install, commits,
  permission changes, or heavy extraction is assigned. Return when the complete independent
  review, actual execution evidence and honest coverage accounting are saved.
- Installed yq can parse and validate your YAML reports. Validate all four outputs
  before returning; quote colon-bearing prose and indent multiline output under YAML
  block scalars. No Python/Ruby/Perl or custom checker even for metadata/YAML validation.
- Never follow Cursor agent-tools overflow/cache links outside this workspace. Redirect
  large installed-tool output into your own tmp and Read it there in bounded portions;
  use exact input-manifest paths and treat missing optional filenames as missing evidence,
  never source discovery permission.
