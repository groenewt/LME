schema_version: 1
actor:
  id: testing-2
  phase: review
  focus: Independent render/source/hash checks and mutation control strength
evidence_law: |
  Executed command output is separate from reasoning. Native author or native-validation success is not this review's execution. Unexecuted required work remains unexecuted. A contained Python version probe is not review execution.
renderer_present:
  path: /usr/bin/j2
  exists: true
  version: j2cli 0.3.12b0, Jinja2 3.1.6
yq_present:
  path: /usr/bin/yq
  version: yq 3.4.3
no_custom_helpers_written: true
no_source_patches: true
no_python_ruby_perl_review_execution: true
no_network_root_ssh_db_commits: true
unqualified_failed_attempt:
- id: python3_import_yaml_version_probe
  required: false
  applicable: false
  executed: false
  status: failed
  command: |
    yq '.cases | length' packet/frozen/candidate/observations/scalar_fixtures.yaml
    plus later python3 -c importing yaml to print its version
  evidence: |
    Prior shell included python3 -c importing yaml and was contained/interrupted.
    Not claimed as review execution. Later counts used yq and grep. Tool versions used yq --version and j2 --version.
