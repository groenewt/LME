    line_start: 101
    line_end: 106
  - path: packet/native-validation-summary.yaml
    line_start: 3
    line_end: 9
  - path: packet/native-validation-summary.yaml
    line_start: 110
    line_end: 114
  expected_behavior: >-
    Author exit 0, byte_matches_returned, and semantic_matches_returned stay
    native claims. Independent review records them without transferring SQL
    semantic acceptance.
  actual: >-
    native-validation-summary.yaml sets semantic_matches_returned true on all
    19 render_controls while not_executed still lists Independent review of
    this frozen edition, Full PostgreSQL semantic graph acceptance, Live SQL,
    and Canonical ontology integration. This actor did not rerender j2.
  uncertainty: Native render was not re-executed here.
