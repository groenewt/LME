    line_start: 5
    line_end: 5
  - path: packet/frozen/candidate/handback.j2
    line_start: 13
    line_end: 14
  expected_behavior: >-
    If actual-controls.yaml concatenates observation checks, unexecuted_checks,
    and negative_fixtures, passed_count is either derived from that list or
    labeled as the observation-subset count only.
  actual: >-
    Template copies executed_control_observation.passed_count (48). Independent
    grep of actual-controls.yaml found 65 dash-id rows (62 checks plus 3
    malformed_input_files), executed true 51, executed false 11. Three
    negative_ fixtures are executed true and status passed
    (pg_control_is_not_sql_catalog, sqlstar_glob_empty,
    create_assertion_unsupported). Handback actual_controls_passed is the same
    48. malformed_input_files rows omit executed, status, and evidence.
