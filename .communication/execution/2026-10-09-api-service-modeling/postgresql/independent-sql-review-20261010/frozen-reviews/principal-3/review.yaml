findings:
- id: membership_tokens_are_class_sets_not_pg_pins
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  uncertainty: operator_nomenclature
  evidence:
    sources:
    - packet/frozen/candidate/values.yaml:118-125
    - packet/frozen/validation/source-set-reconciliation.yaml:10-18
    - packet/frozen/candidate/observations/sourceidentities.yaml:12234-12236
    - packet/frozen/candidate/observations/sourceidentities.yaml:17472-17477
    expected_behavior: |-
      If prior/current mean PostgreSQL 17 versus 18, prior_rows would equal version17 file count 564 and current_rows would equal version18 file count 579.
    observed: |-
      Independently counted v17 files 564 with prior_token 529 and current_token 315; v18 files 579 with prior_token 544 and current_token 315; only_prior 513, only_current 70, both 560. v18-only pg_logicalinspect is prior_public_generation. pgupgrade.sgml in both pins is only current_candidate. Tokens partition by source_class, not pin.
- id: matches_prior_true_including_pin_exclusive_and_only_current
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  uncertainty: operator_semantics of matches_prior_source_identity
  evidence:
    sources:
    - packet/public-source-identities.yaml:4904-4917
    - packet/public-source-identities.yaml:12222-12251
    - packet/frozen/candidate/observations/sourceidentities.yaml:17463-17477
    expected_behavior: |-
      A file absent from the other pin, or whose denominator_membership is only current_candidate, would not claim a prior-generation identity match unless a distinct prior digest were bound.
    observed: |-
      identity_observation has matches_prior_source_identity true on all 1143 rows and false on 0. pg_logicalinspect--1.0.sql is v18-only, membership only prior_public_generation, and prior_identity_sha256 equals the current sha256 e75f3bd0e747a519b6e3c7a3edd6f3cceed9681048907b9dd1da75c4a0bc2b4f. clusterdb.sgml and pgupgrade.sgml are only current_candidate with the same self-copy pattern. Cross-pin pgupgrade.sgml sha256 values differ (aeae3463584bb78a1c915a330343ad34deac7e68f5fc0631f2f2c7eaa178e81f versus 068b695f2ce70b323081c1716f0f4d5d491524d93687a099e8c4e4f6d36574cb).
- id: emitted_sourceidentities_drops_lineage_match_atoms
