      Version comparison for this surface should include extension membership, upgrade-script sets, default_version, and byte identity of shared source_path files, not only selected catalog/keyword/production/errcode set_diffs and count atoms.
    observed: |-
      All 564 v17 source_paths exist in v18. Fifteen v18-only source_paths are 14 extension SQL files plus pg_logicalinspect.control. Shared paths: 402 identical sha256, 162 differing. deltas.yaml has no extension, default_version, pgupgrade, or source_path set_diff. expected_counts has supported_extension_controls 59 versus 60 and no extension_sql 170 versus 184. versioncomparison.yaml Grep found no pg_logicalinspect, default_version, amcheck, or pgupgrade atoms.
