    - packet/frozen/candidate/coverage.yaml:31-34
    expected_behavior: |-
      A git checkout alias for the admitted union would not name a single pin commit while the other pin declares a different commit, or would mark that inequality as unresolved.
    observed: |-
      git_checkout_postgres.head is 083ac033419f690758508e08c1736089384bbee8, equal to pins.17.commit and not equal to pins.18.commit 724edf9bde9d356724ad384a2e196edc3c9f80f7. The note says alias does not erase lineage; the head still cannot represent both pins.
- id: versioncomparison_omits_extension_membership_and_byte_identity
  severity: high
  required: true
