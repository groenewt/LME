findings:
- id: P1-ARCH-01
  severity: high
  required: true
  applicable: true
  executed: true
  status: passed
  expected_behavior: Jinja inventories must consume declared YAML observations through reusable macros rather than invent source parses, and must not be treated as proof that observations match the 1143 admitted files.
  evidence: |-
    packet/frozen/candidate/compose-context.j2 lines 1-11 include observation YAML text. Grep of packet/frozen/candidate/*.j2 for publicsource returned no matches. Native-validation-summary.yaml observation_kind says independent reviewers must assess semantics separately.
  uncertainty: Observation production quality versus 1122 unread publicsource members remains unproven.
- id: P1-ARCH-02
  severity: high
  required: true
  applicable: true
  executed: false
  status: unexecuted
  expected_behavior: Observations feeding Jinja are produced from declared YAML plus reusable Jinja, or marked unexecuted extraction.
  evidence: |-
    packet/frozen/candidate/observations/catalog_fields.yaml meta.observation_method is installed-perl-one-off-parse. packet/frozen/candidate/observations/grants.yaml meta.method is statement scan. values.yaml failed_provenance names rejected Python helpers that are not input-manifest members. No extractor body was read because none is a packet member.
  uncertainty: Whether perl or statement-scan YAML is an admitted declared YAML source is an open operator question.
- id: P1-ARCH-03
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Label grant_contract_count binds grant_observation.versions[ver].contract_count, which is a distinct declared atom from grant_count.
  evidence: |-
    packet/frozen/candidate/values.yaml declared_values.grant_version_counts lists contract_count, grant_count, and revoke_count. packet/frozen/candidate/sqlvalues.j2 line 52 emits grant_contract_count from grant_observation.versions[ver].grant_count. Emitted sqlvalues.yaml has grant_contract_count 120 and 130. packet/frozen/candidate/grants.yaml has contract_count 242 and 263. packet/frozen/candidate/citation-checks.j2 line 10 correctly binds contract_count and citation-checks.yaml emits 242 and 263.
  uncertainty: Remaining grant contract rows were not semantically reviewed.
- id: P1-ARCH-04
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: A field named grant_line_count_rg is an observed rg count, or the name is not used.
  evidence: |-
    packet/frozen/candidate/catalogs.j2 line 49 emits expected_counts[ver].information_schema_grants. catalogs.yaml grant_line_count_rg is 63 and 63. uniqueness.yaml information_schema_grant_contracts is 63. views.yaml information_schema grant_count is 63. No rg command was executed in this review.
  uncertainty: Whether 63 matches an rg of GRANT lines in information_schema.sql was not independently counted from source.
- id: P1-ARCH-05
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Admission uniqueness is against identity_observation packet_path values. Filesystem existence and public-source-identities set equality are separate proofs and must not be implied by a vacuous all_admitted.
  evidence: |-
    packet/frozen/candidate/identity-admission.j2 lines 12-13 set files to identity_observation.files when use_admitted_identities is true and skip the missing-from-admitted loop. all_admitted is then (missing length)==0, which stays true. identity-admission.yaml clean_admitted_identities evidence contains unique=True all_admitted=True using Python boolean stringification. executed_controls.yaml emitted_identities_exist_in_packet evidence identity_missing_fs=0 is not an identity-admission.j2 output field. emission_schema.comments.identity_admission already says this is not filesystem existence.
  uncertainty: Whether identity_missing_fs was computed against packet files in the freeze remains unexecuted here.
- id: P1-ARCH-06
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Citation products re-slice admitted packet bytes, or citation_slice_matches_statement remains an observation claim that is not treated as independent proof. emission_schema.comments.citation_checks names keyword docs among spanned citations.
  evidence: |-
    citation-checks.j2 copies grant_observation contracts and stored sql_feature and limit spans. It emits keyword_doc_row_count only; keyword_doc_observation rows are not emitted. citation-checks.yaml versions 17 and 18 have keyword_doc_row_count 1695. executed_controls.yaml citation_spans_grant_features_limits claims checked=2041 failures=0. This review independently sliced two grants, one feature, one keyword, and one fused limits span, not 2041.
  uncertainty: Remaining citation rows unexamined.
- id: P1-ARCH-07
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: One limits.sgml table row maps to one item and one upper_limit.
  evidence: |-
    packet/frozen/candidate/observations/limits.yaml lines 15-24 concatenate number of databases and relations per database into one item and one upper_limit spanning lines 31-44 / bytes 750-1161. Independent dd of version17 limits.sgml bytes 750-411 bytes contains two SGML rows. The concatenated item is copied into packet/frozen/validation/citation-checks.yaml lines 7216-7221. Version18 limits.sgml lines 31-44 has the same two-row structure and observations/limits.yaml line 148 repeats the concatenated item.
  uncertainty: Other limit rows were not fully re-sliced.
- id: P1-ARCH-08
  severity: high
