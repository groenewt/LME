schema_version: 1
actor:
  id: principal-1
  phase: review
  focus: Architecture and producer/consumer dependencies
  model: cursor-grok-4.6-xhigh
packet_binding:
  approved_source_manifest_sha256: a0e5a7c532fd078b420aa4a0dd8794376de130845b4383ef5c388dca8c58db07
  frozen_map_manifest_sha256: d2e845a2fc95c95ffbe701a5d4182694ed057ac3e3a237362a87adfc5517b115
  requirements: packet/review-requirements.yaml
  source_identities: packet/public-source-identities.yaml
  native_validation: packet/native-validation-summary.yaml
  input_root: packet
  derived_input_root: frozen-map
  input_manifest_members: 1274
  public_source_union_declared: 1143
  frozen_candidate_validation_files: 71
  packet_wrapper_files: 3
  frozen_map_files: 57
status_tokens:
  passed: passed
  failed: failed
  blocked: blocked
  unexecuted: unexecuted
  not_applicable: not_applicable
severity_vocabulary:
  declared_in_packet: false
  status: unexecuted
  evidence: packet/review-requirements.yaml required_outputs asks for severity. packet/frozen/candidate/values.yaml declared_values.status_tokens has no severity atoms. Labels high, medium, and low below are this review's impact ranking, not packet YAML.
maps_treatment:
  role: fallible navigation
  acceptance: false
  independently_rechecked_against_packet_bytes: true
  unread_map_claims_are_not_findings: true
architecture_summary:
  admitted_public_sources_are_not_jinja_inputs: true
  producer_of_inventories: frozen observation YAML plus packet/frozen/candidate/values.yaml
  composer: packet/frozen/candidate/compose-context.j2
  renderer_declared: /usr/bin/j2
  this_session_compose_or_render: false
  hash_manifests_replay_observed_digests: true
  files_not_hashed_at_render_time: true
  native_byte_match_is_not_semantic_proof: true
producer_consumer_stages:
- id: public_source_admission
  producers:
  - packet/public-source-identities.yaml
  - packet/frozen/candidate/observations/sourceidentities.yaml
  declared_union_rows: 1143
  observed_identity_packet_path_rows: 1143
  public_identities_source_class_count: 0
  note: Public identity document has no source_class. Class is added in identity_observation. Emitted sourceidentities.yaml drops matches_prior_source_identity and still emits pins.historical_root.
- id: observation_transcription
  compose_parts: packet/frozen/candidate/observations/render_context.yaml
  observation_methods_claimed:
  - catalog_fields.yaml uses installed-perl-one-off-parse
  - grants.yaml uses statement scan of admitted SQL
  - hash_digests.yaml uses sha256sum and wc -c transcribed into YAML
  extractor_bodies_in_this_packet: false
  not_in_compose_parts:
  - packet/frozen/candidate/observations/j2_context.yaml
  - packet/frozen/candidate/observations/output_hashes.yaml
  - packet/frozen/candidate/observations/malformed_doubled_quote.yaml
- id: compose
  template: packet/frozen/candidate/compose-context.j2
  path_skip_first: true
  skip_index_hardcoded: 1
  indent_filter_uses_integer_width: true
- id: jinja_projection
  macros: packet/frozen/candidate/macros.j2
  templates_importing_macros: 19
  smoke_j2_does_not_import_macros: true
  unsupported_observation_j2_references: 0
  publicsource_j2_references: 0
- id: hash_and_admission_boundary
  hash_observation_declared_members: 1177
  native_validation_immutable_members: 1185
  this_input_manifest_members: 1274
  missing_immutable_input_locators:
  - packet/repair-requirements.yaml
  - packet-manifest.yaml
  task_yaml_frozen_bytes: 3134
  this_workspace_task_yaml_bytes: 3732
independent_samples:
