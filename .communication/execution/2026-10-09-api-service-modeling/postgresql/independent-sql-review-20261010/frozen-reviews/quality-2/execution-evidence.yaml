schema_version: 1
actor:
  id: quality-2
  phase: review
  focus: Scalar encoding and generated value fidelity
required_applicable_executed_status_evidence: recorded_separately
this_reviewer_did_not:
- patch frozen candidate or source
- write executable helpers or executable YAML scalars
- run /usr/bin/j2 rerender
- invoke Python, Ruby, Perl, or custom scripts for report counts or YAML checks
- follow historical absolute paths
- read sibling actor outputs, parent/global skills, old sessions, Cursor external output caches, or private content
- read tmp/cursor-agent-logs-1000
- activate a database, install dependencies, use network, or commit
