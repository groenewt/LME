  review.yaml findings are text-span comparisons plus installed yq type inspection of admitted packet files. Native exit 0, 32/32 fixture claims, 67/67 scalar_cases_passed, and uniqueness keyword_duplicates 0 do not transfer acceptance. Keyword identity collapse is evidenced by kwlist.h versus grammar.yaml line-numbered rows and by yq types of those emitted rows, not by a new renderer run.
