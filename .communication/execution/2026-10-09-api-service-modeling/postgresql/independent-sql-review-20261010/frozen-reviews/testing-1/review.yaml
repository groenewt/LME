- Native render/hash success
- Filesystem or source-count completeness
- Previous storage review or SQL author approval
- Frozen-map claims
- Native semantic_matches_returned
this_actor_did_not:
- patch candidate or source
- write executable helpers or custom Python/Ruby/Perl/scripts
- follow absolute historical locators
- read peer reviews, parent/global/private/old-session inputs
- run live SQL, bison, initdb, CPG, CREATE EXTENSION, network, root, SSH, commits, or dependency installation
- rerender /usr/bin/j2 inventories
