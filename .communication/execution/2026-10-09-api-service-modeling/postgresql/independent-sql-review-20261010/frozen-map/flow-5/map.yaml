data_flow:
- packet SQL CREATE VIEW names and GRANT/REVOKE statements are transcribed into observations/views.yaml and observations/grants.yaml
- compose-context.j2 includes those YAML files as view_observation and grant_observation
- catalogs.j2 copies view names, counts, alter_owner_present, and grant contracts into catalogs.yaml
- validation.j2 compares observation counts to expected_counts and sets status passed/failed
- coverage.j2 emits the same view counts as observed_counts
- versioncomparison.j2 emits expected_counts side by side and delta_observation.deltas; deltas.yaml has no information_schema or system_views id
