findings:
- id: view_count_is_not_view_semantics
  severity: high
  expected: version comparison and validation distinguish CREATE VIEW identity and defining SQL
  observed: validation information_schema_inventory and system_views_count pass on counts; versioncomparison expected_count_delta shows information_schema_create_view 65/65 while unified diff of the SQL files is 126 lines
  uncertainty: remaining unread view bodies may contain further pin differences
- id: owner_clause_check_does_not_prove_oid_10
  severity: high
  expected: owner evidence bound to pg_authid.dat oid 10 and to SQL-created object owner semantics
  observed: validation.j2 status uses only alter_owner_present == false; evidence concatenates declared bootstrap_oid_suffix
  source_evidence:
  - packet/frozen/candidate/validation.j2 lines 64 and 144
  - packet/frozen/candidate/values.yaml evidence_fragments.bootstrap_oid_suffix
  - packet/publicsource/version17/src/include/catalog/pg_authid.dat lines 18-26
- id: initdb_renames_bootstrap_superuser
  severity: medium
  expected: emitted owner identity distinguish catalog rolname POSTGRES from initdb-replaced login name
  observed: owner_permission_rule states Bootstrap creates them as oid 10 POSTGRES; pg_authid.dat says initdb will replace that name
  unresolved: live initdb owner identity unexecuted
- id: information_schema_not_in_namespace_dat
  severity: medium
  expected: schema ownership of information_schema recorded as SQL CREATE SCHEMA at initdb, not BKI row
  observed: pg_namespace.dat has pg_catalog, pg_toast, public only
- id: documented_not_equal_granted
  severity: medium
  expected: grant model name objects without PUBLIC SELECT
  observed: transforms view and sql_parts table have CREATE and no GRANT; five _pg_ helper views have no GRANT
- id: views_yaml_grant_subset
  severity: medium
  expected: observation grant_count either equal full GRANT/REVOKE set or labeled as SELECT-only subset
  observed: system_views grant_count 3/5 versus 24/32 GRANT or REVOKE lines in SQL; catalogs.yaml emits the larger grant_observation set
- id: grant_line_count_rg_is_expected_count
  severity: medium
  expected: field grant_line_count_rg be an executed ripgrep observation
  observed: catalogs.j2 emits expected_counts[ver].information_schema_grants under that label
  source_evidence: packet/frozen/candidate/catalogs.j2 line 49
- id: row_owner_filters_unmodeled
  severity: medium
  expected: information-schema ownership include pg_has_role(relowner) predicates inside view SQL
  observed: candidate view observation stores names and GRANT objects, not defining-query owner filters
  example_span: packet/publicsource/version18/src/backend/catalog/information_schema.sql lines 2795-2797
- id: pg_views_exposes_viewowner
  severity: low
  expected: system view pg_views.viewowner mapped if owner ontology is claimed complete
  observed: packet/publicsource/version17/src/backend/catalog/system_views.sql lines 118-125 selects pg_get_userbyid(C.relowner) AS viewowner; not an emitted owner contract
- id: infoschema_sgml_absent
  severity: low
  expected: documented_view_count cite an admitted documentation member or the naming prefix contract
  observed: extraction_contracts.information_schema.helper_view_name_prefix is _pg_; no information_schema SGML file is an input-manifest member
- id: sql_features_table_fill_unexecuted
  severity: medium
  expected: information_schema.sql_features contents bound to sql_features.txt via executed initdb or an equivalent admitted transcription
  observed: CREATE TABLE sql_features plus comment Will be filled with external data by initdb; sql_features.txt members were hashed only, not semantically read; initdb unexecuted
- id: native_success_is_not_semantic_acceptance
  severity: high
  expected: required, applicable, executed, status, evidence recorded separately from author/native exit 0
  observed: packet/native-validation-summary.yaml render_controls report exit_code 0; review-requirements.yaml no_acceptance_transfer includes Author exit 0 and Native render/hash success
uncertainties:
- unread CREATE VIEW bodies in both information_schema.sql and system_views.sql files
- whether PUBLIC default EXECUTE remains on information_schema helper functions (no GRANT or REVOKE of those functions in the SQL files)
- runtime relowner of SQL-created views after initdb name replacement
- pg_subscription column GRANT text versus catalogs.yaml grant_observation parse of that multiline statement
- sql_features.txt row identity versus sql_features table
work_still_required:
- Read remaining view-defining SQL in the four catalog SQL files
- Independent grant_observation versus grep -b contract equality for every system_views GRANT/REVOKE
- Operator or principal review of owner ontology: oid 10 versus initdb-replaced name versus SQL CREATE owner
- Do not treat this map as semantic closure of the 1143-file union
