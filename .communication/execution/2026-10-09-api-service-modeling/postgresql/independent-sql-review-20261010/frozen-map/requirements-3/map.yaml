- id: keyword_identity_yaml11_implicit_collapse
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected: |
    SQL keyword name and token strings from PG_KEYWORD arguments remain strings through observation YAML load and yaml_scalar emission. Declared implicit_yaml_tokens and string_false_not_typed_true require string "false" to stay distinct from typed false.
  evidence: |
    packet/publicsource/version17/src/include/parser/kwlist.h line 316 is PG_KEYWORD("on", ON, RESERVED_KEYWORD, AS_LABEL). packet/frozen/candidate/observations/keywords.yaml lines 1447-1451 stores unquoted name: on and token: ON. packet/frozen/candidate/grammar.yaml lines 5077-5081 emits name: true and token: true with line: 316. kwlist.h line 311 is PG_KEYWORD("off", OFF, ...); grammar.yaml lines 5042-5046 emits name: false and token: false with line: 311. kwlist.h line 296 is PG_KEYWORD("no", NO, ...); grammar.yaml lines 4937-4941 emits name: false and token: false with line: 296. kwlist.h line 517 is PG_KEYWORD("yes", YES_P, ...); grammar.yaml lines 6484-6488 emits name: true and token: "YES_P" with line: 517. kwlist.h line 171 is PG_KEYWORD("false", FALSE_P, ...); grammar.yaml lines 4062-4066 emits name: false and token: "FALSE_P". kwlist.h line 305 is PG_KEYWORD("null", NULL_P, ...); grammar.yaml lines 5000-5004 emits name: null. The same collapse is present on pin 18: grammar.yaml lines 11569-11573 (off at source line 313) and 11604-11608 (on at source line 318). Mechanism: compose-context.j2 includes observation YAML text; /usr/bin/j2 -f yaml loads YAML 1.1 implicit booleans/null; macros.j2 yaml_scalar emits yaml_grammar.true_token/false_token/null_token. Control string_false_not_typed_true only cites scalar_fixtures, not keyword inventory. uniqueness.yaml keyword_duplicates: 0 is not measured on emitted grammar.yaml names.
  uncertainty: |
    This mapper compared source text, observation text, and emitted text. Independent yaml.safe_load of the composed render context was not executed here. YAML 1.1 implicit-boolean behaviour for unquoted on/off/yes/no/true/false/null is the unresolved load semantics that the emitted grammar.yaml already exhibits.
