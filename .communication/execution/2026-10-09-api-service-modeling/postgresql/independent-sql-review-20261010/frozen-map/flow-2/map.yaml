findings:
- id: command_inventory_omits_syntax_and_behavior
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: commands.j2 and field_keys.command emit identity metadata only. Sampled synopses and description sections exist in admitted command sgml and are not fields of commands.yaml.
  expected_behavior: A map of SQL command syntax, statements and referenced behavior would retain synopsis alternatives, parameters, and documented effects, or would declare those fields inapplicable with a sourced reason.
  uncertainty: Whether the declared commands product was intentionally identity-only. emission_schema.comments.commands says command reference from allfiles, not synopsis capture.
- id: versioncomparison_omits_command_syntax_diff
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: versioncomparison.yaml sql_command_entities is 183/183. MERGE, INSERT, CREATE TABLE, VACUUM, ALTER TABLE sgml files differ by sha256 and sampled synopsis text while command purpose strings stay identical.
  expected_behavior: Full set diffs of command syntax across REL_17_11 and REL_18_6, not count-only equality.
  uncertainty: Remaining 350 sql_command_refs files were not compared, so additional silent syntax diffs may exist.
- id: stmt_unresolved_zero_is_not_command_mapping
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: uniqueness_observation.stmt_unresolved is 0 and command_missing is empty, while 183 command refs do not equal 124 stmt alternatives. TransactionStmtLegacy is outside stmt. CreateAssertionStmt has no command refentry. BEGIN/END are command refs but parse via toplevel_stmt.
  expected_behavior: Statement-to-command mapping would be an explicit relation, not inferred from unresolved=0.
  uncertainty: Complete production-to-refentry relation was not enumerated for all 124 alternatives.
- id: empty_alternative_token_mismatch
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: extraction_contracts.gram_production.empty_alternative_token is '%empty' and grammar.yaml lists "%empty". Both admitted gram.y stmt empty alternatives are /*EMPTY*/. grep %empty count is 0 in both gram.y files.
  expected_behavior: Emitted empty-alternative token would match admitted source text or a declared alias table.
  uncertainty: Whether '%empty' was intended as bison canonicalization rather than a source slice.
- id: create_assertion_behavior_not_joined
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: CreateAssertionStmt reports FEATURE_NOT_SUPPORTED. F521 Assertions is NO in sql_features.txt line 289 both pins. sqlfeatures.yaml keeps feature_id F521 without name or YES/NO. No CREATE ASSERTION command refentry. v18 adds parser_errposition; unsupported.yaml is unversioned and cites line 6337.
  expected_behavior: Unsupported statement behavior, SQL-feature support flag, and command-doc presence/absence would be one joined record per pin.
  uncertainty: Other unsupported.yaml rows were not pin-checked.
- id: command_citations_absent
  required: true
  applicable: true
  executed: true
  status: failed
  severity: unresolved
  evidence: citation-checks.j2 iterates grant, sql_features, and limits only. Command synopsis spans have no citation product.
  expected_behavior: Command syntax claims would carry one-based line and zero-based exclusive byte spans into admitted sgml.
  uncertainty: None for omission of the emitter; remaining command files unexamined.
- id: grant_command_ref_versus_grant_contracts
  required: true
  applicable: true
  executed: true
  status: blocked
  severity: unresolved
  evidence: grant.sgml documents GRANT syntax. grants.yaml scans admitted SQL files. Those are different surfaces.
  expected_behavior: Privilege-syntax from grant.sgml would be distinct from emitted GRANT/REVOKE contracts, or an explicit join would be declared.
  uncertainty: Flow-7 owns grant semantics; this actor did not read grants.yaml contracts beyond the header.
- id: remaining_command_docs_unexamined
  required: true
  applicable: true
  executed: false
  status: unexecuted
  severity: unresolved
  evidence: sql_command_refs declared union count is 366. This review read spans in 16 command sgml files plus both allfiles.sgml. File hashes and 183 counts do not examine the other command documents. coverage.yaml source_union_roster lists all 1143 publicsource members with default_examination unexamined.
  expected_behavior: Every sql_command_refs member would be span-examined or explicitly unexamined.
  uncertainty: Unexamined command docs may contain further syntax, aliases, or pin diffs.
