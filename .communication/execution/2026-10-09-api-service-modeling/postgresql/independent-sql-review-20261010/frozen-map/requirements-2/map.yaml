  actual: smoke.j2 emits yaml_grammar is defined and catalog_observation is defined.
    Jinja stringifies those tests as Python True/False, not yaml_grammar tokens. Template
    does not import macros.j2. Labels catalog_count_18, proc_18, kw_18 hardcode pin
    18 in the label name while values use declared_values.pin_order[1].
