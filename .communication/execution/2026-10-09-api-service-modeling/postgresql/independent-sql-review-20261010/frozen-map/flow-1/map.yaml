findings:
  - id: emitted_keyword_identities_collapsed_by_yaml_implicit_tokens
    required: true
    applicable: true
    executed: true
    status: failed
    expected_behavior: extraction_contracts.pg_keyword.argument_order name and token remain the source strings from PG_KEYWORD; yaml_scalar comment in emission_schema.comments.scalar says strings stay strings; declared_values.implicit_yaml_tokens lists true, false, null, yes, no, on, off, NO among others
    evidence: "observations/keywords.yaml stores unquoted name/token scalars (examples version17 lines 722, 1347, 1392, 1422, 1447, 2172, 2452). grammar.j2 keyword_row uses macros.j2 yaml_scalar. After YAML 1.1 load, no/off/false become boolean false and on/yes/true become boolean true; token NO/OFF/ON likewise. grammar.yaml therefore emits distinct SQL keywords as indistinguishable YAML booleans. Count of name: true in grammar.yaml = 6; name: false = 6. Source strings yes versus true versus on are not recoverable from emitted name for those rows. Native validation byte_matches_returned true and keyword_unique_* passed do not inspect these string identities."
    uncertainty: uniqueness_observation.keyword_duplicates 0 is consistent with counting distinct source strings before YAML load, not with uniqueness of emitted grammar.yaml name fields after load. Whether compose-context j2 used a YAML 1.1 or 1.2 loader was not re-executed here; the already-emitted grammar.yaml is the evidence.
    source_spans:
