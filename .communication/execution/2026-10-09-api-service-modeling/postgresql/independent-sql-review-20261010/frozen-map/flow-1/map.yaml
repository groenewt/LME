    evidence: grep of both packet gram.y files found no %empty. stmt empty alternative is the comment /*EMPTY*/ at version17 line 1125 and version18 line 1116. grammar.j2 line 23 appends extraction_contracts.gram_production.empty_alternative_token after observed stmt_alternatives. grammar.yaml lists "%empty" at line 3056. This is a declared-token substitution, not a source spelling.
    uncertainty: PostgreSQL bison accepts /*EMPTY*/ comments; %empty is a bison-3 explicit empty marker. Which spelling an ontology should store is not declared beyond the extraction_contract token. bison_yacc_compile remains unexecuted.
    source_spans:
