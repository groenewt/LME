data_flow:
  summary: Admitted public sources are not read by Jinja. Frozen observation YAML
    is the producer input. /usr/bin/j2 compose-context.j2 nests those YAML texts under
    declared context keys with values.yaml merged at root. Inventory, citation, hash,
    admission and control templates project observation fields through macros.j2 and
    emission_schema labels. Hash manifests replay declared digest rows; they do not
    hash files at render time. Native byte-match success and source counts do not
    prove observation semantics against the 1143-file union.
  stages:
  - id: public_source_admission
    producers:
    - packet/public-source-identities.yaml
    - packet/frozen/candidate/observations/sourceidentities.yaml
    declared_union_rows: 1143
    observed_identity_packet_path_rows: 1143
    input_manifest_members: 1217
    publicsource_rows: 1143
    note: identity_observation.files carry version, commit, tree, source_path, packet_path,
      source_class, git_blob_sha, sha256, bytes, lines, packet_root, denominator_membership,
      matches_prior_source_identity, and historical_local_verified_source. The last
      two are provenance. This map did not follow historical locators.
  - id: observation_transcription
    producers:
    - packet/frozen/candidate/observations/render_context.yaml
    compose_parts:
    - context_key: root_merge
      path: candidate/values.yaml
    - context_key: catalog_observation
      path: candidate/observations/catalog_fields.yaml
    - context_key: grammar_observation
      path: candidate/observations/grammar_names.yaml
    - context_key: keyword_observation
      path: candidate/observations/keywords.yaml
    - context_key: errcode_observation
      path: candidate/observations/errcodes.yaml
    - context_key: command_observation
      path: candidate/observations/commands.yaml
    - context_key: dat_observation
      path: candidate/observations/dat_records.yaml
    - context_key: view_observation
      path: candidate/observations/views.yaml
    - context_key: extension_observation
      path: candidate/observations/extensions.yaml
    - context_key: delta_observation
      path: candidate/observations/deltas.yaml
    - context_key: identity_observation
      path: candidate/observations/sourceidentities.yaml
    - context_key: uniqueness_observation
      path: candidate/observations/uniqueness.yaml
    - context_key: unsupported_observation
      path: candidate/observations/unsupported.yaml
    - context_key: source_class_observation
      path: candidate/observations/source_classes.yaml
    - context_key: grant_observation
      path: candidate/observations/grants.yaml
    - context_key: sql_feature_observation
      path: candidate/observations/sql_features.yaml
    - context_key: keyword_doc_observation
      path: candidate/observations/keyword_docs.yaml
    - context_key: limit_observation
      path: candidate/observations/limits.yaml
    - context_key: hash_observation
      path: candidate/observations/hash_verification.yaml
    - context_key: scalar_fixtures
      path: candidate/observations/scalar_fixtures.yaml
    - context_key: executed_control_observation
      path: candidate/observations/executed_controls.yaml
    - context_key: output_hash_observation
      path: candidate/observations/hash_digests.yaml
    - context_key: unresolved_gap_observation
      path: candidate/observations/unresolved_gaps.yaml
    not_in_compose_parts:
    - candidate/observations/j2_context.yaml
    - candidate/observations/output_hashes.yaml
    - candidate/observations/malformed_doubled_quote.yaml
    observation_methods_claimed_in_meta:
    - catalog_fields.yaml: installed-perl-one-off-parse of CATALOG bodies and adjacent
        SGML structfield/type pairs
    - grants.yaml: statement scan of admitted SQL files with in-statement comment
        skipping
    - hash_digests.yaml: installed sha256sum and wc -c transcribed into declared YAML
    - executed_controls.yaml: installed python3-yaml plus /usr/bin/j2 outputs plus
        admitted packet file slices
    - render_context.yaml: /usr/bin/j2 include of sourced YAML text
    extractor_bodies_in_this_packet: false
    failed_provenance_declared: candidate inventories are j2-rendered from declared
      YAML plus observations; Python helpers including PreserveDumper and the hash-manifest
      YAML string builder are retained only as rejected-generation evidence
  - id: compose
    template: packet/frozen/candidate/compose-context.j2
    template_lines: 1-11
    renderer_declared: /usr/bin/j2
    path_skip_first: true
    effect: candidate/values.yaml becomes values.yaml include; remaining parts emit
      context_key then indented included YAML
    this_session_compose_executed: false
    reason: task forbids heavy extraction; native-validation-summary already claims
      a 6063432-byte composed context. Independent map did not regenerate that context.
  - id: jinja_projection
    macros: packet/frozen/candidate/macros.j2
    yaml_grammar: packet/frozen/candidate/values.yaml
    emission_schema: packet/frozen/candidate/values.yaml
    templates_and_observation_consumers:
    - template: sourceidentities.j2
      consumes: identity_observation, declared_values.pins
      emitted: packet/frozen/candidate/sourceidentities.yaml
      dropped_from_identity_files:
      - matches_prior_source_identity
      - historical_local_verified_source
      - historical_local_verified_source_is_read_authorization
      still_emits_pin_historical_root: true
      with_historical_root_is_read_authorization: false
    - template: source-set-reconciliation.j2
      consumes: identity_observation, hash_observation, source_class_observation,
        grant_observation, unexecuted_checks, declared_values.source_denominator
      emitted: packet/frozen/validation/source-set-reconciliation.yaml
      git_hash_cross_keys_emitted:
      - packet_path
      - git_hash_object
      - declared_git_blob
      - match
      dropped_from_hash_observation_cross_check:
      - hashlib_git_blob
      - git_hash_object_exit
    - template: citation-checks.j2
      consumes: grant_observation, sql_feature_observation, limit_observation, keyword_doc_observation
      emitted: packet/frozen/validation/citation-checks.yaml
      indexing_notes_emitted:
        byte_span_indexing: zero_based_start_inclusive_end_exclusive
        line_indexing: one_based_inclusive
      grant_projection: declared_values.citation_grant
      sql_feature_emitted_fields:
      - feature_id
      - source_path
      - line_start
      - byte_start
      - byte_end
      sql_feature_dropped:
      - line_end
      - packet_path
      limit_emitted_fields:
      - item
      - line_start
      - line_end
      - byte_start
      - byte_end
      limit_dropped:
      - source_path
      - packet_path
      - upper_limit
      - comment
      keyword_docs: count only; keyword_doc_observation.keywords rows are not emitted
        as citations
    - template: output-hashes.j2
      consumes: output_hash_observation, declared_values.hash_boundary
      emitted: packet/frozen/candidate/observations/output_hashes.yaml
      member_selection: macros.emit_included_hash_rows
      roster_count: 71
      excluded_count: 6
      observed_digest_rows: 65
      included_member_count_claimed: 65
      matched_member_count_claimed: 65
      hashes_replayed_from_observation: true
      files_not_hashed_at_render_time: true
    - template: handback.j2
      consumes: hash_observation, executed_control_observation, grant_observation,
        output_hash_observation, unresolved_gap_observation, declared_values.hash_boundary
      emitted: packet/frozen/candidate/handback.yaml
      cyclic_exclusion: candidate/handback.yaml is excluded from digest membership
    - template: grants.j2
      consumes: grant_observation
      emitted: packet/frozen/candidate/grants.yaml
      contract_keys: declared_values.field_keys.grant
      dropped_from_grant_contracts:
      - packet_path
      - version
      - parse_status
      - citation_slice_matches_statement
    - template: sqlvalues.j2
      consumes: dat_observation, errcode_observation, extension_observation, sql_feature_observation,
        grant_observation
      emitted: packet/frozen/candidate/sqlvalues.yaml
      grant_contract_count_binding: grant_observation.versions[ver].grant_count
      emitted_grant_contract_count:
        '17': 120
        '18': 130
      grant_observation_contract_count:
        '17': 242
        '18': 263
    - template: catalogs.j2
      consumes: catalog_observation, view_observation, uniqueness_observation, grant_observation,
        expected_counts
      emitted: packet/frozen/candidate/catalogs.yaml
      grant_line_count_rg_binding: expected_counts[ver].information_schema_grants
      emitted_grant_line_count_rg:
        '17': 63
        '18': 63
    - template: coverage.j2
      consumes: expected_counts, grammar_observation, keyword_observation, errcode_observation,
        command_observation, catalog_observation, view_observation, extension_observation,
        dat_observation, identity_observation, source_class_observation
      emitted: packet/frozen/candidate/coverage.yaml
    - template: validation.j2
      consumes: catalog_observation, grammar_observation, keyword_observation, errcode_observation,
        command_observation, view_observation, dat_observation, grant_observation,
        uniqueness_observation, sql_feature_observation, identity_observation, hash_observation,
        source_class_observation, expected_counts, negative_fixtures, unexecuted_checks
      emitted: packet/frozen/candidate/validation.yaml
      packet_manifest_check_uses: hash_observation.packet_manifest.declared_members
      declared_members_in_hash_observation: 1177
      this_input_manifest_members: 1217
      pass_condition: mismatches list length equals 0
    - template: identity-admission.j2
      consumes: identity_observation, admission_subjects
      emitted: packet/frozen/candidate/identity-admission.yaml
      filesystem_existence_not_checked: true
    - template: keyworddocs.j2
      consumes: keyword_doc_observation
      emitted: packet/frozen/candidate/keyworddocs.yaml
      file_keys: declared_values.keyword_doc_file
      keyword_keys: declared_values.keyword_doc_row
      keyword_row_dropped:
      - packet_path
      - line_end
      - version
    - template: limits.j2
      consumes: limit_observation
      emitted: packet/frozen/candidate/limits.yaml
    - template: sqlfeatures.j2
      consumes: sql_feature_observation
      emitted: packet/frozen/candidate/sqlfeatures.yaml
    - template: commands.j2
      consumes: command_observation, expected_counts, extraction_contracts.sql_command_ref
      emitted: packet/frozen/candidate/commands.yaml
    - template: grammar.j2
      consumes: grammar_observation, keyword_observation, extraction_contracts.gram_production
      emitted: packet/frozen/candidate/grammar.yaml
      unimplemented_section: emit_note create_assertion only
      unsupported_observation_consumed: false
    - template: versioncomparison.j2
      consumes: delta_observation, catalog_observation, expected_counts, declared_values.pins
      emitted: packet/frozen/candidate/versioncomparison.yaml
    - template: scalar.j2
      consumes: scalar_fixtures
      emitted: packet/frozen/candidate/scalar-roundtrip.yaml
    - template: actual-controls.j2
      consumes: executed_control_observation, unexecuted_checks, negative_fixtures,
        scalar_fixtures.malformed_controls
      emitted: packet/frozen/candidate/actual-controls.yaml
      copied_to: packet/frozen/validation/actual-controls.yaml
      independent_cmp_exit: 0
    - template: smoke.j2
      consumes: catalog_observation, dat_observation, keyword_observation, yaml_grammar
      emitted_product_in_roster: template only; no frozen smoke.yaml member
    dead_after_compose:
    - context_key: unsupported_observation
      path: candidate/observations/unsupported.yaml
      j2_references: 0
  - id: hash_and_citation_boundary
    hash_boundary_excluded:
    - path: candidate/handback.yaml
      applicable: false
      reason: handback emits output_hashes; including its own digest is cyclic
    - path: candidate/observations/output_hashes.yaml
      applicable: false
      reason: hash manifest is outside its own member set
    - path: candidate/observations/hash_digests.yaml
      applicable: false
      reason: declared digest observations feed the hash manifest; a self-digest is
        cyclic
    - path: validation/native-repair-request.yaml
      applicable: false
    - path: validation/native-repair-request2.yaml
      applicable: false
    - path: validation/native-repair-request3.yaml
      applicable: false
    immutable_inputs_in_hash_digests:
    - path: packet/public-source-identities.yaml
      bytes: 1105821
      sha256: 6b329ece6eb4559fabdefbc3517a92fdd8ccd7112ae72552c6cf2f5757923b99
      present_in_this_packet: true
      independent_sha256_match: true
    - path: packet/repair-requirements.yaml
      bytes: 3046
      present_in_this_packet: false
      this_packet_counterpart: packet/review-requirements.yaml
      counterpart_bytes: 4095
    - path: packet-manifest.yaml
      bytes: 192720
      present_in_this_packet: false
      this_packet_counterpart: input-manifest.yaml
      counterpart_bytes: 198591
    - path: task.yaml
      frozen_bytes: 3134
      this_workspace_bytes: 2515
      independent_sha256: 012535ce3909d1cdd963e81c151fbb7c231fa2442d164df093d1fe620042737c
      frozen_claimed_sha256: 8dc80de8cb9476c9579ce5f6429dc51f14e106507b6a33556c9c98d055d7c7cf
    git_hash_object_cross_check_declared_rows: 5
    independent_git_hash_object_matches: 5
    remaining_unhashed_sources_for_this_map: 1138
