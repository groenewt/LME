findings:
- id: observations_are_not_rederived_by_jinja
  severity: high
  required: true
  applicable: true
  executed: true
  status: passed
  expected_behavior: Jinja should emit declared YAML observations through reusable
    macros, not invent source parses.
  evidence: compose-context.j2 includes observation YAML text; citation-checks.j2
    and grants.j2 copy observation spans; output-hashes.j2 copies observed_digests.
    No template reads packet/publicsource files.
  uncertainty: Observation production quality versus the 1143 sources remains unproven
    except for the samples in independent_citation_samples.
- id: citation_template_does_not_reslice_sources
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Citation products should either re-slice admitted packet bytes
    or keep citation_slice_matches_statement as an observation claim that is not treated
    as independent proof.
  evidence: citation-checks.j2 yaml_list_map of grant_observation contracts; sql_feature
    and limit loops emit stored spans. executed_controls.yaml citation_spans_grant_features_limits
    claims checked=2041 failures=0. This map independently sliced 4 spans, not 2041.
  uncertainty: Remaining citation rows unexamined.
- id: limits_observation_concatenates_two_sgml_rows
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: One limits.sgml row should map to one item and one upper_limit.
  evidence: packet/frozen/candidate/observations/limits.yaml lines 15-24 versus packet/publicsource/version17/doc/src/sgml/limits.sgml
    lines 31-44 and independent bytes 750-1161. The concatenated item is copied into
    packet/frozen/validation/citation-checks.yaml lines 7216-7220.
  uncertainty: Other limit rows were not fully re-sliced. Version 18 limits.sgml was
    not read.
- id: sqlvalues_grant_contract_count_uses_grant_count
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Label grant_contract_count should bind grant_observation.versions[ver].contract_count.
  evidence: packet/frozen/candidate/sqlvalues.j2 line 52 binds grant_count. Emitted
    sqlvalues.yaml grant_contract_count 120/130 versus grants.yaml contract_count
    242/263. citation-checks.j2 line 10 correctly binds contract_count.
- id: catalogs_grant_line_count_rg_uses_expected_counts
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: A field named grant_line_count_rg should be an observed rg count
    or should not use that name.
  evidence: packet/frozen/candidate/catalogs.j2 line 49 emits expected_counts[ver].information_schema_grants.
    catalogs.yaml grant_line_count_rg 63/63. view_observation also stores grant_count
    63; uniqueness_observation stores information_schema_grant_contracts 63. No rg
    command was executed in this map.
- id: unsupported_observation_unused_by_templates
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Composed observations should be consumed or declared inapplicable.
  evidence: render_context.yaml includes unsupported_observation. Grep of packet/frozen/candidate/*.j2
    found zero unsupported_observation references. grammar.j2 unimplemented section
    emits only the create_assertion note.
- id: citation_checks_omit_keyword_doc_rows
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: emission_schema.comments.citation_checks names keyword docs among
    spanned citations.
  evidence: citation-checks.j2 emits keyword_doc_row_count only. keyword_doc_observation
    has 1695 keyword rows for version 17 with byte spans. keyworddocs.j2 emits those
    rows; citation-checks.j2 does not.
- id: hash_observation_packet_count_not_this_input_manifest
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Packet hash accounting for this review must bind this input-manifest
    1217-member set, or record a different denominator explicitly without treating
    empty mismatches as proof of this packet.
  evidence: hash_verification.yaml declared_packet_files 1177 and declared_members
    1177. native-repair-request2.yaml scope says 1,177-file packet. native-validation-summary.yaml
    immutable_members 1185. This input-manifest.yaml has 1217 path members. validation.j2
    packet_manifest_member_hashes passes when mismatches length is 0 and emits declared_members
    from hash_observation.
- id: frozen_immutable_inputs_not_in_this_packet
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: Hash-chain locators emitted by output-hashes.j2 and handback.j2
    must exist as packet-relative members or be marked unavailable.
  evidence: hash_digests.yaml immutable_inputs list packet/repair-requirements.yaml,
    packet-manifest.yaml, and task.yaml at 3134 bytes. Those first two paths are absent
    from input-manifest.yaml. This task.yaml is 2515 bytes with independent sha256
    012535ce3909d1cdd963e81c151fbb7c231fa2442d164df093d1fe620042737c, not 8dc80de8cb9476c9579ce5f6429dc51f14e106507b6a33556c9c98d055d7c7cf.
- id: git_blob_cross_check_is_five_files
  severity: high
  required: true
  applicable: true
  executed: true
  status: blocked
  expected_behavior: Source identity hash completeness requires every admitted packet_path
    or an explicit unexecuted remainder.
  evidence: hash_verification.yaml git_hash_object_cross_check has 5 rows. Independent
    git hash-object of those five packet paths matched. Remaining 1138 admitted sources
    were not hashed or semantically read in this map. Native source_git_blob_and_sha256
    passed is not this map's execution.
- id: observation_extractors_absent
  severity: high
  required: true
  applicable: true
  executed: false
  status: unexecuted
  expected_behavior: Independent regeneration of observations from packet/publicsource
    through declared YAML/Jinja, or an explicit unexecuted gap.
  evidence: catalog_fields.yaml claims installed-perl-one-off-parse. grants.yaml claims
    statement scan. values.yaml failed_provenance names rejected Python helpers not
    present as packet members. No extractor body was read because none is an input-manifest
    member.
- id: native_success_is_not_semantic_proof
  severity: high
  required: true
  applicable: true
  executed: true
  status: passed
  expected_behavior: review-requirements.yaml no_acceptance_transfer forbids transferring
    author exit 0, native render/hash success, filesystem or source-count completeness,
    or previous SQL author approval into semantic acceptance.
  evidence: native-validation-summary.yaml render_controls all report exit_code 0,
    byte_matches_returned true, semantic_matches_returned true. coverage.yaml identity_file_count
    1143 equals union_rows 1143. Those facts were recorded, not treated as completed
    semantic review of 1143 sources.
- id: sourceidentities_projection_drops_prior_match_flag
  severity: low
  required: true
  applicable: true
  executed: true
  status: failed
  expected_behavior: If matches_prior_source_identity is an identity field, emit it
    or declare it out of the identity product.
  evidence: observations/sourceidentities.yaml files include matches_prior_source_identity.
    sourceidentities.j2 does not emit it. Grep of candidate/sourceidentities.yaml
    found no matches_prior_source_identity.
- id: two_grant_projections_of_one_observation
  severity: medium
  required: true
  applicable: true
  executed: true
  status: passed
  expected_behavior: Distinct declared key lists may project the same observation,
    but consumers must not treat grants.yaml as a complete citation record.
  evidence: field_keys.grant omits packet_path and citation_slice_matches_statement.
    citation_grant includes them. grants.yaml first contract has source_path and spans
    without packet_path. citation-checks.yaml first grant citation includes packet_path
    and citation_slice_matches_statement.
unresolved_gaps:
- id: test_only_extension_controls_absent_from_admitted_packet
  status: open
  source: packet/frozen/candidate/observations/unresolved_gaps.yaml
  independently_verified_absence: unexecuted
  note: test_only_not_in_admitted_packet lists src/test/modules/*.control paths. Those
