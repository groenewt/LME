findings:
- id: control_file_atoms_not_emitted
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/publicsource/version18/contrib/pg_logicalinspect/pg_logicalinspect.control:1-5
    - packet/publicsource/version17/contrib/citext/citext.control:1-6
    - packet/publicsource/version18/contrib/citext/citext.control:1-6
    - packet/frozen/candidate/observations/extensions.yaml:1-8
    - packet/frozen/candidate/sqlvalues.j2:41-48
    - packet/frozen/candidate/values.yaml:188-208
    - packet/frozen/candidate/values.yaml:1129-1187
    observed: Admitted .control files declare comment, default_version, module_pathname,
      relocatable, and optionally requires, trusted, schema, superuser. extension_observation
      classification is path-prefix. sqlvalues.j2 emits path lists and counts only.
      values.yaml field_keys has no extension control keys. extraction_contracts has
      no control parser.
    expected_behavior: Extension identities should retain control-file atoms that
      CREATE EXTENSION and ALTER EXTENSION SET SCHEMA/UPDATE consume, with YAML-declared
      field keys and reusable emission.
    uncertainty: Whether a later ontology intends only path membership. Packet sources
      still contain the atoms. Cannot confirm runtime interpretation without CREATE
      EXTENSION.
- id: upgrade_script_graph_not_modeled
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/publicsource/version18/contrib/citext/citext--1.6--1.7.sql:1-4
    - packet/publicsource/version18/contrib/citext/citext--1.7--1.8.sql:1-4
    - packet/publicsource/version18/contrib/amcheck/amcheck--1.4--1.5.sql:1-4
    - packet/publicsource/version18/doc/src/sgml/ref/alter_extension.sgml:26-85
    - packet/frozen/candidate/observations/grants.yaml:9731-9731
    - packet/frozen/candidate/observations/grants.yaml:9848-9848
    observed: Filename pattern name--from--to.sql is the upgrade graph. Candidate
      counts extension_sql (170/184) and extracts GRANT/REVOKE. It does not emit from/to
      versions, install versus upgrade distinction, or default_version-to-script
      correspondence. citext default_version moves 1.6 to 1.8 across two upgrade
      scripts; no citext--1.8.sql install script is in the packet (install base remains
      citext--1.4.sql).
    expected_behavior: Upgrade paths required by ALTER EXTENSION UPDATE TO should
      be modeled as version graphs bound to default_version and available --version.sql
      install scripts.
    uncertainty: PostgreSQL can install default_version by applying an older install
      script plus upgrades. That chain was not executed. Remaining 350 extension_sql
      bodies were not read.
- id: versioncomparison_omits_extension_set_diffs
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/frozen/candidate/versioncomparison.yaml:99-109
    - packet/frozen/candidate/observations/deltas.yaml:1-266
    - packet/frozen/candidate/versioncomparison.j2:24-46
    observed: expected_count_delta records supported_extension_controls 59 versus
      60 and extension_sql counts only via coverage/sqlvalues. deltas.yaml contains
      catalog .dat, keyword, production_name, and errcode set_diffs. No extension
      control path, default_version, requires, or upgrade-script set_diff. Fourteen
      v18-only SQL files and pg_logicalinspect are therefore not in versioncomparison
      deltas.
    expected_behavior: Version comparison for this surface should include the actual
      extension membership and script-set differences, not only count atoms.
    uncertainty: Count equality is true (59/60, 170/184). Counts do not prove which
      members changed.
- id: test_only_and_missing_contrib_not_in_packet
  severity: medium
  required: true
  applicable: true
  executed: true
  status: blocked
  evidence:
    sources:
    - packet/frozen/candidate/observations/unresolved_gaps.yaml:2-13
    - packet/frozen/candidate/observations/extensions.yaml:70-124
    - packet/frozen/candidate/sqlvalues.yaml:180758-180816
    observed: Candidate emits 46/47 test_only control paths and contrib dirs without
      control. Those files are not admitted packet members. sqlvalues.yaml still
      lists test_only_extensions as if they were observed names. Absence cannot be
      confirmed from packet membership alone.
    expected_behavior: Non-admitted paths should remain provenance/gap records, not
      interchangeable with admitted source lists.
    uncertainty: Prior observation may have listed those paths from a fuller tree.
      This packet cannot verify their contents.
- id: extension_sql_semantics_beyond_grant_unmodeled
  severity: high
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/publicsource/version18/contrib/pg_logicalinspect/pg_logicalinspect--1.0.sql:1-43
    - packet/frozen/candidate/observations/grants.yaml:5130-5205
    - packet/frozen/candidate/observations/grants.yaml:1-6
    observed: pg_logicalinspect--1.0.sql creates functions, uses MODULE_PATHNAME,
      REVOKE/GRANT EXECUTE, and a \echo CREATE EXTENSION guard. Grant observation
      records the four GRANT/REVOKE lines and marks parse_status parsed. CREATE FUNCTION
      signatures, LANGUAGE C, PARALLEL SAFE, and the guard are not extension inventory
      fields. unparsed_count is 0 for GRANT/REVOKE scan only.
    expected_behavior: Extension SQL models should retain created objects and versioned
      replacements, not only privilege contracts.
    uncertainty: Other unread SQL files may contain types, operators, ALTER EXTENSION
      ADD/DROP, or additional GRANT forms.
- id: pg_extension_syscache_not_in_catalog_observation
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/publicsource/version17/src/include/catalog/pg_extension.h:29-66
    - packet/publicsource/version18/src/include/catalog/pg_extension.h:29-60
    - packet/frozen/candidate/observations/catalog_fields.yaml:2337-2424
    observed: CATALOG() fields match across pins. v17 uses MAKE_SYSCACHE(ZEXTENSIONOID)
      with EXTENSIONOID alias. v18 uses MAKE_SYSCACHE(EXTENSIONOID) and MAKE_SYSCACHE(EXTENSIONNAME).
      catalog_fields observation has no MAKE_SYSCACHE keys. versioncomparison catalog
      field diffs would not show this.
    expected_behavior: Catalog header version boundaries that change lookup identity
      should be emitted or recorded as unresolved.
    uncertainty: Semantic effect on SQL catalogs is lookup/cache, not a new pg_extension
      column.
- id: validation_count_pass_is_not_semantic_proof
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/frozen/candidate/validation.yaml:86-91
    - packet/frozen/candidate/validation.yaml:704-709
    - packet/review-requirements.yaml:101-105
    - packet/native-validation-summary.yaml:2-4
    observed: admitted_extension_control_count_17/18 status passed on admitted_controls
      equals supported_expected. extension_create_extension_runtime is unexecuted.
      Native summary says independent reviewers must assess semantics separately.
      no_acceptance_transfer includes author exit 0, native render/hash success,
      filesystem or source-count completeness.
    expected_behavior: required/applicable/executed/status/evidence remain separate;
      count match cannot close upgrade or control-field semantics.
    uncertainty: none on the count check itself; the check is narrower than the focus.
- id: unused_extension_row_macro
  severity: low
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/frozen/candidate/macros.j2:180-182
    observed: extension_row exists and is unused by other candidate templates. Dead
      declaration relative to emitted inventories.
    expected_behavior: Reusable macros should emit declared extension rows or be absent.
    uncertainty: Macro may have been reserved for a later field schema that was never
      declared.
- id: command_and_grammar_surface_partially_observed_not_bound_to_scripts
  severity: medium
  required: true
  applicable: true
  executed: true
  status: blocked
  evidence:
    sources:
    - packet/publicsource/version18/doc/src/sgml/ref/create_extension.sgml:23-160
    - packet/publicsource/version18/doc/src/sgml/ref/alter_extension.sgml:26-96
    - packet/publicsource/version17/src/backend/parser/gram.y:5111-5188
    - packet/publicsource/version18/src/backend/parser/gram.y:5225-5288
    - packet/publicsource/version18/src/backend/parser/gram.y:5100-5116
    - packet/frozen/candidate/observations/unsupported.yaml:29-32
    observed: CREATE EXTENSION options SCHEMA, VERSION, CASCADE, IF NOT EXISTS, and
      unsupported FROM exist in gram.y and docs. ALTER EXTENSION UPDATE TO, SET SCHEMA,
      ADD/DROP member objects exist. DROP EXTENSION uses object_type_name EXTENSION,
      not DropExtensionStmt. Parameterless CREATE LANGUAGE is rewritten as CREATE
      EXTENSION in both pins. Candidate command observation stores names/purposes;
      it does not bind these productions to control default_version, requires, relocatable,
      or trusted.
    expected_behavior: Grammar and command docs should be cited against the same extension
      objects the SQL scripts install.
    uncertainty: v17 create/alter/drop_extension.sgml bodies were not read. ALTER/DROP
      sgml hashes match across pins in input-manifest.yaml; CREATE sgml hashes differ.
- id: requires_and_trusted_edges_unemitted
  severity: medium
  required: true
  applicable: true
  executed: true
  status: failed
  evidence:
    sources:
    - packet/publicsource/version18/contrib/earthdistance/earthdistance.control:6-6
    - packet/publicsource/version18/contrib/jsonb_plperl/jsonb_plperl.control:6-7
    - packet/publicsource/version18/src/pl/plpgsql/src/plpgsql.control:5-8
    - packet/publicsource/version18/doc/src/sgml/ref/create_extension.sgml:56-67
    observed: requires lists (ltree,plpython3u), (plperl), (cube), (hstore,plperl)
      exist. trusted and superuser and schema=pg_catalog exist on PL controls. CREATE
      EXTENSION docs describe trusted install by non-superuser with contained objects
      owned by bootstrap superuser. None of these atoms are emitted.
    expected_behavior: Dependency and trust flags should be first-class YAML fields
      sourced from control files.
    uncertainty: Field-scan via Grep covered these keys on admitted controls; unused
      blank lines were not individually reviewed on every control file.
