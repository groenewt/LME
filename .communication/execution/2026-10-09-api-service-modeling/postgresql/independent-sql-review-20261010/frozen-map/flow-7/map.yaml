      namespace_line_start: 22
      namespace_line_end: 24
    observed: applicable_roles unions pg_auth_members with datdba membership of pg_database_owner. public schema nspowner is pg_database_owner with nspacl _null_. Comment says UNION works even if explicit pg_database_owner membership starts to be allowed.
    expected_behavior: Owner-boundary map includes this synthetic membership, which is not a GRANT ROLE statement in grants.yaml.
    uncertainty: Runtime has_role filtering was not executed.
