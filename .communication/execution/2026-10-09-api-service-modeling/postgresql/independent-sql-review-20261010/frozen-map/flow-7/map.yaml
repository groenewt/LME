findings:
  - id: grant_role_membership_not_modeled_as_auth_members
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      packet_path: packet/frozen/candidate/grants.yaml
      line_start: 3456
      line_end: 3502
      source_packet_path: packet/publicsource/version17/src/backend/catalog/system_functions.sql
      source_line_start: 784
      source_line_end: 788
      grammar_packet_path: packet/publicsource/version18/src/backend/parser/gram.y
      grammar_line_start: 8007
      grammar_line_end: 8086
      catalog_packet_path: packet/publicsource/version17/src/include/catalog/pg_auth_members.h
      catalog_line_start: 30
      catalog_line_end: 39
    observed: GRANT pg_read_all_settings TO pg_monitor is emitted as object_kind ROLE, object_kind_explicit false, privileges empty, grant_option false. declared_values.field_keys.grant has grant_option only. pg_auth_members has admin_option, inherit_option, set_option, grantor. gram.y GrantRoleStmt has WITH ADMIN|INHERIT|SET OPTION and GRANTED BY.
    expected_behavior: Role-membership contracts should retain GrantRoleStmt options and pg_auth_members columns, or declare those fields out of emission schema.
    uncertainty: Whether object_kind ROLE is inferred by the absent scanner or written in observation YAML by hand is not provable from packet helper absence.
  - id: alter_owner_present_scoped_away_from_extension_sql
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      declared_rule: packet/frozen/candidate/values.yaml owner_contract.alter_owner_present false
      owner_sql:
        - packet/publicsource/version17/src/pl/plpgsql/src/plpgsql--1.0.sql
        - packet/publicsource/version17/src/pl/plperl/plperl--1.0.sql
        - packet/publicsource/version17/src/pl/tcl/pltcl--1.0.sql
        - packet/publicsource/version18/src/pl/plpgsql/src/plpgsql--1.0.sql
        - packet/publicsource/version18/src/pl/plperl/plperl--1.0.sql
        - packet/publicsource/version18/src/pl/tcl/pltcl--1.0.sql
      plpgsql_line: 18
      plpgsql_text: "ALTER LANGUAGE plpgsql OWNER TO @extowner@"
      untrusted_without_owner_to:
        - packet/publicsource/version18/src/pl/plpython/plpython3u--1.0.sql
        - packet/publicsource/version18/src/pl/plperl/plperlu--1.0.sql
        - packet/publicsource/version18/src/pl/tcl/pltclu--1.0.sql
    observed: "owner_contract.alter_owner_present is false and is documented only for information_schema.sql and system_views.sql. Trusted PL extension SQL contains ALTER LANGUAGE ... OWNER TO @extowner@. Untrusted PL SQL in the examined trio does not. grants.yaml has no OWNER contracts."
    expected_behavior: Owner-boundary mapping for this focus includes extension ALTER OWNER and the trusted versus untrusted split, not only the information_schema/system_views rule.
    uncertainty: "@extowner@ substitution at CREATE EXTENSION was not executed."
  - id: sqlvalues_authid_drops_role_attribute_atoms
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      values_path: packet/frozen/candidate/values.yaml
      dat_optional_field_groups_rolname_only: true
      sqlvalues_path: packet/frozen/candidate/sqlvalues.yaml
      sqlvalues_line_start: 38577
      sqlvalues_line_end: 38602
      dat_path: packet/publicsource/version17/src/include/catalog/pg_authid.dat
      dat_fields_present:
        - rolsuper
        - rolinherit
        - rolcreaterole
        - rolcreatedb
        - rolcanlogin
        - rolreplication
        - rolbypassrls
        - rolconnlimit
        - rolpassword
        - rolvaliduntil
    observed: sqlvalues pg_authid entries emit oid, key, rolname, line_start, line_end. Bootstrap capability flags present in pg_authid.dat are not in field_keys.dat_optional_field_groups for rolname.
    expected_behavior: Role attribute atoms needed for privilege/owner semantics are either emitted from declared YAML field lists or explicitly marked out of sqlvalues scope.
    uncertainty: catalogs.yaml header field inventory still lists rolsuper and related columns; drop is in sqlvalues emission, not catalog header emission.
  - id: pg_authid_version_delta_header_toast_uncompared
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      versioncomparison_path: packet/frozen/candidate/versioncomparison.yaml
      versioncomparison_id: dat_pg_authid.dat
      versioncomparison_only_right:
        - pg_signal_autovacuum_worker/6392
      diff_dat: packet/publicsource/version18/src/include/catalog/pg_authid.dat adds oid 6392 ROLE_PG_SIGNAL_AUTOVACUUM_WORKER
      diff_h: packet/publicsource/version17/src/include/catalog/pg_authid.h has DECLARE_TOAST_WITH_MACRO(pg_authid, 4175, 4176, PgAuthidToastTable, PgAuthidToastIndex); version18 header omits that toast macro
    observed: versioncomparison records the dat rolname/oid set_diff and not the header toast-declaration removal.
    expected_behavior: Role catalog version boundaries include header/toast identity, not only dat rolname keys.
    uncertainty: Toast removal effect on runtime pg_authid storage was not executed.
  - id: default_execute_and_init_privs_unmodeled
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      plpgsql_path: packet/publicsource/version18/src/pl/plpgsql/src/plpgsql--1.0.sql
      plpgsql_line_start: 3
      plpgsql_line_end: 18
      pg_init_privs_path: packet/publicsource/version17/src/include/catalog/pg_init_privs.h
      pg_init_privs_line_start: 18
      pg_init_privs_line_end: 21
      pg_class_path: packet/publicsource/version18/src/include/catalog/pg_class.h
      relowner_line: 50
      relacl_line: 137
    observed: CREATE FUNCTION in plpgsql--1.0.sql has no GRANT/REVOKE. Default PUBLIC EXECUTE is therefore not a grants.yaml contract. pg_init_privs.h states there is no pg_init_privs.dat and initial contents load near end of initdb. relacl default is _null_ with relowner BKI_DEFAULT(POSTGRES).
    expected_behavior: Privilege mapping either models default ACL behavior from catalogs plus CREATE statements or records those defaults as unexecuted/unemitted.
    uncertainty: Live initdb/CREATE EXTENSION path is declared unexecuted in values.yaml unexecuted_checks.
  - id: grant_emission_drops_grantor_behavior_and_packet_path
    severity: open
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      gram_grantstmt_path: packet/publicsource/version18/src/backend/parser/gram.y
      gram_grantstmt_line_start: 7640
      gram_grantstmt_line_end: 7654
      opt_granted_by_line: 8084
      field_keys_grant: packet/frozen/candidate/values.yaml
    observed: GrantStmt has grantor and opt_grant_grant_option. RevokeStmt has behavior and GRANT OPTION FOR. field_keys.grant has no grantor and no drop behavior. Observation packet_path is not copied into grants.yaml.
    expected_behavior: Either emit grantor/behavior/packet_path from declared keys or declare them excluded.
    uncertainty: Admitted SQL grep found no WITH GRANT OPTION, GRANTED BY, or ALTER DEFAULT PRIVILEGES statements, so those grammar forms have no admitted-SQL instances to parse.
  - id: public_versus_PUBLIC_spelling_retained
    severity: informational
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      dblink_path: packet/frozen/candidate/grants.yaml
