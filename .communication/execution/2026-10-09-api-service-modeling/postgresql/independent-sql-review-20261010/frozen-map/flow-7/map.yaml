    observed: Candidate preserves source spelling public and PUBLIC. PostgreSQL folds unquoted identifiers; PUBLIC is the special grantee.
    expected_behavior: Mapping should say whether grantee identity is source spelling or folded role identity.
    uncertainty: No live GRANT execution to observe catalog rolname storage.
  - id: applicable_roles_synthesizes_pg_database_owner
    severity: informational
    status: open
    required: true
    applicable: true
    executed: true
    evidence:
      packet_path: packet/publicsource/version18/src/backend/catalog/information_schema.sql
      line_start: 243
      line_end: 259
