findings:
- id: membership_tokens_are_generation_class_sets_not_pg_version
  severity: high
  status: open
  uncertainty: operator_nomenclature
  evidence:
  - path: packet/frozen/candidate/values.yaml
    line_start: 118
    line_end: 125
  - path: packet/frozen/validation/source-set-reconciliation.yaml
    line_start: 10
    line_end: 18
  - path: packet/frozen/validation/source-set-reconciliation.yaml
    line_start: 94
    line_end: 679
  expected: If prior/current mean PostgreSQL 17 versus 18, prior_rows would equal version17 file count 564 and current_rows would equal version18 file count 579.
  observed: prior 1073 and current 630 partition the 1143 union by source_class, not by pin. only_prior_public_generation includes version18 extension and keyword-doc files. only_current_candidate is the 70 application_command_refs across both pins.
- id: removed_from_prior_still_in_union_and_still_extracted
  severity: high
  status: open
  uncertainty: whether removed_from_prior may describe token absence while files remain admitted and consumed
  evidence:
  - path: packet/frozen/candidate/coverage.yaml
    line_start: 159
    line_end: 164
  - path: packet/frozen/candidate/observations/extensions.yaml
    line_start: 4
    line_end: 8
  - path: packet/frozen/candidate/coverage.yaml
    line_start: 135
    line_end: 157
  expected: A file removed from the current denominator would not remain in the admitted union, or extraction coverage would exclude it with an explicit inapplicability reason.
  observed: 513 only_prior files remain in the 1143 identity union and on disk. coverage.yaml still reports supported_extension_controls 59/60 and extension_sql_present 354. Extension observations list those controls.
- id: matches_prior_source_identity_true_for_only_current_files
  severity: high
  status: open
  uncertainty: operator_semantics of matches_prior_source_identity
  evidence:
  - path: packet/public-source-identities.yaml
    line_start: 4904
    line_end: 4917
  - packet_path: packet/publicsource/version17/doc/src/sgml/ref/clusterdb.sgml
  expected: A file whose denominator_membership is only current_candidate would not match a prior-generation identity, or matches_prior_source_identity would be false.
  observed: All 1143 public-source-identities rows and all 1143 identity_observation rows have matches_prior_source_identity true. For clusterdb.sgml, prior_identity_sha256 equals the current sha256 and membership is only current_candidate.
- id: emitted_sourceidentities_drops_lineage_match_atoms
  severity: medium
  status: open
  evidence:
  - path: packet/frozen/candidate/sourceidentities.j2
    line_start: 23
    line_end: 38
  expected: The identity rule version+commit+path+blob hashes; aliases cannot erase lineage would remain inspectable on the emitted identity inventory, including prior-identity match fields.
  observed: sourceidentities.j2 emits class, blob, sha256, bytes, lines, packet_root, and denominator_membership. It does not emit matches_prior_source_identity, prior_identity_sha256, or prior_identity_git_blob. Those remain only on public-source-identities.yaml and observations/sourceidentities.yaml.
- id: frozen_immutable_inputs_bind_absent_prior_packaging
  severity: high
  status: open
  evidence:
  - path: packet/frozen/candidate/observations/hash_digests.yaml
    line_start: 277
    line_end: 289
  - path: packet/frozen/candidate/handback.yaml
    line_start: 54
    line_end: 69
  expected: Immutable input hashes for this approved packet would name packet/public-source-identities.yaml, packet/review-requirements.yaml, input-manifest.yaml, and this worker task.yaml, and match their current bytes.
  observed: Frozen immutable_inputs cite packet/repair-requirements.yaml, packet-manifest.yaml, and task.yaml sha256 8dc80de8cb9476c9579ce5f6429dc51f14e106507b6a33556c9c98d055d7c7cf bytes 3134. Those two packet files are absent here. Current task.yaml hashes to 7d9592ecaac4ff7c7f8bbd693058bdc42a3aa1cba905877a2a81002a22686c68. Current input-manifest.yaml hashes to 92e769200d5caa581444086be8c92cf33e5a66a34a8c6fee08c0db5435600497. public-source-identities.yaml hash 6b329ece6eb4559fabdefbc3517a92fdd8ccd7112ae72552c6cf2f5757923b99 does match.
- id: packet_member_count_disagreement_1177_1185_1217
  severity: high
  status: open
  evidence:
  - path: packet/frozen/candidate/observations/hash_verification.yaml
    line_start: 1
    line_end: 9
  - path: packet/native-validation-summary.yaml
    line_start: 107
    line_end: 109
  - path: packet/frozen/validation/native-repair-request2.yaml
    line_start: 1
    line_end: 3
  - path: packet/frozen/validation/native-repair-request3.yaml
    line_start: 9
    line_end: 9
  expected: One packet member count would bind the approved input-manifest and on-disk packet.
  observed: hash_verification declared_packet_files 1177; native-repair-request2 scope says immutable 1177-file packet; native-repair-request3 says 1185 immutable hashes match; native-validation-summary immutable_members 1185; this packet has 1217 files and 1217 input-manifest members. Path-set equality holds for 1217 now. The 1177 and 1185 claims are not this packet's member count.
- id: native_validation_summary_labels_output_digests_as_templates
  severity: medium
  status: open
  evidence:
  - path: packet/native-validation-summary.yaml
    line_start: 6
    line_end: 101
  expected: A template field would hash the .j2 file. An output field would hash the rendered YAML.
  observed: native-validation-summary lists template actual-controls.j2 with sha256 8427497c592f6a846a9ecb81645b9de709056139212110757df0199985362150, which is actual-controls.yaml. coverage.j2 is labeled with coverage.yaml digest acf3e25e. output-hashes.j2 is labeled with observations/output_hashes.yaml digest 13c9f4fd. Actual output-hashes.j2 digest is 22cde811693202bddd1dd501721460eceed8dcb7e3bab3d778adf41bcc55553a. This is a citation identity bind, not proof that templates were hashed.
- id: identity_admission_key_is_packet_path_not_composite_rule
  severity: medium
  status: open
  evidence:
  - path: packet/frozen/candidate/sourceidentities.yaml
    line_start: 5
    line_end: 5
  - path: packet/frozen/candidate/identity-admission.j2
    line_start: 17
    line_end: 24
  expected: Uniqueness would follow the declared rule version+commit+path+blob hashes.
  observed: identity-admission.j2 unique/duplicate logic uses packet_path only. In this packet packet_path includes version17 or version18, so the 1143 paths are unique and the composite did not need to be tested. Identical blobs across pins remain two members, which is consistent with version+path identity, not with blob-only identity.
- id: declared_gaps_outside_1143_union
  severity: medium
  status: open
  declared_gap_ids:
  - test_only_extension_controls_absent_from_admitted_packet
  - contrib_dirs_without_control_not_instantiated_in_packet
  evidence:
  - path: packet/frozen/candidate/observations/unresolved_gaps.yaml
    line_start: 1
    line_end: 13
  observed: Independent existence checks found no packet/publicsource/version17/src/test/modules/dummy_index_am/dummy_index_am.control, no packet/publicsource/version18/src/test/modules/test_aio/test_aio.control, and no packet/publicsource/version17/contrib/auth_delay directory. These absences are outside the 1143 union. They do not shrink the admitted union; they also cannot be confirmed from packet membership alone.
- id: source_union_content_semantics_mostly_unexamined
  severity: high
  status: open
  expected: Semantic preservation of the 1143 union would require content examination of each member or an executed per-file hash-and-class control with retrieved content.
  observed: This actor confirmed path-set equality, token counts, class-count totals, and content for 14 publicsource files plus hashes for additional samples. 1129 publicsource members were not content-examined. Author claims of 1143 sha256 matches and git_blob matches were not fully re-executed here. Filesystem count completeness is not semantic review.
- id: handback_and_some_checks_use_declared_counts_as_proof_atoms
  severity: medium
  status: open
  evidence:
  - path: packet/frozen/candidate/handback.j2
    line_start: 7
    line_end: 9
  - path: packet/frozen/candidate/validation.j2
    line_start: 85
    line_end: 93
  expected: Source-union proof would compare observed identity files to declared union and fail if they diverge; packet-manifest proof would hash the current 1217-member input-manifest.
  observed: handback emits declared prior/current/union without identity_observation.files length. validation.j2 source_union_count does compare lengths. packet_manifest_member_hashes uses hash_observation.packet_manifest 1177, not this 1217-member input-manifest.yaml.
no_acceptance_transfer:
- Author exit 0 is not semantic preservation.
- Native render/hash success in packet/native-validation-summary.yaml is not this actor's execution.
- Filesystem or source-count completeness is necessary and was observed for path sets; it does not prove class or lineage semantics for unexamined members.
- Previous storage review or SQL author approval is not used.
unexecuted_for_this_focus:
- Live SQL or database activation
- Full PostgreSQL semantic graph acceptance
- Per-file sha256 and git-blob verification of all 1143 sources
- Per-file source_class verification from content for all 1143 sources
- Bison compile, initdb, CREATE EXTENSION, CPG parse
- Canonical ontology integration
operator_questions:
- id: Q1_membership_token_meaning
  question: Do prior_public_generation and current_candidate mean generation-class membership (the 1073/630/1143 split by source_class observed here), or PostgreSQL pin 17 versus 18 membership, or something else?
  evidence_before_question:
  - packet/frozen/candidate/values.yaml lines 118-125
  - packet/frozen/validation/source-set-reconciliation.yaml lines 10-18 and 94-679
  - independent disk counts version17=564 version18=579
- id: Q2_matches_prior_on_only_current
  question: May matches_prior_source_identity be true when denominator_membership is only current_candidate and prior_identity_sha256 is a copy of the current sha256, as in clusterdb.sgml?
  evidence_before_question:
  - packet/public-source-identities.yaml lines 4904-4917
  - grep count matches_prior_source_identity true equals 1143 with zero false rows
- id: Q3_which_packet_count_is_the_immutable_denominator
  question: For this approved review packet, is the immutable file denominator the 1143-source union plus 71 frozen files (1217 packet files / 1217 input-manifest members), and are the frozen 1177 and 1185 figures bound to a prior packaging layout that is not this packet?
  evidence_before_question:
  - input-manifest.yaml member count 1217
  - find packet -type f count 1217
  - hash_verification.yaml declared_packet_files 1177
  - native-validation-summary.yaml immutable_members 1185
work_still_required:
- Operator answers to Q1, Q2, and Q3 before treating membership or lineage-match fields as closed semantics.
- Independent per-file hash and class verification of the 1129 unexamined publicsource members if semantic closure is required.
- Rebind frozen immutable_input hashes to the files that exist in this packet, or record them as provenance of a different packaging layout.
- Principal review of whether 513 only_prior files may remain extracted while labeled removed_from_prior.
- Do not patch the candidate in this map phase.
