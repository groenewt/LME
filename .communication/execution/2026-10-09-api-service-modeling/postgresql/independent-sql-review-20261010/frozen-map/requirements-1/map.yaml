producer_flow:
- id: public_identity_union
  path: packet/public-source-identities.yaml
  role: Admitted public source identity union. Declared union_rows 1143, prior_rows 1073, current_rows 630.
  fields_present:
  - packet_path
  - version
  - tag
  - commit
  - tree
  - source_path
  - sha256
  - git_blob
  - bytes
  - prior_identity_sha256
  - prior_identity_git_blob
  - matches_prior_source_identity
  - denominator_membership
  - public_origin
  - official_git_origin
  - local_verified_source
  note: local_verified_source values are historical absolute paths and were not followed.
- id: identity_observation
  path: packet/frozen/candidate/observations/sourceidentities.yaml
  role: Render-context identity_observation.files producer. Adds source_class, lines, packet_root; renames git_blob to git_blob_sha; keeps matches_prior_source_identity and historical_local_verified_source as provenance-only.
  composed_by: packet/frozen/candidate/observations/render_context.yaml
  compose_span:
    path: packet/frozen/candidate/observations/render_context.yaml
    line_start: 39
    line_end: 40
- id: source_class_observation
  path: packet/frozen/candidate/observations/source_classes.yaml
  role: Class counts and unclassified list for the 1143 union. unclassified is empty. counts_union sums to 1143.
- id: hash_observation
  path: packet/frozen/candidate/observations/hash_verification.yaml
  role: Declares packet_manifest 1177 members matched and source identity 1143 sha256/git_blob/bytes mismatches empty. Membership token counts match declared denominator.
- id: declared_values
  path: packet/frozen/candidate/values.yaml
  role: YAML atoms for pins, source_denominator tokens, required_source_classes, emission_schema labels, admission_subjects, expected_counts, unexecuted_checks, hash_boundary.
- id: compose_and_macros
  templates:
  - packet/frozen/candidate/compose-context.j2
  - packet/frozen/candidate/macros.j2
  role: Include declared YAML parts into one render context. macros.j2 emits labels from emission_schema and yaml_grammar.
jinja_transforms:
- template: packet/frozen/candidate/sourceidentities.j2
  emitted: packet/frozen/candidate/sourceidentities.yaml
  inputs:
  - identity_observation.files
  - identity_observation.meta.union_rows
  - declared_values.pins
  - declared_values.git_checkout_postgres
  drops_from_observation:
  - matches_prior_source_identity
  - historical_local_verified_source
  - historical_local_verified_source_is_read_authorization
  union_rows_source: identity_observation.meta.union_rows
  not_files_length: true
- template: packet/frozen/candidate/coverage.j2
  emitted: packet/frozen/candidate/coverage.yaml
  identity_file_count_source: identity_observation.files length
  union_rows_source: declared_values.source_denominator.union
  note: Observed identity count and declared union are emitted as separate fields. That is stronger than handback, which emits only declared union.
- template: packet/frozen/candidate/source-set-reconciliation.j2
  emitted: packet/frozen/validation/source-set-reconciliation.yaml
  membership_partition:
    has_p: declared_values.source_denominator.prior_membership_token in f.denominator_membership
    has_c: declared_values.source_denominator.current_membership_token in f.denominator_membership
    both: has_p and has_c
    only_prior: has_p and not has_c
    only_current: has_c and not has_p
  emitted_lists:
  - only_prior_public_generation
  - only_current_candidate
  set_equality_fields_compare_list_lengths_to_declared_counts: true
- template: packet/frozen/candidate/identity-admission.j2
  emitted: packet/frozen/candidate/identity-admission.yaml
  uniqueness_key: packet_path
  comment_span:
    path: packet/frozen/candidate/identity-admission.j2
    line_start: 1
    line_end: 2
  comment_text: Jinja admission uniqueness and membership against identity_observation packet_path set. Not filesystem existence and not constructed Python lists.
  malformed_subjects_from: packet/frozen/candidate/values.yaml admission_subjects
- template: packet/frozen/candidate/handback.j2
  emitted: packet/frozen/candidate/handback.yaml
  source_union_rows_source: declared_values.source_denominator.union
  does_not_emit_identity_observation_files_length: true
- template: packet/frozen/candidate/validation.j2
  emitted: packet/frozen/candidate/validation.yaml
  source_union_count_compares: identity_observation.files length versus declared_values.source_denominator.union
  packet_manifest_check_uses: hash_observation.packet_manifest.mismatches length
  source_git_blob_check_uses: hash_observation.source_identities.sha256_git_blob_bytes_mismatches length
- template: packet/frozen/candidate/output-hashes.j2
  emitted: packet/frozen/candidate/observations/output_hashes.yaml
  roster: packet/frozen/candidate/observations/hash_digests.yaml
  exclusions: declared_values.hash_boundary.excluded
  excluded_frozen_files: 6
  included_member_count_emitted: 65
- template: packet/frozen/candidate/actual-controls.j2
  emitted: packet/frozen/candidate/actual-controls.yaml
  copies_executed_control_observation_checks: true
