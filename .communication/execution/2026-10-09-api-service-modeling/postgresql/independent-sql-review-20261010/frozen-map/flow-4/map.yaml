focus_boundary:
  in_focus:
  - builtin pg_proc.dat records and pg_proc.h columns
  - builtin pg_type.dat records, array_type_oid genbki directive, pg_type.h columns
  - builtin pg_operator.dat/h, pg_cast.dat/h, pg_aggregate.dat/h
  - operator-class support pg_amop.dat, pg_amproc.dat, pg_opclass.dat, pg_opfamily.dat
  - range type support pg_range.dat
  - language and AM handlers pg_language.dat, pg_am.dat
  - system_functions.sql CREATE OR REPLACE replacements and EXECUTE privilege adjustments
  adjacent_other_actors:
  - catalog header inventory completeness: flow-3
  - SQL command syntax CREATE/ALTER/DROP FUNCTION|OPERATOR|TYPE|CAST: flow-2
  - information_schema helper function names: flow-5
  - extension CREATE FUNCTION/OPERATOR/TYPE: flow-6
  - GRANT/REVOKE ownership semantics: flow-7
  out_of_admitted_packet:
  - backend/utils/adt C implementations of prosrc symbols
  - genbki.pl array-type instantiation
  - bootstrap.c TypInfo[] referenced by pg_type.dat comments
  - live pg_catalog rows after initdb
