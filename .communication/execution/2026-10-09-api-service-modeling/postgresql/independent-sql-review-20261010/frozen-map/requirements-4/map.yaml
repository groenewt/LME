    arithmetic: 242+755+13+263+755+13=2041
  uncertainty: No extraction_contracts.limits row grammar is declared in values.yaml. Whether fused rows were intended is unresolved; the span is not a single table row.

- id: citation_checks_comment_overclaims_keyword_docs
  status: failed
  required: true
  applicable: true
  executed: true
  expected: If emission_schema.comments.citation_checks names GRANT/REVOKE, SQL features, limits, and keyword docs, citation-checks.j2 emits keyword_doc citations with spans, and the 2041 slice control includes those rows or records them unexecuted.
  observed: packet/frozen/candidate/citation-checks.j2 lines 8-34 emit keyword_doc_row_count then only grant_citations, sql_feature_citations, and limit_citations. keyword_doc_citations key is absent. rg keyword_doc_citations in citation-checks.yaml matches only the count fields. keyworddocs.yaml emits 1695 rows per pin without line_end. citation-checks.sql_feature_citations drop line_end. Author unresolved_gaps command names GRANT/REVOKE, sql_features, and limits.sgml only.
  keyword_rows_declared:
    '17': 1695
    '18': 1695
  in_2041_check: false

- id: admitted_keywords_sgml_uncited
  status: failed
  required: true
  applicable: true
  executed: true
  expected: Every sql_keyword_docs identity member is either span-cited or explicitly uncited with a declared reason.
  observed: source_class sql_keyword_docs counts_union 30, 15 per pin. keyword_doc_observation file_count is 14 per pin. The extra member is doc/src/sgml/keywords.sgml, present in identities, absent from keyword_doc_observation.files and keyworddocs.yaml files lists. This mapper read lines 1-30 of packet/publicsource/version17/doc/src/sgml/keywords.sgml. No line/byte citation exists for that file.
  packet_paths:
  - packet/publicsource/version17/doc/src/sgml/keywords.sgml
  - packet/publicsource/version18/doc/src/sgml/keywords.sgml

- id: citation_field_drops_prevent_exact_qualification
  status: failed
  required: true
  applicable: true
  executed: true
  expected: A citation row that qualifies Git/source/span binds packet_path, source_path, pin commit/tree/blob, one-based inclusive lines, and zero-based exclusive bytes.
  observed:
    grant_citations_in_citation_checks: packet_path source_path verb object_kind object line_start line_end byte_start byte_end citation_slice_matches_statement. No git_blob, commit, tree, tag.
    grant_inventory_field_keys: verb through source_class. Drops packet_path and citation_slice_matches_statement.
    sql_feature_citations_in_citation_checks: feature_id source_path line_start byte_start byte_end. Drops line_end packet_path git identity. Same source_path string under versions 17 and 18 despite different blobs.
    sql_feature_row_schema_has_line_end: true
    sql_feature_package_schema_lacks_line_end: true
    packages_absent_from_citation_checks: true
    package_count_per_pin: 36
    limit_citations_in_citation_checks: item line_start line_end byte_start byte_end. Drops source_path and packet_path.
    keyword_doc_row_schema: keyword source_path line_start byte_start byte_end. Drops line_end and packet_path. Observation rows have those fields.
  newline_convention_split:
    grants: exclusive end omits the statement newline; adjacent grant spans 853 then 854 leave the newline unowned
    sql_features_packages_keywords: exclusive end includes 0a
    declared_notes_do_not_state_newline_ownership: true

- id: citation_slice_matches_statement_always_true
  status: failed
  required: true
  applicable: true
  executed: true
  expected: Positive and negative slice checks. A mismatch must be able to emit false.
  observed: "rg citation_slice_matches_statement: false across packet/frozen matches zero rows. 505 grant observation contracts and 505 citation-checks rows are true. Field exists only on grants. Limits fusion could not use this field."
