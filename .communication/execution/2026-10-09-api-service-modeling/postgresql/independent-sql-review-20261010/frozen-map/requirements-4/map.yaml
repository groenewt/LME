  required: true
  applicable: true
  executed: true
  expected: One citation per limits.sgml table row, with item/upper_limit/comment bound to that row's <entry> cells and a line/byte span that does not include a second <row>.
  observed: Both pins emit 13 rows. tbody contains 14 <row> elements. Observation item "number of databases 4,294,950,911" with upper_limit "relations per database 1,431,650,303" uses line_start 31 line_end 44 byte_start 750 byte_end 1161 covering two <row> blocks.
  evidence:
    source: packet/publicsource/version17/doc/src/sgml/limits.sgml
    git_blob_sha: f26f4466719a5de0b081af25617dc976d48a4fdc
    identical_in_pin_18: true
