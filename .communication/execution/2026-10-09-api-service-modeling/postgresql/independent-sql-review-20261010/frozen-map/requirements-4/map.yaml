  expected: Independent span qualification against packet bytes. Native render exit 0, hash match, and checked=2041 failures=0 do not close exact citation semantics.
  observed: Native validation summary records citation-checks.j2 exit_code 0 byte_matches_returned true semantic_matches_returned true. review-requirements.no_acceptance_transfer forbids transferring author exit 0, native render/hash success, filesystem or source-count completeness, or previous SQL author approval. This map found fused limits rows and missing keyword-doc citations inside that claimed pass.

