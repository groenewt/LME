focus_question:
  text: Which declared gaps remain open, which required checks were actually executed,
    and which author pass/count claims are bookkeeping, projection, or unexecuted
    runtime rather than semantic proof.
producer_flow:
  summary: Declared YAML atoms and observation YAML are composed by candidate/compose-context.j2
    into a render context; reusable macros in candidate/macros.j2 emit inventories;
    executed versus unexecuted proof is split across several documents that do not
    share one passed_count definition.
  compose:
    template: packet/frozen/candidate/compose-context.j2
    parts_declaration: packet/frozen/candidate/observations/render_context.yaml
    root_merge: candidate/values.yaml
    gap_context_key: unresolved_gap_observation
    gap_part_path: candidate/observations/unresolved_gaps.yaml
    executed_control_context_key: executed_control_observation
    executed_control_part_path: candidate/observations/executed_controls.yaml
    unexecuted_checks_source: declared_values.unexecuted_checks in candidate/values.yaml
    negative_fixtures_source: declared_values.negative_fixtures in candidate/values.yaml
  jinja_transforms_relevant_to_focus:
  - template: packet/frozen/candidate/actual-controls.j2
    emitted: packet/frozen/candidate/actual-controls.yaml
    copy: packet/frozen/validation/actual-controls.yaml
    passed_count_source: executed_control_observation.passed_count
    checks_concat:
    - executed_control_observation.checks
    - unexecuted_checks
    - negative_fixtures prefixed with declared_values.negative_id_prefix
    note: passed_count is not computed from the concatenated checks list.
  - template: packet/frozen/candidate/handback.j2
    emitted: packet/frozen/candidate/handback.yaml
    actual_controls_passed_source: executed_control_observation.passed_count
    unresolved_gaps_loop: unresolved_gap_observation.gaps
    gap_keys: declared_values.field_keys.gap
    gap_keys_values:
    - id
    - status
    - evidence
    dropped_observation_fields:
    - versions
    commands_run_source: unresolved_gap_observation.commands_run
  - template: packet/frozen/candidate/coverage.j2
    emitted: packet/frozen/candidate/coverage.yaml
    expected_counts_source: expected_counts in candidate/values.yaml
    observed_counts_projected_keys:
    - gram_productions
    - pg_keyword_macros
    - errcode_rows
    - sql_command_entities
    - sql_catalogs
    - information_schema_create_view
    - system_views_create_view
    - supported_extension_controls
    - pg_proc_records
    expected_counts_keys_not_projected_to_observed_counts:
    - catalog_dat_files
    - catalog_pg_star_headers
    - catversion
    - contrib_dirs_without_any_control
    - errcode_sections
    - information_schema_domains
    - information_schema_functions
    - information_schema_grants
    - information_schema_tables
    - pg_control_version
    - sqlstar_sgml_matches
    - test_only_extension_controls
  - template: packet/frozen/candidate/validation.j2
    emitted: packet/frozen/candidate/validation.yaml
    fixtures_positive_includes_sql_features_count: true
    checks_loop_omits_sql_features_count: true
    admitted_extension_pass_predicate: "recon.admitted_control_count == exp.supported_extension_controls"
    test_only_length_is_evidence_only: true
    source_class_complete_predicate: "(source_class_observation.unclassified | length) == 0"
    unexecuted_retained: "unexecuted_checks | length"
    negative_fixtures_count_field: "negative_fixtures | length"
  - template: packet/frozen/candidate/source-set-reconciliation.j2
    emitted: packet/frozen/validation/source-set-reconciliation.yaml
    emits_test_only_lists_from: "grant_observation.extension_control_reconciliation.versions[ver].test_only_not_in_admitted_packet"
    emits_unexecuted_runtime_claims_from: unexecuted_checks
  - template: packet/frozen/candidate/grants.j2
    emitted: packet/frozen/candidate/grants.yaml
    runtime_not_executed: declared_values.typed_bool.true_value
    emits_test_only_not_in_admitted_packet_count_as_list_length: true
  - template: packet/frozen/candidate/identity-admission.j2
    emitted: packet/frozen/candidate/identity-admission.yaml
    malformed_subjects_are_declared_yaml: declared_values.admission_subjects
    subject_status_is_admission_not_expectation_match: true
  - template: packet/frozen/candidate/macros.j2
    yaml_list_map_emits_only_declared_key_order: true
    check_record_reuses_yaml_list_map: true
