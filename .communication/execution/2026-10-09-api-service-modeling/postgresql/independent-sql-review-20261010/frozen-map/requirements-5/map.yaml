  input_manifest_header_source_manifest_sha256: a0e5a7c532fd078b420aa4a0dd8794376de130845b4383ef5c388dca8c58db07
  input_root: packet
  output_root: review-output/requirements-5
  requirements: packet/review-requirements.yaml
  no_acceptance_transfer:
  - Author exit 0
  - Native render/hash success
  - Filesystem or source-count completeness
  - Previous storage review or SQL author approval
denominator:
  publicsource_union_declared: 1143
  source_denominator_prior: 1073
  source_denominator_current: 630
  source_denominator_removed_from_prior: 513
  source_denominator_added_to_current: 70
  frozen_candidate_validation_files: 71
