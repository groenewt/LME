schema_version: "1"
kind: elasticsearch_configuration_repair_handoff
service: Elasticsearch
role: repair_configuration_actual_validation_and_projection_semantics
model: cursor-grok-4.6-xhigh
pending_common_nine_file_packet: not_included
ownership:
  read: Exact source packet only plus admitted parser excerpt
  write:
    - output/values.yaml
    - output/extractor.j2
    - output/extractormacros.j2
    - output/settings.j2
    - output/settingsmacros.j2
    - output/behavior.yaml
    - output/coverage.yaml
    - output/validation.yaml
    - output/handoff.yaml
  shared: no canonical or other worker modifications
rejected_prior:
  action: preserve_as_evidence_do_not_execute
  packet_copies: packet/prior
  confirmed_tokens:
    - "{{ v.python_program }}"
    - "{{ v.python_projector }}"
repair:
  dictionary_attribute_collisions:
    collision_count: 177
    product_fix: explicit mapping brackets via python.bracket_keys and jitem for colliding dictionary attributes; jitem serializes one scalar
    preserve_emitted_dict_methods: true
    diagnostic_key_first_mapping: not_a_product_fix
  jinja_nested_macro_type_loss:
    error: "UndefinedError: 'str object' has no attribute 'argv'"
    product_fix: typed Jinja bracket traversal through declared keys until the final scalar, then serialize the scalar
    nested_jitem_mapping_passthrough: false
    native_context_overrides: false
    string_eval: false
    extractor_path: extractormacros.j2 bound_argv_flag used by fn_main
    projector_path: settingsmacros.j2 imports bound_argv_flag for fn_projector_main
  bootstrap:
    extractor: bound_argv_flag
    projector: bound_argv_flag
    flags_from_bound_yaml_at_generation_time: true
    not_from_uninitialized_runtime_values: true
    typed_bracket_traversal_until_scalar: true
  identity_lexical_grammar:
    every_segment_validated: true
    no_uppercase_one_letter_short_circuit: true
    no_fixture_exact_value_blacklist: true
    kind_constraint_separate_from_lexical: true
    rejected_plain_value: service
    rejected_dotted_anchor_specimen: "urn:silmaril:elasticsearch.setting"
    rejected_numeric_version_specimen: "urn:silmaril:version:8:18:8"
    lexical_positive_not_negative:
      - "urn:silmaril:value"
      - "urn:silmaril:elasticsearch:v"
  source_denominator:
    observation_count: 6735
    counts_from_identity_or_source_tag: true
    unread_includes_inaccessible: true
    seen_equals_file_records_length: true
    dump_counts_fixtures_coverage_joins_before_operational: true
  projection_semantics:
    prose_only_under_metadata_short_or_long_description: true
    nested_metadata_under_closed_keys: true
    object_identity_from_edition_class_field_line: true
    source_facts_retained_as_metadata_specimens: true
    prior_nonreference_leaf_violations: 123
    prior_repeated_generic_identities: recorded_and_repaired_in_macros
  observation_count: 6735
  executed_tests: not_invented
  prior_independent_control_failures: 5
  prior_controls_remain_failed_until_coordinator_rerun: true
  full_corpus_run:
    status: incomplete
    timed_out: true
    seconds: 240.15902361506596
    exit_code: null
    partial_operational_bytes: 3135980
    partial_operational_sha256: 43adfeaa3d2bb29af904ab39007dfe0b65cab6b89854cca94343758ce3ff13ad
    qualification: incomplete, not full proof; coordinator retry is separate and not known
coordinator_render:
  undefined_class: jinja2.StrictUndefined
  loader_class: jinja2.FileSystemLoader
  searchpath:
    - output
  values_file: output/values.yaml
  import_with_context: true
  include_does_not_export_macros: true
  keep_trailing_newline: true
  autoescape: false
  trim_blocks: false
  lstrip_blocks: false
  filters: []
  tests: []
  globals: []
  mapping_lookup: explicit brackets for colliding dictionary attributes values, get, keys, pop, setdefault; nested mapping traversal uses typed brackets until the final scalar; jitem serializes one scalar only
  context:
    extractor:
      values: from output/values.yaml
    projector_program:
      values: from output/values.yaml
      projection_mode: program
    model_document:
      values: from output/values.yaml
    declaration_document:
      values: from output/values.yaml
      record: one extraction declaration
    citation_document:
      values: from output/values.yaml
      join: one join record
    behavior_document:
      values: from output/values.yaml
      behavior_topic: topic atom
      behavior_citation: citation mapping
templates:
  extractor: extractor.j2
  settings: settings.j2
macros:
  extractor: extractormacros.j2
  settings: settingsmacros.j2
execute:
  extractor_argv:
    - python3
    - RENDERED_EXTRACTOR
    - --values
    - output/values.yaml
    - --sourceindex
    - packet/sourceindex.yaml
    - --packet-root
    - packet
    - --output-dir
    - COORDINATOR_OUTPUT
    - --parsercontract
    - packet/parsercontract.yaml
  projector_argv:
    - python3
    - RENDERED_PROJECTOR
    - --values
    - output/values.yaml
    - --output-dir
    - COORDINATOR_OUTPUT
    - --extracted
    - COORDINATOR_OUTPUT/operational.yaml
  extractor_emits:
    - operational.yaml
    - counts.yaml
    - joins.yaml
    - fixtures.yaml
    - coverage_runtime.yaml
  projector_emits:
    subdir: deepkv
    model: model.yaml
    records: declaration-INDEX.yaml
    citations: citation-INDEX.yaml
compare:
  - all source identities from packet/sourceindex.yaml against extraction records
  - observation_count_seen against 6735 when no --fixture
  - positive_example_custom_settings keys and fields
  - identity URN fixtures against accepted and rejected specimens
  - duplicate_keys and unsupported_declaration_expression must change reconstructed Java text
  - unread includes inaccessible without inflating seen beyond file_records
  - by_tag uses identity or source tag rather than absent record.tag
  - projector ShortDescription and LongDescription appear only under METADATA
  - declaration and citation IDENTITY values are unique object identities
do_not:
  - substitute models
  - edit shared or canonical files
  - read pending common nine-file packet
  - mark parser integration passed
  - invent CPG node or edge IDs
  - treat docs or schema as proved runtime behavior
  - dump python_program or python_projector from YAML
  - invent executed tests
  - treat the 240s full corpus timeout as proof
  - treat prior independent control failures as passing until coordinator rerun
  - mark graph or runtime proved
admitted_parser_excerpt:
  copy: packet/parsercontract.yaml
  sha256: 00dc3d035e350278ffa0f40fe4c924974c4d41225d7501047fa9fd277aa2c912
  parser_integration_status: timed_out_not_passed
explicit_unsupported:
  cpg: unresolved
  runtime: unexecuted
  product_source: separate
  nested_group_members: unresolved without graph IDs
  expression_keys: retained labeled expression
