summary: |-
  The eleven static DeepKV carriers are a real repair of the stopped author's bare KINDs, dotted ontology segments, digit or hash URN segments, and unregistered grouping keys. Native duplicate-key, closed-key, and alphabetic-reference checks on those eleven files are not target parser acceptance. The Jinja projection is a separate, currently failing product. macros.j2 plus rendering.yaml literals emit X-elastic-product, GET or POST or other method tokens, and params as mapping keys, then repeat METADATA at root for every apiindex row. That is invalid DeepKV structure, would collapse under ordinary YAML mapping rules, and is not excused by a Jinja render pass of 1114 REST packets. Deeper cause: the repair emptied illegal family catalogs from the carriers and never authored a lawful family projection spine, so the renderer dumps vendor REST shape instead of closed-key MEMBER or NEXT nodes with URN values. Independently, several Node lifecycle line pins cite packet-wrapper lines rather than Java readback line fields, and Node.start is truncated while the omitted TransportService and HttpServerTransport starts sit in the same admitted 847-line locus. Target parser controls still timed out at 300 seconds on the one-line valid_kind fixture; that measurement stays open and blocks acceptance.
