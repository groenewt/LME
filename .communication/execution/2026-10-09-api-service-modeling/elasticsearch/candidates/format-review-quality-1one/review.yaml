positive_observations:
- The eleven DeepKV carriers no longer use bare KIND values, dotted Ontology.* segments, digit or hash URN segments, or unregistered grouping keys such as Cluster or Formal. That matches the measured prior failures in packet/modelcontractone.yaml and packet/modelauthorhandoffstop.yaml.
- packet/reviewreceipts/modelrepaircontractone.yaml records empty native violations on the current eleven SHAs. That is a real static improvement and still not parser acceptance.
- interfaces.yaml joins apiindex instead of expanding 557 families as keys. Witnesses for search, info, ping, bulk, and _common stay in prose and DENOTES. ping and info are not collapsed in the carriers.
- Status vocabulary stays separated. corpus-derived, inferred, unknown, runtime-unexecuted, cpg-pending, and blame-unknown appear as distinct STATUS values. cpg-extracted is forbidden. Coverage family complete remains unqualified.
- Security.yaml frames NoopHostnameVerifier as a vendor-configurable insecure path and as a consumer-doctrine constraint, not as permission for LME clients to disable verification. No credentials are claimed read.
- RestController product header 89-90, reserved paths 91, favicon 141, registerHandler 334-335, dispatchRequest 339-342, tryAllHandlers 624, NOT_ACCEPTABLE 621, and validateErrorTrace 627-629 match the Java line fields. Breaker defaults and ThreadPool.Names 80-110 plus THREAD_POOL_TYPES match. Authentication 129, authorization 267, and SSL 236-257 match. RestSearchAction and RestBulkAction route sets match. Bootstrap NodeValidationException to ExitCodes.CONFIG and fatal boot exit 1 match. Node.java blob 2568c2a1bb45430f6c6ee53e2bee98677bbb54ce is identical on v8.18.7 and v8.18.8.
- macros.j2 replaced the prior undefined MEMBER.Literal.Newline lookup with literals.newline, emit_kind and emit_consumes fail closed, and unknown HTTP method tokens fail closed. Those are local quality fixes and do not salvage Q1 through Q3.
- versions.yaml does not expand the 6108-row blame catalog. REST-JSON identity is marked inferred from absence of rest-api-spec/src/main/resources/rest-api-spec/api paths in versiondelta.yaml. FilteredRestRequest is added and RestRequestFilter is modified there, matching the named deltas.
- validation.yaml and handoff.yaml refuse to self-certify execution, CPG closure, official 8.18 retrieval, or formal review. Operational versus DeepKV file split is explicit.
clarifying_questions:
- Is a coordinator merge of the eleven DeepKV carriers under model actually planned? If yes, how must edition IDENTITIES and repeated closed keys be owned to avoid Q11?
- When typed is bound to an empty mapping, must the renderer fail closed, emit only witness families, or omit REST projection entirely?
- What is the lawful DeepKV schema for one REST family, including method and path, without admitting GET or path keys? Is PARAMETERS plus ACTION plus DENOTES plus prose the intended form?
- Does registry::profile::read accept urn:silmaril:profile:deep:key:value? Native alphabetic checks would not catch a profile-registry miss.
- The task states 70 source-parse-problem files and skipped large-method dataflow. Those named receipts were not found in this packet. Which admitted file is the source of that count?
- May this review treat packet/api absence as a documented gap, or must family unwrap be rechecked after those files are admitted?
