findings:
- id: Q1
  severity: critical
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 73-127, 151-167
  issue: The renderer emits unregistered vendor tokens as YAML keys. project_header writes X-elastic-product. project_spec_paths writes GET POST PUT DELETE HEAD PATCH as keys whose values are raw paths. unwrap_and_project writes params as a key for _common-style packets. Those spellings are absent from registry::deep::key::value::data in packet/parsercontract.yaml. Hyphenated X-elastic-product also violates the no-hyphen key law in packet/modelcontracts.yaml USER_REF_00. Path and param-name scalars are not alphabetic URNs, so they would fail deep::key::value::reference::validate even if the keys were admitted.
  impact: The 1114-packet Jinja product cannot be a DeepKV document. Native YAML mapping load would also keep only the last value per repeated method key, dropping the other routes. Jinja render pass is only string emission.
  suggestion: Keep vendor header, method, and path atoms in operational provenance or METADATA prose, or as URN values under closed keys such as PARAMETERS, ACTION, DENOTES, and VALUE. Do not promote rendering.yaml literal values into key position. Fail closed if a lawful family node cannot be built.
  requirements:
  - universal-representation-closed-deepkv
  - known-invalid-emitted-deepkv
  - header-product-source
- id: Q2
  severity: critical
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 151-163
  issue: project_index emits a root METADATA block for every apiindex record, using rec.api as LongDescription, then unwraps that packet at the same depth. With 1114 records this repeats the METADATA taxonomic path 1114 times. packet/parsercontract.yaml parse/line.sh lines 88-90 fail duplicate taxonomic path as GRAPH_COLLAPSE. Ordinary YAML keeps only the last METADATA mapping.
  impact: Either the projection is rejected, or family identities collapse to one leftover LongDescription. Coverage-family completeness cannot be read from the emitted document.
  suggestion: One family, one MEMBER or NEXT node, one METADATA under that node. Iterate apiindex into a NEXT spine of closed-key family nodes, not a flat reprint of METADATA.
  requirements:
  - known-invalid-emitted-deepkv
  - family-count-and-join
  - universal-representation-closed-deepkv
- id: Q3
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 129-175
  issue: Deeper cause of Q1 and Q2. project_model emits only header, model IDENTITY, KIND, and STATUS, then the index dump. It ignores model MEMBER, GAP, TYPE, PROFILE, ROLE, STATE, DISPOSITION, CHAIN, and the other domain carriers. project_family exists and is unused, and it still calls unwrap_and_project. overlay_typed is a no-op on the declared empty typed mapping. The repair removed illegal grouping keys from the eleven carriers and never replaced them with a lawful projection schema.
  impact: A reader of the authored carriers cannot see the emitted product, and a reader of the emitted product cannot see the authored service model. YIELDS in service.yaml names a Jinja REST-family projection that is not a DeepKV document.
  suggestion: Define one closed-key family node schema, compose it from the service-domain MEMBER spine plus optional typed overlay, and fail closed when typed is empty if complete schemas are required. Do not dump vendor REST mappings.
  requirements:
  - known-invalid-emitted-deepkv
  - universal-representation-closed-deepkv
  - family-count-and-join
- id: Q4
  severity: high
  location: packet/reviewcandidate/rendering.yaml
  digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
  lines: 54-85, 86-91
  issue: The operational literals file correctly stores X-elastic-product, HTTP method tokens, and spec_params as values. macros.j2 then uses those values as keys. validation.yaml header-product requires the literals plus RestController readback, not emission as a DeepKV key. validation.yaml invented-registry and illegal-key-depth forbid new keys and hyphenated keys. The Jinja join uses packets[rec.file] only; rendering.yaml action requires join by file path and source_sha256.
  impact: The literal contract licenses vendor spellings in the wrong slot. Lineage-mutation protection on source_sha256 is not implemented in the template. A swapped packet at the same path would still render.
  suggestion: Keep rendering.yaml as the specimen store. Change macros so every emitted key is L.key_* from the closed roster. Add an explicit source_sha256 equality check before unwrap, and fail closed on mismatch or missing packet.
  requirements:
  - header-product-source
  - universal-representation-closed-deepkv
  - family-count-and-join
- id: Q5
  severity: high
  location: packet/reviewcandidate/service.yaml
  digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
  lines: 87-101
  issue: Node.stop is cited at line 957 and close at lines 1073-1083. Those numbers are packet YAML wrapper lines. Java readback line fields are stop at 463-464 and close at 520-525 in packet/source/v8.18.8/server.src.main.java.org.elasticsearch.node.Node.java.yaml. The same file correctly cites start at Java 288-291. Mixed pin convention.
  impact: Source-bound review and later blame or CPG joins will look up the wrong Java lines. Provenance also repeats the wrapper-line stop and close pins.
  suggestion: 'Cite only the Java readback line: field. Re-pin stop to 463-464 and close to 520-525. Add a validation fixture that rejects pins greater than sourceindex lines for that locus (Node.java lines: 847).'
  requirements:
  - source-bound-pins-and-missed-flows
- id: Q6
  severity: high
  location: packet/reviewcandidate/lifecycle.yaml
  digest: a4c7e3e6c32b180c2f66b25ceff38b6cbe715a579deda2ef4b71ac4fd36b4bbe
  lines: 56-96
  issue: lifecycle.yaml repeats the wrapper-line stop and close pins and says later starts including NodeConnectionsService, GatewayService, and Coordinator are below the copied window. The admitted Node.java locus is the full 847-line file. Java 306-323 starts FsHealthService, MonitorService, NodeConnectionsService, GatewayService, and TransportService. Java 427 starts HttpServerTransport. Those are required lifecycle flows present in the packet and omitted from the CHAIN.
  impact: Startup, discovery, transport bind, and HTTP serve are the actual run admission path. Truncating at SearchService loses those relationships while claiming the window ended.
  suggestion: Extend the start STAGE LongDescription and ACTION or NEXT nodes through TransportService.start and HttpServerTransport.start using Java line fields. Delete the false copied-window clause.
  requirements:
  - source-bound-pins-and-missed-flows
- id: Q7
  severity: high
  location: packet/reviewcandidate/provenance.yaml
  digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
  lines: 99-101, 172-173
  issue: RestMainAction notes claim routes at source lines 73-75, but the file is 64 lines and the Java readback places List.of(new Route(GET, "/"), new Route(HEAD, "/")) at lines 32-34. Lines 73-75 are wrapper YAML. The sibling note canTripCircuitBreaker at 61-62 is the correct Java field. Node notes mix correct start pins 288-291 with wrapper stop 957 and close 1073-1083.
  impact: The operational pin table, which other carriers cite, is internally inconsistent. Reviewers who trust provenance without opening the readback will propagate the wrong spans.
