positive_observations:
- The eleven DeepKV carriers no longer use the measured prior grouping keys such as Cluster, Formal, Catalog, or bare KIND service. packet/reviewreceipts/modelrepaircontractone.yaml lists empty violations for those SHAs. That is a real carrier repair, not parser acceptance.
- Hashes, tag spellings, numeric counts, and vendor tokens with digits or underscores live in provenance.yaml and other operational files. Edition URNs are alphabetic eight:eighteen:eight, matching the isolated reference validator that rejects urn:silmaril:version:8:18:8.
- interfaces.yaml keeps ping HEAD / and info GET / as distinct witnesses and refuses to collapse them. RestMainAction.java 32-33 registers both. RestMainAction.canTripCircuitBreaker false at 61-62 matches resources.yaml.
- security.yaml treats NoopHostnameVerifier as an explicit vendor path at SSLService.java 236-256 and as a consumer-edge constraint, not as permission for LME insecure fallback and not as an executed handshake.
- Search source_sha256 6d9002ded65f464bf36397ba8e1d866ad316baed04f8f7ef407ffe85a6ffc6b4 appears on both apiindex search rows. packet_sha256_head 907ece4d7f4bb5fbdd979bffe4c263145640f03825c110726095eed9f052cda6 matches the v8.18.8 apiindex sha256. Representative Node.java blobs are identical across tags.
- versiondelta lists FilteredRestRequest.java, RestRequestFilter.java, JsonProcessor.java, and TransportVersion files, and does not list rest-api-spec/src/main/resources/rest-api-spec/api JSON paths. The inference that REST family JSON bodies are identical is labeled inferred, not cpg-extracted.
- Thread-pool names and SCALING/FIXED types match ThreadPool.THREAD_POOL_TYPES. Circuit-breaker defaults and line spans 70-128 match HierarchyCircuitBreakerService. RestController product header, reserved paths, favicon, dispatch, and tryAllHandlers citations match Java. AuthenticationService 129-130 and AuthorizationService 267 match. Bootstrap ExitCodes.CONFIG and gracefullyExit(1) match.
- validation.yaml and handoff.yaml keep required/applicable/executed/status/evidence distinct and claim no worker test execution. Coverage family remains unqualified. Neighbor products are sidecar edges.
- macros.j2 actually looks up literals.newline rather than the forbidden MEMBER.Literal.Newline. That prior silent-empty path is closed in this revision, even though the emission schema is still illegal.
clarifying_questions:
- Is the intended REST projection only closed-key nodes whose paths and methods live in LongDescription/DENOTES, or is a future corpus registry change for method/path keys expected? invented-registry remains illegal here.
- Are packet/api wrappers required in this worker packet for independent review, or is apiindex plus the coordinator render receipt the admitted join?
- Should ontology anchors be urn:silmaril:ontology:basic:formal as written, or a different lawful specimen of Ontology.Basic.Formal? Dotted Ontology.Basic.Formal fails the isolated reference validator.
- When the validkind fixture times out, is that a parser-engine defect to keep open beside the candidate, or a candidate blocker until a parse receipt exists?
- Where in this packet, if anywhere, is the 70-file CPG source-parse-problem list? It is not under that name in the files read.
- Should Node.start transport/coordinator/HTTP bind be required CHAIN stages in this service-domain model, or owned only by a later graph join?
