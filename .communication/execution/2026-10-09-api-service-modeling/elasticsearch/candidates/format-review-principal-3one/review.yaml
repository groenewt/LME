findings:
- id: F-RENDER-ILLEGAL-KEYS
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 91-97,119-122,165-167,169-175
  also:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 54-66,83-84
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: 1-2
  issue: The projector emits vendor surface tokens as YAML mapping keys. project_header writes X-elastic-product. project_spec_paths writes GET/POST/PUT/DELETE/HEAD/PATCH. The _common fallback writes params. None of those names are in registry::deep::key::value::data. Values are raw paths or vendor tokens, not alphabetic URNs. Jinja fail() only rejects unknown method tokens, so a successful render is the illegal document.
  impact: The measured 1114-family render cannot be a DeepKV product. parse::line key::read and reference::validate must reject the first header line. Treating render pass as qualification erases the known failure.
  suggestion: Keep method names, paths, and the product header as declared literals, but emit them only as VALUES under closed keys already used in protocols.yaml PARAMETERS/ACTION/DENOTES, or as METADATA LongDescription prose. Do not add Catalog/Method/Path keys. Do not treat rendering.yaml declaration of method_get as a license to mint a GET key.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
  deeper_causes:
  - rendering.yaml action and literals encode vendor spec shape (url/paths/methods/params/headers) as the emission schema.
  - Generic macros hide that schema in project_spec_paths and unwrap_and_project instead of projecting the authored DeepKV graph.
  - The repair correctly stopped expanding 557 families as carrier grouping keys, then moved the same expansion into Jinja over apiindex.
  - Prior macros.j2 already emitted header/GET/params keys via MEMBER.Literal lookups; this revision fixed the lookup name and then applied the illegal printer to every apiindex row.
- id: F-RENDER-DUPLICATE-METADATA
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 151-163
  issue: project_index emits METADATA plus LongDescription rec.api for every apiindex row at document depth zero. DeepKV paths are parent plus key identity. A second METADATA at the same depth is duplicate taxonomic path / duplicate path, which parse::line and validate reject even if every other key were legal.
  impact: A 1114-row dump cannot be one DeepKV document under a single METADATA cell. Repeated METADATA is an independent failure from GET/params, matching the known measured emission.
  suggestion: One family, one IDENTITY-bearing MEMBER/NEXT node. Put the vendor api token in DENOTES or LongDescription of that node. Never re-open METADATA as a sibling key for each family.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
- id: F-RENDER-DROPS-AUTHORED-GRAPH
  severity: high
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 129-139,169-175
  also:
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: 1-2
  - path: packet/reviewcandidate/interfaces.yaml
    digest: 4af99898e8f36d385909c1e8040ed19e6cb23438f248992d90f1551271b13f1c
    lines: 30-108
  issue: project_family exists and would emit IDENTITY/KIND/TYPE/STATUS/DENOTES/CONSUMES/GAP/LongDescription, but project_model never calls it. The live path emits model IDENTITY/KIND/STATUS then walks index.apis. interfaces.yaml witnesses, protocols.yaml header PARAMETERS, and the other passing carriers are unused at emit time. rendering.yaml names a catalog binding that model.j2 does not receive.
  impact: The only DeepKV-shaped service model the native check accepted is not what the renderer publishes. Coverage family complete cannot be earned by counting apiindex rows in an illegal dump. Relationship types in the carriers are discarded.
  suggestion: Make project_model walk the authored MEMBER/NEXT/CHAIN graph with project_family. Join a packet spec only when a node CONSUMES apiindex or a witness DIGEST. Bind typed as overlay onto those nodes, empty mapping remains a gap.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
- id: F-PARSER-TIMEOUT-REMAINS-OPEN
  severity: high
  location:
    path: packet/reviewreceipts/parsercontrolslifecycle.yaml
    digest: not-a-candidate-file
    lines: 21-29
  also:
  - path: packet/reviewcandidate/validation.yaml
    digest: 77bd14a84f21804f9f8707fef3619a9d70a089c37b1ef53f9a7f2a19fcf14463
    lines: 20-22,80-84,145-154
  - path: packet/reviewcandidate/provenance.yaml
    digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
    lines: 341-353
  issue: >-
    Full target controls timed out at 300s on KIND: urn:silmaril:kind:service after BOOTED. Isolated reference validation of the same URN returns 0. This frozen SHA set has no target parse receipt. provenance.candidate_parse still points at workers/model/output/service.yaml sha 50075eb5... exit -15. Native zero violations on eleven carriers is a different tool.
  impact: Parser acceptance is unknown and currently blocked. A later green native re-run cannot close it. registry.yaml eighty-deep NEXT would be an even larger cell-object load on a parser that cannot finish one valid line.
  suggestion: Keep parser required/applicable/executed/status/evidence separate. Do not mark closed-keys-only or alphabetic-urns executed true from the native crosscheck. Diagnose validkind slowness on the target engine; do not rewrite the candidate to satisfy a hung parser.
