schema_version: 1
role: reusable_operational_values
not_a_deepkv_carrier: true
service_original: Elasticsearch
render:
  engine: jinja2
  undefined: StrictUndefined
  trim_blocks: false
  lstrip_blocks: false
  keep_trailing_newline: true
  searchpath:
  - output
  template: interfaces.j2
  macros: interfacemacros.j2
  driver_template: driver.j2
  driver_macros: drivermacros.j2
  one_carrier_per_render: true
  macro_binding: from_import_with_context
  include_does_not_export_macros: true
  do_not_use_include_for_macros: true
context_contract:
  required:
  - values
  - item_kind
  - item
  optional:
  - schema
  - openapi
  - apis
  - upstream_validation
  - acquisition
  - version_delta
  - source_index
  item_is:
    catalog: synthetic catalog root
    endpoint: one observed.endpoints member
    type: one observed.types member
    field: one property plus parent type
    parameter: one path or query member plus parent request
    enum_member: one enum member plus parent enum
    body: request or response body plus parent type
    behavior_attachment: one attachedBehaviors string plus parent type
    generic: one generics member plus parent type
    inherit: one inherits.type plus parent type
    media: one media type binding plus parent endpoint
    url: one urls member plus parent endpoint
    openapi_operation: path method and operation
    openapi_schema: name and schema object
    openapi_parameter: name and parameter object
    openapi_request_body: name and requestBodies object
    openapi_response: name and responses object
    api_index: one apiindex apis member
    dangling: one generalErrors string
    unmatched: derived coverage row
    error: named error type
    join_edge: named join
    expression: one nested type expression plus parent
    variant: one variants mapping plus parent type
    availability: one availability mapping plus parent
    rest_body: one tagged REST specification body
    rest_param: one REST params or parts member
    rest_path: one REST url path member
    source_locus: representative Java locus not an interface carrier
punct:
  colon: ':'
  mapping_sep: ': '
  branch_tail: ':'
  space: ' '
  newline: "\n"
  indent: '  '
  underscore: _
  dot: .
  hyphen: '-'
  slash: /
  plus: +
  star: '*'
  hash: '#'
  comma: ','
  quote: ''''
  double_colon: '::'
  empty: ''
collapse_passes:
- one
- two
- three
- four
- five
- six
- seven
- eight
