prose:
  catalog_short: Elasticsearch official typed request-response interface catalog from supplied branch 8.18 schema plus tag REST index and materialized REST bodies.
  catalog_long: Complete reusable typed request-response projections over every supplied official schema endpoint and type plus every tagged REST specification body. Source-derived data is this catalog. Runtime and CPG proof are not supplied and are not claimed. Branch 8.18 schema is not proven exact tag 8.18.7 or 8.18.8 semantics. endpointErrors empty does not mean all schemas valid; dangling-type errors remain. Exact foreign names, paths, commits, and digests live in protected descriptions and operational provenance specimens, never as invented legal URNs.
  ontology_short: Ontology anchors bound by legal URNs; original Ontology.Basic.Formal, Ontology.Common.Core, and Ontology.Process.Cognitive names are protected prose.
  untyped_short: Schema endpoint with request null and response null.
  dangling_short: Upstream validation dangling type preserved exactly.
  unmatched_short: Coverage row for a name present on one evidence surface and absent on another.
  no_security_schemes: Official OpenAPI packet has no components.securitySchemes; security remains typed schema and descriptive text.
  api_bodies_present: Tag REST api yaml bodies are materialized in this packet and must be walked; joins still keep names, file paths, and sha256 from packet/apiindex.yaml.
  source_java_not_interface: packet/sourceindex.yaml Java modules are representative production loci, not a substitute for the typed request-response schema and not CPG proof.
  unknown_short: Node or variant that could not be classified from declared tables; retained as unknown, not dropped.
  runtime_absent: Runtime proof is not supplied in this packet.
  cpg_absent: CPG proof is not supplied in this packet.
  fallback_short: empty original
  lead: 'text '
  expression_short: Nested type expression preserved with original kind and bindings.
  rest_short: Tagged REST specification body walked from packet/api.
  variant_short: Type variant retained with original kind and tag.
  availability_short: Availability stack or serverless binding retained with original fields.
