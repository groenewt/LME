repair:
  yaml_boolean_keys: >-
    Quote TRUE/FALSE/NONE as YAML strings and emit Python via py.true_token
    py.false_token py.none_token so Jinja never looks up bool keys.
  python_literals: >-
    Macro q serializes every emitted string through declared escape
    replacements. Newline, tab, CR, FF, VT, NUL, backslash, apostrophe, and
    UTF-8 non-ASCII become executable Python.
  colliding_names: >-
    items get keys values update setdefault pop are emitted from meth.*_name.
    Unmatched dump dictionaries use io.items_key, never q(ev.items), so the
    YAML key is the declared items atom rather than a dict method object.
  missing_lparen: >-
    Product macros emit syntax.lparen, not py.lparen. Adding a diagnostic
    context alias is not a product fix.
  handoff_colon: >-
    All prose uses block scalars or quoted strings so a colon space sequence
    cannot be parsed as a nested mapping.
  csv_field_size: >-
    imports() emits csv.field_size_limit with declared
    csv_limits.field_size_limit 2147483647.
  csv_header_data_pairing: >-
    patterns.data_suffix is _data.csv and patterns.cypher_suffix is
    _cypher.csv. Enumeration pairs each stem_header.csv with
    stem_data.csv, reads schema from the header file, and streams every
    data row. Cypher helpers are recorded as helper_files and are not
    parsed as graph records. Owned fixtures write that same layout.
  lookup_index: >-
    build_source_index maps basename to source paths. lookup_source returns
    immediately on empty joined names, exact source hits, then basename
    candidates only. Ambiguous suffix matches append to ambiguous_joins.
    FILE nodes join on NAME. FILENAME lookup runs only when FILENAME is
    present and the node label is not FILE. No sample cutoff.
  expect_isolation: >-
    After recursive merge_map, overlay.expect wholesale-replaces loaded.expect.
    Each control carries a complete independent expect map matching observed
    fixture evidence. missingOverlay fakeHandAuthoredEdge staleSourceDigests
    expect file_nodes_equal_expected true. invalidLexicalDepth expect is only
    accepted, accepted_as_deepkv, and completeness.
  live_source_missing: >-
    verify_live_source_octets walks man_rows. Absent live files append
    missing_live and reasons.missing_live_source. accepted requires not
    missing_live.
  namespace_bind: >-
    Matching graphs overwrite namespace_bind_keys onto inputs. Keys absent
    from the matching graph are popped so leftover production source_root
    and digest atoms cannot survive a supplemental rebind. v8.18.8
    supplemental has no packet source_root; Path is built only for nonempty
    declared roots.
  memory: >-
    Node identifier membership uses on-disk sqlite at parameters.node_index.
    CSV rows stream. Unmatched lists and FILE maps remain bounded.
  namespaces: >-
    One qualify invocation reads one export_dir. Controls rebind graph
    identity. No cross-graph edges.
  owned_fixture: >-
    Fixture controls generate a small complete graph under
    parameters.projection_dir using Joern 4.0.563 stem_header.csv,
    stem_data.csv without a repeated header, and stem_cypher.csv helpers,
    copy it, then mutate only the owned pair files. Mutation none leaves
    the copy intact for accepted true completeness false. Negative
    mutations are empty_export, absent_file, absent_overlay, stale_hash,
    and dangling_edge. Root forged_edges is empty. Helpers are provenance
    only.
render:
  engine: jinja2
  strict_undefined: true
  undefined_class: jinja2.StrictUndefined
  autoescape: false
  trim_blocks: false
  lstrip_blocks: false
  keep_trailing_newline: true
  yaml:
    loader: yaml.safe_load
    boolean_keys_must_be_quoted:
    - "TRUE"
    - "FALSE"
    - "YES"
    - "NO"
    - "ON"
    - "OFF"
    - "NULL"
  context: >-
    Root mapping of output/readbackvalues.yaml after safe_load. The mapping
    itself is the Jinja context. Do not wrap it as a nested readbackvalues
    mapping.
  from: from render.macros import script with context
  macros_value: readbackmacros.j2
  macros_path: output/readbackmacros.j2
  template: output/readback.j2
  values: output/readbackvalues.yaml
  writes: parameters.rendered_script
  do_not_author_raw_script: true
  quoting_macro: q
  quoting_filter:
    name: py_literal
    required: false
    templates_call: q
    algorithm: >-
      wrap with literal.delimiter then replace backslash, delimiter, newline,
      CR, tab, FF, VT, NUL using declared literal.* atoms in that order
  filters_required:
  - name: replace
    source: jinja2_builtin
  prior_failure_boolean_key: "packet/actualfailures.yaml UndefinedError(\"'dict object' has no attribute 'TRUE'\")"
  prior_failure_unterminated_string: "packet/actualfailures.yaml SyntaxError unterminated string at fixture.split line 197"
  prior_failure_lparen: "packet/graphreadbackrepairvalidationone.yaml UndefinedError(\"'dict object' has no attribute 'lparen'\") at readbackmacros.j2 line 480"
  prior_failure_handoff_colon: "packet/graphreadbackrepairvalidationone.yaml mapping values are not allowed here in handoff.yaml line 44"
  prior_control_exit_one: "packet/graphreadbacknextcontrols.yaml missingOverlay fakeHandAuthoredEdge staleSourceDigests invalidLexicalDepth"
