    projection_dir: /home/tristan/gitters/LME/.communication/execution/2026-10-09-api-service-modeling/elasticsearch/projections/graphqualifyformat
    expect_return_when_expect_matches: 0
    expect_return_when_expect_mismatches: 1
    exit_zero_is_not_success: true
    completeness_claim: false
stages:
  render_readback:
    uses:
    - output/readback.j2
    - output/readbackmacros.j2
    - output/readbackvalues.yaml
    rule: >-
      yaml.safe_load values; jinja2 Environment StrictUndefined; from
      render.macros import script with context; write
      parameters.rendered_script
  compile_readback:
    command: cli.compile.argv
    expect_return: 0
  observe:
    method_dump: Query-stage; not this script
    file_nodes: >-
      Stream every nodes_FILE_data.csv row under the paired
      nodes_FILE_header.csv schema and compare represented FILE names to
      expected_files of the active namespace. Exclude cypher helpers.
    edges: >-
      Accept only exported tuples with node identifiers types and line info
    classified: >-
      Count AST CFG CALL CDG REACHING_DEF SOURCE_FILE from matching
      edges_*_data.csv files under paired header schema. Exclude cypher
      helpers.
    unresolved: >-
      Preserve METHOD_REF without REF, unresolvedSignature CALL names, and
      IS_EXTERNAL methods
    unmatched: >-
      Write every unmatched original source path and every unmatched FILE name
      under the declared items key
    memory: node-index.sqlite for node identifier membership
    fixture: >-
      When flags.generate_owned_fixture is true, materialize a complete
      header-data-cypher graph then copy-mutate only the owned pair files
      under parameters.projection_dir
  validate:
    controls: output/validation.yaml
    execute_readback: cli.readback.argv plus --control rebinds
    exit_zero_is_not_success: true
    completeness_claim: false
