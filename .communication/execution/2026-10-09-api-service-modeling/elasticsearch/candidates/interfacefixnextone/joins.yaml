schema_version: 1
role: interface_semantic_joins
not_a_deepkv_carrier: true
source_derived_versus_runtime:
  source_derived: packet/typeschema.yaml observed.endpoints and observed.types;
    packet/openapi.yaml observed.paths and observed.components; packet/apiindex.yaml
    apis; packet/api specification bodies; packet/upstreamvalidation.yaml observed;
    packet/acquisition.yaml editions; packet/versiondelta.yaml changes.
  runtime_cpg: not supplied. packet/sourceindex.yaml Java loci are representative
    production modules, not interface carriers and not CPG edges. Do not fabricate
    edges or treat sourceindex as request-response proof.
  unknown: undeclared type kinds, expression kinds, or variant kinds remain unknown
    nodes. They are not dropped and are not silently classified as interface.
authority: output/values.yaml
join_law:
  one_carrier_per_node: true
  closed_keys_only_on_rendered_carriers: true
  foreign_names_are_not_urns: true
  identity_encoding: injective reversible alphabetic run encoding from values.identity_encoding
  collision_detection: required
  do_not_unify_underscore_dot_hyphen: true
  ontology_anchors:
  - original: Ontology.Basic.Formal
    urn: urn:silmaril:ontology:basic:formal
  - original: Ontology.Common.Core
    urn: urn:silmaril:ontology:common:core
  - original: Ontology.Process.Cognitive
    urn: urn:silmaril:ontology:process:cognitive
edges:
- kind: schema_endpoint_to_request_type
  rule: When endpoint.request is a mapping, join endpoint.name to the types member
    whose kind is request and whose name.name and name.namespace equal request.name
    and request.namespace.
  left: schema.endpoints
  right: schema.types
  count_left: 556
  count_right: 536
  unmatched_left: 20
  unmatched_left_names:
  - _internal.delete_desired_balance
  - _internal.delete_desired_nodes
  - _internal.get_desired_balance
  - _internal.get_desired_nodes
  - _internal.prevalidate_node_removal
  - _internal.update_desired_nodes
  - capabilities
  - connector.secret_delete
  - connector.secret_get
  - connector.secret_post
  - connector.secret_put
  - fleet.delete_secret
  - fleet.get_secret
  - fleet.post_secret
  - inference.put_custom
  - profiling.flamegraph
  - profiling.stacktraces
  - profiling.status
  - profiling.topn_functions
  - transform.get_node_stats
- kind: schema_endpoint_to_response_type
  rule: When endpoint.response is a mapping, join to the types member whose kind is
    response and whose name.name and name.namespace equal response.name and
    response.namespace.
  left: schema.endpoints
  right: schema.types
  count_right: 536
  unmatched_left: 20
  same_names_as: schema_endpoint_to_request_type
- kind: request_to_path_query_body
  rule: Every request type emits one parameter carrier per path member, one parameter
    carrier per query member, one body carrier when body is present, one behavior_attachment
    carrier per attachedBehaviors member, one generic carrier per generics member,
    and one inherit carrier when inherits.type is present. Field carriers walk interface
    and response properties. Enum member carriers walk enum members. Type-alias
    DENOTES the aliased expression. Nested expressions, unions, generics, variants,
    defaults, cardinality, and availability are walked recursively and retained.
  left: schema.types
  right: rendered field parameter body behavior generic inherit member expression variant availability carriers
- kind: schema_endpoint_to_openapi_operation
  rule: Join endpoint.name to OpenAPI operations by comparing encode_identity(endpoint.name)
    to encode_identity(operationId) and by comparing each endpoint.urls path and methods
    member to openapi.paths keys and method keys. Multiple urls or methods on one
    endpoint may produce multiple OpenAPI operations. 556 endpoints versus 803 operationIds
    and 552 paths is unmatched coverage, not silent identity.
  left_count: 556
  right_operation_count: 803
  right_path_count: 552
  difference_visible: true
- kind: schema_endpoint_to_tag_rest
  rule: Join endpoint.name to apiindex.api for tag v8.18.8 and tag v8.18.7. _common
    is REST shared params evidence, not a schema endpoint. 557 index rows per tag
    include that extra name. This packet materializes all 1114 REST specification
    bodies; walk each body and still keep names, file paths, packet sha256, and
    source_sha256.
  left_count: 556
  right_count_per_tag: 557
  extra_right_name: _common
  extra_right_status: unmatched_to_schema_endpoint
  api_bodies_materialized: true
  rest_bodies: 1114
  use: names, file paths, packet sha256, source_sha256, and specification trees from packet/api
- kind: tag_rest_to_tag_rest
  rule: Join v8.18.8 api names to v8.18.7 api names. Roster counts are equal at 557.
    Packet wrapper sha256 values differ. source_sha256 may match for an unchanged
    blob. versiondelta.yaml does not list rest-api-spec api json changes; do not
    invent a REST surface delta. Introducing-commit blame is not established.
  left_tag: v8.18.8
  right_tag: v8.18.7
  name_roster_count_equal: true
  source_blob_identity: compare source_sha256 per name; do not assume equality without
    the walk
  blame: Both tags initially shallow; introducing-commit blame not yet established.
- kind: branch_schema_to_tag_rest
  rule: Join branch 8.18 typeschema and OpenAPI to tag REST index evidence. Qualification
    on every schema specimen is Official branch 8.18 schema, not proven exact tag
    8.18.7 or 8.18.8 semantics. Keep the difference visible.
  left_ref: '8.18'
  left_commit: 090baacf9e28f8f72bf9cd087c87737d280c294c
  right_tags:
  - v8.18.8
  - v8.18.7
  status: unproven_tag_equivalence
- kind: dangling_types
  rule: Preserve every upstream generalErrors dangling type exactly. endpointErrors
    empty does not mean all schemas valid.
  endpointErrors: {}
  generalErrors_count: 88
