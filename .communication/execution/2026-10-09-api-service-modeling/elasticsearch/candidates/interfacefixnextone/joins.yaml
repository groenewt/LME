- kind: media_and_streaming
  rule: Join endpoint requestMediaType and responseMediaType to the five observed
    media originals. Streaming flags bind application/x-ndjson, text/event-stream,
    and application/vnd.mapbox-vector-tile. Cat family also yields text/plain.
  originals:
  - application/json
  - application/x-ndjson
  - text/plain
  - text/event-stream
  - application/vnd.mapbox-vector-tile
  streaming_endpoints:
  - bulk
  - fleet.msearch
  - inference.chat_completion_unified
  - inference.stream_completion
  - ml.post_data
  - monitoring.bulk
  - msearch
  - msearch_template
  - search_mvt
  - text_structure.find_structure
- kind: error_and_security
  rule: Join ErrorCause and ErrorResponseBase as the typed error axis. OpenAPI packet
    has no components.securitySchemes. Security remains schema types such as security.authenticate
    and descriptive endpoint text, not an invented OpenAPI security scheme.
  error_types:
  - _types.ErrorCause
  - _types.ErrorResponseBase
  securitySchemes_present: false
- kind: behaviors
  rule: Join attachedBehaviors strings to _spec_utils interfaces CommonQueryParameters
    and CommonCatQueryParameters. AdditionalProperties, AdditionalProperty, and OverloadOf
    remain typed behaviors.
- kind: edition_java_not_interface
  rule: Do not join sourceindex Java files into request-response carriers. They remain
    separate source evidence. versiondelta paths are edition file changes, not schema
    completeness. Source is not runtime and is not CPG.
- kind: identity_encoding
  rule: Distinct originals that collide under underscore-dot-hyphen collapse must
    remain distinct under encode_identity. Collision detection is a failed count
    contract, not a silent unify.
