schema_version: 1
role: interface_render_validation
not_a_deepkv_carrier: true
executor: coordinator
frozen_source: packet/terminalprior
engine:
  name: jinja2
  undefined: StrictUndefined
  trim_blocks: false
  lstrip_blocks: false
  loader: FileSystemLoader
  searchpath:
  - output
  template: interfaces.j2
  macros: interfacemacros.j2
  driver_template: driver.j2
  driver_macros: drivermacros.j2
  macro_binding: from_import_with_context
  include_does_not_export_macros: true
context_contract:
  required:
    values:
      source: output/values.yaml
      type: mapping
    item_kind:
      type: string
      must_be_one_of: output/values.yaml item_kinds
    item:
      type: mapping
  optional:
    schema:
      source: packet/typeschema.yaml observed
    openapi:
      source: packet/openapi.yaml observed
    apis:
      source: packet/apiindex.yaml apis
    upstream_validation:
      source: packet/upstreamvalidation.yaml
    acquisition:
      source: packet/acquisition.yaml
    version_delta:
      source: packet/versiondelta.yaml
    source_index:
      source: packet/sourceindex.yaml
  forbidden:
  - invented_defaults
  - silent_profile_substitution
  - model_worker_outputs
walk:
  plan: output/values.yaml walk_plan
  one_carrier_per_item: true
  sample_limit: 0
  must_visit:
  - every schema.endpoints member
  - every schema.types member
  - every type properties member as field
  - every request path and query member as parameter
  - every enum members member
  - every request or response body
  - every attachedBehaviors member
  - every generics member
  - every inherits.type
  - every nested type expression
  - every variants mapping
  - every availability mapping
  - every endpoint requestMediaType and responseMediaType
  - every endpoint urls member
  - every openapi.paths method that is get put post delete head patch options
  - every openapi.paths path item including path-level parameters
  - every openapi.components.schemas member
  - every openapi.components.parameters member
  - every openapi.components.requestBodies member
  - every openapi.components.responses member
  - every apis member
  - every tagged REST specification body
  - every REST specification params member
  - every REST specification url path member
  - every REST specification path parts member
  - every upstream_validation.observed.generalErrors member
  - every values.untyped_endpoints member as unmatched if still request null
  - every values.error_types member
driver:
  render: output/driver.j2 once with values
  execute: coordinator only
  modes:
  - fixture
  - counts
  - project
  fixture_cases: output/values.yaml driver.fixture.cases
  do_not_claim_target_parser_pass: true
  full_existing_target_parser_timed_out: true
counts_must_match:
  endpoints: 556
  types: 3473
  interfaces: 1902
  enums: 305
  requests: 536
  responses: 536
  type_aliases: 194
  request_null_endpoints: 20
  dangling_types: 88
  api_index_per_tag: 557
  api_index_rows: 1114
  rest_bodies: 1114
  openapi_paths: 552
  openapi_operations: 803
  untyped_endpoints: 20
declaration_completeness:
  python_names_must_include:
  - keys
  - src
  - start
  jinja_set_statements_close_with: '-%}'
  jinja_set_must_not_close_with: '-}}'
  numeric_index_atoms: values.numbers
  table_key_atoms: values.python.lookup_keys
  schema_kind_atoms: values.schema_kinds
  http_method_atoms: values.http_methods
  closed_key_atoms: values.keys
  closed_key_jinja_access: values[values.keys_key]
  identity_class_atoms: values.identity_encoding.class
  request_response_slot: values.request_response_key
  boolean_like_yaml_keys_quoted: true
  python_keyword_true_atom: values.python.kw_true
  python_keyword_false_atom: values.python.kw_false
  python_keyword_none_atom: values.python.kw_none
  python_attr_get_atom: values.python.attr_get
  python_attr_items_atom: values.python.attr_items
  python_attr_update_atom: values.python.attr_update
  python_string_escapes: values.python.string_escapes
  source_java_loci_count: 52
deepkv_positive:
  description: Every rendered carrier must parse under deep::key::value::parse and
    deep::key::value::validate when the coordinator can run that parser. This worker
    does not claim that run.
  rules:
  - keys_only_from: output/values.yaml closed_keys
  - nonprotected_scalars_match: output/values.yaml urn.pattern
  - protected_prose_keys:
    - ShortDescription
    - LongDescription
  - ShortName_is_urn: true
  - KIND_is_urn: true
  - no_yaml_sequences: true
  - no_document_separators: true
  - no_block_scalars: true
  - no_aliases: true
  - no_comments: true
  - no_empty_branches: true
  - no_tabs: true
  - no_carriage_returns: true
  - indent_two_spaces: true
  - space_after_mapping_colon_for_scalars: true
  - unique_taxonomic_paths: true
  - branch_has_no_scalar: true
  - one_root_identity: true
positive_checks:
- id: catalog_renders
  item_kind: urn:silmaril:item:catalog
  item: {}
  expect:
    contains_keys:
    - IDENTITY
    - KIND
    - TYPE
    - METADATA
    identity: urn:silmaril:projection:interface:catalog
    kind: urn:silmaril:kind:catalog
    short_description_is_prose: true
    no_illegal_keys: true
    parse: accept
- id: typed_endpoint_bulk
  item_kind: urn:silmaril:item:endpoint
  item_source: schema.endpoints name bulk
  expect:
    identity_legal: true
    input_present: true
    output_present: true
    flags_streaming: true
    short_description_original: bulk
    parse: accept
- id: untyped_endpoint_capabilities
  item_kind: urn:silmaril:item:endpoint
  item_source: schema.endpoints name capabilities
  expect:
    status: urn:silmaril:status:untyped
    gap: urn:silmaril:gap:untyped:endpoint
    input: urn:silmaril:value:null
    output: urn:silmaril:value:null
    short_description_original: capabilities
    parse: accept
- id: request_type_global_bulk
  item_kind: urn:silmaril:item:type
  item_source: schema.types kind request name.namespace _global.bulk
  expect:
    kind: urn:silmaril:kind:request
    short_description_contains: _global.bulk
    parse: accept
- id: enum_failure_store_status
  item_kind: urn:silmaril:item:type
  item_source: schema.types kind enum name.name FailureStoreStatus
  expect:
    kind: urn:silmaril:kind:enum
    parse: accept
- id: dangling_errorcause_not_confused
  item_kind: urn:silmaril:item:dangling
  item:
    original: "Dangling type '_types:HttpMethod'"
  expect:
    status: urn:silmaril:status:dangling
    gap: urn:silmaril:gap:dangling:type
    short_description_exact: "Dangling type '_types:HttpMethod'"
    parse: accept
- id: error_type_cause
  item_kind: urn:silmaril:item:error
  item_source: values.error_types original ErrorCause
  expect:
    error_axis: urn:silmaril:axis:error
    parse: accept
- id: api_index_common_unmatched
  item_kind: urn:silmaril:item:index
  item_source: apis api _common tag v8.18.8
  expect:
    gap: urn:silmaril:gap:unmatched:coverage
    short_description_contains: _common
    parse: accept
- id: all_endpoints_walked
  walk: schema.endpoints
  expect_count: 556
- id: all_types_walked
  walk: schema.types
  expect_count: 3473
- id: all_dangling_walked
  walk: upstream_validation.observed.generalErrors
  expect_count: 88
- id: all_rest_bodies_walked
  walk: packet/api specification bodies
  expect_count: 1114
- id: endpointErrors_empty_not_validity
  observe: upstream_validation.observed.endpointErrors
  equals: {}
  does_not_mean: all schemas valid
- id: literals_from_values
  rule: every emitted structural token is a value from output/values.yaml
- id: injective_identity
  rule: encode_identity must keep collision_pairs distinct and reversible
- id: ontology_bindings_legal
  expect:
    basic: urn:silmaril:ontology:basic:formal
    common: urn:silmaril:ontology:common:core
    process: urn:silmaril:ontology:process:cognitive
    originals_only_in_prose:
    - Ontology.Basic.Formal
    - Ontology.Common.Core
    - Ontology.Process.Cognitive
- id: python_names_complete
  rule: values.python.names must declare every identifier referenced by py_name including
    keys src start
- id: jinja_set_closers
  rule: every set statement closes with -%} not -}}
negative_checks:
- id: reject_illegal_key
  carrier: "Rest: urn:silmaril:value\n"
  expect:
    parse: reject
    reason: closed key or reference rejected
- id: reject_formal_key
  carrier: "Formal: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_interface_key
  carrier: "Interface: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_edition_key
  carrier: "Edition: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_digit_key
  carrier: "8: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_unknown_key
  carrier: "UNKNOWN: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_underscore_urn
  carrier: "IDENTITY: urn:silmaril:bad_name\n"
  expect:
    parse: reject
- id: reject_hyphen_urn
  carrier: "IDENTITY: urn:silmaril:bad-name\n"
  expect:
    parse: reject
- id: reject_prose_shortname
  carrier: "METADATA:\n  ShortName: free prose\n"
  expect:
    parse: reject
- id: reject_kind_prose
  carrier: "KIND: specification\n"
  expect:
    parse: reject
- id: reject_sequence
  carrier: "IDENTITY:\n- urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_document_separator
  carrier: "---\nIDENTITY: urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_block_scalar
  carrier: "ShortDescription: |\n  prose\n"
  expect:
    parse: reject
- id: reject_alias
  carrier: "IDENTITY: &x urn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_comment
  carrier: "IDENTITY: urn:silmaril:value # comment\n"
  expect:
    parse: reject
- id: reject_empty_branch
  carrier: "METADATA:\n"
  expect:
    parse: reject
- id: reject_blank_scalar
  carrier: "IDENTITY: \n"
  expect:
    parse: reject
- id: reject_tab
  carrier: "IDENTITY:\turn:silmaril:value\n"
  expect:
    parse: reject
- id: reject_hex_hash_as_urn
  carrier: "DIGEST: fd93ddb993ec00b606d46ffb6fac7c171b01119e3ad7a9ce2a482b9158b42990\n"
  expect:
    parse: reject
    reason: raw hex is not an alphabetic URN
- id: reject_false_admission
  rule: a rendered carrier must not claim an illegal foreign name is an admitted URN
- id: reject_runtime_claim
  rule: no rendered carrier may attest CPG, runtime, independent review, or exact
    tag proof
- id: reject_many_to_one_legalize
  rule: foo_bar and foo.bar and foo-bar must not share one encoded identity
undefined_checks:
- missing_values_raises: true
- missing_item_kind_raises: true
- missing_item_raises: true
- unknown_item_kind_emits_unmatched_carrier: true
separation:
  operational_files:
  - output/values.yaml
  - output/joins.yaml
  - output/validation.yaml
  - output/handoff.yaml
  carrier_emitters:
  - output/interfaces.j2
  - output/interfacemacros.j2
  driver_emitters:
  - output/driver.j2
  - output/drivermacros.j2
  do_not_parse_operational_as_deepkv: true
execution_claims:
  worker_executed_render: false
  worker_executed_driver: false
  worker_executed_target_parser: false
  coordinator_retains_actual_receipts: true
  this_worker_invents_no_receipt: true
tests:
  proposed_not_executed_by_this_worker:
    source: output/validation.yaml positive_checks negative_checks undefined_checks
      and output/values.yaml driver.fixture.cases
    status: unexecuted
    note: Coordinator must render under ordinary dict StrictUndefined, compile, and
      run fixture counts and project. This worker did not run those checks.
  frozen_coordinator_executed_failures:
  - id: driver_root_strictundefined_boolean_key
    source: packet/interfacefixonedrivervalidation.yaml
    context: ordinary dict values with StrictUndefined
    status: fail
    error: UndefinedError dict object has no attribute True
    location: drivermacros emit_program_tail K.True
    proposed_repair: quote boolean-like YAML keys and emit K[values.python.kw_true]
    executed_by: coordinator
    executed_by_this_worker: false
  - id: catalog_keys_mapping_collision
    source: packet/interfacefixdiagnostics.yaml
    context: normal unmodified dict
    status: fail
    error: UndefinedError builtin_function_or_method object has no attribute IDENTITY
    location: interfacemacros emit_spine values.keys.IDENTITY
    proposed_repair: values[values.keys_key].IDENTITY
    executed_by: coordinator
    executed_by_this_worker: false
  - id: rest_body_keys_mapping_collision
    source: packet/interfacefixdiagnostics.yaml
    context: normal unmodified dict
    status: fail
    error: UndefinedError builtin_function_or_method object has no attribute IDENTITY
    executed_by: coordinator
    executed_by_this_worker: false
  - id: api_index_keys_mapping_collision
    source: packet/interfacefixdiagnostics.yaml
    context: normal unmodified dict
    status: fail
    error: UndefinedError builtin_function_or_method object has no attribute IDENTITY
    executed_by: coordinator
    executed_by_this_worker: false
  - id: boolean_aliases_python_unterminated_literal
    source: packet/interfacefixdiagnostics.yaml
    context: In-memory diagnostic only; source files unchanged; not a product fix
    render: pass
    status: fail
    error: SyntaxError unterminated string literal at line 12 sys.stderr.write(str(msg)
      + quote then raw newline
    proposed_repair: reusable py_str character escapes for newline tabs CR quotes
      backslashes and non-ASCII
    executed_by: coordinator
    executed_by_this_worker: false
  - id: boolean_aliases_keyfirst_python_unterminated_literal
    source: packet/interfacefixdiagnostics.yaml
    context: In-memory diagnostic only; source files unchanged; not a product fix
    render: pass
    status: fail
    error: SyntaxError unterminated string literal at line 12
    executed_by: coordinator
    executed_by_this_worker: false
  prior_frozen_failures_retained:
  - id: dispatch_item_undefined_from_include
    source: packet/actualrender.yaml
    status: fail
    repair_present_in_seeded_templates: from_import_with_context
  - id: set_identity_closed_with_output_braces
    source: packet/interfacerepaircarriercontrols.yaml
    status: fail
    repair_present_in_seeded_templates: set statements close with -%}
  - id: python_names_missing_src
    source: packet/interfacerepaironevalidation.yaml
    status: fail
    repair_present_in_seeded_values: python.names keys src start
  target_parser:
    full_existing_target_parser_timed_out: true
    worker_claim: not claimed
    status: unexecuted
