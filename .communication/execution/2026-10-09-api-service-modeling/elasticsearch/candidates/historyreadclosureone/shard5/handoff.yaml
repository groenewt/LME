sidecar_versus_consumer: |-
  No assigned body proves an Elasticsearch sidecar unit besides the
  generated 05dc two-line Image= fragment. NativeElastic, telemetry
  Elastic adapter, HertzBeat sinks:elastic, check_agent_reporting,
  export_dashboards, check_fleet_api, and Selenium are consumers.
  volume.j2 esdata01 is a volume resource. 9200/5601 in Azure README
  and render_port 9200:9200 are network/publish examples.
  d3d6 NFS Volume mount is a deployment/volume resource for
  lme-elasticsearch in a control/test installer. Do not treat every
  mention as a sidecar.
