- id: F-LIFE-CHAIN
  severity: medium
  location:
    path: packet/reviewcandidate/lifecycle.yaml
    digest: a4c7e3e6c32b180c2f66b25ceff38b6cbe715a579deda2ef4b71ac4fd36b4bbe
    lines: "61-88"
  issue: STAGE run PRECEDES stop and stop FOLLOWS run, but NEXT under run is recovery then stop. Recovery has no FOLLOWS/PRECEDES. Recovery is not a successor of serving traffic in Node.java; local translog recovery is part of engine open, and NodeConnectionsService/GatewayService/Coordinator start after SearchService at 311-316.
  impact: Flow keys contradict the NEXT spine. Interrupted apply/resume and rolling-upgrade stages cannot be ordered from this chain.
