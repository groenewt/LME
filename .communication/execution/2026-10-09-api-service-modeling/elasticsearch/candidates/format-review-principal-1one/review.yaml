  why: DeepKV forbids unregistered keys and duplicate taxonomic paths. macros.j2 writes vendor header names, HTTP method tokens, and params as mapping keys, then repeats METADATA once per apiindex row at one parent. That is a category error, not a leftover catalog key. Parser timeout is an engine-control failure that blocks acceptance independently of this candidate.
  scope: Elasticsearch service-domain component and its declared joins only. Typed-interface, configuration, graph, and history workers are pending edges, not pretended complete.
