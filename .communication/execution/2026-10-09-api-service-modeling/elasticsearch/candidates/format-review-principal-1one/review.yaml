findings:
- id: F-PROJ-KEYS
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: "91-97,119-122,165-175"
  related:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: "54-66,76,83"
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: "1-2"
  issue: The renderer treats vendor REST surface as DeepKV keys. project_header emits X-elastic-product as a mapping key. project_spec_paths emits GET/POST/PUT/DELETE/HEAD/PATCH as mapping keys whose values are URL paths. The _common branch emits params as a mapping key. None of those names are in the closed registry. Hyphen in X-elastic-product also violates the naming protocol.
  impact: |-
    A render that returns pass still produces a document deep::key::value::parse must reject at key::read. Native checks never ran on that document. Coverage-family complete cannot become true from this projection.
  suggestion: Keep method tokens, paths, header names, and params in operational apiindex or METADATA LongDescription. Project each family as a closed-key node with IDENTITY, KIND, DENOTES, CONSUMES, and prose. Do not place rendering.yaml header_product_name or method_* values in key position.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
  - header-product
  - closed-keys-and-alphabetic-urns
  - invented-registry
- id: F-PROJ-DUP
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: "151-163"
  related:
  - path: packet/apiindex.yaml
    lines: "1-10,1782-1788,2573-2579,2769-2775"
  issue: project_index walks all 1114 apiindex rows as siblings under one parent. Each row emits METADATA then unwrap. Parser path identity is parent plus key suffix, so the second METADATA is SIL_VIOLATION_GRAPH_COLLAPSE. Two tags also repeat the same GET/HEAD/params keys. The params loop emits the key params once per parameter name.
  impact: Even a hypothetical rewrite that registered GET would still fail duplicate-path validation on the first repeated METADATA. ping versus info is not the duplicate; the iterator shape is.
  suggestion: Iterate 557 families per edition, each under its own IDENTITY via MEMBER/NEXT, not 1114 sibling METADATA blocks. Dedupe edition pairs by source_sha256. Emit _common parameters as nested PARAMETER nodes or prose, never repeated params keys.
  requirements:
  - known-invalid-emitted-deepkv
  - coverage-family-count
  - duplicate-identity
  - illegal-key-depth
- id: F-PROJ-ARCHITECTURE
  severity: high
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: "13-15,129-175"
  related:
  - path: packet/reviewcandidate/interfaces.yaml
    digest: 4af99898e8f36d385909c1e8040ed19e6cb23438f248992d90f1551271b13f1c
    lines: "22-29,40-51,110-113"
  issue: The carrier repair joins apiindex and refuses unregistered family grouping keys. The Jinja entry path re-expands the vendor catalog. project_family exists and is unused. project_model never walks service.yaml MEMBER. fail() prints VALIDATIONFAILCLOSED instead of aborting the template. catalog and history context in rendering.yaml are unused.
  impact: Two architectures now coexist. Carriers look closed. The declared YIELDS projection is the illegal one. A missing packet or unknown method can still yield a passing render with poison text.
  suggestion: Make project_model fail the template on missing packet, unknown method, or empty typed overlay if overlay is required. Drive family emission from closed-key nodes, not from raw spec.url.paths. Treat VALIDATIONFAILCLOSED as a render failure, not an emitted scalar.
  requirements:
  - known-invalid-emitted-deepkv
  - unresolved-endpoint
  - silent-literal-absence
  - manual-family-expansion
- id: F-PARSER-TIMEOUT
  severity: high
  location:
    path: packet/reviewreceipts/parsercontrolslifecycle.yaml
    digest: not-in-candidateidentity
    lines: "21-29"
  related:
  - path: packet/reviewcandidate/validation.yaml
    digest: 77bd14a84f21804f9f8707fef3619a9d70a089c37b1ef53f9a7f2a19fcf14463
    lines: "20-22,70-88,145-154"
  issue: |-
    Actual target parser controls timed out at 300 seconds on a one-line valid KIND fixture after boot. Isolated reference validation of the same URN succeeded. This candidate therefore has no completed deep::key::value::parse result. Native eleven-carrier checks and Jinja render do not close the parser requirement.
  impact: Acceptance stays blocked even for a hypothetical lawful carrier. Large NEXT chains in registry.yaml would be more expensive if parse ever started. The timeout is not evidence that these carriers are valid.
  suggestion: Keep parser status blocked/unexecuted until valid_kind and then each DeepKV carrier complete under the real parser. Do not treat native regex as a substitute. Do not re-run parser from this review lane.
  requirements:
  - target-parser-timeout
  - native-eleven-not-target-parser
