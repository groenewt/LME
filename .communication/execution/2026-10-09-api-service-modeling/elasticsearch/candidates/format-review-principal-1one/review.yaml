positive_observations:
- The eleven DeepKV carriers abandoned MEMBER Cluster/Formal/Catalog grouping keys that packet/modelcontractone.yaml rejected. interfaces.yaml joins apiindex instead of minting 557 family keys.
- "Ontology anchors are colon-descended (ontology:basic:formal) rather than dotted Ontology.Basic.Formal, matching the reference validator isolation receipt."
- Hashes, numeric counts, v8.18.x spellings, and setting names live in provenance.yaml and LongDescription, not as URN digit segments.
- Coverage family complete, cpg-extracted, runtime execution, official 8.18 web retrieval, and introducing-commit authorship are explicitly not claimed.
- Ping and info stay distinct witnesses; RestMainAction actually registers both methods on /.
- ThreadPool.Names 80-110 and THREAD_POOL_TYPES entries are complete in resources.yaml.
- Circuit-breaker defaults, product header 89-90, authenticate line 129, authorize line 267, and NoopHostnameVerifier 242-256 match Java line fields.
- SSL no-verify is modeled as a vendor switch plus a consumer constraint, not as executed LME TLS or as a missing Elasticsearch feature.
- Editions are not collapsed. REST production api JSON absence in versiondelta.yaml is labeled inferred. Priority 52-file blame is not treated as introducing-commit proof.
- Jinja lookup MEMBER.Literal.Newline is forbidden and replaced with literals.newline, which is the operational mapping the prior macros lacked.
