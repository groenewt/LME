- id: F-CITE-RESTMAIN
  severity: high
  location:
    path: packet/reviewcandidate/provenance.yaml
    digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
    lines: "93-101"
  related:
  - path: packet/source/v8.18.8/modules.rest-root.src.main.java.org.elasticsearch.rest.root.RestMainAction.java.yaml
