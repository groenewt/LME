schema_version: 1
role: interface_candidate_handoff
not_a_deepkv_carrier: true
service: Elasticsearch
worker: interfacequotefix
model: cursor-grok-4.6-xhigh
frozen_source: packet/terminallatest
other_actors_preserved: true
original_packet_bytes_not_rewritten: true
candidate:
  values: output/values.yaml
  template: output/interfaces.j2
  macros: output/interfacemacros.j2
  driver: output/driver.j2
  driver_macros: output/drivermacros.j2
  joins: output/joins.yaml
  validation: output/validation.yaml
do_not_write:
- canonical shared files
- other worker outputs
- model worker outputs
- service domain internals
- parser registry
- lexicon as if admitted
integrate_with:
  coordinator_render: true
  coordinator_driver: true
  main_lexicon_adjudication: true
  model_worker: consume joins only; do not edit model outputs
packet_inputs:
- packet/parsercontract.yaml
- packet/typeschema.yaml
- packet/openapi.yaml
- packet/apiindex.yaml
- packet/upstreamvalidation.yaml
- packet/acquisition.yaml
- packet/versiondelta.yaml
- packet/sourceindex.yaml
- packet/modelcontracts.yaml
- packet/actualrender.yaml
- packet/actualsyntax.yaml
- packet/interfacerepaircarriercontrols.yaml
- packet/interfacedeclarationdiagnostic.yaml
- packet/interfacerepaironevalidation.yaml
- packet/interfacefixdiagnostics.yaml
- packet/interfacefixonedrivervalidation.yaml
- packet/interfacefixnextonerender.yaml
- packet/terminallatest/values.yaml
- packet/terminallatest/interfaces.j2
- packet/terminallatest/interfacemacros.j2
- packet/terminallatest/driver.j2
- packet/terminallatest/drivermacros.j2
- packet/terminallatest/joins.yaml
- packet/terminallatest/validation.yaml
- packet/terminallatest/handoff.yaml
- packet/terminalnext/values.yaml
- packet/terminalnext/interfaces.j2
- packet/terminalnext/interfacemacros.j2
- packet/terminalnext/driver.j2
- packet/terminalnext/drivermacros.j2
- packet/terminalnext/joins.yaml
- packet/terminalnext/validation.yaml
- packet/terminalnext/handoff.yaml
- packet/terminalprior/values.yaml
- packet/terminalprior/interfaces.j2
- packet/terminalprior/interfacemacros.j2
- packet/terminalprior/driver.j2
- packet/terminalprior/drivermacros.j2
- packet/terminalprior/joins.yaml
- packet/terminalprior/validation.yaml
- packet/terminalprior/handoff.yaml
pending_common_nine_file_packet_included: false
parser_excerpt_sha256: 00dc3d035e350278ffa0f40fe4c924974c4d41225d7501047fa9fd277aa2c912
context_load:
  values: read output/values.yaml as a mapping named values
  schema: read packet/typeschema.yaml observed mapping
  openapi: read packet/openapi.yaml observed mapping
  apis: read packet/apiindex.yaml apis sequence
  upstream_validation: read packet/upstreamvalidation.yaml
  item_kind: one values.item_kinds URN
  item: one walk member shaped as declared in values.context_contract.item_is
render:
  environment:
    undefined: StrictUndefined
    trim_blocks: false
    lstrip_blocks: false
    loader_searchpath:
    - output
  invoke: render output/interfaces.j2 once per walk item
  import: interfaces.j2 uses from-import with context of dispatch_item from interfacemacros.j2
  include_does_not_export_macros: true
  prior_failure: UndefinedError dispatch_item is undefined because include does not export macros
  carrier_syntax_failure: TemplateSyntaxError unexpected '}' because set statements closed with -}}
  driver_name_failure: UndefinedError values.python.names has no attribute src; static
    diagnostic also required keys and start
  driver_boolean_key_failure: UndefinedError dict object has no attribute True because
    unquoted YAML True False keys load as booleans
  carrier_keys_collision_failure: UndefinedError builtin_function_or_method object has
    no attribute IDENTITY because values.keys is dict.keys
  driver_python_literal_failure: SyntaxError unterminated string literal because py_str
    emitted a raw newline inside quotes
  driver_python_unquoted_string_failure: SyntaxError invalid syntax at line 724 return
    False, duplicate identity collision because python.strings values were emitted
    without py_quote
  output: one DeepKV document per invoke
  do_not_concatenate_without_separate_parse: true
driver:
  invoke: render output/driver.j2 once with values
  import: driver.j2 uses from-import with context of emit_driver from drivermacros.j2
  execute: coordinator runs the rendered Python in fixture, counts, and project modes
  loads: every packet source including all 1114 REST specification bodies
  walk: every schema endpoint type property parameter member body union expression plus every OpenAPI operation and component plus every tagged REST body plus every REST param and path
  identity: injective reversible alphabetic encoding with collision detection
  do_not_claim_target_parser_pass: true
walk_order: output/values.yaml walk_plan
coverage_minimum:
  endpoints: 556
  types: 3473
  dangling: 88
  api_index_rows: 1114
  rest_bodies: 1114
  openapi_operations: 803
  openapi_paths: 552
  untyped_endpoints: 20
joins_for_coordinator:
  file: output/joins.yaml
  keep_visible:
  - 20 untyped schema endpoints
  - 88 dangling types
  - 556 versus 803 versus 552 versus 557 coverage
  - branch 8.18 versus tags v8.18.8 and v8.18.7 unproven equivalence
  - empty endpointErrors is not validity
  - missing OpenAPI securitySchemes
  - REST api yaml bodies are materialized and must be walked
  - missing CPG runtime independent review and blame
lexicon:
  file: output/values.yaml lexicon_extensions_for_main
  status: proposed
  owner: MAIN
  do_not_patch: registry::deep::key::value::data
  keep_foreign_names_in:
  - ShortDescription
  - LongDescription
  - output/values.yaml provenance_specimens
ontology:
  bind_only_legal_urns: true
  originals_remain_prose:
  - Ontology.Basic.Formal
  - Ontology.Common.Core
  - Ontology.Process.Cognitive
validation:
  file: output/validation.yaml
  run_positive_before_accept: true
  run_negative_before_accept: true
  run_driver_fixture_before_accept: true
  strict_undefined: true
  parse_each_carrier_with_deep_key_value: true
  do_not_parse_operational_yaml_as_deepkv: true
  do_not_claim_target_parser_pass: true
source_versus_proof:
  source_derived_ok:
  - official schema endpoints and types
  - official OpenAPI paths operations schemas parameters requestBodies responses
  - tag REST index names paths digests and materialized specification bodies
  - upstream validation-errors.json observations
  not_supplied_do_not_claim:
  - CPG
  - runtime
  - independent review
  - exact patch-tag proof
  - introducing-commit blame
  - tag-exact schema semantics
sourceindex_instruction: Representative Java modules stay in packet/sourceindex.yaml.
  Do not author service domain internals from them and do not treat them as interface
  carriers or CPG edges.
api_bodies_instruction: packet/api/v8.18.8 and packet/api/v8.18.7 files are cited
  by packet/apiindex.yaml and are materialized in this packet. Walk all 1114 bodies
  and still join by name, path, sha256, and source_sha256.
security_instruction: Do not invent components.securitySchemes. Security types remain
  in schema.types and endpoint descriptions.
media_instruction: Account for application/json, application/x-ndjson, text/plain,
  text/event-stream, and application/vnd.mapbox-vector-tile exactly as observed.
error_instruction: Preserve ErrorCause and ErrorResponseBase as the typed error axis.
  Preserve all 88 dangling type strings exactly, including the Dangling type prefix
  on rendered dangling carriers.
edition_instruction: v8.18.8 commit c1310008a98b8bb63c9fc08e763de1d065b943ce and
  v8.18.7 commit 4ee681e2f5c63d2cd0aea062bb3a4c247ec2ffe0 are edition provenance,
  not schema identity.
schema_instruction: specification commit 090baacf9e28f8f72bf9cd087c87737d280c294c
  ref 8.18 is the typed request-response authority in this packet.
parser_excerpt: closed keys and reference regex are taken from the bound packet parser
  excerpt sha256 00dc3d035e350278ffa0f40fe4c924974c4d41225d7501047fa9fd277aa2c912
success_means:
  - every declared output exists
  - coordinator can render every walk item under StrictUndefined after from-import
  - coordinator can render and run the driver
  - every rendered carrier uses only closed keys and alphabetic URNs
  - exact source names commits paths and digests remain in protected prose or operational
    provenance
  - unmatched coverage remains visible
  - source runtime CPG and unknown remain distinct
  - no shared writes
  - this worker does not invent an execution receipt
  - boolean-like YAML keys are quoted strings
  - closed keys are read by item access not dict.keys
  - generated Python string literals escape newline tab CR quote backslash and non-ASCII
  - python.strings payloads emit through py_quote with declared dquote wrap
failure_means:
  - sample-limited catalog
  - prose-only replacement of fields
  - raw upstream schema treated as the final model
  - illegal URN claimed admitted
  - CPG or runtime claimed
  - include used for macros
  - many-to-one legalize collision
  - model worker outputs edited
  - target parser pass claimed
  - set statements closed with output braces
  - undeclared python.names identifiers
  - unquoted True False None true false null n y keys
  - values.keys attribute lookup
  - raw newline inside generated Python quotes
  - unquoted python.strings values emitted as Python tokens
repaired_from_actual_receipts:
  - TemplateSyntaxError unexpected '}' at interfacemacros set identity closed with -}}
  - UndefinedError values.python.names.src
  - static missing_declared_names keys src start
  - prior dispatch_item undefined from include retained as from-import
  - UndefinedError dict object has no attribute True at K.True
  - UndefinedError builtin_function_or_method object has no attribute IDENTITY at values.keys.IDENTITY
  - SyntaxError unterminated string literal at py_str newline
  - reserved mapping attribute lookups get items update on python.attrs and names
  - SyntaxError invalid syntax at line 724 return False, duplicate identity collision
actual_reads:
  read:
  - task.yaml
  - packet/interfacefixdiagnostics.yaml
  - packet/interfacefixonedrivervalidation.yaml
  - packet/interfacefixnextonerender.yaml
  - packet/terminallatest/values.yaml
  - packet/terminallatest/interfaces.j2
  - packet/terminallatest/interfacemacros.j2
  - packet/terminallatest/driver.j2
  - packet/terminallatest/drivermacros.j2
  - packet/terminallatest/joins.yaml
  - packet/terminallatest/validation.yaml
  - packet/terminallatest/handoff.yaml
  - packet/interfacedeclarationdiagnostic.yaml
  - packet/actualrender.yaml
  - packet/actualsyntax.yaml
  - packet/interfacerepaircarriercontrols.yaml
  - packet/interfacerepaironevalidation.yaml
  - packet/parsercontract.yaml
  - packet/typeschema.yaml
  - packet/openapi.yaml
  - packet/apiindex.yaml
  - packet/upstreamvalidation.yaml
  - packet/acquisition.yaml
  - packet/versiondelta.yaml
  - packet/sourceindex.yaml
  - packet/modelcontracts.yaml
  - output/values.yaml
  - output/interfaces.j2
  - output/interfacemacros.j2
  - output/driver.j2
  - output/drivermacros.j2
  - output/joins.yaml
  - output/validation.yaml
  - output/handoff.yaml
  enumerated_not_fully_read:
    packet_api_yaml_files: 1114
    apiindex_tag_rows: 1114
    dangling_type_strings: 88
    sourceindex_loci: 52
    typeschema_and_openapi_bodies: headers only; full walk is driver work for the
      coordinator
  not_read:
  - global skills
  - plugins
  - outside canonical sources
  - shared worker outputs for write
tests:
  proposed: output/validation.yaml positive_checks negative_checks undefined_checks
    and output/values.yaml driver.fixture.cases
  proposed_status: unexecuted_by_this_worker
  executed_by_this_worker: []
  frozen_executed_failures_not_re_run_here:
  - packet/interfacefixonedrivervalidation.yaml
  - packet/interfacefixdiagnostics.yaml
  - packet/interfacefixnextonerender.yaml
  do_not_treat_proposed_as_executed: true
  do_not_claim_target_parser_pass: true
worker_does_not_claim_coordinator_execution: true
