schema_version: "1"
kind: elasticsearch_settings_extraction_validation
service: Elasticsearch
pending_common_nine_file_packet: not_included
rejected_prior_pattern:
  tokens:
    - "{{ v.python_program }}"
    - "{{ v.python_projector }}"
  reason: opaque script dumps in YAML are rejected
  related_quoting_failure:
    path: packet/relatedquotingfailure.yaml
    errors:
      - UndefinedError("'dict object' has no attribute 'TRUE'")
      - SyntaxError('unterminated string literal (detected at line 197)')
    mitigations:
      boolean_like_keys: quote YAML boolean-like mapping keys; emit Python True/False from true_word/false_word atoms
      python_strings: emit_py_string and emit_py_dstring escape backslash, quotes, newline, cr, and tab
      reserved_lookup: bracket lookup for reserved dictionary keys via qk/dget/dset
      jinja_dictionary_attribute_collisions:
        collision_count: 177
        colliding_attributes:
          - values
          - get
          - keys
          - pop
          - setdefault
        lookup: explicit mapping brackets through python.bracket_keys and jitem for one scalar
        preserve_emitted_dict_methods: stdlib values_method, get, keys, pop, and setdefault remain generated method calls
        diagnostic_key_first_mapping: not_a_product_fix
      jinja_nested_macro_type_loss:
        error: "UndefinedError: 'str object' has no attribute 'argv'"
        cause: nested jitem macros stringify mappings before argv lookup
        lookup: typed Jinja bracket traversal through declared keys until the final scalar, then serialize the scalar
        native_context_overrides: false
        string_eval: false
        extractor_path: bound_argv_flag in extractormacros.j2 fn_main
        projector_path: bound_argv_flag imported into settingsmacros.j2 fn_projector_main
        remaining_jitem_calls_are_scalar:
          - vpath python.identifiers values_attr
          - dget python.stdlib get_attr
          - dgetd python.stdlib get_attr
          - dgett python.stdlib get_attr
      bootstrap:
        extractor: bound_argv_flag serializes render.argv.values_flag after typed bracket traversal at Jinja generation time
        projector: bound_argv_flag serializes render.argv.values_flag after typed bracket traversal at Jinja generation time
        not_from_uninitialized_runtime_values: true
        unbound_symptom: "UnboundLocalError: main uses values[render][argv][values_flag] before values is loaded"
syntax_render:
  separate_from_semantic_validation: true
  undefined_class: jinja2.StrictUndefined
  loader_class: jinja2.FileSystemLoader
  autoescape: false
  keep_trailing_newline: true
  trim_blocks: false
  lstrip_blocks: false
  import_with_context: true
  include_does_not_export_macros: true
  searchpath:
    - output
  templates:
    extractor: extractor.j2
    extractormacros: extractormacros.j2
    settings: settings.j2
    settingsmacros: settingsmacros.j2
  values_file: output/values.yaml
  context_keys:
    - values
    - record
    - extracted
    - fixture
    - projection_mode
    - join
    - behavior_topic
    - behavior_citation
  filters: []
  tests: []
  globals: []
render_python:
  program: python3
  extractor_module: rendered from extractor.j2 via emit_python_program
  projector_module: rendered from settings.j2 with projection_mode program via emit_python_projector
argv:
  extractor:
    - python3
    - EXTRACTOR_RENDERED.py
    - --values
    - output/values.yaml
    - --sourceindex
    - packet/sourceindex.yaml
    - --packet-root
    - packet
    - --output-dir
    - OUTPUT_DIR
    - --parsercontract
    - packet/parsercontract.yaml
  extractor_fixture_repeatable:
    flag: --fixture
    names:
      - missing_source
      - changed_sha
      - duplicate_keys
      - unsupported_declaration_expression
      - version_contradiction
      - invalid_target_plain_value
      - invalid_target_dotted
      - invalid_target_numeric_version
      - valid_target_alphabetic_kind
      - positive_example_custom_settings
  projector:
    - python3
    - PROJECTOR_RENDERED.py
    - --values
    - output/values.yaml
    - --output-dir
    - OUTPUT_DIR
    - --extracted
    - OUTPUT_DIR/operational.yaml
expected_exit:
  success: 0
  validation_failure: 1
  usage_failure: 2
negative_controls_must_alter_input:
  duplicate_keys: compose_java_setting_line appends a second custom.simple declaration to reconstructed text
  unsupported_declaration_expression: compose_java_setting_line appends Setting.simpleString(DYNAMIC_KEY, ...) to reconstructed text
  changed_sha: apply_fixtures rewrites sourceindex sha256
  missing_source: named packet is not opened
  version_contradiction: cloned sourceindex row with distinct sha256
urn:
  pattern: "^urn:silmaril:([a-z]+|[A-Z][a-z]*)(:([a-z]+|[A-Z][a-z]*))*$"
  lexical_grammar_separate_from_kind_constraint: true
  accepted_kind_specimen: "urn:silmaril:elasticsearch:setting"
  accepted_kind_service_specimen: "urn:silmaril:kind:service"
  lexical_positive_not_negative:
    - "urn:silmaril:value"
    - "urn:silmaril:elasticsearch:v"
    - "urn:silmaril:Ab:c"
  rejected_plain_value: service
  rejected_dotted_anchor_specimen: "urn:silmaril:elasticsearch.setting"
  rejected_dotted_ontology_specimen: "urn:silmaril:anchor:Ontology.Basic.Formal"
  rejected_numeric_version_specimen: "urn:silmaril:version:8:18:8"
  rejected_numeric_uppercase_following: "urn:silmaril:A:123"
  rejected_hyphenated_uppercase_following: "urn:silmaril:A:bad-key"
  rejected_empty_segment_uppercase: "urn:silmaril:A:"
  rejected_numeric_lowercase_following: "urn:silmaril:a:123"
  every_segment_validated: true
  no_uppercase_one_letter_short_circuit: true
  no_fixture_exact_value_blacklist: true
  actual_target_reference_validator: accepted alphabetic kind URN and rejected plain value, dotted anchor, and numeric version specimens
  actual_target_reference_validator_status: isolated_exit_zero_not_full_parser_proof
  prior_independent_control_failures: 5
  prior_independent_controls_remain_failed_until_coordinator_rerun: true
deepkv:
  closed_keys_only: true
  alphabetic_urns: true
  forbidden_scalar_prefixes:
    - "{"
    - "["
    - "&"
    - "*"
    - "|"
    - ">"
    - "#"
    - "!"
parsercontract:
