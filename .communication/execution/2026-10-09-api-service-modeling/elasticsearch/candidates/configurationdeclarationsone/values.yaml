    path: plugins/examples/custom-settings/src/main/java/org/elasticsearch/example/customsettings/ExampleCustomSettingsConfig.java
    expect_key_kind: expression
    expect_disposition: extracted
    inject:
      indent: "    "
      field: EXPRESSION_SETTING
      factory: simpleString
      qualifier: Setting
      key_identifier: DYNAMIC_KEY
      key_is_identifier: true
      properties:
        - NodeScope
