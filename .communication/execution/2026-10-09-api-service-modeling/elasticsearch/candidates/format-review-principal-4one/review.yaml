findings:
- id: F-RENDER-VENDOR-KEYS
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 91-97, 119-122, 165-175
  additional_locations:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 54-66, 78-84, 86-91
  - path: packet/reviewcandidate/registry.yaml
    digest: 42ae6db8e0e8c5db950b853806bac2d49b3f195552e71b97249c8e3086462958
    lines: 28, 442-446
  issue: The Jinja projection emits vendor REST surface as YAML mapping keys. project_header writes X-elastic-product. project_spec_paths writes GET/POST/PUT/DELETE/HEAD/PATCH as keys. unwrap_and_project writes params as a key for params-only specs such as _common (apiindex keys documentation, params). Those spellings are not in registry::deep::key::value::data. Hyphen in X-elastic-product also violates the no-hyphen key law. rendering.yaml both forbids unregistered keys and supplies these spellings as literals that macros then promote to keys. Coordinator render pass with 1114 packets therefore produced an invalid DeepKV document.
  impact: The only executed whole-index projection cannot be parsed as DeepKV. Coverage-family-complete remains unqualified. Downstream consumers that treat model.yaml as the service model receive illegal keys, not a closed taxonomy. Native carrier checks cannot see this failure because they do not parse the render output.
  suggestion: Keep vendor method tokens, header names, param names, and paths as VALUES under closed keys (ACTION, PARAMETERS, DENOTES, METADATA.LongDescription) or as operational join records. Do not emit them as keys. Abort the template on unknown method instead of writing those tokens as keys. Do not treat the existing Jinja pass as acceptance.
  requirements:
  - R-known-invalid-emit
  - R-universal-representation
  - urn:silmaril:require:parser:deep:key:value
- id: F-RENDER-DUP-PATH
  severity: critical
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 91-97, 119-122, 151-163, 169-175
  issue: Even if GET or METADATA were registered, project_index emits them as siblings at document root for every apiindex row. Parser path identity is parent_path plus key identity, so a second METADATA or second GET under the same parent is SIL_VIOLATION_GRAPH_COLLAPSE duplicate taxonomic path. Search alone would emit two GET lines for /_search and /{index}/_search. _common would emit repeated params lines. 1114 METADATA blocks repeat the same root metadata path. This is why a linked MEMBER/NEXT encoding exists in the carriers and why a flat REST dump cannot be DeepKV.
  impact: The emit shape is unlawful independent of Jinja success and independent of native carrier checks. YAML last-wins would also drop extra method/path pairs, silently losing routes.
  suggestion: Encode each family as a NEXT child with unique parent cells, then put one method/path pair under ACTION/PARAMETERS/METADATA of that child. Never emit repeated closed keys as siblings. project_family is unused and still calls unwrap_and_project, so enabling it as written would not fix this.
  requirements:
  - R-known-invalid-emit
  - R-universal-representation
  - illegal-key-depth
  - duplicate-identity
- id: F-RENDER-FAIL-SENTINEL
  severity: high
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 13-15, 26-30, 46-50, 86-88, 123-124, 159-160
  additional_locations:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 38, 51, 91
  - path: packet/reviewcandidate/validation.yaml
    digest: 77bd14a84f21804f9f8707fef3619a9d70a089c37b1ef53f9a7f2a19fcf14463
    lines: 132-135
  issue: fail() writes the literal VALIDATIONFAILCLOSED into the output. Missing KIND, missing packet, unknown HTTP method, and unwrap mismatch therefore still yield a successful Jinja render. rendering.yaml and validation silent-literal-absence require fail-closed. The prior defect was empty success via MEMBER.Literal.Newline; this is the same class with a non-empty sentinel. StrictUndefined only catches missing Jinja names, not these branches.
  impact: Coordinator can record render pass while emitting a mixed illegal document plus sentinel rows. Missing packet join does not actually fail closed.
  suggestion: Raise from the template (undefined filter, explicit reject, or coordinator precheck that aborts before write) so a sentinel cannot be a passing artifact.
  requirements:
  - R-known-invalid-emit
  - silent-literal-absence
  - unresolved-endpoint
- id: F-RENDER-DROPS-MODEL
  severity: high
  location:
    path: packet/reviewcandidate/macros.j2
    digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
    lines: 129-139, 169-175
  additional_locations:
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: 1-2
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 5-8, 86-90
  - path: packet/reviewcandidate/service.yaml
    digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
    lines: 1-22, 32-148
  issue: project_model emits only product header, model IDENTITY/KIND/STATUS, then the apiindex dump. It does not emit TYPE, PROFILE, CONSUMES, MEMBER, GAP, or any other domain carrier. protocol/security/storage/search/resources/lifecycle/versions trees are unreferenced by Jinja. overlay_typed looks up typed.by_api, a shape not declared in rendering.yaml (keyed by vendor api token). With empty typed overlay, families have no IDENTITY in the projection, only METADATA.LongDescription equal to the vendor token.
  impact: The render named as the service projection is not a projection of the service model. Joins to typed and history workers cannot appear in the emitted document. Relationship loss is in the emit path, not only in unread CPG.
  suggestion: Walk closed-key MEMBER/NEXT/CHAIN from the merged carriers. Bind typed by a declared key. Keep REST packets as join inputs that fill PARAMETERS/ACTION values, never as a parallel grammar.
  requirements:
  - R-universal-representation
  - R-known-invalid-emit
  - join_apiindex
- id: F-PARSER-TIMEOUT
  severity: high
  location:
    path: packet/reviewreceipts/parsercontrolslifecycle.yaml
    digest: not-in-candidateidentity
    lines: 1-29
  additional_locations:
  - path: packet/modelparserone.yaml
    digest: not-in-candidateidentity
    lines: 1-25
  - path: packet/reviewcandidate/provenance.yaml
    digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
