positive_observations:
- Repair stopped expanding unregistered grouping keys after modelauthorhandoffstop.yaml SIGTERM and restated the closed registry as a NEXT chain instead of Catalog/Family/Method/Path keys. That answers the measured prior failure in packet/modelcontractone.yaml.
- >-
  Operational versus DeepKV split is real: provenance.yaml, rendering.yaml, validation.yaml, and handoff.yaml carry hashes, counts, vendor tokens, and Jinja literals that must not be illegal URN segments. Prior rendering.yaml was itself an illegal DeepKV-shaped carrier using KIND rendering and ANCHORS Ontology.Process.Cognitive.
- literals.newline replaces MEMBER.Literal.Newline. That specific silent-empty lookup is gone from the current macros.
- ping and info remain distinct witnesses. RestMainAction.java registers both GET / and HEAD / at Java lines 32-33. canTripCircuitBreaker false at 61-62 matches resources.yaml.
- Editions are not collapsed. versiondelta.yaml has no rest-api-spec/src/main/resources/rest-api-spec/api JSON path. search source_sha256 6d9002ded65f464bf36397ba8e1d866ad316baed04f8f7ef407ffe85a6ffc6b4 is on both tags in apiindex.yaml. Java deltas (FilteredRestRequest added, transport version files) stay STATUS inferred/unknown with blame-unknown preserved for the history worker.
- Stale vendor documentation.url values under /current/ or /master/ are recorded as spec citations, not retrieved 8.18 pages. versions.yaml states a fixture must fail the opposite claim.
- TLS noop path is named from SSLService.java and fenced as a consumer-edge constraint, not as permission for LME insecure fallback.
- Neighbor products are OWNER edges only. Coverage family complete, runtime, CPG semantic proof, official 8.18 web retrieval, and introducing-commit authorship are explicitly not claimed.
- >-
  Representative source pins that use Java line fields check: RestController product header 89-90 and dispatch 339-342, breaker settings 70-128, ThreadPool.Names 80-110 plus THREAD_POOL_TYPES 153-176, authenticate 129, authorize 267, Node.start 288-305, Bootstrap NodeValidationException and fatal boot log.
- apiindex.yaml contains 1114 tag rows. sourceindex.yaml contains 26 loci for v8.18.8 and 26 for v8.18.7 with matching source_blob identities on the sampled Node/RestController/breaker paths.
- validation.yaml keeps required/applicable/executed/status/evidence distinct and does not self-certify. Negative fixtures for fake CPG, TLS mismatch, stale version, invented registry, and manual family expansion are the right fail-closed tests once an executor actually runs them.
clarifying_questions:
- Does fail-closed for unknown HTTP method or missing packet require Jinja/coordinator abort, or is emitting VALIDATIONFAILCLOSED as document text ever a passing outcome?
- Must the service projection be a closed-key walk of MEMBER/NEXT/CHAIN from the eleven carriers, with REST packets only supplying values, rather than a root dump of vendor methods?
- >-
  Is the 300-second timeout on KIND: urn:silmaril:kind:service treated as a parser-platform blocker independent of this candidate, or must this freeze still carry parser failed until a live parse of these bytes succeeds?
- What is the typed-worker mapping shape this lane must consume (typed.by_api versus top-level vendor tokens), and is empty typed allowed to emit any family projection at all?
- Should ontology ANCHORS/INHERITS/EXTENDS be identical on every Elasticsearch DeepKV carrier, and is the alphabetic URN encoding of Ontology.Basic.Formal the required specimen form?
- The labeled counts 70 source-parse-problem files and skipped large-method dataflow were not found as named receipts in this packet. Are they in a graph/history packet this lane must treat as unread, or should they be attached before discourse?
- packet/api REST files and packet/head LME files are absent here. Is that expected for this reviewer packet, or a missing admission that blocks family-count and deployment-declaration checks?
- Two receipts disagree on source_index_sha256. Which digest binds the frozen loci set?
