summary: >-
  The frozen service-domain repair closed the prior illegal-key catalog in the eleven DeepKV carriers, and native duplicate-key/closed-key/reference checks are empty on those carriers. That is not target-parser acceptance and not a lawful DeepKV projection. Jinja render of all 1114 REST packets is a measured pass that still emits unregistered vendor keys (X-elastic-product, GET/POST/PUT/DELETE/HEAD/PATCH, params) and repeated root METADATA. The deeper cause is architectural: the renderer serializes vendor REST JSON surface at document root instead of walking the closed-key MEMBER/NEXT taxonomy, and fail() writes a sentinel string rather than aborting. Full target parser still timed out at 300 seconds on the one-line valid KIND fixture. Several Node/RestMainAction line citations mix packet-YAML wrapper lines with Java source lines even where the underlying Java claim is true. Neighbor joins, ping/info split, edition non-collapse, TLS noop naming, and operational/DeepKV file split are sound. Formal twelve-reviewer discourse remains required.
