findings:
- id: Q4-F01
  severity: critical
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: '91-96,119-122,165-167,151-163'
  also:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: '54-59,65-66,83,86-91'
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: '1-2'
  - path: packet/reviewreceipts/modelrepairrenderone.yaml
    lines: '1-27'
  issue: |-
    Known invalid emitted DeepKV structure has a local cause in the macros. project_header writes literals.header_product_name as a YAML key (X-elastic-product). project_spec_paths writes method_token results (GET, POST, PUT, DELETE, HEAD, PATCH) as YAML keys. The _common params branch writes spec_params (params) as a YAML key. project_index then emits a METADATA block for every apiindex record. Those names are not in parsercontract.yaml registry::deep::key::value::data and they contain hyphen or are fused vendor tokens. Jinja success with 1114 REST packets does not make the projection a DeepKV document.
  impact: A consumer or parser of the rendered model.yaml cannot treat it as closed-key DeepKV. Native carrier cleanliness is unrelated. Coverage-family qualification cannot succeed from this render.
  suggestion: Keep vendor header, method, path, and param spellings in operational provenance or METADATA.LongDescription. Emit each family as IDENTITY/KIND/MEMBER/NEXT under closed keys from rendering.yaml literals. Fail closed if a template would write a name that is not a closed key. Do not treat render pass as parse pass.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv-not-erased
- id: Q4-F02
  severity: critical
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: '91-96,151-163'
  issue: Deeper than illegal names, the projection is not a tree. project_index emits sibling METADATA keys at one depth for every family. project_spec_paths emits sibling GET keys for every GET route, including two GET paths on search and GET / for info. YAML mapping last-wins and DeepKV validate.sh duplicate-path failure both apply. ping versus info therefore cannot survive as distinct identities in the render even though interfaces.yaml splits them.
  impact: Relationship loss of the 1114-family join. Search paths /_search and /{index}/_search cannot both exist under one GET key. This is independent of whether a YAML loader happens to keep the last METADATA.
  suggestion: Wrap each family in MEMBER/NEXT. Under a family, wrap each route in MEMBER/NEXT with method and path as prose or as DENOTES plus LongDescription, never as repeated method keys.
  requirements:
  - relationship-loss
  - ping-info-split
  - known-invalid-emitted-deepkv-not-erased
- id: Q4-F03
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: '129-175'
  also:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: '5-9,73-74,86-91'
  - path: packet/reviewcandidate/interfaces.yaml
    digest: 4af99898e8f36d385909c1e8040ed19e6cb23438f248992d90f1551271b13f1c
    lines: '29-51,109-113'
  issue: project_model walks only service.yaml IDENTITY/KIND/STATUS plus apiindex. It never emits MEMBER/NEXT of the service model and never loads protocols, configuration, security, storage, search, resources, or lifecycle. rendering.yaml declares key_member and key_next but macros.j2 never emits them. project_family exists and still calls unwrap_and_project, so even the unused walker would dump illegal keys. interfaces.yaml says this lane joins and must not expand unregistered grouping keys; the renderer does the opposite.
  impact: Full service scope required by the task is not in the projection. Repair of carrier YAML cannot be observed in model.yaml. The typed overlay path overlay_typed is empty when typed is {} and therefore emits no family IDENTITY.
  suggestion: Make project_model walk model.MEMBER/NEXT with emit_* macros only. Join REST packets into those nodes as closed-key children. Use key_member and key_next. Delete or fail-close unwrap_and_project until it cannot emit vendor keys.
  requirements:
  - missed-required-flows
  - contradiction-handling
  - universal-representation-deepkv
- id: Q4-F04
  severity: high
  location: packet/reviewreceipts/parsercontrolslifecycle.yaml
  digest: not-in-candidateidentity
  lines: '1-29'
  also:
  - path: packet/reviewcandidate/provenance.yaml
    digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
    lines: '341-353'
  - path: packet/modelparserone.yaml
    lines: '1-26'
  issue: Full target parser controls timed out at 300 seconds on the validkind fixture after printing BOOTED and START valid_kind. provenance.yaml still records candidate_parse against workers/model/output/service.yaml sha256 50075eb5f6cf2ab8297e4b92908b0023ce0ca48e0925cece4d47773c9825338c exit_code -15, which is not this frozen service.yaml af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3. Native zero-violation on the eleven carriers is a different control.
  impact: Parser acceptance remains unexecuted. Mixing a prior digest into repair provenance invites treating the freeze as parsed.
  suggestion: Keep parser timeout open. Point candidate_parse at the frozen hashes or mark that field as prior-lane only. Do not close parser requirements from static YAML or Jinja receipts.
  requirements:
  - full-target-parser-timeout-open
  - native-static-not-parser-acceptance
- id: Q4-F05
  severity: high
  location: packet/reviewcandidate/provenance.yaml
  digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
  lines: '99-101,164-173'
  also:
  - path: packet/reviewcandidate/lifecycle.yaml
    digest: a4c7e3e6c32b180c2f66b25ceff38b6cbe715a579deda2ef4b71ac4fd36b4bbe
    lines: '87,96'
  - path: packet/reviewcandidate/service.yaml
    digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
    lines: '94,101'
  issue: Several source line claims are packet-wrapper YAML line numbers, not Java lines, and some are outside the Java file. RestMainAction is 64 Java lines; routes are Java 32-33 (List.of GET / and HEAD /); provenance says source lines 73-75, which are wrapper lines around Java 32-33. canTripCircuitBreaker at Java 61-62 in the same notes list is correct. Node.java is 847 Java lines ending at line 847. start() at 288-305 is correct. stop() is Java 463-464 (moveToStopped), not 957. close() is Java 520-525 (synchronized, stop if started, moveToClosed), not 1073-1083. Wrapper lines 957 and 1073-1083 match those Java statements. v8.18.7 RestMainAction also has routes at Java 32-33.
  impact: Exact source-pin tracing fails for lifecycle stop/close and root-route registration. Callers using cited lines will look past end of file. Mixed correct and incorrect cites in one locus make the rest of the notes harder to trust.
  suggestion: Cite only the readback line field from packet/source/...yaml. Add a validation fixture that rejects a cited Java line greater than sourceindex lines for that path.
  requirements:
  - source-pin-line-trace
  - contradiction-handling
- id: Q4-F06
  severity: medium
  location: packet/reviewcandidate/service.yaml
  digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
  lines: '33,43'
  also:
  - path: packet/reviewcandidate/versions.yaml
    digest: 4d0c6efd3f1cabb55865ed997181ec0884b37368f16559ca9f17b638a69df9cd
    lines: '28,40'
  - path: packet/reviewcandidate/validation.yaml
    digest: 77bd14a84f21804f9f8707fef3619a9d70a089c37b1ef53f9a7f2a19fcf14463
    lines: '124-127'
  issue: |-
    IDENTITY urn:silmaril:instance:edition:eight:eighteen:eight and urn:silmaril:instance:edition:eight:eighteen:seven appear as MEMBER roots in both service.yaml and versions.yaml. validation.yaml negative duplicate-identity forbids two families sharing IDENTITY.
  impact: If IDENTITY is globally unique across carriers, the pair is a duplicate-identity failure. If it is a lawful join of the same specimen, the carriers do not say FORWARD/CONSUMES of each other for that identity.
  suggestion: Keep the edition specimen in one carrier and CONSUMES/FORWARD it from the other, or give the version-pair members distinct identities that DENOTES the edition specimen.
  requirements:
  - contradiction-handling
  - relationship-loss
- id: Q4-F07
  severity: medium
  location: packet/reviewcandidate/lifecycle.yaml
  digest: a4c7e3e6c32b180c2f66b25ceff38b6cbe715a579deda2ef4b71ac4fd36b4bbe
  lines: '51-77,87'
  also:
  - path: packet/source/v8.18.8/server.src.main.java.org.elasticsearch.node.Node.java.yaml
    lines: '288-323'
  issue: CHAIN NEXT order is bootstrap, start, run, recovery, stop, close. start PRECEDES run and run PRECEDES stop, so recovery is an extra NEXT node that is not in the PRECEDES/FOLLOWS chain. Node.start after SearchService at Java 305 continues at 306-323 with FsHealthService, MonitorService, NodeConnectionsService.start, GatewayService.start, Coordinator bind, and TransportService.start. lifecycle.yaml calls those later starts below the copied window while 306-307 are adjacent to the cited 294-305 window.
  impact: Lifecycle flow is incomplete and internally inconsistent. Discovery/cluster publication required for a running node is named only as a gap rather than as following start().
