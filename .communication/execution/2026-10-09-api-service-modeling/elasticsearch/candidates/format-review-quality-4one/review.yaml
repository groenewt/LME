summary: |-
  The eleven DeepKV carriers are readable closed-key YAML and match the native duplicate-key/closed-key/reference crosscheck, but that is not target parser acceptance. The Jinja projection is the real quality failure: macros promote vendor header, HTTP method, and params tokens into YAML keys and repeat METADATA at document root, so a passing 1114-spec render still cannot be a DeepKV document. Deeper causes are unused MEMBER/NEXT literals, an entrypoint that never walks the domain carriers, and a spec unwrap that emits vendor structure instead of wrapping it. Separate defects include Java line citations that are packet-wrapper line numbers, duplicate edition IDENTITY across carriers, and a lifecycle CHAIN whose NEXT order disagrees with PRECEDES. Full target parser timeout on validkind remains open.
