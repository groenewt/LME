  - ping-info-split
  - loci-identity
- id: F7
  severity: medium
  location: packet/reviewcandidate/registry.yaml
  digest: 42ae6db8e0e8c5db950b853806bac2d49b3f195552e71b97249c8e3086462958
  lines: 29-441
  also:
  - path: packet/reviewcandidate/resources.yaml
    digest: 838e2de4f2ed8a2c4634f82e16849fded33eba4e19281c362d7bd2b0a91a600a
    lines: 33-142
  issue: USER_REF_00 says YAML nesting depth is taxonomic specification. The closed-key roster is a flat lexicon, restated here as an 80-deep FIELDS.MEMBER.NEXT... chain. Thread-pool names, which are peers in ThreadPool.Names, are likewise a 22-deep NEXT list. NEXT is the flow/order spine, not a sequence substitute that implies generic precedes cluster_coordination as specialization.
  impact: Maintainability is poor, and the encoding falsifies taxonomy. Combined with F5, a line-fold parser that already timed out on a one-key document is being pointed at 80-deep sibling catalogs. Closed-key restatement itself is not an invented registry.
  suggestion: "Ask whether peer catalogs may use NEXT as an ordered list, or must be MEMBER children of family nodes at shallow depth, with the authoritative roster remaining parsercontract.yaml / registry::deep::key::value::data rather than a DeepKV replica."
  requirements:
  - universal-representation-deepkv
  - target-parser-timeout-open
- id: F8
  severity: medium
  location: packet/reviewcandidate/rendering.yaml
  digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
  lines: 4-8,86-90
  issue: Note says coordinator may merge DeepKV output carriers under model without renaming closed keys. Each of the eleven carriers is a full root document with IDENTITY, KIND, MEMBER, METADATA. Merge-by-root-concatenation would duplicate closed keys. No merge algebra, identity namespace, or MEMBER grafting rule is declared. The actual template does not merge them anyway.
  impact: Even a corrected projector has no lawful way to compose the split files into one parseable document.
  suggestion: Define one root document and attachments, or a MEMBER graft map, before any coordinator merge. Do not concatenate roots.
  requirements:
  - universal-representation-deepkv
- id: F9
  severity: medium
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 5-7,59-63,141-148
  issue: indent(L) always emits a single two-space unit, so GAP STATUS is not depth-relative. overlay_typed would emit IDENTITY and KIND at root for every apiindex row if typed.by_api were populated, duplicating identity keys 1114 times. The measured render used an empty typed overlay, so this is latent, not the observed emit.
  impact: Binding the typed sibling, which handoff.yaml requires as a mapping, would worsen duplicate-key collapse.
  suggestion: Track depth. Overlay a complete family node under a unique parent, or skip overlay when it cannot insert without duplicate IDENTITY.
  requirements:
  - known-invalid-emitted-deepkv
  - join-apiindex
- id: F10
  severity: medium
  location: packet/reviewcandidate/service.yaml
  digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
  lines: 81-101
