findings:
- id: F1
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 91-97,119-122,151-163,165-167
  also:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 54-84,87-91
  - path: packet/reviewcandidate/model.j2
    digest: 337ffc20a7412b2b9d3efdd95056bfbf5b4ede1ce554e66115f6011af9ab6758
    lines: 1-2
  issue: "The renderer projects vendor REST surface as YAML mapping keys. project_header emits literals.header_product_name X-elastic-product as a key. project_spec_paths emits method_token values GET/POST/PUT/DELETE/HEAD/PATCH as keys whose values are raw paths. The params fallback emits spec_params as a repeated key. project_index emits METADATA.LongDescription for every apiindex row at root. Hyphenated keys, unregistered GET/params keys, duplicate METADATA, and non-URN path values all violate USER_REF_00 and registry::deep::key::value::data. Jinja success on 1114 packets is therefore not DeepKV projection success."
  impact: "The yielded model cannot be a DeepKV document. Parser key::read fails on the first illegal name. Duplicate METADATA/GET paths are SIL_VIOLATION_GRAPH_COLLAPSE even if names were registered. Coverage family complete cannot be qualified from this render."
  suggestion: Stop emitting vendor tokens as keys. Walk DeepKV MEMBER/NEXT family nodes, or emit one lawful family node per apiindex record using closed keys only, with method/path/param atoms in protected prose or operational sidecars. Keep X-elastic-product as the protocols.yaml PARAMETERS/DENOTES/VALUE form. Fail the render if the output would not parse as DeepKV.
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
  - header-product
  - join-apiindex
- id: F2
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 13-15,86-88,123-124,159-160
  also:
  - path: packet/reviewcandidate/rendering.yaml
    digest: dcc6a39759955184814816f484ecf9664d9953a9b713eba5ebb125ee0e661dbb
    lines: 51,91
  issue: fail(L) writes the declared string VALIDATIONFAILCLOSED into the output stream. It does not abort Jinja, raise undefined, or skip subsequent families. Unknown methods, unwrap misses, and non-mapping packets therefore still produce a render pass if later iterations succeed.
  impact: Coordinator render pass can hide closed-world failures. This is a deeper cause of the measured Jinja pass than the empty typed overlay.
  suggestion: Bind fail to a Jinja exception or required coordinator post-check that rejects any VALIDATIONFAILCLOSED, duplicate root key, or unregistered key. Missing packet must stop the whole render.
  requirements:
  - known-invalid-emitted-deepkv
  - universal-representation-deepkv
- id: F3
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 129-139,151-175
  issue: project_model never walks the DeepKV service graph. It emits root IDENTITY/KIND/STATUS from model, then dumps apiindex packets. project_family exists and is unused. interfaces.yaml correctly refuses to expand 557 families as grouping keys; the renderer reintroduces that expansion at emit time. rendering.yaml even says coordinator may merge carriers under model, but the template never consumes MEMBER/NEXT/PARAMETERS from those carriers.
  impact: Lawful encodings already present, including the product header in protocols.yaml, never reach the projection. The eleven carriers and the Jinja product are two different architectures joined only by three root fields.
  suggestion: "Make the template a DeepKV projector of the authored carriers plus a typed overlay, or declare the Jinja product as a non-DeepKV operational dump and stop claiming YIELDS urn:silmaril:instance:projection:jinja:rest:family as DeepKV."
  requirements:
  - universal-representation-deepkv
  - known-invalid-emitted-deepkv
  - join-apiindex
- id: F4
  severity: high
  location: packet/reviewcandidate/macros.j2
  digest: 15fa96ac1ed63cd6a126ea87732791f7973b9152d7707625a20666fff1b8eb50
  lines: 91-97
  issue: "Multi-path families emit the same method key twice at the same depth. RestSearchAction.java source lines 89-92 register GET and POST for both /_search and /{index}/_search. project_spec_paths would emit GET then POST then GET then POST. parse::line treats duplicate taxonomic paths as graph collapse. Path values such as /_search are not alphabetic URNs."
  impact: Search, bulk, and any other multi-route family are unparseable even after removing X-elastic-product and repeated METADATA.
  suggestion: Do not use HTTP method names as keys. One family node may cite multiple method/path pairs in prose, or as ordered NEXT children with DENOTES/VALUE URNs whose exact vendor spellings live in operational provenance.
  requirements:
  - known-invalid-emitted-deepkv
  - universal-representation-deepkv
- id: F5
  severity: high
  location: packet/reviewreceipts/parsercontrolslifecycle.yaml
  digest: not-a-candidate-file
  lines: 1-29
  also:
  - path: packet/reviewcandidate/validation.yaml
    digest: 77bd14a84f21804f9f8707fef3619a9d70a089c37b1ef53f9a7f2a19fcf14463
    lines: 20-22,80-84
  - path: packet/reviewcandidate/provenance.yaml
    digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
    lines: 341-353
  issue: >-
    Full target parser controls timed out at 300 seconds on the valid_kind fixture KIND: urn:silmaril:kind:service. Native 11-carrier zero violations and YAML syntax pass are not that parser. provenance.yaml candidate_parse records a different older service.yaml sha256 50075eb5... exit -15. This frozen candidate has no completed deep::key::value::parse receipt.
  impact: Parser requirement remains open/failed. The 80-deep registry.yaml NEXT chain and any merged 11-root document are untested on the actual parser. Do not promote native checks to acceptance.
  suggestion: Keep parser status timed_out/unexecuted until the real parse function completes on a valid-kind fixture and then on each DeepKV carrier. Do not treat Jinja render as a substitute.
  requirements:
  - target-parser-timeout-open
  - closed-keys-native
  - universal-representation-deepkv
- id: F6
  severity: high
  location: packet/reviewcandidate/provenance.yaml
  digest: f903c00b99ce1b0837d4002b952540022405de618324728700b61bacb3a12a27
  lines: 93-101,169-173
  also:
  - path: packet/reviewcandidate/service.yaml
    digest: af950abbf8ecccbef80f77ece8bd3c801cf270eb5e361e0829e6bc82838e5fc3
    lines: 88-101
  - path: packet/reviewcandidate/lifecycle.yaml
    digest: a4c7e3e6c32b180c2f66b25ceff38b6cbe715a579deda2ef4b71ac4fd36b4bbe
    lines: 86-96
  issue: Source line pins mix Java coordinates with packet-wrapper YAML coordinates. provenance.yaml says RestMainAction routes are at source lines 73-75; the admitted readback registers GET / and HEAD / at Java line 33, while wrapper YAML lines 73-75 hold that Java line. service.yaml and lifecycle.yaml say Node.stop uses moveToStopped at line 957 and close at 1073-1083; Node.java.yaml ends at Java line 847, with stop() at 463-464 and close()/moveToClosed at 520-525. Those 957/1073 numbers are wrapper-file lines. Start() lines 288-305, RestController 87-91 and 339-342, and canTripCircuitBreaker 61-62 are actual Java lines, so the coordinate system is inconsistent inside one provenance file.
  impact: Source-bound review cannot trust line pins without re-reading the wrapper. A later CPG join keyed by those numbers would miss the methods.
  suggestion: "Recite only the Java `line:` field from the source wrappers. Re-pin Node stop/close and RestMainAction routes before any semantic CPG join."
  requirements:
