  - lines: "261-443"
    body: |
      Newly returned packet YAML 280-529 maps through original source 261-443. derive_published_ports unions manifest host ports deny-by-default. explicit_profile and profile_lan_ports admit LAN only for bind 0.0.0.0 entries; a bare --cluster example mentions transport 9300 as a gate false-FAIL. effective_pack_flags defaults install_elastic_services to 0, sets it on --elastic-services, and forces it off under --offline.
  - lines: "446-793"
    body: |
      Newly returned packet YAML 530-949 maps through original source 446-793 with withheld 478, 665, 751, 752, 753, 755, and 757 still unknown. derive_tailnet_ingress_ports, derive_vip_endpoints, derive_host_scoped_min, and derive_host_runtime_rosters all take install_elastic_services as a pack flag. derive_host_scoped_min comments use trixie as an example target-plus-network counting 0 and mention es*.yml cluster-sizing files. Those names are harness examples, not a unique required placement. runtime_owner defaults to root when omitted.
  - lines: "954-1028"
    body: |
      Newly returned packet YAML 1150-1239 maps through original source 954-1028. Remote health payload compares exact persistent owner:name roster, requires init jobs active/exited success, then a compatibility floor, then loopback-only exposure via ss. This span does not itself encode Elasticsearch listen addresses.
  - lines: "1170-1295"
    body: |
      Newly returned packet YAML 1440-1749 maps through original source 1170-1400 including this span. APM 8200 and logstash 5044 count only with --elastic-services. ES/Kibana loopback probes are gated by host_runs_service elasticsearch and kibana; un-rostered examples qemu-some, graph, airgapped, and es* stay default-local. LME_GATE_TAILNET_DOMAIN example uses placeholder WITHHELDNETWORKAS, which is not a desired domain. vip-probe documents curl -sk as routing-only and not TLS-chain proof.
  - lines: "1468-1590"
    body: |
      Newly returned packet YAML 1830-2010 maps through original source 1468-1590 plus trailing withheld metadata. do_telemetry currently emits FAIL collection_engine_not_integrated. do_teardown calls refuse_physical_silmaril_wipe then wipe_lme.sh. Deploy-held commentary says collection/readback requires --stage telemetry. Packet 1985-2010 is withheld hashes for lines 478, 665, 751, 752, 753, 755, 757, and 903 plus qualification, not original source body.
