    body: |
      Prior-historical fact from previously observed packet YAML, not this repair's unobserved-gap read of the sanitized projection. Health contract requires ES :9200 HTTP 401 or 200, Kibana :5601 200 or 302 or 401, deny-by-default loopback on published ports including ES transport 9300, and exact owned persistent containers.
  - lines: "798-828"
    body: |
      Prior-historical fact from previously observed packet YAML, not this repair's unobserved-gap read of the sanitized projection. resolve_expect_min core pack names elasticsearch, kibana, fleet-server, wazuh-manager, elastalert2. elastic pack names apm-server, filebeat, logstash, metricbeat, heartbeat. --elastic-services turns the elastic pack on. --offline forces elastic pack off.
  - lines: "1041-1057"
    body: |
      Prior-historical fact from previously observed packet YAML, not this repair's unobserved-gap read of the sanitized projection. Host-local ES probe is https://127.0.0.1:9200 via curl -sk expecting 401 or 200. Kibana probe is https://127.0.0.1:5601 expecting 200, 302, or 401. Non-local hosts skip those probes because consumers use tailnet VIP. curl -sk is a gate helper, not a desired client TLS policy.
