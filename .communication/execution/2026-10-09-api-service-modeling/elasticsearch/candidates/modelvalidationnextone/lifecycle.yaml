CITATION:
  PROVENANCE: urn:silmaril:instance:source:loci:node
METADATA:
  VERSION:
    BRANCH: urn:silmaril:edition:eight:eighteen:eight
    VERSION: urn:silmaril:edition:pair:eight:eighteen:eight:and:seven
    HASH: urn:silmaril:instance:provenance:commit:head
  ShortName: urn:silmaril:name:lifecycle:elasticsearch
  ShortDescription: "Construction, bootstrap, start, run, stop, close, shard-local recovery, shutdown APIs, rolling upgrade, and version compatibility transitions."
  LongDescription: "Lifecycle is the Node Lifecycle object plus Bootstrap phases, engine-local translog recovery, snapshot restore REST families, shutdown REST families, and ILM. NEXT and PRECEDES/FOLLOWS on the CHAIN describe the same partial order: construction then bootstrap then start then run then stop then close. Recovery is shard-local engine work, not a successor of serving traffic. Upgrade introducing commits are unknown because tags were shallow. History worker owns 6108 prior-group reconciliation. METHOD CSV bounds: Node.start 288-454, Node.stop 463-502, Node.close 519-599."
CHAIN:
  IDENTITY: urn:silmaril:instance:lifecycle:chain
  KIND: urn:silmaril:kind:chain
  STAGE:
    IDENTITY: urn:silmaril:instance:lifecycle:stage:construction
    KIND: urn:silmaril:kind:stage
    TYPE: urn:silmaril:type:lifecycle:stage
    STATUS: urn:silmaril:status:corpus:derived
    PRECEDES: urn:silmaril:instance:lifecycle:stage:bootstrap
    CITATION:
      PROVENANCE: urn:silmaril:instance:source:loci:node:construction
    METADATA:
      LongDescription: "NodeConstruction.java is 1653 lines and blob-identical across tags. Injector wiring and Node object construction precede Bootstrap start. Control flow remains CPG pending. This is construction, not human desired ordering."
    NEXT:
      IDENTITY: urn:silmaril:instance:lifecycle:stage:bootstrap
      KIND: urn:silmaril:kind:stage
      TYPE: urn:silmaril:type:lifecycle:stage
      STATUS: urn:silmaril:status:corpus:derived
      FOLLOWS: urn:silmaril:instance:lifecycle:stage:construction
      PRECEDES: urn:silmaril:instance:lifecycle:stage:start
      CITATION:
        PROVENANCE: urn:silmaril:instance:source:loci:bootstrap
      ERROR:
        IDENTITY: urn:silmaril:instance:error:node:validation
        KIND: urn:silmaril:kind:error
        TYPE: urn:silmaril:type:error:bootstrap
        STATUS: urn:silmaril:status:corpus:derived
        CITATION:
          PROVENANCE: urn:silmaril:instance:source:loci:bootstrap
        METADATA:
          LongDescription: "Bootstrap.exitWithNodeValidationException at Java 93-96 logs node validation exception and gracefullyExit ExitCodes.CONFIG."
        NEXT:
          IDENTITY: urn:silmaril:instance:error:boot:fatal
          KIND: urn:silmaril:kind:error
          TYPE: urn:silmaril:type:error:bootstrap
          STATUS: urn:silmaril:status:corpus:derived
          CITATION:
            PROVENANCE: urn:silmaril:instance:source:loci:bootstrap
          METADATA:
            LongDescription: "Bootstrap.exitWithUnknownException at Java 99-102 logs fatal exception while booting Elasticsearch and gracefullyExit 1."
      METADATA:
        LongDescription: "Phase comments mark SecureSettings and Environment invalid until after phase 2. PluginsLoader is prepared for entitlements then used by plugins service in phase 3. CLI ServerArgs are stored on Bootstrap; distribution/tools/server-cli is not among representative loci."
      NEXT:
        IDENTITY: urn:silmaril:instance:lifecycle:stage:start
        KIND: urn:silmaril:kind:stage
        TYPE: urn:silmaril:type:lifecycle:stage
        STATUS: urn:silmaril:status:corpus:derived
        FOLLOWS: urn:silmaril:instance:lifecycle:stage:bootstrap
        PRECEDES: urn:silmaril:instance:lifecycle:stage:run
        CITATION:
          PROVENANCE: urn:silmaril:instance:source:loci:node
        METADATA:
          LongDescription: "Node.start METHOD Java 288-454. No-op when lifecycle.moveToStarted is false at 288-291. Sequence inside the 847-line file includes pluginLifecycleComponents at 294, optional ReadinessService 296-297, IndicesService through SearchService 300-305, NodeConnectionsService.start 312, GatewayService.start 315, TransportService.start 323, PeerRecoverySourceService.start 327, GatewayMetaState.start 331, validateNodeBeforeAcceptingRequests 362, coordinator.start 373, clusterService.start 374, transportService.acceptIncomingRequests 377, HttpServerTransport.start 427. Initial-state wait 387-424 can warn after INITIAL_STATE_TIMEOUT_SETTING or throw ElasticsearchTimeoutException on interrupt. These starts are not below the copied window."
        ERROR:
          IDENTITY: urn:silmaril:instance:error:start:initial:state:timeout
          KIND: urn:silmaril:kind:error
          TYPE: urn:silmaril:type:error:discovery
          STATUS: urn:silmaril:status:corpus:derived
          CITATION:
            PROVENANCE: urn:silmaril:instance:source:loci:node
          METADATA:
            LongDescription: "When initialStateTimeout millis is greater than 0 and master node id is null, waitForNextChange onTimeout at Java 407-414 logs a warning with INITIAL_STATE_TIMEOUT_SETTING and ReferenceDocs.DISCOVERY_TROUBLESHOOTING then counts down. InterruptedException at 420-422 throws ElasticsearchTimeoutException. This error is inside start, not a run-stage successor."
        NEXT:
          IDENTITY: urn:silmaril:instance:lifecycle:stage:run
          KIND: urn:silmaril:kind:stage
          TYPE: urn:silmaril:type:lifecycle:stage
          STATUS: urn:silmaril:status:runtime:unexecuted
          FOLLOWS: urn:silmaril:instance:lifecycle:stage:start
          PRECEDES: urn:silmaril:instance:lifecycle:stage:stop
          METADATA:
            LongDescription: "Running state is lifecycle.started after Node.start returns. HTTP and transport serve traffic because acceptIncomingRequests and HttpServerTransport.start already ran inside start. Cluster state publication is Coordinator after start. Discovery and cluster-state control flow are CPG pending. Not executed. Recovery is not NEXT of run."
          NEXT:
            IDENTITY: urn:silmaril:instance:lifecycle:stage:stop
            KIND: urn:silmaril:kind:stage
            TYPE: urn:silmaril:type:lifecycle:stage
            STATUS: urn:silmaril:status:corpus:derived
            FOLLOWS: urn:silmaril:instance:lifecycle:stage:run
            PRECEDES: urn:silmaril:instance:lifecycle:stage:close
            CITATION:
              PROVENANCE: urn:silmaril:instance:source:loci:node
            METADATA:
              LongDescription: "Node.stop METHOD Java 463-502. lifecycle.moveToStopped false is a no-op at 463-465. stopIfStarted at 508-513 skips components that never reached STARTED, which is the failed-startup recovery path. IndicesService stops last at 500 while scroll searchers or recovery finish."
            NEXT:
              IDENTITY: urn:silmaril:instance:lifecycle:stage:close
              KIND: urn:silmaril:kind:stage
              TYPE: urn:silmaril:type:lifecycle:stage
              STATUS: urn:silmaril:status:corpus:derived
              FOLLOWS: urn:silmaril:instance:lifecycle:stage:stop
              CITATION:
                PROVENANCE: urn:silmaril:instance:source:loci:node
              METADATA:
                LongDescription: "Node.close METHOD Java 519-599. Synchronized close; if started it stops first at 522-523. moveToClosed false at 525-526 prevents double close. ThreadPool.shutdown at 582 does not call shutdownNow here; awaitClose may shutdownNow later if close exceeds the specified time, comments at 583-585. lifecycle.closed is the terminal predicate."
MEMBER:
  IDENTITY: urn:silmaril:instance:lifecycle:recovery:engine
  KIND: urn:silmaril:kind:process
  TYPE: urn:silmaril:type:lifecycle:recovery:shard
  STATUS: urn:silmaril:status:corpus:derived
  CITATION:
    PROVENANCE: urn:silmaril:instance:source:loci:engine:internal
  GAP:
    STATUS: urn:silmaril:status:cpg:pending
  METADATA:
    LongDescription: "Shard-local recovery, not a node CHAIN stage between run and stop. InternalEngine constructor calls store.trimUnsafeCommits at Java 260 then openTranslog, then pendingTranslogRecovery.set true at Java 305 after asserting it was false. restoreLocalHistoryFromTranslog METHOD Java 529-537 is a public engine recovery entry. IndexShard recovery orchestration is unread in full. REST indices.recovery and cat.recovery observe this, unexecuted. PeerRecoverySourceService.start at Node.start Java 327 is peer recovery admission during start, still not a post-run stage."
CHILD:
  IDENTITY: urn:silmaril:instance:lifecycle:shutdown:api
  KIND: urn:silmaril:kind:join
  TYPE: urn:silmaril:type:join:http:rest
  STATUS: urn:silmaril:status:corpus:derived
  CONSUMES: urn:silmaril:instance:packet:apiindex
  METADATA:
    LongDescription: "vendor families shutdown.put_node get_node delete_node under /_nodes/{node_id}/shutdown. These declare node shutdown intent; they are not physical-host shutdown."
  NEXT:
    IDENTITY: urn:silmaril:instance:lifecycle:upgrade
    KIND: urn:silmaril:kind:stage
    TYPE: urn:silmaril:type:lifecycle:upgrade
    STATUS: urn:silmaril:status:unknown
    GAP:
      STATUS: urn:silmaril:status:blame:unknown
    CITATION:
      PROVENANCE: urn:silmaril:instance:packet:versiondelta
    EXPECTS: urn:silmaril:instance:worker:history:reconciliation
    METADATA:
      LongDescription: "versiondelta adds transport upper bounds 8.19 9.0 9.1 9.2 and initial transport definition csv files for 8.18.7 and 8.18.8. REST migration.deprecations migration.get_feature_upgrade_status migration.post_feature_upgrade and ml.set_upgrade_mode transform.set_upgrade_mode transform.upgrade_transforms are HTTP upgrade families in apiindex. Introducing commits for Java deltas are unknown under shallow fetch. History worker owns reconciliation. This is not a CHAIN successor of close."
    NEXT:
      IDENTITY: urn:silmaril:instance:lifecycle:ilm
      KIND: urn:silmaril:kind:join
      TYPE: urn:silmaril:type:join:http:rest
      STATUS: urn:silmaril:status:corpus:derived
      CONSUMES: urn:silmaril:instance:packet:apiindex
      METADATA:
        LongDescription: "Index lifecycle HTTP families under /_ilm. Data stream lifecycle families live under indices data lifecycle paths in apiindex. Runtime policy execution unexecuted."
GAP:
  STATUS: urn:silmaril:status:runtime:unexecuted
  METADATA:
    LongDescription: "Interrupted apply/resume of LME Ansible is a deployment edge, not proven here. NodeConstruction details remain CPG pending. Rolling upgrade was not executed. Full 26-class source behavior remains scoped; representative METHOD bounds do not prove entire service semantics."
