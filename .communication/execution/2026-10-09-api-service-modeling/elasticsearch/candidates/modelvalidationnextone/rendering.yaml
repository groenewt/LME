schema_version: 1
kind: operational_rendering_declaration
qualification: |
  Literal tokens, Jinja context, join bindings, and driver phases. This file is not a DeepKV carrier. Macros read these mapping names with bracket lookup. The prior lookup MEMBER.Literal.Newline is undefined here. Strict undefined must fail rather than emit empty. Coordinator must not concatenate the eleven DeepKV roots; each render yields exactly one carrier. model.j2 is draft inspection. driver phase project or render is complete acceptance and must fail closed on missing, empty, unrelated, or unexecuted required typed or history joins. Controls mutate actual inputs and call the same project_model path. Nonprotected scalars must match the admitted reference grammar; KIND may not emit as plain prose. Protected prose is admitted only when the parent key is METADATA. Every one of the 1114 apiindex records must join an exact packet identity; length 1114 alone is not uniqueness.
context:
  model:
    path: output/service.yaml
    name: model
    note: |
      Default project document is the service carrier. Driver phase project may bind any one of the eleven DeepKV carriers as model. Do not merge roots.
  literals:
    path: output/rendering.yaml
    name: literals
    mapping: literals
  catalog:
    path: output/interfaces.yaml
    name: catalog
    note: |
      Domain join identity only. Not a vendor REST dump.
  index:
    path: packet/apiindex.yaml
    name: index
    iterator: apis
    family_count_per_tag: 557
    family_total: 1114
  packets:
    root: packet/api
    name: packets
    join: |
      Every apiindex record loads packet/api/<tag>/<token>.yaml by reconstructed file path and source_sha256. Unique tag, family token, path, and source digest are required. Per-tag denominator is 557. Missing packet, wrong digest, duplicate family, or wrong per-tag count aborts the template. Witness records remain a documented subset, not the admission set.
  typed:
    owner: urn:silmaril:instance:worker:interface:typed
    name: typed
    shape_key: by_identity
    note: |
      Required join is a mapping. Draft or source inspection may bind an empty mapping and must not report complete acceptance. A nonempty mapping without by_identity aborts in every phase. Project or render requires every declared required_typed_joins identity as a by_identity key whose overlay contains identity, coverage, evidence, and status equal to the declared values, with required, applicable, and executed boolean true and status equal to status_complete. Unrelated keys, missing identities, empty maps, executed false, unknown, unexecuted, or pending status abort. Overlay must not mint vendor keys. This lane does not author typed request or response schemas and must not fabricate them to satisfy the join.
  history:
    owner: urn:silmaril:instance:worker:history:reconciliation
    name: history
    shape_key: by_edition
    note: |
      Required join is a mapping. Draft or source inspection may bind an empty mapping and must not report complete acceptance. A nonempty mapping without by_edition aborts in every phase. Project or render requires every declared required_history_joins identity as a by_edition key whose overlay contains identity, coverage, evidence, and status equal to the declared values, with required, applicable, and executed boolean true and status equal to status_complete. Unrelated keys, missing identities, empty maps, executed false, unknown, unexecuted, or pending status abort. This lane does not expand blame catalogs and must not fabricate them to satisfy the join.
  graph:
    owner: urn:silmaril:instance:provenance:graph:head
    name: graph
    note: |
      Consume graph module identity and receipt hashes from provenance.yaml. Do not invent CPG edges.
  templates:
    root: output/model.j2
    macros: output/macros.j2
    import_name: macros
    entry: project_model
    entry_phase: draft
    import_form: from-import-with-context
    note: |
      model.j2 calls project_model with literals.phase_draft. That walk includes require_reference, duplicate IDENTITY, METADATA-parent protected prose, and all 1114 apiindex packet identities. It is inspection, not complete acceptance.
  driver:
    root: output/driver.j2
    macros: output/drivermacros.j2
    import_name: drivermacros
    entry: drive
    import_form: from-import-with-context
    phases:
    - compile
    - fixture
    - draft
    - source
    - render
    - project
    fixture_run_phase_key: run_phase
    note: |
      model.j2 always calls project_model with phase draft. driver.j2 compile emits compile declared. driver phase draft or source calls the same project_model as model.j2. driver phase project or render calls the same project_model with required complete typed.by_identity and history.by_edition joins, not merely nonempty maps. driver phase fixture calls that same project_model using driver.run_phase, which must be draft, source, project, or render. Fixture helpers that print detected are forbidden. Mutate model, packets, index, typed, or history and invoke this path.
  undefined: |
    KeepUndefined or StrictUndefined required. Missing literal names fail. Do not treat silent empty as success. Abort looks up a missing STRICTABORT name rather than printing a sentinel into a passing document. Nonprotected scalars that fail the admitted reference grammar abort the same way. ShortDescription or LongDescription outside METADATA abort. Empty, unrelated, or unexecuted required joins abort on project and render. Duplicate apiindex family identity or a nonwitness packet digest mismatch abort on every phase. Draft inspection of a passing carrier is not complete acceptance.
  forbidden_lookup: MEMBER.Literal.Newline
  actual_literal_mapping: literals.newline
loader:
  yaml_for_carriers: |
    Preserve mappings. DeepKV carriers use closed keys only. Exactly one legal carrier per emitted document.
  yaml_for_specs: |
    Packet REST specs contain vendor sequences; they are join inputs, not model carriers. Do not run deep::key::value::parse on them.
  yaml_for_fixtures: |
    Fixture mappings mutate actual join inputs and must be bound as model or packets for project_model. Coordinator executes them. This worker does not claim execution. A detected label is not a projector rejection.
