action:
- |
  Load one DeepKV output carrier as model and this literals mapping. Do not concatenate the eleven DeepKV roots.
- |
  Bind packet/apiindex.yaml as index.apis. Bind all 1114 packet/api REST files as packets keyed by file path. Require unique tag, family token, reconstructed path, and source digest on every record, and 557 records per tag. Do not drop families. Length 1114 with a duplicated family is a failure.
- |
  Bind typed and history as mappings. Empty mappings are allowed only for draft or source inspection. Project or render requires the declared identity, coverage, evidence, and status joins with executed boolean true. Do not accept a merely nonempty by_identity or by_edition map. Do not fabricate typed, history, configuration, or CPG products.
- |
  Compile with StrictUndefined. Template output/driver.j2. Context driver.phase compile, driver.entry drive, driver.model_entry project_model, plus literals, model, packets, index, typed, history. Expected positive outcome: the document compile: declared.
- |
  Draft inspection of each of the eleven carriers. Template output/model.j2, which calls project_model with literals.phase_draft. Same context as compile except no driver phase is required. typed and history may be empty. Expected positive outcome: Jinja pass, mapping equality with that carrier, zero unknown closed keys, every nonprotected scalar matching the admitted alphabetic URN grammar from packet/parsercontract.yaml. This outcome is not complete acceptance.
- |
  Alternate draft path. Template output/driver.j2. Context driver.phase draft or source, same joins. Expected positive outcome: identical to model.j2 for the same carrier. driver.phase source is the source-only synonym.
- |
  Complete or project acceptance. Template output/driver.j2. Context driver.phase project or render, same packets and index. Expected negative outcome when typed.by_identity or history.by_edition is missing, empty, unrelated to the declared identities, or has executed false or a non-complete status: UndefinedError on missing STRICTABORT. Do not treat a draft pass as this outcome. Do not mint sibling module contents.
- |
  Controls must mutate the actual bound model, packets, index, typed, or history and invoke the same project_model path. Do not use a helper that prints detected. driver.phase fixture is allowed only as an alias that calls project_model with driver.run_phase set to draft, source, project, or render.
- |
  Control missing_domain. Bind fixtures.missing_domain_model as model. Template output/model.j2 or driver.phase fixture with run_phase draft. Keep packets, index, empty typed, empty history. Expected negative outcome: STRICTABORT because IDENTITY or KIND is missing.
- |
  Control unknown_key. Bind fixtures.unknown_key_node as model. Same draft projector path. Expected negative outcome: STRICTABORT on the unregistered Catalog key.
- |
  Control illegal_reference. Copy a bound legal carrier or bind fixtures.illegal_reference_model. Set KIND to literals.illegal_kind_prose or literals.illegal_urn_specimen. Same draft projector path as the eleven carriers, including packets and index. Expected negative outcome: STRICTABORT from require_reference. A successful emit of KIND as plain prose is a failure of this control.
- |
  Control missing_source_api_join. Keep a legal carrier as model. Bind packets to fixtures.missing_join_packets. Same draft projector path. Expected negative outcome: STRICTABORT on a required packet path absent from packets.
- |
  Control missing_required_typed_history. Keep a legal carrier as model and all 1114 packets. Bind typed to empty mapping and history to empty mapping. Template output/driver.j2 with driver.phase project or render, or fixture with run_phase project. Expected negative outcome: STRICTABORT from require_complete_joins. The same empty joins on model.j2 draft inspection remain an explicit gap and must not be reported as complete acceptance.
- |
  Control unexecuted_unrelated_required_joins. Keep a legal carrier as model and all 1114 packets. Bind typed to fixtures.unexecuted_unrelated_typed and history to fixtures.unexecuted_unrelated_history. Template output/driver.j2 with driver.phase project or render. Expected negative outcome: STRICTABORT because the nonempty by_identity and by_edition maps do not contain the declared identities with matching coverage, evidence, and complete status, and executed is boolean false. Nonempty is not completion.
- |
  Control protected_prose_wrong_parent. Bind fixtures.protected_prose_wrong_parent_model as model, or copy a legal carrier and move ShortDescription to the document root. Same draft projector path. Expected negative outcome: STRICTABORT because protected prose admission requires parent METADATA, not key spelling alone. Control valid_protected_metadata remains a legal carrier with METADATA.ShortDescription and must still accept.
- |
  Control duplicate_identity. Bind fixtures.duplicate_identity_model as model. Same draft projector path. Expected negative outcome: STRICTABORT when the same IDENTITY appears twice.
- |
  Control wrong_digest. Keep a legal carrier as model. Bind packets to fixtures.wrong_digest_packets for the search witness path. Same draft projector path. Expected negative outcome: STRICTABORT because packet source sha256 does not equal the required join digest.
- |
  Control nonwitness_api_digest_mismatch. Keep a legal carrier as model, the full apiindex, and all 1114 packets. Mutate packets at literals.nonwitness_control_file so source.sha256 is not the apiindex source_sha256 for that record. Same draft projector path. Expected negative outcome: STRICTABORT from require_index_identities_and_packets. Witness-only digest checks are not admission.
- |
  Control duplicate_apiindex_family_same_total. Keep a legal carrier as model and all 1114 packets. Mutate index.apis by replacing one record with a duplicate of another family so length remains 1114. Same draft projector path. Expected negative outcome: STRICTABORT on duplicate tag and family token, duplicate tag and path, duplicate composite identity, reconstructed path mismatch, or per-tag count not equal to 557.
- |
  Project by walking closed-key MEMBER, CHILD, NEXT, CHAIN, ACTION, and PARAMETERS. Put vendor method tokens, paths, header names, and params only in protected prose or operational join records. Every nonprotected scalar must pass require_reference before emit. Protected prose is only ShortDescription and LongDescription whose parent key is METADATA. The same key spelling at root or under any other parent aborts.
- |
  Abort on missing packet, wrong source digest, unknown closed key, missing KIND on an IDENTITY node, illegal reference, duplicate IDENTITY, unknown driver phase, nonempty typed without by_identity, nonempty history without by_edition, project or render with empty, unrelated, or unexecuted required typed or history joins, ShortDescription or LongDescription whose parent is not METADATA, duplicate apiindex family identity, reconstructed packet path mismatch, per-tag family count other than 557, or any of the 1114 apiindex records whose packet digest does not match.
gaps:
  render_execution: |
    Coordinator runs the renderer. This worker did not execute Jinja.
  coverage_family_complete: |
    Unsupported until actual count and a lawful DeepKV render qualification succeed. Walking the service carrier is not expansion of 557 families.
  typed_interface_join: |
    Required unresolved work owned by urn:silmaril:instance:worker:interface:typed. Draft inspection may retain the empty mapping. Project and render must fail closed until a real by_identity join exists whose keys are the declared required_typed_joins identities and whose overlays carry matching coverage, evidence, complete status, and executed boolean true. A nonempty unrelated or unexecuted map is not that join. This lane does not fabricate the typed module.
  history_join: |
    Required unresolved work owned by urn:silmaril:instance:worker:history:reconciliation. Draft inspection may retain the empty mapping. Project and render must fail closed until a real by_edition join exists whose keys are the declared required_history_joins identities and whose overlays carry matching coverage, evidence, complete status, and executed boolean true. A nonempty unrelated or unexecuted map is not that join. This lane does not fabricate the history module.
  target_parser: |
    Full target parser timeout on the valid KIND fixture remains open. Native closed-key checks and Jinja success are not parser acceptance.
  protected_prose_parent: |
    ShortDescription and LongDescription are protected only under parent METADATA. The same key spelling at root is unprotected and aborts.
  apiindex_identity: |
    Admission walks all 1114 parsed apiindex records. Unique tag, family, path, and source digest plus 557 families per tag are required. Witness-only joins are not admission.
fixtures:
  kind: mutated_join_fixture
  note: |
    These mappings are mutated actual inputs for the same project_model path. Bind them as model, packets, index, typed, or history. Do not run a separate detected helper. Coordinator execution remains unexecuted here. Nonwitness digest and duplicate-family controls mutate the bound 1114-packet and apiindex objects; the specimens here identify the mutation, not a substitute packet set.
