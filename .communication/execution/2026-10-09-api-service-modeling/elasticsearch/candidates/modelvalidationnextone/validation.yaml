schema_version: 1
kind: operational_validation_declaration
qualification: |
  Coordinator owns analysis tooling. This file is the declaration, not execution. A missing, skipped, or unexecuted required check is failed. Optional inapplicability needs a manifest-derived reason. Do not treat this file as a passing receipt. Full target parser timeout remains open. Native closed-key checks and Jinja success are not parser acceptance. Draft or source inspection of the eleven carriers may retain empty typed and history joins and must not be reported as complete. Project or render acceptance must fail when those required modules are missing, empty, unrelated, or unexecuted. Protected prose admission requires parent METADATA. Every one of the 1114 apiindex records must join an exact packet identity. Controls must use the same project_model path; a fixture helper that prints detected is not rejection.
requires:
  family_count:
    identity: urn:silmaril:require:family:count
    expect: 557
    per: tag
    source: packet/apiindex.yaml
    note: |
      Both editions must account 557 REST families including _common. Arbitrary endpoint samples fail coverage. Do not claim coverage family complete until count and a lawful DeepKV render qualification succeed.
  join_apiindex:
    identity: urn:silmaril:require:join:apiindex
    note: |
      Each projected family joins exactly one apiindex record per tag by vendor token and packet path. All 1114 packet/api wrappers are present. The projector validates every record identity, reconstructed path, source digest, uniqueness, and the 557-per-tag denominator. Typed schemas are owned by the typed interface worker; this lane joins that projection. Empty typed mapping is unresolved required work on draft inspection and a failed complete or project acceptance. A nonempty unrelated or unexecuted by_identity map is also a failed complete or project acceptance.
  join_history:
    identity: urn:silmaril:require:join:history
    note: |
      Blame and introducing-commit reconciliation are owned by the history worker. This lane preserves pendingjoins and does not expand 6108 prior groups. Empty history mapping is unresolved required work on draft inspection and a failed complete or project acceptance. A nonempty unrelated or unexecuted by_edition map is also a failed complete or project acceptance.
  status_separation:
    identity: urn:silmaril:require:status:separation
    note: |
      corpus-derived, inferred, unknown, runtime-unexecuted, cpg-pending, retrieval-denied, and blame-unknown remain distinct. cpg-extracted is forbidden on this model.
  parser:
    identity: urn:silmaril:require:parser:deep:key:value
    note: |
      DeepKV carriers parse with deep::key::value::parse. Operational files in this set are provenance, rendering, validation, and handoff; they are not DeepKV carriers. Parser excerpt SHA 00dc3d035e350278ffa0f40fe4c924974c4d41225d7501047fa9fd277aa2c912 remains bound. Full parser timeout on valid_kind remains open.
  projector:
    identity: urn:silmaril:require:projector:walk:authored
    note: |
      model.j2 walks authored MEMBER CHILD NEXT CHAIN ACTION PARAMETERS using closed keys only and require_reference on every nonprotected scalar. Vendor header names, HTTP method tokens, and params must not become YAML keys. KIND is a reference, not plain prose. ShortDescription and LongDescription are protected only when the parent key is METADATA. Abort via missing STRICTABORT, not a printed sentinel and not a detected label. driver phase project or render uses the same walk and also requires complete typed.by_identity and history.by_edition joins, not merely nonempty maps. Every phase validates all 1114 apiindex packet identities.
positive:
- id: coverage-family-count
  topic: coverage family
  expect:
    apis_total: 1114
    families_per_tag: 557
  evidence: packet/apiindex.yaml
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: search-digest
  topic: digest search
  expect:
    source_sha256: 6d9002ded65f464bf36397ba8e1d866ad316baed04f8f7ef407ffe85a6ffc6b4
    tags:
    - v8.18.8
    - v8.18.7
  evidence: packet/apiindex.yaml and packet/api/v8.18.8/search.yaml
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: loci-identity
  topic: loci blob
  expect:
    loci_per_tag: 26
    identical_source_blob_across_tags: true
    rest_controller_blob: 0c55132b3d78c02b7c510eac200115623e67345e
  evidence: packet/sourceindex.yaml
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: header-product
  topic: header product
  expect:
    name_literal: X-elastic-product
    value_literal: Elasticsearch
    source: RestController.java Java lines 89-90
    dispatch: RestController.dispatchRequest METHOD Java 338-351
  evidence: output/rendering.yaml literals plus packet source readback
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: ping-info-split
  topic: root split
  expect:
    info: GET /
    ping: HEAD /
    rest_main_action_routes: Java 31-34
    can_trip_circuit_breaker: Java 60-63 returns false
  note: |
    Projection must not collapse ping and info. Wrapper coordinates 73-75 are not Java lines.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: node-lifecycle-method-bounds
  topic: node lifecycle
  expect:
    start: Java 288-454
    stop: Java 463-502
    close: Java 519-599
  note: |
    Wrapper YAML coordinates 957 and 1073-1083 are not Java lines. In-window start flow includes transport, coordinator, acceptIncomingRequests, and HTTP bind.
  evidence: packet/source Node.java readback and packet/actualgraph methods.yaml
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: indexshard-get-split
  topic: shard get relation
  expect:
    get: Java 1259-1261 innerGet false
    getFromTranslog: Java 1281-1284 innerGet true
  note: |
    Public get is not a translog-or-engine branch. Finding F-INDEXSHARD-GET-RELATION.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: bulk-ndjson
  topic: bulk media
  expect:
    content_type: application/x-ndjson
    routes: RestBulkAction.routes Java 77-91
    source_sha256: 8340825c16faa54d92a5a9576ddbbf849669f65ebc62e56542e3f214d1afe563
  evidence: packet/api/v8.18.8/bulk.yaml headers.content_type
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: graph-static-evidence
  topic: graph counts
  expect:
    joern: 4.0.563
    methodref_without_ref_count: 13374
    missing_support_test_build_files: 669
    nodes_FILE: 12614
    expected_count: 13282
    nodes_UNKNOWN: 69
    source_blame_joins_per_version: 99244
    no_line_per_version: 1292
    methods_per_version: 2192
  note: |
    Counts are source static evidence, not runtime and not semantic proof. UNKNOWN 69 is not a named seventy-file list.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: closed-keys-only
  topic: deepkv keys
  expect: |
    Every mapping key in DeepKV carriers is in the closed registry from parsercontract.yaml.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: alphabetic-urns
  topic: urn grammar
  expect: |
    Every DeepKV scalar except ShortDescription and LongDescription whose parent key is METADATA matches the alphabetic URN regex from packet/parsercontract.yaml, with profile algebra only as registered. project_model require_reference enforces that grammar on the emit path. KIND plain prose or urn:silmaril:version:8:18:8 must STRICTABORT. ShortDescription plain prose at root must STRICTABORT. Target parser remains unexecuted.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: operational-split
  topic: operational separation
  expect: |
    Hashes, numeric counts, vendor tokens with digits or underscores, and Jinja literals live in operational YAML, not as illegal URN segments.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: ontology-uniform
  topic: ontology anchors
  expect:
    ANCHORS: urn:silmaril:ontology:process:cognitive
    INHERITS: urn:silmaril:ontology:basic:formal
    EXTENDS: urn:silmaril:ontology:common:core
  note: |
    Finding F-ONTOLOGY-ANCHOR-SWAP. Every DeepKV carrier in this repair uses the same assignment.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: flags-nested
  topic: flags form
  expect: |
    FLAGS is a nested mapping with IDENTITY and KIND, never a scalar URN.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: projector-walks-authored
  topic: jinja architecture
  expect: |
    project_model walks closed-key MEMBER CHILD NEXT CHAIN ACTION PARAMETERS. It does not dump apiindex as GET/params/X-elastic-product keys or repeat METADATA. Nonprotected scalars pass require_reference. Duplicate IDENTITY aborts. Protected prose requires parent METADATA. All 1114 apiindex records join exact packet identities.
  evidence: output/macros.j2 output/model.j2 output/rendering.yaml
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: parser-timeout-open
  topic: target parser
  expect: |
    valid_kind fixture KIND: urn:silmaril:kind:service completes under deep::key::value::parse.
  evidence: |
    packet/parserbootstrapdiagnostic.yaml exit 0 boot. packet/modelparserone.yaml different SHA 50075eb5... exit -15. Principal reviews record 300 second timeout on valid_kind. This repair has no completed parse receipt.
  required: true
  applicable: true
  executed: true
  status: timed_out
- id: typed-history-unresolved
  topic: external joins
  expect: |
    Draft or source inspection may bind empty typed and history mappings and must record them as required unresolved work. Nonempty without declared shape aborts in every phase. This is not complete acceptance.
  required: true
  applicable: true
  executed: false
  status: unresolved
- id: project-complete-joins
  topic: complete acceptance
  expect: |
    driver phase project or render, or fixture with run_phase project or render, must STRICTABORT when typed.by_identity or history.by_edition is missing, empty, unrelated to the declared identities, missing coverage or evidence, status other than urn:silmaril:status:complete, required or applicable not boolean true, or executed not boolean true. Do not fabricate typed, history, configuration, or CPG outputs. A model.j2 draft pass of service.yaml with empty joins is inspection only.
  required: true
  applicable: true
  executed: false
  status: failed
- id: projector-same-path-controls
  topic: control path
  expect: |
    missing_domain, unknown_key, illegal_reference, missing_source_api_join, duplicate_identity, wrong_digest, protected_prose_wrong_parent, nonwitness_api_digest_mismatch, and duplicate_apiindex_family_same_total mutate actual inputs and call project_model. missing_required_typed_history and unexecuted_unrelated_required_joins call project_model with phase project or render. Expected negative outcome for each is STRICTABORT. Printing detected from a parallel helper is not acceptance of this check.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: protected-prose-parent
  topic: protected prose
  expect: |
    ShortDescription and LongDescription emit as protected prose only when the parent key is METADATA. Control protected_prose_wrong_parent must STRICTABORT. Control valid_protected_metadata must still accept a legal carrier.
  required: true
  applicable: true
  executed: false
  status: unexecuted
- id: all-packet-identities
  topic: apiindex packet join
  expect: |
    require_index_identities_and_packets walks all 1114 apiindex records, reconstructs packet/api/<tag>/<token>.yaml, joins source_sha256, and requires unique tag/family, tag/path, and composite identity plus 557 records per tag. Control nonwitness_api_digest_mismatch must STRICTABORT. Control duplicate_apiindex_family_same_total must STRICTABORT.
  required: true
  applicable: true
  executed: false
  status: unexecuted
negative:
- id: missing-source
  topic: missing source
  error: urn:silmaril:error:validation:missing:source
  fail_when: |
    A family whose joined packet path does not exist under packet/api for that tag. Do not substitute another family. Control missing_source_api_join binds empty packets and must STRICTABORT through require_index_identities_and_packets. Control nonwitness_api_digest_mismatch mutates packet/api/v8.18.8/_internal.delete_desired_balance.yaml and must STRICTABORT even though required_packet_joins witnesses remain intact.
- id: illegal-reference
  topic: reference grammar
  error: urn:silmaril:error:validation:illegal:reference
  fail_when: |
    A nonprotected scalar including KIND is emitted without require_reference, including KIND plain prose and urn:silmaril:version:8:18:8. Control illegal_reference must STRICTABORT on the same project_model walk used for the eleven carriers. ShortDescription or LongDescription whose parent is not METADATA is unprotected prose and must STRICTABORT.
- id: protected-prose-wrong-parent
  topic: protected prose parent
  error: urn:silmaril:error:validation:unprotected:prose
  fail_when: |
    ShortDescription or LongDescription is emitted as prose when the parent key is not METADATA, including ShortDescription plain prose at document root. Control protected_prose_wrong_parent must STRICTABORT. Control valid_protected_metadata must still accept.
- id: missing-required-typed-history
  topic: complete joins
  error: urn:silmaril:error:validation:missing:join
  fail_when: |
    driver phase project or render emits a carrier while typed.by_identity or history.by_edition is missing, empty, unrelated to the declared identities, unexecuted, or lacking matching coverage, evidence, and complete status. Control missing_required_typed_history and control unexecuted_unrelated_required_joins must STRICTABORT. Draft inspection retaining that gap must not be labeled complete.
- id: fake-cpg
  topic: fake cpg
  error: urn:silmaril:error:validation:fake:cpg
  fail_when: |
    Any claim STATUS cpg-extracted, or any AST CFG CALL or data-flow edge not joined from the CPG receipts. Java readback lines are not extractions. Counts alone are not semantic proof.
- id: unresolved-endpoint
  topic: unresolved endpoint
  error: urn:silmaril:error:validation:unresolved:endpoint
  fail_when: |
    A projection emits a method or path not present in the joined packet spec, or a render context missing the packet spec does not fail closed.
- id: lineage-mutation
  topic: lineage mutation
  error: urn:silmaril:error:validation:lineage:mutation
  fail_when: |
    Replacing a family identity, swapping v8.18.7 and v8.18.8 digests, or retargeting a blob to another path. Packet wrapper sha256 is not a substitute for source_sha256. Wrapper YAML coordinates are not a substitute for Java METHOD bounds. Control duplicate_apiindex_family_same_total replacing one family with a duplicate of another while keeping length 1114 must STRICTABORT.
- id: illegal-key-depth
  topic: key depth
  error: urn:silmaril:error:validation:key:depth
  fail_when: |
    YAML keys with hyphen or underscore, fused tokens used as keys, flow collections, sequences in DeepKV carriers, empty branches, or sibling families nested as false taxonomic depth. Vendor tokens belong in operational provenance or protected prose.
- id: tls-mismatch
  topic: tls mismatch
  error: urn:silmaril:error:validation:tls:mismatch
  fail_when: |
    A consumer claim of verified TLS identity while selecting NoopHostnameVerifier or while verificationMode disables hostname verification. A claim of executed TLS handshake in this model. A claim that this model extracted a default-on hostname verification mode.
- id: stale-version
  topic: stale version
  error: urn:silmaril:error:validation:stale:version
  fail_when: |
    Treating spec documentation.url values under /master/ or /current/ as retrieved 8.18 pages, treating Elastic docs version 9 content as 8.18 evidence, or collapsing v8.18.7 and v8.18.8 Java deltas because REST JSON is identical.
- id: duplicate-identity
  topic: duplicate identity
  error: urn:silmaril:error:validation:duplicate:identity
  fail_when: |
    Two families sharing IDENTITY, or duplicate mapping keys in a DeepKV carrier. ping and info sharing path / with different methods are not duplicate identities. Control duplicate_identity binds fixtures.duplicate_identity_model and must STRICTABORT through record_identity on the same walk.
- id: unsupported-runtime
  topic: unsupported runtime
  error: urn:silmaril:error:validation:unsupported:runtime
  fail_when: |
    Any claim that this worker executed HTTP, transport, cluster, or TLS, that CPG is semantically complete, that deployment files in packet/head were observed here, that official web pages were retrieved, or that coverage family is complete before count/render qualification.
- id: silent-literal-absence
  topic: jinja lookup
  error: urn:silmaril:error:validation:silent:literal
  fail_when: |
    Render using MEMBER.Literal.Newline, or any missing literal, succeeds with empty output. Strict undefined must fail. Operational mapping is literals.newline. Emitting VALIDATIONFAILCLOSED as a passing document is the same class of defect.
- id: invented-registry
  topic: registry admission
  error: urn:silmaril:error:validation:invented:registry
  fail_when: |
    New DeepKV keys are admitted without corpus registry change. Proposed Catalog Family Method Path keys remain illegal.
- id: manual-family-expansion
  topic: family catalog
  error: urn:silmaril:error:validation:manual:family:expansion
  fail_when: |
    interfaces.yaml or the projector manually expands 557 families as unregistered grouping keys instead of joining apiindex and the typed interface projection.
- id: wrapper-line-as-java
  topic: citation base
  error: urn:silmaril:error:validation:wrapper:line
  fail_when: |
    Citing packet YAML wrapper coordinates as Java source lines, including RestMainAction 73-75 or Node stop 957 or close 1073-1083.
- id: sourceindex-digest-collapse
  topic: sourceindex digest
  error: urn:silmaril:error:validation:sourceindex:digest
  fail_when: |
    Collapsing render receipt ab084513775ad8cc0bb95dd404cfa092a9e74d42bb40dfbd206181538c9e6f20, blame/priority c721b0d57f0eab0591c887c4f494c7b21faa3ade2328f0593ee0e3f17b49091f, and methods 48caec75399fa30fc97345987a875fad8197bfb9043f4ddf2a0ae99d76e0a9bb into one canonical sourceindex digest without an explaining receipt.
- id: recovery-between-run-stop
  topic: lifecycle order
  error: urn:silmaril:error:validation:recovery:order
  fail_when: |
    Modeling shard-local translog recovery as NEXT of run and PRECEDES of stop, or leaving PRECEDES/FOLLOWS contradicting NEXT on the Node CHAIN.
executor:
  identity: urn:silmaril:expect:validation:coordinator
  status: runtime unexecuted
  records:
  - required
  - applicable
  - executed
  - status
  - evidence
  this_worker_claims_execution: false
  independent_formalreview: pending
  parser_timeout_open: true
  typed_join_unresolved: true
  history_join_unresolved: true
  draft_inspection_not_complete: true
  project_acceptance_with_empty_joins: failed
  project_acceptance_with_unrelated_unexecuted_joins: failed
  protected_prose_requires_metadata_parent: true
  all_1114_packet_identities_required: true
contradictions_traced:
- id: F-PROJ-KEYS
  repair: projector walks closed keys; vendor tokens stay in prose and operational literals
- id: F-PROJ-DUP
  repair: one carrier per emit; no repeated METADATA loop over apiindex
- id: F-PROJ-ARCHITECTURE
  repair: project_model walks authored graph; abort via STRICTABORT
- id: F-PARSER-TIMEOUT
  repair: none; remains open
- id: F-CITE-NODE-STOP
  repair: Node.stop METHOD Java 463-502
- id: F-CITE-RESTMAIN
  repair: RestMainAction.routes METHOD Java 31-34
- id: F-LIFE-CHAIN
  repair: CHAIN construction bootstrap start run stop close; recovery is MEMBER
- id: F-TAXONOMY-FLAT
  repair: editions MEMBER, process CHILD, neighbors NEXT
- id: F-MISSED-INWINDOW-START-FLOW
  repair: start ACTION cites 312 through 427
- id: F-INDEXSHARD-GET-RELATION
  repair: split get and getFromTranslog
- id: F-ONTOLOGY-ANCHOR-SWAP
  repair: uniform ANCHORS process:cognitive INHERITS basic:formal EXTENDS common:core
- id: F-BULK-NDJSON-UNPINNED
  repair: admitted packet/api bulk.yaml content_type application/x-ndjson
- id: F-TLS-DEFAULT-UNEXTRACTED
  repair: none; remains unknown
- id: F-RENDER-FAIL-SENTINEL
  repair: abort looks up missing STRICTABORT
- id: F-TYPED-JOIN-SHAPE
  repair: |
    typed.by_identity declared; empty allowed only on draft or source inspection; project or render aborts on missing, empty, unrelated, or unexecuted required joins; nonempty without shape aborts; identity coverage evidence status and executed boolean true are required for completion
- id: F-PROTECTED-PROSE-PARENT
  repair: |
    emit_scalar admits ShortDescription and LongDescription as prose only when the walk parent key is METADATA
- id: F-NONWITNESS-PACKET-DIGEST
  repair: |
    require_index_identities_and_packets joins every apiindex record, not only required_packet_joins witnesses
- id: F-DUPLICATE-APIINDEX-FAMILY
  repair: |
    unique tag family path source identity and 557-per-tag denominator; length 1114 is not uniqueness
- id: F-RECEIPT-SOURCEINDEX-DIGEST
  repair: all three hashes recorded; not collapsed
- id: F-PROJ-KIND-PROSE
  repair: |
    emit_scalar calls require_reference for every nonprotected scalar including KIND; illegal_kind_prose and illegal_urn_specimen abort through the same walk as the eleven carriers
- id: F-FIXTURE-PARALLEL-PATH
  repair: |
    driver phase fixture calls project_model with driver.run_phase; detected-label helpers removed; controls bind mutated model or packets
