  ShortName: urn:silmaril:name:security:elasticsearch
  ShortDescription: "Authentication, authorization, TLS, and credential-ownership model from production readbacks."
  LongDescription: "Authn is AuthenticationService. Authz is AuthorizationService. TLS is SSLService plus SslSettingsLoader. Hostname verification can be disabled by SslConfiguration.verificationMode, which selects NoopHostnameVerifier. That is a vendor-configured insecure verifier path, not a claim that LME clients may use it. Default verification-mode values were not extracted from SslSettingsLoader. No credentials were read. Runtime TLS was not executed."
