schema_version: 1
carrier:
  kind: operational_literal_format
  deepkv: false
  qualification: >-
    Literal and format atoms for Jinja-rendered Python readback.
    This file is not a Deep KV model carrier.
    Coordinator render then execute is required.
    Authoring does not execute.
admission:
  previously_admitted_parser_excerpt_sha256: 00dc3d035e350278ffa0f40fe4c924974c4d41225d7501047fa9fd277aa2c912
  pending_common_nine_file_packet: false
  prior_failing_source_sha256: 430ced6c4382ada1a6fef5b403618d17a015c19481931c44b864296d82921ab9
  actual_root_failure: "UndefinedError(\"'dict object' has no attribute 'TRUE'\") because unquoted YAML TRUE/FALSE keys parse as bool keys"
  diagnostic_follow_on_failure: "SyntaxError unterminated string at fixture.split because q() embedded a raw newline"
  latest_render_failure: "UndefinedError(\"'dict object' has no attribute 'lparen'\") at readbackmacros.j2 line 480; syntax.lparen exists"
  latest_handoff_failure: "mapping values are not allowed here in handoff.yaml line 44 unquoted colon in {readbackvalues: mapping}"
  latest_control_failures: packet/graphreadbacknextcontrols.yaml
  latest_source_inspection: packet/graphreadbacknextsourceinspection.yaml
  mapping_attribute: "Generated dump_yaml unmatched dictionaries contained dict.items method text because q(ev.items) is a Jinja attribute collision"
  lookup_complexity: "lookup_source scanned every source path for empty FILENAME or unrelated NAME"
  csv_limit: "Generated source lacked csv.field_size_limit"
  namespace_digest: "Bind every graph digest from packet/latest overlay and coverage receipts"
  control_inheritance: "Recursive expect merge inherited production file_nodes_equal_expected"
  live_source_missing: "verify_live_source_octets continued when both live paths were absent"
  joern_header_data_pairing: "Joern 4.0.563 writes stem_header.csv schema, stem_data.csv every data row without a repeated header, and stem_cypher.csv import helpers. data_suffix .csv admitted cypher files and next(reader) on data files treated the first real row as schema."
render:
  engine: jinja2
  context_root: readbackvalues
  context_form: yaml_safe_load_mapping_is_jinja_context
  template: readback.j2
  macros: readbackmacros.j2
  import_form: from_import_with_context
  import_statement: from render.macros import script with context
  import_names:
  - script
  script_kind: python_streaming_csv_qualification
  strict_undefined: true
  autoescape: false
  trim_blocks: false
  lstrip_blocks: false
  keep_trailing_newline: true
  yaml_loader: safe_load
  boolean_keys_quoted: true
  filters_required:
  - name: replace
    source: jinja2_builtin
  filters_optional:
  - name: py_literal
    equivalent_macro: q
    required_by_templates: false
    algorithm:
      wrap: literal.delimiter
      replace_in_order:
      - from: literal.backslash
        to: literal.escaped_backslash
      - from: literal.delimiter
        to: literal.escaped_delimiter
      - from: syntax.newline
        to: literal.escaped_newline
      - from: literal.cr
        to: literal.escaped_cr
      - from: io.tab
        to: literal.escaped_tab
      - from: literal.ff
        to: literal.escaped_ff
      - from: literal.vt
        to: literal.escaped_vt
      - from: literal.nul
        to: literal.escaped_nul
      non_ascii: utf8_source
      bool_null_int: not used by q; tokens py.true_token py.false_token py.none_token and numbers.* remain unquoted
  quoting_macro: q
  colliding_mapping_names:
  - items
  - get
  - keys
  - values
  - update
  - setdefault
  - pop
  colliding_lookup: meth.*_name bracket-safe tokens and io.items_key, never py.items py.get py.keys py.values py.update py.setdefault py.pop or ev.items
