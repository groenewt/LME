count_rules:
  method_dump: >-
    Count non-empty lines in the outFile produced by cpg.method.name
    hashgt redirect. That artifact is query-stage, not this readback
    script.
  file_nodes: >-
    Count FILE nodes actually present in nodes_FILE_data.csv after
    streaming every data row under the paired nodes_FILE_header.csv
    schema. Compare to expected_files for the active namespace. Do not
    substitute interpreter 12614 as the success target. Do not parse
    nodes_FILE_cypher.csv as graph records.
  classified_edges: >-
    Count every AST CFG CALL CDG REACHING_DEF and SOURCE_FILE row from
    the matching edges_*_data.csv files using the paired
    edges_*_header.csv schema. Do not sample. Do not parse
    edges_*_cypher.csv as graph records.
  unresolved: >-
    Count METHOD_REF identifiers without REF edges, CALL METHOD_FULL_NAME
    containing unresolvedSignature, and METHOD IS_EXTERNAL true. Official
    dataflow text says methods without semantic definitions conservatively
    propagate among arguments and return. That is imprecision, not proof
    of a resolved path.
  unmatched_sources: >-
    Emit every sources.yaml original path absent from FILE NAME joins,
    including staged_path aliases for supplemental graphs, not a
    truncated limit. Dump key is declared io.items_key, never a dict
    items method.
  disallowed: >-
    Stream every malformed or dangling or forged row into
    output/disallowed-rows.yaml and keep a count.
  overlays: >-
    Treat data-flow edges as calculated only after run.ossdataflow
    execution and export observations that exhibit dataflowOss plus
    REACHING_DEF rows.
  receipts: >-
    Verify CPG sha256, source manifest sha256 when declared, and every
    csvschema header sha256 when the file exists. Missing data files
    fail. Unavailable data-file digests are recorded as unavailable, not
    as pass. Missing live source octets fail when verify_live_source_octets
    is true.
  namespaces: >-
    Never join node or edge identifiers across the four CPG identities.
    Bind overwrites graph digest and source keys and pops leftover keys
    absent from the matching graph.
  fixtures: >-
    Every fixture control generates or copies a distinct owned fixture
    under parameters.projection_dir then modifies exactly its targeted
    pair files. Owned graphs use stem_header.csv, stem_data.csv with no
    repeated header, and stem_cypher.csv helpers. Never mutate original
    exports, sources, or CPGs. Local accepted true is not production
    completeness.
  lookups: >-
    Source path matching uses a basename index, empty-name guard, FILE
    NAME lookup, and FILENAME lookup only when FILENAME is present and
    the node is not FILE. Ambiguous suffix matches are preserved. No
    sample cutoff.
  csv_fields: >-
    csv.field_size_limit is the declared csv_limits.field_size_limit
    2147483647.
  csv_pairs: >-
    Joern 4.0.563 tables are stem_header.csv schema, stem_data.csv every
    real row with no repeated header, and stem_cypher.csv import helpers.
