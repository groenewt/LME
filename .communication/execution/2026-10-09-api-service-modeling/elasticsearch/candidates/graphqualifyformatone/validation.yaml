    Exit status zero is not success. Actual FILE counts, unmatched source
    lists, unresolved METHOD_REF, classified CSV rows, and header/data
    receipts decide. Overlay name dataflowOss is not complete coverage.
    A required unexecuted control is blocked. Union of four CPG identities
    is not one graph. Local fixture accepted true is not production
    completeness. Each control expect map is complete and independent;
    recursive inheritance of production expectations is rejected.
