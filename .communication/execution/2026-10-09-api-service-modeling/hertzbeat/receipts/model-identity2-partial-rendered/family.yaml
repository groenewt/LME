IDENTITY: urn:silmaril:instance:family
KIND: urn:silmaril:type:kind:taxonomy
TYPE: urn:silmaril:instance:document:specification:taxonomy
CLASSIFIES: urn:silmaril:instance:service:hertz:beat
STATUS: urn:silmaril:plan:consolidated:revision:section:value:numeric:natrual:three:status:declared
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
ANCHORS: urn:silmaril:instance:ontology:basic:formal
METADATA:
  ShortDescription: "Finite family spine for HertzBeat. Each MEMBER is a modeled family. Foreign module and protocol spellings stay in protected prose. Backing services are classified as separate identities, not absorbed."
MEMBER:
  IDENTITY: urn:silmaril:instance:family:module
  KIND: urn:silmaril:type:kind:family
  ROLE: urn:silmaril:instance:role:module
  METADATA:
    ShortDescription: "Maven reactor modules from root pom.xml. 180 has hertzbeat-common and hertzbeat-log. v190 and head replace those with hertzbeat-common-core, hertzbeat-common-spring, and hertzbeat-observability. template-marketplace is a 180 tree not listed in the root modules block."
  NEXT:
    IDENTITY: urn:silmaril:instance:family:interface
    KIND: urn:silmaril:type:kind:family
    ROLE: urn:silmaril:instance:role:interface
    METADATA:
      ShortDescription: "REST controllers, Message envelope, Sureness resourceRole rules, Spring MCP streamable endpoint. Peer interface catalogs remain provisional receipts, not this child's canonical registry."
    NEXT:
      IDENTITY: urn:silmaril:instance:family:protocol
      KIND: urn:silmaril:type:kind:family
      ROLE: urn:silmaril:instance:role:protocol
      METADATA:
        ShortDescription: "Collector supportProtocol literals from AbstractCollect SPI plus DispatchConstants extras. SQL collection is JDBC. SSH REST and JMX are source literals http ssh jmx. sql remains a recorded unlawful lexeme in the corpus and is not minted here."
      NEXT:
        IDENTITY: urn:silmaril:instance:family:schedule
        KIND: urn:silmaril:type:kind:family
        ROLE: urn:silmaril:instance:role:schedule
        METADATA:
          ShortDescription: "TimerDispatcher hashed wheel, cyclic and temporary jobs, CronExpression, ScheduleTypeEnum. CollectStrategyFactory ServiceLoader registry is discovery, not the timer."
        NEXT:
          IDENTITY: urn:silmaril:instance:family:collect
          KIND: urn:silmaril:type:kind:family
          ROLE: urn:silmaril:instance:role:collect
          METADATA:
            ShortDescription: "AbstractCollect SPI roster 37 implementations per pin. 180 includes PushCollectImpl. v190 and head replace it with ZookeeperSdCollectImpl. PrometheusAutoCollectImpl is not an SPI row."
          NEXT:
            IDENTITY: urn:silmaril:instance:family:numeric
            KIND: urn:silmaril:type:kind:family
            ROLE: urn:silmaril:instance:role:sample
            METADATA:
              ShortDescription: "CollectRep MetricsData Apache Arrow on all three pins. History adapters, codecs, and exports are numeric-peer territory. Numeric draft had three YAML syntax errors; read as source draft only."
            NEXT:
              IDENTITY: urn:silmaril:instance:family:alert
              KIND: urn:silmaril:type:kind:family
              ROLE: urn:silmaril:instance:role:alert
              METADATA:
                ShortDescription: "Alert status firing pending resolved, silence inhibit group converge, metric and log threshold kinds, monitor up down paused codes from CommonConstants."
              NEXT:
                IDENTITY: urn:silmaril:instance:family:auth
                KIND: urn:silmaril:type:kind:family
                ROLE: urn:silmaril:instance:role:auth
                METADATA:
                  ShortDescription: "Sureness resourceRole and excludedResource. Roles admin user guest. Plugin REST admin only. Secret config admin only. Browser Bearer token is a client of this family, not a second auth engine."
                NEXT:
                  IDENTITY: urn:silmaril:instance:family:storage
                  KIND: urn:silmaril:type:kind:family
                  ROLE: urn:silmaril:instance:role:storage
                  METADATA:
                    ShortDescription: "Warehouse realtime memory and redis. History tsdb adapters. These adapters are HertzBeat storage ports. The backing database products remain separately owned identities."
                  NEXT:
                    IDENTITY: urn:silmaril:instance:family:lifecycle
                    KIND: urn:silmaril:type:kind:family
                    ROLE: urn:silmaril:instance:role:lifecycle
                    METADATA:
                      ShortDescription: "Startup application, assembly scripts, docker build, native collector packages from v190, plugin jar load, monitor types normal push-auto discovery-auto."
                    NEXT:
                      IDENTITY: urn:silmaril:instance:family:dependency
                      KIND: urn:silmaril:type:kind:family
                      ROLE: urn:silmaril:instance:role:dependency
                      METADATA:
                        ShortDescription: "Declared Maven and Helm dependencies. Helm gitlink is a separately committed chart. In-chart postgres and victoria-metrics are backing services, not HertzBeat modules."
                      NEXT:
                        IDENTITY: urn:silmaril:instance:family:browser
                        KIND: urn:silmaril:type:kind:family
                        ROLE: urn:silmaril:instance:role:browser
                        METADATA:
                          ShortDescription: "web-app Angular package hertzbeat-web-app. DefaultInterceptor, environment api baseUrl, localStorage Authorization. Peer browser contracts are provisional."
                        NEXT:
                          IDENTITY: urn:silmaril:instance:family:model:context
                          KIND: urn:silmaril:type:kind:family
                          ROLE: urn:silmaril:instance:role:interface
                          METADATA:
                            ShortDescription: "Spring AI MCP streamable-http mcp-endpoint /api/mcp on startup. Letters MCP are a foreign acronym and ride only as a fragment locator plus prose, never as a minted segment. Separate mcp-servers trees: Java mcp-log-server and Rust mcp-bash-server. Helm SSE transport is a distinct projection."
                          NEXT:
                            IDENTITY: urn:silmaril:instance:family:rust
                            KIND: urn:silmaril:type:kind:family
                            ROLE: urn:silmaril:instance:role:package
                            METADATA:
                              ShortDescription: "mcp-bash-server is the only in-tree Rust package. It is not a metrics collector. Validator order from source is blacklist then whitelist then default deny. Peer catalog phrase whitelist then blacklist is an open source finding SRC9-F01."
                            NEXT:
                              IDENTITY: urn:silmaril:instance:family:package
                              KIND: urn:silmaril:type:kind:family
                              ROLE: urn:silmaril:instance:role:package
                              METADATA:
                                ShortDescription: "JVM server and collector assembly scripts on all pins. Native collector launchers and assembly-native.xml on v190 and head only. Dockerfiles under script/docker."
                              NEXT:
                                IDENTITY: urn:silmaril:instance:family:plugin
                                KIND: urn:silmaril:type:kind:family
                                ROLE: urn:silmaril:instance:role:plugin
                                METADATA:
                                  ShortDescription: "Plugin PostAlertPlugin PostCollectPlugin ServiceLoader ABI distinct from AbstractCollect SPI. In-tree META-INF services files carry license header only."
                                NEXT:
                                  IDENTITY: urn:silmaril:instance:family:observability
                                  KIND: urn:silmaril:type:kind:family
                                  ROLE: urn:silmaril:instance:role:sample
                                  METADATA:
                                    ShortDescription: "v190 and head hertzbeat-observability module family. Distinct from 180 hertzbeat-log. Not a fused HertzBeat product identity."
CHILD:
  IDENTITY: urn:silmaril:instance:family:backing
  KIND: urn:silmaril:type:kind:family
  DISPOSITION: urn:silmaril:instance:disposition:separate
  METADATA:
    ShortDescription: "Backing services classified only as foreign dependencies. Not owned as HertzBeat identities: PostgreSQL, MySQL, H2, VictoriaMetrics, Greptime, TDengine, IoTDB, Influx, QuestDB, DuckDB, Doris, Redis, Grafana as external dashboard product, Kafka as monitored and client protocol."
