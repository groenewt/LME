  - id: kafka.deserialize.invalid.source_versus_observed
    statement: KafkaMetricsDataDeserializerTest.testDeserializeWithInvalidBytes feeds UTF-8 bytes of invalid data and assertThrows RuntimeException. Production deserialize catches IOException only and wraps RuntimeException Failed to deserialize Arrow table. Admitted native runs observed java.lang.OutOfMemoryError Java heap space in Arrow MessageSerializer.readMessage ByteBuffer.allocate; the RuntimeException assertion was not satisfied and the fork stopped. Remaining tests of that class after the crash are unexecuted, never implied pass. Overall Arrow selection FAILED on all three pins for this case. Not a cgroup OOM and not an invented external cause. Source fixture expectation and observed failure are distinct.
