schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: contract.history-lifecycle
status: source-bound-static
not_runtime_proven: true
claims:
  - id: history.rest.split
    statement: GET /api/monitor/{instance}/metric/{metricFull} requires exactly three dot-separated parts. Default history is 6h. interval false selects getHistoryMetricData; true selects getHistoryIntervalMetricData (max/min/mean).
  - id: status.shape.change
    statement: 1.8.0 GET /api/warehouse/storage/status returns Message<Void> success or FAIL_CODE Service not available. v1.9.0/HEAD returns Message<WarehouseStorageStatus> with available, droppedMetrics, pendingMetrics and still sets FAIL_CODE plus that message when available is false.
  - id: history.validation.v190
    statement: v190/HEAD MetricsDataServiceImpl validates history as 1-6 digits plus smhdwy, and app/metrics/metric/instance identifier patterns. 1.8.0 service does not.
  - id: jpa.name.without.impl
    statement: WarehouseConstants.HistoryName.JPA equals jpa on all three pins. No Jpa*DataStorage class exists. History entity hzb_history and HistoryDao exist.
  - id: duckdb.default.on
    statement: application.yml warehouse.store.duckdb.enabled is true on all three pins; other history stores default false. Memory realtime defaults enabled true with matchIfMissing true.
  - id: doris.v190
    statement: DorisDataStorage, doris constant, and application.yml doris block exist on v190/HEAD and are absent from 180 warehouse Java and 180 application.yml.
  - id: adapter.denominator
    statement: History storage classes 8 on 180, 9 on v190/HEAD plus JPA name without class. Realtime adapters 2. QueryExecutor concrete classes 3 on 180 (Greptime-sql, Greptime-promql, VictoriaMetrics) and 4 on v190/HEAD (adds VictoriaMetricsCluster). Warehouse Java files 66 on 180, 88 on HEAD.
  - id: dispatch.close
    statement: DataStorageDispatch always writes realtime after optional history save. Memory and Redis close CollectRep.MetricsData on non-success and after replace/hset. History impls implement DisposableBean.destroy.
  - id: adapter.payloads.complete
    statement: All eight 180 and nine v190/HEAD history adapters plus three/four query executors have service-owned SQL/PromQL/HTTP template references, selectors, type conversions, NULL_VALUE, drop, time, error, and retention contracts in candidate/values/history-adapters.yaml. Backing-store server internals remain a separate lane.
  - id: greptime.sql.query.null
    statement: GreptimeSqlQueryExecutor implements execute POST /v1/sql for warehouse-internal SQL. It does not override query. SqlQueryExecutor.query returns null, so DatasourceQueryServiceImpl.query for Greptime-sql yields a null DatasourceQueryData.
  - id: questdb.history.units
    statement: QuestdbDataStorage.getDateAdd accepts only d h m s after lowercasing. 1w and 1y raise IllegalArgumentException. Influx and TDengine interpolate the history token into now()-style SQL.
  - id: doris.retention.defaults
    statement: application.yml partition-retention-days is 30. DorisProperties.TableConfig @DefaultValue is 7 and clamps non-positive to 7. Partition properties apply only when enable-partition is true; application.yml sets enable-partition false.
sourced_from:
  - candidate/values/history-lifecycle.yaml
  - candidate/values/history-adapters.yaml
