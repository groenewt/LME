schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: contract.numeric-arrow
status: source-bound-static
not_runtime_proven: true
claims:
  - id: collectrep.arrow.utf8
    statement: CollectRep.MetricsData stores sample columns as Arrow Utf8 VarChar vectors with schema and field metadata; numeric meaning is TYPE_* metadata plus consumer parse, not Arrow Int/FloatingPoint in this class.
    editions: ["180", v190, head]
  - id: no.valuetype.class
    statement: No ValueType type exists in the three pins. Field types are CommonConstants byte constants and CollectRep.Field int type.
  - id: ipc.multi-root
    statement: ArrowUtil.serializeMultipleRoots writes Java DataOutputStream int32 rootCount then per-root int32 length plus ArrowStream bytes. Kafka and Redis codecs write a single ArrowStream without that envelope.
  - id: collectrep.180.setSafe.comment
    statement: v190/HEAD CollectRep Builder.build adds a one-line comment that setSafe grows the variable-width buffer. 180 calls setSafe without that comment. ArrowUtil blob is identical on all three pins.
  - id: allocation
    statement: Builder.build owns a RootAllocator and closes the VectorSchemaRoot in finally. MetricsData.close closes the ArrowTable. toVectorSchemaRootAndRelease transfers vectors and empties the table.
  - id: alerter.parse.180.vs.v190
    statement: All pins map NULL_VALUE to null and continue. v190/HEAD always put parseStrDouble/parseStrInteger results, including null, so JEXL sees defined keys. 180 puts TYPE_NUMBER/TYPE_TIME only when parse is non-null and other types only when non-empty.
  - id: arrowutil.test.int64.multi-root
    statement: ArrowUtilTest.testSerializeAndDeserializeMultipleRoots round-trips ArrowType.Int 64 signed values 100 and 200. CollectRep itself stores Utf8; that test exercises the generic multi-root envelope, not CollectRep column types.
callers_to_trace_statically:
  - CollectRep.MetricsData.Builder.build
  - CollectRep.MetricsData.toByteArrayAndRelease
  - CollectRep.MetricsData.getValues
  - CollectRep.MetricsData.readRow
  - ArrowUtil.serializeMetricsData
  - ArrowUtil.deserializeMetricsData
  - KafkaMetricsDataSerializer.serialize
  - KafkaMetricsDataDeserializer.deserialize
  - RedisMetricsDataCodec.encodeValue
  - RedisMetricsDataCodec.decodeValue
  - MemoryDataStorage.saveData
  - RedisDataStorage.saveData
  - HistoryDataWriter.saveData implementations
  - MetricsDataServiceImpl.getMetricsData
  - MetricsRealTimeAlertCalculator field parse
