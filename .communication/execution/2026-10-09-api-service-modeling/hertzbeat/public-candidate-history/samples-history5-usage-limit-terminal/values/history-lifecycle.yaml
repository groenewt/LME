  redis_saveData: SUCCESS hset then close; else close
  destroy:
    MemoryDataStorage: clear map
    RedisDataStorage: redisCommandDelegate.destroy
    history_impls: DisposableBean.destroy on TdEngine VictoriaMetrics Greptime IoTDB DuckDB Influx QuestDB Doris
