schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: render-recipe
engine: jinja2
undefined: jinja2.StrictUndefined
autoescape: false
trim_blocks: true
lstrip_blocks: false
keep_trailing_newline: true
custom_filters: []
custom_tests: []
custom_globals: []
new_renderer_or_helper_engine: false
loader:
  class: jinja2.FileSystemLoader
  searchpath:
    - candidate/templates
preload_named_immutable_yaml_mappings_as_context: true
do_not_flatten_preload_mappings: true
macros_require_explicit_arguments_or_with_context: true
no_custom_source_filters: true
no_permissive_undefined: true
stock_filters_used_in_macros: [string, lower]
explicit_named_context_keys:
  - pins
  - pom_tools
  - numeric_arrow
  - history_lifecycle
  - history_adapters
  - codecs
  - fixtures_positive
  - fixtures_negative
preload_immutable_values:
  pins: candidate/values/pins.yaml
  pom_tools: candidate/values/pom-tools.yaml
  numeric_arrow: candidate/values/numeric-arrow.yaml
  history_lifecycle: candidate/values/history-lifecycle.yaml
  history_adapters: candidate/values/history-adapters.yaml
  codecs: candidate/values/codecs.yaml
  fixtures_positive: candidate/fixtures/positive.yaml
  fixtures_negative: candidate/fixtures/negative.yaml
entries:
  - id: render-all
    template: render-all.j2
    output: candidate/rendered/numeric-arrow-history.yaml
    expected: candidate/fixtures/expected-render.yaml
    named_context: explicit_named_context_keys
  - id: fixture-ids
    template: fixtures.j2
    output: candidate/rendered/fixture-ids.yaml
    expected: candidate/fixtures/expected-fixture-ids.yaml
    named_context: explicit_named_context_keys
  - id: source-span-macro
    template: source-span.j2
    output: candidate/rendered/common-constants-span.yaml
    expected: candidate/fixtures/expected-source-span.yaml
    named_context: explicit_named_context_keys
    note: from macros.j2 import source_span with context; path start end git_blob sha256 plus all named preload mappings as arguments.
  - id: adapters
    template: adapters.j2
    output: candidate/rendered/history-adapters.yaml
    expected: candidate/fixtures/expected-adapters.yaml
    named_context: explicit_named_context_keys
    note: from macros.j2 import adapter_class_line with context; class_name protocol prefix plus all named preload mappings as arguments. YAML indent and keys are quoted tokens inside the macro so opening whitespace strip cannot drop the two-space sequence marker. Do not replace this template with a static copy of expected-adapters.yaml.
stock_environment_constructor:
  - Environment
  - loader FileSystemLoader searchpath candidate/templates
  - undefined StrictUndefined
  - no extensions
coordinator_may_merge_yaml_mappings_into_template_globals: true
merge_uses_explicit_named_context_keys: true
do_not_run_in_this_author: true
