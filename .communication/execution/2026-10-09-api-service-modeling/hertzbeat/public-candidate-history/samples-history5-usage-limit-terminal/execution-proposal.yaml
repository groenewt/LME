schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: execution-proposal
status: coordinator_selected_unit_receipts_admitted_not_global_pass
author_ran_commands: false
invented_outputs: false
live_service_access: false
admitted_native_receipts:
  evidence: candidate/native-test-evidence.yaml
  arrow_xml_positive_cases: {180: 26, v190: 40, head: 40}
  overall_arrow_selection: failed_on_all3pins_due_to_invalid_bytes_test_Java_heap_space
  warehouse_cases_per_pin: 7
  warehouse_exits: [0, 0, 0]
  kafka_deserialize_invalid:
    source_fixture_expectation: RuntimeException
    observed: java.lang.OutOfMemoryError Java heap space
    assertion_satisfied: false
  global_suite_or_service_runtime_pass: false
provisioning: coordinator_within_hard_descendant_resource_limits
toolchain_qualification:
  native_host_java_currently: "21"
  source_180_target: "17"
  source_v190_head_target: "25"
  maven_wrapper_distribution: "3.9.9"
  coordinator_checking_shared_provisioned_Java25_and_Maven3.9.9: true
  location: private native build scratch
  author_execution: false
wrapper:
  path: .mvn/wrapper/maven-wrapper.properties
  wrapperVersion: "3.3.2"
  maven: "3.9.9"
  git_blob: 094f1823d87c80dc27801f86be886d045bb0000c
  sha256: 6b5345d98c6e103ed4c4c16763ec995e7d67aab8bee972a810c63057122414f3
arrow:
  version: "18.1.0"
  artifacts: [arrow-vector, arrow-memory-netty]
surefire_argLine: "${argLine} --add-opens=java.base/java.nio=org.apache.arrow.memory.core,ALL-UNNAMED"
selections:
  - id: v190-head-common-core-arrow-codec
    editions: [v190, head]
    java.version: "25"
    spring_boot_parent: "4.0.3"
    maven-surefire-plugin.version: "3.2.5"
    working_tree: input/source/{edition}
    module: hertzbeat-common-core
    command: ./mvnw -pl hertzbeat-common-core -am test -Dtest=ArrowUtilTest,ArrowTableTest,KafkaMetricsDataSerializerTest,KafkaMetricsDataDeserializerTest,RedisMetricsDataCodecTest,CommonUtilTest
    tests:
      - org.apache.hertzbeat.common.util.ArrowUtilTest
      - org.apache.arrow.vector.table.ArrowTableTest
      - org.apache.hertzbeat.common.serialize.KafkaMetricsDataSerializerTest
      - org.apache.hertzbeat.common.serialize.KafkaMetricsDataDeserializerTest
      - org.apache.hertzbeat.common.serialize.RedisMetricsDataCodecTest
      - org.apache.hertzbeat.common.util.CommonUtilTest
    expected_from_source_not_runtime:
      - ArrowUtilTest two-root Int64 roundtrip 100 and 200
      - ArrowUtilTest MetricsData linux usage column 50.5
      - KafkaMetricsDataSerializerTest null serialize returns null
      - KafkaMetricsDataSerializerTest preservesLargeMetricValueThroughArrowIpc 100000 a characters
      - RedisMetricsDataCodecTest encodeDecodeKeepsZeroRowTimeout
      - CommonUtilTest parseStrDouble literals
  - id: v190-head-warehouse-history-http
    editions: [v190, head]
    java.version: "25"
    module: hertzbeat-warehouse
    command: ./mvnw -pl hertzbeat-warehouse -am test -Dtest=MetricsDataControllerTest,MemoryDataStorageTest
    tests:
      - org.apache.hertzbeat.warehouse.controller.MetricsDataControllerTest
      - org.apache.hertzbeat.warehouse.store.MemoryDataStorageTest
    expected_from_source_not_runtime:
      - status available code 0 data.available true
      - status unavailable FAIL_CODE with droppedMetrics 7 pendingMetrics 3
      - empty realtime msg query metrics data is empty
      - illegal metricFull linux.usage raises IllegalArgumentException
      - MemoryDataStorage.destroy clears map
  - id: 180-common-arrow-codec
    editions: ["180"]
    java.version: "17"
    spring_boot_parent: "3.4.2"
    maven-surefire-plugin.version: "2.22.2"
    working_tree: input/source/180
    module: hertzbeat-common
    command: ./mvnw -pl hertzbeat-common -am test -Dtest=ArrowUtilTest,ArrowTableTest,KafkaMetricsDataSerializerTest,KafkaMetricsDataDeserializerTest,CommonUtilTest
    omit:
      - RedisMetricsDataCodecTest
      - KafkaMetricsDataSerializerTest.preservesLargeMetricValueThroughArrowIpc
    tests:
      - org.apache.hertzbeat.common.util.ArrowUtilTest
      - org.apache.arrow.vector.table.ArrowTableTest
      - org.apache.hertzbeat.common.serialize.KafkaMetricsDataSerializerTest
      - org.apache.hertzbeat.common.serialize.KafkaMetricsDataDeserializerTest
      - org.apache.hertzbeat.common.util.CommonUtilTest
  - id: 180-warehouse-history-http
    editions: ["180"]
    java.version: "17"
    module: hertzbeat-warehouse
    command: ./mvnw -pl hertzbeat-warehouse -am test -Dtest=MetricsDataControllerTest,MemoryDataStorageTest
    tests:
      - org.apache.hertzbeat.warehouse.controller.MetricsDataControllerTest
      - org.apache.hertzbeat.warehouse.store.MemoryDataStorageTest
    note: 180 MetricsDataControllerTest must use the 180 controller Message<Void> status shape; do not run the v190/HEAD test class against 180.
not_selected:
  - live warehouse against Kafka Redis Greptime PostgreSQL
  - e2e collector tests
  - RedisLogEntryCodecTest as numeric CollectRep sample
limits:
  no_network_service_credentials: true
  descendant_resource_envelope: coordinator
jinja_render:
  recipe: candidate/render-recipe.yaml
  compare:
    - {output: candidate/rendered/numeric-arrow-history.yaml, expected: candidate/fixtures/expected-render.yaml}
    - {output: candidate/rendered/fixture-ids.yaml, expected: candidate/fixtures/expected-fixture-ids.yaml}
    - {output: candidate/rendered/common-constants-span.yaml, expected: candidate/fixtures/expected-source-span.yaml}
    - {output: candidate/rendered/history-adapters.yaml, expected: candidate/fixtures/expected-adapters.yaml}
  also_not_executed_here: true
