schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: fixtures.positive
independent: true
execution: not_run_by_this_author
positive:
  - id: arrow.deserialize.empty
    input: null
    expect: []
    source: ArrowUtil.deserializeMetricsData lines 130-133 all three pins
  - id: arrow.deserialize.empty-bytes
    input: ""
    expect: []
    source: ArrowUtil.deserializeMetricsData data.length == 0
  - id: collectrep.code.success
    call: CollectRep.Code.forNumber(0)
    expect: SUCCESS
    source: CollectRep.java 107-108
  - id: collectrep.code.timeout
    call: CollectRep.Code.forNumber(5)
    expect: TIMEOUT
    source: CollectRep.java 112
  - id: field.type.number
    value: 0
    expect: TYPE_NUMBER
    source: CommonConstants.java:188
  - id: null.sentinel
    token: "&nbsp;"
    expect: CommonConstants.NULL_VALUE
    source: CommonConstants.java:208
  - id: history.default
    history: null
    expect: "6h"
    source: MetricsDataServiceImpl getMetricHistoryData
  - id: metric.full.linux.cpu.usage
    metricFull: linux.cpu.usage
    split: {app: linux, metrics: cpu, metric: usage}
    expect: length 3
    source: MetricsDataController METRIC_FULL_LENGTH 3
  - id: ipc.two.roots.roundtrip
    roots: 2
    expect_after_deserialize: 2
    source: ArrowUtilTest.testSerializeAndDeserializeMultipleRoots
    field1_value: 100
    field2_value: 200
  - id: metricsdata.roundtrip.usage
    app: linux
    column: "50.5"
    expect_app: linux
    expect_column: "50.5"
    source: ArrowUtilTest.testSerializeAndDeserializeMetricsData
  - id: kafka.serialize.nonnull
    expect: not_null_bytes
    source: KafkaMetricsDataSerializerTest.testSerializeWithMetricsData
  - id: redis.roundtrip.v190.head
    editions: [v190, head]
    metrics_id: 123
    column: "42"
    expect_code: SUCCESS
    expect_column: "42"
    source: RedisMetricsDataCodecTest.encodeDecodePreservesRows
  - id: redis.timeout.zero.row.v190.head
    editions: [v190, head]
    code: TIMEOUT
    msg: Collect Timeout No Response
    expect_rowCount: 0
    expect_not_null: true
    source: RedisMetricsDataCodecTest.encodeDecodeKeepsZeroRowTimeout
  - id: warehouse.status.available.v190.head
    editions: [v190, head]
    when: {available: true, droppedMetrics: 0, pendingMetrics: 0}
    expect: {code: 0, data: {available: true, droppedMetrics: 0, pendingMetrics: 0}}
    source: MetricsDataControllerTest.getWarehouseStorageServerStatus
  - id: warehouse.status.available.180
    editions: ["180"]
    when: true
    expect: {code: 0, data: null}
    source: 180 MetricsDataController Message.success()
  - id: realtime.empty
    when: getMetricsData null
    expect: {code: 0, msg: "query metrics data is empty"}
    source: MetricsDataController.java all three pins
  - id: parse.double.10.125
    input: "10.125"
    expect: 10.125
    source: CommonUtilTest
  - id: duckdb.enabled.default
    expect: true
    source: application.yml warehouse.store.duckdb.enabled
  - id: arrow.version
    expect: "18.1.0"
    source: pom.xml arrow.version all three pins
  - id: adapter.tdengine.insert.sql
    expect: "INSERT INTO `%s` USING `%s` TAGS (%s) VALUES %s"
    source: TdEngineDataStorage INSERT_TABLE_DATA_SQL all three pins
  - id: adapter.influx.history.sql
    expect: "SELECT metric_labels, \"%s\" FROM \"%s\" WHERE time >= now() - %s order by time desc"
    source: InfluxdbDataStorage QUERY_HISTORY_SQL all three pins
  - id: adapter.iotdb.set.ttl
    expect: "set ttl to %s %s"
    source: IotDbDataStorage SET_TTL
  - id: adapter.vm.import.path
    expect: /api/v1/import
    source: VictoriaMetricsDataStorage IMPORT_PATH
  - id: adapter.greptime.query.range
    expect: /v1/prometheus/api/v1/query_range
    source: GreptimeDbDataStorage QUERY_RANGE_PATH
  - id: adapter.duckdb.history.limit
    expect: 20000
    source: DuckdbDatabaseDataStorage LIMIT 20000
  - id: adapter.doris.query.limit
    editions: [v190, head]
    expect: 20000
    source: DorisDataStorage MAX_QUERY_LIMIT
  - id: adapter.questdb.exec.path
    expect: "/exec?query="
    source: QuestdbDataStorage queryBaseUrl
  - id: adapter.promql.range.path
    expect: /api/v1/query_range
    source: PromqlQueryExecutor QUERY_RANGE_PATH
  - id: adapter.greptime.sql.path
    expect: /v1/sql
    source: GreptimeSqlQueryExecutor QUERY_PATH
  - id: query.executors.mapped
    expect:
      - {datasource: Greptime-sql, language: sql, editions: ["180", v190, head]}
      - {datasource: Greptime-promql, language: promql, editions: ["180", v190, head]}
      - {datasource: VictoriaMetrics, language: promql, editions: ["180", v190, head]}
      - {datasource: VictoriaMetricsCluster, language: promql, editions: [v190, head]}
    source: warehouse db QueryExecutor subclasses; cluster class absent on 180
