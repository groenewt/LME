schema: hertzbeat.public-source.numeric-arrow-history-author/v1
kind: fixtures.negative
independent: true
execution: not_run_by_this_author
negative:
  - id: collectrep.unrecognized.getNumber
    call: CollectRep.Code.UNRECOGNIZED.getNumber()
    expect_exception: IllegalArgumentException
    expect_message: "Can't get the number of an unknown enum value."
    source: CollectRep.java:98-101
  - id: collectrep.forNumber.unknown
    call: CollectRep.Code.forNumber(6)
    expect: null
    source: CollectRep.java:113 default
  - id: value.row.addColumns.null
    call: ValueRow.addColumns(null)
    expect_exception: NullPointerException
    source: CollectRep.java:699-702
  - id: kafka.serialize.null
    call: KafkaMetricsDataSerializer.serialize("", null)
    expect: null
    source: KafkaMetricsDataSerializer.java:46-48
  - id: kafka.deserialize.invalid
    input: "invalid data"
    charset: UTF-8
    source_fixture_expectation:
      test: KafkaMetricsDataDeserializerTest.testDeserializeWithInvalidBytes
      lines: [88, 92]
      assertThrows: RuntimeException
      production_io_wrapper_message: "Failed to deserialize Arrow table"
    observed_native:
      error: java.lang.OutOfMemoryError
      message: Java heap space
      site: Arrow MessageSerializer.readMessage ByteBuffer.allocate
      assertion_satisfied: false
      fork_stopped: true
      remaining_class_tests: Unexecuted after fork crash, never implied pass
      overall_selection_status: failed_on_all3pins_due_to_invalid_bytes_test_Java_heap_space
      cgroup_oom_established: false
      receipts:
        - input/repair4/native-arrow-common1-partial-test-readback.yaml
        - input/repair4/native-arrow-remainder1-suite-readback.yaml
    source: KafkaMetricsDataDeserializerTest.testDeserializeWithInvalidBytes git_blob a5fa00b3559805f4f9d247d7d73bcf6c7d926d3d
  - id: redis.schema.only.v190.head
    editions: [v190, head]
    input: ArrowStreamWriter.start_end_without_batch
    expect: null
    source: RedisMetricsDataCodecTest.decodeSchemaOnlyStreamReturnsNull
  - id: redis.zero.row.180.discard
    editions: ["180"]
    when: root.rowCount == 0
    expect: null
    source: 180 RedisMetricsDataCodec.decodeValue lines 74-77
  - id: history.metricFull.two.parts
    metricFull: linux.usage
    expect_exception: IllegalArgumentException
    expect_message_contains: "is illegal."
    source: MetricsDataController.java names.length != 3
  - id: history.tsdb.down
    when: storage false
    expect: {code: 15, msg: "time series database not available"}
    source: MetricsDataController.java
  - id: history.range.illegal.v190.head
    editions: [v190, head]
    history: "6 hours"
    expect_exception: IllegalArgumentException
    expect_message_contains: "is illegal, expected a count followed by a unit"
    source: MetricsDataServiceImpl.validateHistoryRange
  - id: history.identifier.illegal.v190.head
    editions: [v190, head]
    app: "linux.cpu"
    expect_exception: IllegalArgumentException
    source: MetricsDataServiceImpl.validateIdentifier
  - id: warehouse.status.unavailable.180
    editions: ["180"]
    when: false
    expect: {code: 15, msg: "Service not available!"}
    source: 180 MetricsDataController
  - id: warehouse.status.unavailable.v190.head
    editions: [v190, head]
    when: {available: false, droppedMetrics: 7, pendingMetrics: 3}
    expect: {code: 15, data: {available: false, droppedMetrics: 7, pendingMetrics: 3}}
    source: MetricsDataControllerTest
  - id: query.null
    queries: null
    expect_exception: IllegalArgumentException
    expect_message: "No query found"
    source: DatasourceQueryServiceImpl.java:46-48
  - id: query.unknown.datasource
    datasource: not-a-store
    expect_exception: IllegalArgumentException
    expect_message_prefix: "Unsupported datasource: "
    source: DatasourceQueryServiceImpl.java:52-54
  - id: query.cluster.executor.180.absent
    editions: ["180"]
    class: org.apache.hertzbeat.warehouse.db.VictoriaMetricsClusterQueryExecutor
    expect: absent
    source: 180 warehouse/db has GreptimeSql GreptimePromql VictoriaMetrics only; cluster storage class still present
  - id: adapter.questdb.dateadd.week
    history: 1w
    expect_exception: IllegalArgumentException
    source: QuestdbDataStorage.getDateAdd default throw Invalid history unit
  - id: adapter.greptime.sql.query.inherited.null
    method: GreptimeSqlQueryExecutor.query
    expect: inherited_SqlQueryExecutor_query_returns_null
    source: GreptimeSqlQueryExecutor does not override query; SqlQueryExecutor.query returns null
  - id: adapter.promql.unknown.timeType
    timeType: not-range-or-instant
    expect_exception: IllegalArgumentException
    source: PromqlQueryExecutor.query else branch
  - id: adapter.tdengine.nan.to.null
    input: NaN
    expect: SQL NULL
    source: TdEngineDataStorage saveData Double.isNaN
  - id: adapter.doris.unparsable.number.drop
    editions: [v190, head]
    input: not-a-number
    expect: continue drop cell
    source: DorisDataStorage NumberFormatException continue
  - id: jpa.impl.missing
    named: jpa
    impl_class: absent
    source: WarehouseConstants.HistoryName.JPA; no Jpa DataStorage class
  - id: value.type.class.missing
    class: org.apache.hertzbeat.common.entity.message.ValueType
    expect: absent_in_all_three_pins
  - id: csv.history.exporter.missing
    class: warehouse history CSV exporter
    expect: absent_in_all_three_pins
  - id: graphs.subtree.missing
    path: input/graphs
    expect: absent
  - id: three.signal.without.greptime
    when: warehouse.store.greptime.enabled is not true
    expect: ThreeSignalQueryController not registered
    source: ConditionalOnProperty warehouse.store.greptime.enabled=true
    note: controller lives in observability module; warehouse GreptimeThreeSignalQueryService same gate
  - id: parse.underscore.not.double
    input: "10_000.125"
    expect_not_equals: 10000.125
    source: CommonUtilTest
  - id: time.period.too.short
    tokenTime: "h"
    expect: null
    source: TimePeriodUtil.parseTokenTime length < 2
  - id: realtime.unavailable
    expect_exception: CommonException
    expect_message: "real time store not available"
    source: MetricsDataServiceImpl.getMetricsData
