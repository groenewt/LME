applicable_contract:
  statement: Existing USER_REF_00, AGENTS, operator-rulings, unary grammar, grammar.ebnf, lexicon roster, addendum, and SHACL are the contract. Model-author must consume them. This assessor does not mint a second key, type, or ontology engine.
  deep_kv:
    nesting: YAML nesting depth is taxonomical specification
    keys: closed registry in USER_REF_00; each key is itself a specimen; new keys enter only through the corpus via MAIN
    compounds: decompose by nesting or colon or slash; never fused tokens, hyphen, or underscore in model identifiers, segments, or keys
    flow_collections: forbidden
    protected_prose: ShortDescription and LongDescription only
    other_values: URN references under USER_REF_00; lexicon carrier itself also uses quoted literals for labels, foreign tokens, cardinals, file sources, and rule citations
    yaml_parse_profile: block mappings, two-space indent, keys matching A-Za-z then A-Za-z0-9; no tabs, comments, sequences, duplicate paths, flow forms, anchors, aliases, nulls, or block scalars
    deep_kv_parser: deep::key::value::parse, not yaml::parse
  requirement_spine_keys:
    - REQUIRES
    - WANTS
    - VALUE
    - PROVIDES
    - CONSUMES
    - PRODUCES
    - EXPECTS
    - YIELDS
  identity_spine_keys:
    - IDENTITY
    - KIND
    - TYPE
    - PROFILE
    - ROLE
    - STATUS
    - STATE
    - DISPOSITION
  structure_spine_keys:
    - FLAGS
    - FIELDS
    - PARAMETERS
    - ARGUMENTS
    - RETURNS
    - INPUT
    - OUTPUT
    - EFFECT
    - ERROR
    - FRAME
  taxonomy_spine_keys:
    - EXTENDS
    - INHERITS
    - MEMBER
    - CLASSIFIES
    - RANKS
    - ANCHORS
    - GROUNDS
    - DENOTES
  flow_order_spine_keys:
    - PRECEDES
    - FOLLOWS
    - NEXT
    - ACTION
    - CHAIN
    - STAGE
  projection_spine_keys:
    - DOMAIN
    - CODOMAIN
    - AXES
    - UNITS
    - FORWARD
    - INVERSE
    - JACOBIAN
    - METRIC
    - FIDELITY
    - TOLERANCE
    - LOSS
  evidence_spine_keys:
    - EVIDENCE
    - PROVENANCE
    - CITATION
    - ATTESTS
    - DIGEST
    - RECEIPT
    - GAP
    - DEVIATION
  authority_spine_keys:
    - AUTHORITY
    - OWNER
    - SCOPE
    - RATIONALE
    - JUSTIFICATION
    - TOPIC
    - CONFLICT
    - RESOLUTION
    - DERIVED
    - CHILD
    - PARENT
    - NOTATION
    - ADJUDICATION
  metadata_spine: METADATA with VERSION BRANCH VERSION HASH, CREATED, MODIFIED, ShortName, ShortDescription, LongDescription
  urnary:
    grammar_version: six
    mintedname: urn then colon then lawfulsegment repeated
    lawfulsegment: proper lowercase english word or declared foreign admission
    digits_hyphens_underscores_uppercase_in_segments: unlawful
    double_colon_in_identifiers: forbidden while ascription versus descent conflict stands
    three_profiles_must_stay_distinct:
      grammar_ebnf: v6 Urnary terms
      runtime_urn_validate: SIL_URN_PATTERN only
      deep_kv: own reference validator and closed key registry
  name_normalization_from_user_ref_00:
    ArtifactEntity: Entity:Artifact
    SemanticRecord: Record:Semantic
    DeclarationRecord_quoted_with_operator_typo: Record:Declartaion
  ontology_anchors_from_user_ref_00:
    BFO: Ontology.Basic.Formal
    CCO: Ontology.Common.Core
    CPO: Ontology.Process.Cognitive
    dto_inheritance: required via RENDER then LinkML then pydantic projection of this single model
    runtime_enforcement: not verified in this packet; AGENTS forbids equating the requirement with shipped enforcement
  path_definition:
    every_path: defined specimen, full URN descent, never a bare string
    directory_rings: polar accounting over trees; every segment must satisfy unary grammar
  representation_and_value_sourcing:
    source: input/common-contracts/operator-rulings.yaml
    applies_everywhere: true
    includes_current_head: true
    no_category_exemptions: true
    literal_atoms: declared YAML source
    macros_expected: true
    hardcoded_macro_values: forbidden
    private_macro_defaults: forbidden
    structural_emitted_literals: declared YAML rendering schema and format values
    extension_renaming_not_compliance: true
    static_wrapping_not_compliance: true
    python_language_allowance: lme_manifests.py only; does not cover HertzBeat model files
  jinja:
    single_declared_engine: YAML values plus Jinja macros; no second renderer or loader
    undefined: StrictUndefined is the declared native option in several families; this assessor did not render
    templates_must_not_hardcode_value_atoms: true
  linkml_pydantic:
    must_consume_this_single_declared_model: true
    parallel_source_truth: forbidden
    no_linkml_schema_in_this_packet: true
  lexicon_roster_scope:
    holds: "segments of urn:silmaril:plan:consolidated:revision:"
    does_not_hold: segments outside that revision namespace
    census_buckets: lawful lexeme, declared foreign token, recorded unlawful
    unlawful_segments_stand: true
    nothing_in_lexicon_leg_sealed_or_approved: true
    nothing_in_lexicon_leg_executed: true
  backing_services:
    separately_owned_identities: true
    in_chart_postgres_and_victoria_metrics: foreign backing, not HertzBeat service identity
    kafka_redis_zookeeper_java_git_docker_maven: admitted foreign product tokens in lexicon
    greptime_influx_questdb_doris_duckdb_prometheus_grafana_mysql_postgresql: not admitted foreign tokens; quoted source spelling only

