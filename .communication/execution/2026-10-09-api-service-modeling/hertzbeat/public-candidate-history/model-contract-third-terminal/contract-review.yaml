  - id: ascription-versus-descent
    source: input/common-contracts/docs/api/lexicon/lexicon.md
    status: declared_not_settled
    form: double colon
    grammar_reading: ascription, right associative
    type_label_reading: descent, left associative
    what_is_forbidden_while_it_stands: no identifier may carry double colon in any segment position
  - id: prefix-label-rev-versus-revision
    source: input/common-contracts/docs/api/lexicon/lexicon.addendum.ttl lex:conflict:prefix:label
    status: declared_not_settled
  - id: natrual-versus-natural
    source: input/common-contracts/docs/api/lexicon/lexicon.addendum.ttl lex:lexeme:natrual
    status: unlawful_segment_recorded_and_standing
    operator_control_spelling: natrual
    lawful_segment: natural
    this_assessor_does_not_correct_the_control: true
  - id: field-underscore-rule-three-versus-rule-ten
    source: input/common-contracts/docs/api/lexicon/grammar/identifier/unary.ebnf
    status: typed_as_conflict_not_settled
    corpus_follows: rule ten over rule three for minted names
  - id: deepkv-urn-values-versus-lexicon-literals
    user_ref_00: every non-protected value is a URN reference
    lexicon_carrier: labels, foreign tokens, cardinals, file sources, and rule citations ride as quoted literals; digits lawful only inside quoted literals that quote a source
    agents_header: REVISION hex, integer OCTET bounds, STATUS measured as bare word
    status: declared_and_open
    model_author_must_not_silently_pick_one_side: true
  - id: ontology-dot-versus-urn-colon
    user_ref_00_anchors: Ontology.Basic.Formal uses dots
    unary_grammar: colon descent
    status: open
    do_not_invent_a_third_path_syntax: true
  - id: user-ref-00-path-example-uppercase
    example: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:templates:factory:authority
    defect: ROOT and later STANDARD in AGENTS IDENTITY are not lowercase proper words
    status: corpus_example_versus_unary_law
  - id: user-ref-00-declaration-typo
    quoted: Record:Declartaion
    status: operator_spelling_stands; do not silently correct
  - id: sql-unlawful-recorded
    lexeme: lex:lexeme:sql
    rule: five
    lawful_descent: structured:query:language
    segment_stands_in_carriers_that_mint_it: true
  - id: instruction-files-open-representation-violations
