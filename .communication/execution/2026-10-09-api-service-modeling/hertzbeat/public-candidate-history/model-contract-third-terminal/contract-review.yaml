expressibility:
  question: can model-author legally express the named identities under existing law without a second engine
  service:
    verdict: partial
    can_do:
      - KIND as registered Deep KV key
      - IDENTITY URN using lawful words such as instance:service:collection:metric
      - product name Apache HertzBeat only inside ShortDescription or as a quoted foreign literal under lexicon practice
      - origin URL as quoted evidence, not as a URN segment string
    cannot_do_until_main:
      - mint hertzbeat or apache as URN segments
      - "treat schema: hertzbeat.public-source... as canonical identity"
    lawful_example_from_corpus: see examples.agents_identity and examples.entity_artifact
  version:
    verdict: partial
    can_do:
      - VERSION key
      - spelled numeral URNs already in lexicon such as lex:value:numeric:natural:one and lex:value:numeric:natural:eight
      - operator control pattern section:value:numeric:natrual:three for a numbered section, retaining natrual as standing unlawful
    cannot_do:
      - put 1.8.0 or 180 or v1.9.0 inside a URN segment
