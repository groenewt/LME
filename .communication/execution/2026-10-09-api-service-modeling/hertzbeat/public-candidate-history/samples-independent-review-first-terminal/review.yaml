confirmed_accurate:
  - id: collectrep.utf8.storage
    statement: Builder.build uses FieldType nullable Utf8 VarCharVector plus TYPE/UNIT/LABEL metadata on all three pins. Numeric meaning is TYPE_* plus consumer parse, not Arrow Int/FloatingPoint in CollectRep.
  - id: no.ValueType.class
    statement: No ValueType.java under the three source trees. Field schema is CommonConstants bytes plus CollectRep.Field int type plus dto Field Byte type.
  - id: redis.180.zero.row.discard
    statement: "180 decodeValue returns null when root is null or rowCount is 0 after loadNextBatch. v190/HEAD return null only when loadNextBatch is false, so TIMEOUT zero-row MetricsData can round-trip. RedisMetricsDataCodecTest exists on v190/HEAD only."
  - id: kafka.serialize.null
    statement: Null MetricsData logs metricsData is null and returns null. Serializer class text matches across 180 and HEAD reads. 180 test lacks preservesLargeMetricValueThroughArrowIpc; that method exists on v190/HEAD with "a".repeat(100000).
  - id: ipc.multi-root.versus.codec
    statement: ArrowUtil.serializeMultipleRoots writes DataOutputStream int32 rootCount then per-root int32 length plus ArrowStream. Kafka and Redis codecs write a single ArrowStream without that envelope.
  - id: getValues.no.isNull
    statement: getValues uses VarCharVector.get without isNull on all three pins. Arrow-null versus "&nbsp;" remain distinct. Candidate unresolved item collectrep.getValues.null.slot matches source text.
  - id: arrowutil.allocator.unclosed
    statement: deserializeMultipleRoots allocates one RootAllocator and ArrowStreamReader per root and does not close them on the success path.
  - id: alerter.parse.180.vs.v190
    statement: All pins map NULL_VALUE to null then continue. v190/HEAD always put parseStrDouble/parseStrInteger including null. 180 puts TYPE_NUMBER/TYPE_TIME only when parse is non-null and other types only when non-empty.
  - id: history.rest.split
    statement: GET /api/monitor/{instance}/metric/{metricFull} requires three dot-separated parts. Default history 6h. interval false/null selects getHistoryMetricData; true selects getHistoryIntervalMetricData. FAIL_CODE time series database not available. 180 status is Message<Void>; v190/HEAD is Message<WarehouseStorageStatus> with available, droppedMetrics, pendingMetrics.
  - id: history.validation.v190
    statement: v190/HEAD MetricsDataServiceImpl validates \\d{1,6}[smhdwy] CASE_INSENSITIVE plus identifier patterns. 180 service does not.
  - id: jpa.name.without.class
    statement: WarehouseConstants.HistoryName.JPA equals jpa on all three pins. History entity hzb_history and HistoryDao exist. No Jpa*DataStorage class.
  - id: duckdb.default.on
    statement: application.yml warehouse.store.duckdb.enabled is true on all three pins. Memory realtime enabled true with matchIfMissing true. Other history stores default false. Doris block present on v190/HEAD only.
  - id: adapter.denominator
    statement: History storage classes 8 on 180, 9 on v190/HEAD. QueryExecutor concrete classes 3 on 180, 4 on v190/HEAD. Warehouse Java files 66 on 180, 88 on v190 and HEAD including tests. VictoriaMetricsClusterDataStorage exists on 180; VictoriaMetricsClusterQueryExecutor does not.
  - id: greptime.sql.query.inherited.null
    statement: GreptimeSqlQueryExecutor overrides execute, not query. SqlQueryExecutor.query returns null on HEAD. DatasourceQueryServiceImpl.query therefore yields null DatasourceQueryData for Greptime-sql.
  - id: questdb.dateadd.units
    statement: getDateAdd lowercases and accepts d h m s only; w and y throw IllegalArgumentException. Swagger history units include w.
  - id: tdengine.nan.to.null
    statement: TYPE_NUMBER or TYPE_TIME parse; NaN and Infinity become SQL NULL.
  - id: doris.unparsable.drop
    statement: v190/HEAD Doris saveData continue-drops NULL_VALUE, unparsable TYPE_NUMBER, and unparsable TYPE_TIME.
  - id: doris.retention.7.vs.30
    statement: application.yml partition-retention-days 30 and enable-partition false. DorisProperties.TableConfig @DefaultValue partitionRetentionDays is 7 and clamps non-positive to 7.
  - id: csv.history.absent
    statement: No CSV class under warehouse Java. History HTTP returns JSON MetricsHistoryData.
  - id: three.signal.greptime.gate
    statement: ThreeSignalQueryController is @ConditionalOnProperty warehouse.store.greptime.enabled=true in the observability module on v190/HEAD.
  - id: common.constants
    statement: TYPE_NUMBER 0 TYPE_STRING 1 TYPE_SECRET 2 TYPE_TIME 3 NULL_VALUE "&nbsp;" FAIL_CODE 15 SUCCESS_CODE 0. Arrow 18.1.0 in 180 pom line 180 and v190/HEAD pom line 179. Maven wrapper 3.3.2 / 3.9.9.
  - id: dispatch.realtime.after.history
    statement: DataStorageDispatch writes history saveData ifPresent then always realtime saveData in finally. Memory closes non-SUCCESS and previous MetricsData on replace. Redis hset-then-close on SUCCESS else close.
  - id: influx.null.sentinel
    statement: Influx NULL_VALUE addField empty string then return from the cell lambda.
  - id: parse.double.literals
    statement: CommonUtilTest.testParseStrDouble matches candidate literals including 10.125 and 10_000.125 not_equals.
  - id: arrowutil.test.int64
    statement: ArrowUtilTest.testSerializeAndDeserializeMultipleRoots round-trips signed Int64 100 and 200. CollectRep MetricsData test uses field type 1 and column 50.5 as Utf8 text.
  - id: templates.parameterized
    statement: render-recipe.yaml uses stock Jinja2 StrictUndefined, FileSystemLoader, no custom filters. macros.j2 adapter_class_line quotes YAML indent tokens. Native history4 adapters render no longer exhibits the repair4 protocol mapping-values defect.
limitations:
  - No Shell, MCP, web, or subagents. No git blob or sha256 recomputation from this reviewer.
  - public-full-source-index.yaml file catalog is not exhaustively read; version object wrappers and java_files/gitlink facts were checked.
  - Three source trees were source-checked on numeric/Arrow/codec/history-adapter families, not every Java file (1232/1387/1387).
  - v190 files that candidate claims identical to HEAD were sampled, not always fully reread.
  - External Kafka/Redis/PostgreSQL/Greptime/IoTDB/Doris/QuestDB/TDengine/Influx/VM server internals remain separate owners.
  - Fixtures and native Jinja receipts are not execution of adapters against live stores.
  - No fabricated CPG, runtime graph, or canonical ontology admission.
disposition_summary:
  model_usable_as_provisional_public_source_contract: true
  blocking_for_runtime_or_ontology: not_in_scope_and_not_claimed
  keep_failed_arrow_invalid_bytes: true
  independent_review_does_not_pass_global_suite: true
