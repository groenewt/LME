  the current bodies. Residual open defects remain: this packet's admitted
  input/source trees hold AbstractCollect SPI and mcp-bash Rust, while assigned
  models still assert historical_subset README.md occupancy and current copies
  under input/repair/source and input/review3-feedback; JDBC multi-row fixture
  spans stay HEAD-shaped; warehouse-samples still names only hertzbeat-common-core
  for cluster_msg and still uses capability.traceQuery/otlpMetricQuery instead of
