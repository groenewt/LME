  note is truncated by unquoted flow-mapping commas in the native roster render;
  CollectJobScheduling exists on 1.8.0 but job_api.versions omit that pin.
  Native parse/render receipts are finite tests, not approval. Arrow/history
  remains provisional. No runtime warehouse, MCP session, or ontology acceptance
  is claimed.
