  METADATA:
    ShortDescription: "Unary rule three permits underscores between field words as a Python convention and records disagreement with rule ten. LinkML slot names must follow the closed DeepKV spellings, which have no underscore. Pydantic aliases for foreign Java fields belong in projection VALUES, not as model keys."
