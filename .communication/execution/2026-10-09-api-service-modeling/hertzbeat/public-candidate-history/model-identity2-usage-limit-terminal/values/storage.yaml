    METADATA:
      ShortDescription: "RedisDataStorage with simple sentinel cluster clients. redis is admitted foreign. The Redis server process is a backing identity."
    NEXT:
      IDENTITY: urn:silmaril:instance:storage:history:victoria
      KIND: urn:silmaril:type:kind:storage
      METADATA:
        ShortDescription: "VictoriaMetricsDataStorage and VictoriaMetricsClusterDataStorage. Cluster query executor and test exist on v190 and head only per numeric unresolved."
      NEXT:
        IDENTITY: urn:silmaril:instance:storage:history:greptime
        KIND: urn:silmaril:type:kind:storage
        METADATA:
          ShortDescription: "GreptimeDbDataStorage. v190 and head add GreptimeOtlpSignalStorage. GreptimeSqlQueryExecutor.query returns null on all three pins per numeric unresolved. Greptime the database is a backing identity."
        NEXT:
          IDENTITY: urn:silmaril:instance:storage:history:tdengine
          KIND: urn:silmaril:type:kind:storage
          METADATA:
            ShortDescription: "TdEngineDataStorage. Caller history token interpolated into now()-style SQL. v190 and head MetricsDataServiceImpl validates digit brace pattern before adapters; 180 does not."
          NEXT:
            IDENTITY: urn:silmaril:instance:storage:history:iotdb
            KIND: urn:silmaril:type:kind:storage
            METADATA:
              ShortDescription: "IotDbDataStorage present 180 and head. IoTDB is a backing identity."
            NEXT:
              IDENTITY: urn:silmaril:instance:storage:history:influx
              KIND: urn:silmaril:type:kind:storage
              METADATA:
                ShortDescription: "InfluxdbDataStorage. DatasourceQuery documents influxql. No InfluxqlQueryExecutor class under warehouse/db per numeric unresolved."
              NEXT:
                IDENTITY: urn:silmaril:instance:storage:history:questdb
                KIND: urn:silmaril:type:kind:storage
                METADATA:
                  ShortDescription: "QuestdbDataStorage. getDateAdd rejects unit w while history HTTP swagger lists w."
                NEXT:
                  IDENTITY: urn:silmaril:instance:storage:history:duckdb
                  KIND: urn:silmaril:type:kind:storage
                  METADATA:
                    ShortDescription: "DuckdbDatabaseDataStorage present 180 v190 head."
                  NEXT:
                    IDENTITY: urn:silmaril:instance:storage:history:doris
                    KIND: urn:silmaril:type:kind:storage
                    FLAGS: urn:silmaril:instance:flag:edition:one:nine:zero
                    METADATA:
                      ShortDescription: "DorisDataStorage on v190 and head, absent as a history class on 180. Numeric receipt notes Java retention default 7 versus application.yml 30. Doris is a backing identity."
