IDENTITY: urn:silmaril:instance:value:alert
KIND: urn:silmaril:type:kind:value
TYPE: urn:silmaril:instance:document:specification:value
STATUS: urn:silmaril:plan:consolidated:revision:section:value:numeric:natrual:three:status:measured
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
CLASSIFIES: urn:silmaril:instance:family:alert
CITATION:
  IDENTITY: urn:silmaril:instance:location:structured:system:file:relative
  METADATA:
    ShortDescription: "CommonConstants on head hertzbeat-common-core. 180 lives under hertzbeat-common. Peer alarm reviews remain provisional."
MEMBER:
  IDENTITY: urn:silmaril:instance:status:alert:firing
  KIND: urn:silmaril:type:kind:status
  METADATA:
    ShortDescription: "ALERT_STATUS_FIRING firing"
  NEXT:
    IDENTITY: urn:silmaril:instance:status:alert:resolved
    KIND: urn:silmaril:type:kind:status
    METADATA:
      ShortDescription: "ALERT_STATUS_RESOLVED resolved"
    NEXT:
      IDENTITY: urn:silmaril:instance:status:alert:pending
      KIND: urn:silmaril:type:kind:status
      METADATA:
        ShortDescription: "ALERT_STATUS_PENDING pending"
      NEXT:
        IDENTITY: urn:silmaril:instance:status:alert:severity:emergency
        KIND: urn:silmaril:type:kind:status
        METADATA:
          ShortDescription: "ALERT_SEVERITY_EMERGENCY emergency"
        NEXT:
          IDENTITY: urn:silmaril:instance:status:alert:severity:critical
          KIND: urn:silmaril:type:kind:status
          METADATA:
            ShortDescription: "ALERT_SEVERITY_CRITICAL critical"
          NEXT:
            IDENTITY: urn:silmaril:instance:status:alert:severity:warning
            KIND: urn:silmaril:type:kind:status
            METADATA:
              ShortDescription: "ALERT_SEVERITY_WARNING warning"
            NEXT:
              IDENTITY: urn:silmaril:instance:status:alert:severity:information
              KIND: urn:silmaril:type:kind:status
              METADATA:
                ShortDescription: "ALERT_SEVERITY_INFO info"
              NEXT:
                IDENTITY: "urn:silmaril:instance:action:alert:silence"
                KIND: urn:silmaril:type:kind:action
                METADATA:
                  ShortDescription: "CACHE_ALERT_SILENCE alert_silence. AlertSilenceController."
                NEXT:
                  IDENTITY: "urn:silmaril:instance:action:alert:inhibit"
                  KIND: urn:silmaril:type:kind:action
                  METADATA:
                    ShortDescription: "CACHE_ALERT_INHIBIT alert_inhibit. AlertInhibitController AlertInhibitsController."
                  NEXT:
                    IDENTITY: "urn:silmaril:instance:action:alert:converge"
                    KIND: urn:silmaril:type:kind:action
                    METADATA:
                      ShortDescription: "CACHE_ALERT_GROUP_CONVERGE alert_group_converge. AlertGroupConvergeController AlertGroupConvergesController."
                    NEXT:
                      IDENTITY: "urn:silmaril:instance:action:alert:notice"
                      KIND: urn:silmaril:type:kind:action
                      METADATA:
                        ShortDescription: "NoticeConfigController."
                      NEXT:
                        IDENTITY: urn:silmaril:instance:status:monitor:paused
                        KIND: urn:silmaril:type:kind:status
                        METADATA:
                          ShortDescription: "MONITOR_PAUSED_CODE 0x00"
                        NEXT:
                          IDENTITY: urn:silmaril:instance:status:monitor:up
                          KIND: urn:silmaril:type:kind:status
                          METADATA:
                            ShortDescription: "MONITOR_UP_CODE 0x01"
                          NEXT:
                            IDENTITY: urn:silmaril:instance:status:monitor:down
                            KIND: urn:silmaril:type:kind:status
                            METADATA:
                              ShortDescription: "MONITOR_DOWN_CODE 0x02"
                            NEXT:
                              IDENTITY: urn:silmaril:instance:status:collector:online
                              KIND: urn:silmaril:type:kind:status
                              METADATA:
                                ShortDescription: "COLLECTOR_STATUS_ONLINE 0"
                              NEXT:
                                IDENTITY: urn:silmaril:instance:status:collector:offline
                                KIND: urn:silmaril:type:kind:status
                                METADATA:
                                  ShortDescription: "COLLECTOR_STATUS_OFFLINE 1"
                                NEXT:
                                  IDENTITY: urn:silmaril:instance:type:threshold:metric:realtime
                                  KIND: urn:silmaril:type:kind:threshold
                                  METADATA:
                                    ShortDescription: "METRIC_ALERT_THRESHOLD_TYPE_REALTIME realtime_metric"
                                  NEXT:
                                    IDENTITY: urn:silmaril:instance:type:threshold:metric:periodic
                                    KIND: urn:silmaril:type:kind:threshold
                                    METADATA:
                                      ShortDescription: "METRIC_ALERT_THRESHOLD_TYPE_PERIODIC periodic_metric"
                                    NEXT:
                                      IDENTITY: urn:silmaril:instance:type:threshold:log:realtime
                                      KIND: urn:silmaril:type:kind:threshold
                                      METADATA:
                                        ShortDescription: "LOG_ALERT_THRESHOLD_TYPE_REALTIME realtime_log"
                                      NEXT:
                                        IDENTITY: urn:silmaril:instance:type:threshold:log:periodic
                                        KIND: urn:silmaril:type:kind:threshold
                                        METADATA:
                                          ShortDescription: "LOG_ALERT_THRESHOLD_TYPE_PERIODIC periodic_log"
                                        NEXT:
                                          IDENTITY: urn:silmaril:instance:mode:alert:group
                                          KIND: urn:silmaril:type:kind:mode
                                          METADATA:
                                            ShortDescription: "ALERT_MODE_GROUP group"
                                          NEXT:
                                            IDENTITY: urn:silmaril:instance:mode:alert:individual
                                            KIND: urn:silmaril:type:kind:mode
                                            METADATA:
                                              ShortDescription: "ALERT_MODE_INDIVIDUAL individual"
CHILD:
  IDENTITY: urn:silmaril:instance:plugin:alert
  CLASSIFIES: urn:silmaril:instance:family:plugin
  METADATA:
    ShortDescription: "Plugin.alert GroupAlert and PostAlertPlugin.execute are plugin outcomes, not alerter REST. Distinct from AbstractCollect."
