IDENTITY: urn:silmaril:instance:recipe:render
KIND: urn:silmaril:type:kind:recipe
TYPE: urn:silmaril:instance:document:specification:recipe
STATUS: urn:silmaril:instance:status:unexecuted
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
METADATA:
  ShortDescription: "Declared Jinja invocations for the native coordinator. No second renderer or loader. Templates consume preloaded mappings. Author did not render."
MEMBER:
  IDENTITY: urn:silmaril:instance:recipe:render:identity
  KIND: urn:silmaril:type:kind:action
  FORWARD: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:identity
  INPUT: urn:silmaril:instance:service:hertz:beat
  OUTPUT: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:rendered:identity
  METADATA:
    ShortDescription: "entry candidate/template/identity.j2. preload name identity from candidate/identity.yaml. preload name syntax from candidate/values/syntax.yaml. import macros.j2 byte-equals syntax token library ShortDescription. intended rendered candidate/rendered/identity.yaml which this author did not write."
  NEXT:
    IDENTITY: urn:silmaril:instance:recipe:render:roster
    KIND: urn:silmaril:type:kind:action
    FORWARD: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:roster
    INPUT: urn:silmaril:instance:value:protocol
    OUTPUT: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:rendered:roster
    METADATA:
      ShortDescription: "entry candidate/template/roster.j2. preload name roster from candidate/values/protocol.yaml. preload name syntax from candidate/values/syntax.yaml. intended rendered candidate/rendered/roster.yaml unwritten by author."
    NEXT:
      IDENTITY: urn:silmaril:instance:recipe:render:path
      KIND: urn:silmaril:type:kind:action
      FORWARD: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:path
      INPUT: urn:silmaril:instance:specimen:source
      OUTPUT: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:rendered:path
      METADATA:
        ShortDescription: "entry candidate/template/path.j2. preload name source from candidate/specimen/source.yaml. preload name syntax from candidate/values/syntax.yaml. intended rendered candidate/rendered/path.yaml unwritten by author."
      NEXT:
        IDENTITY: urn:silmaril:instance:recipe:render:family
        KIND: urn:silmaril:type:kind:action
        FORWARD: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:roster
        INPUT: urn:silmaril:instance:family
        OUTPUT: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:rendered:family
        METADATA:
          ShortDescription: "Reuse roster.j2 with preload name roster bound to candidate/taxonomy.yaml. Fourth declared invocation. Distinct from protocol roster."
DEVIATION:
  IDENTITY: urn:silmaril:instance:deviation:jinja:import
  STATUS: urn:silmaril:plan:consolidated:revision:section:value:numeric:natrual:three:status:declared
  METADATA:
    ShortDescription: "Jinja from-import is compile-time. Entry templates import macros.j2. That spelling is the ShortDescription of candidate/values/syntax.yaml token library. Positional NEXT walks in entry templates are coupled to the syntax.yaml FIELDS chain order. emit_chain projects IDENTITY KIND TYPE STATUS DIGEST METADATA.ShortDescription MEMBER CHILD NEXT only; it is a spine projection, not a lossless copy of ANCHORS CONFLICT GAP DERIVED and other keys. Fragment quoting tests membership of the grammar.ebnf projection terminal hash, which is a corpus operator character, not a HertzBeat config atom."
CHAIN:
  IDENTITY: urn:silmaril:instance:recipe:validate
  KIND: urn:silmaril:type:kind:action
  PRECEDES: urn:silmaril:instance:recipe:render:identity
  METADATA:
    ShortDescription: "After render, parse outputs with the DeepKV profile, then run contract positive and negative. Grammar and SHACL remain separate unexecuted checks. Coordinator owns execution."
