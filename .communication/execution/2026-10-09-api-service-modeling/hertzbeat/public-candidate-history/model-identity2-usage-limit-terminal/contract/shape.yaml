IDENTITY: urn:silmaril:instance:contract:shape
KIND: urn:silmaril:type:kind:contract
TYPE: urn:silmaril:instance:document:specification:contract
STATUS: urn:silmaril:instance:status:unexecuted
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
CITATION:
  IDENTITY: urn:silmaril:instance:location:structured:system:file:relative
  METADATA:
    ShortDescription: "input/common-contracts/docs/api/lexicon/lexicon.shacl.ttl twelve shapes at sh:Violation. This child does not claim those shapes pass over HertzBeat identity URNs. Native SHACL execution is unexecuted."
MEMBER:
  IDENTITY: urn:silmaril:instance:contract:shape:nomenclature
  KIND: urn:silmaril:type:kind:check
  EXPECTS: urn:silmaril:instance:status:unexecuted
  METADATA:
    ShortDescription: "lex:shape:nomenclature blocks lexicon segments that are not lowercase letters only. Apply to mintedname segments of this child's URNs, not to quoted fragments, not to ShortDescription prose, and not to standing section three unlawful rows."
  NEXT:
    IDENTITY: urn:silmaril:instance:contract:shape:foreign
    KIND: urn:silmaril:type:kind:check
    EXPECTS: urn:silmaril:instance:status:unexecuted
    METADATA:
      ShortDescription: "lex:shape:lexeme:foreign blocks an admission that is also a defect or an admission with no justification. candidate/extension/product.yaml must keep FLAGS foreign and JUSTIFICATION present if MAIN loads it."
    NEXT:
      IDENTITY: urn:silmaril:instance:contract:shape:conflict
      KIND: urn:silmaril:type:kind:check
      EXPECTS: urn:silmaril:instance:status:unexecuted
      METADATA:
        ShortDescription: "lex:shape:conflict rejects a conflict declared in one sentence. This child's CONFLICT nodes carry TOPIC STATUS ADJUDICATION and a Long or Short description naming both sides."
      NEXT:
        IDENTITY: urn:silmaril:instance:contract:shape:coverage
        KIND: urn:silmaril:type:kind:check
        EXPECTS: urn:silmaril:instance:status:unexecuted
        METADATA:
          ShortDescription: "lex:shape:coverage rejects a coverage record that measured nothing. candidate/coverage.yaml must name measured trees and unread remainder explicitly."
        NEXT:
          IDENTITY: urn:silmaril:instance:contract:shape:deepkv
          KIND: urn:silmaril:type:kind:check
          EXPECTS: urn:silmaril:instance:status:unexecuted
          METADATA:
            ShortDescription: "DeepKV closed key registry. Only registered keys appear as mapping keys in candidate YAML except inside quoted prose. ShortDescription and LongDescription are the only prose values."
          NEXT:
            IDENTITY: urn:silmaril:instance:contract:shape:linkml
            KIND: urn:silmaril:type:kind:check
            EXPECTS: urn:silmaril:instance:status:unexecuted
            METADATA:
              ShortDescription: "Future LinkML shapes must consume candidate identity documents. Generating a parallel HertzBeat class model from Java names would fail this check."
