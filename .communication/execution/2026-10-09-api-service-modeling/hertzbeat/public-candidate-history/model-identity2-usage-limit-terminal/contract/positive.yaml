IDENTITY: urn:silmaril:instance:contract:positive
KIND: urn:silmaril:type:kind:contract
TYPE: urn:silmaril:instance:document:specification:contract
STATUS: urn:silmaril:instance:status:unexecuted
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
EXPECTS: urn:silmaril:instance:status:declared
YIELDS: urn:silmaril:instance:evidence:gap:execution
METADATA:
  ShortDescription: "Finite positive projection grammar and shape checks. Native coordinator executes. Author did not. Unexecuted is a declared status, not a pass."
MEMBER:
  IDENTITY: urn:silmaril:instance:contract:positive:parse:identity
  KIND: urn:silmaril:type:kind:check
  DOMAIN: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:identity
  EXPECTS: urn:silmaril:instance:status:present
  METADATA:
    ShortDescription: "candidate/identity.yaml must parse as DeepKV block mapping with two-space indent. Keys limited to the closed registry. IDENTITY KIND TYPE STATUS OWNER SCOPE are present. MEMBER chain names three editions. CONFLICT and GAP remain explicit."
  NEXT:
    IDENTITY: urn:silmaril:instance:contract:positive:parse:taxonomy
    KIND: urn:silmaril:type:kind:check
    DOMAIN: urn:silmaril:instance:location:structured:system:file:relative:ROOT:path:file:candidate:taxonomy
    EXPECTS: urn:silmaril:instance:status:present
    METADATA:
      ShortDescription: "candidate/taxonomy.yaml MEMBER NEXT chain covers module interface protocol schedule collect numeric alert auth storage lifecycle dependency browser package plugin and the MCP family under a fragment locator."
    NEXT:
      IDENTITY: urn:silmaril:instance:contract:positive:render:identity
      KIND: urn:silmaril:type:kind:check
      DOMAIN: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:identity
      EXPECTS: urn:silmaril:instance:status:unexecuted
      METADATA:
        ShortDescription: "Render candidate/template/identity.j2 with preload identity from candidate/identity.yaml and syntax from candidate/values/syntax.yaml using Jinja2 StrictUndefined. Output must be block mapping without flow collections. Import module name macros.j2 must equal syntax token library ShortDescription."
      NEXT:
        IDENTITY: urn:silmaril:instance:contract:positive:render:roster
        KIND: urn:silmaril:type:kind:check
        DOMAIN: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:roster
        EXPECTS: urn:silmaril:instance:status:unexecuted
        METADATA:
          ShortDescription: "Render roster.j2 with roster bound to candidate/values/protocol.yaml. Expect IDENTITY lines for http jdbc ssh jmx and the edition-split push and zookeeper_sd members."
        NEXT:
          IDENTITY: urn:silmaril:instance:contract:positive:render:path
          KIND: urn:silmaril:type:kind:check
          DOMAIN: urn:silmaril:instance:template:location:structured:system:file:relative:ROOT:path:file:candidate:template:path
          EXPECTS: urn:silmaril:instance:status:unexecuted
          METADATA:
            ShortDescription: "Render path.j2 with source bound to candidate/specimen/source.yaml."
          NEXT:
            IDENTITY: urn:silmaril:instance:contract:positive:urn:service
            KIND: urn:silmaril:type:kind:check
            DOMAIN: urn:silmaril:instance:service:hertz:beat
            EXPECTS: urn:silmaril:instance:status:present
            METADATA:
              ShortDescription: "Service IDENTITY uses only existing corpus segments instance and service. Product-qualified form is DERIVED and marked proposal."
            NEXT:
              IDENTITY: urn:silmaril:instance:contract:positive:fragment:protocol
              KIND: urn:silmaril:type:kind:check
              DOMAIN: urn:silmaril:instance:protocol
              EXPECTS: urn:silmaril:instance:status:present
              METADATA:
                ShortDescription: "Protocol source literals occupy URI fragments, not minted descent segments. Quoted YAML scalars are required wherever a hash appears so YAML comments do not swallow locators."
