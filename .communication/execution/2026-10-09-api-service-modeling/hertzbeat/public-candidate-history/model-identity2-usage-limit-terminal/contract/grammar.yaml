IDENTITY: urn:silmaril:instance:contract:grammar
KIND: urn:silmaril:type:kind:contract
TYPE: urn:silmaril:instance:document:specification:contract
STATUS: urn:silmaril:instance:status:unexecuted
OWNER: urn:silmaril:instance:owner:child:candidate
SCOPE: urn:silmaril:instance:scope:candidate
NOTATION: urn:silmaril:law:urnary:grammar
CITATION:
  IDENTITY: urn:silmaril:instance:location:structured:system:file:relative
  METADATA:
    ShortDescription: "input/common-contracts/docs/api/lexicon/grammar.ebnf version six and grammar/identifier/unary.ebnf. Nothing in those files is sealed or approved. No grammar was executed against a live parser in this session."
MEMBER:
  IDENTITY: urn:silmaril:instance:contract:grammar:mintedname
  KIND: urn:silmaril:type:kind:check
  EXPECTS: urn:silmaril:instance:status:unexecuted
  METADATA:
    ShortDescription: "mintedname equals urn plus lawfuldescent of proper lowercase English words or declared foreign admissions. Check IDENTITY values that have no fragment against unary.ebnf. Fragments are projection locators, reported separately from mintedname."
  NEXT:
    IDENTITY: urn:silmaril:instance:contract:grammar:unlawfulbutparsed
    KIND: urn:silmaril:type:kind:check
    EXPECTS: urn:silmaril:instance:status:unexecuted
    METADATA:
      ShortDescription: "unary.ebnf unlawfulbutparsed records atoms the operator grammar admits and the law does not. Hex commit fragments parse as atoms and fail mintedname. Both verdicts must be reported. A passing parse is never a passing name."
    NEXT:
      IDENTITY: urn:silmaril:instance:contract:grammar:ascription
      KIND: urn:silmaril:type:kind:check
      CONFLICT: urn:silmaril:plan:consolidated:revision:lexicon:kind:conflict
      EXPECTS: urn:silmaril:instance:status:unexecuted
      METADATA:
        ShortDescription: "Standing conflict: grammar.ebnf reads double colon as ascription, type labels in section three read it as descent. No identifier in this child may carry a double colon in any segment. Primordial::Value::Integer style labels are forbidden as identifiers."
      NEXT:
        IDENTITY: urn:silmaril:instance:contract:grammar:trailing
        KIND: urn:silmaril:type:kind:check
        EFFECT: urn:silmaril:instance:effect:reject
        EXPECTS: urn:silmaril:instance:status:unexecuted
        METADATA:
          ShortDescription: "Rejected grammar forms quoted from grammar.ebnf: empty term, trailing descent, leading descent, trailing kind-ascription, empty group, open group, close group, trailing higher composition."
