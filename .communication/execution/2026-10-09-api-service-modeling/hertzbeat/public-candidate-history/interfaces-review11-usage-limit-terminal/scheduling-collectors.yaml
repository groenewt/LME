lifecycle:
  - statement: App define YAML PUT is described in HEAD/v190 sureness.yml comments as overwriting a template and redistributing collect jobs for monitors already using that type. That is a comment on the auth rule, not the AppService implementation body.
    source:
      path: hertzbeat-startup/src/main/resources/sureness.yml
      lines: [25, 29]
  - statement: Monitor detect is a one-time collect via collectSyncJobData.
  - statement: Periodic jobs travel as ISSUE_CYCLIC_TASK; deletes as DELETE_CYCLIC_TASK.
  - statement: Collector online/offline/close are protobuf MessageType 1/2/3.
  - statement: Heartbeat is protobuf MessageType 0 handled by HeartbeatProcessor.
