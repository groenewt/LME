schema: hertzbeat.public-source.interface-model/v1
kind: fixtures.protocol
independent: true
positive:
  - id: proto.jdbc.oneRow
    protocol: jdbc
    input:
      jdbc:
        host: 127.0.0.1
        port: "3306"
        platform: mysql
        queryType: oneRow
        sql: SELECT 1 AS value
        timeout: "3000"
        reuseConnection: "true"
    preCheck: pass
    collect_on_success: {code: SUCCESS}
    source: JdbcCommonCollect.java:194-221 HEAD/v190; JdbcCommonCollect.java:188-225 edition 180; JdbcProtocol.java:38-104
  - id: proto.jdbc.multiRow
    protocol: jdbc
    input:
      jdbc: {host: 127.0.0.1, port: "3306", queryType: multiRow, sql: SELECT id, name FROM t}
    preCheck: pass
    source: JdbcCommonCollect.java:222-225
  - id: proto.ssh.oneRow
    protocol: ssh
    input:
      ssh:
        host: 127.0.0.1
        port: "22"
        username: monitor
        script: uptime
        parseType: oneRow
        timeout: "10000"
        reuseConnection: "true"
        useProxy: "false"
    preCheck: pass
    source: SshCollectImpl.java:70-74; SshProtocol.java:37-148
  - id: proto.http.website
    protocol: http
    input:
      http:
        host: example.com
        port: "443"
        ssl: "true"
        url: /
        method: get
        parseType: website
        successCodes: ["200"]
        enableUrlEncoding: "true"
    preCheck: pass
    source: HttpCollectImpl.java:141-158; HttpProtocol.java:39-107
  - id: proto.http.jsonPath
    protocol: http
    input:
      http:
        host: example.com
        port: "80"
        url: /api
        parseType: jsonPath
        parseScript: $.status
        authorization: {type: Bearer Token, bearerToken: token}
    preCheck: pass
    source: HttpCollectImpl.java:196-197; DispatchConstants.java:193-197
  - id: proto.jmx.host
    protocol: jmx
    input:
      jmx:
        host: example.com
        port: "1099"
        objectName: java.lang:type=Memory
        ssl: "false"
    preCheck: pass
    source: JmxCollectImpl.java:88-107; JmxProtocol.java:36-95
  - id: proto.jmx.rmi.url
    protocol: jmx
    input:
      jmx:
        url: service:jmx:rmi:///jndi/rmi://example.com:1099/jmxrmi
        objectName: java.lang:type=Runtime
    preCheck: pass
    source: JmxCollectImpl.java:116-123; JmxProtocol.java:88-89
  - id: proto.factory.lookup.jdbc
    given: CollectStrategyFactory.invoke("jdbc")
    expect: JdbcCommonCollect after SPI run
    source: CollectStrategyFactory.java:48-58
  - id: proto.zookeeper_sd.literal
    protocol: zookeeper_sd
    expect_supportProtocol: zookeeper_sd
    constant_in_DispatchConstants: false
    source: ZookeeperSdCollectImpl.java:91-94
negative:
  - id: proto.jdbc.null
    input: {jdbc: null}
    expect: IllegalArgumentException "Database collect must has jdbc params"
    source: JdbcCommonCollect.java:194-197 HEAD/v190; JdbcCommonCollect.java:188-192 edition 180
  - id: proto.jdbc.bad.type
    input: {jdbc: {queryType: unknown}}
    expect_collect: {code: FAIL, msg: "Not support database query type: unknown"}
    source: JdbcCommonCollect.java:233-236
  - id: proto.ssh.null
    input: {ssh: null}
    expect: IllegalArgumentException "ssh collect must has ssh params"
    source: SshCollectImpl.java:70-73
  - id: proto.ssh.blacklist
    input: {ssh: {script: blacklisted-command}}
    when: CommonSshBlacklist true
    expect_collect: {code: FAIL, msg_prefix: "The command is blacklisted: "}
    source: SshCollectImpl.java:89-93
  - id: proto.ssh.bad.parse
    input: {ssh: {parseType: xml}}
    expect_collect: {code: FAIL, msg_prefix: "Ssh collect not support this parse type: "}
    source: SshCollectImpl.java:135-137
  - id: proto.http.null
    input: {http: null}
    expect: IllegalArgumentException "Http/Https collect must has http params"
    source: HttpCollectImpl.java:141-144
  - id: proto.http.unknown.host
    when: UnknownHostException
    expect_collect: {code: UN_REACHABLE}
    source: HttpCollectImpl.java:222-226
  - id: proto.http.failed.status.prefix
    when: non-success HTTP status
    expect_collect: {code: FAIL, msg_prefix: "StatusCode "}
    source: HttpCollectImpl.java:166-169 HEAD; NetworkConstants.STATUS_CODE StatusCode; SignConstants.BLANK
  - id: proto.http.method.validator.head.options
    versions: [v1.9.0, HEAD]
    input: {http: {method: head}}
    expect_validator: isValidHttpMethod true for head and options
    source: HttpProtocol.java:164-171
    absent_in: ["1.8.0"]
  - id: proto.jmx.null
    input: {jmx: null}
    expect: IllegalArgumentException "JMX collect must have JMX params"
    source: JmxCollectImpl.java:88-89
  - id: proto.jmx.ldap
    input: {jmx: {url: "service:jmx:rmi:///jndi/ldap://x"}}
    expect: IllegalArgumentException
    source: JmxCollectImpl.java:126-130
  - id: proto.jmx.stub
    input: {jmx: {url: "service:jmx:rmi:///stub/abc"}}
    expect: IllegalArgumentException
    source: JmxCollectImpl.java:94-95; JmxProtocol.java:89
  - id: proto.jmx.bad.port
    input: {jmx: {host: example.com, port: "70000", objectName: x}}
    expect: IllegalArgumentException "Port must be between 1 and 65535"
    source: JmxCollectImpl.java:106
  - id: proto.factory.empty.v190.head
    versions: [v1.9.0, HEAD]
    when: SPI empty after CollectStrategyFactory.run
    expect: IllegalStateException
    expect_message: "No collect strategies were registered. Verify META-INF/services/org.apache.hertzbeat.collector.collect.AbstractCollect is present on the runtime classpath."
    source: CollectStrategyFactory.java:60-65
  - id: proto.factory.empty.180
    versions: ["1.8.0"]
    when: SPI empty after CollectStrategyFactory.run
    empty_guard: absent
    expect_run_exception: none
    expect_invoke: null
    source: CollectStrategyFactory.java:46-56 edition 180
codes:
  SUCCESS: 0
  UN_AVAILABLE: 1
  UN_REACHABLE: 2
  UN_CONNECTABLE: 3
  FAIL: 4
  TIMEOUT: 5
