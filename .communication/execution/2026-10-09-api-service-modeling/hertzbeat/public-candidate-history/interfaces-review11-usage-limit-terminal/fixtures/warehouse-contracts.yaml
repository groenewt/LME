schema: hertzbeat.public-source.interface-model/v1
kind: fixtures.warehouse
independent: true
positive:
  - id: wh.status.available.180
    request: {method: GET, path: /api/warehouse/storage/status}
    versions: ["1.8.0"]
    when: storage status true
    expect: {code: 0, data: null}
    response: Message<Void>
    source: MetricsDataController.java:52-61 edition 180
  - id: wh.status.available.v190.head
    request: {method: GET, path: /api/warehouse/storage/status}
    versions: [v1.9.0, HEAD]
    when: {available: true, droppedMetrics: 0, pendingMetrics: 0}
    expect: {code: 0, data: {available: true, droppedMetrics: 0, pendingMetrics: 0}}
    source: MetricsDataController.java:53-62; WarehouseStorageStatus.java:29
  - id: wh.realtime.present
    request: {method: GET, path: /api/monitor/1/metrics/cpu}
    when: MetricsData non-null
    expect: {code: 0, data: MetricsData}
    source: MetricsDataController.java:72-76
  - id: wh.history.three.part
    request:
      method: GET
      path: /api/monitor/10.0.0.1:9100/metric/linux.cpu.usage
      query: {history: 24h, interval: true}
    when: storage available
    split: {app: linux, metrics: cpu, metric: usage}
    expect: {code: 0, data: MetricsHistoryData}
    source: MetricsDataController.java:91-102
  - id: wh.query.range
    request:
      method: POST
      path: /api/warehouse/query
      body:
        - {refId: A, datasource: prometheus, expr: "rate(cpu[5m])", exprType: promql, timeType: range, start: 1, end: 2, step: 1m}
    expect: {code: 0}
    source: DataQueryController.java:47-51; DatasourceQuery.java:36-58
  - id: wh.arrow.roundtrip.empty
    input: null
    expect: []
    source: ArrowUtil.java:130-133
  - id: wh.arrow.serialize.roots
    layout: [int32 count, repeating (int32 length, ArrowStream)]
    source: ArrowUtil.java:54-78
  - id: wh.export.monitors.json
    request: {method: GET, path: /api/monitors/export, query: {ids: [1], type: JSON}}
    expect: servlet download
    source: MonitorsController.java:121-127
  - id: wh.export.monitors.all.yaml
    request: {method: GET, path: /api/monitors/export/all, query: {type: YAML}}
    expect: servlet download
    source: MonitorsController.java:130-135
  - id: wh.export.alerts.excel
    request: {method: GET, path: /api/alerts/export, query: {status: firing, sort: activeAt, order: desc}}
    versions: [v1.9.0, HEAD]
    expect: servlet Excel
    source: AlertsController.java:67-75
    absent_in: ["1.8.0"]
negative:
  - id: wh.status.unavailable.180
    versions: ["1.8.0"]
    when: storage status not true
    expect: {code: 15, msg: Service not available!}
    response: Message<Void>
    source: MetricsDataController.java:54-61 edition 180
  - id: wh.status.unavailable.v190.head
    versions: [v1.9.0, HEAD]
    when: {available: false}
    expect: {code: 15, msg: Service not available!}
    source: MetricsDataController.java:58-61
  - id: wh.history.down
    when: storage false
    expect: {code: 15, msg: time series database not available}
    source: MetricsDataController.java:91-93
  - id: wh.history.bad.name
    path: /api/monitor/x/metric/a.b
    expect: {code: 1, msg_contains: is illegal.}
    source: MetricsDataController.java:94-96
  - id: wh.collectrep.unrecognized
    call: CollectRep.Code.UNRECOGNIZED.getNumber()
    expect: IllegalArgumentException
    source: CollectRep.java:98-101
  - id: wh.jpa.impl.missing
    named: HistoryName.JPA = jpa
    impl_class_in_head_warehouse: absent
    source: WarehouseConstants.java:40
  - id: wh.protobuf.metrics.absent
    statement: No MetricsData .proto in these copies. cluster_msg.proto carries opaque bytes. CollectRep is Arrow in all three pins.
    source: cluster_msg.proto:21-31; CollectRep.java:50-136
  - id: wh.three.signal.without.greptime
    request: {method: GET, path: /api/observability/metrics/query}
    when: greptime not enabled
    expect: controller not registered
    source: ThreeSignalQueryController.java:42
  - id: wh.realtime.empty
    when: getMetricsData null
    expect: {code: 0, msg: query metrics data is empty}
    source: MetricsDataController.java:73-75
numeric:
  field_type_number: 0
  stored_as: Arrow VarChar string column
  parsed_by_alerter: CommonUtil.parseStrDouble
  null_token: "&nbsp;"
  source: CommonConstants.java:185-208; MetricsRealTimeAlertCalculator.java:248-257
backends:
  realtime: [memory, redis]
  history_named: [greptime, influxdb, iot-db, jpa, td-engine, victoria-metrics, victoria-metrics.cluster, questdb, duckdb, doris]
  history_impls_present: [GreptimeDbDataStorage, InfluxdbDataStorage, IotDbDataStorage, TdEngineDataStorage, VictoriaMetricsDataStorage, VictoriaMetricsClusterDataStorage, QuestdbDataStorage, DuckdbDatabaseDataStorage, DorisDataStorage]
