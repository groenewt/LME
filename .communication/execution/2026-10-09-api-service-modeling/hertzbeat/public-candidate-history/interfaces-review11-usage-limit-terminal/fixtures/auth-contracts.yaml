schema: hertzbeat.public-source.interface-model/v1
kind: fixtures.auth
independent: true
positive:
  - id: auth.excluded.login
    request: {method: POST, path: /api/account/auth/form}
    expect: no Sureness resource check
    source: sureness.yml excludedResource /api/account/auth/**===*
  - id: auth.excluded.i18n
    request: {method: GET, path: /api/i18n/zh-CN}
    expect: no auth
    source: sureness.yml /api/i18n/**===get
  - id: auth.excluded.hierarchy
    request: {method: GET, path: /api/apps/hierarchy}
    expect: no auth
    source: sureness.yml /api/apps/hierarchy===get
  - id: auth.excluded.push
    request: {method: POST, path: /api/push/prometheus/job/a/instance/b}
    expect: no auth
    source: sureness.yml /api/push/**===*
  - id: auth.excluded.status.public
    request: {method: GET, path: /api/status/page/public/component}
    expect: no auth
    source: sureness.yml /api/status/page/public/**===*
  - id: auth.guest.can.read.monitors
    request: {method: GET, path: /api/monitors, role: guest}
    expect: allow
    source: sureness.yml /api/monitors/**===get===[admin,user,guest]
  - id: auth.user.can.create.monitor
    request: {method: POST, path: /api/monitor, role: user}
    expect: allow
    source: sureness.yml /api/monitor/**===post===[admin,user]
  - id: auth.guest.can.post.mute
    request: {method: POST, path: /api/config/mute, role: guest}
    expect: allow
    source: sureness.yml /api/config/mute===post===[admin,user,guest]
  - id: auth.admin.openapi.v3.document
    request: {method: GET, path: /v3/api-docs, role: admin}
    versions: [v1.9.0, HEAD]
    concrete_endpoint: /v3/api-docs
    auth_wildcard: "/v3/api-docs/**===get===[admin]"
    expect: allow
    source: sureness.yml:129
  - id: auth.admin.openapi.v2.document
    request: {method: GET, path: /v2/api-docs, role: admin}
    versions: [v1.9.0, HEAD]
    concrete_endpoint: /v2/api-docs
    auth_wildcard: "/v2/api-docs/**===get===[admin]"
    expect: allow
    source: sureness.yml:132
    note: Concrete client path is /v2/api-docs. HEAD auth rule is the wildcard /v2/api-docs/** at line 132.
  - id: auth.sse.authenticated.head
    request: {method: GET, path: /api/alert/sse/subscribe, role: guest}
    versions: [v1.9.0, HEAD]
    expect: allow
    source: sureness.yml /api/alert/sse/**===get===[admin,user,guest]
  - id: auth.admin.mcp
    request: {method: POST, path: /api/mcp, role: admin}
    expect: allow
    source: sureness.yml /api/mcp/**===post===[admin]
negative:
  - id: auth.guest.cannot.create.monitor
    request: {method: POST, path: /api/monitor, role: guest}
    expect: deny
    source: sureness.yml /api/monitor/**===post===[admin,user]
  - id: auth.user.cannot.delete.monitor
    request: {method: DELETE, path: /api/monitor/1, role: user}
    expect: deny
    source: sureness.yml /api/monitor/**===delete===[admin]
  - id: auth.user.cannot.put.app.yml
    request: {method: PUT, path: /api/apps/define/yml, role: user}
    expect: deny
    source: sureness.yml /api/apps/**===put===[admin]
  - id: auth.user.cannot.preview.alert
    request: {method: GET, path: /api/alert/define/preview/prometheus, role: user}
    expect: deny
    source: sureness.yml /api/alert/define/preview/**===get===[admin]
  - id: auth.user.cannot.create.alert.define
    request: {method: POST, path: /api/alert/define, role: user}
    expect: deny
    source: sureness.yml /api/alert/define===post===[admin]
  - id: auth.guest.cannot.read.alert.define
    request: {method: GET, path: /api/alert/define/1, role: guest}
    expect: deny
    source: sureness.yml /api/alert/define/**===get===[admin,user]
  - id: auth.user.cannot.get.metrics.process
    request: {method: GET, path: /api/metrics, role: user}
    expect: deny
    source: sureness.yml /api/metrics===get===[admin]
  - id: auth.user.cannot.get.secret
    request: {method: GET, path: /api/config/secret, role: user}
    versions: [v1.9.0, HEAD]
    expect: deny
    source: sureness.yml /api/config/secret===get===[admin] HEAD line 75
  - id: auth.admin.get.secret.controller.403
    request: {method: GET, path: /api/config/secret, role: admin}
    versions: [v1.9.0, HEAD]
    expect: HTTP 403 Message.fail FAIL_CODE
    independent_of_sureness: true
    source: GeneralConfigController.java NON_READABLE_TYPES 77-103
  - id: auth.user.cannot.query.warehouse.expr
    request: {method: POST, path: /api/warehouse/query, role: user}
    expect: deny
    source: sureness.yml /api/warehouse/query===post===[admin]
  - id: auth.user.cannot.use.mcp
    request: {method: POST, path: /api/mcp/message, role: user}
    expect: deny
    source: sureness.yml /api/mcp/**===post===[admin]
  - id: auth.user.cannot.delete.logs
    request: {method: DELETE, path: /api/observability/logs, role: user}
    versions: [v1.9.0, HEAD]
    expect: deny
    source: sureness.yml /api/observability/logs===delete===[admin]
  - id: auth.user.cannot.get.token.list
    request: {method: GET, path: /api/account/token, role: user}
    versions: [v1.9.0, HEAD]
    expect: deny
    source: sureness.yml /api/account/token===get===[admin]
    absent_in: ["1.8.0"]
  - id: auth.guest.cannot.post.chat
    request: {method: POST, path: /api/chat/stream, role: guest}
    expect: deny
    source: sureness.yml /api/chat/**===post===[admin]
  - id: auth.sse.anonymous.head
    request: {method: GET, path: /api/alert/sse/subscribe, role: anonymous}
    versions: [v1.9.0, HEAD]
    expect: deny
    source: sureness.yml resourceRole, not excluded
  - id: auth.sse.anonymous.180
    request: {method: GET, path: /api/alert/sse/subscribe, role: anonymous}
    versions: ["1.8.0"]
    expect: allow
    source: 180 sureness.yml excludedResource /api/alert/sse/**===*
  - id: auth.openapi.anonymous.head
    request: {method: GET, path: /v3/api-docs, role: anonymous}
    versions: [v1.9.0, HEAD]
    concrete_endpoint: /v3/api-docs
    auth_wildcard: "/v3/api-docs/**===get===[admin]"
    expect: deny
    source: sureness.yml:129
  - id: auth.openapi.v2.anonymous.head
    request: {method: GET, path: /v2/api-docs, role: anonymous}
    versions: [v1.9.0, HEAD]
    concrete_endpoint: /v2/api-docs
    auth_wildcard: "/v2/api-docs/**===get===[admin]"
    expect: deny
    source: sureness.yml:132
  - id: auth.openapi.anonymous.180
    request: {method: GET, path: /v3/api-docs, role: anonymous}
    versions: ["1.8.0"]
    concrete_endpoint: /v3/api-docs
    excluded_concrete: "/v3/api-docs===get"
    expect: allow
    source: 180 sureness.yml:113
  - id: auth.openapi.v2.anonymous.180
    request: {method: GET, path: /v2/api-docs, role: anonymous}
    versions: ["1.8.0"]
    concrete_endpoint: /v2/api-docs
    excluded_concrete: "/v2/api-docs===get"
    expect: allow
    source: 180 sureness.yml:112
error_codes:
  LOGIN_FAILED_CODE: 5
  PARAM_INVALID_CODE: 1
  FAIL_CODE: 15
default_account_not_a_runtime_secret:
  statement: sureness.yml publishes appId admin credential hertzbeat as the documented default. This fixture records that published default; it is not a discovered private secret.
