severities:
  emergency: emergency
  critical: critical
  warning: warning
  info: info
  fatal_label: fatal
  source:
    path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/constants/CommonConstants.java
    lines: [106, 133]
rule_types:
  realtime_metric: realtime_metric
