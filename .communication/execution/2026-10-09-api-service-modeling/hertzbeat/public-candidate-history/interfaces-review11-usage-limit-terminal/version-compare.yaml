schema: hertzbeat.public-source.interface-model/v1
kind: version-compare
refs:
  - {ref: "1.8.0", commit: 1b51c19c972cdccd2970b71e72ed73dad8ff92a9, edition: "180"}
  - {ref: v1.9.0, commit: a85bd46c18d33130298f0e223bd84ea6e29a17de, edition: v190}
  - {ref: HEAD, commit: 7177bb4a74dff21c664aab4002bd2caa40c74bd9, edition: head}
identical_between_v190_and_head:
  - path: hertzbeat-startup/src/main/resources/sureness.yml
    sha256: 31291300a97fe22ffa7dcf9a9746e73d8e67a644fedf9086aa7ea4bb2d11e162
    blob: 2749420cbe5aabdca9196925732c516408a38e41
  - path: hertzbeat-startup/src/main/resources/application.yml
    sha256: 431a8836a67abb8bb5918b52ba9682cd584d0d030cc5ac73328c429c736f4743
    blob: 8e13abbd7236a4c619ed167d1a22e626fcad291f
  - statement: Both editions expose the same 44 *Controller.java files under the same module names.
changed_1_8_0_to_v1_9_0:
  - id: log-module-to-observability
    from: hertzbeat-log controllers under /api/logs
    to: hertzbeat-observability controllers under /api/observability and /api/otlp/v1
  - id: legacy-otlp-aliases
    statement: HEAD/v1.9.0 keep POST /api/logs/otlp/v1/logs and POST /api/logs/ingest/{protocol} as deprecated aliases of POST /api/otlp/v1/logs, removal scheduled for 2.0.
    source: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/LegacyOtlpLogRouteController.java
    lines: [37, 47]
  - id: sop-and-schedule-rest
    added: [/api/ai/sop/**, /api/ai/schedule/**]
    absent_in: "1.8.0"
  - id: chat-security
    added: POST /api/chat/security
    absent_in: "1.8.0"
    source_head: hertzbeat-ai/src/main/java/org/apache/hertzbeat/ai/controller/ChatController.java
    lines: [157, 160]
  - id: mcp-skill-schedule-tools
    added: SkillTools and ScheduleTools on hertzbeatTools
    absent_in: "1.8.0"
  - id: three-signal-and-otlp-metrics-traces
    added: [POST /api/otlp/v1/metrics, POST /api/otlp/v1/traces, GET /api/observability/metrics/**, GET /api/observability/traces/**, GET /api/observability/capability]
  - id: sureness-tightening
    sse_180: /api/alert/sse/**, /api/logs/sse/**, /api/manager/sse/** excluded
    sse_v190: those streams require [admin,user,guest]
    openapi_180: concrete excluded /v2/api-docs===get and /v3/api-docs===get
    openapi_v190: wildcard admin /v3/api-docs/**, concrete admin /v3/api-docs.yaml, wildcard admin /v3/api-docs.yaml/**, wildcard admin /v2/api-docs/**, wildcard admin /swagger-resources/**
    added_v190_rules:
      - plugin admin-only
      - config/secret admin-only
      - warehouse/query POST admin
      - account/token admin
      - observability and otlp rules
      - actuator admin
      - apps define POST/PUT/DELETE split
      - alert define preview/admin writes
  - id: apps-params-response-element
    method: GET
    path: /api/apps/{app}/params
    java_method: queryAppParamDefines
    "1.8.0":
      response_entity: ResponseEntity<Message<List<ParamDefine>>>
      element_type: org.apache.hertzbeat.common.entity.manager.ParamDefine
      controller_lines: [67, 68]
    v1.9.0_HEAD:
      response_entity: ResponseEntity<Message<List<ParamDefineInfo>>>
      element_type: org.apache.hertzbeat.manager.pojo.dto.ParamDefineInfo
      controller_lines: [67, 67]
      conversion: ParamDefineInfo.fromRuntime
  - id: apps-pushdefine-180-only
    "1.8.0":
      method: GET
      path: /api/apps/{monitorId}/pushdefine
      java_method: queryPushDefine
      mapping_line: 72
      method_lines: [75, 77]
      response_entity: ResponseEntity<Message<Job>>
      source: hertzbeat-manager/src/main/java/org/apache/hertzbeat/manager/controller/AppController.java
    v1.9.0_HEAD: mapping_absent
  - id: protocol-push-removed
    "1.8.0": PROTOCOL_PUSH = push
    v1.9.0_HEAD: constant absent
  - id: protocol-zookeeper_sd
    present_as_literal_in: HEAD/v190 ZookeeperSdCollectImpl
    not_in_DispatchConstants: true
    spi_180: not_registered
    spi_v190_head: registered replacing PushCollectImpl
    current_own_admitted_spi_copies: input/repair/source
    reviewer_packet_may_place_spi_copies: input/source
  - id: warehouse-status-shape
    "1.8.0": ResponseEntity<Message<Void>> MetricsDataController 52-61 Message.success() or Message.fail(FAIL_CODE, "Service not available!")
    v1.9.0_HEAD: ResponseEntity<Message<WarehouseStorageStatus>> MetricsDataController 53-62 fields available, droppedMetrics, pendingMetrics
    WarehouseStorageStatus_java: present v1.9.0/HEAD only
  - id: token-list-delete-alerts-export-notice-preview
    "1.8.0": AuthTokenController POST /generate only; AlertsController has no /export; NoticeConfigController has no /template/preview
    v1.9.0_HEAD: GET /api/account/token, DELETE /api/account/token/{id}, GET /api/alerts/export, POST /api/notice/template/preview
  - id: status-page-org-info
    "1.8.0": StatusPageOrg, StatusPageComponent, StatusPageIncident entity types
    v1.9.0_HEAD: StatusPageOrgInfo, StatusPageComponentInfo, StatusPageIncidentInfo DTO types; public component days query default 30
  - id: config-secret-controller-403
    "1.8.0": getConfig has no NON_READABLE_TYPES; no dedicated /api/config/secret Sureness rule
    v1.9.0_HEAD: NON_READABLE_TYPES secret returns HTTP 403 Message.fail even for admin; Sureness also lists /api/config/secret===get===[admin]
  - id: cluster-msg-proto-path
    "1.8.0": hertzbeat-common/src/main/message/cluster_msg.proto
    v1.9.0_HEAD: hertzbeat-common-core/src/main/message/cluster_msg.proto
  - id: common-module-rename
    "1.8.0": hertzbeat-common holds Message.java, CollectRep.java, ArrowUtil.java
    v1.9.0_HEAD: hertzbeat-common-core holds those types
unchanged_across_three:
  - Message envelope {data,msg,code}
  - CommonConstants SUCCESS/FAIL/PARAM/DETECT/MONITOR/LOGIN codes
  - CollectRep.Code 0-5
  - CollectRep MetricsData stored as Arrow VarChar columns
  - cluster_msg.proto MessageType 0-9
  - core monitor/alert/notice/collector/status/grafana/bulletin/push REST prefixes
  - JDBC/SSH/HTTP/JMX protocol names
  - alarm statuses pending/firing/resolved
  - MCP HTTP path /api/mcp from application.yml
implementation_binding:
  statement: Clients targeting 1.8.0 must use /api/logs* and anonymous SSE/OpenAPI exclusions, Message<Void> warehouse status, StatusPageOrg entity types, and AuthToken generate without list/delete. Clients targeting v1.9.0/HEAD must use /api/observability* and /api/otlp/v1*, treat /api/logs/otlp* and /api/logs/ingest/otlp as deprecated aliases, authenticate SSE, OpenAPI, warehouse query, plugin, and token routes as declared in the shared v190/HEAD sureness.yml, and treat GET /api/config/secret as controller HTTP 403 from NON_READABLE_TYPES even when Sureness allows admin. Spring mapping join 199/175 is method/path presence only.
