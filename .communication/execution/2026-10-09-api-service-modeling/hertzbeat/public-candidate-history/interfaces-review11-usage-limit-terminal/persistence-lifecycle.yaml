schema: hertzbeat.public-source.interface-model/v1
kind: persistence-lifecycle
relational:
  mechanism: Spring Data JPA entities
  auditor: org.apache.hertzbeat.manager.config.JpaAuditorConfig
  eclipse_link_180: org.apache.hertzbeat.common.config.EclipseLinkJpaConfiguration
  representative_tables:
    - {entity: AlertDefine, table: hzb_alert_define, source: hertzbeat-common-spring/src/main/java/org/apache/hertzbeat/common/entity/alerter/AlertDefine.java, lines: [48, 49]}
    - {entity: Collector, package: org.apache.hertzbeat.common.entity.manager}
    - {entity: CollectorMonitorBind, package: org.apache.hertzbeat.common.entity.manager}
    - {entity: Monitor, package: org.apache.hertzbeat.common.entity.manager}
    - {entity: Label, package: org.apache.hertzbeat.common.entity.manager}
    - {entity: SingleAlert, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: GroupAlert, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: AlertSilence, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: AlertInhibit, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: AlertGroupConverge, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: NoticeReceiver, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: NoticeRule, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: NoticeTemplate, package: org.apache.hertzbeat.common.entity.alerter}
    - {entity: AuthToken, controller: AuthTokenController}
timeseries:
  write_path: MetricsRealTimeAlertCalculator sends metrics to storage after calculate via dataQueue.sendMetricsDataToStorage
  source:
    path: hertzbeat-alerter/src/main/java/org/apache/hertzbeat/alert/calculate/realtime/MetricsRealTimeAlertCalculator.java
    lines: [137, 138]
  realtime_stores: [memory, redis]
  history_stores_named: [greptime, influxdb, iot-db, jpa, td-engine, victoria-metrics, victoria-metrics.cluster, questdb, duckdb, doris]
  history_impls_in_head_source:
    - GreptimeDbDataStorage
    - InfluxdbDataStorage
    - IotDbDataStorage
    - TdEngineDataStorage
    - VictoriaMetricsDataStorage
    - VictoriaMetricsClusterDataStorage
    - QuestdbDataStorage
    - DuckdbDatabaseDataStorage
    - DorisDataStorage
  jpa_history_impl: not present in these HEAD/v190 warehouse copies
logs_and_traces:
  log_table: hertzbeat_logs
  trace_table: hertzbeat_traces
  otlp_write: "POST /api/otlp/v1/{logs,metrics,traces}"
  otlp_logs_ingest:
    path: POST /api/otlp/v1/logs
    controller: OtlpLogController
    greptime_class_gate: absent
  otlp_metrics_and_traces_ingest:
    path: "POST /api/otlp/v1/{metrics,traces}"
    controller: OtlpSignalController
    conditional_on: warehouse.store.greptime.enabled=true
    source_lines: [36, 58]
  greptime_otlp: GreptimeOtlpSignalStorage
  mcp_log_sql_table: hzb_internal_logs
dependencies_declared:
  collector_spi: META-INF/services/org.apache.hertzbeat.collector.collect.AbstractCollect
  datasource_query: DatasourceQueryService may be absent; controller field is Autowired(required=false)
  three_signal: ConditionalOnProperty warehouse.store.greptime.enabled=true
  virtual_threads: VirtualThreadProperties toggles alerter reduce and group/inhibit workers
lifecycle:
  collector:
    online: GO_ONLINE then REST PUT /api/collector/online
    offline: GO_OFFLINE then REST PUT /api/collector/offline
    close: GO_CLOSE
    delete: REST DELETE /api/collector
    auth_fail_message: Auth Failed
  monitor:
    create: POST /api/monitor -> addAsyncCollectJob
    update: PUT /api/monitor -> updateAsyncCollectJob
    delete: DELETE /api/monitor/{id} -> cancelAsyncCollectJob
    pause: DELETE /api/monitors/manage
    resume: GET /api/monitors/manage
    detect: POST /api/monitor/detect one-time collect
    copy: POST /api/monitor/copy/{id}
    import: POST /api/monitors/import
  app_template:
    post: add new type
    put: overwrite and redispatch
    delete: admin only
    redispatch_evidence: HEAD/v190 sureness.yml comment at lines 25-29, not an AppService method name located in this repair
  alert:
    define CRUD under /api/alert/define*
    reduce pipeline after calculate
    group status edit PUT /api/alerts/group/status/{status}
    silence persist increments times when a matching alert is dropped
  observability:
    1.8.0 module hertzbeat-log
    v1.9.0/HEAD module hertzbeat-observability
    legacy OTLP aliases deprecated since 1.9.0, removal scheduled for 2.0
unchanged_apply_not_claimed:
  statement: These copies declare REST and scheduler methods. No runtime evidence in this workspace proves credential, certificate, or process preservation across apply.
h2_console:
  excluded: /h2-console/**===*
  source: hertzbeat-startup/src/main/resources/sureness.yml
