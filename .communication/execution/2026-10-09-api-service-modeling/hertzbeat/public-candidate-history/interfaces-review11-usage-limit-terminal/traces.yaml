schema: hertzbeat.public-source.interface-model/v1
kind: traces
definition: Distributed-trace interfaces declared in public copies, not a claim that traces are stored in a live deployment.
ingest:
  head_v190:
    path: POST /api/otlp/v1/traces
    controller: org.apache.hertzbeat.observability.controller.OtlpSignalController
    conditional_on: warehouse.store.greptime.enabled=true
    class_annotation: '@ConditionalOnProperty(prefix = "warehouse.store.greptime", name = "enabled", havingValue = "true")'
    source:
      path: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/OtlpSignalController.java
      lines: [36, 58]
    sibling_metrics_ingest: POST /api/otlp/v1/metrics on the same greptime-gated class
    logs_ingest_ungated: POST /api/otlp/v1/logs on OtlpLogController with no greptime ConditionalOnProperty
    roles: [admin, user]
    otlp_errors: OtlpHttpExceptionHandler google.rpc.Status, not Message envelope
  "1.8.0":
    statement: No OtlpSignalController and no /api/otlp/v1/traces in the 1.8.0 controller set. Trace coverage appears only as log-stat fields on /api/logs/stats/trace-coverage.
query:
  capability: GET /api/observability/capability
  traces_page: GET /api/observability/traces
  traces_overview: GET /api/observability/traces/overview
  traces_detail: GET /api/observability/traces/{traceId}
  traces_spans: GET /api/observability/traces/{traceId}/spans
  conditional_on: warehouse.store.greptime.enabled=true
  storage_table_name: hertzbeat_traces
  source:
    path: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/ThreeSignalQueryController.java
    lines: [41, 136]
log_to_trace_join:
  filters: [traceId, spanId]
  endpoints:
    - GET /api/observability/logs
    - GET /api/observability/logs/trace-coverage
  source:
    path: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/LogQueryController.java
    lines: [78, 165]
capability_probe:
  json_fields: [log, trace, metric]
  record: org.apache.hertzbeat.common.entity.dto.observability.ObservabilityCapability
  probe_trace: ThreeSignalQueryService bean present, Greptime-only in current comment
  source:
    path: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/ObservabilityCapabilityController.java
    lines: [57, 64]
  record_source:
    path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/entity/dto/observability/ObservabilityCapability.java
    lines: [23, 28]
evidenced_gap:
  statement: Trace query REST exists only when Greptime is enabled. No other history storage class in these copies is shown implementing ThreeSignalQueryService.
