schema: hertzbeat.public-source.interface-model/v1
kind: catalog
admitted_inputs:
  historical_subset_intake:
    note: Earlier author-scoped packet copies. Unread or omitted files in that subset are historical intake boundaries, not proof a public Git blob is absent from the service.
    paths:
      - input/source-index.yaml
      - input/supplement-index.yaml
      - input/source/180
      - input/source/v190
      - input/source/head
      - input/supplement/head
  complete_service_source:
    note: Current complete tracked-blob identity. Model paths as original Git paths plus edition, independent of transient packet location.
    complete_source_index: input/review3-feedback/complete-source-index.yaml
    complete_source_index_sha256: 54ae85418488b759542a12894d95a7848e060c9d65ba4c92332cfa48788426f3
    pinned_source_versions: input/review3-feedback/pinned-source-versions.yaml
    complement_trees:
      - input/review3-feedback/source
      - input/review3-feedback/helm-source
  current_own_admitted_aliases:
    abstract_collect_spi: input/repair/source/{edition}
    rust_mcp_bash: input/review3-feedback/source/{edition}/mcp-servers/mcp-bash-server
    marketplace_180: input/review3-feedback/source/180/template-marketplace
    named_historical_receipts:
      original_author_historical_subset_omitted_marketplace_under_input_source: true
      original_author_admitted_spi_under_input_repair_source: true
      original_author_interfaces_snapshot_held_rust_under_input_source: true
    reviewer_packet_may_place_under: input/source/{edition}
    reviewer_packet_placement_is_not_this_worker_current_layout: true
  official_urls_already_written_into_those_public_copies: true
source_path_mapping:
  rule: Public source identity is origin Git path plus edition commit/tree plus blob. Packet-local prefixes are storage aliases mapped in candidate/packet-source-resolver.yaml. Historical author paths remain valid. Reviewer relocation does not rewrite upstream facts.
  origin: https://github.com/apache/hertzbeat
  editions:
    - {ref: "1.8.0", edition: "180", commit: 1b51c19c972cdccd2970b71e72ed73dad8ff92a9, tree: ac1c5cde66af19538e04ffb4754f605550c1aa25, tracked_blob_count: 4036}
    - {ref: v1.9.0, edition: v190, commit: a85bd46c18d33130298f0e223bd84ea6e29a17de, tree: 3ea6673d18683bee78345a261ad9a7b14ef49125, tracked_blob_count: 4700}
    - {ref: HEAD, edition: head, commit: 7177bb4a74dff21c664aab4002bd2caa40c74bd9, tree: b4cd73442c7b92186435092104f73dd45131f9aa, tracked_blob_count: 5153, head_means: pinned_intake_commit_not_live_ref}
denied_inputs:
  - parent directories
  - private workspace
  - home or credential reads
  - live operations
  - runtime claims without runtime evidence
official_web:
  status: cited_from_public_source_only
  live_fetch: unavailable_in_this_session
  note: Official URLs appear in README.md and sureness.yml. Live official-web retrieval was not executed here; those URLs are recorded as source-cited references, not as independently fetched page evidence.
origin: https://github.com/apache/hertzbeat
