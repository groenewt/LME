input_authorities:
  statement: Catalog, index, and evidence YAML follow the same representation and value-sourcing rule as other files. They are not exemptions. Suffix-only wrapping is not claimed as compliance. Historical intake indexes remain original-packet catalogs; current service identity is complete-source-index.yaml plus pinned-source-versions.yaml.
  historical_intake:
    source_index:
      path: input/source-index.yaml
      role: original_author_scoped_packet_catalog
    supplement_index:
      path: input/supplement-index.yaml
      role: original_author_scoped_packet_catalog
  current_service_identity:
    complete_source_index:
      path: input/review3-feedback/complete-source-index.yaml
      sha256: 54ae85418488b759542a12894d95a7848e060c9d65ba4c92332cfa48788426f3
      lists_blobs_without_commit_tree: true
    packet_source_resolver:
      path: candidate/packet-source-resolver.yaml
      role: maps_storage_aliases_to_logical_repo_ref_commit_tree_blob_path
    pinned_source_versions:
      path: input/review3-feedback/pinned-source-versions.yaml
      origin: https://github.com/apache/hertzbeat
      version_identities:
        - {ref: "1.8.0", commit: 1b51c19c972cdccd2970b71e72ed73dad8ff92a9, tree: ac1c5cde66af19538e04ffb4754f605550c1aa25}
        - {ref: v1.9.0, commit: a85bd46c18d33130298f0e223bd84ea6e29a17de, tree: 3ea6673d18683bee78345a261ad9a7b14ef49125}
        - {ref: HEAD, commit: 7177bb4a74dff21c664aab4002bd2caa40c74bd9, tree: b4cd73442c7b92186435092104f73dd45131f9aa, head_means: pinned_intake_commit_not_live_ref}
  native_repair_feedback:
    path: input/native-repair-feedback.yaml
    at: "2026-10-09T23:03:42.907270+00:00"
projection_values: candidate/repair-values.yaml
projection_templates:
  note: Entry templates import macros.j2 and emit only YAML-declared field names, punctuation, and tunables from repair-values.yaml. This catalog is not a DeepKV or ontology registry. Canonical target contracts are not in this packet and are not invented.
  native_render: candidate/repair-values.yaml native_render
  macro_library: candidate/templates/macros.j2
  files:
