observability_query_gate:
  statements:
    - ThreeSignalQueryController requires warehouse.store.greptime.enabled=true
    - capability.traceQuery and otlpMetricQuery are true only when ThreeSignalQueryService is registered
    - log query is HistoryDataReader.supportsLogQuery
  source:
    path: hertzbeat-observability/src/main/java/org/apache/hertzbeat/observability/controller/ObservabilityCapabilityController.java
    lines: [36, 64]
prometheus_aliases:
