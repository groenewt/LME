    source: {path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/controller/MetricsDataController.java, edition: "180", lines: [52, 61]}
  v1.9.0_HEAD:
    type: WarehouseStorageStatus
    fields: [available, droppedMetrics, pendingMetrics]
    source: {path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/service/WarehouseStorageStatus.java, versions: [v1.9.0, HEAD], lines: [29, 29]}
  unavailable:
    code: FAIL_CODE
    msg: Service not available!
tables:
  LOG_TABLE_NAME: hertzbeat_logs
  TRACE_TABLE_NAME: hertzbeat_traces
  source:
    path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/constants/WarehouseConstants.java
