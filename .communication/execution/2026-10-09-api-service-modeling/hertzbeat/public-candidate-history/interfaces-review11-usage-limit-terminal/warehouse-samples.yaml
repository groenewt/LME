schema: hertzbeat.public-source.interface-model/v1
kind: warehouse-samples
numeric_samples:
  storage_representation: Apache Arrow table of UTF-8 columns plus metadata
  field_type_hints:
    TYPE_NUMBER: 0
    TYPE_STRING: 1
    TYPE_SECRET: 2
    TYPE_TIME: 3
    source:
      path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/constants/CommonConstants.java
      versions: [v1.9.0, HEAD]
      lines: [185, 203]
  null_placeholder: "&nbsp;"
  alert_number_parse: CommonUtil.parseStrDouble for TYPE_NUMBER; parseStrInteger for TYPE_TIME
  alert_parse_source:
    path: hertzbeat-alerter/src/main/java/org/apache/hertzbeat/alert/calculate/realtime/MetricsRealTimeAlertCalculator.java
    lines: [252, 262]
  claim: CollectRep stores sample columns as strings in Arrow VarChar vectors. Numeric meaning is a field-type hint used by consumers, not a native Arrow numeric type in this class.
  source:
    path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/entity/message/CollectRep.java
    versions: [v1.9.0, HEAD]
    lines: [50, 200]
    blob: 0bac03f823a06ec52bfb90c606b38b357c24c373
    sha256: ec60da7418fddf567670d6fe4ef379752bb5488095826290ed229d37141be071
  source_180:
    path: hertzbeat-common/src/main/java/org/apache/hertzbeat/common/entity/message/CollectRep.java
    versions: ["1.8.0"]
    lines: [50, 90]
arrow:
  present: true
  present_in_editions: ["1.8.0", v1.9.0, HEAD]
  classes:
    - org.apache.hertzbeat.common.util.ArrowUtil
    - org.apache.hertzbeat.common.entity.message.CollectRep.MetricsData
    - org.apache.arrow.vector.table.ArrowTable
  serializeMultipleRoots:
    layout: [int32 rootCount, then for each root (int32 length, ArrowStream bytes)]
    source:
      path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/util/ArrowUtil.java
      versions: [v1.9.0, HEAD]
      lines: [54, 78]
      blob: 54b51431879ddc3cbf6ef76d6aba8b420fff9238
      sha256: 9721ac48d66cd20cf4c4ac645788f3a20bf0e4224cf14cbf399899a920c0ca9f
  deserializeMetricsData:
    empty_or_null: empty list
    source:
      path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/util/ArrowUtil.java
      lines: [130, 147]
  metricsData.toByteArrayAndRelease:
    writer: ArrowStreamWriter single batch
    io_fail: returns null
    source:
      path: hertzbeat-common-core/src/main/java/org/apache/hertzbeat/common/entity/message/CollectRep.java
      lines: [168, 180]
  evidence_vs_runtime:
    statement: Arrow classes and serialization layout are present in all three public copies. This is not a claim that a live warehouse is serving Arrow bytes.
protobuf:
  cluster_control: hertzbeat-common-core/src/main/message/cluster_msg.proto
  cluster_payload: bytes msg field, not typed metric proto
  collect_metrics: CollectRep is Arrow Java, not a .proto message, in all three pins
  test_only_proto: hertzbeat-common-core/src/test/proto/person.proto
  otlp_180_logs:
    json_and_protobuf_consumes_on: POST /api/logs/otlp/v1/logs
    source:
      path: hertzbeat-log/src/main/java/org/apache/hertzbeat/log/controller/OtlpLogController.java
      edition: "180"
      lines: [72, 101]
  claim: Public copies declare protobuf for collector-manager cluster messages and 1.8.0 OTLP log ingest. Metric samples on all three pins are Arrow CollectRep, not protobuf MetricsData.
history:
  rest: GET /api/monitor/{instance}/metric/{metricFull}
  metricFull: "{app}.{metrics}.{metric}"
  parts_required: 3
  history_param: "s|M|h|d|w units, example 6h, default mentioned as 6h in swagger"
  interval_param: Boolean, default off; swagger says 4-hour window and query limit >1 week
  tsdb_down:
    code: FAIL_CODE
    msg: time series database not available
  source:
    path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/controller/MetricsDataController.java
    lines: [79, 102]
  query_rest: POST /api/warehouse/query
  query_body: List<DatasourceQuery>
  expr_types_documented: [promql, sql, influxql]
  time_types: [range, instant]
  warehouse_constants:
    PROMQL: promql
    SQL: sql
    RANGE: range
    INSTANT: instant
    source:
      path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/constants/WarehouseConstants.java
      lines: [65, 71]
export:
  monitors:
    selected: GET /api/monitors/export type JSON|EXCEL
    all: GET /api/monitors/export/all type JSON|EXCEL|YAML
  alerts: GET /api/alerts/export Excel on v1.9.0/HEAD; mapping absent on 1.8.0
  alert_defines: GET /api/alert/defines/export plus POST /api/alert/defines/import
  utils:
    - org.apache.hertzbeat.common.util.export.ExcelExportUtils
    - org.apache.hertzbeat.common.util.export.YamlExportUtils
realtime:
  get: GET /api/monitor/{monitorId}/metrics/{metrics}
  empty: success with msg "query metrics data is empty"
  backends:
    redis: redis
    memory: memory
  source:
    path: hertzbeat-warehouse/src/main/java/org/apache/hertzbeat/warehouse/constants/WarehouseConstants.java
    lines: [58, 63]
history_backends_named:
  greptime: greptime
  influxdb: influxdb
  iot-db: iot-db
  jpa: jpa
  td-engine: td-engine
  victoria-metrics: victoria-metrics
  victoria-metrics.cluster: victoria-metrics.cluster
  questdb: questdb
  duckdb: duckdb
  doris: doris
