static_limits:
  - "Graphs are complete public Java CPGs for HertzBeat 180 (hertzbeat-180-complete-java-cpg.bin sha256=82f44d41c7176dcae275fa14efb973ff27ed43f7cc476cb145b9dfae5c6de611) and v190 (hertzbeat-v190-complete-java-cpg.bin sha256=972562407ad05b76567767877424a13d46a8c7b6775897b38c2de665563ed7fb). Match GRAPH_DYNAMIC counts to GRAPH_JOB rows; do not use the historical 15-file subset as denominator."
  - "GRAPH_JOB calls are CALL nodes (180=99414, v190=137749). complete-java-graph-coverage.yaml CALL figures are edges (180=102121, v190=141982). Do not treat edge totals as GRAPH_JOB calls."
  - "Production-only selectors drop filenames containing test_source or /src/test/. GRAPH_JOB/GRAPH_DYNAMIC whole-graph counts still include every CPG method and call."
  - "owner_namespace is org.apache.hertzbeat. SurenessJakartaServletFilter is com.usthe.sureness and is an explicit external/interface path, not a production HertzBeat method match."
  - "No-delombok graphs omit generated code and may have unresolved signatures, including AuthTokenController.generateToken and several warehouse methods."
  - "Static reachableByFlows is IFDS over REACHING_DEF and CDG. It does not prove runtime invocation, JWT issuance, TSDB I/O, JDBC sockets, SSH sessions, HTTP clients, or JMX connections."
  - "saveData.param -> getHistoryMetricData crosses history adapters and SQL/TSDB stores; empty flow is DATAFLOW_GAP with denominators, not success."
  - "serializeMultipleRoots and toByteArrayAndRelease are sibling Arrow encodings; a DATAFLOW_GAP between them is not proof either method is absent."
  - "JPA HistoryName has no DataStorage implementation in these warehouse trees. Helm SSE MCP and Rust mcp-bash-server are outside this Java CPG."
  - "HEAD Java matches v1.9.0 by path and content digest; there is no separate HEAD parse claim."
  - "Empty DATAFLOW_EMPTY or DATAFLOW_GAP rows with source_count/sink_count/flow_count are explicit non-results, not fabricated paths or success."
  - "Iterators are not consumed before flow computation: sources and sinks materialize with .l; reachableByFlows uses list.iterator pairs."
