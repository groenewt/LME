claims:
  - id: no-runtime
    statement: These declarations are sourced from public copies plus complete-source-index.yaml and pinned-source-versions.yaml. No live process, deployed endpoint, or warehouse availability is claimed.
  - id: v190-head-sureness-identical
    statement: v1.9.0 and HEAD share the same sureness.yml digest. REST role rules for those two refs are therefore the same file. Historical source-index.yaml recorded that digest; current authority is complete-source-index.yaml plus pinned-source-versions.yaml.
  - id: v190-head-application-yml-identical
    statement: v1.9.0 and HEAD share the same hertzbeat-startup application.yml digest, including spring.ai.mcp.server.streamable-http.mcp-endpoint /api/mcp. Helm chart ConfigMap is a different transport (sse-mcp-server, /api/sse, /api/mcp/message).
  - id: controller-denominator
    statement: Full 1.8.0 tracked Controller.java count is 50. Original author historical subset input/source/180 glob is 39 manager-side controllers. That omission is a named historical receipt, not upstream absence. The other 11 are template-marketplace/hertzbeat-template-hub controllers, present in complete tracked source and copied under this worker's current admitted alias input/review3-feedback/source/180/template-marketplace. Reviewer packets may place the same origin files under input/source/180/template-marketplace. They remain a separately authored hub, not manager endpoints. v1.9.0 and HEAD full tracked counts are 44. RestControllerAdvice classes are additional error surfaces, not in those counts.
  - id: head-commit-pinned-intake
    statement: HEAD here is pinned intake commit 7177bb4a74dff21c664aab4002bd2caa40c74bd9 tree b4cd73442c7b92186435092104f73dd45131f9aa per input/review3-feedback/pinned-source-versions.yaml. That is not a live ref freshness claim. complete-source-index.yaml lists blobs without commit/tree fields; commit/tree come from the pinned-source-versions receipt.
  - id: arrow-present-all-three
    statement: CollectRep MetricsData is Apache Arrow in all three pins. 1.8.0 stores it under hertzbeat-common; v1.9.0/HEAD under hertzbeat-common-core. Arrow presence is public-source evidence, not a runtime warehouse claim.
  - id: packet-source-resolver
    statement: Logical identities are origin URL, edition ref, commit, tree, origin path, and blob. candidate/packet-source-resolver.yaml maps storage aliases. Historical author paths remain valid. Reviewer relocation does not rewrite upstream facts.
  - id: rust-present-in-inherited-packet
    statement: Exact Rust files for mcp-servers/mcp-bash-server are present in this inherited public source packet under this worker's current admitted alias input/review3-feedback/source. Original author interfaces snapshot stored those origin paths under input/source; that is a named historical receipt. This worker's input/source alias currently holds README.md. Reviewer packets may place the same origin files under input/source. Absence at a later packet alias is not upstream absence.
  - id: abstractcollect-spi-copies-admitted
    statement: Exact public AbstractCollect SPI files are admitted under this worker's current alias input/repair/source/{edition}. Copy-status is present there. Reviewer packets may place the same origin files under input/source/{edition}. Those files are the collector ServiceLoader roster, not plugin SPI. org.apache.hertzbeat.plugin.Plugin is a Java interface without a services file.
