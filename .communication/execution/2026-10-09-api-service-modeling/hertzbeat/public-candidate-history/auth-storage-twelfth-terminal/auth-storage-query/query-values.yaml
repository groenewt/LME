static_limits:
  - "Graphs are complete public Java CPGs for HertzBeat 180 (hertzbeat-180-complete-java-cpg.bin sha256=82f44d41c7176dcae275fa14efb973ff27ed43f7cc476cb145b9dfae5c6de611) and v190 (hertzbeat-v190-complete-java-cpg.bin sha256=972562407ad05b76567767877424a13d46a8c7b6775897b38c2de665563ed7fb). Match GRAPH_DYNAMIC counts to GRAPH_JOB rows; do not use the historical 15-file subset as denominator."
  - "GRAPH_JOB calls are CALL nodes (180=99414, v190=137749). complete-java-graph-coverage.yaml CALL figures are edges (180=102121, v190=141982). Do not treat edge totals as GRAPH_JOB calls."
  - "io.shiftleft.semanticcpg.language.LazyLocation.apply is not imported. Native paired execution showed that implicit conversion changes Call.methodFullName to the enclosing METHOD fullName. Callee targets are read from propertiesMap METHOD_FULL_NAME; enclosing methods from the METHOD FULL_NAME property."
  - "query-repair4 CALL rows compared 0 equal_to_raw_property on rust 180/v190 and java-production 180/v190. Those target-selected CALL, control, and dataflow results are invalid. Rust raw_flow_count 0 is retained failure history, not an accepted empty result."
  - "Independent rust2cpg impl-body gap remains: node 30064771336 raw METHOD_FULL_NAME is <unresolvedNamespace>::is_empty while enclosing is mcp_bash_server::common::oauth::validate_public_base_url. This Java query does not close that CSV gap."
  - "Exact METHOD FULL_NAME and CALL METHOD_FULL_NAME selectors replace nameExact plus owner_namespace plus test-path filters. Test callers of production callees remain in raw sink and flow denominators and are classified after whole-path qualification."
  - "PATH_QUAL reports raw, rejected, unknown, unqualified, partial, and accepted counts. Required source-start and unique enclosing METHOD are distinct from optional LINE_NUMBER_END availability, production/test filename class, graph extraction, and runtime. Missing required start (line 0) remains unqualified. Missing or ambiguous owner is unknown. Absent optional LINE_NUMBER_END is partial source binding, not invented coordinates and not fully qualified accepted. Filename-accepted line0 GlobalConnectionCache/JdbcQueryExecutorRegistry stays unqualified."
  - "FLOWNODE emits qualify, stable graph id, label, code, file, line, end-line, unique enclosing METHOD identity, and owner location. IR-03 GlobalConnectionCache and JdbcQueryExecutorRegistry filename-accepted line0 nodes are unqualified. Old output identities are receipt ordinals; this query does not invent node ids for those rows."
  - "Joern 4.0.563 AstNode has no lineNumberEnd member. Native auth-storage9-180 compile exit 1 at n.lineNumberEnd (input/repair10/compile-error.stderr). End-line is the optional raw LINE_NUMBER_END property via propertiesMap.get; empty or absent is MISSING_LINE, not an invented line. v190 was not run because the identical script failed compilation on 180."
  - "Native StrictUndefined render failed with 'dot' is undefined (input/repair11/native-validation.yaml, snapshot public-candidate-history/auth-storage-tenth-terminal). emit_line_end_helper used rendering.dot between endProperty and nonEmpty without signature or call binding. Unique argument dot is rendering.dot; no literal fallback. Optional raw LINE_NUMBER_END, graph/source/owner qualification, 20 families, and STATIC_CONTROLS remain. That failed render and native 180 compile exit 1 remain history, not approval."
  - "TYPEDECL namespaces are org.apache.hertzbeat and com.usthe.sureness with pin bindings. Pin 180 lacks SurenessJakartaServletFilter; TYPE_NS GAP for com.usthe.sureness on 180 is a roster gap, not a whole-service namespace claim. owner_namespace remains TYPEDECL-adjacent, not a CALL/METHOD selector."
  - "STATIC_CONTROLS declare source-bound expected endpoints and provenance. After linked IFDS they print expected versus observed source/sink/flow counts with category and nonvacuity. Declaration printing is never a test pass (pass=false). Positive Arrow source-call with zero IFDS remains GAP. Negative history nonempty endpoints and zero flow are finite static negative only. JPA and toByteArrayAndRelease absent endpoints are EMPTY, not negative proof. Controls do not add IFDS families; family_denominator_count remains 20 with original EMPTY/GAP."
  - "AuthTokenController.generateToken is org.springframework.http.ResponseEntity() on 180 and <unresolvedSignature>(2) on v190. JdbcCommonCollect.executeQuery and executeJdbcQuery METHOD/CALL targets exist on v190 and are absent on 180. SurenessJakartaServletFilter.doFilter exists on v190/head and is absent from the 180 Java METHOD export. DorisDataStorage.saveData is v190-only. HistoryName.JPA has no DataStorage class."
  - "CollectRep.MetricsData.toByteArrayAndRelease exists as a METHOD on both pins; CALL export has no METHOD_FULL_NAME toByteArrayAndRelease rows. serializeMultipleRoots and toByteArrayAndRelease are sibling encodings. serializeMetricsData calls toVectorSchemaRootAndRelease then serializeMultipleRoots."
  - "parseStrDouble is CommonUtil.parseStrDouble:<unresolvedSignature>(1); the numeric parse CALL target in that method is <unresolvedNamespace>.parseDouble:<unresolvedSignature>(1). That unresolved signature is retained, not rewritten to java.lang.Double."
  - "owner_namespace org.apache.hertzbeat is not a CALL/METHOD selector. SurenessJakartaServletFilter is com.usthe.sureness and is family auth_external."
  - "saveData.param -> getHistoryMetricData crosses history adapters and SQL/TSDB stores; empty flow is DATAFLOW_GAP with denominators, not success."
  - "Static reachableByFlows is IFDS over REACHING_DEF and CDG. It does not prove runtime invocation, JWT issuance, TSDB I/O, JDBC sockets, SSH sessions, HTTP clients, or JMX connections."
