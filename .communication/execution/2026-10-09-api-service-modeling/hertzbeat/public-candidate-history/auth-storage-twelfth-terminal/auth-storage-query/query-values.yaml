kind: joern-query-values
joern_version: "4.0.563"
language: scala3
cpg_scope: complete public Apache HertzBeat Java graphs 180 and v190 with exact fullName and raw CALL METHOD_FULL_NAME selectors; whole-path qualification after flow, not production-only source/sink filters
native_render:
  engine: jinja2
  undefined: StrictUndefined
  autoescape: false
  trim_blocks: false
  lstrip_blocks: false
  keep_trailing_newline: true
  strip_control_with_dash: true
  loader: FileSystemLoader
  searchpath:
    - "."
    - candidate/auth-storage-query
  values_file: query-values.yaml
  entry_template: query.sc.j2
  macro_template: macros.j2
  from_import: macros.j2
  output_file: query.sc
  context: top-level keys of query-values.yaml
  note: Native StrictUndefined render is authority. query.sc is the intended projection and cannot substitute for a failed native render.
  imported_macros:
    - emit_import
    - emit_println_quoted
    - emit_collection
    - emit_raw_string_helper
    - emit_call_target_helper
    - emit_enclosing_helper
    - emit_method_full_helper
    - emit_filename_helper
    - emit_line_helper
    - emit_line_end_helper
    - emit_id_helper
    - emit_label_helper
    - emit_normalize_helper
    - emit_node_is_test_helper
    - emit_node_is_unknown_helper
    - emit_owner_methods_helper
    - emit_filename_policy_helper
    - emit_line_policy_helper
    - emit_owner_policy_helper
    - emit_node_qualify_helper
    - emit_owner_identity_helper
    - emit_path_qualify_helper
    - emit_gap_foreach
jinja_context_aliases:
  s: scala
  r: rendering
  cpg: cpg
  h: helpers
  m: markers
  lab: labels
  id: idents
  b: binders
  rp: raw_properties
  pq: path_qualification
jinja_macro_arity:
  native_compile_error: duplicate argument l_1_space in function definition
  native_validation: input/repair8-feedback/auth-storage7-native-validation.yaml
  structural_findings: input/repair8-feedback/auth-storage7-jinja-structural-findings.yaml
  emit_string_item: same-module macro used by emit_collection; not an external missing variable
  comma_source: rendering.comma
  space_source: rendering.space
  dot_source: rendering.dot
  emit_call_target_helper_comma_arg: comma
  emit_filename_helper_comma_arg: comma
  emit_enclosing_helper_space_arg: space
  emit_enclosing_helper_duplicate_space: removed
  emit_line_end_helper: optional raw LINE_NUMBER_END via rawStringProperty; absent or empty is missing_line; unique args including comma and rendering.dot
  emit_line_end_helper_dot_arg: dot
  emit_line_end_helper_native_render_error: "'dot' is undefined"
  emit_line_end_helper_native_validation: input/repair11/native-validation.yaml
  emit_line_end_helper_not_used: cpg.line_number_end typed lineNumberEnd is not a member of AstNode on Joern 4.0.563
  emit_line_policy_helper_partial: unique else_if_kw and line_policy_classes.partial; line 0 is unqualified; absent LINE_NUMBER_END is partial
  emit_node_qualify_helper_partial: unique qualify_classes.partial before accepted
  emit_path_qualify_helper_partial: unique path_qualification.partial before accepted
line_end_access:
  typed_member: lineNumberEnd
  typed_member_on: io.shiftleft.codepropertygraph.generated.nodes.Method
  typed_member_not_on: io.shiftleft.codepropertygraph.generated.nodes.AstNode
  ast_node_source: raw_properties.line_number_end_key
  present: raw string from propertiesMap.get
  absent: missing_line
  not_invented: true
  native_compile_error: value lineNumberEnd is not a member of io.shiftleft.codepropertygraph.generated.nodes.AstNode
  native_feedback: input/repair10/compile-error.stderr
  native_180_exit: 1
  native_v190: not_run_identical_script_failed_on_180
repair11_render:
  native_error: "'dot' is undefined"
  native_validation: input/repair11/native-validation.yaml
  snapshot: public-candidate-history/auth-storage-tenth-terminal
  cause: emit_line_end_helper body used dot between end_property and non_empty without signature or call binding
  repair: unique argument dot bound to rendering.dot; no literal fallback
  macros_inspected_for_undefined_bindings: true
  preserved: optional raw LINE_NUMBER_END, FLOWNODE line_end and owner_line_end, graph/source/owner qualification, 20 families, STATIC_CONTROLS
  no_semantic_simplification: true
  native_re_render: not_executed
  no_test_or_approval_claim: true
review12_policy:
  independent_review: input/review12/independent-review/review.yaml
  native_readback: input/review12/auth-storage11-raw-node-owner-readback.yaml
  native_validation: input/review12/auth-storage11-native-validation.yaml
  line_policy: required start line 0 is unqualified; optional absent LINE_NUMBER_END or 0 is partial; present nonzero end is qualified
  not_invented_end: true
  partial_is_not_accepted: true
  missing_start_or_owner: missing start remains unqualified; missing or ambiguous owner remains unknown
  family_denominator_count: 20
  argument_witnesses_extra: 3
  declaration_is_not_pass: true
  numeric_history_expansion: owned_by_numeric_query_worker
  native_re_render: not_executed
  no_test_or_approval_claim: true
