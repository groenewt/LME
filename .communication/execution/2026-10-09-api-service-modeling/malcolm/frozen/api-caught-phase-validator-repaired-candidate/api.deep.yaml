  acknowledge_versus_delivery:
    statement: event_http_result_is_database_index_acknowledgement_not_retrieved_content_and_not_pipeline_delivery
    source_refs:
      - {source_id: src_init_v26, path: api/project/__init__.py, blob: 8f36915f502e0c72d4a1f59982717e8e1e5c342f, lines: [1696, 1817]}
      - {source_id: src_docs_event, path: docs/api-event-logging.md, blob: fe73b791bb434d5db81fabecd9d03d99b59cf77f, lines: [7, 123]}
    steps_observed:
