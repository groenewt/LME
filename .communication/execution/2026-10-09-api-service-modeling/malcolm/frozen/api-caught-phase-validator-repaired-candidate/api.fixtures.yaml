    - id: fix_health_ping
      kind: positive
      operation_id: op_ping
      response_contract_id: resp_ping_jsonify
      source_refs:
        - {source_id: src_health_api, lines: [5, 5]}
      request:
        method: GET
        path: /mapi/ping
      expected:
        status_kind: unresolved_framework_default
        unresolved_reason: framework_default_status_not_inferred_from_ast
        body:
          ping: pong
        body_kind: source_literal
        health_script_proves_delivery: false
        health_script_status_kind: unexecuted_http
        health_script_unresolved_reason: health_script_has_no_status_or_json_literal
  negative:
    - id: fix_rbac_denied
      kind: negative
      operation_id: op_document
      source_refs:
        - {source_id: src_init_v26, lines: [400, 411, 832, 833, 1820, 1823]}
      request:
        method: GET
        path: /mapi/document
        headers:
          X-Forwarded-Roles: ""
