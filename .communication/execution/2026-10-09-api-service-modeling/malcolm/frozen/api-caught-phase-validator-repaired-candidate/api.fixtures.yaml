        method: GET
        path: /mapi/indices
      expected:
        body_keys: [indices, malcolm_network_index_pattern, malcolm_other_index_pattern, arkime_network_index_pattern]
        status_kind: unresolved_framework_default
        unresolved_reason: framework_default_status_not_inferred_from_ast
    - id: fix_netbox_sites
