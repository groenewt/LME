        v26_status: 403
        v26_status_kind: explicit_literal
        v26_body: {error: Not authorized to perform this action}
        v25_status: unspecified_flask_default
        v25_status_kind: unresolved_framework_default
        v25_unresolved_reason: v25_has_no_permission_errorhandler
    - id: fix_fields_invalid_template
      kind: negative
      operation_id: op_fields
      present_since: v26.07.1
      response_contract_id: resp_fields_invalid_template
      source_refs:
        - {source_id: src_init_v26, lines: [911, 912]}
      request:
        method: GET
        path: /mapi/fields
        query:
          template: "../evil"
      expected:
        status: 400
        status_kind: explicit_literal
        body: {error: Invalid template name}
        body_kind: source_literal
    - id: fix_event_empty
      kind: negative
      operation_id: op_event
      source_refs:
        - {source_id: src_init_v26, lines: [1703, 1817]}
