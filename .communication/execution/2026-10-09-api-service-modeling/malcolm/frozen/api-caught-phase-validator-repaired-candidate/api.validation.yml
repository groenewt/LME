          - item[fixtures.execution.retrieved_content_bind_key] != fixtures.execution.retrieved_content_bind_acknowledge or not (model.operations | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, item[model.validation.selectors.operation_id_key]) | first).acknowledge[model.validation.selectors.proves_retrieved_content_key]
          - fixtures.execution.runtime_http == model.validation.expected.runtime_not_executed
        fail_msg: "{{ model.validation.messages.fixture_value_mismatch }}"
      loop: "{{ (fixtures.positive + fixtures.negative) | selectattr(fixtures.execution.retrieved_content_bind_key, model.format.lookup.defined_test) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Every source record declares identity kind
      ansible.builtin.assert:
        that:
          - item[model.format.identity_join.identity_kind_key] is defined
          - item[model.format.identity_join.identity_kind_key] in model.schema.identity_kinds
        fail_msg: "{{ model.validation.messages.missing_ref_join }}"
      loop: "{{ model.sources.files }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Git source records join every declared ref
      ansible.builtin.assert:
        that:
          - item[model.format.identity_join.path_key] is defined
          - item[model.format.identity_join.blob_key] is defined
          - item[model.format.identity_join.sha256_key] is defined
          - model.format.identity_join.commit_key not in item
          - model.format.identity_join.tree_key not in item
          - model.format.identity_join.repository_key not in item
          - model.format.identity_join.refs_key in item or model.format.identity_join.ref_key in item
          - ((item[model.format.identity_join.refs_key] if model.format.identity_join.refs_key in item else [item[model.format.identity_join.ref_key]]) | reject(model.format.lookup.in_test, model.sources.refs | map(attribute=model.format.identity_join.ref_value_key) | list) | list | length) == model.validation.expected.missing_ref_join_allowed
        fail_msg: "{{ model.validation.messages.missing_ref_join }}"
      loop: "{{ model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.git_source_kind) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Rendered source catalog joins every ref table identity
      ansible.builtin.assert:
        that:
          - model.sources[model.format.identity_join.repository_key] in rendered_baseline
          - item[model.format.identity_join.ref_value_key] in rendered_baseline
          - item[model.format.identity_join.commit_key] in rendered_baseline
          - item[model.format.identity_join.tree_key] in rendered_baseline
          - model.format.tokens.missing_ref_join not in rendered_baseline
          - model.format.identity_join.packet_observation_provenance in rendered_baseline
        fail_msg: "{{ model.validation.messages.missing_ref_join }}"
      loop: "{{ model.sources.refs }}"
      loop_control:
        label: "{{ item[model.format.identity_join.ref_value_key] }}"

    - name: Shared init blob joins both declared refs
      ansible.builtin.assert:
        that:
          - ((model.sources.files | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.shared_blob_source_id) | first)[model.format.identity_join.refs_key] | length) == model.validation.expected.shared_init_ref_count
          - ((model.sources.files | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.shared_manage_source_id) | first)[model.format.identity_join.refs_key] | length) == model.validation.expected.shared_manage_ref_count
          - ((model.sources.files | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.shared_entrypoint_source_id) | first)[model.format.identity_join.refs_key] | length) == model.validation.expected.shared_entrypoint_ref_count
        fail_msg: "{{ model.validation.messages.missing_ref_join }}"

    - name: Metadata observations keep packet provenance
      ansible.builtin.assert:
        that:
          - item[model.format.identity_join.path_key] is defined
          - item[model.format.identity_join.packet_path_key] is defined
          - item[model.format.identity_join.provenance_key] == model.format.identity_join.packet_observation_provenance
          - item[model.format.identity_join.sha256_key] is defined
          - item[model.format.identity_join.bytes_key] is defined
          - model.format.identity_join.blob_key not in item
          - model.format.identity_join.commit_key not in item
          - model.format.identity_join.repository_key not in item
          - model.format.identity_join.refs_key not in item
          - model.format.identity_join.ref_key not in item
        fail_msg: "{{ model.validation.messages.metadata_identity }}"
      loop: "{{ model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.metadata_observation_kind) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Metadata records join observation byte identities
      vars:
        bound_bytes: "{{ model.sources[model.format.identity_join.metadata_bytes_table_key] | selectattr(model.format.identity_join.metadata_byte_source_id_key, model.format.lookup.equalto_test, item[model.validation.selectors.id_key]) | first }}"
      ansible.builtin.assert:
        that:
          - (model.sources[model.format.identity_join.metadata_bytes_table_key] | selectattr(model.format.identity_join.metadata_byte_source_id_key, model.format.lookup.equalto_test, item[model.validation.selectors.id_key]) | list | length) == model.format.lookup.required_match_count
          - item[model.format.identity_join.sha256_key] == bound_bytes[model.format.identity_join.sha256_key]
          - item[model.format.identity_join.bytes_key] == bound_bytes[model.format.identity_join.bytes_key]
          - item[model.format.identity_join.path_key] == bound_bytes[model.format.identity_join.path_key]
          - item[model.format.identity_join.packet_path_key] == bound_bytes[model.format.identity_join.packet_path_key]
          - item[model.format.identity_join.sha256_key] not in (model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.git_source_kind) | map(attribute=model.format.identity_join.blob_key) | list)
          - item[model.format.identity_join.sha256_key] not in (model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.git_source_kind) | map(attribute=model.format.identity_join.sha256_key) | list)
          - item[model.format.identity_join.sha256_key] not in model.sources[model.format.identity_join.excluded_sha256_key]
        fail_msg: "{{ model.validation.messages.metadata_byte_join }}"
      loop: "{{ model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.metadata_observation_kind) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Metadata byte identity table joins every observation record
      ansible.builtin.assert:
        that:
          - (model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.metadata_observation_kind) | list | length) == model.validation.expected.metadata_observation_count
          - (model.sources[model.format.identity_join.metadata_bytes_table_key] | length) == model.validation.expected.metadata_observation_count
          - ((model.sources.files | selectattr(model.format.identity_join.identity_kind_key, model.format.lookup.equalto_test, model.format.identity_join.metadata_observation_kind) | map(attribute=model.format.identity_join.sha256_key) | reject(model.format.lookup.in_test, model.sources[model.format.identity_join.metadata_bytes_table_key] | map(attribute=model.format.identity_join.sha256_key) | list) | list | length) == model.validation.expected.missing_metadata_byte_join_allowed)
        fail_msg: "{{ model.validation.messages.metadata_byte_join }}"

    - name: Rendered source catalog joins every metadata byte identity
      ansible.builtin.assert:
        that:
          - item[model.format.identity_join.sha256_key] in rendered_baseline
          - model.format.tokens.missing_metadata_byte_join not in rendered_baseline
        fail_msg: "{{ model.validation.messages.metadata_byte_join }}"
      loop: "{{ model.sources[model.format.identity_join.metadata_bytes_table_key] }}"
      loop_control:
        label: "{{ item[model.format.identity_join.metadata_byte_source_id_key] }}"

    - name: Status body and body_keys claims require a response contract
      ansible.builtin.assert:
        that:
          - model.validation.selectors.status_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.format.optional_keys.body not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.body_keys_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.singular_body_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.v26_status_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.v26_body_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.format.optional_keys.body_kind not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.sources_present_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
          - model.validation.selectors.sources_populated_key not in item[model.format.optional_keys.expected] or model.validation.selectors.response_contract_id_key in item
        fail_msg: "{{ model.validation.messages.response_contract_mismatch }}"
      loop: "{{ fixtures.positive + fixtures.negative }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Fixture response claims bind to source contracts
      vars:
        bound_contract: "{{ model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, item[model.validation.selectors.response_contract_id_key]) | first }}"
        allowed_body_keys: "{{ ((bound_contract[model.validation.selectors.body_keys_key] | map(attribute=model.validation.selectors.name_key) | list) if model.validation.selectors.body_keys_key in bound_contract else model.format.lookup[model.validation.selectors.empty_list_key]) + ((bound_contract[model.validation.selectors.dynamic_keys_key] | map(model.format.lookup[model.validation.selectors.dict2items_filter_key]) | flatten | selectattr(model.format.lookup.dict_key_attr, model.format.lookup.equalto_test, model.validation.selectors.default_decorator_literal_key) | map(attribute=model.format.lookup.dict_value_attr) | list) if model.validation.selectors.dynamic_keys_key in bound_contract else model.format.lookup[model.validation.selectors.empty_list_key]) }}"
      ansible.builtin.assert:
        that:
          - (model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, item[model.validation.selectors.response_contract_id_key]) | list | length) == model.format.lookup.required_match_count
          - item[model.validation.selectors.operation_id_key] == bound_contract[model.validation.selectors.operation_id_key] or (model.validation.selectors.response_operation_id_key in item and item[model.validation.selectors.response_operation_id_key] == bound_contract[model.validation.selectors.operation_id_key])
          - model.validation.selectors.status_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] in model.schema.status_kinds
          - model.validation.selectors.status_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] == model.validation.selectors.explicit_literal_kind
          - model.validation.selectors.status_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_key] != model.validation.expected.unsupported_http_default or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] == model.validation.selectors.explicit_literal_kind
          - model.validation.selectors.status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] != model.validation.selectors.explicit_literal_kind or item[model.format.optional_keys.expected][model.validation.selectors.status_key] == bound_contract[model.format.optional_keys.explicit_status][model.validation.selectors.value_key]
          - model.validation.selectors.status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] != model.validation.selectors.unresolved_framework_default_kind or bound_contract[model.format.optional_keys.explicit_status] == fixtures.execution.operands.null_value
          - model.format.optional_keys.body_kind not in item[model.format.optional_keys.expected] or model.format.optional_keys.body_kind not in bound_contract or item[model.format.optional_keys.expected][model.format.optional_keys.body_kind] == bound_contract[model.format.optional_keys.body_kind]
          - model.validation.selectors.sources_present_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.sources_present_key] == bound_contract[model.validation.selectors.sources_present_key]
          - model.validation.selectors.sources_populated_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.sources_populated_key] == bound_contract[model.validation.selectors.sources_populated_key]
          - model.validation.selectors.not_exhaustive_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.not_exhaustive_key] == bound_contract[model.validation.selectors.not_exhaustive_key]
          - model.validation.selectors.body_keys_key not in item[model.format.optional_keys.expected] or ((item[model.format.optional_keys.expected][model.validation.selectors.body_keys_key] | select(model.format.lookup.in_test, bound_contract[model.validation.selectors.body_keys_key] | selectattr(model.validation.selectors.presence_key, model.format.lookup.equalto_test, model.validation.selectors.try_body_presence) | map(attribute=model.validation.selectors.name_key) | list) | list | length) == model.validation.expected.missing_source_refs_allowed) or (model.validation.selectors.precondition_key in item and item[model.validation.selectors.precondition_key] == bound_contract[model.validation.selectors.path_id_key])
          - model.validation.selectors.status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] != model.validation.selectors.unresolved_framework_default_kind or item[model.format.optional_keys.expected][model.validation.selectors.unresolved_reason_key] == model.format.tokens.framework_default_not_inferred
          - model.validation.selectors.status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.status_kind_key] != model.validation.selectors.unresolved_framework_default_kind or fixtures.execution.runtime_http == model.validation.expected.runtime_not_executed
          - model.validation.selectors.body_keys_key not in item[model.format.optional_keys.expected] or (item[model.format.optional_keys.expected][model.validation.selectors.body_keys_key] | reject(model.format.lookup.in_test, allowed_body_keys) | list | length) == model.validation.expected.missing_source_refs_allowed
          - model.format.optional_keys.body not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.body_kind_key] != model.validation.selectors.source_literal_body_kind or item[model.format.optional_keys.expected][model.format.optional_keys.body] == bound_contract[model.format.optional_keys.body]
          - model.format.optional_keys.body not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.body_kind_key] != model.validation.selectors.empty_idx_response_body_kind or item[model.format.optional_keys.expected][model.format.optional_keys.body][(bound_contract[model.validation.selectors.body_keys_key] | map(attribute=model.validation.selectors.name_key) | list)[model.format.lookup.first_index]] == bound_contract[model.validation.selectors.empty_idx_response_key]
          - model.format.optional_keys.body not in item[model.format.optional_keys.expected] or model.validation.selectors.body_kind_key in item[model.format.optional_keys.expected]
          - model.validation.selectors.singular_body_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.singular_body_key] in allowed_body_keys
          - model.validation.selectors.v26_status_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.v26_status_key] == bound_contract[model.format.optional_keys.explicit_status][model.validation.selectors.value_key]
          - model.validation.selectors.v26_body_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.v26_body_key] == bound_contract[model.format.optional_keys.body]
          - model.validation.selectors.v25_status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.v25_status_kind_key] != model.validation.selectors.unresolved_framework_default_kind or item[model.format.optional_keys.expected][model.validation.selectors.v25_unresolved_reason_key] == model.format.tokens.v25_no_permission_errorhandler
          - model.validation.selectors.health_script_status_kind_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.health_script_status_kind_key] == model.validation.selectors.unexecuted_http_kind
          - model.validation.selectors.health_script_unresolved_reason_key not in item[model.format.optional_keys.expected] or item[model.format.optional_keys.expected][model.validation.selectors.health_script_unresolved_reason_key] == model.format.tokens.health_script_no_json
        fail_msg: "{{ model.validation.messages.response_contract_mismatch }}"
      loop: "{{ (fixtures.positive + fixtures.negative) | selectattr(model.validation.selectors.response_contract_id_key, model.format.lookup.defined_test) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Present dynamic keys declare a schema attribute
      ansible.builtin.assert:
        that:
          - ((item[model.validation.selectors.dynamic_keys_key] | map(model.format.lookup[model.validation.selectors.dict2items_filter_key]) | flatten | selectattr(model.format.lookup.dict_key_attr, model.format.lookup.in_test, model.schema[model.validation.selectors.dynamic_key_attr_roles_key]) | list | length) >= (item[model.validation.selectors.dynamic_keys_key] | length))
        fail_msg: "{{ model.validation.messages.dynamic_key_attr_schema }}"
      loop: "{{ model.response_contracts.records | selectattr(model.validation.selectors.dynamic_keys_key, model.format.lookup.defined_test) | list }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Aggregate dynamic body key is not a helper literal
      ansible.builtin.assert:
        that:
          - item[model.format.optional_keys.expected][model.format.optional_keys.dynamic_body_key] == ((model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, item[model.validation.selectors.response_contract_id_key]) | first)[model.validation.selectors.dynamic_keys_key] | map(model.format.lookup[model.validation.selectors.dict2items_filter_key]) | flatten | selectattr(model.format.lookup.dict_key_attr, model.format.lookup.equalto_test, model.validation.selectors.default_decorator_literal_key) | map(attribute=model.format.lookup.dict_value_attr) | list)[model.format.lookup.first_index]
          - item[model.format.optional_keys.expected][model.format.optional_keys.dynamic_body_key] not in ((model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, item[model.validation.selectors.response_contract_id_key]) | first)[model.validation.selectors.body_keys_key] | map(attribute=model.validation.selectors.name_key) | list)
        fail_msg: "{{ model.validation.messages.response_contract_mismatch }}"
      loop: "{{ fixtures.positive | selectattr(model.validation.selectors.response_contract_id_key, model.format.lookup.defined_test) | selectattr(model.format.optional_keys.expected, model.format.lookup.defined_test) | list }}"
      when: model.format.optional_keys.dynamic_body_key in item[model.format.optional_keys.expected]

    - name: Mutated explicit fixture status diverges from source contract
      vars:
        mutated_negatives: "{{ (fixtures.negative | rejectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | list) + [fixtures.negative | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first | combine(fixtures.execution.mutations.changed_fixture_status.patch, recursive=true)] }}"
      ansible.builtin.assert:
        that:
          - (mutated_negatives | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first)[model.format.optional_keys.expected][model.validation.selectors.status_key] == model.format.tokens[fixtures.execution.mutations.changed_fixture_status.value_token]
          - (mutated_negatives | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first)[model.format.optional_keys.expected][model.validation.selectors.status_key] != (model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, (fixtures.negative | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first)[model.validation.selectors.response_contract_id_key]) | first)[model.format.optional_keys.explicit_status][model.validation.selectors.value_key]
          - (mutated_negatives | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first)[model.format.optional_keys.expected][model.validation.selectors.status_key] != (fixtures.negative | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.fields_invalid_fixture_id) | first)[model.format.optional_keys.expected][model.validation.selectors.status_key]
        fail_msg: "{{ model.validation.messages.fixture_status_body_mutation }}"

    - name: Mutated ping body diverges from source contract
      vars:
        mutated_positives: "{{ (fixtures.positive | rejectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | list) + [fixtures.positive | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | first | combine(fixtures.execution.mutations.changed_fixture_body.patch, recursive=true)] }}"
      ansible.builtin.assert:
        that:
          - (mutated_positives | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | first)[model.format.optional_keys.expected][model.format.optional_keys.body] != (model.response_contracts.records | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, (fixtures.positive | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | first)[model.validation.selectors.response_contract_id_key]) | first)[model.format.optional_keys.body]
          - (mutated_positives | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | first)[model.format.optional_keys.expected][model.format.optional_keys.body] != (fixtures.positive | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ping_fixture_id) | first)[model.format.optional_keys.expected][model.format.optional_keys.body]
        fail_msg: "{{ model.validation.messages.fixture_status_body_mutation }}"

