---
- name: Validate Malcolm public API candidate
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  vars:
    declarations_path: "{{ playbook_dir }}/api.declarations.yaml"
    deep_path: "{{ playbook_dir }}/api.deep.yaml"
    fixtures_path: "{{ playbook_dir }}/api.fixtures.yaml"
    coverage_path: "{{ playbook_dir }}/api.coverage.yaml"
    macros_path: "{{ playbook_dir }}/api.macros.j2"
    render_path: "{{ playbook_dir }}/api.render.j2"
  tasks:
    - name: Load declarations YAML
      ansible.builtin.set_fact:
        loaded_declarations: "{{ lookup('file', declarations_path) | from_yaml }}"

    - name: Load deep YAML
      ansible.builtin.set_fact:
        loaded_deep: "{{ lookup('file', deep_path) | from_yaml }}"

    - name: Load fixtures YAML
      ansible.builtin.set_fact:
        loaded_fixtures: "{{ lookup('file', fixtures_path) | from_yaml }}"

    - name: Load coverage YAML
      ansible.builtin.set_fact:
        loaded_coverage: "{{ lookup('file', coverage_path) | from_yaml }}"

    - name: Bind declared render context
      ansible.builtin.set_fact:
        model: "{{ loaded_declarations.model }}"
        deep: "{{ loaded_deep.deep }}"
        fixtures: "{{ loaded_fixtures.fixtures }}"
        coverage: "{{ loaded_coverage.coverage }}"
        original_heading: "{{ loaded_declarations.model[loaded_fixtures.fixtures.execution.mutation_keys.format][loaded_fixtures.fixtures.execution.mutation_keys.document_heading] }}"
        original_identity_heading: "{{ loaded_declarations.model.format.section_headings[loaded_declarations.model.format.section_ids.identity] }}"
        original_gap_status: "{{ (loaded_declarations.model[loaded_declarations.model.validation.selectors.gaps_key] | selectattr(loaded_declarations.model.validation.selectors.id_key, loaded_declarations.model.format.lookup.equalto_test, loaded_declarations.model.validation.selectors.validation_unrun_gap_id) | first)[loaded_declarations.model.validation.selectors.status_key] }}"
        original_model: "{{ loaded_declarations.model }}"

    - name: YAML roots exist
      ansible.builtin.assert:
        that:
          - loaded_declarations.model is defined
          - loaded_deep.deep is defined
          - loaded_fixtures.fixtures is defined
          - loaded_coverage.coverage is defined
          - model.identity.worker_role is defined
          - model[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.macros_template] is defined
          - model.format.separators.kv_join is defined
          - model.format.tokens.empty is defined
          - model.format.optional_keys.owner is defined
          - model.format.lookup.source_attr is defined
          - model.format.citation_fields.ordered is defined
          - model.format.tokens.missing_citation_gap is defined
          - model.schema.operation_kinds is defined
          - model.format.optional_keys.kind is defined
          - fixtures.execution.operands.boolean_true is defined
          - fixtures.execution.operands.boolean_false is defined
          - fixtures.execution.mutation_keys.format is defined
          - fixtures.execution.mutation_keys.document_heading is defined
          - fixtures.execution.mutation_keys.macros_template is defined
          - fixtures.execution.mutations.changed_heading.patch is defined
          - fixtures.execution.mutations.missing_macro.patch is defined
          - fixtures.execution.mutations.required_inapplicable.patch is defined
          - fixtures.execution.mutations.missing_context.bind in model.schema.context_bindings.required
          - fixtures.execution.host_fact_bind is defined
          - fixtures.execution.mutation_keys.applied is defined
          - fixtures.execution.task_vars_do_not_override_set_fact
          - model.format.separators.line_join is defined
          - model.format.presentation.machine_yaml == fixtures.execution.operands.boolean_false
          - model.format.ack_delivery.proves_token_key is defined
          - fixtures.execution.runtime_http == model.validation.expected.runtime_not_executed
          - fixtures.identity.executed == fixtures.execution.operands.boolean_false
          - fixtures.execution.mutations.changed_gap_status.patch is defined
          - fixtures.execution.mutations.changed_identity_heading.patch is defined
          - fixtures.execution.mutation_reject_expect is defined
          - fixtures.execution.mutation_render_differs_expect is defined
          - model.format.identity_join.ref_value_key is defined
          - model.response_contracts.records is defined
          - fixtures.execution.mutations.changed_fixture_status.patch is defined
          - fixtures.execution.mutations.changed_fixture_body.patch is defined
          - fixtures.execution.mutations.broken_ref_join.patch is defined
          - fixtures.execution.mutations.broken_metadata_byte_join.patch is defined
          - model.sources[model.format.identity_join.metadata_bytes_table_key] is defined
          - model.format.labels.provenance is defined
          - model.format.labels.packet_path is defined
          - model.format.labels.repository is defined
          - model.format.labels.bytes is defined
          - model.format.tokens.v25_no_permission_errorhandler is defined
          - model.format.tokens.health_script_no_json is defined
          - model.format.tokens.missing_metadata_byte_join is defined
          - model.format.tokens.mutated_metadata_sha256 is defined
          - model.schema.presence_kinds is defined
          - model.schema.path_ids is defined
          - model.format.section_ids.response_contracts is defined
          - model.format.tokens.explicit_literal_status_kind is defined
          - model.format.tokens.unconditional_presence is defined
          - model.format.tokens.try_body_presence is defined
          - model.format.tokens.try_complete_path is defined
          - model.format.tokens.swallowed_path is defined
          - model.format.tokens.missing_return_source_id is defined
          - model.response_contracts.required_owned_operation_ids is defined
          - model.response_contracts.required_return_ids is defined
          - model.response_contracts.control_source_id is defined
          - fixtures.execution.mutations.broken_unconditional_sources.patch is defined
          - fixtures.execution.mutations.missing_return_contract.remove == fixtures.execution.operands.boolean_true
          - fixtures.execution.mutations.broken_return_source_ref.patch is defined
          - fixtures.execution.mutations.broken_dynamic_key_as_literal.patch is defined
          - fixtures.execution.mutations.broken_swallowed_success_collapse.patch is defined
          - fixtures.execution.mutations.broken_authorized_status_200.patch is defined
          - fixtures.execution.mutations.broken_caught_phases_as_absent.patch is defined
          - fixtures.execution.mutations.broken_partial_as_complete.patch is defined
          - fixtures.execution.mutations.broken_synthetic_as_runtime.patch is defined
          - fixtures.execution.mutations.broken_redis_helper_empty_as_absent.patch is defined
          - model.response_contracts.ast_membership is defined
          - model.response_contracts.synthetic_reproduction is defined
          - model.format.tokens.caught_before_path is defined
          - model.format.tokens.caught_after_empty_path is defined
          - model.format.tokens.caught_partial_path is defined
          - model.format.tokens.sources_populated_empty is defined
          - model.format.optional_keys.sources_present is defined
          - model.schema.sources_populated_kinds is defined
          - model.response_contracts.ingest_caught_phase_ids_v25 is defined
          - model.format.tokens.caught_before_site_path is defined
          - model.validation.expected.unsupported_http_default_count == model.validation.expected.missing_source_refs_allowed
          - model.validation.expected.response_contract_count == (model.response_contracts.required_return_ids | length)
          - model.response_contracts.ast_membership.expected_recursive_AST_Return_nodes == model.validation.expected.recursive_ast_return_nodes
          - (model.response_contracts[model.validation.selectors.non_http_ast_returns_key] | length) == model.validation.expected.non_http_return_count
          - model.format.lookup[model.validation.selectors.empty_list_key] is defined
          - model.format.lookup[model.validation.selectors.dict2items_filter_key] is defined
          - model.format.lookup[model.validation.selectors.flatten_filter_key] is defined
          - fixtures.execution.operands.empty_list == model.format.lookup[model.validation.selectors.empty_list_key]
          - (model.format.lookup[model.validation.selectors.empty_list_key] | length) == model.validation.expected.missing_source_refs_allowed
          - model.format.optional_keys.dynamic_keys is defined
          - model.schema[model.validation.selectors.dynamic_key_attr_roles_key] is defined
          - model.schema[model.validation.selectors.contract_optional_collections_key] is defined
          - model.validation.selectors.default_decorator_literal_key in model.schema[model.validation.selectors.dynamic_key_attr_roles_key]
          - model.validation.selectors.from_key in model.schema[model.validation.selectors.dynamic_key_attr_roles_key]
          - model.validation.selectors.body_keys_key in model.schema[model.validation.selectors.contract_optional_collections_key]
          - model.validation.selectors.dynamic_keys_key in model.schema[model.validation.selectors.contract_optional_collections_key]
          - model.format.lookup[model.validation.selectors.dict2items_filter_key] in model.format.jinja_filters_allowed
          - model.format.lookup[model.validation.selectors.flatten_filter_key] in model.format.jinja_filters_allowed
        fail_msg: "{{ model.validation.messages.missing_yaml_roots }}"

    - name: Declared fixture mutation keys and operands match tokens
      ansible.builtin.assert:
        that:
          - fixtures.execution.operands.boolean_true == model.validation.expected.boolean_true
          - fixtures.execution.operands.boolean_false == model.validation.expected.boolean_false
          - fixtures.execution.operands.boolean_false == model.validation.expected.owned_by_api_false
          - fixtures.execution.mutations.changed_heading.root_key == fixtures.execution.mutation_keys.format
          - fixtures.execution.mutations.changed_heading.field_key == fixtures.execution.mutation_keys.document_heading
          - fixtures.execution.mutations.missing_macro.root_key == fixtures.execution.mutation_keys.format
          - fixtures.execution.mutations.missing_macro.field_key == fixtures.execution.mutation_keys.macros_template
          - fixtures.execution.mutations.changed_heading.patch[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.document_heading] == model.format.tokens[fixtures.execution.mutations.changed_heading.value_token]
          - fixtures.execution.mutations.missing_macro.patch[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.macros_template] == model.format.tokens[fixtures.execution.mutations.missing_macro.value_token]
          - fixtures.execution.mutations.missing_context.value == fixtures.execution.operands.null_value
          - fixtures.execution.mutation_keys.format not in fixtures.execution.mutations.missing_context[fixtures.execution.mutation_keys.applied]
          - fixtures.execution.mutations.required_inapplicable.patch[model.validation.selectors.applicable_key] == fixtures.execution.operands.boolean_false
          - fixtures.execution.mutations.missing_citation.remove_key == model.format.optional_keys.source_refs
          - fixtures.execution.mutations.changed_identity_heading.root_key == fixtures.execution.mutation_keys.format
          - fixtures.execution.mutations.changed_identity_heading.field_key == fixtures.execution.mutation_keys.section_headings
          - fixtures.execution.mutations.changed_identity_heading.nested_key == fixtures.execution.mutation_keys.identity
          - fixtures.execution.mutations.changed_identity_heading.patch[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.section_headings][fixtures.execution.mutation_keys.identity] == model.format.tokens[fixtures.execution.mutations.changed_identity_heading.value_token]
          - fixtures.execution.mutations.changed_gap_status.field_key == fixtures.execution.mutation_keys.status
          - fixtures.execution.mutations.changed_gap_status.patch[fixtures.execution.mutation_keys.status] == model.format.tokens[fixtures.execution.mutations.changed_gap_status.value_token]
          - model.validation.selectors[fixtures.execution.mutations.changed_gap_status.target_selector] == model.validation.selectors.validation_unrun_gap_id
          - fixtures.execution.mutations.missing_citation.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.removed_route.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.required_inapplicable.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.missing_macro.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.missing_context.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.changed_heading.expect == fixtures.execution.mutation_render_differs_expect
          - fixtures.execution.mutations.changed_gap_status.expect == fixtures.execution.mutation_render_differs_expect
          - fixtures.execution.mutations.changed_identity_heading.expect == fixtures.execution.mutation_render_differs_expect
          - fixtures.execution.mutations.changed_identity_heading.nested_key == model.format.section_ids.identity
          - fixtures.execution.coverage_operation_id == model.validation.selectors.coverage_operation_id
          - fixtures.execution.mutations.changed_fixture_status.patch[model.format.optional_keys.expected][model.validation.selectors.status_key] == model.format.tokens[fixtures.execution.mutations.changed_fixture_status.value_token]
          - model.format.tokens[fixtures.execution.mutations.changed_fixture_body.value_token] in (fixtures.execution.mutations.changed_fixture_body.patch[model.format.optional_keys.expected][model.validation.selectors.body_key] | dict2items | map(attribute=model.format.lookup.dict_value_attr) | list)
          - model.format.tokens[fixtures.execution.mutations.broken_ref_join.value_token] in fixtures.execution.mutations.broken_ref_join.patch[model.format.identity_join.refs_key]
          - fixtures.execution.mutations.changed_fixture_status.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.changed_fixture_body.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.broken_ref_join.expect == fixtures.execution.mutation_reject_expect
          - fixtures.execution.mutations.broken_metadata_byte_join.patch[model.format.identity_join.sha256_key] == model.format.tokens[fixtures.execution.mutations.broken_metadata_byte_join.value_token]
          - fixtures.execution.mutations.broken_metadata_byte_join.expect == fixtures.execution.mutation_reject_expect
        fail_msg: "{{ model.validation.messages.fixture_mutation_keys }}"

    - name: Operations entities helpers datasets have source citations
      ansible.builtin.assert:
        that:
          - (model.operations | rejectattr(model.format.optional_keys.source_refs, model.format.lookup.defined_test) | list | length) == model.validation.expected.missing_source_refs_allowed
          - (model.entities | rejectattr(model.format.optional_keys.source_refs, model.format.lookup.defined_test) | list | length) == model.validation.expected.missing_source_refs_allowed
          - (model.helpers | rejectattr(model.format.optional_keys.source_refs, model.format.lookup.defined_test) | list | length) == model.validation.expected.missing_source_refs_allowed
          - (model.datasets | rejectattr(model.format.optional_keys.source_refs, model.format.lookup.defined_test) | list | length) == model.validation.expected.missing_source_refs_allowed
          - (model.relations | rejectattr(model.format.optional_keys.source_refs, model.format.lookup.defined_test) | list | length) == model.validation.expected.missing_source_refs_allowed
        fail_msg: "{{ model.validation.messages.missing_source_refs }}"

    - name: Flask decorator counts match declared values
      ansible.builtin.assert:
        that:
          - (model.flask_routes_complete | length) == model.validation.expected.flask_route_decorator_count_v26
          - (model.flask_route_decorators_v25 | length) == model.validation.expected.flask_route_decorator_count_v25
          - (model.flask_routes_complete | length) == model.counts.flask_route_decorators_v26
          - model.counts.flask_view_functions_v26 == model.validation.expected.flask_view_function_count_v26
          - model.counts.flask_view_functions_v25 == model.validation.expected.flask_view_function_count_v25
          - model.counts.flask_route_decorators_v26 == model.counts.route_graph_decorators_v26_08_0
          - model.counts.flask_view_functions_v26 == model.counts.route_graph_handlers_v26_08_0
          - model.counts.flask_route_decorators_v25 == model.counts.route_graph_decorators_v25_11_0
          - model.counts.flask_view_functions_v25 == model.counts.route_graph_handlers_v25_11_0
        fail_msg: "{{ model.validation.messages.flask_count_drift }}"

    - name: Latest own-source exactjoin predicates remain distinct
      ansible.builtin.assert:
        that:
          - model.counts.function_cpg_exactjoin_v26_08_0 == model.validation.expected.function_cpg_exactjoin_v26_08_0
          - model.counts.function_cpg_exactjoin_v26_07_1 == model.validation.expected.function_cpg_exactjoin_v26_07_1
          - model.counts.function_cpg_exactjoin_v25_11_0 == model.validation.expected.function_cpg_exactjoin_v25_11_0
          - model.cpg_observations.function_cpg_exactjoin.not_flow_precision
          - model.cpg_observations.route_graph.not_dispatch_soundness
          - model.cpg_observations.event_argument_to_index.observed
          - model.cpg_observations.event_argument_to_index.flow_soundness == model.validation.expected.flow_soundness_not_claimed
          - model.cpg_observations.event_argument_to_index.runtime == model.validation.expected.runtime_not_executed
          - model.cpg_observations.overlay_graphs_default_is_not_original_sampled_graph
          - (model.cpg_observations.attempts_remain_distinct | map(attribute=model.validation.selectors.id_key) | list | unique | length) == (model.cpg_observations.attempts_remain_distinct | length)
        fail_msg: "{{ model.validation.messages.exactjoin_drift }}"

    - name: Each current Flask decorator path is on its operation
      ansible.builtin.assert:
        that:
          - item[model.validation.selectors.route_path_key] in ((model.operations | selectattr(model.validation.selectors.function_key, model.format.lookup.equalto_test, item[model.validation.selectors.function_key]) | first).routes | map(attribute=model.validation.selectors.route_template_key) | list)
        fail_msg: "{{ model.validation.messages.flask_decorator_missing }}"
      loop: "{{ model.flask_routes_complete }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Required coverage rows stay applicable
      ansible.builtin.assert:
        that:
          - (coverage.rows | selectattr(model.validation.selectors.required_key, model.format.lookup.equalto_test, fixtures.execution.operands.boolean_true) | selectattr(model.validation.selectors.applicable_key, model.format.lookup.equalto_test, fixtures.execution.operands.boolean_false) | list | length) == model.validation.expected.required_inapplicable_count
        fail_msg: "{{ model.validation.messages.required_inapplicable }}"

    - name: Coverage executed flags are boolean
      ansible.builtin.assert:
        that:
          - item[model.validation.selectors.required_key] | type_debug == model.validation.expected.executed_type
          - item[model.validation.selectors.applicable_key] | type_debug == model.validation.expected.executed_type
          - item[model.validation.selectors.executed_key] | type_debug == model.validation.expected.executed_type
          - item[model.validation.selectors.status_key] is defined
          - item[model.validation.selectors.evidence_key] is defined
        fail_msg: "{{ model.validation.messages.coverage_row_incomplete }}"
      loop: "{{ coverage.rows }}"
      loop_control:
        label: "{{ item[model.validation.selectors.id_key] }}"

    - name: Ontology and runtime remain applicable blocked absences
      ansible.builtin.assert:
        that:
          - (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ontology_coverage_id) | first)[model.validation.selectors.applicable_key]
          - not (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ontology_coverage_id) | first)[model.validation.selectors.executed_key]
          - (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.ontology_coverage_id) | first)[model.validation.selectors.status_key] == model.validation.expected.blocked_status
          - (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.runtime_coverage_id) | first)[model.validation.selectors.applicable_key]
          - not (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.runtime_coverage_id) | first)[model.validation.selectors.executed_key]
          - (coverage.rows | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.runtime_coverage_id) | first)[model.validation.selectors.status_key] == model.validation.expected.blocked_status
        fail_msg: "{{ model.validation.messages.ontology_runtime_wrong }}"

    - name: Macros and import strategy are present
      ansible.builtin.assert:
        that:
          - model.format.macro_signatures.emit in lookup('file', macros_path)
          - model.format.macro_signatures.kv in lookup('file', macros_path)
          - model.format.macro_signatures.cite in lookup('file', macros_path)
          - model.format.macro_signatures.render_source_file in lookup('file', macros_path)
          - model.format.render_strategy.import_expression in lookup('file', render_path)
          - model.format.render_strategy.include_forbidden not in lookup('file', render_path)
        fail_msg: "{{ model.validation.messages.macros_or_import }}"

    - name: Render baseline under declared context
      ansible.builtin.set_fact:
        rendered_baseline: "{{ lookup('template', render_path) }}"

    - name: Bind baseline presentation lines
      ansible.builtin.set_fact:
        rendered_baseline_lines: "{{ rendered_baseline.split(model.format.separators.line_join) }}"
        gap_id_line: "{{ model.format.labels.id }}{{ model.format.separators.kv_join }}{{ (model[model.validation.selectors.gaps_key] | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.validation_unrun_gap_id) | first)[model.validation.selectors.id_key] }}"
        gap_status_line: "{{ model.format.labels.status }}{{ model.format.separators.kv_join }}{{ (model[model.validation.selectors.gaps_key] | selectattr(model.validation.selectors.id_key, model.format.lookup.equalto_test, model.validation.selectors.validation_unrun_gap_id) | first)[model.validation.selectors.status_key] }}"
        ack_artifact_line: "{{ model.format.labels.acknowledge }}{{ model.format.separators.kv_join }}{{ deep.acknowledge_versus_delivery.acknowledgement[model.format.ack_delivery.artifact_key] }}"
        ack_delivery_line: "{{ model.format.labels.delivery }}{{ model.format.separators.kv_join }}{{ deep.acknowledge_versus_delivery.delivery_to_retrieved_content[model.format.ack_delivery.followup_key] }}"
        ack_retrieved_line: "{{ model.format.labels.retrieved_content }}{{ model.format.separators.kv_join }}{{ model.format.tokens[deep.acknowledge_versus_delivery.acknowledgement[model.format.ack_delivery.proves_token_key]] }}"

    - name: Rendered output contains declared heading
      ansible.builtin.assert:
        that:
          - model[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.document_heading] in rendered_baseline
        fail_msg: "{{ model.validation.messages.render_heading }}"

    - name: Identity section heading is rendered once
      ansible.builtin.assert:
        that:
          - (rendered_baseline_lines | select(model.format.lookup.equalto_test, model.format.section_headings[model.format.section_ids.identity]) | list | length) == model.validation.expected.identity_heading_occurrences
        fail_msg: "{{ model.validation.messages.identity_heading_duplicate }}"

    - name: Presentation render is not declared machine YAML
      ansible.builtin.assert:
        that:
          - model.format.presentation.machine_yaml == fixtures.execution.operands.boolean_false
          - model.format.presentation.kind is defined
        fail_msg: "{{ model.validation.messages.render_is_not_machine_yaml }}"

    - name: Gap id and status remain separate rendered lines
      ansible.builtin.assert:
        that:
          - gap_id_line in rendered_baseline_lines
          - gap_status_line in rendered_baseline_lines
          - (gap_id_line ~ gap_status_line) not in rendered_baseline
        fail_msg: "{{ model.validation.messages.gap_status_glued }}"

    - name: Ack delivery and retrieved-content proof remain distinct rendered atoms
      ansible.builtin.assert:
        that:
          - ack_artifact_line in rendered_baseline_lines
          - ack_delivery_line in rendered_baseline_lines
          - ack_retrieved_line in rendered_baseline_lines
          - ack_delivery_line != ack_retrieved_line
          - model.format.tokens[deep.acknowledge_versus_delivery.acknowledgement[model.format.ack_delivery.proves_token_key]] == model.format.tokens.false_literal
          - model.format.tokens[deep.acknowledge_versus_delivery.acknowledgement[model.format.ack_delivery.proves_token_key]] != model.validation.selectors.document_followup_id
          - deep.acknowledge_versus_delivery.delivery_to_retrieved_content[model.format.ack_delivery.followup_key] == model.validation.selectors.document_followup_id
        fail_msg: "{{ model.validation.messages.ack_delivery_collapsed }}"

    - name: Alter declared document heading
      ansible.builtin.set_fact:
        model: "{{ model | combine(fixtures.execution.mutations.changed_heading.patch, recursive=true) }}"

    - name: Render altered model
      ansible.builtin.set_fact:
        rendered_altered: "{{ lookup('template', render_path) }}"

    - name: Altered model values change rendered output
      ansible.builtin.assert:
        that:
          - rendered_baseline != rendered_altered
          - original_heading in rendered_baseline
          - fixtures.execution.mutations.changed_heading.patch[fixtures.execution.mutation_keys.format][fixtures.execution.mutation_keys.document_heading] in rendered_altered
