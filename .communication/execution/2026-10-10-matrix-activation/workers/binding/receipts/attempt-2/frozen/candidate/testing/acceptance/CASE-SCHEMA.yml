# testing/acceptance/CASE-SCHEMA.yml
#
# PINNED schema every cases/*.yml file in this tier conforms to. run_acceptance.yml
# reads this to validate case shape BEFORE running, so an off-schema case FAILS the
# run rather than silently no-op'ing. A case is a mapping in a file's top-level
# `cases:` list.
#
# Successor of selected baseline CASE-SCHEMA.yml
# (selected sha256 e917a160781966eab2108410dd9ddb4d772a26707718418c91eb112aee5fd628) extended with G s08
# (supplier sha256 0f6f81d34f0c854f14bad0526e5c53d862ff73440f339100322c8744a3017c22). Unadopted.
# Author-packet paths are provenance only and are never runtime loader inputs. No tests run.
#
# Compatibility: the selected 20-case real-caller files (00_resolve_caller.yml, 01_loader_projection.yml,
# 02_backup_custody_declared.yml) remain valid: new matrix fields are optional; new kinds are unused by
# those files. Projection/consumer workers must not require the new fields on real-caller kinds.
#
# Result fields required / applicable / executed / status / evidence / semantic_expectation are distinct.
# predicted remains the SOURCE guess; runtime verdict is authoritative. Expected-negative (expect.reject
# or predicted RED with a matching reject_cause) is independent of execution status. Required missing,
# stale, skipped, or unexecuted is failure, never optional/NA.
#
# Execution context is controller.bootstrap.work_roots.run_local.execution_context as
# lme_execution_context. Native lme_invocation_context is not a substitute.

schema_version: 1
owner: G
status: successor_proposal
packet_references_are_provenance_only: true
runtime_loader_inputs: []
base_selected:
  provenance: selected testing/acceptance/CASE-SCHEMA.yml
  selected_sha256: e917a160781966eab2108410dd9ddb4d772a26707718418c91eb112aee5fd628
base_g:
  provenance: G s08 testing/acceptance/CASE-SCHEMA.yml
  supplier_sha256: 0f6f81d34f0c854f14bad0526e5c53d862ff73440f339100322c8744a3017c22
  g_step: s08
  adopted: false

execution_context:
  declaration: controller.bootstrap.work_roots.run_local.execution_context
  var: lme_execution_context
  fields: [run, attempt, cell, occurrence, locator]
  occurrence_fields: [path, sha256]
  allocation_modes: [fresh, resume]
  native_invocation_context_is_not_a_substitute: true
  missing_capability: frozen_compatible_C1_execution_context_producer_schema_and_route_typed_transport

kinds:
  # --- REAL-CALLER cases (a probe is rendered + the real caller is invoked) -------
  resolve_admission: >-
    Drives the REAL ansible/roles/podman/tasks/resolve.yml (caller: resolve) from
    the HEAD snapshot. Proves admission / precedence / effective-input / conflict
    behavior of the shared early-resolve entrypoint under TRUE extra-var pins.
    Preserved selected baseline real-caller kind.
  loader_projection: >-
    Drives the REAL load_manifests.yml (caller: load_manifests) end-to-end, which
    self-composes lme_services from the manifest tree and derives the
    required_material / datastore / membership projections. Proves the projection
    readback is a faithful derivation, not equality between two uses of an
    overridable intermediate. Preserved selected baseline real-caller kind.
  # --- DECLARED / BLOCKED cases (no probe; a dependency has not landed) -----------
  backup_negative: >-
    F2 backup/restore discriminating case. DECLARED-NOW / BLOCKED until the named D
    repair + declarative-macro representation land. Never run against D's staged
    working-tree bytes and attributed to HEAD.
  custody_negative: >-
    Custody discriminating case, for either of two declared custodies. (1) F3
    custody-transition: DECLARED-NOW / BLOCKED until the JOINT C/D transition
    contract (guardian_cd_binding, currently UNWIRED_PROPOSED_AWAITING_C_ACK)
    lands. (2) S28 consumer custody lease (C1 supervisor / custody root / consumer
    leaves, lme_consume_open / close / settle, the owned ssh close and the fence;
    G controls J-S28-G-06..09, cases/07_custody_lease.yml): DECLARED-NOW / BLOCKED
    until the composed seed and a declared, generated custody runner exist on the
    declared runtime and the runtime precondition case (actual user-manager
    delegation, freeze and containment) has run; no other custody case of that set
    earns credit while it is unrun. Each case names which custody it discriminates
    (discriminates / queued_on). Source-only reasoning is NOT a passing runtime
    result, so these stay BLOCKED, not GREEN.
  binding_negative: >-
    Acceptance-binding / expected-model projection discriminating case (G). DECLARED-NOW
    / BLOCKED until the named binding successors land and a declared, generated runner
    can drive testing/acceptance/cell_binding.yml or testing/e2e/matrix/project_expected.yml
    with the hostile input (no ad hoc execution). Each case names the refusal it expects
    and the invariant task that must raise it before any activation or pass credit.
    Source-only reasoning is NOT a passing runtime result, so these stay BLOCKED, not GREEN.
    It also covers the C1 profile-set composition and framework credit controls G binds
    (cases/08_profile_set_composition.yml, C-FW2-01..13): DECLARED-NOW / BLOCKED until C1's
    composed loader (profile_sets typed, lme_profile_set_members, lme_compose_profile_overlay,
    the member revision identities, the registry evaluator and credit block) lands and a
    declared, generated runner drives the real loader with a set selection. Unadopted C1 lme_manifests.py does not publish composition_record;
    that join stays named-missing, not privately defaulted. Each case names
    the composition, refusal or credit outcome C1's control states; a loader composition
    case never runs the real caller before that loader exists.
  gate_negative: >-
    Generated deployment gate discriminating case (G, route-owned gate). DECLARED-NOW /
    BLOCKED until route's frozen gate declaration and template are rendered and a declared,
    generated runner can invoke the gate with the hostile environment or arguments (no ad hoc
    execution). Each case names the refusal or parity it expects before any stage runs or any
    pass credit; coverage of a declared set (such as the retired environment names) is derived
    from that declaration, not from a fixed count. Historical dir_rel / GEN_ID / LABEL pairing
    is superseded by 809. Gate binding uses lme_execution_context, not native
    lme_invocation_context. Source-only reasoning is NOT a passing runtime result,
    so these stay BLOCKED, not GREEN.
  finite_scenario: >-
    One of the 161 conserved finite scenario IDs whose expectation, depends_on,
    criteria and semantic_expectation live on matrix.decl.yml finite_scenarios.records.
    DECLARED-NOW / BLOCKED until the named domain runner-or-missing-binding is
    satisfied. Once that named runner is supplied it must actually dispatch; it
    must not remain kind-only dispatch. Does not shrink coverage by runtime
    discovery. Unused by the selected 20-case real-caller files.
  lifecycle_phase: >-
    One of the seven first-cell lifecycle phases MX-CELL-GRAPH-A0_A1 through
    MX-CELL-GRAPH-P6_TEARDOWN_REDEPLOY. DECLARED-NOW / BLOCKED until the named
    phase runner binding is satisfied. Once that named runner is supplied it must
    actually dispatch. Whole-campaign completion is not a blanket first-observer
    gate. Unused by the selected 20-case real-caller files.

kind_groups:
  real_caller: [resolve_admission, loader_projection]
  declared_blocked: [backup_negative, custody_negative, binding_negative, gate_negative, finite_scenario, lifecycle_phase]

case_fields:
  name:        {required: true,  type: str,  note: "unique across ALL cases/*.yml; verdict key + per-case dir name"}
  kind:        {required: true,  enum: [resolve_admission, loader_projection, backup_negative, custody_negative, binding_negative, gate_negative, finite_scenario, lifecycle_phase]}
  discriminates: {required: true, type: str, note: "the codex/domain finding id this case discriminates"}
  predicted:   {required: true,  enum: [GREEN, RED, BLOCKED], note: "the SOURCE-derived prediction; the RUN's verdict is authoritative, and a mismatch is reported honestly. Not the semantic expectation and not the execution status."}
  # real-caller fields (resolve_admission / loader_projection):
  caller:      {required: false, enum: [resolve, load_manifests], note: "which real snapshot task file the probe includes; required for real-caller kinds"}
  profile:     {required: false, type: str,  note: "lme_profile passed to the caller (default 'default')"}
  base_inputs: {required: false, type: map,  note: "lme_inputs play var {selections?, observations?, origins?} -- caller-normalized inputs at PLAY-VAR precedence (below -e)"}
  pins:        {required: false, type: map,  note: "the case's hostile/valid extra-vars; materialized to pins.yml and injected with `-e @pins.yml` at TRUE extra-var precedence. Empty/omitted => a control run with no pin."}
  assert:
    required: false
    type: map
    note: >-
      {that: [<jinja expr str>...], success_msg, fail_msg}. Rendered as the single
      `judge :: <name>` assert task after the real-caller include. For a
      reject-expected case set `that: [true]` (a documenting judge that only runs
      when the engine did NOT reject).
  expect:
    required: false
    type: map
    note: >-
      {reject: bool, reject_cause: <regex str>, fail_closed_cause: <regex str>}.
      reject:true -> the case is GREEN (REJECTED-as-expected) ONLY if the real
      caller exits nonzero AND a failed task's msg matches reject_cause (regex
      `search`); rc==0 (engine did not reject) is RED; nonzero-but-wrong-cause is
      ERROR-WRONG-CAUSE. reject_cause is MANDATORY when reject:true (a rejection
      granted on ANY failure is forbidden). fail_closed_cause (on an ACCEPT case)
      future-proofs a RED against a fail-closed C1 fix: if the include rejects the
      pin before the judge and a failed msg matches fail_closed_cause, the case is
      GREEN (REJECTED-as-expected) instead of ERROR-VACUOUS. The RED verdict is
      still the current state (the judge runs and fails). This expected-negative
      semantic outcome is independent of the execution field.
  fail_closed_cause_alias: "declared under expect (see above)"
  revision_equals:      {required: false, type: str, note: "name of another case whose emitted resolved revision must EQUAL this case's (cross-run; checked post-loop; a mismatch is a recorded revision-check RED, not a harness error)"}
  revision_differs_from: {required: false, type: str, note: "name of another case whose emitted resolved revision must DIFFER from this case's (cross-run; a false match is a revision-check RED)"}
  control:     {required: false, type: str,  note: "name of the GREEN control case that differs ONLY by the pin; a RED whose control is not PASS is downgraded to ERROR-CONTROL by the runner (a RED must be earned), which the ERROR gate then fails on -- so the declaration and the runner agree"}
  invariant_task: {required: true, type: str, note: "the specific judge/assertion identity this verdict is keyed to (documentation; the JSON classifier keys accept cases on the rendered `judge :: <name>` task)"}
  # DECLARED/BLOCKED fields (backup_negative / custody_negative / binding_negative / gate_negative / finite_scenario / lifecycle_phase):
  queued_on:   {required: false, type: list, note: "the deliverable(s) this case waits on; REQUIRED for every declared/blocked kind"}
  blocked_reason: {required: false, type: str, note: "the exact gate that is not yet satisfied; REQUIRED for every declared/blocked kind"}
  # Matrix result fields: OPTIONAL on selected real-caller cases; REQUIRED on finite_scenario and lifecycle_phase.
  required: {required: false, enum: [true, false], note: "obligation class. Unknown coverage does not become optional. Required on finite_scenario and lifecycle_phase."}
  applicable: {required: false, enum: [applicable, not_applicable, unknown, unresolved, conflicting], note: "applicability. not_applicable requires a declaration-derived reason. Distinct from executed and from semantic_expectation."}
  executed: {required: false, enum: [true, false], note: "whether the bound runner actually ran. Distinct from status and from semantic_expectation. Required missing/skipped/unexecuted is failure."}
  status: {required: false, type: str, note: "execution/admission status word (blocked, failed, satisfied, not_qualified, ...). Never collapsed into semantic_expectation."}
  evidence: {required: false, type: map, note: "evidence identity: source_proposal, current_execution, provider_execution, artifact digest/path. Absence of evidence for a required applicable case is failure."}
  semantic_expectation: {required: false, type: str, note: "expected semantic outcome (allow, refuse, observe, qualify, expected_negative). Independent of executed/status. A passed expected-negative does not admit a deployment."}
  runner_binding: {required: false, type: str, note: "existing runner name or named missing owner capability (BIND-* / J-*). Required on finite_scenario and lifecycle_phase. Do not invent a private default runner. A declared missing runner stays BLOCKED until supplied; once supplied the case must dispatch that runner, never remain kind-only."}
  applicability_reason: {required: false, type: str, note: "declaration-derived reason when applicable is not_applicable; required in that case. Missing required implementation is blocked, not NA."}
  execution_context: {required: false, type: map, note: "optional on selected real-caller kinds. When present: lme_execution_context with fields run, attempt, cell, occurrence, locator. Native lme_invocation_context is not this field."}

load_time_gates:
  - "a case is missing name/kind/discriminates/predicted/invariant_task, or kind is unknown"
  - "case names are not unique across all files"
  - "expect.reject is true but expect.reject_cause is absent (a rejection on ANY failure is forbidden)"
  - "a declared/blocked case (any kind in ACCEPTANCE-BINDING one_case.kinds.declared) is missing queued_on or blocked_reason"
  - "a real-caller case (resolve_admission/loader_projection) is missing caller"
  - "a finite_scenario or lifecycle_phase case is missing required, applicable, executed, status, evidence, semantic_expectation, or runner_binding"
  - "applicable is not_applicable but applicability_reason is absent"
  - "required true with applicable applicable (or unresolved/unknown/conflicting) and executed false or missing/stale/skipped evidence is a load-visible obligation, never silently optional"
  - "a finite_scenario or lifecycle_phase whose named runner_binding implementation is present must not remain kind-only dispatch"

result_field_laws:
  distinct:
    - required
    - applicable
    - executed
    - status
    - evidence
    - semantic_expectation
  failure_when_required:
    - missing
    - stale
    - skipped
    - unexecuted
  expected_negative_distinct: true
  runtime_discovery_cannot_shrink_required: true
  unknown_is_not_optional: true
  campaign_completion_is_not_first_observer_gate: true

authoring_rules:
  - "cases/NN_*.yml files are DISJOINT (one writer per file). NN orders execution."
  - "No secret VALUES in any case, pins.yml, probe render, log or receipt; synthetic fixtures only."
  - "Do NOT weaken a judge to make a run green; a RED is REPORTED, not suppressed."
  - "predicted is the source guess; the committed receipt records the RUNTIME verdict and flags any predicted!=actual."
  - "Do not add a second engine, giant YAML program scalar, or ad-hoc Python case runner."
  - "Selected baseline real-caller cases remain valid without the optional matrix result fields."
  - "Active N13 drafts are excluded; unadopted source suppliers are not compatibility."
  - "Do not bind native lme_invocation_context as acceptance execution-context; use lme_execution_context."
  - "A declared missing runner is BLOCKED until supplied; once supplied it must actually dispatch."
