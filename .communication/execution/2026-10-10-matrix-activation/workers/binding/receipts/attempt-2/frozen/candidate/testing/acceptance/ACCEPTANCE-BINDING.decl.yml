    parse_failed: PARSE-FAILED
  outcome:
    unproduced: unproduced
    missing: missing
    identity_binding: identity_binding
    malformed_row: malformed_row
    original_failed: original_failed
    qualified: qualified
  outcome_diagnostic:
    missing: gate_result_artifact
    identity_binding: gate_result_binding
    malformed_row: gate_result_line
    original_failed: gate_result_original
