      statuses: &gs_statuses statuses
      raw_fields: &gs_raw_fields raw_fields
      fields: &gs_fields fields
      logs: &gs_logs logs
      descriptor: &gs_descriptor descriptor
    statuses_path: [*gs_root, *gs_results, *gs_statuses]
    raw_fields_path: [*gs_root, *gs_results, *gs_raw_fields]
    fields_path: [*gs_root, *gs_results, *gs_fields]
    logs_path: [*gs_root, *gs_logs]
    descriptor_path: [*gs_root, *gs_results, *gs_descriptor]
