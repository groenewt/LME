---
# testing/acceptance/ACCEPTANCE-BINDING.decl.yml -- G successor (PROPOSAL, unrun)
#
# Extends G s12 testing/acceptance/ACCEPTANCE-BINDING.decl.yml
# (sha256 3b6d4b9f94a29c295b8685dc232c5cf0fc861c39d03ca9afea338aec3f98cead). Unadopted.
# Producer (project_expected.yml) and consumer (cell_binding.yml / run_acceptance.yml /
# one_case_acceptance.yml) share this file as _acc_decl. Every value a G expression uses
# comes from here. Author-packet paths are provenance only and are never runtime loader
# inputs. No second engine. No tests, review, or deployment from this authoring.
#
# Successor repairs:
#   809 / FW18 / 812: G18 descriptor location and interim GEN_ID/LABEL pairing are
#     superseded. G declares no dir_rel location value and no GEN_ID/LABEL pairing.
#     Accepted declaration is controller.bootstrap.work_roots.run_local.execution_context
#     with canonical variable lme_execution_context. FW18 withdraws FW09-RH-03 and
#     FW09-GL-01 envelope expansion. Native lme_invocation_context is controller
#     invocation context, not acceptance execution-context, and cannot substitute.
#   No frozen compatible C1 producer/schema or route typed transport exists in
#     inspected lineage. Required matrix absence blocks that cell, not a standalone
#     diagnostic gate or universal bootstrap. G does not author those schemas/files.
#   resolved_run exact field set and genesis.launch.envelope are unchanged.
#   Result fields required/applicable/executed/status/evidence/semantic_expectation stay
#     distinct. Required missing/stale/skipped/unexecuted is failure. Expected-negative
#     stays distinct from execution status.
#   Selected baseline real-caller runner is preserved.

schema_version: 1
owner: G
status: successor_proposal
packet_references_are_provenance_only: true
runtime_loader_inputs: []
base_g:
  provenance: G s12 testing/acceptance/ACCEPTANCE-BINDING.decl.yml
  supplier_sha256: 3b6d4b9f94a29c295b8685dc232c5cf0fc861c39d03ca9afea338aec3f98cead
  g_step: s12
  adopted: false
n13_drafts: excluded
source_suppliers: unadopted

owner_rel: OWNER.yml
cell_binding_rel: cell_binding.yml
case_schema_rel: CASE-SCHEMA.yml
case_file_key: cases
admission:
