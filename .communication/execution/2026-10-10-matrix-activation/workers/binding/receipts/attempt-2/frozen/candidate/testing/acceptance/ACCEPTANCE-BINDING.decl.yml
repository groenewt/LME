    obligation_state: optional
    applicability_state: applicable
    execution_state: not_executed
    acceptance_state: not_qualified
    credit: false
    never_equal_to: [pass, not_applicable]

gate_result:
  logs_keys:
    dir_env: dir_env
    results_var: results_var
    prefix_from: prefix_from
    results: results
  descriptor:
    state: blocked_pending_c1_producer_schema_and_route_transport
    historical_dir_rel_gen_id_label: superseded_by_809
    g_declares_no_dir_rel_value: true
    g_declares_no_gen_id: true
    g_declares_no_label_pairing: true
    joins: [J-C1-EXECUTION-CONTEXT-PRODUCER-SCHEMA, J-ROUTE-EXECUTION-CONTEXT-TRANSPORT, J-G18-DESCRIPTOR-ROUTE, J-G18-DESCRIPTOR-C1, J-CURRENT-EXECUTION-CONTEXT-RESULT, J-ROUTE-RUN-ATTEMPT-ABSENT]
    accepted_source: lme_execution_context
    accepted_declaration: controller.bootstrap.work_roots.run_local.execution_context
    accepted_fields: [run, attempt, cell, occurrence, locator]
    native_invocation_context_cannot_substitute: true
    needed_c1_capability: 'frozen compatible producer/schema that lands controller.bootstrap.work_roots.run_local.execution_context as lme_execution_context; no frozen compatible C1 supplier in inspected lineage; G does not author that schema'
    needed_route_capability: 'frozen compatible typed ingress, protected argument order and gate forwarding of the same admitted lme_execution_context plus exact finalized producer artifact; no frozen compatible route transport in inspected lineage; G does not author that transport; do not expand genesis.launch.envelope'
