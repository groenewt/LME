receipt_rel: receipts/LATEST.yml

packet_809_fw18_812:
  provenance: execution-context-809.yaml, fw09.yaml, fw18.yaml, codex812.yaml (author packet; not loader inputs)
  superseded: [GEN_ID, LABEL, G18_interim_occurrence_pairing, G_owned_dir_rel_location, FW09-RH-03_envelope_expansion, FW09-GL-01_envelope_expansion]
  fw18_withdraws: [FW09-RH-03, FW09-GL-01]
  accepted_declaration: controller.bootstrap.work_roots.run_local.execution_context
  accepted_var: lme_execution_context
  native_invocation_context_cannot_substitute: true
  g_declares_no_location_value: true

c1_execution_context:
  owner: C1
  adopted: false
  n13: excluded
  accepted:
    declaration: controller.bootstrap.work_roots.run_local.execution_context
    var: lme_execution_context
    sibling_of: resolved_run
    fields: [run, attempt, cell, occurrence, locator]
    occurrence_fields: [path, sha256]
    occurrence_none: standalone_gate_with_no_source_occurrence
    allocation: caller
    allocation_modes: [fresh, resume]
    typed_ingress_outside_flat_caller_vars: true
    protected_forwarding_and_argument_order: true
    exact_finalized_producer_artifact: required
  native_controller_context:
    published_fact: lme_invocation_context
    fields: [mode, kind, delegate, connection, owner, root, run, run_identity]
    identity: {field: run_identity, stat_fields: [dev, inode], separator: ':'}
    record_rel: context.yml
    is_not_acceptance_execution_context: true
    cannot_substitute: true
  do_not_modify:
    resolved_run_fields: [runner, work_root, ansible_playbook, python, env, receipt]
    genesis_launch_envelope: {resolved_run: lme_resolved_run}
  missing_capability:
    name: frozen_compatible_C1_execution_context_producer_schema_and_route_typed_transport
    producer_schema_owner: C1
    route_transport_owner: route
    frozen_compatible_supplier: none
    required_matrix_absence_blocks: that_cell
    not: [standalone_diagnostic_gate, universal_bootstrap]
  consumer_bind: bind result identity to lme_execution_context plus the exact finalized producer artifact; never invent GEN_ID/LABEL/dir_rel; never bind native lme_invocation_context as the acceptance context

result_contract:
  fields: [required, applicable, executed, status, evidence, semantic_expectation]
  distinct: true
  rf:
    required: required
    applicable: applicable
    executed: executed
    status: status
    evidence: evidence
    semantic_expectation: semantic_expectation
  failure_when_required: [missing, stale, skipped, unexecuted]
  expected_negative_distinct: true
  runtime_discovery_cannot_shrink_required: true
  unknown_is_not_optional: true
  campaign_completion_is_not_first_observer_gate: true
  first_cell_complete_before_activation: true
  advisory_never_credits_required: true

first_cell:
  cell_id: C122-dev-iso-graph-native
  complete_immutable_expectations_before_activation: true
  campaign_completion_gate: false
  observer_gate: false
  join: BIND-FIRST-CELL-EXPECTED

selected_baseline_real_caller:
