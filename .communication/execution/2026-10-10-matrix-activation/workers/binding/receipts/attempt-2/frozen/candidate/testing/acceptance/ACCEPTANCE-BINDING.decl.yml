    g-result-malformed-row: malformed_row
    g-result-failed-original-later-clean-close: original_failed
    g-result-qualifying-positive: qualified
  result_part_key: result_input
  receipt_key: gate_result_input
  rules:
    - 'the artifact is the RESULTS file the producer descriptor names for THIS lme_execution_context (run, attempt, cell, occurrence, locator), read once by its declared path; no latest-file scan, no glob, no ambient RESULTS or LOG value, no GEN_ID/LABEL composition, no G dir_rel, no native lme_invocation_context substitute'
    - 'the artifact digest equals the descriptor digest; missing, not a regular file, a link, stale, mismatched or a wrong attempt refuses'
    - 'every line is one JSON object whose keys are exactly the declared result fields; the status is one declared status word; the raw fields are kept exactly as emitted'
    - 'the raw lines and their digest are preserved in the receipt; a record carrying the advisory word is judged by gate_status.advisory'
    - 'loading the status vocabulary or this contract is not result consumption and earns no credit'
    - 'required missing/stale/skipped/unexecuted is failure; expected-negative outcome is distinct from execution status'

result_fields:
  case: case
  verdict: verdict
  execution: execution
  required: required
  applicable: applicable
  executed: executed
  status: status
  evidence: evidence
  semantic_expectation: semantic_expectation
execution_fields:
  state: state
  log_sha256: log_sha256

required_result_fields:
  case: case
  obligation: obligation
  applicability: applicability
  acceptance: acceptance
  credit: credit
  required: required
  executed: executed
  status: status
  evidence: evidence
  semantic_expectation: semantic_expectation
  runner_binding: runner_binding

one_case:
  kinds:
    declared: [backup_negative, custody_negative, binding_negative, gate_negative, finite_scenario, lifecycle_phase]
    real_caller: [resolve_admission, loader_projection]
  required_by_kind:
    declared: [queued_on, blocked_reason]
    real_caller: [caller]
    finite_scenario: [queued_on, blocked_reason, required, applicable, executed, status, evidence, semantic_expectation, runner_binding]
    lifecycle_phase: [queued_on, blocked_reason, required, applicable, executed, status, evidence, semantic_expectation, runner_binding]
  pins_absence:
    source: CASE-SCHEMA.yml pins omitted
    meaning: no_overrides
    value: {}
  pins_origin:
    declared: declared
    absent: absent_declared_no_overrides
  declared_missing_runner:
    while_missing: blocked
    once_supplied: must_dispatch
    forbidden: permanent_kind_only_dispatch
  carried_case_fields: [control, revision_equals, revision_differs_from, caller, expect, required, applicable, executed, status, evidence, semantic_expectation, runner_binding]
  cf:
    pins: pins
    expect: expect
    reject: reject
    reject_cause: reject_cause
    fail_closed_cause: fail_closed_cause
  cf_path:
    reject: expect.reject
  files:
    pins: pins.yml
    probe: probe.yml
    log: probe.execution.log
  probe:
    host: localhost
    emit_prefix: 'emit :: '
    judge_prefix: 'judge :: '
    assert_module: ansible.builtin.assert
  json:
    document_regex: '^\s*\{'
    tasks: tasks
    hosts: hosts
    task_name: task.name
    failed: failed
    msg: msg
    changed: changed
  verdict_words:
    pass: {word: PASS, class: green}
    rejected: {word: REJECTED-as-expected, class: green}
    red: {word: RED, class: red}
    blocked: {word: BLOCKED, class: blocked}
    error_json: {word: ERROR-JSON, class: error}
    error_mutation: {word: ERROR-MUTATION, class: error}
    error_wrong_cause: {word: ERROR-WRONG-CAUSE, class: error}
    error_vacuous: {word: ERROR-VACUOUS, class: error}
    error: {word: ERROR, class: error}
    error_control: {word: ERROR-CONTROL, class: error}

run_bindings:
  run_id:
    short_id_length: 12
    dirty_suffix: '-dirty'
    clean_suffix: ''
  downgrade:
    note_key: downgrade_note
    note_prefix: 'RED downgraded to ERROR-CONTROL: control '
    note_suffix: ' did not PASS -- a RED must be earned by a PASSing control differing only by the pin'
  carried:
    control: control
    revision_equals: revision_equals
    revision_differs_from: revision_differs_from
  revision:
    observed_key: observed
    revision_key: revision
    none_marker: NONE
    invalid: [NONE, MISSING, '']
    relation: {equals: equals, differs: differs}
    label: {equals: 'eq ', differs: 'ne '}
    record: {case: case, relation: relation, other: other, this_rev: this_rev, other_rev: other_rev}
    line_format: '%-46s %-7s %-46s this=%s other=%s ok=%s'
  attr:
    stat_checksum: stat.checksum
    stdout: stdout
    item: item
    path: path
  receipt_resolved_run:
    copied: [runner, work_root, ansible_playbook, python]
    env_names_key: env_names
  modes:
    work_dir: '0755'
    snapshot_dir: '0755'
    results_file: '0644'
    receipts_dir: '0700'
    receipt_file: '0644'
  yaml_width: 200
  bpe_runner: acceptance
  bind_probe_executor_rel: testing/remote_harness/tests/tasks/bind_probe_executor.yml
  one_case_rel: one_case_acceptance.yml
  results_file: results.yml
  path_separator: /
  empty_value: ''
  commands:
    head_argv: [git, rev-parse, HEAD]
    porcelain_argv: [git, status, --porcelain]
    timestamp_argv: [date, -u, '+%Y%m%dT%H%M%SZ']
    blob_argv: [git, rev-parse]
    blob_ref_prefix: 'HEAD:'
    archive_argv: [git, archive, -o]
    archive_tree_ish: [HEAD]
    snapshot_tar: snap.tar
    mechanism_diff_argv: [git, diff, --quiet, HEAD, --, testing/acceptance, ':!testing/acceptance/receipts', testing/remote_harness/tests/tasks/bind_probe_executor.yml, testing/remote_harness/tests/tasks/probe_argv.yml]
  mechanism:
    patterns: ['*.yml', '*.j2']
    macros_dir: macros
    extra_rels: [testing/remote_harness/tests/tasks/bind_probe_executor.yml, testing/remote_harness/tests/tasks/probe_argv.yml]
  snapshot_dir_name: _snapshot
  receipt_words:
    tier: acceptance
    owner: G_acceptance
  tally:
    line_format: 'GREEN=%s RED=%s BLOCKED=%s ERROR=%s rev_fail=%s total=%s (receipt: %s; run: %s)'

diagnostics:
  verdict_declaration: {id: ACCEPT-VERDICT-DECLARATION, statement: 'REFUSED -- OWNER.yml verdicts does not declare every verdict class as a list'}
  verdict_words: {id: ACCEPT-VERDICT-WORDS, statement: 'REFUSED -- a declared one_case verdict word is not declared by OWNER.yml under its class'}
  probe_receipt: {id: ACCEPT-PROBE-RECEIPT-FIELDS, statement: 'REFUSED -- the bound toolchain receipt lacks a field this runner records'}
  case_file_shape: {id: ACCEPT-CASE-FILE-SHAPE, statement: 'REFUSED -- a case file is not a mapping carrying case_file_key as a list of mappings; nothing from any case file is merged and no case runs; file'}
  case_kind_fields: {id: ACCEPT-CASE-KIND-FIELDS, statement: 'REFUSED -- a case lacks a field its kind group requires (one_case.required_by_kind); cases'}
  case_pins_type: {id: ACCEPT-CASE-PINS-TYPE, statement: 'REFUSED -- a real-caller case carries pins that is not a mapping; an omitted pins is valid and means no overrides; cases'}
  cell_unbound: {id: ACCEPT-CELL-UNBOUND, statement: 'REFUSED -- a declared acceptance cell input is absent; no cell credit exists without a declared binding; missing inputs'}
  cell_input_type: {id: ACCEPT-CELL-INPUT-TYPE, statement: 'REFUSED -- a cell input is not a string of its declared form (cell id string, sha256 hex, absolute admitted path)'}
  expected_workspace: {id: ACCEPT-EXPECTED-WORKSPACE, statement: 'REFUSED -- the expected model path is not inside the resolved run evidence workspace (lme_resolved_run.work_root)'}
  expected_absent: {id: ACCEPT-EXPECTED-ABSENT, statement: 'REFUSED -- the per-run expected model snapshot is absent or not a regular file at'}
  expected_stale: {id: ACCEPT-EXPECTED-STALE, statement: 'REFUSED -- the expected model bytes differ from the frozen digest the cell was launched with; read vs frozen'}
  expected_shape: {id: ACCEPT-EXPECTED-SHAPE, statement: 'REFUSED -- the expected model is not a mapping with lineage and uniquely identified, fully fielded rows'}
  expected_fixture: {id: ACCEPT-EXPECTED-FIXTURE, statement: 'REFUSED -- the expected model declares itself a repository derived fixture; only the per-run snapshot binds a cell'}
  matrix_decl_absent: {id: ACCEPT-MATRIX-DECL-ABSENT, statement: 'REFUSED -- the matrix declaration is absent or not a regular file at'}
  expected_lineage: {id: ACCEPT-EXPECTED-LINEAGE, statement: 'REFUSED -- the expected model lineage does not name the matrix declaration bytes under test; lineage vs read'}
  matrix_decl_shape: {id: ACCEPT-MATRIX-DECL-SHAPE, statement: 'REFUSED -- the matrix declaration lacks a declared field, or a dimension lacks domain_kind closed_list/inventory_keys/declared_lab_keys/owner_unbound, or a closed_list dimension lacks a domain list, or a relation is malformed'}
  cell_identity: {id: ACCEPT-CELL-IDENTITY, statement: 'REFUSED -- a row identity is not exactly the declared dimensions, a closed_list value is outside its domain, an inventory_keys value is not a key in the bound lab inventory map (except not_applicable where allowed), a declared relation is violated, two rows share one full identity, or required_unbound is treated as a selected profile/host/default; dimension or relation'}
  cell_undeclared: {id: ACCEPT-CELL-UNDECLARED, statement: 'REFUSED -- the cell named by the launch is not exactly one expected row; cell and matching rows'}
  cell_not_selected: {id: ACCEPT-CELL-NOT-SELECTED, statement: 'REFUSED -- the bound row is not selected for this campaign or its selection block is malformed; it stays visibly unexecuted with its reason and earns no credit'}
  cell_required_unbound: {id: ACCEPT-CELL-REQUIRED-UNBOUND, statement: 'BLOCKED -- a required dimension of the bound cell is required_unbound; activation is refused; the obligation stays visible and is never optional/NA; dimension'}
  obligations_shape: {id: ACCEPT-OBLIGATIONS-SHAPE, statement: 'REFUSED -- a case obligation of the bound row is malformed, duplicated, outside the declared state vocabulary, or names an undeclared expected outcome class'}
  obligations_coverage: {id: ACCEPT-OBLIGATIONS-COVERAGE, statement: 'REFUSED -- the case obligations of the bound row do not cover exactly the loaded cases (an obligation cannot disappear, and a loaded case cannot be unmodeled); missing vs extra'}
  required_empty: {id: ACCEPT-REQUIRED-EMPTY, statement: 'REFUSED -- the bound row declares no required applicable case (a vacuous cell earns no credit)'}
  configuration_contract: {id: ACCEPT-CONFIG-CONTRACT, statement: 'REFUSED -- the C1 resolved_config_record contract node read through the resolved locator is absent or lacks a key, field role, filter role or text this consumer reads, or the resolved contract identity is not a digest; locators'}
  configuration_locator: {id: ACCEPT-CONFIG-CONTRACT-LOCATOR, statement: 'REFUSED -- configuration.contract.locators is malformed: the role set is not exactly locator_roles, or a locator is not exactly {fact, path} with a variable-name fact and a list-of-keys path; locators'}
  configuration_input_walk: {id: ACCEPT-CONFIG-INPUT-WALK, statement: 'REFUSED -- a locator or filter_inputs descriptor path does not walk its bound fact: at the named depth the value is not a mapping or lacks the named key; descriptor and depth'}
  configuration_vip: {id: ACCEPT-CONFIG-VIP, statement: 'REFUSED -- the C1 resolved VIP contract lacks a read field, has a field of the wrong type or a member state outside member_states, or breaks a contract-02 intent rule; or a selected, not required (advisory) contract carries a population member in state absent or invalid; or a bound row carries another VIP contract than the admitted one; vip'}
  configuration_vip_blocked: {id: ACCEPT-CONFIG-VIP-BLOCKED, statement: 'BLOCKED -- a required VIP obligation of this cell cannot be evaluated: the required population is empty, a population member has no derived endpoint, or the vantage is absent; never inapplicable; vip'}
  configuration_filter_inputs: {id: ACCEPT-CONFIG-FILTER-INPUTS, statement: 'REFUSED -- the C1 filter_inputs node is malformed: a role set is not exactly verify / revision, admission / documents / registry, profile / registry or name / sha256, or a descriptor is not exactly {fact, path}; descriptors'}
  configuration_verify_context: {id: ACCEPT-CONFIG-VERIFY-CONTEXT, statement: 'REFUSED -- a C1 filter_inputs descriptor names a fact this play has not bound; G substitutes no verifier or binder input (J-G-M3-VERIFY-CONTEXT); unbound facts'}
  configuration_absent: {id: ACCEPT-CONFIG-ABSENT, statement: 'REFUSED -- the resolved-configuration record is absent, not a regular file, not at the C1 location for this cell, or not of the C1 file mode; path'}
  configuration_digest: {id: ACCEPT-CONFIG-DIGEST-MISMATCH, statement: 'REFUSED -- C1 admission step 1: the record bytes digest differs from the digest the consumer was handed; read vs handed'}
  configuration_shape: {id: ACCEPT-CONFIG-SHAPE, statement: 'REFUSED -- C1 admission step 2; C1 text'}
  configuration_version: {id: ACCEPT-CONFIG-VERSION, statement: 'REFUSED -- C1 admission step 3; C1 text'}
  configuration_verify: {id: ACCEPT-CONFIG-VERIFY, statement: 'REFUSED -- C1 admission step 4 (lme_verify_resolved over the admitted context); C1 text'}
  configuration_identity: {id: ACCEPT-CONFIG-REVISION, statement: 'REFUSED -- C1 admission step 5; C1 text'}
  configuration_producer: {id: ACCEPT-CONFIG-PRODUCER, statement: 'REFUSED -- C1 admission step 6 (producers [] refuses every record until route joins the producer, J-M308-ROUTE-A-01); C1 text'}
  configuration_binding: {id: ACCEPT-CONFIG-BINDING, statement: 'REFUSED -- C1 admission step 6 (cell, source commit, source tree and profile of the bound run; the profile is the BASE member, never the selection alias); C1 text'}
  configuration_stale: {id: ACCEPT-CONFIG-STALE, statement: 'REFUSED -- the admitted record digest or its verified configuration revision differs from the bound expected row or from the expected lineage; read vs row vs lineage'}
  cell_profile_set: {id: ACCEPT-CELL-PROFILE-SET, statement: 'REFUSED -- the matrix declaration profile_composition_sets is malformed, does not map the bound row composition value to one base member and one predicate list, or the admitted record profile is not that base member (a record carrying the selection alias refuses); a mapped base member alone earns no composition credit; composition, base member, record profile'}
  expected_projection: {id: ACCEPT-EXPECTED-PROJECTION, statement: 'REFUSED -- the expected model lineage does not name the projection task, template and binding declaration bytes under test or the loaded case files; lineage vs read'}
  projection_unbound: {id: PROJECT-INPUT-ABSENT, statement: 'REFUSED -- a declared projection input is absent; nothing is projected (no empty success, no current-host fallback); missing'}
  projection_input_type: {id: PROJECT-INPUT-TYPE, statement: 'REFUSED -- a projection input is not of its declared form (absolute admitted path, 40-hex commit / tree, cell-id to sha256 mapping)'}
  projection_output: {id: PROJECT-OUTPUT, statement: 'REFUSED -- the projection output is outside the resolved run evidence workspace, or an existing output is a link or not a regular file (a frozen snapshot is never overwritten); path'}
  projection_scope: {id: PROJECT-SCOPE, statement: 'REFUSED -- the run scope names an undeclared or unselected cell, or more cells than one admitted context binds; the other declared cells stay pending, never dropped; scope'}
  projection_conflict: {id: PROJECT-RESUME-CONFLICT, statement: 'REFUSED -- an existing snapshot differs from the checked candidate; the existing snapshot is retained unchanged and the candidate is retained beside it under its digest; existing digest, candidate path, candidate digest'}
  projection_retention: {id: PROJECT-RESUME-RETENTION-FAILED, statement: 'REFUSED -- the digest-named candidate sibling could not be verified; retention FAILED and no candidate bytes are attributed to that path; existing digest, sibling path, sibling state'}
  projection_matrix_shape: {id: PROJECT-MATRIX-SHAPE, statement: 'REFUSED -- the matrix declaration lacks cells or case_obligation_rules, a cell lacks id / identity / selection, or a rule is malformed'}
  projection_cases: {id: PROJECT-CASES, statement: 'REFUSED -- no case file, or a loaded case lacks a name or a known kind, or two cases share a name'}
  projection_rule_coverage: {id: PROJECT-RULE-COVERAGE, statement: 'REFUSED -- a loaded case kind matches no case_obligation_rule or more than one; kind'}
  projection_records: {id: PROJECT-RECORDS, statement: 'REFUSED -- the handed digests do not name exactly the scoped cells, or the admitted maps do not pair each scoped cell with its own record; missing vs extra'}
  projection_readback: {id: PROJECT-READBACK, statement: 'REFUSED -- the candidate or the published snapshot differs from the declared projection in any acceptance-significant field, type-faithfully, or the published bytes differ from the checked candidate; path'}
  source_mismatch: {id: ACCEPT-SOURCE-MISMATCH, statement: 'REFUSED -- HEAD under test differs from the admitted source commit (exact_commit mode); refused before any probe; head vs admitted'}
  required_no_credit: {id: ACCEPT-REQUIRED-NO-CREDIT, statement: 'REFUSED -- a required, not-not-applicable case of the bound cell is not satisfied (missing, ambiguous, unexecuted, skipped, stale, unevidenced, unknown or conflicting applicability, wrong outcome, or stale identity); expected-negative semantic outcome is judged separately and does not convert this into optional/NA; obligations'}
  execution_context_absent: {id: ACCEPT-EXECUTION-CONTEXT-ABSENT, statement: 'REFUSED -- required matrix lme_execution_context is absent or lacks a declared field (run, attempt, cell, occurrence, locator); absence on the standalone diagnostic gate is optional and is not matrix acceptance; G does not substitute GEN_ID/LABEL or native lme_invocation_context; fact'}
  execution_context_record: {id: ACCEPT-EXECUTION-CONTEXT-RECORD, statement: 'REFUSED -- the admitted lme_execution_context is malformed, occurrence is not {path, sha256} or none, allocation mode is not fresh or resume, or native lme_invocation_context was offered as a substitute; path'}
  gate_advisory_contradiction: {id: ACCEPT-GATE-ADVISORY-CONTRADICTION, statement: 'REFUSED -- a gate result carries the advisory status word with raw required true, applicable false or executed true, or an advisory result is counted as a pass, as not_applicable, as credit, or against a required obligation; check, raw fields'}
  gate_status_locator: {id: ACCEPT-GATE-STATUS-LOCATOR, statement: 'REFUSED -- the route gate declaration is absent or not a regular file, or a step of gate_status.source.locator is absent or not a mapping / list as declared, or a declared status key or raw field name is missing there, or the advisory word equals the pass or the not_applicable word; declaration, step'}
  gate_result_contract: {id: ACCEPT-GATE-RESULT-CONTRACT, statement: 'BLOCKED -- 809 superseded GEN_ID/LABEL pairing and G-owned dir_rel; no frozen compatible C1 execution-context producer/schema or route typed transport exists in inspected lineage. Binding is lme_execution_context at controller.bootstrap.work_roots.run_local.execution_context, not native lme_invocation_context. Named missing capabilities: frozen_compatible_C1_execution_context_producer_schema_and_route_typed_transport, J-C1-EXECUTION-CONTEXT-PRODUCER-SCHEMA, J-ROUTE-EXECUTION-CONTEXT-TRANSPORT. Required matrix absence blocks that cell, not standalone diagnostic gate or universal bootstrap. Nothing is read from a partial historical walk and no private default is invented; declaration, join'}
  gate_result_artifact: {id: ACCEPT-GATE-RESULT-ARTIFACT, statement: 'REFUSED -- the gate result artifact named by a well-formed 809 descriptor is missing, not a regular file or a link; no success is earned and no other file is substituted; descriptor, path'}
  gate_result_line: {id: ACCEPT-GATE-RESULT-LINE, statement: 'REFUSED -- a gate result line is not one JSON object with exactly the declared result fields, its status is not a declared status word, or a raw field is not kept as emitted; line number, keys'}
  gate_result_binding: {id: ACCEPT-GATE-RESULT-BINDING, statement: 'REFUSED -- the gate result descriptor of this case is not a regular file, does not parse, lacks or adds a declared field, has a field of the wrong type, a producer_exit outside 0..255, a locator that is not a list of strings, composes identity from GEN_ID/LABEL/dir_rel, or names an artifact whose bytes differ from the recorded digest; no success is earned; case, descriptor, field'}
  gate_result_original: {id: ACCEPT-GATE-RESULT-ORIGINAL-OUTCOME, statement: 'REFUSED -- the original gate operation did not succeed: the recorded producer exit is not shell success, or a required row of the digest-pinned RESULTS bytes is not pass; a later re-emission never qualifies it; case, producer exit, rows'}
  gate_result_policy: {id: ACCEPT-GATE-RESULT-POLICY, statement: 'REFUSED -- gate_result.outcome_policy is weakened or malformed; policy'}
  gate_result_cases: {id: ACCEPT-GATE-RESULT-CASES, statement: 'REFUSED -- a gate_result.consumer_cases name is not exactly one loaded case of a declared kind, its expected outcome is not a declared outcome word or is unproduced, or no qualifying positive case is declared; cases'}
  first_cell_incomplete: {id: ACCEPT-FIRST-CELL-INCOMPLETE, statement: 'BLOCKED -- the first applicable cell lacks complete immutable expectations (identity, independent database/telemetry selection from admitted record, source/commit/tree/configuration/runner/artifact, execution context, per-obligation result fields) before activation; BIND-FIRST-CELL-EXPECTED; whole campaign completion is not a substitute gate'}
