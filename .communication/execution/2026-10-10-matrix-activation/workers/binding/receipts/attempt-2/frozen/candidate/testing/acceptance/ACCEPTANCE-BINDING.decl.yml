    artifact_fields: [path, sha256]
    af: {path: path, sha256: sha256}
    types:
      results_artifact: '{path: string, sha256: string}; path absolute (abs_path_regex); sha256 64 lowercase hex of RESULTS bytes at producer exit; path is producer-owned, not composed from GEN_ID/LABEL/dir_rel by G'
      binding: '{run: string, attempt: string, cell: string, occurrence: mapping_or_none, locator: list} from lme_execution_context; occurrence is {path, sha256} or none for standalone gate; never native lme_invocation_context'
      state_dir_ref: 'string, a reference to the declared logs.dir_env word, never an ambient path and never a G dir_rel value'
      producer_exit: 'integer 0..255, the raw producer exit kept beside the artifact'
      locator: 'list of strings, the producer-owned per-invocation output scope'
    owners: {producer_schema: C1, route_transport: route, consumer: G, identity: lme_execution_context, location: route_after_typed_ingress}
    exit_min: 0
    exit_max: 255
  sha256_regex: '^[0-9a-f]{64}$'
  binding_join:
    state: pending
    bound: bound
    join: J-ROUTE-RUN-ATTEMPT-ABSENT
