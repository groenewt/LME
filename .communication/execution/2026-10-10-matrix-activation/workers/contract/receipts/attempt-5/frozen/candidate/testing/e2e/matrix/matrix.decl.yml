result_fields:
  required: required
  applicable: applicable
  executed: executed
  status: status
  evidence: evidence
  semantic_expectation: semantic_expectation
  distinct: true
  failure_when_required: [missing, stale, skipped, unexecuted]
  expected_negative_distinct: true
  runtime_discovery_cannot_shrink_required: true
  unknown_is_not_optional: true
  campaign_completion_is_not_first_observer_gate: true

axes:
  - id: vcs_stage_and_commit
    dimensions: [vcs_stage]
    commit_binding: source_identity
  - id: cluster_or_isolated_identity
    dimensions: [identity_mode]
  - id: cluster_branch_and_lineage
    dimensions: [cluster_branch]
    domain_kind: owner_unbound
    owner: route/genesis
    join: SEQ-07
  - id: principal_and_acl_scope
    dimensions: [principal_acl_scope]
    domain_kind: owner_unbound
    owner: checkpointed-domains C via C1
    join: BIND-D06-RUNNER
  - id: topology
    dimensions: [topology, backup_mode, lab]
  - id: native_or_qemu_kvm
    dimensions: [runtime, guest]
  - id: profile_composition
    dimensions: [profile_composition]
    independent_selectors: [database_profile, telemetry_profile]
  - id: distribution_architecture_kernel
    dimensions: [distribution]
    architecture_kernel:
      domain_kind: owner_unbound
      owner: B
      join: BIND-D04-RUNNER
  - id: artifact_supply_mode
    dimensions: [artifact_supply_mode]
  - id: network_fabric_path_and_policy
    dimensions: [network_fabric]
    domain_kind: owner_unbound
    owner: route
    join: J-G13-NET-CP02

independent_selectors:
  profile_composition:
    composable: true
    omitted_new_selectors_preserve_existing: true
  database_profile:
    domain: [dual-owned-ha, shared-ha]
    independent: true
    not_a_profile_file_combination: true
    g_does_not_default: true
  telemetry_profile:
    domain: [elastic-only, elastic-plus-hertzbeat, full-mirror]
    independent: true
    omitted_preserves_existing_collector_selection: true
    g_does_not_default: true
  supported_pairs:
    - {telemetry_profile: elastic-only, database_profile: dual-owned-ha, case: MX-PAIR-ELASTIC-ONLY-DUAL-OWNED-HA}
    - {telemetry_profile: elastic-only, database_profile: shared-ha, case: MX-PAIR-ELASTIC-ONLY-SHARED-HA}
    - {telemetry_profile: elastic-plus-hertzbeat, database_profile: dual-owned-ha, case: MX-PAIR-ELASTIC-PLUS-HERTZBEAT-DUAL-OWNED-HA}
    - {telemetry_profile: elastic-plus-hertzbeat, database_profile: shared-ha, case: MX-PAIR-ELASTIC-PLUS-HERTZBEAT-SHARED-HA}
    - {telemetry_profile: full-mirror, database_profile: dual-owned-ha, case: MX-PAIR-FULL-MIRROR-DUAL-OWNED-HA}
    - {telemetry_profile: full-mirror, database_profile: shared-ha, case: MX-PAIR-FULL-MIRROR-SHARED-HA}
  shared_ha_is_not_fallback_for_failed_dual_owned_ha: true

dimensions:
  topology:
    domain: ['1.2.1', '1.2.2', '1.2.3', '1.2.4', '1.2.5', '1.2.6']
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.topology
  vcs_stage:
    domain: [dev, test, main]
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.vcs
  identity_mode:
    domain: [isolated, cluster]
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.identity
  cluster_branch:
    domain: [not_applicable, required_unbound]
    domain_kind: owner_unbound
    source: 'cluster branch and lineage values are declared by route/genesis; until then only isolated cells are declarable'
    owner: route/genesis
  profile_composition:
    domain: [isolated, airgapped, default, tailscale, consumer, multinode, multinode_tailscale, offline, cluster]
    domain_kind: closed_list
    provenance: G s07 profile_composition_sets; composition.yaml profile_sets (author packet; not a loader input)
  database_profile:
    domain: [dual-owned-ha, shared-ha, required_unbound]
    domain_kind: closed_list
    independent: true
    provenance: composition.yaml declared_axis_values.database
    required_unbound_is_not_a_selected_profile: true
  telemetry_profile:
    domain: [elastic-only, elastic-plus-hertzbeat, full-mirror, required_unbound]
    domain_kind: closed_list
    independent: true
    provenance: composition.yaml declared_axis_values.telemetry
    required_unbound_is_not_a_selected_profile: true
  backup_mode:
    domain: [none, service_specific_standby_recovery, independent_backup_restore]
    domain_kind: closed_list
    source: G s07 backup_mode
  runtime:
    domain: [native, qemu_kvm_guest]
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.runtime
  host:
    domain_kind: inventory_keys
    inventory_source: labs.<lab>.declaration
    inventory_map_key: hosts
    closed_literal_domain: false
    historical_closed_values_superseded: [graph]
    rule: 'host identity is the B-owned inventory host key of the bound lab; renamed hosts are inventory edits, not matrix executable edits'
  guest:
    domain_kind: inventory_keys
    inventory_source: labs.<lab>.declaration
    inventory_map_key: guests
    extra_closed_values: [not_applicable]
    closed_literal_domain: false
    historical_closed_values_superseded: [lme-guest-01]
    rule: 'guest identity is the B-owned inventory guest key of the bound lab, or not_applicable on native'
  distribution:
    domain: [debian-13, ubuntu-24.04-lts, rocky-9]
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.distribution
  artifact_supply_mode:
    domain: [online_upstream, shared_local, media_iso, media_usb, mounted_repository]
    domain_kind: closed_list
    provenance: composition.yaml declared_axis_values.supply
  lab:
    domain_kind: declared_lab_keys
    source: labs
  principal_acl_scope:
    domain: [required_unbound]
    domain_kind: owner_unbound
    owner: checkpointed-domains C via C1
    join: BIND-D06-RUNNER
  network_fabric:
    domain: [required_unbound]
    domain_kind: owner_unbound
    owner: route
    join: J-G13-NET-CP02
    declaration: testing/e2e/network/network.decl.yml

profile_composition_sets:
  dimension: profile_composition
  source:
    record: records-c1-framework-02.yml
    sha256: 8238d41a482ce19afbe94a504189fc6e04f93ceffe78cc1bccad4e1a16764c65
    field: lme_framework_registry.profile_sets.sets
    join: J-FW2-G-MATRIX
    qualification: unadopted C1 proposal values; current packet lme_manifests.py has no composition_record
  mapped:
    default: default
    tailscale: tailscale
    consumer: consumer
    multinode: multinode
    multinode_tailscale: multinode
    offline: offline
    cluster: cluster
    isolated: default
    airgapped: offline
  unmapped: {}
  predicates:
    default: []
    tailscale: []
    consumer: []
    multinode: []
    multinode_tailscale: []
    offline: []
    cluster: []
    isolated:
      - {id: PRED-ISO-ROUTE-UNSELECTED, constraint: route_selection, statement: 'no tailnet route selected, so vip-probe is optional and SKIPPED', source: 'records-matrix-01 :157', observes: route, join: J-G13-NET-CP02}
      - {id: PRED-ISO-NO-ROSTER, constraint: roster, statement: 'no lme_host_services roster on the target, so the full stack renders', source: 'records-matrix-01 :157', observes: C1, join: J-G13-C1-EFFECTIVE-CONTEXT}
      - {id: PRED-ISO-NO-LAN-EXPOSURE, constraint: exposure, statement: 'the exposure gate admits no LAN port', source: 'records-matrix-01 :157', observes: route, join: J-G13-NET-CP02}
      - {id: PRED-ISO-EXTERNAL-ENDPOINTS-DECLARED, constraint: exposure, statement: 'explicit external endpoints are still declared', source: 'records-matrix-01 :157', observes: route, join: J-G13-NET-CP02}
