relations:
  - id: REL-GUEST-RUNTIME-NAMES-GUEST
    when: {dimension: runtime, values: [qemu_kvm_guest]}
    then: {dimension: guest, values_kind: inventory_guest_key}
  - id: REL-NATIVE-RUNTIME-HAS-NO-GUEST
    when: {dimension: runtime, values: [native]}
    then: {dimension: guest, values: [not_applicable]}
  - id: REL-NATIVE-IS-DEBIAN-13
    when: {dimension: runtime, values: [native]}
    then: {dimension: distribution, values: [debian-13]}
  - id: REL-ISOLATED-HAS-NO-CLUSTER-BRANCH
    when: {dimension: identity_mode, values: [isolated]}
    then: {dimension: cluster_branch, values: [not_applicable]}
  - id: REL-LAB-OWNS-HOST
    when: {dimension: lab, values_kind: declared_lab_keys}
    then: {dimension: host, values_kind: that_lab_inventory_hosts}
  - id: REL-LAB-OWNS-GUEST
    when: {dimension: lab, values_kind: declared_lab_keys}
    then: {dimension: guest, values_kind: that_lab_inventory_guests_or_not_applicable}
  - id: REL-AIRGAPPED-MEDIA-SUPPLY
    when: {dimension: profile_composition, values: [airgapped]}
    then: {dimension: artifact_supply_mode, values: [media_iso, media_usb, mounted_repository]}
  - id: REL-ISOLATED
    provenance: composition.yaml mandatory_relations
    rule: isolated uses default substrate, no cluster/no implicit LAN or tailnet, explicit external dependencies; incompatible true multi-member HA refuses separately
  - id: REL-AIRGAPPED
    provenance: composition.yaml mandatory_relations
    rule: airgapped uses offline substrate and disconnected ISO/CD, USB, mounted repository complete closure; no selected service disabled because offline bundle missing
  - id: REL-PROFILE-CROSS
    provenance: composition.yaml mandatory_relations
    rule: all 3 telemetry x both DB 6 finite supported pairs on compatible placement, plus required multinode x Tailscale and all declared independent feature controls
  - id: REL-NATIVE-GUEST
    provenance: composition.yaml mandatory_relations
    rule: native no guest identity; guest requires owning hypervisor+UUID/disk/generation+KVM/capacity; distro predicates pinned per run
  - id: REL-BACKUP
    provenance: composition.yaml mandatory_relations
    rule: backup topology requires service-specific recovery semantics; no-backup excludes only truly inapplicable backup test with reason, not collection/TLS/ACL
  - id: REL-BRANCH
    provenance: composition.yaml mandatory_relations
    rule: VCS refs/commit distinct clusterbranch/parent/deployment/config; immutable compatible sharing permitted, mutable data/secrets/ACL isolated
  - id: REL-SILMARIL
    provenance: composition.yaml mandatory_relations
    rule: D1/575 isolated user-owned nonroot controller only; no native or guest application deployment on silmaril under current restriction
  - id: REL-EXCLUSIONS
    provenance: composition.yaml mandatory_relations
    rule: No direct Windows inspect/capture/collection/lifecycle. Tailnet control metadata separate
  - id: REL-DB-TELEMETRY-INDEPENDENT
    rule: database_profile and telemetry_profile are independently selected; a required_unbound value blocks activation and is never a silent default
  - id: REL-PLACEMENT-VARIATION
    rule: renamed hosts, relocated services, and varied source rosters are inventory/manifest/overlay edits through the existing loader; matrix executable code does not enumerate them
  - id: REL-REQUIRED-UNBOUND-BLOCKS-ACTIVATION
    rule: a cell carrying required_unbound on any required dimension cannot activate; the obligation stays visible

