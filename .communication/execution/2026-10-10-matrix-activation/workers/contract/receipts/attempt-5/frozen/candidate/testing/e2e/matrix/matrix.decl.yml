case_obligation_rules:
  - id: OBL-RESOLVE-ADMISSION
    kind: resolve_admission
    obligation: required
    applicability: applicable
    expected_outcome: green
    reason: 'real-caller admission/precedence case of the shared early-resolve entrypoint; applies to every cell that resolves a configuration; preserves selected baseline runner'
  - id: OBL-LOADER-PROJECTION
    kind: loader_projection
    obligation: required
    applicability: applicable
    expected_outcome: green
    reason: 'real-caller loader projection case; applies to every cell that loads manifests; preserves selected baseline runner'
  - id: OBL-BACKUP-NEGATIVE
    kind: backup_negative
    obligation: required
    applicability_relation:
      when: {dimension: backup_mode, values: [none]}
      then: not_applicable
      otherwise: applicable
    expected_outcome: green
    reason: 'F2 backup/restore discriminating cases apply where the cell declares a backup mode; a cell with backup_mode none carries them as not_applicable with this reason'
  - id: OBL-CUSTODY-NEGATIVE
    kind: custody_negative
    obligation: required
    applicability: unknown
    expected_outcome: green
    reason: 'F3 custody-transition and S28 lease cases wait on C/D and composed seed; applicability unknown so the required obligation can neither disappear nor pass'
  - id: OBL-BINDING-NEGATIVE
    kind: binding_negative
    obligation: required
    applicability: applicable
    expected_outcome: green
    reason: 'acceptance-binding / projection discriminating cases; BLOCKED until a declared, generated runner drives them'
  - id: OBL-GATE-NEGATIVE
    kind: gate_negative
    obligation: required
    applicability: unknown
    expected_outcome: green
    reason: 'generated deploy-gate cases; which cells run the generated gate is undeclared by route (J-ENT-G-01); 809 supersedes GEN_ID/LABEL pairing'
  - id: OBL-FINITE-SCENARIO
    kind: finite_scenario
    obligation: required
    applicability: unresolved
    expected_outcome: green
    reason: 'each of the 161 conserved finite scenario IDs remains visible until its applicable instance or justified exclusion is bound; runtime discovery cannot shrink this set'
  - id: OBL-LIFECYCLE-PHASE
    kind: lifecycle_phase
    obligation: required
    applicability: applicable
    expected_outcome: green
    reason: 'the seven first-cell lifecycle phases; first applicable cell must have complete immutable expectations before activation; later campaign cells are not a first-observer gate'

c1_execution_context:
  owner: C1
  adopted: false
  n13: excluded
  accepted:
    declaration: controller.bootstrap.work_roots.run_local.execution_context
    var: lme_execution_context
    fields: [run, attempt, cell, occurrence, locator]
    occurrence_fields: [path, sha256]
    allocation: caller
    allocation_modes: [fresh, resume]
    typed_ingress_outside_flat_caller_vars: true
    protected_forwarding_and_argument_order: true
    exact_finalized_producer_artifact: required
  native_controller_context:
    published_fact: lme_invocation_context
    fields: [mode, kind, delegate, connection, owner, root, run, run_identity]
    record_rel: context.yml
    is_not_acceptance_execution_context: true
    cannot_substitute: true
  do_not_modify:
    resolved_run_fields: [runner, work_root, ansible_playbook, python, env, receipt]
    genesis_launch_envelope: {resolved_run: lme_resolved_run}
  missing_capability:
    name: frozen_compatible_C1_execution_context_producer_schema_and_route_typed_transport
    producer_schema_owner: C1
    route_transport_owner: route
    frozen_compatible_supplier: none
    inspected_lineage: unadopted C1 and unadopted route history do not land execution_context at the declared path; FW18 withdraws FW09-RH-03 and FW09-GL-01 envelope expansion; native lme_invocation_context is not the substitute
    required_matrix_absence_blocks: that_cell
    not: [standalone_diagnostic_gate, universal_bootstrap]
  g_role: compare bound lme_execution_context to expected request and exact finalized producer artifact; never invent GEN_ID/LABEL/dir_rel; never bind native invocation_context as the acceptance context
  consumer_must_bind: lme_execution_context plus the exact finalized producer artifact; never GEN_ID/LABEL pairing; never native lme_invocation_context

