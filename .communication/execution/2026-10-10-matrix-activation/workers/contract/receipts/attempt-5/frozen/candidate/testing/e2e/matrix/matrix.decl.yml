# testing/e2e/matrix/matrix.decl.yml -- G successor (PROPOSAL, unrun)
#
# Extends G s07 testing/e2e/matrix/matrix.decl.yml
# (sha256 5304b6bc5b45af78d396b66b9b11c5a478c8576321f169c2d60524bc70ff95e6). Unadopted.
# Projection and consumer workers consume this frozen contract. Knowledge (M), not a
# second desired-state loader. Author-packet paths below are provenance only and are
# never runtime loader inputs. This product is usable without the author packet
# directory. No tests, review, or deployment from this authoring.

schema_version: 1
owner: G
status: successor_proposal
packet_references_are_provenance_only: true
runtime_loader_inputs: []
base_g:
  provenance: G s07 testing/e2e/matrix/matrix.decl.yml
  supplier_sha256: 5304b6bc5b45af78d396b66b9b11c5a478c8576321f169c2d60524bc70ff95e6
  g_step: s07
  adopted: false
n13_drafts: excluded
source_suppliers: unadopted
engine: inventory+manifests+overlays -> existing loader/filters -> generic templates -> Ansible -> existing deploy gate
not_applicable_marker: not_applicable
required_unbound_marker: required_unbound

execution_context:
  declaration: controller.bootstrap.work_roots.run_local.execution_context
  var: lme_execution_context
  sibling_of: resolved_run
  fields: [run, attempt, cell, occurrence, locator]
  occurrence_fields: [path, sha256]
  occurrence_none: standalone_gate_with_no_source_occurrence
  allocation: caller
  allocation_modes: [fresh, resume]
  typed_ingress_outside_flat_caller_vars: true
  protected_forwarding_and_argument_order: true
  exact_finalized_producer_artifact: required
  native_invocation_context_is_not_a_substitute: true
  do_not_modify:
    resolved_run_fields: [runner, work_root, ansible_playbook, python, env, receipt]
    genesis_launch_envelope: {resolved_run: lme_resolved_run}
  missing_capability:
    name: frozen_compatible_C1_execution_context_producer_schema_and_route_typed_transport
    producer_schema_owner: C1
    route_transport_owner: route
    frozen_compatible_supplier: none
    required_matrix_absence_blocks: that_cell
    not: [standalone_diagnostic_gate, universal_bootstrap]
  g_role: compare bound lme_execution_context to the expected request and the exact finalized producer artifact

authority_body_normalization:
  declared: true
  lossless: true
  reason: nest authority case lists under this declaration; retain field names, values, and source order; do not infer domain or runner from name prefixes
  nesting: requirement_phase_rows receives queue.yaml cases MX-ARCH-01 through MX-OP-DISTINCT-SERVICE-LANES-FOREGROUND-20261009 in source order; finite_scenarios.records receives finite_cases.yaml cases MX-PROFILE-DEFAULT-OMITTED through MX-LOGIC-XOR-11 in source order
  local_resolution_not_packet_loads:
    'controls.yaml#RESULT-INTEGRITY': RESULT-INTEGRITY
    'controls.yaml#CELL-LIFECYCLE': CELL-LIFECYCLE
    'model-join.yaml': model_join
    'composition-contract.yaml#selection_relation': selection_relation
    'composition-contract.yaml#model_join': model_join
  evidence_interpretation:
    source_proposal: historical_review_or_execution
    historical_observation: historical_review_or_execution
    current_execution: present_only_when_nonempty
    provider_execution: present_only_when_nonempty
  runner_dispatch:
    missing_runner: dependency_bound
    once_supplied: runnable
    forbidden: permanent_kind_only_block
  executed_and_availability:
    executed_boolean: executed
    richer_availability: observation_state
    relation: executed false does not imply known_false; unavailable, unknown, timeout, not_observed, stale, and invalid remain distinct from semantic outcome and from qualification
  profile_values: declared telemetry and database labels are used exactly; no silent alias substitution
  yaml_anchors: authority anchors are preserved or expanded equivalently; they are data reuse, not a second engine

RESULT-INTEGRITY:
  required_fields: [required, applicable, executed, status, evidence]
  identity_fields: [case_id, instance_id, requirement_ids, source_binding, branch_binding, pool_binding, run_id, attempt_id, expression_id, input_revision]
  semantic_fields: [expected_semantic_outcome, logical_value, observation_state]
  classification:
    pass: All required applicable assertions executed with fresh attributable compatible evidence; original producer success and exact requested context verified.
    fail: Executed evidence contradicts required semantic outcome.
    blocked: Required bindings, capability or evidence missing/unknown/unavailable/stale/unexecuted.
    not_applicable: Declared applicability false with authority+resolved-input reason; cannot erase selected mandatory obligation.
  negative_case: Passing a refusal test proves guard behavior only; refused target deployment remains unqualified.
  evidence_layers: [historical_review_or_execution, current_source_review, synthetic_control, actual_provider, actual_managed_runtime, qualified_deployment_acceptance]
  no_cross_credit: Each evidence layer retains exact source/config/input/runtime/provider identity; historical or synthetic greens never qualify current runtime.

CELL-LIFECYCLE:
  scope: Every admitted positive deployment cell; negative preeffect cases execute the refusal prefix and prove zero unintended effects, not fictional later setup success.
  phases:
    - id: A0_A1
      required: true
      entry_dependencies: [admitted immediate managed observer and inventory/state binding]
      runner: testing/e2e/target_prereq/prereq_observe.yml observe then measure through admitted managed seed transport.
      exit_criteria: Read structured observation, not exit0 alone; observe prior state, actual privilege/tool/capability/resource facts without changing the target.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P0_A2
      required: true
      entry_dependencies: [A0_A1 observations, declared target privilege/toolchain and measured capacity]
      runner: Declared target_prereq/target_bootstrap and actual capacity observer; selected guest provision re-reads MemAvailable before effects.
      exit_criteria: Resources, packages/tools, ownership and dependency admission match declarations; preserve a typed refusal and required gap if capacity fails.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P2_SETUP
      required: true
      entry_dependencies: [P0_A2, frozen first-cell expected projection, first-cell real-loader architecture/security admission]
      runner: Guest provision only for selected guest; declared transfer and strict install through existing loader/templates/Ansible; native uses its separately admitted target.
      exit_criteria: Freeze every first-cell required expectation and runner binding before activation; provisioning does not depend on its own later E2E success.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P3_SMOKE
      required: true
      entry_dependencies: [P2_SETUP]
      runner: deploy_gate health plus declared SMK01-SMK08 producers and consumers.
      exit_criteria: Observed host/storage/resources, exact manifest owner/runtime roster, healthy required products, complete TCP/UDP exposure, applicable route/vantage, actual client TLS chain and endpoint identity, bound acceptance and executed harness controls. Plan-mode controls earn no execution.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P4_E2E
      required: true
      entry_dependencies: [P3_SMOKE, selected domain producers and controls]
      runner: E2E01-E2E09 as applicable, including actual collection/readback runner not established by gate all.
      exit_criteria: Provenance and stale/cross-stage negatives; reconciliation and interruptions; fresh attributed source content at every selected sink within120 seconds; actual ACL allow/deny; dependency/conflict refusal before effects; useful authenticated UI; selected backup semantics; applicable shared artifact guarantees.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P5_RECONCILE
      required: true
      entry_dependencies: [P4_E2E initial evidence, same deployment identity and change declaration]
      runner: Strict same-deployment unchanged and changed reapply, then declared interrupted operation/resume through actual loader/templates/Ansible.
      exit_criteria: Preserve credentials/certificates/VM identities/data/healthy processes on unchanged apply; change only affected consumers. Resume from observed verified state, retain outstanding delivery obligations, and compare identity/revision evidence.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
    - id: P6_TEARDOWN_REDEPLOY
      required: true
      entry_dependencies: [P5_RECONCILE, exact ownership/claims/recovery ledger and effect admission]
      runner: Generated gate reclaim fragment -> managed route seed -> B reclaim observation/admission/revalidation/receipt; guest retire consumes the admission under its lease; full clean redeploy suite afterward.
      exit_criteria: Remove only proven owned resources. Revalidate before each effect; native teardown without ledger refuses; preinstall no-owned-state differs from teardown. Redeploy repeats all required smoke, TLS and E2E checks, not just health or P2/P3.
      failure_transition: Retain typed failed/blocked result, original source/config/attempt and owned state; no later required phase or aggregate passes from this failure.
      resume_transition: Observe verified current state and receipts, compare immutable requested identity; resume only admitted pending step, never remembered success.
      execution: unrun
  smoke:
    - {id: SMK01, criteria: 'Host identity/distro/arch/kernel/toolchain match admitted record.'}
    - {id: SMK02, criteria: 'Actual memory/storage bytes+inodes/I-O/resource limits and declared owner roots meet admitted allocation.'}
    - {id: SMK03, criteria: 'Exact manifest service/owner/runtime roster active; missing process cannot disappear from expectation.'}
    - {id: SMK04, criteria: 'Complete declared TCP/UDP/listener exposure with forbidden exposure negatives; parse/transport failures not empty success.'}
    - {id: SMK05, criteria: 'Declared routes and required second vantage with authenticated expected response; explicit optional NA reason only.'}
    - {id: SMK06, criteria: 'Actual consumer verifies application TLS chain and endpoint identity; route reachability alone insufficient.'}
    - {id: SMK07, criteria: 'Every expected check has required/applicable/executed/status/evidence and exact identity binding.'}
    - {id: SMK08, criteria: 'Declared harness controls actually executed with bound outputs; plan mode is not execution.'}
  e2e:
    - {id: E2E01, criteria: 'Provenance,wrong source/config/branch/stage/attempt,digest,stale evidence negatives.'}
    - {id: E2E02, criteria: 'Same deployment unchanged,changed and interrupted apply through real loader/templates/Ansible.'}
    - {id: E2E03, criteria: 'Fresh source occurrence to canonical retrieved content in all selected sinks120s; three metric intervals; collector stop fails; all declared sources cycled/jobs balanced.'}
    - {id: E2E04, criteria: 'Actual authorization allow/deny,crossowner,forgedheader,sameorigin and chain/hostname negatives including isolated cases.'}
    - {id: E2E05, criteria: 'Dependency/conflict and invalid selector refuses before effects without silently shrinking valid supported scope.'}
    - {id: E2E06, criteria: 'Purposeful authenticated UI and model-backed investigation/provenance; AI outage does not stop collection.'}
    - {id: E2E07, criteria: 'Selected backup/fencing/durability/recovery semantics only where declared; scoped DB90s after surviving clients exist, replay300s after declared backlog exists.'}
    - {id: E2E08, criteria: 'Applicable shared-store build/reuse/change/corruption/airgap/claims/interrupt/relocation checks.'}
    - {id: E2E09, criteria: 'Exact-owned teardown and complete clean redeploy rerun all applicable smoke/TLS/E2E; no health-only shortcut.'}
  first_cell_barrier: Only immediate phase dependencies. Remaining campaign scenarios, future hooks not consumed by caller, full model publication and full runtime denominator are not blanket A0/A1 gates.

MUTATION-PRECONDITIONS:
  requirements:
    - MAIN effect admission and exact current source
    - target declared inventory and observed prior state
    - owned resource/credential/claim/recovery ledger
    - frozen applicable expected checks before activation
    - synthetic secret failure controls before real credentials
    - current capacity/security/trust/readability in actual owner namespace
  not_universal:
    - All six DB/telemetry profiles completed
    - all distro/topology cells completed
    - all full-matrix predicates executed
    - future N13 publication unless actual selected producer reaches it

model_join:
  join_contract:
    case: MatrixCase case_id is stable coordination identity; instance_id comes only from declared canonical tuple.
    expectation: Each case expectations entry becomes an ExpectedAssertion bound to Requirement and exact subject/relation/transition.
    dependency: depends_on resolves requires relation and step guard; authoring dependencies and runtime effect prerequisites remain distinct.
    operation: OperationContract and HookContract declare input/output ports,required capabilities,actor/scope/lease,guard,effect,observation,failure/recovery and evidence,not merely a command name.
    lifecycle: Transition identifies source/target declared state,guard,effect,observation,receipt,resume/compensation; observations do not rewrite desired state.
    evidence: Invocation run/attempt/source/config/expected identity links Observation,EvidenceArtifact and limited Claim; knownfalse vs missing/unknown/timeouts separate.
    context: QueryContract non-vacuous positive and negative controls,expected schema/graph/input digest; derived RDF/SPARQL projection is read model,not configuration authority.
    representation: Existing YAML/Jinja with sole loader allowance; no second DSL/compiler/resolver or copied giant code scalars.
  domain_bindings:
    - {domain: D01, subject_types: [ProfileComposition, ConstraintExpression, DependencyRelation, SelectionRelation], relation_types: [selects, requires, evaluates], transition_ids: [resolve, admit]}
    - {domain: D02, subject_types: [InventoryNode, ServicePlacement, ResourceIncarnation, RuntimeContext], relation_types: [placed_by, located_on, owned_by], transition_ids: [admit, provision, relocate, failover]}
    - {domain: D03, subject_types: [RuntimeContext, ArtifactIdentity, Invocation, EvidenceArtifact], relation_types: [derives_from, scoped_to, supersedes], transition_ids: [resolve, admit, changed_reapply]}
    - {domain: D04, subject_types: [InventoryNode, ResourceIncarnation, Capability, PoolLease, ModelRuntime], relation_types: [requires, located_on, leases], transition_ids: [admit, reserve, provision]}
    - {domain: D05, subject_types: [ArtifactIdentity, ArtifactPublication, StorageClaim, RecoveryObligation], relation_types: [publishes, claims, derives_from, preserves], transition_ids: [reserve, render, recover, retire, prune]}
    - {domain: D06, subject_types: [Principal, AuthorityGrant, TrustMaterial, Route, ServiceDefinition], relation_types: [authorized_by, scoped_to, owned_by, trusts], transition_ids: [admit, activate, rotate, relocate]}
    - {domain: D07, subject_types: [ServiceDefinition, CollectionSource, CollectionJob, EventOccurrence, DeliveryObligation, ModelRuntime], relation_types: [samples, produces, owes_delivery, verifies_delivery], transition_ids: [activate, collect, admit_delivery, verify_delivery, drain]}
    - {domain: D08, subject_types: [Route, NetworkPath, Principal, TrustMaterial, ConstraintExpression], relation_types: [exposes, traverses, trusts, authorized_by, evaluates], transition_ids: [resolve, admit, activate, changed_reapply, retire]}
    - {domain: D09, subject_types: [Transition, OperationContract, DatabaseDomain, ReplicationRelation, RecoveryObligation, StorageClaim, ResourceIncarnation], relation_types: [guards, effects, replicates_via, preserves], transition_ids: [provision, activate, unchanged_reapply, changed_reapply, interrupt, recover, rotate, failover, restore, drain, retire, prune, clean_redeploy]}
    - {domain: D10, subject_types: [Requirement, MatrixCase, ExpectedAssertion, Observation, EvidenceArtifact, HookContract, Invocation, QueryContract, Claim], relation_types: [satisfies, observes, supports, verifies, evaluates, consumes], transition_ids: [resolve, admit]}
  first_cell_rule: Only model/source/guard facts actually consumed by selected step gate it. Full cross-domain model implementation and all campaign cases remain parallel obligations,not blanket A0/A1 prerequisites.
  requirement_id: OP-FULL-SYSTEM-MODELING-20261009
  provenance_model_source: frozen native model contract identity 4261123770dc557e6490e085f2ef0156d525ca8c961c4ebfd93fba815df761db

selection_relation:
  universe: All declared axis entities and typed relationships in the existing engine canonical resolved revision; this file records acceptance rules only and does not execute selection.
  admissible_positive: A tuple is selectable only if all required dimension bindings exist, placement+scope permit it, canonical declared compatibility predicates are known satisfied, declared dependencies close, no declared conflict holds, and exact ownership/resource/security/effect admission is satisfied for the step.
  required_but_unbound: Required supported tuples missing implementation/artifacts/observation remain modeled required gaps, never removed as invalid.
  negative_relation: Explicit contradictory/unsupported inputs are separate required refusal cases with expected refusal and zero unintended effects. A passed negative does not admit a deployment.
  not_applicable: Allowed only by declaration-derived reason for a specific obligation (for example backup none or route genuinely absent); missing required implementation/observation is blocked.
  instance_identity: Stable case_id plus declared canonical tuple fingerprint and source/config/expected digests; actual caller run/attempt independently identifies execution.
  projection: G projects resolved canonical intent before activation using selected compatible project_expected/template sources; no secondary merge or runtime-discovery roster.
  denominator: Materialize exact bound instances only when all declared finite values and quantified rosters/relations are supplied. No count here is the runtime denominator.

telemetry_destinations:
  elastic-only: {logs: [elastic], native_metrics: [elastic]}
  elastic-plus-hertzbeat: {logs: [elastic, hertzbeat], native_metrics: [elastic, hertzbeat]}
  full-mirror: {logs: [elastic, hertzbeat, malcolm], native_metrics: [elastic, hertzbeat]}

bindings:
  BIND-CURRENT-SOURCE: Admitted coherent source/configuration/runner digests; proposals are not adoption.
  BIND-RESOLVED-INTENT: One existing loader output and preactivation expected projection; never discover expectations from running services.
  BIND-DOMAIN-RUNNER: Exact owner-produced current runner/control missing or not yet matched to case.
  BIND-OVERLAY-CONTROL: Concrete case/admission check binding required.
  BIND-OBSERVER-INVOCATION:
    owner: route/B/C1 with MAIN source and effect admission
    required_inputs:
      - One actually adopted source-bound launcher/bundle and matching managed receipt
      - Exact B inventory/run binding, endpoint and privileged key reference
      - Resolved target scope and privileged initial-contact prerequisites
    not_blanket_prerequisites: Whole route/B/C1 recovery campaigns, full model/corpus completion, all topology/profile cells, both Ansible-leg executions, full expected matrix and application acceptance do not gate an otherwise admitted A0/A1 invocation.
  BIND-FIRST-CELL-EXPECTED: Complete applicable first graph case expectations with explicit unknowns resolved before activation.
  BIND-FIRST-CELL-ARCHITECTURE: First cell applicable real-loader safety and architecture checks; full matrix not prerequisite.
