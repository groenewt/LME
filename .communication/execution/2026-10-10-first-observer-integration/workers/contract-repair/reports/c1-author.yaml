exact_changes:
- id: recovery_inputs_order
  from:
  - lease_record
  - staging_reservation
  - first_record_write
  - first_charged_write
  to:
  - whole_lease_value
  - prospective_staging_plan
  - first_record_write
  - first_charged_write
- id: prospective_allocation
  change: Replace tempfile-reserved_by random suffix with declared exact plan_mark
    text/ere plan. Form becomes .<destination basename>.<staging_infix>.<token>.<plan_mark>.
    Planning creates no inode.
- id: phase_order
  change: Keep typed five-phase order. Bind covered-phase substeps so destination
    lock is released before registry recovery, mkdir precedes witness publication,
    and dest-lock spans include staging mkdir, inner dirs, lstat, and lease persist.
- id: no_new_inode_kat
  change: Declare exact no-relock argv. Command execution is flock --version with
    expected rc 0 and stdout_search util-linux. Nested conflict is flock -x -n -E
    75 <held registry lock> flock --version with expected rc 75. Scratch forbidden.
    Reacquire of the held registry lock forbidden.
- id: record_families
  change: Keep the same record type. Admit v1 six-field family for recovery and v2
    family adding destination_metadata_inodes and destination_lease_encoded_bytes for
    new first-effect admissions. Do not mark v1 unaccountable solely for missing new
    keys.
- id: peer_visible_envelopes
  change: Persist destination_metadata_inodes and destination_lease_encoded_bytes on
    the first immutable obligation. Add destination_lease to copy_locations and to
    the r55 copy_locations keys check. Params own_destination_metadata_inodes and
    own_destination_lease_encoded_bytes must equal those maps.
- id: identity_and_witness
  change: Obligation.lease stays the ten-field identity. Destination lease file has
    typed identity projection and separate staging_* witness. Whole-map equality of
    identity to an extended file is forbidden. Mkdir then noreplace lease-with-witness.
    No later promotion of the landed obligation.
- id: lease_inputs
  change: Split absent_or_different. Equals is destination_lease_identity_projection.
    still_requires includes existing_holder_view_lock_gates and the source-named holder/view/listing/relock
    words.
- id: lock_order
  change: Paired YAML now carries registry_lock_spans and destination_lock_spans, including
    staging create, inner dirs, and witness publication. Recovery releases destination
    lock before registry recovery. Locks never together.
- id: loader
  change: No lme_manifests.py edit after re-observation of extended keys.
- id: source_closure
  change: members_rel no longer claims package_bundle.yml. That file is dispatch_admission.authored
    under package.yml. Append reserved outputs including _rh_n13_witness. Preserve
    HOLD and reaper digest 9b5ba6f936cf2411b4dc18cefe2ddc5a221dbba4f3912310f9d257a842cef134
    with case_sensitive uniqueness and listed_leaf_presence.
unresolved_issues:
- id: no_new_inode_kat_unexecuted
  severity: bootstrap_decision_open_until_control
  statement: Exact KAT argv is declared from existing flock/recovery_lock/busy_rc
    words plus now-YAML --version and util-linux. It is not proved. If the nested
    conflict against the already-held registry lock cannot satisfy the existing tool-admission
    contract, retain HOLD and do not add a scratch exception.
  blocked_tests:
  - N13-LOCK-AND-KAT
- id: pre_create_empty_lock_and_directory_st_size
  severity: charge_representation_unfillable
  statement: No admitted declaration supplies a byte bound for yet-uncreated empty
    destination lock, staging directory, or inner dirs. Publisher already records
    no byte word for a bootstrap inode. This is unavailable, not measured_zero.
  blocked_tests:
  - N13-CAPACITY-CONCURRENT
  closed_for: destination-side inode coupling via destination_metadata_inodes
- id: post_witness_destination_lease_file_growth
  severity: charge_representation_unfillable
  statement: First-record destination_lease_encoded_bytes measures identity-only JSON.
    Witness keys added later cannot be written into the immutable obligation. No admitted
    bound for that encoding delta.
- id: HOLD1206
  severity: required_retention
  statement: Unconditional publication refusal remains until MAIN independently admits
    executed joined source. This candidate set does not lift it and does not treat
    HOLD as completion of the unfillable or unproven items.
- id: holders_helper_unreserved_names
  severity: preexisting_open
  statement: reap_staging_controller_holders.yml names _rh_reap_pmo_d, _rh_reap_aty_d,
    _rh_reap_asr_d, _rh_reap_cgv_d, and _rh_reap_als_d as not in reserved_outputs.
    This interface does not consume them and does not add a wildcard.
- id: b_and_route_consumer_bodies
  severity: required_dependent_authorship
  statement: C1 does not write B or route product source. Publisher pins, transaction
    awk XI contribution, reaper identity-projection compare, mkdir-then-witness persist,
    and KAT move remain required consumer additions on existing files.
required_tests:
  required: true
  applicable: true
  executed: false
  evidence: Source inspection and hashes only. No control, loader, or product command
    was run by C1.
  transport: Existing managed runner and actual loader/caller paths after source/invocation
    admission.
  cases:
  - id: N13-GUARD
    status: unexecuted
    expect: Current caller refuses at HOLD1206 with no covered application effect.
  - id: N13-EMPTY-FIRST-ORDER
    status: unexecuted
    expect: Only admitted registry dir/lock bootstrap precedes complete obligation
      landing/readback. No KAT scratch, destination lock, lease, staging or payload
      write before applicable admission.
  - id: N13-CAPACITY-CONCURRENT
    status: blocked
    blocked_by:
    - pre_create_empty_lock_and_directory_st_size
    expect: Individually fitting but jointly over-budget writers cannot both proceed,
      including lock/lease/directory metadata, record and writer copies. Inode coupling
      for destination lock, staging, inner dirs, and lease file is declared; empty
      lock/dir byte coupling remains unavailable.
  - id: N13-COLLISION-BEFORE-AND-AT-CREATE
    status: unexecuted
    expect: No overwrite or adoption of colliding staging path or destination lease.
  - id: N13-INTERRUPT-BEFORE-DIRECTORY
    status: unexecuted
    expect: Record-only retirement only after exact paths are proved absent under current
      holder/view/lock gates.
  - id: N13-INTERRUPT-AFTER-DIRECTORY
    status: unexecuted
    expect: Before witness, retain charge/directory. After witness, recover only with
      identity projection, staging lstat equality, quiescence, relock, and listing.
      Never infer creator from prospective pathname.
  - id: N13-INTERRUPT-BEFORE-LEASE
    status: unexecuted
    expect: Proved absent lease may allow narrow record-only retirement. Unreadable/different
      lease is not absence. Present directory without witness remains charged.
  - id: N13-INTERRUPT-AFTER-LEASE
    status: unexecuted
    expect: Incomplete lease/writer copies stay charged. Preserve obligation-before-lease
      release.
  - id: N13-LOCK-AND-KAT
    status: blocked
    blocked_by:
    - no_new_inode_kat_unexecuted
    expect: Prove flock command execution/exclusion without unadmitted scratch. Busy
      is not tool failure. No registry/destination lock inversion. No scan/landing
      split.
  - id: N13-IDENTITY-AND-ANCESTRY
    status: unexecuted
    expect: Mismatched include/holder/uid/parent/token/lease/record refuses before the
      affected effect. Ten-field identity is not compared as a whole map to an extended
      destination lease file.
  - id: N13-RECOVERY-POSITIVES-AND-UNKNOWNS
    status: unexecuted
    expect: Preserve required dead-holder and both route3 recovery positives, listed-presence
      retention, nine same-input cgroup cells and complete listing gates. v1 records
      recover without fabricated zeros; recovery-only operation precedes new v2 admissions
      on shared devices.
  - id: N13-CALLER-CLOSURE
    status: unexecuted
    expect: Actual loader/include paths on projection, initializer_release, package_bundle,
      cold_launch_release, plus direct remote-target and existing package routes.
