---
schema_version: 1
kind: paired_schema_typed_edit_operations
role: c1_successor
status: authored_not_executed
not_acceptance: true
target:
  packet_path: packet/declarations/r55-remote-harness-schema.yaml
  sha256: c9626ea1a9b26676865bdbd778e13a6c8effec3d94d3e3987a15d48e46c6d13a
  logical_path: manifests/global.yml#lme_config_registry.remote_harness_schema
  pair:
    packet_path: packet/declarations/s68-controller.yaml
    sha256: 5dabb0511bb6eee59d8dd19d1b6c71dc0d7024b541fb9f2d472584340bfe5138
    logical_path: manifests/profiles/remote-harness.yml#profile_overlay.lme_global.remote_harness.controller
home:
  write_bound_enum:
    keys:
    - contracts
    - entry_generation_render_engine
    - checks
    select:
      path: n10.write_bound
      constraint: enum
      index: 0
    note: This enum value must stay equal to the profile write_bound subtree after
      the paired edits.
  reserved_outputs:
    keys:
    - reserved_outputs
  copy_locations_keys_check:
    keys:
    - contracts
    - entry_generation_render_engine
    - checks
    select:
      path: n10.write_bound.obligations.copy_locations
      constraint: keys
paired_with: candidates/c1/profile-join.yaml
value_source: candidates/c1/phase-interface.yaml
