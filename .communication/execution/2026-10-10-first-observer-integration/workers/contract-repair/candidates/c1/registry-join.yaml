    is outside the write_bound enum value and must be amended with the new copy_locations
    key.
- id: covered_effect_charges
  op: insert_key
  under: write_bound_enum
  keys:
  - obligations
  - covered_effect_charges
  observed_absent: true
  value:
    metadata_copies_means: record_copies_only
    metadata_copies_repurpose: forbidden
    same_device:
      by: device
      same_device: sum
    charge_status_vocabulary:
    - measured
    - planned_from_declared_count
    - unavailable
    - absent_from_record_family_v1
    - not_applicable
    own_effect_inodes:
      unit: 1
      param: own_effect_inodes
      param_shape: device_to_nonneg_integer
      persisted_peer_field: destination_metadata_inodes
      objects:
      - id: destination_lock
        inodes: 1
        when: absent_at_read_only_plan
        charge_status: planned_from_declared_count
      - id: staging_directory
        inodes: 1
        when: this_call_will_create_prospective_path
        charge_status: planned_from_declared_count
      - id: inner_staged_dirs
        inodes_from:
          param: rh_rsv_dirs
          callers_home: write_bound.callers.params
          grammar: sequence_of_relative_dir_names
          charge: length_of_admitted_sequence
        when: after_staging_directory_exists
        charge_status: planned_from_declared_count
      - id: own_lease_file
        inodes: 1
        when: rh_reap_reserve
        charge_status: planned_from_declared_count
      - id: kat_scratch
        selected: false
        charge_status: not_applicable
        inode_create: never
        not_a_measured_zero: true
    destination_lease_encoded_bytes:
      persisted_peer_field: destination_lease_encoded_bytes
      encoding_at: controller.entry_generation.render.output_encoding
      charge_status: measured
    missing_dimensions:
    - id: pre_create_empty_lock_and_directory_st_size
      charge_status: unavailable
      fabricate_zero: forbidden
    - id: post_witness_destination_lease_file_growth
      charge_status: unavailable
      fabricate_zero: forbidden
    recovery_only_operation:
      same_record_shape_family_as_outstanding: true
      rewrite_v1_to_v2_as_bypass: forbidden
      payload_write: forbidden
      zero_budget_bypass: forbidden
      progress_legacy_before_new_admissions: true
  source: candidates/c1/profile-join.yaml#operations.id=covered_effect_charges
- id: lock_order
  op: insert_key
  under: write_bound_enum
  keys:
  - obligations
  - lock_order
  observed_absent: true
  value:
    never_together:
    - registry_lock
    - destination_lock
    registry_lock_spans:
    - lock_tool_command_execution
    - lock_tool_nested_conflict
    - scan
    - unaccountable
    - measure
    - charge
    - admit
    - temp_write
    - noreplace_landing
    - readback
    destination_lock_spans:
    - old_holder_reap_rename
    - old_holder_reap_remove
    - old_holder_lease_remove
    - this_call_staging_directory_create
    - this_call_inner_staged_dirs_create
    - this_call_creation_result_lstat
    - this_call_witness_publication
    recovery_sequence:
    - destination_mutation_under_destination_lock
    - release_destination_lock
    - registry_recovery_under_registry_lock
    - release_registry_lock
    - independently_reobserved_lease_release
    busy_unknown: retain
    lock_success_is_not_ownership: true
    cross_host_atomicity: not_claimed
  source: candidates/c1/profile-join.yaml#operations.id=lock_order
- id: covered_reap_order
  op: insert_key
  under: write_bound_enum
  keys:
  - obligations
  - covered_reap_and_resource_creation
  observed_absent: true
  value:
    mkdir_then_lease_with_witness: true
    lease_then_mkdir: forbidden
    release_destination_lock_before_registry_recovery: true
    actions_ordered:
    - destination_lock_create_if_absent
    - old_holder_destination_mutations
    - release_destination_lock_after_old_mutations
    - old_holder_registry_recovery
    - release_registry_lock_after_recovery
    - independently_reobserved_old_lease_release
    - release_destination_lock_after_old_lease_release
    - this_call_staging_directory_create
    - this_call_inner_staged_dirs_create
    - this_call_creation_result_lstat
    - this_call_witness_publication
    - release_destination_lock_after_witness
  source: candidates/c1/profile-join.yaml#operations.id=covered_reap_order
- id: destination_lease_file_grammar
  op: insert_key
  under: write_bound_enum
  keys:
  - obligations
  - destination_lease_file
  observed_absent: true
  value:
    identity_keys_from:
    - bundle
    - staging_retention
    - lease
    - record_fields
    witness_keys:
    - staging_dev
    - staging_inode
    - staging_uid
    - staging_perms
    - staging_type
    - staging_path
    admitted_key_sets:
    - identity_only_v1
    - identity_plus_witness_v2
    comparison:
      identity_projection: field_for_field_on_identity_keys
      whole_map_equality_of_identity_to_extended_file: forbidden
      witness_projection: field_for_field_to_independent_lstat
    persist:
      when: after_successful_mkdir_lstat_under_destination_lock
      create: noreplace
      noreplace_arg: -n
      mode: '0400'
    staging_type_equals: directory
  source: candidates/c1/profile-join.yaml#operations.id=destination_lease_file_grammar
- id: lease_inputs
  op: replace
  under: write_bound_enum
  keys:
  - lifetime
  - dead_holder
  - proof
  - lease_inputs
  observed:
    from: record_lease
    equals: destination_lease_record
    absent_or_different: unknown
  value:
    from: record_lease
    equals: destination_lease_identity_projection
    different: unknown
    unreadable: unknown
    absent:
      proof: complete_admitted_observation_proves_destination_lease_absent
      then: record_only_retirement_candidate
      still_requires:
      - holder_quiescent
      - holder_quiescent_cgroup_from
      - relock_witnesses
      - process_visibility
      - registry_applicability_views
      - observe_absent_staging
      - observe_absent_reaping
      - observe_absent_registry_temp
      - observe_absent_or_empty_local_temp
      - observe_absent_or_empty_remote_temp
      - leaf_listing_presence
      - path_admission_case_sensitive_uniqueness
      - parent_proof_ancestors_by
      - existing_holder_view_lock_gates
      not_sufficient:
      - failed_stat
      - pathname_knowledge
      - in_memory_mkdir_result_from_another_process
  source: candidates/c1/profile-join.yaml#operations.id=lease_inputs
- id: ownership_proof
  op: insert_key
  under: write_bound_enum
  keys:
  - lifetime
  - dead_holder
  - proof
  - creation_ownership
  observed_absent: true
  value:
    intent_is_not_ownership: true
    matching_lease_contents_alone: not_directory_creation_proof
    resource_present_without_lease: preserve_record_charge_and_object
    resource_present_without_witness: preserve_record_charge_and_object
    obligation_record_fields_post_mkdir: none
    destination_lease_file_witness: staging_dev_inode_uid_perms_type_path
    in_memory_module_result: not_durable
    no_later_promotion_of_immutable_obligation: true
    crash_windows:
    - before_first_record
    - after_record_before_create
    - after_mkdir_before_witness
    - after_witness
  source: candidates/c1/profile-join.yaml#operations.id=ownership_proof
- id: reserved_outputs_append
  op: append_list_unique
  under: reserved_outputs
  keys: []
  observed_present:
  - rh_staging_lease
  - _rh_lease_rec
  - _rh_rsv_stage
  - _rh_rsv_tmp
  - _rh_rsv_reg
  - _rh_rsv_oa
  - _rh_reap_kat
  - _rh_reap_katlock
  value:
  - _rh_n13_phase
  - _rh_n13_effect
  - _rh_n13_lock_kat
  - _rh_n13_create
  - _rh_n13_witness
  source: candidates/c1/phase-interface.yaml#phases
  note: Existing names keep reservation. _rh_rsv_stage becomes the prospective path.
    _rh_rsv_tmp and _rh_reap_katlock remain reserved so they cannot be supplied as
    extra-vars after tempfile withdrawal. _rh_n13_create is the in-memory mkdir result
    and is not the durable witness; _rh_n13_witness is the typed creation-result binding.
n10_write_bound_keys_check:
  op: assert_unchanged
  keys:
  - contracts
  - entry_generation_render_engine
  - checks
  select:
    path: n10
    constraint: keys
  observed:
  - ops
  - rel
  - scopes
  - write_bound
  note: Added write_bound child keys are inside the enum value, not new n10 siblings.
    No schema key-list widening at n10.
edition_label:
  do_not_require: s69_or_r56_by_name
  identify_successor_by: exact_digests_after_review
