- id: staging_placeholders
  op: replace
  under: write_bound_enum
  keys:
  - obligations
  - record_grammar
  - staging_placeholders
  observed:
    <destination basename>: destination_basename
    <staging_infix>:
    - bundle
    - staging_infix
    <token>: record_token
    <random>:
      ere: '[a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_]'
      reserved_by: ansible.builtin.tempfile
      source: python_tempfile_random_name_sequence
      alphabet: abcdefghijklmnopqrstuvwxyz0123456789_
      length: 8
  value:
    <destination basename>: destination_basename
    <staging_infix>:
    - bundle
    - staging_infix
    <token>: record_token
    <plan_mark>:
      ere: plan
      text: plan
      reserved_by: write_bound.obligations.record_grammar.staging_placeholders.<plan_mark>
      source: write_bound.obligations.record_grammar.staging_placeholders.<plan_mark>.text
