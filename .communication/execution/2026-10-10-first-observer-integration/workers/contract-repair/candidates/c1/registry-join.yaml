  observed_absent: true
  value:
    create_at_plan: never
    parent: destination_parent
    reserve:
      when: after_first_complete_durable_obligation
      create: absent_only_no_parents
      mode: '0700'
    collision: refuse_no_overwrite_no_adoption
    tempfile: withdrawn
  source: candidates/c1/profile-join.yaml#operations.id=staging_prospective
- id: registry_bootstrap_unchanged
  op: assert_unchanged
  under: write_bound_enum
  keys:
  - obligations
  - registry_bootstrap
  observed:
    dir_mode: '0700'
    create: absent_only_no_parents
    bootstrap_inodes:
      registry_dir: when_absent
      lock: when_absent
    inode_count: 1
  source: packet/context/first-effect-contract-proposal.yaml#owner_changes.C1.required
- id: lock_tool_admission
  op: insert_key
  under: write_bound_enum
  keys:
  - obligations
  - lock_tool_admission
  observed_absent: true
  value:
    inode_create: never
    scratch: forbidden
    subject: registry_lock
    when: after_registry_bootstrap_inside_first_registry_lock
    span: same_one_command_under_lock_as_scan_through_readback
    before_step: scan
    busy: retained_not_tool_failure
    nested_registry_and_destination_locks: forbidden
    reacquire_held_registry_lock: forbidden
    destination_scratch_kat: not_selected
    version_arg: --version
    stdout_search: util-linux
    command_execution:
      id: lock_tool_command_execution
      tool_from:
      - obligations
      - commands
      - lock
      - tool
      argv_words:
      - flock
      - --version
      lock_file_operand: forbidden
      expected_status:
        rc: 0
        stdout_search: util-linux
    nested_conflict:
      id: lock_tool_nested_conflict
      lock_args_from:
      - obligations
      - commands
      - recovery_lock
      exclusive_arg: -x
      nonblocking_arg: -n
      conflict_exit_arg: -E
      expect_status_from:
      - bundle
      - staging_retention
      - lease
      - busy_rc
      expect_status_value: 75
      argv_words:
      - flock
      - -x
      - -n
      - -E
      - '75'
      - registry_lock_path
      - flock
      - --version
      expected_status:
        rc: 75
        stdout_lines: 0
    unresolved_if_unprovable: retain_HOLD_and_report_bootstrap_kat_unproven
  source: candidates/c1/profile-join.yaml#operations.id=lock_tool_admission
- id: transaction_steps_prefix
  op: replace
  under: write_bound_enum
  keys:
