      read-only derivation. Not destination lease-file persistence. Not the creation-result
      witness.
    prospective_staging_plan: Exact staging pathname derived and validated. Creates
      no inode and grants no ownership.
    first_record_write: First complete charged obligation landing and exact readback
      under one registry lock, including fillable peer-visible envelopes.
    first_charged_write: First covered application filesystem mutation after that admission,
      excluding the declared registry directory/lock bootstrap.
  required_consumer_additions:
    owner: B
    packet_logical: testing/remote_harness/tasks/reserve_publish.yml
    amend_pins_at:
