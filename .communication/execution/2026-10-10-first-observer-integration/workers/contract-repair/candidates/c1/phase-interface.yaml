      source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.obligations.registry_bootstrap.inode_count
    not_extended_to:
    - kat_scratch
    - lease
    - staging
    - destination_lock
    - reaping
  lock_tool_admission:
    inode_create: never
    scratch: forbidden
    subject: registry_lock
    when: after_registry_bootstrap_inside_first_registry_lock
    span: same_one_command_under_lock_as_scan_through_readback
    before_step:
      value: scan
      source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.obligations.transaction.steps
    busy: retained_not_tool_failure
    nested_registry_and_destination_locks: forbidden
    reacquire_held_registry_lock: forbidden
    destination_scratch_kat: not_selected
    declared_literals_now_yaml:
      version_arg:
        value: --version
        yaml_type: string
        observed_undeclared_at:
          packet_path: packet/source/testing/remote_harness/tasks/reap_staging.yml
          lines:
          - 722
          - 723
      stdout_search:
        value: util-linux
        yaml_type: string
        observed_undeclared_at:
          packet_path: packet/source/testing/remote_harness/tasks/reap_staging.yml
          line: 739
    command_execution:
      id: lock_tool_command_execution
      tool_from:
      - obligations
      - commands
      - lock
      - tool
      tool_value: flock
      argv_words:
      - flock
      - --version
      argv_bind:
      - source: os_tools[obligations.commands.lock.tool].path
        word: flock
      - source: lock_tool_admission.declared_literals_now_yaml.version_arg.value
        word: --version
      lock_file_operand: forbidden
      exclusive_arg: forbidden
      nonblocking_arg: forbidden
      wait_arg: forbidden
      expected_status:
        rc: 0
        stdout_search: util-linux
      note: Outer commands.lock already holds the registry lock. This argv must not
        acquire any lock file.
    nested_conflict:
      id: lock_tool_nested_conflict
      lock_args_from:
      - obligations
      - commands
      - recovery_lock
      exclusive_arg:
        value: -x
        source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.obligations.commands.recovery_lock.exclusive_arg
      nonblocking_arg:
        value: -n
        source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.obligations.commands.recovery_lock.nonblocking_arg
      conflict_exit_arg:
        value: -E
        source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.obligations.commands.recovery_lock.conflict_exit_arg
      expect_status_from:
      - bundle
      - staging_retention
      - lease
      - busy_rc
      expect_status_value: 75
      expect_status_source: packet/declarations/s68-controller.yaml#bundle.staging_retention.lease.busy_rc
      argv_words:
      - flock
      - -x
      - -n
      - -E
