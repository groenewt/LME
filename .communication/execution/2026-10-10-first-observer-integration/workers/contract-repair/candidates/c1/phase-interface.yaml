      - source: os_tools[obligations.commands.lock.tool].path
        word: flock
      - source: lock_tool_admission.declared_literals_now_yaml.version_arg.value
        word: --version
      expected_status:
        rc: 75
        stdout_lines: 0
      inner_command_must_not_run_on_conflict: true
      never:
