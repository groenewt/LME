phases:
- id: read_only_identity_and_effect_plan
  owner: route_with_b_caller_admission
  before: any_covered_application_mutation
  actions:
  - Retain independently admitted caller/include-chain/site identity, invoking uid,
    actual destination ancestry and current local/remote temp baselines.
  - Run existing reaper prefix through rh_staging_lease and complete _rh_lease_rec
    once in the admitted controller context; retain delegated namespace helper semantics.
  - Derive and validate exact prospective staging, lease, destination-lock, registry
    and temp paths and the source-bound effect/charge plan, including fillable inode
    and lease-encoded-byte envelopes.
  planning_creates_path: false
  planning_grants_ownership: false
  producers:
    token: rh_staging_lease
    whole_lease_identity: _rh_lease_rec
    prospective_staging: _rh_rsv_stage
    admitted_phase: _rh_n13_phase
    admitted_effect_context: _rh_n13_effect
  consumers:
  - existing_obligation_transaction
  - later_route_helpers_only_where_consumed
  reserved_outputs:
  - rh_staging_lease
  - _rh_lease_rec
  - _rh_rsv_stage
  - _rh_n13_phase
  - _rh_n13_effect
  identity_prefix:
    packet_path: packet/source/testing/remote_harness/tasks/reap_staging.yml
    read_only_through_line: 702
    effects_begin_line: 704
