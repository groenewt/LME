schema_version: 1
kind: existing_engine_source_integration
role: execution_context_producer
id: C1-EC-SOURCE-INTEGRATION
status: authored_unapplied
main_owns: source integration and commits
no_credit: [source_adoption, execution, product_tests]

ordered_integration:
  - id: I1-PAIRED-PROFILE-GLOBAL
    owners: [lineage-rh, lineage-global]
    apply: [candidates/c1/profile-join.yaml, candidates/c1/global-join.yaml]
    atomic: true
    why: the profile node is refused typed until the matching contract exists; the contract is vacuous until the profile node exists
    do_not: whole-file replace of remote-harness.yml or global.yml
    preserve_concurrent: N13 n10.write_bound subtree

  - id: I2-LOADER
    owners: [C1]
    apply: candidates/c1/loader-join.yaml
    implementation: none
    verify_after_I1: contract_admission admits run_local.execution_context with generic kinds; resolve does not emit it into lme_resolved

  - id: I3-ROUTE-SEED
    owners: [route]
    join: J-FW09-SEED
    current_base:
      file: testing/remote_harness/templates/macros/controller_seed.j2
      packet_sha256: c0defae34491c7f2111f6cc2996a857ce9cdca2846dbc7ac1cc6cee11a0f5893
      not_base: life6 b03b2e1a63989d2035622cadf44a1e22b07fbe219010b9c38fbc57a4f665882a
    already_satisfied_by_I1:
      - reserved_name_globs refusal of untyped lme_execution_context (seed case on cv.reserved_name_globs)
    still_owed:
      - typed_json ingress distinct from caller_vars; do not weaken unrelated extra-var admission
      - validate fields, occurrence_fields, allocation_modes, cell/source/configuration relationship
      - forward admitted value under lme_execution_context
      - declare exact protected argument position without making both context and resolved_run the literal last argument
      - retain source-record / resolved-run last-writer and collision checks
      - never allocate run/attempt
      - include execution_context.var in extra_var_admission derived protected top-level names (currently companions var + envelope transport var)
    collision_existing: seed already refuses run_local.resolved_run.var colliding with bootstrap record name

  - id: I4-ROUTE-GATE
    owners: [route]
    join: J-FW09-GATE
    historical_pair:
      decl: packet/source/route/testing/e2e/gate/gate.decl.yml
      decl_sha256: 1e1cb8d6cde76b6f6a798bd12ed2920cef454f47d0844a1ca19372f4e803b41a
      macro: packet/source/route/testing/e2e/gate/templates/macros/gate.j2
      macro_sha256: ae264da76be5a5076a3a9f47efafea4007395c5f557c8c2f41434a89c298c17e
      edition: s08
      state: frozen_and_superseded_for_acceptance_use
    s08_observed:
      descriptor_keys: [dir_from, prefix_from, suffix, fields, roles, artifact_fields, pending]
      pending: {binding: J-ROUTE-RUN-ATTEMPT-ABSENT, locator: J-FW6-GATE-LOCATOR}
      location: <logs.dir_env>/<transfer.outputs.prefix><LABEL><suffix>
      gaps: [GAP-807-01 LABEL-shared RESULTS digest, GAP-807-02 no-results refusal, GAP-807-03 no-clobber second descriptor]
    successor_s09_owed:
      - fill binding and locator from the transported execution_context
      - replace dir_from LABEL-shared location with locator per-invocation output scope
      - hash finalized bytes of that invocation only
      - preserve earlier logs; do not truncate a shared append log
      - keep standalone entrypoint; without context the output is diagnostic
    do_not: treat s08 as current acceptance producer; do not rebase on life6 seed

  - id: I5-MATRIX-G
    owners: [matrix]
    join: J-FW09-ACC
    current_g_packet:
      run_acceptance: packet/source/g/testing/acceptance/run_acceptance.yml
      run_acceptance_sha256: ffbeaabdc63db4f6a5610e7487587aecdf2769c7c50c5ddbad7d570243cdc571
      cell_binding: packet/source/g/testing/acceptance/cell_binding.yml
      cell_binding_sha256: b6d5b4afc0edb6e65c232b6d507ec8953a12fc1fd8bca7736cedbd01ce214ca0
      binding_decl: packet/source/g/testing/acceptance/ACCEPTANCE-BINDING.decl.yml
      binding_decl_sha256: 3b6d4b9f94a29c295b8685dc232c5cf0fc861c39d03ca9afea338aec3f98cead
      one_case: packet/source/g/testing/acceptance/one_case_acceptance.yml
      one_case_sha256: 843ce151cfa246554eea3984cf4c38a6b519b14beb1c862452faa29723f1f64b
    g18_stale:
      id: G18-DESC-KEYS-STALE
      reads: route_keys.dir_rel
      s08_has: dir_from
      binding_join: pending J-ROUTE-RUN-ATTEMPT-ABSENT
      locator_type_was: list of strings as resolved-contract key path (FW06)
      locator_type_now: string per-invocation output scope from context
      occurrence_type_was: string or null
      occurrence_type_now: '{path, sha256} or null'
      resolved_run_fields_copy: ACCEPTANCE-BINDING still lists [runner, work_root, ansible_playbook, python, env, receipt]; current profile has nine fields; G must follow the profile node, C1 does not rewrite resolved_run
    owed:
      - compare transported context to the expected request (same five fields) and the admitted cell
      - read exactly the descriptor artifact at locator
      - required matrix cells refuse missing/malformed context without shrinking the expected matrix
      - standalone/G01/bootstrap remain optional-absence
    this_producer_does_not_edit: G files

bindings_for_disjoint_owners:
  C1_to_route:
    declaration_path: controller.bootstrap.work_roots.run_local.execution_context
    var: lme_execution_context
    ingress_form: typed_json
    reserved_glob: lme_execution_context
    position: route_declares
  C1_to_matrix:
    fields: [run, attempt, cell, occurrence, locator]
    occurrence_fields: [path, sha256]
    required_when: absence.refused_on matrix_acceptance
    optional_when: absence.optional_on
    artifact_at: locator
  route_to_matrix:
    same_context_object: true
    descriptor_from_context: true
  matrix_to_route:
    expected_request: allocator/projector supplies the five fields for required cells before activation
    no_runtime_discovery_shrink: true

not_prerequisites:
  - FW09 is not a universal first-generation gate
  - G01/bootstrap do not gain a matrix-context requirement by this declaration
  - HBP/guest host-binding remains a different unit
  - N13 write_bound remains independently editable

controls_declared_unexecuted:
  - FW09-CTL-01
  - FW09-CTL-02
  - FW09-CTL-03
  - FW09-CTL-04
  - FW09-CTL-05
  - FW09-CTL-06
  - FW09-CTL-07
  - FW09-CTL-08
  - FW18-CTL-01
  - FW18-CTL-02
  - FW18-CTL-03
