findings:
  - id: SYN-01
    class: syntax
    severity: block_apply
    files:
      - derived/c1/execution-context-contract.yaml
      - derived/c1/loader-join.yaml
      - derived/c1/producer-author.yaml
    what: "Three frozen outputs are not YAML. Semantic intent was still read in full."
  - id: TYP-01
    class: runtime_payload_untyped
    severity: block_complete_contract
    what: >-
      The profile node authored by FW09-RH-01-CURRENT is a field-name sketch. It declares var, fields,
      occurrence_fields, allocation_modes, allocation_owner, ingress form/flag_from/distinct_from, and
      absence lists. It does not declare runtime field_kinds, patterns, exact payload key set of the
      extra-var value, or JSON wrapping. execution-context-contract field_contract uses type string and
      mapping_or_null in prose keys; mapping_or_null is not a struct_kind_tests word. Global
      run_local_execution_context checks admit the declaration node only (keys/enum/pattern/not_in/includes).
      That is not a typed runtime contract for template consumers.
    evidence:
      - "packet/source/upstream/manifests/profiles/remote-harness.yml resolved_run.field_kinds and field_sources at 4244-4245; seed c0defae3 run_local_exec builds JSON from those words"
      - "derived/c1/profile-join.yaml insert has fields names only, no field_kinds"
      - "derived/c1/global-join.yaml path fields enum of the name list, not payload kinds"
      - "packet/source/upstream/manifests/profiles/remote-harness.yml struct_kind_tests words are bool, int, str, float, mapping, list, null"
  - id: TYP-02
    class: occurrence_nullability_and_grammar
    severity: block_complete_contract
    what: >-
      809 requires a real consume/custody occurrence by recorded path and digest, else null, never invented.
      G18 still types occurrence as string or null and locator as a list of strings. The producer names
      occurrence_fields path and sha256 and says unsupervised is null, but the engine YAML has no payload
      rule that occurrence is either null or exactly those two keys, no sha256_hex pattern, and no path
      grammar. Without those rows, route and G must hardcode FW06/G18 types.
    evidence:
      - "packet/authority/809.yaml 76-78"
      - "packet/source/g/testing/acceptance/ACCEPTANCE-BINDING.decl.yml types.binding and types.locator at 717-721"
      - "packet/source/upstream/manifests/global.yml contract_admission.patterns.sha256_hex"
  - id: TYP-03
    class: fresh_resume_not_yaml_semantics
    severity: block_complete_contract
    what: >-
      809 requires allocation and resume semantics in YAML. The producer lists allocation_modes and owner
      caller, then describes fresh and resume in English under field_contract.attempt. There is no YAML
      for which identities are new versus recorded, what recorded context is compared, or which conflicts
      refuse. That is still a name list, not implementable resume law.
    evidence:
      - "packet/authority/809.yaml 73-75"
      - "derived/c1/execution-context-contract.yaml field_contract.attempt fresh/resume prose"
      - "derived/c1/profile-join.yaml allocation_modes list only"
  - id: TYP-04
    class: locator_artifact_reader_scope
    severity: block_complete_contract
    what: >-
      Distinctions required by 809 OPEN-807-DIR-REL and FW09 artifact law are only in contract prose.
      locator is producer-owned per-invocation output scope and a context field. artifact_digest is not in
      context; it hashes finalized bytes of that invocation. The reader reads exactly that artifact and
      refuses cross-attempt substitution. Profile/global YAML declare locator as a name in fields and do
      not declare artifact-side path/sha256, finalized-bytes hashing, or reader comparison keys. G still
      joins dir_rel and treats locator as a resolved-contract key path list.
    evidence:
      - "packet/authority/809.yaml 87-96"
      - "packet/authority/fw09.yaml contract.semantics locator and artifact"
      - "packet/source/g/testing/acceptance/one_case_acceptance.yml _gr_loc dir_rel join at 95-96"
      - "packet/source/route/testing/e2e/gate/gate.decl.yml results.descriptor dir_from at 282-289"
  - id: TYP-05
    class: ingress_flag_and_json_realization
    severity: block_complete_contract
    what: >-
      flag_from as the path work_roots/run_local/arg_flags is the existing extra-vars flag owner (s68 4076
      arg_flags, genesis extra_vars_flag '-e' as a member, seed uses arg_flags first word). 812 forbids
      assuming structured context fits caller_vars. caller_vars forms are name_eq_value and json_single_key
      with no nesting, so occurrence as a mapping cannot pass that grammar. The producer says typed_json
      and distinct_from caller_vars, which is the right split, but does not declare the extra-var wrapping
      '{<var>: <payload>}' used for lme_resolved_run, whether @file is admitted, or the exact payload key
      set and kinds inside that JSON. Route would have to invent the realization.
    evidence:
      - "packet/authority/812.yaml 29-32"
      - "packet/source/upstream/manifests/profiles/remote-harness.yml caller_vars.forms at 4080-4082"
      - "packet/source/route/testing/remote_harness/templates/macros/controller_seed.j2 lme_resolved_run JSON at 2303-2305"
  - id: TYP-06
    class: cell_source_configuration_unnamed
    severity: block_complete_contract
    what: >-
      812 requires validation of source/configuration/cell relationships. The contract admits a dangling
      name cell_to_admitted_source_configuration that is not a profile key. G already has expected row
      identity, dimensions, configuration_sha256, and configuration_revision. The producer does not name
      those existing comparison keys, so matrix/route would guess the join.
    evidence:
      - "packet/authority/809.yaml 59-60"
      - "packet/authority/812.yaml 29-30"
      - "packet/source/g/testing/acceptance/ACCEPTANCE-BINDING.decl.yml expected.f identity/dimensions/configuration_* at 360-368"
      - "packet/source/g/testing/acceptance/cell_binding.yml full cell identity at 360-374"
  - id: TYP-07
    class: protected_name_derivation_unauthored
    severity: block_complete_contract
    what: >-
      s68 extra_var_admission states that protected top-level names are derived by C1 from companions var
      and the envelope transport var, not listed in the profile node. texts.protected already refuses a
      protected top-level key. The producer correctly requires adding execution_context.var to that
      derived set, then assigns the work to route consuming a C1 declaration. No scoped YAML operation
      actually extends the C1 derivation sources. reserved_name_globs (RH-02) is a different screen, the
      run-local untyped caller-var glob consumed by the current seed.
    evidence:
      - "packet/source/upstream/manifests/profiles/remote-harness.yml 3702-3703 and texts.protected at 3804"
      - "derived/c1/execution-context-contract.yaml extra_var_admission_protected"
      - "derived/c1/source-integration.yaml I3 still_owed last bullet"
  - id: OK-01
    class: s68_anchor_and_paired_root
    severity: keep
    what: >-
      FW09-RH-01's historical insert_after remote_tmp_env is interior to s68 resolved_run (remote_tmp_env
      at 4202, after env_value, before generation_role_from). Inserting there would add keys to
      resolved_run and break the nine-member fields enum. The authored sibling insert after unique
      capture_check.texts.open_or_invocation at 4295 and before the runners comment at 4296 is the closed
      resolved_run boundary. Indent matches resolved_run. RH-02 unique reserved_name_globs line 4090
      matches. Global C1-EC-GL-SCHEMA unique splice after run_local_capture_check texts pattern at 3840
      and before C1-SR323-OP1 at 3841 is valid; the same texts pattern at 4929 is a different contract.
      FW09-GL-02 unique public-inputs comment at 7452 matches.
  - id: OK-02
    class: fw18_envelope_withdrawn
    severity: keep
    what: >-
      FW09-RH-03 and FW09-GL-01 are withdrawn. s68 genesis.launch.envelope remains resolved_run only at
      2719. r55 envelope keys remain resolved_run only at 5442-5444. source-record lookup_merge stays
      envelope_fields.record. Caller-input option is the adopted 812 decision.
  - id: OK-03
    class: resolved_run_exact_keys_and_override_last
    severity: keep
    what: >-
      Current fields enum is nine members including generation_role, capture, serving_scope. Producer
      preserves that set and receipt_fields. Global already pins the nine-member enum at 4682. Merge
      remains base then profile then lme_global_override last. G ACCEPTANCE-BINDING still copies the old
      six-field set; producer correctly leaves that to G and does not rewrite resolved_run.
  - id: OK-04
    class: reservation_split
    severity: keep
    what: >-
      Public typed ingress, reserved glob on the canonical var, producer output as admitted value under
      that var, and consumer input via var not_in reserved_outputs and resolver_outputs are the right
      four-way split. not_in semantics from engine-sr922 compare the var string against those registry
      lists plus reserved_output_patterns; they do not add the name to reserved_outputs. includes on
      reserved_name_globs requires a list subject and membership, which that node is. lme_invocation_context
      stays a resolver output; lme_execution_context must not.
  - id: OK-05
    class: loader_noop_and_native_r16d_r34
    severity: keep
    what: >-
      Native invocation_context.yml r16d plus defaults lme_invocation_words and global r34
      invocation_context.words.fs_observe.domains are the early PCTX capture record. resolve.yml includes
      that producer before global consumption. Execution context is outside desired-configuration merge.
      Loader join correctly forbids defaults/PCTX/resolver_outputs extension, a second merge engine, and
      the unrelated FW6 lme_inputs call-site. Generic contract_admission kinds already include keys, enum,
      pattern, includes, not_in. at versus path evaluation matches engine-sr922 (at is absolute; empty
      path is the contract root). No run_local root closed keys check exists, so a typed sibling mapping
      is schema-admissible once the new contract exists. This does not make the payload typed.
  - id: OK-06
    class: seed_edition
    severity: keep
    what: >-
      Current seed is c0defae3, not life6 b03b2e1a. Observed run_local order is screened caller extra-vars,
      work_root_var, pinned_vars JSON, entry_verify/source_admit, then lme_resolved_run JSON commented LAST.
      Normal-run order rebuilds admitted caller words, appends receipt and rh_source_bootstrap, then
      run_pins_json with a comment that nothing follows it. FW18-ORDER is respected; C1 does not claim both
      context and resolved_run are the literal last argument. Seed already screens reserved_name_globs,
      so RH-02 needs no seed edit for untyped override refusal. Typed ingress and protected position remain
      route-owed after a complete declaration.
  - id: OK-07
    class: historical_s08_pair
    severity: keep
    what: >-
      gate.decl 1e1cb8d6 plus gate.j2 ae264da7 are the frozen s08 pair. results.descriptor uses dir_from,
      prefix_from, suffix, fields, roles, artifact_fields, pending binding J-ROUTE-RUN-ATTEMPT-ABSENT and
      locator J-FW6-GATE-LOCATOR. Location is LABEL-shared. lifecycle-06 already supersedes that pair for
      acceptance use. Producer treats s08 as historical and s09 as route-owed. Correct.
  - id: OK-08
    class: g18_stale_joins
    severity: keep_open_on_matrix
    what: >-
      G18-DESC-KEYS-STALE is accurate. Frozen G indexes route_keys.dir_rel; s08 has dir_from. one_case
      composes work/dir_rel/name+suffix. ACCEPTANCE-BINDING resolved_run.fields is still the six-field
      copy. locator_type_was list of strings as resolved-contract key path; occurrence_type_was string or
      null; $_ev plus GEN_ID pairing is superseded. These remain G successor debt after a complete C1
      field contract. They are not false passes.
  - id: OK-09
    class: absence_and_non_invention
    severity: keep
    what: >-
      Absence optional_on standalone_diagnostic, g01, bootstrap and refused_on matrix_acceptance matches
      FW18-SCOPE and 812. Not a bootstrap prerequisite. No new first-generation gate. No invented
      supervised occurrence. Standalone remains diagnostic, never matrix acceptance. Required missing
      context cannot shrink the expected matrix. Native lme_invocation_context, guest invocation_id,
      GEN_ID, and LABEL stay unequated.
  - id: OK-10
    class: generic_kind_semantics
    severity: keep
    what: >-
      Proposed schema rows use implemented kinds with correct path/at meaning. keys is exact set
      equality. enum is type-exact. pattern var_name matches registry. not_in reads schema lists.
      includes is list membership. Cross-root at checks pin resolved_run.var, resolved_run.fields, and
      reserved_name_globs without rewriting those nodes. Loader implementation_operations none is
      consistent with that reuse.
  - id: OK-11
    class: n13_disjoint
    severity: keep
    what: >-
      No operation under controller.entry_generation.render.n10.write_bound. Current N13 subtree remains
      independently editable.
  - id: WARN-01
    class: exact_keys_would_freeze_sketch
    severity: do_not_apply_I1_yet
    what: >-
      The proposed contract keys row is an exact key set. Landing I1 now would admit the name-only node
      and then refuse later field_kinds, occurrence payload grammar, allocation semantics, and artifact
      rows until another paired profile/global edit. Add those keys in this producer correction before
      lineage apply.

scope:
  this_review: "Independent source review of frozen C1 FW09/FW18 producer candidates against the approved packet."
  in_scope:
    - "paired declaration, schema, input-reservation joins in the existing engine"
    - "typed runtime payload interface route and matrix later consume"
    - "s68/r55 anchors, seed c0defae3 versus life6, s08 historical pair, G18 consumer law"
  out_of_scope:
    - "route seed/gate executable bodies"
    - "G/matrix allocator/projector/consumer executable bodies"
    - "syntax-repair rewrite of the frozen files"
    - "source adoption, product tests, runtime acceptance"
  subsequent_owners:
    route:
      - J-FW09-SEED
      - J-FW09-GATE
      - PROTECTED-ARGV-INDEX
    matrix:
      - J-FW09-ACC
      - G18-DESC-KEYS-STALE
      - G-RESOLVED-RUN-FIELDS-COPY
    n13:
      - N13-WRITE-BOUND

minimum_repair:
  owner: execution_context_producer
  apply_with: "paired profile-join plus global-join plus contract file; quote flow mappings so all six parse"
  do_not:
    - "land I1 on the name-only node"
    - "require route or G bodies as a completeness gate"
    - "add a second merge engine or loader/PCTX edits"
    - "re-apply withdrawn envelope operations"
    - "insert execution_context inside resolved_run"
    - "treat s08 or life6 as current acceptance bases"
  add_to_existing_profile_node:
    - key: field_kinds
      value: "run, attempt, cell, locator each str from struct_kind_tests; occurrence is not a single kind"
    - key: payload
      value: "exact keys run, attempt, cell, occurrence, locator; wrapping one extra-var '{<var>: <payload>}' using arg_flags first word, distinct_from caller_vars"
    - key: occurrence
      value: "unsupervised null; supervised mapping with exact keys path, sha256; sha256 pattern sha256_hex; path a declared existing path grammar, never invented"
    - key: allocation
      value: "owner caller; modes fresh and resume; fresh issues new run and attempt and refuses GEN_ID, LABEL, timestamp_from_later_reader, local_occurrence_counter; resume uses the recorded five-field mapping of that attempt and refuses incomplete or conflicting recorded state"
    - key: locator
      value: "string producer-owned per-invocation output scope; not dir_from, dir_rel, or a resolved-contract key path list"
    - key: artifact
      value: "not in context; descriptor output path and sha256 of finalized bytes of that invocation only; reader reads exactly that artifact and compares locator plus digest across attempts"
    - key: cell_compare
      value: "cell admits existing G expected identity/dimensions against the C1 resolved cell; source/configuration compare expected configuration_sha256 and configuration_revision; do not invent a new identity scheme"
    - key: extra_var_admission_protected_sources
      value: "C1-authored derivation sources become companions var, envelope transport var, and execution_context.var; do not rewrite texts.protected"
  add_to_existing_global_contract:
    - "extend run_local_execution_context keys to the new profile keys in the same atomic splice"
    - "enum/pattern/includes/not_in rows for field_kinds words, occurrence null-or-mapping, sha256_hex, allocation mode lists, artifact in_context false"
    - "keep at-rows that pin resolved_run nine fields, envelope resolved_run only, reserved_name_globs includes both names, and var not_in reserved_outputs and resolver_outputs"
  keep_unchanged:
    - FW09-RH-02
    - FW09-RH-01-CURRENT_sibling_anchor
    - C1-EC-GL-SCHEMA_splice_point
    - FW09-GL-02
    - withdrawn FW09-RH-03 and FW09-GL-01
    - loader implementation_operations none
    - N13 non-edit
    - current seed hash c0defae3 as route base
    - s08 pair as historical superseded gate base

ownership_after_repair:
  caller: "allocates run, attempt, and admitted cell; fresh versus resume"
  route: "typed_json transport, protected argv position, last-writer and collision, forwards admitted value under lme_execution_context, s09 descriptor publication from the same context"
  producer_result_scope: "locator value for that invocation; earlier logs preserved; shared append log never truncated to pass"
  finalized_artifact: "descriptor sha256 of that invocation's finalized bytes; not a context input"
  reader: "compares transported context to expected request and the exact artifact at locator; cross-attempt substitution refuses; required missing context does not shrink expected matrix"
  standalone: "optional absence; diagnostic only; unchanged G01/bootstrap"

controls_declared_unexecuted:
  - id: FW09-CTL-01
    text: "repeated same-label invocations each get their own locator and artifact; neither reads the other"
    executed: false
  - id: FW09-CTL-02
    text: "interrupted publication then resume uses recorded context; incomplete state is detected"
    executed: false
  - id: FW09-CTL-03
    text: "cross-attempt artifact substitution refuses"
    executed: false
  - id: FW09-CTL-04
    text: "resume with a conflicting recorded context refuses"
    executed: false
  - id: FW09-CTL-05
    text: "a caller extra-var setting lme_execution_context directly refuses before any effect"
    executed: false
  - id: FW09-CTL-06
    text: "standalone gate without context keeps admission; output diagnostic, never acceptance"
    executed: false
  - id: FW09-CTL-07
    text: "required acceptance run with missing context or missing output refuses; expected matrix is not reduced"
    executed: false
  - id: FW09-CTL-08
    text: "lme_resolved_run exact-set consumers pass unchanged with the context present"
    executed: false
  - id: FW18-CTL-01
    text: "structured context through typed ingress is admitted; malformed refuses before any effect"
    executed: false
  - id: FW18-CTL-02
    text: "a caller argument after the declared protected position cannot override the context or resolved_run"
    executed: false
  - id: FW18-CTL-03
    text: "a G01 / bootstrap operation without a context runs unchanged"
    executed: false
  executed_count: 0
  note: "Declaring these controls is not execution. None is a runtime pass."

downstream_implementation:
  may_start: false
  why: >-
