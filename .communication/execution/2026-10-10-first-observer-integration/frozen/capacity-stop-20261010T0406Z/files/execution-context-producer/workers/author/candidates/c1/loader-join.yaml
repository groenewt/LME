schema_version: 1
kind: existing_engine_loader_join
role: execution_context_producer
id: C1-EC-LOADER
status: no_implementation_operations
qualification: observation of packet loader sources; generic schema already suffices

observed_loader:
  resolve_yml:
    packet_path: packet/source/upstream/ansible/roles/podman/tasks/resolve.yml
    sha256: c19dc1a56306a0a836ea5a5b7a48e01b2b7766886adedc7926310abb2db2cd31
    includes: invocation_context.yml before global consumption
  invocation_context_yml:
    packet_path: packet/source/upstream/ansible/roles/podman/tasks/invocation_context.yml
    sha256: bb8111765a024cbfc414024bb4edfc398d84737e13044481c2953a3ff0c46fb9
    produces: lme_invocation_context
  defaults_main:
    packet_path: packet/source/upstream/ansible/roles/podman/defaults/main.yml
    sha256: 670a9962eb5fd29de8df23ec83fe3d8cf3a81817367b0ede5160f6b873aaf102
    early_inputs: [lme_invocation_mode, lme_invocation_lease, lme_invocation_controller, lme_invocation_anchor, lme_invocation_capture_rel, lme_invocation_root, lme_invocation_owner, lme_invocation_temp_rel, lme_invocation_words]
  engine_observation:
    packet_path: packet/observations/engine-sr922.yaml
    sha256: 184d5533d96a28fb999fb8d4182b1679904594146f9cd73f8ab8eb4f39fb68bf
    generic_kinds: packet/observations/engine-sr922.yaml notes _RH_CA_KINDS including keys, enum, pattern, includes, not_in
    contract_eval: dotted = chk['at'] if 'at' in chk else join(root, path); subject from policy unless registry: true

decision:
  implementation_operations: []
  reason:
    - 809 :71-72 keeps this operational context outside desired-configuration resolution; resolve.yml must not merge lme_execution_context into lme_resolved
    - contract_admission is generic; the new run_local_execution_context contract uses only already-implemented kinds
    - run_local has no closed keys check at the run_local root, so a typed sibling mapping is admissible once the new contract exists
    - lme_execution_context is a launcher extra-var, not a resolver output and not an early PCTX input
    - native lme_invocation_context remains the leased/ordinary capture record; adding execution context as a PCTX input would equate the two
  forbidden_inventions:
    - no second merge engine
    - no lme_inputs default({}) repair in this join (809 FW6-SEAT-LME-INPUTS-CALLSITE is a different boundary; current packet resolve.yml has no lme_inputs | default({}) match)
    - no defaults/main.yml lme_execution_context role default
    - no invocation_context.yml field or words extension
    - no resolver_outputs append of lme_execution_context

explicit_non_operations:
  - {file: ansible/roles/podman/tasks/resolve.yml, op: none, why: generic schema plus stay-outside-resolution}
  - {file: ansible/roles/podman/tasks/invocation_context.yml, op: none, why: distinct native invocation context}
  - {file: ansible/roles/podman/defaults/main.yml, op: none, why: no new bootstrap/PCTX prerequisite}
  - {file: ansible/roles/podman/filter_plugins/lme_manifests.py, op: none, why: observed generic _rh_ca_check already implements required kinds}

required_loader_invariants_after_schema_land:
  - lme_global combine order remains global | profile | lme_global_override LAST
  - lme_resolved_run exact fields enum unchanged
  - lme_invocation_context still produced only by invocation_context.yml
  - a pin of lme_execution_context as a resolver output remains refused by not_in
  - desired-configuration resolution does not allocate run/attempt/cell/occurrence/locator

route_seed_already_generic_for_reservation:
  fact: controller_seed.j2 screens caller extra-var names against rl.caller_vars.reserved_name_globs
  consequence: FW09-RH-02 does not require a seed edit for the untyped override refusal
  remaining_route_implementation: typed_json ingress, field validation, protected position, forwarding under the canonical var
