schema_version: 1
kind: existing_engine_global_join
role: execution_context_producer
id: C1-EC-GLOBAL-R55
target:
  product_path: manifests/global.yml
  packet_path: packet/source/upstream/manifests/global.yml
  sha256: d761a5c594cd8d2d336bdacae7659de7534178fe2ac5789c95aee5787283eada
  edition: r55
owner: lineage-global applies these scoped operations; C1 authors them
join: J-FW09-GL
applies: [C1-EC-GL-SCHEMA, FW09-GL-02]
withdrawn: [FW09-GL-01]
preserve:
  - genesis.launch.envelope keys [resolved_run]
  - envelope.resolved_run within run_local.resolved_run.var
  - run_local.resolved_run.fields enum of nine members
  - n10.write_bound enum (N13)
  - merge order base then profile then lme_global_override LAST
  - invocation_context words and resolver_outputs membership of lme_invocation_context

operations:
  - id: C1-EC-GL-SCHEMA
    op: insert_between
    purpose: admit the new run_local.execution_context mapping with existing contract_admission kinds; no loader code
    contract_home: lme_config_registry.remote_harness_schema.contract_admission.contracts
    insert_after_contract: run_local_capture_check
    observed_anchor_line: 3840
    unique_splice:
      after_line: "            - {path: texts, each: true, pattern: text_line}"
      before_line: "        # C1-SR323-OP1 (G first-operation-03 OP-0 / OP-1; codex 822 B-E2 X1-X4; codex 630 OD-FR1-01): the external invocation"
      why: '{path: texts, each: true, pattern: text_line} also occurs at global :4929; the following C1-SR323-OP1 comment makes this splice unique'
    before:
      composed_text: "            - {path: texts, each: true, pattern: text_line}"
    insert:
      - "        # C1 records-c1-framework-09 / -18 (Codex 809/812): execution_context sibling of resolved_run."
      - "        # FW18-ENVELOPE: not genesis.launch.envelope. Generic kinds only; outside desired-configuration merge."
      - "        run_local_execution_context:"
      - "          root: controller.bootstrap.work_roots.run_local.execution_context"
      - "          checks:"
      - "            - {path: '', keys: [absence, allocation_modes, allocation_owner, fields, ingress, occurrence_fields, var]}"
      - "            - {path: var, pattern: var_name}"
      - "            - {path: var, enum: [lme_execution_context]}"
      - "            - {path: var, not_in: [reserved_outputs, resolver_outputs]}"
      - "            - {path: fields, enum: [[run, attempt, cell, occurrence, locator]]}"
      - "            - {path: occurrence_fields, enum: [[path, sha256]]}"
      - "            - {path: allocation_modes, enum: [[fresh, resume]]}"
      - "            - {path: allocation_owner, enum: [caller]}"
      - "            - {path: ingress, keys: [distinct_from, flag_from, form]}"
      - "            - {path: ingress.form, enum: [typed_json]}"
      - "            - {path: ingress.flag_from, enum: [[work_roots, run_local, arg_flags]]}"
      - "            - {path: ingress.distinct_from, enum: [caller_vars]}"
      - "            - {path: absence, keys: [optional_on, refused_on]}"
      - "            - {path: absence.optional_on, enum: [[standalone_diagnostic, g01, bootstrap]]}"
      - "            - {path: absence.refused_on, enum: [[matrix_acceptance]]}"
      - "            - {at: controller.bootstrap.work_roots.run_local.resolved_run.var, enum: [lme_resolved_run]}"
      - "            - {at: controller.bootstrap.work_roots.run_local.resolved_run.fields, enum: [[runner, work_root, ansible_playbook, python, env, receipt, generation_role, capture, serving_scope]]}"
      - "            - {at: controller.bootstrap.work_roots.run_local.caller_vars.reserved_name_globs, includes: [lme_resolved_run, lme_execution_context]}"
    after_unchanged:
      composed_text: "        # C1-SR323-OP1 (G first-operation-03 OP-0 / OP-1; codex 822 B-E2 X1-X4; codex 630 OD-FR1-01): the external invocation"
    keys_order_note: contract `keys` is exact and sorted-compare is not required of the mapping; the listed key set is exact for the profile node
    schema_kinds_used: [keys, pattern, enum, not_in, includes]
    loader_code_change: false

  - id: FW09-GL-02
    op: replace_line
    purpose: name lme_execution_context with lme_resolved_run as a public INPUT that stays not reserved (consumer-input side)
    path: manifests/global.yml
    observed_line: 7452
    before:
      composed_text: "    # lme_resolved_run) are INPUTS and stay NOT reserved."
    after:
      composed_text: "    # lme_resolved_run, lme_execution_context) are INPUTS and stay NOT reserved."
    preceding_context:
      - "    # public inputs (repo_root, cases_file, run_label, probe_ansible_playbook, expected_runner_ansible_core,"
      - "    # expected_probe_ansible_core, expected_probe_python_executable, expected_probe_python_version, run_mode,"
      - "    # source_commit, baseline_commit, interpreter_policy, managed_interpreter_root, managed_bootstrap_receipt,"
      - "    # managed_bootstrap_receipt_sha256, managed_bootstrap_review, managed_bootstrap_review_sha256, work_root,"
    machine_check: run_local_execution_context path var not_in [reserved_outputs, resolver_outputs]
    not: add lme_execution_context to reserved_outputs or resolver_outputs

withdrawn_operations:
  - id: FW09-GL-01
    status: withdrawn_by_FW18-ENVELOPE
    would_have_changed:
      - "{path: envelope, keys: [resolved_run]} -> keys: [execution_context, resolved_run]"
      - added envelope.execution_context pattern/within rows
    current_observed:
      lines: [5442, 5443, 5444]
      composed_text:
        - "            - {path: envelope, keys: [resolved_run]}"
        - "            - {path: envelope.resolved_run, pattern: var_name}"
        - "            - {path: envelope.resolved_run, subject: scalar, within: [controller.bootstrap.work_roots.run_local.resolved_run.var]}"
    action: do_not_apply

do_not_edit:
  - n10.write_bound
  - invocation_context
  - resolver_outputs membership of lme_invocation_context
  - genesis.launch path '' keys closed set (envelope stays resolved_run only)
  - source_record_envelope lookup_merge
