schema_version: 1
kind: existing_engine_execution_context_contract
role: execution_context_producer
id: C1-EC-FW09-FW18
status: authored_unapplied
qualification: packet-source declaration/schema join only; no source adoption; no runtime acceptance
editions:
  fw09: {packet_path: packet/authority/fw09.yaml, sha256: d4698dc53260f6871b6d762679caeab02e819c62b18c27b16413a98e61b4a791}
  fw18: {packet_path: packet/authority/fw18.yaml, sha256: 937b829bf2f8e977cfdc72111be88f5dffb3955e1691f183f26bdc7b437f7961, amends: fw09}
  tick809: {packet_path: packet/authority/809.yaml, sha256: 4d17d02d2d7fa3b44bcef8e771c282191334e4b3d6cb50be2bb84fd6cd2a2435}
  tick812: {packet_path: packet/authority/812.yaml, sha256: f3e162d1acb83ca0f55b7a31eae38a232c1b59c17d00a71a1dba5e09056042d3}
  profile_s68: {packet_path: packet/source/upstream/manifests/profiles/remote-harness.yml, sha256: a4e910a9077c56f799e779e013cd718a2cd3bc06fedabb706cebb0614335486e}
  global_r55: {packet_path: packet/source/upstream/manifests/global.yml, sha256: d761a5c594cd8d2d336bdacae7659de7534178fe2ac5789c95aee5787283eada}
  seed_current: {packet_path: packet/source/route/testing/remote_harness/templates/macros/controller_seed.j2, sha256: c0defae34491c7f2111f6cc2996a857ce9cdca2846dbc7ac1cc6cee11a0f5893}
  seed_life6_historical: {sha256: b03b2e1a63989d2035622cadf44a1e22b07fbe219010b9c38fbc57a4f665882a, use: not_current}
  gate_s08_decl: {packet_path: packet/source/route/testing/e2e/gate/gate.decl.yml, sha256: 1e1cb8d6cde76b6f6a798bd12ed2920cef454f47d0844a1ca19372f4e803b41a}
  gate_s08_j2: {packet_path: packet/source/route/testing/e2e/gate/templates/macros/gate.j2, sha256: ae264da76be5a5076a3a9f47efafea4007395c5f557c8c2f41434a89c298c17e}
supersession:
  - {id: FW18-NAME, closes: OD-FW09-VAR-NAME, now: lme_execution_context is the C1-authored canonical var at controller.bootstrap.work_roots.run_local.execution_context.var; Codex 812 :14-20 adopted it}
  - {id: FW18-ENVELOPE, closes: OD-FW09-ENVELOPE, now: caller-input option; FW09-RH-03 and FW09-GL-01 withdrawn; genesis.launch.envelope and source-record projection stay {resolved_run: lme_resolved_run}}
  - {id: FW18-ORDER, now: exact protected argument position is route-owned; this contract forbids claiming both execution_context and resolved_run are the literal last argument}
  - {id: FW18-SCOPE, now: absence optional on standalone diagnostic/G01/bootstrap; refused only on matrix-context-required acceptance; not a bootstrap prerequisite}

canonical:
  node: controller.bootstrap.work_roots.run_local.execution_context
  placement: sibling of run_local.resolved_run
  var: lme_execution_context
  fields: [run, attempt, cell, occurrence, locator]
  occurrence_fields: [path, sha256]
  allocation_modes: [fresh, resume]
  allocation_owner: caller
  engine: existing_manifest_loader_and_launcher
  outside_desired_configuration: true

field_contract:
  run:
    type: string
    owner: caller
    provenance: [GATE-S08 :280, ACC-S13 :84, 809 :73-75]
    not: [GEN_ID, LABEL, timestamp_from_later_reader, local_occurrence_counter]
  attempt:
    type: string
    owner: caller
    provenance: [GATE-S08 :280, 809 :73-75]
    fresh: own identity for this invocation
    resume: recorded context of that attempt; incomplete or conflicting recorded state refuses
    not: [GEN_ID, LABEL, attempt_id]
  cell:
    type: string
    owner: caller_admits_existing_identity
    provenance: [809 :59-60 C1 resolved record cell identity, G cell_binding full declared identity]
    compares_to: matrix expected request / expected snapshot row identity
    not: [cell_id]
  occurrence:
    type: mapping_or_null
    occurrence_fields: [path, sha256]
    supervised: recorded identity of a real consume/custody occurrence {path, sha256}
    unsupervised: null
    never_invented: true
    provenance: [809 :76-78, FW09 occurrence]
    not: [lme_consume_open_for_standalone, GATE-S08 pending manufactured binding, guest invocation_id]
  locator:
    type: string
    owner: producer
    role: per_invocation_output_scope
    provenance: [809 :91-92, FW09 :58, J-FW09-FW06-LOCATOR]
    semantics: producer-owned output scope of THAT invocation; earlier logs preserved; shared append log is never truncated to pass
    supersedes: FW06/G18 locator-as-resolved-contract-key-path-list
    not: [dir_from LABEL-shared state dir, dir_rel, GEN_ID+_ev pairing]
  artifact_digest:
    in_context: false
    role: descriptor_output
    provenance: [FW09 :59, GATE-S08 artifact_fields]
    semantics: hash of finalized bytes of that invocation; reader reads exactly that artifact

distinctions:
  - {name: lme_invocation_context, where: 'resolver_outputs / invocation_context.yml PCTX', why: native early invocation/lease capture; not acceptance execution context}
  - {name: guest invocation_id, why: guest host-binding identity; not run/attempt}
  - {name: GEN_ID, why: reusable toolchain generation identity; 809 :63-64}
  - {name: LABEL, why: gate transfer label; reusable; not attempt}
  - {name: lme_resolved_run, why: executable/environment/receipt record; exact key set unchanged}
  - {name: genesis.launch.envelope, why: generated envelope names; FW18 withdrawn from this handoff}

resolved_run_preserved:
  var: lme_resolved_run
  current_fields: [runner, work_root, ansible_playbook, python, env, receipt, generation_role, capture, serving_scope]
  receipt_fields: [path, sha256]
  note: G ACCEPTANCE-BINDING.decl.yml still lists the historical six-field set; C1 does not shrink or rewrite resolved_run; G must consume the profile fields node

reservation_ownership:
  public_typed_ingress:
    owner: C1_declares; route_wires
    form: typed_json
    flag_from: [work_roots, run_local, arg_flags]
    distinct_from: caller_vars
    why: structured context does not fit flat name_eq_value / json_single_key grammar (812 :31-32)
    admits: [fields, occurrence_fields, allocation_modes, cell_to_admitted_source_configuration]
    malformed: refuse before any effect
  protected_launcher_variable:
    name: lme_execution_context
    owner: C1_declares; existing_seed_consumes_reserved_name_globs
    mechanism: run_local.caller_vars.reserved_name_globs
    existing_consumer: packet/source/route/testing/remote_harness/templates/macros/controller_seed.j2
    existing_line: 'case "$_n" in {{ cv.reserved_name_globs | join("|") }})'
    effect: a caller extra-var that sets the var directly refuses before any effect
  producer_output:
    owner: route
    delivers: admitted value under canonical var at the route-declared protected argument position
    never_allocates: [run, attempt]
  consumer_input:
    owner: matrix
    mechanism: not in reserved_outputs; not in resolver_outputs
    schema: execution_context.var not_in [reserved_outputs, resolver_outputs]
    comment_join: global reserved_outputs public-inputs note names lme_execution_context with lme_resolved_run
    compares: expected request and exact result artifact at locator
  extra_var_admission_protected:
    current_derivation: companions var and envelope transport var (profile seed_launch.extra_var_admission comment A7-PROTECTED-NAME-HOME)
    required_addition: include execution_context.var in that derived protected top-level name set
    owner: route consumes C1 declaration; not a loader body edit
    text: extra_var_admission.texts.protected already refuses a protected top-level key

protected_argument_order:
  owner: route
  join: J-FW09-SEED
  preserve:
    - source-record / rh_source_bootstrap after every caller word able to define the same name (seed source_admit; extra-vars last-writer)
    - run-local lme_resolved_run generated record and its collision check vs bootstrap record name (seed :1902)
    - extra_var_admission.order argument_order last-writer and collision checks
  constraints:
    - C1 does not state that execution_context and resolved_run are both the literal final argument
    - no caller argument is appended after the declared protected position
    - a later caller -e cannot override lme_execution_context or lme_resolved_run
  not_stated_here: exact argv index / which of context or resolved_run is last
  current_observed_run_local_order:
    - screened caller extra-vars
    - work_root_var
    - pinned_vars JSON
    - entry_verify / source_admit (rh_source_bootstrap)
    - lme_resolved_run JSON (commented LAST in current seed c0defae3 run_local_exec)
  current_observed_normal_run_order:
    - rebuilt admitted caller words
    - entry_verify appends receipt and rh_source_bootstrap
    - run_pins_json after entry_verify (commented as nothing follows it)

absence:
  optional_on: [standalone_diagnostic, g01, bootstrap]
  refused_on: [matrix_acceptance]
  standalone: existing gate entrypoint keeps admission; output is diagnostic evidence, never matrix acceptance
  required_missing: refuse; expected matrix is not reduced
  not_a_bootstrap_prerequisite: true
  no_new_first_generation_gate: true

producer_consumer_boundaries:
  this_producer:
    writes: [candidates/c1/execution-context-contract.yaml, candidates/c1/profile-join.yaml, candidates/c1/global-join.yaml, candidates/c1/loader-join.yaml, candidates/c1/source-integration.yaml, reports/producer-author.yaml]
    owns: typed declaration, profile sibling node, global schema/input-reservation rows, loader no-op evidence
    does_not_write: [N13 write_bound, route seed/gate bodies, G consumer bodies, matrix allocator/projector]
  route:
    owns: [typed ingress wiring on current seed c0defae3, protected argument exact position, last-writer/collision, gate s09 descriptor publication from the same context]
    bases:
      seed: current packet controller_seed.j2 c0defae3 (not life6 b03b2e1a)
      gate_historical_pair: s08 decl 1e1cb8d6 + macro ae264da7 (frozen; superseded for acceptance use)
    owed:
      - J-FW09-SEED
      - J-FW09-GATE
  matrix:
    owns: [allocator of run/attempt/cell for matrix-required runs, expected projection of those fields, admission, acceptance artifact consumer]
    owed: J-FW09-ACC
    expected_request_fields: [run, attempt, cell, occurrence, locator]
    reads_artifact_at: locator
    refuses: missing/malformed context on required cells without dropping expected cells
  n13:
    subtree: controller.entry_generation.render.n10.write_bound
    relation: disjoint; this producer emits no operation in that subtree

g18_stale_contract:
  finding: G18-DESC-KEYS-STALE
  what: frozen G files index route_keys.dir_rel; s08 results.descriptor uses dir_from/prefix_from/suffix and pending binding/locator
  effect: composed with s08, G load-time walk refuses typed; not a false pass
  successor_wait: G run_acceptance/ACCEPTANCE-BINDING/one_case successors wait for this field contract; locator value comes from context; dir_rel is not the location authority
  interim_gen_id_pairing: $_ev plus GEN_ID is superseded by this shared context (809 :79-80)

loader:
  implementation_operations: none
  why: contract_admission generic kinds already admit keys/enum/pattern/includes/not_in; execution_context stays outside desired-configuration merge
