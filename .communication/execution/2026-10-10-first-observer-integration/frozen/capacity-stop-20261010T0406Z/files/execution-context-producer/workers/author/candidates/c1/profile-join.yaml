schema_version: 1
kind: existing_engine_profile_join
role: execution_context_producer
id: C1-EC-PROFILE-S68
target:
  product_path: manifests/profiles/remote-harness.yml
  packet_path: packet/source/upstream/manifests/profiles/remote-harness.yml
  sha256: a4e910a9077c56f799e779e013cd718a2cd3bc06fedabb706cebb0614335486e
  edition: s68
owner: lineage-rh applies these scoped operations; C1 authors them
disjoint_preserve:
  - controller.entry_generation.render.n10.write_bound
  - genesis.launch.envelope
  - run_local.resolved_run.fields
  - run_local.resolved_run.receipt_fields
join: J-FW09-RH
applies: [FW09-RH-01-CURRENT, FW09-RH-02]
withdrawn: [FW09-RH-03]
note: >-
  FW09-RH-01 originally inserted after remote_tmp_env (historical PROFILE :1422). On current s68,
  remote_tmp_env sits inside the still-open resolved_run mapping (after env_value, before
  generation_role_from / capture_* / serving_scope / capture_check). Inserting there would add
  keys to resolved_run and break its exact key set. The sibling insert is after the closed
  resolved_run node (capture_check.texts.open_or_invocation) and before the runners comment.

operations:
  - id: FW09-RH-02
    op: replace_line
    purpose: protect lme_execution_context from untyped caller extra-var override using the existing reserved_name_globs screen the current seed already consumes
    path: manifests/profiles/remote-harness.yml
    observed_line: 4090
    before:
      composed_text: "                reserved_name_globs: ['ansible_*', 'become*', lme_resolved_run, hostvars, groups, group_names, omit,"
    after:
      composed_text: "                reserved_name_globs: ['ansible_*', 'become*', lme_resolved_run, lme_execution_context, hostvars, groups, group_names, omit,"
    unchanged_following:
      - "                                      inventory_hostname, inventory_hostname_short, inventory_dir, inventory_file,"
      - "                                      playbook_dir, role_path, play_hosts, environment, vars,"
      - "                                      rh_entry_receipt, rh_entry_dispatch, rh_entry_context, rh_entry_operation,"
      - "                                      rh_source_bootstrap, rh_entry_transition, rh_early_view, rh_entry_adoption,"
      - "                                      lme_invocation_mode, lme_invocation_lease, rh_invocation_requirement]"
    seed_already_reads: packet/source/route/testing/remote_harness/templates/macros/controller_seed.j2
    seed_join_note: adding the glob is sufficient for the reserved-name refusal; typed structured ingress remains route-owned

  - id: FW09-RH-01-CURRENT
    op: insert_after
    purpose: declare execution_context as a sibling of resolved_run with typed fields, typed_json ingress distinct from caller_vars, and absence split
    path: manifests/profiles/remote-harness.yml
    observed_anchor_line: 4295
    before:
      composed_text: "                    open_or_invocation: 'the held-lease probe could not open the leased run directory or refused its arguments'"
    insert:
      - "              # C1 records-c1-framework-09 / -18 (Codex 809 :54-96, 812): ONE execution-context handoff, sibling of resolved_run."
      - "              # Caller allocates run/attempt/cell; route transports the admitted value under var; seed never allocates."
      - "              # FW18-ENVELOPE: not a genesis.launch.envelope name. FW18-ORDER: protected argv position is route-owned."
      - "              # A caller extra-var that sets <var> refuses before any effect (caller_vars.reserved_name_globs)."
      - "              # Structured ingress is typed_json and is not the flat caller_vars grammar."
      - "              execution_context:"
      - "                var: lme_execution_context"
      - "                fields: [run, attempt, cell, occurrence, locator]"
      - "                occurrence_fields: [path, sha256]"
      - "                allocation_modes: [fresh, resume]"
      - "                allocation_owner: caller"
      - "                ingress:"
      - "                  form: typed_json"
      - "                  flag_from: [work_roots, run_local, arg_flags]"
      - "                  distinct_from: caller_vars"
      - "                absence:"
      - "                  optional_on: [standalone_diagnostic, g01, bootstrap]"
      - "                  refused_on: [matrix_acceptance]"
    after_unchanged:
      composed_text: "              # F05-S3 S3-SEAM-14 (OD-S3-04): every runner states `requires` = the playbook's static include/import closure"

withdrawn_operations:
  - id: FW09-RH-03
    status: withdrawn_by_FW18-ENVELOPE
    would_have_changed: "genesis.launch.envelope: {resolved_run: lme_resolved_run}"
    current_observed:
      line: 2719
      composed_text: "              envelope: {resolved_run: lme_resolved_run}"
    action: do_not_apply
    preserve: genesis.launch.envelope and envelope_fields.record source-record projection

do_not_edit:
  - run_local.resolved_run.fields
  - run_local.resolved_run.var
  - run_local.resolved_run.receipt_fields
  - n10.write_bound
  - extra_var_admission.order argument_order
  - extra_var_admission.texts.protected (route already refuses protected top-level keys; add execution_context.var to the derived name set without rewriting this text)
