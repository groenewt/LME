holder_identity_and_creation_witness:
  rule: The pre-create immutable obligation cannot already know post-mkdir inode fields.
    A stored whole ten-field identity must not be blindly compared to an extended
    destination lease map.
  obligation_lease_identity:
    home: bundle.staging_retention.lease.record_fields
    keys:
    - schema
    - token
    - machine
    - boot
    - uid
    - pid
    - start
    - pidns
    - cgroupns
    - cgroup_b64
    yaml_type: mapping_of_string_to_string
    producer:
      packet_logical: testing/remote_harness/tasks/reserve_publish.yml
      current_lines:
      - 1547
      - 1558
      binds: rf.lease to whole _rh_lease_rec identity only
    consumers:
    - packet_logical: testing/remote_harness/templates/obligation_transaction.j2
      check: lease_not_lease_record_fields
      lines:
      - 302
      - 303
      - 429
      grammar: keys exactly lease.record_fields; values JSON strings; token equals
        record token
    - packet_logical: testing/remote_harness/tasks/reap_staging.yml
      current_whole_map_compare_lines:
      - 2859
      - 2861
      required_amendment: compare identity_projection only, never whole destination
        lease file map to obligation.lease
    preserve_complete_original_identity_checks: true
    do_not_add_witness_keys_to_obligation_lease: true
    no_later_promotion_of_immutable_obligation: true
  destination_lease_file:
    identity_keys_from: bundle.staging_retention.lease.record_fields
    witness_keys:
    - name: staging_dev
      source_grammar: transaction.lstat.fields.dev
      value_grammar: transaction.grammar.decimal_ere
      yaml_type: string
    - name: staging_inode
      source_grammar: transaction.lstat.fields.inode
      value_grammar: transaction.grammar.decimal_ere
      yaml_type: string
    - name: staging_uid
      source_grammar: transaction.lstat.fields.uid
      value_grammar: transaction.grammar.decimal_ere
      yaml_type: string
    - name: staging_perms
      source_grammar: transaction.lstat.fields.perms
      value_grammar: lstat_percent_a_text
      yaml_type: string
    - name: staging_type
      source_grammar: transaction.lstat.fields.type
      constraint:
        equals: directory
        equals_source: packet/declarations/s68-controller.yaml#entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.each_ancestor.type_probe.equals
        not_a_link: true
        follows_links: false
      yaml_type: string
    - name: staging_path
      constraint: equals obligation record paths.staging
      grammar_at: controller.bootstrap.path_admission.regex
      yaml_type: string
    admitted_key_sets:
      identity_only_v1:
        keys_from: bundle.staging_retention.lease.record_fields
        meaning: holder identity proof only
        directory_creation: not_proved
      identity_plus_witness_v2:
        keys: identity_keys union witness_keys
        meaning: holder identity plus durable creation-result witness
        lands_when: after_independent_valid_mkdir_lstat_under_destination_lock
    parser:
      obligation_lease:
        word: lease_not_lease_record_fields
        key_set: identity_only
        extra_witness_keys: unaccountable
      destination_lease_file:
        word: destination_lease_file_not_admitted_key_set
        admitted:
        - identity_only_v1
        - identity_plus_witness_v2
        unknown_keys: unknown_retain
    comparison_rules:
      identity_projection:
        method: field_for_field_equality_on_identity_keys
        left: obligation.record.lease
        right: destination_lease_file restricted to identity_keys
        also_equals: in_memory _rh_lease_rec
        forbidden: whole_map_equality_of_ten_field_identity_to_extended_destination_lease_map
      witness_projection:
        method: field_for_field_equality_of_witness_keys_to_independent_lstat
        left: destination_lease_file restricted to witness_keys
        right: transaction.lstat of paths.staging under current holder/view/lock gates
        missing_witness: not_directory_creation_proof
      ordinary_dead_holder_select: identity_projection AND all current holder/view/namespace/ancestor/listing/relock
        gates
      after_create_directory_retirement: ordinary_dead_holder_select AND witness_projection
        AND staging object still the witnessed directory
    producers:
    - owner: route
      packet_logical: testing/remote_harness/tasks/reap_staging.yml
      current_lines:
      - 3289
      - 3294
      required: after atomic staging mkdir, under destination lock, noreplace persist
        of identity plus witness using canonical_json sort_keys
    consumers:
    - owner: route
      packet_logical: testing/remote_harness/tasks/reap_staging.yml
      current_lines:
      - 2859
      - 2861
      required: identity projection; witness only for N13-INTERRUPT-AFTER-DIRECTORY
        after-evidence
    - owner: route
      packet_logical: testing/remote_harness/tasks/reap_staging.yml
      pin_lines:
      - 218
      - 224
      required: lease_inputs pin amendment
