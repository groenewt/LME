schema_version: 1
kind: exact_n13_first_effect_repair_and_review_task
status: prepared_not_launched
purpose: Repair the actual first-effect barrier required by the declared first observer, retaining the one existing
  deployment engine and exact current recovery/capacity semantics.
inputs:
- scope.yaml
- context/authority-and-ownership.yaml
- context/first-effect-contract-proposal.yaml
- context/findings-and-required-controls.yaml
- source-index.yaml
owner_sequence:
- id: contract
  owner: c1
  depends_on: []
  action: Produce the paired typed phase/path/charge/lock/record-only recovery contract. Reuse existing read-only
    whole holder/lease derivation. Prove charge representation sufficiency and identify durable ownership-witness
    gaps explicitly. Keep baseline source interpretation separate from the proposed repair.
- id: contract_review
  owner: review
  depends_on:
  - contract
  action: Review declared dependency order, cumulative capacity, lock ordering and crash recovery before dependent
    source authors start.
- id: b_author
  owner: b
  depends_on:
  - contract_review
  action: Author disjoint B successors implementing durable charged admission before covered effects, exact prospective
    path planning and late atomic absent-only reservation. Preserve retained guard, full locked transaction, output
    framing, before-each-write admissions and no-replace landing.
- id: route_author
  owner: route
  depends_on:
  - contract_review
  action: Author disjoint route successors exposing the existing read-only boundary and requiring current admitted
    effect context. Preserve both source-reviewed repairs, remote/controller call compatibility and proof-based cleanup.
    No new token producer.
- id: join_controls
  owner: controls
  depends_on:
  - b_author
  - route_author
  action: Write executable managed YAML/Jinja controls exercising actual joined loader and all callers. Include clean
    destination with insufficient first-effect capacity, populated recovery, independently fitting but cumulatively
    over-capacity writers, malformed peer/foreign custody, token/lease/ancestry mismatch, record-with-absent-lease,
    collisions, interruption points and lock contention. Declare tested scope and actual execution separately.
- id: independent_review
  owner: review
  depends_on:
  - join_controls
  action: Freeze and independently review exact paired C1/B/route/control bytes and discourse. Report every unresolved
    representation/value, safety, recovery and compatibility finding. Source pass is not runtime acceptance.
- id: main_execution
  owner: Codex MAIN
  depends_on:
  - independent_review
  action: MAIN separately admits coherent integration and managed execution. Workers cannot lift the N13 guard, adopt
    source or contact targets.
handoff_required:
- exact input and output digests
- actual executable/version/model/session/exit/tool reads and writes
- complete scoped patch provenance
- source findings and inherited debt separately
- tests actually run with command/exit/output and skipped reasons
- dependency and compatibility contract
- evidence for every proposed closure; no invented service or runtime acceptance
worker_count: Actual configured workers as dependency/resource admission permits; no native simulation and no arbitrary
  count ceiling
no_shortcuts:
- do not merely remove HOLD1206
- do not replace one registry transaction with disconnected lock phases
- do not allow scratch/lock/lease/staging writes on an empty-destination exception
- do not equate a durable path intent with creation ownership
- do not silently use shared-ha or reduce profile/source expectations
- do not hand-code a parallel source loader, generator or deployment engine
