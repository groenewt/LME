schema_version: 1
owner: communication_map
stage: MAP
scope: Native operator-authorized communication reconciliation, not OCR or product implementation.
findings:
  - id: MAP-01
    priority: immediate
    subject: Standing host permission is settled and must not be presented as the deployment blocker
    evidence:
      - primary-authority-verification.yaml
      - controls/roadmap.yaml#global_constraints
      - controls/operator-requirements-index.yaml#latest_overlays
    observed: Exact primary graph/trixie unrestricted-activity record and Tailscale retire/re-enroll/revoke/reset record match their stored digests. Current roadmap correctly records broad root, partition and sysctl grants.
    distinction: Root/Tailscale permission, missing declared invocation artifacts, product defects, and exact provider disclosure approval are four different facts.
    correction: Put the standing actor/host/effect grants in the short active authority view; never ask these permissions again or claim that their absence prevents deployment.
    remaining: MAIN-only root, special Silmaril/Windows scope, declared reproducibility and actual source/effect dependencies remain.
  - id: MAP-02
    priority: immediate
    subject: Runtime matrix has not been realized despite substantial research and repair execution
    evidence:
      - requirements-and-matrix-coverage.yaml
      - controls/roadmap.yaml#validation_matrix
      - controls/execution/2026-10-09-cursor-recovery/matrix/execution-queue.yaml
    observed: All 83 indexed requirements map to case IDs; 251 coordination rows comprise 90 requirement/phase rows and 161 finite scenarios. Runtime denominator is unresolved and qualified current runtime cells are zero.
    correction: Keep the ten-axis matrix as the execution roadmap. Each next action must identify its actual cell/phase, immediate dependencies, executor, effect and evidence. Research/modeling counts never become deployment progress.
    requirement: Preserve every required combination and lifecycle phase while admitting the first dependency-ready cell separately from full-campaign qualification.
  - id: MAP-03
    priority: immediate
    subject: Broad milestone gates conflict with the narrower current first-invocation dependency contract
    evidence:
      - controls/roadmap.yaml#milestones
      - controls/roadmap.yaml#execution_order
      - ../../2026-10-09-cursor-recovery/first-invocation.yaml
      - ../../2026-10-09-cursor-recovery/first-graph-observer-admission-audit.yaml
    observed: M1 still says to run both-leg controls and close every SEED2 finding before its scoped M2 release, while newer execution_order and first-invocation explicitly admit the selected 2.19 leg and only actual traversed dependencies. Observer does not directly call N13/reaper or require all recovery campaigns.
    actual_first_observer_dependencies:
      - Genuine current-source launcher/bootstrap record and matching managed receipt.
      - Accepted generated observer-entry record.
      - Exact inventory, privileged transport reference, controller bindings, private state, operation and output binding.
      - Publication/custody prerequisites of the selected producer if that producer traverses them.
    not_blanket_dependencies:
      - All two-leg campaign qualification.
      - Entire source/model corpus or all six background API lane completions.
      - Full runtime denominator or unrelated profile/host tests.
      - Whole application, collection and UI acceptance before initial observation.
    correction: REDUCE must express the exact first path once and mark older milestone wording as historical or phase-specific. Do not remove real producer guards or invent a ready invocation.
  - id: MAP-04
    priority: high
    subject: Stale authorship clauses compete with the current authorized worker hierarchy
    evidence:
      - controls/scheduler.yaml#scope.author_of_resolution_code
      - controls/scheduler.yaml#check_instructions
      - controls/agent-guide.yaml#common_rules
      - controls/agent-guide.yaml#execution_hierarchy.current_cursor_recovery_overlay
      - controls/operator-requirements-index.yaml#latest_overlays
    observed: Scheduler still says Claude swarm authors resolution code, while guide8 records later actual Cursor candidate author authorization. OP-AUTHORSHIP-ROOT and OP-WORKFLOW-EVIDENCE retain older Claude-only shorthand. Canonical integration custody and candidate authorship are distinct.
    correction: One current role table must name Codex MAIN lead, Claude Secondary canonical integration custody, bounded coordinators, actual configured candidate/review workers, and native metadata reconciliation authority. Retain historical origin without revoking later grants.
    latest_task: This MAP -> distinct REDUCE -> distinct execution task is native management work explicitly requested by the operator; OCR is not its execution workflow.
  - id: MAP-05
    priority: high
    subject: Active current pointers mix historical attempts and current results
    evidence:
      - controls/index.yaml#documents
      - controls/inbox.yaml
      - controls/checkpoint.yaml
      - controls/roadmap.yaml#blockers
    observed: Index current-route-author still targets 4c, current-executor-readiness targets 3, and current-route-scope-stop targets 2 beside later 4e/3b and actual execution failures. B-FRAMING headline has 23 executed but embedded actual_execution still has 21 remaining unexecuted from attempt1. first-invocation.yaml embeds old running author attempts.
    correction: Current records need observed-at, exact attempt, state and authoritative receipt. Historical attempt bodies must remain immutable and be reached via history, not be labeled current. Keep historical failed controls; do not flatten them into final pass/fail.
  - id: MAP-06
    priority: high
    subject: The requirement index has a stale matrix count and does not yet include the latest cleanup direction
    evidence:
      - controls/operator-requirements-index.yaml#latest_overlays
      - requirements-and-matrix-coverage.yaml
    observed: OP-DISTINCT-SERVICE-LANES-FOREGROUND-20261009 says r7 has 82 requirements and needs rebind; queue r8 and roadmap correctly show 83 with completed crosswalk. Latest direct cleanup request is not covered by claiming the old 83 count.
    correction: Preserve the 83 IDs, replace stale current projection wording with the bound r8 reference, and add an explicitly sourced cleanup/communication overlay without retroactively changing old count evidence.
  - id: MAP-07
    priority: high
    subject: Managed goal state and shared summaries disagree
    evidence:
      - controls/inbox.yaml#goal_status
      - controls/roadmap.yaml#goal_status
      - controls/checkpoint.yaml#goal_status
    observation_source: MAIN direct message to mapper reports fresh tools.get_goal status paused, updatedAt1791590030. Mapper did not call goal API.
    observed: Shared controls say active while fresh MAIN goal API observation is paused.
    correction: Record managed goal state separately from the latest direct user authorization for cleanup and background continuation. Do not invent a goal transition, claim deployment goal resumed, or reinterpret this cleanup request as an operator pause.
  - id: MAP-08
    priority: high
    subject: Large duplicated active summaries encourage stale authority and status
    evidence:
      - source-bindings.yaml
      - controls/index.yaml
      - controls/agent-guide.yaml
      - controls/scheduler.yaml
    observed: Index/inbox/roadmap/checkpoint/requirements alone contain 247664 bytes. Guide and partitions add another 56975 bytes. Authority, role, current attempt and dependency facts are restated in several places; read orders also repeat the same files.
    correction: REDUCE should produce one short active entrypoint, one current action/dependency table, stable authority/requirement references, and separate immutable history lookup. Partition views should link shared facts rather than restate them.
    limit: Do not achieve brevity by dropping requirements, evidence, blockers or unresolved applicability.
  - id: MAP-09
    priority: high
    subject: Source path rosters conflate selected files and proposed future artifacts
    evidence:
      - reference-and-custody-audit.yaml
      - controls/agent-partitions.yaml
    observed: Of 762 exact pathlike references in the frozen controls, 690 exist directly, 33 resolve through declared source/control bases, one is explicitly historical nonexistent, and 38 remain absent/ambiguous against selected sources. Most are partition code-path declarations such as testing/e2e/matrix/expected.yml and trixie inventory.
    correction: Every active code-path reference should identify source edition and state as present, proposal-only, expected-not-authored, or historical. These 38 are navigation/realization gaps, not proven lost files. Do not generate placeholder artifacts to silence them.
  - id: MAP-10
    priority: high
    subject: Git custody exists but communication evidence is not versioned by current Git
    evidence:
      - git-custody-observation.yaml
    observed: Selected develop f39bd3254fa1f73d71e715644e1a7699f0f3fdf1 is clean. Main dirty/staged/untracked work is preserved. .gitignore line102 pattern .* ignores .communication controls and execution evidence. One historical tmp worktree is registered prunable because its gitdir target is absent.
    correction: Distinguish filesystem snapshot custody, Git source ancestry and accepted local milestone commits. Keep current dirty work unchanged; do not blanket add research captures or prune worktrees during index cleanup. Escalate a scoped versioning disposition to MAIN after reduction, rather than claiming files are committed.
  - id: MAP-11
    priority: medium
    subject: Archives are intact; active channel still carries substantial historical correspondence
    evidence:
      - reference-and-custody-audit.yaml
      - inventory/manifest.yaml
    observed: All 626 archive catalog entries and 29 snapshot members verified unchanged; no duplicate original paths. Live inbox has 2001 messages plus transitional top-level records. This is preservation success, not a reason to keep every old pointer in active controls.
    correction: Archive/prune active navigation by explicit disposition and catalog before relocation. Preserve pending/unacknowledged items, old absolute lookup and exact bytes. Acknowledgement must remain separate from digest observation and publication.
  - id: MAP-12
    priority: medium
    subject: Research inventory is large and live; it must stay separate from routine communication scans
    evidence:
      - inventory/manifest.yaml
    observed: Recursive inventory recorded 687296 non-directory entries and 49319588366 logical bytes without a depth cap. Three temporary Git pack paths vanished during active Tailscale acquisition and are recorded. Most bytes belong to six background service lanes.
    correction: Routine checks scan publication roots and owner state/receipts, not all corpus bodies. Keep the complete path inventory as archival mapping evidence. Do not stop background lanes or prune their live work to simplify communication.
    read_limit: Corpus bodies, binary CPGs, Git objects, base64 payloads and entire giant transcripts were not semantically read. Metadata and specifically referenced source/authority documents were examined.
