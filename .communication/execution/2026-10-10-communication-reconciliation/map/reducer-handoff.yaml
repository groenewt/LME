schema_version: 1
stage: MAP_COMPLETE
next_stage: DISTINCT_REDUCE_AGENT
owner: communication_map
authorized_next_owner: MAIN assigns the distinct reducer; mapper launches no children.
task_authority: Latest direct operator request for sequential map, reduce, execution and continued background API research.
inputs:
  entrypoint: map.yaml
  findings: findings.yaml
  frozen_inputs: source-bindings.yaml
  requirements_and_matrix: requirements-and-matrix-coverage.yaml
  complete_recursive_paths: inventory/manifest.yaml
  references_and_preservation: reference-and-custody-audit.yaml
  exact_primary_authority: primary-authority-verification.yaml
  git_custody: git-custody-observation.yaml
reduction_objective: Produce an exact proposed active information layout and file/key dispositions that an execution agent
  can apply this turn, while keeping the deployment matrix primary and preserving history.
current_file_dispositions:
  index.yaml: Reduce to short entrypoint, stable authority/requirements path, single latest state and history pointers. Retire
    mislabeled historical current_* attempt pointers.
  operator-requirements-index.yaml: Preserve all 83 requirement IDs and original source lineage; correct stale r7/82 projection;
    add current cleanup direction; avoid repeated general evidence prose per row.
  inbox.yaml: Keep actionable unresolved handoffs/decisions with owners and timestamps; distinguish settled permission, current
    code dependency and provider export question. Link old attempts through history.
  roadmap.yaml: Keep whole ten-axis matrix and obligations; derive actionable next cell/phase/dependency views with exact
    first-observer path. Remove contradictory broad current milestone gate wording while preserving its historical snapshot.
  checkpoint.yaml: Keep digest baseline/overlay, actual unread/ack state, freshness and current event pointers; move old attempt
    summaries to immutable snapshot. Correct goal API discrepancy from fresh MAIN evidence.
  agent-guide.yaml: One current role/authority and operating protocol; distinct native cleanup workflow; remove stale Claude-only
    shorthand without removing canonical integration custody.
  agent-partitions.yaml: Keep exact ownership; qualify selected versus proposed/absent paths and source editions; point to
    shared contracts once.
  scheduler.yaml: Preserve actual hourly schedule and nine-section broadcast behavior; reconcile stale authorship and current
    source pointers. No new cron is requested.
  hourly-sitrep.yaml: Keep full matrix/focus/progress structure and actual evidence distinctions; source current compact state
    rather than duplicated prose.
  archive/catalog.yaml: Retain verified entries; executor appends exact new relocation entries if any, preserving old lookup
    and rollback.
  existing_snapshots: Retain immutable bytes and digests. New pre-change snapshot must bind exact current controls immediately
    before execution.
  execution_corpora_and_worker_scopes: Preserve in place under existing coordinators; no research stop, pruning, provider
    export, product patch or root action by this cleanup agent.
preservation_plan:
- Compare current active-control digests to MAP input freeze before applying; account for legitimate concurrent changes rather
  than overwriting them.
- Freeze exact pre-change bytes and keyed disposition plan, with source hashes and restore paths.
- Write new controls atomically with duplicate-key rejecting YAML validation and readback.
- Validate all surviving active references and catalog resolution, requirement ID completeness, ten axes, profile/lifecycle
  coverage, and distinct required/applicable/executed/status/evidence fields.
- Archive superseded navigation/history only after preservation/catalog verification; never mutate old publication bodies.
- Retain pending acknowledgements explicitly. Publication, digest observation, delivery and acknowledgement are different
  states.
- Preserve selected clean source and all main/integration dirty work. No Git reset, wholesale add, push, product milestone
  or worktree prune is part of metadata cleanup.
- Publish a concrete reconciliation receipt to MAIN/Claude channel and update only appropriate current pointers; do not claim
  Claude acknowledgement.
deployment_focus:
  immediate_path: Current source-bound producer/launcher, managed receipt and accepted observer entry plus exact graph inventory/state/operation
    inputs; then actual graph observation and cell setup through existing engine.
  code_failures: B actual 21 pass/2 fail; route 30 dispatch failures before predicate execution; loader 14 cases blocked at
    Python identity parsing. These require owned repairs and reruns, not another root permission question.
  permission: MAIN root/Tailscale graph and trixie is settled. Exact private provider disclosure approvals remain packet-specific
    and separate.
  matrix: 83 indexed requirements, 10 axes, 251 coordination rows, zero qualified current runtime cells, unresolved runtime
    denominator. New cleanup overlay is additional, not already part of old83.
  foreground_guard: Background service/kernel modeling continues in tandem. Entire research corpus, all unrelated profiles,
    or full two-leg campaign are not blanket first-deployment gates.
uncertainties_to_preserve:
- No fresh target host observation by mapper. Historical pre-existing services are not evaluated here.
- Managed goal paused observation is reported by MAIN; reducer/executor must use latest MAIN/API evidence, not invent a transition.
- Thirty-eight source-path references need classification as proposal/absent/current supplier, not a universal lost-file claim.
- Metadata census was non-atomic during active acquisition; three transient failures and concurrent file growth are retained.
- Whole historical transcript/corpus semantic completeness is not claimed. Thirteen exact primary records and current operator
  task are bound.
- No claim that all old messages are acknowledged, reviewed or eligible for relocation solely from age.
acceptance_for_reduce:
- Exact finite file/key edit plan, with proposed compact schema and current single-source facts.
- Every MAP finding receives adopt, amend or reject disposition with source-bound reason.
- Every 83 existing requirement ID and all ten axes remain addressable, plus additive latest cleanup directive.
- Execution agent has deterministic preconditions, changes, validation, rollback/preservation and communication publication
  steps.
git_checkpoint_proposal:
  authority: MAIN message to mapper, implementing standing scoped local-commit grant; not a new operator ruling
  scope:
  - Validated active coordination controls
  - Exact preserved pre-edit control copies and their manifest
  - Small reconciliation findings/plan/application/validation receipts
  excluded:
  - 49GB service research corpora and full path-census shards
  - Unrelated staged or dirty work
  - Product candidate artifacts and acceptance claims
  execution_owner: MAIN reviews and may create a scoped local coordination commit after validation; mapper performs no Git
    mutation
  constraints:
  - Preserve existing index and working-tree state
  - No wholesale ignore-rule change, reset, push, or blanket add
  - Coordinate exact paths and custody with integration seat; do not wait for absent acknowledgement to pretend received
