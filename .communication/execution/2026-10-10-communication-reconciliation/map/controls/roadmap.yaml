goal: A reproducible deployment mechanism that provisions, reconciles, validates and tears down declared
  resources, with verified useful observability in every selected destination.
architecture: Inventory, service manifests and independent profile overlays feed the existing loader and
  derivation filters, generic Jinja macros, Ansible reconciliation and the existing deployment gate.
