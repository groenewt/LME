global_constraints:
- Every intended file, including inherited HEAD, tests, documentation, assets and evidence, follows YAML
  configuration or genuine reusable Jinja macros with declared values, subject to the single operator-authorized
  lme_manifests.py declarative-renderer allowance. That file remains subject to CPG/semantic review and
  declaration ownership. No other category exemption, suffix-only conversion or giant code scalar.
- One existing merge and derivation authority, operator overrides last, one versioned resolved configuration.
  Helpers cannot reload manifests or invent defaults.
- Machines, source counts, placement, paths, owners, endpoints, ports and budgets come from declarations.
  Today's three hosts are one inventory.
- Separate stable deployment identity from configuration revisions. Unchanged apply preserves healthy
  processes, data, credentials, certificates and native identities.
- Changed apply affects declared deltas; interrupted operations resume. Removal retains pending destination
  obligations and recovery material. Initialized database profile changes require explicit migration.
- Actual per-owner rootless user Quadlets are required. Malcolm's pinned Docker runtime and narrow privileged
  helpers are declared exceptions.
- 'Root actor/host scope follows verified734 and guide coverage_authority_20261007: Codex MAIN retains
  its scope; acknowledged Claude Secondary inherits graph/trixie root with notice to Codex MAIN. No subagent
  root, blanket wipe, physical-host shutdown or push; retain the separate verified silmaril restriction.'
- Graph and trixie broad root, partition and sysctl changes are authorized; record kernel changes in .operator/kernel.yml
  and console needs in .operator/tailscale_requests.yml.
- Direct Windows inspection, capture, collection and lifecycle operations remain excluded. Tailnet-wide
  control-plane metadata reads are permitted.
- Synthetic secret-failure tests precede real credentials. Credentials and certificates are recyclable
  on explicit deployment/session lifecycle; unchanged same-generation reapply preserves them.
- Preserve prior work, interrupted retirement, failed runs and external ownership records. Quarantine
  rejected mechanisms; historical evidence does not transfer acceptance.
- No ad hoc dependency installation or diagnostic result substitutes for the declared toolchain and qualified
  execution path.
- Verified direct operator restriction on broad silmaril activity is preserved (Claude user UUID ffeaf7de-a402-46eb-89b5-87d94968ca28);
  no proposed root controller package operation there is released. MAIN-only root and Windows exclusions
  remain separate. See codex-tick402-authority-source-verified.
