schema_version: 1
purpose: Queue a full, current matrix-centered sitrep broadcast every sixty minutes.
authority:
  kind: direct_operator_request
  exact_text: 1) replace 15 minute automated with 60 minute broadcast requiring to repeat that output bc its rather
    beautiful and should help keep us on track
  supersedes:
    kind: direct_operator_request
    exact_text: '@ cron for you:"::  15m check/update communication in $PWD/.communication'
  interpretation: Repeat the preceding full sitrep structure with freshly verified facts, publish it to the operator
    session and shared Claude coordination channel.
scope:
  channel: /home/tristan/gitters/LME/.communication
  session: 01a0c99d-bfde-7693-9f5a-b01890f2e9a8
  action: Hourly full focus, modeling, matrix progress, active work, blockers and next-execution broadcast.
  author_of_resolution_code: Claude swarm, including required sibling integrations.
cron:
  name: lme-codex-communication-60m
  minute: '0'
  hour: '*'
  day: '*'
  month: '*'
  weekday: '*'
  state: present
  disabled: false
  backup: true
  argv:
  - /usr/bin/systemd-cat
  - --identifier=lme-codex-communication
  - /usr/bin/timeout
  - --kill-after=5s
  - 45s
  - /usr/bin/flock
  - --nonblock
  - /home/tristan/gitters/LME/.communication/scheduler.lock.yaml
  - /home/tristan/.bun/install/global/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
  - queue
  - --cd
  - /home/tristan/gitters/LME
  - --thread
  - 01a0c99d-bfde-7693-9f5a-b01890f2e9a8
  - --message
  - AUTOMATED 60-minute full sitrep broadcast; not a new operator statement. Read and follow check_instructions
    and broadcast_instructions in /home/tristan/gitters/LME/.communication/scheduler.yaml. Repeat the full matrix/focus/progress
    sitrep using current evidence, and publish it to the operator and Claude communication channel.
check_instructions:
- Read /home/tristan/gitters/LME/.communication/index.yaml, then inbox.yaml and roadmap.yaml for current actions
  and milestone ownership.
- 'Before asserting or withdrawing an operator permission, follow index.yaml authority_decisions: read agent-guide.yaml
  common_rules and known_authority_correction, the settled record, and the dated primary evidence. Do not revoke
  a verified specific ruling from an older blanket summary.'
- Check published YAML in both .communication/inbox/ and the transitional top-level channel for new Claude, worker
  and observer messages; skip partials and archive history during routine scans.
- 'Use checkpoint.yaml: verify and load its digest_baseline file, then overlay published_message_digests. Compare
  every publication in both directories by digest, overlap from the preceding scan-start, and preserve unknown/changed/late
  pending messages. The baseline records observed bytes, not acknowledgement or review. Never advance solely from
  an outgoing timestamp.'
- Resolve historical channel paths through archive/catalog.yaml. For an old control fragment compacted from a still-existing
  file, use index.yaml history.control_snapshot.manifest; match original_path, verify snapshot SHA-256 and read
  the unchanged fragment. Do not silently treat a missing old field as a closed issue.
- Acknowledge substantive handoffs and decisions explicitly in a new atomic YAML message, preferably under inbox/.
  Reconcile checkout and file ownership directly with Claude.
- 'On two consecutive quiet checks or a pending handoff older than thirty minutes, apply coordination_health: inspect
  responsible-session activity and known failures, contact the owner with a concrete decision, and verify readback.
  Silence is not evidence of health or progress.'
- Preserve Claude swarm authorship of LME and required sibling integration code.
- Do not infer acknowledgement, execution or completion from file presence; distinguish author reports, source review
  and qualified runtime evidence.
- Coalesce accumulated identical reminders into one check.
- Continue only within established authority; this reminder does not resume a paused implementation goal or authorize
  additional deployments.
- After checking current evidence, follow broadcast_instructions and hourly-sitrep.yaml. Every due hourly run produces
  the full sitrep even if unchanged; explicitly report no progress where true.
- Publish the same substantive sitrep facts in the current operator session and an atomic YAML message in inbox/
  addressed to Claude Secondary and active domain coordinators. Do not infer delivery acknowledgement.
- Update checkpoint.yaml with last broadcast time, source/evidence bindings and channel message ID. Update roadmap/inbox
  only for real state changes.
- Coalesce already queued legacy 15-minute reminders. They are not a second schedule or new authority; do not issue
  an extra full broadcast until the declared sixty-minute interval is due unless the operator explicitly asks.
rendering:
  argument_separator: ' '
  template_lookup: template
  job_template: scheduler-command.j2
runtime:
  hosts: localhost
  connection: local
  gather_facts: false
  module_interpreter: /usr/bin/python3
  remote_tmp: /home/tristan/gitters/LME/.communication/execution/2026-10-09-hourly-broadcast/remote-tmp
  management:
    executable: /usr/bin/ansible-playbook
    inventory: localhost,
    playbook: /home/tristan/gitters/LME/.communication/scheduler-playbook.yaml
    environment:
      ANSIBLE_LOCAL_TEMP: /home/tristan/gitters/LME/.communication/execution/2026-10-09-hourly-broadcast/local-tmp
      ANSIBLE_REMOTE_TEMP: /home/tristan/gitters/LME/.communication/execution/2026-10-09-hourly-broadcast/remote-tmp
      TMPDIR: /home/tristan/gitters/LME/.communication/execution/2026-10-09-hourly-broadcast/tmp
      ANSIBLE_NOCOLOR: '1'
    receipt_directory: /home/tristan/gitters/LME/.communication/execution/2026-10-09-hourly-broadcast
rollback:
  action: Reapply scheduler-playbook.yaml with cron.state overridden to absent, preserving the declared cron.name.
  unrelated_cron_entries: preserved_by_ansible_builtin_cron
coordination_health:
  owner: codex_main
  authority: Codex MAIN management decision, responding to the operator complaint on 2026-09-24; not a new operator
    quotation.
  stale_after_minutes: 30
  check_after_consecutive_quiet_ticks: 2
  signals:
  - Age of pending substantive handoff and actual acknowledgement
  - Last relevant Claude MAIN or owner-session activity, examined with bounded reads
  - Known resource failures, stopped workers and missing results
  quiet_is_not_health: true
  response:
  - At threshold, inspect the responsible session and known run evidence; distinguish idle, stopped, failed and
    still working.
  - Publish a concrete recovery decision or focused request to Claude MAIN and verify explicit readback. Do not
    repeat no-change responses indefinitely.
  - Resolve routine authorized storage, dependency and coordination issues through their existing owners; ask the
    operator only for genuinely missing authority or information.
  - Record resource failures and recovery separately from product acceptance. No blanket cleanup or competing author
    launches.
  recheck: If the next scheduled check still lacks readback, inspect session activity again and report the unresolved
    delivery or execution blocker explicitly.
control_layout:
  revision: 3
  checkpoint_digest_contract: immutable baseline plus mutable new-message overlay
  historical_review_dispositions: archive/snapshots/2026-10-09-capacity-stop-953/controls/checkpoint.yaml#reviewed_messages
  quota_behavior: Every due hourly broadcast reports concrete current progress or no progress and actual quota/export
    blockers. Do not mistake completed workers for active work; preserve failures and avoid duplicate queued broadcasts.
retired_cron_entries:
- name: lme-codex-communication-15m
  state: absent
broadcast_instructions:
  contract: /home/tristan/gitters/LME/.communication/hourly-sitrep.yaml
  minimum_interval_minutes: 60
  delivery: At minute zero of each hour via the existing Codex session queue; queue or active-turn delays must be
    reported honestly.
  full_output_required: true
  quiet_one_line_substitute_allowed: false
  facts: Refresh actual source, matrix, worker/provider and runtime state; never mechanically repeat stale counts
    or approval claims.
  authority: A scheduled broadcast grants no new deployment, root, export or goal-resumption permission.
