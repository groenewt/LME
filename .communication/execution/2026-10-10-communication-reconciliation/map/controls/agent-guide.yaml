execution_hierarchy:
  authority:
    kind: direct_operator_steering_in_Codex_MAIN
    verbatim: perfect- i love the perfection but we also need to be anchored on - if patterns are getting repeated,
      maybe claude handles subagent orchestration and their subsequent subagent actors (ie. Claude subagents can
      deploy claude subagents natively * akin to sub agents being orchestrators of their own, leveraging a more
      optimize context dynamic!
    adoption: The hierarchy and handoff rules below are Codex MAIN implementation choices adopting that steering;
      they are not additional verbatim operator statements.
  structure:
  - 'Codex MAIN: overall priorities, shared-contract decisions, independent review and deployment oversight.'
  - 'Claude Secondary: implementation orchestration and cross-domain integration.'
  - 'Bounded Claude domain coordinators: partition ownership, focused context, child-actor task allocation, patch
    review and frozen handoff.'
  - 'Claude child actors: concrete bounded work on explicitly owned files or read-only evidence.'
  application: Use existing capable owners as coordinators where useful. Delegate independent bounded tasks natively
    under them; do not duplicate active authors or reset an in-flight frozen handoff merely to restructure the hierarchy.
  context_packet:
  - Current common guide plus assigned partition and exact applicable operator sources.
  - Concrete requirement, producer/consumer contracts, known findings, source hashes and acceptance checks.
  - Exact writable paths, forbidden/shared paths and single writer for each shared contract.
  - 'Required output: patch, source bindings, tests actually run, failures and remaining scope.'
  integration:
  - Child actors report to their coordinator; coordinators inspect the combined change before reporting to Claude
    Secondary.
  - Freeze producer declarations before a different owner copies or integrates them. Subsequent changes require
    a replacement handoff.
  - Repeated defects trigger a bounded examination of the common producer/consumer pattern and reusable regression
    coverage; avoid serial fixes to isolated occurrences.
  - Track actual native child IDs, ownership and status. Do not count planned launches as execution or native agents
    as configured provider/OCR runs.
  - Finish the smallest coherent declared path to the next real host execution. Unrelated parallel work must not
    silently become a prerequisite.
  retained_constraints:
  - Product candidate authorship may use operator-authorized actual Cursor workers under recorded bounded scopes;
    Claude retains existing canonical integration and interrupted artifacts. No native product-code authoring.
  - 'Root actor/host scope follows coverage_authority_20261007 and codex734: Codex MAIN retains its scope; the acknowledged
    Claude Secondary integration seat inherits graph/trixie root, with notice to Codex MAIN. No subagent root or
    silmaril extension. Do not reactivate the outgoing integration writer.'
  - Existing permission, model/provider, source-representation, manifest, profile, idempotency, exclusion and evidence
    rules remain.
  - Existing agent-count authorization remains a ceiling, not a target. Use bounded fanout with disjoint ownership.
  current_cursor_recovery_overlay:
    authority: archive/snapshots/2026-10-09-capacity-stop-953/orchestration-intake.yaml#operator_direction
    dispatch: execution/2026-10-09-cursor-recovery/dispatch.yaml
