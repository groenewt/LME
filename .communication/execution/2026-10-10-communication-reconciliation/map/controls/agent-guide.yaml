dispatch_contract:
  coordinator_preflight:
  - Check the common rules against the task before dispatch; do not rely on an old brief or memory.
  - Select one partition, exact writable paths and interface owners; include source digests and required positive/negative
    tests.
  - Name known contradictions and unresolved requirements. Do not reinterpret them as exemptions.
  agent_readback_required:
  - Guide revision and SHA-256 actually read.
  - Partition ID and SHA-256 actually read.
  - Applicable operator sources and coordinator corrections; source revision and writable paths.
  - Expected producer/consumer joins and required tests; any contradiction or missing source.
  coordinator_checkpoints:
  - Review the proposed authoring method before a bulk generation or cross-cutting edit. A new generator/engine
    or exception needs correction against existing rules, not retrospective acceptance.
  - Inspect newly added YAML program bodies before handback. Recursive macros, namespace accumulation and traversal
    programs belong in genuine reusable Jinja; zero grep hits and successful parsing do not establish representation
    compliance.
  - Inspect the first meaningful patch for representation, value sourcing and scope; catch drift before it multiplies.
  - Before landing, inspect the complete delta and provenance, confirm current dependencies, independently check
    material claims and retain failures.
  on_compaction_or_reassignment: Reload this guide, the current action map, your partition and new correction messages;
    rebind changed inputs before continuing. An earlier acknowledgement does not cover changed documents.
  handback_fields:
  - source and guide/partition bindings
  - files changed and generator/output provenance
  - commands/tests actually run and results
  - unexecuted requirements and unresolved violations
  - upstream/downstream compatibility
  - owned evidence and recovery paths
  limits: These coordination checks do not replace implementation, source tests, formal OCR stages or runtime acceptance;
    do not create a separate workflow service.
