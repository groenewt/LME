publication:
  preferred_directory: inbox/
  filename: Unique date, sender and descriptive message name, with .yaml suffix.
  required_fields:
  - schema_version
  - message_id
  - sender
  - recipient
  - observed_at_utc
  - kind
  useful_fields:
  - in_reply_to
  - evidence
  - decision_requested
  - next_action
  - owner
  write_method: Write a sibling .partial, parse YAML, fsync, rename atomically, fsync directory.
  published_messages: Immutable; corrections are new messages referencing the corrected message.
  shared_summaries: Codex MAIN owns index, inbox, roadmap and checkpoint; peers propose changes by message.
  peer_ownership: Do not rewrite other agents' messages or shared summaries concurrently.
  acknowledgement: Explicit message ID and disposition; file existence is not acknowledgement.
  attribution: Separate direct operator text, coordinator decisions, author reports and independent evidence.
  secrets: References and versions only; no credential values or low-entropy secret hashes.
checking:
  scope: Scan inbox/ and top-level published YAML, including worker and observer messages.
  ignored_for_live_scan:
  - archive/
  - '*.partial'
  - scheduler.lock.yaml
  - git-reconciliation-2026-09-24.yaml
  continuity: Record scan-start, overlap the preceding scan-start, and detect changed bytes by digest.
  timestamp_rule: Do not rely on lexical filenames or outgoing reply times to identify new messages.
  quiet_check: Update checkpoint for intermediate checks. Every due hourly broadcast must publish the
    full current sitrep under scheduler.yaml and hourly-sitrep.yaml, including explicit no-progress facts
    where true.
  substantive_reply: Publish a message for decisions, handoffs, new evidence, changed blockers or explicit
    acknowledgements.
  triggers: Coalesce identical automated reminders; they convey no new operator authority.
  archive_scan: Consult history only for a referenced decision or reconciliation; do not reread every
    archive each tick.
  stale_handoff: Apply scheduler.yaml coordination_health after two quiet ticks or thirty minutes awaiting
    a substantive handoff. Investigate actual session/run state; a quiet inbox does not establish worker
    health.
  control_files:
  - index.yaml
  - inbox.yaml
  - roadmap.yaml
  - checkpoint.yaml
  - scheduler.yaml
  - scheduler.lock.yaml
  - git-reconciliation-2026-09-24.yaml
  - agent-guide.yaml
  - agent-partitions.yaml
  - operator-requirements-index.yaml
  - hourly-sitrep.yaml
  - scheduler-playbook.yaml
  digest_baseline: Read checkpoint.yaml.digest_baseline, verify its file SHA-256, and load messages; overlay
    checkpoint.published_message_digests. Compare all published files in both locations by digest, including
    paths whose timestamps are older than the scan overlap. The baseline is observation only; acknowledgement
    is separate.
history:
  policy: Archive superseded correspondence without deleting its bytes or changing old statements.
  catalog_key: original_path relative to .communication, or exact message_id where parsed.
  lookup_order:
  - Try the original path for retained messages.
  - If absent, use archive/catalog.yaml to obtain archived_path and expected SHA-256.
  - Read that archived file and verify the digest when binding a review or decision.
  absolute_paths: Strip the original .communication/ prefix when looking up original_path.
  compatibility: Old literal paths may now require catalog lookup; historical bodies and hashes stay unchanged.
  supersession: Archiving does not close findings, revoke permissions or establish acceptance.
  rollback: Reverse catalog relocations only when the original path is absent and archived bytes match;
    refuse collisions.
  future_compaction: MAIN archives acknowledged/superseded messages after preserving active evidence links
    and catalog entries.
  transition: Recent dated handoffs and undated peer-owned files remain at original paths; root-level
    publication is still read.
  representation_debt: OPERATOR.md and any historical noncompliant content remain evidence, not an exception
    or compliance claim.
  control_snapshot:
    manifest: archive/snapshots/2026-10-09-capacity-stop-953/manifest.yaml
    sha256: 7e3a364d82119a268507b724146bc931daa1f533b1a5cbfd49ba3a5b214f65ed
    lookup: Resolve old control fragments against controls.original_path in this manifest; read the unchanged
      snapshot_path and same fragment. This also applies when the active file exists but the old fragment
      was compacted.
    qualification: Compaction closes no requirement or finding; original bytes and reviewed revision remain
      authoritative for historical evidence.
agent_dispatch: Read agent-guide.yaml plus the assigned partition in agent-partitions.yaml; bind the actual
  documents in the worker readback. Do not substitute copied historical briefs.
