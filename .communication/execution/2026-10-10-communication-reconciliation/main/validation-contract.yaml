schema_version: 1
kind: independent_communication_reconciliation_validation_contract
owner: codex_main
authority:
  kind: direct_current_operator_instruction
  verbatim: 1) map finishes. 2) launch reduce subagent with full unlimited grok cursor subagent allowance 3) execute 4) validation (all agents have unlimited cursor-grok allowance!)
  interpretation: Separate completed handoffs; actual Cursor workers under every coordinator's allowance; independent validation after shared metadata execution.
baseline:
  map: ../map/map.yaml
  map_sha256: e8223468f2e811987adc56a804806a07cbced2a8fed154c26add620d3e4c8acd
  requirements_and_matrix: ../map/requirements-and-matrix-coverage.yaml
  custody: ../map/git-custody-observation.yaml
qualification: This checks the coordination repair. It cannot pass a product deployment or replace the product's expected runtime matrix.
checks:
  - id: stage_order
    expectation: MAP completion precedes distinct REDUCE launch; REDUCE handoff precedes distinct EXECUTE; independent validation reads executed results.
  - id: actual_workers
    expectation: Actual CLI executable, requested and observed model, source/task identity, session, exit, output and tests distinguish completed work, live work and rejected submissions. Native activity never substitutes for required Cursor execution.
  - id: authority
    expectation: Current roles and settled graph/trixie root and Tailscale permissions match primary evidence. No subagent root, invented host approval requirement or unrestricted private disclosure is inferred.
  - id: requirements
    expectation: Every baseline requirement and overlay ID remains addressable with its source. New cleanup, four-stage and all-agent worker directions are explicit additions or sourced refinements, not retroactive edits to old evidence counts.
  - id: matrix
    expectation: Every baseline axis, profile, topology, lifecycle phase and quantified requirement survives. Runtime discovery cannot shrink expectations; required, applicable, executed, status and evidence stay distinct.
  - id: deployment_dependencies
    expectation: First-cell and first-observation actions name actual immediate prerequisites and owners. Whole research completion, every unrelated profile and both toolchain qualification campaigns are not invented blanket gates.
  - id: current_state
    expectation: One authoritative current state has observation times and exact receipts; superseded attempts are historical. Goal API state and current direct task authorization are separate facts.
  - id: yaml_and_references
    expectation: Active YAML rejects duplicate keys. Every surviving active navigation reference resolves at its declared base/edition or explicitly identifies a proposal, expected missing artifact or preserved historical location.
  - id: preservation
    expectation: Every modified or relocated original has verified pre-change bytes and restoration mapping; old publications and pending acknowledgements are preserved. Missing or changed archive members fail validation.
  - id: scan_and_ack
    expectation: Digest baseline plus overlay and relocated-message lookup remain usable. Observation, publication, delivery and acknowledgement remain separate. No unacknowledged handoff is silently closed.
  - id: schedule
    expectation: Existing hourly schedule and full sitrep contract survive; no duplicate fifteen-minute schedule is introduced. Delayed publication is timestamped honestly.
  - id: scope_and_git
    expectation: Product checkouts, unrelated staged and dirty work, provider-owned artifacts and host state remain untouched by this cleanup. A scoped metadata commit must name its actual paths and preserve unrelated index state.
  - id: research_parallelism
    expectation: The six existing service lanes remain in tandem; all agents inherit uncapped Cursor worker allowance, while physical resources, explicit data scopes, file ownership and dependency order still apply.
  - id: communication
    expectation: Claude and active coordinators receive the actual new entrypoint and material changes; explicit readbacks are recorded separately from delivery. No absent Claude acknowledgement is fabricated.
  - id: reduction_effect
    expectation: Measure active read-path size and duplicated facts before and after; reduction may not hide unresolved findings or remove requirements to improve the measure.
result_contract:
  required_fields:
    - required
    - applicable
    - executed
    - status
    - evidence
  unexecuted_required_checks: remain_open
  defect_handling: Return exact failures to the execution owner, repair only their owned metadata and revalidate affected checks without relabeling failures.
