schema_version: 1
owner: codex_main
purpose: One current communication and handoff protocol.
authority: authority.yaml
active_navigation:
  entry: index.yaml
  current_observations: state.yaml
  actions_dependencies_and_matrix: roadmap.yaml
  requirements: operator-requirements-index.yaml
  partitions: agent-partitions.yaml
  digest_checkpoint: checkpoint.yaml
  history: history.yaml
stage_order:
- stage: MAP
  completion: Frozen map/source bindings/findings and reducer handoff.
- stage: REDUCE
  actor: Distinct subagent coordinator after MAP completion.
  completion: Reviewed concrete candidates, per-key/file dispositions, preserved authority and coverage invariants.
- stage: EXECUTE
  actor: Distinct execution agent after reduction handoff.
  completion: Apply scoped metadata transformations, preserve old bytes/catalog and update references; no product
    or host mutation implied.
- stage: VALIDATION
  actor: Distinct validation agent after execution.
  completion: Check actual changed artifacts, authority provenance, reference resolution, requirement/matrix preservation
    and publication/readback; retain failures.
separation:
- Background service lanes continue; cleanup is not a new product deployment prerequisite.
- Managed goal API state is an observation with source/time; direct task authorization is a separate field. No
  synthetic resume/pause.
- Planned launch, running process, terminal exit, provider report, source review and runtime qualification are
  separate states.
- Filesystem presence and digest observation are neither acknowledgement nor acceptance.
routine_check:
  read:
  - index.yaml
  - authority.yaml for relevant grants/roles
  - state.yaml and roadmap.yaml for changed current actions
  - checkpoint.yaml digest baseline plus published_message_digests overlay
  - Applicable requirement IDs and partition only
  scan:
  - Published YAML in inbox/ and transitional top-level channel, excluding controls, partials and archive history.
  - Every publication digest against verified baseline plus overlay; overlap preceding scan-start.
  - Keep unknown, changed and late messages pending; do not advance only by outgoing timestamp.
  skip: Do not recursively reread live API corpora, CPGs, Git objects or giant transcripts for routine check-ins.
    Referenced bounded evidence and owner receipts are enough for the check; full MAP inventory remains historical
    evidence.
  history_resolution: Use history.yaml for control editions and snapshot manifests, and archive/catalog.yaml for
    moved message paths. Match original path, edition and SHA before reading a historical fragment; a missing
    current field does not close a historical finding.
  action: Acknowledge substantive decisions explicitly in new atomic YAML; preserve publication, observed digest,
    readback and actual acknowledgement separately.
  control_registry:
    source: index.yaml#active_control_registry
    rule: Resolve the explicit current active-control registry before building either comparison set. Exclude
      every registered control on BOTH verified-baseline/overlay known entries and current publication discovery;
      do not infer publication status from YAML extension alone.
    required_control_members:
    - authority.yaml
    - protocol.yaml
    - state.yaml
    - history.yaml
    - source-paths.yaml
    history: Preserve prior checkpoint.scan exclusion lists as historical observations of those scans. Every next
      scan uses the current registry, not an old frozen skip list.
coordination_health:
  owner: codex_main
  authority: Codex MAIN management decision, responding to the operator complaint on 2026-09-24; not a new operator
    quotation.
  stale_after_minutes: 30
  check_after_consecutive_quiet_ticks: 2
  signals:
  - Age of pending substantive handoff and actual acknowledgement
  - Last relevant Claude MAIN or owner-session activity, examined with bounded reads
  - Known resource failures, stopped workers and missing results
  quiet_is_not_health: true
  response:
  - At threshold, inspect the responsible session and known run evidence; distinguish idle, stopped, failed and
    still working.
  - Publish a concrete recovery decision or focused request to Claude MAIN and verify explicit readback. Do not
    repeat no-change responses indefinitely.
  - Resolve routine authorized storage, dependency and coordination issues through their existing owners; ask
    the operator only for genuinely missing authority or information.
  - Record resource failures and recovery separately from product acceptance. No blanket cleanup or competing
    author launches.
  recheck: If the next scheduled check still lacks readback, inspect session activity again and report the unresolved
    delivery or execution blocker explicitly.
handoff:
  coordinator_preflight:
  - Check the common rules against the task before dispatch; do not rely on an old brief or memory.
  - Select one partition, exact writable paths and interface owners; include source digests and required positive/negative
    tests.
  - Name known contradictions and unresolved requirements. Do not reinterpret them as exemptions.
  agent_readback_required:
  - Guide revision and SHA-256 actually read.
  - Partition ID and SHA-256 actually read.
  - Applicable operator sources and coordinator corrections; source revision and writable paths.
  - Expected producer/consumer joins and required tests; any contradiction or missing source.
  coordinator_checkpoints:
  - Review the proposed authoring method before a bulk generation or cross-cutting edit. A new generator/engine
    or exception needs correction against existing rules, not retrospective acceptance.
  - Inspect newly added YAML program bodies before handback. Recursive macros, namespace accumulation and traversal
    programs belong in genuine reusable Jinja; zero grep hits and successful parsing do not establish representation
    compliance.
  - Inspect the first meaningful patch for representation, value sourcing and scope; catch drift before it multiplies.
  - Before landing, inspect the complete delta and provenance, confirm current dependencies, independently check
    material claims and retain failures.
  on_compaction_or_reassignment: Reload index, authority, state/roadmap, assigned partition and changed relevant
    requirement evidence. Rebind changed inputs; old acknowledgement does not cover changed documents.
  handback_fields:
  - source and guide/partition bindings
  - files changed and generator/output provenance
  - commands/tests actually run and results
  - unexecuted requirements and unresolved violations
  - upstream/downstream compatibility
  - owned evidence and recovery paths
  limits: These coordination checks do not replace product tests or runtime acceptance. This cleanup follows the
    direct four-stage sequence and does not invoke OCR.
hourly:
  contract: hourly-sitrep.yaml
  schedule: scheduler.yaml
  required_sections: All existing nine sections unchanged; full matrix/focus/progress with fresh evidence.
  delivery:
  - Operator current session
  - Claude Secondary channel
  - Active domain coordinators
  coalescing: One full broadcast per due hourly interval; coalesce duplicate/legacy reminders, report queue delay
    honestly.
  limits: Scheduled reminders grant no new root/export/deployment authority or goal state transition.
  publication: Atomic immutable inbox YAML counterpart; checkpoint binds observation time, source/evidence hashes
    and message ID. Publication is not acknowledgement.
preservation:
  history: Archive exact prior bytes before active-navigation pruning; catalog original path/digest/new path and
    disposition.
  pending: Preserve pending/unacknowledged items and failed/superseded evidence.
  source: Keep historical findings tied to original source revision. Do not claim current runtime pass from research,
    liveness or old tests.
  git: Record filesystem custody separately from Git commits; no blanket add, reset, deletion, push or worktree
    prune.
message_cadence:
  authority_kind: Codex MAIN implementation choice for this requested cleanup; not verbatim operator rule
  source: Parent REDUCE message to authority actor relaying MAIN on 2026-10-10 after approved packet launch
  lane_owned:
  - Routine read/edit/fixture evidence and normal task receipts.
  main_handoffs:
  - Decision-needed blockers.
  - Completed coherent milestones.
  - Changed contracts or scope.
  - Periodic consolidated deltas with exact evidence references.
  ordinary_owned_actions: No MAIN approval or acknowledgement for every ordinary owned tool invocation or fixture.
  boundary_incidents: Real permission, source-disclosure, scope or safety boundary incidents are reported immediately.
  gate_limit: Background readbacks are not a gate to communication cleanup or the first deployment; this cadence
    introduces no worker-count cap.
provider_observation_rules:
  source: execution/2026-10-10-communication-reconciliation/reduce/authority/receipts/provider-candidates.yaml#protocol.lag_quota
  no_stale_running_status: true
  planned_queued_completed_not_running: true
  queue_delays_reported_honestly: true
  historical_counts_not_fresh_facts: true
