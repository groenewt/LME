schema_version: 1
owner: codex_main
purpose: Reproduce the operator-approved full sitrep structure every hour using current evidence.
reference: Full assistant sitrep immediately preceding the operator hourly-broadcast request; its presentation
  is the model, its old counts are not current facts.
audience:
- operator_current_codex_session
- claude_secondary_shared_communication_channel
- active_domain_coordinators
source_documents:
- index.yaml
- authority.yaml
- state.yaml
- operator-requirements-index.yaml
- roadmap.yaml
- checkpoint.yaml
required_sections:
- order: 1
  name: Current focus and revisions
  contents: State the complete observability/deployment objective and latest operator revisions. Explicitly connect
    system modeling of services, hooks, behavior and lifecycle to the matrix.
- order: 2
  name: Operational and Git status
  contents: Fresh deployments and qualified runtime cells; distinguish pre-existing services. Actual checkout/commit,
    accepted integrations/commits and preserved dirty work. State observation freshness.
- order: 3
  name: Full matrix coverage table
  source: roadmap.yaml#validation_matrix
  contents: All ten axes and required profile/topology/runtime/platform/supply/network/authority combinations,
    with each applicable case setup, smoke, E2E, reapply/change, interruption/recovery, teardown and redeploy.
- order: 4
  name: Active execution table
  columns:
  - owner_or_actual_agent
  - work_currently_running
  - concrete_deliverable
  - affected_matrix_cases
  - next_execution
  contents: Differentiate native coordinators, actual provider sessions, completed workers, queued tasks, author
    reports and verified output. No planned launch presented as running.
- order: 5
  name: Model and integration findings
  contents: Concrete new service/hook/behavior/lifecycle model findings, source identities, changed contracts
    and exact implementation tasks; preserve sole existing engine.
- order: 6
  name: Matrix progress and evidence
  contents: Requirement/family/scenario counts separately from materialized runtime instances and passes. Report
    required/applicable/executed/status/evidence, actual tests/failures and remaining runners. Never invent a
    fixed denominator or transfer historical evidence to current source.
- order: 7
  name: Next dependency-ready actions
  contents: Ordered actual deliverables with owner, immediate dependencies, case links and acceptance criteria.
    Matrix/model/hook implementation proceeds in parallel where independent; no unrelated whole-campaign gate
    before the first admissible deployment.
- order: 8
  name: Drift and corrective action
  contents: Identify repeated work, stalled handoffs, scope loss or missing matrix linkage and the concrete correction.
    A quiet check is not implementation progress.
- order: 9
  name: Blockers and operator attention
  contents: Exact unresolved code/resource/access/provider-export blockers with owner and remedy. Explain automatic
    approval rejection precisely where applicable; retain standing grants. Ask only genuinely unresolved questions,
    never repeat answered permissions.
output_rules:
- Full, self-contained prose and tables comparable to the approved sitrep, not a one-line no-change response.
- Update facts from source-bound current observations and clearly label author-reported or historical findings.
- Publish an immutable YAML counterpart to inbox/ for Claude and record its ID in checkpoint. Publication is not
  acknowledgement.
- Preserve the original whole project, current modeling revision, matrix implementation and graph/trixie/silmaril
  scope with existing exclusions.
- Coalesce duplicate/legacy queued reminders; do not produce multiple broadcasts for the same hourly interval.
communication_protocol: protocol.yaml#hourly
