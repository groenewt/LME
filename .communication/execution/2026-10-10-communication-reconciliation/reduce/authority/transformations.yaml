    value:
    - Read index.yaml, authority.yaml for applicable grants/roles, then state.yaml and roadmap.yaml for current
      observations/actions.
    - Follow protocol.yaml#routine_check for publication-root digest comparison, baseline overlay, late/changed
      messages and history lookup.
    - Follow protocol.yaml#coordination_health when handoffs are stale or two consecutive checks are quiet; inspect
      actual owner/session evidence and make a concrete recovery decision.
    - Use authority.yaml#roles for current authorship/integration/root boundaries; do not restore historical Claude-only
      candidate wording.
    - Distinguish current managed goal API observation from current direct task authorization; this reminder creates
      no goal transition or new root/export/deployment grant.
    - Follow broadcast_instructions and hourly-sitrep.yaml for every due hourly full nine-section broadcast with
      current evidence; report no progress truthfully.
    - Publish an atomic YAML counterpart addressed to Claude Secondary and active domain coordinators; publication
      is not acknowledgement.
    - Update checkpoint with scan/broadcast times, source/evidence bindings and message ID; update current state/actions
      only for observed changes.
    - Coalesce duplicate and legacy fifteen-minute reminders; one full broadcast per due sixty-minute interval
      unless operator explicitly requests more.
    preservation: execution/2026-10-10-communication-reconciliation/map/controls/scheduler.yaml#check_instructions
