    - id: representation
      rule: YAML configuration and genuine reusable Jinja macros with declared values govern every intended file,
        including HEAD, subject to the operator's single allowance for ansible/roles/podman/filter_plugins/lme_manifests.py
        as the existing declarative renderer. That file remains subject to CPG scrutiny, semantic correctness, declaration/value
        sourcing and the one-engine contract. No additional Python helper, generator, test, documentation or evidence
