      distinction: Root/Tailscale permission, missing declared invocation artifacts, product defects, and exact
        provider disclosure approval are four different facts.
      correction: Put the standing actor/host/effect grants in the short active authority view; never ask these
        permissions again or claim that their absence prevents deployment.
      remaining: MAIN-only root, special Silmaril/Windows scope, declared reproducibility and actual source/effect
        dependencies remain.
    - id: MAP-02
      priority: immediate
      subject: Runtime matrix has not been realized despite substantial research and repair execution
      evidence:
      - requirements-and-matrix-coverage.yaml
      - controls/roadmap.yaml#validation_matrix
      - controls/execution/2026-10-09-cursor-recovery/matrix/execution-queue.yaml
      observed: All 83 indexed requirements map to case IDs; 251 coordination rows comprise 90 requirement/phase
        rows and 161 finite scenarios. Runtime denominator is unresolved and qualified current runtime cells are
        zero.
      correction: Keep the ten-axis matrix as the execution roadmap. Each next action must identify its actual cell/phase,
        immediate dependencies, executor, effect and evidence. Research/modeling counts never become deployment
        progress.
      requirement: Preserve every required combination and lifecycle phase while admitting the first dependency-ready
        cell separately from full-campaign qualification.
    - id: MAP-03
      priority: immediate
      subject: Broad milestone gates conflict with the narrower current first-invocation dependency contract
      evidence:
      - controls/roadmap.yaml#milestones
      - controls/roadmap.yaml#execution_order
      - ../../2026-10-09-cursor-recovery/first-invocation.yaml
      - ../../2026-10-09-cursor-recovery/first-graph-observer-admission-audit.yaml
      observed: M1 still says to run both-leg controls and close every SEED2 finding before its scoped M2 release,
        while newer execution_order and first-invocation explicitly admit the selected 2.19 leg and only actual
        traversed dependencies. Observer does not directly call N13/reaper or require all recovery campaigns.
      actual_first_observer_dependencies:
      - Genuine current-source launcher/bootstrap record and matching managed receipt.
      - Accepted generated observer-entry record.
      - Exact inventory, privileged transport reference, controller bindings, private state, operation and output
        binding.
      - Publication/custody prerequisites of the selected producer if that producer traverses them.
      not_blanket_dependencies:
      - All two-leg campaign qualification.
      - Entire source/model corpus or all six background API lane completions.
      - Full runtime denominator or unrelated profile/host tests.
      - Whole application, collection and UI acceptance before initial observation.
      correction: REDUCE must express the exact first path once and mark older milestone wording as historical or
        phase-specific. Do not remove real producer guards or invent a ready invocation.
    - id: MAP-04
      priority: high
      subject: Stale authorship clauses compete with the current authorized worker hierarchy
      evidence:
      - controls/scheduler.yaml#scope.author_of_resolution_code
      - controls/scheduler.yaml#check_instructions
      - controls/agent-guide.yaml#common_rules
      - controls/agent-guide.yaml#execution_hierarchy.current_cursor_recovery_overlay
      - controls/operator-requirements-index.yaml#latest_overlays
