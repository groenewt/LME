      verbatim: yeah btw THE KEY HERE IS OPERATOR CAUGHT IT- aka yall stay vigilant. and consider general centralized
        and partioned per TOC GUIDE/MAP FOR DEPLOYED agents
      interpretation: The operator detected the generator drift; improve coordinator vigilance and provide shared
        guidance plus partitioned maps for assigned agents.
      implementation_choice: The guide layout, readback fields and review checkpoints below are Codex MAIN coordination
        choices, not additional verbatim operator statements.
    path_base: Relative communication documents resolve from .communication. Code scopes resolve against the explicit
      source edition in each current assignment, navigated through roadmap.yaml#current_source_edition. Declared
      D2/runtime checkouts carry separate launch bindings; historical receipts retain their actual source roots.
    current_state_source: inbox.yaml and roadmap.yaml remain the current action/status authority; this guide does
      not duplicate the deployment manifest or invent a second state engine.
    read_order:
    - step: 1
      document: agent-guide.yaml
      read: Common rules, known authority correction and dispatch/readback contract.
    - step: 2
      documents:
      - index.yaml
      - inbox.yaml
      - roadmap.yaml
      read: Current milestone, ownership, current actions and global/profile requirements. Read the full relevant
        constraints, not just a copied brief.
    - step: 3
