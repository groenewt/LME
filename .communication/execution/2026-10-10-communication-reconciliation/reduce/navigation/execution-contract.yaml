steps:
- id: N1
  action: Acquire MAIN serialized control ownership and record exact target files/newfile flags. Re-read current
    digests against reduction bases; drift is merge-and-revalidate, never overwrite.
- id: N2
  action: Preserve each existing target byte-for-byte using exclusive creation under exact preedit snapshot. Manifest
    includes original_path,snapshot_path,sha256,bytes and whether absent before. Verify every snapshot digest before
    any replacement. Preserve unrelated dirty/staged Git state observation.
- id: N3
  action: Stage each candidate in same-filesystem owned transaction directory. Resolve authority/protocol/state
    sibling joins. Reject duplicate YAML keys and unknown referenced active files. Keep proposed source references
    explicitly typed rather than require placeholder files.
- id: N4
  action: Validate exact83 baselineID set plus additive directives separately, tenaxes/251 coordinationrows unchanged,
    allrequiredprofile/lifecycle obligations, all38 source-reference occurrences, exactpendingack and digest custody
    retention, archive626/snapshot29 preserved. Validate history manifests and allremovedfragment lookup.
- id: N5
  action: Immediately recompare current target digests to frozen preimage. Atomic replace each file with readback
    hash after write; publish compact index last after other dependencies validate. Record per-file applied/pre/post
    identity in transaction receipt for interrupted resume. No claim of cross-file filesystem atomicity.
- id: N6
  action: Stage3 re-reads actual activefiles and performs application readback, then publishes application-only
    handoff. Stage4 is a distinct independent validator of actualpostimages; success is not published before that
    verdict. Interruptedresume inspects per-file old/new hashes and continues only verifiedknownstates; no duplicatesnapshot
    or overwriting unknownconcurrentbytes.
- id: N7
  action: After stage4 passes, publish exact independentvalidation/applicationreceipts and entrypoint to operator/Claude.
    Publication is not Claudeacknowledgement. MAIN then decides optional finite local Gitcheckpoint.
rollback:
  trigger: Failed semantic/reference/custody validation or interrupted known-state partial apply requiring recovery.
  rule: For each applied target in reverse order, restore exact preservedpreimage only when current file hash matches
    this transaction postimage. If targetwas originally absent, remove only exact transactionowned postimage after
    preserve. Refuse any conflict rather than destroy concurrent changes.
  history: Never alter old message bodies, catalogue relocations or corpus files.
  checkpoint: If independently published current acknowledgement/scan update conflicts, preserve it and ask MAIN
    to merge, not revert.
runtime_credit: none; passing this metadata validation does not qualify deploymentcells or source product tests.
