schema_version: 1
kind: finite_communication_metadata_application_contract
owner: communication_reduce
stage: REDUCE
next_owner: MAIN appoints distinct EXECUTE agent after this reducer's completed handoff.
scope:
  shared_targets: application-manifest.yaml#targets
  allowed_effect: Apply named YAML coordination controls and preservation/publication
    receipts.
  excluded_effects:
  - Product code or selected source checkout mutation.
  - Root or host contact.
  - Research corpus pruning or provider process termination.
  - Old publication mutation or inferred acknowledgement.
  - Unrelated staged files, blanket add, reset, push or worktree pruning.
  worker_allowance: All agents retain unlimited Cursor-Grok allowance; actual resources,
    declared source scope and file ownership still apply.
inputs:
  source_preconditions: ../map/source-bindings.yaml
  candidate_files: application-manifest.yaml#targets
  key_dispositions:
  - authority/transformations.yaml
  - matrix/transformations.yaml
  - navigation/key-dispositions.yaml
  integration_amendments: integration-amendments.yaml
  independent_validation: ../main/validation-contract.yaml
steps:
- id: establish_transaction
  effect: Record distinct executor identity, actual start time and exact target manifest
    under the assigned execute scope.
  precondition: REDUCE completion and MAIN shared-control writer assignment.
- id: freeze_preimage
  effect: Preserve exact existing target bytes, paths, modes and hashes, plus absent-before
    records for new targets.
  snapshot: archive/snapshots/2026-10-10-communication-reconciliation-preedit/manifest.yaml
  constraints:
  - Recompare current controls with MAP hashes; account for real concurrent changes
    rather than overwriting them.
  - Use exclusive snapshot creation and verify saved bytes before replacing any active
    target.
  - Record product checkout and unrelated index/worktree state without modifying them.
- id: stage_candidates
  effect: Stage the exact candidate files under owned same-filesystem transaction
    storage and apply the finite integration amendments.
  constraints:
  - Retain all 83 preexisting requirement IDs plus the separately identified 84th
    management requirement.
  - Preserve the 251 existing product coordination rows and all ten matrix axes.
  - New management checks remain a distinct supplemental case, never runtime credit.
  - State contains the sole current provider-decision and execution observations,
    with source and time.
  - Resolve new authority, protocol, state, history and source-path references together.
- id: preflight
  effect: Reject duplicate YAML keys, invalid active-reference joins, missing source
    dispositions and lost custody before active replacement.
  evidence: Preserve actual check output; candidate checks are not independent post-application
    validation.
- id: apply
  effect: Recompare each target preimage, atomically replace one file at a time, and
    read back its exact postimage hash.
  publication_order: Dependency controls first; index.yaml last.
  constraint: Do not claim cross-file filesystem atomicity. Track each file's known
    preimage/postimage for interrupted resume.
- id: publish_application
  effect: Publish an application-only YAML handoff and new entrypoint with exact changed-file
    evidence. Reserve tick987 for MAIN final result and overdue full sitrep after
    distinct validation.
  validation_state: pending_distinct_validation
  acknowledgement: Publication and hash observation do not establish Claude or owner
    acknowledgement.
  updates: Record actual application message identity/digest; preserve prior pending
    acknowledgements. MAIN records final full broadcast time and delay after validation.
- id: handoff_validation
  effect: Return the exact applied manifest, preservation manifest, source/control
    hashes and actual failed or unexecuted checks to MAIN.
  next_owner: MAIN launches a distinct VALIDATION agent against actual postimages.
  rule: EXECUTE cannot grant itself the independent validation verdict.
- id: post_validation_git_checkpoint
  owner: MAIN
  prerequisite: Separate validation has passed applicable metadata checks.
  method: Ordinary exact allowlisted force-add followed by git commit --only with
    explicit metadata paths and existing hooks intact.
  constraints:
  - Inspect the exact staged/commit diff and preserve unrelated logical index entries,
    especially staged AGENTS.md, and working-tree bytes.
  - No wholesale 49GB corpus add or ignore-rule expansion.
  - No bespoke temporary-index, commit-tree or CAS plumbing unless a concrete need
    is demonstrated and MAIN reviews it.
  - Protected Git writes use ordinary approval; no bypass.
  - No product milestone or deployment acceptance is implied by a coordination commit.
resume_and_rollback:
  known_states: Each target must match its recorded preimage or owned postimage. A
    third hash is a conflict to preserve and reconcile.
  resume: Continue only known incomplete operations; do not duplicate snapshots or
    infer success from file presence.
  rollback: Restore exact verified preimages in reverse application order only when
    current bytes match this transaction's postimage.
  absent_before: Remove only an exact transaction-created postimage after preserving
    it; never remove an unknown file.
  concurrent_acknowledgements: Preserve and merge newer independently published acknowledgements
    or scans, never erase them during rollback.
completion_boundary:
  coordination: Actual application and distinct validation with preserved history
    and communication receipts.
  deployment: Zero qualified runtime cells and unresolved runtime denominator remain
    until separately demonstrated through the existing deployment engine.
final_publication:
  owner: MAIN
  reserved_message: tick987
  after: Distinct Stage4 validation of actual postimages and application-only communication.
  content: Final result and complete overdue nine-section focus/matrix/progress sitrep.
  non_circularity: Stage4 verifies the Stage3 application handoff; it does not depend
    on its own future completion publication.
