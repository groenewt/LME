schema_version: 1
owner: codex_main
purpose: Current role and permission authority; historical grants remain source-bound.
precedence:
- Latest explicit operator instruction for the relevant actor, effect and scope.
- Primary dated operator records and adopted specifications.
- Source-bound coordinator decisions; never attributed as operator quotations.
- Worker reports and summaries are evidence claims, not new authority.
sources:
  current_cleanup_and_unlimited_workers: execution/2026-10-10-communication-reconciliation/reduce/authority/packet/coordination-authority.yaml#current_operator_messages
  verified_primary_records: execution/2026-10-10-communication-reconciliation/map/primary-authority-verification.yaml
  canonical_custody_and_cursor_authorship: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
  claude_secondary_root_seat: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#coverage_authority_20261007
  loader_allowance: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#known_authority_correction
roles:
- id: codex_main
  responsibility: Lead, priority and shared-contract decisions, coordination, integration admission, independent
    assessment, privileged execution and release verdict.
  root: Standing scope includes graph/trixie; preserve special Silmaril scope.
  authorship: Owns integration and authorized coordination; assigns native Codex product repairs under latest explicit
    operator approval as well as configured provider workers. Actor/provenance remains explicit.
- id: claude_secondary
  responsibility: Canonical integration and interrupted source custody; implementation orchestration under MAIN.
  root: Acknowledged graph/trixie integration seat; notify MAIN. No inferred Silmaril extension.
  availability: Observe current state.yaml; custody is not proof of present capacity or acknowledgement.
- id: bounded_coordinators
  responsibility: Own declared domain inputs and writable scope; orchestrate actual configured workers, inspect
    patches and frozen handoffs.
  root: No root SSH or root deployment.
  authorship: Native coordination and explicitly assigned native Codex product repair authorship authorized by 2026-10-10
    operator clarification; retain disjoint ownership and separate author/review/execution evidence.
- id: configured_cursor_grok_workers
  responsibility: Actual candidate authors/reviewers under finite source/write ownership and current configured
    model.
  root: No root rights; no shared integration authority.
  receipts: Record executable/version/model/session, exact input hashes, output/diff, actual exit and tests.
- id: native_codex_repair_workers
  responsibility: Native product repairs and tests assigned by MAIN under explicit operator answer; independent
    bounded checks retain their actual actor identity.
  root: No root SSH/deployment; MAIN executes privileged effects.
  authority: &id001
    path: execution/2026-10-10-native-foreground/operator-native-authorship.yaml
    sha256: c206b9b316fc0f125684fa34b1f461da9771bd4375c73af1b2eef88da6f2bdee
    bytes: 1935
  receipts: Real candidate/diff/source/test evidence; never count native work as configured Cursor/OCR execution.
standing_grants:
  current_prepared_provider_work:
    status: approved_by_direct_operator_message
    primary: execution/2026-10-10-hour03-sitrep/blanket-provider-approval.yaml
    exact_text: FULL APPROVAL ON ALL FYSA!
    scope: Outstanding prepared Cursor packets and scoped repair/review continuations, with bound inputs and outputs.
    interpretation_owner: codex_main
    rule: Do not ask the operator again for covered prepared work. Preserve normal automatic review, source boundaries
      and actual launch evidence.
  graph_trixie:
    status: settled
    actors:
    - codex_main
    - authorized_claude_secondary_integration_seat
    effects:
    - Root bootstrap, deployment and scoped development lifecycle.
    - Partition/sysctl/kernel changes within operator scope; record kernel changes in .operator/kernel.yml.
    - Tailscale enrollment, retirement, re-enrollment, revoke/recreate and reset; record console needs in .operator/tailscale_requests.yml.
    primary: execution/2026-10-10-communication-reconciliation/map/primary-authority-verification.yaml
    interpretation: These grants do not replace declared reproducible mechanisms, existing storage custody or safety
      of unrelated resources. Do not present missing host permission as a deployment blocker.
  silmaril:
    status: special_rules_preserved
    rule: Do not extend graph/trixie unrestricted grant to Silmaril. Preserve specifically authorized MAIN scope
      and declared owned resources.
  windows:
    direct_inspection_collection_capture_lifecycle: excluded
    tailnet_control_plane_metadata: authorized
worker_allowance:
  cursor_grok: Unlimited allowance for all agents; no arbitrary count cap.
  execution: Use actual configured Cursor CLI/model; disjoint ownership, dependency order and observed resource
    admission. Resource limits are not fabricated operator count ceilings.
  background: Six distinct approved API/service coordinators continue in tandem. Their research completion is not
    a blanket deployment gate.
  scope: Allowance does not itself expand a worker packet, root rights, shared integration scope or provider disclosure
    boundary.
  native_codex: Explicit operator approval permits native subagents to author deployment repairs while Cursor unavailable;
    old provider-only product authorship constraint superseded for this work.
task_authorization:
  communication_reconciliation: Direct operator-authorized native metadata cleanup plus actual Cursor-Grok orchestration;
    MAP then distinct REDUCE then distinct EXECUTE then distinct VALIDATION.
  workflow: Do not introduce OCR into this cleanup task. Existing product review requirements remain separately
    scoped.
  managed_goal: Read actual managed goal state separately from current direct task authorization. A paused API observation
    is not an operator pause of cleanup and grants no invented goal transition.
rules:
- id: representation
  rule: YAML configuration and genuine reusable Jinja macros with declared values govern every intended file, including
    HEAD, subject to the operator's single allowance for ansible/roles/podman/filter_plugins/lme_manifests.py as
    the existing declarative renderer. That file remains subject to CPG scrutiny, semantic correctness, declaration/value
    sourcing and the one-engine contract. No additional Python helper, generator, test, documentation or evidence
    exception; no giant code scalars, cosmetic suffix changes or generated-banner-only compliance.
  source: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
  correction: inbox/2026-09-24-codex-operator-ruling-C1-join-decisions-034948.yaml
- id: one-engine
  rule: Inventory, service manifests and independently composed overlays feed the existing loader, generic templates,
    Ansible reconciliation and deployment gate. No second desired-state loader/generator/merge engine; no deployment-specific
    executable constants.
  source: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
- id: profiles-and-lifecycle
  rule: Preserve the complete profile matrix, declarative placement and overrides, stable unchanged reapply, targeted
    updates, resumable operations and exact-owned teardown. Today's hosts are inventory inputs.
  source: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
- id: authority
  rule: Latest explicit operator instructions govern. Record exact sources for operator claims; distinguish adopted
    specifications, coordinator decisions, worker reports and independently verified evidence. A coordinator cannot
    create an exemption to an operator rule.
  source: protocol.yaml#separation
- id: ownership
  rule: Use the roles table in this authority file. Canonical integration custody, product candidate authorship
    and native metadata cleanup are separate permissions.
  source: authority.yaml#roles
- id: access
  rule: Use standing_grants and roles in this authority file; no subagent root. Claude Secondary reports graph/trixie
    root activity to MAIN. Reproducible declared deployment paths remain required.
  source: authority.yaml#standing_grants
- id: exclusions-and-secrets
  rule: Direct Windows inspection, capture, collection and lifecycle remain excluded; authorized tailnet metadata
    reads are distinct. Keep credential values out of shared packets; preserve versioned references and pending
    recovery obligations.
  source: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
- id: evidence
  rule: Keep source review, fake/synthetic diagnostics, actual managed execution and qualified acceptance separate.
    Preserve failed/superseded receipts. Existing processes, file presence and matching hashes do not prove successful
    deployment.
  source: protocol.yaml#separation
- id: providers
  rule: An actual configured CLI worker requires executable/model/input/output/session/exit/test evidence. Native
    work is not a provider invocation. Exact source export, host permission, resource failures and code readiness
    are separate conditions. No model substitution.
  source: authority.yaml#worker_allowance
- id: work-and-temp-storage
  rule: Use declared disk-backed repository work and temporary roots, including TMPDIR, Ansible local/remote temp,
    tool caches and owner-specific engine storage. No work in /tmp or a repository symlink resolving into its tmpfs.
    Admit resolved storage and byte/inode capacity; preserve existing custody and unrelated resources. Derive target
    paths from target declarations rather than copying controller paths.
  source: execution/2026-10-10-communication-reconciliation/map/controls/agent-guide.yaml#common_rules
  authority: Operator no-/tmp direction primary-verified in832; path declaration and binding details are the settled
    Codex162 implementation decision.
boundary_distinctions:
  source: execution/2026-10-10-communication-reconciliation/reduce/authority/receipts/provider-candidates.yaml#authority.remaining_non_permission_facts
  rule: Root/Tailscale permission, missing declared invocation artifacts, product defects, and exact provider disclosure
    approval are four different facts.
  operational_use: Record each condition separately in state/action blockers; no standing host-grant regression
    and no new disclosure authority inferred.
candidate_provenance:
  native_preparation: Explicit operator-authorized coordination metadata
  actual_provider: execution/2026-10-10-communication-reconciliation/reduce/authority/receipts/author-invocation.yaml
  coordinator_disposition: execution/2026-10-10-communication-reconciliation/reduce/authority/receipts/provider-disposition.yaml
  qualification: Reviewed composite coordination candidate; shared installation and independent validation remain
    separate stages.
latest_operator_amendment:
  at_utc: '2026-10-10T05:25:13.548793+00:00'
  source: *id001
  preserved: Existing engine, YAML/value sourcing, full matrix, ownership, root boundaries and honest provenance
    remain requirements.
