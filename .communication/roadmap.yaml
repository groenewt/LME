- id: M5
  title: Secrets, identity, routes and certificates
  owner: C with C1, route and runtime owners
  required: true
  applicable: true
  deliverables:
  - Close R1 secret-bearing assertion/rescue/logging paths; derive webui_api_key and other required secrets
