campaign_milestones:
- id: M1
  title: Connected managed bootstrap
  owner: Claude Secondary integration; C1, route and B authors; Codex MAIN review
  required: true
  applicable: true
  deliverables:
  - Bind effective harness policy into the authoritative resolved revision; switch every package, controller,
    target and control consumer atomically.
  - Declare and validate initial builder identity, dependency acquisition and pinned uv/interpreter bootstrap;
    support the owned local mirror without ambient-Python fallback.
  - Complete declared acquisition sources for wheels, collections and the missing pinned uv installer;
    toolchain acquisition must not depend on MAIN manually placing dependencies.
  - Fix exact-owned purge, bundle completion admission, exclusive reservation, early-interruption recovery
    and manifest/descendant read custody.
  - Guard internal render inputs; validate real executable identities while preserving legitimate declared
    tool/path/owner/resource overrides.
  - Join actual B entrypoints and G lifecycle controls to the same source; no disconnected test-only adapters.
  - Bound attributable failed package/target staging through declared retention, recovery and capacity
    controls; preserve foreign entries and prove repeat-failure behavior.
  - 'QL-TP: extend existing managed controls runner to consume both target_prereq catalogs with declared
    fixtures, exact assertions and bound evidence; qualify dependent operations before claiming acceptance.'
  exit:
  - Current-source review closes every applicable connected bootstrap finding and interface defect for
    campaign qualification. First selected invocation uses only the exact dependencies in first_observer_dag;
    do not require unrelated all-leg or whole-campaign closure.
  - Byte-bound candidate, actual executed checks and remaining failures are reported precisely; no unmanaged
    diagnostic relabelled qualified.
  - Exact reviewed coherent source is locally committed without unrelated staging; MAIN issues scoped
    M2 execution release.
  current_evidence: state.yaml#blockers
  historical_snapshot: execution/2026-10-10-communication-reconciliation/map/controls/roadmap.yaml#milestones[id=M1]
  dependency_qualification: These are full-campaign milestones. Individual cell/observer actions use their
    exact declared prerequisite closure; a campaign milestone is not an automatic blanket barrier.
  campaign_dependencies: []
- id: M2
  title: Controller reconciliation and clean rebuild
  owner: route and B; G acceptance; Codex MAIN release
  required: true
  applicable: true
  deliverables:
  - Execute the reviewed declared package/acquisition/bootstrap path in its admitted owned controller
    root with storage budget and complete dependency handling.
  - Exercise unchanged apply, changed revision, concurrent attempts and interruptions at package/root/generation/receipt
    boundaries.
  - Execute inventory-scoped purge, repeat purge and clean rebuild; retain unknown resources and failure
    evidence.
  exit:
  - Stable native identities and unchanged files/processes on same input; only intended consumers change
    on revision.
  - Incomplete bundles, forged tools, linked manifests/descendants and foreign ownership refuse before
    unsafe reads or writes.
  - Recovery resumes on the same declared deployment without manual cleanup; receipts bind source, config,
