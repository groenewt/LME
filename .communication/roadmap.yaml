- id: M6
  title: Database ownership, replication and recovery
  owner: D with C1 and B
  required: true
  applicable: true
  deliverables:
  - Deploy pinned PostgreSQL 17/Patroni/pgvector; dual independently owned three-member groups, shared etcd quorum
    and separate authority domains.
  - Initialize schemas before subscriptions, allow selected confidentiality-reviewed logical exchange only, qualify
    logical-slot continuity and explicit migrations/vector resets.
  - Bind fencing grants to full identity/revision; close patch digest recomputation, deployed signing callers, retired-key
    history and persisted-state migration defects.
  - Require strict synchronous durability and declared application transaction behavior; safe unavailability on
    DCS authority loss or uncertain fencing.
  - Independently qualify shared-ha and isolated restore without silent database-profile replacement.
  exit:
  - Publisher and subscriber failover, Patroni freeze, failed shutdown and resumed old guest cannot create unsafe
    writers; no physical-host fence.
  - Database readiness, writer routing and externally recorded acknowledged-commit controls pass within the declared
    failure model. The real surviving-application 90-second proof belongs to M9 after M7/M8 deploy those clients.
