  required: true
  applicable: true
  deliverables:
  - Inventory every existing change with retain, refactor, quarantine or incomplete-evidence disposition;
    preserve OCR and sibling lineage.
  - Make the existing loader, overlays, macros, Ansible and gate the sole execution path; remove parallel
    framework dispatch and raw manifest rereads.
  - Close every representation/value-sourcing violation, including current HEAD, generic code, tests,
    docs, dependencies and assets.
  - Before target mutation or real-secret distribution, qualify R1 no_log failure/rescue coverage, enabled-consumer
