  - Execute tailscale cert for selected consumers, install declared key/cert ownership, validate staged
    replacement, renew, reload affected consumers and verify served certificates.
  - Support Serve-managed HTTPS and declared self-signed/internal CA trust independently; reconcile renamed/reimaged
