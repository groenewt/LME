---
# convert_to_cluster.yml
#
# Converts an existing single-node LME installation into a multi-node
# Elasticsearch cluster.
#
# Prerequisites:
#   - A healthy single-node LME install on the master node
#   - A cluster inventory file at ansible/inventory/cluster.yml
#     (generate with: scripts/create_cluster_inventory.sh)
#   - SSH connectivity from master to all cluster nodes
#   - Ports 9200 and 9300 open between all nodes
#
# Usage:
#   ansible-playbook -i ansible/inventory/cluster.yml ansible/convert_to_cluster.yml
#
# To skip the backup prompt (e.g. in CI):
#   ansible-playbook -i ansible/inventory/cluster.yml ansible/convert_to_cluster.yml \
#     -e skip_prompts=true

###############################################################################
# Play 0: PRE-MUTATION VALIDATION BARRIER (B-owned; C1-OTHER-CALLER-PREFLIGHT).
#
# Mirrors ansible/elasticsearch.yml's committed pre-mutation ALL-HOST barrier onto
# this caller so NO host enters a mutating phase until the COMPLETE elasticsearch
# target set (master + every data node) has resolved+validated THIS invocation. The
# earliest mutation on this caller is Phase 1's setup_lme_scripts.yml (writes
# /opt/lme/scripts) followed by the backup -- both on the master -- so this barrier
# MUST be the FIRST play, before Phase 1.
#
# Two deliberate hardenings over the incomplete site.yml barrier shape (codex-0700:
# do NOT copy it) -- identical to elasticsearch.yml:
#   * DEDICATED VALIDATION-ONLY PLAY across the COMPLETE inventory with NO `serial`,
#     so it QUALIFIES valid batching instead of only rejecting carried facts
#     (codex-0915 C1_source_review.site_barrier open item): every targeted host
#     validates in ONE linear pass before any host mutates, and later batched/serial
#     mutating phases (Phase 6 is `serial: 1`) are gated per-host by the barrier
#     evidence, not by re-running this run_once completeness assert inside a batch.
#   * STRUCTURED evidence bound to a per-INVOCATION token + the content-addressed
#     resolved revision (NOT an unversioned boolean), so a stale/foreign
#     `_lme_*prevalidated` fact from a prior play or another entrypoint in the same
#     process cannot satisfy the gate (C1-SERIAL-BARRIER-STALE-FACT-ACCEPTANCE).
#
# NO REMOTE PYTHON / NO MUTATION: every task is controller-side (assert, set_fact,
# include_role -> load_manifests). load_manifests resolves+validates from the synced
# manifest tree (clone_directory) and reads each node's host_vars, so it validates the
# whole `elasticsearch` group even before Phase 5a bootstraps Python on the data nodes,
# and changes nothing on any host. become:false + gather_facts:false make that explicit.
# lme_profile:cluster comes from inventory/group_vars/elasticsearch.yml (the SAME source
# Phase 2/5b use), so this barrier resolves the SAME profile the mutating phases do.
#
# HONEST RESIDUALS (bound to C1, not claimed fixed here):
#   * lme_resolved_revision is the config-only revision (C1-COMPLETE-RESOLVED-REVISION,
#     open) -- binding to it does not yet cover the fully-composed consumer config.
#   * this barrier is the all-host pre-first-mutation gate; a per-host render-parity
#     re-check is added to Phase 1 (the earliest master mutation). Data-node deploy
#     (Phase 5b) keeps its own resolve; extending per-host parity to every later phase
#     is a documented residual (the barrier already gated the complete target set).
###############################################################################
- name: "Phase 0: Pre-mutation resolve+validate ALL-HOST barrier (fail-closed before any mutation)"
  hosts: elasticsearch
  gather_facts: false
  become: false
  # Pin the LINEAR strategy so any_errors_fatal is guaranteed effective even on a site
  # that sets a non-default (e.g. free) strategy globally -- under `free` Ansible warns
  # any_errors_fatal is unsupported and a failing host does not abort its peers.
  strategy: linear
  # Abort the WHOLE play the moment ANY targeted host errors, so no host advances into a
  # mutating phase on a partial validation. The run_once completeness assert is the
  # backstop for a host dropped WITHOUT a task failure (e.g. removed during connection).
  any_errors_fatal: true
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
  tasks:
    - name: Barrier -- reject a pre-supplied / carried validation token, evidence or capture
      ansible.builtin.assert:
        that:
          # `-e` outranks set_fact and facts carry across plays; refuse this caller's own
          # evidence AND any foreign token from a chained site.yml/elasticsearch.yml play
          # in the same process, so an injected or historical value can never masquerade
          # as THIS run's evidence.
          - _lme_convert_barrier_run_token is not defined
          - _lme_convert_prevalidated is not defined
          - _lme_es_barrier_run_token is not defined
          - _lme_es_prevalidated is not defined
          - _lme_site_barrier_run_token is not defined
          - _lme_prevalidated is not defined
          # A carried resolver operator-selection capture would make the barrier validate
          # a STALE capture. convert_to_cluster is its own ansible-playbook process, so a
          # fresh run never pre-sets it; this only rejects a genuinely stale/injected one.
          - _lme_operator_selections is not defined
          # lme_resolved_revision is an OUTPUT-ONLY set_fact; an extra-var OUTRANKS a
          # set_fact, so `-e lme_resolved_revision=X` would PIN a forged value into BOTH
          # the recorded evidence AND the Phase 1 parity comparison. Never legitimately
          # pre-supplied -> reject.
          - lme_resolved_revision is not defined
        fail_msg: >-
          A barrier token / prevalidated evidence / _lme_operator_selections /
          lme_resolved_revision must NOT be pre-supplied (-e) or carried from a prior play --
          the barrier mints its own per-invocation evidence and resolves its own revision.
        quiet: true
      tags: ['always']

    - name: Barrier -- mint this invocation's validation token (run_once; shared to every host)
      ansible.builtin.set_fact:
        _lme_convert_barrier_run_token: "convert-barrier-{{ lookup('pipe', 'date +%s%N') }}-{{ 999999999 | random }}"
      run_once: true
      tags: ['always']

    - name: Barrier -- resolve+validate declared config + service/trust projections (per host, pre-mutation)
      ansible.builtin.include_role:
        name: podman
        tasks_from: load_manifests
        apply:
          tags: ['always']
      tags: ['always']

    - name: Barrier -- record this host's pre-mutation validation evidence (token + resolved revision)
      ansible.builtin.set_fact:
        _lme_convert_prevalidated:
          token: "{{ _lme_convert_barrier_run_token }}"
          revision: "{{ lme_resolved_revision }}"
      tags: ['always']

    - name: Barrier -- every targeted host validated THIS invocation before any peer mutates
      ansible.builtin.assert:
        that:
          # No targeted host was silently dropped (any_errors_fatal already aborts on a
          # task failure; this also catches a host removed for another reason) ...
          - (ansible_play_hosts_all | difference(ansible_play_hosts)) | length == 0
          # ... and EVERY surviving targeted host recorded evidence bound to THIS run's
          # token AND carrying a resolved revision. The token (minted run_once, guarded
          # against pre-supply) proves every host ran THIS invocation; `revision defined`
          # proves each host completed resolve+validate. It does NOT require every host's
          # revision to be EQUAL: heterogeneous per-host host_vars resolve DIFFERENT valid
          # revisions, so coupling completeness to cross-host uniformity would wrongly
          # reject a legitimate batch. Each host's OWN revision is bound to ITS OWN deploy
          # by the Phase 1 parity gate; cross-host uniformity, if ever required, is a
          # separate C1 resolver policy, not this completeness barrier's job.
          - >-
            (ansible_play_hosts | map('extract', hostvars)
             | map(attribute='_lme_convert_prevalidated', default={})
             | selectattr('token', 'defined')
             | selectattr('token', 'equalto', _lme_convert_barrier_run_token)
             | selectattr('revision', 'defined')
             | list | length) == (ansible_play_hosts | length)
        fail_msg: >-
          pre-mutation validation did not succeed on every targeted elasticsearch host for THIS
          invocation (token {{ _lme_convert_barrier_run_token }}; failed/removed:
          {{ ansible_play_hosts_all | difference(ansible_play_hosts) }}). No host proceeds into
          a mutating phase until the COMPLETE target set validates this run. NB `--limit` narrows
          this target set; a limited run validates only the limited hosts (documented residual).
        quiet: true
      run_once: true
      tags: ['always']

###############################################################################
# Play 1: Pre-checks and backup on master node
###############################################################################
- name: "Phase 1: Pre-checks and backup"
  hosts: "{{ groups['elasticsearch'][0] }}"
  connection: local
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    env_file_path: /opt/lme/lme-environment.env
    es_port: 9200

  pre_tasks:
    # --- PARITY GATE (B-owned): the validated config is STABLE into the first mutation ----
    # Re-resolve+validate on the master and require the Phase 0 barrier's evidence to match
    # (same per-invocation token AND same content-addressed revision) BEFORE the earliest
    # mutation (setup_lme_scripts.yml, then the backup). Fail-closed: a missing token means
    # the barrier did not run this invocation; a revision drift means the config changed
    # between validation and mutation. any_errors_fatal on the BLOCK so a parity failure
    # aborts before the mutating tasks; scoped to the block so an unrelated later task
    # failure keeps normal semantics.
    - name: Parity gate -- pre-mutation validation stop (master)
      any_errors_fatal: true
      block:
        - name: Parity -- re-resolve+validate this host's declared config (matches the barrier)
          ansible.builtin.include_role:
            name: podman
            tasks_from: load_manifests
            apply:
              tags: ['always']
          tags: ['always']

        - name: Parity -- refuse to mutate unless the barrier validated THIS exact config on THIS host
          ansible.builtin.assert:
            that:
              - _lme_convert_prevalidated is defined
              # token absent -> the Phase 0 barrier did not run this invocation (fail closed).
              - (_lme_convert_prevalidated.token | default('')) == (_lme_convert_barrier_run_token | default('__barrier_did_not_run__'))
              # revision drift -> the config changed between validation and mutation (fail closed).
              - (_lme_convert_prevalidated.revision | default('')) == lme_resolved_revision
            fail_msg: >-
              {{ inventory_hostname }} has no matching pre-mutation validation evidence for THIS
              conversion (expected token
              {{ _lme_convert_barrier_run_token | default('UNSET -- barrier play did not run') }}
              and resolved revision {{ lme_resolved_revision }}). Refusing to enter Phase 1.
            quiet: true
          tags: ['always']
    # --- end PARITY GATE -----------------------------------------------------------------

  tasks:
    - name: Verify this is the master node (local connection)
      assert:
        that:
          - hostvars[inventory_hostname].ansible_connection | default('') == 'local'
        fail_msg: >
          This playbook must be run with a cluster inventory where the first
          elasticsearch host uses ansible_connection=local (the master node).

    - name: Ensure /opt/lme/scripts has the latest helper scripts on master
      ansible.builtin.include_tasks: tasks/setup_lme_scripts.yml

    - name: Read environment file
      include_tasks: tasks/load_env.yml

    - name: Extract secrets for health check
      ansible.builtin.shell: |
        set -a
        export PATH=$PATH:/nix/var/nix/profiles/default/bin
        source {{ clone_directory }}/scripts/extract_secrets.sh -q
        echo "elastic=$elastic"
      args:
        executable: /bin/bash
      register: extract_secrets_result
      no_log: true

    - name: Set elastic credentials
      ansible.builtin.set_fact:
        local_es_url: "{{ env_dict.LOCAL_ES_URL | default('https://localhost:9200') }}"
        elastic_password: "{{ (extract_secrets_result.stdout_lines | select('match', '^elastic=') | list | first).split('=', 1)[1] }}"
      no_log: true

    - name: Check current Elasticsearch health
      uri:
        url: "{{ local_es_url }}/_cluster/health"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: es_health

    - name: Display current cluster state
      debug:
        msg: |
          Current state:
            Cluster name: {{ es_health.json.cluster_name }}
            Status: {{ es_health.json.status }}
            Number of nodes: {{ es_health.json.number_of_nodes }}

    - name: Check current discovery type from quadlet file
      ansible.builtin.shell: |
        grep -c 'discovery.type=single-node' /etc/containers/systemd/lme-elasticsearch.container || echo "0"
      args:
        executable: /bin/bash
      register: discovery_check
      changed_when: false

    - name: Detect partial upgrade state
      ansible.builtin.set_fact:
        is_single_node_config: "{{ discovery_check.stdout | trim | int > 0 }}"
        is_single_node_cluster: "{{ es_health.json.number_of_nodes == 1 }}"
        expected_node_count: "{{ groups['elasticsearch'] | length }}"
        is_partial_upgrade: >-
          {{ (discovery_check.stdout | trim | int == 0) and
             (es_health.json.number_of_nodes | int < (groups['elasticsearch'] | length)) }}

    - name: Display detected state
      debug:
        msg: |
          Detected state:
            Quadlet has discovery.type=single-node: {{ is_single_node_config }}
            Current node count: {{ es_health.json.number_of_nodes }}
            Expected node count: {{ expected_node_count }}
            Partial upgrade detected: {{ is_partial_upgrade }}

    - name: Verify this is a single-node installation or partial upgrade
      assert:
        that:
          - es_health.json.number_of_nodes | int < (groups['elasticsearch'] | length) | int
        fail_msg: >
          This installation already has {{ es_health.json.number_of_nodes }} nodes
          (expected {{ groups['elasticsearch'] | length }}).
          The cluster appears to be fully formed. This playbook is intended for
          converting single-node installations or resuming a partial upgrade.

    - name: Verify current config is single-node (skip if partial upgrade)
      assert:
        that:
          - discovery_check.stdout | trim | int > 0
        fail_msg: >
          The current Elasticsearch quadlet does not contain discovery.type=single-node.
          This host may already be configured for cluster mode.
      when: not (is_partial_upgrade | bool)

    - name: Notify resuming partial upgrade
      debug:
        msg: >
          RESUMING PARTIAL UPGRADE: The quadlet is already in cluster mode but only
          {{ es_health.json.number_of_nodes }} of {{ expected_node_count }} nodes are present.
          Skipping Phase 2 (reconfigure master) and proceeding with certificate
          regeneration and node deployment.
      when: is_partial_upgrade | bool

    - name: Get valid backup choice
      pause:
        prompt: |
          You are about to convert this single-node LME installation to a cluster.
          Do you want to create a backup before converting? (y/yes/n/no)
          This is HIGHLY recommended in case you need to rollback.
      register: backup_choice_loop
      until: backup_choice_loop.user_input | lower in ['y', 'yes', 'n', 'no']
      retries: 999
      delay: 0
      when: skip_prompts is not defined or not skip_prompts | bool

    - name: Set backup choice (interactive)
      set_fact:
        backup_choice: "{{ backup_choice_loop.user_input | lower }}"
      when: skip_prompts is not defined or not skip_prompts | bool

    - name: Set backup choice (automated - no backup)
      set_fact:
        backup_choice: "n"
      when: skip_prompts is defined and skip_prompts | bool

    - name: Record existing indices for post-conversion verification
      uri:
        url: "{{ local_es_url }}/_cat/indices?format=json"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: pre_conversion_indices

    - name: Display index count
      debug:
        msg: "Found {{ pre_conversion_indices.json | length }} existing indices that will be migrated to replicas=1"

    # Caller-side legibility only (backup_lme is D-owned; NOT modified here). The
    # backup_lme data-safety gate (D3b) HARD-FAILS the run if LME containers do not stop
    # cleanly before the volume copy, instead of emitting a torn backup as success. Because
    # this pre-conversion backup runs with skip_service_restart: true, a failure leaves the
    # node in an INTERRUPTED state -- the operator needs to know what that looks like and how
    # to recover, so surface it before the include rather than letting a hard fail read as an
    # opaque abort.
    - name: "Backup safety + interrupted-recovery note (operator-facing)"
      ansible.builtin.debug:
        msg:
          - "Creating a pre-conversion backup via backup_lme (skip_service_restart=true)."
          - "DATA-SAFETY GATE (D3b): backup_lme HARD-FAILS if LME containers do not stop"
          - "  cleanly before the volume copy; it will NOT report a torn backup as success."
          - "IF THE BACKUP FAILS the conversion is INTERRUPTED at Phase 1: backup_lme has"
          - "  stopped lme and force-removed the lme-* containers, and skip_service_restart"
          - "  leaves them stopped. No cluster reconfiguration (Phase 2+) has run, so the"
          - "  quadlet is still single-node on disk."
          - "RECOVERY (in order -- a bare re-run aborts, because Phase 1's ES health check"
          - "  requires a live Elasticsearch and there is no partial-upgrade resume here:"
          - "  the quadlet is still single-node):"
          - "  1) Run 'systemctl start lme' and wait for Elasticsearch to be healthy again"
          - "     (this restores the pre-conversion single-node state)."
          - "  2) Investigate the stuck container(s) named in backup_status.txt"
          - "     (Overall status: UNSAFE) / this run's fail message."
          - "  3) Re-run this playbook (a fresh single-node conversion from Phase 1)."
          - "  Alternatively, to accept a crash-consistent backup and proceed at your own"
          - "  risk, re-run with -e backup_fail_on_unclean_stop=false."
      when: backup_choice in ['y', 'yes']

    - name: Run backup
      include_role:
        name: backup_lme
      vars:
        skip_prompts: true
        skip_service_restart: true  # Leave services stopped; Phase 2 will reconfigure and Phase 4 restarts lme
      when: backup_choice in ['y', 'yes']

###############################################################################
# Play 1b: Verify SSH connectivity to all remote cluster nodes
###############################################################################
- name: "Phase 1b: Verify SSH connectivity to cluster nodes"
  hosts: "elasticsearch:!{{ groups['elasticsearch'][0] }}"
  gather_facts: false
  become: no
  tasks:
    - name: Test SSH connectivity
      ansible.builtin.ping:
      register: ssh_test

    - name: Confirm SSH access
      debug:
        msg: "SSH connectivity confirmed to {{ inventory_hostname }} ({{ ansible_host }})"

###############################################################################
# Play 2: Reconfigure master node for cluster mode
###############################################################################
- name: "Phase 2: Reconfigure master for cluster mode"
  hosts: "{{ groups['elasticsearch'][0] }}"
  connection: local
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"

    # Cluster mode settings
    lme_cluster_mode: true
    es_discovery_type: cluster
    es_seed_hosts: >-
      {%- if es_cluster_seed_hosts is defined -%}
        {%- if es_cluster_seed_hosts is string -%}
          {{ es_cluster_seed_hosts | regex_replace('\\[|\\]', '') | split(',') | map('trim') | list }}
        {%- else -%}
          {{ es_cluster_seed_hosts }}
        {%- endif -%}
      {%- else -%}
        {{ [hostvars[inventory_hostname].ansible_host | default('localhost')] }}
      {%- endif -%}
    es_initial_masters: "{{ es_initial_master_nodes | default(['lme-elasticsearch']) }}"
    es_is_initial_master: true

  tasks:
    - name: Skip Phase 2 (already in cluster mode from previous partial upgrade)
      debug:
        msg: "Skipping Phase 2 - quadlet is already configured for cluster mode."
      when: hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool

    - name: Stop LME service
      systemd:
        name: lme
        state: stopped
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Wait for containers to stop
      ansible.builtin.shell: |
        export PATH=$PATH:/nix/var/nix/profiles/default/bin
        podman ps -a --format "{{ '{{' }}.Names{{ '}}' }}" | grep -E "lme" || true
      args:
        executable: /bin/bash
      register: running_containers
      until: running_containers.stdout_lines | length == 0
      retries: 12
      delay: 5
      ignore_errors: yes
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    # B0 render-path cutover: the master's Elasticsearch unit is re-rendered in
    # cluster mode from the manifest tree, replacing the retired single-file
    # ansible/templates/lme-elasticsearch.container.j2. load_manifests.yml applies
    # the cluster profile (which nulls discovery.type per the null-env-skip
    # contract, so no discovery.type=single-node survives -> the assertion below
    # guards this) and the legacy es_* shim maps this play's es_node_name /
    # es_publish_host / es_cluster_seed_hosts / es_is_initial_master into the ES
    # environment override -- the same inputs the old .j2 consumed. Scoped to the
    # single ES unit (NOT render_units.yml) so the master's other already-deployed
    # units are left untouched.
    - name: Load manifest tree with the cluster profile (master ES re-render)
      ansible.builtin.include_tasks: "{{ clone_directory }}/ansible/roles/podman/tasks/load_manifests.yml"
      vars:
        lme_profile: cluster
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Re-render Elasticsearch quadlet with cluster settings
      ansible.builtin.template:
        src: "{{ clone_directory }}/ansible/templates/units/container.j2"
        dest: /etc/containers/systemd/lme-elasticsearch.container
        owner: root
        group: root
        mode: '0644'
      vars:
        service: "{{ lme_services['elasticsearch'] }}"
        kinds: "{{ lme_service_kinds }}"
        flags: "{{ lme_enable_flags }}"
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Verify quadlet was updated (no longer single-node)
      ansible.builtin.shell: |
        grep -c 'discovery.type=single-node' /etc/containers/systemd/lme-elasticsearch.container || echo "0"
      args:
        executable: /bin/bash
      register: post_render_check
      changed_when: false
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Assert quadlet is now in cluster mode
      assert:
        that:
          - post_render_check.stdout | trim | int == 0
        fail_msg: "Quadlet still contains discovery.type=single-node after re-rendering. Check template variables."
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Display quadlet update confirmation
      debug:
        msg: "Elasticsearch quadlet re-rendered with cluster settings (seed_hosts, publish_host, transport port 9300)"
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

###############################################################################
# Play 3: Regenerate leaf certificates with all cluster node IPs
###############################################################################
- name: "Phase 3: Regenerate leaf certificates for cluster"
  hosts: elasticsearch
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    lme_force_cert_regen: true
    lme_force_ca_regen: false

  tasks:
    - name: Include certs role (reuse CA, regenerate leaf certs with cluster SANs)
      ansible.builtin.include_role:
        name: certs
      run_once: true

###############################################################################
# Play 4: Restart master Elasticsearch in cluster mode
###############################################################################
- name: "Phase 4: Restart master in cluster mode"
  hosts: "{{ groups['elasticsearch'][0] }}"
  connection: local
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"

  tasks:
    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Start LME service (master with cluster config)
      systemd:
        name: lme
        state: started
      when: not (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool)

    - name: Wait for Elasticsearch to be ready on master
      uri:
        url: https://localhost:9200
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: es_ready
      until: es_ready.status is defined and es_ready.status == 200
      retries: 60
      delay: 10

    - name: Display master restart confirmation
      debug:
        msg: "{{ 'Master already running in cluster mode (partial upgrade resume)' if (hostvars[groups['elasticsearch'][0]].is_partial_upgrade | default(false) | bool) else 'Master node restarted in cluster mode and Elasticsearch is responding' }}"

###############################################################################
# Play 5: Deploy Elasticsearch to cluster data nodes
#
# This reuses the same pattern as elasticsearch.yml but only targets non-master
# nodes (those that are not the first host in the elasticsearch group).
###############################################################################
- name: "Phase 5a: Bootstrap Python on cluster nodes"
  hosts: "elasticsearch:!{{ groups['elasticsearch'][0] }}"
  gather_facts: false
  become: yes
  tasks:
    - name: Check if python3 exists
      ansible.builtin.raw: which python3
      register: python3_check
      failed_when: false
      changed_when: false

    - name: Install python3 via raw (Debian/Ubuntu)
      ansible.builtin.raw: apt-get update && apt-get install -y python3 python3-apt
      when: python3_check.rc != 0
      changed_when: true

- name: "Phase 5b: Deploy Elasticsearch to cluster data nodes"
  hosts: "elasticsearch:!{{ groups['elasticsearch'][0] }}"
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    install_user: "{{ ansible_user_id }}"
    debug_mode: false
    # NOTE: offline_mode is deliberately NOT a play var here. A play-scoped default would
    # be captured by the resolver's auto-normalize as a spurious `operator` selection and
    # outrank the selected profile/inventory (codex-check-0200). It is resolved PER-HOST in
    # pre_tasks below (shared podman/resolve entrypoint, lme_profile: cluster) and read as
    # lme_resolved.offline_mode.

    # Storage configuration
    storage_runroot: "/run/containers/storage"
    storage_graphroot: "/var/lib/containers/storage"

    # Directory configuration
    config_dir: "/etc/lme"
    user_config_dir: "/root/.config/containers"
    user_vault_dir: "/etc/lme/vault"
    user_secrets_conf: "/root/.config/containers/containers.conf"
    user_storage_conf: "/root/.config/containers/storage.conf"
    global_storage_conf: "/etc/containers/storage.conf"
    password_file: "/etc/lme/pass.sh"

    # Password configuration
    min_length: 12

    # Elasticsearch configuration
    es_port: 9200

    # Cluster mode
    lme_cluster_mode: true
    elasticsearch_number_of_replicas: 1
    es_discovery_type: cluster
    es_seed_hosts: >-
      {%- if es_cluster_seed_hosts is defined -%}
        {%- if es_cluster_seed_hosts is string -%}
          {{ es_cluster_seed_hosts | regex_replace('\\[|\\]', '') | split(',') | map('trim') | list }}
        {%- else -%}
          {{ es_cluster_seed_hosts }}
        {%- endif -%}
      {%- else -%}
        {{ [es_master_host | default('node1')] }}
      {%- endif -%}
    es_initial_masters: "{{ es_initial_master_nodes | default(['lme-elasticsearch']) }}"
    es_is_initial_master: false

    # Nix configuration
    nix_profile_symlink_path: /nix/var/nix/profiles/default

    # Do not auto-start -- we start ES explicitly after secrets/certs
    lme_autostart: false
    # Same as elasticsearch.yml: prune quadlets only on SSH data nodes, not on local master.
    lme_child_es_only: "{{ (ansible_connection | default('ssh')) != 'local' }}"

    # Skip secret creation on cluster nodes
    lme_skip_secret_creation: true

  pre_tasks:
    # Resolve declared config PER-HOST on the data nodes BEFORE the earliest offline_mode
    # consumer below. This is the SAME shared early-resolve entrypoint load_manifests.yml
    # uses (CR-B3), invoked here via include_role so resolve.yml's role-relative includes
    # (validate_resolved_config.yml) resolve. It passes the SAME lme_profile: cluster as
    # Phase 2's load_manifests (line ~261) so data-node resolution does not diverge from the
    # master re-render. clone_directory is controller-side (resolve reads the manifests via
    # include_vars from the synced repo tree), so this resolves on SSH data nodes too.
    # Publishes lme_resolved.* / lme_enable_flags for the consumers that follow.
    - name: Resolve declared config on data nodes (offline_mode et al.)
      ansible.builtin.include_role:
        name: podman
        tasks_from: resolve
      vars:
        clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
        lme_profile: cluster

    - name: Install ansible-core on cluster nodes (Debian/Ubuntu)
      ansible.builtin.apt:
        name: ansible
        state: present
        update_cache: yes
      become: yes
      when:
        - ansible_os_family == 'Debian'
        - not lme_resolved.offline_mode

    - name: Check if ansible-vault is already available (Red Hat)
      ansible.builtin.command: which ansible-vault
      register: ansible_vault_check
      failed_when: false
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Install ansible-core via pip on cluster nodes (Red Hat)
      when:
        - ansible_os_family == 'RedHat'
        - ansible_vault_check.rc != 0
        - not lme_resolved.offline_mode
      become: yes
      block:
        - name: Install python3-pip for ansible
          ansible.builtin.dnf:
            name:
              - python3-pip
            state: present

        - name: Install ansible-core via pip
          ansible.builtin.pip:
            name: ansible-core
            state: present

        - name: Symlink pip-installed ansible binaries to /usr/bin
          ansible.builtin.shell: |
            for f in /usr/local/bin/ansible*; do
              [ -f "$f" ] && ln -sf "$f" /usr/bin/
            done
          args:
            executable: /bin/bash
          changed_when: true

  roles:
    - role: base
      tags: ['base']
    - role: nix
      tags: ['system']
    - role: podman
      tags: ['system']
    - role: secrets_distribution
      tags: ['secrets']
    - role: certs
      tags: ['certs']

  tasks:
    - name: Re-extract secrets after distribution (cluster nodes)
      ansible.builtin.shell: |
        set -a
        export PATH=$PATH:/nix/var/nix/profiles/default/bin
        export ANSIBLE_VAULT_PASSWORD_FILE=/etc/lme/pass.sh

        elastic_id=""
        wazuh_id=""
        kibana_system_id=""
        wazuh_api_id=""

        while read -r line; do
          id=$(echo "$line" | awk '{print $1}')
          name=$(echo "$line" | awk '{print $2}')
          case "$name" in
            elastic) elastic_id="$id" ;;
            wazuh) wazuh_id="$id" ;;
            kibana_system) kibana_system_id="$id" ;;
            wazuh_api) wazuh_api_id="$id" ;;
          esac
        done < <(podman secret ls --noheading 2>/dev/null)

        elastic=""
        wazuh=""
        kibana_system=""
        wazuh_api=""

        if [ -n "$elastic_id" ] && [ -f "/etc/lme/vault/$elastic_id" ]; then
          elastic=$(ansible-vault view "/etc/lme/vault/$elastic_id" 2>/dev/null | tr -d '\n')
        fi
        if [ -n "$wazuh_id" ] && [ -f "/etc/lme/vault/$wazuh_id" ]; then
          wazuh=$(ansible-vault view "/etc/lme/vault/$wazuh_id" 2>/dev/null | tr -d '\n')
        fi
        if [ -n "$kibana_system_id" ] && [ -f "/etc/lme/vault/$kibana_system_id" ]; then
          kibana_system=$(ansible-vault view "/etc/lme/vault/$kibana_system_id" 2>/dev/null | tr -d '\n')
        fi
        if [ -n "$wazuh_api_id" ] && [ -f "/etc/lme/vault/$wazuh_api_id" ]; then
          wazuh_api=$(ansible-vault view "/etc/lme/vault/$wazuh_api_id" 2>/dev/null | tr -d '\n')
        fi

        echo "elastic=$elastic"
        echo "wazuh=$wazuh"
        echo "kibana_system=$kibana_system"
        echo "wazuh_api=$wazuh_api"
      args:
        executable: /bin/bash
      register: reextract_secrets_vars
      no_log: "{{ not debug_mode }}"
      become: yes

    - name: Update global_secrets after re-extraction
      ansible.builtin.set_fact:
        global_secrets: "{{ global_secrets | default({}) | combine({ item.split('=', 1)[0]: item.split('=', 1)[1] }) }}"
      loop: "{{ reextract_secrets_vars.stdout_lines }}"
      when: item != '' and '=' in item
      no_log: "{{ not debug_mode }}"

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start Elasticsearch unit on cluster node
      ansible.builtin.systemd:
        name: lme-elasticsearch
        state: started
        enabled: true

    - name: Wait for cluster state to be recovered on this node
      uri:
        url: "https://127.0.0.1:9200/_cluster/health"
        method: GET
        user: elastic
        password: "{{ global_secrets.elastic }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: [200]
      register: node_cluster_health
      until: >
        node_cluster_health.status is defined and
        node_cluster_health.status == 200 and
        node_cluster_health.json is defined and
        node_cluster_health.json.status is defined and
        node_cluster_health.json.status != 'red'
      retries: 60
      delay: 10

    - name: Run Elasticsearch post-install configuration
      ansible.builtin.include_role:
        name: elasticsearch
      tags: ['elasticsearch']

###############################################################################
# Play 6: Align snapshot wiring with cluster installer behavior
###############################################################################
- name: "Phase 6: Align snapshot repository wiring across cluster nodes"
  hosts: elasticsearch
  become: yes
  serial: 1
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"

  tasks:
    - name: Check if NFS snapshot mount is present
      ansible.builtin.command: mountpoint -q /mnt/es-snapshots
      register: nfs_snapshot_mount
      changed_when: false
      failed_when: false

    - name: Skip snapshot wiring on nodes without NFS mount
      ansible.builtin.debug:
        msg: "Skipping snapshot wiring on {{ inventory_hostname }} because /mnt/es-snapshots is not mounted."
      when: nfs_snapshot_mount.rc != 0

    - name: Ensure snapshot path is present in path.repo
      ansible.builtin.lineinfile:
        path: /opt/lme/config/elasticsearch.yml
        regexp: '^\s*-\s*/usr/share/elasticsearch/snapshots\s*$'
        line: "    - /usr/share/elasticsearch/snapshots"
        insertafter: '^\s*-\s*/usr/share/elasticsearch/backups\s*$'
      register: snapshot_repo_path
      when: nfs_snapshot_mount.rc == 0

    - name: Ensure quadlet drop-in directory exists
      ansible.builtin.file:
        path: /etc/containers/systemd/lme-elasticsearch.container.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: nfs_snapshot_mount.rc == 0

    - name: Ensure NFS snapshot volume drop-in is present
      ansible.builtin.copy:
        dest: /etc/containers/systemd/lme-elasticsearch.container.d/nfs-mount.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          [Container]
          Volume=/mnt/es-snapshots:/usr/share/elasticsearch/snapshots
      register: snapshot_dropin
      when: nfs_snapshot_mount.rc == 0

    - name: Reload systemd daemon for quadlet updates
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - nfs_snapshot_mount.rc == 0
        - snapshot_repo_path.changed or snapshot_dropin.changed

    - name: Restart Elasticsearch to apply snapshot wiring changes
      ansible.builtin.systemd:
        name: lme-elasticsearch
        state: restarted
        enabled: true
      when:
        - nfs_snapshot_mount.rc == 0
        - snapshot_repo_path.changed or snapshot_dropin.changed

    - name: Wait for local Elasticsearch to recover after restart
      ansible.builtin.uri:
        url: "https://127.0.0.1:9200/_cluster/health"
        method: GET
        user: elastic
        password: "{{ hostvars[groups['elasticsearch'][0]].elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: snapshot_wiring_health
      until: >
        snapshot_wiring_health.json is defined and
        snapshot_wiring_health.json.status is defined and
        snapshot_wiring_health.json.status != 'red'
      retries: 60
      delay: 10
      when:
        - nfs_snapshot_mount.rc == 0
        - snapshot_repo_path.changed or snapshot_dropin.changed

###############################################################################
# Play 7: Post-conversion -- wait for cluster, update replicas
###############################################################################
- name: "Phase 7: Post-conversion verification and replica update"
  hosts: "{{ groups['elasticsearch'][0] }}"
  connection: local
  become: yes
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    env_file_path: /opt/lme/lme-environment.env

  tasks:
    - name: Read environment file
      include_tasks: tasks/load_env.yml

    - name: Extract secrets
      ansible.builtin.shell: |
        set -a
        export PATH=$PATH:/nix/var/nix/profiles/default/bin
        source {{ clone_directory }}/scripts/extract_secrets.sh -q
        echo "elastic=$elastic"
      args:
        executable: /bin/bash
      register: post_extract_result
      no_log: true

    - name: Set elastic credentials
      ansible.builtin.set_fact:
        local_es_url: "{{ env_dict.LOCAL_ES_URL | default('https://localhost:9200') }}"
        elastic_password: "{{ (post_extract_result.stdout_lines | select('match', '^elastic=') | list | first).split('=', 1)[1] }}"
      no_log: true

    - name: Wait for cluster to form (all nodes joined)
      uri:
        url: "{{ local_es_url }}/_cluster/health"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: cluster_health
      until: >
        cluster_health.json is defined and
        cluster_health.json.number_of_nodes | int >= (groups['elasticsearch'] | length)
      retries: 60
      delay: 10

    - name: Display cluster formation result
      debug:
        msg: |
          Cluster formed successfully:
            Status: {{ cluster_health.json.status }}
            Nodes: {{ cluster_health.json.number_of_nodes }}
            Data nodes: {{ cluster_health.json.number_of_data_nodes }}

    - name: Get list of cluster nodes
      uri:
        url: "{{ local_es_url }}/_cat/nodes?format=json"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: cluster_nodes

    - name: Display cluster nodes
      debug:
        msg: "Cluster node: {{ item.name }} ({{ item.ip }}) - {{ item['node.role'] }}"
      loop: "{{ cluster_nodes.json }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Update existing indices to replicas=1
      uri:
        url: "{{ local_es_url }}/*/_settings"
        method: PUT
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          index:
            number_of_replicas: 1
        status_code: [200]
      register: replica_update
      ignore_errors: yes

    - name: Display replica update result
      debug:
        msg: "{{ 'Successfully updated existing indices to replicas=1' if replica_update.status == 200 else 'Warning: Failed to update some index replicas (some system indices may not allow changes)' }}"

    - name: Get Wazuh legacy index template
      uri:
        url: "{{ local_es_url }}/_template/wazuh"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        validate_certs: no
        force_basic_auth: yes
        status_code: [200, 404]
      register: wazuh_legacy_template
      no_log: true

    - name: Update Wazuh legacy template to replicas=1
      uri:
        url: "{{ local_es_url }}/_template/wazuh"
        method: PUT
        user: elastic
        password: "{{ elastic_password }}"
        validate_certs: no
        force_basic_auth: yes
        body_format: json
        body: >-
          {{ wazuh_legacy_template.json.wazuh
             | combine({'settings': {'index': {'number_of_replicas': '1'}}}, recursive=True) }}
        status_code: [200, 201]
      when: wazuh_legacy_template.status == 200
      no_log: true
      ignore_errors: yes

    - name: Get Wazuh composable index templates
      uri:
        url: "{{ local_es_url }}/_index_template/wazuh-states-*"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        validate_certs: no
        force_basic_auth: yes
        status_code: [200, 404]
      register: wazuh_composable_templates
      no_log: true

    - name: Update Wazuh composable index templates to replicas=1
      uri:
        url: "{{ local_es_url }}/_index_template/{{ item.name }}"
        method: PUT
        user: elastic
        password: "{{ elastic_password }}"
        validate_certs: no
        force_basic_auth: yes
        body_format: json
        body: >-
          {{ item.index_template
             | combine({'template': {'settings': {'index': {'number_of_replicas': '1'}}}}, recursive=True) }}
        status_code: [200, 201]
      loop: "{{ wazuh_composable_templates.json.index_templates | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      when: wazuh_composable_templates.status == 200
      no_log: true
      ignore_errors: yes

    - name: Wait for cluster health to stabilize
      uri:
        url: "{{ local_es_url }}/_cluster/health?wait_for_status=yellow&timeout=120s"
        method: GET
        user: elastic
        password: "{{ elastic_password }}"
        force_basic_auth: yes
        validate_certs: no
        status_code: 200
      register: final_health
      retries: 5
      delay: 30

    - name: Verify Kibana is accessible
      uri:
        url: https://localhost:5601/api/status
        method: GET
        validate_certs: no
        status_code: [200, 401]
      register: kibana_check
      retries: 12
      delay: 10
      ignore_errors: yes

    - name: Display conversion summary
      debug:
        msg:
          - "============================================"
          - "  LME Cluster Conversion Complete"
          - "============================================"
          - ""
          - "Cluster health: {{ final_health.json.status }}"
          - "Total nodes: {{ final_health.json.number_of_nodes }}"
          - "Data nodes: {{ final_health.json.number_of_data_nodes }}"
          - "Active shards: {{ final_health.json.active_shards }}"
          - "Relocating shards: {{ final_health.json.relocating_shards }}"
          - "Initializing shards: {{ final_health.json.initializing_shards }}"
          - "Unassigned shards: {{ final_health.json.unassigned_shards }}"
          - ""
          - "Kibana: {{ 'Accessible' if kibana_check.status is defined else 'Check manually at https://<master-ip>:5601' }}"
          - ""
          - "Note: The cluster may be 'yellow' while replica shards are being"
          - "allocated to new nodes. It will turn 'green' once all replicas"
          - "are assigned. Monitor with:"
          - "  curl -sk -u elastic:<password> https://localhost:9200/_cluster/health?pretty"
