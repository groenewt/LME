---
- name: Validate resolved Malcolm application contract
  ansible.builtin.assert:
    that:
      - malcolm_platform_config is mapping
      - malcolm_platform_config.schema_version == 1
      - malcolm_platform_config.phase == 'application'
      - malcolm_platform_config.node == 'silmaril'
      - malcolm_platform_config.application.owner == 'lmemalcolm'
      - malcolm_platform_config.application.runtime == 'docker'
      - malcolm_platform_config.application.runtime_exception | bool
      - malcolm_platform_config.application.vcpus == 8
      - malcolm_platform_config.application.memory_mib == 32768
      - malcolm_platform_config.application.slice_memory_mib == 32704
      - malcolm_platform_config.application.slice_memory_mib + malcolm_platform_config.sink_gateway.memory_mib == malcolm_platform_config.application.memory_mib
      - malcolm_platform_config.application.guest_memory_mib == 49152
      - malcolm_platform_config.capture_fixture.endpoint_scope == 'designated_guest'
      - malcolm_platform_config.capture_fixture.helper.runtime == 'podman'
      - malcolm_platform_config.capture_fixture.helper.rootless | bool
      - malcolm_platform_config.capture_fixture.helper.owner == 'lmecapture'
      - malcolm_platform_config.capture_fixture.helper.uid is integer
      - malcolm_platform_config.capture_fixture.helper.gid is integer
      - malcolm_platform_config.capture_fixture.helper.memory_mib == 32
      - "'@sha256:' in malcolm_platform_config.capture_fixture.helper.image"
      - not (malcolm_platform_config.capture_fixture.capture_on_analysis_host | bool)
      - malcolm_platform_config.tls.certificate_producer == 'main_credential_materializer'
      - malcolm_platform_config.tls.client_authentication == 'required'
      - malcolm_platform_config.tls.verify_mode == 'full'
      - malcolm_platform_config.images | length == 23
      - malcolm_platform_config.runtime_services | length == 27
      - malcolm_platform_config.runtime_roster.services | length == 27
      - malcolm_platform_config.runtime_roster.install_dir == malcolm_platform_config.application.install_dir
      - malcolm_platform_config.runtime_roster.cgroup_parent == 'lme-malcolm.slice'
      - malcolm_platform_config.runtime_roster.logging.driver == 'local'
      - malcolm_platform_config.runtime_roster.logging.options['max-size'] == '10m'
      - malcolm_platform_config.runtime_roster.logging.options['max-file'] == '3'
      - malcolm_platform_config.source_acl | length == 6
      - malcolm_platform_config.sink_gateway.enabled | bool
      - malcolm_platform_config.sink_gateway.listen_host == '127.0.0.1'
      - malcolm_platform_config.sink_gateway.listen_port == 1459
      - malcolm_platform_config.sink_gateway.backend_port == 8445
      - malcolm_platform_config.browser_ui.route_id == 'ui:silmaril:malcolm'
      - malcolm_platform_config.browser_ui.frontend_port == 443
      - malcolm_platform_config.browser_ui.native_backend_port == 8445
      - malcolm_platform_config.browser_ui.serve_target == 'https+insecure://127.0.0.1:8445'
      - malcolm_platform_config.browser_ui.authentication == 'basic'
      - malcolm_platform_config.browser_ui.authorization_file == '/data/lmemalcolm/secrets/malcolm/admin-authorization'
    fail_msg: MAIN must supply the pure, bounded Malcolm application configuration.

- name: Create Malcolm integration directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/lme/integrations, mode: '0755'}
    - {path: /etc/lme, mode: '0755'}
    - {path: /etc/lme/malcolm-platform, mode: '0750'}

- name: Reconcile the dedicated Malcolm runner root against the exact roster
  ansible.builtin.file:
    path: "{{ malcolm_platform_runner_dir }}"
    state: absent

- name: Recreate the dedicated Malcolm runner root
  ansible.builtin.file:
    path: "{{ malcolm_platform_runner_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create only declared Malcolm runner surface directories
  ansible.builtin.file:
    path: "{{ malcolm_platform_runner_dir }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: [bin, lib, manifests, templates]

- name: Install only the declared Malcolm runtime file roster
  ansible.builtin.copy:
    src: "{{ malcolm_platform_runner_source }}/{{ item.path }}"
    dest: "{{ malcolm_platform_runner_dir }}/{{ item.path }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  vars:
    runner_runtime_files:
      - {path: bin/25-install-malcolm-runtime-debian13.sh, mode: '0755'}
      - {path: bin/30-clone-malcolm.sh, mode: '0755'}
      - {path: bin/41-bootstrap-malcolm-auth.py, mode: '0755'}
      - {path: bin/42-install-forwarder-mtls.sh, mode: '0755'}
      - {path: bin/45-harden-malcolm.py, mode: '0755'}
      - {path: bin/47-start-malcolm.sh, mode: '0755'}
      - {path: bin/guest-capture-fixture.py, mode: '0755'}
      - {path: bin/materialize-guest-fixture.py, mode: '0755'}
      - {path: bin/render-malcolm-compose.py, mode: '0755'}
      - {path: bin/validate-live.sh, mode: '0755'}
      - {path: bin/validate-manifests.py, mode: '0755'}
      - {path: bin/verify-source-authorization.py, mode: '0755'}
      - {path: lib/guest_fixture.py, mode: '0644'}
      - {path: lib/lme_adapter.py, mode: '0644'}
      - {path: lib/model.py, mode: '0644'}
      - {path: lib/source_authorization.py, mode: '0644'}
      - {path: manifests/buildout.yaml, mode: '0644'}
      - {path: manifests/dns.yaml, mode: '0644'}
      - {path: manifests/inventory.yaml, mode: '0644'}
      - {path: manifests/security.yaml, mode: '0644'}
      - {path: manifests/services.yaml, mode: '0644'}
      - {path: manifests/tags.yaml, mode: '0644'}
      - {path: manifests/users.yaml, mode: '0644'}
      - {path: templates/96_make_unique-stable.conf, mode: '0644'}
  loop: "{{ runner_runtime_files }}"

- name: Install Malcolm topology contract
  ansible.builtin.copy:
    src: "{{ malcolm_platform_manifest_source }}"
    dest: /etc/lme/malcolm-platform/platform.yml
    owner: root
    group: root
    mode: '0644'

- name: Create owner-local Malcolm receipt gateway directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: lmemalcolm
    group: lmemalcolm
    mode: '0700'
  loop:
    - /data/lmemalcolm/malcolm/sink-proxy/lme_sink_proxy
    - /data/lmemalcolm/config/malcolm
    - /home/lmemalcolm/.config/systemd/user

- name: Install only declared source-scoped gateway modules
  ansible.builtin.copy:
    src: "{{ role_path }}/../../../lme_sink_proxy/{{ item }}"
    dest: "/data/lmemalcolm/malcolm/sink-proxy/lme_sink_proxy/{{ item }}"
    owner: lmemalcolm
    group: lmemalcolm
    mode: '0600'
  loop: [__init__.py, __main__.py, gateway.py]

- name: Install the private Malcolm receipt gateway contract
  ansible.builtin.template:
    src: sink-proxy.json.j2
    dest: /data/lmemalcolm/config/malcolm/sink-proxy.json
    owner: lmemalcolm
    group: lmemalcolm
    mode: '0600'

- name: Install the bounded owner user gateway service
  ansible.builtin.template:
    src: malcolm-sink-proxy.service.j2
    dest: /home/lmemalcolm/.config/systemd/user/malcolm-sink-proxy.service
    owner: lmemalcolm
    group: lmemalcolm
    mode: '0600'

- name: Stage resolved non-secret Malcolm render inputs
  ansible.builtin.copy:
    content: "{{ item.content | to_nice_json }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {content: "{{ malcolm_platform_config.images }}", dest: /etc/lme/malcolm-platform/images.json}
    - {content: "{{ malcolm_platform_config.source_acl }}", dest: /etc/lme/malcolm-platform/source-acl.json}

- name: Bind fixture operations to the designated guest identity
  ansible.builtin.copy:
    content: "{{ malcolm_platform_config.capture_fixture.designated_guest_id }}\n"
    dest: "{{ malcolm_platform_guest_identity_file }}"
    owner: root
    group: root
    mode: '0644'

- name: Run static Malcolm manifest validation
  ansible.builtin.command:
    argv: [python3, "{{ malcolm_platform_runner_dir }}/bin/validate-manifests.py", --allow-placeholders]
  changed_when: false

- name: Install the declared Docker runtime exception on the dedicated guest
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/25-install-malcolm-runtime-debian13.sh"]

- name: Install the aggregate Malcolm memory ceiling
  ansible.builtin.template:
    src: lme-malcolm.slice.j2
    dest: /etc/systemd/system/lme-malcolm.slice
    owner: root
    group: root
    mode: '0644'

- name: Activate the aggregate Malcolm memory ceiling before containers
  ansible.builtin.systemd_service:
    name: lme-malcolm.slice
    daemon_reload: true
    state: started

- name: Materialize the exact pinned upstream repository
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/30-clone-malcolm.sh"]

- name: Configure the fresh upstream checkout noninteractively
  ansible.builtin.command:
    argv: [./scripts/configure, --defaults, --non-interactive]
    chdir: "{{ malcolm_platform_config.application.install_dir }}"
    creates: "{{ malcolm_platform_config.application.install_dir }}/config/process.env"
  become: true
  become_user: lmemalcolm
  environment:
    HOME: /home/lmemalcolm

- name: Apply capture and authentication hardening
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/45-harden-malcolm.py", --malcolm-dir, "{{ malcolm_platform_config.application.install_dir }}"]

- name: Bootstrap the fresh-run native administrator without process-argv hashes
  ansible.builtin.command:
    argv:
      - "{{ malcolm_platform_runner_dir }}/bin/41-bootstrap-malcolm-auth.py"
      - --malcolm-dir
      - "{{ malcolm_platform_config.application.install_dir }}"
      - --username
      - "{{ malcolm_platform_config.bootstrap_admin.username }}"
      - --password-file
      - "{{ malcolm_platform_config.bootstrap_admin.password_file }}"
  become: true
  become_user: lmemalcolm
  environment:
    HOME: /home/lmemalcolm
  no_log: true

- name: Reapply hardening after upstream authentication generation
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/45-harden-malcolm.py", --malcolm-dir, "{{ malcolm_platform_config.application.install_dir }}"]

- name: Install controller-materialized 5045 identities
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/42-install-forwarder-mtls.sh", "{{ malcolm_platform_config.credential_bundle_dir }}", "{{ malcolm_platform_config.tls.server_name }}"]
  no_log: true

- name: Render digest-pinned compose, source-bound 5045, and stable beats pipeline
  ansible.builtin.command:
    argv:
      - "{{ malcolm_platform_runner_dir }}/bin/render-malcolm-compose.py"
      - --malcolm-dir
      - "{{ malcolm_platform_config.application.install_dir }}"
      - --images-json
      - /etc/lme/malcolm-platform/images.json
      - --source-acl-json
      - /etc/lme/malcolm-platform/source-acl.json

- name: Return rendered files to the dedicated Docker owner
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: lmemalcolm
    group: lmemalcolm
    recurse: "{{ item.recurse }}"
  loop:
    - {path: "{{ malcolm_platform_config.application.install_dir }}/generated", recurse: true}
    - {path: "{{ malcolm_platform_config.application.install_dir }}/docker-compose.tailnet.yml", recurse: false}

- name: Start the digest-pinned Malcolm instance
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/47-start-malcolm.sh"]

- name: Verify the active instance before MAIN publishes services
  ansible.builtin.command:
    argv: ["{{ malcolm_platform_runner_dir }}/bin/validate-live.sh", --role, malcolm, --pre-service]
  changed_when: false

- name: Validate the private source-scoped gateway policy before activation
  ansible.builtin.command:
    argv: [python3, -m, lme_sink_proxy, check-config, --config, /data/lmemalcolm/config/malcolm/sink-proxy.json]
    chdir: /data/lmemalcolm/malcolm/sink-proxy
  become: true
  become_user: lmemalcolm
  environment:
    HOME: /home/lmemalcolm
  changed_when: false
  no_log: true

- name: Start the bounded owner-local Malcolm receipt gateway
  ansible.builtin.systemd_service:
    name: malcolm-sink-proxy.service
    scope: user
    daemon_reload: true
    enabled: true
    state: started
  become: true
  become_user: lmemalcolm
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ malcolm_platform_config.application.uid }}"

- name: Require the receipt gateway to bind only its declared loopback port
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 1459
    timeout: 10
  changed_when: false

- name: Create the isolated rootless fixture helper directory
  ansible.builtin.file:
    path: /data/lmecapture/fixture
    state: directory
    owner: lmecapture
    group: lmecapture
    mode: '0700'

- name: Materialize the guest-only capture fixture interface without staging a live claim
  become: true
  become_user: lmecapture
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --pull=never
      - --network=none
      - --read-only
      - --cap-drop=ALL
      - --security-opt=no-new-privileges
      - --memory=32m
      - --pids-limit=32
      - --userns=keep-id
      - --volume={{ malcolm_platform_runner_dir }}:/runner:ro
      - --volume=/data/lmecapture/fixture:/output:rw
      - "{{ malcolm_platform_config.capture_fixture.helper.image }}"
      - python3
      - /runner/bin/materialize-guest-fixture.py
      - --output-dir
      - /output
  register: malcolm_fixture_materialize
  changed_when: "'\"status\":\"fixture_ready\"' in malcolm_fixture_materialize.stdout"
