---
# Resolved, run-scoped physical backup repository contract supplied by the caller
# (produced upstream from declared inventory/profile requirements). The role gates
# this map against the DECLARED POLICY below rather than against fixed demonstration
# literals (see D contract-delta R6_backup_constants_declared_policy).
postgresql_backup_config: {}

# --- Declared backup-repository policy -------------------------------------
# These are DEFAULTS, overridable through the normal Ansible precedence / tier
# chain. They intentionally reproduce the previous demonstration values so the
# role's default behaviour is unchanged, but they are no longer immutable
# literal asserts: an operator/profile may retarget owner, placement, identity
# range and sizing without editing the role. Physical host names are NOT pinned
# here (per contract-delta R2: graph/trixie/silmaril are demonstration-only).
# NOTE: the off-member check below constrains the DECLARED node label only; it
# does not bind that label to the host the play runs on. Preflight's Tailscale
# check binds publish_address to the executing host, but nothing ties the node
# label to it -- see the role's OPEN items.

# Dedicated, rootless backup owner: a distinct service identity, not one of the
# database domain-member owners (see postgresql_platform_owners). Node-level
# off-member durability is enforced separately by postgresql_backup_domain_members.
postgresql_backup_owner: lmebackup
postgresql_backup_owner_group: "{{ postgresql_backup_owner }}"
postgresql_backup_owner_uid: 2400
postgresql_backup_owner_gid: 2400
postgresql_backup_owner_home: /home/lmebackup

# Root-controlled placement prefix; the run directory is <prefix>/<run_id>.
# Must be an absolute path with no traversal component.
postgresql_backup_root_prefix: /home/lme-backups

# Subordinate uid/gid range allocated to the rootless backup owner. Preserves the
# previously verified identity mapping; overridable but still range-checked by
# preflight for overlap with any other identity.
postgresql_backup_subid_start: 20000000
postgresql_backup_subid_count: 65536

# HARD DECLARED MINIMUMS for host commitment. Admission asserts observed
# capacity/reserve are >= these floors (NOT == a fixed literal); an undersized
# host still fails closed. Defaults are the previous fixed 100 GiB commitment.
postgresql_backup_min_capacity_bytes: 107374182400
postgresql_backup_min_reserve_bytes: 107374182400

# Declared HA database domain members (node identities). The backup repository
# node MUST NOT be one of these (a backup on a member node is not durable). This
# is fail-closed: it must be declared non-empty by the consumer, derived from the
# declared inventory/profile requirements -- there is no safe default member set.
postgresql_backup_domain_members: []
