---
# Ansible linear strategy is required: all publications finish before subscribers.
- name: Configure authoritative publications after native schema initialization
  ansible.builtin.include_tasks: provision-domain.yml
  vars:
    postgresql_platform_operation: publications
  loop: "{{ ['hertzbeat', 'vector'] if postgresql_platform_config.profile == 'dual-owned-ha' else ['shared'] }}"
  loop_control:
    loop_var: postgresql_platform_domain

- name: Configure initial-copy subscriptions after all publications exist
  ansible.builtin.include_tasks: provision-domain.yml
  vars:
    postgresql_platform_operation: subscriptions
  loop: "{{ ['hertzbeat', 'vector'] if postgresql_platform_config.profile == 'dual-owned-ha' else ['shared'] }}"
  loop_control:
    loop_var: postgresql_platform_domain
