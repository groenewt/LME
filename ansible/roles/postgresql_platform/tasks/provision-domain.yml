---
- name: Resolve actual domain owner uid
  ansible.builtin.command:
    argv: [id, -u, "{{ postgresql_platform_owners[postgresql_platform_domain].name }}"]
  register: postgresql_platform_uid
  changed_when: false

- name: Apply one owned database phase through strict libpq services
  ansible.builtin.command:
    argv:
      - podman
      - exec
      - --env
      - PGSERVICEFILE=/run/secrets/pg_service.conf
      - "pg-{{ postgresql_platform_domain }}"
      - python3
      - -m
      - scripts.postgresql_platform
      - provision
      - --config
      - "/etc/lme/postgresql/{{ postgresql_platform_domain }}/resolved.json"
      - --domain
      - "{{ postgresql_platform_domain }}"
      - --phase
      - "{{ postgresql_platform_operation }}"
  become: true
  become_user: "{{ postgresql_platform_owners[postgresql_platform_domain].name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ postgresql_platform_uid.stdout }}"
  when: postgresql_platform_config.node == ('trixie' if postgresql_platform_domain == 'hertzbeat' else 'graph')
  changed_when: postgresql_platform_operation != 'ready'
  register: postgresql_platform_operation_result
