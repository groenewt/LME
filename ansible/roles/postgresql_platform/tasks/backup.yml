---
# The physical TLS repository must already be installed. This initial-deployment
# phase targets only each domain's initial primary; later backups use the CLI.
- name: Create and verify the initial off-domain full backup
  ansible.builtin.include_tasks: backup-domain.yml
  loop: "{{ ['hertzbeat', 'vector'] if postgresql_platform_config.profile == 'dual-owned-ha' else ['shared'] }}"
  loop_control:
    loop_var: postgresql_platform_domain
  when: postgresql_platform_config.node == ('trixie' if postgresql_platform_domain == 'hertzbeat' else 'graph')
