---
- name: Start guarded Patroni domain services
  ansible.builtin.include_tasks: start-owner.yml
  loop: "{{ ['hertzbeat', 'vector'] if postgresql_platform_config.profile == 'dual-owned-ha' else ['shared'] }}"
  loop_control:
    loop_var: postgresql_platform_domain

- name: Start owner-local guarded endpoints for the enabled database clients
  ansible.builtin.include_tasks: start-proxy-owner.yml
  loop: "{{ postgresql_platform_config.proxy_owners | default([]) }}"
  loop_control:
    loop_var: postgresql_platform_proxy_owner
