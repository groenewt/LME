---
- name: Create owner-local proxy configuration
  ansible.builtin.file:
    path: "/data/{{ postgresql_platform_proxy_owner }}/config/postgresql"
    state: directory
    owner: "{{ postgresql_platform_proxy_owner }}"
    group: "{{ postgresql_platform_proxy_owner }}"
    mode: '0700'
  become: true

- name: Stage proxy endpoint contracts in the client owner's network
  ansible.builtin.copy:
    src: "{{ postgresql_platform_render_stage.path }}/rendered/{{ postgresql_platform_proxy_owner }}-{{ item }}.json"
    dest: "/data/{{ postgresql_platform_proxy_owner }}/config/postgresql/{{ item }}.json"
    owner: "{{ postgresql_platform_proxy_owner }}"
    group: "{{ postgresql_platform_proxy_owner }}"
    mode: '0600'
  loop: [pg-hertzbeat-rw, pg-vector-rw]
  become: true

- name: Stage owner-local proxy Quadlets
  ansible.builtin.copy:
    src: "{{ postgresql_platform_render_stage.path }}/rendered/{{ postgresql_platform_proxy_owner }}-{{ item }}.container"
    dest: "/home/{{ postgresql_platform_proxy_owner }}/.config/containers/systemd/{{ item }}.container"
    owner: "{{ postgresql_platform_proxy_owner }}"
    group: "{{ postgresql_platform_proxy_owner }}"
    mode: '0600'
  loop: [pg-hertzbeat-rw, pg-vector-rw]
  become: true
