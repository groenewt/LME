---
- name: Resolve actual owner uid
  ansible.builtin.command:
    argv: [id, -u, "{{ postgresql_platform_owners[postgresql_platform_domain].name }}"]
  register: postgresql_platform_uid
  changed_when: false

- name: Start the owner user service through its own runtime
  ansible.builtin.systemd_service:
    name: "pg-{{ postgresql_platform_domain }}.service"
    scope: user
    daemon_reload: true
    state: started
  become: true
  become_user: "{{ postgresql_platform_owners[postgresql_platform_domain].name }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ postgresql_platform_uid.stdout }}"
