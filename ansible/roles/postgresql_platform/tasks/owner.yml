---
- name: Resolve existing rootless service owner
  ansible.builtin.set_fact:
    postgresql_platform_owner: "{{ postgresql_platform_owners[postgresql_platform_domain] }}"

- name: Create only owner-scoped configuration and data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ postgresql_platform_owner.name }}"
    group: "{{ postgresql_platform_owner.name }}"
    mode: '0700'
  loop:
    - "{{ postgresql_platform_owner.home }}/.config/containers/systemd"
    - "/data/{{ postgresql_platform_owner.name }}/config/postgresql"
    - "/data/{{ postgresql_platform_owner.name }}/config/postgresql/{{ postgresql_platform_domain }}"
    - "/data/{{ postgresql_platform_owner.name }}/secrets/postgresql"
    - "/data/{{ postgresql_platform_owner.name }}/volumes/postgresql/{{ postgresql_platform_domain }}"
  become: true

- name: Stage owner rootless Quadlet
  ansible.builtin.copy:
    src: "{{ postgresql_platform_render_stage.path }}/rendered/pg-{{ postgresql_platform_domain }}.container"
    dest: "{{ postgresql_platform_owner.home }}/.config/containers/systemd/pg-{{ postgresql_platform_domain }}.container"
    owner: "{{ postgresql_platform_owner.name }}"
    group: "{{ postgresql_platform_owner.name }}"
    mode: '0600'
  become: true

- name: Stage domain Patroni and backup contracts
  ansible.builtin.copy:
    src: "{{ postgresql_platform_render_stage.path }}/rendered/{{ item.source }}"
    dest: "/data/{{ postgresql_platform_owner.name }}/config/postgresql/{{ item.destination }}"
    owner: "{{ postgresql_platform_owner.name }}"
    group: "{{ postgresql_platform_owner.name }}"
    mode: '0600'
  loop:
    - {source: "patroni-{{ postgresql_platform_domain }}.json", destination: "{{ postgresql_platform_domain }}/patroni.json"}
    - {source: "pgbackrest-{{ postgresql_platform_domain }}.conf", destination: "pgbackrest-{{ postgresql_platform_domain }}.conf"}
  when: postgresql_platform_domain != 'etcd'
  become: true

- name: Stage the resolved node for owner-scoped phase execution
  ansible.builtin.copy:
    content: "{{ postgresql_platform_config | to_nice_json }}"
    dest: "/data/{{ postgresql_platform_owner.name }}/config/postgresql/{{ postgresql_platform_domain }}/resolved.json"
    owner: "{{ postgresql_platform_owner.name }}"
    group: "{{ postgresql_platform_owner.name }}"
    mode: '0600'
  become: true
  when: postgresql_platform_domain != 'etcd'
