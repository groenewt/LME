---
- name: Require actual primary TLS and subscription initial-copy readback
  ansible.builtin.include_tasks: provision-domain.yml
  vars:
    postgresql_platform_operation: ready
  loop: "{{ ['hertzbeat', 'vector'] if postgresql_platform_config.profile == 'dual-owned-ha' else ['shared'] }}"
  loop_control:
    loop_var: postgresql_platform_domain
