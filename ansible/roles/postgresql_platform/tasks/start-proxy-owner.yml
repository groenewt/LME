---
- name: Resolve proxy owner uid
  ansible.builtin.command:
    argv: [id, -u, "{{ postgresql_platform_proxy_owner }}"]
  register: postgresql_platform_proxy_uid
  changed_when: false

- name: Start only the signed-authority database proxy endpoints
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    scope: user
    daemon_reload: true
    state: started
  loop: [pg-hertzbeat-rw, pg-vector-rw]
  become: true
  become_user: "{{ postgresql_platform_proxy_owner }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ postgresql_platform_proxy_uid.stdout }}"
