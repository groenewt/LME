---
# Publish only the known credential values required by this host to later Ansible
# tasks. Podman is the source of truth for both shell and file drivers, so this path
# does not echo values through a helper script or expose them through debug output.

- name: Resolve this host's in-memory credential requirements
  ansible.builtin.set_fact:
    _lme_setup_secret_requirements: >-
      {{ []
         if (lme_skip_secret_creation | default(false) | bool)
         else ((lme_required_secrets | default(lme_known_password_secrets | default([])))
               | intersect(lme_known_password_secrets | default([]))
               | sort) }}
    global_secrets: "{{ global_secrets | default({}) }}"
  no_log: true
  diff: false

- name: Read required credentials from Podman
  ansible.builtin.command:
    argv:
      - podman
      - secret
      - inspect
      - --showsecret
      - "{{ item }}"
      - --format
      - "{% raw %}{{.SecretData}}{% endraw %}"
  environment:
    LME_SECRET_SCOPE_HOST: "{{ inventory_hostname }}"
  become: "{{ lme_secret_distribution_become | default(true) | bool }}"
  changed_when: false
  failed_when: false
  register: _lme_setup_secret_reads
  loop: "{{ _lme_setup_secret_requirements }}"
  no_log: true
  diff: false

- name: Reset sanitized setup-secret errors
  ansible.builtin.set_fact:
    _lme_setup_secret_errors: []

- name: Classify setup-secret failures without retaining payloads
  ansible.builtin.set_fact:
    _lme_setup_secret_errors: >-
      {{ _lme_setup_secret_errors + [ {
           'target': inventory_hostname,
           'secret_ref': item.item,
           'stage': 'local-read',
           'code': (
             'local-permission-denied' if (item.rc | int) == 126 else
             'local-absent' if (item.rc | int) != 0 else
             'empty-payload' if (item.stdout | trim | length) == 0 else
             'malformed-multiline'
           )
         } ] }}
  loop: "{{ _lme_setup_secret_reads.results | default([]) }}"
  when: >-
    (item.rc | int) != 0
    or (item.stdout | trim | length) == 0
    or (item.stdout.splitlines() | length) != 1
  no_log: true
  diff: false

- name: Fail with sanitized local credential diagnostics
  ansible.builtin.assert:
    that:
      - (_lme_setup_secret_errors | length) == 0
    fail_msg: >-
      Local credential setup failed: {{ _lme_setup_secret_errors | to_json }}
    quiet: true

- name: Publish verified required credentials to later in-memory tasks
  ansible.builtin.set_fact:
    global_secrets: >-
      {{ global_secrets | combine({item.item: item.stdout}) }}
  loop: "{{ _lme_setup_secret_reads.results | default([]) }}"
  no_log: true
  diff: false
