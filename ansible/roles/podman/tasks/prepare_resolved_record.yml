- name: Bind source verification arguments from the same captures used by the resolver
  vars:
    _rr_sf: '{{ _lme_global_file.lme_config_registry.remote_harness_schema.source_binding.verification.source_fields }}'
    _rr_pi: '{{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity }}'
  ansible.builtin.set_fact:
    lme_resolved_verification_source: >-
      {{ dict([_rr_sf.binding, _rr_sf.captures, _rr_sf.manifests_dir, _rr_sf.record_blocks]
        | zip([lme_source_binding,
          dict([_rr_pi.global_var, _rr_pi.var] | zip([lme_global_loaded, lme_profile_loaded])),
          lme_manifests_dir, _lme_global_file.lme_global.record_schemas.blocks])) }}
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'

- name: Verify exact source arguments and the actual complete resolved configuration
  vars:
    _rr_sf: '{{ _lme_global_file.lme_config_registry.remote_harness_schema.source_binding.verification.source_fields }}'
    _rr_pi: '{{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity }}'
  ansible.builtin.assert:
    that:
      - >-
        lme_resolved_verification_source | lme_type_aware_equal(dict(
          [_rr_sf.binding, _rr_sf.captures, _rr_sf.manifests_dir, _rr_sf.record_blocks]
          | zip([lme_source_binding,
            dict([_rr_pi.global_var, _rr_pi.var] | zip([lme_global_loaded, lme_profile_loaded])),
            lme_manifests_dir, _lme_global_file.lme_global.record_schemas.blocks])))
      - >-
        lme_resolved | lme_verify_resolved(_lme_global_file.lme_config_registry,
          documents=_lme_rh_documents, admission=_lme_rh_admission,
          source=lme_resolved_verification_source)
    fail_msg: '{{ _lme_global_file.lme_config_registry.resolved_record.diagnostics.source }}'
    quiet: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'
