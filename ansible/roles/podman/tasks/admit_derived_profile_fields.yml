- name: Verify normalized effective selector fields are faithful derived output
  ansible.builtin.assert:
    that:
      - (item in _lme_resolution.resolved) == (item in _lme_profile_composition.overlay.vars)
      - >-
        item not in _lme_resolution.resolved
        or (_lme_resolution.resolved[item] | lme_type_aware_equal(_lme_profile_composition.overlay.vars[item]))
    fail_msg: "{{ _lme_global_file.lme_global.profile_selectors.refusal }}"
    quiet: true
  loop: "{{ _lme_global_file.lme_global.profile_selectors.derived_fields }}"
