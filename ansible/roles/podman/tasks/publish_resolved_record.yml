- name: Require the source-admitted matrix selection and current complete configuration
  vars:
    _rr: '{{ _lme_global_file.lme_config_registry.resolved_record }}'
    _rc: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.resolved_config_record }}'
    _sb: '{{ _lme_global_file.lme_config_registry.remote_harness_schema.source_binding }}'
  ansible.builtin.assert:
    that:
      - lme_matrix_selected_cell is mapping
      - lme_matrix_selected_cell.keys() | sort == _rr.selection_keys | sort
      - lme_matrix_selected_cell.row is mapping
      - lme_matrix_selected_cell.row.id is string
      - lme_matrix_selected_cell.row.id is match(_rr.patterns.cell)
      - lme_matrix_selected_cell.source_commit is string
      - lme_matrix_selected_cell.source_commit is match(_rr.patterns.commit)
      - lme_matrix_selected_cell.source_tree is string
      - lme_matrix_selected_cell.source_tree is match(_rr.patterns.commit)
      - lme_matrix_selected_cell.matrix_sha256 is string
      - lme_matrix_selected_cell.matrix_sha256 is match(_rr.patterns.digest)
      - lme_source_binding[_sb.fields.applicability] == _sb.applicability.applies
      - lme_matrix_selected_cell.source_commit == lme_source_binding[_sb.fields.commit]
      - _rr.producer in _rc.producers
      - _rr.projection_key in lme_resolved
      - lme_resolved_origins is mapping
      - lme_resolved_revision is string
      - lme_resolved_revision is match(_rr.patterns.digest)
      - lme_profile is string
      - >-
        lme_resolved_revision == (lme_resolved | lme_bind_revision(
          _lme_global_file.lme_config_registry,
          [dict([_rr.profile_fields.name, _rr.profile_fields.sha256]
            | zip([lme_profile, lme_profile_loaded[_rr.profile_fields.sha256]]))],
          lme_services, lme_global, lme_host_rendered_services))
      - >-
        lme_resolved | lme_verify_resolved(_lme_global_file.lme_config_registry,
          documents=_lme_rh_documents, admission=_lme_rh_admission,
          source=lme_resolved_verification_source)
    fail_msg: '{{ _rr.diagnostics.input }}'
    quiet: '{{ _rr.atoms.true }}'
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'

- name: Publish the versioned complete record from verified postload facts
  vars:
    _rr: '{{ _lme_global_file.lme_config_registry.resolved_record }}'
  ansible.builtin.set_fact:
    lme_resolved_configuration_record: '{{ lookup(_rr.lookup, _rr.template) | from_yaml }}'
    lme_resolved_configuration_record_text: '{{ lookup(_rr.lookup, _rr.template) }}'
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'

- name: Reject substituted record fields and rendered bytes
  vars:
    _rr: '{{ _lme_global_file.lme_config_registry.resolved_record }}'
    _rc: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.resolved_config_record }}'
  ansible.builtin.assert:
    that:
      - lme_resolved_configuration_record is mapping
      - lme_resolved_configuration_record.keys() | sort == _rc.fields.values() | sort
      - lme_resolved_configuration_record | lme_type_aware_equal(lookup(_rr.lookup, _rr.template) | from_yaml)
      - lme_resolved_configuration_record_text == lookup(_rr.lookup, _rr.template)
      - lme_resolved_configuration_record[_rc.fields.configuration] | lme_type_aware_equal(lme_resolved)
      - lme_resolved_configuration_record[_rc.fields.configuration_revision] == lme_resolved_revision
      - lme_resolved_configuration_record[_rc.fields.cell] == lme_matrix_selected_cell.row.id
      - lme_resolved_configuration_record[_rc.fields.source_commit] == lme_source_binding[_lme_global_file.lme_config_registry.remote_harness_schema.source_binding.fields.commit]
      - lme_resolved_configuration_record[_rc.fields.source_tree] == lme_matrix_selected_cell.source_tree
    fail_msg: '{{ _rr.diagnostics.record }}'
    quiet: '{{ _rr.atoms.true }}'
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'

- name: Publish digest and artifact inputs for the existing managed publisher
  vars:
    _rr: '{{ _lme_global_file.lme_config_registry.resolved_record }}'
    _rc: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.resolved_config_record }}'
    _af: '{{ _rr.atoms.artifact }}'
  ansible.builtin.set_fact:
    lme_resolved_configuration_record_sha256: '{{ lme_resolved_configuration_record_text | hash(_rc.record_digest.algorithm) }}'
    lme_resolved_configuration_artifact: >-
      {{ {_af.content: lme_resolved_configuration_record_text,
          _af.sha256: lme_resolved_configuration_record_text | hash(_rc.record_digest.algorithm),
          _af.basename: lme_matrix_selected_cell.row.id ~ _rc.location.file_suffix,
          _af.directory_env: _rc.location.env,
          _af.mode: _rc.file_mode, _af.revision: lme_resolved_revision} }}
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'

- name: Reject substituted publisher artifact inputs
  vars:
    _rr: '{{ _lme_global_file.lme_config_registry.resolved_record }}'
    _rc: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.resolved_config_record }}'
    _af: '{{ _rr.atoms.artifact }}'
  ansible.builtin.assert:
    that:
      - lme_resolved_configuration_record_sha256 == (lme_resolved_configuration_record_text | hash(_rc.record_digest.algorithm))
      - >-
        lme_resolved_configuration_artifact | lme_type_aware_equal(
          {_af.content: lme_resolved_configuration_record_text,
           _af.sha256: lme_resolved_configuration_record_text | hash(_rc.record_digest.algorithm),
           _af.basename: lme_matrix_selected_cell.row.id ~ _rc.location.file_suffix,
           _af.directory_env: _rc.location.env,
           _af.mode: _rc.file_mode, _af.revision: lme_resolved_revision})
    fail_msg: '{{ _rr.diagnostics.artifact }}'
    quiet: '{{ _rr.atoms.true }}'
  no_log: '{{ _lme_global_file.lme_config_registry.resolved_record.atoms.true }}'
