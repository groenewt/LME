---
# GAP-4 (cross-host secrets, task 3a) -- per-secret FILE-DRIVER push, ordered AFTER the
# secrets_distribution bundle extract.
#
# WHY THIS EXISTS (VERIFIED -- gap4-file-driver-verdict.md, from source):
# The secrets_distribution role tars ONLY pass.sh + vault + containers.conf + secrets.json
# (secrets_distribution/tasks/main.yml:31-40). It carries shell-driver secrets (e.g.
# `elastic`, which lives in /etc/lme/vault) but does NOT carry file-driver secret PAYLOADS,
# which live at /var/lib/containers/storage/secrets/<id> and are NOT in the tar. So
# `litellm_master_key` (a file-driver secret minted by llama_cpp_setup.yml:60-66) does NOT
# ride the bundle. Worse: `tar --overwrite -xzf -C /` (role main.yml:85) OVERWRITES this
# host's secrets.json with the producer's, which indexes the producer's file-driver secrets
# by payload IDs that do NOT exist here -> DANGLING refs (and orphans this host's own
# file-driver payloads). So this per-secret file-driver push is a REPAIR of that
# index-clobber and MUST run AFTER the bundle extract (enforced by site.yml task order).
#
# NAME DERIVATION (no bare hardcoded list): a manifest `secrets:` block declares a secret
# NAME but not its driver, so which declared secrets are the cross-host FILE-driver ones the
# bundle misses cannot be derived from the manifest alone. lme_cross_host_file_secrets names
# that class (default [litellm_master_key]); this task pushes ONLY the intersection of that
# roster with the secret names ENABLED service manifests actually declare -- so a name is
# never pushed unless a manifest declares it (mirrors container_setup.yml:167-175 union).
#
# MECHANISM: read the producer's value with `podman secret inspect --showsecret <name>
# --format '{{.SecretData}}'` (delegate_to the source host) and recreate on the target with
# `podman secret create --driver file --replace <name> -` -- the exact in-repo idiom proven
# for the pgvector file-driver secret in change_passwords.yml:211-248 (PASSWORD_README.md:105).
#
# GATING/ORDERING: included from site.yml gated on lme_distribute_secrets (default false ->
# NO-OP for every single-host deploy), INSTALL-TIME ONLY, AFTER the secrets_distribution
# include (the bundle extract) and BEFORE lme.service starts / llama_cpp_setup mints local
# file-driver secrets (so llama_cpp_setup.yml:64 `grep -q litellm_master_key` then skips
# re-minting and the consumer keeps the PRODUCER's key).
#
# PRECONDITIONS ON THE PRODUCER (operator, R9 -- gated-live, no ansible path): the source
# host must have the file-driver secret(s) present, passwordless sudo (become), and podman on
# PATH. RESIDUALS this wave does NOT close (see the wave report): the same bundle clobber
# leaves the producer's OTHER file-driver secrets (pgvector, webui_api_key, llm-keys)
# dangling here, and lme_skip_secret_creation is ALL-OR-NOTHING -- so this opt-in is only
# deployable on a consumer where those services + the ES/Kibana post-config are scoped OFF
# (GAP-3). pgvector's own per-secret push is the flagged next-phase item.

- name: "GAP-4: determine secrets source host (producer)"
  ansible.builtin.set_fact:
    lme_secrets_source_host: "{{ lme_secrets_source_host | default('localhost') }}"
  run_once: true

- name: "GAP-4: load the manifest tree (lme_services / enable flags) if absent"
  ansible.builtin.include_tasks: "{{ clone_directory }}/ansible/roles/podman/tasks/load_manifests.yml"
  when: lme_services is not defined

# Manifest-derived candidate names: the union of secret names that ENABLED service manifests
# declare (identical derivation to container_setup.yml:167-175's lme_required_secrets union).
- name: "GAP-4: derive secret names declared by ENABLED service manifests"
  ansible.builtin.set_fact:
    _lme_declared_secret_names: >-
      {{ (_lme_declared_secret_names | default([])
          + (item.value.secrets | default([]) | map(attribute='name') | list)) | unique }}
  loop: "{{ lme_services | dict2items }}"
  loop_control:
    label: "{{ item.value.name | default(item.key) }}"
  when: item.value.enabled_when | default(['always']) | is_enabled(lme_enable_flags | default({}))

# The push set = (declared+enabled names) INTERSECT (the cross-host file-driver roster). The
# NAME comes from the manifest; the roster only selects the file-driver/cross-host class the
# manifest cannot express.
- name: "GAP-4: compute the file-driver push set (manifest-declared names ∩ roster)"
  ansible.builtin.set_fact:
    _lme_file_secrets_push: >-
      {{ (_lme_declared_secret_names | default([]))
         | intersect(lme_cross_host_file_secrets | default([])) }}

# Fail LOUD when the LLM stack is enabled but the intersection is empty (a typo in the roster
# or a disabled service): a silent skip would tell the operator they pushed a key they did
# not (same silent-green class distribute_ca.yml:95-108 guards against).
- name: "GAP-4: assert the push set is non-empty when the LLM stack is enabled"
  ansible.builtin.assert:
    that:
      - (_lme_file_secrets_push | length) > 0
    fail_msg: >-
      lme_distribute_secrets is true and install_llm is enabled, but no ENABLED service
      manifest declares any secret in lme_cross_host_file_secrets
      ({{ lme_cross_host_file_secrets | default([]) }}). Declared+enabled secret names:
      {{ _lme_declared_secret_names | default([]) }}. Fix the roster or this host's enable flags.
    success_msg: >-
      Cross-host file-driver secrets to push (repair after bundle extract):
      {{ _lme_file_secrets_push }} (from producer {{ lme_secrets_source_host }}).
  when: install_llm | default(true) | bool

- name: "GAP-4: nothing to push (LLM stack disabled on this host) -- skip"
  ansible.builtin.debug:
    msg: >-
      install_llm is false and no ENABLED service declares a cross-host file-driver secret --
      no per-secret push needed.
  when:
    - not (install_llm | default(true) | bool)
    - (_lme_file_secrets_push | length) == 0

# --- verify + read on the PRODUCER, recreate on the TARGET (only when there is work) --------
# Value-free existence pre-check first (no --showsecret, no no_log) so a producer that lacks
# the secret fails with a DIAGNOSABLE message instead of an opaque no_log'd read failure.
- name: "GAP-4: verify each file-driver secret EXISTS on the producer (metadata only)"
  ansible.builtin.shell: |
    source /root/.profile
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    podman secret inspect {{ item }} >/dev/null
  args:
    executable: /bin/bash
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  changed_when: false
  register: _lme_src_secret_exists
  failed_when: _lme_src_secret_exists.rc != 0
  loop: "{{ _lme_file_secrets_push }}"
  loop_control:
    label: "{{ item }} on {{ lme_secrets_source_host }}"
  when: (_lme_file_secrets_push | length) > 0

- name: "GAP-4: read each file-driver secret value from the producer (run once, delegated)"
  ansible.builtin.shell: |
    source /root/.profile
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    podman secret inspect --showsecret {{ item }} --format '{% raw %}{{.SecretData}}{% endraw %}'
  args:
    executable: /bin/bash
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  no_log: true
  changed_when: false
  register: _lme_file_secret_reads
  failed_when: _lme_file_secret_reads.rc != 0 or (_lme_file_secret_reads.stdout | trim) == ''
  loop: "{{ _lme_file_secrets_push }}"
  loop_control:
    label: "{{ item }}"
  when: (_lme_file_secrets_push | length) > 0

# Shape-assert BEFORE writing: if the --format raw block were ever dropped, `--format ''`
# returns the whole JSON array and we would write JSON bytes into the secret (a green run
# with a silently-wrong secret). Guard: non-empty, no JSON brace, single line. Loops over the
# run_once host's results via hostvars (mirrors secrets_distribution/main.yml:54-57).
- name: "GAP-4: shape-assert each read value is a bare secret (non-empty, no JSON, single line)"
  ansible.builtin.assert:
    that:
      - (item.stdout | length) > 0
      - "'{' not in item.stdout"
      - (item.stdout.splitlines() | length) <= 1
    fail_msg: >-
      Read of file-driver secret '{{ item.item }}' from {{ lme_secrets_source_host }} did not
      return a bare value (empty, or JSON, or multi-line) -- refusing to write a malformed
      secret. Check `podman secret inspect --showsecret {{ item.item }}` on the producer and
      the --format '{{ '{{' }}.SecretData{{ '}}' }}' raw block.
    quiet: true
  loop: "{{ hostvars[ansible_play_hosts[0]]._lme_file_secret_reads.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: (_lme_file_secrets_push | length) > 0

# Recreate on THIS target host, AFTER the bundle extract clobbered the index. --replace
# repairs the dangling ref (or overwrites this host's own key with the producer's). The value
# is passed via the environment (never on the command line) and no_log'd. Mirrors
# change_passwords.yml:244-255.
- name: "GAP-4: (re)create each file-driver secret on this consumer (repair after extract)"
  ansible.builtin.shell: |
    source /root/.profile
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    printf '%s' "$LME_SECRET_VALUE" | podman secret create --driver file --replace {{ item.item }} -
  args:
    executable: /bin/bash
  environment:
    LME_SECRET_VALUE: "{{ item.stdout }}"
  become: true
  no_log: true
  changed_when: true
  loop: "{{ hostvars[ansible_play_hosts[0]]._lme_file_secret_reads.results | default([]) }}"
  loop_control:
    label: "{{ item.item }} (file driver, --replace)"
  when: (_lme_file_secrets_push | length) > 0
