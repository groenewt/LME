---
# Reconcile only the secrets required by services rendered on this host.
# Producer-wide bundle/index copies are unsafe for heterogeneous hosts: they copy
# unrelated credentials, replace the complete target index, and leave file-driver
# entries pointing at payloads that do not exist on the target.

- name: Reconcile host-scoped runtime secrets
  when: not (lme_secret_distribution_complete | default(false) | bool)
  block:
    - name: Resolve the secrets source for this target
      ansible.builtin.set_fact:
        lme_secrets_source_host_effective: "{{ lme_secrets_source_host | default('localhost') }}"

    - name: Load resolved manifests when the caller has not already loaded them
      ansible.builtin.include_tasks: "{{ clone_directory }}/ansible/roles/podman/tasks/load_manifests.yml"
      when: lme_services is not defined

    - name: Reset this host's secret requirement accumulator
      ansible.builtin.set_fact:
        _lme_declared_secret_names: []

    - name: Derive this host's secret requirements from enabled rendered services
      ansible.builtin.set_fact:
        _lme_declared_secret_names: >-
          {{ (_lme_declared_secret_names
              + (item.value.secrets | default([]) | map(attribute='name') | list)) | unique }}
      loop: "{{ lme_services | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      when:
        - item.value.enabled_when | default(['always']) | is_enabled(lme_enable_flags | default({}))
        - item.key not in (lme_child_absent_services | default([]))
        - (lme_host_services | default([]) | length == 0) or (item.key in (lme_host_services | default([])))

    - name: Resolve the authorized distribution set for this host
      ansible.builtin.set_fact:
        _lme_secret_names_to_distribute: >-
          {{ _lme_declared_secret_names
             | intersect(lme_cross_host_file_secrets | default([]))
             | sort }}
        _lme_unauthorized_secret_names: >-
          {{ _lme_declared_secret_names
             | difference(lme_cross_host_file_secrets | default([]))
             | sort }}

    - name: Reject requirements outside the authorized distribution roster
      ansible.builtin.assert:
        that:
          - (_lme_unauthorized_secret_names | length) == 0
        fail_msg: >-
          Secret distribution preflight failed for target {{ inventory_hostname }}:
          stage=requirement-resolution code=distribution-unauthorized
          secret_refs={{ _lme_unauthorized_secret_names | join(',') }}.
          Add only the intended host requirements to lme_cross_host_file_secrets.
        quiet: true

    # --- CC-1 activation guard (before the first target mutation below) ----------
    # Refuse to reconfigure a secret while a consumer of that secret is LIVE on this
    # host. This REPLACES the former umbrella-only check (systemctl is-active
    # lme.service == rc 3): the umbrella target `lme` is deliberately NOT rendered on
    # ES-only cluster data nodes, so is-active returns rc 4 there (systemd reports a
    # not-found unit as rc 4, not 3 -- and that numeric code varies across systemd
    # releases), which both false-FAILED fresh data-node joins and false-PASSED a
    # data-node re-run (the live consumer there is lme-elasticsearch, not lme.service).
    # Instead: derive the enabled, host-scoped services that will actually receive a
    # reconfigured secret (same enabled/child-absent/host-scope predicate the
    # requirement derivation above uses, intersected with the distribution set), then
    # observe each one's OWN unit and key on the PRINTED systemd state word, never the
    # numeric rc. active/activating/reloading/deactivating => LIVE (refuse); inactive/
    # failed/not-found => safe; anything undetermined => refuse fail-closed. Single-host
    # site.yml keeps its protection: with lme_autostart:false the consumers are inactive
    # pre-start (guard passes), and a re-run against a live stack is refused here.
    # NB the unit basename is the manifest `name` (render_units writes <name>.<kind>),
    # not a synthesised "lme-<id>".
    - name: Reset the on-host secret-consumer state accumulators
      ansible.builtin.set_fact:
        _lme_secret_consumer_units: []
        _lme_live_secret_consumers: []
        _lme_unknown_secret_consumers: []

    - name: Derive the on-host units that consume a to-be-distributed secret
      ansible.builtin.set_fact:
        _lme_secret_consumer_units: >-
          {{ (_lme_secret_consumer_units + [ item.value.name ]) | unique }}
      loop: "{{ lme_services | dict2items }}"
      loop_control:
        label: "{{ item.value.name | default(item.key) }}"
      when:
        - item.value.enabled_when | default(['always']) | is_enabled(lme_enable_flags | default({}))
        - item.key not in (lme_child_absent_services | default([]))
        - (lme_host_services | default([]) | length == 0) or (item.key in (lme_host_services | default([])))
        - (item.value.secrets | default([]) | map(attribute='name') | list
            | intersect(_lme_secret_names_to_distribute)) | length > 0

    # is-active always PRINTS the ActiveState word on a real systemd (active/inactive/
    # failed/activating/...); the numeric rc only varies for the not-active cases, so we
    # read the word. The synthetic test systemctl prints nothing and only sets rc
    # (0=active, 3=inactive) -- handled by the empty-stdout shim below, which cannot
    # misfire on real systemd (is-active never returns empty there) and is fail-closed
    # for a real binary error (broken bus -> empty stdout, rc 1 -> undetermined -> refuse).
    - name: Observe each on-host consumer unit's systemd activation state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}.service"
      become: "{{ lme_secret_distribution_become | default(true) | bool }}"
      changed_when: false
      failed_when: false
      register: _lme_secret_consumer_states
      loop: "{{ _lme_secret_consumer_units }}"

    - name: Flag consumer units in a LIVE state (refuse)
      ansible.builtin.set_fact:
        _lme_live_secret_consumers: >-
          {{ _lme_live_secret_consumers + [ item.item ~ '.service' ] }}
      loop: "{{ _lme_secret_consumer_states.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}.service"
      when: >-
        ((item.stdout | default('') | trim) in ['active', 'activating', 'reloading', 'deactivating'])
        or ((item.stdout | default('') | trim) == '' and (item.rc | int) == 0)

    - name: Flag consumer units whose activation state is UNDETERMINED (fail-closed)
      ansible.builtin.set_fact:
        _lme_unknown_secret_consumers: >-
          {{ _lme_unknown_secret_consumers + [ item.item ~ '.service' ] }}
      loop: "{{ _lme_secret_consumer_states.results | default([]) }}"
      loop_control:
        label: "{{ item.item }}.service"
      when: >-
        ((item.stdout | default('') | trim) not in
           ['active', 'activating', 'reloading', 'deactivating', 'inactive', 'failed'])
        and not ((item.stdout | default('') | trim) == '' and (item.rc | int) in [0, 3])

    - name: Refuse unsafe live secret reconfiguration
      ansible.builtin.assert:
        that:
          - (_lme_live_secret_consumers | length) == 0
        fail_msg: >-
          Secret distribution blocked for target {{ inventory_hostname }}:
          stage=activation-guard code=secret-reconfiguration-active
          live_consumers={{ _lme_live_secret_consumers | join(',') }}.
          Stop and recreate the affected consumer(s) through the approved deployment
          workflow before rotating or replacing their Podman secrets.
        quiet: true

    - name: Refuse when a consumer's activation state cannot be determined
      ansible.builtin.assert:
        that:
          - (_lme_unknown_secret_consumers | length) == 0
        fail_msg: >-
          Secret distribution blocked for target {{ inventory_hostname }}:
          stage=activation-guard code=secret-reconfiguration-state-unknown
          undetermined_consumers={{ _lme_unknown_secret_consumers | join(',') }}.
          Refusing to reconfigure secrets while a consumer's systemd state is unreadable.
        quiet: true

    # Every result field is secret-bearing (stdout, stderr, exception text and the
    # loop result), so output and diffs are suppressed unconditionally.
    - name: Read required payloads from the producer
      ansible.builtin.command:
        argv:
          - podman
          - secret
          - inspect
          - --showsecret
          - "{{ item }}"
          - --format
          - "{% raw %}{{.SecretData}}{% endraw %}"
      environment:
        LME_SECRET_SCOPE_HOST: "{{ lme_secrets_source_host_effective }}"
      delegate_to: "{{ lme_secrets_source_host_effective }}"
      become: "{{ lme_secret_distribution_become | default(true) | bool }}"
      changed_when: false
      failed_when: false
      register: _lme_secret_reads
      loop: "{{ _lme_secret_names_to_distribute }}"
      no_log: true
      diff: false

    - name: Reset sanitized producer-read errors
      ansible.builtin.set_fact:
        _lme_secret_distribution_errors: []

    # `item` contains stdout and remains protected.  The resulting fact contains
    # only allowlisted metadata for the separate diagnostic assertion.
    - name: Classify producer-read failures without retaining payloads in diagnostics
      ansible.builtin.set_fact:
        _lme_secret_distribution_errors: >-
          {{ _lme_secret_distribution_errors + [ {
               'target': inventory_hostname,
               'source': lme_secrets_source_host_effective,
               'secret_ref': item.item,
               'stage': 'source-read',
               'code': (
                 'source-permission-denied' if (item.rc | int) == 126 else
                 'source-absent' if (item.rc | int) != 0 else
                 'empty-payload' if (item.stdout | trim | length) == 0 else
                 'malformed-multiline'
               )
             } ] }}
      loop: "{{ _lme_secret_reads.results | default([]) }}"
      when: >-
        (item.rc | int) != 0
        or (item.stdout | trim | length) == 0
        or (item.stdout.splitlines() | length) != 1
      no_log: true
      diff: false

    # Assertion callbacks can include the evaluated object on failure.  Ignore this
    # protected assertion only long enough to emit the sanitized assertion below.
    - name: Shape-assert producer payloads before target mutation
      ansible.builtin.assert:
        that:
          - (_lme_secret_distribution_errors | length) == 0
        quiet: true
      register: _lme_secret_shape_assertion
      ignore_errors: true
      no_log: true
      diff: false

    - name: Fail with sanitized producer-read diagnostics
      ansible.builtin.assert:
        that:
          - (_lme_secret_distribution_errors | length) == 0
        fail_msg: >-
          Secret distribution preflight failed:
          {{ _lme_secret_distribution_errors | to_json }}
        quiet: true

    # Matching payloads are left untouched.  Stale/missing payloads are replaced
    # and immediately read back before consumers can activate.  rc=10 is the
    # private changed sentinel.
    - name: Reconcile and verify each target payload
      ansible.builtin.shell: |
        set -o pipefail
        LME_SECRET_VALUE="$(cat)"
        current=""
        if current="$(podman secret inspect --showsecret "$LME_SECRET_NAME" --format '{% raw %}{{.SecretData}}{% endraw %}' 2>/dev/null)"; then
          if [ "$current" = "$LME_SECRET_VALUE" ]; then
            exit 0
          fi
        fi
        if ! printf '%s' "$LME_SECRET_VALUE" | podman secret create --driver file --replace "$LME_SECRET_NAME" - >/dev/null; then
          exit 41
        fi
        verified="$(podman secret inspect --showsecret "$LME_SECRET_NAME" --format '{% raw %}{{.SecretData}}{% endraw %}' 2>/dev/null)" || exit 42
        [ "$verified" = "$LME_SECRET_VALUE" ] || exit 43
        exit 10
      args:
        executable: /bin/bash
        stdin: "{{ item.stdout }}"
        stdin_add_newline: false
      environment:
        LME_SECRET_SCOPE_HOST: "{{ inventory_hostname }}"
        LME_SECRET_NAME: "{{ item.item }}"
      become: "{{ lme_secret_distribution_become | default(true) | bool }}"
      register: _lme_secret_reconcile
      loop: "{{ _lme_secret_reads.results | default([]) }}"
      changed_when: (_lme_secret_reconcile.rc | int) == 10
      failed_when: false
      no_log: true
      diff: false

    - name: Classify target reconciliation failures without retaining payloads
      ansible.builtin.set_fact:
        _lme_secret_distribution_errors: >-
          {{ _lme_secret_distribution_errors + [ {
               'target': inventory_hostname,
               'source': lme_secrets_source_host_effective,
               'secret_ref': item.item.item,
               'stage': 'target-readback',
               'code': (
                 'target-create-failed' if (item.rc | int) == 41 else
                 'target-unreadable' if (item.rc | int) == 42 else
                 'target-value-mismatch' if (item.rc | int) == 43 else
                 'target-reconcile-failed'
               )
             } ] }}
      loop: "{{ _lme_secret_reconcile.results | default([]) }}"
      when: (item.rc | int) not in [0, 10]
      no_log: true
      diff: false

    - name: Fail with sanitized target-readback diagnostics
      ansible.builtin.assert:
        that:
          - (_lme_secret_distribution_errors | length) == 0
        fail_msg: >-
          Secret distribution failed:
          {{ _lme_secret_distribution_errors | to_json }}
        quiet: true

    - name: Publish required known credentials to later in-memory tasks
      ansible.builtin.set_fact:
        global_secrets: >-
          {{ global_secrets | default({}) | combine({item.item: item.stdout}) }}
      loop: "{{ _lme_secret_reads.results | default([]) }}"
      when: item.item in (lme_known_password_secrets | default([]))
      no_log: true
      diff: false

    - name: Mark this host's scoped reconciliation complete
      ansible.builtin.set_fact:
        lme_secret_distribution_complete: true
