---
# C1-INVOCATION-CONTEXT-01 PCTX-01..14 (codex 894 DEV_892_01 / Q_PI2_A / Q_PI2_C / lifecycle / capture_root; codex 895
# RP07; codex 896 storage_and_secrets; SR-309-05; seat ledger 0f143835 SR-314). The ONE producer of the shared early
# invocation context lme_invocation_context (manifests/global.yml lme_config_registry.remote_harness_schema
# .invocation_context, global r13 G13-01). Included by the podman role BEFORE the global manifest is consumed, so it
# reads only its early inputs (invocation_context.inputs: podman role defaults D12-01, overridden by inventory and by
# explicit invocation) and the words they carry (lme_invocation_words); resolve.yml later requires those words to equal
# the declared words, type-aware (E12). Every mode, kind, connection, path segment, mode bit, threshold, observation
# argv and refusal code below is read from lme_invocation_words; each fail message carries words.refusal and names the
# declared invocation_context.texts key it answers (texts.<key>), never a second copy of the text.
# ONE context per run: a context already in scope is re-admitted and reused, never re-minted per resolve. An ordinary
# run mints one run directory below the capture base (<anchor>/<capture_rel>, or the explicit lme_invocation_root)
# and the context root is its <run>/<words.capture_sub>; a leased run admits the caller-supplied lease (the seed's
# <run directory>/<capture_rel>, remote-harness s28 S28-01) and never mints. Both modes: root = the capture directory,
# run = the name of the directory holding it. Controller work runs once, unprivileged, on the bound controller through
# its declared local connection; ownership by the invoking uid is the proof. The record <root>/<words.record_rel> is
# read back on the controller filesystem. Private names are exactly the global resolver_outputs registers (G13-03);
# each is cleared to two distinct sentinels first, so a caller pin of any of them refuses.

- name: PCTX-01 Refuse an absent early invocation input before any effect (texts.inputs)
  ansible.builtin.assert:
    that:
      - query('ansible.builtin.varnames', '^' ~ item ~ '$') | length == 1
    fail_msg: "PCTX-01 texts.inputs: {{ item }}"
    quiet: true
  loop:
    - clone_directory
    - lme_invocation_mode
    - lme_invocation_lease
    - lme_invocation_controller
    - lme_invocation_anchor
    - lme_invocation_capture_rel
    - lme_invocation_root
    - lme_invocation_owner
    - lme_invocation_temp_rel
    - lme_invocation_words

- name: PCTX-01 Refuse invocation words that are not the words mapping (texts.inputs)
  ansible.builtin.assert:
    that:
      - lme_invocation_words is mapping
      - >-
        (lme_invocation_words | list | sort) == ['admission', 'anchors', 'capture_sub', 'connections', 'context_fields',
        'digest_algorithm', 'fs_observe', 'identity', 'kinds', 'lease_fields', 'modes', 'record_rel', 'refusal', 'run_prefix',
        'stat_mode_digits', 'uid_observe']
      - lme_invocation_words.refusal is string
      - lme_invocation_words.refusal | length > 0
      # C1-SR326 SR-910-RUN-IDENTITY-FIELD: the identity field is a non-empty string and is the LAST context field, the
      # position PCTX-11 publishes the observed identity at; a rename moves both words together or refuses here.
      - lme_invocation_words.identity is mapping
      - lme_invocation_words.identity.field is string
      - lme_invocation_words.identity.field | length > 0
      - lme_invocation_words.context_fields is sequence and lme_invocation_words.context_fields is not string
      - (lme_invocation_words.context_fields | length) > 0
      - (lme_invocation_words.context_fields | last) == lme_invocation_words.identity.field
      # C1-SR922G PART 2 (codex 931 PCTX_FIELD_RANGES): the numeric observed fields' domains are declared (registry r33
      # invocation_context.words.fs_observe.domains), exactly the three numeric fields, each min a non-boolean integer
      - lme_invocation_words.fs_observe.domains is mapping
      - (lme_invocation_words.fs_observe.domains | list | sort) == (['block_size', 'free_blocks', 'free_inodes'])
      - (lme_invocation_words.fs_observe.domains | list) | reject('in', lme_invocation_words.fs_observe.fields) | list | length == 0
      - >-
        lme_invocation_words.fs_observe.domains.values() | map(attribute='min') | reject('integer') | list | length == 0
      - >-
        lme_invocation_words.fs_observe.domains.values() | map(attribute='min') | select('boolean') | list | length == 0
    fail_msg: "PCTX-01 texts.inputs: lme_invocation_words {{ lme_invocation_words | type_debug }}"
    quiet: true

- name: PCTX-01 Refuse a mistyped early input, or a mode and lease that disagree (texts.inputs, texts.lease)
  ansible.builtin.assert:
    that:
      - lme_invocation_mode in (lme_invocation_words.modes.values() | list)
      - (lme_invocation_mode == lme_invocation_words.modes.leased) == (lme_invocation_lease is not none)
      - lme_invocation_controller is mapping
      - (lme_invocation_controller | list | sort) == ['connection', 'kind', 'name']
      - lme_invocation_controller.kind in (lme_invocation_words.kinds.values() | list)
      - lme_invocation_controller.connection in lme_invocation_words.connections
      - (lme_invocation_controller.name is none) == (lme_invocation_controller.kind == lme_invocation_words.kinds.implicit)
      - >-
        lme_invocation_controller.name is none
        or (lme_invocation_controller.name is string and lme_invocation_controller.name | length > 0)
      - lme_invocation_anchor in (lme_invocation_words.anchors.values() | list)
      - lme_invocation_root is none or lme_invocation_root is string
      - >-
        lme_invocation_owner is none
        or (lme_invocation_owner is integer and lme_invocation_owner is not boolean and lme_invocation_owner >= 0)
      - lme_invocation_capture_rel is string
      - lme_invocation_temp_rel is string
      - >-
        (clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root,
        lme_invocation_words.refusal)) is string
      - >-
        (clone_directory | lme_invocation_root(lme_invocation_temp_rel, none, lme_invocation_words.refusal)) is string
    fail_msg: >-
      {{ lme_invocation_words.refusal }}: texts.inputs / texts.lease (PCTX-01) mode {{ lme_invocation_mode }}, lease
      {{ lme_invocation_lease | type_debug }}, controller {{ lme_invocation_controller }}, anchor
      {{ lme_invocation_anchor }}, owner {{ lme_invocation_owner }}
    quiet: true

- name: PCTX-13 Refuse a leased run context that is not exactly the declared lease fields and kinds (texts.lease)
  ansible.builtin.assert:
    that:
      - lme_invocation_lease is mapping
      - (lme_invocation_lease | list | sort) == (lme_invocation_words.lease_fields | sort)
      - lme_invocation_lease.owner is integer
      - lme_invocation_lease.owner is not boolean
      - lme_invocation_lease.delegate is string
      - lme_invocation_lease.delegate | length > 0
      - lme_invocation_lease.root is string
      - lme_invocation_lease.run is string
      - >-
        (clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_lease.root,
        lme_invocation_words.refusal)) == lme_invocation_lease.root
      - (lme_invocation_lease.root | basename) == lme_invocation_words.capture_sub
      - (lme_invocation_lease.root | dirname | basename) == lme_invocation_lease.run
    fail_msg: "{{ lme_invocation_words.refusal }}: texts.lease (PCTX-13) {{ lme_invocation_lease }}"
    quiet: true
  when: lme_invocation_lease is not none

- name: PCTX-02..05 Bind the controller, scan for a context in scope and observe the invoking uid (once per run)
  run_once: true
  become: false
  block:
    - name: PCTX-12 Clear every private producer name to the first sentinel
      ansible.builtin.set_fact:
        _lme_pctx_delegate: []
        _lme_pctx_scan: []
        _lme_pctx_uid: []
        _lme_pctx_root: []
        _lme_pctx_root_st: []
        _lme_pctx_fs: []
        _lme_pctx_tmp: []
        _lme_pctx_run_st: []
        _lme_pctx_rec: []

    - name: PCTX-12 Refuse a pinned private producer name (first sentinel; texts.reuse)
      ansible.builtin.assert:
        that:
          - >-
            [_lme_pctx_delegate, _lme_pctx_scan, _lme_pctx_uid, _lme_pctx_root, _lme_pctx_root_st, _lme_pctx_fs,
            _lme_pctx_tmp, _lme_pctx_run_st, _lme_pctx_rec] == [[], [], [], [], [], [], [], [], []]
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-12) a private producer name is pinned"
        quiet: true

    - name: PCTX-12 Clear every private producer name to the second sentinel
      ansible.builtin.set_fact:
        _lme_pctx_delegate: {}
        _lme_pctx_scan: {}
        _lme_pctx_uid: {}
        _lme_pctx_root: {}
        _lme_pctx_root_st: {}
        _lme_pctx_fs: {}
        _lme_pctx_tmp: {}
        _lme_pctx_run_st: {}
        _lme_pctx_rec: {}

    - name: PCTX-12 Refuse a pinned private producer name (second sentinel; texts.reuse)
      ansible.builtin.assert:
        that:
          - >-
            [_lme_pctx_delegate, _lme_pctx_scan, _lme_pctx_uid, _lme_pctx_root, _lme_pctx_root_st, _lme_pctx_fs,
            _lme_pctx_tmp, _lme_pctx_run_st, _lme_pctx_rec] == [{}, {}, {}, {}, {}, {}, {}, {}, {}]
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-12) a private producer name is pinned"
        quiet: true

    - name: PCTX-02 Refuse a leased delegate that is not an inventory host with a declared local connection (texts.binding)
      ansible.builtin.assert:
        that:
          - lme_invocation_lease.delegate in groups['all']
          - >-
            'ansible_connection' in ([lme_invocation_lease.delegate] | map('extract', hostvars) | first)
          - >-
            ([lme_invocation_lease.delegate] | map('extract', hostvars) | map(attribute='ansible_connection') | first)
            in lme_invocation_words.connections
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.binding (PCTX-02) leased delegate {{ lme_invocation_lease.delegate }}"
        quiet: true
      when: lme_invocation_lease is not none

    - name: PCTX-02 Refuse a named controller host that is absent or not bound to a declared local connection (texts.binding)
      ansible.builtin.assert:
        that:
          - lme_invocation_controller.name in groups['all']
          - >-
            'ansible_connection' in ([lme_invocation_controller.name] | map('extract', hostvars) | first)
          - >-
            ([lme_invocation_controller.name] | map('extract', hostvars) | map(attribute='ansible_connection') | first)
            in lme_invocation_words.connections
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.binding (PCTX-02) host {{ lme_invocation_controller.name }}"
        quiet: true
      when:
        - lme_invocation_lease is none
        - lme_invocation_controller.kind == lme_invocation_words.kinds.host

    - name: PCTX-02 Refuse an absent, empty or ambiguous controller group, or a non-local sole member (texts.binding)
      ansible.builtin.assert:
        that:
          - >-
            (groups | dict2items | selectattr('key', 'eq', lme_invocation_controller.name) | map(attribute='value')
            | map('length') | list) == [1]
          - >-
            'ansible_connection' in ([groups[lme_invocation_controller.name] | first] | map('extract', hostvars) | first)
          - >-
            ([groups[lme_invocation_controller.name] | first] | map('extract', hostvars)
            | map(attribute='ansible_connection') | first) in lme_invocation_words.connections
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.binding (PCTX-02) group {{ lme_invocation_controller.name }}"
        quiet: true
      when:
        - lme_invocation_lease is none
        - lme_invocation_controller.kind == lme_invocation_words.kinds.group

    - name: PCTX-03 Bind the controller delegate (the leased delegate, this run host for kind implicit, the named host or the sole group member)
      ansible.builtin.set_fact:
        _lme_pctx_delegate: >-
          {{ {'host': (lme_invocation_lease.delegate if lme_invocation_lease is not none
          else (inventory_hostname if lme_invocation_controller.kind == lme_invocation_words.kinds.implicit
          else (lme_invocation_controller.name if lme_invocation_controller.kind == lme_invocation_words.kinds.host
          else (groups[lme_invocation_controller.name] | first))))} }}

    - name: PCTX-03 Bind the declared local connection of the controller delegate
      ansible.builtin.set_fact:
        _lme_pctx_delegate: >-
          {{ _lme_pctx_delegate | combine({'connection': (lme_invocation_controller.connection
          if (lme_invocation_lease is none and lme_invocation_controller.kind == lme_invocation_words.kinds.implicit)
          else ([_lme_pctx_delegate.host] | map('extract', hostvars) | map(attribute='ansible_connection') | first))}) }}

    - name: PCTX-03 Refuse a controller delegate without a declared local connection (texts.binding)
      ansible.builtin.assert:
        that:
          - _lme_pctx_delegate is mapping
          - (_lme_pctx_delegate | list | sort) == ['connection', 'host']
          - _lme_pctx_delegate.host is string
          - _lme_pctx_delegate.connection in lme_invocation_words.connections
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.binding (PCTX-03) {{ _lme_pctx_delegate }}"
        quiet: true

    - name: PCTX-04 Scan every inventory and play host for an invocation context already in scope
      ansible.builtin.set_fact:
        _lme_pctx_scan: >-
          {{ (groups['all'] + ansible_play_hosts_all) | unique | map('extract', hostvars)
          | selectattr('lme_invocation_context', 'defined') | map(attribute='lme_invocation_context') | unique | list }}

    - name: PCTX-04 Refuse more than one invocation context in scope (texts.reuse)
      ansible.builtin.assert:
        that:
          - _lme_pctx_scan | length <= 1
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-04) {{ _lme_pctx_scan | length }} contexts in scope"
        quiet: true

    - name: PCTX-05 Refuse an invoking uid that is not a plain integer, or that differs from a pinned owner (texts.owner)
      ansible.builtin.assert:
        that:
          - >-
            (lookup('ansible.builtin.pipe', lme_invocation_words.uid_observe | join(' ')) | int | string)
            == lookup('ansible.builtin.pipe', lme_invocation_words.uid_observe | join(' '))
          - >-
            lme_invocation_owner is none
            or lme_invocation_owner == (lookup('ansible.builtin.pipe', lme_invocation_words.uid_observe | join(' ')) | int)
        fail_msg: >-
          {{ lme_invocation_words.refusal }}: texts.owner (PCTX-05) observed
          {{ lookup('ansible.builtin.pipe', lme_invocation_words.uid_observe | join(' ')) }}, owner {{ lme_invocation_owner }}
        quiet: true

    - name: PCTX-05 Record the invoking uid (a lookup runs on the controller and never becomes)
      ansible.builtin.set_fact:
        _lme_pctx_uid: "{{ lookup('ansible.builtin.pipe', lme_invocation_words.uid_observe | join(' ')) | int }}"

    - name: PCTX-05 Refuse a non-integer recorded uid or a lease owned by another uid (texts.owner, texts.lease)
      ansible.builtin.assert:
        that:
          - _lme_pctx_uid is integer
          - lme_invocation_lease is none or lme_invocation_lease.owner == _lme_pctx_uid
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.owner / texts.lease (PCTX-05) uid {{ _lme_pctx_uid }}"
        quiet: true

- name: PCTX-06..13 Mint, admit or reuse the context on the bound controller (once per run, unprivileged)
  run_once: true
  become: false
  delegate_to: "{{ _lme_pctx_delegate.host }}"
  vars:
    ansible_connection: "{{ _lme_pctx_delegate.connection }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_become: false
  block:
    - name: PCTX-07 Create the ordinary capture base and the controller temporary root (mint only)
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "{{ lme_invocation_words.admission.dir_mode }}"
        follow: false
      loop:
        - "{{ clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root, lme_invocation_words.refusal) }}"
        - "{{ clone_directory | lme_invocation_root(lme_invocation_temp_rel, none, lme_invocation_words.refusal) }}"
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-08 Stat the capture base and the controller temporary root without following links (mint only)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root, lme_invocation_words.refusal) }}"
        - "{{ clone_directory | lme_invocation_root(lme_invocation_temp_rel, none, lme_invocation_words.refusal) }}"
      register: _lme_pctx_root_st
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-08 Observe the filesystem of the capture base and the controller temporary root (mint only)
      ansible.builtin.command:
        argv: "{{ lme_invocation_words.fs_observe.argv + ['--', item] }}"
      loop:
        - "{{ clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root, lme_invocation_words.refusal) }}"
        - "{{ clone_directory | lme_invocation_root(lme_invocation_temp_rel, none, lme_invocation_words.refusal) }}"
      register: _lme_pctx_fs
      changed_when: false
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-08 Refuse a capture base or temporary root that is a link, foreign, wrongly moded, on a refused filesystem or short of capacity (texts.owner, texts.storage)
      ansible.builtin.assert:
        that:
          - item.0.stat.exists
          - item.0.stat.isdir
          - not item.0.stat.islnk
          - item.0.stat.uid == _lme_pctx_uid
          - item.0.stat.mode == lme_invocation_words.admission.dir_mode
          - (item.1.stdout.split() | length) == (lme_invocation_words.fs_observe.fields | length)
          - >-
            (dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).fs_type
            not in lme_invocation_words.admission.refused_fs_types
          # C1-SR922G (HOLE-SEAT-COERCION-FILTER-SWEEP): each observed count is a plain decimal before
          # it is coerced (an int filter turns a malformed field into 0 silently)
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_blocks | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_blocks
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).block_size | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).block_size
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_inodes | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_inodes
          # C1-SR922G PART 2 (codex 931 PCTX_FIELD_RANGES): each round-tripped field is inside its declared domain
          # BEFORE any arithmetic (a canonical negative decimal round-trips; two negatives would multiply to a pass)
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_blocks | int)
            >= lme_invocation_words.fs_observe.domains.free_blocks.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).block_size | int)
            >= lme_invocation_words.fs_observe.domains.block_size.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_inodes | int)
            >= lme_invocation_words.fs_observe.domains.free_inodes.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_blocks | int)
            * ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).block_size | int)
            >= lme_invocation_words.admission.free_bytes_min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip(item.1.stdout.split()))).free_inodes | int)
            >= lme_invocation_words.admission.free_inodes_min
        fail_msg: >-
          {{ lme_invocation_words.refusal }}: texts.owner / texts.storage (PCTX-08) {{ item.0.stat.path }}
          {{ item.0.stat }} {{ item.1.stdout }}
        quiet: true
      loop: "{{ _lme_pctx_root_st.results | zip(_lme_pctx_fs.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-09 Mint this run's directory below the admitted capture base (mint only; the register holds the mint until PCTX-10 stats it)
      ansible.builtin.tempfile:
        state: directory
        path: "{{ clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root, lme_invocation_words.refusal) }}"
        prefix: "{{ lme_invocation_words.run_prefix }}"
      register: _lme_pctx_run_st
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-10 Bind the context root to the minted run's capture directory (mint only)
      ansible.builtin.set_fact:
        _lme_pctx_root: "{{ _lme_pctx_run_st.path ~ '/' ~ lme_invocation_words.capture_sub }}"
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-10 Create the minted run's capture directory (mint only)
      ansible.builtin.file:
        path: "{{ _lme_pctx_root }}"
        state: directory
        mode: "{{ lme_invocation_words.admission.dir_mode }}"
        follow: false
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    - name: PCTX-13 Bind the context root to the admitted lease root (leased admit; never minted)
      ansible.builtin.set_fact:
        _lme_pctx_root: "{{ lme_invocation_lease.root }}"
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.leased

    - name: PCTX-04 Bind the context root to the context in scope (reuse)
      ansible.builtin.set_fact:
        _lme_pctx_root: "{{ (_lme_pctx_scan | first).root }}"
      when: _lme_pctx_scan | length == 1

    - name: PCTX-04 Refuse a context in scope that is malformed, foreign, or does not match this invocation (texts.reuse)
      ansible.builtin.assert:
        that:
          - (_lme_pctx_scan | first) is mapping
          - ((_lme_pctx_scan | first) | list | sort) == (lme_invocation_words.context_fields | sort)
          - (_lme_pctx_scan | first).mode in (lme_invocation_words.modes.values() | list)
          - (_lme_pctx_scan | first).owner == _lme_pctx_uid
          - (_lme_pctx_scan | first).root is string
          - ((_lme_pctx_scan | first).root | basename) == lme_invocation_words.capture_sub
          - ((_lme_pctx_scan | first).root | dirname | basename) == (_lme_pctx_scan | first).run
          - >-
            lme_invocation_mode != lme_invocation_words.modes.leased
            or ((_lme_pctx_scan | first).mode == lme_invocation_words.modes.leased
            and (lme_invocation_words.lease_fields | map('extract', _lme_pctx_scan | first) | list)
            == (lme_invocation_words.lease_fields | map('extract', lme_invocation_lease) | list))
          - >-
            (_lme_pctx_scan | first).mode != lme_invocation_words.modes.ordinary
            or (((_lme_pctx_scan | first).root | dirname | dirname)
            == (clone_directory | lme_invocation_root(lme_invocation_capture_rel, lme_invocation_root,
            lme_invocation_words.refusal))
            and (_lme_pctx_scan | first).run.startswith(lme_invocation_words.run_prefix))
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-04) {{ _lme_pctx_scan | first }}"
        quiet: true
      when: _lme_pctx_scan | length == 1

    - name: PCTX-10 / PCTX-13 Stat the run directory and the context root without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ _lme_pctx_root | dirname }}"
        - "{{ _lme_pctx_root }}"
      register: _lme_pctx_run_st

    - name: PCTX-10 / PCTX-13 Refuse a run directory or context root that is a link, foreign, wrongly moded or on another device (texts.owner)
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - not item.stat.islnk
          - item.stat.uid == _lme_pctx_uid
          - item.stat.mode == lme_invocation_words.admission.dir_mode
          - item.stat.dev == (_lme_pctx_run_st.results | first).stat.dev
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.owner (PCTX-10) {{ item.item }} {{ item.stat }}"
        quiet: true
      loop: "{{ _lme_pctx_run_st.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: PCTX-10 Refuse a minted run directory on another device than its capture base (mint only; texts.storage)
      ansible.builtin.assert:
        that:
          - (_lme_pctx_run_st.results | first).stat.dev == (_lme_pctx_root_st.results | first).stat.dev
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.storage (PCTX-10) {{ _lme_pctx_root }}"
        quiet: true
      when:
        - _lme_pctx_scan | length == 0
        - lme_invocation_mode == lme_invocation_words.modes.ordinary

    # C1-SR323-907e (codex 907 Q-RP06-05; route census item 2): the run directory's stat identity is the
    # words.identity.stat_fields of THIS stat of the directory PCTX admitted (minted, leased or reused), joined by
    # words.identity.separator (the observe_format of the checkout_custody stat_identity). A reused context must carry
    # the identity this re-stat observes: a replaced or re-created run directory refuses (texts.reuse).
    - name: PCTX-04 Refuse a reused context whose recorded run identity is not the run directory observed now (texts.reuse)
      ansible.builtin.assert:
        that:
          # C1-SR326 SR-910-RUN-IDENTITY-FIELD: the recorded field is read through the declared word words.identity.field
          # (no literal field name); its presence is checked before the read.
          - lme_invocation_words.identity.field in (_lme_pctx_scan | first)
          - (_lme_pctx_scan | first)[lme_invocation_words.identity.field] is string
          - >-
            (_lme_pctx_scan | first)[lme_invocation_words.identity.field]
            == (lme_invocation_words.identity.stat_fields | map('extract', (_lme_pctx_run_st.results | first).stat)
            | map('string') | join(lme_invocation_words.identity.separator))
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-04) run identity {{ (_lme_pctx_scan | first) | dict2items | selectattr('key', 'equalto', lme_invocation_words.identity.field) | map(attribute='value') | list | to_json }}"
        quiet: true
      when: _lme_pctx_scan | length == 1

    - name: PCTX-12 Clear the published context to the first sentinel
      ansible.builtin.set_fact:
        lme_invocation_context: []

    - name: PCTX-12 Refuse a pinned published context (first sentinel; texts.reuse)
      ansible.builtin.assert:
        that:
          - lme_invocation_context == []
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-12) lme_invocation_context is pinned"
        quiet: true

    - name: PCTX-12 Clear the published context to the second sentinel
      ansible.builtin.set_fact:
        lme_invocation_context: {}

    - name: PCTX-12 Refuse a pinned published context (second sentinel; texts.reuse)
      ansible.builtin.assert:
        that:
          - lme_invocation_context == {}
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-12) lme_invocation_context is pinned"
        quiet: true

    - name: PCTX-11 Publish the minted or admitted context (exactly words.context_fields)
      ansible.builtin.set_fact:
        lme_invocation_context: >-
          {{ dict(lme_invocation_words.context_fields | zip([lme_invocation_mode,
          (lme_invocation_words.kinds.host if lme_invocation_mode == lme_invocation_words.modes.leased
          else lme_invocation_controller.kind),
          (none if (lme_invocation_mode == lme_invocation_words.modes.ordinary
          and lme_invocation_controller.kind == lme_invocation_words.kinds.implicit)
          else _lme_pctx_delegate.host),
          _lme_pctx_delegate.connection, _lme_pctx_uid, _lme_pctx_root, _lme_pctx_root | dirname | basename,
          (lme_invocation_words.identity.stat_fields | map('extract', (_lme_pctx_run_st.results | first).stat)
          | map('string') | join(lme_invocation_words.identity.separator))])) }}
      when: _lme_pctx_scan | length == 0

    - name: PCTX-11 Publish the re-admitted context in scope (reuse)
      ansible.builtin.set_fact:
        lme_invocation_context: "{{ _lme_pctx_scan | first }}"
      when: _lme_pctx_scan | length == 1

    - name: PCTX-11 Write the context record once (never over an existing record)
      ansible.builtin.copy:
        content: "{{ lme_invocation_context | to_nice_yaml }}"
        dest: "{{ _lme_pctx_root ~ '/' ~ lme_invocation_words.record_rel }}"
        mode: "{{ lme_invocation_words.admission.file_mode }}"
        force: false
      register: _lme_pctx_rec
      when: _lme_pctx_scan | length == 0

    - name: PCTX-11 Refuse a written record that is foreign or wrongly moded (texts.owner)
      ansible.builtin.assert:
        that:
          - not _lme_pctx_rec.changed or _lme_pctx_rec.uid == _lme_pctx_uid
          - not _lme_pctx_rec.changed or _lme_pctx_rec.mode == lme_invocation_words.admission.file_mode
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.owner (PCTX-11) {{ _lme_pctx_rec }}"
        quiet: true
      when: _lme_pctx_scan | length == 0

    - name: PCTX-12 Refuse a record on the controller filesystem that differs from the published context (texts.reuse)
      ansible.builtin.assert:
        that:
          - >-
            lookup('ansible.builtin.file', _lme_pctx_root ~ '/' ~ lme_invocation_words.record_rel, rstrip=false)
            == (lme_invocation_context | to_nice_yaml)
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (PCTX-12) {{ _lme_pctx_root }}"
        quiet: true

- name: PCTX-14 Admit each remote target's declared temporary root before any target mutation (per host, unprivileged)
  become: false
  vars:
    ansible_become: false
  when: >-
    not (query('ansible.builtin.varnames', '^ansible_connection$') | length == 1
    and lookup('ansible.builtin.vars', 'ansible_connection') in lme_invocation_words.connections)
  block:
    - name: PCTX-14 Refuse a remote target without an absolute normal-form temporary root (texts.storage)
      ansible.builtin.assert:
        that:
          - query('ansible.builtin.varnames', '^ansible_remote_tmp$') | length == 1
          - lookup('ansible.builtin.vars', 'ansible_remote_tmp') is string
          - >-
            (clone_directory | lme_invocation_root(lme_invocation_capture_rel,
            lookup('ansible.builtin.vars', 'ansible_remote_tmp'), lme_invocation_words.refusal))
            == lookup('ansible.builtin.vars', 'ansible_remote_tmp')
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.storage (PCTX-14) {{ inventory_hostname }}"
        quiet: true

    - name: PCTX-14 Stat the target temporary root without following links
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', 'ansible_remote_tmp') }}"
        follow: false
        get_checksum: false
      register: _lme_pctx_tmp

    - name: PCTX-14 Observe the target uid and the filesystem of the target temporary root (the register reuses the PCTX-08 name after PCTX-08 consumed it)
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - "{{ lme_invocation_words.uid_observe }}"
        - "{{ lme_invocation_words.fs_observe.argv + ['--', lookup('ansible.builtin.vars', 'ansible_remote_tmp')] }}"
      register: _lme_pctx_fs
      changed_when: false

    - name: PCTX-14 Refuse a target temporary root that is a link, foreign, wrongly moded, on a refused filesystem or short of capacity (texts.owner, texts.storage)
      ansible.builtin.assert:
        that:
          - _lme_pctx_tmp.stat.exists
          - _lme_pctx_tmp.stat.isdir
          - not _lme_pctx_tmp.stat.islnk
          - _lme_pctx_tmp.stat.mode == lme_invocation_words.admission.dir_mode
          - >-
            ((_lme_pctx_fs.results | first).stdout | int | string) == (_lme_pctx_fs.results | first).stdout
          - _lme_pctx_tmp.stat.uid == ((_lme_pctx_fs.results | first).stdout | int)
          - ((_lme_pctx_fs.results | last).stdout.split() | length) == (lme_invocation_words.fs_observe.fields | length)
          - >-
            (dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).fs_type
            not in lme_invocation_words.admission.refused_fs_types
          # C1-SR922G (HOLE-SEAT-COERCION-FILTER-SWEEP): each observed count is a plain decimal before it is coerced
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_blocks | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_blocks
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).block_size | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).block_size
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_inodes | int | string)
            == (dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_inodes
          # C1-SR922G PART 2 (codex 931 PCTX_FIELD_RANGES): each field inside its declared domain before any arithmetic
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_blocks | int)
            >= lme_invocation_words.fs_observe.domains.free_blocks.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).block_size | int)
            >= lme_invocation_words.fs_observe.domains.block_size.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_inodes | int)
            >= lme_invocation_words.fs_observe.domains.free_inodes.min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_blocks | int)
            * ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).block_size | int)
            >= lme_invocation_words.admission.free_bytes_min
          - >-
            ((dict(lme_invocation_words.fs_observe.fields | zip((_lme_pctx_fs.results | last).stdout.split()))).free_inodes | int)
            >= lme_invocation_words.admission.free_inodes_min
        fail_msg: >-
          {{ lme_invocation_words.refusal }}: texts.owner / texts.storage (PCTX-14) {{ inventory_hostname }}
          {{ _lme_pctx_tmp.stat }} {{ _lme_pctx_fs.results | map(attribute='stdout') | list }}
        quiet: true
