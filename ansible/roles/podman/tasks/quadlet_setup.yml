---
# Quadlet setup tasks for podman role
#
# Control-plane cutover (B0): units are no longer copied from quadlet/ or rendered
# from per-file .j2 templates. The manifest tree (manifests/) is loaded into facts
# by load_manifests.yml and every ENABLED service is rendered by render_units.yml.
# This file keeps only the non-render concerns: config files, the systemd drop-in
# directory, the podman quadlet helper/generator wiring, SELinux contexts,
# daemon-reload and starting lme.service.

# Load the manifest tree FIRST. load_manifests.yml applies the active profile's
# `vars:` as facts (e.g. profiles/offline.yml sets offline_mode /
# install_elastic_services), and the "Configure Kibana for offline mode" task
# below consults offline_mode -- so the load must precede it. It also produces
# lme_global / lme_services / lme_service_kinds / lme_enable_flags that
# render_units.yml consumes. Manifest reads are controller-side (include_vars /
# find with delegate_to localhost), so child SSH nodes need no repo copy.
- name: Load service manifests into facts
  ansible.builtin.include_tasks: load_manifests.yml

- name: Copy config files /opt/lme/config
  copy:
    src: "{{ clone_directory }}/config/"
    dest: /opt/lme/config/
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
    force: "{{ lme_force_config | default(false) }}"
  become: yes

- name: Render Elasticsearch config (cluster-aware)
  template:
    src: "{{ clone_directory }}/ansible/templates/elasticsearch.yml.j2"
    dest: /opt/lme/config/elasticsearch.yml
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
  become: yes

# Configure Kibana for offline/air-gapped mode BEFORE starting services
# This must happen after config files are copied but before LME service starts
- name: Configure Kibana for offline mode
  blockinfile:
    path: /opt/lme/config/kibana.yml
    marker: "# {mark} ANSIBLE MANAGED BLOCK - OFFLINE MODE"
    block: |
      xpack.fleet.registryUrl: "https://lme-fleet-distribution:8080"
      xpack.fleet.isAirGapped: true
  become: yes
  when: offline_mode | default(false)

- name: Create /etc/containers/systemd
  file:
    path: /etc/containers/systemd
    state: directory
    owner: "root"
    group: "root"
    mode: '0744'
  become: yes

# ---------------------------------------------------------------------------
# Child (ES-only) prune set, derived from MANIFEST keys (never from globbing
# quadlet/). render_units.yml skips any service id present in
# lme_child_absent_services. Computed per-host from that host's own lme_services,
# so there is no run_once propagation hazard. Left undefined on the master
# (lme_child_es_only=false) -> render_units falls back to default([]) and renders
# the full stack, including the lme.service umbrella target.
# ---------------------------------------------------------------------------
- name: Compute child-absent services (manifest ids minus child-active)
  ansible.builtin.set_fact:
    lme_child_absent_services: >-
      {{ lme_services.keys() | list | difference(lme_child_active_services) }}
  when: lme_child_es_only | default(false) | bool

# `difference` silently ignores active ids that have no matching manifest, so a
# typo in lme_child_active_services (or an MA-agent naming a volume differently)
# would drop that unit from child nodes with no error. Surface both the prune set
# and any active id lacking a manifest here (diagnostic only -- not an assert,
# because backups/kibanadata/setup-certs manifests may not have landed yet).
- name: Show child prune set and any unmatched active ids (diagnostic)
  ansible.builtin.debug:
    msg:
      child_absent_services: "{{ lme_child_absent_services }}"
      active_ids_without_manifest: "{{ lme_child_active_services | difference(lme_services.keys() | list) }}"
  when: lme_child_es_only | default(false) | bool

- name: Render all enabled service units from manifests
  ansible.builtin.include_tasks: render_units.yml

# Ensure quadlet helper and systemd generator are available from standard paths
# Skip for RHEL offline mode - system podman already has these in place
- name: Ensure /usr/libexec/podman exists
  file:
    path: /usr/libexec/podman
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Link quadlet helper into /usr/libexec/podman
  file:
    src: /nix/var/nix/profiles/default/libexec/podman/quadlet
    dest: /usr/libexec/podman/quadlet
    state: link
    force: true
  become: yes
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Ensure podman systemd generator is linked
  file:
    src: /nix/var/nix/profiles/default/libexec/podman/quadlet
    dest: /usr/lib/systemd/system-generators/podman-system-generator
    state: link
    force: true
  become: yes
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Restore contexts on quadlet/generator paths (best-effort)
  command: restorecon -v /usr/libexec/podman/quadlet /usr/lib/systemd/system-generators/podman-system-generator
  changed_when: false
  failed_when: false
  become: yes
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

# For RHEL offline mode - verify system podman quadlet is available
- name: Verify system podman quadlet exists (RHEL offline)
  stat:
    path: /usr/libexec/podman/quadlet
  register: system_podman_quadlet
  when: offline_mode | default(false) and ansible_os_family == "RedHat"

- name: Fail if system podman quadlet not found (RHEL offline)
  fail:
    msg: "System podman quadlet not found. Please ensure podman RPM is properly installed."
  when:
    - offline_mode | default(false) and ansible_os_family == "RedHat"
    - not system_podman_quadlet.stat.exists

# ---------------------------------------------------------------------------
# Apply SELinux contexts after podman installation and symlink creation
# ---------------------------------------------------------------------------

# Apply SELinux contexts to paths (now that podman_policy module defines the contexts)
- name: Apply SELinux contexts to system generator paths (if they exist)
  command: restorecon -Rv "{{ item }}"
  changed_when: false
  failed_when: false
  become: yes
  loop:
    - "/usr/libexec/podman/quadlet"
    - "/usr/lib/systemd/system-generators/podman-system-generator"
    - "/usr/lib/systemd/system-generators"
    - "/etc/systemd/system-generators"  # May be created by systemd after module load
    - "/etc/containers/systemd"
  when:
    - selinux_available | default(false)
    - (getenforce_out.stdout | default('') | trim) != 'Disabled'

- name: Apply SELinux contexts to Nix paths (final podman restorecon)
  command: restorecon -Rv "{{ item }}"
  changed_when: false
  failed_when: false
  become: yes
  loop:
    - "/nix/var/nix/profiles/default"
    - "/nix/store"
  when:
    - selinux_available | default(false)
    - (getenforce_out.stdout | default('') | trim) != 'Disabled'
    - not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: Start LME service
  systemd:
    name: lme.service
    state: started
    enabled: yes
  become: yes
  when: lme_autostart | default(true) | bool
