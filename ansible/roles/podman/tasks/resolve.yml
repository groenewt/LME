# --- C1 caller-input contract: capture pristine operator selections, compose, resolve ---
# codex-manager-caller-contract-decisions-20260923-0200 + advisor split-brain correction.
#
# Inputs arrive namespaced in `lme_inputs` (selections + observations + origins). A
# NORMALIZED entrypoint (site.yml pre_tasks) sets it from hostvars before the first load;
# an UN-NORMALIZED entrypoint (upgrade_lme / elasticsearch / convert_to_cluster / the
# golden harness) leaves it undefined.
#
# SPLIT-BRAIN FIX: the previous auto-normalize was ALL-OR-NOTHING (`when: lme_inputs is
# not defined`). A caller that supplied ONLY observations (B's CR-B1 upgrade-fallback
# path passes `lme_inputs: {observations: {...}}`) SKIPPED the whole capture, so
# `selections` collapsed to {} and an operator `-e install_llm=false` DROPPED OUT of the
# resolution (lme_enable_flags.install_llm went true) while the bare `install_llm` fact
# stayed false (-e outranks set_fact) -- split-brain rendering. We now capture the
# operator selection scope into a C1-PRIVATE fact (NEVER the caller-input name
# lme_inputs) and COMPOSE it with any caller-supplied lme_inputs parts every load, so
# observations and operator selections coexist.
#
# PRISTINE capture: read the bare variable scope for declared registry fields ONCE, on
# the FIRST load -- BEFORE the bare-name bridge below writes any fact -- so it captures
# the genuine operator -e / inventory / include_role `vars:` selections and is immune to
# later bridge pollution. (This is WHY bare `vars` cannot simply be re-read each load:
# this file's own compat bridge set_facts them, so a later re-read would see resolved
# OUTPUTS masquerading as operator inputs.) Guarded once; a later load reuses the pristine
# capture rather than re-reading the now-polluted bare scope. Its removal condition is
# B/E normalizing their entrypoints to set lme_inputs.selections themselves.
- name: Capture pristine operator selections once (C1-private fact; never lme_inputs)
  ansible.builtin.set_fact:
    # Registry field list + present-in-scope subset are computed INLINE (not task `vars:`):
    # an extra-var outranks a task var, so `-e _lme_sel_keys=[]` / `-e _lme_reg_keys=[]`
    # would otherwise empty the capture and discard every admitted selection while a
    # read-back recomputed from the same pinned object agreed (C1-DERIVED-EFFECTIVE-INPUTS-
    # PIN, one hop up). The split-brain invariant at the end of this file is the backstop.
    _lme_operator_selections: >-
      {{ dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
              | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                    | map('extract', vars) | list)) }}
  # C1-SR922D: capture-once by MEMBERSHIP of the C1-private name (absent on the first load of a play, present after)
  when: query('ansible.builtin.varnames', '^_lme_operator_selections$') | length == 0

# C1-SR922D (codex 924; no-exemption fallback removal): every input the composition, the resolver, the scope context and
# the read-back guards below read is admitted here by MEMBERSHIP and type, parent before child (asserts stop at the
# first false), BEFORE its first read. REQUIRED: profile_overlay.vars and profile_overlay.lme_global (every profile
# declares both; the overlay lme_global rule of F05-S4 below), the pristine capture (a mapping), and the two registry
# caller_inputs declarations. OPTIONAL by declaration: lme_inputs (caller_inputs.lme_inputs) -- when its declared var is
# in vars it must be a mapping whose keys are declared members and whose members are mappings. The message renders
# no input value, only type names of values proven present.
- name: Refuse an absent or mistyped overlay, pristine capture or caller-input declaration (typed, before any read)
  ansible.builtin.assert:
    that:
      - "'profile_overlay' in _lme_profile_file and _lme_profile_file.profile_overlay is mapping"
      - "'vars' in _lme_profile_file.profile_overlay and _lme_profile_file.profile_overlay.vars is mapping"
      - "'lme_global' in _lme_profile_file.profile_overlay and _lme_profile_file.profile_overlay.lme_global is mapping"
      - "query('ansible.builtin.varnames', '^_lme_operator_selections$') | length == 1 and _lme_operator_selections is mapping"
      - "'caller_inputs' in _lme_global_file.lme_config_registry and _lme_global_file.lme_config_registry.caller_inputs is mapping"
      - "'lme_global_override' in _lme_global_file.lme_config_registry.caller_inputs and _lme_global_file.lme_config_registry.caller_inputs.lme_global_override is mapping"
      - "'var' in _lme_global_file.lme_config_registry.caller_inputs.lme_global_override and _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var is string"
      - "'absent' in _lme_global_file.lme_config_registry.caller_inputs.lme_global_override and _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent is mapping"
      - "'lme_inputs' in _lme_global_file.lme_config_registry.caller_inputs and _lme_global_file.lme_config_registry.caller_inputs.lme_inputs is mapping"
      - "['var', 'members', 'absent', 'member_absent', 'refusal'] | reject('in', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs) | list | length == 0"
      - _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var is string
      - _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.members is sequence
      - _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent is mapping
      - _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.member_absent is mapping
      - _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.refusal is string
    fail_msg: >-
      lme: profile {{ lme_profile }} or the registry caller_inputs declaration is not admitted (C1-SR922D): the profile
      must declare profile_overlay.vars and profile_overlay.lme_global as mappings, the pristine operator capture must
      be a mapping, and lme_config_registry.caller_inputs must declare lme_global_override {var, absent} and lme_inputs
      {var, members, absent, member_absent, refusal}; nothing was resolved.
    quiet: true

- name: Refuse a supplied lme_inputs that is not a mapping over its declared members (typed, before any read)
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) is mapping
      - >-
        lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) | list
        | reject('in', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.members) | list | length == 0
      - >-
        _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.members
        | select('in', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var))
        | map('extract', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var))
        | reject('mapping') | list | length == 0
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.refusal }}: a supplied
      {{ _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var }} must be a mapping whose keys are among
      {{ _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.members | to_json }}, each a mapping (got type
      {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) | type_debug }}); nothing was resolved.
    quiet: true
  when: _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars

# C1-CONFLICTING-INPUT-PRECEDENCE. Before composing, REJECT the ambiguous case where the
# pristine operator capture (native extra-var/inventory precedence already chose this
# winner) and a caller-normalized lme_inputs.selections DISAGREE on a key. Previously the
# caller value combined ON TOP, so a lower-tier namespaced install_llm=true silently
# overwrote a captured extra-var install_llm=false in the resolver while Ansible's bare
# extra-var stayed false -- split-brain. Agreeing keys are fine; only a genuine value
# disagreement (unestablishable provenance) fails here. Removal condition: B/E normalize
# their entrypoints to set lme_inputs.selections themselves (then the pristine capture is
# redundant, not conflicting).
- name: Reject conflicting operator vs namespaced selection (C1-CONFLICTING-INPUT-PRECEDENCE)
  ansible.builtin.assert:
    that:
      - (_lme_operator_selections | lme_selection_conflicts(((lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent).selections if ('selections' in (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent)) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.member_absent), _lme_global_file.lme_config_registry)) | length == 0
    fail_msg: >-
      config selection conflict on {{ _lme_operator_selections | lme_selection_conflicts(((lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent).selections if ('selections' in (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent)) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.member_absent), _lme_global_file.lme_config_registry) }}
      -- given BOTH as a native operator selection (extra-var/inventory) AND as a differing
      lme_inputs.selections value. Native precedence already chose the operator value; a
      lower-tier namespaced selection may not silently override it. Normalize the caller to
      one precedence contract or drop the conflicting namespaced key.
    quiet: true

# Resolve every declared field from the ADMITTED inputs, by ITERATING registry.precedence
# into a NAMESPACED result (resolved + origins + enable_flags). The effective-input
# COMPOSITION (pristine operator capture + caller lme_inputs: caller selections combine per
# key over the operator capture -- a genuine disagreement was already rejected above; caller
# observations + caller-verified finer origins are honoured; each operator key carries the
# honest `operator` origin) is folded INTO the value-pure lme_resolve_from_admitted filter
# and called INLINE here -- an expression, NOT a named `_lme_eff_inputs` set_fact. So an
# `-e _lme_eff_inputs={selections:{},...}` can no longer DISCARD an admitted selection while
# a read-back recomputed from the SAME pinned object agrees: there is no such intermediate
# to pin (C1-DERIVED-EFFECTIVE-INPUTS-PIN). The resolver reads ONLY the registry, the
# profile overlay, the pristine operator capture and the caller inputs, so re-running it
# each load is self-capture-free (a profile switch / explicit lme_inputs change on a later
# load is reflected -- codex resolution_lifetime / Q2.7). Required-missing / undeclared-key /
# type violations RAISE here, before any mutation.
- name: Compose independent selectors before the existing resolver and operator override
  ansible.builtin.include_tasks: compose_profile_selectors.yml

- name: Resolve config from admitted inputs (pure engine; faithful derivation; re-run each load)
  ansible.builtin.set_fact:
    _lme_resolution: >-
      {{ _lme_global_file.lme_config_registry
         | lme_resolve_from_admitted(
             (_lme_profile_file.profile_overlay.vars | combine(_lme_profile_composition.overlay.vars, recursive=True)),
             _lme_operator_selections,
             (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent)) }}

# VALIDATE via the LITERAL shared task (also run by the C1 A1 regression case) BEFORE any
# mutation. registry-FIRST pipe; the engine's shape gate makes a reversed argument fail
# closed. This is the fail-open bug's fix (codex C1-VALIDATE-CALL / A1).
- name: Admit normalized independent-profile derived fields
  ansible.builtin.include_tasks: admit_derived_profile_fields.yml

- name: Validate the resolved config against the declared schema (fail-closed, pre-mutation)
  ansible.builtin.include_tasks: validate_resolved_config.yml
  vars:
    _lme_validate_registry: "{{ _lme_global_file.lme_config_registry }}"
    _lme_validate_resolved: "{{ _lme_resolution.resolved }}"

