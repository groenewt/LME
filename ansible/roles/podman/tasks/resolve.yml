---
# ansible/roles/podman/tasks/resolve.yml
#
# The SHARED early-resolve entrypoint (CR-B3). This is the ONE place the declared-
# precedence config engine is driven; load_manifests.yml includes it, and the
# standalone playbooks (upgrade_lme.yml, convert_to_cluster.yml) include it too --
# via `include_role: name=podman, tasks_from=resolve` -- BEFORE their earliest
# resolved-key consumer, so they read lme_resolved.* / lme_enable_flags instead of
# re-deriving flags with their own set_facts. Re-running it (each load, or each
# include) is safe: the engine is a pure function of its explicit inputs.
#
# INPUT CONTRACT (a caller sets these BEFORE including this file):
#   clone_directory      -- repo root (the role-declared manifests dir is derived from it in the role declaration).
#   lme_manifests_dir    -- REQUIRED in scope: a podman role declaration (D13-01) unless inventory or the include
#                           overrides it; refused below (E12-01) when absent or not a non-empty string.
#   lme_profile          -- REQUIRED in scope, the same way (D13-01). An EXPLICIT profile
#                           selection (convert_to_cluster passes lme_profile=cluster,
#                           install.sh passes -e lme_profile=<name>) enters the
#                           resolution as the selected overlay here.
#   lme_inputs           -- OPTIONAL by declaration (registry caller_inputs.lme_inputs: var, members, absent,
#                           member_absent; C1-SR922D) namespaced caller inputs:
#                             { selections: {<field>: <value>, ...},   # operator -e / inventory / role vars
#                               observations: {<field>: <value>, ...}, # DETECTED state, origin observation
#                               origins: {<field>: extra_var|inventory} }  # caller-VERIFIED finer origin
#                           A NORMALIZED caller (site.yml pre_tasks, or upgrade/convert
#                           building their own lme_inputs with observations kept SEPARATE
#                           from operator selections and origin-tagged) sets this. An
#                           UN-NORMALIZED caller omits it: membership of the declared var selects the declared
#                           absent form (never a filter fallback), and the operator scope is captured once from
#                           the bare variable scope (compat bridge; see below). A present value must be a mapping
#                           over the declared members, each a mapping (typed refusal before the first read).
#   lme_global_override  -- OPTIONAL by declaration (registry caller_inputs.lme_global_override: var, absent), on
#                           this host and, for the remote-harness scope, on every scoped inventory host; a present
#                           value must be a mapping (typed refusal before the first read).
#
# OUTPUT CONTRACT (facts this file publishes, in scope for the rest of the play):
#   _lme_global_file     -- the loaded global.yml (carries lme_config_registry etc.).
#   _lme_profile_file    -- the loaded active profile overlay.
#   lme_resolved         -- {<field>: <canonical value>} for every declared field.
#   lme_resolved_origins -- {<field>: extra_var|inventory|operator|profile|observation|default}.
#   lme_enable_flags     -- the enable-flag subset (is_enabled()'s input).
#   lme_resolved_revision-- content-addressed CONFIG-ONLY revision (OUTPUT-ONLY). NOTE:
#                           load_manifests.yml REBINDS this to the COMPLETE composed
#                           revision (config + lme_services + lme_global + projections)
#                           after it builds them; a resolve-only caller keeps the
#                           config-only value (it derives no projections).
#   <bare field names>   -- resolved values bridged under their bare names (OPEN debt).
#
# codex-manager-caller-contract-decisions-20260923-0200 / resolution_lifetime.

# C1-INVOCATION-CONTEXT-01 E12-01 (codex 894 DEV_892_01; SR-309-02/05; DEV-D12-01 resolved by D13-01): the shared
# early invocation context is acquired or reused BEFORE the global manifest is consumed. lme_manifests_dir and
# lme_profile are podman role defaults (D13-01), overridden by inventory and by explicit invocation (an include var
# such as convert_to_cluster.yml lme_profile: cluster); no fallback filter selects them here.
- name: E12-01 Acquire or reuse the invocation context (shared early producer; before the global manifest is consumed)
  ansible.builtin.include_tasks: invocation_context.yml

- name: E12-01 Refuse an absent or mistyped manifests dir or profile selection (texts.inputs)
  ansible.builtin.assert:
    that:
      - query('ansible.builtin.varnames', '^lme_manifests_dir$') | length == 1
      - query('ansible.builtin.varnames', '^lme_profile$') | length == 1
      - lme_manifests_dir is string
      - lme_manifests_dir | length > 0
      - lme_profile is string
      - lme_profile | length > 0
    fail_msg: "{{ lme_invocation_words.refusal }}: texts.inputs (E12-01) lme_manifests_dir / lme_profile"
    quiet: true

# C1-INVOCATION-CONTEXT-01 E12-02..04 (codex 894 bootstrap_order, capture_root; codex 896; SR-309-05; registry
# remote_harness_schema.profile_identity): CAPTURE FIRST. Each source member (the global manifest, then the selected
# profile) is stat-ed on the bound controller with the declared digest algorithm and copied once into a
# content-addressed directory below the invocation context root (<root>/<digest>/<source basename>; force false, so
# repeated resolves, hosts and plays reuse one file). The capture must be a regular file owned by the invoking uid
# with the declared file mode and the source digest: a source edited between the stat and the copy refuses. The
# engine then loads the retained copies natively; nothing below reads the live manifest files again. Every capture
# and load register is cleared to two distinct sentinels first, so a caller pin of any of them refuses (extra vars
# and include params outrank set_fact and register).
- name: E12-02 Clear the capture and load registers to the first sentinel
  ansible.builtin.set_fact:
    _lme_pcap_src_st: []
    _lme_pcap_copy: []
    _lme_pcap_cap_st: []
    _lme_global_load: []
    _lme_profile_load: []

- name: E12-02 Refuse a pinned capture or load register (first sentinel; texts.reuse)
  ansible.builtin.assert:
    that:
      - >-
        [_lme_pcap_src_st, _lme_pcap_copy, _lme_pcap_cap_st, _lme_global_load, _lme_profile_load]
        == [[], [], [], [], []]
    fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (E12-02) a capture or load register is pinned"
    quiet: true

- name: E12-02 Clear the capture and load registers to the second sentinel
  ansible.builtin.set_fact:
    _lme_pcap_src_st: {}
    _lme_pcap_copy: {}
    _lme_pcap_cap_st: {}
    _lme_global_load: {}
    _lme_profile_load: {}

- name: E12-02 Refuse a pinned capture or load register (second sentinel; texts.reuse)
  ansible.builtin.assert:
    that:
      - >-
        [_lme_pcap_src_st, _lme_pcap_copy, _lme_pcap_cap_st, _lme_global_load, _lme_profile_load]
        == [{}, {}, {}, {}, {}]
    fail_msg: "{{ lme_invocation_words.refusal }}: texts.reuse (E12-02) a capture or load register is pinned"
    quiet: true

- name: E12-02 Capture the global and profile bytes on the bound controller (once per run, unprivileged)
  run_once: true
  become: false
  delegate_to: "{{ lme_invocation_context.delegate if lme_invocation_context.delegate is not none else inventory_hostname }}"
  vars:
    ansible_connection: "{{ lme_invocation_context.connection }}"
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_become: false
  block:
    - name: E12-02 Stat each source member without following links (the declared digest algorithm)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ lme_invocation_words.digest_algorithm }}"
      loop:
        - "{{ lme_manifests_dir ~ '/global.yml' }}"
        - "{{ lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml' }}"
      register: _lme_pcap_src_st

    - name: E12-02 Refuse a source member that is absent, a link or not a regular file (texts.storage)
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - not item.stat.islnk
        fail_msg: "{{ lme_invocation_words.refusal }}: texts.storage (E12-02) {{ item.item }}"
        quiet: true
      loop: "{{ _lme_pcap_src_st.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: E12-02 Create each content-addressed capture directory below the context root
      ansible.builtin.file:
        # Paths are joined by the shared L8 helper lme_invocation_root (plain-segment relative path under an absolute
        # anchor; refusal = words.refusal), never by a literal separator (SR-319-01).
        path: >-
          {{ lme_invocation_context.root | lme_invocation_root(item.stat.checksum, none, lme_invocation_words.refusal) }}
        state: directory
        mode: "{{ lme_invocation_words.admission.dir_mode }}"
        follow: false
      loop: "{{ _lme_pcap_src_st.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: E12-02 Copy each source member into its capture directory once (never over an existing capture)
      ansible.builtin.copy:
        src: "{{ item.item }}"
        dest: >-
          {{ lme_invocation_context.root | lme_invocation_root(item.stat.checksum, none, lme_invocation_words.refusal)
             | lme_invocation_root(item.item | basename, none, lme_invocation_words.refusal) }}
        remote_src: true
        mode: "{{ lme_invocation_words.admission.file_mode }}"
        force: false
      loop: "{{ _lme_pcap_src_st.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _lme_pcap_copy

    - name: E12-02 Stat each capture without following links (the declared digest algorithm)
      ansible.builtin.stat:
        path: >-
          {{ lme_invocation_context.root | lme_invocation_root(item.stat.checksum, none, lme_invocation_words.refusal)
             | lme_invocation_root(item.item | basename, none, lme_invocation_words.refusal) }}
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ lme_invocation_words.digest_algorithm }}"
      loop: "{{ _lme_pcap_src_st.results }}"
      loop_control:
        label: "{{ item.item }}"
      register: _lme_pcap_cap_st

    - name: E12-02 Refuse a capture that is a link, foreign, wrongly moded or not the source digest (texts.owner, texts.storage)
      ansible.builtin.assert:
        that:
          - item.1.stat.exists
          - item.1.stat.isreg
          - not item.1.stat.islnk
          - item.1.stat.uid == lme_invocation_context.owner
          - item.1.stat.mode == lme_invocation_words.admission.file_mode
          - item.1.stat.checksum == item.0.stat.checksum
          - >-
            item.1.stat.path
            == (lme_invocation_context.root | lme_invocation_root(item.0.stat.checksum, none, lme_invocation_words.refusal)
            | lme_invocation_root(item.0.item | basename, none, lme_invocation_words.refusal))
        fail_msg: >-
          {{ lme_invocation_words.refusal }}: texts.owner / texts.storage (E12-02) {{ item.0.item }} -> {{ item.1.stat }}
        quiet: true
      loop: "{{ _lme_pcap_src_st.results | zip(_lme_pcap_cap_st.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"

- name: E12-03 Load the global manifest natively from its capture
  ansible.builtin.include_vars:
    file: "{{ (_lme_pcap_cap_st.results | first).stat.path }}"
    name: _lme_global_file
  register: _lme_global_load

# SR-320-05 / SR-320-06 (MAIN 944 / 945) + codex 902 D: the E12-04 global invariant, run BEFORE the recursive
# equality below. The RAW strict parse of the captured global bytes (lme_manifest_strict; the scan evaluates no loaded
# value) carries no value and no mapping key that the declared detection rule detects (lme_template_positions over
# registry remote_harness_schema.template_detection read from that raw parse; words in split-character form; G14-01),
# and the captured exact text carries no declared start string and does not begin with the declared override header.
# The declaration node is part of the scanned data, so it must pass its own invariant. The parse declaration is read
# from the include_vars register, as the E12-04 binding assert below reads it.
- name: E12-04 Refuse a global capture that the admitted core would treat as a possible template (template_detection)
  # SR-321-01: every reference to _lme_g04_text is ONE read of the capture bound, inside lme_capture_text_bound, to the
  # capture stat checksum (the stat algorithm lme_invocation_words.digest_algorithm; the declared profile_identity
  # encoding and refusal read from the include_vars register, as the parse declaration is) before any parse or scan.
  vars:
    _lme_g04_text: >-
      {{ lookup('ansible.builtin.file', (_lme_pcap_cap_st.results | first).stat.path, rstrip=false)
      | lme_capture_text_bound((_lme_pcap_cap_st.results | first).stat.checksum, lme_invocation_words.digest_algorithm,
      _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.encoding,
      _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal) }}
    _lme_g04_raw: >-
      {{ _lme_g04_text
      | lme_manifest_strict((_lme_pcap_cap_st.results | first).stat.path,
      _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse) }}
    # SR-321-04 / Codex 905: the declared decoding separator, by pointer (the node template_detection.word_form names,
    # remote_harness_schema.split_character_form), read from the same strict parse; passed explicitly to every decode
    _lme_g04_sep: >-
      {{ _lme_g04_raw.lme_config_registry.remote_harness_schema[_lme_g04_raw.lme_config_registry.remote_harness_schema.template_detection.word_form].separator }}
  ansible.builtin.assert:
    that:
      - >-
        (_lme_g04_raw | lme_template_positions(_lme_g04_raw.lme_config_registry.remote_harness_schema.template_detection,
        _lme_g04_sep, _lme_g04_raw.lme_config_registry.remote_harness_schema.profile_identity.refusal)) == []
      - >-
        _lme_g04_raw.lme_config_registry.remote_harness_schema.template_detection.start_strings.values()
        | map('join', _lme_g04_sep)
        | select('in', _lme_g04_text)
        | list == []
      - >-
        not (_lme_g04_text
        .startswith(_lme_g04_raw.lme_config_registry.remote_harness_schema.template_detection.override_header
        | join(_lme_g04_sep)))
    fail_msg: >-
      {{ _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal }}:
      (E12-04 template_detection) the global capture {{ (_lme_pcap_cap_st.results | first).stat.path }} carries a
      declared template start string or override header; the global must be Jinja-free
    quiet: true

# E12-04 (retires the r10 YAML-parse filter re-read): the native load is bound to the capture it read. The register
# names exactly the capture file and carries the loaded data (a pinned _lme_global_file disagrees with it); the data
# equals the strict unique-key construction of the capture's exact text (lme_manifest_strict, the registry
# document_channel.parse); the capture text digests to the content-addressed name.
- name: E12-04 Refuse a global fact not bound to its capture (texts of profile_identity; fail-closed, pre-mutation)
  ansible.builtin.assert:
    that:
      - _lme_global_load.ansible_included_var_files == [(_lme_pcap_cap_st.results | first).stat.path]
      - _lme_global_load.ansible_facts._lme_global_file | lme_type_aware_equal(_lme_global_file)
      # SR-321-01: the equality consumes ONE read, bound to the capture stat checksum inside lme_capture_text_bound before
      # the strict parse (this replaces the separate-read digest comparison, whose obligation the filter now carries).
      - >-
        _lme_global_file | lme_type_aware_equal(lookup('ansible.builtin.file', (_lme_pcap_cap_st.results | first).stat.path,
        rstrip=false)
        | lme_capture_text_bound((_lme_pcap_cap_st.results | first).stat.checksum, lme_invocation_words.digest_algorithm,
        _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.encoding,
        _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal)
        | lme_manifest_strict((_lme_pcap_cap_st.results | first).stat.path,
        _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse))
    fail_msg: >-
      {{ _lme_global_load.ansible_facts._lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal }}:
      (E12-04) the global fact is not the native load of its capture {{ (_lme_pcap_cap_st.results | first).stat.path }}
    quiet: true

# (the E12-04 template_detection invariant runs BEFORE the E12-04 recursive equality above; codex 902 D)

# E12-05: the invocation words the producer used (podman role defaults D12-01 / D13-01) must equal the declared words
# of the consumed global, type-aware; the capture digest algorithm must be the profile_identity algorithm.
- name: E12-05 Refuse invocation words that differ from the captured global declaration (texts.inputs)
  ansible.builtin.assert:
    that:
      - >-
        lme_invocation_words
        | lme_type_aware_equal(_lme_global_file.lme_config_registry.remote_harness_schema.invocation_context.words)
      - >-
        lme_invocation_words.digest_algorithm
        == _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.digest_algorithm
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.invocation_context.refusal }}:
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.invocation_context.texts.inputs }} (E12-05
      lme_invocation_words)
    quiet: true

# E12-06 (retires the two r10 YAML-parse filter re-reads): the profile fact is bound by PROVING THE LOAD TOOK EFFECT
# (a profile may carry Jinja that include_vars renders lazily, C1-MULTINODE-REAL-PATH, so no rendered equality is
# required of it): the global capture is loaded into the name as a sentinel and must equal the global load; the
# profile capture is then loaded and the register must name exactly that capture, carry the fact, and the sentinel
# must be gone. The capture text must also pass the strict unique-key construction.
- name: E12-06 Load the global capture into the profile fact name as a sentinel
  ansible.builtin.include_vars:
    file: "{{ (_lme_pcap_cap_st.results | first).stat.path }}"
    name: _lme_profile_file
  register: _lme_profile_load

- name: E12-06 Refuse a profile fact the loader cannot write (the sentinel must be the global load)
  ansible.builtin.assert:
    that:
      - _lme_profile_file | lme_type_aware_equal(_lme_global_load.ansible_facts._lme_global_file)
      - _lme_profile_load.ansible_facts._lme_profile_file | lme_type_aware_equal(_lme_profile_file)
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal }}: (E12-06)
      _lme_profile_file is bound outside the loader (C1-CATALOG-BOUND-TO-DECLARED-BYTES, C1-MULTINODE-REAL-PATH)
    quiet: true

- name: E12-06 Load the selected profile natively from its capture
  ansible.builtin.include_vars:
    file: "{{ (_lme_pcap_cap_st.results | last).stat.path }}"
    name: _lme_profile_file
  register: _lme_profile_load

- name: E12-06 Refuse a profile fact the capture load did not replace (fail-closed, pre-mutation)
  ansible.builtin.assert:
    that:
      - _lme_profile_load.ansible_included_var_files == [(_lme_pcap_cap_st.results | last).stat.path]
      # SR-320-09 (codex 903; F944): no full recursive walk of the PROFILE fact runs here (it may hold possible-template
      # leaves, the s28 bare start strings); the register / fact and sentinel-gone obligations are checked on the
      # top-level key sets only (iterating keys evaluates no value), and carried in depth by the SR-320-07 PARTIAL guard
      # below, run on the fact AND on the register with equal excluded positions required.
      - (_lme_profile_load.ansible_facts._lme_profile_file | list | sort) == (_lme_profile_file | list | sort)
      - (_lme_profile_file | list | sort) != (_lme_global_load.ansible_facts._lme_global_file | list | sort)
      - "'profile_overlay' in _lme_profile_file"
      # SR-321-01: the strict parse consumes ONE read bound to the profile capture stat checksum before it parses
      - >-
        (lookup('ansible.builtin.file', (_lme_pcap_cap_st.results | last).stat.path, rstrip=false)
        | lme_capture_text_bound((_lme_pcap_cap_st.results | last).stat.checksum, lme_invocation_words.digest_algorithm,
        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.encoding,
        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal)
        | lme_manifest_strict((_lme_pcap_cap_st.results | last).stat.path,
        _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse)) is mapping
      - >-
        (_lme_pcap_cap_st.results | last).stat.checksum == (_lme_pcap_src_st.results | last).stat.checksum
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal }}: (E12-06) the profile
      fact is not the native load of its capture {{ (_lme_pcap_cap_st.results | last).stat.path }}
    quiet: true

# SR-320-07 (codex 902 SR-320-01; SR-320-09 / codex 903: E12-06 keeps its obligations, its full profile walks are
# refactored onto this guard and the key-set checks above): a raw-guided PARTIAL
# correspondence guard (DEV-E12-06-PROFILE-RAW stays PARTIAL; NOT a full binding, OW-C1-FULL-BYTE-BINDING). Traversal
# is driven by the strict parse of the consumed profile capture bytes: exact mapping key sets, sequence length and
# order, and type-aware values at every inspected position of the loaded fact; ONLY a position whose raw value the
# declared detection rule detects (template_detection, G14-01) is skipped and its fact value is never read. The
# excluded positions are published as typed path components with their detection reasons (never a joined string).
- name: SR-320-07 Compare the profile fact with the raw parse of its capture (raw-guided PARTIAL guard; excluded paths)
  ansible.builtin.set_fact:
    _lme_profile_raw_partial: >-
      {{ lookup('ansible.builtin.file', (_lme_pcap_cap_st.results | last).stat.path, rstrip=false)
      | lme_capture_text_bound((_lme_pcap_cap_st.results | last).stat.checksum, lme_invocation_words.digest_algorithm,
      _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.encoding,
      _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal)
      | lme_manifest_strict((_lme_pcap_cap_st.results | last).stat.path,
      _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse)
      | lme_raw_partial_correspondence(_lme_profile_file,
      _lme_global_file.lme_config_registry.remote_harness_schema.template_detection,
      _lme_global_file.lme_config_registry.remote_harness_schema[_lme_global_file.lme_config_registry.remote_harness_schema.template_detection.word_form].separator,
      _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal) }}

# SR-320-09 (codex 903): the register carries the same fact -- the PARTIAL guard over the include_vars register's own
# fact must succeed with exactly the excluded positions of the fact (replaces the full register / fact equality walk).
- name: SR-320-09 Refuse a load register whose fact is not the guarded profile fact (raw-guided PARTIAL; texts of profile_identity)
  ansible.builtin.assert:
    that:
      - >-
        (lookup('ansible.builtin.file', (_lme_pcap_cap_st.results | last).stat.path, rstrip=false)
        | lme_capture_text_bound((_lme_pcap_cap_st.results | last).stat.checksum, lme_invocation_words.digest_algorithm,
        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.encoding,
        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal)
        | lme_manifest_strict((_lme_pcap_cap_st.results | last).stat.path,
        _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse)
        | lme_raw_partial_correspondence(_lme_profile_load.ansible_facts._lme_profile_file,
        _lme_global_file.lme_config_registry.remote_harness_schema.template_detection,
        _lme_global_file.lme_config_registry.remote_harness_schema[_lme_global_file.lme_config_registry.remote_harness_schema.template_detection.word_form].separator,
