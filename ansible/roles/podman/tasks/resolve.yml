---
# ansible/roles/podman/tasks/resolve.yml
#
# The SHARED early-resolve entrypoint (CR-B3). This is the ONE place the declared-
# precedence config engine is driven; load_manifests.yml includes it, and the
# standalone playbooks (upgrade_lme.yml, convert_to_cluster.yml) include it too --
# via `include_role: name=podman, tasks_from=resolve` -- BEFORE their earliest
# resolved-key consumer, so they read lme_resolved.* / lme_enable_flags instead of
# re-deriving flags with their own set_facts. Re-running it (each load, or each
# include) is safe: the engine is a pure function of its explicit inputs.
#
# INPUT CONTRACT (a caller sets these BEFORE including this file):
#   clone_directory      -- repo root; used to derive lme_manifests_dir if unset.
#   lme_manifests_dir    -- optional; defaults to clone_directory/manifests.
#   lme_profile          -- optional; defaults to 'default'. An EXPLICIT profile
#                           selection (convert_to_cluster passes lme_profile=cluster,
#                           install.sh passes -e lme_profile=<name>) enters the
#                           resolution as the selected overlay here.
#   lme_inputs           -- optional namespaced caller inputs:
#                             { selections: {<field>: <value>, ...},   # operator -e / inventory / role vars
#                               observations: {<field>: <value>, ...}, # DETECTED state, origin observation
#                               origins: {<field>: extra_var|inventory} }  # caller-VERIFIED finer origin
#                           A NORMALIZED caller (site.yml pre_tasks, or upgrade/convert
#                           building their own lme_inputs with observations kept SEPARATE
#                           from operator selections and origin-tagged) sets this. An
#                           UN-NORMALIZED caller leaves it undefined and this file
#                           AUTO-NORMALIZES once from the bare variable scope (compat
#                           bridge; see below).
#
# OUTPUT CONTRACT (facts this file publishes, in scope for the rest of the play):
#   _lme_global_file     -- the loaded global.yml (carries lme_config_registry etc.).
#   _lme_profile_file    -- the loaded active profile overlay.
#   lme_resolved         -- {<field>: <canonical value>} for every declared field.
#   lme_resolved_origins -- {<field>: extra_var|inventory|operator|profile|observation|default}.
#   lme_enable_flags     -- the enable-flag subset (is_enabled()'s input).
#   lme_resolved_revision-- content-addressed CONFIG-ONLY revision (OUTPUT-ONLY). NOTE:
#                           load_manifests.yml REBINDS this to the COMPLETE composed
#                           revision (config + lme_services + lme_global + projections)
#                           after it builds them; a resolve-only caller keeps the
#                           config-only value (it derives no projections).
#   <bare field names>   -- resolved values bridged under their bare names (OPEN debt).
#
# codex-manager-caller-contract-decisions-20260923-0200 / resolution_lifetime.

- name: Resolve manifests dir and active profile
  ansible.builtin.set_fact:
    lme_manifests_dir: "{{ lme_manifests_dir | default(clone_directory ~ '/manifests') }}"
    lme_profile: "{{ lme_profile | default('default') }}"

- name: Load global manifest
  ansible.builtin.include_vars:
    file: "{{ lme_manifests_dir }}/global.yml"
    name: _lme_global_file

# P2 -- BIND the loaded config facts to the declared SOURCE BYTES (codex-0915/0930). The
# loader trusts _lme_global_file (the config registry + the material_catalog security
# boundary) and _lme_profile_file, but both are include_vars FACTS and an extra-var OUTRANKS
# include_vars: `-e _lme_global_file=<forged registry>` would replace the whole admitted
# catalog/registry with an operator value, while every downstream check (the catalog-override
# gate, the split-brain invariant below) reused that SAME overridable fact and agreed.
#
# global.yml is Jinja-free: its fact is bound by whole-fact equality to an INLINE re-read of the
# declared bytes (an expression; an extra-var cannot pin it). A PROFILE may carry Jinja that
# include_vars renders lazily at each use (manifests/profiles/multinode.yml publish_ports read
# fleet_*_bind_address / tailscale_serve_services), so a raw-bytes equality can never hold for it
# (C1-MULTINODE-REAL-PATH, codex 021809) -- and a RENDERED comparison would admit a frozen forged
# snapshot that matches at check time but not at the later composition. The profile fact is
# therefore bound by PROVING THE LOAD TOOK EFFECT: an include_vars into _lme_profile_file is hidden
# only by a higher-precedence binding of that name (extra-var, role/include param, set_fact).
# (1) load the Jinja-free global.yml into the name as a SENTINEL and require the exact declared
# bytes -- a pinned name still shows the pin; (2) load the declared profile into the same name;
# (3) require the sentinel is gone -- a pin equal to the sentinel cannot move. The fact the loader
# then reads IS the include_vars load of the declared profile path, still lazily rendered, so the
# multinode/Tailscale route resolves exactly as authored. Re-entry safe (an include_vars overwrites
# its own earlier load). Fail-closed, pre-mutation. Residual (unchanged from the raw-equality bind):
# an -e LAZY template that observes play state could answer each check differently.
- name: Bind the loaded config facts to the declared manifest bytes (fail-closed, pre-mutation)
  ansible.builtin.assert:
    that:
      - _lme_global_file == (lookup('ansible.builtin.file', lme_manifests_dir ~ '/global.yml') | from_yaml)
    fail_msg: >-
      the loaded global.yml fact does not match the declared manifest bytes on disk -- an -e
      _lme_global_file (or a tampered load) replaced the admitted registry / material_catalog with
      external state. The declared manifest file is the sole authority for the config registry and
      the material security boundary (C1-CATALOG-BOUND-TO-DECLARED-BYTES).
    quiet: true

- name: Prove the profile fact name is writable -- load the Jinja-free global manifest into it as a sentinel
  ansible.builtin.include_vars:
    file: "{{ lme_manifests_dir }}/global.yml"
    name: _lme_profile_file

- name: Refuse a profile fact the loader cannot write (sentinel must be the declared global bytes)
  ansible.builtin.assert:
    that:
      - _lme_profile_file == (lookup('ansible.builtin.file', lme_manifests_dir ~ '/global.yml') | from_yaml)
    fail_msg: >-
      _lme_profile_file is bound outside the loader (an -e _lme_profile_file, a role/include param or a
      set_fact outranks include_vars); the declared profile could not be loaded into it
      (C1-CATALOG-BOUND-TO-DECLARED-BYTES, C1-MULTINODE-REAL-PATH).
    quiet: true

- name: Load active profile overlay
  ansible.builtin.include_vars:
    file: "{{ lme_manifests_dir }}/profiles/{{ lme_profile }}.yml"
    name: _lme_profile_file

- name: Refuse a profile fact the declared profile load did not replace (fail-closed, pre-mutation)
  ansible.builtin.assert:
    that:
      - _lme_profile_file != (lookup('ansible.builtin.file', lme_manifests_dir ~ '/global.yml') | from_yaml)
      - _lme_profile_file.profile_overlay is defined
    fail_msg: >-
      the profile fact still holds the sentinel (or no profile_overlay) after loading
      {{ lme_manifests_dir }}/profiles/{{ lme_profile }}.yml -- the fact is pinned outside the loader
      (C1-CATALOG-BOUND-TO-DECLARED-BYTES, C1-MULTINODE-REAL-PATH).
    quiet: true

# --- C1 caller-input contract: capture pristine operator selections, compose, resolve ---
# codex-manager-caller-contract-decisions-20260923-0200 + advisor split-brain correction.
#
# Inputs arrive namespaced in `lme_inputs` (selections + observations + origins). A
# NORMALIZED entrypoint (site.yml pre_tasks) sets it from hostvars before the first load;
# an UN-NORMALIZED entrypoint (upgrade_lme / elasticsearch / convert_to_cluster / the
# golden harness) leaves it undefined.
#
# SPLIT-BRAIN FIX: the previous auto-normalize was ALL-OR-NOTHING (`when: lme_inputs is
# not defined`). A caller that supplied ONLY observations (B's CR-B1 upgrade-fallback
# path passes `lme_inputs: {observations: {...}}`) SKIPPED the whole capture, so
# `selections` collapsed to {} and an operator `-e install_llm=false` DROPPED OUT of the
# resolution (lme_enable_flags.install_llm went true) while the bare `install_llm` fact
# stayed false (-e outranks set_fact) -- split-brain rendering. We now capture the
# operator selection scope into a C1-PRIVATE fact (NEVER the caller-input name
# lme_inputs) and COMPOSE it with any caller-supplied lme_inputs parts every load, so
# observations and operator selections coexist.
#
# PRISTINE capture: read the bare variable scope for declared registry fields ONCE, on
# the FIRST load -- BEFORE the bare-name bridge below writes any fact -- so it captures
# the genuine operator -e / inventory / include_role `vars:` selections and is immune to
# later bridge pollution. (This is WHY bare `vars` cannot simply be re-read each load:
# this file's own compat bridge set_facts them, so a later re-read would see resolved
# OUTPUTS masquerading as operator inputs.) Guarded once; a later load reuses the pristine
# capture rather than re-reading the now-polluted bare scope. Its removal condition is
# B/E normalizing their entrypoints to set lme_inputs.selections themselves.
- name: Capture pristine operator selections once (C1-private fact; never lme_inputs)
  ansible.builtin.set_fact:
    # Registry field list + present-in-scope subset are computed INLINE (not task `vars:`):
    # an extra-var outranks a task var, so `-e _lme_sel_keys=[]` / `-e _lme_reg_keys=[]`
    # would otherwise empty the capture and discard every admitted selection while a
    # read-back recomputed from the same pinned object agreed (C1-DERIVED-EFFECTIVE-INPUTS-
    # PIN, one hop up). The split-brain invariant at the end of this file is the backstop.
    _lme_operator_selections: >-
      {{ dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
              | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                    | map('extract', vars) | list)) }}
  when: _lme_operator_selections is not defined

# C1-CONFLICTING-INPUT-PRECEDENCE. Before composing, REJECT the ambiguous case where the
# pristine operator capture (native extra-var/inventory precedence already chose this
# winner) and a caller-normalized lme_inputs.selections DISAGREE on a key. Previously the
# caller value combined ON TOP, so a lower-tier namespaced install_llm=true silently
# overwrote a captured extra-var install_llm=false in the resolver while Ansible's bare
# extra-var stayed false -- split-brain. Agreeing keys are fine; only a genuine value
# disagreement (unestablishable provenance) fails here. Removal condition: B/E normalize
# their entrypoints to set lme_inputs.selections themselves (then the pristine capture is
# redundant, not conflicting).
- name: Reject conflicting operator vs namespaced selection (C1-CONFLICTING-INPUT-PRECEDENCE)
  ansible.builtin.assert:
    that:
      - (_lme_operator_selections | lme_selection_conflicts(lme_inputs.selections | default({}), _lme_global_file.lme_config_registry)) | length == 0
    fail_msg: >-
      config selection conflict on {{ _lme_operator_selections | lme_selection_conflicts(lme_inputs.selections | default({}), _lme_global_file.lme_config_registry) }}
      -- given BOTH as a native operator selection (extra-var/inventory) AND as a differing
      lme_inputs.selections value. Native precedence already chose the operator value; a
      lower-tier namespaced selection may not silently override it. Normalize the caller to
      one precedence contract or drop the conflicting namespaced key.
    quiet: true

# Resolve every declared field from the ADMITTED inputs, by ITERATING registry.precedence
# into a NAMESPACED result (resolved + origins + enable_flags). The effective-input
# COMPOSITION (pristine operator capture + caller lme_inputs: caller selections combine per
# key over the operator capture -- a genuine disagreement was already rejected above; caller
# observations + caller-verified finer origins are honoured; each operator key carries the
# honest `operator` origin) is folded INTO the value-pure lme_resolve_from_admitted filter
# and called INLINE here -- an expression, NOT a named `_lme_eff_inputs` set_fact. So an
# `-e _lme_eff_inputs={selections:{},...}` can no longer DISCARD an admitted selection while
# a read-back recomputed from the SAME pinned object agrees: there is no such intermediate
# to pin (C1-DERIVED-EFFECTIVE-INPUTS-PIN). The resolver reads ONLY the registry, the
# profile overlay, the pristine operator capture and the caller inputs, so re-running it
# each load is self-capture-free (a profile switch / explicit lme_inputs change on a later
# load is reflected -- codex resolution_lifetime / Q2.7). Required-missing / undeclared-key /
# type violations RAISE here, before any mutation.
- name: Resolve config from admitted inputs (pure engine; faithful derivation; re-run each load)
  ansible.builtin.set_fact:
    _lme_resolution: >-
      {{ _lme_global_file.lme_config_registry
         | lme_resolve_from_admitted(
             (_lme_profile_file.profile_overlay.vars | default({})),
             _lme_operator_selections,
             lme_inputs | default({})) }}

# VALIDATE via the LITERAL shared task (also run by the C1 A1 regression case) BEFORE any
# mutation. registry-FIRST pipe; the engine's shape gate makes a reversed argument fail
# closed. This is the fail-open bug's fix (codex C1-VALIDATE-CALL / A1).
- name: Validate the resolved config against the declared schema (fail-closed, pre-mutation)
  ansible.builtin.include_tasks: validate_resolved_config.yml
  vars:
    _lme_validate_registry: "{{ _lme_global_file.lme_config_registry }}"
    _lme_validate_resolved: "{{ _lme_resolution.resolved }}"

# PER-HOST-SCOPE-CONTRACT (codex 023332): the remote-harness SCOPE CONTEXT -- this host's inventory identity, the
# inventory groups, and for the declared controller plus every inventory host its own lme_global_override and
# the ONE composition (global | profile | that override, recursive -- the same combine as lme_global below; the
# projection only validates and digests) -- and the source edition (profile name + the global/profile content
# sha256 in the revision's lookup convention) -- and the source of every template the registry's
# host_scope.shared_artifacts declares (C1-ARTIFACT-REUSE-INPUT-COVERAGE: the projection proves the declared
# artifact inputs against them) -- and, per host, the inventory values the ONE declared connection rule names
# (C1-EFFECTIVE-ENDPOINT-BINDING: a selection; the projection derives each target's endpoint and binds it).
# Empty when no remote-harness policy is declared. A named fact so the
# many inline projection calls share it; an -e pin is a set_fact no-op that the type-aware read-back below
# refuses against the inline recompute (C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN pattern).
- name: Resolve the remote-harness scope context (controller + inventory scopes; one composition each)
  ansible.builtin.set_fact:
    _lme_rh_scope: >-
      {{ {} if (_lme_global_file.lme_config_registry.remote_harness_schema.policy_key not in (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True))) else
         {'self': inventory_hostname,
          'groups': groups,
          'overrides': dict(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list
                            | zip(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list | map('extract', hostvars) | map(attribute='lme_global_override', default={}) | list)),
          'composed': dict(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list
                            | zip([(_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True))]
                                  | product(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list | map('extract', hostvars) | map(attribute='lme_global_override', default={}) | list)
                                  | map('list') | map('combine', recursive=True) | list)),
          'edition': {'profile': lme_profile,
                      'global_sha256': lookup('ansible.builtin.file', lme_manifests_dir ~ '/global.yml') | hash('sha256'),
                      'profile_sha256': lookup('ansible.builtin.file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')},
          'artifact_sources': dict(_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.shared_artifacts | dict2items | map(attribute='value.templates') | flatten | unique | list
                                   | zip(query('ansible.builtin.file', *(_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.shared_artifacts | dict2items | map(attribute='value.templates') | flatten | unique | map('regex_replace', '^', lme_manifests_dir ~ '/../') | list)))),
          'connections': hostvars | lme_rh_connection_values(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list,
                                                            (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)),
                                                            _lme_global_file.lme_config_registry.remote_harness_schema)} }}

- name: Read-back guard -- the remote-harness scope context is the recomputed value (type-aware; untamperable)
  ansible.builtin.assert:
    that:
      - >-
        _lme_rh_scope | lme_type_aware_equal(
        {} if (_lme_global_file.lme_config_registry.remote_harness_schema.policy_key not in (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True))) else
         {'self': inventory_hostname,
          'groups': groups,
          'overrides': dict(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list
                            | zip(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list | map('extract', hostvars) | map(attribute='lme_global_override', default={}) | list)),
          'composed': dict(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list
                            | zip([(_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True))]
                                  | product(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list | map('extract', hostvars) | map(attribute='lme_global_override', default={}) | list)
                                  | map('list') | map('combine', recursive=True) | list)),
          'edition': {'profile': lme_profile,
                      'global_sha256': lookup('ansible.builtin.file', lme_manifests_dir ~ '/global.yml') | hash('sha256'),
                      'profile_sha256': lookup('ansible.builtin.file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')},
          'artifact_sources': dict(_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.shared_artifacts | dict2items | map(attribute='value.templates') | flatten | unique | list
                                   | zip(query('ansible.builtin.file', *(_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.shared_artifacts | dict2items | map(attribute='value.templates') | flatten | unique | map('regex_replace', '^', lme_manifests_dir ~ '/../') | list)))),
          'connections': hostvars | lme_rh_connection_values(([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list,
                                                            (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)),
                                                            _lme_global_file.lme_config_registry.remote_harness_schema)})
    fail_msg: >-
      _lme_rh_scope was pre-supplied / -e-pinned and disagrees with its freshly recomputed value; the remote-harness
      scope context is a resolver output (PER-HOST-SCOPE-CONTRACT, C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN).
    quiet: true

# Publish the NAMESPACED outputs. lme_enable_flags comes straight from the engine (already
# strict-bool-coerced) -- it is is_enabled()'s input, an OUTPUT name never read back as
# operator input, so this is self-capture-free. lme_resolved_origins carries honest
# provenance (a natively-selected value is labelled `operator`, never falsely extra_var).
- name: Publish namespaced resolved config, origins and enable flags (OUTPUT names)
  ansible.builtin.set_fact:
    # SEED-06 (codex-232517): the effective remote-harness policy is a typed section of the authoritative
    # resolved configuration (absent when no policy is declared), so the revision below binds it.
    lme_resolved: "{{ (_lme_resolution.resolved | combine(({_lme_global_file.lme_config_registry.remote_harness_schema.policy_key: (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope))} if (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope)) is not none else {}))) }}"
    lme_resolved_origins: "{{ _lme_resolution.origins }}"
    lme_enable_flags: "{{ _lme_resolution.enable_flags }}"

# CONFIGURATION revision (codex revision_identity (b)): content-addressed over the
# canonical declared/resolved config -- the resolved VALUES (minus registry
# exclude_from_revision identity fields), the ordered profile identities and the schema
# version. It is deterministic from the CONFIG ALONE: it EXCLUDES wall-clock, volatile
# observation timestamps, unrelated commits AND provenance (origins). Origins are
# deliberately NOT hashed -- the same values reached two ways MUST yield the SAME revision,
# so an unchanged config never rewrites or restarts a healthy consumer. OUTPUT-ONLY.
#
# UNTAMPERABLE DERIVATION (C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN, codex-0815 HIGH). The
# previous form computed the hash from NAMED `vars:` intermediates (_lme_revision_resolved,
# _lme_revision_excluded, _lme_profile_identities). An extra-var OUTRANKS a task `vars:`, so
# `-e _lme_revision_resolved={}` pinned the hash input to an empty mapping while the real
# resolver still flipped install_otel false->true -- the recorded revision stayed identical
# and both peers reached deployment markers. There is now NO revision-only named
# intermediate: the whole payload is assembled INSIDE the value-pure lme_bind_revision filter
# (which reads the exclude set from the registry), and the profile-identity list is an INLINE
# literal (not a variable, so -e cannot pin it). The immediately-following read-back guard
# re-runs the SAME inline call and rejects any state where a pinned fact disagrees with the
# freshly recomputed value -- so checking the final variable is not the only defence.
# NB this is the CONFIG-ONLY revision (resolve.yml has no lme_services/projections yet);
# load_manifests.yml REBINDS lme_resolved_revision to the COMPLETE composed revision after
# the material/datastore/membership projections + lme_services/lme_global are built.
- name: Compute the content-addressed configuration revision (config-only; deterministic; OUTPUT-ONLY; untamperable)
  ansible.builtin.set_fact:
    lme_resolved_revision: >-
      {{ (_lme_resolution.resolved | combine(({_lme_global_file.lme_config_registry.remote_harness_schema.policy_key: (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope))} if (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope)) is not none else {}))) | lme_bind_revision(
           _lme_global_file.lme_config_registry,
           [{'name': lme_profile,
             'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}]) }}

# READ-BACK GUARD (C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN). Extra-vars outrank set_fact, so
# ANY C1 fact name is pinnable -- not just the final revision. A pinned fact makes its
# set_fact a no-op, so the fact then DISAGREES with the value recomputed inline here (the
# inline filter calls are expressions, not variables, so they cannot be pinned). This closes
# the narrow-desync class (a downstream fact pinned while the real resolver diverges):
#   * _lme_resolution pinned  -> disagrees with the re-run of lme_resolve_from_admitted
#     (which recomputes from the pristine operator capture + lme_inputs, NOT from a pinnable
#     _lme_eff_inputs intermediate)
#   * lme_resolved / lme_resolved_origins / lme_enable_flags pinned -> disagree with
#     _lme_resolution.* (origins is now checked too -- a pinned origin read 'default' where
#     the admitted selection was 'operator')
#   * lme_resolved_revision pinned -> disagrees with the re-run of lme_bind_revision
# A wholesale pin of an upstream INPUT (e.g. the registry) changes every recompute
# consistently AND the deploy that follows it, so it is not a silent desync and is out of
# scope here (and _lme_global_file / _lme_profile_file are separately bound to the declared
# manifest bytes above). Runs on the supported path BEFORE any mutation (the site.yml /
# elasticsearch.yml pre-mutation barriers include this file), so a pin fails closed.
- name: Read-back guard -- reject an -e-pinned resolution / resolved config / origins / revision (untamperable)
  ansible.builtin.assert:
    that:
      - _lme_resolution | lme_type_aware_equal(_lme_global_file.lme_config_registry | lme_resolve_from_admitted((_lme_profile_file.profile_overlay.vars | default({})), _lme_operator_selections, lme_inputs | default({})))
      - >-
        lme_resolved | lme_type_aware_equal(_lme_resolution.resolved | combine(({_lme_global_file.lme_config_registry.remote_harness_schema.policy_key: (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope))} if (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope)) is not none else {})))
      - lme_resolved_origins | lme_type_aware_equal(_lme_resolution.origins)
      - lme_enable_flags | lme_type_aware_equal(_lme_resolution.enable_flags)
      - >-
        lme_resolved_revision == ((_lme_resolution.resolved | combine(({_lme_global_file.lme_config_registry.remote_harness_schema.policy_key: (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope))} if (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope)) is not none else {}))) | lme_bind_revision(
           _lme_global_file.lme_config_registry,
           [{'name': lme_profile,
             'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}]))
      # C1-TYPED-OUTPUT-REVISION (codex 022716): bind the ACTUAL published content, not only a recompute it
      # compares equal to -- the published section is schema/type-validated and every digest in it re-derives
      # from its own content, and the revision is the binder over the actual lme_resolved.
      - lme_resolved | lme_verify_resolved(_lme_global_file.lme_config_registry)
      - >-
        lme_resolved_revision == (lme_resolved | lme_bind_revision(
           _lme_global_file.lme_config_registry,
           [{'name': lme_profile,
             'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}]))
    fail_msg: >-
      a resolver output fact (resolution, resolved config, origins, enable flags or config
      revision) was pre-supplied / -e-pinned and disagrees with its freshly recomputed value --
      the canonical derived artifact and its revision inputs must not be overridden by external
      state (C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN / C1-DERIVED-EFFECTIVE-INPUTS-PIN).
    quiet: true

# OPEN DEBT (codex resolution_lifetime -- explicitly transitional, removed as consumer
# migrations land; no parallel legacy backend at acceptance): materialize the resolved
# values under their BARE names for consumers not yet migrated to read lme_resolved.*
# (tailscale_serve_* in podman/tasks/main.yml + tailscale_*.yml; offline_mode in the
# offline load tasks; install_llm / install_elastic_services in container_setup / main.yml
# + site.yml:179/188; lme_consumer_profile). The loader NEVER reads a bare name as input
# (it reads lme_inputs), so this cannot self-capture. Optional fields absent from
# lme_resolved are NOT bridged (their readers use `| default`).
#
# codex-1045 decision B (C1-OBSERVATION-FIELD-REPEATED-LOAD-STALE-BRIDGE): fields DECLARED
# observation_only are EXCLUDED from this compatibility bridge, selected GENERICALLY by the
# property (lme_observation_only_keys). Their canonical value lives ONLY in lme_resolved.* --
# no bare alias is manufactured -- so a repeated load without the observation leaves no stale
# alias, and no bridge_absent sentinel is needed. Operator/inventory/profile injection of such
# a bare name is still rejected by the observation-only channel guard, and an UNEXPECTED bare
# fact in scope is still caught by the split-brain invariant below (B does NOT silence it).
- name: Bridge resolved values to bare facts for un-migrated consumers (OPEN debt)
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: >-
    {{ _lme_resolution.resolved | dict2items
       | rejectattr('key', 'in', _lme_global_file.lme_config_registry | lme_observation_only_keys)
       | list }}
  loop_control:
    label: "{{ item.key }}"

# OPTIONAL-VALUE-RESET (C1-OPTIONAL-VALUE-RESET; advisor step 2). A declared OPTIONAL
# field that resolves to ABSENT (no value at any tier) is legitimately missing from
# lme_resolved -- the tested optional-absent contract (test_optional_absent_when_unset).
# But its BARE compat fact, once written true under a PRIOR profile (e.g.
# tailscale_require_vip_live under the tailscale profile), would SURVIVE a switch to a
# profile that omits it: the bridge above only writes keys PRESENT in resolved, so it
# cannot clear a now-absent optional -- a LIVE profile-switch stale-carry regression.
# We reset each such absent optional's bare fact to its schema-declared `bridge_absent`
# value. That value is the declared "unset" representation: every current reader uses
# `| default(false)`, so `false` is byte-identical in EFFECT to absence while clearing
# the stale carry. lme_resolved itself stays ABSENT (contract + unit tests preserved);
# ONLY the bare compat fact is reset. A field that declares no `bridge_absent` is left
# untouched (this reset is opt-in per field, so it never fabricates a value the schema
# did not sanction). Not null: `| default(false)` does not fire on None.
- name: Reset stale bare facts for declared optionals now absent (profile-switch carry)
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value.bridge_absent }}"
  loop: >-
    {{ _lme_global_file.lme_config_registry.fields | dict2items
       | selectattr('value.bridge_absent', 'defined')
       | rejectattr('key', 'in', _lme_resolution.resolved.keys() | list) | list }}
  loop_control:
    label: "{{ item.key }}"

# POST-BRIDGE SPLIT-BRAIN INVARIANT (C1-DERIVED-EFFECTIVE-INPUTS-PIN closure). Inert-ing the
# _lme_eff_inputs intermediate above defeats the exact `-e _lme_eff_inputs={}` counterexample,
# but a pin can move ONE HOP UP (`-e _lme_operator_selections={}`, or a future derived
# intermediate) and again DISCARD an admitted selection with an internally-consistent
# read-back. This is the un-forgeable backstop: for EVERY registry field whose bare compat
# fact is in scope, the bare value MUST agree (by DECLARED TYPE, so a valid equivalent
# representation like the string 'false' is not a disagreement) with the canonical
# lme_resolved value. A bare-name fact is a set_fact (Ansible var precedence 19), overwritten
# by role/include params and extra-vars (20-22) -- so a bare != resolved key can ONLY come
# from a higher-precedence operator input the resolution dropped, exactly the split-brain
# (inventory/play/role-default values <=15 are overwritten by the bridge and can never
# false-trip it). Runs on the supported path BEFORE any mutation (site.yml / elasticsearch.yml
# barriers include this file), so a discarded declaration fails closed pre-mutation. The
# registry-key subset of `vars` is built INLINE (no pinnable task var). NB an entrypoint that
# passes a registry field as a BARE include_role var whose value the resolver then ignores
# would trip this (correct behaviour: an entrypoint declares selections via lme_inputs, never
# a bare role var); upgrade_lme's two resolve includes both build identical lme_inputs, so
# they pass.
- name: Read-back guard -- no split-brain between the bare compat facts and lme_resolved (untamperable)
  ansible.builtin.assert:
    that:
      - >-
        (_lme_global_file.lme_config_registry
         | lme_split_brain_keys(
             dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                  | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                        | map('extract', vars) | list)),
             lme_resolved)) | length == 0
    fail_msg: >-
      a bare config fact in scope disagrees with the canonical lme_resolved value for registry
      field(s) {{ _lme_global_file.lme_config_registry | lme_split_brain_keys(dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list) | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list) | map('extract', vars) | list)), lme_resolved) }}
      -- a higher-precedence operator input (or a pinned derived intermediate) was admitted
      into scope but DISCARDED from resolution (split-brain). The canonical artifact must
      faithfully reflect every admitted declaration (C1-DERIVED-EFFECTIVE-INPUTS-PIN).
    quiet: true


# --- lme_global: the ONE composition (moved here from load_manifests.yml; SEED-06) ------------------
# lme_global = global.yml lme_global | active profile lme_global | lme_global_override (operator LAST),
# recursive. It lives in the shared resolve entrypoint so every caller of `tasks_from: resolve` (the
# remote-harness route included) consumes the SAME composition; load_manifests.yml includes this file and
# composes nothing itself. The remote-harness section above is projected from the same inline expression.
- name: Compose lme_global (global | profile | operator override LAST) -- the one composition
  ansible.builtin.set_fact:
    lme_global: >-
      {{ (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True) }}
    # Audit only (override provenance; NOT revision-bound, codex-232517): the leaf paths the operator set.
    lme_remote_harness_overridden_paths: >-
      {{ (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_remote_harness_overridden_paths((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema)) }}

- name: Read-back guard -- lme_global and the remote-harness audit are the recomputed values (untamperable)
  ansible.builtin.assert:
    that:
      - lme_global == ((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True))
      - lme_remote_harness_overridden_paths == (((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)) | combine(lme_global_override | default({}), recursive=True)) | lme_remote_harness_overridden_paths((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)), lme_global_override | default({}), _lme_global_file.lme_config_registry.remote_harness_schema))
    fail_msg: >-
      lme_global or lme_remote_harness_overridden_paths was pre-supplied / -e-pinned and disagrees with its
      freshly recomputed value; the composition is a resolver output (SEED-06, C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN).
    quiet: true
