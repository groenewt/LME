                            | zip((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | map('extract', dict(((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | reject('in', ((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | zip((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | map('extract', hostvars) | list) | selectattr('1', 'contains', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) | map(attribute='0') | list)) | list) | product([_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent])) | combine(dict(((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | zip((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | map('extract', hostvars) | list) | selectattr('1', 'contains', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) | map(attribute='0') | list) | zip(((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | zip((([_lme_global_file.lme_config_registry.remote_harness_schema.host_scope.controller_id] + groups['all']) | unique | list) | map('extract', hostvars) | list) | selectattr('1', 'contains', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) | map(attribute='0') | list) | map('extract', hostvars, _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) | list)))) | list)),
