# OPEN DEBT (codex resolution_lifetime -- explicitly transitional, removed as consumer
# migrations land; no parallel legacy backend at acceptance): materialize the resolved
# values under their BARE names for consumers not yet migrated to read lme_resolved.*
# (tailscale_serve_* in podman/tasks/main.yml + tailscale_*.yml; offline_mode in the
# offline load tasks; install_llm / install_elastic_services in container_setup / main.yml
# + site.yml:179/188; lme_consumer_profile). The loader NEVER reads a bare name as input
# (it reads lme_inputs), so this cannot self-capture. Optional fields absent from
# lme_resolved are NOT bridged (their bare-name readers outside this file still carry a fallback filter:
# coupling CPL-SR922D-BARE-READERS, not changed here).
#
# codex-1045 decision B (C1-OBSERVATION-FIELD-REPEATED-LOAD-STALE-BRIDGE): fields DECLARED
# observation_only are EXCLUDED from this compatibility bridge, selected GENERICALLY by the
# property (lme_observation_only_keys). Their canonical value lives ONLY in lme_resolved.* --
# no bare alias is manufactured -- so a repeated load without the observation leaves no stale
# alias, and no bridge_absent sentinel is needed. Operator/inventory/profile injection of such
# a bare name is still rejected by the observation-only channel guard, and an UNEXPECTED bare
# fact in scope is still caught by the split-brain invariant below (B does NOT silence it).
- name: Bridge resolved values to bare facts for un-migrated consumers (OPEN debt)
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: >-
    {{ _lme_resolution.resolved | dict2items
       | rejectattr('key', 'in', _lme_global_file.lme_config_registry | lme_observation_only_keys)
       | list }}
  loop_control:
    label: "{{ item.key }}"

# OPTIONAL-VALUE-RESET (C1-OPTIONAL-VALUE-RESET; advisor step 2). A declared OPTIONAL
# field that resolves to ABSENT (no value at any tier) is legitimately missing from
# lme_resolved -- the tested optional-absent contract (test_optional_absent_when_unset).
# But its BARE compat fact, once written true under a PRIOR profile (e.g.
# tailscale_require_vip_live under the tailscale profile), would SURVIVE a switch to a
# profile that omits it: the bridge above only writes keys PRESENT in resolved, so it
# cannot clear a now-absent optional -- a LIVE profile-switch stale-carry regression.
# We reset each such absent optional's bare fact to its schema-declared `bridge_absent`
# value. That value is the declared "unset" representation: every current bare-name reader
# (outside this file) of a field that declares bridge_absent (today only
# tailscale_require_vip_live, 4 readers) applies a false-valued fallback filter, so `false` is
# byte-identical in EFFECT to absence while clearing the stale carry (CPL-SR922D-BARE-READERS).
# C1-SR922G: readers of other optionals differ (install_llm readers fall back to true,
# load_manifests :118 to an empty string); those fields declare no bridge_absent and are
# never reset here. lme_resolved
# itself stays ABSENT (contract + unit tests preserved);
# ONLY the bare compat fact is reset. A field that declares no `bridge_absent` is left
# untouched (this reset is opt-in per field, so it never fabricates a value the schema
# did not sanction). Not null: such a fallback filter does not fire on None.
# C1-SR922D: the opt-in is MEMBERSHIP of bridge_absent in the field declaration (the ansible.builtin.contains test is
# `value in seq`), not defined-ness of an attribute.
- name: Reset stale bare facts for declared optionals now absent (profile-switch carry)
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value.bridge_absent }}"
  loop: >-
    {{ _lme_global_file.lme_config_registry.fields | dict2items
       | selectattr('value', 'contains', 'bridge_absent')
       | rejectattr('key', 'in', _lme_resolution.resolved.keys() | list) | list }}
  loop_control:
    label: "{{ item.key }}"

# POST-BRIDGE SPLIT-BRAIN INVARIANT (C1-DERIVED-EFFECTIVE-INPUTS-PIN closure). Inert-ing the
# _lme_eff_inputs intermediate above defeats the exact `-e _lme_eff_inputs={}` counterexample,
# but a pin can move ONE HOP UP (`-e _lme_operator_selections={}`, or a future derived
# intermediate) and again DISCARD an admitted selection with an internally-consistent
# read-back. This is the un-forgeable backstop: for EVERY registry field whose bare compat
# fact is in scope, the bare value MUST agree (by DECLARED TYPE, so a valid equivalent
# representation like the string 'false' is not a disagreement) with the canonical
# lme_resolved value. A bare-name fact is a set_fact (Ansible var precedence 19), overwritten
# by role/include params and extra-vars (20-22) -- so a bare != resolved key can ONLY come
# from a higher-precedence operator input the resolution dropped, exactly the split-brain
# (inventory/play/role-default values <=15 are overwritten by the bridge and can never
# false-trip it). Runs on the supported path BEFORE any mutation (site.yml / elasticsearch.yml
# barriers include this file), so a discarded declaration fails closed pre-mutation. The
# registry-key subset of `vars` is built INLINE (no pinnable task var). NB an entrypoint that
# passes a registry field as a BARE include_role var whose value the resolver then ignores
# would trip this (correct behaviour: an entrypoint declares selections via lme_inputs, never
# a bare role var); upgrade_lme's two resolve includes both build identical lme_inputs, so
# they pass.
- name: Read-back guard -- no split-brain between the bare compat facts and lme_resolved (untamperable)
  ansible.builtin.assert:
    that:
      - >-
        (_lme_global_file.lme_config_registry
         | lme_split_brain_keys(
             dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                  | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list)
                        | map('extract', vars) | list)),
             lme_resolved)) | length == 0
    fail_msg: >-
      a bare config fact in scope disagrees with the canonical lme_resolved value for registry
      field(s) {{ _lme_global_file.lme_config_registry | lme_split_brain_keys(dict((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list) | zip((_lme_global_file.lme_config_registry.fields.keys() | list | select('in', vars) | list) | map('extract', vars) | list)), lme_resolved) }}
      -- a higher-precedence operator input (or a pinned derived intermediate) was admitted
      into scope but DISCARDED from resolution (split-brain). The canonical artifact must
      faithfully reflect every admitted declaration (C1-DERIVED-EFFECTIVE-INPUTS-PIN).
    quiet: true


