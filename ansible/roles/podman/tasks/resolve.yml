    rh_gp_probe: []
    rh_gp_edition: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.edition] }}"
    rh_gp_codes: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).refusals.git }}"
    rh_gp_texts: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).texts.git }}"
    rh_gp_history: null

- name: Re-observe every rel of the level after its Git admission (round 2; observation race)
  when: _lme_rh_level | length > 0
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _lme_rh_level.values() | list }}"
  register: _lme_rh_dobs2

- name: Refuse an observation race (round 2; observed digest before and after the Git admission differ)
  when: _lme_rh_level | length > 0
  ansible.builtin.assert:
    that:
      - _lme_rh_dobs2.results | map(attribute='stat') | map(attribute='checksum') | list
        == _lme_rh_dobs.results | map(attribute='stat') | map(attribute='checksum') | list
    fail_msg: >-
      REFUSED {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).refusals.member }}: {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).texts.race }}
      {{ _lme_rh_level | list | sort | to_json }}
    quiet: true

- name: Refuse an unjoined trusted blob or another edition (round 2; distinct provenance joined)
  when: _lme_rh_level | length > 0
  ansible.builtin.assert:
    that:
      - _lme_rh_level.values() | reject('in', rh_gp_oids) | list | length == 0
      - rh_gp_head == lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.edition]
    fail_msg: >-
      REFUSED {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).refusals.member }}: {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).texts.member }}
      {{ _lme_rh_level | list | sort | to_json }}
    quiet: true

- name: Extend the reading-stage partial admission by each Git-admitted rel of the level (round 2; observed and trusted kept distinct)
  when: _lme_rh_level | length > 0
  ansible.builtin.set_fact:
    _lme_rh_admission: >-
      {{ _lme_rh_admission | combine({lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader:
           {lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members: {_lme_rh_dob.item: {lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).member_fields.observed: _lme_rh_dob.stat.checksum,
                                                                 lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).member_fields.trusted: rh_gp_oids[_lme_rh_dob.item]}}}}, recursive=True) }}
  loop: "{{ _lme_rh_dobs.results }}"
  loop_control:
    loop_var: _lme_rh_dob

- name: Read every document of the level once, exact bytes, in level order (round 2; Git-admitted rel; membership and digest before the strict parse)
  when: _lme_rh_level | length > 0
  ansible.builtin.set_fact:
    _lme_rh_documents: >-
      {{ _lme_rh_documents | lme_rh_document_append(
           lookup('ansible.builtin.file',
                  rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _lme_rh_level[_lme_rh_doc_name],
                  lstrip=(_lme_rh_scope | lme_rh_document_plan(_lme_global_file.lme_config_registry.remote_harness_schema, admission=_lme_rh_admission)).read.lstrip,
                  rstrip=(_lme_rh_scope | lme_rh_document_plan(_lme_global_file.lme_config_registry.remote_harness_schema, admission=_lme_rh_admission)).read.rstrip),
           _lme_rh_doc_name, _lme_rh_scope, _lme_global_file.lme_config_registry.remote_harness_schema, admission=_lme_rh_admission) }}
  loop: "{{ _lme_rh_level.keys() | list }}"
  loop_control:
    loop_var: _lme_rh_doc_name

# records-staged-reader-01 (codex-tick740 empty_prefix; codex-tick747 RECEIPT-BINDER / ordinary_profile_semantics): the
# declared set is complete before any receipt exists; the receipt is bound HERE, after the last level and before the
# projection below. A guarded harness source operation whose channel is inactive completes its executable-source
# receipt (the partial record, members_rel only) without counting an empty document map as active success. Ordinary
# (non-harness) runs bind nothing and keep admission null.
- name: Refuse an active channel whose declared document set is not completely read (no receipt from a prefix)
  ansible.builtin.assert:
    that:
      - (_lme_rh_documents | list | sort) == ((_lme_rh_scope | lme_rh_document_plan(_lme_global_file.lme_config_registry.remote_harness_schema, admission=_lme_rh_admission)).names | sort)
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.refusal }}:
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.message }}
      {{ _lme_rh_documents | list | sort | to_json }}
    quiet: true

- name: Bind the completed source-admission receipt (complete_projection_and_carrier; before the projection below)
  # C1 s07 RS-02 (seat ruling CONFLICT-FW24-RS-ISDEFINED (a)): staged-reader-01:551 -- the rh_src_partial presence
  # test re-spelled as key membership; presence form per ALS ea00724b.
  # C1 s10 R10-03 (records-c1-framework-27): HOMED -- the presence name is the declared document_channel.admission.partial.
  # C1 s11 R11-05 (records-c1-framework-29): the value is read by the same declared name as the presence test.
  when: _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial in vars
  ansible.builtin.set_fact:
    rh_src_admission: >-
      {{ _lme_rh_admission[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader]
         if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema))
         else lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure] }}

- name: Read-back guard -- the visible receipt is this reader's completion of the partial admission (type-aware; untamperable)
  # C1 s07 RS-02 (seat ruling CONFLICT-FW24-RS-ISDEFINED (a)): staged-reader-01:559 -- the rh_src_partial presence
  # test re-spelled as key membership; presence form per ALS ea00724b.
  # C1 s10 R10-04 (records-c1-framework-27): HOMED -- the presence name is the declared document_channel.admission.partial.
  # C1 s11 R11-06 (records-c1-framework-29): the readback compares against the value under the declared names only.
  when: _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial in vars
  ansible.builtin.assert:
    that:
      - >-
        rh_src_admission | lme_type_aware_equal(_lme_rh_admission[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader]
        if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema))
        else lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure])
      - (rh_src_admission | dict2items | rejectattr('key', 'equalto', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members) | items2dict | to_json(sort_keys=true))
        == (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure] | dict2items | rejectattr('key', 'equalto', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members) | items2dict | to_json(sort_keys=true))
      - (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members] | to_json(sort_keys=true))
        == (rh_src_admission[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members] | dict2items | selectattr('key', 'in', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members].keys() | list) | items2dict | to_json(sort_keys=true))
      - (rh_src_admission[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members].keys() | difference(lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members].keys() | list) | sort)
        == (_lme_rh_documents.values() | map(attribute='rel') | sort)
    fail_msg: >-
      REFUSED {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).refusals.replaced }}: {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).texts.replaced }}
      {{ _lme_rh_documents | list | sort | to_json }}
    quiet: true

- name: Bind the document admission authority for the projection (the completed receipt while active, null otherwise; a resolver output)
  ansible.builtin.set_fact:
    _lme_rh_admission: >-
      {{ rh_src_admission if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)) else none }}

- name: Read-back guard -- the projection's admission authority is the recomputed value (type-aware; untamperable)
  ansible.builtin.assert:
    that:
      - >-
        _lme_rh_admission | lme_type_aware_equal(rh_src_admission if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)) else none)
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.refusal }}:
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.message }}
      {{ [_lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.fact] | to_json }}
    quiet: true

# F05-S4 MAIN ruling 4: the publish / read-back / override-audit expressions below carry no fallback filter. The
# profile overlay is REQUIRED (every profile declares profile_overlay.lme_global; admitted by membership and type at
# the C1-SR922D caller-input assert above); the optional caller input lme_global_override has ONE declared absent form
# (registry lme_config_registry.caller_inputs.lme_global_override.absent), selected only when its declared var
# (caller_inputs.lme_global_override.var) is not in vars (C1-SR922D: membership, not defined-ness). A present value of
# the wrong type refuses typed here, before use; the message renders a type name only under membership.
- name: Refuse a malformed profile overlay or operator override (typed, before the remote-harness projection)
  ansible.builtin.assert:
    that:
      - "'lme_global' in _lme_profile_composition.overlay"
      - (_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)) is mapping
      - >-
        (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var not in vars)
        or (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) is mapping)
      - _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent is mapping
    fail_msg: >-
      lme: profile {{ lme_profile }} profile_overlay.lme_global must be a declared mapping and
      {{ _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var }}, when supplied, a mapping (registry
      lme_config_registry.caller_inputs.lme_global_override.absent is its declared absent form); got overlay
      {{ ((_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)) | type_debug) if ('lme_global' in _lme_profile_composition.overlay) else '<absent>' }}
      / override {{ (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) | type_debug) if (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var in vars) else '<absent>' }}.
    quiet: true

# Publish the NAMESPACED outputs. lme_enable_flags comes straight from the engine (already
# strict-bool-coerced) -- it is is_enabled()'s input, an OUTPUT name never read back as
# operator input, so this is self-capture-free. lme_resolved_origins carries honest
# provenance (a natively-selected value is labelled `operator`, never falsely extra_var).
- name: Publish namespaced resolved config, origins and enable flags (OUTPUT names)
  ansible.builtin.set_fact:
    # SEED-06 (codex-232517): the effective remote-harness policy is a typed section of the authoritative
    # resolved configuration (absent when no policy is declared), so the revision below binds it.
    lme_resolved: "{{ (_lme_resolution.resolved | combine(({_lme_global_file.lme_config_registry.remote_harness_schema.policy_key: (((_lme_global_file.lme_global | combine((_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)), recursive=True)) | combine((lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine((_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)), recursive=True)), (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope, documents=_lme_rh_documents, admission=_lme_rh_admission))} if (((_lme_global_file.lme_global | combine((_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)), recursive=True)) | combine((lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent), recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine((_lme_profile_file.profile_overlay.lme_global | combine(_lme_profile_composition.overlay.lme_global, recursive=True)), recursive=True)), (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var) if (_lme_global_file.lme_config_registry.caller_inputs.lme_global_override.var in vars) else _lme_global_file.lme_config_registry.caller_inputs.lme_global_override.absent), _lme_global_file.lme_config_registry.remote_harness_schema, _lme_rh_scope, documents=_lme_rh_documents, admission=_lme_rh_admission)) is not none else {}))) }}"
    lme_resolved_origins: "{{ _lme_resolution.origins }}"
    lme_enable_flags: "{{ _lme_resolution.enable_flags }}"

# C1-INVOCATION-CONTEXT-01 E12-09 (C1-SOURCE-BINDING-01; codex 892 source_edition_join; SR-301-02): the ONE
# source-admission binding of this resolve, published beside (never inside) lme_resolved, over the consumed captures
# (profile_identity global_var / var), the document admission authority, the manifests dir and the record blocks.
# An extra-var outranks set_fact, so the read-back recomputes it inline; E12-10 re-derives it inside the complete
# verification.
- name: E12-09 Publish the source-admission binding beside lme_resolved (OUTPUT name)
  ansible.builtin.set_fact:
    lme_source_binding: >-
      {{ lme_resolved | lme_source_binding(_lme_global_file.lme_config_registry,
         captures=dict([_lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.global_var,
                        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var]
                       | zip([lme_global_loaded, lme_profile_loaded])),
         admission=_lme_rh_admission, manifests_dir=lme_manifests_dir,
         record_blocks=_lme_global_file.lme_global.record_schemas.blocks) }}

- name: E12-09 Read-back guard -- the source-admission binding is the recomputed value (type-aware; untamperable)
  ansible.builtin.assert:
    that:
      - >-
        lme_source_binding | lme_type_aware_equal(lme_resolved | lme_source_binding(_lme_global_file.lme_config_registry,
        captures=dict([_lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.global_var,
                       _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var]
                      | zip([lme_global_loaded, lme_profile_loaded])),
        admission=_lme_rh_admission, manifests_dir=lme_manifests_dir,
        record_blocks=_lme_global_file.lme_global.record_schemas.blocks))
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.source_binding.refusal }}: (E12-09)
      lme_source_binding was pre-supplied / -e-pinned; the binding is a resolver output
    quiet: true

# CONFIGURATION revision (codex revision_identity (b)): content-addressed over the
# canonical declared/resolved config -- the resolved VALUES (minus registry
# exclude_from_revision identity fields), the ordered profile identities and the schema
# version. It is deterministic from the CONFIG ALONE: it EXCLUDES wall-clock, volatile
# observation timestamps, unrelated commits AND provenance (origins). Origins are
# deliberately NOT hashed -- the same values reached two ways MUST yield the SAME revision,
# so an unchanged config never rewrites or restarts a healthy consumer. OUTPUT-ONLY.
#
# UNTAMPERABLE DERIVATION (C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN, codex-0815 HIGH). The
# previous form computed the hash from NAMED `vars:` intermediates (_lme_revision_resolved,
# _lme_revision_excluded, _lme_profile_identities). An extra-var OUTRANKS a task `vars:`, so
# `-e _lme_revision_resolved={}` pinned the hash input to an empty mapping while the real
# resolver still flipped install_otel false->true -- the recorded revision stayed identical
# and both peers reached deployment markers. There is now NO revision-only named
# intermediate: the whole payload is assembled INSIDE the value-pure lme_bind_revision filter
# (which reads the exclude set from the registry), and the profile-identity list is an INLINE
# literal (not a variable, so -e cannot pin it). The immediately-following read-back guard
# re-runs the SAME inline call and rejects any state where a pinned fact disagrees with the
# freshly recomputed value -- so checking the final variable is not the only defence.
# NB this is the CONFIG-ONLY revision (resolve.yml has no lme_services/projections yet);
# load_manifests.yml REBINDS lme_resolved_revision to the COMPLETE composed revision after
# the material/datastore/membership projections + lme_services/lme_global are built.
- name: Compute the content-addressed configuration revision (config-only; deterministic; OUTPUT-ONLY; untamperable)
  ansible.builtin.set_fact:
    lme_resolved_revision: >-
