# SR-320-03 (MAIN 943): the source-edition field names (L8 _rh_scoped edition shape) and the revision profile-identity
# key name a digest algorithm; the digests they carry are the registered capture stat checksums, computed by
# lme_invocation_words.digest_algorithm (E12-02 stat), which E12-05 binds to profile_identity.digest_algorithm. So
# every edition digest field must end with that declared word (an absent edition -- no remote-harness policy -- is
# an empty selection), and the revision key word (profile_identity.fields, second word) must be that declared word.
- name: SR-320-03 Refuse an edition or revision digest name whose algorithm is not the declared capture digest algorithm
  ansible.builtin.assert:
    that:
      - >-
        _lme_rh_scope | dict2items | selectattr('key', 'eq', 'edition') | map(attribute='value') | map('dict2items')
        | flatten | map(attribute='key') | reject('eq', 'profile')
        | reject('search', (_lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.digest_algorithm
        | regex_escape) ~ '$') | list == []
      - >-
        _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.fields[1]
        == _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.digest_algorithm
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.refusal }}: (SR-320-03) an edition
      or revision digest name does not carry the declared capture digest algorithm
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.digest_algorithm }}
    quiet: true

# F05-S3 DOCUMENT READER (LR-14; registry remote_harness_schema.document_channel), STAGED (records-staged-reader-01;
# codex-tick740 single_engine_document_reader, codex-tick747, codex-tick751). Authority while the channel is active: the
# explicit executable_closure PARTIAL admission rh_src_partial (admit_loader_source.yml; source_admission.members_rel
# only; reserved, refused pre-supplied by refuse_pinned_outputs.yml), re-keyed under the single_engine_document_reader
# word and passed to the loader SEPARATELY as _lme_rh_admission. The document relation is ONE level (OI-05), so the
# reader runs at most two LEVEL rounds (below). The completed receipt rh_src_admission is bound HERE after the last
# level and BEFORE the projection; it is never the partial admission. Inactive / no policy: nothing is read,
# _lme_rh_admission is null, _lme_rh_documents is the empty set started below.
- name: Refuse an active document channel without the explicit executable_closure partial admission (typed, before any read)
  ansible.builtin.assert:
    that:
      # C1 s07 RS-01 (seat ruling CONFLICT-FW24-RS-ISDEFINED (a)): staged-reader-01:279 -- both presence tests
      # (rh_src_partial, _rh_sa_decl) re-spelled as key membership; presence form per ALS ea00724b; type checks kept.
      # C1 s10 R10-01 (records-c1-framework-27; codex-tick821 item 5): HOMED -- both presence names are the DECLARED
      # registry values document_channel.admission.partial / .declaration (GL-27-03; loader s10 L10 admits them), read
      # through the registry node this task already reads; membership is tested on those declared values. early_names is
      # not widened and no name is sourced from the fact being tested (closes the s08 UNHOMED debt; ERR-FW24-01 stands).
      # C1 s11 R11-01 (records-c1-framework-29; codex-tick823 OPEN-NOTE-R10-BARE-VALUE-READS): presence, type, value,
      # construction and readback all use the declared names (lookup by name); no read of a fixed input name remains.
      - >-
        not (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema))
        or (_lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial in vars and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial) is mapping
            and _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration in vars and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration) is mapping
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages is mapping and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words is mapping
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure is string
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader is string
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure in lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial) | dict2items | rejectattr('key', 'equalto', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure) | list | length == 0
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure] is mapping)
    # C1 s07 RS-01 (seat ruling CONFLICT-FW24-RS-ISDEFINED (a)): staged-reader-01:289 -- the presence test in the
    # to_json list re-spelled as key membership; presence form per ALS ea00724b.
    # C1 s10 R10-02 (records-c1-framework-27): HOMED -- the presence name is the declared document_channel.admission.partial.
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.refusal }}:
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.message }}
      {{ [_lme_global_file.lme_config_registry.remote_harness_schema.document_channel.when, _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial in vars] | to_json }}
    quiet: true

- name: Bind the reading-stage admission authority (the executable_closure partial admission under the single_engine_document_reader word while active, null otherwise)
  ansible.builtin.set_fact:
    _lme_rh_admission: >-
      {{ {lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader: lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure]}
         if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)) else none }}

- name: Read-back guard -- the reading-stage admission authority is the recomputed value (type-aware; untamperable)
  ansible.builtin.assert:
    that:
      - >-
        _lme_rh_admission | lme_type_aware_equal({lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.single_engine_document_reader: lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure]}
        if (_lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)) else none)
    fail_msg: >-
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.refusal }}:
      {{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.message }}
      {{ [_lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.fact] | to_json }}
    quiet: true

# records-staged-reader-01 (codex-tick740 "preserve executable hash checks before first Git use"; codex-tick747 RF-GIT
# "retain include membership checks and tool hashing before Git"): the reader's Git use runs the RECORD's executables
# and the RECORD's Git-path include, re-hashed here (bytes at use) against the partial admission before the first round.
- name: Re-hash the record's Git and env executables before the reader's first Git use (links followed)
  when: _lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.tool][item][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).tool_fields.path] }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).tool_roles.keys() | list }}"
  register: _lme_rh_tobs

- name: Refuse a missing, non-executable or changed Git / env executable (digest == the partial admission's; before the reader's first Git use)
  when: _lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)
  ansible.builtin.assert:
    that:
      - _lme_rh_tobs.results | rejectattr('stat.exists') | list | length == 0
      - _lme_rh_tobs.results | map(attribute='stat') | rejectattr('executable') | list | length == 0
      - _lme_rh_tobs.results | map(attribute='stat') | map(attribute='checksum') | list
        == lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).tool_roles.keys() | map('extract', lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.tool]) | map(attribute=lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).tool_fields.sha256) | list
    fail_msg: >-
      REFUSED {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).refusals.tool }}: {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).texts.tool }}
      {{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).tool_roles.keys() | list | zip(_lme_rh_tobs.results | map(attribute='stat') | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: Observe the record's Git-path include before the reader includes it (no link followed)
  when: _lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.git].include_rel }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).digest_algorithm }}"
    get_mime: false
    get_attributes: false
  register: _lme_rh_iobs

- name: Refuse a Git-path include that is not an admitted executable_closure member with its admitted bytes
  when: _lme_rh_scope | lme_rh_documents_active(_lme_global_file.lme_config_registry.remote_harness_schema)
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.git].include_rel
        in lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.partial)[lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).admission_stages.words.executable_closure][lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.admission.declaration).record_fields.members]
