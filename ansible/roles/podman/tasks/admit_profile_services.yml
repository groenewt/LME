- name: Admit selected profiles and required service bindings before activation
  ansible.builtin.assert:
    that:
      - lme_global.profile_selectors | lme_type_aware_equal(_lme_global_file.lme_global.profile_selectors)
      - >-
        (lookup('ansible.builtin.template', _lme_global_file.lme_global.profile_selectors.admission_template,
          template_vars=dict(
            lme_selector_schema=_lme_global_file.lme_global.profile_selectors,
            lme_selector_composition=_lme_profile_composition,
            lme_selector_resolved=lme_resolved,
            lme_selector_global=lme_global,
            lme_selector_services=lme_services,
            lme_selector_flags=lme_enable_flags)) | from_json)
        | length == _lme_global_file.lme_global.profile_selectors.constants.zero
    fail_msg: "{{ _lme_global_file.lme_global.profile_selectors.refusal }}"
    quiet: true
