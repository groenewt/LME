- name: Compose independent profile overlays through the existing resolver
  ansible.builtin.set_fact:
    _lme_profile_composition: >-
      {{ lookup('ansible.builtin.template', _lme_global_file.lme_global.profile_selectors.template,
           template_vars=dict(
             lme_selector_schema=_lme_global_file.lme_global.profile_selectors,
             lme_selector_base=_lme_profile_file.profile_overlay,
             lme_selector_inputs=(_lme_global_file.lme_config_registry
               | lme_resolve_from_admitted(
                   _lme_profile_file.profile_overlay.vars,
                   _lme_operator_selections,
                   (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var)
                    if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars)
                    else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent))).resolved))
         | from_json }}

- name: Verify independent profile composition from admitted declarations
  ansible.builtin.assert:
    that:
      - >-
        _lme_profile_composition | lme_type_aware_equal(
          lookup('ansible.builtin.template', _lme_global_file.lme_global.profile_selectors.template,
            template_vars=dict(
              lme_selector_schema=_lme_global_file.lme_global.profile_selectors,
              lme_selector_base=_lme_profile_file.profile_overlay,
              lme_selector_inputs=(_lme_global_file.lme_config_registry
                | lme_resolve_from_admitted(
                    _lme_profile_file.profile_overlay.vars,
                    _lme_operator_selections,
                    (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var)
                     if (_lme_global_file.lme_config_registry.caller_inputs.lme_inputs.var in vars)
                     else _lme_global_file.lme_config_registry.caller_inputs.lme_inputs.absent))).resolved))
          | from_json)
      - _lme_profile_composition.errors | length == _lme_global_file.lme_global.profile_selectors.constants.zero
    fail_msg: "{{ _lme_global_file.lme_global.profile_selectors.refusal }}"
    quiet: true
