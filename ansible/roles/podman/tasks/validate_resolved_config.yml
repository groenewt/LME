---
# validate_resolved_config.yml -- the SINGLE production gate that asserts a resolved
# config is schema-valid BEFORE any mutation. Included by load_manifests.yml AND by the
# C1 A1 regression case (which feeds a crafted-bad dict), so the test exercises the
# LITERAL production check, not a drifting copy (codex C1-VALIDATE-CALL / A1).
#
# registry-FIRST pipe: `registry | lme_validate_config(resolved)`. The filter's
# registry-shape gate makes a REVERSED argument fail CLOSED (it raises "no fields")
# rather than pass silently -- so the gate is fail-closed by construction, not merely by
# getting the argument order right. lme_validate_config RAISES on any violation (missing
# required field, non-canonical type, undeclared key, malformed registry); a valid dict
# returns unchanged (a mapping), so the assert passes.
- name: Assert the resolved config satisfies the declared schema (fail-closed, pre-mutation)
  ansible.builtin.assert:
    that:
      - (_lme_validate_registry | lme_validate_config(_lme_validate_resolved)) is mapping
    fail_msg: >-
      resolved config failed schema validation -- missing required field, non-canonical
      type, undeclared key, or malformed registry (see the raised lme: message above).
    quiet: true
