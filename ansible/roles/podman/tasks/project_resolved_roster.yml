- name: Require the existing loader facts before application roster projection
  ansible.builtin.assert:
    that:
      - lme_roster_contract.inputs is mapping
      - lme_roster_contract.inputs.keys() | list | sort == lme_roster_contract.required_input_roles | sort
      - lme_roster_contract.inputs.values() | map(attribute=lme_roster_contract.atoms.structural.fact) | difference(vars.keys() | list) | length == lme_roster_contract.atoms.zero
    quiet: "{{ lme_roster_contract.atoms.true }}"
    fail_msg: "{{ lme_roster_contract.diagnostics.input_missing }}"

- name: Bind exact post-load fact values without loading or merging source configuration
  vars:
    _roster_input_names: "{{ lme_roster_contract.inputs.values() | map(attribute=lme_roster_contract.atoms.structural.fact) | list }}"
  ansible.builtin.set_fact:
    lme_roster_facts: "{{ dict(_roster_input_names | zip(_roster_input_names | map('extract', vars) | list)) }}"
  no_log: "{{ lme_roster_contract.atoms.true }}"

- name: Reject a substituted input projection and require the whole declared service universe
  vars:
    _roster_input_names: "{{ lme_roster_contract.inputs.values() | map(attribute=lme_roster_contract.atoms.structural.fact) | list }}"
  ansible.builtin.assert:
    that:
      - (lme_roster_facts | to_json(sort_keys=lme_roster_contract.atoms.true)) == (dict(_roster_input_names | zip(_roster_input_names | map('extract', vars) | list)) | to_json(sort_keys=lme_roster_contract.atoms.true))
      - lme_roster_facts[lme_roster_contract.inputs.services.fact] is mapping
      - lme_roster_facts[lme_roster_contract.inputs.rendered_services.fact] is sequence
      - lme_roster_facts[lme_roster_contract.inputs.rendered_services.fact] is not string
      - lme_roster_facts[lme_roster_contract.inputs.rendered_services.fact] is not mapping
      - lme_roster_facts[lme_roster_contract.inputs.rendered_services.fact] | difference(lme_roster_facts[lme_roster_contract.inputs.services.fact].keys() | list) | length == lme_roster_contract.atoms.zero
      - lme_roster_facts[lme_roster_contract.inputs.enable_flags.fact] is mapping
      - lme_roster_facts[lme_roster_contract.inputs.resolved.fact] is mapping
      - lme_roster_facts[lme_roster_contract.inputs.node.fact] is string
      - lme_roster_facts[lme_roster_contract.inputs.profile.fact] is string
    quiet: "{{ lme_roster_contract.atoms.true }}"
    fail_msg: "{{ lme_roster_contract.diagnostics.input_shape }}"
  no_log: "{{ lme_roster_contract.atoms.true }}"

- name: Require each composed service identity to agree with its map key
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - item.value[lme_roster_contract.service_projection.identity_field] == item.key
      - item.value[lme_roster_contract.service_projection.kind_field] is string
    quiet: "{{ lme_roster_contract.atoms.true }}"
    fail_msg: "{{ lme_roster_contract.diagnostics.service_shape }}"
  loop: "{{ lme_roster_facts[lme_roster_contract.inputs.services.fact] | dict2items }}"
  no_log: "{{ lme_roster_contract.atoms.true }}"

- name: Project reference-only roster metadata through the reusable template
  ansible.builtin.set_fact:
    _lme_roster_projection: "{{ lookup(lme_roster_contract.render.lookup, lme_roster_contract.render.template) | from_yaml }}"
  no_log: "{{ lme_roster_contract.atoms.true }}"

- name: Refuse a projection that drops declared services or changes rendered selection
  vars:
    _roster_fields: "{{ lme_roster_contract.atoms.structural }}"
  ansible.builtin.assert:
    that:
      - _lme_roster_projection is mapping
      - (_lme_roster_projection | to_json(sort_keys=lme_roster_contract.atoms.true)) == (lookup(lme_roster_contract.render.lookup, lme_roster_contract.render.template) | from_yaml | to_json(sort_keys=lme_roster_contract.atoms.true))
      - _lme_roster_projection[_roster_fields.services] | map(attribute=_roster_fields.id) | list | sort == lme_roster_facts[lme_roster_contract.inputs.services.fact].keys() | list | sort
      - _lme_roster_projection[_roster_fields.services] | selectattr(_roster_fields.selected) | map(attribute=_roster_fields.id) | list | sort == lme_roster_facts[lme_roster_contract.inputs.rendered_services.fact] | sort
    quiet: "{{ lme_roster_contract.atoms.true }}"
    fail_msg: "{{ lme_roster_contract.diagnostics.projection_shape }}"
