---
# ansible/roles/podman/tasks/load_manifests.yml
#
# Loads the manifest tree into facts. The merge ORDER is provable by reading THIS
# FILE ALONE, and the operator override always wins LAST. NB: the winning override
# `lme_service_overrides` can come from an -e extra-var OR from host_vars (e.g.
# host_vars/es{1,2,3}.yml) -- its SOURCE is not visible from this file alone; either
# way it combines LAST and can clobber the legacy es_* shim (see the WARNING below):
#
#   lme_global      = global.yml.lme_global
#                   | combine(<active profile>.lme_global, recursive=True)
#                   | combine(lme_global_override | default({}), recursive=True)   # operator LAST
#
#   lme_services[<id>] = <service.yml>
#                   | combine(<active profile>.services[<id>], recursive=True)
#                   | combine(_lme_service_overrides_eff[<id>], recursive=True)  # operator LAST
#
#   lme_service_kinds[<id>] = <service.yml>.kind   (feeds the svc_unit/unit_refs filters)
#
# LEGACY CLUSTER-INVENTORY SHIM (G6 reconciliation #9). The tree's own cluster
# inventory generators (scripts/create_cluster_inventory.sh, the escluster CI, the
# testing/ + docker/lib/ installers) emit per-node discovery as the FLAT legacy
# vars es_node_name / es_publish_host / es_cluster_seed_hosts (+ es_is_initial_master
# on the master), NOT as lme_service_overrides. install.sh forwards them with -e but
# nothing mapped them, so a true generator-driven cluster run got no node.name /
# seed_hosts / publish_host into the rendered ES unit. This file bridges them:
#
#   _lme_service_overrides_eff =
#       { elasticsearch: { environment: <es_* -> ES settings> } }   # legacy shim BASE
#       | combine(lme_service_overrides | default({}), recursive=True)   # operator LAST
#
#   The shim reproduces lme-elasticsearch.container.j2's four discovery branches
#   1:1 from identical legacy inputs (node.name<-es_node_name; discovery.seed_hosts
#   <-es_cluster_seed_hosts normalised + comma-joined; cluster.initial_master_nodes
#   <-es_initial_master_nodes|default(['lme-elasticsearch']) comma-joined, GATED on
#   es_is_initial_master like the .j2; network.publish_host<-es_publish_host with the
#   .j2's truthiness/omit guard). It is a BASE only: the operator's own
#   lme_service_overrides is READ, never shadowed (an -e extra-var outranks set_fact,
#   so re-binding it would be silently ignored), and combines OVER the shim so the
#   operator still wins LAST. When es_node_name is undefined the shim is inert by
#   construction: _lme_service_overrides_eff == lme_service_overrides | default({}).
#
#   WARNING (R8-7 clobber): lme_service_overrides is ONE var with ordinary Ansible
#   precedence, and host_vars is a valid SOURCE of it -- not just -e. A generator-driven
#   cluster that inherits the example host_vars/es{1,2,3}.yml (placeholder IPs
#   10.0.0.4/5/6) will have THOSE combine LAST over the generator's real-IP es_* shim,
#   silently overriding real discovery -- with NO -e present. Edit/remove those host_vars
#   overrides before a real cluster run.
#
#   INVOCATION SCOPE (do not over-read the warning): this clobber is real ONLY on an
#   inventory-driven run (`-i ansible/inventory` with es{1,2,3} in the play) where those
#   host_vars auto-load. It does NOT apply to the `install.sh --cluster` Phase-1 path,
#   which runs site.yml on localhost (site.yml:3-4 hosts/connection local) via a BARE
#   `ansible-playbook` with NO `-i ansible/inventory` (install.sh:1002-1006; the
#   root-level $SCRIPT_DIR/inventory is absent in-repo and there is no ansible.cfg
#   default) -- so host_vars/es{1,2,3}.yml never load there and the OPPOSITE defect
#   applies (R8-2: the es_* shim is gated `when: es_node_name is defined`, which Phase-1
#   never sets -> zero discovery keys). Fixing host_vars hygiene does NOT unblock
#   --cluster; that needs the Phase-1/Phase-2 ordering redesign.
#
# G1 provides this file; G2/G3 include it. The G2 cutover is DONE: this file is now
# wired into the live install path -- quadlet_setup.yml:19 loads it (and
# container_setup.yml:17 loads it defensively), both reached from podman main.yml
# (:248 / :240), so lme_global / lme_services / _lme_service_overrides_eff render live.

- name: Resolve manifests dir and active profile
  ansible.builtin.set_fact:
    lme_manifests_dir: "{{ lme_manifests_dir | default(clone_directory ~ '/manifests') }}"
    lme_profile: "{{ lme_profile | default('default') }}"

- name: Load global manifest
  ansible.builtin.include_vars:
    file: "{{ lme_manifests_dir }}/global.yml"
    name: _lme_global_file

- name: Load active profile overlay
  ansible.builtin.include_vars:
    file: "{{ lme_manifests_dir }}/profiles/{{ lme_profile }}.yml"
    name: _lme_profile_file

- name: Compose lme_global (global | profile | operator override LAST)
  ansible.builtin.set_fact:
    lme_global: >-
      {{ _lme_global_file.lme_global
         | combine(_lme_profile_file.profile_overlay.lme_global | default({}), recursive=True)
         | combine(lme_global_override | default({}), recursive=True) }}

# Apply the profile's NON-FLAG vars as facts (es_discovery, tailscale_serve_*, ...).
# The five ENABLE FLAGS are DELIBERATELY excluded here and resolved from scratch below
# (defaults | profile | operator LAST) so that (a) an operator inventory/host_var/-e
# override outranks the profile -- a profile set_fact would wrongly outrank inventory --
# and (b) a flag absent from a newly-selected profile REVERTS to its default instead of
# retaining a stale prior-load value. See "Resolve enable flags from scratch" below.
- name: Apply profile NON-flag vars as facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ (_lme_profile_file.profile_overlay.vars | default({})) | dict2items | rejectattr('key', 'in', _lme_flag_keys) | list }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    _lme_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]

# Assemble the flags dict that render_units.yml's is_enabled() consults. Defaults
# recovered from the current role (install_llm default true; elastic-services and
# offline default false). Runs AFTER the profile-vars set_fact so a profile (or an
# operator -e) override flows in. is_enabled treats the 'always' sentinel as a
# no-op, so unlisted flags never need an entry here.
# Temporary failure boundary during canonical-engine reconciliation. This is an
# implementation gap, not an operator prohibition or an alternate deployment path.
- name: Reject selectors whose canonical composition is not yet integrated
  ansible.builtin.assert:
    that:
      - lme_database_profile | default('') | length == 0
      - lme_telemetry_profile | default('') | length == 0
      - lme_telemetry_destinations | default([]) | length == 0
    fail_msg: >-
      Database and telemetry composition is not yet integrated into the existing
      manifest engine. Deployment cannot satisfy the selected requirements.

- name: Require resolved consumer secret and certificate bindings
  ansible.builtin.assert:
    that:
      - lme_secrets_source_host | default('') | length > 0
      - lme_certs_source_host | default('') | length > 0
      - lme_service_overrides.dashboard.environment.ELASTICSEARCH_URL | default('') | length > 0
      - lme_service_overrides.dashboard.environment.LITELLM_URL | default('') | length > 0
    fail_msg: Consumer profile requires topology-derived secret source, certificate authority and endpoints.
  when: lme_consumer_profile | default(false) | strict_enable_bool

# --- Enable-flag resolution (offline-stale + inventory-override defect fix) ----------
# Precedence CONFIRMED by codex (extra-var > inventory/host_var > profile > default);
# recomputed FROM SCRATCH each load (no combine-into-prior, no stale set_fact). Root
# cause of both defects: the old code applied profile flags as top-level host facts,
# which (a) outrank inventory (set_fact > inventory in Ansible) and (b) persist across
# reloads. defaults/main.yml defines NONE of these five, so `is defined` on the FIRST,
# uncontaminated load means the OPERATOR (inventory/host_var/-e) set it.
- name: Capture operator flag overrides once (uncontaminated by any profile/prior-load fact)
  ansible.builtin.set_fact:
    _lme_operator_flags: >-
      {{ {}
         | combine({'install_llm': install_llm} if install_llm is defined else {})
         | combine({'install_elastic_services': install_elastic_services} if install_elastic_services is defined else {})
         | combine({'offline_mode': offline_mode} if offline_mode is defined else {})
         | combine({'install_otel': install_otel} if install_otel is defined else {})
         | combine({'install_legacy_beats': install_legacy_beats} if install_legacy_beats is defined else {}) }}
  when: _lme_operator_flags is not defined

- name: Resolve enable flags from scratch (defaults | profile | operator LAST)
  ansible.builtin.set_fact:
    _lme_resolved_flags: >-
      {{ _lme_flag_defaults
         | combine(_lme_profile_flags, recursive=True)
         | combine(_lme_operator_flags | default({}), recursive=True) }}
  vars:
    _lme_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]
    _lme_flag_defaults: {install_llm: true, install_elastic_services: false, offline_mode: false, install_otel: false, install_legacy_beats: true}
    _lme_profile_flags: "{{ (_lme_profile_file.profile_overlay.vars | default({})) | dict2items | selectattr('key', 'in', _lme_flag_keys) | list | items2dict }}"

# Materialize the resolved flags as bare facts so INSTALL-TIME consumers that read them
# directly (main.yml / llama_cpp_setup.yml / load_offline_containers.yml, e.g.
# `offline_mode | default(false)`) see the resolved value. This runs each load and
# reflects the from-scratch resolution; the operator capture above is guarded so it is
# NEVER re-read from these materialized facts.
- name: Materialize resolved enable flags as bare facts
  ansible.builtin.set_fact:
    "{{ item.key }}": "{{ item.value }}"
  loop: "{{ _lme_resolved_flags | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Assemble enable flags for is_enabled()
  ansible.builtin.set_fact:
    lme_enable_flags:
      install_llm: "{{ _lme_resolved_flags.install_llm | strict_enable_bool }}"
      install_elastic_services: "{{ _lme_resolved_flags.install_elastic_services | strict_enable_bool }}"
      offline_mode: "{{ _lme_resolved_flags.offline_mode | strict_enable_bool }}"
      install_otel: "{{ _lme_resolved_flags.install_otel | strict_enable_bool }}"
      install_legacy_beats: "{{ _lme_resolved_flags.install_legacy_beats | strict_enable_bool }}"

# GAP-3 host-scoping roster (lme_host_services): DELIBERATELY NOT assembled into a fact
# here. It is an operator/host_vars-supplied list of service ids (host_vars/<host>.yml);
# default UNDEFINED -> full host (backward-compat). trixie is a PLAIN client (no tailscale
# profile), so scoping is carried in host_vars, not a profile overlay. Every consumer reads
# it `| default`-guarded -- the empty-safe `when:` clauses in container_setup.yml /
# tailscale_service.yml / tailscale_ingress.yml / render_units.yml, plus container.j2's
# `| default(None)` -- so there is nothing to normalise into a fact here.
# HAZARD-1: do NOT add `set_fact: lme_host_services: "{{ lme_host_services | default([]) }}"`.
# An unconditional default makes the var defined-and-empty on every existing full-host run,
# which the design forbids (defined-and-empty must mean full host, and a naive membership
# clause would then wipe out every unit). If a set_fact is ever needed to normalise, gate it
# `when: lme_host_services is defined` and never default to [].

# Legacy cluster-inventory shim (see header). Builds the elasticsearch environment
# override BASE from the flat es_* vars the tree's own generators emit, matching
# lme-elasticsearch.container.j2 branch-for-branch. Fires ONLY when es_node_name is
# defined; otherwise _lme_es_legacy_overrides stays unset and the effective-override
# task below degenerates to the operator's own lme_service_overrides (fully inert).
- name: Build legacy es_* elasticsearch override base (inert unless es_node_name defined)
  ansible.builtin.set_fact:
    _lme_es_legacy_overrides: >-
      {{ {'elasticsearch': {'environment':
           {'node.name': es_node_name}
           | combine({'network.publish_host': es_publish_host}
                     if (es_publish_host is defined and es_publish_host
                         and '__omit_place_holder__' not in (es_publish_host | string))
                     else {})
           | combine({'discovery.seed_hosts': _lme_es_seed_join}
                     if ((_lme_es_seed_join | length) > 0)
                     else {})
           | combine({'cluster.initial_master_nodes': _lme_es_masters_join}
                     if (es_is_initial_master | default(false) | bool)
                     else {})
         }} }}
  vars:
    # es_cluster_seed_hosts arrives as a real YAML list (inventory all.vars) OR as a
    # string via -e (incl. the bracketed "[a, b]" form -e can produce) -- normalise
    # both to a trimmed, comma-joined bare-host string (NO :9300; the generators emit
    # bare IPs and the .j2 join(',')s them). Same regex_replace spelling as
    # convert_to_cluster.yml. Leaf is a string, so no native-type dependency.
    _lme_es_seed_join: >-
      {{ (es_cluster_seed_hosts | regex_replace('\\[|\\]', '') | split(',') | map('trim') | select | join(','))
         if (es_cluster_seed_hosts is defined and es_cluster_seed_hosts is string)
         else (es_cluster_seed_hosts | map('string') | map('trim') | join(','))
         if (es_cluster_seed_hosts is defined)
         else '' }}
    # cluster.initial_master_nodes takes NODE NAMES (match node.name), NOT hosts --
    # confirmed by ansible/spec/CLUSTER_ELASTICSEARCH_SPEC.md and the .j2. Value +
    # default mirror convert_to_cluster.yml: es_initial_master_nodes|default(['lme-elasticsearch']).
    _lme_es_masters_join: >-
      {{ (es_initial_master_nodes | regex_replace('\\[|\\]', '') | split(',') | map('trim') | select | join(','))
         if (es_initial_master_nodes is defined and es_initial_master_nodes is string)
         else (es_initial_master_nodes | map('string') | map('trim') | join(','))
         if (es_initial_master_nodes is defined)
         else 'lme-elasticsearch' }}
  when: es_node_name is defined

# Effective service overrides = legacy shim BASE, with the operator's own
# lme_service_overrides combined OVER it (operator wins LAST). Computed
# UNCONDITIONALLY so it always exists; degenerates to the operator layer when the
# shim did not fire. The operator var is only READ here (never re-bound), so an -e
# lme_service_overrides keeps its precedence and still overrides the shim.
- name: Resolve effective service overrides (legacy shim base | operator override LAST)
  ansible.builtin.set_fact:
    _lme_service_overrides_eff: >-
      {{ _lme_es_legacy_overrides | default({})
         | combine(lme_service_overrides | default({}), recursive=True) }}

- name: Enumerate service manifests
  ansible.builtin.find:
    paths: "{{ lme_manifests_dir }}/services"
    patterns: "*.yml"
    file_type: file
  delegate_to: localhost
  connection: local
  run_once: true
  become: false
  register: _lme_service_files

# Reset lme_services before the build loop so each load resolves the CURRENT service
# set from scratch. Without this, `lme_services | default({})` in the build task below
# combines into whatever a PRIOR load left behind -- so a service whose manifest was
# removed persists as a stale entry (the service-removal retention defect). The loop
# still accumulates within THIS load (first iteration reads {}, later ones read the
# growing map); only the cross-load carry-over is severed.
- name: Reset lme_services (recompute the current service set from scratch each load)
  ansible.builtin.set_fact:
    lme_services: {}

- name: Build lme_services map (service | profile.services[id] | operator override[id] LAST)
  ansible.builtin.set_fact:
    lme_services: >-
      {{ lme_services | default({}) | combine({
           (lookup('file', item.path) | from_yaml).id:
             (lookup('file', item.path) | from_yaml)
             | combine(_lme_profile_file.profile_overlay.services[(lookup('file', item.path) | from_yaml).id] | default({}), recursive=True)
             | combine(_lme_service_overrides_eff[(lookup('file', item.path) | from_yaml).id] | default({}), recursive=True)
         }) }}
  loop: "{{ _lme_service_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Build lme_service_kinds map (id -> kind) for dependency-name resolution
  ansible.builtin.set_fact:
    lme_service_kinds: >-
      {{ dict(lme_services.keys() | zip(lme_services.values() | map(attribute='kind'))) }}

# GAP-3 typo guard (fail-loud; closes a silent no-render hole). `lme_host_services` is the
# per-host render allow-list (host_vars). A roster id that names NO service (e.g. a typo
# `dashbord`) makes every `item.key in lme_host_services` scope clause False for that id,
# so it is silently pruned at rc=0 -- the exact silent-green class this host-scoping must
# not introduce. `is_enabled` raises on an unknown enable FLAG; this mirrors that for an
# unknown ROSTER id. Gated on a NON-EMPTY roster, so undefined/[] (full-host, backward
# compat) skips it -- same empty-safe semantics as the scope clauses (default([])).
- name: Assert every lme_host_services roster id names a known service (GAP-3 typo guard)
  ansible.builtin.assert:
    that:
      - (lme_host_services | default([]) | difference(lme_services.keys() | list)) | length == 0
    fail_msg: >-
      lme_host_services names service id(s) absent from the manifest service set:
      {{ lme_host_services | default([]) | difference(lme_services.keys() | list) }} --
      every host-scope roster id must match a rendered service id (check for a typo).
      Known service ids: {{ lme_services.keys() | list | sort }}.
    quiet: true
  when: lme_host_services | default([]) | length > 0

# GAP-5: the set of service ids this host ACTUALLY renders. Same three predicates as
# render_units.yml:34-38 (is_enabled ∧ not child-absent ∧ empty-safe host-scope), so
# site.yml's POST-RENDER layer (ES/Kibana/Dashboards/Wazuh/Fleet post-config +
# llama_cpp_setup) can gate each step on whether this host renders that step's BACKING
# service. A full / no-roster host => the host-scope clause is length==0 TRUE => every
# enabled service is a member => the post-render layer runs in full (single-host
# byte-unchanged). Computed here (set_facts persist for the play) so it is in scope in
# site.yml's post-render tasks, which already rely on this role's facts.
#   SYNC CONTRACT: keep these three predicates in step with render_units.yml:34-38.
#   NB render_units also carries a 4th predicate -- kind in [container,volume,network] --
#   which this accumulator INTENTIONALLY omits: it tests membership of BACKING service ids
#   (all kind=container) + the LLM anchor, for which the kind filter is a no-op, so the set
#   is a harmless superset (also holds target/oneshot ids no consumer of this fact queries).
#   Every current gate keys on a container-kind id; keep it that way, or a future
#   non-{container,volume,network} backing would need the kind filter added here too.
#   lme_child_absent_services is only set for cluster ES-only children (quadlet_setup,
#   when lme_child_es_only), which run elasticsearch.yml -- NOT site.yml's post-render
#   layer -- so it is undefined for every host that runs that layer => default([]) is
#   exact here; the cluster-child case is deferred wave-wide.
- name: GAP-5 -- reset this host's rendered-service accumulator
  ansible.builtin.set_fact:
    lme_host_rendered_services: []

- name: GAP-5 -- accumulate the service ids this host renders (mirror render_units gate)
  ansible.builtin.set_fact:
    lme_host_rendered_services: "{{ lme_host_rendered_services + [item.key] }}"
  loop: "{{ lme_services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - item.value.enabled_when | default(['always']) | is_enabled(lme_enable_flags | default({}))
    - item.key not in (lme_child_absent_services | default([]))
    - (lme_host_services | default([]) | length == 0) or (item.key in (lme_host_services | default([])))
