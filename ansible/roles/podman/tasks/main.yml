---
# Include OS-specific variables
- name: Include OS-specific variables
  include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - "default.yml"

# Include OS-specific tasks
- name: Include OS-specific tasks
  include_tasks: "{{ item }}"
  with_first_found:
    - "{{ ansible_distribution | lower }}.yml"
    - "{{ ansible_os_family | lower }}.yml"
    - "common.yml"

# Set up SELinux detection variables (needed for pre-install module loading)
- name: Detect if SELinux tooling is available
  command: which getenforce
  register: selinux_tooling
  changed_when: false
  failed_when: false
  become: yes

- name: Set SELinux availability fact
  set_fact:
    selinux_available: "{{ selinux_tooling.rc == 0 }}"

- name: Set SELinux policy management support fact
  set_fact:
    selinux_policy_managed: "{{ ansible_os_family == 'RedHat' and selinux_tooling.rc == 0 }}"

- name: Get current SELinux mode
  command: getenforce
  register: getenforce_out
  changed_when: false
  failed_when: false
  become: yes
  when: selinux_available | default(false)

# These tasks are common for all distributions (skip for RHEL offline - no Nix installed)
- name: Check if Nix daemon unit exists
  shell: systemctl cat "{{ nix_daemon_service }}" >/dev/null 2>&1 || systemctl list-unit-files | grep -E "^{{ nix_daemon_service }}(\\.service)?\\s" >/dev/null 2>&1
  args:
    executable: /bin/bash
  register: nix_daemon_unit_check
  changed_when: false
  failed_when: false
  become: yes
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Check if Nix appears installed (nix binary)
  stat:
    path: /nix/var/nix/profiles/default/bin/nix
  register: nix_binary_stat
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Check if Nix is available on PATH (e.g. distro package)
  shell: command -v nix
  args:
    executable: /bin/bash
  register: nix_on_path
  changed_when: false
  failed_when: false
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Set Nix presence fact
  set_fact:
    nix_present: "{{ nix_binary_stat.stat.exists or (nix_on_path.rc | default(1)) == 0 }}"
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Ensure Nix daemon is running
  block:
    - name: Start/enable nix-daemon via systemd module
      systemd:
        name: "{{ nix_daemon_service }}"
        state: started
        enabled: yes
        daemon_reload: yes
      become: yes
      notify: restart nix-daemon
    - name: Ensure nix-daemon.socket is enabled (socket activation)
      systemd:
        name: "{{ nix_daemon_service }}.socket"
        state: started
        enabled: yes
        daemon_reload: yes
      become: yes
  rescue:
    - name: Fallback start of nix-daemon via systemctl
      shell: |
        set -e
        systemctl daemon-reload
        systemctl enable --now {{ nix_daemon_service }}.socket || true
        systemctl enable --now {{ nix_daemon_service }}
      args:
        executable: /bin/bash
      become: yes
  when:
    - not (offline_mode | default(false) and ansible_os_family == "RedHat")
    - nix_daemon_unit_check.rc == 0
    - nix_present | default(false)

- name: Skip Nix daemon management (unit not present)
  debug:
    msg: "Skipping nix-daemon management because the unit is not present. Run with tags 'nix' first or full play to install Nix."
  when:
    - not (offline_mode | default(false) and ansible_os_family == "RedHat")
    - nix_daemon_unit_check.rc != 0

- name: Skip Nix daemon management (Nix not installed yet)
  debug:
    msg: "Skipping nix-daemon management because Nix is not installed. Run with tags 'nix' first or full play to install Nix."
  when:
    - not (offline_mode | default(false) and ansible_os_family == "RedHat")
    - nix_daemon_unit_check.rc == 0
    - not (nix_present | default(false))

- name: Skip all Nix daemon management (RHEL offline mode)
  debug:
    msg: "Skipping all Nix daemon management - RHEL offline mode uses system podman from RPMs"
  when: offline_mode | default(false) and ansible_os_family == "RedHat"

- name: Wait for Nix daemon to be ready
  wait_for:
    timeout: 10
  when:
    - not (offline_mode | default(false) and ansible_os_family == "RedHat")
    - ansible_play_hosts_all.index(inventory_hostname) == 0

# ---------------------------------------------------------------------------
# Deploy and load Podman SELinux policy BEFORE installation
# ---------------------------------------------------------------------------
- name: Skip Podman SELinux policy management (not applicable on this OS)
  debug:
    msg: "Skipping Podman SELinux policy setup - LME SELinux policies target RHEL container-selinux and are not applicable on {{ ansible_os_family }} hosts."
  when:
    - selinux_available | default(false)
    - not (selinux_policy_managed | default(false))

- name: Deploy Podman SELinux policy files (pre-install)
  copy:
    src: "{{ clone_directory | default(playbook_dir + '/../..') }}/ansible/roles/base/files/selinux/podman_policy.te"
    dest: /etc/selinux/lme/podman_policy.te
    owner: root
    group: root
    mode: '0644'
  become: yes
  when:
    - selinux_available | default(false)
    - selinux_policy_managed | default(false)

- name: Deploy Podman SELinux file contexts (pre-install)
  copy:
    src: "{{ clone_directory | default(playbook_dir + '/../..') }}/ansible/roles/base/files/selinux/podman_policy.fc"
    dest: /etc/selinux/lme/podman_policy.fc
    owner: root
    group: root
    mode: '0644'
  become: yes
  when:
    - selinux_available | default(false)
    - selinux_policy_managed | default(false)

- name: Compile Podman SELinux module (pre-install)
  shell: |
    set -e
    cd /etc/selinux/lme
    checkmodule -M -m -o podman_policy.mod podman_policy.te
    semodule_package -o podman_policy.pp -m podman_policy.mod -f podman_policy.fc
  args:
    executable: /bin/bash
  become: yes
  when:
    - selinux_available | default(false)
    - selinux_policy_managed | default(false)
    - (getenforce_out.stdout | default('') | trim) != 'Disabled'

- name: Load Podman SELinux module (pre-install)
  command: semodule -i /etc/selinux/lme/podman_policy.pp
  become: yes
  when:
    - selinux_available | default(false)
    - selinux_policy_managed | default(false)
    - (getenforce_out.stdout | default('') | trim) != 'Disabled'

- name: Ensure Podman SELinux module enabled (pre-install)
  command: semodule -e podman_policy
  become: yes
  when:
    - selinux_available | default(false)
    - selinux_policy_managed | default(false)
    - (getenforce_out.stdout | default('') | trim) != 'Disabled'

- name: Install Podman using Nix (online mode only)
  command: nix-env -iA nixpkgs.podman
  become: yes
  environment:
    PATH: "{{ ansible_env.PATH }}:/nix/var/nix/profiles/default/bin"
  register: podman_install
  retries: 3
  delay: 5
  until: podman_install is not failed
  changed_when: "'installing' in podman_install.stdout | default('')"
  when: not (offline_mode | default(false))

- name: Skip Podman Nix installation (offline mode - pre-imported from .nar or using system podman)
  debug:
    msg: "Offline mode - podman already imported from .nar file by install.sh (Ubuntu/Debian) or using system podman from RPMs (RHEL)"
  when: offline_mode | default(false)

- name: Set sysctl limits 
  command: /opt/lme/scripts/set_sysctl_limits.sh
  environment:
    NON_ROOT_USER: "{{ install_user }}"
  become: yes
  changed_when: true

- name: Link latest podman quadlet (Nix podman)
  command: /opt/lme/scripts/link_latest_podman_quadlet.sh
  become: yes
  changed_when: true
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Skip podman quadlet linking (RHEL offline - using system podman)
  debug:
    msg: "Skipping podman quadlet linking - RHEL offline mode uses system podman from RPMs"
  when: offline_mode | default(false) and ansible_os_family == "RedHat"

# Include container setup tasks
- name: Setup containers for podman
  include_tasks: container_setup.yml

# Extract and set global secrets after podman is installed
- name: Include secrets setup tasks
  include_tasks: setup_secrets.yml

# Include quadlet setup tasks
- name: Setup quadlets for podman
  include_tasks: quadlet_setup.yml

# Install + bring up the tailscale daemon whenever ANY tailscale leg is enabled.
# MUST run BEFORE elastic_services_setup.yml: that pack still nests the ingress
# leg (tailscale_ingress.yml), which hard-fails on `tailscale status` when the
# daemon is absent -- so the daemon has to exist first. Placed AFTER quadlet_setup
# so load_manifests (invoked there) has applied the tailscale profile's
# tailscale_serve_* vars that this guard reads. The install has no manifest
# dependency itself; only the service leg (at the bottom) needs lme_services.
- name: Install the tailscale daemon (opt-in, prerequisite for the legs)
  include_tasks: tailscale_install.yml
  when: >-
    (tailscale_serve_ingress | default(false) | bool)
    or (tailscale_serve_egress | default(false) | bool)
    or (tailscale_serve_services | default(false) | bool)

# Include Elastic services pack tasks (conditional)
# `install_elastic_services` is provided by install.sh --elastic-services (and
# defaulted false in site.yml); offline installs force it false. Cluster data
# nodes (lme_child_es_only) do not run the pack: quadlets are pruned on those
# hosts and the repo is not present at clone_directory for SSH installs.
- name: Setup Elastic services pack for podman
  include_tasks: elastic_services_setup.yml
  when:
    - install_elastic_services | default(false) | bool
    - not (lme_child_es_only | default(false) | bool)
    # B4 ordering: when lme_autostart is false (site.yml single-node/master), the
    # beats units mount per-svc bundles (/opt/lme/certs/<svc>) that the certs role
    # -- which runs AFTER this role -- has not published yet. In that regime site.yml
    # re-invokes this file (include_role tasks_from) AFTER cert publish + lme.service
    # start. Only run inline when the stack is being autostarted here.
    - lme_autostart | default(true) | bool

# Include llama.cpp setup tasks (conditional)
# `install_llm` is provided by install.sh (and defaulted in site.yml). Offline
# installs without --llm force it false to skip the offline LLM staging and
# docs-ingestion path, which requires a `prepare_offline.sh --llm` bundle.
# Cluster data nodes (lme_child_es_only) do not run the LLM stack: quadlets are
# pruned on those hosts and the repo is not present at clone_directory for SSH installs.
- name: Setup llama.cpp for podman
  include_tasks: llama_cpp_setup.yml
  when:
    - install_llm | default(true) | bool
    - not (lme_child_es_only | default(false) | bool)
    # B4 ordering (see elastic_services_setup above): the LLM pack mounts per-svc
    # bundles the certs role publishes AFTER this role. When lme_autostart is false,
    # site.yml re-invokes this file after cert publish + lme.service start; skip inline.
    - lme_autostart | default(true) | bool

# ── Tailscale legs (opt-in, orthogonal to the elastic-services pack) ─────────────
# Each leg is enabled independently via its own tailscale_serve_* var (set by the
# tailscale profile or `-e ...`). None of this is gated on install_elastic_services.
# The daemon install is hoisted ABOVE elastic_services_setup.yml (see the include
# earlier) because that pack still nests the ingress leg and would hard-fail on a
# fresh host before the daemon existed. The egress / ingress / services legs below
# only CONFIGURE the already-running daemon.

# Configure tailnet egress (opt-in). Independent of the manifest render (it only
# sets accept-routes / opt-in exit-node), so it has no ordering dependency beyond
# the daemon install above. Enable with the tailscale profile or
# `-e tailscale_serve_egress=true`.
- name: Configure tailnet egress (opt-in)
  include_tasks: tailscale_egress.yml
  when:
    - tailscale_serve_egress | default(false) | bool

# Host-facing tailscale ingress (opt-in). Fronts this node's loopback-bound
# published ports with the node's ts.net cert. Wired here (NOT behind
# install_elastic_services) so it is reachable on its own; it runs whenever
# tailscale_serve_ingress is true, after the daemon install above. Idempotent, so
# it is a no-op if the elastic-services pack also invoked it.
- name: Set up host-facing tailscale serve ingress (opt-in)
  include_tasks: tailscale_ingress.yml
  when:
    - tailscale_serve_ingress | default(false) | bool

# Publish tailnet VIP services (opt-in). MUST run AFTER quadlet_setup.yml so
# lme_services / lme_enable_flags exist (the service leg iterates them to derive
# one VIP per enabled loopback-bound service). Enable with the tailscale profile or
# `-e tailscale_serve_services=true`.
- name: Publish tailnet VIP services (opt-in)
  include_tasks: tailscale_service.yml
  when:
    - tailscale_serve_services | default(false) | bool
