---
# Host-facing Tailscale ingress (OPT-IN, additive) — the "IPC/SVCS" layer.
#
# This task set is included from main.yml ONLY when `tailscale_serve_ingress` is
# true (enable at deploy time with `-e tailscale_serve_ingress=true`, or via the
# tailscale profile). It is orthogonal to the elastic-services pack — it is NOT
# gated on install_elastic_services and runs whenever the ingress var is on, after
# the tailscale daemon install (tailscale_install.yml). It is disabled by default
# and changes nothing about the internal service mesh. (The daemon install
# guarantees tailscaled is up; the status check below only reports/fails.)
#
# EVERYTHING IS DERIVED FROM THE MANIFESTS — no service name or port is hardcoded
# here (mirrors the VIP leg in tailscale_service.yml). A host-facing published port
# is fronted on the tailnet IFF its `publish_ports` entry carries the opt-in marker
# `tailnet_ingress: <mode>`, AND the owning service is enabled in this install
# (enabled_when | is_enabled(lme_enable_flags)). The marker VALUE is the serve mode:
#   * `tailnet_ingress: https`   -> HTTPS service; tailscale TERMINATES TLS with the
#     node's ts.net LE cert (auto-obtained/renewed) and re-encrypts to the local
#     self-signed backend (https+insecure://127.0.0.1:<port>).
#   * `tailnet_ingress: raw-tcp` -> raw TCP passthrough (`--tcp`), NOT TLS-terminated:
#     the backend terminates TLS itself.
# The set the base manifests mark TODAY is apm-server :8200 (https), litellm :4000
# (https) and logstash beats :5044 (raw-tcp) — but that is DATA in the manifests, not
# a literal list in this file; add/remove a marker to change what is fronted.
#
# WHY THIS EXISTS — the internal-CA vs ts.net split:
#   * The internal container<->container mesh uses the Elasticsearch
#     `elasticsearch-certutil` CA with container-alias SANs (lme-elasticsearch,
#     lme-logstash, lme-litellm, ...). That CA is CORRECT and REQUIRED for the
#     mesh and is left completely untouched here.
#   * A `tailscale cert` / `tailscale serve` LE leaf has SAN = this node's
#     `*.ts.net` MagicDNS name ONLY. It can therefore serve host-facing
#     published ports but CANNOT stand in for the internal alias SANs.
#
# So we front only the host-facing, loopback-bound published ports the manifests
# mark, and only the ones whose service is enabled:
#   * An HTTPS-marked port (e.g. apm-server :8200, litellm :4000): tailscale
#     TERMINATES TLS with the node's ts.net LE cert (auto-obtained, auto-renewed)
#     and re-encrypts to the local self-signed backend (https+insecure://127.0.0.1:<port>).
#   * A raw-tcp-marked port (e.g. logstash beats :5044) is a raw TCP passthrough
#     (`--tcp`), NOT TLS-terminated: the backend terminates the TLS itself.
#     CONSEQUENCE for operators wiring external beats: the beat receives logstash's
#     INTERNAL-CA leaf (SAN: lme-logstash, logstash, localhost, 127.0.0.1 — NO ts.net
#     SAN), so the beat must trust the LME CA and must NOT do ts.net hostname
#     verification for the 5044 endpoint (e.g. ssl.verification_mode: certificate).
#     Terminating at tailscale here would hand plaintext to a TLS listener, so
#     `--tcp` (passthrough) is used deliberately instead of `--tls-terminated-tcp`.
#
# Idempotent: each `tailscale serve` line is added only if the same backend is
# not already present in `tailscale serve status`.

- name: Read current tailscale node status
  command: tailscale status --json
  register: ts_status
  changed_when: false
  failed_when: false
  become: yes

- name: Fail clearly if tailscale is unavailable or the node is not logged in
  fail:
    msg: >-
      tailscale_serve_ingress is enabled but `tailscale status` failed
      (rc={{ ts_status.rc }}). Ensure tailscaled is running and this node is
      logged in to the tailnet with MagicDNS + HTTPS certs enabled.
  when: ts_status.rc != 0

# Discover the node's MagicDNS name from status rather than hardcoding it; the
# trailing dot from the FQDN is stripped for display.
- name: Determine this node's MagicDNS (ts.net) name
  set_fact:
    ts_magicdns_name: "{{ (ts_status.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"

- name: Read current tailscale serve config (for idempotency)
  command: tailscale serve status
  register: ts_serve_status
  changed_when: false
  failed_when: false
  become: yes

# --- Derive the host ingress targets purely from the manifests --------------------
# One (name, port, mode) target per `tailnet_ingress`-marked publish_ports entry on
# an ENABLED service. subelements(..., skip_missing=True) walks service x
# publish_ports and SKIPS services with no publish_ports key (so they never raise).
# The marker lives on the PORT entry (unlike the VIP leg's top-level
# `tailnet_service`), so port + mode come straight from the marked entry -- no
# lowest-port convention. Initialise first so the fact always exists.
- name: Initialise the derived host ingress target list
  set_fact:
    ts_ingress_targets: []

- name: Derive one host ingress target per tailnet_ingress-marked publish_port (enabled services only)
  set_fact:
    ts_ingress_targets: >-
      {{ ts_ingress_targets + [ {
           'name': item.0.value.id,
           'port': item.1.host,
           'mode': item.1.tailnet_ingress,
         } ] }}
  loop: "{{ lme_services | dict2items | subelements('value.publish_ports', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.value.id }} (:{{ item.1.host | default('?') }})"
  when:
    # OPT-IN gate: the port entry is marked for host ingress ...
    - item.1.tailnet_ingress is defined
    # ... AND its service is enabled in this install's flag set (mirrors the VIP leg;
    # the old hardcoded list fronted ports regardless of the enabled roster -- B1).
    - item.0.value.enabled_when | default(['always']) | is_enabled(lme_enable_flags | default({}))

# Fail-closed on a malformed marker. A hardcoded list could not carry a typo; a
# per-entry marker can (`tailnet_ingress: htps`), and such a value matches NEITHER
# serve selector below -> the port would be SILENTLY never served (green rc=0).
# Reject it loudly instead (the same fail-closed stance is_enabled takes on a
# misspelled enable flag). Only `https` and `raw-tcp` are valid ingress modes.
- name: Assert every derived ingress target declares a valid serve mode
  assert:
    that:
      - item.mode in ['https', 'raw-tcp']
    fail_msg: >-
      Service '{{ item.name }}' publishes port {{ item.port }} with an invalid
      tailnet_ingress mode '{{ item.mode }}'. Valid modes: https, raw-tcp. Fix the
      marker on that publish_ports entry in the service manifest.
    quiet: true
  loop: "{{ ts_ingress_targets }}"
  loop_control:
    label: "{{ item.name }} (:{{ item.port }} {{ item.mode }})"

- name: Front host-facing HTTPS ingress services with the node's ts.net cert
  command: "tailscale serve --bg --https={{ item.port }} https+insecure://127.0.0.1:{{ item.port }}"
  loop: "{{ ts_ingress_targets | selectattr('mode', 'equalto', 'https') | list }}"
  loop_control:
    label: "{{ item.name }} (:{{ item.port }})"
  when: ('127.0.0.1:' ~ item.port) not in (ts_serve_status.stdout | default(''))
  changed_when: true
  become: yes

- name: Front host-facing raw-TLS ingress ports as a raw TCP passthrough
  command: "tailscale serve --bg --tcp={{ item.port }} tcp://127.0.0.1:{{ item.port }}"
  loop: "{{ ts_ingress_targets | selectattr('mode', 'equalto', 'raw-tcp') | list }}"
  loop_control:
    label: "{{ item.name }} (:{{ item.port }})"
  when: ('127.0.0.1:' ~ item.port) not in (ts_serve_status.stdout | default(''))
  changed_when: true
  become: yes

- name: Show the host-facing tailscale ingress endpoints
  debug:
    msg: >-
      {{ item.name }} -> {{ ts_magicdns_name | default('this node') }}:{{ item.port }}
      [{{ item.mode }}]
      {{ (item.mode == 'https') | ternary('(ts.net LE cert; proxies 127.0.0.1:' ~ item.port ~ ')',
         '(raw TCP passthrough; backend terminates TLS, client sees the LME internal-CA leaf)') }}
  loop: "{{ ts_ingress_targets }}"
  loop_control:
    label: "{{ item.name }} (:{{ item.port }})"
