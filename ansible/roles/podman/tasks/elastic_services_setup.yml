---
# Elastic services pack setup tasks (apm-server, heartbeat, metricbeat,
# filebeat, logstash). Included from main.yml only when
# `install_elastic_services` is true (install.sh --elastic-services).

# The whole-dir config copy in quadlet_setup.yml uses force=false, so modified
# files (init-setup.sh, instances.yml) would never propagate to installed
# hosts. Force-copy only config/setup/ so host customizations elsewhere under
# /opt/lme/config are not clobbered.
- name: Copy setup config files to /opt/lme/config/setup (always overwrite)
  copy:
    src: "{{ clone_directory }}/config/setup/"
    dest: /opt/lme/config/setup/
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
    force: true
  become: yes

# The pack's quadlet/systemd units are now rendered by render_units.yml from
# manifests/services/* (all enabled_when:[install_elastic_services]), so there is
# no per-file copy here anymore. Child-node pruning is manifest-derived in
# render_units (lme_child_absent_services), which replaces the old explicit
# lme_child_es_only gate on the copy that used to live here.

# Beats refuse to start when their config is not owned by root (or the beat
# user); the whole-dir config copy forces install_user ownership, so re-own
# the pack configs here. No mode on the recursive logstash entry: file's
# recurse applies the mode to directories too, which would strip their
# execute bit and make the tree untraversable for the container's logstash
# user (the staged files are already 0644).
- name: Set root ownership on Elastic services pack configs
  file:
    path: "/opt/lme/config/{{ item.path }}"
    state: "{{ item.state | default('file') }}"
    owner: "root"
    group: "root"
    mode: "{{ item.mode | default(omit) }}"
    recurse: "{{ item.recurse | default(omit) }}"
  loop:
    - path: apm-server.yml
      mode: '0644'
    - path: heartbeat.yml
      mode: '0644'
    - path: metricbeat.yml
      mode: '0644'
    - path: filebeat.yml
      mode: '0644'
    - path: logstash
      state: directory
      recurse: true
  become: yes

# The OS-package apm-server.service (vendor-preset enabled on Debian) squats
# on port 8200 at boot; failed_when: false because the unit may not exist.
- name: Disable host apm-server service (conflicts with pack on port 8200)
  systemd:
    name: apm-server
    state: stopped
    enabled: no
  failed_when: false
  become: yes

# lme-setup-certs is a RemainAfterExit oneshot: a plain re-run of install.sh
# never re-fires it, so restart it to run the cert top-up for the pack.
- name: Restart cert setup unit to run the cert top-up
  systemd:
    name: lme-setup-certs
    state: restarted
    daemon_reload: yes
  become: yes

- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

# The pack quadlets are WantedBy=lme.service, but that does not start new
# units on an already-active umbrella service, so start them explicitly.
- name: Start Elastic services pack units
  systemd:
    name: "{{ item }}"
    state: started
  loop:
    - lme-apm-server
    - lme-heartbeat
    - lme-metricbeat
    - lme-filebeat
    - lme-logstash
  become: yes

# OPT-IN host-facing TLS ingress. Disabled by default; enable at deploy time
# with `-e tailscale_serve_ingress=true`. When off this include is skipped
# entirely, so the default install behavior is unchanged. The internal ES-CA
# service mesh is untouched either way — see tailscale_ingress.yml.
- name: Set up host-facing tailscale serve ingress (opt-in)
  include_tasks: tailscale_ingress.yml
  when: tailscale_serve_ingress | default(false) | bool
