---
# Llama.cpp / LLM-stack setup tasks for podman role.
#
# Image realization (pull/build/retag for pgvector, llama-cpp, litellm, embeddings,
# lme-dashboard, lme-log-analyzer) now happens ONCE in container_setup.yml, driven
# by manifests/global.yml (group: llm). The quadlet/systemd unit files for this
# stack are rendered by render_units.yml from manifests/services/*, not copied
# here. What remains below is genuinely non-render work: the pgvector/llm-keys
# secrets (their creation recipes are stack-specific, so they are DEFERRED here
# rather than created by container_setup's credential loop), model downloads,
# config templating, and runtime activation/DB/ingestion of the rendered units.

- name: Ensure /opt/lme/lme-dashboard directory exists
  file:
    path: /opt/lme/lme-dashboard
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Copy dashboard app to /opt/lme/lme-dashboard
  copy:
    src: "{{ clone_directory }}/lme-dashboard/"
    dest: /opt/lme/lme-dashboard/
    owner: root
    group: root
    mode: preserve
  become: yes

# DEFERRED secret (see container_setup.yml lme_secrets_deferred): pgvector needs a
# random file-driver password, not the shell-driver credential recipe. Gated with
# the LLM stack (this whole file runs only when install_llm), which is the same
# flag that renders lme-litellm / lme-pgvector, so the secret exists before those
# rendered units are started below.
- name: Create pgvector secret password
  shell: |
    source /root/.profile
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    if ! podman secret ls | grep -q pgvector; then
      password=$(</dev/urandom tr -dc A-Za-z0-9 | head -c30)
      echo -n $password | podman secret create --driver file pgvector -
    fi
  args:
    executable: /bin/bash
  become: yes

- name: Create llama models directory
  file:
    path: /opt/lme/llama-models
    state: directory
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0755'
  become: yes

- name: Stage LLM artifacts from offline bundle (airgap)
  include_tasks: load_offline_llm.yml
  when:
    - offline_mode | default(false)
    - install_llm | default(false)

- name: Download LFM2.5 1.2B model (Q4_K_M quantization)
  get_url:
    url: https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
    dest: /opt/lme/llama-models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
    timeout: 600
  become: yes
  when: not (offline_mode | default(false))
  register: model_download
  retries: 3
  delay: 10
  until: model_download is not failed

- name: Download nomic-embed-text-v1.5 model (Q4_K_M quantization)
  get_url:
    url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf
    dest: /opt/lme/llama-models/nomic-embed-text-v1.5.Q4_K_M.gguf
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
    timeout: 600
  become: yes
  when: not (offline_mode | default(false))
  register: embed_model_download
  retries: 3
  delay: 10
  until: embed_model_download is not failed

# DEFERRED secret (see container_setup.yml lme_secrets_deferred): llm-keys is an
# EMPTY placeholder that the key-sync path unit later overwrites; it must NOT be a
# random password, so it is created here rather than by the credential loop.
- name: Create initial llm-keys podman secret (empty placeholder for fresh installs)
  shell: |
    source /root/.profile
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    if ! podman secret ls | grep -q llm-keys; then
      echo -n '# empty' | podman secret create --driver file llm-keys -
    fi
  args:
    executable: /bin/bash
  become: yes

- name: Copy LiteLLM config file to /opt/lme/config
  copy:
    src: "{{ clone_directory }}/config/litellm_config.yaml"
    dest: /opt/lme/config/litellm_config.yaml
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
  become: yes

- name: Ensure /opt/lme/scripts is populated with the latest helper scripts
  ansible.builtin.include_tasks: ../../tasks/setup_lme_scripts.yml

- name: Reload systemd daemon for llama.cpp and LiteLLM
  systemd:
    daemon_reload: yes
  become: yes

- name: Enable and start pgvector service
  systemd:
    name: lme-pgvector.service
    enabled: yes
    state: started
  become: yes

# litellm's PGVECTOR_DB is a SEPARATE `litellm` database (pgvector only
# initialises POSTGRES_DB=lme_vectors), so provision it out-of-band here -- as
# soon as pgvector is up and BEFORE litellm is started below -- otherwise
# litellm's first start cannot connect (compounds B3). pg_isready needs the
# pgvector container running, which the task above just did.
- name: Wait for pgvector to be ready
  shell: podman exec lme-pgvector pg_isready -U lme -d lme_vectors
  args:
    executable: /bin/bash
  register: pgvector_ready
  until: pgvector_ready.rc == 0
  retries: 30
  delay: 10
  become: yes
  when: model_download is succeeded

- name: Create litellm database for LiteLLM UI/key management
  shell: |
    podman exec lme-pgvector psql -U lme -d lme_vectors -tc "SELECT 1 FROM pg_database WHERE datname='litellm'" | grep -q 1 || \
    podman exec lme-pgvector psql -U lme -d lme_vectors -c "CREATE DATABASE litellm"
  args:
    executable: /bin/bash
  become: yes
  when: model_download is succeeded

- name: Enable and start embeddings service
  systemd:
    name: lme-embeddings.service
    enabled: yes
    state: started
  become: yes
  when: embed_model_download is succeeded

- name: Clone lme-docs repo for RAG ingestion (online)
  ansible.builtin.git:
    repo: "https://github.com/cisagov/lme-docs.git"
    dest: /tmp/lme-docs
    depth: 1
    force: true
  become: yes
  when:
    - embed_model_download is succeeded
    - not (offline_mode | default(false))

- name: Run LME documentation ingestion into pgvector (online, from git repo)
  shell: |
    source /root/.profile
    sudo -i podman run --rm --network lme \
      --secret pgvector,type=env,target=PGVECTOR_PASS \
      -v {{ clone_directory }}/scripts:/scripts:z \
      -v /tmp/lme-docs:/repo:z \
      docker.io/library/python:3.11-slim bash -c \
      "pip install -q requests beautifulsoup4 markdownify psycopg2-binary pgvector lxml && python /scripts/ingest_docs.py --reset --docs-repo /repo"
  args:
    executable: /bin/bash
  become: yes
  when:
    - embed_model_download is succeeded
    - not (offline_mode | default(false))
  register: ingest_result
  retries: 5
  delay: 30
  until: ingest_result is not failed

- name: Run LME documentation ingestion into pgvector (offline, pre-scraped)
  shell: |
    source /root/.profile
    sudo -i podman run --rm --network lme \
      --secret pgvector,type=env,target=PGVECTOR_PASS \
      -v {{ clone_directory }}/scripts:/scripts:z \
      -v {{ clone_directory }}/offline_resources/docs/lme-docs-scrape:/docs:z \
      localhost/lme-ingest:{{ lme_global.image_tag }} \
      python /scripts/ingest_docs.py --reset --source-dir /docs
  args:
    executable: /bin/bash
  become: yes
  when:
    - embed_model_download is succeeded
    - offline_mode | default(false)
  register: ingest_result_offline
  retries: 5
  delay: 30
  until: ingest_result_offline is not failed

- name: Enable and start llama.cpp service
  systemd:
    name: lme-llama-cpp.service
    enabled: yes
    state: started
  become: yes
  when: model_download is succeeded
  ignore_errors: yes
  register: llama_cpp_start

- name: Wait for llama.cpp to be ready
  pause:
    seconds: 5
  when: llama_cpp_start is succeeded

- name: Enable and start LiteLLM service
  systemd:
    name: lme-litellm.service
    enabled: yes
    state: started
  become: yes
  when: model_download is succeeded

# The `litellm` database was provisioned right after pgvector came up (above), so
# litellm's first start already has it. This restart is a daemon-reload safety net
# after the full unit set is in place; litellm re-assembles DATABASE_URL from its
# secret/env on every start.
- name: Restart LiteLLM (daemon-reload safety net)
  systemd:
    name: lme-litellm
    state: restarted
    daemon_reload: yes
  become: yes
  when: model_download is succeeded

- name: Enable and start LME Dashboard service
  systemd:
    name: lme-dashboard.service
    enabled: yes
    state: started
  become: yes
  when: model_download is succeeded

- name: Enable and start LME Log Analyzer service
  systemd:
    name: lme-log-analyzer.service
    enabled: yes
    state: started
  become: yes
  when: model_download is succeeded

- name: Enable and start LLM keys path watcher
  systemd:
    name: lme-llm-keys.path
    enabled: yes
    state: started
  become: yes

- name: Create initial llama model config (records the default model)
  copy:
    content: '{"model": "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"}'
    dest: /opt/lme/config/llama-cpp-model.json
    owner: "{{ install_user }}"
    group: "{{ install_user }}"
    mode: '0644'
    force: no
  become: yes

- name: Enable and start llama model switch path watcher
  systemd:
    name: lme-llama-model.path
    enabled: yes
    state: started
  become: yes

- name: Display llama.cpp setup success message
  debug:
    msg: |
      Llama.cpp server with LFM2.5 1.2B model has been installed and started!

      LME Security Dashboard:        http://{{ (ansible_default_ipv4.address if (ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined) else 'localhost') }}:{{ lme_global.ports.dashboard.host }}
      LiteLLM Proxy (HTTPS):         https://{{ (ansible_default_ipv4.address if (ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined) else 'localhost') }}:{{ lme_global.ports.litellm.host }}
      Direct llama.cpp (HTTP only):  http://{{ (ansible_default_ipv4.address if (ansible_default_ipv4 is defined and ansible_default_ipv4.address is defined) else 'localhost') }}:8080

      API Key for LiteLLM: sk-lme-llama-proxy
      Model name: lfm2.5-1.2b
      Model file: LiquidAI/LFM2.5-1.2B-Instruct-GGUF (pulled from HuggingFace at startup)
  when: model_download is succeeded
