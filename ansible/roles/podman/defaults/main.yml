---
# Default variables for podman role

# Default Nix daemon service name (will be overridden by OS-specific vars if needed)
nix_daemon_service: "nix-daemon"

# Other podman-specific configurations
# Note: storage paths are now defined in site.yml
lme_child_es_only: false

# ---------------------------------------------------------------------------
# GAP-2 cross-host consumer CA trust (OPT-IN, OFF by default).
#
# When true, tasks/distribute_ca.yml slurps the PRODUCER node's internal LME CA
# public cert (ca/ca.crt) from lme_ca_source_host and OVERLAYS it onto the published
# cert bundles named in lme_ca_consumers, so a cross-host TLS client (e.g. the
# dashboard's Elasticsearch client) trusts the producer's ES leaf -- which is signed
# by the PRODUCER's CA, not this consumer's own. NO-OP for every single-host install.
#
# Operator inputs (never hardcode a host/id list in a shipped artifact):
#   lme_ca_source_host  -> producer host to slurp ca/ca.crt from. Defaults (in
#                          distribute_ca.yml) to the secrets producer
#                          lme_secrets_source_host, else localhost.
#   lme_ca_consumers    -> list of consumer service ids whose published bundle should
#                          trust the producer CA (e.g. [log-analyzer]). Each id is
#                          validated as an ENABLED cert:<svc> bundle on this host.
lme_distribute_ca: false
lme_ca_consumers: []

# ---------------------------------------------------------------------------
# GAP-4 cross-host secret distribution (OPT-IN, OFF by default).
#
# When true, site.yml (post-cert-publish, pre-lme.service, INSTALL-TIME ONLY) (1) invokes the
# secrets_distribution role to push the PRODUCER's secret bundle (pass.sh + vault +
# containers.conf + secrets.json) onto this consumer, then (2) repairs the file-driver
# secret(s) the bundle does NOT carry (tasks/distribute_secrets.yml), ORDERED AFTER the bundle
# extract. NO-OP for every single-host install.
#
# VERIFIED (gap4-file-driver-verdict.md): the bundle tar carries shell-driver secrets (elastic,
# in /etc/lme/vault) but NOT file-driver PAYLOADS (/var/lib/containers/storage/secrets/<id>).
# It DOES overwrite secrets.json, indexing the producer's file-driver secrets by payload IDs
# absent here -> dangling refs. So litellm_master_key (file driver) does NOT ride the bundle
# and needs the per-secret push.
#
# Operator inputs (never hardcode a host in a shipped artifact):
#   lme_secrets_source_host -> producer host to slurp the bundle + read file-driver secrets
#                              from (resolved in the secrets_distribution role and
#                              distribute_secrets.yml; default localhost). Set
#                              -e lme_secrets_source_host=<producer> (e.g. the graph node).
#
# lme_cross_host_file_secrets: the file-driver secret NAMES pushed per-secret because the
# bundle misses them. A manifest `secrets:` block declares a name but NOT its driver or whether
# it is locally minted, so the file-driver/cross-host CLASS cannot be derived from the manifest
# alone -- this roster names it, and distribute_secrets.yml pushes ONLY the intersection of this
# roster with the secret names ENABLED service manifests actually declare (a name is never
# pushed unless a manifest declares it). This wave's scope is litellm_master_key only.
#
# PRECONDITION / RESIDUALS (see the wave report -- NOT closed here): the whole-bundle
# secrets.json overwrite ALSO leaves the producer's OTHER file-driver secrets dangling on this
# consumer -- pgvector, webui_api_key, llm-keys -- and llama_cpp_setup's
# `podman secret ls | grep -q` guard then SKIPS re-minting them (the name matches the dangling
# index entry), so those units would start against a payload-less secret. And with
# skip-creation on, global_secrets.elastic is empty for the ES/Kibana post-config roles
# (site.yml). So this opt-in is only DEPLOYABLE on a consumer where the LLM stack
# (pgvector/webui) and ES/Kibana post-config are scoped OFF (GAP-3). pgvector's own per-secret
# push is the flagged next-phase item.
lme_distribute_secrets: false
lme_cross_host_file_secrets:
  - litellm_master_key

# ---------------------------------------------------------------------------
# Tailscale legs (OPT-IN, all OFF by default).
#
# Each leg is enabled independently and is orthogonal to the elastic-services
# pack. When ANY of these is true, tailscale_install.yml installs + brings up the
# daemon before the leg runs (see tasks/main.yml). The tailscale profile
# (manifests/profiles/tailscale.yml) flips these on together.
#   * ingress  -> front this node's loopback-bound ports on its ts.net name
#   * egress   -> accept-routes (+ optional exit-node) so LME can reach out
#   * services -> publish enabled services as tailnet VIPs (svc:<name>)
tailscale_serve_ingress: false
tailscale_serve_egress: false
tailscale_serve_services: false
# Consumer-node VIP reachability probe (A1) -- armed NOT from ansible but from
# deploy_gate.sh environment knobs, unarmed by default (there is intentionally no
# ansible var here): LME_GATE_PROBE_FROM=<2nd inventory host> makes deploy_gate probe
# each manifest-declared VIP endpoint FROM a consumer node (never a self-curl on the
# advertiser), and LME_GATE_REQUIRE_VIP_REACHABLE=1 turns an unreachable VIP into a
# typed FAIL (else a WARN). CapMap presence (see tasks/tailscale_service.yml) proves VIP
# ALLOCATION/approval only, NOT end-to-end reachability -- that env-armed probe closes
# the gap. (The former `tailscale_require_vip_reachable` default was removed: it had
# zero readers; the arming lives entirely in those deploy_gate env knobs.)
# Optional operator inputs (never hardcode secrets):
#   tailscale_authkey       -> auth key for a non-interactive `tailscale up`
#   tailscale_up_extra_args -> extra flags appended to `tailscale up`
#   tailscale_exit_node     -> tailnet exit node for the egress leg (opt-in)

# ---------------------------------------------------------------------------
# Cluster child (ES-only) node service set.
#
# Child data nodes run ONLY the Elasticsearch dependency graph. The set is
# expressed as LOGICAL service ids -- the `id` field of each manifest under
# manifests/services/ -- NOT unit filenames, because the install is now
# manifest-driven: render_units.yml renders every ENABLED service whose id is
# not in lme_child_absent_services.
#
# quadlet_setup.yml derives the child prune set from the MANIFEST keys:
#     lme_child_absent_services = lme_services.keys() - lme_child_active_services
# Deriving from manifest keys (and NOT from globbing quadlet/) is deliberate:
# once the legacy quadlet/ tree is deleted, a filesystem glob would go empty and
# prune nothing, so child data nodes would wrongly keep Kibana/Fleet/Wazuh.
# Adding a new service manifest therefore prunes it from child nodes
# automatically unless its logical id is listed here.
#
# id map (unit basename -> logical id):
#   lme.network                 -> network
#   lme-backups.volume          -> backups
#   lme-esdata01.volume         -> esdata01
#   lme-kibanadata.volume       -> kibanadata
#   lme-setup-certs.container   -> setup-certs
#   lme-elasticsearch.container -> elasticsearch
# The umbrella target id `lme` is intentionally NOT listed, so lme.service is
# not rendered on child nodes (parity with the old "remove lme.service" step).
lme_child_active_services:
  - network
  - backups
  - esdata01
  - kibanadata
  - setup-certs
  - elasticsearch
