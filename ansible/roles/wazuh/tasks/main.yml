---
# Wazuh post-install tasks

# REMOVED: Read lme-environment.env file
# REMOVED: Set environment variables

- name: Set playbook variables
  ansible.builtin.set_fact:
    wazuh_password: "{{ global_secrets.wazuh | default('') }}"
    wazuh_api_password: "{{ global_secrets.wazuh_api | default('') }}"

# Configure Wazuh for offline mode (CVE database)
- name: Configure Wazuh vulnerability detection for offline mode
  ansible.builtin.lineinfile:
    path: /opt/lme/config/wazuh_cluster/wazuh_manager.conf
    insertafter: '<feed-update-interval>60m</feed-update-interval>'
    line: '     <offline-url>file:///opt/lme/cve/cves.zip</offline-url>'
    state: present
  become: yes
  when: offline_mode | default(false)

# Wait for Wazuh manager daemons required by the RBAC tool
- name: Wait for Wazuh daemons to be ready
  ansible.builtin.shell: |
    OUTPUT=$(podman exec lme-wazuh-manager /var/ossec/bin/wazuh-control status 2>&1)
    echo "$OUTPUT"
    # Check that essential daemons required by the RBAC tool are running.
    # Optional daemons may legitimately be stopped depending on configuration.
    for daemon in wazuh-modulesd wazuh-analysisd wazuh-execd wazuh-db wazuh-remoted wazuh-apid; do
      if echo "$OUTPUT" | grep -q "$daemon not running"; then
        echo "ESSENTIAL DAEMON NOT READY: $daemon"
        exit 1
      fi
    done
  args:
    executable: /bin/bash
  register: wazuh_status
  until: wazuh_status.rc == 0
  retries: 30
  delay: 10
  become: yes

# Fix Wazuh RBAC
- name: Fix Wazuh RBAC
  ansible.builtin.expect:
    command: /opt/lme/scripts/wazuh_rbac.sh
    responses:
      ".*'wazuh'.*":
        - "{{ wazuh_password }}"
      ".*'wazuh-wui'.*":
        - "{{ wazuh_api_password }}"
    timeout: 240 
  become: yes
  no_log: "{{ not debug_mode }}" 