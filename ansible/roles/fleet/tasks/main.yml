---
# Fleet setup tasks

# Set playbook variables
- name: Set playbook variables
  ansible.builtin.set_fact:
    ipvar: "{{ env_dict.IPVAR | default('') }}"
    # Advertised host for remote fleet enrollment (multinode opt-in, item 1+3).
    # Defaults to ipvar's own source (env_dict.IPVAR) so a single-node install is
    # byte-identical; override with -e fleet_advertise_host=<tailnet MagicDNS name/IP>
    # under the multinode profile. (Defaulting to env_dict.IPVAR rather than the
    # sibling `ipvar` fact avoids relying on intra-set_fact evaluation order; the
    # resolved value is identical.)
    fleet_advertise_host: "{{ fleet_advertise_host | default(env_dict.IPVAR | default('')) }}"
    local_kbn_url: "{{ env_dict.LOCAL_KBN_URL | default('') }}"
    local_es_url: "{{ env_dict.LOCAL_ES_URL | default('') }}"
    stack_version: "{{ env_dict.STACK_VERSION | default('') }}"
    cluster_name: "{{ env_dict.CLUSTER_NAME | default('') }}"
    elastic_username: "{{ env_dict.ELASTIC_USERNAME | default('') }}"
    elasticsearch_username: "{{ env_dict.ELASTICSEARCH_USERNAME | default('') }}"
    kibana_fleet_username: "{{ env_dict.KIBANA_FLEET_USERNAME | default('') }}"
    indexer_username: "{{ env_dict.INDEXER_USERNAME | default('') }}"
    api_username: "{{ env_dict.API_USERNAME | default('') }}"
    license: "{{ env_dict.LICENSE | default('') }}"
    es_port: "{{ env_dict.ES_PORT | default('') }}"
    kibana_port: "{{ env_dict.KIBANA_PORT | default('') }}"
    fleet_port: "{{ env_dict.FLEET_PORT | default('') }}"
    mem_limit: "{{ env_dict.MEM_LIMIT | default('') }}"
    elastic_password: "{{ global_secrets.elastic | default('') }}"
    wazuh_password: "{{ global_secrets.wazuh | default('') }}"
    kibana_system_password: "{{ global_secrets.kibana_system | default('') }}"
    wazuh_api_password: "{{ global_secrets.wazuh_api | default('') }}"

- name: Debug - Display set variables (sensitive information redacted)
  debug:
    msg:
      - "ipvar: {{ ipvar }}"
      - "local_kbn_url: {{ local_kbn_url }}"
      - "local_es_url: {{ local_es_url }}"
      - "elastic_username: {{ elastic_username }}"
      - "stack_version: {{ stack_version }}"
      - "cluster_name: {{ cluster_name }}"
      - "elasticsearch_username: {{ elasticsearch_username }}"
      - "kibana_fleet_username: {{ kibana_fleet_username }}"
      - "indexer_username: {{ indexer_username }}"
      - "api_username: {{ api_username }}"
      - "license: {{ license }}"
      - "es_port: {{ es_port }}"
      - "kibana_port: {{ kibana_port }}"
      - "fleet_port: {{ fleet_port }}"
      - "mem_limit: {{ mem_limit }}"
      - "elastic password is set: {{ elastic_password | length > 0 }}"
      - "wazuh password is set: {{ wazuh_password | length > 0 }}"
      - "kibana_system password is set: {{ kibana_system_password | length > 0 }}"
      - "wazuh_api password is set: {{ wazuh_api_password | length > 0 }}"
  when: debug_mode | bool

# Start Fleet distribution server FIRST in offline mode (before any package queries)
- name: Enable and start Fleet distribution service
  systemd:
    name: lme-fleet-distribution
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  when: offline_mode | default(false)

- name: Wait for Fleet distribution server to be ready
  uri:
    url: "https://{{ ipvar }}:8080/health"
    method: GET
    validate_certs: no
    status_code: [200]
  register: distribution_health
  until: distribution_health.status is defined and distribution_health.status == 200
  retries: 60
  delay: 5
  when: offline_mode | default(false)

- name: Check if Fleet distribution server is ready
  fail:
    msg: "Fleet distribution server failed to start after 5 minutes"
  when:
    - offline_mode | default(false)
    - distribution_health.status is not defined or distribution_health.status != 200

# Wait for Kibana to be fully ready
- name: Wait for Kibana to be fully ready
  uri:
    url: "{{ local_kbn_url }}/api/status"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: kibana_status
  until: >
    kibana_status.status == 200 and 
    kibana_status.json.status.overall.level == "available"
  retries: 60
  delay: 20
  no_log: "{{ not debug_mode }}"

- name: Debug Kibana status
  debug:
    msg: "Kibana status: {{ kibana_status.json.status }}"
  when: debug_mode | bool

# Wait for Elasticsearch to be fully ready
- name: Wait for Elasticsearch to be fully ready
  uri:
    url: "{{ local_es_url }}/_cluster/health"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: es_health
  until: >
    es_health.status == 200 and
    es_health.json.status in ["green", "yellow"]
  retries: 60
  delay: 20
  no_log: "{{ not debug_mode }}"

- name: Debug Elasticsearch health
  debug:
    msg: "Elasticsearch health: {{ es_health.json }}"
  when: debug_mode | bool

# Configure Fleet in Kibana
- name: Wait for Fleet API to be available
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents/setup"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: fleet_api_check
  until: fleet_api_check.status == 200
  retries: 30
  delay: 20
  no_log: "{{ not debug_mode }}"

- name: Debug Fleet API check
  debug:
    msg: "Fleet API check response: {{ fleet_api_check }}"
  when: debug_mode | bool

- name: Enable Fleet in Kibana
  uri:
    url: "{{ local_kbn_url }}/api/fleet/setup"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body: {}
    status_code: [200, 409]
  register: fleet_setup
  until: fleet_setup.status in [200]
  retries: 48
  delay: 120 
  no_log: "{{ not debug_mode }}"

- name: Debug Fleet setup response
  debug:
    msg: "Fleet setup response: {{ fleet_setup }}"
  when: debug_mode | bool

# Ensure Fleet component templates use zero replicas for single-node setup
# Do this after Fleet setup but before indices are created
# Note: logs@settings and logs-settings are managed system templates and cannot be modified
# We use logs@custom which is specifically for user customizations
- name: Update logs@custom component template for zero replicas
  uri:
    url: "{{ local_es_url }}/_component_template/logs@custom"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    validate_certs: no
    force_basic_auth: yes
    body_format: json
    body:
      template:
        settings:
          index:
            number_of_replicas: "{{ elasticsearch_number_of_replicas }}"
    status_code: [200, 201]
  register: logs_custom_update
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Update metrics@custom component template for zero replicas
  uri:
    url: "{{ local_es_url }}/_component_template/metrics@custom"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    validate_certs: no
    force_basic_auth: yes
    body_format: json
    body:
      template:
        settings:
          index:
            number_of_replicas: "{{ elasticsearch_number_of_replicas }}"
    status_code: [200, 201]
  register: metrics_settings_update
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Get CA fingerprint (Nix podman)
  ansible.builtin.shell: |
    set -a
    . {{ playbook_dir }}/../scripts/extract_secrets.sh -q
    set +a
    /nix/var/nix/profiles/default/bin/podman exec -w /usr/share/elasticsearch/config/certs/ca lme-elasticsearch cat ca.crt | openssl x509 -noout -fingerprint -sha256 | cut -d "=" -f 2 | tr -d : | head -n1
  args:
    executable: /bin/bash
  register: ca_fingerprint_nix
  changed_when: false
  become: yes
  no_log: "{{ not debug_mode }}"
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Get CA fingerprint (System podman - RHEL offline)
  ansible.builtin.shell: |
    set -a
    . {{ playbook_dir }}/../scripts/extract_secrets.sh -q
    set +a
    podman exec -w /usr/share/elasticsearch/config/certs/ca lme-elasticsearch cat ca.crt | openssl x509 -noout -fingerprint -sha256 | cut -d "=" -f 2 | tr -d : | head -n1
  args:
    executable: /bin/bash
  register: ca_fingerprint_system
  changed_when: false
  become: yes
  no_log: "{{ not debug_mode }}"
  when: offline_mode | default(false) and ansible_os_family == "RedHat"

- name: Set CA fingerprint fact
  set_fact:
    ca_fingerprint: "{{ ca_fingerprint_nix.stdout if ca_fingerprint_nix is not skipped else ca_fingerprint_system.stdout }}"

- name: Debug CA fingerprint
  debug:
    var: ca_fingerprint
  when: debug_mode | bool

# Item 1 (DEPRECATED / NO-OP in Fleet 8.x): settings.fleet_server_hosts is a
# deprecated field -- this PUT returns 200 but does NOT populate the live
# fleet_server_hosts collection (the live probe found that collection empty despite
# a 200). Kept inert for backwards visibility; the REAL registration is the POST to
# /api/fleet/fleet_server_hosts (task below).
- name: Set Fleet server hosts
  uri:
    url: "{{ local_kbn_url }}/api/fleet/settings"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      fleet_server_hosts: ["https://{{ ipvar }}:{{ fleet_port }}"]
    status_code: [200]
  register: fleet_server_hosts_result
  retries: 3
  delay: 10
  until: fleet_server_hosts_result.status == 200
  no_log: "{{ not debug_mode }}"
  # De-fang the inverted polarity: this is an inert no-op (see comment above), so a
  # non-200 here must NOT abort the install. The fail-hard belongs on the REAL POST
  # (fleet_server_hosts collection), which is gated below on multinode.
  ignore_errors: yes

- name: Debug Fleet server hosts result
  debug:
    msg: "Fleet server hosts successfully set to {{ fleet_server_hosts_result.json.item.fleet_server_hosts }}"
  # Guard the .json.item deref: now the PUT is ignore_errors, a non-200 leaves .item
  # unset. debug_mode-only, but keep it from tracebacking on a failed no-op.
  when: debug_mode | bool and fleet_server_hosts_result.status | default(0) == 200

# Item 1 (LIVE registration): in Fleet 8.x the fleet_server_hosts live in their own
# collection, NOT in settings. This POST is the REAL host registration. It is
# IDEMPOTENT (explicit id -> a re-run returns 409, which is accepted) and NON-FATAL
# (a benign/wrong-schema 4xx must NEVER break the install -- this is the single-node
# safety net). On single-node fleet_advertise_host == ipvar, so the registered URL
# is identical to the legacy PUT above. NOTE: the endpoint path + body field names
# (host_urls, is_default) are the recon's best read of the Kibana 8.18 Fleet API and
# should be confirmed against it; a wrong-schema response is guarded non-fatal below.
- name: Register Fleet server host (live fleet_server_hosts collection)
  uri:
    url: "{{ local_kbn_url }}/api/fleet/fleet_server_hosts"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "lme-fleet-server"
      name: "lme-fleet-server"
      host_urls: ["https://{{ fleet_advertise_host }}:{{ fleet_port }}"]
      is_default: true
    status_code: [200, 409]
  register: fleet_server_host_reg
  until: fleet_server_host_reg.status is defined and fleet_server_host_reg.status in [200, 409]
  retries: 3
  delay: 10
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Debug Fleet server host registration result
  debug:
    msg: "Fleet server host registration status: {{ fleet_server_host_reg.status | default('n/a') }} (advertise_host={{ fleet_advertise_host }})"
  when: debug_mode | bool

# Multinode gate for the REAL registration. On single-node fleet_advertise_host == ipvar
# and the POST above stays a lenient safety net (byte-identical legacy behavior). On
# multinode the advertised host is a distinct tailnet name/IP, so a masked 4xx would ship
# a broken enrollment URL -- fail loudly. Separate, un-no_log'd gate so the operator sees
# the status (the POST itself carries elastic_password and must stay no_log).
- name: Fail if Fleet server host registration did not succeed (multinode)
  fail:
    msg: >-
      Fleet server host registration (POST /api/fleet/fleet_server_hosts) returned status
      {{ fleet_server_host_reg.status | default('undefined') }} for advertised host
      https://{{ fleet_advertise_host }}:{{ fleet_port }}; expected 200 or 409.
  when:
    - fleet_advertise_host != ipvar
    - fleet_server_host_reg.status is not defined or fleet_server_host_reg.status not in [200, 409]

# Proof-3 readback discriminator: read the live fleet_server_hosts collection back and
# confirm lme-fleet-server actually carries the advertised URL. Advisory on single-node
# (advertise == ipvar); a hard discriminator on multinode, where a stale/empty collection
# means enrolling agents would be pointed at the wrong host.
- name: Read back live Fleet server hosts collection
  uri:
    url: "{{ local_kbn_url }}/api/fleet/fleet_server_hosts"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    status_code: [200]
  register: fleet_server_hosts_readback
  # Fold the discriminator into the retry loop: on multinode the collection can lag the
  # POST's saved-object write, so retry until lme-fleet-server actually appears (not just
  # HTTP 200), else an immediate GET could 200-with-empty and hard-fail a good deploy.
  # retries=0 on single-node keeps this a single attempt (byte-identical timing; the
  # assert below is skipped there anyway).
  until: >-
    fleet_server_hosts_readback.status is defined and
    fleet_server_hosts_readback.status == 200 and
    ((fleet_server_hosts_readback.json | default({})).get('items', [])
     | selectattr('id', 'defined')
     | selectattr('id', 'equalto', 'lme-fleet-server') | list | length > 0)
  retries: "{{ 3 if fleet_advertise_host != ipvar else 0 }}"
  delay: 10
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Debug Fleet server hosts readback
  debug:
    var: fleet_server_hosts_readback
  when: debug_mode | bool

- name: Assert advertised Fleet server host is registered (multinode discriminator)
  vars:
    advertised_fleet_url: "https://{{ fleet_advertise_host }}:{{ fleet_port }}"
    # .get('items', []) not ['items'] / .items: Jinja getitem falls back to getattr on a
    # missing key and would bind the dict.items method; .get with a list default fails
    # closed. Schema matches the POST body above (items[].id, items[].host_urls). A
    # missing/mismatched schema yields [] -> the multinode assert fails, the desired
    # polarity. selectattr('id','defined') skips items without an id; map default=[]
    # tolerates a matched item that lacks host_urls.
    registered_fleet_host_urls: >-
      {{ (fleet_server_hosts_readback.json | default({})).get('items', [])
         | selectattr('id', 'defined')
         | selectattr('id', 'equalto', 'lme-fleet-server')
         | map(attribute='host_urls', default=[]) | flatten | list }}
  assert:
    that:
      - registered_fleet_host_urls | length > 0
      - advertised_fleet_url in registered_fleet_host_urls
    fail_msg: >-
      Fleet server host 'lme-fleet-server' is not registered with advertised URL
      {{ advertised_fleet_url }}. Readback host_urls: {{ registered_fleet_host_urls }}.
    success_msg: >-
      Fleet server host 'lme-fleet-server' registered with {{ advertised_fleet_url }}.
  when: fleet_advertise_host != ipvar

- name: Set Fleet default output hosts
  uri:
    url: "{{ local_kbn_url }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      # Item 3: advertise the ES output at fleet_advertise_host (== ipvar on
      # single-node, so byte-identical there; the tailnet name/IP under multinode).
      # This leg runs ssl.verification_mode: certificate (CA-only, no hostname check),
      # so only reachability matters here -- no ES cert SAN is required for it.
      hosts: ["https://{{ fleet_advertise_host }}:9200"]
  register: fleet_output_hosts_result
  until: fleet_output_hosts_result.status == 200
  retries: 12
  delay: 30
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Debug Fleet output hosts result
  debug:
    var: fleet_output_hosts_result
  when: debug_mode | bool

- name: Set Fleet default output CA trusted fingerprint
  uri:
    url: "{{ local_kbn_url }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      ca_trusted_fingerprint: "{{ ca_fingerprint }}"
  register: fleet_output_fingerprint_result
  until: fleet_output_fingerprint_result.status == 200
  retries: 12
  delay: 30
  no_log: "{{ not debug_mode }}"

- name: Set Fleet default output SSL verification mode
  uri:
    url: "{{ local_kbn_url }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      config_yaml: "ssl.verification_mode: certificate"
  register: fleet_output_ssl_result
  no_log: "{{ not debug_mode }}"

# Create Endpoint Policy
- name: Create Endpoint Policy
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agent_policies?sys_monitoring=true"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Endpoint Policy"
      description: ""
      namespace: "default"
      monitoring_enabled: ["logs", "metrics"]
      inactivity_timeout: 1209600
    timeout: 600
    status_code: [200, 409]
  register: endpoint_policy_result
  until: endpoint_policy_result.status in [200, 409]
  retries: 12
  delay: 30
  no_log: "{{ not debug_mode }}"

- name: Debug endpoint_policy_result
  debug:
    var: endpoint_policy_result
  when: debug_mode | bool

- name: Set policy ID fact for new policy
  set_fact:
    policy_id: "{{ endpoint_policy_result.json.item.id }}"
  when: endpoint_policy_result.status == 200

- name: Get existing policy ID if creation failed
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agent_policies"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
  register: existing_policies
  when: endpoint_policy_result.status == 409
  no_log: "{{ not debug_mode }}"

- name: Debug existing_policies
  debug:
    var: existing_policies
  when: debug_mode | bool

- name: Set policy ID fact for existing policy
  set_fact:
    policy_id: "{{ item.id }}"
  when:
    - endpoint_policy_result.status == 409
    - item.name == 'Endpoint Policy'
  loop: "{{ existing_policies.json['items'] | list }}"

- name: Debug policy ID
  debug:
    var: policy_id
  when: debug_mode | bool

- name: Fail if policy ID is not set
  fail:
    msg: "Failed to get policy ID. Neither creation nor lookup of existing policy succeeded."
  when: policy_id is not defined

- name: Get Endpoint package version
  uri:
    url: "{{ local_kbn_url }}/api/fleet/epm/packages/endpoint"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
  register: endpoint_package_result
  no_log: "{{ not debug_mode }}"

- name: Create Elastic Defend package policy
  uri:
    url: "{{ local_kbn_url }}/api/fleet/package_policies"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    timeout: 600
    status_code: [200, 409]
    body:
      name: "Elastic Defend"
      description: ""
      namespace: "default"
      policy_id: "{{ policy_id }}"
      enabled: true
      inputs:
        - enabled: true
          streams: []
          type: "ENDPOINT_INTEGRATION_CONFIG"
          config:
            _config:
              value:
                type: "endpoint"
                endpointConfig:
                  preset: "DataCollection"
      package:
        name: "endpoint"
        title: "Elastic Defend"
        version: "{{ endpoint_package_result.json.item.version }}"
  register: elastic_defend_policy_result
  until: elastic_defend_policy_result.status in [200, 409]
  retries: 12
  delay: 30
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Display results
  debug:
    var: "{{ item }}"
  loop:
    - fleet_server_hosts_result
    - fleet_output_hosts_result
    - fleet_output_fingerprint_result
    - fleet_output_ssl_result
    - endpoint_policy_result
    - elastic_defend_policy_result
  when: debug_mode | bool

- name: Set FLEET_ENROLL=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_ENROLL="
    line: "FLEET_ENROLL=1"
    insertafter: EOF
    state: present
  become: yes

- name: Set FLEET_SERVER_ENABLE=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_SERVER_ENABLE="
    line: "FLEET_SERVER_ENABLE=1"
    insertafter: EOF
    state: present
  become: yes

- name: Set KIBANA_FLEET_SETUP=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^KIBANA_FLEET_SETUP="
    line: "KIBANA_FLEET_SETUP=1"
    insertafter: EOF
    state: present
  become: yes

- name: Create FLEET_SETUP_FINISHED file
  file:
    path: "/opt/lme/FLEET_SETUP_FINISHED"
    state: touch
    owner: "root"
    group: "root"
    mode: '0644'
  become: yes

# Setup Fleet Server
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: Start fleet-server service
  systemd:
    name: lme-fleet-server.service
    state: started
    enabled: yes
  become: yes

- name: Wait for fleet-server to be ready
  wait_for:
    port: 8220
    timeout: 300
  become: yes

- name: Wait for Fleet to be fully initialized
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents/setup"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: fleet_status
  until: fleet_status.status == 200
  retries: 36
  delay: 30

- name: Debug Fleet status
  debug:
    var: fleet_status
  when: debug_mode | bool

- name: Check Fleet agents endpoint contents
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents?page=1&perPage=20&kuery=status%3Aonline%20or%20(status%3Aerror%20or%20status%3Adegraded)%20or%20(status%3Aupdating%20or%20status%3Aunenrolling%20or%20status%3Aenrolling)%20or%20status%3Aoffline&showInactive=false&showUpgradeable=false&getStatusSummary=true&withMetrics=true"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
      elastic-api-version: "2023-10-31"
      x-elastic-internal-origin: "Kibana"
    status_code: 200
  register: fleet_agents_result
  until: fleet_agents_result.status == 200 and fleet_agents_result.json.total > 0 and fleet_agents_result.json.statusSummary.online > 0
  retries: 60
  delay: 20
  no_log: "{{ not debug_mode }}"

- name: Debug Fleet agents result
  debug:
    var: fleet_agents_result
  when: debug_mode | bool

- name: Verify Fleet agents response structure
  assert:
    that:
      - fleet_agents_result.json is defined
      - fleet_agents_result.json.items is defined
      - fleet_agents_result.json.total is defined
    fail_msg: "Fleet agents endpoint did not return the expected response structure"
  register: fleet_agents_verification

- name: Display Fleet agents summary
  debug:
    msg: "Fleet agents endpoint returned {{ fleet_agents_result.json.total }} total agents"
  when: fleet_agents_verification is success

- name: Fail if Fleet is not ready
  fail:
    msg: "Fleet did not become ready within the expected time. Status: {{ fleet_status | default('unknown') }}"
  when: fleet_status.status is not defined or fleet_status.status != 200

- name: Set FLEET_ENROLL=0 to prevent re-enrollment on restart  
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_ENROLL="
    line: "FLEET_ENROLL=0"
    insertafter: EOF
    state: present
  become: yes

- name: Set FLEET_SERVER_ENABLE=0 to prevent re-bootstrap on restart
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_SERVER_ENABLE="
    line: "FLEET_SERVER_ENABLE=0"
    insertafter: EOF
    state: present
  become: yes

- name: Set KIBANA_FLEET_SETUP=0 to prevent re-setup on restart
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^KIBANA_FLEET_SETUP="
    line: "KIBANA_FLEET_SETUP=0"
    insertafter: EOF
    state: present
  become: yes

# Wait for metrics indices to be created (reduced timeout for single-node setup)
- name: Wait for metrics indices to be created
  uri:
    url: "{{ local_es_url }}/_cat/indices/metrics-elastic_agent.*,logs-elastic_agent*?h=index&format=json"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: [200, 404]
  register: metrics_indices_result
  until: >
    metrics_indices_result.status == 200 and 
    metrics_indices_result.json | length > 0 and
    metrics_indices_result.json | map(attribute='index') | select('match', '.*metrics-elastic_agent.*') | list | length > 0 and
    metrics_indices_result.json | map(attribute='index') | select('match', '.*logs-elastic_agent.*') | list | length > 0
  retries: 30
  delay: 20
  no_log: "{{ not debug_mode }}"
  ignore_errors: yes

- name: Debug metrics indices result
  debug:
    msg: 
      - "Total indices found: {{ metrics_indices_result.json | length }}"
      - "All indices found: {{ metrics_indices_result.json | map(attribute='index') | list }}"
      - "Metrics-elastic_agent indices: {{ metrics_indices_result.json | map(attribute='index') | select('match', '.*metrics-elastic_agent.*') | list }}"
      - "Logs-elastic_agent indices: {{ metrics_indices_result.json | map(attribute='index') | select('match', '.*logs-elastic_agent.*') | list }}"
  when: debug_mode | bool and metrics_indices_result.status == 200


- name: Debug - Display secret variables
  debug:
    msg:
      - "elastic={{ elastic_password }}"
      - "wazuh={{ wazuh_password }}"
      - "kibana_system={{ kibana_system_password }}"
      - "wazuh_api={{ wazuh_api_password }}"
  when: debug_mode | bool
  no_log: "{{ not debug_mode }}"

