---
# Fleet setup tasks

# Set playbook variables
- name: Set playbook variables
  ansible.builtin.set_fact:
    ipvar: "{{ env_dict.IPVAR | default('') }}"
    # Backward-compatibility input only.  Enrollment and output resolve to separate
    # hosts below; an existing caller that supplies only fleet_advertise_host keeps
    # the historical same-host behavior.
    fleet_advertise_host: "{{ fleet_advertise_host | default(env_dict.IPVAR | default('')) }}"
    local_kbn_url: "{{ env_dict.LOCAL_KBN_URL | default('') }}"
    local_es_url: "{{ env_dict.LOCAL_ES_URL | default('') }}"
    stack_version: "{{ env_dict.STACK_VERSION | default('') }}"
    cluster_name: "{{ env_dict.CLUSTER_NAME | default('') }}"
    elastic_username: "{{ env_dict.ELASTIC_USERNAME | default('') }}"
    elasticsearch_username: "{{ env_dict.ELASTICSEARCH_USERNAME | default('') }}"
    kibana_fleet_username: "{{ env_dict.KIBANA_FLEET_USERNAME | default('') }}"
    indexer_username: "{{ env_dict.INDEXER_USERNAME | default('') }}"
    api_username: "{{ env_dict.API_USERNAME | default('') }}"
    license: "{{ env_dict.LICENSE | default('') }}"
    es_port: "{{ env_dict.ES_PORT | default('') }}"
    kibana_port: "{{ env_dict.KIBANA_PORT | default('') }}"
    fleet_port: "{{ env_dict.FLEET_PORT | default('') }}"
    mem_limit: "{{ env_dict.MEM_LIMIT | default('') }}"
    elastic_password: "{{ global_secrets.elastic | default('') }}"
    wazuh_password: "{{ global_secrets.wazuh | default('') }}"
    kibana_system_password: "{{ global_secrets.kibana_system | default('') }}"
    wazuh_api_password: "{{ global_secrets.wazuh_api | default('') }}"
  no_log: true
  diff: false

- name: Resolve separate Fleet enrollment and output hosts
  ansible.builtin.set_fact:
    fleet_enrollment_host: "{{ fleet_enrollment_host | default(fleet_advertise_host | default(ipvar)) }}"
    # D1 collection fix (root cause "LME collects nothing"): a SINGLE-HOST deploy's only
    # shipping agent is the fleet-server's own elastic-agent, which lives on the podman `lme`
    # network. Elasticsearch publishes 9200 on 127.0.0.1 ONLY (manifests/services/
    # lme-elasticsearch.yml) unless a profile opens it, so the historical default output host
    # (advertise_host -> ipvar = host LAN IP) was UNREACHABLE and the agent could never ship;
    # the mandatory metrics data-flow gate below (metrics/logs-elastic_agent.*) then times out.
    # The in-network alias `lme-elasticsearch` IS reachable and is a valid SAN on the ES leaf
    # certificate, so it satisfies ssl.verification_mode:full for a same-host agent. Only the
    # MULTINODE profile has remote agents that need an externally reachable output, and that
    # profile opens ES on fleet_output_bind_address; there the external advertise/ipvar host is
    # preserved EXACTLY as before. A legacy caller that EXPLICITLY set fleet_advertise_host to a
    # real (reachable) host also keeps historical same-host behavior (advertise != ipvar), and an
    # explicit operator-supplied fleet_output_host always wins. The alias is used ONLY for the
    # bare single-host default where advertise fell back to the loopback-unreachable ipvar.
    fleet_output_host: >-
      {{ fleet_output_host
         | default(
             (fleet_advertise_host | default(ipvar))
             if (
                  ((lme_profile | default('default')) == 'multinode')
                  or ((fleet_advertise_host | default(ipvar)) != ipvar)
                )
             else 'lme-elasticsearch'
           ) }}

# E-FLEET-REACHABILITY / E-EXISTING-WEAK-GATES (Codex ...-audits-0315): the data-flow gate at
# the end of this role must prove FRESH documents (indexed since this run began), not merely that
# an index name exists -- otherwise a re-run against an already-deployed host passes on stale docs
# even if the repointed output never ships. Capture run start from the index host clock (not the
# controller) to compare against @timestamp without skew.
- name: Capture collection run-start timestamp (target-host clock)
  ansible.builtin.command: date -u +%Y-%m-%dT%H:%M:%S.000Z
  register: _fleet_run_start_raw
  changed_when: false

- name: Set collection run-start fact
  ansible.builtin.set_fact:
    fleet_run_start: "{{ _fleet_run_start_raw.stdout | trim }}"

- name: Resolve separate Fleet enrollment and output URLs
  ansible.builtin.set_fact:
    fleet_enrollment_url: "{{ fleet_enrollment_url | default('https://' ~ fleet_enrollment_host ~ ':' ~ fleet_port) }}"
    fleet_output_url: "{{ fleet_output_url | default('https://' ~ fleet_output_host ~ ':9200') }}"

- name: Assert Fleet endpoint contracts are valid HTTPS authorities
  ansible.builtin.assert:
    that:
      - fleet_enrollment_host | length > 0
      - fleet_output_host | length > 0
      - (fleet_enrollment_url | urlsplit('scheme')) == 'https'
      - (fleet_output_url | urlsplit('scheme')) == 'https'
      - (fleet_enrollment_url | urlsplit('hostname')) == fleet_enrollment_host
      - (fleet_output_url | urlsplit('hostname')) == fleet_output_host
      - (fleet_enrollment_url | urlsplit('port') | int) == (fleet_port | int)
      - (fleet_output_url | urlsplit('port') | int) == 9200
      - (fleet_enrollment_url | urlsplit('path')) in ['', '/']
      - (fleet_output_url | urlsplit('path')) in ['', '/']
      - (fleet_enrollment_url | urlsplit('query')) | length == 0
      - (fleet_output_url | urlsplit('query')) | length == 0
    fail_msg: >-
      Fleet endpoint resolution is invalid. Enrollment and output must be separate,
      absolute HTTPS authority URLs with no query/path payload: enrollment={{ fleet_enrollment_url }},
      output={{ fleet_output_url }}.
    quiet: true

- name: Assert admitted lab multinode endpoints never use wildcard binds
  ansible.builtin.assert:
    that:
      - fleet_enrollment_bind_address | default('') | length > 0
      - fleet_enrollment_bind_address not in ['0.0.0.0', '::']
      - >-
        (tailscale_serve_services | default(false) | bool)
        or (fleet_output_bind_address | default('') | length > 0
            and fleet_output_bind_address not in ['0.0.0.0', '::'])
    fail_msg: >-
      Admitted lab multinode Fleet routes require explicit tailnet bind addresses.
      Enrollment may not use a wildcard, and direct output mode may not publish
      Elasticsearch on 0.0.0.0/::.
    quiet: true
  when:
    - lme_lab_mode | default(false) | bool
    - lme_profile | default('default') == 'multinode'

# D1 STATIC TOPOLOGY VALIDATION (E-FLEET-REACHABILITY, Codex ...-audits-0315): this catches the
# genuine D1 misconfiguration (output points at the raw loopback-unreachable host LAN IP), but it
# is a STATIC check of the resolved topology -- a different hostname / multinode selection / Serve
# boolean satisfies it WITHOUT proving a usable route or valid TLS. It therefore no longer claims
# reachability. Real reachability + payload is proven downstream by the fresh, fleet-server-agent-
# filtered data-flow gate ("Gate on FRESH elastic_agent ... documents") near the end of this role,
# which requires documents actually indexed since this run began. (An earlier in-namespace probe --
# podman exec into lme-fleet-server -- is deferred: the elastic-agent image has no confirmed curl
# healthcheck and its TLS tooling is unverified without a deploy; see the E milestone.)
- name: Validate the resolved Fleet default output topology (static configuration only)
  ansible.builtin.assert:
    that:
      # Fail ONLY the genuine D1 trap: the output points at the raw host LAN IP (ipvar) while
      # ES 9200 is loopback-bound and no profile opened it. The alias, an explicit operator
      # hostname (advertise/output), multinode, tailnet Serve, and an opened non-loopback bind
      # all pass -- we do not second-guess an operator's explicit topology. This is CONFIGURATION
      # validation, NOT proof that a route exists.
      - >-
        (fleet_output_url | urlsplit('hostname')) != ipvar
        or ((lme_profile | default('default')) == 'multinode')
        or (tailscale_serve_services | default(false) | bool)
        or (fleet_output_bind_address | default('') | length > 0
            and fleet_output_bind_address not in ['127.0.0.1', '::1'])
    fail_msg: >-
      Fleet default output {{ fleet_output_url }} is statically misconfigured: it points at the
      raw host LAN IP while Elasticsearch 9200 binds loopback-only unless a profile opens it, so
      nothing could ship here. Use the in-network alias https://lme-elasticsearch:9200 for a
      single-host deploy (now the default), or set fleet_output_bind_address (multinode) / enable
      tailnet Serve so remote agents can reach Elasticsearch.
    success_msg: >-
      Fleet default output {{ fleet_output_url }} is a valid topology; a usable route + TLS are
      NOT asserted here -- they are proven by the fresh data-flow gate at the end of this role.
    quiet: true

- name: Debug - Display set variables (sensitive information redacted)
  debug:
    msg:
      - "ipvar: {{ ipvar }}"
      - "local_kbn_url: {{ local_kbn_url }}"
      - "local_es_url: {{ local_es_url }}"
      - "elastic_username: {{ elastic_username }}"
      - "stack_version: {{ stack_version }}"
      - "cluster_name: {{ cluster_name }}"
      - "elasticsearch_username: {{ elasticsearch_username }}"
      - "kibana_fleet_username: {{ kibana_fleet_username }}"
      - "indexer_username: {{ indexer_username }}"
      - "api_username: {{ api_username }}"
      - "license: {{ license }}"
      - "es_port: {{ es_port }}"
      - "kibana_port: {{ kibana_port }}"
      - "fleet_port: {{ fleet_port }}"
      - "mem_limit: {{ mem_limit }}"
      - "elastic password is set: {{ elastic_password | length > 0 }}"
      - "wazuh password is set: {{ wazuh_password | length > 0 }}"
      - "kibana_system password is set: {{ kibana_system_password | length > 0 }}"
      - "wazuh_api password is set: {{ wazuh_api_password | length > 0 }}"
  when: debug_mode | bool

# Start Fleet distribution server FIRST in offline mode (before any package queries)
- name: Enable and start Fleet distribution service
  systemd:
    name: lme-fleet-distribution
    enabled: yes
    state: started
    daemon_reload: yes
  become: yes
  when: offline_mode | default(false)

- name: Wait for Fleet distribution server to be ready
  uri:
    # Probe the LOOPBACK bind, not {{ ipvar }} (host LAN IP). The fleet-distribution
    # container publishes 8080 bound to 127.0.0.1 (manifests/services/lme-fleet-distribution.yml:
    # default-closed since 06f09b7), and its OWN container healthcheck already targets
    # https://localhost:8080/health. This task ONLY runs offline (when: offline_mode below)
    # and offline.yml does not re-open the port, so nothing ever listens on {{ ipvar }}:8080
    # -> the old probe was a guaranteed Errno 111 on every airgapped install.
    url: "https://127.0.0.1:8080/health"
    method: GET
    validate_certs: no
    status_code: [200]
  register: distribution_health
  until: distribution_health.status is defined and distribution_health.status == 200
  retries: 60
  delay: 5
  when: offline_mode | default(false)

- name: Check if Fleet distribution server is ready
  fail:
    msg: "Fleet distribution server failed to start after 5 minutes"
  when:
    - offline_mode | default(false)
    - distribution_health.status is not defined or distribution_health.status != 200

# Wait for Kibana to be fully ready
- name: Wait for Kibana to be fully ready
  uri:
    url: "{{ local_kbn_url }}/api/status"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: kibana_status
  until: >
    kibana_status.status == 200 and 
    kibana_status.json.status.overall.level == "available"
  retries: 60
  delay: 20
  no_log: true

- name: Debug Kibana status
  debug:
    msg: "Kibana status: {{ kibana_status.json.status }}"
  when: debug_mode | bool

# Wait for Elasticsearch to be fully ready
- name: Wait for Elasticsearch to be fully ready
  uri:
    url: "{{ local_es_url }}/_cluster/health"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: es_health
  until: >
    es_health.status == 200 and
    es_health.json.status in ["green", "yellow"]
  retries: 60
  delay: 20
  no_log: true

- name: Debug Elasticsearch health
  debug:
    msg: "Elasticsearch health: {{ es_health.json }}"
  when: debug_mode | bool

# Configure Fleet in Kibana
- name: Wait for Fleet API to be available
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents/setup"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: fleet_api_check
  until: fleet_api_check.status == 200
  retries: 30
  delay: 20
  no_log: true

- name: Debug Fleet API check
  debug:
    msg: "Fleet API check response: {{ fleet_api_check }}"
  when: debug_mode | bool

- name: Enable Fleet in Kibana
  uri:
    url: "{{ local_kbn_url }}/api/fleet/setup"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body: {}
    status_code: [200, 409]
  register: fleet_setup
  until: fleet_setup.status in [200]
  retries: 48
  delay: 120 
  no_log: true

- name: Debug Fleet setup response
  debug:
    msg: "Fleet setup response: {{ fleet_setup }}"
  when: debug_mode | bool

# Ensure Fleet component templates use zero replicas for single-node setup
# Do this after Fleet setup but before indices are created
# Note: logs@settings and logs-settings are managed system templates and cannot be modified
# We use logs@custom which is specifically for user customizations
- name: Update logs@custom component template for zero replicas
  uri:
    url: "{{ local_es_url }}/_component_template/logs@custom"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    validate_certs: no
    force_basic_auth: yes
    body_format: json
    body:
      template:
        settings:
          index:
            number_of_replicas: "{{ elasticsearch_number_of_replicas }}"
    status_code: [200, 201]
  register: logs_custom_update
  no_log: true
  ignore_errors: yes

- name: Update metrics@custom component template for zero replicas
  uri:
    url: "{{ local_es_url }}/_component_template/metrics@custom"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    validate_certs: no
    force_basic_auth: yes
    body_format: json
    body:
      template:
        settings:
          index:
            number_of_replicas: "{{ elasticsearch_number_of_replicas }}"
    status_code: [200, 201]
  register: metrics_settings_update
  no_log: true
  ignore_errors: yes

- name: Get CA fingerprint (Nix podman)
  ansible.builtin.shell: |
    set -a
    . {{ playbook_dir }}/../scripts/extract_secrets.sh -q
    set +a
    /nix/var/nix/profiles/default/bin/podman exec -w /usr/share/elasticsearch/config/certs/ca lme-elasticsearch cat ca.crt | openssl x509 -noout -fingerprint -sha256 | cut -d "=" -f 2 | tr -d : | head -n1
  args:
    executable: /bin/bash
  register: ca_fingerprint_nix
  changed_when: false
  become: yes
  no_log: true
  when: not (offline_mode | default(false) and ansible_os_family == "RedHat")

- name: Get CA fingerprint (System podman - RHEL offline)
  ansible.builtin.shell: |
    set -a
    . {{ playbook_dir }}/../scripts/extract_secrets.sh -q
    set +a
    podman exec -w /usr/share/elasticsearch/config/certs/ca lme-elasticsearch cat ca.crt | openssl x509 -noout -fingerprint -sha256 | cut -d "=" -f 2 | tr -d : | head -n1
  args:
    executable: /bin/bash
  register: ca_fingerprint_system
  changed_when: false
  become: yes
  no_log: true
  when: offline_mode | default(false) and ansible_os_family == "RedHat"

- name: Set CA fingerprint fact
  set_fact:
    ca_fingerprint: "{{ ca_fingerprint_nix.stdout if ca_fingerprint_nix is not skipped else ca_fingerprint_system.stdout }}"

- name: Debug CA fingerprint
  debug:
    var: ca_fingerprint
  when: debug_mode | bool

# Item 1 (DEPRECATED / NO-OP in Fleet 8.x): settings.fleet_server_hosts is a
# deprecated field -- this PUT returns 200 but does NOT populate the live
# fleet_server_hosts collection (the live probe found that collection empty despite
# a 200). Kept inert for backwards visibility; the REAL registration is the POST to
# /api/fleet/fleet_server_hosts (task below).
- name: Set Fleet server hosts
  uri:
    url: "{{ local_kbn_url }}/api/fleet/settings"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      fleet_server_hosts: ["{{ fleet_enrollment_url }}"]
    status_code: [200]
  register: fleet_server_hosts_result
  retries: 3
  delay: 10
  until: fleet_server_hosts_result.status == 200
  no_log: true
  # De-fang the inverted polarity: this is an inert no-op (see comment above), so a
  # non-200 here must NOT abort the install. The fail-hard belongs on the REAL POST
  # (fleet_server_hosts collection), which is gated below on multinode.
  ignore_errors: yes

- name: Debug Fleet server hosts result
  debug:
    msg: "Fleet server hosts successfully set to {{ fleet_server_hosts_result.json.item.fleet_server_hosts }}"
  # Guard the .json.item deref: now the PUT is ignore_errors, a non-200 leaves .item
  # unset. debug_mode-only, but keep it from tracebacking on a failed no-op.
  when: debug_mode | bool and fleet_server_hosts_result.status | default(0) == 200

# Item 1 (LIVE registration): in Fleet 8.x the fleet_server_hosts live in their own
# collection, NOT in settings. This POST is the REAL host registration. It is
# idempotent (explicit id -> a re-run returns 409, which is accepted), but the
# exact persisted object is mandatory below. The enrollment URL is resolved
# independently from the Elasticsearch output URL and defaults through the
# legacy fleet_advertise_host for compatibility.
- name: Register Fleet server host (live fleet_server_hosts collection)
  uri:
    url: "{{ local_kbn_url }}/api/fleet/fleet_server_hosts"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "lme-fleet-server"
      name: "lme-fleet-server"
      host_urls: ["{{ fleet_enrollment_url }}"]
      is_default: true
    status_code: [200, 409]
  register: fleet_server_host_reg
  until: fleet_server_host_reg.status is defined and fleet_server_host_reg.status in [200, 409]
  retries: 3
  delay: 10
  no_log: true

- name: Debug Fleet server host registration result
  debug:
    msg: "Fleet server host registration status: {{ fleet_server_host_reg.status | default('n/a') }} (enrollment_url={{ fleet_enrollment_url }})"
  when: debug_mode | bool

# The registration is a required persisted endpoint contract in every profile.
- name: Fail if Fleet server host registration did not succeed
  fail:
    msg: >-
      Fleet server host registration (POST /api/fleet/fleet_server_hosts) returned status
      {{ fleet_server_host_reg.status | default('undefined') }} for advertised host
      {{ fleet_enrollment_url }}; expected 200 or 409.
  when:
    - fleet_server_host_reg.status is not defined or fleet_server_host_reg.status not in [200, 409]

# Proof-3 readback discriminator: read the live fleet_server_hosts collection back and
# confirm lme-fleet-server actually carries the advertised URL. Advisory on single-node
# (advertise == ipvar); a hard discriminator on multinode, where a stale/empty collection
# means enrolling agents would be pointed at the wrong host.
- name: Read back live Fleet server hosts collection
  uri:
    url: "{{ local_kbn_url }}/api/fleet/fleet_server_hosts"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    status_code: [200]
  register: fleet_server_hosts_readback
  # Fold the exact URL discriminator into the retry loop: the saved-object write can
  # lag the POST and a 409 can represent a stale object, which is not success.
  until: >-
    fleet_server_hosts_readback.status is defined and
    fleet_server_hosts_readback.status == 200 and
    (((fleet_server_hosts_readback.json | default({})).get('items', [])
      | selectattr('id', 'defined')
      | selectattr('id', 'equalto', 'lme-fleet-server')
      | list | length) == 1) and
    ((((fleet_server_hosts_readback.json | default({})).get('items', [])
      | selectattr('id', 'defined')
      | selectattr('id', 'equalto', 'lme-fleet-server')
      | first | default({})).get('host_urls', [])) == [fleet_enrollment_url])
  retries: 3
  delay: 10
  no_log: true

- name: Debug Fleet server hosts readback
  debug:
    var: fleet_server_hosts_readback
  when: debug_mode | bool

- name: Assert persisted Fleet enrollment endpoint contract
  vars:
    # .get('items', []) not ['items'] / .items: Jinja getitem falls back to getattr on a
    # missing key and would bind the dict.items method; .get with a list default fails
    # closed. Schema matches the POST body above (items[].id, items[].host_urls). A
    # missing/mismatched schema yields [] and fails closed. Exactly one object
    # with exactly one configured URL is required; stale or duplicate objects fail.
    registered_fleet_host_objects: >-
      {{ (fleet_server_hosts_readback.json | default({})).get('items', [])
         | selectattr('id', 'defined')
         | selectattr('id', 'equalto', 'lme-fleet-server')
         | list }}
    registered_fleet_host_urls: >-
      {{ (registered_fleet_host_objects | first | default({})).get('host_urls', []) }}
  assert:
    that:
      - registered_fleet_host_objects | length == 1
      - registered_fleet_host_urls == [fleet_enrollment_url]
    fail_msg: >-
      Fleet server host 'lme-fleet-server' is not registered with advertised URL
      {{ fleet_enrollment_url }}. Readback host_urls: {{ registered_fleet_host_urls }}.
    success_msg: >-
      Fleet server host 'lme-fleet-server' registered with {{ fleet_enrollment_url }}.

- name: Set Fleet default output endpoint contract
  ansible.builtin.uri:
    url: "{{ local_kbn_url }}/api/fleet/outputs/fleet-default-output"
    method: PUT
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      hosts: ["{{ fleet_output_url }}"]
      ca_trusted_fingerprint: "{{ ca_fingerprint }}"
      config_yaml: |
        ssl.verification_mode: full
    status_code: [200]
  register: fleet_output_contract_result
  until: fleet_output_contract_result.status == 200
  retries: 12
  delay: 30
  no_log: true

- name: Debug Fleet output endpoint contract result
  debug:
    var: fleet_output_contract_result
  when: debug_mode | bool

- name: Read back Fleet default output endpoint contract
  ansible.builtin.uri:
    url: "{{ local_kbn_url }}/api/fleet/outputs/fleet-default-output"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    status_code: [200]
  register: fleet_output_readback
  until: >-
    fleet_output_readback.status == 200 and
    (fleet_output_readback.json | default({})).get('item', {}).get('hosts', []) == [fleet_output_url] and
    (fleet_output_readback.json | default({})).get('item', {}).get('ca_trusted_fingerprint', '') == ca_fingerprint and
    ((fleet_output_readback.json | default({})).get('item', {}).get('config_yaml', '') | trim)
      == 'ssl.verification_mode: full'
  retries: 12
  delay: 30
  no_log: true

- name: Assert persisted Fleet output endpoint contract
  ansible.builtin.assert:
    that:
      - fleet_output_readback.status | default(0) == 200
      - (fleet_output_readback.json | default({})).get('item', {}).get('hosts', []) == [fleet_output_url]
      - (fleet_output_readback.json | default({})).get('item', {}).get('ca_trusted_fingerprint', '') == ca_fingerprint
      - "((fleet_output_readback.json | default({})).get('item', {}).get('config_yaml', '') | trim) == 'ssl.verification_mode: full'"
    fail_msg: >-
      Fleet default output did not persist the exact authenticated endpoint contract
      (URL, CA fingerprint, and hostname-verifying TLS mode): expected {{ fleet_output_url }}.
    quiet: true

# Create Endpoint Policy
- name: Create Endpoint Policy
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agent_policies?sys_monitoring=true"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Endpoint Policy"
      id: "{{ fleet_endpoint_policy_id | default(omit) }}"
      description: ""
      namespace: "default"
      monitoring_enabled: ["logs", "metrics"]
      inactivity_timeout: 1209600
    timeout: 600
    status_code: [200, 409]
  register: endpoint_policy_result
  until: endpoint_policy_result.status in [200, 409]
  retries: 12
  delay: 30
  no_log: true

- name: Debug endpoint_policy_result
  debug:
    var: endpoint_policy_result
  when: debug_mode | bool

- name: Read Fleet agent policies for exact configured selection
  ansible.builtin.uri:
    url: "{{ local_kbn_url }}/api/fleet/agent_policies"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
  register: existing_policies
  no_log: true

- name: Debug existing_policies
  debug:
    var: existing_policies
  when: debug_mode | bool

- name: Select only the configured Fleet endpoint policy
  ansible.builtin.set_fact:
    policy_id: >-
      {{ fleet_endpoint_policy_id
         if (fleet_endpoint_policy_id | default('') | length > 0)
         else ((existing_policies.json | default({})).get('items', [])
               | selectattr('name', 'defined')
               | selectattr('name', 'equalto', 'Endpoint Policy')
               | map(attribute='id') | unique | list | first | default('')) }}

- name: Assert configured Fleet endpoint policy exists uniquely
  vars:
    configured_policy_matches: >-
      {{ (existing_policies.json | default({})).get('items', [])
         | selectattr('id', 'defined')
         | selectattr('id', 'equalto', policy_id)
         | list }}
  ansible.builtin.assert:
    that:
      - policy_id | default('') | length > 0
      - configured_policy_matches | length == 1
    fail_msg: >-
      The configured Fleet endpoint policy '{{ policy_id | default('missing') }}'
      was not found exactly once. Refusing to select an arbitrary active or
      first-returned policy.
    quiet: true

- name: Debug policy ID
  debug:
    var: policy_id
  when: debug_mode | bool

- name: Fail if policy ID is not set
  fail:
    msg: "Failed to get policy ID. Neither creation nor lookup of existing policy succeeded."
  when: policy_id is not defined

- name: Get Endpoint package version
  uri:
    url: "{{ local_kbn_url }}/api/fleet/epm/packages/endpoint"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    # Tolerate 404 so an offline mirror that does not bundle the endpoint package does not
    # hard-fail the whole install here; availability is evaluated explicitly below.
    status_code: [200, 404]
  register: endpoint_package_result
  no_log: true

- name: Determine whether the Elastic Defend (endpoint) package is available
  ansible.builtin.set_fact:
    endpoint_package_available: >-
      {{ (endpoint_package_result.status | default(0)) == 200
         and ((endpoint_package_result.json | default({})).get('item', {}).get('version', '') | length > 0) }}

# E-REQUIRED-SECURITY (Codex codex-...-audits-0315): a package 404 must NOT silently skip a
# REQUIRED security collection. Pre-E1 (a3352b2:618) this task required HTTP 200 with no
# status_code override and no ignore_errors, and the banked airgapped install (failed=0) proves
# the endpoint package IS bundled in the offline mirror -- so a missing package is a real defect,
# not a normal offline condition. `required = not offline_mode` would be the same implicit
# derivation Codex rejected in E-FLEET-ENDPOINT. Endpoint security is therefore REQUIRED by
# default and may be waived ONLY by an explicit declared opt-out. (Per-profile declaration of
# fleet_endpoint_security_optional is a C1 contract request; the enrollment half -- an agent
# actually enrolled on the Endpoint Policy -- is deferred to the profile required-component
# declaration, since a default deploy enrols no such agent (CRUX-B) and enforcing it here would
# fail every default install.)
- name: Assert required endpoint-security collection is available (fail-closed)
  ansible.builtin.assert:
    that:
      - (endpoint_package_available | bool) or (fleet_endpoint_security_optional | default(false) | bool)
    fail_msg: >-
      The Elastic Defend (endpoint) package is REQUIRED for this deploy but is not available from
      the package registry (last status {{ endpoint_package_result.status | default('none') }}), so
      endpoint-security telemetry cannot be collected. This was previously (pre-E1) a fail-closed
      HTTP-200 requirement and the banked airgapped install shows the package is present in the
      offline mirror, so its absence is a real defect. Only an EXPLICIT declared opt-out
      (fleet_endpoint_security_optional=true, set per selected profile) may waive it -- do NOT
      infer "optional" from offline_mode.
    success_msg: >-
      {{ 'Endpoint-security collection is available; the Elastic Defend integration will be created.'
         if (endpoint_package_available | bool)
         else 'Endpoint-security collection is EXPLICITLY declared optional '
              ~ '(fleet_endpoint_security_optional=true) and is absent with a recorded reason.' }}
    quiet: true

- name: Report Elastic Defend (endpoint) package availability
  ansible.builtin.debug:
    msg: >-
      {{ ('Elastic Defend (endpoint) package available -- version '
          ~ ((endpoint_package_result.json | default({})).get('item', {}).get('version', ''))
          ~ '; the Elastic Defend integration will be created.')
         if (endpoint_package_available | bool)
         else ('Elastic Defend (endpoint) package is NOT available from the package registry; '
               ~ 'endpoint-security was EXPLICITLY declared optional for this profile '
               ~ '(fleet_endpoint_security_optional=true), so the Elastic Defend integration is '
               ~ 'SKIPPED with this recorded reason.') }}

- name: Create Elastic Defend package policy
  uri:
    url: "{{ local_kbn_url }}/api/fleet/package_policies"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
    body_format: json
    timeout: 600
    status_code: [200, 409]
    body:
      name: "Elastic Defend"
      description: ""
      namespace: "default"
      policy_id: "{{ policy_id }}"
      enabled: true
      inputs:
        - enabled: true
          streams: []
          type: "ENDPOINT_INTEGRATION_CONFIG"
          config:
            _config:
              value:
                type: "endpoint"
                endpointConfig:
                  preset: "DataCollection"
      package:
        name: "endpoint"
        title: "Elastic Defend"
        version: "{{ endpoint_package_result.json.item.version }}"
  register: elastic_defend_policy_result
  until: elastic_defend_policy_result.status in [200, 409]
  retries: 12
  delay: 30
  no_log: true
  # Only attempt when the package is actually available (handles offline mirrors that do not
  # bundle it). The former blanket `ignore_errors: yes` silently swallowed EVERY failure --
  # including a real, present-package failure -- so a broken endpoint integration looked green.
  # It is now fail-closed (asserted below) when the package is available.
  when: endpoint_package_available | bool

- name: Assert Elastic Defend integration was created when its package is available
  ansible.builtin.assert:
    that:
      - (elastic_defend_policy_result.status | default(0)) in [200, 409]
    fail_msg: >-
      The Elastic Defend (endpoint) package is available but its package policy could not be
      created on policy '{{ policy_id }}' (last status
      {{ elastic_defend_policy_result.status | default('none') }}). This condition was
      previously swallowed by ignore_errors, hiding absent endpoint-security collection.
      Investigate the Fleet /api/fleet/package_policies response.
    quiet: true
  when: endpoint_package_available | bool

- name: Display results
  debug:
    var: "{{ item }}"
  loop:
    - fleet_server_hosts_result
    - fleet_output_contract_result
    - fleet_output_readback
    - endpoint_policy_result
    - elastic_defend_policy_result
  when: debug_mode | bool

- name: Assert Wave 0 completed before lab Fleet enrollment
  ansible.builtin.assert:
    that:
      - lme_wave0_complete | default(false) | bool
    fail_msg: >-
      Lab Fleet enrollment is blocked until the root Wave 0 remediation barrier
      is explicitly complete. Endpoint configuration may be rendered and reviewed,
      but no credential-bearing enrollment may start yet.
    quiet: true
  when: lme_lab_mode | default(false) | bool

- name: Set FLEET_ENROLL=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_ENROLL="
    line: "FLEET_ENROLL=1"
    insertafter: EOF
    state: present
  become: yes

- name: Set FLEET_SERVER_ENABLE=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_SERVER_ENABLE="
    line: "FLEET_SERVER_ENABLE=1"
    insertafter: EOF
    state: present
  become: yes

- name: Set KIBANA_FLEET_SETUP=1 for initial enrollment
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^KIBANA_FLEET_SETUP="
    line: "KIBANA_FLEET_SETUP=1"
    insertafter: EOF
    state: present
  become: yes

- name: Create FLEET_SETUP_FINISHED file
  file:
    path: "/opt/lme/FLEET_SETUP_FINISHED"
    state: touch
    owner: "root"
    group: "root"
    mode: '0644'
  become: yes

# Setup Fleet Server
- name: Reload systemd daemon
  systemd:
    daemon_reload: yes
  become: yes

- name: Start fleet-server service
  systemd:
    name: lme-fleet-server.service
    state: started
    enabled: yes
  become: yes

- name: Wait for fleet-server to be ready
  wait_for:
    host: "{{ fleet_enrollment_probe_host | default(fleet_enrollment_bind_address | default('127.0.0.1')) }}"
    port: 8220
    timeout: 300
  become: yes

- name: Wait for Fleet to be fully initialized
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents/setup"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    status_code: 200
  register: fleet_status
  until: fleet_status.status == 200
  retries: 36
  delay: 30

- name: Debug Fleet status
  debug:
    var: fleet_status
  when: debug_mode | bool

- name: Check Fleet agents endpoint contents
  uri:
    url: "{{ local_kbn_url }}/api/fleet/agents?page=1&perPage=1000&kuery=status%3Aonline%20or%20(status%3Aerror%20or%20status%3Adegraded)%20or%20(status%3Aupdating%20or%20status%3Aunenrolling%20or%20status%3Aenrolling)%20or%20status%3Aoffline&showInactive=false&showUpgradeable=false&getStatusSummary=true&withMetrics=true"
    method: GET
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      kbn-version: "{{ kibana_version }}"
      kbn-xsrf: "kibana"
      Content-Type: "application/json"
      elastic-api-version: "2023-10-31"
      x-elastic-internal-origin: "Kibana"
    status_code: 200
  register: fleet_agents_result
  vars:
    _fleet_online_configured_hosts: >-
      {{ (fleet_agents_result.json | default({})).get('items', [])
         | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 'online')
         | selectattr('policy_id', 'defined')
         | selectattr('policy_id', 'equalto', policy_id)
         | map(attribute='local_metadata.host.hostname', default='')
         | reject('equalto', '') | list }}
    # D3: count online agents on the fleet-server's OWN policy (id fixed in
    # manifests/services/lme-fleet-server.yml + config/kibana.yml preconfig). The prior
    # non-lab gate accepted total>0 & online>0 -- any online agent, even an unrelated one --
    # while the fleet-server agent (the one that must ship self-monitoring) could be down.
    _fleet_online_server_policy_agents: >-
      {{ (fleet_agents_result.json | default({})).get('items', [])
         | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 'online')
         | selectattr('policy_id', 'defined')
         | selectattr('policy_id', 'equalto', 'fleet-server-policy')
         | list | length }}
  until: >-
    fleet_agents_result.status == 200 and
    (
      ((lme_lab_mode | default(false) | bool) and
       (fleet_expected_agent_hostnames | default([]) | difference(_fleet_online_configured_hosts) | length == 0))
      or
      (not (lme_lab_mode | default(false) | bool) and
       fleet_agents_result.json.total > 0 and
       fleet_agents_result.json.statusSummary.online > 0 and
       (_fleet_online_server_policy_agents | int) > 0)
    )
  retries: 60
  delay: 20
  no_log: true
  when:
    - not (lme_lab_mode | default(false) | bool) or (lme_verify_collection | default(false) | bool)

- name: Report deferred lab Fleet collection verification
  ansible.builtin.debug:
    msg: >-
      PENDING: lab Fleet collection verification is deferred until native agent
      enrollment completes and lme_verify_collection=true. This pending state is
      not an acceptance pass.
  when: (lme_lab_mode | default(false) | bool) and not (lme_verify_collection | default(false) | bool)

# E-EXISTING-WEAK-GATES: capture the fleet-server-policy agent id(s) so the data-flow gate can
# require documents FROM that specific agent (the one that must ship self-monitoring), not merely
# any elastic_agent index. Empty when the check-in gate was deferred (lab); the gate then falls
# back to freshness-only.
- name: Capture the fleet-server-policy agent id(s) for the fresh data-flow proof
  ansible.builtin.set_fact:
    fleet_server_agent_ids: >-
      {{ (fleet_agents_result.json | default({})).get('items', [])
         | selectattr('policy_id', 'defined')
         | selectattr('policy_id', 'equalto', 'fleet-server-policy')
         | map(attribute='id', default='')
         | select('string') | reject('equalto', '') | list }}

- name: Derive online Fleet agent hostnames on the configured policy
  ansible.builtin.set_fact:
    fleet_verified_agent_hostnames: >-
      {{ (fleet_agents_result.json | default({})).get('items', [])
         | selectattr('status', 'defined')
         | selectattr('status', 'equalto', 'online')
         | selectattr('policy_id', 'defined')
         | selectattr('policy_id', 'equalto', fleet_endpoint_policy_id)
         | map(attribute='local_metadata.host.hostname', default='')
         | reject('equalto', '') | list }}
  when:
    - lme_lab_mode | default(false) | bool
    - lme_verify_collection | default(false) | bool

- name: Assert every expected lab source is uniquely online on the configured policy
  ansible.builtin.assert:
    that:
      - fleet_endpoint_policy_id | default('') | length > 0
      - fleet_expected_agent_hostnames | default([]) | length > 0
      - fleet_expected_agent_hostnames | unique | list | length == fleet_expected_agent_hostnames | length
      - fleet_verified_agent_hostnames | unique | list | length == fleet_verified_agent_hostnames | length
      - fleet_verified_agent_hostnames | sort == fleet_expected_agent_hostnames | sort
    fail_msg: >-
      Fleet source verification did not match the independent lab roster exactly
      on policy '{{ fleet_endpoint_policy_id | default('missing') }}'. Expected
      {{ fleet_expected_agent_hostnames | default([]) | sort }}, observed online
      {{ fleet_verified_agent_hostnames | default([]) | sort }}. Duplicate host
      identities, missing sources, extra sources, and wrong-policy agents all fail.
    quiet: true
  when:
    - lme_lab_mode | default(false) | bool
    - lme_verify_collection | default(false) | bool

- name: Debug Fleet agents result
  debug:
    var: fleet_agents_result
  when:
    - debug_mode | bool
    - not (lme_lab_mode | default(false) | bool) or (lme_verify_collection | default(false) | bool)

- name: Verify Fleet agents response structure
  assert:
    that:
      - fleet_agents_result.json is defined
      - fleet_agents_result.json.items is defined
      - fleet_agents_result.json.total is defined
    fail_msg: "Fleet agents endpoint did not return the expected response structure"
  register: fleet_agents_verification
  when:
    - not (lme_lab_mode | default(false) | bool) or (lme_verify_collection | default(false) | bool)

- name: Display Fleet agents summary
  debug:
    msg: "Fleet agents endpoint returned {{ fleet_agents_result.json.total }} total agents"
  when:
    - not (lme_lab_mode | default(false) | bool) or (lme_verify_collection | default(false) | bool)
    - fleet_agents_verification is success

- name: Fail if Fleet is not ready
  fail:
    msg: "Fleet did not become ready within the expected time. Status: {{ fleet_status | default('unknown') }}"
  when: fleet_status.status is not defined or fleet_status.status != 200

- name: Set FLEET_ENROLL=0 to prevent re-enrollment on restart  
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_ENROLL="
    line: "FLEET_ENROLL=0"
    insertafter: EOF
    state: present
  become: yes

- name: Set FLEET_SERVER_ENABLE=0 to prevent re-bootstrap on restart
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^FLEET_SERVER_ENABLE="
    line: "FLEET_SERVER_ENABLE=0"
    insertafter: EOF
    state: present
  become: yes

- name: Set KIBANA_FLEET_SETUP=0 to prevent re-setup on restart
  lineinfile:
    path: "/opt/lme/lme-environment.env"
    regexp: "^KIBANA_FLEET_SETUP="
    line: "KIBANA_FLEET_SETUP=0"
    insertafter: EOF
    state: present
  become: yes

# E-FLEET-REACHABILITY + E-EXISTING-WEAK-GATES (Codex ...-audits-0315): the previous gate matched
# on _cat/indices -- it accepted that an index NAME exists, which an index template can satisfy with
# ZERO documents, and it never proved a usable route or that THIS agent's payload arrived. Require
# instead that FRESH documents (indexed since fleet_run_start) exist for BOTH the metrics and logs
# elastic_agent data streams, filtered to the fleet-server-policy agent id(s) when known. This is
# the real end-to-end reachability + payload proof (usable route + TLS + admitted documents),
# executed against actually-indexed data, and it correctly FAILS a re-run whose repointed output
# never ships (stale docs predate fleet_run_start). Note: validate_certs stays `no` here pending a
# host-side CA path for the fleet role (the CA is read via `podman exec` from lme-elasticsearch, not
# a host file; ES SAN already covers localhost/127.0.0.1) -- CR-E-13 tracks the CA-verified flip.
- name: Gate on FRESH elastic_agent metrics documents (route + payload proof)
  ansible.builtin.uri:
    url: "{{ local_es_url }}/metrics-elastic_agent.*/_count"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      query:
        bool:
          filter: "{{ _fleet_fresh_filter }}"
    status_code: [200, 404]
  vars:
    _fleet_fresh_filter: >-
      {{ [ {'range': {'@timestamp': {'gte': fleet_run_start}}} ]
         + ([ {'terms': {'agent.id': fleet_server_agent_ids}} ]
             if ((fleet_server_agent_ids | default([])) | length > 0) else []) }}
  register: _fleet_metrics_fresh
  until: (_fleet_metrics_fresh.status | default(0)) == 200 and ((_fleet_metrics_fresh.json | default({})).get('count', 0) | int) > 0
  retries: 30
  delay: 20
  no_log: true

- name: Gate on FRESH elastic_agent log documents (route + payload proof)
  ansible.builtin.uri:
    url: "{{ local_es_url }}/logs-elastic_agent.*/_count"
    method: POST
    user: "{{ elastic_username }}"
    password: "{{ elastic_password }}"
    force_basic_auth: yes
    validate_certs: no
    headers:
      Content-Type: "application/json"
    body_format: json
    body:
      query:
        bool:
          filter: "{{ _fleet_fresh_filter }}"
    status_code: [200, 404]
  vars:
    _fleet_fresh_filter: >-
      {{ [ {'range': {'@timestamp': {'gte': fleet_run_start}}} ]
         + ([ {'terms': {'agent.id': fleet_server_agent_ids}} ]
             if ((fleet_server_agent_ids | default([])) | length > 0) else []) }}
  register: _fleet_logs_fresh
  until: (_fleet_logs_fresh.status | default(0)) == 200 and ((_fleet_logs_fresh.json | default({})).get('count', 0) | int) > 0
  retries: 30
  delay: 20
  no_log: true

- name: Report fresh elastic_agent data-flow proof
  ansible.builtin.debug:
    msg:
      - "Run start (target clock): {{ fleet_run_start }}"
      - "Fleet-server agent id filter: {{ fleet_server_agent_ids | default([]) }}"
      - "Fresh metrics-elastic_agent docs: {{ (_fleet_metrics_fresh.json | default({})).get('count', 0) }}"
      - "Fresh logs-elastic_agent docs: {{ (_fleet_logs_fresh.json | default({})).get('count', 0) }}"
  when: debug_mode | bool


# Note: Kibana offline mode configuration now happens in podman role
# (before Kibana starts) instead of here
