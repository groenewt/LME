---
# =============================================================================
# credential_materializer.yml
#
# The DECLARED PostgreSQL platform credential PRODUCER (the missing producer
# that used to live in the dissolved lme_lab.credentials). It mints run-stable
# credential material once (idempotent, never rotating), renders the non-secret
# config files, assembles ONE grant record per file, and emits
# `lme_credential_material = {run_id, grants:[...]}` -- the exact object D's
# scripts.postgresql_platform.platform.resolved_role_config consumes as its
# deploy-time acceptance gate, and the same object the malcolm sibling consumes.
#
# Expressed as Ansible YAML + Jinja + openssl(shell) ONLY. No new Python.
# Enumeration lives in vars/credential_material_requirements.yml (source of
# truth); this file iterates that declared data.
#
# ---------------------------------------------------------------------------
# NAMED SEAMS (this producer is INERT until these land -- see role README/report):
#   (i)  C1 INPUT  -- `lme_runtime_inventory`: the resolved runtime inventory
#        (run_id, hosts[node].{fqdn,tailscale_address,owners,resolved_services},
#        profiles.database). There is currently NO producer of it; the
#        materializer asserts its presence and stops cleanly otherwise.
#   (ii) D ACCEPTANCE GATE -- the DB deploy-time completeness check consumes the
#        canonical VALIDATED resolved artifact THROUGH THE ENGINE (declared
#        required_material + lme_manifests.py), NOT a new handwritten Python
#        caller/__main__ (codex-0415 #1: lme_manifests.py is the sole Python
#        allowance; D's 0357 __main__ ruling is RETRACTED). This leaf only
#        PRODUCES lme_credential_material; wiring the gate is a D consumer change.
#   (iii) GUARDIAN-KEY-RECOVERY (freeze out_of_freeze_open_items, D/C joint). This
#        producer generates ONE stable keypair, grants ONLY the public half
#        (guardian.pub), and writes the private half to the declared runtime mount
#        (/run/lme-fencing). Verifiable restart/host-loss recovery OR explicit
#        rotation of the SAME trusted identity (candidate: an encrypted DURABLE
#        authority-reference mounted only at runtime; never plaintext persistence)
#        is the OPEN SEAM; it is NOT implemented here (see guardian mint below).
#   (iv) PROXY-CLIENT RELATIONSHIP (codex SCHEMA-CLIENT-RELATIONSHIPS). Proxy
#        clients are enumerated from a fixed service-id list + 'pgvector' secret
#        heuristic -- the pattern codex flags for replacement by DECLARED
#        datastore-client relationships. Kept as transitional debt matching D's
#        current derivation (Gate-1 asserts equivalence); awaits a C1 field.
#   (v) TYPED required_material (C1 schema). The canonical, TYPED per-obligation
#        requirement contract (destination/dir-class/owner/mode/consumer/profile/
#        credential-ref) is C1's to define; D owns its db/etcd/proxy projection
#        and E owns the application services'. This leaf does NOT author it; the
#        vars enumeration here is only THIS producer's generation manifest.
# ---------------------------------------------------------------------------
#
# DATA SAFETY: every generation/handling task carries no_log:true. Generated
# material lives under a root-0700 staging dir OUTSIDE the worktree/data. Grant
# records carry only paths + modes (no secret values), so grant assembly and the
# emit are safe to inspect. Distribution is atomic PER FILE (copy = temp+rename
# in the destination dir); the bind-mounted directory itself is NEVER swapped.
# =============================================================================

- name: Load the declared credential material requirements enumeration
  ansible.builtin.include_vars:
    file: credential_material_requirements.yml

# Tunables (a caller/-e override wins; these are only the fallbacks).
#   credential_materializer_staging_dir                  root-0700 controller staging
#   credential_materializer_generate/distribute/become   phase + privilege toggles
# NOTE: the old credential_materializer_guardian_private_runtime_dir tunable
# (default /run/lme-fencing) is REMOVED -- the guardian private half is no longer
# written to a shared runtime dir here; custody is the signer-node,
# deployment+signer-namespaced runtime path resolved in tasks/guardian_custody.yml
# (A1), never a materializer-local default.
- name: Normalize credential_materializer tunables (defaults; -e overrides win)
  ansible.builtin.set_fact:
    credential_materializer_staging_dir: "{{ credential_materializer_staging_dir | default('/var/lib/lme/credential-staging') }}"
    credential_materializer_generate: "{{ credential_materializer_generate | default(true) | bool }}"
    credential_materializer_distribute: "{{ credential_materializer_distribute | default(true) | bool }}"
    credential_materializer_become: "{{ credential_materializer_become | default(true) | bool }}"

# --- SEAM (i): require the resolved runtime inventory -------------------------
- name: Assert the resolved runtime inventory (C1 seam) is present and bound
  ansible.builtin.assert:
    that:
      - lme_runtime_inventory is defined
      - lme_runtime_inventory is mapping
      # run_id = per-run EVIDENCE identity ONLY (three_identity_binding.c). It
      # stamps the grant record and MUST equal credential_material.run_id; it
      # NEVER keys persistent storage, credential ownership, or fence authority.
      - lme_runtime_inventory.run_id is defined
      - lme_runtime_inventory.run_id | string | length > 0
      # deployment_identity = STABLE identity that keys fence authorization +
      # persistent storage root + credential ownership (three_identity_binding.a;
      # frozen shape rule L52 / production_early_reject L226). REQUIRED INPUT: no
      # default(), never minted/config-derived here -> absent = fail-closed. The
      # ^[A-Za-z0-9_-]+$ shape is also a path-safety guard (it becomes a path/CN
      # component; the regex stops traversal).
      - lme_runtime_inventory.deployment_identity is defined
      # \Z (not $) anchors the absolute end: deployment_identity becomes a path
      # component (the staging root below), so no trailing newline may sneak in.
      - lme_runtime_inventory.deployment_identity is match('^[A-Za-z0-9_-]+\Z')
      - (lme_runtime_inventory.profiles.database | default('')) in credential_material_topology
      # CHANGED (codex-0500 C-MATERIAL-HA-VALIDATION-REGRESSION): the old note here
      # said "a missing member already fails closed downstream ... grant emission
      # iterates ALL hosts ... awaits the C1 membership field". codex REFUTED the
      # fail-closed claim (a one-host owner-only map passed) and C1 has now LANDED the
      # membership projection (lme_resolved.database.domains.<id>.members). Membership
      # is validated BEFORE generation by tasks/membership_validation.yml and the DB
      # member node set is scoped to the DECLARED members (below), so a non-member
      # host is no longer made a DB member.
      - lme_runtime_inventory.hosts is mapping
      - (lme_runtime_inventory.hosts | length) > 0
    fail_msg: >-
      credential_materializer is INERT: it requires lme_runtime_inventory (the
      resolved runtime inventory) for run_id + owner/endpoint bindings (the OWED C1+D
      owner/endpoint projection -- see the bridge note below) AND lme_resolved.database
      membership. Nothing is generated or granted until both are present.
    quiet: true

# --- Derivation (mirrors D's resolved_role_config, platform.py) --------------
# BRIDGE (surfaced to C1+D joint review, do NOT invent a parallel shape):
# run_id + per-host owner names (owners['db-'+d], owners['etcd'], owners[sid]) + fqdn
# + tailscale_address are NOT yet projected into lme_resolved (C1 projects members +
# datastore_clients + required_material + deployment_identity only). Until that OWNER/
# ENDPOINT projection lands, those bindings are read transitionally from
# lme_runtime_inventory; MEMBERSHIP is already consumed from the CANONICAL
# lme_resolved.database projection (below). This is the required-material-naming-
# collision + D-pgvector-shape divergence C1 flagged -- mapped onto C1's canonical
# membership projection, with the owner/endpoint bridge reported, not invented here.
- name: Derive run_id, deployment_identity, profile, domains, paths
  ansible.builtin.set_fact:
    _cm_run_id: "{{ lme_runtime_inventory.run_id }}"
    # deployment_identity prefers the CANONICAL lme_resolved.deployment_identity when
    # present (C1 projects it), else the transitional runtime-inventory value; both
    # must agree in shape. run_id + owner bindings still come from runtime inventory.
    _cm_deployment_identity: "{{ lme_resolved.deployment_identity | default(lme_runtime_inventory.deployment_identity) }}"
    _cm_profile: "{{ lme_runtime_inventory.profiles.database }}"
    _cm_domains: "{{ credential_material_topology[lme_runtime_inventory.profiles.database].domains }}"
    _cm_paths: "{{ credential_material_topology[lme_runtime_inventory.profiles.database].paths | bool }}"

# deployment_identity is the STABLE storage/fence key. _cm_deployment_identity now
# prefers the CANONICAL lme_resolved.deployment_identity; the CA CN and the staging
# root MUST key on ONE identity, so refuse when the resolved and transitional runtime
# values disagree (otherwise a CA is minted with one deployment's CN but stored under
# the other's staging root -- silent cross-deployment authority corruption).
- name: Assert resolved and runtime deployment_identity agree (when both present)
  ansible.builtin.assert:
    that:
      - (lme_resolved.deployment_identity is not defined)
        or (lme_runtime_inventory.deployment_identity is not defined)
        or (lme_resolved.deployment_identity == lme_runtime_inventory.deployment_identity)
    fail_msg: >-
      lme_resolved.deployment_identity ({{ lme_resolved.deployment_identity | default('<undef>') }})
      disagrees with lme_runtime_inventory.deployment_identity
      ({{ lme_runtime_inventory.deployment_identity | default('<undef>') }}) -- the credential
      AUTHORITY store (CA CN + staging root) keys on ONE deployment_identity; refusing.
    quiet: true

# The persistent credential AUTHORITY store (CA keys, passwords, guardian pub) is
# keyed on the STABLE deployment_identity, NOT run_id: two deployments on one
# controller must not share/overwrite each other's CAs, passwords or CN. Derived in a
# FOLLOW-ON set_fact so it reads the resolved _cm_deployment_identity (sibling keys in
# one set_fact cannot see each other). A NEW fact name is required -- extra-vars (-e)
# outrank set_fact, so re-setting credential_materializer_staging_dir would be silently
# ignored. (The old note claiming the guardian PRIVATE half "stays /run/lme-fencing"
# was the C-GUARDIAN-DEPLOYMENT-COLLISION footgun and is RESOLVED: the private half is
# deployment+signer namespaced at the signer-only
# /run/lme-fencing-signer/<deployment_identity>/<signer_id>/ path in guardian_custody.yml.)
- name: Derive the deployment-identity-keyed controller staging root
  ansible.builtin.set_fact:
    _cm_staging_root: "{{ credential_materializer_staging_dir }}/{{ _cm_deployment_identity }}"

# --- PRE-GENERATION membership validation (codex-0500 C-MATERIAL-HA-VALIDATION-
# REGRESSION): consume the CANONICAL lme_resolved.database membership projection and
# REFUSE a selected DB profile with no declared membership BEFORE any generation. The
# known-host set is bound to the runtime-inventory hosts the generation indexes into,
# so a declared member absent from that inventory is refused here, not KeyErrored later.
- name: Validate declared database/etcd membership before generation
  ansible.builtin.include_tasks: membership_validation.yml
  vars:
    membership_known_hosts: "{{ lme_runtime_inventory.hosts.keys() | list }}"

# Refuse to clobber another producer's run BEFORE the expensive generation, not after
# (moved up from just before EMIT): a run_id collision must fail fast, before any CA
# or password is minted.
- name: Assert we never clobber another producer's credential_material run
  run_once: true
  ansible.builtin.assert:
    that:
      - (lme_credential_material.run_id | default(_cm_run_id)) == _cm_run_id
    fail_msg: "lme_credential_material already bound to a different run_id"
    quiet: true

# Per-(node,domain) database-domain owners. owner = resolved.hosts[node].owners['db-'+domain]
# (platform.py:221). A missing owner key renders Undefined and fails -- discovery must
# never shrink grants.
# CHANGED (codex-0500 C-MATERIAL-HA-VALIDATION-REGRESSION): the old loop iterated
# _cm_nodes = ALL hosts and relied on owners['db-<d>'] KeyError-ing on a non-member --
# codex REFUTED that (owner-key presence is NOT membership; a host may carry a db-<d>
# owner without being a declared member, so grants leaked to non-members). This now
# iterates the CANONICAL per-domain DECLARED members
# (lme_resolved.database.domains[d].members, validated non-empty + host-bound above),
# so a non-member host is never emitted a domain grant. It does NOT restore a fixed
# total-inventory count. owners['db-'+d] is still read from the runtime inventory (the
# OWED owner/endpoint bridge -- see the derivation note above); it raises if absent.
- name: Derive per-(node,domain) database owner targets
  ansible.builtin.set_fact:
    _cm_domain_targets: "{{ _cm_domain_targets_yaml | from_yaml }}"
  vars:
    _cm_domain_targets_yaml: |-
      {% for d in _cm_domains %}
      {% for n in lme_resolved.database.domains[d].members %}
      - {node: "{{ n }}", domain: "{{ d }}", owner: "{{ lme_runtime_inventory.hosts[n].owners['db-' + d] }}"}
      {% endfor %}
      {% endfor %}

# (REMOVED -- "Assert each database domain owner is identical across all members":
# D removed the platform.py:224-227 counterpart. A per-domain single-owner constraint
# is D's authority-model concern, not this materializer's; keeping it here would
# duplicate a rule this leaf does not own. Membership is now validated canonically
# above; owner identity within a domain is D's to assert if required.)

# Per-node etcd owner (owners['etcd'], platform.py:222) -- a possibly-distinct
# owner D's current loop never checks.
# CHANGED (codex-0500 membership): iterates the CANONICAL declared etcd-group members
# (_cm_etcd_member_nodes, from lme_resolved.database.etcd_groups, validated non-empty +
# host-bound above) rather than _cm_nodes = ALL hosts, so etcd grants follow declared
# etcd membership -- which may legitimately differ from the DB member set.
- name: Derive per-node etcd owner targets
  ansible.builtin.set_fact:
    _cm_etcd_targets: "{{ _cm_etcd_targets_yaml | from_yaml }}"
  vars:
    _cm_etcd_targets_yaml: |-
      {% for n in _cm_etcd_member_nodes %}
      - {node: "{{ n }}", owner: "{{ lme_runtime_inventory.hosts[n].owners['etcd'] }}"}
      {% endfor %}

# Proxy owners = domain owners UNION the owners of on-host resolved_services whose
# id is a proxy service OR that carry a secret named 'pgvector', UNION the
# 'hertzbeat' owner when present (these are the config-dir guardian.pub consumers;
# D's proxy render at platform.py:497-505 mounts guardian.pub at
# /run/guardian/public.pem for each of them).
#
# SEAM (iv) PROXY-CLIENT RELATIONSHIP (codex SCHEMA-CLIENT-RELATIONSHIPS -- NAMED
# DEBT): this enumerates proxy clients from a FIXED proxy-service-id list
# (credential_material_proxy_service_ids) plus a 'pgvector' secret-name heuristic
# on resolved_services -- exactly the hardcoded-client-name / secret-name-guess
# pattern codex flagged for replacement by DECLARED datastore-client RELATIONSHIPS
# on services. It is NOT fixable in this leaf without that C1 relationship field.
# It intentionally MATCHES D's current derivation (platform.py L243-248), so
# Gate-1 asserts this producer's proxy set is byte-equivalent to D today; both
# consumers move to the declared-relationship field together once C1 lands it.
# NOTE (codex-0500): Gate-1 byte-equivalence with D now holds only for HOMOGENEOUS
# membership (every declared member in every domain + etcd group). Because this
# derivation is scoped to declared members (below), a heterogeneous topology can
# diverge from D's fixed-HOSTS loop; that divergence is CORRECT (declared membership
# wins) and is reported to D rather than papered over here.
# Reading owners[sid] off resolved_services is itself legitimate CONSUMPTION;
# owners[sid] raises if absent (no default()).
#
# FAIL-CLOSED-ON-SHRINK (codex "discovery must never shrink grants"): scoping the
# proxy scan to declared members would SILENTLY DROP a proxy/pgvector datastore client
# running on a NON-member host (e.g. a collector). Refuse that topology BEFORE
# generation -- a real datastore client outside the member set must be DECLARED
# (membership or the SEAM iv datastore_clients relationship), never dropped.
- name: Assert no non-member host carries a proxy/pgvector datastore client (no silent shrink)
  ansible.builtin.assert:
    that:
      - ((lme_runtime_inventory.hosts.keys() | list | difference(_cm_member_nodes))
         | map('extract', lme_runtime_inventory.hosts)
         | map(attribute='resolved_services', default={})
         | map('dict2items') | flatten
         | selectattr('key', 'in', credential_material_proxy_service_ids)
         | list | length) == 0
      - ((lme_runtime_inventory.hosts.keys() | list | difference(_cm_member_nodes))
         | map('extract', lme_runtime_inventory.hosts)
         | map(attribute='resolved_services', default={})
         | map('dict2items') | flatten | map(attribute='value')
         | map(attribute='secrets', default=[]) | flatten
         | selectattr('name', 'equalto', credential_material_proxy_secret_name)
         | list | length) == 0
    fail_msg: >-
      a host OUTSIDE the declared DB member set carries a proxy service
      ({{ credential_material_proxy_service_ids }}) or a '{{ credential_material_proxy_secret_name }}'
      secret in resolved_services -- scoping generation to declared members would SILENTLY
      DROP that datastore client. Declare its membership or its SEAM iv datastore_clients
      relationship instead of shrinking the grant (codex-0500 discovery-must-not-shrink).
    quiet: true

- name: Derive per-node proxy owner targets (config-dir guardian.pub consumers)
  ansible.builtin.set_fact:
    _cm_proxy_targets: "{{ _cm_proxy_targets_yaml | from_yaml }}"
  vars:
    _cm_proxy_targets_yaml: |-
      {% for n in _cm_member_nodes %}
      {% set host = lme_runtime_inventory.hosts[n] %}
      {% set owners = host.owners %}
      {% set ns = namespace(clients=[]) %}
      {% for d in _cm_domains %}
      {% if n in lme_resolved.database.domains[d].members %}
      {% set ns.clients = ns.clients + [owners['db-' + d]] %}
      {% endif %}
      {% endfor %}
      {% for sid, svc in (host.resolved_services | default({})).items() %}
      {% set has_pgv = ((svc.secrets | default([])) | selectattr('name', 'equalto', credential_material_proxy_secret_name) | list | length) > 0 %}
      {% if sid in credential_material_proxy_service_ids or has_pgv %}
      {% set ns.clients = ns.clients + [owners[sid]] %}
      {% endif %}
      {% endfor %}
      {% if 'hertzbeat' in owners %}
      {% set ns.clients = ns.clients + [owners['hertzbeat']] %}
      {% endif %}
      {% for o in (ns.clients | unique) %}
      - {node: "{{ n }}", owner: "{{ o }}"}
      {% endfor %}
      {% endfor %}

# Per-domain principal role list (fixed roles + <db>_<suffix> for db in the
# domain's databases). Mirrors credentials.py:350 / provision.py:22-24.
- name: Derive per-domain principal role lists
  ansible.builtin.set_fact:
    _cm_domain_roles: "{{ _cm_domain_roles_yaml | from_yaml }}"
  vars:
    _cm_domain_roles_yaml: |-
      {% for d in _cm_domains %}
      {{ d }}:
      {% for r in credential_material_fixed_roles %}
        - "{{ r }}"
      {% endfor %}
      {% for db in credential_material_domain_databases[d] %}
      {% for s in credential_material_db_role_suffixes %}
        - "{{ db }}_{{ s }}"
      {% endfor %}
      {% endfor %}
      {% endfor %}

# =============================================================================
# PHASE ORDER (NOT-PREGENERATION -- codex-0845 C-CUSTODY-NOT-PREGENERATION):
#   1. PURE VALIDATION/DERIVATION (above): the runtime-inventory, membership,
#      run_id-clobber and no-silent-shrink asserts plus the target/role
#      derivations. Every one refuses WITHOUT writing any key material.
#   2. CUSTODY ADMISSION (this block): the signer-node guardian custody producer
#      runs and reaches a VERIFIED-PAIR decision BEFORE any ordinary key
#      generation for this deployment_identity/signer_id. Custody decides
#      generate/recover/rotate/republish/noop and NEVER re-mints over a durable;
#      that safety holds ONLY if custody admission precedes generation. A caller
#      that generated first would defeat the recover / lost-custody gates.
#   3. ORDINARY GENERATION (below): CAs, leaf certs, role passwords, rendered
#      config -- runs only after custody has admitted.
#   4. GRANT ASSEMBLY / EMIT / DISTRIBUTE (below): pure record assembly + atomic
#      per-file placement.
# This ordering is the C-owned closure of guardian_custody_caller_contract
# (vars/guardian_custody.yml). The candidate stays UNWIRED (no live caller
# includes this file); the order is reconciled here so that IF wired, custody
# precedes generation. The order is exercised against THIS real file by the
# order-acceptance fixture at testing/tests/custody_caller_order.
#
# The controller staging ROOT is created HERE (0700, root-owned), BEFORE custody,
# so custody's controller-side guardian dir + pub transfer nest under a correctly
# moded/owned root instead of implicitly creating it at a looser default mode.
# =============================================================================

- name: Ensure the controller staging root exists with declared ownership (before custody/generation)
  ansible.builtin.file:
    path: "{{ _cm_staging_root }}"
    state: directory
    mode: "0700"
    # Declared ownership (default root): mode alone does NOT re-establish ownership of a
    # pre-existing dir (codex-1115 C-STAGING-MUTATION-WHEN-DISABLED). Under become the
    # owner/group are enforced; when unprivileged (the order-acceptance fixture runs
    # become:false) they are OMITTED so the create does not attempt a chown it cannot do.
    owner: "{{ (credential_materializer_staging_owner | default('root')) if (credential_materializer_become | default(true) | bool) else omit }}"
    group: "{{ (credential_materializer_staging_group | default('root')) if (credential_materializer_become | default(true) | bool) else omit }}"
  become: "{{ credential_materializer_become | default(true) | bool }}"
  delegate_to: localhost
  run_once: true
  # Gate on an operation that actually WRITES under the root. An all-disabled run
  # (generate=false + custody=false + distribute=false) creates nothing here; a
  # requested custody/generation run creates the 0700 root first so nested creates
  # nest under a correctly moded/owned parent. This does NOT claim a custody-input
  # REFUSAL writes nothing: with generation requested, a refusal leaves exactly this
  # empty 0700 root and NO key material (see the order-acceptance all-disabled +
  # refusal cases).
  when: >-
    (credential_materializer_generate | default(true) | bool)
    or (credential_materializer_guardian_custody | default(credential_materializer_generate | default(true)) | bool)

# =============================================================================
# FRESHNESS (codex-1115 C-REUSE-DISTRIBUTION-ADMISSION-OPEN, hardened per advisor;
# re-scoped per codex C-ALL-DISABLED-STILL-DELETES-ADMISSION): the custody admission
# record lives at a STABLE per-deployment path ({{ _cm_staging_root }}/custody-admission.json)
# and _cm_run_id = lme_runtime_inventory.run_id is a resolved EVIDENCE identity, NOT a
# guaranteed per-execution nonce. So a record left by a PRIOR run could be REPLAYED to admit
# a later custody-disabled distribute/reuse run (its run_id/identity/fingerprint would still
# self-agree). INVALIDATE any pre-existing record at run START -- BEFORE custody -- so the ONLY
# record the admission gate can read is one THIS run's guardian custody wrote AFTER reaching a
# verified pair; the mere EXISTENCE of the record then IS the freshness proof (the gate's
# run_id/identity checks are secondary consistency, never the sole freshness binding).
# SCOPED to a declared admission-CONSUMING operation (generate OR distribute) -- the SAME guard
# as the admission gate + grant/emit below -- so an ALL-DISABLED apply is a TRUE no-op that
# PRESERVES a retained prior admission record and mutates no disabled-state evidence. The
# replay vector stays closed because it is itself a consuming op: a custody-disabled distribute
# run has distribute=true here -> the stale record is removed -> custody wrote none -> the gate
# REFUSES. Delegation-robust (controller file, run_once).
- name: Invalidate any stale custody admission record before custody (freshness; consuming ops only)
  ansible.builtin.file:
    path: "{{ _cm_staging_root }}/custody-admission.json"
    state: absent
  delegate_to: localhost
  run_once: true
  when: >-
    (credential_materializer_generate | default(true) | bool)
    or (credential_materializer_distribute | default(true) | bool)

# =============================================================================
# GUARDIAN CUSTODY -- runs on the SIGNER NODE (NOT the localhost generation block
# BELOW). D-CONFIRMED shape A1..A5 (fencing-protocol.contract.yaml guardian_custody,
# commit 2e9328f): encrypted DURABLE custody + runtime-only plaintext at the
# signer-only namespaced path, install + PAIR-VERIFY BEFORE publish, guard on a
# VERIFIED pub<->priv pair (never on guardian.pub existence). Only guardian.pub
# reaches staging (consumed by the grants further below); the plaintext lives ONLY
# at the signer runtime path; only ciphertext reaches recovery_store. codex-0700 C/D
# boundary: this is C's custody/generation/recovery/rotation side ONLY -- the
# guardian AUTHORITY SERVICE (control.sock lease/epoch/revoke/serialization) is D's
# and is NOT authored here; authority_epoch is CONSUMED from D's seam (A4).
# RUNS BEFORE the GENERATION block below (NOT-PREGENERATION; see PHASE ORDER above).
# =============================================================================
- name: Guardian custody (signer-node encrypted-durable custody + recovery)
  when: credential_materializer_guardian_custody | default(credential_materializer_generate | default(true)) | bool
  block:

    - name: Assert the signer node is declared (no default -> fail closed)
      ansible.builtin.assert:
        that:
          - credential_materializer_signer_node is defined
          - (credential_materializer_signer_node | string | length) > 0
        fail_msg: >-
          guardian custody requires a DECLARED signer node (credential_materializer_signer_node);
          it is never hostname-derived. The custody + authority_epoch inputs are consumed from D's
          authority seam, not minted here (A4).
        quiet: true

    - name: Load the declared guardian custody placements (drift-locked to the contract)
      ansible.builtin.include_vars:
        file: guardian_custody.yml

    - name: Run the guardian custody producer on the signer node (A1..A5)
      ansible.builtin.include_tasks:
        file: guardian_custody.yml
        apply:
          delegate_to: "{{ credential_materializer_signer_node }}"
          run_once: true

# =============================================================================
# NOT-PREGENERATION toggle guard: refuse ordinary key generation whenever custody
# was disabled for this run. Custody's `when` defaults ON whenever generate is on,
# so generate=true + guardian_custody=false is the ONLY way to reach generation
# with NO custody admission -- refuse it. (The ordering above + custody's own
# aborting required-input/guard asserts are the PRIMARY protection; this closes the
# explicit-disable bypass WITHOUT relying on cross-delegation fact visibility.)
# =============================================================================
- name: Refuse generation when guardian custody is explicitly disabled (NOT-PREGENERATION bypass guard)
  when: credential_materializer_generate | default(true) | bool
  ansible.builtin.assert:
    that:
      - (credential_materializer_guardian_custody | default(credential_materializer_generate | default(true))) | bool
    fail_msg: >-
      credential_materializer_generate=true with credential_materializer_guardian_custody=false is
      REFUSED: guardian custody admission MUST precede any ordinary key generation
      (NOT-PREGENERATION, codex-0845 C-CUSTODY-NOT-PREGENERATION). Do not disable custody while
      generating key material. NOTE: this guard checks the explicit-disable INTENT (the toggle);
      it is DEFENSE IN DEPTH only -- the PRIMARY enforcement is the OUTCOME admission gate
      below (custody_admission_gate.yml), which binds to the verified custody record + a live
      fingerprint re-check and does not rely on cross-delegation fact visibility.
    quiet: true

# =============================================================================
# OUTCOME ADMISSION GATE (codex-1115 C-REUSE-DISTRIBUTION-ADMISSION-OPEN): before ANY
# material consumption -- generation (below), grant emit, or distribution -- require a
# VALID, identity-bound custody admission record for THIS run. This closes the reuse /
# distribution path that a toggle alone left open (a toggle is not outcome evidence). It
# runs whenever generation OR distribution is requested; an all-disabled run consumes
# nothing and needs no admission. Distribution re-asserts the same gate before any file
# placement (below). Custody disabled -> no record -> this REFUSES, on the outcome.
# =============================================================================
- name: Gate material consumption on a VERIFIED custody admission (OUTCOME, not toggle)
  ansible.builtin.include_tasks: custody_admission_gate.yml
  when: >-
    (credential_materializer_generate | default(true) | bool)
    or (credential_materializer_distribute | default(true) | bool)

# =============================================================================
# GENERATION -- run once on the controller staging dir. Idempotent (creates:),
# never rotating. Skipped wholesale when credential_materializer_generate=false.
# Runs AFTER guardian custody has admitted (NOT-PREGENERATION; see PHASE ORDER).
# The staging ROOT is created above (before custody); this block assumes it exists.
# =============================================================================

- name: Credential generation (controller-central, idempotent, never rotating)
  when: credential_materializer_generate | default(true) | bool
  delegate_to: localhost
  run_once: true
  block:

    # ---- Certificate authorities (one per domain + the static CAs) ----
    - name: Derive the CA identity roster
      ansible.builtin.set_fact:
        _cm_ca_ids: "{{ (_cm_domains | map('regex_replace', '^', 'pg-') | list) + credential_material_static_cas }}"

    - name: Mint each certificate authority once (EC P-256 self-signed)
      ansible.builtin.shell: |
        set -euo pipefail
        d="{{ _cm_staging_root }}/pki/{{ item }}"
        install -d -m 0700 "$d"
        tmp="$(mktemp -d "$d/.mint.XXXXXX")"
        openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout "$tmp/ca.key" -out "$tmp/ca.crt" -days 3650 -sha256 \
          -subj "/CN=LME {{ _cm_deployment_identity }} {{ item }} CA" \
          -addext "basicConstraints=critical,CA:TRUE,pathlen:0" \
          -addext "keyUsage=critical,keyCertSign,cRLSign,digitalSignature"
        chmod 0600 "$tmp/ca.key"; chmod 0644 "$tmp/ca.crt"
        mv "$tmp/ca.key" "$d/ca.key"; mv "$tmp/ca.crt" "$d/ca.crt"
        rmdir "$tmp"
      args:
        executable: /bin/bash
        creates: "{{ _cm_staging_root }}/pki/{{ item }}/ca.crt"
      loop: "{{ _cm_ca_ids }}"
      no_log: true

    # ---- Guardian Ed25519 keypair -- MOVED OUT of this localhost generation block.
    # The OLD inline mint (removed) was the exact footgun codex-0630 flagged: it
    # generated the plaintext private half on the CONTROLLER, defaulted it under the
    # shared /run/lme-fencing (render() bind-mounts that READ-ONLY into every member
    # + proxy -> readable in every consumer ns), published guardian.pub BEFORE any
    # pair-verify, and gated on `creates: guardian.pub` (pub-existence suppresses
    # recovery after an interrupted/volatile-key loss). Guardian custody now runs on
    # the SIGNER NODE via tasks/guardian_custody.yml (D-CONFIRMED shape A1..A5,
    # encrypted durable custody + runtime-only plaintext + install/pair-verify BEFORE
    # publish + guard on a verified pair). See the "GUARDIAN CUSTODY" block below;
    # only guardian.pub reaches staging, only ciphertext reaches recovery_store.

    # ---- Leaf certificate roster (server + client identities) ----
    # CN/SAN/EKU come from the CONSUMING code (pg_hba clientcert=verify-full has
    # no map -> client CN == connecting user; verify-full clients reach servers
    # by FQDN and by the pg-<domain>-rw pass-through alias).
    - name: Derive the leaf certificate roster
      ansible.builtin.set_fact:
        _cm_leaf_ids: "{{ _cm_leaf_ids_yaml | from_yaml }}"
      vars:
        _cm_leaf_ids_yaml: |-
          {% for d in _cm_domains %}
          {% for u in credential_material_cert_principals %}
          - {caid: "pg-{{ d }}", id: "principal-{{ u }}", cn: "{{ u }}", san: "", eku: "clientAuth"}
          {% endfor %}
          {% for n in lme_resolved.database.domains[d].members %}
          {% set h = lme_runtime_inventory.hosts[n] %}
          {% set aliases = credential_material_domain_rw_alias[d] %}
          - {caid: "pg-{{ d }}", id: "{{ n }}-server", cn: "{{ h.fqdn }}", san: "DNS:{{ h.fqdn }},{{ aliases | map('regex_replace', '^', 'DNS:') | join(',') }},IP:{{ h.tailscale_address }}", eku: "serverAuth"}
          - {caid: "etcd", id: "{{ n }}-client-{{ d }}", cn: "patroni-{{ d }}-{{ n }}", san: "", eku: "clientAuth"}
          - {caid: "backup", id: "{{ n }}-client-{{ d }}", cn: "backup-{{ d }}-{{ n }}", san: "", eku: "clientAuth"}
          {% endfor %}
          {% endfor %}
          {% for n in _cm_etcd_member_nodes %}
          {% set h = lme_runtime_inventory.hosts[n] %}
          - {caid: "etcd", id: "{{ n }}-server", cn: "{{ h.fqdn }}", san: "DNS:{{ h.fqdn }},IP:{{ h.tailscale_address }}", eku: "serverAuth,clientAuth"}
          {% endfor %}

    - name: Mint each leaf certificate once (EC P-256, CA-signed, SAN/EKU pinned)
      ansible.builtin.shell: |
        set -euo pipefail
        ca="{{ _cm_staging_root }}/pki/{{ item.caid }}"
        tmp="$(mktemp -d "$ca/.mint.XXXXXX")"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout "$tmp/leaf.key" -out "$tmp/leaf.csr" \
          -subj "/CN={{ item.cn }}" \
          {{ ('-addext "subjectAltName=' + item.san + '"') if (item.san | length > 0) else '' }} \
          -addext "extendedKeyUsage={{ item.eku }}" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment"
        openssl x509 -req -in "$tmp/leaf.csr" -CA "$ca/ca.crt" -CAkey "$ca/ca.key" \
          -CAcreateserial -out "$tmp/leaf.crt" -days 3650 -sha256 -copy_extensions copyall
        chmod 0600 "$tmp/leaf.key"; chmod 0644 "$tmp/leaf.crt"
        mv "$tmp/leaf.key" "$ca/{{ item.id }}.key"; mv "$tmp/leaf.crt" "$ca/{{ item.id }}.crt"
        rm -f "$tmp/leaf.csr"; rmdir "$tmp"
      args:
        executable: /bin/bash
        creates: "{{ _cm_staging_root }}/pki/{{ item.caid }}/{{ item.id }}.crt"
      loop: "{{ _cm_leaf_ids }}"
      loop_control:
        label: "{{ item.caid }}/{{ item.id }} CN={{ item.cn }}"
      no_log: true

    # ---- Role passwords (URL-safe, bounded; provision.py regex [A-Za-z0-9_-]{24,128}) ----
    - name: Derive the role-password id roster (pg-<domain>-<role>)
      ansible.builtin.set_fact:
        _cm_password_ids: "{{ _cm_password_ids_yaml | from_yaml }}"
      vars:
        _cm_password_ids_yaml: |-
          {% for d in _cm_domains %}
          {% for r in _cm_domain_roles[d] %}
          - "pg-{{ d }}-{{ r }}"
          {% endfor %}
          {% endfor %}

    - name: Mint each role password once (never rotating)
      ansible.builtin.shell: |
        set -euo pipefail
        umask 077
        d="{{ _cm_staging_root }}/secrets"
        install -d -m 0700 "$d"
        f="$d/{{ item }}"
        openssl rand -base64 48 | tr "+/" "-_" | tr -d "=\n" > "$f.tmp.$$"
        printf "\n" >> "$f.tmp.$$"
        chmod 0600 "$f.tmp.$$"; mv "$f.tmp.$$" "$f"
      args:
        executable: /bin/bash
        creates: "{{ _cm_staging_root }}/secrets/{{ item }}"
      loop: "{{ _cm_password_ids }}"
      no_log: true

    # ---- Rendered NON-secret and secret-bearing config files (per domain) ----
    - name: Ensure per-domain render staging dirs exist (0700, declared ownership)
      ansible.builtin.file:
        path: "{{ _cm_staging_root }}/render/{{ item }}"
        state: directory
        mode: "0700"
        # same declared-ownership rule as the staging root (codex-1115); omitted when
        # unprivileged so the fixture's become:false run does not attempt a chown.
        owner: "{{ (credential_materializer_staging_owner | default('root')) if (credential_materializer_become | default(true) | bool) else omit }}"
        group: "{{ (credential_materializer_staging_group | default('root')) if (credential_materializer_become | default(true) | bool) else omit }}"
      become: "{{ credential_materializer_become | default(true) | bool }}"
      loop: "{{ _cm_domains }}"

    # pg_service.conf and role-passwords.json carry NO secret values (only paths).
    # These two render NON-secret files (pg_service.conf = paths/config;
    # role-passwords.json = path map only). no_log:true anyway so EVERY task in
    # the material-handling path is uniformly silenced (defence-in-depth; the
    # -vvv leak scan confirms 0 secret markers regardless).
    - name: Render pg_service.conf per domain (no secret values)
      ansible.builtin.template:
        src: pg_service.conf.j2
        dest: "{{ _cm_staging_root }}/render/{{ item }}/pg_service.conf"
        mode: "0644"
      loop: "{{ _cm_domains }}"
      vars:
        cm_domain: "{{ item }}"
      no_log: true

    - name: Render role-passwords.json per domain (path map only, no secret values)
      ansible.builtin.template:
        src: role-passwords.json.j2
        dest: "{{ _cm_staging_root }}/render/{{ item }}/role-passwords.json"
        mode: "0600"
      loop: "{{ _cm_domains }}"
      vars:
        cm_domain: "{{ item }}"
      no_log: true

    # patroni.env and the .pgpass files embed secret values -> no_log; the
    # template FILES committed to the repo contain only structure + a file()
    # lookup, never a literal secret.
    - name: Render the secret-bearing pgpass and patroni.env files per domain
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ _cm_staging_root }}/render/{{ item.domain }}/{{ item.src | regex_replace('\\.j2$', '') }}"
        mode: "0600"
      vars:
        cm_domain: "{{ item.domain }}"
        _cm_render_matrix: |-
          {% for d in _cm_domains %}
          {% for s in ['admin.pgpass.j2', 'physical.pgpass.j2', 'patroni.env.j2'] %}
          - {domain: "{{ d }}", src: "{{ s }}"}
          {% endfor %}
          {% endfor %}
      loop: "{{ _cm_render_matrix | from_yaml }}"
      loop_control:
        label: "{{ item.domain }}/{{ item.src }}"
      no_log: true

    - name: Render logical.pgpass per domain (dual-owned-ha only)
      ansible.builtin.template:
        src: logical.pgpass.j2
        dest: "{{ _cm_staging_root }}/render/{{ item }}/logical.pgpass"
        mode: "0600"
      loop: "{{ _cm_domains }}"
      vars:
        cm_domain: "{{ item }}"
      when: _cm_paths | bool
      no_log: true

# GUARDIAN CUSTODY has MOVED ABOVE the GENERATION block (NOT-PREGENERATION,
# codex-0845 C-CUSTODY-NOT-PREGENERATION): custody admission now precedes any
# ordinary key generation. See the "PHASE ORDER" + "GUARDIAN CUSTODY" blocks that
# now sit immediately before GENERATION. guardian.pub is transferred to controller
# staging there, so the grant assembly below still consumes it.

# =============================================================================
# GRANT ASSEMBLY -- ONE record per file: {node, owner, source_path, destination,
# mode}. The SAME record drives both the copy and D's completeness check. Pure
# (no secrets), so this set_fact is safe to inspect. Run once (a controller fact).
# =============================================================================

- name: Assemble the credential grant records from the declared enumeration
  # DOMINATED BY ADMISSION (codex-1115 C-REUSE-DISTRIBUTION-ADMISSION-OPEN): grant
  # assembly + emit are material CONSUMPTION (they publish the grant contract D's
  # acceptance gate reads, pointing at staged material). They previously ran
  # UNCONDITIONALLY -- so a generate=false/distribute=false run still emitted grants
  # with no custody admission, and distribution defaulted on. Gate them on the SAME
  # condition as the OUTCOME admission gate above (which runs, and would already have
  # FAILED the play, when generate OR distribute is set) -- so whenever these run the
  # admission gate has run first and admitted. An all-disabled run now skips them
  # entirely (a true no-op that consumes nothing).
  when: >-
    (credential_materializer_generate | default(true) | bool)
    or (credential_materializer_distribute | default(true) | bool)
  run_once: true
  ansible.builtin.set_fact:
    _cm_grants: "{{ _cm_grants_yaml | from_yaml }}"
  vars:
    _stg: "{{ _cm_staging_root }}"
    # source-token -> staging source_path resolver + full grant assembly, inline.
    _cm_grants_yaml: |-
      {% macro srcpath(src, stg, domain, node, origin, db) -%}
      {%- set s = src | regex_replace('{domain}', domain) | regex_replace('{origin}', origin) | regex_replace('{node}', node) | regex_replace('{db}', db) -%}
      {%- set parts = s.split(':') -%}
      {%- if parts[0] == 'ca' -%}{{ stg }}/pki/{{ parts[1] }}/ca.crt
      {%- elif parts[0] == 'leaf_crt' -%}{{ stg }}/pki/{{ parts[1] }}/{{ parts[2] }}.crt
      {%- elif parts[0] == 'leaf_key' -%}{{ stg }}/pki/{{ parts[1] }}/{{ parts[2] }}.key
      {%- elif parts[0] == 'render' -%}{{ stg }}/render/{{ domain }}/{{ parts[1] }}
      {%- elif parts[0] == 'guardian_pub' -%}{{ stg }}/guardian/guardian.pub
      {%- endif -%}
      {%- endmacro -%}
      {# ---- (A) DB-DOMAIN OWNER secrets dir ---- #}
      {% for t in _cm_domain_targets %}
      {% set d = t.domain %}
      {% set secdir = credential_material_secrets_dir_tpl | regex_replace('{owner}', t.owner) %}
      {% set files = credential_material_domain_secret_files + (credential_material_domain_secret_files_paths if _cm_paths else []) %}
      {% for f in files %}
      - {node: "{{ t.node }}", owner: "{{ t.owner }}", mode: "{{ f.mode }}", destination: "{{ secdir }}/{{ f.name }}", source_path: "{{ srcpath(f.source, _stg, d, t.node, '', '') }}"}
      {% endfor %}
      {% if _cm_paths %}
      {% for imp in credential_material_domain_imports[d] %}
      {% for rf in credential_material_domain_replication_files %}
      - {node: "{{ t.node }}", owner: "{{ t.owner }}", mode: "{{ rf.mode }}", destination: "{{ secdir }}/{{ rf.name | regex_replace('{db}', imp.db) | regex_replace('{origin}', imp.origin) }}", source_path: "{{ srcpath(rf.source, _stg, d, t.node, imp.origin, imp.db) }}"}
      {% endfor %}
      {% endfor %}
      {% endif %}
      {% for role in _cm_domain_roles[d] %}
      - {node: "{{ t.node }}", owner: "{{ t.owner }}", mode: "{{ credential_material_role_password_mode }}", destination: "{{ (credential_material_roles_dir_tpl | regex_replace('{owner}', t.owner)) }}/{{ role }}.password", source_path: "{{ _stg }}/secrets/pg-{{ d }}-{{ role }}"}
      {% endfor %}
      {% endfor %}
      {# ---- (B) ETCD OWNER secrets dir ---- #}
      {% for t in _cm_etcd_targets %}
      {% set secdir = credential_material_secrets_dir_tpl | regex_replace('{owner}', t.owner) %}
      {% for f in credential_material_etcd_secret_files %}
      - {node: "{{ t.node }}", owner: "{{ t.owner }}", mode: "{{ f.mode }}", destination: "{{ secdir }}/{{ f.name }}", source_path: "{{ srcpath(f.source, _stg, '', t.node, '', '') }}"}
      {% endfor %}
      {% endfor %}
      {# ---- (C) PROXY OWNER config dir ---- #}
      {% for t in _cm_proxy_targets %}
      {% set cfgdir = credential_material_config_dir_tpl | regex_replace('{owner}', t.owner) %}
      {% for f in credential_material_proxy_config_files %}
      - {node: "{{ t.node }}", owner: "{{ t.owner }}", mode: "{{ f.mode }}", destination: "{{ cfgdir }}/{{ f.name }}", source_path: "{{ srcpath(f.source, _stg, '', t.node, '', '') }}"}
      {% endfor %}
      {% endfor %}

# =============================================================================
# EMIT -- merge into the SHARED lme_credential_material (malcolm reads the same
# object). The clobber guard MOVED UP to before GENERATION (a run_id collision now
# fails fast, before any CA/password is minted), so it is not repeated here.
# =============================================================================

- name: Emit / merge the DB producer output into lme_credential_material
  # DOMINATED BY ADMISSION (same guard as grant assembly above): emitting the shared
  # grant contract is consumption; it never runs without a passed admission gate, and
  # never runs in an all-disabled no-op.
  when: >-
    (credential_materializer_generate | default(true) | bool)
    or (credential_materializer_distribute | default(true) | bool)
  run_once: true
  ansible.builtin.set_fact:
    lme_credential_material: >-
      {{ (lme_credential_material | default({'run_id': _cm_run_id, 'grants': []}))
         | combine({'run_id': _cm_run_id,
                    'grants': ((lme_credential_material.grants | default([])) + _cm_grants) | unique}) }}

# =============================================================================
# DISTRIBUTION -- atomic PER-FILE push of THIS host's grants, root-owned. The
# directory is NEVER swapped (copy = temp+rename inside the dest dir). Guarded
# and default-on; the acceptance gate runs with it OFF. Distribution wiring
# (which host, delegation) is finalized by the D/MAIN caller (SEAM ii).
# =============================================================================

- name: Distribute this host's credential grants (atomic per file, root-owned)
  when: credential_materializer_distribute | default(true) | bool
  become: "{{ credential_materializer_become | default(true) | bool }}"
  block:

    # Re-assert the OUTCOME custody admission for THIS run BEFORE any destination dir is
    # created or any file placed (codex-1115 C-REUSE-DISTRIBUTION-ADMISSION-OPEN). A
    # distribution-only run (generate=false) is refused unless custody ran + admitted in
    # the same run. Delegation-robust (controller record + live fingerprint re-check).
    - name: Re-assert custody admission before ANY file placement
      ansible.builtin.include_tasks: custody_admission_gate.yml

    - name: Ensure each granted destination directory exists (never swapped)
      ansible.builtin.file:
        path: "{{ item.destination | dirname }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.owner }}"
        mode: "0700"
      loop: "{{ _cm_grants | selectattr('node', 'equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item.destination | dirname }}"

    - name: Read each granted source file from the controller staging dir
      ansible.builtin.slurp:
        src: "{{ item.source_path }}"
      delegate_to: localhost
      loop: "{{ _cm_grants | selectattr('node', 'equalto', inventory_hostname) | list }}"
      loop_control:
        label: "{{ item.destination }}"
      register: _cm_slurped
      no_log: true

    - name: Place each granted file atomically (temp+rename in the dest dir)
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "{{ item.item.destination }}"
        owner: "{{ item.item.owner }}"
        group: "{{ item.item.owner }}"
        mode: "{{ item.item.mode }}"
      loop: "{{ _cm_slurped.results }}"
      loop_control:
        label: "{{ item.item.destination }}"
      no_log: true
