---
# Secret replacement affects only containers created after replacement. Refuse to
# reconfigure an active consumer: callers must stop/recreate it through the approved
# deployment workflow and run this role before activation.  This role deliberately
# never copies a producer vault, tarball, containers.conf, or secrets.json index.
#
# CC-1: the activation guard now lives in distribute_secrets.yml at the
# requirement-derivation point, so it checks the ACTUAL per-service consumer units
# (<name>.service, from the manifest `name`) that will receive a reconfigured secret
# on THIS host -- keyed on the printed systemd state word (active/activating/
# reloading/deactivating => refuse; inactive/failed/not-found => safe; undetermined =>
# fail-closed). The former umbrella-only `systemctl is-active lme.service == rc 3`
# check lived here; it false-failed ES-only cluster data-node joins (the umbrella is
# not rendered there -> rc 4, not 3) and checked the wrong unit on those hosts. The
# guard still runs before the first target mutation because distribute_secrets emits
# it before its reconcile step.

- name: Reconcile only this host's enabled-service secret requirements
  ansible.builtin.include_role:
    name: podman
    tasks_from: distribute_secrets
