---
# Secret replacement affects only containers created after replacement. Refuse to
# reconfigure an active consumer: callers must stop/recreate it through the approved
# deployment workflow and run this role before activation.  This role deliberately
# never copies a producer vault, tarball, containers.conf, or secrets.json index.

- name: Check whether the LME consumer is already active
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - --quiet
      - lme.service
  become: "{{ lme_secret_distribution_become | default(true) | bool }}"
  changed_when: false
  failed_when: false
  register: _lme_secret_consumer_active

- name: Refuse unsafe live secret reconfiguration
  ansible.builtin.assert:
    that:
      - (_lme_secret_consumer_active.rc | int) == 3
    fail_msg: >-
      Secret distribution blocked for target {{ inventory_hostname }}:
      stage=activation-guard
      code={{ 'secret-reconfiguration-active' if (_lme_secret_consumer_active.rc | int) == 0 else 'secret-reconfiguration-state-unknown' }}.
      Stop and recreate the affected consumer through the approved deployment
      workflow before rotating or replacing its Podman secrets.
    quiet: true

- name: Reconcile only this host's enabled-service secret requirements
  ansible.builtin.include_role:
    name: podman
    tasks_from: distribute_secrets
