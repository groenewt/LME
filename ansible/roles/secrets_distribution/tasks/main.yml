---
# Distribute vault password + encrypted secrets to all nodes.
#
# This is required for Podman's shell secret driver to work consistently across
# remote nodes.
#
# The secrets source is determined as follows:
# - If lme_secrets_source_host is explicitly set, use that
# - Otherwise, use localhost (the ansible controller, which should be the master)
#
# This works because elasticsearch.yml is run FROM the master node to cluster nodes,
# so localhost (the controller) has the secrets generated by site.yml.
#
# This role uses a "push" pattern: the bundle is read from the source host via slurp
# and pushed directly to targets with become: true, ensuring files arrive root-owned.
#
# GAP-4 GRAPHROOT-RELATIVE secrets.json (this file):
# pass.sh, vault and containers.conf live at FIXED absolute paths (graphroot-independent),
# so they still ride the tarball and extract with `tar -C /` -- byte-unchanged. But
# secrets.json (podman's shell/file secret INDEX) lives UNDER podman's graphroot, which
# `install.sh -g` / lme_global_override.storage.graphroot can relocate (verified live:
# producer graph = /data/lme-storage, consumer trixie = /home/lme-storage). Hardcoding
# /var/lib/containers/storage/secrets/secrets.json therefore (1) tars a MISSING file on a
# relocated producer (tar rc=2 -> install fails) and (2) `-C /` extracts to the WRONG dir
# on a relocated consumer. So secrets.json is carried SEPARATELY: its dir is derived at
# runtime from `podman info --format '{{.Store.GraphRoot}}'` on EACH side (the query idiom
# shared with roles/backup_lme, rollback_lme.yml, restore_lme_master.yml; fail-LOUD on a
# failed/empty read -- a wrong path silently writes the index where podman never reads it),
# slurped from the source's
# real <graphroot>/secrets/secrets.json and written to the target's real
# <graphroot>/secrets/secrets.json. When the graphroot is the DEFAULT
# /var/lib/containers/storage, <graphroot>/secrets/secrets.json == the former hardcoded
# literal -- so the banked single-host and cluster (es1/es2/es3) legs are PATH-unchanged.
# (secrets.json's transport changes tar-member -> copy on those legs; content + final
# path + mode/owner are identical, and copy applies the path's default SELinux context.)

- name: Determine secrets source host
  ansible.builtin.set_fact:
    lme_secrets_source_host: "{{ lme_secrets_source_host | default('localhost') }}"
  run_once: true

# GAP-4: derive the SOURCE host's real podman graphroot (secrets.json lives under
# <graphroot>/secrets). podman-info query idiom (roles/backup_lme, rollback_lme.yml,
# restore_lme_master.yml); fail-LOUD on rc!=0 or empty (mirrors distribute_secrets.yml:133)
# rather than defaulting -- the result is a filesystem path that MUST match podman's real
# store, so a silent guess would write the index where podman never reads it. Profile source
# is fully redirected: its stdout would otherwise corrupt the captured path. Delegated +
# run_once: read once from the producer.
- name: Derive podman graphroot on source host
  ansible.builtin.shell: |
    source /root/.profile >/dev/null 2>&1
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    podman info --format "{{ '{{' }}.Store.GraphRoot{{ '}}' }}"
  args:
    executable: /bin/bash
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  register: lme_secrets_src_graphroot
  changed_when: false
  failed_when: lme_secrets_src_graphroot.rc != 0 or (lme_secrets_src_graphroot.stdout | trim) == ''

- name: Ensure podman secrets storage directory exists on source host
  ansible.builtin.file:
    path: "{{ lme_secrets_src_graphroot.stdout }}/secrets"
    state: directory
    mode: '0700'
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true

# Tarball carries ONLY the graphroot-INDEPENDENT artifacts (fixed absolute paths). It no
# longer carries secrets.json -- that graphroot-relative file is slurped + written
# separately below. Extraction stays `tar -C /` (unchanged) for these three.
- name: Create tarball of vault/secrets on source host
  ansible.builtin.command: >-
    tar -czf /tmp/lme_secrets.tgz
    /etc/lme/pass.sh
    /etc/lme/vault
    /root/.config/containers/containers.conf
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true

# GAP-4: read secrets.json from the source's REAL graphroot (not the hardcoded default).
# Kept as base64 in the fact so the write below decodes at point-of-use -- the stored
# value has no Jinja braces, so there is no recursive-templating exposure regardless of
# the index contents.
- name: Read secrets.json index from source host (graphroot-relative, run once)
  ansible.builtin.slurp:
    src: "{{ lme_secrets_src_graphroot.stdout }}/secrets/secrets.json"
  register: secrets_json_raw
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  no_log: true

- name: Read secrets bundle from source host (run once)
  ansible.builtin.slurp:
    src: /tmp/lme_secrets.tgz
  register: secrets_bundle_raw
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  no_log: true

# Propagate the bundle content to ALL hosts in the play.
# When using run_once, only one host gets the registered variable.
# We need to set a fact that all hosts can access.
- name: Set global secrets bundle fact (from run_once host)
  ansible.builtin.set_fact:
    secrets_bundle_content: "{{ hostvars[ansible_play_hosts[0]].secrets_bundle_raw.content }}"
  no_log: true

# Same run_once -> all-hosts propagation for the secrets.json index (mirrors the bundle
# fact above). Kept base64; decoded in the write task on each target.
- name: Set global secrets.json fact (from run_once host)
  ansible.builtin.set_fact:
    secrets_json_content: "{{ hostvars[ansible_play_hosts[0]].secrets_json_raw.content }}"
  no_log: true

- name: Remove old secrets bundle on target host (before push)
  ansible.builtin.file:
    path: /tmp/lme_secrets.tgz
    state: absent
  become: true

- name: Push secrets bundle to target host
  ansible.builtin.shell: |
    echo '{{ secrets_bundle_content }}' | base64 -d > /tmp/lme_secrets.tgz
    chmod 600 /tmp/lme_secrets.tgz
  args:
    executable: /bin/bash
  become: true
  no_log: true
  changed_when: true

# GAP-4: derive THIS target host's real podman graphroot (per host -- each cluster node may
# relocate its own). Same query + fail-LOUD handling as the source derivation above.
- name: Derive podman graphroot on target host
  ansible.builtin.shell: |
    source /root/.profile >/dev/null 2>&1
    export PATH=$PATH:/nix/var/nix/profiles/default/bin
    podman info --format "{{ '{{' }}.Store.GraphRoot{{ '}}' }}"
  args:
    executable: /bin/bash
  become: true
  register: lme_secrets_tgt_graphroot
  changed_when: false
  failed_when: lme_secrets_tgt_graphroot.rc != 0 or (lme_secrets_tgt_graphroot.stdout | trim) == ''

- name: Ensure podman secrets storage directory exists on target host
  ansible.builtin.file:
    path: "{{ lme_secrets_tgt_graphroot.stdout }}/secrets"
    state: directory
    mode: '0700'
    owner: root
    group: root
  become: true

- name: Extract secrets bundle into place
  ansible.builtin.command: tar --overwrite -xzf /tmp/lme_secrets.tgz -C /
  become: true

# GAP-4: write secrets.json to the target's REAL graphroot (NOT `-C /`, which would land it
# under the default path on a relocated consumer). copy sets owner/group/mode atomically
# (no transient 0644 window) and applies the dest path's default SELinux context. The
# base64 fact is decoded at point-of-use (safe -- see the slurp note above).
- name: Write secrets.json index to target graphroot (graphroot-relative)
  ansible.builtin.copy:
    content: "{{ secrets_json_content | b64decode }}"
    dest: "{{ lme_secrets_tgt_graphroot.stdout }}/secrets/secrets.json"
    owner: root
    group: root
    mode: '0600'
  become: true
  no_log: true

# Defense-in-depth re-assert of the index perms at the derived graphroot path. The copy
# above already sets 0600/root/root; this keeps the explicit perms guarantee (idempotent).
- name: Set proper permissions on secrets.json
  ansible.builtin.file:
    path: "{{ lme_secrets_tgt_graphroot.stdout }}/secrets/secrets.json"
    mode: '0600'
    owner: root
    group: root
  become: true

- name: Remove secrets bundle on target host
  ansible.builtin.file:
    path: /tmp/lme_secrets.tgz
    state: absent
  become: true

- name: Remove secrets bundle on source host (best-effort)
  ansible.builtin.file:
    path: /tmp/lme_secrets.tgz
    state: absent
  delegate_to: "{{ lme_secrets_source_host }}"
  run_once: true
  become: true
  failed_when: false
