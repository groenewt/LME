---
# =============================================================================
# credential_material_requirements.yml
#
# DECLARED, per-owner-class enumeration of the PostgreSQL platform credential
# files this role's credential_materializer produces and grants. This file is
# the SINGLE SOURCE OF TRUTH for the PRODUCER side (what this leaf mints/grants).
#
# ---------------------------------------------------------------------------
# NOT the canonical required_material (C1 schema -- NAMED DEBT): the frozen shape
# introduces a TOP-LEVEL, TYPED required_material.<owner-role> contract
# (destination / directory_class / owner / mode / consumer / profile_condition /
# credential_reference), whose SCHEMA is C1's to define, whose db/etcd/proxy
# projection D owns, and whose application-service entries E owns. This file is
# NOT that contract and does NOT author entries for services C does not own
# (no ES/Kibana/Fleet/LiteLLM here). It is only this producer's GENERATION
# MANIFEST -- the file set this leaf must mint so D's completeness gate is
# satisfied. When C1 lands the typed required_material field, this manifest is
# reconciled against (consumed from) it rather than duplicating it.
# ---------------------------------------------------------------------------
# CONTRACT DEBT / REQUEST TO D (scripts/postgresql_platform/platform.py):
#   This enumeration MIRRORS D's completeness contract:
#     * the domain/profile map here mirrors platform.topology()
#       (platform.py:25-34);
#     * credential_material_domain_secret_files[*].name is a SUPERSET of the
#       15-file loop D asserts today in resolved_role_config
#       (platform.py:231-235);
#     * the proxy-owner derivation mirrors platform.py:243-248;
#     * the replication-<db> import mapping mirrors platform.render()
#       lines 397-404 of the dissolved producer and subscription_sql()
#       (platform.py:50-61).
#   Because BOTH sides must agree, the file list is duplicated between this YAML
#   and D's Python loop. REQUEST TO D: factor the required-file list (and
#   topology()) into ONE shared declaration (e.g. a data file both this role
#   and platform.py read) so the producer and the acceptance gate can never
#   drift. Until then, any change here MUST be mirrored in platform.py and
#   vice-versa. See the gate in this role's tests which asserts the emitted
#   grant set is a superset of this enumeration.
# ---------------------------------------------------------------------------
#
# All modes follow the task-verified rule:
#   *.key, *.pgpass, role-passwords.json, patroni.env => "0600"
#   *.crt, *.pub                                       => "0644"
#   pg_service.conf (references passfiles, no inline secret) => "0644"
# =============================================================================

# --- Topology mirror (platform.topology(), platform.py:25-34) ----------------
# domains: the database domains for a profile.
# paths:   whether reciprocal logical replication exists (plan['paths'] truthy).
credential_material_topology:
  dual-owned-ha:
    domains: [hertzbeat, vector]
    paths: true
  shared-ha:
    domains: [shared]
    paths: false

# Databases each domain authoritatively owns (mirrors topology()[...]['databases']
# and the dissolved producer's per-domain principal loop, credentials.py:349).
credential_material_domain_databases:
  hertzbeat: [hertzbeat]
  vector: [lme_vectors, litellm]
  shared: [hertzbeat, lme_vectors, litellm]

# Databases each domain SUBSCRIBES TO (imports), and the origin domain that
# publishes each. Only relevant when profile paths is true (dual-owned-ha).
# Mirrors topology()[...]['imports'] with the '_replica' suffix removed, and
# the origin selection in credentials.py:397-404.
#   hertzbeat domain imports lme_vectors + litellm (origin: vector)
#   vector    domain imports hertzbeat            (origin: hertzbeat)
# NOTE (flagged): the task brief said "per subscribed db in {hertzbeat,vector}";
# 'vector' is a DOMAIN, not a database. The code only ever references
# replication-{hertzbeat,lme_vectors,litellm}-*, so this map is keyed on the
# real database names, per subscription_sql() and platform.render().
credential_material_domain_imports:
  hertzbeat:
    - {db: lme_vectors, origin: vector}
    - {db: litellm, origin: vector}
  vector:
    - {db: hertzbeat, origin: hertzbeat}
  shared: []

# Database roles per domain that receive a generated password. Mirrors
# credentials.py:350 and provision.initialize_passwords()
# (provision.py:22-24 required/allowed sets). role-passwords.json maps each of
# these to /run/secrets/roles/<role>.password.
credential_material_fixed_roles: [postgres, replicator, lme_replicator, lme_replica_reader]
credential_material_db_role_suffixes: [migrator, app, adapter, reader]

# Principals that additionally receive a CLIENT certificate (CN == role name;
# pg_hba uses clientcert=verify-full with no map, platform.py:315-316, so the
# client-cert CN MUST equal the connecting user).
#   postgres       -> admin.crt/.key            (platform.py admin service)
#   replicator     -> replicator.crt/.key       (platform.py:331, rejoin.py:170)
#   lme_replicator -> replication-<db>.crt/.key (subscription_sql, platform.py:58)
credential_material_cert_principals: [postgres, replicator, lme_replicator]

# --- Proxy-owner derivation (platform.py:243-248) ----------------------------
# proxy_owners = domain owners UNION owners of on-host resolved_services whose
# id is in this list OR that carry a secret named by proxy_secret_name, UNION
# the 'hertzbeat' owner if the host has one. Derived from DECLARED
# resolved_services only -- never from observed/running services.
credential_material_proxy_service_ids: [hertzbeat, litellm, dashboard, log-analyzer]
credential_material_proxy_secret_name: pgvector

# --- Endpoint aliases (proxies pass TLS through; server cert needs the alias) -
# README: "Certificates include the appropriate endpoint alias." The subscriber
# verify-full connects to pg-<domain>-rw through the pass-through proxy, so the
# publisher's pg-server.crt MUST carry the alias as a SAN.
credential_material_domain_rw_alias:
  hertzbeat: [pg-hertzbeat-rw]
  vector: [pg-vector-rw]
  shared: [pg-hertzbeat-rw, pg-vector-rw]

# Physical listen port per domain (credentials.py:413/421; render spec['port']).
credential_material_domain_port:
  hertzbeat: 5433
  vector: 5434
  shared: 5433

# =============================================================================
# OWNER-CLASS -> FILE ENUMERATION
#
# Each entry: name (destination basename), mode, source (how the staging
# source_path is derived by credential_materializer.yml). 'source' values:
#   ca:<caid>            -> staging pki/<caid>/ca.crt
#   leaf_crt:<caid>:<id> -> staging pki/<caid>/<id>.crt
#   leaf_key:<caid>:<id> -> staging pki/<caid>/<id>.key
#   render:<file>        -> staging render/<node>/<domain>/<file>
#   guardian_pub         -> staging guardian/guardian.pub
# <id> tokens: {node} and {domain} are substituted at assembly time.
# =============================================================================

# (A) DB-DOMAIN OWNER  -> /data/<owner>/secrets/postgresql/<name>
#     owner = resolved.hosts[node].owners['db-'+domain]
# The first 15 entries are D's CURRENT loop (platform.py:231-235); the rest are
# render-required files D's loop does not yet check (Gate 2 territory).
credential_material_domain_secret_files:
  # -- D's current 15-file contract (platform.py:231-235) --
  - {name: pg-ca.crt,          mode: "0644", source: "ca:pg-{domain}"}
  - {name: pg-server.crt,      mode: "0644", source: "leaf_crt:pg-{domain}:{node}-server"}
  - {name: pg-server.key,      mode: "0600", source: "leaf_key:pg-{domain}:{node}-server"}
  - {name: admin.crt,          mode: "0644", source: "leaf_crt:pg-{domain}:principal-postgres"}
  - {name: admin.key,          mode: "0600", source: "leaf_key:pg-{domain}:principal-postgres"}
  - {name: admin.pgpass,       mode: "0600", source: "render:admin.pgpass"}
  - {name: pg_service.conf,    mode: "0644", source: "render:pg_service.conf"}
  - {name: role-passwords.json,mode: "0600", source: "render:role-passwords.json"}
  - {name: patroni.env,        mode: "0600", source: "render:patroni.env"}
  - {name: etcd-ca.crt,        mode: "0644", source: "ca:etcd"}
  - {name: etcd-client.crt,    mode: "0644", source: "leaf_crt:etcd:{node}-client-{domain}"}
  - {name: etcd-client.key,    mode: "0600", source: "leaf_key:etcd:{node}-client-{domain}"}
  - {name: backup-ca.crt,      mode: "0644", source: "ca:backup"}
  - {name: backup-client.crt,  mode: "0644", source: "leaf_crt:backup:{node}-client-{domain}"}
  - {name: backup-client.key,  mode: "0600", source: "leaf_key:backup:{node}-client-{domain}"}
  # -- render-required but NOT yet checked by D's loop --
  - {name: guardian.pub,       mode: "0644", source: "guardian_pub"}
  - {name: replicator.crt,     mode: "0644", source: "leaf_crt:pg-{domain}:principal-replicator"}
  - {name: replicator.key,     mode: "0600", source: "leaf_key:pg-{domain}:principal-replicator"}
  # physical.pgpass: MOUNTED secret only for the rejoin operation container
  # (rejoin.py:171); Patroni itself writes /tmp/physical.pgpass (platform.py:332).
  # It still lives in this owner's secrets dir.
  - {name: physical.pgpass,    mode: "0600", source: "render:physical.pgpass"}

# (A.paths) DB-DOMAIN OWNER extra files, ONLY when profile paths is true.
credential_material_domain_secret_files_paths:
  # logical.pgpass: subscription passfile (platform.py:419, provision.py:82).
  - {name: logical.pgpass,     mode: "0600", source: "render:logical.pgpass"}

# (A.repl) DB-DOMAIN OWNER per-imported-db files, ONLY when paths is true.
# Expanded per entry of credential_material_domain_imports[domain];
# {db} = imported database, {origin} = its publishing domain.
# replication-<db>-ca.crt is the ORIGIN domain's pg CA (NOT a fresh CA);
# replication-<db>.crt is the origin's lme_replicator client leaf (CN=lme_replicator).
credential_material_domain_replication_files:
  - {name: "replication-{db}-ca.crt", mode: "0644", source: "ca:pg-{origin}"}
  - {name: "replication-{db}.crt",    mode: "0644", source: "leaf_crt:pg-{origin}:principal-lme_replicator"}
  - {name: "replication-{db}.key",    mode: "0600", source: "leaf_key:pg-{origin}:principal-lme_replicator"}

# (A.roles) DB-DOMAIN OWNER per-role password files -> secrets/postgresql/roles/<role>.password
# Beyond the task's map but REQUIRED by provision.initialize_passwords
# (provision.py:21-34): role-passwords.json maps every role to
# /run/secrets/roles/<role>.password. mode 0600.
credential_material_role_password_subdir: roles
credential_material_role_password_mode: "0600"

# (B) ETCD OWNER  -> /data/<owner>/secrets/postgresql/<name>
#     owner = resolved.hosts[node].owners['etcd'] (a possibly-distinct owner the
#     current D loop never checks). etcd container, platform.py:407.
credential_material_etcd_secret_files:
  - {name: etcd-ca.crt,      mode: "0644", source: "ca:etcd"}
  - {name: etcd-server.crt,  mode: "0644", source: "leaf_crt:etcd:{node}-server"}
  - {name: etcd-server.key,  mode: "0600", source: "leaf_key:etcd:{node}-server"}

# (C) PROXY OWNER -> /data/<owner>/config/postgresql/<name>  (CONFIG dir!)
#     Proxy quadlet Volume mounts config/postgresql/guardian.pub into the proxy
#     (platform.py:451). Public key only. Every domain owner is also a proxy
#     owner, so domain owners receive guardian.pub in BOTH their secrets dir
#     (A) and their config dir (C).
credential_material_proxy_config_files:
  - {name: guardian.pub, mode: "0644", source: "guardian_pub"}

# --- Destination directory templates -----------------------------------------
credential_material_secrets_dir_tpl: "/data/{owner}/secrets/postgresql"
credential_material_config_dir_tpl: "/data/{owner}/config/postgresql"
credential_material_roles_dir_tpl: "/data/{owner}/secrets/postgresql/roles"

# --- Certificate authorities to mint (shared across all three members) --------
# pg-<domain> CAs are added at assembly time (one per domain in the profile).
credential_material_static_cas: [etcd, backup]
