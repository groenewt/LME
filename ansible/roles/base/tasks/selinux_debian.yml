---
# Debian-family LSM handling for LME
# LME's SELinux policy is RHEL-specific: it targets RHEL's container-selinux
# policy and cannot be built or loaded on Debian/Ubuntu. That is by design, not
# a gap. Debian and Ubuntu use AppArmor as their default LSM rather than
# SELinux, and podman confines containers with the distribution's default
# container AppArmor profile. LME ships no custom AppArmor policy, so there is
# nothing for this task to install or manage on Debian-family hosts.

- name: Skip SELinux policy management on Debian family
  debug:
    msg: "Debian-family host: LME's SELinux policy is RHEL-specific (container-selinux) and does not apply here. Debian/Ubuntu use AppArmor as the default LSM and podman applies the distribution's default container AppArmor profile; LME ships no custom AppArmor policy, so nothing is installed or managed. This skip is expected."
