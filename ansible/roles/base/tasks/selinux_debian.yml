---
# Debian-family SELinux handling for LME
# The LME SELinux policy targets RHEL's container-selinux policy and cannot be
# built or loaded on Debian's refpolicy; containers on Debian run without
# SELinux contexts. Install nothing, manage nothing.

- name: Skip SELinux policy management on Debian family
  debug:
    msg: "Debian-family host: LME SELinux policy targets RHEL container-selinux and is not applicable here; containers run without SELinux contexts. Skipping SELinux package/policy setup."
