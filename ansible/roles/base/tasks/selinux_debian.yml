---
# Debian-family SELinux handling for LME
# The LME SELinux policy targets RHEL's container-selinux policy and cannot be
# built or loaded on Debian's refpolicy; containers on Debian run without
# SELinux contexts. Install nothing, manage nothing.
#
# BUT: if this Debian host is SELinux ENFORCING, LME's containers cannot get the
# container-selinux labels they need and later crash OPAQUELY (e.g. lme-setup-certs:
# "/bin/tini: Permission denied"). Fail loud here instead. selinux_was_enforcing is
# already computed at selinux_setup.yml (set_fact, unconditional) BEFORE this include.

- name: Fail loud on Debian + SELinux Enforcing (LME container policy is RHEL-only)
  assert:
    that:
      - not (selinux_was_enforcing | bool)
    fail_msg: >-
      Debian + SELinux Enforcing is unsupported: the LME container SELinux policy
      targets RHEL's container-selinux and cannot load on Debian's refpolicy, so
      containers fail to start (e.g. lme-setup-certs: /bin/tini: Permission denied).
      Set SELinux to permissive or disabled, or deploy on a RHEL-family host.

- name: Skip SELinux policy management on Debian family
  debug:
    msg: "Debian-family host: LME SELinux policy targets RHEL container-selinux and is not applicable here; containers run without SELinux contexts. Skipping SELinux package/policy setup."
