---
# Debian 13 specific tasks
#
# Debian 13 needs nothing beyond the common Debian tasks, which
# roles/base/tasks/main.yml already runs once via its "Include common OS tasks"
# step (debian.yml). This file previously re-included debian.yml (running it a
# second time) and installed debian_13_packages, a variable defined nowhere (a
# permanent no-op); both were removed. It is intentionally left as a no-op so
# main.yml's version-specific dispatch (with_first_found) resolves here for
# Debian 13 rather than falling through to common.yml.
