---
# Debian 13 specific tasks
# Note: base debian.yml is already dispatched by main.yml's common-OS step,
# so it must NOT be re-included here (would run twice on Debian 13).

# Install Debian 13 specific packages
- name: Install Debian 13 specific packages
  apt:
    name: "{{ debian_13_packages | default([]) }}"
    state: present
  become: yes
