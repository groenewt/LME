---
# Debian 13 specific tasks

# Include the base Debian tasks
- name: Include base Debian tasks
  include_tasks: debian.yml

# Install Debian 13 specific packages via the host apt/dpkg. Skipped in offline
# mode, where these must already be baked into the base image (matches the
# offline gating on the other apt tasks in this role).
- name: Install Debian 13 specific packages
  apt:
    name: "{{ debian_13_packages | default([]) }}"
    state: present
  become: yes
  register: apt_install_debian_13
  retries: 60
  delay: 10
  until: apt_install_debian_13 is success
  ignore_errors: "{{ ansible_check_mode }}"
  when: not (offline_mode | default(false))
