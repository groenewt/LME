---
# Debian 12.10 specific tasks
# Note: base debian.yml is already dispatched by main.yml's common-OS step,
# so it must NOT be re-included here (would run twice on Debian 12.10).

- name: Install Debian 12.10 specific packages
  apt:
    name: "{{ debian_12_10_packages | default([]) }}"
    state: present
  become: yes
  register: apt_install_debian_12_10
  retries: 60
  delay: 10
  until: apt_install_debian_12_10 is success
  ignore_errors: "{{ ansible_check_mode }}"
  when: not (offline_mode | default(false))
