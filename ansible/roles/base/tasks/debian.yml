---
# Debian-specific tasks for base role

- name: Update apt cache
  apt:
    update_cache: yes
  become: yes
  # Offline/airgapped installs get their packages from the pre-staged bundle via
  # install.sh's own phased `dpkg -i` loop, not from apt. On Debian 13 the new
  # `mirror+file:` apt sources hard-error ("no longer has a Release file") when the
  # network is cut, aborting the whole play. Skip the network refresh offline (mirrors
  # ubuntu.yml + the redhat base path). The package-install task below is deliberately
  # left ungated: if a required package is genuinely missing from the bundle it should
  # fail loudly there, not turn into a downstream mystery.
  when: not (offline_mode | default(false))

- name: Install required Debian packages
  apt:
    name: "{{ debian_packages }}"
    state: present
  become: yes 

- name: Install common packages
  apt:
    name: "{{ common_packages }}"
    state: present
  become: yes
  when: not (offline_mode | default(false))

- name: Set timezone information
  debconf:
    name: tzdata
    question: tzdata/Areas
    value: "{{ timezone_area | default('Etc') }}"
    vtype: select
  become: yes

- name: Set timezone city
  debconf:
    name: tzdata
    question: tzdata/Zones/{{ timezone_area | default('Etc') }}
    value: "{{ timezone_zone | default('UTC') }}"
    vtype: select
  become: yes 