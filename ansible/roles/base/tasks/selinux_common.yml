---
# Fallback LSM handling for OS families without LME SELinux support
# LME's SELinux policy is RHEL-specific (container-selinux). Other OS families
# manage their own LSM defaults and LME ships no custom policy for them, so this
# task intentionally installs and manages nothing.

- name: Skip SELinux policy management on unsupported OS family
  debug:
    msg: "LME's SELinux policy is RHEL-specific and does not apply on {{ ansible_os_family }}; LME ships no custom LSM policy for this family, so nothing is installed or managed. This skip is expected."
