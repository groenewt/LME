---
# Password setup tasks

- name: Create Vault password
  shell: |
    password="$(</dev/urandom tr -dc 'A-Za-z' | head -c1)$(</dev/urandom tr -dc 'A-Za-z0-9_.-' | head -c29)"
    while ! echo -n "$password" | grep -Eq '[_.-]+';do password="$(</dev/urandom tr -dc 'A-Za-z' | head -c1)$(</dev/urandom tr -dc 'A-Za-z0-9_.-' | head -c29)";done
    echo -n $password
  args:
    executable: /bin/bash
  register: vault_password

- name: Set ANSIBLE_VAULT_PASSWORD
  set_fact:
    ansible_vault_password: "{{ vault_password.stdout }}"

#TODO: make this a bit nicer
- name: Check password complexity
  block:
    - name: Check password length
      assert:
        that:
          - ansible_vault_password | length >= min_length
        fail_msg: "Input is too short. It should be at least {{ min_length }} characters long."

    - name: Generate SHA-1 hash of the password
      shell: "echo -n '{{ ansible_vault_password }}' | openssl sha1 | awk '{print $2}'"
      args: 
        executable: /bin/bash
      register: password_hash

    - name: Set prefix and suffix
      set_fact:
        prefix: "{{ password_hash.stdout[0:5] }}"
        suffix: "{{ password_hash.stdout[5:] }}"

    - name: Check against HIBP API
      uri:
        url: "https://api.pwnedpasswords.com/range/{{ prefix }}"
        method: GET
        return_content: yes
        status_code: 200
      register: hibp_response
      ignore_errors: yes
      when: not (offline_mode | default(false))

    - name: Skip HIBP check in offline mode
      debug:
        msg: "Offline mode enabled - skipping HIBP password breach check"
      when: offline_mode | default(false)

    # An unreachable HIBP API must NOT be swallowed as "not breached": warn
    # clearly that the check was skipped (keeps offline resilience) so the
    # operator knows the password was never verified against known breaches.
    - name: Warn that breach check was skipped (HIBP API unreachable)
      debug:
        msg: >-
          WARNING: breach check skipped (HIBP unreachable) - could not reach
          https://api.pwnedpasswords.com. The password was NOT checked against
          Have I Been Pwned; proceeding without breach verification.
      when:
        - not (offline_mode | default(false))
        - hibp_response is failed

    # Only block when the check actually ran and matched. Note: openssl emits a
    # lowercase SHA-1 hash while the HIBP /range/ response lists suffixes in
    # UPPERCASE, so the suffix must be upper-cased or the match never fires
    # (a breached password would otherwise be accepted silently).
    - name: Fail if password is found in breaches
      fail:
        msg: "The password has been found in breaches... this should only happen if you provided a password via the cli... choose a different password"
      when:
        - not (offline_mode | default(false))
        - hibp_response is not failed
        - (hibp_response.content | default('') | regex_search(suffix | upper)) is not none

- name: check if vault-pass.sh is created
  stat:
    path: "{{ password_file }}"
  register: pass_file
  become: yes

- name: Create vault-pass.sh with secure permissions (only if it doesn't exist!)
  copy:
    dest: "{{ password_file }}"
    content: |
      #!/bin/bash
      echo "{{ ansible_vault_password }}"
    mode: '0700'
  when: not pass_file.stat.exists
  become: yes

- name: Ensure ANSIBLE_VAULT_PASSWORD_FILE is set in .profile
  lineinfile:
    path: /root/.profile
    line: "export ANSIBLE_VAULT_PASSWORD_FILE=\"{{ password_file }}\""
    state: present
    create: yes
  become: yes

- name: Ensure ANSIBLE_VAULT_PASSWORD_FILE is set in .bashrc
  lineinfile:
    path: /root/.bashrc
    line: "export ANSIBLE_VAULT_PASSWORD_FILE=\"{{ password_file }}\""
    state: present
    create: yes
  become: yes

- name: Setup Podman secrets configuration
  copy:
    dest: "{{ user_secrets_conf }}"
    content: |
      [secrets]
      driver = "shell"

      [secrets.opts]
      list = "ls {{ user_vault_dir }}"
      lookup = "ansible-vault view {{ user_vault_dir }}/$SECRET_ID | tr -d '\n'"
      store = "cat > {{ user_vault_dir }}/$SECRET_ID && chmod 700 {{ user_vault_dir }}/$SECRET_ID && ansible-vault encrypt {{ user_vault_dir }}/$SECRET_ID"
      delete = "rm {{ user_vault_dir }}/$SECRET_ID"
    mode: '0600'
  become: yes

- name: setup root overlay-fs usage
  copy:
    dest: "{{ user_storage_conf }}"
    content: |
      [storage]
      driver = "overlay"

      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"

    mode: '0600'
  become: yes

- name: Create /etc/containers
  file:
    path: /etc/containers/
    state: directory
    owner: "root"
    group: "root"
    mode: '0744'
  become: yes

- name: setup global overlay-fs usage
  copy:
    dest: "{{ global_storage_conf }}"
    content: |
      [storage]
      driver = "overlay"
      runroot = "{{ storage_runroot | default('/run/containers/storage') }}"
      graphroot = "{{ storage_graphroot | default('/var/lib/containers/storage', true) }}"
      [storage.options.overlay]
      mount_program = "/usr/bin/fuse-overlayfs"

    mode: '0600'
  become: yes 