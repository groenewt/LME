---
# Debian 12.10 specific variables
package_manager: apt

# Debian 12.10-specific apt packages, installed via the host apt/dpkg on top of
# the shared Debian set (roles/base/tasks/debian.yml). Defined explicitly so the
# install task in tasks/debian_12_10.yml is no longer a silent no-op on an
# undefined variable. Empty by default — populate with packages that only
# Debian 12.10 needs (e.g. names that were renamed or split between point releases).
debian_12_10_packages: []