---
# Debian 13 specific variables
package_manager: apt
debian_version: "13"

# Debian 13 (trixie)-specific apt packages, installed via the host apt/dpkg on
# top of the shared Debian set (roles/base/tasks/debian.yml). Defined explicitly
# so the install task in debian_13.yml is no longer a silent no-op on an
# undefined variable. Empty by default — populate with packages that only
# Debian 13 needs (e.g. names that were renamed or split between Debian 12/13).
debian_13_packages: []
