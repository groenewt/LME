---
# Debian 12 specific variables
package_manager: apt
debian_version: "12"

# Debian 12 (bookworm)-specific apt packages, installed via the host apt/dpkg on
# top of the shared Debian set (roles/base/tasks/debian.yml). Defined explicitly
# so the install task in tasks/debian_12.yml is no longer a silent no-op on an
# undefined variable. Empty by default — populate with packages that only
# Debian 12 needs (e.g. names that were renamed or split between Debian 12/13).
debian_12_packages: []