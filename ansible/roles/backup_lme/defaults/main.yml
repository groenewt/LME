---
# Defaults for backup_lme role

# Installation directory
lme_install_dir: "/opt/lme"

# Skip interactive prompts (useful for automated backups)
skip_prompts: false

# Skip service restart after backup (useful when calling from rollback)
skip_service_restart: false

# Data-safety gate: fail the backup (default) when LME containers did not stop
# cleanly before the volume copy, so a torn/crash-consistent copy is never reported
# as a clean success. Override to false only if a non-LME container legitimately
# matches the 'lme' name filter used by the stop/wait check.
backup_fail_on_unclean_stop: true

# Backup directory will be determined by podman graphroot if not specified
backup_dir: "" 