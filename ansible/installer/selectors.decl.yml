lme_installer_selector_transport:
  schema_version: 1
  sources:
    parser_declaration: baseline/install.decl.yml
    selector_declaration: dependencies/profile-selectors.yml
    shell_baseline: baseline/install.sh
  ownership: The existing installer remains the only public entrypoint. Generated deltas forward values to the existing Ansible resolver.
  args_var: LME_SELECTOR_ARGS
  operator_args_var: LME_OPERATOR_ARGS
  binding_index: 0
  axis_bindings:
    - {axis: database, flag: database_profile}
    - {axis: telemetry, flag: telemetry_profile}
  destination_flag: telemetry_destinations
  telemetry_flag: telemetry_profile
  status: {refusal: 2, success: 0}
  constants: {enabled: true, disabled: false}
  template_filters: {axis_id_attribute: id, equality_test: equalto}
  messages:
    selector: Unsupported independent profile selector.
    destinations_dependency: Explicit destinations require a telemetry profile.
    destinations: Unsupported, empty or duplicate destination selection.
  rendering:
    newline: "\n"
    empty: ''
    list_empty: []
    quote: "'"
    quote_escape: "'\\''"
    double_quote: '"'
    case_separator: '|'
    argument_separator: ' '
    assignment_separator: '='
    printf_format: '%s\n'
    placeholders:
      name: '@name@'
      value: '@value@'
      arms: '@arms@'
      args: '@args@'
      message: '@message@'
      format: '@format@'
      status: '@status@'
      array: '@array@'
      path: '@path@'
      body: '@body@'
    formats:
      variable: '${@name@}'
      array: '${@name@[@]}'
      array_init: '@name@=()'
      local_array: 'local @name@=(@args@)'
      array_append: '@array@+=(@args@)'
      if_nonempty: 'if [[ -n "${@name@}" ]]; then'
      if_empty: 'if [[ -z "${@name@}" ]]; then'
      if_file: 'if [[ -f "@path@" ]]; then'
      if_end: fi
      case_open: 'case "${@name@}" in'
      case_ok: '  @arms@) ;;'
      case_else: '  *) @args@ ;;'
      case_end: esac
      fail: 'printf @format@ @message@ >&2; exit @status@'
      invoke: '"${@name@[@]}"'
      script_path: '${@name@}/@path@'
      variable_unbraced: '$@name@'
      statement_indent: '        @body@'
  invocation:
    command: ansible-playbook
    inventory_flag: -i
    extra_vars_flag: --extra-vars
    options_var: ANSIBLE_OPTS
    playbook_var: PLAYBOOK_PATH
    script_var: SCRIPT_DIR
    local_inventory: inventory
    cluster_inventory_var: CLUSTER_INVENTORY
    cluster_playbook: ansible/elasticsearch.yml
    master:
      array: site_cmd
      payload_var: master_extra_vars
    nodes:
      array: cluster_cmd
      payload_var: BASE_EXTRA_VARS
  templates:
    validation: validation.sh.j2
    ordinary_suffix: ordinary_suffix.sh.j2
    master: master.sh.j2
    nodes: nodes.sh.j2
    successor: successor.sh.j2
    macros: macros/selectors.j2
  patches:
    - id: independent_selector_admission_and_transport
      selection: regex
      pattern: '(?ms)^# Keep incomplete selector integration.*?^fi\n'
      count: 1
      replacement: validation
    - id: stop_raw_operator_payload_diagnostic
      selection: regex
      pattern: '(?ms)^    # Operator extra-vars passthrough.*?^    fi\n'
      count: 1
      replacement: empty
    - id: ordinary_forwarding_operator_last
      selection: literal
      pattern: ' "${EXTRA_VARS_ARGS[@]}" $ANSIBLE_OPTS'
      count: 2
      replacement: ordinary_suffix
    - id: cluster_master_argv_without_eval
      selection: regex
      pattern: '(?ms)^        local site_cmd="ansible-playbook"\n.*?^        eval \$site_cmd\n'
      count: 1
      replacement: master
    - id: cluster_nodes_argv_without_eval
      selection: regex
      pattern: '(?ms)^        local cluster_cmd="ansible-playbook .*?\n\n        eval \$cluster_cmd\n'
      count: 1
      replacement: nodes
  patch_words: {literal: literal, regex: regex, empty: empty}
  inherited_violations:
    - id: legacy_installer_representation
      status: open
      reason: Untouched baseline shell still lacks complete YAML value/rendering lineage. These scoped generated repairs grant no whole-file exemption.
    - id: legacy_master_extra_vars_python
      status: open
      reason: Preserved historical inline Python serializes cluster phase values. It is not a new loader and remains a representation violation requiring its owning follow-up.
    - id: legacy_inventory_eval_and_diagnostics
      status: open
      reason: validate_cluster_prerequisites retains the historical inventory parser and eval. Neither is executed by this lane's local CLI component tests.
    - id: legacy_installer_temp_paths
      status: open
      reason: Existing application execution functions retain nondeclared temp paths. CLI tests stub privileged filesystem effects and provide private temp roots; they grant no deployment credit.
