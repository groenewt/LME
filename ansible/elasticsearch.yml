---
# =============================================================================
# PRE-MUTATION VALIDATION BARRIER (E-owned entrypoint; C1-OTHER-CALLER-PREFLIGHT).
#
# This is the FIRST play so it fronts EVERY host mutation on this entrypoint --
# including the raw `apt-get install python3` bootstrap play below, which mutates
# a host BEFORE any Deploy-play pre_task could run. site.yml runs its barrier as a
# pre_task because its only preceding work is on localhost; elasticsearch.yml must
# bootstrap remote Python first, so the barrier here MUST be a dedicated pre-play,
# not a pre_task (codex-0700: do NOT copy the incomplete site.yml barrier shape).
#
# It reproduces site.yml's INTENT (fail-closed all-host resolve+validate before any
# mutation) with two deliberate hardenings over site.yml:148-180:
#   * DEDICATED VALIDATION-ONLY PLAY across the COMPLETE inventory with NO `serial`,
#     so it closes the batching residual site.yml's own comment names (site.yml
#     142-146 -- a serial/batched run validates only within a batch): NO Elasticsearch
#     host enters a mutating play until EVERY targeted host has validated.
#   * STRUCTURED evidence bound to a per-INVOCATION token + the content-addressed
#     resolved revision, NOT an unversioned boolean, so a stale/foreign
#     `_lme_prevalidated` fact from a prior play or a serial batch cannot satisfy the
#     gate (codex-0645 C1-SERIAL-BARRIER-STALE-FACT-ACCEPTANCE: bind evidence to THIS
#     invocation + resolved revision, never reuse a historical true fact).
#
# NO REMOTE PYTHON / NO MUTATION: every task here is controller-side (set_fact,
# assert, include_vars/include_role -> load_manifests, and a localhost-delegated
# find), so this play validates the whole inventory even before the Python-bootstrap
# play runs and changes nothing on any host. become:false + gather_facts:false make
# that explicit. HONEST RESIDUALS (routed to C1, NOT claimed fixed here):
#   * lme_resolved_revision is the config-only revision computed BEFORE the
#     material/datastore projections (C1-COMPLETE-RESOLVED-REVISION, open) -- binding
#     to it does not yet cover the fully-composed consumer configuration.
#   * the JSON-vs-YAML boolean conflict-gate representation defect lives in C1's
#     lme_selection_conflicts (C1-CONFLICT-GATE-BOOLEAN-REPRESENTATION-REGRESSION);
#     a caller barrier cannot normalize it -- the fix is in the shared resolver.
- name: Pre-mutation resolve+validate ALL-HOST barrier (fail-closed before any mutation)
  hosts: elasticsearch
  gather_facts: false
  become: false
  # Abort the WHOLE play the moment ANY targeted host errors (matches site.yml's block),
  # so no host advances to the bootstrap/deploy plays on a partial validation. The run_once
  # completeness assert below is the defense-in-depth backstop for a host dropped WITHOUT a
  # task-level failure (e.g. removed during connection), which any_errors_fatal alone misses.
  any_errors_fatal: true
  vars:
    # Shared with the Deploy play via YAML anchor so the manifests root (hence the
    # resolution inputs) has ONE source and the two plays cannot diverge.
    clone_directory: &lme_clone_directory "{{ clone_dir | default(playbook_dir + '/..') }}"
  tasks:
    - name: Barrier -- reject a pre-supplied / carried validation token, evidence or capture
      ansible.builtin.assert:
        that:
          # `-e` outranks set_fact and facts carry across plays; refuse either so an
          # injected or historical value can never masquerade as THIS run's evidence.
          - _lme_es_barrier_run_token is not defined
          - _lme_es_prevalidated is not defined
          # Also refuse a carried resolver operator-selection capture. resolve.yml captures
          # _lme_operator_selections ONCE (guarded `is not defined`) and reuses it every later
          # load; a value carried from a PRIOR play in the same process would make the barrier
          # validate a STALE capture. install.sh runs elasticsearch.yml as its OWN
          # ansible-playbook process (install.sh:1037, Phase 2), so a fresh run never pre-sets
          # it -- this only rejects a genuinely stale/injected capture. NB the WITHIN-invocation
          # limitation (the Deploy play's own var scope is not re-captured) is the shared
          # resolver's C1-CAPTURE-AND-ARTIFACT-COMPLETENESS, routed to C1, not closed here.
          - _lme_operator_selections is not defined
        fail_msg: >-
          _lme_es_barrier_run_token / _lme_es_prevalidated / _lme_operator_selections must NOT be
          pre-supplied (-e) or carried from a prior play -- the barrier mints its own
          per-invocation evidence and a pristine operator-selection capture, so a historical or
          injected value cannot satisfy the gate.
        quiet: true
      tags: ['always']

    - name: Barrier -- mint this invocation's validation token (run_once; shared to every host)
      ansible.builtin.set_fact:
        _lme_es_barrier_run_token: "es-barrier-{{ lookup('pipe', 'date +%s%N') }}-{{ 999999999 | random }}"
      run_once: true
      tags: ['always']

    - name: Barrier -- resolve+validate declared config + service/trust projections (per host, pre-mutation)
      ansible.builtin.include_role:
        name: podman
        tasks_from: load_manifests
        apply:
          tags: ['always']
      tags: ['always']

    - name: Barrier -- record this host's pre-mutation validation evidence (token + resolved revision)
      ansible.builtin.set_fact:
        _lme_es_prevalidated:
          token: "{{ _lme_es_barrier_run_token }}"
          revision: "{{ lme_resolved_revision }}"
      tags: ['always']

    - name: Barrier -- every targeted host validated THIS invocation before any peer mutates
      ansible.builtin.assert:
        that:
          # No targeted host was silently dropped by a validation failure (any_errors_fatal
          # already aborts; this also catches a host removed for another reason) ...
          - (ansible_play_hosts_all | difference(ansible_play_hosts)) | length == 0
          # ... and EVERY surviving targeted host recorded evidence bound to THIS run's token
          # AND to THIS run's resolved revision. A missing fact yields {} (version-safe
          # extract), which fails the `token defined` test and drops the count below the
          # target size -> fail_msg. A stale/foreign fact fails the token/revision equality.
          - >-
            (ansible_play_hosts | map('extract', hostvars)
             | map(attribute='_lme_es_prevalidated', default={})
             | selectattr('token', 'defined')
             | selectattr('token', 'equalto', _lme_es_barrier_run_token)
             | selectattr('revision', 'defined')
             | selectattr('revision', 'equalto', lme_resolved_revision)
             | list | length) == (ansible_play_hosts | length)
        fail_msg: >-
          pre-mutation validation did not succeed on every targeted Elasticsearch host for THIS
          invocation (token {{ _lme_es_barrier_run_token }}, revision {{ lme_resolved_revision }};
          failed/removed: {{ ansible_play_hosts_all | difference(ansible_play_hosts) }}). No host
          proceeds into the bootstrap/deploy plays until the COMPLETE target set validates this run.
        quiet: true
      run_once: true
      tags: ['always']

# Bootstrap play: install Python on remote nodes so Ansible modules work.
# The raw module does not need Python on the target, so this always succeeds.
# It runs AFTER the barrier play above, so this first host mutation is gated on a
# clean all-host pre-mutation validation.
- name: Bootstrap Python on cluster nodes
  hosts: elasticsearch
  gather_facts: false
  become: yes
  tasks:
    - name: Check if python3 exists
      ansible.builtin.raw: which python3
      register: python3_check
      failed_when: false
      changed_when: false

    - name: Install python3 via raw (Debian/Ubuntu)
      ansible.builtin.raw: apt-get update && apt-get install -y python3 python3-apt
      when: python3_check.rc != 0
      changed_when: true

- name: Deploy Elasticsearch
  hosts: elasticsearch
  become: yes
  vars:
    # Common variables (same as site.yml)
    clone_directory: *lme_clone_directory   # shared with the barrier play (one source)
    install_user: "{{ ansible_user_id }}"
    debug_mode: false
    # offline_mode is DELIBERATELY NOT a play var. It is a declared registry field, so a
    # play var here is captured by the resolver's pristine operator-selection scan
    # (resolve.yml:82-88) and, at the operator tier, OUTRANKS an inventory/host_var or
    # profile offline selection -- the exact shadow site.yml:12-26 removed. The registry
    # default is already false (manifests/global.yml), and the parity pre_task below re-runs
    # load_manifests, which resolves offline_mode and bridges it under its bare name BEFORE
    # the ansible-core bootstrap tasks read `offline_mode | default(false)`, so a run that
    # does not select offline is byte-unchanged while a profile/inventory offline selection
    # is no longer silently overridden.

    # Storage configuration
    storage_runroot: "/run/containers/storage"
    storage_graphroot: "/var/lib/containers/storage"
    
    # Directory configuration
    config_dir: "/etc/lme"
    user_config_dir: "/root/.config/containers"
    user_vault_dir: "/etc/lme/vault"
    user_secrets_conf: "/root/.config/containers/containers.conf"
    user_storage_conf: "/root/.config/containers/storage.conf"
    global_storage_conf: "/etc/containers/storage.conf"
    password_file: "/etc/lme/pass.sh"
    
    # Password configuration
    min_length: 12
    
    # Elasticsearch configuration
    es_port: 9200
    
    # --- Deployment profile (manifest overlay selector) --------------------
    # This playbook deploys dedicated Elasticsearch data nodes (hosts:
    # elasticsearch), so the `cluster` profile is selected group-wide by
    # ansible/inventory/group_vars/elasticsearch.yml (lme_profile: cluster). The
    # cluster ES unit settings (discovery mode-switch, transport port 9300, heap
    # + memory caps) come from manifests/profiles/cluster.yml; the PER-NODE
    # discovery keys (node.name, discovery.seed_hosts, cluster.initial_master_nodes,
    # network.publish_host) come from each node's host_vars via
    # lme_service_overrides -- see ansible/inventory/host_vars/*.yml. No es_*
    # cluster vars are inlined here: the profile + host_vars overlay is the
    # single source.
    #
    # `lme_profile` is NOT set as a play var (a play var would self-reference into
    # a recursive-loop template error and would outrank the group_var); it comes
    # from group_vars/elasticsearch.yml, install.sh's -e, or the load_manifests.yml
    # set_fact default.

    # Cluster mode configuration
    # When running elasticsearch.yml we are deploying cluster nodes, so this is
    # true. Consumed OUTSIDE the unit render (cleanup/fleet index replicas, the
    # elasticsearch.yml config template snapshot repo), not by the ES quadlet.
    lme_cluster_mode: true

    # Elasticsearch replicas: 0 for single-node, 1+ for cluster
    # This is set dynamically based on cluster mode
    elasticsearch_number_of_replicas: "{{ 1 if lme_cluster_mode | default(false) else 0 }}"
    
    # Nix configuration
    nix_profile_symlink_path: /nix/var/nix/profiles/default

    # Prevent podman role from starting the full stack automatically.
    # We explicitly start the Elasticsearch unit after certs/secrets distribution.
    lme_autostart: false
    # Only data nodes (SSH targets) should get ES-only quadlets: copy child graph, prune
    # non-ES quadlets, remove lme.service. The cluster master uses ansible_connection=local
    # and must keep the full control-plane quadlets (never set true for every host — that
    # strips Kibana/Fleet/Wazuh from the master when this playbook runs after site.yml).
    lme_child_es_only: "{{ (ansible_connection | default('ssh')) != 'local' }}"

    # Skip secret creation on cluster nodes - secrets are copied from master via secrets_distribution.
    # This prevents the podman role from trying to generate new passwords (which would fail
    # because ansible-vault may not be fully set up yet, and would also create different
    # passwords than the master, breaking the cluster).
    lme_skip_secret_creation: true

  pre_tasks:
    # --- PARITY GATE (E-owned): the validated config is STABLE into the deploy ---------
    # Re-resolve+validate on THIS host and require the barrier's evidence to match: same
    # per-invocation token AND same content-addressed resolved revision. WHAT THIS PROVES
    # (honest scope): the manifest tree, the selected profile and the registry resolve to
    # the SAME revision in the Deploy play as in the barrier play -- i.e. those inputs did
    # not change between validation and deploy, and the barrier play actually ran this
    # invocation. WHAT IT DOES NOT PROVE: full variable-scope identity. resolve.yml captures
    # the operator selection scope ONCE (in the barrier play) and the re-run reuses it, so a
    # registry field introduced ONLY in this play's var scope would not change the revision
    # -- that is the shared resolver's C1-CAPTURE-AND-ARTIFACT-COMPLETENESS (routed to C1).
    # This play deliberately introduces NO registry-field var (offline_mode was removed), so
    # there is no such divergence today. Per-host (NOT run_once) so it still holds if a future
    # change adds `serial:`. The re-run also re-bridges the resolved bare facts (offline_mode,
    # install_llm, ...) the ansible-core bootstrap tasks below read. Runs FIRST so nothing
    # mutating in this play precedes it.
    - name: Parity -- re-resolve+validate this host's declared config (matches the barrier play)
      ansible.builtin.include_role:
        name: podman
        tasks_from: load_manifests
        apply:
          tags: ['always']
      tags: ['always']

    - name: Parity -- refuse to deploy unless the barrier validated THIS exact config on THIS host
      ansible.builtin.assert:
        that:
          - _lme_es_prevalidated is defined
          # token absent -> the barrier play did not run this invocation (fail closed).
          - (_lme_es_prevalidated.token | default('')) == (_lme_es_barrier_run_token | default('__barrier_did_not_run__'))
          # revision drift -> the config changed between validation and deploy (fail closed).
          - (_lme_es_prevalidated.revision | default('')) == lme_resolved_revision
        fail_msg: >-
          {{ inventory_hostname }} has no matching pre-mutation validation evidence for THIS deploy
          (expected token {{ _lme_es_barrier_run_token | default('UNSET -- barrier play did not run') }}
          and resolved revision {{ lme_resolved_revision }}). The validated config is not the config
          being deployed; refusing to enter a mutating role.
        quiet: true
      tags: ['always']
    # --- end PARITY GATE ---------------------------------------------------------------

    # Cluster child nodes never run install.sh, so ansible-vault is not present.
    # The podman shell secret driver uses `ansible-vault view` at container runtime
    # to decrypt secrets.  We must ensure ansible-core is available on every node.
    - name: Install ansible-core on cluster nodes (Debian/Ubuntu)
      ansible.builtin.apt:
        name: ansible
        state: present
        update_cache: yes
      become: yes
      when:
        - ansible_os_family == 'Debian'
        - not (offline_mode | default(false))

    - name: Check if ansible-vault is already available (Red Hat)
      ansible.builtin.command: which ansible-vault
      register: ansible_vault_check
      failed_when: false
      changed_when: false
      when: ansible_os_family == 'RedHat'

    - name: Install ansible-core via pip on cluster nodes (Red Hat)
      when:
        - ansible_os_family == 'RedHat'
        - ansible_vault_check.rc != 0
        - not (offline_mode | default(false))
      become: yes
      block:
        - name: Install python3-pip for ansible
          ansible.builtin.dnf:
            name:
              - python3-pip
            state: present

        - name: Install ansible-core via pip
          ansible.builtin.pip:
            name: ansible-core
            state: present

        - name: Symlink pip-installed ansible binaries to /usr/bin
          ansible.builtin.shell: |
            for f in /usr/local/bin/ansible*; do
              [ -f "$f" ] && ln -sf "$f" /usr/bin/
            done
          args:
            executable: /bin/bash
          changed_when: true

  roles:
    - role: base
      tags: ['base']
    - role: nix
      tags: ['system']
    - role: podman
      tags: ['system']
    - role: secrets_distribution
      tags: ['secrets']
    - role: certs
      tags: ['certs']

  tasks:
    # secrets_distribution publishes only this node's enabled-service secret
    # requirements into global_secrets after verifying actual destination payloads.
    # Do not re-read producer vault paths: scoped distribution does not copy a
    # producer vault/index, and re-extraction would erase the verified handoff.

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start Elasticsearch unit
      ansible.builtin.systemd:
        name: lme-elasticsearch
        state: started
        enabled: true

    - name: Run Elasticsearch post-install configuration
      ansible.builtin.include_role:
        name: elasticsearch
      tags: ['elasticsearch']
