---
- name: Setup LME
  hosts: "{{ target_hosts | default('localhost') }}"
  connection: "{{ ansible_connection | default('local') }}"
  become: yes
  vars:
    # Common variables
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    install_user: "{{ ansible_user_id }}"
    debug_mode: false  # Default debug mode to false
    offline_mode: false  # Default offline mode to false
    install_llm: true  # Default LLM install on; install.sh overrides to false for --offline without --llm
    install_elastic_services: false  # Default off; install.sh sets true only for --elastic-services without --offline

    # Storage configuration
    storage_runroot: "/run/containers/storage"
    storage_graphroot: "/var/lib/containers/storage"
    
    # Directory configuration
    config_dir: "/etc/lme"
    user_config_dir: "/root/.config/containers"
    user_vault_dir: "/etc/lme/vault"
    user_secrets_conf: "/root/.config/containers/containers.conf"
    user_storage_conf: "/root/.config/containers/storage.conf"
    global_storage_conf: "/etc/containers/storage.conf"
    password_file: "/etc/lme/pass.sh"
    
    # Password configuration
    min_length: 12
    
    # Elasticsearch configuration
    es_port: 9200
    kibana_port: 5601
    fleet_port: 8220
    
    # --- Deployment profile (manifest overlay selector) --------------------
    # The active manifest profile is the SINGLE SOURCE of the Elasticsearch
    # cluster settings (discovery mode, transport port 9300, JVM heap + cgroup
    # memory caps). The playbook only SELECTS the profile here; the values live
    # in manifests/profiles/<name>.yml, and the per-node discovery keys
    # (node.name, discovery.seed_hosts, cluster.initial_master_nodes,
    # network.publish_host) live in host_vars via lme_service_overrides -- see
    # ansible/inventory/host_vars/*.yml.
    #
    # `lme_profile` is deliberately NOT defined as a play var here: the form
    # `lme_profile: "{{ lme_profile | default('default') }}"` self-references
    # (recursive-loop template error when no -e is given) AND play vars outrank
    # host_vars/group_vars, which would shadow a per-group/per-host profile
    # selection. It is instead supplied by install.sh as `-e lme_profile=<name>`
    # (or an inventory group_var) and defaulted to 'default' by
    # load_manifests.yml's set_fact.

    # Cluster mode is DERIVED from the selected profile so the profile stays the
    # single source of truth. An explicit `-e lme_cluster_mode=true` still wins
    # (extra-vars precedence). This flag is consumed OUTSIDE the unit render --
    # by the cleanup/fleet roles (index replica counts) and the
    # elasticsearch.yml config template (snapshot repo path), not by the ES
    # quadlet (that now comes from the profile + host_vars overlay).
    lme_cluster_mode: "{{ (lme_profile | default('default')) == 'cluster' }}"

    # Elasticsearch replicas: 0 for single-node (default), 1+ for cluster.
    elasticsearch_number_of_replicas: "{{ 1 if lme_cluster_mode | default(false) else 0 }}"
    
    # Kibana version
    kibana_version: "8.18.8"
    
    # Default timezone settings
    timezone_area: "Etc"  # Change to your area: America, Europe, Asia, etc.
    timezone_zone: "UTC"  # Change to your timezone: New_York, London, Tokyo, etc.
    nix_profile_symlink_path: /nix/var/nix/profiles/default

    # --- Cert-publish ordering (B0/B4 single-node + cluster-master fix) ----------
    # The four ALWAYS-ON core services (kibana, fleet-server, fleet-distribution,
    # wazuh-manager) mount per-service host-tree cert bundles under
    # /opt/lme/certs/<svc>. Those bundles are PUBLISHED only by the `certs` role
    # (real host-root chown to the manifest-derived subuid; init-setup.sh runs under
    # UserNS=auto and cannot chown to host subuids). The `certs` role never ran in
    # site.yml before, so on single-node AND on the cluster master the bundles were
    # never published and those four units failed to start.
    #
    # Fix (mirrors ansible/elasticsearch.yml): keep the podman role from
    # auto-starting the umbrella (lme_autostart:false -> it still renders quadlets +
    # creates secrets), run the `certs` role to generate the workspace certs AND
    # publish the per-service bundles, THEN start lme.service ONCE and run each app
    # role's post-install config against the now-running, cert-published stack.
    lme_autostart: false

    # --- GAP-4: cross-host secret distribution ordering (opt-in; default no-op) ---
    # When lme_distribute_secrets is armed (operator -e, cross-host consumer install),
    # skip LOCAL shell-secret minting in the podman role's container_setup so the
    # shell-driver credentials (e.g. elastic) arrive via the secrets_distribution bundle
    # instead of being minted here with DIFFERENT values. Mirrors the cluster path
    # (elasticsearch.yml:92). Default false -> container_setup mints locally as before, so
    # every single-host install is byte-unchanged. (Consequence when armed: setup_secrets.yml
    # runs before the bundle, so global_secrets.elastic is empty for the ES/Kibana post-config
    # roles -> see the GAP-4 residuals; safe only where those are scoped OFF via GAP-3.)
    lme_skip_secret_creation: "{{ lme_distribute_secrets | default(false) | bool }}"
  roles:
    - role: base
      tags: ['base', 'all']
    - role: nix
      tags: ['base', 'system', 'all']
    - role: podman
      tags: ['system', 'all']
    # Generate the workspace certs (starts lme-setup-certs) AND publish the
    # per-service host-tree bundles to /opt/lme/certs/<svc> BEFORE any core service
    # starts. Consumes the same shared role as the cluster data-node path.
    - role: certs
      tags: ['certs']

  # Post-role stack bring-up. With lme_autostart:false the podman role did NOT start
  # the umbrella, so this is the SOLE start point -- and it runs only after `certs`
  # has published the per-service bundles that the core units bind-mount.
  tasks:
    # --- GAP-2: cross-host consumer CA trust (opt-in; default no-op) ------------
    # Overlay the PRODUCER node's internal LME CA (ca/ca.crt) onto THIS consumer
    # node's published cert bundles so a cross-host TLS client (e.g. the dashboard's
    # Elasticsearch client) trusts the producer's ES leaf. Gated OFF by default
    # (lme_distribute_ca=false) -> NO-OP for every single-host deploy. Runs HERE --
    # after the `certs` role published this node's own bundles and BEFORE lme.service
    # starts -- so the producer CA is in place before any consumer container connects.
    # The 'certs' tag is intentional: a `--tags certs` run re-publishes the LOCAL CA
    # (roles/certs) and would otherwise silently revert this overlay.
    - name: Distribute producer CA to consumer cert bundles (GAP-2; opt-in)
      ansible.builtin.include_role:
        name: podman
        tasks_from: distribute_ca
      when: lme_distribute_ca | default(false) | bool
      tags: ['system', 'all', 'certs']
    # --- end GAP-2 CA distribution ---------------------------------------------

    # --- GAP-4: cross-host secret distribution (task 3a; opt-in; default no-op) ---
    # Reuse the secrets_distribution role to push the PRODUCER's secret bundle
    # (pass.sh + vault + containers.conf + secrets.json) onto THIS consumer, THEN repair the
    # file-driver secret(s) the bundle does NOT carry. Gated OFF by default
    # (lme_distribute_secrets=false) -> NO-OP for every single-host deploy. INSTALL-TIME ONLY:
    # the role's `tar --overwrite -xzf -C /` (secrets_distribution/tasks/main.yml:85) replaces
    # this host's whole secret INDEX (secrets.json), so it must never bolt onto a live consumer
    # (running services hold creation-time values). Runs HERE -- after certs published this
    # node's bundles, BEFORE lme.service starts and BEFORE llama_cpp_setup mints local
    # file-driver secrets.
    #
    # VERIFIED (gap4-file-driver-verdict.md): the bundle carries `elastic` (shell driver, in
    # /etc/lme/vault) but NOT file-driver PAYLOADS at .../secrets/<id>. The secrets.json
    # overwrite also indexes the producer's file-driver secrets by payload IDs absent here
    # -> dangling refs. So `litellm_master_key` (file driver) does NOT ride the bundle, and the
    # second task below is a REPAIR that MUST run AFTER this extract (task order enforces it:
    # the secrets_distribution include completes through its tar extract + perms/cleanup before
    # the distribute_secrets include begins).
    - name: Distribute producer secret bundle to this consumer (GAP-4; opt-in)
      ansible.builtin.include_role:
        name: secrets_distribution
      when: lme_distribute_secrets | default(false) | bool
      tags: ['system', 'all', 'secrets']

    - name: Repair file-driver secrets after the bundle extract (GAP-4; opt-in)
      ansible.builtin.include_role:
        name: podman
        tasks_from: distribute_secrets
      when: lme_distribute_secrets | default(false) | bool
      tags: ['system', 'all', 'secrets']
    # --- end GAP-4 cross-host secret distribution -------------------------------

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Start the LME stack (sole start point; certs published by now)
      ansible.builtin.systemd:
        name: lme.service
        state: started
        enabled: true

    # B4 ordering: the Elastic-services (beats) and LLM packs were DEFERRED out of
    # the podman role (gated on lme_autostart) because their units bind-mount per-svc
    # cert bundles that the certs role only just published. Run them now -- after the
    # core stack is up and /opt/lme/certs/<svc> exists -- via the same podman role
    # task files (facts from the earlier podman role run are still in scope). Order
    # (core -> elastic -> llm -> app-config) matches the pre-restructure roles: list.
    - name: Setup Elastic services pack (deferred; post cert-publish + start)
      ansible.builtin.include_role:
        name: podman
        tasks_from: elastic_services_setup
      when:
        - install_elastic_services | default(false) | bool
        - not (lme_child_es_only | default(false) | bool)
      tags: ['system', 'all']

    - name: Setup llama.cpp / LLM pack (deferred; post cert-publish + start)
      ansible.builtin.include_role:
        name: podman
        tasks_from: llama_cpp_setup
      when:
        - install_llm | default(true) | bool
        - not (lme_child_es_only | default(false) | bool)
      tags: ['system', 'all']

    # Each app role's post-install config expects a RUNNING, cert-published stack
    # (uri/wait_for against :9200, kibana/fleet APIs, etc.). Run them here, in the
    # same order they held in the old roles: list, each keeping its original tags.
    - name: Run Elasticsearch post-install configuration
      ansible.builtin.include_role:
        name: elasticsearch
      tags: ['system', 'all']

    - name: Run Kibana post-install configuration
      ansible.builtin.include_role:
        name: kibana
      tags: ['system', 'all']

    - name: Run Dashboards post-install configuration
      ansible.builtin.include_role:
        name: dashboards
      tags: ['system', 'all']

    - name: Run Wazuh post-install configuration
      ansible.builtin.include_role:
        name: wazuh
      tags: ['system', 'all']

    - name: Run Fleet post-install configuration
      ansible.builtin.include_role:
        name: fleet
      tags: ['system', 'all']

    - name: Run cleanup
      ansible.builtin.include_role:
        name: cleanup
      tags: ['cleanup', 'all']
    