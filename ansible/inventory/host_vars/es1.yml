---
# ansible/inventory/host_vars/es1.yml
#
# SKELETON -- per-node overlay for the cluster MASTER node (es1). Auto-loaded by
# Ansible for inventory host `es1` (see ansible/inventory/cluster_example.yml).
# Copy next to your real inventory and edit the node name + addresses.
#
# THE MODEL (post-B0 manifest refactor):
#   * The STATIC cluster ES settings (discovery mode-switch, transport port 9300,
#     heap + memory caps) come from manifests/profiles/cluster.yml, selected by
#     `lme_profile: cluster` (set group-wide in group_vars/elasticsearch.yml).
#   * The PER-NODE discovery keys that legitimately differ between nodes -- this
#     node's own node.name, network.publish_host -- plus the cluster-wide seed
#     host / initial-master lists live HERE and are applied by load_manifests.yml
#     as `lme_service_overrides`, which combines LAST (after global + profile), so
#     they win over everything except an explicit operator `-e`.
#
# Nothing about the cluster is inlined in ansible/site.yml or
# ansible/elasticsearch.yml any more: the profile + these host_vars ARE the
# source of truth.

# Redundant with group_vars/elasticsearch.yml (host_vars would win anyway); kept
# here so a single node file is self-contained if you do not use group_vars.
lme_profile: cluster

# --- operator lme_global overrides (win LAST over global.yml + profile) -------
# Example: relocate podman's graphroot on this node (same effect as install.sh
# `-g /data`, which passes lme_global_override.storage.graphroot=/data). Any key
# under lme_global can be overridden this way.
lme_global_override:
  storage:
    graphroot: /var/lib/containers/storage   # e.g. /data on a big-disk data node

# --- per-node service overrides (win LAST over global.yml + profile) ----------
lme_service_overrides:
  elasticsearch:
    # environment keys are FLAT dotted strings (matches the manifest convention,
    # e.g. discovery.type in cluster.yml). They combine into the ES environment
    # map, so these ADD the cluster discovery env WITHOUT touching the static
    # keys the profile already set.
    environment:
      # This node's Elasticsearch node.name (must be unique per node and must
      # appear in cluster.initial_master_nodes below). The master keeps the
      # historical single-node identity `lme-elasticsearch` (matches the ES
      # manifest default, every inventory generator, and convert_to_cluster.yml's
      # es_initial_masters default) so converting an existing single-node install
      # does NOT rename its node.
      node.name: lme-elasticsearch
      # Address other ES nodes use to reach THIS node (this node's own IP/host).
      network.publish_host: 10.0.0.4
      # Cluster discovery -- IDENTICAL on every node. All node addresses so any
      # node can find the others. (Same list as es_cluster_seed_hosts was.)
      discovery.seed_hosts: "10.0.0.4,10.0.0.5,10.0.0.6"
      # Bootstrap ONLY -- the master-eligible set as node.NAMES (not addresses),
      # IDENTICAL on every master-eligible node for the first bootstrap. REMOVE
      # this key from every node once the cluster has formed, or a future full
      # restart can split-brain / re-bootstrap. Delete it here by setting it null
      # (null-env-skip drops it from the render) after the cluster is up.
      cluster.initial_master_nodes: "lme-elasticsearch,es2,es3"
    # Optional per-node heap/memory sizing (overrides the profile's 8g). MemoryHigh
    # and MemoryMax re-derive from heap automatically (heap * memory_max_factor:
    # 12g -> 18G/24G). Unlike data nodes es2/es3 -- where SF-8 does NOT run because
    # they deploy over ssh (lme_child_es_only=true skips the preflight) -- the master
    # deploys with ansible_connection=local, so SF-8 DOES run here and weighs THIS
    # node's RAM. The SF-8 preflight (container_setup.yml) weighs MemoryMax
    # against this node's ACTUAL RAM (ansible_memtotal_mb), so size heap so that
    # heap * memory_max_factor(2) <= usable RAM (host RAM - reserve): a roomy master
    # can take 12g; a constrained ~15G node (~13G usable) needs heap <= ~6g -- e.g.
    # heap 2g -> MemoryMax 4G fits. The profile default (8g -> 16G) does NOT fit a
    # <=16G host, so a 3-node cluster on 15G hosts MUST lower heap here per node.
    # resources:
    #   heap: 12g
