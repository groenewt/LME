---
# ansible/inventory/host_vars/es3.yml
#
# SKELETON -- per-node overlay for cluster DATA node es3. Auto-loaded for
# inventory host `es3`. See host_vars/es1.yml for the full explanation of the
# model; this file only changes the per-node values.

lme_profile: cluster

lme_service_overrides:
  elasticsearch:
    environment:
      node.name: es3
      network.publish_host: 10.0.0.6
      # IDENTICAL on every node (all node addresses).
      discovery.seed_hosts: "10.0.0.4,10.0.0.5,10.0.0.6"
      # Bootstrap ONLY -- IDENTICAL on every master-eligible node; remove once the
      # cluster has formed (see es1.yml).
      cluster.initial_master_nodes: "lme-elasticsearch,es2,es3"
    # Optional per-node heap sizing (overrides the profile's 8g); MemoryHigh/MemoryMax
    # re-derive from heap. NOTE: the SF-8 co-residency preflight does NOT run on a data
    # node -- it is gated to the local master (lme_child_es_only skips it on ssh data
    # nodes), so nothing here validates this heap against this node's RAM. Size it
    # yourself: heap * memory_max_factor(2) <= usable RAM (host RAM - reserve), or an
    # oversized heap fails at RUNTIME (OOM / MemoryMax kill), not at preflight. The
    # profile's 8g (-> MemoryMax 16G) does NOT fit a <=16G data node: a ~15G node
    # (~13G usable) needs heap <= ~6g -- heap 2g -> MemoryMax 4G is comfortable. Leave
    # commented to inherit the profile's 8g on a roomy node.
    # resources:
    #   heap: 2g
