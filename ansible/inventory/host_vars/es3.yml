---
# ansible/inventory/host_vars/es3.yml
#
# SKELETON -- per-node overlay for cluster DATA node es3. Auto-loaded for
# inventory host `es3`. See host_vars/es1.yml for the full explanation of the
# model; this file only changes the per-node values.

lme_profile: cluster

lme_service_overrides:
  elasticsearch:
    environment:
      node.name: es3
      network.publish_host: 10.0.0.6
      # IDENTICAL on every node (all node addresses).
      discovery.seed_hosts: "10.0.0.4,10.0.0.5,10.0.0.6"
      # Bootstrap ONLY -- IDENTICAL on every master-eligible node; remove once the
      # cluster has formed (see es1.yml).
      cluster.initial_master_nodes: "lme-elasticsearch,es2,es3"
    # Optional per-node heap sizing (overrides the profile's 8g); MemoryHigh/MemoryMax
    # re-derive from heap. The SF-8 preflight uses this node's ACTUAL RAM, so size heap
    # so heap * memory_max_factor(2) <= usable RAM (host RAM - reserve). The profile's
    # 8g (-> MemoryMax 16G) does NOT fit a <=16G data node: a ~15G node (~13G usable)
    # needs heap <= ~6g -- heap 2g -> MemoryMax 4G is comfortable. Leave commented to
    # inherit the profile's 8g on a roomy node.
    # resources:
    #   heap: 2g
