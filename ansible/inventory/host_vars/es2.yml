---
# ansible/inventory/host_vars/es2.yml
#
# SKELETON -- per-node overlay for cluster DATA node es2. Auto-loaded for
# inventory host `es2`. See host_vars/es1.yml for the full explanation of the
# model; this file only changes the per-node values.

lme_profile: cluster

lme_service_overrides:
  elasticsearch:
    environment:
      node.name: es2
      network.publish_host: 10.0.0.5
      # IDENTICAL on every node (all node addresses).
      discovery.seed_hosts: "10.0.0.4,10.0.0.5,10.0.0.6"
      # Bootstrap ONLY -- IDENTICAL on every master-eligible node; remove once the
      # cluster has formed (see es1.yml).
      cluster.initial_master_nodes: "lme-elasticsearch,es2,es3"
