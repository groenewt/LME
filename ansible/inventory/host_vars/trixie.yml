---
# ansible/inventory/host_vars/trixie.yml
#
# GAP-3 per-host service scoping for the cross-host CONSUMER node `trixie`.
# Auto-loaded for inventory host `trixie` (a PLAIN tailnet client -- no tailscale
# profile, so its scoping is carried HERE in host_vars, not a profile overlay).
#
# WHAT THIS DOES
# `lme_host_services` is the CLOSED allow-list of manifest service ids that render
# on this host. A unit renders iff is_enabled(enabled_when) AND (lme_host_services
# undefined/empty OR id in lme_host_services). Undefined/empty -> full stack, so
# every OTHER host is unaffected (this var only exists on trixie).
#
# CLOSURE (why exactly these four -- see gap3-contract.md sec 6):
#   log-analyzer, dashboard : the consumer UIs this host runs.
#   network                 : kind:network -> lme.network; every container has
#                             Network=lme, so the podman network must exist locally.
#   lme                     : kind:target -> lme.service umbrella; each consumer's
#                             PartOf=lme.service (NOT relaxed) targets it, and
#                             quadlet_setup starts lme.service.
# dashboard's HARD requires [elasticsearch, litellm, pgvector, embeddings] run on
# the PRODUCER; the requires_relax filter (GAP-3 4a) demotes them to soft Wants=
# on this host so dashboard starts without them local. log-analyzer's deps are
# already soft `wants:`. setup-certs is deliberately NOT listed: these two
# consumers do not require it (they receive the producer CA via GAP-4, and their
# own leaf certs come from the certs role, which is not GAP-3-scoped). Neither
# consumer mounts a named volume, so the volume closure is empty.
#
# The GAP-5 post-render gates are shipped: this roster also scopes ES/Kibana,
# Fleet and llama_cpp setup. Select the consumer profile with bindings generated
# by lme_lab for certificate authority, secret source and verified remote URLs.
# Explicit lme_certs_source_host remains authoritative. The secret union for the
# two UIs is elastic, pgvector, litellm_master_key and webui_api_key.

lme_host_services:
  - lme            # umbrella target (infra floor)
  - network        # podman network (infra floor)
  - log-analyzer   # consumer UI
  - dashboard      # consumer UI (cross-host requires RELAX to Wants=)
