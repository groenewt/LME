---
# ansible/inventory/controller_measurement_lab.yml
#
# CONTROLLER-ONLY lab inventory for the preparation measurement (B, r5g; codex-tick409 J-B3, R4-CONTROLLER-ONLY-SCOPE).
# It does not run anything. It is the committed, non-secret lab half of a measurement run inventory, used through the
# SAME existing mechanism as every lab (ansible/inventory/graph_lab_example.yml header): MAIN freezes a byte copy of it
# as <run>/.work/inventory/<lab>/10-lab.yml, the ONE render entry (testing/e2e/inventory_binding/render_run_binding.yml,
# operation preparation_measurement) renders <dir>/20-binding.yml next to it, and the measurement launch passes the two
# files in the declared order of the inventory kind controller_operation_binding. It is NOT the workload lab: no
# target, no role-group member and no deployment identity, so nothing here can scope a workload leg.
#
# DEPLOYMENT IDENTITY (Q7, codex-tick400): deliberately NOT declared. preparation_measurement is identity_nullable, so
# the render records null DIAGNOSTIC attribution (header texts.identity_absent); it proves nothing about any
# deployment. An operation that is not identity_nullable refuses this lab (RUN-BINDING-RENDER-IDENTITY), and a derived
# owner key without an identity refuses (RUN-BINDING-OWNER-IDENTITY).
#
# GROUPS: the route's declared target group (controller.bootstrap.inventory.target_group) and every LANDED role group
# (inventory.role_groups values in the candidate profile :1508) are declared here EMPTY on purpose, so the measurement's
# controller-only scope admission (r4c measure_controller_tools.yml stage 2: no target, no target- or role-group member,
# no host other than controller_delegation.host) holds by declaration and an accidental member is a visible source
# edit. Route-r4 P7's proposed controller_prerequisite group is NOT named here: no landed declaration sources that
# name, and stage 2 passes whether a group is absent or empty. The only host is the controller delegation host. Group
# NAMES must equal the profile's declarations (inventory files carry membership; the profile carries the names).
#
# ADJACENCY: ansible/inventory/group_vars/elasticsearch.yml applies only to the elasticsearch group (absent here) and
# no host_vars/localhost.yml exists; the run form uses the COPY in the run's own directory, where nothing adjacent loads.
all:
  hosts:
    localhost:
      ansible_connection: local
  children:
    lme_toolchain_targets:
      hosts: {}
    lme_hypervisors:
      hosts: {}
    lme_telemetry_sources:
      hosts: {}
    lme_workload:
      hosts: {}
