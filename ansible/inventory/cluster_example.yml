# ansible/inventory/cluster_example.yml
#
# EXAMPLE 3-node cluster inventory. Copy to ansible/inventory/cluster.yml and edit
# (install.sh:870; testing/v2/development/CLUSTER_COMMANDS.md).
#
# TWO CONFIG MODELS EXIST for these nodes -- both are LIVE. This file keeps them
# consistent except as noted below. Read this before editing:
#
#   1. LEGACY es_* vars (below): es_master_host / es_cluster_seed_hosts /
#      es_node_name / es_publish_host / es_is_initial_master.
#        - install.sh --cluster READS es_cluster_seed_hosts + es_master_host/
#          es_publish_host from this inventory and forwards es_cluster_seed_hosts (and
#          es_master_publish_host, which currently has NO consumer in the tree) as -e
#          to a bare localhost site.yml run (NO -i). It does NOT forward es_node_name,
#          so the load_manifests.yml shim (gated `when: es_node_name is defined`) is
#          INERT on this path and Phase-1 renders ZERO discovery keys (R8-2);
#          host_vars also do not load (no -i).
#        - The load_manifests.yml shim + convert_to_cluster.yml map es_* into the ES
#          environment ONLY on an `-i` run where es_node_name is present in inventory
#          hostvars (e.g. `-i cluster.yml ansible/elasticsearch.yml`, or
#          convert_to_cluster.yml).
#      scripts/create_cluster_inventory.sh emits this same es_* shape.
#
#   2. NEW model in host_vars/es{1,2,3}.yml (lme_profile: cluster +
#      lme_service_overrides.elasticsearch.environment). These AUTO-LOAD by adjacency
#      on ANY `-i` run that uses this file (the same path on which the shim fires) and,
#      per load_manifests.yml, combine LAST -- so the host_vars WIN over the es_* shim
#      (the R8-7 warning in load_manifests.yml).
#
# CONSISTENCY: the es_* values here MATCH host_vars/es{1,2,3}.yml for node.name,
# network.publish_host and discovery.seed_hosts (10.0.0.4/5/6). They DIVERGE on
# cluster.initial_master_nodes -- but that divergence is observable ONLY if an
# operator follows the R8-7 advice and REMOVES the host_vars: the shim then defaults
# initial_master_nodes to just `lme-elasticsearch` on the master (es_is_initial_master)
# and emits nothing on es2/es3, in place of the host_vars' `lme-elasticsearch,es2,es3`
# on all three. Both are valid ES bootstraps but not identical. Keep es_* and
# host_vars in sync if you edit addresses, or drive a real cluster from ONE path only.
all:
  vars:
    # Master node IP (where Kibana/Fleet will run)
    es_master_host: 10.0.0.4

    # All node IPs for cluster discovery
    es_cluster_seed_hosts:
      - 10.0.0.4
      - 10.0.0.5
      - 10.0.0.6

  children:
    elasticsearch:
      hosts:
        # Master node - MUST be first (handles cert generation)
        es1:
          # ansible_host: IP/hostname for Ansible to SSH/connect to this node
          ansible_host: 10.0.0.4
          # ansible_connection: Use 'local' for master (no SSH), 'ssh' for remote nodes
          ansible_connection: local
          # es_node_name: The name this Elasticsearch node uses within the cluster
          es_node_name: lme-elasticsearch
          # es_is_initial_master: Set to true only for the initial master node
          es_is_initial_master: true
          # es_publish_host: IP/hostname this node advertises to other ES nodes
          # This value MUST appear in es_cluster_seed_hosts above
          es_publish_host: 10.0.0.4

        # Cluster node 2
        es2:
          # ansible_host: IP/hostname for Ansible to SSH to this node
          ansible_host: 10.0.0.5
          # ansible_user: SSH username for Ansible to connect as
          ansible_user: ubuntu
          # es_node_name: The name this Elasticsearch node uses within the cluster
          es_node_name: es2
          # es_publish_host: IP/hostname this node advertises to other ES nodes
          # This value MUST appear in es_cluster_seed_hosts above
          es_publish_host: 10.0.0.5

        # Cluster node 3
        es3:
          # ansible_host: IP/hostname for Ansible to SSH to this node
          ansible_host: 10.0.0.6
          # ansible_user: SSH username for Ansible to connect as
          ansible_user: ubuntu
          # es_node_name: The name this Elasticsearch node uses within the cluster
          es_node_name: es3
          # es_publish_host: IP/hostname this node advertises to other ES nodes
          # This value MUST appear in es_cluster_seed_hosts above
          es_publish_host: 10.0.0.6