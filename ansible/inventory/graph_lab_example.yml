---
# ansible/inventory/graph_lab_example.yml
#
# EXAMPLE lab inventory: the physical host `graph` as a remote-harness TARGET (codex-tick302-graph-binding-decisions).
# It does not run anything. It is the committed, non-secret half of a run inventory. MAIN freezes a copy of it next to
# the per-run binding rendered from graph_lab_run_binding.yml.j2, in one run inventory DIRECTORY that is passed as a
# single `-i <dir>` (Ansible merges the files in name order, so the binding overrides this file):
#   <run>/.work/inventory/graph/10-lab.yml       byte copy of this file (its sha256 is recorded in the binding)
#   <run>/.work/inventory/graph/20-binding.yml   rendered binding (testing/e2e/inventory_binding/render_run_binding.yml):
#                                                controller roots, key references, bundle leaf and derived owner
#                                                key paths (frozen, hashed). Observation NEVER feeds the binding.
# Values here are DESIRED configuration and stay overridable through that composition. Nothing here is a credential:
# key material never appears in any inventory file. Only private-file PATH references do, and only in the binding.
#
# DEPLOYMENT IDENTITY (codex-tick360; codex-0445 rule, archive/2026-09-23/2026-09-23-codex-check-0445-decisions.yaml
# :32-38): the lab DECLARATION is here (all.vars), once; the binding never carries it and it is never derived from
# run_id / hostname / config. This is not a claim of exclusive origin: Ansible precedence (an approved operator -e or
# inventory override) can supply the effective value, and such approved overrides are preserved. Every consumer reads
# the EFFECTIVE value through the canonical resolved filter (lme_resolved | lme_validated_deployment_identity; shape
# [A-Za-z0-9_-]+), which validates it. It is logical: it survives a host rename, inventory growth, a guest replacement and a configuration
# revision. It covers NEW owned deployment paths only; it confers no adoption authority over the old development stack.
#
# TOPOLOGY (codex-tick302). Both members are required for a deployment. The prerequisite leg needs only the hypervisor.
#   lme_toolchain_targets  the route's declared target group (profile controller.bootstrap.inventory.target_group).
#                          graph = the physical host. It receives the SAME bundle/seed as the controller, applied by the
#                          declared non-root owner (testing/remote_harness/target_bootstrap.yml).
#   lme_hypervisors        graph also hosts the lab guest. RS owns the guest lifecycle (the ONE hypervisor group).
#   lme_telemetry_sources  graph is also a telemetry source.
#   lme_workload           the Debian 13 guest (the LME workload member). Its alias and identity come from RUNTIME
#                          OBSERVATION (RS). They are supplied only by the per-run binding and never written here.
#                          It is declared EMPTY here on purpose: a deploy leg must refuse an empty workload group.
# The three new group names are PROPOSED (B-graph). They join C1's registry and RS's guest declarations through MAIN.
#
# CONNECTION (profile controller.bootstrap.inventory.connection_profiles; R-B2):
#   owner       lme_toolchain_owner + lme_toolchain_owner_key (target_bootstrap.yml)
#   privileged  user root + lme_privileged_key, MAIN-only (B's legs; testing/remote_harness/target_prereq.yml)
# lme_ssh_auth_mode must equal the seed run mode (--ssh-auth / LME_SSH_AUTH_MODE). explicit_key is codex-decided.
# Both key references live in the binding: rotating a key never needs a source edit.
#
# ADJACENCY: this file sits in ansible/inventory, so host_vars/graph.yml or group_vars/<group>.yml would auto-load on a
# `-i ansible/inventory/graph_lab_example.yml` run. None exists today. The run form above uses a COPY in the run's
# own directory, where nothing adjacent loads.
#
# UNVERIFIED (blocks execution, not authoring): whether Tailscale SSH answers port 22 on graph's tailnet address. If it
# does, authorized_keys and explicit_key are bypassed for that endpoint. target_prereq.yml's read-only preflight
# checks it before any effect and records it (session ancestry: an OpenSSH server process, no tailscaled;
# RH-TARGET-PREREQ-SSH-INTERCEPT). This proves the server process, not which auth method succeeded. On a refusal, ansible_host /
# ansible_port must name an endpoint served by the system sshd (the binding may override it), or a Tailscale SSH
# profile must be explicitly admitted; never substituted silently.
all:
  vars:
    lme_deployment_identity: lme-observability-lab
  hosts:
    localhost:
      ansible_connection: local
  children:
    lme_toolchain_targets:
      hosts:
        graph:
          # address: the tailnet MagicDNS name (EVIDENCE from codex-graph-baseline, not a default). No ansible_port,
          # so ssh_config / the ssh default decides it (ssh_auth composition port rule).
          ansible_host: graph.tail6c2eb6.ts.net
          lme_ssh_auth_mode: explicit_key
          # the dedicated deployment owner (codex-tick302). ansible_user equals the owner, as target_bootstrap requires.
          # B's privileged plays bind user root from their own profile, never from this value.
          lme_toolchain_owner: lme-deploy
          ansible_user: lme-deploy
          # owner roots (codex-tick302): work root W, toolchain root <W>/toolchain, bundle root <W>/bundles.
          # The owner module temp derives as <W>/tmp/ansible-remote (work_roots.sub_roots.tmp / remote_tmp_rel).
          lme_toolchain_root: /data/lme-deploy/observability/toolchain
          # lme_toolchain_bundle_dir: <bundle root>/<leaf>. The leaf is derived from the immutable artifact/config
          # identity and set ONLY by the binding: no overwrite, no moving symlink.
          # ---- DECLARED TARGET INPUTS (controller.bootstrap.inventory.target_inputs roles; registered in the m1-1
          # profile, B-graph J-KEY/TASK 2 20260925). The loader types and binds them into
          # lme_resolved.remote_harness.binding.deployment.target_inputs.graph.<role>; a malformed value makes every
          # harness playbook refuse at resolve on this host. No leg reads them raw. DESIRED configuration (overridable
          # through the run binding). The run binding sets ONLY the run-time / derived roles: the privileged key PATH
          # (run-time reference), the bundle dir (bound bundle root + the run-time leaf) and the owner key paths
          # (DERIVED from the J-KEY location rule, never supplied). Observation never writes inventory: existence,
          # unit states and current path metadata live in the retained observation record. This file is the ONLY
          # place graph's topology and desired values live. ----
          # prerequisite leg (testing/remote_harness/target_prereq.yml; MAIN-only, privileged):
          lme_deploy_owner_shell: /bin/bash                        # prereq_owner_shell
          lme_deploy_owner_home: /home/lme-deploy                  # prereq_owner_home
          lme_deploy_work_root: /data/lme-deploy/observability     # prereq_work_root (toolchain root == <this>/toolchain)
          lme_deploy_bundle_root: /data/lme-deploy/observability/bundles   # prereq_bundle_root
          # the work parent (codex ACCEPTED: a root-owned intermediate as a declared, overridable choice; four STRING
          # roles; target_prereq refuses a path other than dirname(work root) and a mode outside work_parent_rule)
          lme_deploy_work_parent_path: /data/lme-deploy            # prereq_work_parent_path
          lme_deploy_work_parent_owner: root                       # prereq_work_parent_owner
          lme_deploy_work_parent_group: root                       # prereq_work_parent_group
          lme_deploy_work_parent_mode: '0755'                      # prereq_work_parent_mode
          # PRESERVATION SELECTION (codex-tick360; DESIRED lab config, bound as target inputs; decl r4 `preservation`,
          # testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml). Basis = known_set (a hypervisor does NOT imply
          # a non-empty old stack; the basis is stated explicitly). Declared HERE, never in the binding, never derived
          # by filtering observed units to inactive ones.
          # known_set member evidence: lme-elasticsearch.service loaded + INACTIVE on graph with drop-in
          # 90-lme-preserved-pre-observability-20260922.conf -- .communication/archive/2026-09-23/
          # 2026-09-23-claude-tick116-Q-jobs-halted-adhoc-correction.yaml:17 (sha256 fb8082973e3b2b03fc0f220bac58221e6c42de1567058a53f5cde1cc9d3af7e2;
          # DIAGNOSTIC-ONLY, ad hoc busctl; UnitFileState NOT observed); testing/remote_harness/jobs/observations.yml:166-167
          # (sha256 db08c451005cb8ba671b752936ce99041705ee9b5bf3c6454eac48121bbd46eb); .communication/archive/2026-09-23/
          # 2026-09-23-claude-tick114-ack-D1-D2-route-v2-interim-submission.yaml:40 (sha256 5f58521247229d29749844760e3f03235c38a420a3cf7f60f470b10fb7999a1e).
          # Expected state inactive_not_enabled is ASSERTED, not yet evidenced for UnitFileState: MAIN confirms it with
          # testing/e2e/target_prereq/prereq_observe.yml first, then completes / revises this set from that record.
          # NOT declared for lack of a graph observation (repo/teardown citations only): lme-llm-keys.service,
          # lme-identity-serve.service, lme-llama-model.service (+ .path), lme-llama-cpp.service. If present and running they
          # refuse as unclassified; the retirement route (testing/e2e/reclaim native_service_remove) is OBSTRUCTED for
          # graph (no native ledger entry; JOIN-NATIVE-LEDGER-PRODUCER), so an active unit is recorded and refused, never touched.
          # lme_lab_retired_units / lme_lab_verified_no_prior_deployment (registered, profile 2a1eb60c :1511-1512; optional)
          # are deliberately NOT declared: graph's basis is known_set, and verified_none would conflict with it.
          lme_lab_preserved_units: [lme-elasticsearch.service]     # prereq_preserved_units (-> inactive_not_enabled)
          # observation SELECTION (desired config; codex-tick360): the storage paths to qualify and the bounded
          # discovery selector of prior LME units. Read by the privileged observation (prereq_observe.yml, MAIN) and
          # the route's observe.yml through the loader binding; jobs/observations.yml param types path / unit_pattern.
          # obs_prior_dirs is NOT declared yet: it is optional and first consumed by observe.yml O-PRIOR-STATE after
          # bootstrap; the privileged observation records a depth-1 listing of each obs_paths entry as the evidence
          # for that later declaration. The podman graphroot of the NEW deployment lies under /data (work root); the
          # old stack's graphroot is not declared anywhere in source, so it is not listed.
          lme_obs_paths: [/data, /home]                            # obs_paths
          lme_obs_unit_patterns: ['lme-*']                         # obs_unit_patterns
          # GUEST ALLOCATION (graph ONLY, as a member of lme_hypervisors; RS-frozen contract
          # .scratchpad-14bbf94b/RS/guest-join-frozen-r1.yml eae623b1... inventory_allocation_contract; codex-tick364-365 and
          # codex-tick369 ordinary_inventory_choices). Carrier lme_global_override.remote_harness.guest.allocation: registered
          # in global.yml (8997a715) tunable_paths :797, extensible_paths :802, override_only_paths :806 (so it never
          # appears in global/profile or on the controller), typed by contract_admission.guest_allocation :1384-1405
          # (EXACTLY these 13 keys; int_range is TYPE-EXACT, so every integer is an unquoted YAML int).
          # _rh_scoped (lme_manifests.py :3801-3836) validates graph's scope from EVERY host, so a malformed leaf here
          # refuses resolve for every leg on every host.
          # CAPACITY, never reduced to fit: budget = memory_mib + host_headroom_mib = 15360 MiB (host_headroom_mib 2048 is
          # the codex minimum AGGREGATE reservation outside guest RAM: QEMU overhead + host contingency; no second hidden
          # reserve). First path: the target_prereq preflight refuses RH-TARGET-PREREQ-CAPACITY when MemTotal < 15360 MiB
          # or /proc/meminfo is unmeasurable (RS-recorded graph MemTotal 16623480832 B = 15853 MiB, not re-measured:
          # predicted PASS). Provision (RS provision_stages.yml): MemAvailable >= 15360 MiB, re-read immediately before
          # the provision -- PREDICTED TO FAIL unless graph holds < 493 MiB outside the guest; that failure is explicit
          # and typed (GUEST-MEMORY; profile capacity.alternatives: another_hypervisor_member / not_a_hypervisor_member /
          # more_host_memory / raise_budget_and_fail). Never a smaller guest, never a cut headroom, never a bypass.
          # Disk: storage_root avail >= 40 + 256 GiB virtual + 100 GiB reserve (about 396 GiB on /data), checked at provision.
          lme_global_override:
            remote_harness:
              guest:
                allocation:
                  # DECISIONS (codex-tick369 ordinary_inventory_choices; accepted subject to uniqueness and availability).
                  # run_id and name are the guest's LIFECYCLE IDENTITY: stable on an unchanged reapply (a reapply reuses
                  # this guest; they change only through a declared replacement). Distinct across targets
                  # (global.yml :957 distinct_across_targets); graph is the only hypervisor member today.
                  run_id: graph-obs-01                       # patterns.guest_run_id
                  name: lme-guest-01                         # patterns.guest_hostname
                  # forward_port: loopback 127.0.0.1:22022 on graph; availability is checked at provision, not first path.
                  forward_port: 22022                        # int [1024, 65535]
                  # DECLARED values (RS-frozen, codex-tick364-365). vcpus 8 is not measured against graph's CPU count
                  # and not contract-checked beyond >= 1.
                  vcpus: 8
                  memory_mib: 13312                          # 13 GiB exactly
                  host_headroom_mib: 2048                    # >= 2048
                  os_disk_gib: 40
                  data_disk_gib: 256
                  physical_reserve_gib: 100
                  storage_root: /data/lme-e2e                # 0700, owned by lme-deploy (uid AND gid); under storage_mount
                  # storage_mount: the DECLARED EXPECTATION that /data is the real mount point holding storage_root.
                  # MEASURED by MAIN's step-4 privileged observation (prereq_observe.yml obs_paths /data stat chain); the
                  # target_prereq preflight verifies it, and RS admit.yml checks the same device again at provision.
                  # A different measurement refuses; this value is never adjusted to match.
                  storage_mount: /data
                  # PUBLIC-key PATH reference on the CONTROLLER (MAIN confirmed only that it exists). Never read by B,
                  # never key material in inventory or policy; read only by the guest leg (RS admit.yml).
                  privileged_authorized_keys_file: /home/tristan/.ssh/id_ed25519.pub
                  # base_image: DECLARED SLOT, UNBOUND, FAILS CLOSED. The route coordinator's preparation stage produces
                  # the exact Debian 13 generic-cloud qcow2 file name and its sha512 (from the SIGNED upstream SHA512SUMS)
                  # as a verified candidate; the binding is a source edit of THESE two leaves, then a new 10-lab copy
                  # and an explicit binding revision transition. Never invented, never a placeholder hash.
                  # UNTIL BOUND, resolve refuses on EVERY host, for EVERY leg (render, prereq_observe, owner_key,
                  # target_prereq, ...), with:
                  #   lme: remote_harness.guest.allocation.base_image.file fails contract_admission.guest_allocation
                  #   (pattern): must fully match patterns.qcow2_file ...; got None
                  # (the exact-key checks pass; the pattern checks on base_image.file / .sha512 refuse).
                  base_image:
                    file: null                               # patterns.qcow2_file -- UNBOUND
                    sha512: null                             # patterns.sha512_hex (128 lowercase hex) -- UNBOUND
    # ONE hypervisor group (codex: lme_hypervisors; RS gd.hypervisor_group and guest.yml `hosts:` converge on it; no
    # second roster)
    lme_hypervisors:
      hosts:
        graph: {}
      # graph's guest allocation is declared on the graph HOST entry above (lme_global_override.remote_harness.
      # guest.allocation), the ONE per-host carrier; membership here is what makes graph a hypervisor.
    lme_telemetry_sources:
      hosts:
        graph: {}
    lme_workload:
      hosts: {}
