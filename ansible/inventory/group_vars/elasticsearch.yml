---
# ansible/inventory/group_vars/elasticsearch.yml
#
# SKELETON -- shared, group-wide defaults for every host in the `elasticsearch`
# inventory group (a 3-node Elasticsearch cluster). Auto-loaded by Ansible when a
# cluster inventory that defines the `elasticsearch` group is used (e.g.
# ansible/inventory/cluster.yml). Copy alongside your real inventory and edit.
#
# WHY only SCALARS live here and the per-node MAPS live in host_vars:
#   Ansible variable precedence REPLACES (does not deep-merge) a var when a
#   higher-precedence source redefines it -- host_vars beats group_vars. So if
#   `lme_service_overrides` (a dict) were defined BOTH here and in host_vars, the
#   host_vars copy would REPLACE this one wholesale and the shared keys would be
#   lost. Therefore: shared scalars (lme_profile) here; the full per-node
#   `lme_service_overrides` map in each host_vars/<node>.yml (self-contained).

# Select the multi-node manifest profile for the whole group. This is the SINGLE
# source of the static cluster ES settings; it makes load_manifests.yml overlay
# manifests/profiles/cluster.yml onto the elasticsearch service + lme_global:
#   * discovery.type dropped (no single-node) via the null-env-skip mechanism
#   * transport port 9300 published in addition to 9200
#   * JVM heap 8g and derived MemoryHigh=12G / MemoryMax=16G (B1, unconditional)
# The per-node discovery keys are supplied by host_vars (see below).
lme_profile: cluster
