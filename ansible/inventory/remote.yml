# ansible/inventory/remote.yml
#
# Template for deploying a REMOTE Elasticsearch node, e.g.
#   ansible-playbook -i ansible/inventory/remote.yml ansible/elasticsearch.yml -K
#
# The `elasticsearch` group selects the CLUSTER manifest profile group-wide
# (ansible/inventory/group_vars/elasticsearch.yml -> lme_profile: cluster), so any
# host placed here deploys as a cluster ES node, NOT single-node.
#
# HOST NAMING (R8-7 clobber avoidance): Ansible auto-loads host_vars/<name>.yml by
# ADJACENCY to this inventory directory. The example host_vars carry cluster config:
# es1.yml / es2.yml / es3.yml hold placeholder per-node discovery (10.0.0.4-6) and
# trixie.yml holds a GAP-3 `lme_host_services` roster that silently scopes which
# units render on the host. A host named `es1`/`es2`/`es3`/`trixie` here would
# SILENTLY inherit that file (wrong IPs / peers that do not exist in this inventory,
# or an unintended service roster) -- so this template uses a NON-colliding name.
#
# BEFORE a real run you MUST create ansible/inventory/host_vars/<your-host>.yml with
# this node's per-node overrides (node.name, network.publish_host,
# discovery.seed_hosts, cluster.initial_master_nodes) -- copy host_vars/es1.yml (an
# initial master) or es2.yml (a data node) as the template and edit the addresses.
# Without it the node gets the cluster profile but ZERO discovery keys and ES fails
# its bootstrap check; do NOT deploy this template unedited.
all:
  children:
    elasticsearch:
      hosts:
        lme-remote1:
          ansible_host: 10.1.0.5
          ansible_user: admin

    # Future expansion:
    # kibana:
    #   hosts:
    #     kibana1:
    #       ansible_host: 10.0.0.6
