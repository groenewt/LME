---
# =============================================================================
# Play 0: PRE-MUTATION VALIDATION BARRIER (B-owned; C1-OTHER-CALLER-PREFLIGHT).
#
# Mirrors ansible/elasticsearch.yml's committed pre-mutation barrier onto this caller.
# upgrade_lme.yml is a single localhost play, so "all-host" is one host; the barrier
# still mints per-invocation evidence and resolves+validates BEFORE the earliest
# mutation (the "Upgrade LME" play's first task, setup_lme_scripts.yml at ~line 29,
# which writes /opt/lme/scripts). A dedicated pre-play (become:false, gather_facts:false)
# keeps the read-only barrier cleanly separated from the become:yes mutating play, per
# elasticsearch.yml's shape (codex-0700: do NOT copy the incomplete site.yml pre_task
# barrier).
#
# OBSERVATION-DEPENDENT RESOLUTION (why this barrier gathers two stats). upgrade's
# resolved config depends on host OBSERVATIONS: install_elastic_services (registry
# default:false) is observed from the installed apm-server quadlet, and offline_mode
# from the on-disk marker (see the main play ~148-193). A barrier that resolved WITHOUT
# them would validate the WRONG config (a pack-installed host would resolve as disabled)
# AND record a revision that could never match the main play's. So the barrier gathers
# the SAME two READ-ONLY stats and builds the SAME namespaced lme_inputs before calling
# the SHARED resolver (tasks_from: resolve -> validate_resolved_config.yml), exactly the
# entrypoint the main play uses at ~196. The stats are read-only and independent of the
# main play's podman detection, so gathering them first mutates nothing.
#
# NB the resolver captures _lme_operator_selections ONCE (pristine); this barrier's
# resolve makes that capture (empty -- upgrade defines NO registry field as a bare play
# var, comment ~171), and the main play's resolve reuses it and composes the SAME
# observations, so both resolve the SAME revision (the Phase 0 -> main-play parity assert
# below relies on this). HONEST RESIDUAL: lme_resolved_revision is the config-only
# revision (C1-COMPLETE-RESOLVED-REVISION, open).
# =============================================================================
- name: "Phase 0: Pre-mutation resolve+validate barrier (fail-closed before any mutation)"
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  # Explicit LINEAR strategy so any_errors_fatal is honored regardless of a global
  # strategy (codex-0915: do not rely on the global strategy).
  strategy: linear
  any_errors_fatal: true
  vars:
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
  tasks:
    - name: Barrier -- reject a pre-supplied / carried validation token, evidence or capture
      ansible.builtin.assert:
        that:
          - _lme_upgrade_barrier_run_token is not defined
          - _lme_upgrade_prevalidated is not defined
          # Also refuse a foreign token from a chained site.yml/elasticsearch.yml play.
          - _lme_es_barrier_run_token is not defined
          - _lme_es_prevalidated is not defined
          - _lme_site_barrier_run_token is not defined
          - _lme_prevalidated is not defined
          # A carried pristine operator-selection capture would validate a STALE capture;
          # the barrier's own resolve mints it fresh.
          - _lme_operator_selections is not defined
          # lme_resolved_revision is OUTPUT-ONLY; an -e value would forge both the evidence
          # and the parity comparison.
          - lme_resolved_revision is not defined
        fail_msg: >-
          A barrier token / prevalidated evidence / _lme_operator_selections /
          lme_resolved_revision must NOT be pre-supplied (-e) or carried from a prior play --
          the barrier mints its own per-invocation evidence and resolves its own revision.
        quiet: true

    - name: Barrier -- mint this invocation's validation token (run_once)
      ansible.builtin.set_fact:
        _lme_upgrade_barrier_run_token: "upgrade-barrier-{{ lookup('pipe', 'date +%s%N') }}-{{ 999999999 | random }}"
      run_once: true

    # Read-only observations the resolver needs (SAME paths/registers as the main play).
    - name: Barrier -- detect whether the optional Elastic services pack is installed
      ansible.builtin.stat:
        path: /etc/containers/systemd/lme-apm-server.container
      register: elastic_pack_quadlet

    - name: Barrier -- detect offline-mode marker for this upgrade
      ansible.builtin.stat:
        path: /opt/lme/OFFLINE_MODE
      register: offline_marker

    - name: Barrier -- load the config registry field list for caller-input construction
      ansible.builtin.include_vars:
        file: "{{ clone_directory }}/manifests/global.yml"
        name: _upg_global_file

    - name: Barrier -- build namespaced resolver inputs (selections operator-only; observations separate)
      ansible.builtin.set_fact:
        lme_inputs: >-
          {{ {'selections': dict(_upg_sel_keys | zip(_upg_sel_keys | map('extract', vars) | list)),
              'observations': {'install_elastic_services': elastic_pack_quadlet.stat.exists,
                               'offline_mode': offline_marker.stat.exists},
              'origins': {}} }}
      vars:
        _upg_reg_keys: "{{ _upg_global_file.lme_config_registry.fields.keys() | list }}"
        _upg_sel_keys: "{{ _upg_reg_keys | select('in', vars) | list }}"

    - name: Barrier -- resolve+validate declared config (shared resolver; the SAME entrypoint the main play uses)
      ansible.builtin.include_role:
        name: podman
        tasks_from: resolve

    - name: Barrier -- record this invocation's pre-mutation validation evidence (token + resolved revision)
      ansible.builtin.set_fact:
        _lme_upgrade_prevalidated:
          token: "{{ _lme_upgrade_barrier_run_token }}"
          revision: "{{ lme_resolved_revision }}"

    - name: Barrier -- validation completed THIS invocation before any mutation
      ansible.builtin.assert:
        that:
          - (ansible_play_hosts_all | difference(ansible_play_hosts)) | length == 0
          - >-
            (ansible_play_hosts | map('extract', hostvars)
             | map(attribute='_lme_upgrade_prevalidated', default={})
             | selectattr('token', 'defined')
             | selectattr('token', 'equalto', _lme_upgrade_barrier_run_token)
             | selectattr('revision', 'defined')
             | list | length) == (ansible_play_hosts | length)
        fail_msg: >-
          pre-mutation validation did not complete this invocation
          (token {{ _lme_upgrade_barrier_run_token }}). No mutation proceeds until it does.
        quiet: true
      run_once: true

- name: Upgrade LME
  hosts: localhost
  connection: local
  become: yes
  vars:
    # Common variables
    clone_directory: "{{ clone_dir | default(playbook_dir + '/..') }}"
    install_user: "{{ ansible_user_id }}"
    new_lme_version: "2.3.0"
    
    # Backup timestamp - set once and used throughout
    backup_timestamp: "{{ ansible_date_time.year }}-{{ ansible_date_time.month }}-{{ ansible_date_time.day }}_{{ ansible_date_time.hour }}-{{ ansible_date_time.minute }}"
    
    # Directory configuration
    config_dir: "/etc/lme"
    env_file_path: "/opt/lme/lme-environment.env"
    
    # Elasticsearch configuration
    es_port: 9200
    kibana_port: 5601
    fleet_port: 8220
    
    # Container versions - will be derived from containers.txt
    containers_file: "{{ playbook_dir }}/../config/containers.txt"
    
  tasks:
    - name: Ensure /opt/lme/scripts has the latest helper scripts before upgrade
      ansible.builtin.include_tasks: tasks/setup_lme_scripts.yml

    - name: Check if config containers file exists
      stat:
        path: "{{ containers_file }}"
      register: containers_file_stat
      
    - name: Fail if containers file doesn't exist
      fail:
        msg: "Containers file not found at {{ containers_file }}"
      when: not containers_file_stat.stat.exists

    - name: Check if this is a cluster installation
      ansible.builtin.shell: |
        if [ -f /etc/containers/systemd/lme-elasticsearch.container ]; then
          grep -c 'discovery.type=single-node' /etc/containers/systemd/lme-elasticsearch.container || echo "0"
        else
          echo "missing"
        fi
      args:
        executable: /bin/bash
      register: cluster_mode_check
      changed_when: false

    - name: Warn and fail if this is a cluster installation
      fail:
        msg: |
          This installation appears to be running in CLUSTER mode
          (discovery.type=single-node was not found in the Elasticsearch quadlet).

          The upgrade_lme.yml playbook is designed for single-node installations only.
          For cluster upgrades, use the rolling upgrade playbook instead:

            ansible-playbook -i ansible/inventory/cluster.yml ansible/rolling_upgrade.yml

          See also: testing/v2/development/converting_to_cluster.md
      when:
        - cluster_mode_check.stdout | trim != "missing"
        - cluster_mode_check.stdout | trim | int == 0

    - name: Read container versions from file
      set_fact:
        container_versions: "{{ lookup('file', containers_file).splitlines() }}"
      
    - name: Display container file contents
      debug:
        msg: "Container file contents: {{ container_versions }}"
        
    - name: Verify container file format
      fail:
        msg: |
          The containers file at {{ containers_file }} does not contain the required container definitions.
          Expected to find containers for elasticsearch, kibana, wazuh, and elastalert.
          Please check the file format and contents.
          
          Current contents:
          {% for container in container_versions %}
          - {{ container }}
          {% endfor %}
      when: >
        container_versions | select('search', 'elasticsearch') | list | length == 0 or
        container_versions | select('search', 'kibana') | list | length == 0 or
        container_versions | select('search', 'wazuh') | list | length == 0 or
        container_versions | select('search', 'elastalert') | list | length == 0
        
    - name: Determine podman command location
      shell: |
        # Check multiple locations for podman
        if command -v podman >/dev/null 2>&1; then
          echo "podman"
        elif [ -x "/nix/var/nix/profiles/default/bin/podman" ]; then
          echo "/nix/var/nix/profiles/default/bin/podman"
        elif [ -x "/usr/local/bin/podman" ]; then
          echo "/usr/local/bin/podman"
        else
          echo "ERROR: podman command not found in any expected location" >&2
          echo "Checked locations:" >&2
          echo "- Standard PATH: $(which podman 2>/dev/null || echo 'not found')" >&2
          echo "- Nix location: /nix/var/nix/profiles/default/bin/podman" >&2
          echo "- Symlink location: /usr/local/bin/podman" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_env.PATH }}:/nix/var/nix/profiles/default/bin"
      register: podman_cmd_result
      
    - name: Check if podman symlink exists
      stat:
        path: "/usr/local/bin/podman"
      register: podman_symlink_stat
      
    - name: Check if nix podman exists
      stat:
        path: "/nix/var/nix/profiles/default/bin/podman"
      register: nix_podman_stat
      
    - name: Create podman symlink if needed and nix podman exists
      file:
        src: "/nix/var/nix/profiles/default/bin/podman"
        dest: "/usr/local/bin/podman"
        state: link
        force: yes
      when: 
        - not podman_symlink_stat.stat.exists
        - nix_podman_stat.stat.exists
      ignore_errors: yes
      
    - name: Set podman command variable
      set_fact:
        podman_cmd: "{{ podman_cmd_result.stdout }}"
        
    - name: Display podman command location
      debug:
        msg: "Using podman from: {{ podman_cmd }}"
        
    - name: Detect whether the optional Elastic services pack is installed
      stat:
        path: /etc/containers/systemd/lme-apm-server.container
      register: elastic_pack_quadlet

    # Hoisted UP (was stat'd just before the render include) so BOTH detected
    # observations exist before the shared resolver runs. The resolve point is
    # AFTER both stats and BEFORE the first resolved-key consumer, so it covers the
    # enablement debug below AND the pack pull/tag gates further down.
    - name: Detect offline-mode marker for this upgrade
      stat:
        path: /opt/lme/OFFLINE_MODE
      register: offline_marker

    # --- CR-B1: consume the C1 caller-INPUT resolver contract ------------------
    # upgrade no longer re-derives enablement with its own set_facts. It builds the
    # NAMESPACED lme_inputs that the shared resolver (roles/podman/tasks/resolve.yml)
    # expects, keeping DETECTED state (observations) strictly SEPARATE from operator
    # SELECTIONS so detection ranks at the observation tier (below profile), NOT
    # falsely as an operator -e (the auto-normalize bug this migration removes).
    #
    # selections: captured registry-derived from the bare scope BEFORE the resolve
    #   include -- podman role defaults are NOT in scope yet, so only operator
    #   -e / inventory values for a declared field appear. This reads the SAME field
    #   list the registry declares (no parallel roster; global.yml forbids one). The
    #   upgrade play defines NO registry field as a play var, so nothing here can
    #   mistake a play default for an operator selection (the convert:386 trap).
    # observations: ONLY the two upgrade_fallback:true fields
    #   (install_elastic_services <- installed-pack quadlet; offline_mode <- on-disk
    #   marker). install_llm is NEVER observed (upgrade_fallback:false), and NO
    #   profile is inferred from the marker (that would let the offline profile's
    #   install_elastic_services:false shadow a detected pack at tier-3).
    # origins: {} -- the loader honestly labels a natively-selected value 'operator'.
    - name: Load the config registry field list for caller-input construction
      ansible.builtin.include_vars:
        file: "{{ clone_directory }}/manifests/global.yml"
        name: _upg_global_file

    - name: Build namespaced resolver inputs (selections operator-only; observations separate)
      ansible.builtin.set_fact:
        lme_inputs: >-
          {{ {'selections': dict(_upg_sel_keys | zip(_upg_sel_keys | map('extract', vars) | list)),
              'observations': {'install_elastic_services': elastic_pack_quadlet.stat.exists,
                               'offline_mode': offline_marker.stat.exists},
              'origins': {}} }}
      vars:
        _upg_reg_keys: "{{ _upg_global_file.lme_config_registry.fields.keys() | list }}"
        _upg_sel_keys: "{{ _upg_reg_keys | select('in', vars) | list }}"

    - name: Early-resolve declared config before the first resolved-key consumer
      ansible.builtin.include_role:
        name: podman
        tasks_from: resolve

    # PARITY GATE (B-owned, defense-in-depth): the Phase 0 barrier resolved+validated
    # this SAME config (same read-only observations) before any mutation. Confirm the
    # barrier ran this invocation and the main-play resolve matches its recorded revision
    # BEFORE the heavy destructive upgrade steps (image pulls, unit re-render, container
    # recreation) further down. setup_lme_scripts.yml (the only pre-resolve mutation) is
    # already fronted by the Phase 0 barrier; this additionally fails closed on drift
    # between validation and the destructive phase.
    - name: Parity gate -- barrier validated THIS exact config this invocation (fail-closed)
      ansible.builtin.assert:
        that:
          - _lme_upgrade_prevalidated is defined
          - (_lme_upgrade_prevalidated.token | default('')) == (_lme_upgrade_barrier_run_token | default('__barrier_did_not_run__'))
          - (_lme_upgrade_prevalidated.revision | default('')) == lme_resolved_revision
        fail_msg: >-
          No matching Phase 0 pre-mutation validation evidence for THIS upgrade (expected token
          {{ _lme_upgrade_barrier_run_token | default('UNSET -- barrier play did not run') }} and
          resolved revision {{ lme_resolved_revision }}). Refusing the destructive upgrade phase.
        quiet: true

    - name: Display resolved optional-stack enablement (with provenance)
      debug:
        msg: >-
          Elastic services pack: {{ 'enabled' if lme_enable_flags.install_elastic_services else 'disabled' }}
          (origin {{ lme_resolved_origins.install_elastic_services }});
          LLM stack: {{ 'enabled' if lme_enable_flags.install_llm else 'disabled' }}
          (origin {{ lme_resolved_origins.install_llm }});
          offline_mode: {{ lme_enable_flags.offline_mode }}
          (origin {{ lme_resolved_origins.offline_mode }})

    - name: Extract container versions
      set_fact:
        elasticsearch_image: "{{ container_versions | select('search', 'elasticsearch') | first }}"
        kibana_image: "{{ container_versions | select('search', 'kibana') | first }}"
        wazuh_image: "{{ container_versions | select('search', 'wazuh') | first }}"
        elastalert_image: "{{ container_versions | select('search', 'elastalert') | first }}"
        
    - name: Extract version numbers
      set_fact:
        elasticsearch_version: "{{ elasticsearch_image | regex_replace('^.*:(.*)', '\\1') }}"
        kibana_version: "{{ kibana_image | regex_replace('^.*:(.*)', '\\1') }}"
        wazuh_version: "{{ wazuh_image | regex_replace('^.*:(.*)', '\\1') }}"
        elastalert_version: "{{ elastalert_image | regex_replace('^.*:(.*)', '\\1') }}"
        
    - name: Display container versions
      debug:
        msg: |
          Container versions from {{ containers_file }}:
          - Elasticsearch: {{ elasticsearch_version }} ({{ elasticsearch_image }})
          - Kibana: {{ kibana_version }} ({{ kibana_image }})
          - Wazuh: {{ wazuh_version }} ({{ wazuh_image }})
          - ElastAlert: {{ elastalert_version }} ({{ elastalert_image }})
        
    - name: Check if environment file exists
      stat:
        path: "{{ env_file_path }}"
      register: env_file
      
    - name: Fail if environment file doesn't exist
      fail:
        msg: "Environment file not found at {{ env_file_path }}"
      when: not env_file.stat.exists
      
    - name: Read environment file
      include_tasks: tasks/load_env.yml
      
    - name: Set current LME version variable
      set_fact:
        current_lme_version: "{{ env_dict.LME_VERSION | default('2.0.0') }}"

    - name: Display current version information
      debug:
        msg: "Current LME version: {{ current_lme_version }}, target version: {{ new_lme_version }}"

    - name: Check upgrade requirements
      block:
        - name: Check if upgrade is needed
          shell: |
            if [[ "{{ current_lme_version }}" == "Not set" || "{{ current_lme_version }}" == "2.0.0" ]]; then
              # No version or unset version, upgrade needed
              echo "Upgrade needed: No current version set"
              exit 0
            else
              # Compare versions using sort -V (natural version sort)
              if [[ "{{ current_lme_version }}" == "{{ new_lme_version }}" ]]; then
                # Same version - no upgrade needed
                exit 2
              elif [[ "$(echo -e "{{ current_lme_version }}\n{{ new_lme_version }}" | sort -V | head -n 1)" == "{{ current_lme_version }}" ]]; then
                # Current version is lower than new version
                echo "Upgrade needed: Current version {{ current_lme_version }} is lower than new version {{ new_lme_version }}"
                exit 0
              else
                # Current version is higher - downgrade not allowed
                echo "ERROR: Downgrade not allowed. Current version {{ current_lme_version }} is higher than requested version {{ new_lme_version }}"
                exit 3
              fi
            fi
          args:
            executable: /bin/bash
          register: upgrade_check
          changed_when: false
          failed_when: upgrade_check.rc == 3
          
        - name: Print nice message for no upgrade needed
          debug:
            msg: "No upgrade needed: Current version ({{ current_lme_version }}) already matches target version ({{ new_lme_version }})"
          when: upgrade_check.rc == 2
          
        - name: End playbook if no upgrade needed
          meta: end_play
          when: upgrade_check.rc == 2

      rescue:
        - name: Fail with clear downgrade message
          fail:
            msg: "ERROR: Downgrade not allowed. Current version {{ current_lme_version }} is higher than requested version {{ new_lme_version }}"

    - name: Get valid backup choice
      pause:
        prompt: |
          {% if backup_choice_loop is defined and backup_choice_loop.user_input is defined %}
          Invalid input '{{ backup_choice_loop.user_input }}'. Please enter y/yes or n/no.
          {% endif %}
          Do you want to create a backup before upgrading? (y/yes/n/no)
          This is highly recommended in case you need to rollback.
      register: backup_choice_loop
      until: backup_choice_loop.user_input | lower in ['y', 'yes', 'n', 'no']
      retries: 999
      delay: 0
      when: skip_prompts is not defined or not skip_prompts | bool
      
    - name: Set backup choice (interactive)
      set_fact:
        backup_choice: "{{ backup_choice_loop.user_input | lower }}"
      when: skip_prompts is not defined or not skip_prompts | bool
      
    - name: Set backup choice (automated - no backup)
      set_fact:
        backup_choice: "n"
      when: skip_prompts is defined and skip_prompts | bool
      
    - name: Display backup in progress message
      debug:
        msg: "Starting LME backup process before upgrade. This may take a few minutes..."
      when: backup_choice in ['y', 'yes']
        
    # backup_lme now fails closed on an unclean pre-op backup (D3b hardening in the
    # D-exclusive role, which is NOT edited here). Wrap only the CALLER side so an
    # aborted backup is legible: the role stops the containers before copying and we
    # pass skip_service_restart, so a failure most likely leaves LME stopped and no
    # upgrade change has been made yet. Re-fail after the message so the upgrade
    # still aborts -- never proceed to stop/re-render on an unverified backup.
    - name: Run pre-upgrade backup (fail-closed; caller-side interrupted-backup legibility)
      block:
        - name: Run backup
          include_role:
            name: backup_lme
          vars:
            skip_prompts: true  # Skip prompts during automated backup
            skip_service_restart: true  # Leave services stopped for upgrade operations
      rescue:
        - name: Report the interrupted/failed pre-upgrade backup and abort
          ansible.builtin.fail:
            msg: |
              The pre-upgrade backup FAILED or was interrupted before completing cleanly,
              so the upgrade has been ABORTED. No service, unit, image or config changes
              have been made yet (only helper scripts under /opt/lme/scripts were refreshed).

              State to expect:
                * backup_lme stops the LME containers before copying and this run passed
                  skip_service_restart, so LME is most likely STOPPED right now.
                  Restore service with:  sudo systemctl start lme
                * Any partial backup is under /opt/lme/backup/ -- see the backup task
                  output above for the exact timestamped directory and which
                  component/volume failed.

              Recovery:
                * Resolve the cause reported above (e.g. free disk space, an unclean
                  container stop, or an unreadable volume), confirm LME is healthy, then
                  re-run:  ansible-playbook ansible/upgrade_lme.yml
      when: backup_choice in ['y', 'yes']

    - name: Stop LME service when backup is skipped
      systemd:
        name: lme
        state: stopped
      when: backup_choice in ['n', 'no']
      
    - name: Stop LME service when backup was done
      systemd:
        name: lme
        state: stopped
      when: backup_choice in ['y', 'yes']
      
    - name: Wait for containers to stop
      shell: |
        {{ podman_cmd }} ps -a --format "{{ '{{' }}.Names{{ '}}' }}" | grep -E "lme" || true
      args:
        executable: /bin/bash
      register: running_containers
      until: running_containers.stdout_lines | length == 0
      retries: 12
      delay: 5
      ignore_errors: yes
    
    - name: Copy containers.txt to /opt/lme/config
      copy:
        src: "{{ clone_directory }}/config/containers.txt"
        dest: "/opt/lme/config/containers.txt"
        remote_src: yes
      register: containers_copied

    - name: Remove old elasticsearch repo path for > 8.0.0 upgrade
      lineinfile:
        path: /opt/lme/config/elasticsearch.yml
        line: "    - /usr/share/elasticsearch"
        state: absent
      register: elasticsearch_config_updated
      
    - name: Display configuration updates
      debug:
        msg: |
          Configuration updates completed:
          - Containers file: {{ 'Updated' if containers_copied.changed else 'No changes needed' }}
          - Elasticsearch config: {{ 'Updated (removed old repo path)' if elasticsearch_config_updated.changed else 'Already correct' }}

    - name: Update STACK_VERSION in environment file
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^STACK_VERSION="
        line: "STACK_VERSION={{ elasticsearch_version }}"
      register: stack_version_updated
      
    - name: Set FLEET_ENROLL=1 for upgrade enrollment
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^FLEET_ENROLL="
        line: "FLEET_ENROLL=1"
        insertafter: EOF
        state: present
      register: fleet_enroll_updated
        
    - name: Set FLEET_SERVER_ENABLE=1 for upgrade enrollment
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^FLEET_SERVER_ENABLE="
        line: "FLEET_SERVER_ENABLE=1"
        insertafter: EOF
        state: present
      register: fleet_server_enable_updated
        
    - name: Set KIBANA_FLEET_SETUP=1 for upgrade enrollment
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^KIBANA_FLEET_SETUP="
        line: "KIBANA_FLEET_SETUP=1"
        insertafter: EOF
        state: present
      register: kibana_fleet_setup_updated
        
    - name: Pull new container images
      shell: |
        {{ podman_cmd }} pull {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ lookup('file', clone_directory + '/config/containers.txt').splitlines() }}"
      register: pull_result
      retries: 3
      delay: 5
      until: pull_result is not failed
      ignore_errors: yes
      
    - name: Display container pull errors
      debug:
        msg: "Failed to pull container: {{ item.item }}"
      loop: "{{ pull_result.results }}"
      when: item is failed
      loop_control:
        label: "{{ item.item }}"
        
    - name: Tag new containers
      shell: |
        {{ podman_cmd }} image tag {{ item }} {{ item.split('/')[-1].split(':')[0] }}:LME_LATEST
      args:
        executable: /bin/bash
      loop: "{{ lookup('file', clone_directory + '/config/containers.txt').splitlines() }}"
      register: tag_result
      retries: 3
      delay: 5
      until: tag_result is not failed
      ignore_errors: yes
      
    - name: Display container tag errors
      debug:
        msg: "Failed to tag container: {{ item.item }}"
      loop: "{{ tag_result.results }}"
      when: item is failed
      loop_control:
        label: "{{ item.item }}"

    - name: Pull elastic services container images
      shell: |
        {{ podman_cmd }} pull {{ item }}
      args:
        executable: /bin/bash
      loop: "{{ lookup('file', clone_directory + '/config/containers-elastic-services.txt').splitlines() | select('match', '^[^#].*') | reject('match', '^\\s*$') | list }}"
      register: pull_elastic_result
      retries: 3
      delay: 5
      until: pull_elastic_result is not failed
      ignore_errors: yes
      when: lme_enable_flags.install_elastic_services

    - name: Display elastic services container pull errors
      debug:
        msg: "Failed to pull container: {{ item.item }}"
      loop: "{{ pull_elastic_result.results | default([]) }}"
      when: item is failed
      loop_control:
        label: "{{ item.item }}"

    - name: Tag elastic services containers
      shell: |
        {{ podman_cmd }} image tag {{ item }} {{ item.split('/')[-1].split(':')[0] }}:LME_LATEST
      args:
        executable: /bin/bash
      loop: "{{ lookup('file', clone_directory + '/config/containers-elastic-services.txt').splitlines() | select('match', '^[^#].*') | reject('match', '^\\s*$') | list }}"
      register: tag_elastic_result
      retries: 3
      delay: 5
      until: tag_elastic_result is not failed
      ignore_errors: yes
      when: lme_enable_flags.install_elastic_services

    - name: Display elastic services container tag errors
      debug:
        msg: "Failed to tag container: {{ item.item }}"
      loop: "{{ tag_elastic_result.results | default([]) }}"
      when: item is failed
      loop_control:
        label: "{{ item.item }}"
        
    - name: Remove fleet-server data volume to prevent version mismatch
      shell: |
        echo "Removing lme_fleet_data volume to ensure fleet-server uses fresh container binaries..."
        {{ podman_cmd }} volume rm lme_fleet_data || true
      args:
        executable: /bin/bash
      register: volume_removal_result
      ignore_errors: yes
      
    - name: Display fleet volume removal result
      debug:
        msg: |
          Fleet data volume removal: {{ 'SUCCESS' if volume_removal_result.rc == 0 else 'INFO - Volume may not exist or already removed' }}
          This ensures fleet-server will use the correct container version binaries.
        
    # ============================================================
    # AI Stack Deployment (LME 2.3.0 — upgrade from 2.x)
    # @decision: AI stack is deployed additively during upgrade.
    #   Secrets use file driver (not shell) to avoid ansible-vault
    #   password prompts. Certs are generated by the lme-setup-certs
    #   container (via updated instances.yml and init-setup.sh) to
    #   preserve correct user-namespace ownership on the volume.
    # ============================================================
    - name: Deploy AI Stack components (upgrade from pre-2.3.0)
      block:
        - name: Create AI stack directories
          file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0755'
          loop:
            - /opt/lme/llama-models
            - /opt/lme/config
            - /opt/lme/lme-dashboard

        - name: Create pgvector secret (file driver)
          shell: |
            {{ podman_cmd }} secret ls | grep -q pgvector && echo "exists" && exit 0
            password=$(</dev/urandom tr -dc A-Za-z0-9 | head -c30)
            echo -n "$password" | {{ podman_cmd }} secret create --driver file pgvector -
            echo "created"
          args:
            executable: /bin/bash
          register: pgvector_secret

        - name: Create llm-keys secret (file driver)
          shell: |
            {{ podman_cmd }} secret ls | grep -q llm-keys && echo "exists" && exit 0
            echo -n "placeholder" | {{ podman_cmd }} secret create --driver file llm-keys -
            echo "created"
          args:
            executable: /bin/bash
          register: llm_keys_secret

        # --- Offline (air-gapped) artifact staging (fail-closed) ---------------
        # When offline_mode resolves true, the AI-stack images and GGUF models come
        # from the prepared offline bundle, NOT upstream. This mirrors the canonical
        # fresh-install path exactly rather than inventing a mechanism:
        #   * images -> load_offline_containers.yml (the SAME file container_setup.yml
        #     uses) runs offline_resources/load_containers.sh, which `podman load`s
        #     every image tar and retags it to its localhost/<name>:LME_LATEST local
        #     ref -- the exact ref the online pulls/builds below tag to.
        #   * models -> load_offline_llm.yml (the SAME file llama_cpp_setup.yml uses)
        #     copies the two GGUFs from offline_resources/models/.
        # Both fail CLOSED if the artifacts are absent (the load script errors; the
        # model copy errors), so a missing/incomplete bundle stops the upgrade HERE
        # instead of the later fail-closed is-active assert firing after services are
        # already stopped and units re-rendered. A bare `when: not offline_mode` skip
        # of the pulls would be a silent false-success hole -- explicitly avoided.
        # NB load_offline_containers loads the WHOLE image set (core + elastic + llm),
        # so inside this install_llm-gated block the offline CORE-image realization
        # now rides install_llm; the online core pulls above keep their own path.
        - name: Stage AI-stack images from the offline bundle (airgap; fail-closed)
          ansible.builtin.include_role:
            name: podman
            tasks_from: load_offline_containers
          when: offline_mode | default(false) | bool

        # load_containers.sh loads whatever the bundle CONTAINS: a bundle prepared
        # without --llm loads cleanly yet leaves the AI images missing. Assert each
        # llm-group local ref (derived from the resolver-loaded global manifest, NOT a
        # hand list) is present so that gap fails HERE. No ignore_errors -> fail-closed.
        - name: Assert every offline-staged LLM image is present (fail-closed; bundle may omit --llm)
          shell: |
            export PATH=$PATH:/nix/var/nix/profiles/default/bin
            {{ podman_cmd }} image exists {{ item.value.local | quote }}
          args:
            executable: /bin/bash
          changed_when: false
          loop: "{{ _lme_global_file.lme_global.images | dict2items
                    | selectattr('value.group', 'defined')
                    | selectattr('value.group', 'equalto', 'llm') | list }}"
          loop_control:
            label: "{{ item.key }} ({{ item.value.local }})"
          when: offline_mode | default(false) | bool

        - name: Stage LLM GGUF models from the offline bundle (airgap; fail-closed)
          ansible.builtin.include_role:
            name: podman
            tasks_from: load_offline_llm
          when: offline_mode | default(false) | bool

        - name: Pull llama.cpp container image
          shell: "{{ podman_cmd }} pull ghcr.io/ggml-org/llama.cpp:server"
          args:
            executable: /bin/bash
          register: pull_llama
          retries: 3
          delay: 5
          until: pull_llama is not failed
          when: not (offline_mode | default(false) | bool)

        - name: Tag llama.cpp container image
          shell: "{{ podman_cmd }} image tag ghcr.io/ggml-org/llama.cpp:server localhost/llama-cpp:LME_LATEST"
          args:
            executable: /bin/bash
          when: not (offline_mode | default(false) | bool)

        - name: Pull LiteLLM container image
          shell: "{{ podman_cmd }} pull ghcr.io/berriai/litellm:main-latest"
          args:
            executable: /bin/bash
          register: pull_litellm
          retries: 3
          delay: 5
          until: pull_litellm is not failed
          when: not (offline_mode | default(false) | bool)

        - name: Tag LiteLLM container image
          shell: "{{ podman_cmd }} image tag ghcr.io/berriai/litellm:main-latest localhost/litellm:LME_LATEST"
          args:
            executable: /bin/bash
          when: not (offline_mode | default(false) | bool)

        - name: Pull pgvector container image
          shell: "{{ podman_cmd }} pull docker.io/pgvector/pgvector:pg17"
          args:
            executable: /bin/bash
          register: pull_pgvector
          retries: 3
          delay: 5
          until: pull_pgvector is not failed
          when: not (offline_mode | default(false) | bool)

        - name: Tag pgvector container image
          shell: "{{ podman_cmd }} image tag docker.io/pgvector/pgvector:pg17 localhost/pgvector:LME_LATEST"
          args:
            executable: /bin/bash
          when: not (offline_mode | default(false) | bool)

        # Offline: prepare_offline.sh pre-builds these two build-type images into the
        # bundle, so the offline load above already realized them; the local build is
        # online-only.
        - name: Build LME Dashboard container image
          shell: |
            cd {{ clone_directory }}/lme-dashboard
            {{ podman_cmd }} build -t localhost/lme-dashboard:LME_LATEST .
          args:
            executable: /bin/bash
          register: build_dashboard
          when: not (offline_mode | default(false) | bool)

        - name: Build LME Log Analyzer container image
          shell: |
            cd {{ clone_directory }}/lme-log-analyzer
            {{ podman_cmd }} build -t localhost/lme-log-analyzer:LME_LATEST .
          args:
            executable: /bin/bash
          register: build_log_analyzer
          when: not (offline_mode | default(false) | bool)

        # Models: offline staging (load_offline_llm.yml above) already copied these
        # from the bundle; the get_url fetch is online-only. Mirrors
        # llama_cpp_setup.yml:117-145 (get_url gated `when: not offline_mode`).
        - name: Download LFM2.5 1.2B model (Q4_K_M quantization, ~698MB)
          get_url:
            url: https://huggingface.co/LiquidAI/LFM2.5-1.2B-Instruct-GGUF/resolve/main/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
            dest: /opt/lme/llama-models/LFM2.5-1.2B-Instruct-Q4_K_M.gguf
            mode: '0644'
            timeout: 600
          register: model_download
          retries: 3
          delay: 10
          until: model_download is not failed
          when: not (offline_mode | default(false) | bool)

        - name: Download nomic-embed-text model (Q4_K_M quantization, ~81MB)
          get_url:
            url: https://huggingface.co/nomic-ai/nomic-embed-text-v1.5-GGUF/resolve/main/nomic-embed-text-v1.5.Q4_K_M.gguf
            dest: /opt/lme/llama-models/nomic-embed-text-v1.5.Q4_K_M.gguf
            mode: '0644'
            timeout: 600
          register: embed_download
          retries: 3
          delay: 10
          until: embed_download is not failed
          when: not (offline_mode | default(false) | bool)

        - name: Copy updated instances.yml for AI service cert generation
          copy:
            src: "{{ clone_directory }}/config/setup/instances.yml"
            dest: /opt/lme/config/setup/instances.yml
            remote_src: yes
            owner: root
            group: root
            mode: '0644'

        - name: Copy updated init-setup.sh for AI service cert generation
          copy:
            src: "{{ clone_directory }}/config/setup/init-setup.sh"
            dest: /opt/lme/config/setup/init-setup.sh
            remote_src: yes
            owner: root
            group: root
            mode: '0755'

        - name: Get lme_certs volume mountpoint
          shell: |
            {{ podman_cmd }} volume inspect lme_certs --format '{{ '{{' }}.Mountpoint{{ '}}' }}'
          args:
            executable: /bin/bash
          register: certs_mountpoint

        - name: Remove certs.zip to trigger leaf cert regeneration
          file:
            path: "{{ certs_mountpoint.stdout | trim }}/certs.zip"
            state: absent

        - name: Remove AI cert directories with wrong host-root ownership
          file:
            path: "{{ certs_mountpoint.stdout | trim }}/{{ item }}"
            state: absent
          loop:
            - litellm
            - dashboard
            - log-analyzer
            - embeddings
            - llama-cpp

        - name: Copy LiteLLM config to /opt/lme/config
          copy:
            src: "{{ clone_directory }}/config/litellm_config.yaml"
            dest: /opt/lme/config/litellm_config.yaml
            remote_src: yes

        - name: Create llama-cpp model config
          copy:
            content: '{"model": "LFM2.5-1.2B-Instruct-Q4_K_M.gguf"}'
            dest: /opt/lme/config/llama-cpp-model.json
            force: no

        - name: Copy dashboard source to /opt/lme/lme-dashboard
          copy:
            src: "{{ clone_directory }}/lme-dashboard/"
            dest: /opt/lme/lme-dashboard/
            remote_src: yes

        - name: Refresh /opt/lme/scripts with the latest helper scripts (AI stack deploy)
          ansible.builtin.include_tasks: tasks/setup_lme_scripts.yml

        - name: Copy LLM systemd service and path units
          copy:
            src: "{{ clone_directory }}/systemd/{{ item }}"
            dest: /etc/systemd/system/{{ item }}
            remote_src: yes
          loop:
            - lme-llm-keys.service
            - lme-llm-keys.path
            - lme-llama-model.service
            - lme-llama-model.path

        - name: Display AI stack deployment status
          debug:
            msg: |
              AI Stack components deployed successfully:
              - Secrets: pgvector ({{ pgvector_secret.stdout | trim }}), llm-keys ({{ llm_keys_secret.stdout | trim }})
              - Images: llama-cpp, litellm, pgvector (pulled+tagged), dashboard, log-analyzer (built)
              - Models: LFM2.5-1.2B-Instruct-Q4_K_M.gguf, nomic-embed-text-v1.5.Q4_K_M.gguf
              - Certificates: certs.zip removed, will regenerate via lme-setup-certs container on restart
              - Configs: litellm_config.yaml, llama-cpp-model.json
              - Systemd units: lme-llm-keys.service/path, lme-llama-model.service/path
      when:
        - current_lme_version is version('2.3.0', '<')
        - lme_enable_flags.install_llm

    - name: Skip AI stack (already at 2.3.0+)
      debug:
        msg: "AI stack already deployed (current version {{ current_lme_version }}), skipping AI component setup"
      when: not (current_lme_version is version('2.3.0', '<'))

    - name: Create backup directory for quadlet files
      file:
        path: "/opt/lme/backup/quadlet-{{ backup_timestamp }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      register: quadlet_backup_dir
      
    - name: Backup existing quadlet files
      shell: |
        if [ -d "/etc/containers/systemd" ]; then
          cp -r /etc/containers/systemd/* {{ quadlet_backup_dir.path }}/ 2>/dev/null || true
          echo "Backed up existing quadlet files to {{ quadlet_backup_dir.path }}"
        else
          echo "No existing quadlet directory found"
        fi
      args:
        executable: /bin/bash
      register: quadlet_backup_result
      
    - name: Display quadlet backup result
      debug:
        msg: "{{ quadlet_backup_result.stdout }}"
        
    - name: Create /etc/containers/systemd directory
      file:
        path: /etc/containers/systemd
        state: directory
        owner: root
        group: root
        mode: '0744'
        
    # Control-plane cutover (B0): units are no longer copied from the static
    # quadlet/ tree. They are RENDERED from the manifest tree (manifests/) exactly
    # as fresh install does -- load_manifests.yml builds lme_global / lme_services /
    # lme_enable_flags, and render_units.yml renders every ENABLED service. The
    # umbrella target lme.service is rendered to /etc/systemd/system/lme.service
    # (manifests/services/lme.service.yml, kind: target), which replaces the old
    # static lme.service copy.
    #
    # SINGLE-RESOLUTION CONSISTENCY (CR-B1): the render pipeline re-runs the SAME
    # shared resolver (load_manifests.yml -> resolve.yml) that ran EARLY above.
    # lme_inputs (the operator selections + the two observations) and lme_profile
    # persist as play facts from that early resolve, so this second resolution is
    # IDENTICAL -- same lme_resolved, same lme_enable_flags, and the SAME
    # content-addressed lme_resolved_revision -- which is what keeps an unchanged
    # config from rewriting/restarting a healthy consumer. We therefore pass NO
    # enablement/offline/profile vars here: the old marker-inferred
    # _render_offline_mode / _render_lme_profile are GONE. resolve reads lme_inputs
    # (not bare scope), so re-passing install_llm/install_elastic_services/offline_mode
    # would be redundant, and forcing lme_profile='offline' from the marker would
    # WRONGLY apply the offline overlay's install_elastic_services:false at tier-3 and
    # shadow the detected pack (offline_mode already carries via the observation).
    - name: Load service manifests into facts (render pipeline; re-runs the shared resolver)
      include_role:
        name: podman
        tasks_from: load_manifests.yml

    # render_units consumes the lme_enable_flags / lme_services facts that
    # load_manifests just set (no vars need re-passing) and writes the units to
    # /etc/containers/systemd and /etc/systemd/system.
    - name: Render all enabled service units from manifests (replaces static quadlet/ copy)
      include_role:
        name: podman
        tasks_from: render_units.yml

    - name: Reload systemd daemon
      systemd:
        daemon_reload: yes
      register: daemon_reload_result

    - name: Display unit render results
      debug:
        msg: |
          Service units re-rendered from manifests:
          - Backup location: {{ quadlet_backup_dir.path }}
          - Units: rendered from manifests/services/* into /etc/containers/systemd (+ /etc/systemd/system/lme.service)
          - Systemd daemon: {{ 'Reloaded' if daemon_reload_result.changed else 'Already current' }}
        
    # ============================================================
    # Mint the AI web-UI auth secrets BEFORE the umbrella restart.
    #
    # render_units.yml (above) renders lme-dashboard / lme-log-analyzer / lme-litellm
    # on install_llm ALONE (the render pipeline re-resolves via the shared resolver;
    # is_enabled reads lme_enable_flags.install_llm -- no version gate), and those units
    # consume the
    # podman secrets litellm_master_key (litellm: env LITELLM_MASTER_KEY; both UIs:
    # env LITELLM_API_KEY) and webui_api_key (both UIs: env WEBUI_API_KEY). The
    # pre-2.3.0 AI-stack block above mints only pgvector + llm-keys, so without the
    # two mints below podman refuses to start the UIs on the restart -- a fail-closed
    # brick that the old loose wait then masked as green. Gating here on
    # lme_enable_flags.install_llm (the SAME flag render_units used) instead of the AI-stack
    # block's version('2.3.0','<') gate closes the mismatch: a host that installed
    # 2.3.0 with install_llm=false and later upgrades with install_llm=true still gets
    # the keys. if-absent keeps them a free no-op (and STABLE) when they already
    # exist. Mirrors the canonical file-driver recipe in
    # roles/podman/tasks/llama_cpp_setup.yml (webui_api_key uses --replace inside the
    # if-absent guard to admit a missing/partial record without rotating a live key;
    # litellm_master_key does not); no_log guards the generated passwords.
    - name: Mint litellm_master_key secret before restart (fail-closed brick fix)
      shell: |
        {{ podman_cmd }} secret ls | grep -q litellm_master_key && exit 0
        password=$(</dev/urandom tr -dc A-Za-z0-9 | head -c30)
        echo -n "$password" | {{ podman_cmd }} secret create --driver file litellm_master_key -
      args:
        executable: /bin/bash
      no_log: true
      when: lme_enable_flags.install_llm

    - name: Mint webui_api_key secret before restart (fail-closed brick fix)
      shell: |
        {{ podman_cmd }} secret ls | grep -q webui_api_key && exit 0
        password=$(</dev/urandom tr -dc A-Za-z0-9 | head -c30)
        echo -n "$password" | {{ podman_cmd }} secret create --driver file --replace webui_api_key -
      args:
        executable: /bin/bash
      no_log: true
      when: lme_enable_flags.install_llm

    # ============================================================
    # Publish the per-service host-tree cert bundles BEFORE the umbrella restart.
    #
    # The re-rendered AI web-UI units (lme-dashboard / lme-log-analyzer) -- like the
    # always-on core units -- mount cert:<svc>, which render_volume() expands to the
    # HOST tree /opt/lme/certs/<svc> (lme_global.certs.host_tree), NOT the shared
    # lme_certs workspace. Those per-service bundles are PUBLISHED only by the certs
    # role's B4 step (real host-root chown to the manifest-derived subuid; the
    # UserNS=auto lme-setup-certs container cannot chown to host subuids -- init-setup.sh
    # disclaims it in its own comment). upgrade_lme.yml never ran that role, so on a
    # pre-2.3.0 -> 2.3.0 upgrade the AI leaf dirs deleted above (litellm/dashboard/
    # log-analyzer/embeddings/llama-cpp) are never re-published to /opt/lme/certs/<svc>
    # and the UIs crash-loop on a missing SSL cert/key -- EVEN with the secrets minted.
    # That is exactly the fail-closed brick the is-active assert below now reds on.
    #
    # The certs role is the SAME mechanism site.yml uses on fresh install: it starts
    # lme-setup-certs (a Type=oneshot/RemainAfterExit unit that is PartOf=lme.service,
    # so the earlier "Stop LME service" left it INACTIVE -> `state: started` re-executes
    # it and, with certs.zip removed above, re-mints every leaf into the lme_certs
    # workspace) and then publishes each ENABLED cert:<svc> bundle to the host tree. It
    # MUST run before the restart because the UIs bind the host-tree bundle at start.
    # Runs UNCONDITIONALLY (round-6 blocker fix). The certs role publishes each ENABLED
    # cert:<svc> bundle, and its own resolver filter (is_enabled over lme_enable_flags,
    # roles/certs/tasks/main.yml:30-36) already scopes the AI-UI bundles to install_llm.
    # So on an LLM-off upgrade the role republishes ONLY the always-on CORE bundles
    # (kibana / fleet-server / fleet-distribution / wazuh-manager), which those core units
    # mount from the host tree regardless of LLM; the AI-UI leaves are excluded by is_enabled,
    # not by this task. It was FORMERLY gated on lme_llm_enabled to "scope to the AI-UI defect,"
    # but that left the core bundles unpublished on a pre-2.3.0 -> 2.3.0 LLM-off upgrade and
    # silently crash-looped core kibana (the fail-closed AI-UI assert below is co-gated on the
    # SAME flag, so it never caught it -- see the LLM-independent core assert added after restart).
    # load_manifests/render_units above are unconditional and set lme_enable_flags with
    # install_llm=false on this path, so lme-setup-certs (enabled_when:[always]) is present for
    # the role's `state: started` re-exec. The PATH env mirrors this file's
    # podman-resolution tasks so the role's bare `podman` calls find the nix-profile
    # binary (roles/certs carries no environment of its own).
    # `environment` is not a valid attribute on include_role, so the PATH is set on
    # the enclosing block (which propagates it to the dynamically-included role tasks).
    - name: Publish per-service cert bundles before restart (certs role; core+AI-UI brick fix)
      environment:
        PATH: "{{ ansible_env.PATH }}:/nix/var/nix/profiles/default/bin"
      block:
        - name: Publish per-service cert bundles via certs role
          ansible.builtin.include_role:
            name: certs

    - name: Restart LME service
      systemd:
        name: "lme"
        state: restarted
      tags: ['system']

    # Fail-closed CORE brick guard (round-6), runs REGARDLESS of lme_enable_flags.install_llm.
    # The always-on core web unit lme-kibana mounts the host-tree cert:kibana bundle that
    # the now-unconditional certs publish above fills; a missing/half-published bundle
    # crash-loops it. The AI-UI assert below is LLM-gated, so before this task NOTHING
    # covered a core brick on an LLM-off upgrade -- exactly the gap that made the former
    # co-gated publish a silent blocker. Kibana is the canonical long-running cert:kibana
    # consumer; asserting is-active here converts a core brick into a task failure instead
    # of a false success. Retry ceiling mirrors the AI-UI assert to tolerate the ES->kibana
    # startup cascade on a slow upgrade; the poll exits the instant kibana reports active.
    - name: Assert core kibana unit is active after restart (fail-closed, LLM-independent)
      command: systemctl is-active lme-kibana.service
      register: core_kibana_active
      changed_when: false
      until: core_kibana_active.rc == 0
      retries: 60
      delay: 10

    # Fail-closed brick guard (replaces the former `podman ps | grep lme` +
    # ignore_errors wait, which went green as long as ANY core container was up and
    # thus MASKED a UI that podman refused to start -- e.g. a missing webui_api_key /
    # litellm_master_key secret bricks lme-dashboard / lme-log-analyzer). This asserts
    # the enabled UI units are actually active; NO ignore_errors, so a brick surfaces
    # as a task failure instead of a false success. Gated on lme_enable_flags.install_llm because
    # the units are rendered (and thus expected active) only when the LLM stack is on;
    # no profile overlay disables them (only tailscale rebinds their ports). The
    # generous retry ceiling tolerates the full ES -> litellm/pgvector/embeddings ->
    # UI startup cascade on a slow upgrade without flipping a healthy-but-slow host to
    # a false red -- the poll exits the instant both units report active.
    - name: Assert enabled AI web-UI units are active after restart (fail-closed)
      command: systemctl is-active lme-dashboard.service lme-log-analyzer.service
      register: ai_ui_units_active
      changed_when: false
      until: ai_ui_units_active.rc == 0
      retries: 60
      delay: 10
      when: lme_enable_flags.install_llm
      
    - name: Wait for services to be ready
      pause:
        seconds: 60
        
    - name: Verify services are running
      shell: |
        echo "Using podman from: {{ podman_cmd }}"
        
        LME_CONTAINERS=$({{ podman_cmd }} ps --format "{{ '{{' }}.Names{{ '}}' }}" | grep -E "lme" || true)
        CONTAINER_COUNT=$(echo "$LME_CONTAINERS" | wc -l)
        echo "$LME_CONTAINERS"
        
        # LME 2.3.0 expects 11 containers (5 core + 6 AI stack)
        EXPECTED=11
        if [ $CONTAINER_COUNT -ge $EXPECTED ]; then
          echo "All $EXPECTED expected LME services are running"
          exit 0
        elif [ $CONTAINER_COUNT -ge 5 ]; then
          echo "Core services running ($CONTAINER_COUNT containers). Some AI stack containers may still be starting."
          exit 0
        else
          echo "Only $CONTAINER_COUNT of $EXPECTED expected LME services are running"
          exit 1
        fi
      args:
        executable: /bin/bash
      register: containers_status
      until: containers_status.rc == 0
      retries: 15
      delay: 10
      
    - name: Display running containers
      debug:
        msg: "{{ containers_status.stdout_lines }}"
        
    - name: Fail if not all services are running
      fail:
        msg: "Not all expected LME services are running. Only {{ containers_status.stdout_lines | select('match', '^lme') | list | length }} of 11 expected services were detected."
      when: containers_status.rc != 0
      
    - name: Wait for fleet server to complete enrollment
      pause:
        seconds: 30
        prompt: "Waiting for fleet server enrollment to complete..."
        
    - name: Set FLEET_ENROLL=0 to prevent re-enrollment on restart
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^FLEET_ENROLL="
        line: "FLEET_ENROLL=0"
        insertafter: EOF
        state: present
      register: fleet_enroll_disabled
      
    - name: Set FLEET_SERVER_ENABLE=0 to prevent re-bootstrap on restart
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^FLEET_SERVER_ENABLE="
        line: "FLEET_SERVER_ENABLE=0"
        insertafter: EOF
        state: present
      register: fleet_server_enable_disabled
      
    - name: Set KIBANA_FLEET_SETUP=0 to prevent re-setup on restart
      lineinfile:
        path: "{{ env_file_path }}"
        regexp: "^KIBANA_FLEET_SETUP="
        line: "KIBANA_FLEET_SETUP=0"
        insertafter: EOF
        state: present
      register: kibana_fleet_setup_disabled
      
    # ============================================================
    # Post-restart AI Stack setup (requires running services)
    # ============================================================
    - name: Enable AI stack systemd watchers (upgrade from pre-2.3.0)
      block:
        - name: Enable and start LLM keys path watcher
          systemd:
            name: lme-llm-keys.path
            enabled: yes
            state: started

        - name: Enable and start llama model switch path watcher
          systemd:
            name: lme-llama-model.path
            enabled: yes
            state: started

        - name: Wait for pgvector and embeddings to be healthy
          pause:
            seconds: 30
            prompt: "Waiting for pgvector and embeddings services to initialize..."

        - name: Run LME documentation ingestion into pgvector
          shell: |
            {{ podman_cmd }} run --rm --network lme \
              --secret pgvector,type=env,target=PGVECTOR_PASS \
              -v {{ clone_directory }}/scripts:/scripts:z \
              docker.io/library/python:3.11-slim bash -c \
              "pip install -q requests beautifulsoup4 markdownify psycopg2-binary pgvector lxml && python /scripts/ingest_docs.py --reset"
          args:
            executable: /bin/bash
          register: ingest_result
          retries: 5
          delay: 30
          until: ingest_result is not failed
          ignore_errors: yes

        - name: Display doc ingestion result
          debug:
            msg: "{{ 'Documentation ingestion completed successfully' if ingest_result.rc == 0 else 'Documentation ingestion failed (non-fatal) — can be re-run manually' }}"
      when:
        - current_lme_version is version('2.3.0', '<')
        - lme_enable_flags.install_llm

    # Re-land the Elastic services pack config + certs on upgrade. The pack's units
    # themselves are now rendered by the manifest render above (render_units.yml
    # emits every manifests/services/* whose enabled_when is [install_elastic_services]);
    # this include remains for the non-render concerns the render does NOT do: forcing
    # the pack config into /opt/lme/config, re-owning it to root, disabling the host
    # apm-server, re-running the cert top-up, and starting the pack units on the
    # already-active umbrella. Runs after the core services are up, matching that
    # file's "start pack units on an already-active umbrella service" assumption.
    # Guarded off on child ES-only nodes to mirror the install path
    # (roles/podman/tasks/main.yml:250-252 and site.yml:124-126).
    - name: Re-land Elastic services pack (configs, ownership, cert top-up, unit start)
      include_role:
        name: podman
        tasks_from: elastic_services_setup.yml
      when:
        - lme_enable_flags.install_elastic_services
        - not (lme_child_es_only | default(false) | bool)

    - name: Update LME version in environment file
      lineinfile:
        path: "{{ env_file_path }}"
        line: "LME_VERSION={{ new_lme_version }}"
        regexp: "^LME_VERSION="
        state: present
      register: version_updated
      
    - name: Update LME version file
      copy:
        content: "{{ new_lme_version }}"
        dest: "/etc/lme/version"
      
    - name: Upgrade complete message
      debug:
        msg:
          - "LME has been successfully upgraded to version {{ new_lme_version }}"
          - ""
          - "Core container versions:"
          - "- Elasticsearch: {{ elasticsearch_image }}"
          - "- Elastic Agent: docker.elastic.co/beats/elastic-agent:{{ elasticsearch_version }}"
          - "- Kibana: {{ kibana_image }}"
          - "- Wazuh: {{ wazuh_image }}"
          - "- ElastAlert: {{ elastalert_image }}"
          - ""
          - "AI Stack (new in 2.3.0):"
          - "- llama.cpp server:      https://<host>:8080  (LFM2.5-1.2B-Instruct)"
          - "- Embeddings server:     https://<host>:8081  (nomic-embed-text-v1.5)"
          - "- LiteLLM proxy:         https://<host>:4000"
          - "- pgvector (PostgreSQL): localhost:5432"
          - "- LME Dashboard:        https://<host>:8502"
          - "- Log Analyzer:          https://<host>:8501"
          - ""
          - "Configuration updates:"
          - "- Containers file: {{ 'Updated' if containers_copied.changed else 'No changes needed' }}"
          - "- Elasticsearch config: {{ 'Updated (removed old repo path)' if elasticsearch_config_updated.changed else 'Already correct' }}"
          - "- Service units: re-rendered from manifests/services/*"
          - "- Previous units backed up to: {{ quadlet_backup_dir.path }}"
          - "- Systemd daemon: {{ 'Reloaded' if daemon_reload_result.changed else 'Already current' }}"
