---
# =============================================================================
# E (collection) MATERIAL + OBLIGATION PROPOSAL -- schema-validated, NOT wired.
#
# session lme-02, E collection worker. Mirrors the delivery shape D used in
# config/postgresql-platform/runtime-inventory-requirements.contract.yaml: a
# domain-owned proposal file that C1 folds into the single canonical registry.
# NOTHING here is read by a renderer or the loader (no unit-byte change, projection
# UNCHANGED). It is a REQUIREMENTS/DISPOSITION INPUT pending C1 integration -- do NOT
# treat its predicates as enforced merely because it parses.
#
# WHY A PROPOSAL AND NOT LIVE MANIFEST EDITS: the loader's live projection
# (ansible/roles/podman/tasks/load_manifests.yml:303-313) validates any declared
# `material_requirements` on EVERY load against lme_global.material_catalog. The
# catalog is single-writer C1 and the credential/cert/private-key definitions these
# obligations reference are OWED_BY_C (C1 sitrep catalog_debts) and not yet landed.
# Authoring the obligations onto the live service manifests now would make every load
# FAIL an unresolvable material_ref. So E authors the obligations HERE, schema-checked
# against the real filters, for a JOINT wave that lands C's catalog defs + E's
# obligations together (that wave also flips enforcement_status.loader_wired).
#
# EVIDENCE: validated against the ACTUAL engine filters (not safe_load alone) --
#   lme_validate_material_catalog, lme_validate_material_requirements,
#   lme_project_datastore_clients -- see verification: below.
#
# fold_target: manifests/global.yml (lme_global.material_catalog + the per-service
#   material_requirements/datastore_clients) -- C1 owns; E supplies reviewed records.
# canonical_paths:
#   required_material: lme_resolved.required_material.<node>.<svc>.<obligation>
#   datastore_clients: lme_resolved.hosts.<node>.resolved_services.<svc>.datastore_clients
# references:
#   - claude-C1-schema-projection-sitrep-20260923-0644  (catalog_debts, enforcement_status)
#   - codex-check-20260923-0645  (ownership; security_boundary; C1-COMPLETE-CONFIGURATION-VALIDATION)
#   - codex-check-20260923-0700  (E owns elasticsearch.yml + its assigned service definitions)

fold_target: manifests/global.yml
not_wired: true            # no loader/renderer reads this; folds into the registry in the joint wave
supersedes_on: loader_wired==true   # retire this transcription once C1 folds it in (never live alongside the registry)

# ---------------------------------------------------------------------------
# 1. MATERIAL CATALOG DEFINITIONS E contributes / references (fold into
#    lme_global.material_catalog). Each is a payload DEFINITION only (kind +
#    payload_validity); placement lives on the obligation. `owner` marks which
#    swarm domain authors the SEMANTICS -- E proposes the id + shape; C authors the
#    credential/cert/private-key semantics (catalog_debts.owed_by_C), E authors the
#    telemetry/app semantics (owed_by_E). Every kind is drawn from
#    material_catalog_schema.definition.kind.vocab.
#    FOLD NOTE: the `owner:` key is an E annotation, NOT a schema field --
#    lme_validate_material_catalog rejects an undeclared catalog field, so `owner:` MUST be
#    stripped when folding a definition into lme_global.material_catalog (the verification
#    below strips it before validating).
# ---------------------------------------------------------------------------
e_material_catalog_definitions:
  # --- referenced by E services; SEMANTICS OWED_BY_C (distributable) ---------
  lme_internal_ca:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_certificate
    description: >-
      Internal LME CA public cert (ca/ca.crt) -- the ONLY cert that leaves the setup-certs
      workspace (global.yml certs.ca_public_rel); distributed to cross-host consumers (GAP-2 CA
      overlay). Distributable. The CA PRIVATE key is never a catalog material.
  elastic_password:
    owner: C
    kind: password_file
    payload_validity: non_empty_password
    description: The `elastic` superuser password (podman shell-secret 'elastic'); distributed cross-host by GAP-4.
  kibana_system_password:
    owner: C
    kind: password_file
    payload_validity: non_empty_password
    description: The `kibana_system` service-account password.
  # --- server LEAF certificates (public half; kind certificate -> distributable). Each ES/
  #     Kibana/Fleet server presents its own leaf; the PRIVATE key half is the non-distributable
  #     *_tls_key def below + consumer_local_tls_key_obligations. Grounded in the service
  #     manifests' ssl.certificate settings (E-PROPOSAL-INCOMPLETE-TLS-OBLIGATIONS: CA-only was
  #     an INCOMPLETE closure -- a TLS server needs CA-trust + leaf-cert + leaf-key). owner:C
  #     (ratification), same as lme_internal_ca. -----------------------------------------------
  elasticsearch_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_certificate
    description: >-
      elasticsearch.crt (+ elasticsearch.chain.pem for the HTTP endpoint) -- ES's server leaf,
      workspace-local (setup-certs). manifest xpack.security.{http,transport}.ssl.certificate.
  kibana_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_certificate
    description: kibana.crt -- Kibana's server leaf (B4 cert:kibana bundle). manifest SERVER_SSL_CERTIFICATE.
  fleet_server_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_certificate
    description: fleet-server.crt -- Fleet server leaf (B4 cert:fleet-server bundle). manifest FLEET_SERVER_CERT.
  # --- E-OWNED telemetry / app material -------------------------------------
  # GROUNDED in manifests/services/lme-otel-collector.yml: `secrets: [{name:
  # otel_elastic_api_key, type: mount, target: /run/secrets/otel-elastic-api-key}]` --
  # a SCOPED, write-only ES API key (NOT the elastic superuser), which that manifest
  # already flags as an "E-domain contract request". Distributable to the collector host.
  otel_elastic_api_key:
    owner: E
    kind: password_file
    payload_validity: non_empty_api_key
    description: >-
      Scoped write-only Elasticsearch API key the otel-collector's bearertokenauth/elastic
      extension reads from /run/secrets/otel-elastic-api-key. NOT the elastic superuser.
  # --- host-local PRIVATE keys: DEFINITIONS ONLY (kind private_key is in the vocab
  #     but is NOT in distributable_kinds). NO obligation may reference these via
  #     material_ref -- a catalog reference does NOT authorize private-key distribution
  #     (codex-0645 security_boundary). They are declared so the required host-local
  #     material is VISIBLE and NOT deleted; the enforceable production/custody
  #     obligation is OWED_BY_C (see consumer_local_tls_key_obligations). ------------
  elasticsearch_tls_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_private_key
    description: elasticsearch.key -- host-local, generated by setup-certs in the lme_certs workspace; non-distributable.
  kibana_tls_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_private_key
    description: kibana.key -- host-local (B4 cert:kibana bundle); non-distributable.
  fleet_server_tls_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_private_key
    description: fleet-server.key -- host-local (B4 cert:fleet-server bundle); non-distributable.

# ---------------------------------------------------------------------------
# 2. PER-SERVICE OBLIGATIONS (fold into each manifests/services/<svc>.yml as
#    `material_requirements:` + `datastore_clients:`). Obligation ids match
#    material_requirements_schema.obligation_id_pattern; every material_ref resolves
#    to a DISTRIBUTABLE catalog def above. datastore_clients.material_requirement_refs
#    resolve to that same service's obligation ids (reference-resolution enforced).
# ---------------------------------------------------------------------------
service_obligations:
  elasticsearch:
    material_requirements:
      elastic_superuser_password:
        material_ref: elastic_password
        placement_class: env          # podman shell-secret -> ELASTIC_PASSWORD env; env FORBIDS destination/mode
        consumer: lme-elasticsearch
        profile_condition: always
        lifecycle: bootstrap
        retention: durable
      kibana_system_password:
        material_ref: kibana_system_password
        placement_class: env          # -> KIBANA_PASSWORD / ELASTICSEARCH_PASSWORD env
        consumer: lme-elasticsearch
        profile_condition: always
      elasticsearch_leaf_cert:
        material_ref: elasticsearch_cert
        placement_class: mount        # workspace-local leaf; ES presents it on http (chain.pem) + transport (.crt)
        consumer: lme-elasticsearch
        destination: certs/elasticsearch/elasticsearch.crt   # manifest xpack.security.transport.ssl.certificate; http uses elasticsearch.chain.pem (same leaf, chain sibling)
        owner_role: elasticsearch
        mode: "0644"                  # init-setup.sh:73 (non-key workspace files chmod 644)
        profile_condition: always
      # NB: ES is the CA producer + TLS terminator -- it mounts the SHARED lme_certs
      # workspace (manifest: "NOT a B4 per-service-bundle consumer"), so its ca.crt, leaf
      # cert and private key are all HOST-LOCAL (setup-certs), NOT a distributed placement.
      # So ES has NO internal_ca_trust obligation here; its private key is in
      # consumer_local_tls_key_obligations. (The distributable CA obligation lives on the
      # CONSUMERS below, which mount it via their B4 bundle / GAP-2 cross-host overlay.)
    datastore_clients: {}             # ES is the datastore, not a client
  kibana:
    material_requirements:
      kibana_system_password:
        material_ref: kibana_system_password
        placement_class: env
        consumer: lme-kibana
        profile_condition: always
      internal_ca_trust:
        material_ref: lme_internal_ca
        placement_class: mount
        consumer: lme-kibana
        destination: config/certs/ca/ca.crt
        owner_role: kibana
        mode: "0644"
        profile_condition: always
      kibana_leaf_cert:
        material_ref: kibana_cert
        placement_class: mount        # Kibana's server leaf (B4 cert:kibana bundle)
        consumer: lme-kibana
        destination: config/certs/kibana/kibana.crt   # manifest SERVER_SSL_CERTIFICATE
        owner_role: kibana
        mode: "0644"                  # published bundle .crt install -m 0644
        profile_condition: always
    datastore_clients:
      elasticsearch:
        domain_ref: lme-elasticsearch
        database_ref: lme-indices
        principal_ref: kibana_system
        endpoint_ref: es-https-9200   # proposed endpoint id; endpoint-registry resolution OWED (see residuals)
        material_requirement_refs: [kibana_system_password, internal_ca_trust]
  fleet-server:
    material_requirements:
      elastic_fleet_password:
        material_ref: elastic_password
        placement_class: env          # -> KIBANA_FLEET_PASSWORD env
        consumer: lme-fleet-server
        profile_condition: always
      internal_ca_trust:
        material_ref: lme_internal_ca
        placement_class: mount
        consumer: lme-fleet-server
        destination: /certs/ca/ca.crt   # grounded: manifest FLEET_CA=/certs/ca/ca.crt, cert:fleet-server -> /certs
        owner_role: fleet-server
        mode: "0644"
        profile_condition: always
      fleet_server_leaf_cert:
        material_ref: fleet_server_cert
        placement_class: mount        # Fleet's server leaf (B4 cert:fleet-server bundle)
        consumer: lme-fleet-server
        destination: /certs/fleet-server/fleet-server.crt   # manifest FLEET_SERVER_CERT
        owner_role: fleet-server
        mode: "0644"                  # published bundle .crt install -m 0644
        profile_condition: always
    datastore_clients:
      elasticsearch:
        domain_ref: lme-elasticsearch
        database_ref: lme-fleet-indices
        principal_ref: elastic          # fleet-server authenticates with the elastic superuser (manifest: KIBANA_FLEET_PASSWORD<-elastic)
        endpoint_ref: es-https-9200
        material_requirement_refs: [elastic_fleet_password, internal_ca_trust]
  otel-collector:
    # GROUNDED in manifests/services/lme-otel-collector.yml (read): cert:otel-collector -> /certs
    # (ca/ca.crt only; host_userns:true, in_container_uid 10001); secret otel_elastic_api_key
    # mounted at /run/secrets/otel-elastic-api-key; enabled_when [install_otel].
    material_requirements:
      internal_ca_trust:
        material_ref: lme_internal_ca
        placement_class: mount
        consumer: lme-otel-collector
        destination: /certs/ca/ca.crt   # grounded: cert:otel-collector -> /certs
        owner_role: otel-collector
        mode: "0644"
        profile_condition: install_otel
      otel_elastic_api_key:
        material_ref: otel_elastic_api_key
        placement_class: mount          # manifest: {name: otel_elastic_api_key, type: mount, target: /run/secrets/otel-elastic-api-key}
        consumer: lme-otel-collector
        destination: /run/secrets/otel-elastic-api-key
        owner_role: otel-collector
        mode: "0400"
        profile_condition: install_otel
    datastore_clients:
      elasticsearch:
        domain_ref: lme-elasticsearch
        database_ref: lme-otel-indices
        principal_ref: otel_elastic_api_key   # scoped write-only API key, NOT the elastic superuser
        endpoint_ref: es-https-9200
        material_requirement_refs: [internal_ca_trust, otel_elastic_api_key]
  # NOTE: the legacy beats (filebeat/metricbeat/heartbeat) + elastalert follow the same
  # shape (internal_ca_trust mount + an ES-principal env password + an es-https-9200
  # datastore_clients binding). Enumerated in the joint wave once C lands elastic /
  # service-account credential defs; omitted here to avoid asserting per-beat principals
  # not yet settled with C.

# ---------------------------------------------------------------------------
# 3. CONSUMER-LOCAL TLS KEY OBLIGATIONS -- REQUIRED, NOT DELETED, and NOT expressible
#    as a standard material_requirements obligation (material_ref must be a
#    DISTRIBUTABLE kind; a private key is not). Listed here as owed obligations BLOCKED
#    on C's host-local private-key production/custody mechanism (catalog_debts.owed_by_C:
#    "local-production + custody semantics for consumer-local TLS keys"). Honors
#    codex-0645 security_boundary: a material reference does NOT authorize private-key
#    distribution; do NOT delete the TLS key obligation to satisfy the distributable
#    restriction. These are produced host-locally by setup-certs (the certs role) today;
#    the ENFORCEABLE obligation shape is C's to define.
# ---------------------------------------------------------------------------
consumer_local_tls_key_obligations:
  # UPDATED 2026-09-23: the blocking mechanism is now PROPOSED. C's landed proposal
  # config/credentials/credential-material-and-obligations.proposal.yaml (commit 1b7e8b8)
  # adds `local_production_obligation_form` -- a material_requirements_schema delta
  # (record field `production: {distributed, local_host}` + a value-pure production_forms
  # closure) that lets an obligation reference a NON-distributable (private_key) def WITHOUT
  # weakening the distribution ban (local_host emits_distribution=false, requires producer_ref).
  # C also RATIFIES the three private_key defs (c_ratified_definitions) and AUTHORED the
  # elasticsearch_tls_key_local + kibana_tls_key_local obligations under that form. So:
  status: MECHANISM_PROPOSED_BY_C_1b7e8b8   # was OWED_BY_C_MECHANISM; the form now exists as a proposed schema delta
  e_owed_at_fold:
    # fleet-server is E's service and C did NOT author its local obligation, so E authors
    # fleet_server_tls_key_local under C's local_host form at the joint fold (do NOT drop it --
    # security_boundary: a required consumer-local key obligation is never deleted). Shape:
    # production=local_host, producer_ref=setup-certs, placement_class=secrets,
    # consumer=fleet-server, destination=/certs/fleet-server/fleet-server.key,
    # owner_role=fleet-server, mode="0640" (fleet-server is a B4 bundle consumer; bundle key
    # is `install -m 0640`, main.yml:216).
    # profile_condition=ALWAYS -- NOT install_elastic_services. lme-fleet-server is
    # enabled_when:[always] (manifests/services/lme-fleet-server.yml:16), so gating its TLS
    # key on install_elastic_services (default false) would DROP the obligation on a default
    # profile while the service still runs -- a TLS-admission loosening (constraint 5). This
    # is the SAME correction routed to C for elasticsearch_tls_key_local / kibana_tls_key_local
    # (both services are also enabled_when:[always]).
    - fleet_server_tls_key_local
  produced_by: setup-certs (host-local; lme_certs workspace / B4 per-service bundle)
  keys:
    - {service: elasticsearch, material_def: elasticsearch_tls_key, in_container_path: config/certs/elasticsearch/elasticsearch.key, owner_role: elasticsearch, authored_by: C(1b7e8b8) as elasticsearch_tls_key_local}
    - {service: kibana,        material_def: kibana_tls_key,        in_container_path: config/certs/kibana/kibana.key,               owner_role: kibana,        authored_by: C(1b7e8b8) as kibana_tls_key_local}
    - {service: fleet-server,  material_def: fleet_server_tls_key,  in_container_path: /certs/fleet-server/fleet-server.key,          owner_role: fleet-server,  authored_by: E_OWED (see e_owed_at_fold)}
  requirement: >-
    Each key MUST be present, host-local, owned by the cert-owner uid the manifest `certs:`
    block derives (lme_manifests.cert_owner). MODES RE-VERIFIED 2026-09-23 from PRIMARY source
    (an earlier draft mis-cited main.yml:155, which is the cert-bundle TARBALL push, not a key):
    the setup-certs WORKSPACE leaf key (elasticsearch/kibana/fleet-server .key) is mode 0640,
    owned elasticsearch:elasticsearch -- config/setup/init-setup.sh:72
    (`find ... -name '*.key' -exec chmod 640`) + :69 (chown -R elasticsearch); the PUBLISHED B4
    per-service bundle key is ALSO mode 0640 (ansible/roles/certs/tasks/main.yml:216,
    `install -m 0640 <svc>.key`). So C's elasticsearch_tls_key_local mode 0640 is CORRECT for the
    workspace leaf key -- NOT a mismatch. The ONLY 0600 key is the CA SIGNING key ca/ca.key,
    chowned OFF the elasticsearch uid to userns-root 0:0 and chmod 0600 (init-setup.sh:83-86) so
    the ES service process cannot read it (CA-MITM carve-out); ca/ca.key is NEVER distributed or
    published (main.yml:219, `find ... -name 'ca.key' -delete`). The service leaf key MUST NOT be
    distributed and MUST NOT be dropped to make the distributable-kind restriction pass.

# ---------------------------------------------------------------------------
# 4. cluster_uuid DISPOSITION (P3). cluster_uuid is CREATED by Elasticsearch at bootstrap
#    and only ever READ as a live observation (git grep: ansible/restore_elasticsearch_
#    snapshot.yml reads cluster_root.json.cluster_uuid; the api_tests schema). It is NEVER
#    hand-set anywhere today, so there is no live defect to fix. IF a resolved-config
#    representation is ever needed, it must be a C1 registry field of origin `observation`
#    with NO default (the registry FORBIDS a default on observation/build origin --
#    lme_manifests._require_registry_shape). It must NOT be minted/derived from
#    run_id/config/hostname (mirrors deployment_identity). => C1 registry proposal, not an
#    E hand-set value.
cluster_uuid_disposition:
  current_state: observed_only_never_hand_set
  proposed_registry_field:
    lme_observed_cluster_uuid:
      type: str
      required: false
      nullable: false
      enable_flag: false
      origin: observation          # inferred/observed -- _require_registry_shape REJECTS any `default:` key here
      upgrade_fallback: true       # so the observation channel's requires_field fires and the field can resolve
      exclude_from_revision: true  # identity-like (mirrors lme_deployment_identity); must not churn the config revision
      # NB: NO `default:` key -- the registry forbids a default on observation/build origin.
  owner: C1
  validated: >-
    Resolved through the REAL lme_resolve_config twice: WITH an observation it resolves with
    origin `observation`; WITHOUT one it is ABSENT from lme_resolved (optional-absent contract).
    See verification.result.

# ---------------------------------------------------------------------------
# 5. RESIDUALS + OWNERSHIP ROUTING (what is NOT closed and who closes it).
# ---------------------------------------------------------------------------
residuals:
  - id: OWED_BY_C-credential-and-tls-key-defs
    detail: >-
      elastic_password / kibana_system_password / lme_internal_ca semantics + the host-local
      private-key obligation mechanism. RECONCILED 2026-09-23: C's landed proposal (1b7e8b8,
      config/credentials/credential-material-and-obligations.proposal.yaml) RATIFIES all three
      distributable ES-stack defs + the three private_key TLS defs (c_ratified_definitions) and
      PROPOSES local_production_obligation_form (the private_key obligation mechanism). Now this
      residual is a JOINT-FOLD action, not an open ownership question.
    owner: C (defs + mechanism) / E (fleet_server_tls_key_local obligation)
    gate: joint wave lands C's catalog defs + schema delta + these obligations together; flips loader_wired.
  - id: CATALOG-DEF-FOLD-DEDUP
    detail: >-
      The six defs elastic_password / kibana_system_password / lme_internal_ca /
      elasticsearch_tls_key / kibana_tls_key / fleet_server_tls_key are named in BOTH this file
      (e_material_catalog_definitions, owner-annotated) AND C's proposal (c_ratified_definitions).
      The C1 fold MUST contribute each def to lme_global.material_catalog EXACTLY ONCE (a duplicate
      name is a fold conflict, per C's note). E's `owner:` annotation is stripped on fold.
    owner: C1 (fold arbiter)
    gate: joint fold.
  - id: ENDPOINT-REF-RESOLUTION
    detail: >-
      datastore_clients.endpoint_ref (es-https-9200) is shape-valid (non-empty) but resolves against
      no declared endpoint registry yet -- lme_project_datastore_clients checks shape, not resolution.
      A canonical ES endpoint/VIP registry is needed so a cross-host binding is a VALID remote reference,
      not a manifest-name string (feeds C1-COMPLETE-CONFIGURATION-VALIDATION cross-host-binding half).
    owner: C1 (registry) + E (bindings)
    gate: endpoint registry lands.
  - id: DATASTORE-CLIENTS-DOMAIN-SHAPE
    detail: domain_ref/database_ref/principal_ref are DB-shaped (codex-0430 dec 3); for ES clients they are proposed logical names. Reconcile the ES-vs-DB datastore vocabulary with D/C1.
    owner: C1 + D
  - id: PER-BEAT-PRINCIPALS
    detail: filebeat/metricbeat/heartbeat/elastalert obligations omitted pending C's service-account credential defs.
    owner: E (authors) + C (defs)

# ---------------------------------------------------------------------------
# 5b. CODEX 0730 AUDIT DISPOSITION (codex-independent-custody-and-entrypoint-evidence-
#     20260923-0730, collection_proposal findings against the pre-fix commit 98f7bb9).
#     This file is the CURRENT source; several findings were already repaired after 98f7bb9.
# ---------------------------------------------------------------------------
codex_0730_audit_disposition:
  - id: E-PROPOSAL-OTEL-CONSUMER-CONTRACT-MISMATCH
    status: RESOLVED_POST_98f7bb9
    detail: >-
      The pre-fix version bound otel to principal `elastic` + CA /etc/certs/ca/ca.crt with a
      CA-only obligation. CURRENT (this file): principal_ref otel_elastic_api_key (scoped
      write-only key), CA destination /certs/ca/ca.crt, plus the scoped API-key mount at
      /run/secrets/otel-elastic-api-key. Re-verified against config/otel-collector.yml:26-27,49,66
      + manifest lme-otel-collector.yml secrets/certs -- exact match; NO superuser fallback.
  - id: E-PROPOSAL-INCOMPLETE-TLS-OBLIGATIONS
    status: RESOLVED
    detail: >-
      Added server leaf-cert catalog defs (elasticsearch_cert/kibana_cert/fleet_server_cert,
      kind certificate) + a leaf-cert mount obligation per TLS server (grounded in each
      manifest's ssl.certificate path). Closure is now CA-trust + leaf-cert + host-local
      leaf-key (consumer_local_tls_key_obligations). The private-key half stays a
      non-distributable local obligation (C's local_host form) -- NOT deleted to pass the
      distributable restriction (security_boundary).
  - id: E-PROPOSAL-UNRESOLVED-DATASTORE-REFERENCES
    status: ROUTED
    detail: same as residual ENDPOINT-REF-RESOLUTION -- endpoint_ref/domain_ref/principal_ref are
      shape-valid but resolve against no canonical endpoint/trust registry yet. Owner C1 (registry) + E (bindings).
  - id: E-PROPOSAL-OBSERVATION-ADMISSION
    status: SHAPE_CORRECT_LIVE_SOURCE_OWED_BY_C1
    detail: >-
      Codex's claim "removing the default alone leaves a supplied observation absent" was against
      the pre-fix field (which also lacked upgrade_fallback). CURRENT field carries
      upgrade_fallback:true, so the observation CHANNEL admits it -- PROVEN by the real
      lme_resolve_config double-test (with observation -> origin=observation; see verification).
      What remains owed is the LIVE observation SOURCE (what supplies the observed cluster_uuid to
      the loader at resolve time) -- a C1 registry/loader concern, correctly routed, not an E hand-set.
    owner: C1
  - id: E-PROPOSAL-CATALOG-FOLD-METADATA
    status: DOCUMENTED
    detail: >-
      The `owner:` annotation is NOT a catalog schema field; the fold MUST strip it (a literal fold
      fails lme_validate_material_catalog on an undeclared field). Documented in the section-1 FOLD
      NOTE + the CATALOG-DEF-FOLD-DEDUP residual; the verification harness strips `owner:` before
      validating (11 merged defs pass). The mechanical strip+dedup step is C1's at fold time.
    owner: E (annotation) + C1 (fold step)

# ---------------------------------------------------------------------------
# 6. VERIFICATION (schema-validated proposal, NOT wired / NOT deploy-qualified).
# ---------------------------------------------------------------------------
verification:
  ran: "2026-09-23 -- against filter_plugins/lme_manifests.py at HEAD (this worktree)"
