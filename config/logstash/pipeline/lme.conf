input {
  # Beats input, TLS-enabled with the internal LME CA leaf.
  # Cert/key are the "logstash" instance leaf minted by elasticsearch-certutil
  # from config/setup/instances.yml (SAN: lme-logstash, logstash, localhost,
  # 127.0.0.1). This encrypts the beats->logstash leg that was previously
  # plaintext. The raw 5044 port is bound to loopback in the quadlet and, when
  # opted in, fronted by the host-facing tailscale ingress (see
  # ansible/roles/podman/tasks/tailscale_ingress.yml).
  #
  # Setting names are the 8.18 (logstash-input-beats 7.x) normalized form
  # (ssl_enabled, not the deprecated `ssl`).
  #
  # Client-cert (mTLS) is ON: the beats input both encrypts AND authenticates.
  # ssl_client_authentication => "required" is the 8.18 normalized spelling of the
  # legacy `ssl_verify_mode => "force_peer"` (identical semantics: a client with no
  # cert issued by the trusted CA is rejected); the two settings are mutually
  # exclusive, and "force_peer" is NOT a valid value for ssl_client_authentication,
  # so the normalized form is used to match this input's declared convention.
  # ssl_certificate_authorities pins the trust anchor to the internal LME CA
  # (/certs/ca/ca.crt, provided by this svc's cert:logstash bundle -- needs_ca:true).
  #
  # No in-repo beat ships to :5044 (filebeat/metricbeat/heartbeat/apm-server all
  # output.elasticsearch direct to lme-elasticsearch:9200), so requiring mTLS breaks
  # NO in-repo ingestion. It closes the log-injection hole once the opt-in tailscale
  # VIP leg fronts :5044 as a raw --tcp passthrough (the tailscale profile enables
  # it). EXTERNAL beats wired to that VIP must now present an LME-CA-issued client
  # cert/key (ssl.certificate / ssl.key) and trust the LME CA -- an operator action.
  beats {
    port                        => 5044
    ssl_enabled                 => true
    ssl_certificate             => "/certs/logstash/logstash.crt"
    ssl_key                     => "/certs/logstash/logstash.key"
    ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    ssl_client_authentication   => "required"
  }
  http  { port => 8085 }
}
output {
  elasticsearch {
    hosts    => ["https://lme-elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    cacert   => "/certs/ca/ca.crt"
  }
}
