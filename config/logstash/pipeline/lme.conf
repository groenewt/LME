input {
  # Beats input, TLS-enabled with the internal LME CA leaf.
  # Cert/key are the "logstash" instance leaf minted by elasticsearch-certutil
  # from config/setup/instances.yml (SAN: lme-logstash, logstash, localhost,
  # 127.0.0.1). This encrypts the beats->logstash leg that was previously
  # plaintext. The raw 5044 port is bound to loopback in the quadlet and, when
  # opted in, fronted by the host-facing tailscale ingress (see
  # ansible/roles/podman/tasks/tailscale_ingress.yml).
  #
  # Setting names are the 8.18 (logstash-input-beats 7.x) normalized form
  # (ssl_enabled, not the deprecated `ssl`).
  #
  # Client-cert (mTLS) is intentionally OFF: no in-repo beat sets
  # output.logstash / ships an LME client cert, so requiring one would break
  # ingestion. To require mTLS once endpoints are issued client certs from the
  # LME CA, uncomment the two ssl_certificate_authorities / ssl_client_authentication
  # lines below.
  beats {
    port                  => 5044
    ssl_enabled           => true
    ssl_certificate       => "/certs/logstash/logstash.crt"
    ssl_key               => "/certs/logstash/logstash.key"
    # ssl_certificate_authorities => ["/certs/ca/ca.crt"]
    # ssl_client_authentication   => "required"
  }
  http  { port => 8085 }
}
output {
  elasticsearch {
    hosts    => ["https://lme-elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTICSEARCH_PASSWORD}"
    cacert   => "/certs/ca/ca.crt"
  }
}
