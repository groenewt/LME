# MAIN resolves this pure role input after topology/artifact resolution and the
# controller credential materializer, then invokes the application phase on silmaril.
- name: Resolve the Malcolm application role from MAIN-owned inputs
  ansible.builtin.set_fact:
    malcolm_platform_resolved_vars: "{{ lme_runtime_inventory | lme_malcolm_resolved_role_config(inventory_hostname, lme_credential_material) }}"

- name: Deploy the resolved Malcolm platform on the designated guest
  ansible.builtin.include_role:
    name: malcolm_platform
  vars:
    malcolm_platform_config: "{{ malcolm_platform_resolved_vars.malcolm_platform_config }}"
  tags: [malcolm_platform, observability]
