version: 1
malcolm_platform:
  application:
    guest: silmaril
    owner: lmemalcolm
    runtime: docker
    privileged_exception: true
    exception_scope:
      - pinned_upstream_compose
      - docker_socket_for_dedicated_noninteractive_owner
    memory_gib: 32
    vcpus: 8
    guest_memory_gib: 48
    capture_on_analysis_host: false
  fixture_helper:
    owner: lmecapture
    runtime: podman
    rootless: true
    privileged: false
    endpoint_scope: designated_guest
    designated_guest_id: silmaril-malcolm
    function: offline_pcap_materialization_and_upload
    network_capture: false
  tls:
    certificate_producer: main_credential_materializer
    listener_port: 5045
    client_authentication: required
    server_identity_source: resolved_inventory
  readback:
    path: /mapi/document
    doctype: host
    identity_fields: [event.id, event.hash, host.name]
  acceptance:
    live_claims_from_fixture_files: false
    network_lanes: [zeek, suricata_harmless_alert, arkime]
