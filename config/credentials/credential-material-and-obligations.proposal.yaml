---
# =============================================================================
# C (security / credentials) MATERIAL CATALOG + LOCAL-PRODUCTION OBLIGATION
# PROPOSAL -- schema-validated, NOT wired.
#
# session lme-02, C security/network worker. Mirrors the delivery shape D used
# (config/postgresql-platform/*.contract.yaml) and E used
# (config/collection/collection-material-and-obligations.proposal.yaml): a
# domain-owned proposal file that C1 (sole writer of manifests/global.yml +
# lme_config_registry) FOLDS into the single canonical registry. NOTHING here is
# read by a renderer or the loader (no unit-byte change; projection UNCHANGED). It
# is a REQUIREMENTS/DISPOSITION INPUT pending C1 integration -- do NOT treat its
# predicates as enforced merely because it parses.
#
# WHY A PROPOSAL, NOT A ROLE-VARS CATALOG: the material_catalog is single-writer C1
# (manifests/global.yml lme_global.material_catalog). Declaring these in the
# secrets_distribution role vars would read as a PARALLEL catalog the loader never
# consumes. So C authors the definitions HERE, schema-checked against the REAL
# engine filters, for a JOINT wave that lands C's catalog defs + E's obligations
# + the local-production mechanism together (that wave flips
# lme_config_registry.material_requirements_schema.enforcement_status.loader_wired).
#
# EVIDENCE: validated against the ACTUAL engine filters (not safe_load alone) --
#   lme_validate_material_catalog (C's distributable defs PASS),
#   lme_validate_material_requirements (distributed obligations PASS; a private_key
#     distributed obligation FAILS at the distributability line -- documents the gap),
#   and the local-production form under the PROPOSED schema delta (record shape PASSES;
#     only the one distributability conditional remains for C1 to add).
#   See config/credentials/verify_credential_proposal.py output in the C sitrep.
#
# fold_target: manifests/global.yml (lme_global.material_catalog) +
#   lme_config_registry.material_requirements_schema (the local-production delta).
# canonical_paths:
#   required_material: lme_resolved.required_material.<node>.<svc>.<obligation>
#   database membership: lme_resolved.database.domains.<id>.members / etcd_groups.<id>.members
# references:
#   - claude-C1-schema-projection-sitrep-20260923-0644 (catalog_debts owed_by_C, enforcement_status)
#   - config/collection/collection-material-and-obligations.proposal.yaml (E: consumer_local_tls_key_obligations = OWED_BY_C_MECHANISM; owner:C defs)
#   - codex-0700 C/D boundary; codex-0715 interface_precision (custody/signing split)
#   - config/postgresql-platform/fencing-protocol.contract.yaml (guardian custody A1..A5)

fold_target: manifests/global.yml
not_wired: true            # no loader/renderer reads this; folds in the joint wave
supersedes_on: loader_wired==true   # retire this transcription once C1 folds it

# ---------------------------------------------------------------------------
# 1. C-AUTHORED MATERIAL CATALOG DEFINITIONS (DB-domain credentials + certs).
#    Each is a payload DEFINITION only (kind + payload_validity [+ description]);
#    placement lives on the obligation. `owner:` is a C annotation, NOT a schema
#    field -- lme_validate_material_catalog REJECTS an undeclared catalog field, so
#    the verifier STRIPS owner: before validating (mirrors E's fold note). Every
#    kind is drawn from material_catalog_schema.definition.kind.vocab.
# ---------------------------------------------------------------------------
c_material_catalog_definitions:
  # --- DISTRIBUTABLE public/cert/password/config material (crosses hosts) -------
  lme_pg_domain_ca_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_x509_ca_certificate
    description: >-
      Per-domain PostgreSQL CA PUBLIC certificate (pki/pg-<domain>/ca.crt). Distributed
      as a trust anchor; the CA PRIVATE key is never a catalog material (host-local, mint-only).
  lme_pg_server_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_x509_server_certificate
    description: >-
      Per-member PostgreSQL SERVER leaf certificate (CN = host fqdn, SANs include the
      pg-<domain>-rw pass-through alias + tailscale IP). Public half; distributed to the member.
  lme_pg_client_cert:
    owner: C
    kind: certificate
    payload_validity: non_empty_pem_x509_client_certificate
    description: >-
      PostgreSQL CLIENT leaf certificate (principal / patroni / backup; CN == connecting
      role for clientcert=verify-full). Public half; distributed to the consuming owner.
  lme_role_password:
    owner: C
    kind: password_file
    payload_validity: non_empty_single_line_secret
    description: >-
      A single database role's password file (<role>.password, mode 0600). The distributed
      SECRET VALUE for a role; produced centrally, never rotated in place.
  lme_role_passwords_json:
    owner: C
    kind: json
    payload_validity: valid_json_object_path_map_no_secret_values
    description: >-
      role-passwords.json: a role -> /run/secrets/roles/<role>.password PATH MAP with NO
      secret values (the values live in lme_role_password files). Distributed config, not a secret.
  lme_pg_service_conf:
    owner: C
    kind: conf
    payload_validity: valid_pg_service_conf_no_secret_values
    description: >-
      pg_service.conf per domain (connection service definitions; host/port/sslmode). No
      secret values. Distributed config.

  # --- HOST-LOCAL PRIVATE KEYS -- DEFINITIONS ONLY (kind private_key is in the vocab
  #     but NOT in distributable_kinds, so no obligation may material_ref it for
  #     DISTRIBUTION). The enforceable production/custody obligation is the
  #     local_production_obligation_form below. -----------------------------------
  guardian_signer_private_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_ed25519_private_key
    description: >-
      The fencing guardian's Ed25519 PRIVATE signing key. Host-local to the SIGNER node
      ONLY; runtime plaintext at /run/lme-fencing-signer/<deployment_identity>/<signer_id>/
      guardian.key; encrypted-durable custody per config/postgresql-platform/
      fencing-protocol.contract.yaml (A1..A5). NEVER distributed; custody_ref =
      guardian custody registry (owed, see custody_semantics).
  lme_pg_server_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_private_key
    description: >-
      Per-member PostgreSQL SERVER private key. MIGRATION TENSION (see
      db_private_key_distribution_reconciliation): today the credential_materializer
      central-mints and DISTRIBUTES this; the catalog security model makes private_key
      NON-distributable. Target = local production per member. Flagged to C1/D, not asserted.
  lme_pg_client_key:
    owner: C
    kind: private_key
    payload_validity: non_empty_pem_private_key
    description: >-
      PostgreSQL CLIENT private key (principal / patroni / backup). Same MIGRATION TENSION
      as lme_pg_server_key.

# ---------------------------------------------------------------------------
# 1b. C-RATIFIED DEFINITIONS already DECLARED by E as owner:C (do NOT re-declare;
#     a duplicate name is a fold conflict). C RATIFIES their semantics here.
#     (config/collection/collection-material-and-obligations.proposal.yaml)
# ---------------------------------------------------------------------------
c_ratified_definitions:
  lme_internal_ca:        {kind: certificate,   distributable: true,  note: "internal LME CA public cert; ratified"}
  elastic_password:       {kind: password_file, distributable: true,  note: "ES elastic superuser password; ratified"}
  kibana_system_password: {kind: password_file, distributable: true,  note: "kibana_system password; ratified"}
  elasticsearch_tls_key:  {kind: private_key,   distributable: false, note: "host-local; covered by local_production_obligation_form"}
  kibana_tls_key:         {kind: private_key,   distributable: false, note: "host-local; covered by local_production_obligation_form"}
  fleet_server_tls_key:   {kind: private_key,   distributable: false, note: "host-local; covered by local_production_obligation_form"}

# ---------------------------------------------------------------------------
# 2. LOCAL-PRODUCTION OBLIGATION FORM -- the mechanism E's
#    consumer_local_tls_key_obligations (OWED_BY_C_MECHANISM) is blocked on, and
#    the target shape for the DB private keys. "Local production != distribution":
#    a consumer-local private key is PRODUCED on the consumer host and NEVER
#    distributed; a material_ref to it must NOT be read as distribution authority
#    (codex-0645 security_boundary). Today the obligation record REQUIRES a
#    distributable material_ref (lme_manifests.py:1024-1029, UNCONDITIONAL), so this
#    class is INEXPRESSIBLE. This delta makes it expressible WITHOUT weakening the
#    private-key distribution ban.
# ---------------------------------------------------------------------------
local_production_obligation_form:
  # (a) SCHEMA delta -- add to lme_config_registry.material_requirements_schema.record:
  proposed_record_field:
    production: {type: str, required: false, vocab: [distributed, local_host]}   # absent => distributed (back-compatible)
  # (b) a value-pure production-forms closure (mirrors placement_forms), added to
  #     material_requirements_schema:
  proposed_production_forms:
    distributed:
      material_ref_kind: distributable        # material_ref MUST be a distributable kind (today's rule)
      requires: []
      emits_distribution: true
    local_host:
      material_ref_kind: any_declared_kind     # MAY reference a non-distributable (private_key) def
      requires: [producer_ref]                 # the local producer MUST be named (e.g. setup-certs)
      forbids: []
      consumer_scope: host_local               # the consumer is on the producing host; no cross-host placement
      emits_distribution: false                # NEVER added to any grant/distribution set
  # (c) the ONE Python conditional C1 adds at lme_manifests.py:1024-1029 (replacing the
  #     unconditional distributability raise). Stated as pseudocode for C1 to integrate
  #     value-purely (rule READ from proposed_production_forms, not hardcoded):
  proposed_validator_rule: >-
    production = rec.get('production', 'distributed'); form = production_forms[production].
    If form.material_ref_kind == 'distributable': REQUIRE catalog[material_ref].kind in
    distributable_kinds (today's behavior). Else (local_host): REQUIRE catalog[material_ref].kind
    in the kind vocab (a valid def) AND producer_ref present AND the obligation is marked
    emits_distribution=false so no consumer/producer ever places it cross-host. A distributed
    obligation whose material_ref is a private_key STILL FAILS (ban intact).
  # (d) the obligations this form unblocks (E's keys + the DB target), expressed in the
  #     PROPOSED shape. Validated against the REAL record checks under the proposed schema
  #     (all shape/placement/profile/mode checks PASS; only the distributability conditional
  #     above remains). Owner uid + modes are E's VERIFIED values (certs role main.yml).
  unblocked_obligations:
    elasticsearch_tls_key_local:
      material_ref: elasticsearch_tls_key
      production: local_host
      producer_ref: setup-certs
      placement_class: secrets
      consumer: elasticsearch
      profile_condition: install_elastic_services
      destination: config/certs/elasticsearch/elasticsearch.key
      owner_role: elasticsearch
      mode: "0640"
      custody_ref: host_local_file_custody
      lifecycle: bootstrap
      retention: durable
    kibana_tls_key_local:
      material_ref: kibana_tls_key
      production: local_host
      producer_ref: setup-certs
      placement_class: secrets
      consumer: kibana
      profile_condition: install_elastic_services
      destination: config/certs/kibana/kibana.key
      owner_role: kibana
      mode: "0640"
      custody_ref: host_local_file_custody
      lifecycle: bootstrap
      retention: durable

# ---------------------------------------------------------------------------
# 3. DB PRIVATE-KEY DISTRIBUTION RECONCILIATION (owed; do NOT auto-apply).
#    The credential_materializer today CENTRAL-MINTS pg server/client private keys
#    on the controller staging dir and DISTRIBUTES the .key files to member/owner
#    secret dirs. That is distribution of private_key material, which the catalog
#    security model forbids via the obligation mechanism. Two coherent end-states;
#    C1+D choose (this proposal does NOT silently pick one):
# ---------------------------------------------------------------------------
db_private_key_distribution_reconciliation:
  status: OWED_JOINT_C1_D
  option_local_production:
    detail: >-
      Each member PRODUCES its own server/client private key locally (local_host form),
      submits a CSR, and only the SIGNED CERT (public, distributable) crosses hosts. No
      private key is ever distributed. Matches the catalog ban; larger materializer change.
  option_scoped_distribution_exception:
    detail: >-
      Keep central mint but declare an EXPLICIT, audited intra-deployment private-key
      distribution exception (a distinct obligation class, NOT via the generic material_ref),
      scoped to same-deployment member secret dirs. Weaker; must be typed + logged, never the
      generic distributable path.
  recommendation: option_local_production (aligns with the security model + E's consumer-local pattern)

# ---------------------------------------------------------------------------
# 4. KIND RECONCILIATION -- env_file + pgpass/dsn.
# ---------------------------------------------------------------------------
kind_reconciliation:
  env_file:
    problem: >-
      `env_file` is NOT in material_catalog_schema.definition.kind.vocab; D owes a
      patroni_env definition (a key=value env file, e.g. lme-environment.env / patroni.env).
    options:
      map_to_conf:
        detail: "Model patroni_env as kind `conf` (already in the vocab + distributable). No schema change. RECOMMENDED unless env semantics diverge."
      add_env_file_kind:
        detail: "Add `env_file` to kind_vocab + distributable_kinds if env files need distinct payload_validity (e.g. no secret values inline vs a secret-bearing env). Schema change."
    owner: D (patroni_env definition) + C1 (vocab, if add_env_file_kind)
  pgpass_dsn:
    detail: "pgpass + dsn kinds are in the vocab + distributable; the pgpass/dsn DEFINITIONS are D's per the extension contract (DB replicator/etcd cert + pgpass). C does not author them."
    owner: D

# ---------------------------------------------------------------------------
# 5. CUSTODY SEMANTICS -- two distinct custody classes C defines. custody_ref on an
#    obligation resolves against these once C1 lands the custody registry (owed).
# ---------------------------------------------------------------------------
custody_semantics:
  guardian_encrypted_durable_custody:
    applies_to: [guardian_signer_private_key]
    detail: >-
      Encrypted-durable authority-reference + runtime-only signer plaintext; epoch +
      guardian_pub_fingerprint bound into the KDF; recovery independent of signer host + DB;
      pair-verify before publish; guard on a verified pair, never pub existence (A1..A5,
      fencing-protocol.contract.yaml). Producer = tasks/guardian_custody.yml (signer node).
    registry_owed: >-
      manifests/global.yml custody registry keyed by deployment_identity + signer_id
      (C1 catalog_debts.owed_registries). Until it lands, the declared source is
      ansible/roles/secrets_distribution/vars/guardian_custody.yml (drift-checked to the contract).
  host_local_file_custody:
    applies_to: [elasticsearch_tls_key, kibana_tls_key, fleet_server_tls_key, lme_pg_server_key, lme_pg_client_key]
    detail: >-
      Host-local file custody: owned by the cert-owner uid the manifest `certs:` block
      derives (lme_manifests.cert_owner), mode per the producer (setup-certs workspace 0600 /
      published bundle 0640; VERIFIED from ansible/roles/certs/tasks/main.yml). Produced
      host-locally; NEVER distributed; NEVER deleted to satisfy the distributable restriction.

# ---------------------------------------------------------------------------
# 6. RESIDUALS + OWNERSHIP ROUTING.
# ---------------------------------------------------------------------------
residuals:
  - id: OWED-local-production-python-conditional
    detail: local_production_obligation_form.proposed_validator_rule is a ONE-conditional change at lme_manifests.py:1024-1029 + the record/production_forms schema delta.
    owner: C1 (integrates the schema delta + the value-pure conditional)
    gate: joint wave lands C's catalog defs + E's obligations + this mechanism together; flips loader_wired.
  - id: OWED-db-private-key-distribution
    detail: db_private_key_distribution_reconciliation -- choose local production vs a typed scoped exception.
    owner: C1 + D + C
    gate: reconciliation decision before the DB flow migrates to the obligation model.
  - id: OWED-env-file-kind
    detail: kind_reconciliation.env_file -- map patroni_env to conf, or add an env_file kind.
    owner: D (definition) + C1 (vocab)
    gate: D authors patroni_env.
  - id: OWED-custody-registry
    detail: custody_semantics.*.registry_owed -- the deployment_identity+signer_id custody registry (C1 owed_registries).
    owner: C1 (registry shape) + C (guardian custody source)
    gate: C1 lands the custody registry; custody_ref closure arms.
