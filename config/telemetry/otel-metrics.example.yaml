# Candidate for otelcol-contrib 0.161.0. Native-validate the exact binary/image.
# Owner-local TLS/auth proxy exposes these two fixed routes; no unauthenticated LAN binding.
# HB-origin native samples always use elastic_only to avoid export-back-to-HB loops.
receivers:
  otlp/elastic_only:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
  otlp/mirror:
    protocols:
      http:
        endpoint: 127.0.0.1:14319
extensions:
  file_storage/elastic_metrics:
    directory: /var/lib/lme-telemetry/metrics-elastic
    create_directory: true
  file_storage/hertzbeat_metrics:
    directory: /var/lib/lme-telemetry/metrics-hertzbeat
    create_directory: true
  bearertokenauth/elastic:
    scheme: ApiKey
    filename: /run/secrets/otel-elastic-api-key
  bearertokenauth/hertzbeat:
    filename: /run/secrets/otel-hertzbeat-token
exporters:
  elasticsearch/metrics:
    endpoints: [https://graph.example.ts.net:9200]
    auth:
      authenticator: bearertokenauth/elastic
    tls:
      ca_file: /etc/lme/pki/ca.pem
      insecure: false
      insecure_skip_verify: false
    mapping:
      allowed_modes: [ecs]
    metrics_index: lme-native-metrics
    sending_queue:
      enabled: true
      storage: file_storage/elastic_metrics
      sizer: bytes
      queue_size: 268435456
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
  otlphttp/hertzbeat_metrics:
    metrics_endpoint: https://trixie.example.ts.net/api/otlp/v1/metrics
    encoding: json
    compression: none
    auth:
      authenticator: bearertokenauth/hertzbeat
    tls:
      ca_file: /etc/lme/pki/ca.pem
      insecure: false
      insecure_skip_verify: false
    sending_queue:
      enabled: true
      storage: file_storage/hertzbeat_metrics
      sizer: bytes
      queue_size: 268435456
      num_consumers: 2
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      max_elapsed_time: 0s
service:
  extensions: [file_storage/elastic_metrics, file_storage/hertzbeat_metrics, bearertokenauth/elastic, bearertokenauth/hertzbeat]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    metrics/elastic_only:
      receivers: [otlp/elastic_only]
      exporters: [elasticsearch/metrics]
    metrics/mirror:
      receivers: [otlp/mirror]
      exporters: [elasticsearch/metrics, otlphttp/hertzbeat_metrics]
