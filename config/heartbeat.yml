heartbeat.monitors:
  - type: http
    id: lme-elasticsearch
    name: Elasticsearch
    schedule: '@every 30s'
    hosts: ["https://lme-elasticsearch:9200"]
    username: elastic
    password: "${ELASTICSEARCH_PASSWORD}"
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-kibana
    name: Kibana
    schedule: '@every 30s'
    hosts: ["https://lme-kibana:5601/api/status"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-wazuh-api
    name: Wazuh Manager API
    schedule: '@every 30s'
    hosts: ["https://lme-wazuh-manager:55000/"]
    check.response.status: [200, 401]   # 401 = API up, auth required
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-fleet-server
    name: Fleet Server
    schedule: '@every 30s'
    hosts: ["https://lme-fleet-server:8220/api/status"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-litellm
    name: LiteLLM
    schedule: '@every 30s'
    hosts: ["https://lme-litellm:4000/health/liveliness"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-dashboard
    name: LME Dashboard
    schedule: '@every 30s'
    hosts: ["https://lme-dashboard:8502/"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-log-analyzer
    name: LME Log Analyzer
    schedule: '@every 30s'
    hosts: ["https://lme-log-analyzer:8501/"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-embeddings
    name: Embeddings
    schedule: '@every 30s'
    hosts: ["https://lme-embeddings:8081/health"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: http
    id: lme-apm-server
    name: APM Server
    schedule: '@every 30s'
    hosts: ["https://lme-apm-server:8200/"]
    ssl.certificate_authorities: ["/certs/ca/ca.crt"]
  - type: tcp
    id: lme-pgvector
    name: pgvector
    schedule: '@every 30s'
    hosts: ["lme-pgvector:5432"]
  - type: tcp
    id: lme-wazuh-agent-comms
    name: Wazuh 1514
    schedule: '@every 30s'
    hosts: ["lme-wazuh-manager:1514"]
  - type: tcp
    id: lme-wazuh-authd
    name: Wazuh 1515
    schedule: '@every 30s'
    hosts: ["lme-wazuh-manager:1515"]

output.elasticsearch:
  hosts: ["https://lme-elasticsearch:9200"]
  username: elastic
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/certs/ca/ca.crt"]

setup.kibana:
  host: "https://lme-kibana:5601"
  username: elastic
  password: "${ELASTICSEARCH_PASSWORD}"
  ssl.certificate_authorities: ["/certs/ca/ca.crt"]

# Heartbeat ships NO bundled Kibana dashboards: /usr/share/heartbeat/kibana is
# EMPTY in the 8.18.x image (unlike filebeat/metricbeat, which populate it), so an
# import hard-fails ("No directory /usr/share/heartbeat/kibana/7") -> exit 1 ->
# systemd crash-loops the unit until it gives up. Keep dashboard setup OFF for
# heartbeat specifically; there is nothing to import.
setup.dashboards.enabled: false

http.enabled: true
