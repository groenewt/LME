# ---------------------------------------------------------------------------------------
# DB MATERIAL CATALOG DEFINITIONS (D contributes payload DEFINITIONS for C1's material_catalog
# EXTENSION CONTRACT; coordinator-0615 "supply reviewed DB material/client/membership definitions").
# Each is a payload-SEMANTICS definition ONLY (kind + validity); PLACEMENT lives on the per-service
# obligation (destination/owner_role/mode/consumer/profile_condition). kind private_key is
# host-local, NON-DISTRIBUTABLE (never a catalog-distributable grant).
# ---------------------------------------------------------------------------------------
db_material_catalog_definitions:
  postgresql_ca:              {kind: certificate, payload_validity: non_empty_pem_certificate, description: "PostgreSQL internal CA (pg-ca.crt) verifying server + replication + client certs."}
  postgresql_server_cert:     {kind: certificate, payload_validity: non_empty_pem_certificate, description: "Patroni/Postgres server TLS cert (pg-server.crt); SAN covers the member address + alias."}
  postgresql_server_key:      {kind: private_key, payload_validity: non_empty_pem_private_key, description: "Server TLS private key (pg-server.key); host-local, non-distributable."}
  postgresql_admin_cert:      {kind: certificate, payload_validity: non_empty_pem_certificate, description: "Superuser client cert (admin.crt) for clientcert=verify-full admin access."}
  postgresql_admin_key:       {kind: private_key, payload_validity: non_empty_pem_private_key, description: "admin.key; host-local."}
  postgresql_admin_pgpass:    {kind: password_file, payload_validity: non_empty_pgpass, description: "admin.pgpass (0600) libpq passfile for the admin role."}
  postgresql_role_passwords:  {kind: json, payload_validity: non_empty_json_object, description: "role-passwords.json (0600): per-role SCRAM secrets consumed at bootstrap."}
  postgresql_service_conf:    {kind: conf, payload_validity: non_empty_pg_service_conf, description: "pg_service.conf (0644): named service connection definitions."}
  patroni_env:                {kind: env_file, payload_validity: non_empty_env_file, description: "patroni.env (0600): EnvironmentFile for the member unit."}
  etcd_ca:                    {kind: certificate, payload_validity: non_empty_pem_certificate, description: "etcd CA (etcd-ca.crt): trusted-ca for etcd client AND server/peer TLS."}
  etcd_client_cert:           {kind: certificate, payload_validity: non_empty_pem_certificate, description: "etcd-client.crt for Patroni's etcd3 client."}
  etcd_client_key:            {kind: private_key, payload_validity: non_empty_pem_private_key, description: "etcd-client.key; host-local."}
  etcd_server_cert:           {kind: certificate, payload_validity: non_empty_pem_certificate, description: "etcd-server.crt for the etcd server + peer TLS (etcd owner)."}
  etcd_server_key:            {kind: private_key, payload_validity: non_empty_pem_private_key, description: "etcd-server.key; host-local (etcd owner)."}
  backup_ca:                  {kind: certificate, payload_validity: non_empty_pem_certificate, description: "backup-ca.crt: pgBackRest TLS repo host CA."}
  backup_client_cert:         {kind: certificate, payload_validity: non_empty_pem_certificate, description: "backup-client.crt for pgBackRest TLS to the off-host repo."}
  backup_client_key:          {kind: private_key, payload_validity: non_empty_pem_private_key, description: "backup-client.key; host-local."}
  postgresql_replicator_cert: {kind: certificate, payload_validity: non_empty_pem_certificate, description: "replicator.crt for physical replication (render L341)."}
  postgresql_replicator_key:  {kind: private_key, payload_validity: non_empty_pem_private_key, description: "replicator.key; host-local."}
  postgresql_physical_pgpass: {kind: password_file, payload_validity: non_empty_pgpass, description: "physical.pgpass (0600): physical replication passfile."}
  postgresql_logical_pgpass:  {kind: password_file, payload_validity: non_empty_pgpass, description: "logical.pgpass (0600): logical subscription passfile (dual-owned-ha)."}
  replication_domain_ca:      {kind: certificate, payload_validity: non_empty_pem_certificate, description: "replication-<db>-ca.crt: cross-domain logical replication TLS CA (dual-owned-ha)."}
  replication_domain_cert:    {kind: certificate, payload_validity: non_empty_pem_certificate, description: "replication-<db>.crt: cross-domain logical replication client cert."}
  replication_domain_key:     {kind: private_key, payload_validity: non_empty_pem_private_key, description: "replication-<db>.key; host-local."}

