      bundle filesystem, checks the mv, and re-runs lme_bundle_verify on the committed artifact before
      reporting success; certify/verify task bodies set -euo pipefail. Scratch discriminating cases:
      unreadable file in a required tree -> certify REFUSES nonzero; certificate path pre-existing as a
      DIRECTORY (failed publication, mv lands inside) -> post-publication verify fails -> certify nonzero.
  - id: D-BACKUP-CERTIFIED-VOLUME-SET-AND-DIGEST-UNBOUND
    severity: high
    status: RESOLVED
    how: >-
      lme_bundle_verify now, per certified volume, requires the data dir, requires the local manifest
      content_sha256 == certified digest, and recomputes the data content digest == certified digest;
      it enforces exact set membership (rejecting duplicates rc8, extra/undeclared on-disk members rc8,
      and absent certified members rc7). certify itself now REFUSES a partial volume (a volume dir with
      no data/ from a mountpoint-resolve failure) instead of silently skipping it. Scratch:
      volume+manifest edited together with an intact certificate -> rc5; deleted certified volume -> rc7;
      extra on-disk volume -> rc8; failed volume in bundle -> certify refuses.
    roster_binding_note: >-
      F1 requested "do not derive success from surviving files". The restore roster is still derived
      with `find`, but the pre-mutation gate enforces EXACT certified<->on-disk volume-set equality, so a
      deleted certified member fails (rc7) and an added member fails (rc8) BEFORE any mutation -- the
      find-derived roster cannot silently shrink or grow restoration. The gate, not the find, is the
      authority. (Rebuilding the roster from cert lines is therefore redundant with the exact-set gate.)
  - id: D-RESTORE-COMPLETE-CONTENT-QUALIFICATION-AFTER-MUTATION
    severity: high
    status: PARTIAL
    resolved_part: >-
      Volume DATA content is now fully qualified inside the pre-mutation gate (see above), so a corrupt
      volume is refused BEFORE install/config copying, not only at the later per-volume task (retained as
      defense in depth). The gate was also MOVED EARLIER -- it now runs immediately after
      selected_backup_dir is resolved and BEFORE the topology-classification reads (cluster_recovery_note.txt
      / archived elasticsearch quadlet) that steer ES volume selection, so no uncertified bundle content
      is read to drive behaviour. The restore per-volume file_count recompute was aligned to the library
      (find -printf '.' | wc -c) so a filename containing a newline no longer causes a false rc4 refuse.
    open_part: >-
      Required-SECRET completeness at the executable boundary (the expected owned secret/material set)
      is NOT derivable inside the restore entry point today -> routed to C1 (completeness_anchor).
      A couple of pre-gate reads remain benign (tar.gz basename selection); the behaviour-steering ones
      are now post-gate.
  - id: D-BACKUP-RETRY-AND-OLD-CERTIFICATE-STATE
    severity: high
    status: PARTIAL
    resolved_part: >-
      Stale certificate invalidated at backup start (a reused dir cannot retain a valid cert if the
      new certify is skipped/failed); mktemp staging constrained to the publication filesystem; the
      backup status now records the certification outcome (PRESENT/ABSENT) after certify runs. NEW: the
      play now FAILS (no override, no-ignore-integrity-switch) when the bundle was not certified
      (lme_bundle_cert_result is skipped) -- so an uncertified/partial backup can no longer report
      success to a consumer (rollback_lme.yml gates its rm -rf /opt/lme + destructive volume removal on
      the safety backup succeeding). BEHAVIOUR CHANGE: a PARTIAL backup now fails the play.
    open_part: >-
      A first-class backup GENERATION/REVISION identity + interrupted-operation state model (preserve
      prior valid backups, distinguish incomplete new work) is operational-provenance/ledger territory
      -> routed to B. PARTIALLY narrowed this wave (codex-0915 D-BACKUP-EMPTY-RETRY-CERTIFIES-STALE-DATA):
      the producer now `rm -rf` clears each volume's data/ BEFORE cp (non-empty) and BEFORE the
      empty-manifest write, so per-volume source-since-deleted files no longer survive in a reused dir,
      and a whole prior volumes/<Y>/ dir left in a reused dir is now caught at restore (verify rc8,
      extra/undeclared on-disk member). STILL open: the non-volume TREE payloads (lme/, etc_lme/, ...) are
      still copied with cp -a into an existing tree, so a source-since-deleted file in THOSE trees could
      persist in a reused dir; the durable fix is the generation model (fresh dir per generation) -> B.
  - id: D-BACKUP-DECLARATION-TEMPLATE-RESTORE-DIVERGENCE
    severity: high
    status: RESOLVED   # for producer + restore_lme_master; rollback_lme.yml named residual (codex-0915 #5, commit d493a58)
    how: >-
      content_integrity.sh.j2 is a genuine parameterized Jinja macro (lme_integrity_library(bi)).
      ALL volume-layout names AND manifest field names are now DECLARED in integrity.yml
      (volume_layout.{root_dir,data_dir,manifest_file}; manifest_fields.{count,bytes,listing,content} --
      previously a decorative flat list nothing consumed, now a role-keyed map the library reads) and
      exported as LME_VOLUME_ROOT/_DATA_DIR/_MANIFEST_FILE and LME_MF_COUNT/_BYTES/_LISTING/_CONTENT.
      The remaining 'volumes' Ansible-level literals in restore_lme_master (roster find/stat) and the
      producer VOLUME_DIR now read volume_layout.root_dir (or the exported $LME_VOLUME_ROOT). The restore
      per-volume manifest check no longer hand-inlines a "keep byte-identical to the producer" recompute:
      it calls the shared lme_verify_content_manifest, the SAME library the producer is rendered from, so
      producer and restore cannot drift on field names OR recompute formulas. A fail-closed `:?` guard
      aborts sourcing if any declared name is under-declared (an empty render would make "$root/" a
      rm -rf/verify target). PROOF: scratch rc matrix passes 20/20 on DEFAULT names AND 20/20 with
      volume_layout AND manifest_fields FULLY RENAMED, with zero executable edits (relocation proof).
    residual: >-
      ansible/rollback_lme.yml is a SEPARATE parallel recovery consumer that loads no declaration, calls
      no library function, hardcodes volumes/<name>/data literals, hand-inlines its own manifest check,
      AND bypasses lme_bundle_verify entirely (no bundle-certification gate before its destructive
      restore of /opt/lme + volume rm). Folding it onto this library + the certification gate is a
      dedicated, separately validated change (it is architectural, not a literal swap) -- NOT done this
      wave. See codex_0915 D-BACKUP-DECLARATION-TEMPLATE-RESTORE-DIVERGENCE below and open_items.
      The frozen Python test mechanism is superseded pending a declarative harness (routed to G). F reviews.
  - id: immediate_representation_violation (Python test file)
    status: DISCLOSED_FROZEN
    how: >-
      testing/tests/unit/test_backup_integrity.py is hand-authored Python and violates the universal
      YAML/genuine-Jinja rule (tests are not exempt). It is FROZEN (still green, historical evidence),
      NOT extended. Disposition: replace with a declarative case mechanism modeled on G's
      loader_integration (cases as data + a macro-rendered driver); a spec is routed to G. The Python
      file is removed only after the declarative replacement works. No new Python authored to fix it.
  - id: additional_integrity_limits (digest scope + symlink newline)
    status: RECORDED
    how: >-
      integrity.yml now declares digest_covers/digest_excludes: content_sha256 binds relative path +
      regular-file content + symlink target, and does NOT bind mode/owner/group/dir-metadata/acl/xattr.
      Symlink-target trailing-newline handling: the claim is narrowed to target bytes as returned by
      readlink (command substitution strips a trailing newline); exact-byte symlink handling is an
      open refinement, not claimed closed.

# -----------------------------------------------------------------------------
# codex_0915_recovery_audit_dispositions -- disposition for the five D-BACKUP-*
# findings in codex-manager-enforcement-return-evidence-and-recovery-reconciliation
# -20260923-0915 (review of commit bba0d2a). Fixes land in commits 54bd054 (pile)
# and d493a58 (consolidation). RESOLVED items are behaviorally checked in scratch
# (non-durable, ansible-core 2.17.14; deploy target 2.19.11 UNVERIFIED here).
# -----------------------------------------------------------------------------
codex_0915_recovery_audit_dispositions:
  - id: D-BACKUP-INCOMPLETE-VOLUME-DIRECTORY-OMITTED
    severity: high
    status: RESOLVED
    commit: 54bd054
    how: >-
      Two sides closed. CERTIFY: a volume dir with no data/ (a failed/partial volume) is now REFUSED
      (rc1, no certificate published) instead of silently skipped; the volume enumeration also captures
      the `find` rc so an unreadable volumes/ dir refuses rather than certifying a short set. VERIFY:
      the on-disk enumeration captures the `find` rc, and the `[ -d data ] || continue` was REMOVED, so
      ANY uncertified on-disk volume dir -- including one with no data/ -- is an extra/undeclared member
      and fails rc8 BEFORE any mutation. Scratch: certify-refuse-nodata-volume rc1 (+ leaves no cert);
      extra-ondisk-volume-NO-data rc8; extra-ondisk-volume-with-data rc8.
  - id: D-BACKUP-IO-FAILURE-STATUS-STILL-LOST
    severity: high
    status: RESOLVED
    commit: 54bd054
    how: >-
      The producer 'Backup each volume' body captured `[ "$(ls -A)" ]` truthiness, which treats an
      unreadable mountpoint (ls error, empty stdout) as an empty volume and would certify an empty
      backup for a volume that actually holds unreadable data. It now captures the ls rc explicitly
      (SRC_ENTRIES=...; LS_RC=$?) and fails closed (FAILED status, no manifest, exit 1) on a non-zero
      enumeration. Combined with the existing mountpoint-resolve guard, an I/O failure can no longer be
      laundered into a successful/empty status. (Verified by inspection + syntax-check; a live unreadable
      mountpoint is not reproducible in scratch without root, so this is stated as code-level, not a
      scratch rc case.)
  - id: D-BACKUP-EMPTY-RETRY-CERTIFIES-STALE-DATA
    severity: high
    status: PARTIAL
    commit: 54bd054
    resolved_part: >-
      The cheap, in-scope part is closed: the producer `rm -rf` clears each volume's data/ BEFORE the cp
      (non-empty branch, so cp -a cannot merge a prior generation's since-deleted files into the current
      copy) AND before the empty-manifest write (empty branch, so an empty manifest never certifies stale
      retained payload). A reused backup dir therefore cannot certify mixed-generation VOLUME data.
    open_part: >-
      The durable fix -- a backup GENERATION/REVISION identity so a reused dir is never the mechanism --
      and the analogous cp -a merge on the non-volume TREE payloads (lme/, etc_lme/, ...) remain routed
      to B (see D-BACKUP-RETRY-AND-OLD-CERTIFICATE-STATE open_part).
  - id: D-BACKUP-STATUS-PRESERVATION-AND-PUBLICATION-INCOMPLETE
    severity: high
    status: PARTIAL
    commit: 54bd054
    resolved_part: >-
      Publication is fail-closed: certify stages via mktemp on the publication FS, checks the mv, and on
      post-publication verify FAILURE now `rm -f`s the just-written certificate (never leaves a
      bad-but-present cert -- an absent cert is the safe rc3 state). The play still FAILS with no override
      when the bundle was not certified. Status is preserved per-volume (SUCCESS/EMPTY/FAILED) and the
      backup records the certification outcome.
    open_part: >-
      A first-class play-level pessimistic recovery-status record and the generation/interrupted-operation
      state model are operational-provenance/ledger territory -> routed to B.
  - id: D-BACKUP-DECLARATION-TEMPLATE-RESTORE-DIVERGENCE
    severity: high
    status: RESOLVED   # for producer + restore_lme_master; rollback_lme.yml is a named residual
    commit: d493a58
    how: >-
      codex-0915 #5 requested finishing the declaration-driven producer AND restore consumers (not
      routing production literals to G) and relocating manifest field names. Done: volume-root literals
      relocated to volume_layout.root_dir / $LME_VOLUME_ROOT (producer + restore_lme_master);
      manifest_fields promoted from a decorative flat list to a role-keyed map consumed by the library
      (LME_MF_*); the restore per-volume manifest check now calls the shared lme_verify_content_manifest
      instead of a hand-inlined "byte-identical" recompute. Relocation PROVEN: scratch rc matrix 20/20 on
      default names AND 20/20 with volume_layout + manifest_fields fully renamed, zero executable edits.
    residual: >-
      ansible/rollback_lme.yml (parallel recovery consumer) is NOT converted this wave: it loads no
      declaration, calls no library function, hardcodes volumes/<name>/data, hand-inlines its manifest
      check, and -- most materially -- BYPASSES lme_bundle_verify (no certification gate before its
      destructive restore). This is fail-closed-relevant and architectural; it needs a dedicated,
      separately validated change (include the declaration + render the library + call
      lme_verify_content_manifest + add the lme_bundle_verify pre-mutation gate). Named here + in the
      sitrep + open_items so it is not lost. NOT routed to G (production consumer, D-owned).

