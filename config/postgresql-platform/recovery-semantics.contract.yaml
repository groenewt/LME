# -----------------------------------------------------------------------------
# fail_closed_invariants -- hard rules no future edit may weaken.
# -----------------------------------------------------------------------------
fail_closed_invariants:
  - id: no-listing-as-success
    rule: A restore step must never accept `podman secret ls` (or any list) rc as proof of restoration.
  - id: verify-before-destroy
    rule: No destructive mutation runs before its inputs are proven decryptable/qualified AND the bundle certification is verified.
  - id: no-ignore-integrity-switch
    rule: There is no flag, var, or path that disables digest/manifest/qualification integrity, and no fallback to listing_sha256 when content_sha256 is absent.
  - id: preserve-original-bytes
    rule: Legacy/foreign bundles are preserved byte-exact and digested at qualification; never rewritten in place.
  - id: pessimistic-on-crash
    rule: >-
      An interrupted restore must leave a record that says INCOMPLETE, never an absence that reads
      as success. (Status-record wrapper is residual; the per-step exits already fail loudly.)
  - id: cert-required-before-destroy
    rule: >-
      A backup with no bundle_certification.txt (or no per-volume content_sha256) is REFUSED at
      restore, routed to LEGACY-BUNDLE qualification, never force-restored.
  - id: complete-volume-set-and-data-before-destroy
    rule: >-
      The pre-mutation gate (lme_bundle_verify) binds the COMPLETE certified volume set to disk:
      every certified volume must exist, its local manifest digest must equal the certified digest,
      and a fresh recompute of its data/ must equal the certified digest; any missing, extra,
      duplicate or mismatched member is REFUSED before the first mutation. Restore success is never
      derived from surviving directories.
  - id: no-false-certification
    rule: >-
      Certification stages on the publication filesystem, checks the mv, and RE-VERIFIES the
      committed artifact before reporting success; a read/enumeration/staging failure returns
      non-zero and never contributes an empty digest. A reused backup dir has any stale
      certificate invalidated up front so a skipped/failed certify cannot qualify a new bundle.

