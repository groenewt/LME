# LME PostgreSQL/Patroni durability core -- recovery & restore semantics.
#
# WHAT THIS FILE IS (codex-0700 D-RECOVERY-CONTRACT-NOT-EXECUTION-AUTHORITY):
# a REQUIREMENTS / DISPOSITION record, NOT a live execution authority. safe_load
# succeeding proves syntax, not enforcement. The ENFORCEMENT lives in named
# consumers (see consumers: below); this file binds each recovery finding ID to a
# NARROW delivered check (tagged behavioral | syntax-only | structural) or to a
# named OPEN predicate + owner + gate. Every clause that says a behaviour is
# required but not yet proven fail-closed MUST be read as "required, still open",
# never as "verified property of the entry point".
#
# It COMPLEMENTS (does not supersede) migration-workflow.contract.yaml (never-
# initialized / resume admission) and fencing-protocol.contract.yaml (generation +
# authority fencing, and the C/D signing binding). Cross-owner residuals name
# their owner; nothing here reverts peer work.

contract:
  name: lme-postgresql-recovery-semantics
  version: 2
  domain: D_database
  authority_note: >-
    codex-0700: this contract is NOT execution authority. It does not enforce
    anything by being parsed. Do not claim a predicate is enforced merely because
    safe_load succeeds. The enforceable requirements are folded into the consumers
    below and bound to the ACTUAL restore entry point (ansible/restore_lme_master.yml).
  consumers:
    # The real enforcers this requirements record points at (P2a fold):
    - ansible/roles/backup_lme/vars/integrity.yml            # canonical payload-class + field declaration
    - ansible/roles/backup_lme/templates/content_integrity.sh.j2  # rendered producer+verifier (single source)
    - ansible/roles/backup_lme/tasks/main.yml                # producer: per-volume content_sha256 + bundle certification (gated)
    - ansible/restore_lme_master.yml                         # verifier: bundle cert gate BEFORE first destructive step + per-volume content check
    - testing/tests/unit/test_backup_integrity.py            # behavioral binding to the real files (non-vacuity + honest-limit)
    - testing/tests/unit/test_restore_master_secrets.py      # behavioral binding to the secret-restore task
  unverified_restore_consumers:
    # Recorded, not silently left (codex advisor; D-FENCING-ACTUAL-CALLER-VALIDATION-BYPASS class).
    - path: ansible/rollback_lme.yml
      status: BYPASS
      note: >-
        rollback_lme.yml has its OWN restore path (its "Restore LME installation" tasks) that does
        NOT yet call lme_bundle_verify. It takes a FRESH safety backup via the backup_lme role (which
        now produces a certification), but its restore leg does not verify the certification. The
        CERTIFIED entry point is ansible/restore_lme_master.yml. Folding the same verify gate into
        rollback_lme.yml is owed (owner D); not authored this wave (62KB single play, needs a real
        rollback rehearsal to change safely).
  status_summary: >-
    Content-digest of volumes + install/config trees and a self-consistency bundle
    certification are DELIVERED and behaviorally tested. Adversarial completeness of
    the certification, per-secret content/owner verification, legacy-bundle isolated
    qualification, secret partial-replacement idempotency, ownership-blind prune, and
    the fence/authority seam are OPEN. Runtime acceptance (a real restore from a real
    backup) is OPEN.

  doctrine: >-
    Listing a resource is not restoring it. A restore is SUCCESSFUL only when the
    recovery_union delivered checks pass AND its open predicates are closed;
    anything short of that must FAIL LOUDLY and must not have run any destructive
    step first. There is NO ignore-integrity switch, NO best-effort-secret mode,
    and NO "podman secret ls returned 0 so we are done" acceptance. Fail-closed is
    the correct state; an uncertifiable bundle is REFUSED, not force-restored.

# -----------------------------------------------------------------------------
# recovery_union -- the joint acceptance predicate. Per codex-0700
# D-RECOVERY-CONTRACT-OVERSTATED-LANDING, each clause records delivered_checks
# (narrow, tagged) SEPARATELY from open_predicates. A clause is NOT "landed"
# until its open_predicates are empty.
# -----------------------------------------------------------------------------
recovery_union:
  clauses:
    installation_tree_intact:
      rule: >-
        /opt/lme, /etc/lme, and the quadlet tree are restored WHOLE from the
        selected backup, or the restore fails. A partial/torn tar restore is a
        failure, never a swallow.
      delivered_checks:
        - tag: behavioral
          check: >-
            restore install task uses set -euo pipefail + explicit per-pipeline exit
            capture; a broken tar producer/consumer exits 1 (test_restore_master_secrets
            covers the secret task; install-tree exit capture is syntax-checked).
        - tag: behavioral
          check: >-
            THIS WAVE: each install/config tree (lme, etc_lme, etc_containers_systemd,
            etc_systemd_system_lme, secrets) is content-digest verified against the
            certified bundle BEFORE the install task overwrites it
            (test_backup_integrity: cert gate precedes first destructive task; content
            mismatch refused rc5). Addresses codex-0700 RESTORE-ENTRYPOINT-VERIFICATION-ORDER
            for the tree payloads.
      open_predicates:
        - Whole-transition staging + pessimistic terminal status record on crash (recovery-status-record) -- owner D, gate real restore rehearsal.
    secrets_all_created:
      rule: >-
        Every secret named by the backup contract is (re)created. A single create
        failure fails the restore before activation.
      delivered_checks:
        - tag: behavioral
          check: >-
            CREATE_FAILURES accumulator -> exit 3 before activation/prune
            (test_restore_master_secrets). listing is not restoration.
      open_predicates:
        - Per-secret content digest + owner assertion (see content_and_ownership_verified).
        - Partial-replacement transactionality + unchanged-reapply avoidance (RESTORE-PARTIAL-REPLACEMENT-AND-IDEMPOTENCY).
    no_destruction_before_verification:
      rule: >-
        No existing secret is removed and no live store is mutated until the backup
        payloads are proven decryptable/qualified. An empty/degenerate/unusable
        contract must not wipe live secrets or silently no-op.
      delivered_checks:
        - tag: behavioral
          check: >-
            secret preverify (PREVERIFY_FAILURES -> exit 2) + LIVE_SECRETS guard +
            unusable-contract guard + create-first/prune-stale-after the create gate
            (test_restore_master_secrets). Empty-decrypt payload refused before
            destruction.
        - tag: behavioral
          check: >-
            THIS WAVE: bundle certification is verified BEFORE the first destructive
            task; a missing/torn certification refuses rc3/rc4 (test_backup_integrity).
      open_predicates:
        - RESTORE-MISSING-CONTRACT-FALSE-PASS residual -- both manifest+mapping absent still accepted as no-op without checking a required-secret expected set (lme_resolved not in scope here; owner C1 to project expected set; gate completeness_anchor).
        - RESTORE-SECRET-OWNERSHIP-AND-PRUNE-FAILURE -- prune derives from live names, not a certified owned set; removal errors ignored. Owner D+C1; gate content_and_ownership_verified.
    content_and_ownership_verified:
      rule: >-
        Each restored payload matches its recorded content digest, and each restored
        secret's driver/owner matches the recorded contract. Decrypt success is
        necessary but NOT sufficient.
      delivered_checks:
        - tag: behavioral
          check: >-
            RESTORE-CONTENT-DIGEST for VOLUME data + install/config trees: content_sha256
            over file CONTENTS (+ symlink targets), produced by the shared rendered
            library and re-verified at restore; a same-name/same-size single-byte change
            is refused (test_backup_integrity). NO fallback to listing_sha256 (a
            pre-content-digest manifest is refused rc3).
        - tag: structural
          check: >-
            Secret CIPHERTEXT payloads are content-digested via the etc_lme/ and secrets/
            tree digests (ciphertext bytes, never plaintext). Plaintext byte-fidelity
            (trailing newline) stays a separate LEGACY-BUNDLE residual.
      open_predicates:
        - Per-SECRET content digest recorded in secret_manifest.txt + recomputed at create time (beyond the tree-level ciphertext digest). Owner D; gate backup-producer manifest field.
        - Secret/material OWNER assertion at restore (required_material owners: db-owner, etcd-owner). Owner D+C1 (one settled source, not a second transcription).
    manifest_certified:
      rule: >-
        The backup manifest/bundle is certified (integrity-bound) before it is
        trusted to drive destruction; a tampered/truncated manifest is detected,
        not obeyed.
      delivered_checks:
        - tag: behavioral
          check: >-
            BACKUP-MANIFEST-CERTIFICATION (PARTIAL): bundle_certification.txt binds every
            payload's content digest + a self-consistency bundle_sha256. A TORN or
            accidentally TRUNCATED certification is refused (rc4); a missing certification
            is refused (rc3). Producer refuses to certify a partial/unclean bundle
            (gated when:). test_backup_integrity covers torn + missing + gate.
      open_predicates:
        - >-
          ADVERSARIAL under-declaration -- an attacker who drops a payload line AND recomputes
          bundle_sha256 passes self-consistency (test_backup_integrity documents this honest
          limit). Needs an EXTERNAL anchor -- C1 projects the expected owned set into
          lme_resolved, and/or B records bundle_sha256 in the ledger, and/or the UNWIRED
          guardian signature over bundle_sha256. Owner C1 + B (+ C signature); gate
          integrity.completeness_anchor.
    fence_and_generation_admitted:
      rule: >-
        Before HA rejoin/activation, the current generation + authority fence is
        satisfied per fencing-protocol.contract.yaml; a restored node does not
        self-promote on a stale generation.
      status: PARTIAL   # codex-0700 D-RECOVERY-CONTRACT-OVERSTATED-LANDING: NOT landed:true
      delivered_checks:
        - tag: behavioral
          check: >-
            platform.py observed_generation_check denies (exit 255) a container restart
            unless the observed generation matches the resolved qemu_generation AND a
            deployment_identity-scoped authority marker is present
            (test_postgresql_fencing_identity).
        - tag: behavioral
          check: >-
            rejoin.py fails CLOSED on missing/malformed deployment_identity (no silent
            authorize=None skip) (test_postgresql_rejoin).
      open_predicates:
        - The ExecStartPre compares a LOCAL cloud-init file; there is NO producer/readback
          binding proving it is the current OWNED runtime generation (FENCE-CURRENT-GENERATION-
          AND-AUTHORITY). Local-file match is corroboration, NOT authority.
        - >-
          The 'restart cannot race' and 'adoption rejection' claims are REQUIRED behaviours, NOT
          verified properties -- the absence check + member flock is local corroboration, not
          authoritative serialization. Both gated on the guardian authority seam
          (fencing-protocol.contract.yaml, currently fail-closed / UNSTARTABLE).

