    status: RESOLVED
    how: >-
      lme_bundle_verify now, per certified volume, requires the data dir, requires the local manifest
      content_sha256 == certified digest, and recomputes the data content digest == certified digest;
      it enforces exact set membership (rejecting duplicates rc8, extra/undeclared on-disk members rc8,
      and absent certified members rc7). Scratch: volume+manifest edited together with an intact
      certificate -> rc5; deleted certified volume -> rc7; extra on-disk volume -> rc8.
  - id: D-RESTORE-COMPLETE-CONTENT-QUALIFICATION-AFTER-MUTATION
    severity: high
    status: PARTIAL
    resolved_part: >-
      Volume DATA content is now fully qualified inside the pre-mutation gate (see above), so a corrupt
      volume is refused BEFORE install/config copying, not only at the later per-volume task. The later
      per-volume check is retained as defense in depth.
    open_part: >-
      Required-SECRET completeness at the executable boundary (the expected owned secret/material set)
      is NOT derivable inside the restore entry point today -> routed to C1 (completeness_anchor).
  - id: D-BACKUP-RETRY-AND-OLD-CERTIFICATE-STATE
    severity: high
    status: PARTIAL
    resolved_part: >-
      Stale certificate invalidated at backup start (a reused dir cannot retain a valid cert if the
      new certify is skipped/failed); mktemp staging constrained to the publication filesystem; the
      backup status now records the certification outcome (PRESENT/ABSENT) after certify runs.
    open_part: >-
      A first-class backup GENERATION/REVISION identity + interrupted-operation state model (preserve
      prior valid backups, distinguish incomplete new work) is operational-provenance/ledger territory
      -> routed to B. Not authored this wave.
  - id: D-BACKUP-DECLARATION-TEMPLATE-RESTORE-DIVERGENCE
    severity: high
    status: PARTIAL
    resolved_part: >-
      content_integrity.sh.j2 is now a genuine parameterized Jinja macro (lme_integrity_library(bi));
      write_content_manifest + the copy-vs-source guard are library functions (no hand-inlined digest
      shell in the producer task); volume data-dir + manifest-file names are DECLARED in integrity.yml
      (volume_layout) and consumed on BOTH sides via LME_VOLUME_DATA_DIR/_MANIFEST_FILE and the Jinja
      declared values in restore. A name change in the declaration relocates the producer, the library,
      the gate and the restore per-volume check.
    open_part: >-
      A few Ansible-level restore paths still spell 'volumes' literally (roster find/stat at
      restore_lme_master ~716-736); full declaration-only relocation of the roster derivation remains.
      The Python test mechanism (below) is superseded pending a declarative harness. F reviews.
  - id: immediate_representation_violation (Python test file)
    status: DISCLOSED_FROZEN
    how: >-
      testing/tests/unit/test_backup_integrity.py is hand-authored Python and violates the universal
      YAML/genuine-Jinja rule (tests are not exempt). It is FROZEN (still green, historical evidence),
      NOT extended. Disposition: replace with a declarative case mechanism modeled on G's
      loader_integration (cases as data + a macro-rendered driver); a spec is routed to G. The Python
      file is removed only after the declarative replacement works. No new Python authored to fix it.
  - id: additional_integrity_limits (digest scope + symlink newline)
    status: RECORDED
    how: >-
      integrity.yml now declares digest_covers/digest_excludes: content_sha256 binds relative path +
      regular-file content + symlink target, and does NOT bind mode/owner/group/dir-metadata/acl/xattr.
      Symlink-target trailing-newline handling: the claim is narrowed to target bytes as returned by
      readlink (command substitution strips a trailing newline); exact-byte symlink handling is an
      open refinement, not claimed closed.

