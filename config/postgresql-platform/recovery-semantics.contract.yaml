    severity: high
    status: RESOLVED
    how: >-
      content_integrity.sh.j2 functions now fail-closed (missing input returns non-zero, not a
      MISSING/rc0 sentinel; sha256sum read failures and unreadable subtrees propagate via pipefail;
      no empty digest field is emitted). lme_content_sha256 captures the subshell rc with `|| rc=$?`
