  # ===========================================================================
  # guardian_cd_binding -- the shared C/D interface contract for the guardian
  # AUTHORITY SERVICE's use of C's signing primitive (codex-0700 ownership split;
  # codex-0715 interface_precision). D (accountable author of the authority
  # service + control.sock/authority protocol) is the DESIGN-FIRST author here.
  #
  # STATUS: UNWIRED / PROPOSED. This section is ADDRESSED TO C for mutual ack. It
  # binds to C's DECLARED primitive at
  #   ansible/roles/secrets_distribution/vars/guardian_custody.yml#guardian_signing_interface
  # RE-PINNED to C's frozen_set_A_v2 COMMITTED interface (see binding_pin below): the committed
  # guardian_custody.yml blob at commit ce414b9, full content sha256 239cf586...  (SUPERSEDES the
  # prior 45f18ce3 pin at 775af2e; older ebc5e850/a33d08d were proposals). This re-pin is
  # PROVENANCE ONLY -- it re-anchors the byte pin to the file C actually committed; it is NOT joint
  # semantic acceptance (signed-field coverage + authority-epoch semantics stay OPEN, below).
  # codex-0745 was a useful proposal, NOT an implemented
  # boundary; this is still NOT yet a mutual ack. Integration is GATED on that mutual C/D
  # ack AND on the guardian authority service existing (fail-closed / UNSTARTABLE today).
  # NO unit template is authored this wave; nothing here is wired to consume
  # guardian_custody.yml yet.
  #
  # BOUNDARY (unchanged): reaching the key OR the socket is NOT authorization. A
  # signature is produced ONLY after D's authority protocol has CONSUMED an
  # authorization for the CURRENT leased epoch. C never mints the epoch (A4).
  # ===========================================================================
  guardian_cd_binding:
    status: UNWIRED_PROPOSED_AWAITING_C_ACK
    consumes: ansible/roles/secrets_distribution/vars/guardian_custody.yml#guardian_signing_interface

    # binding_pin -- the EXACT interface revision this binding is written against, so a later
    # edit of guardian_custody.yml cannot silently move the boundary under an existing ack.
    # Pinned to C's HANDED-BACK final interface. The pin is the COMMITTED blob (not the
    # working tree, which has drifted while a C relaunch edits the file); mutual C/D ack is
    # taken against this committed content, and any re-ack must re-pin.
    binding_pin:
      file: ansible/roles/secrets_distribution/vars/guardian_custody.yml
      section: guardian_signing_interface
      content_sha256: 239cf58691d3e8980b16557ca3831f6894eea8d99198120da8f10e7447508c69
      pinned_commit: ce414b9   # C's frozen_set_A_v2 commit (parent cd3e837); verified ce414b9:<file> == worktree == this sha256
      supersedes_pin: 45f18ce3de0365b246bf40ed59095a3df4768f9fafe9a2c8f507f3036332c1fe   # prior pin (commit 775af2e), now superseded
      working_tree_drift_note: >-
        RESOLVED (2026-09-23): the C relaunch's edits LANDED in commit ce414b9; the working-tree
        blob and the committed blob are now BOTH 239cf586..., so the drift that motivated the prior
        45f18ce3 pin is gone. Re-pinned to the committed 239cf586 content per coordinator + codex
        authorization (re-pin allowed only AFTER the actual commit was confirmed).
      repin_is_provenance_not_ack: >-
        This hash update re-anchors the byte pin ONLY. It is NOT joint semantic acceptance. Per codex:
        the fixed signed-field list (fencing fields_in_order 670-681) carries nonce but NO explicit
        challenge / receipt digest / authenticated full-result digest and declares no nonce->challenge
        equivalence, while authorize:247 + consume:255/260-261 require request_nonce + challenge +
        receipt digest -- so the signed-coverage gap is NOT closed by this re-pin. Mutual C/D ack of
        the exact signed bytes per message kind (joint signed-envelope work) remains REQUIRED.
      ack_status: PROPOSED_AWAITING_C   # mutual ack = closure, not a hash re-pin
    integration_gate: [mutual_C_D_interface_ack, guardian_authority_service_exists]

    # (0) REQUIRED PRECISION -- the LEAD VIABILITY item (coordinator tick25). Before any
    # authority-transition or recovery semantics can be stated without contradiction, three
    # DISTINCT epoch/identity notions that the signing interface touches MUST be kept
    # separate. Conflating any two of them is the root viability defect: it would let a key
    # rotation, an authority handover, or a restore of old ciphertext silently authorize (or
    # silently refuse) a transition. Names below are the ACTUAL fields of the pinned
    # guardian_signing_interface (output_fields / trust_epoch_binding_input) and A2's
    # recovery_store.wrapping_key_ref -- not invented.
    required_precision:
      item_1_three_epoch_identities:
        status: DRAFT_AWAITING_C_ACK
        leased_authority_epoch:
          field: authority_epoch   # guardian_signing_interface.output_fields + trust_epoch_binding_input
          owner: D_database
          meaning: >-
            The CURRENT authority lease held via D's control.sock (etcd leader/reservation +
            lease + monotonic epoch). It answers "who is authorized to authorize a transition
            RIGHT NOW". D mints/advances it; C NEVER mints it (guardian_signing_interface
            not_owned_by_c). A signature is authorized under exactly one authority_epoch and D
            rejects a returned epoch != the supplied one.
          governs: authority-transition (promote/revoke/drain/permit-start), NOT key trust, NOT ciphertext age.
        signing_key_identity_and_rotation:
          field: guardian_pub_fingerprint   # output_fields; expected form = trust_epoch_binding_input.expected_pub_fingerprint
          owner: C_custody   # C emits at bootstrap/rotation; D RECORDS the expectation and supplies it back
          meaning: >-
            SHA-256 of the guardian DER SubjectPublicKeyInfo public key -- the IDENTITY of the
            key that produced a signature. Rotation changes THIS (a new keypair -> a new
            fingerprint), independently of whether the authority lease changed. Trust = the
            signing key's structurally-parsed fingerprint equals D's recorded expectation FOR
            the current authority_epoch (precondition_epoch_binding).
          governs: which signature bytes are trusted; a rotation is bound to a specific epoch (rotation_interleaving), it does NOT itself advance authority.
          not_the_same_as: leased_authority_epoch   # a rotation may occur within one authority_epoch; an authority handover may occur without a rotation.
        ciphertext_wrapping_epoch:
          field: recovery_store.wrapping_key_ref   # AMENDMENT A2 (recovery_store), C custody owned
          owner: C_custody
          meaning: >-
            The epoch/identity of the WRAP (key-encryption) key under which recovery-store /
            backup ciphertext was encrypted at rest. It answers "which KEK can decrypt THIS
            ciphertext", and it advances on wrap-key rotation while prior-epoch ciphertext is
            preserved (guardian_custody wave-5c). It is NEITHER the signing-key identity NOR
            the authority lease: old ciphertext stays decryptable under its own wrapping epoch
            long after the signing key rotated and after many authority handovers.
          governs: decryptability of recovered ciphertext, NOT authorization and NOT signature trust.
        why_distinct: >-
          A restore is the case that forces the separation: recovered ciphertext carries an
          OLD ciphertext_wrapping_epoch; it must be decryptable under that old wrap epoch, yet
          the restore action must be authorized under the CURRENT leased_authority_epoch and
          any restore-authorization signature must verify against the CURRENT
          signing_key_identity. Binding restore admission to the ciphertext's wrapping epoch,
          or trusting a signature because the wrapping epoch matches, would be the viability
          bug this item exists to forbid.
      authority_transition_semantics:
        status: DRAFT_AWAITING_C_ACK
        transition_authorized_under: leased_authority_epoch   # the ONLY epoch that authorizes a transition
        rule: >-
          Every authority transition (promote | revoke | drain | permit-start | restart) is
          authorized under the CURRENT leased_authority_epoch and serialized through the sole
          engine path (serialization/revoke_interleaving above). A transition NEVER derives its
          authority from a key fingerprint or a ciphertext wrapping epoch. A signature produced
          under authority_epoch N is not valid for a transition claimed under epoch N+1
          (d_side_acceptance), and single-use nonce CAS makes a since-revoked authorization
          non-replayable.
      recovery_semantics:
        status: DRAFT_AWAITING_C_ACK
        rule: >-
          On recovery/restore: (1) admission is authorized under the CURRENT
          leased_authority_epoch, never under the restored bundle's ciphertext_wrapping_epoch;
          (2) restored ciphertext is decrypted under ITS OWN ciphertext_wrapping_epoch via the
          independently-held wrapping key (recovery_store.wrapping_key_ref, A2), then MUST be
          re-wrapped to the current wrapping epoch before it is treated as live custody; (3) any
          restore-authorization signature is verified against the CURRENT signing_key_identity
          (expected_pub_fingerprint) for the current authority_epoch -- a signature that only
          verifies against a prior key is REFUSED. Absence of the authority is UNSTARTABLE, never
          a default-allow (invariant below).
        routed_open:
          - "C: ACK that recovery_store.wrapping_key_ref is the SOLE carrier of ciphertext_wrapping_epoch and that prior-epoch wrap keys remain resolvable for decrypt-then-rewrap (wave-5c preserve-prior-epoch-ciphertext)."
          - "D: the concrete restore-authorization signature seam is the same canonical_message binding (message_kind=authorize over a restore transition); it stays UNWIRED until the guardian authority service exists."

    # (1) The CANONICAL SIGNED MESSAGE BYTES D hands to C's signing primitive.
    # D constructs this; C signs the exact bytes and does NOT interpret them.
    canonical_message:
      domain_separation_tag: "lme.guardian.authority.v1"   # first field; prevents cross-protocol reuse
      encoding: >-
        A deterministic, length-prefixed field list: the tag, then each field below
        in the FIXED order, each as decimal-length + ':' + raw UTF-8 bytes, joined by
        no separator (canonical; no whitespace, no map ordering ambiguity). D computes
        it identically on sign and on verify.
      fields_in_order:
        - message_kind          # one of: authorize | consume_result | route | revoke | inhibit
        - operation             # the f:operation:* identity
        - run_id
        - deployment_identity   # stable identity (NOT run_id) the authority is keyed on
        - domain                # hertzbeat | vector | shared (exact-domain binding)
        - node
        - qemu_generation       # the canonical observed generation UUID (exact-generation binding)
        - action                # bootstrap | promote | restart | rejoin | drain | stop
        - authority_epoch       # D's CURRENT leased epoch (A4; consumed input, C never mints)
        - nonce                 # single-use; consumed via control.sock CAS
        - not_after_epoch_seconds  # integer expiry
      note: >-
        The restart-fence authorization file is CURRENTLY unsigned plaintext (handoff.who_signs);
        this binding is the seam that lets D produce a SIGNED restart authorization over these exact
        bytes, closing the non-promoting-restart gap (open_items 'signed restart authorization').

    # (2) The AUTHORITY CONTEXT that must already hold before D asks C to sign.
    authority_context_precondition:
      leased_epoch_held: "D holds the CURRENT authority_epoch (etcd leader/reservation + lease + epoch)."
      authorization_consumed: "D has CONSUMED the authorization + nonce for THIS transition (control.sock CAS)."
      quorum_leader: "quorum + leader_authorized true where the message_kind requires it (see protocol.consume/route)."
      not_key_possession: "Possession of the runtime key or reachability of the socket is explicitly NOT sufficient (A4)."

    # (3) The EXPECTED-FINGERPRINT RECORD (the concrete C<-D trust binding).
    expected_fingerprint_record:
      field: guardian_custody_expected_pub_fingerprint
      definition: "SHA-256 of the guardian DER SubjectPublicKeyInfo public key."
      lifecycle: >-
        C EMITS the fingerprint at bootstrap and at each rotation; D RECORDS it as the
        trusted expectation and SUPPLIES it back on every sign/verify. Trust is D's
        recorded expectation, NOT the editable guardian.meta sidecar
        (codex-0730 C-CUSTODY-EPOCH-FINGERPRINT-PASSPHRASE-BINDING).
      storage_owner: D_database   # D's authority record; C1 owned registry is the eventual canonical home
      binding_rule: >-
        A signature is trusted ONLY if the signing key's structurally-parsed public
        fingerprint equals this recorded expectation for the current authority_epoch.

    # (4) The RETURNED METADATA C gives back to D (mirrors guardian_signing_interface.output_fields).
    returned_metadata:
      - signature                 # raw Ed25519 signature over the canonical_message bytes
      - guardian_pub_fingerprint  # MUST equal expected_fingerprint_record for the current epoch, else D rejects
      - authority_epoch           # MUST equal the epoch D supplied, else D rejects (A3 defense-in-depth on C's side too)
    d_side_acceptance:
      - "reject if guardian_pub_fingerprint != recorded expected fingerprint for authority_epoch"
      - "reject if returned authority_epoch != supplied authority_epoch"
      - "reject if openssl pkeyutl -verify of signature over the canonical bytes fails against the expected pub"

    # (5) ROTATION and REVOKE interleavings (the hard cases).
    rotation_interleaving:
      rule: >-
        Rotation is EXPLICIT and D-driven: D advances authority_epoch, C promotes the new
        runtime key + pair-verifies BEFORE the marker flip, republishes guardian.pub +
        fingerprint; D records the NEW expected fingerprint. A signature request that
        arrives mid-rotation is bound to a SPECIFIC epoch: a request for the OLD epoch after
        the flip is REFUSED (prior-epoch blob), a request for the NEW epoch before D has
        recorded the new fingerprint is REFUSED (no trusted expectation yet). No silent
        reapply mint (guardian_custody.rotation).
    revoke_interleaving:
      rule: >-
        Revocation is D's control.sock authority: D consumes/invalidates the epoch's nonce and
        removes the positive authorization. A signature produced under a since-revoked
        authorization is NOT retroactively valid because CONSUMPTION is single-use CAS -- a
        replayed nonce fails. rejoin checks positive-authorization ABSENCE before the rename
        (authorization_revoked); the AUTHORITATIVE revoke/verified-stop-drain/permitted-start
        transition is the guardian seam (open_items 'authoritative revocation/drain').
    serialization:
      rule: >-
        revoke -> verified stop-drain -> permitted start is a SERIALIZED transition through the
        sole engine path (D-FENCING-ACTUAL-CALLER-VALIDATION-BYPASS): no caller may obtain a
        signed start authorization while a drain of the same deployment_identity/domain is
        in-flight.

    # (6) FAILURE RESULTS (what each side returns; all fail-closed).
    failure_results:
      c_refuses:   # from guardian_signing_interface.refusals
        - "no verified pub<->priv pair for the current epoch (marker absent/stale)"
        - "caller-supplied epoch != durable-bound epoch (A3)"
        - "runtime key absent or not resident on the signer host (never mint-to-sign)"
      d_refuses:
        - "authority_context_precondition not met (no leased epoch / no consumed authorization / no quorum)"
        - "returned fingerprint or epoch mismatch, or signature verify failure"
        - "authority service unavailable -> the authorization is NOT produced and the gated unit does NOT start (fail-closed / UNSTARTABLE); NEVER a default-allow"
      invariant: >-
        Absence or failure of the authority is UNSTARTABLE, never permissive. There is NO
        default-allow path that makes a gated unit start when the guardian is unavailable.

    sequenced_fencing_residuals:   # the residuals this seam unblocks, in order
      - REJOIN-RESTART-SERIALIZATION
      - D-RESTART-AUTHORIZATION-INTEGRITY
      - D-REJOIN-RESERVATION-OPTIONAL
      - FENCE-CURRENT-GENERATION-AND-AUTHORITY
      - D-FENCING-ACTUAL-CALLER-VALIDATION-BYPASS

    coordination:
      to_C: "ACK the canonical_message field order/encoding + the output/fingerprint/epoch binding; confirm C signs bytes verbatim and refuses per c_refuses. This ACK gates INTEGRATION only, not C's independent custody authoring."
      to_C1: "eventual canonical home for expected_fingerprint_record + signer/producer registry (catalog_debts.owed_registries)."
      to_G: "author negative/interruption cases against THIS binding now (mid-rotation epoch, revoked-nonce replay, fingerprint mismatch, authority-unavailable-unstartable); runtime acceptance awaits the built service."
