# Machine-validated (yaml.safe_load + jinja2 parse + coherence + render-parity).
c1_macro_proposal_index:
  audit_ref: codex-manager-current-source-audits-20260923-0315
  audit_item: "F_representation_audit item 5"
  generated: '2026-09-22'
  author: F3b-provenance-v2 leaf worker (F_representation_provenance pool)
  status: PROPOSAL -- for C1 to place in templates/macros, NOT active
