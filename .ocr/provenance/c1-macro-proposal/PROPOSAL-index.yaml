      field_separator: gitattributes_layout.field_separator
      line_terminator: gitattributes_layout.line_terminator
  - file: render_markdown_document.macro.proposal.j2
    need: markdown-section-list (declared blocks + per-kind format map, NOT a body wrapper)
    signature: "render_markdown_document(blocks, formats)"
    serves_targets: [".github/README-github.md", ".github/ISSUE_TEMPLATE/feature_request.md"]
    tested: false
    tested_reason: manifest reform (body wrapper -> declared blocks) is OPEN
    param_schema_keys:
      blocks: "readme_sections[] / feature_request_sections[] (declared blocks; data)"
      formats: markdown_formats.*   # per-kind fence/kv_separator/terminator/blank_line/prefix/suffix (group-level; reform OPEN)
  - file: render_license_sections.macro.proposal.j2
    need: LICENSE SECTION-SCHEMA (declared sections + per-kind format map; NOT whole-body concat / NOT indices)
    signature: "render_license_sections(sections, formats)"
    serves_targets: ["LICENSE"]
    tested: false
    tested_reason: body decomposition into declared section kinds is OPEN (values unknown)
    param_schema_keys:
      sections: "license_sections[] (ordered; each {kind, text}; data)"
      formats: license_section_formats.*   # per-kind indent/separator/terminator (group-level; renderable-OPEN)

