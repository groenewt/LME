    not_loaded_by_render_harness: true       # render/render_provenance.yml loads only .ocr/provenance/sources/*
    not_an_active_f_macro_library: true

  constraints_enforced:
    no_param_defaults: true                  # verified: no `param=value` in any macro signature
    macro_body_no_bare_literals: true        # verified: no string/number literal in bodies; text outside tags is whitespace-only
    format_by_kind_not_per_instance: true    # markdown + license look up format by section KIND, not per-instance carry

  coherence_method: >-
    The scratchpad validator checks, mechanically and in both directions, that (1) every
    macro parameter / format-subkey names a declared schema key, and (2) every renderable
    schema key is consumed by a macro or a render_harness_fixes_required item. Concrete
    macros (render_json_object, render_declared_layout_object, render_grouped_line_list,
    render_pattern_attr_pairs) are checked at KEY level. Reform-OPEN macros
    (render_markdown_document, render_license_sections) cite the schema GROUPS
    markdown_formats.* / license_section_formats.* -- their concrete keys await manifest
    reform (body-wrapper -> declared blocks) and LICENSE body decomposition, so those
    targets stay tested:false. This replaces the earlier bare boolean self-claim.

  parity_is_not_compliance: >-
    A macro marked tested:true reproduces its consumed file byte-for-byte from declared,
    literal-free structure -- evidence the PROPOSED MECHANISM works. It does NOT make the
    target FINISHED representation: production wiring is not done, the consumed file is
    still the in-tree source of truth, and some manifests still carry findings (e.g. the
    '## ' prefix). All seven targets remain conformance_status: violation in
    representation-status-v2.yaml until C1 completes production integration.

  render_parity_evidence:
    method: >-
      Rendered each concrete macro against the CURRENT manifests + format values DERIVED
      from emitted-structural-literals-schema.yaml current_value entries (not hand-typed),
      using ansible-core 2.17.14's own to_json filter under jinja2 with
      undefined=StrictUndefined, trim_blocks=True, lstrip_blocks=True (production-like),
      then cmp vs `git show a3352b2:<path>`. Run in the scratchpad, NOT committed.
    results:
      render_pattern_attr_pairs: {consumed_path: .gitattributes, bytes: 22, byte_parity_vs_a3352b2: identical}
      render_json_object: {consumed_path: .devcontainer/python_development/devcontainer.json, bytes: 633, byte_parity_vs_a3352b2: identical}
      render_declared_layout_object: {consumed_path: .github/changelog-configuration.json, bytes: 415, byte_parity_vs_a3352b2: identical, note: "trailing-comma/space quirks + {{token}} wrappers reproduced; braces assembled from single-char params (no '{{' in data)"}

  macros:
  - file: render_json_object.macro.proposal.j2
    need: JSON-from-declared-values (order/indent/sort from schema)
    signature: "render_json_object(data, indent, sort_keys, separators, ensure_ascii)"
    serves_targets: [".devcontainer/python_development/devcontainer.json"]
    tested: true
    tested_evidence: byte-parity vs a3352b2 (633B)
    param_schema_keys:
      data: "<devcontainer manifest values>"
      indent: json_render.devcontainer.indent
      sort_keys: json_render.devcontainer.sort_keys
      separators: json_render.separators
      ensure_ascii: json_render.ensure_ascii
  - file: render_declared_layout_object.macro.proposal.j2
    need: quasi-JSON with declared trailing-comma/space quirks (strict JSON serializer cannot reproduce)
    signature: "render_declared_layout_object(categories, keys, tokens, fmt)"
    serves_targets: [".github/changelog-configuration.json"]
    tested: true
    tested_evidence: byte-parity vs a3352b2 (415B); trailing_comma_after_last + pr_template_trailing_space booleans consumed by conditionals; token braces assembled in-macro (no '{{' in data)
    param_schema_keys:
      categories: "<changelog manifest values>"
      keys: changelog_keys.{categories,title,labels,template,pr_template}
      tokens: "<changelog token NAMES from changelog manifest (template_token + pr_template_tokens); no braces>"
      fmt: changelog_layout.open_line changelog_layout.indent_l1 changelog_layout.indent_l2 changelog_layout.indent_l3 changelog_layout.trailing_comma_after_last changelog_layout.pr_template_trailing_space changelog_json_punctuation.key_quote changelog_json_punctuation.colon changelog_json_punctuation.array_open changelog_json_punctuation.array_close changelog_json_punctuation.obj_open changelog_json_punctuation.obj_close changelog_json_punctuation.comma changelog_json_punctuation.close_char changelog_token_assembly.open_brace_char changelog_token_assembly.close_brace_char changelog_token_assembly.token_prefix changelog_token_assembly.pr_lead changelog_token_assembly.pr_conn_author changelog_token_assembly.pr_conn_number changelog_token_assembly.space_char render_options.newline_sequence json_render.changelog_labels.separators json_render.changelog_labels.ensure_ascii
  - file: render_grouped_line_list.macro.proposal.j2
    need: grouped-line-list (comments-as-data)
    signature: "render_grouped_line_list(groups, group_separator, comment_prefix, line_terminator)"
    serves_targets: [".gitignore"]
    tested: false
    tested_reason: needs reformed manifest (strip '#' marker + normalize spacing into declared comment_prefix)
