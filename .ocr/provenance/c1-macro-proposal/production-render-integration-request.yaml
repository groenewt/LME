# production-render-integration-request.yaml
# What C1 must wire so the seven tool-consumed files become GENERATED artifacts of a
# declared source manifest -> reusable macro -> render -> the real consumed path.
# This is a REQUEST to C1; F3b does not author active macros or touch templates/macros.
# Machine-validated (yaml.safe_load).
production_render_integration_request:
  audit_ref: codex-manager-current-source-audits-20260923-0315
  audit_item: "F_representation_audit item 5"
  generated: '2026-09-22'
  author: F3b-provenance-v2 leaf worker (F_representation_provenance pool)
  requested_of: C1 (owns ansible/templates/macros and production render wiring)
  boundary: >-
    F3b provides PROPOSALS only (this dir). F3b did NOT create ansible/templates/macros,
    did NOT author active macros, and left the seven consumed files byte-identical to
    a3352b2. Placing/activating macros and wiring the build is C1's work.

  pipeline_required: source_manifest -> reusable_macro -> render -> consumed_path
  data_schema_source: .ocr/provenance/emitted-structural-literals-schema.yaml
  data_schema_source_warning: >-
    The schema INVENTORIES literals in the current templates, including key_classification.findings
    and key_classification.superseded entries. Some superseded current_values still contain '{{'
    (changelog_tokens.template_wrapper / pr_template_skeleton / brace_escape) -- those are
    inventory ONLY. C1 must build render inputs ONLY from the 'consumed' and 'macro_owned'
    buckets (plus manifest data); do NOT include_vars the findings/superseded entries wholesale,
    or include_vars will re-template the '{{' they contain.
  status_source: .ocr/provenance/representation-status-v2.yaml

  wiring_per_target:
  - consumed_path: .gitignore
    macro_proposal: render_grouped_line_list.macro.proposal.j2
    manifest: .ocr/provenance/sources/gitignore.manifest.yaml (reform -- strip '#' + normalize spacing into declared comment_prefix)
    schema_group: gitignore
  - consumed_path: .gitattributes
    macro_proposal: render_pattern_attr_pairs.macro.proposal.j2
    manifest: .ocr/provenance/sources/gitattributes.manifest.yaml
    schema_group: gitattributes
  - consumed_path: .devcontainer/python_development/devcontainer.json
    macro_proposal: render_json_object.macro.proposal.j2
    manifest: .ocr/provenance/sources/devcontainer.manifest.yaml
    schema_group: devcontainer
  - consumed_path: .github/changelog-configuration.json
    macro_proposal: render_declared_layout_object.macro.proposal.j2
    manifest: .ocr/provenance/sources/changelog-configuration.manifest.yaml (reform -- strip '## ' prefix into declared changelog_data.title_markdown_prefix)
    schema_group: changelog
  - consumed_path: LICENSE
    macro_proposal: render_license_sections.macro.proposal.j2
    manifest: .ocr/provenance/sources/LICENSE.manifest.yaml (OPEN -- decompose bodies into declared section kinds; drop verbatim_consumer_text self-label)
    schema_group: license
  - consumed_path: .github/README-github.md
    macro_proposal: render_markdown_document.macro.proposal.j2
    manifest: .ocr/provenance/sources/README-github.manifest.yaml (reform -- body wrapper -> declared blocks)
    schema_group: readme_github
  - consumed_path: .github/ISSUE_TEMPLATE/feature_request.md
    macro_proposal: render_markdown_document.macro.proposal.j2
    manifest: .ocr/provenance/sources/feature_request.manifest.yaml (reform -- prose body -> declared blocks; keep declared frontmatter block)
    schema_group: feature_request

  render_harness_fixes_required:
    note: render/render_provenance.yml carries structural literals that must move into the schema.
    items:
    - Add render_targets[].consumed_path so the rendered->real-path mapping is DATA, not prose.
    - Source trim_blocks/lstrip_blocks/newline_sequence/output_encoding/file_mode/dir_mode from render_options.
    - Stop relying on to_nice_json filter defaults; pass indent/sort_keys/separators/ensure_ascii from json_render.
    - Replace the inline 7-filename list + '.rendered' suffix with a declared render_targets[] table.

  templating_hazards_and_decisions:
    - hazard: include_vars re-templates any value containing '{{' in a manifest/schema (the changelog placeholder tokens).
      decision: >-
        RESOLVED in render_declared_layout_object by ASSEMBLING braces inside the macro
        from single-char params (changelog_token_assembly.open_brace_char /
        .close_brace_char, emitted twice). DATA holds only single '{' / '}' (not Jinja
        delimiters) and token NAMES with no braces. Alternative if C1 prefers data-side
        braces: mark those values !unsafe. Verified: rendered changelog is byte-identical
        to a3352b2 with in-macro assembly.
    - hazard: double terminal newline if both the macro and the render layer emit one.
      decision: >-
        Terminal newline is OWNED BY THE MACRO for every target (each macro emits, or
        deliberately omits, the final newline per terminal_newline.<target>). The
        ansible.builtin.template task / render layer must NOT append a trailing newline.
        gitattributes/gitignore/changelog/LICENSE/feature_request end with a newline;
        devcontainer and README-github deliberately end without one.

  acceptance_check:
    description: >-
      A target is FINISHED representation only when ALL of the following pass. Byte-parity
      alone is NOT sufficient -- parity/byte-evidence is NOT representation compliance.
    checks:
    - id: a_byte_parity
      how: >-
        Render via the production pipeline into an out-of-tree dir, then
        `cmp -s <rendered> <(git show a3352b2:<consumed_path>)` AND
        `cmp -s <rendered> <on-disk consumed_path>`. Use the REAL consumed paths
        (.devcontainer/python_development/devcontainer.json and .github/README-github.md),
        NOT the abbreviated paths from the task brief.
      pass_when: exit 0 for every target
    - id: b_template_text_whitespace_only
      how: All text outside Jinja tags in every active macro/template is whitespace only.
      pass_when: no non-whitespace string/number literal outside a tag
    - id: c_no_macro_param_defaults
      how: No macro signature has a default (no `param=value`).
      pass_when: zero defaults across all active macros
    - id: d_macro_bodies_literal_free
      how: Macro bodies contain no string or number literals except schema lookups (filter names allowed).
      pass_when: zero bare literals
    - id: e_render_options_from_schema
      how: trim_blocks/lstrip_blocks/newline_sequence/encoding/modes and all JSON options come from the declared schema.
      pass_when: no option hardcoded in the harness or template
    - id: f_no_verbatim_escape_hatch
      how: No whole-body concatenation and no index-based body selection (LICENSE) and no prose body wrapper (README/feature_request).
      pass_when: LICENSE renders from declared sections; docs render from declared blocks
