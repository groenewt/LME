---
render_method:
  title: F3-provenance render-parity method (reproducible)
  author: F3-provenance leaf worker (F_representation_provenance pool)
  snapshot_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7
  status_banner: >-
    PROVISIONAL, OUT-OF-MASTER render mechanism. This harness proves that each
    authored declarative source regenerates its tool-consumed file byte-for-byte
    using the NATIVE Ansible template engine. It is a provenance/parity check
    ONLY -- it does NOT wire these sources into the production build. Production
    render-wiring (macros, engine templates) belongs to the C1 engine and is an
    OPEN coordinated integration (see open_integration below). This harness does
    not touch C1's engine/templates/macros.

  toolchain_of_record:
    python: 3.13.9
    ansible_core: 2.17.14
    jinja2: 3.1.6
    pyyaml: 6.0.3
    git: 2.47.3

  what_declarative_means_here: >-
    Each converted file has (a) a VALUES manifest (.ocr/provenance/sources/<name>.manifest.yaml)
    holding the atoms that vary, and (b) a Jinja template (.ocr/provenance/sources/<name>.j2)
    that ITERATES those values. No literal file body is pasted into a template
    (that would be the banned "cosmetic suffix wrapping"). The one sanctioned
    exception is verbatim canonical text (LICENSE) and verbatim prose (docs),
    which are recorded honestly as verbatim_consumer_text / verbatim_prose.

  render_engine: ansible.builtin.template  # native, ansible-core 2.17.14
  render_playbook: .ocr/provenance/render/render_provenance.yml
  render_command: >-
    env -u ANSIBLE_CONFIG ansible-playbook -i localhost, -c local
    .ocr/provenance/render/render_provenance.yml -e out=<ABS_OUT_DIR>
  render_options_explicit:
    trim_blocks: true          # ansible default true; set explicitly for determinism
    lstrip_blocks: true        # ansible default FALSE; set explicitly (templates keep block tags at col 0)
    newline_sequence: "\n"     # any CR would be a parity failure; none present in sources
    output_encoding: utf-8
  execution_environment:
    cwd: scratchpad directory (contains no ansible.cfg)
    ANSIBLE_CONFIG: unset (so no repo ansible.cfg is picked up)
    connection: local
    inventory: "localhost,"

  parity_procedure:
    - "Save immutable snapshot refs: git show a3352b2:<path> > snapref/<path>."
    - "Render every template into an out-of-tree dir via the playbook above."
    - "cmp -s rendered vs snapref (a3352b2) AND rendered vs on-disk consumed file."
    - "sha256(rendered) must equal sha256(consumed); identical bytes = PROVEN."
    - "Any mismatch is recorded OPEN with the diff; no parity result is fabricated."

  reproduce_from_scratch:
    - "cd <scratchpad>   # a dir with no ansible.cfg"
    - "mkdir -p out"
    - "env -u ANSIBLE_CONFIG ansible-playbook -i localhost, -c local <REPO>/.ocr/provenance/render/render_provenance.yml -e out=$PWD/out"
    - "for r in out/*; do cmp \"$r\" \"$(git -C <REPO> show a3352b2:<mapped consumed path>)\"; done"

  results_summary:
    render_proven: 7   # .gitignore .gitattributes devcontainer.json changelog-configuration.json LICENSE README-github.md feature_request.md
    open_docs: 2       # bug-or-error-report.md (delimiter hazard + prose), PULL_REQUEST_TEMPLATE.md (free-form prose)
    workflows_inventoried: 12   # 275 run: bodies; embedded-code-body conversion deferred (F-owned)
  detailed_records: .ocr/provenance/provenance-records.yaml
  build_tool_evidence: .ocr/provenance/build-tool-evidence.yaml
  workflow_inventory: .ocr/provenance/workflow-runbody-inventory.yaml

  per_target_gotchas_handled:
    devcontainer.json: "to_nice_json(indent=2, sort_keys=false); source has NO trailing newline (template ends without one)."
    changelog-configuration.json: "Not valid JSON (trailing commas + trailing space on lines 1 and 21). Iterated categories; labels via | to_json; placeholder tokens (CHANGELOG/TITLE/AUTHOR/NUMBER) kept as DATA with braces emitted by the template ({{ '{{' }}...{{ '}}' }}) so ansible does not re-template them."
    LICENSE: "Compound file = CISA preamble + CC0-1.0 + Apache-2.0. Split by robust string markers, asserted concat==original, three components concatenated. Holder/year are null (none present); SPDX expression 'CC0-1.0 AND Apache-2.0' is an F interpretation of the preamble."
    gitignore: "Grouped as {leading_blank, comment(incl '#'), patterns[]}; no dedupe of tmp/* vs tmp/ or .claude/ vs .claude; line 48 comment has no preceding blank."
    feature_request.md: "Structured frontmatter iterated as {key, raw}; blank line before closing --- preserved; prose body verbatim (no embedded Jinja delimiters)."

  open_integration:
    description: >-
      Production render-wiring is NOT done. These sources are not yet consumed by
      the build; the consumed files remain the source of truth in-tree. Wiring the
      manifests+templates into the C1 engine (so the build regenerates the consumed
      files) is an OPEN coordinated task with C1.
    macro_requests_to_c1: see build-tool-evidence.yaml -> macro_requests_to_c1
    owner_boundary: "F3 does not author reusable macros (templates/macros is C1's). Ad-hoc filters (to_nice_json, to_json) used inline this tick are recorded as macro requests."
