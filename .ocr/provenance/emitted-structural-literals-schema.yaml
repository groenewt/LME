---
# emitted-structural-literals-schema.yaml
# Declared inventory of EVERY structural emitted literal currently living in the
# seven parity templates/manifests AND in render/render_provenance.yml itself.
# This is the declarative rendering-schema the production renders MUST source from
# (operator ruling: emitted_structural_literals). No value here may be typed into a
# Jinja template/macro body or relied on as a filter default; it must be read from
# this schema. Machine-validated (yaml.safe_load).
emitted_structural_literals_schema:
  audit_ref: codex-manager-current-source-audits-20260923-0315
  audit_item: "F_representation_audit item 5"
  generated: '2026-09-22'
  author: F3b-provenance-v2 leaf worker (F_representation_provenance pool)
  toolchain_of_record:
    python: 3.13.9
    ansible_core: 2.17.14
    jinja2: 3.1.6
  entry_shape: {source_file, what_it_controls, declared_schema_key, current_value}

  # ---- The render harness itself carries structural literals ----
  render_harness:
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: Jinja trim_blocks (strip newline after a block tag)
    declared_schema_key: render_options.trim_blocks
    current_value: true
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: Jinja lstrip_blocks (strip leading whitespace before a block tag)
    declared_schema_key: render_options.lstrip_blocks
    current_value: true
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: newline sequence used for every emitted EOL
    declared_schema_key: render_options.newline_sequence
    current_value: "\n"
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: output byte encoding
    declared_schema_key: render_options.output_encoding
    current_value: utf-8
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: file mode for rendered outputs
    declared_schema_key: render_options.file_mode
    current_value: "0644"
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: directory mode for the out dir
    declared_schema_key: render_options.dir_mode
    current_value: "0755"
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: sources directory (relative to playbook_dir)
    declared_schema_key: render_paths.sources_dir
    current_value: "{{ playbook_dir }}/../sources"
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: the hardcoded list of 7 manifest filenames + tmpl->dest map with the '.rendered' suffix
    declared_schema_key: render_targets[] (each {manifest, template, render_dest, consumed_path})
    current_value: >-
      inline loop lists; the '.rendered' suffix is typed into the dest names and the
      consumed_path mapping is MISSING (it exists only in prose in provenance-records.yaml).
  - source_file: .ocr/provenance/render/render_provenance.yml
    what_it_controls: MISSING declared mapping rendered->real consumed path (needed for the acceptance cmp)
    declared_schema_key: render_targets[].consumed_path
    current_value: null   # not declared today; must be added

  # ---- .gitignore ----
  gitignore:
  - source_file: .ocr/provenance/sources/gitignore.j2
    what_it_controls: blank line emitted before a group when leading_blank is true (group separator)
    declared_schema_key: gitignore_layout.group_separator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/gitignore.j2
    what_it_controls: one pattern per line + one comment per line (line terminator)
    declared_schema_key: gitignore_layout.line_terminator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/gitignore.manifest.yaml
    what_it_controls: comment strings embed the '#' marker as data (should be a declared comment_prefix over marker-free text)
    declared_schema_key: gitignore_layout.comment_prefix
    current_value: "#"
  - source_file: .ocr/provenance/sources/gitignore.manifest.yaml
    what_it_controls: inconsistent comment spacing carried as data ('#created...' has no space; '# AI...' has one)
    declared_schema_key: gitignore_layout.comment_spacing_is_per_comment_data
    current_value: "mixed (no declared rule; both '#x' and '# x' appear)"
  - source_file: .ocr/provenance/sources/gitignore.j2
    what_it_controls: terminal newline present at EOF
    declared_schema_key: terminal_newline.gitignore
    current_value: true

  # ---- .gitattributes ----
  gitattributes:
  - source_file: .ocr/provenance/sources/gitattributes.j2
    what_it_controls: single space between pattern and attrs
    declared_schema_key: gitattributes_layout.field_separator
    current_value: " "
  - source_file: .ocr/provenance/sources/gitattributes.j2
    what_it_controls: one entry per line (line terminator)
    declared_schema_key: gitattributes_layout.line_terminator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/gitattributes.j2
    what_it_controls: terminal newline present at EOF
    declared_schema_key: terminal_newline.gitattributes
    current_value: true

  # ---- devcontainer.json (strict JSON via to_nice_json) ----
  devcontainer:
  - source_file: .ocr/provenance/sources/devcontainer.j2
    what_it_controls: JSON indent width (overrides filter default 4)
    declared_schema_key: json_render.devcontainer.indent
    current_value: 2
  - source_file: .ocr/provenance/sources/devcontainer.j2
    what_it_controls: key sort (overrides filter default True; order is preserved)
    declared_schema_key: json_render.devcontainer.sort_keys
    current_value: false
  - source_file: "ansible-core 2.17.14 to_nice_json filter (implicit private default)"
    what_it_controls: item/kv separators baked into to_nice_json
    declared_schema_key: json_render.separators
    current_value: [",", ": "]
  - source_file: "ansible-core 2.17.14 to_json/json.dumps (implicit private default)"
    what_it_controls: non-ASCII escaping
    declared_schema_key: json_render.ensure_ascii
    current_value: true
  - source_file: "ansible-core 2.17.14 to_json (implicit injected kwargs; both JSON macros depend on them)"
    what_it_controls: to_json always injects vault_to_text=True, preprocess_unsafe=False, and cls=AnsibleJSONEncoder
    declared_schema_key: json_render.to_json_implicit_kwargs
    current_value: {vault_to_text: true, preprocess_unsafe: false, cls: AnsibleJSONEncoder}
    value_kind: implicit-engine-default
  - source_file: .ocr/provenance/sources/devcontainer.j2
    what_it_controls: no final newline at EOF
    declared_schema_key: terminal_newline.devcontainer
    current_value: false

  # ---- changelog-configuration.json (quasi-JSON; NOT valid JSON) ----
  changelog:
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: opening line, including a trailing space after '{'
    declared_schema_key: changelog_layout.open_line
    current_value: "{ "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: indent width at object/level 1 (categories key)
    declared_schema_key: changelog_layout.indent_l1
    current_value: "  "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: indent width at level 2 (array element braces)
    declared_schema_key: changelog_layout.indent_l2
    current_value: "    "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: indent width at level 3 (title/labels keys)
    declared_schema_key: changelog_layout.indent_l3
    current_value: "      "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: trailing comma after EVERY object incl the last (invalid-JSON quirk)
    declared_schema_key: changelog_layout.trailing_comma_after_last
    current_value: true
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: trailing space at end of the pr_template line
    declared_schema_key: changelog_layout.pr_template_trailing_space
    current_value: true
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: labels serialization filter
    declared_schema_key: changelog_layout.labels_filter
    current_value: to_json
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: labels separators -- ORIGINAL used bare to_json (default = comma-space), so declared explicitly to reproduce that, NOT relying on the filter default
    declared_schema_key: json_render.changelog_labels.separators
    current_value: [", ", ": "]
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: labels non-ASCII escaping
    declared_schema_key: json_render.changelog_labels.ensure_ascii
    current_value: true
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: title emitted hand-quoted with no JSON string escaping (correctness hazard)
    declared_schema_key: changelog_layout.title_quote_style
    current_value: 'raw-double-quote (no escaping)'
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: token wrapper for the changelog placeholder (# prefix + escaped {{ }})
    declared_schema_key: changelog_tokens.template_wrapper
    current_value: "#{{TOKEN}}"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: pr_template skeleton text between tokens
    declared_schema_key: changelog_tokens.pr_template_skeleton
    current_value: "* #{{TITLE}} by @#{{AUTHOR}} in ##{{NUMBER}}"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: the '{{' / '}}' brace-escape literals that stop ansible re-templating the tokens
    declared_schema_key: changelog_tokens.brace_escape
    current_value: ["{{", "}}"]
  - source_file: .ocr/provenance/sources/changelog-configuration.manifest.yaml
    what_it_controls: category titles embed the '## ' markdown prefix as data
    declared_schema_key: changelog_data.title_markdown_prefix
    current_value: "## "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: terminal newline present at EOF (unlike devcontainer)
    declared_schema_key: terminal_newline.changelog
    current_value: true
  # JSON punctuation the quasi-JSON renderer must source (currently typed into the template body):
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: colon+space between key and value
    declared_schema_key: changelog_json_punctuation.colon
    current_value: ": "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: double-quote around keys and string values
    declared_schema_key: changelog_json_punctuation.key_quote
    current_value: '"'
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: array open bracket
    declared_schema_key: changelog_json_punctuation.array_open
    current_value: "["
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: array close bracket
    declared_schema_key: changelog_json_punctuation.array_close
    current_value: "]"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: object open brace (per category)
    declared_schema_key: changelog_json_punctuation.obj_open
    current_value: "{"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: object close brace (per category)
    declared_schema_key: changelog_json_punctuation.obj_close
    current_value: "}"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: comma emitted after every element (trailing_comma_after_last=true)
    declared_schema_key: changelog_json_punctuation.comma
    current_value: ","
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: top-level closing brace
    declared_schema_key: changelog_json_punctuation.close_char
    current_value: "}"
  - source_file: .ocr/provenance/sources/changelog-configuration.manifest.yaml
    what_it_controls: declared object key names (categories/title/labels/template/pr_template) -- data, not free literals in the body
    declared_schema_key: changelog_keys.{categories,title,labels,template,pr_template}
    current_value: ["categories", "title", "labels", "template", "pr_template"]

  # ---- LICENSE (index-based whole-body concatenation: the disallowed escape hatch) ----
  license:
  - source_file: .ocr/provenance/sources/LICENSE.j2
    what_it_controls: hardcoded component indices 0,1,2 (must become a declared ordered section list)
    declared_schema_key: license_sections[] (ordered; no numeric indices)
    current_value: [0, 1, 2]
  - source_file: .ocr/provenance/sources/LICENSE.j2
    what_it_controls: separator between concatenated component bodies (currently none)
    declared_schema_key: license_sections[].separator
    current_value: ""
  - source_file: .ocr/provenance/sources/LICENSE.manifest.yaml
    what_it_controls: whole-body-per-component paste (no internal declared structure = the escape hatch)
    declared_schema_key: license_sections[].kind (title_block|heading|numbered_clause|enumerated_item|paragraph)
    current_value: "whole body (OPEN: not decomposed into declared section kinds)"
  - source_file: .ocr/provenance/sources/LICENSE.j2
    what_it_controls: terminal newline present at EOF (carried by the last body)
    declared_schema_key: terminal_newline.license
    current_value: true

