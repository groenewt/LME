  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: blank line before the closing fence
    declared_schema_key: feature_request_layout.blank_line_before_close
    current_value: true
  - source_file: .ocr/provenance/sources/feature_request.manifest.yaml
    what_it_controls: empty frontmatter values carried as pre-serialized YAML quoting (two single quotes)
