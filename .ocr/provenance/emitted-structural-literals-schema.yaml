  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: prose body is '{{ body }}' -- '**bold**' markers + blank-line paragraphs pasted whole
    declared_schema_key: feature_request_sections[] (declared markdown blocks)
    current_value: "single verbatim body string"
  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: terminal newline present at EOF
    declared_schema_key: terminal_newline.feature_request
    current_value: true

  # ---- changelog token assembly (avoids '{{' in DATA, which include_vars would re-template) ----
  # Braces are assembled INSIDE the macro from single-char values; single '{' / '}' in data
  # are NOT Jinja delimiters, so include_vars leaves them intact. This supersedes the
  # historical changelog_tokens.brace_escape approach (which put '{{' into the template body).
  changelog_token_assembly:
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: single open brace char (macro emits it twice to make '{{')
    declared_schema_key: changelog_token_assembly.open_brace_char
    current_value: "{"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: single close brace char (macro emits it twice to make '}}')
    declared_schema_key: changelog_token_assembly.close_brace_char
    current_value: "}"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: token prefix before each brace-wrapped token
    declared_schema_key: changelog_token_assembly.token_prefix
    current_value: "#"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: pr_template lead before the first token
    declared_schema_key: changelog_token_assembly.pr_lead
    current_value: "* "
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: pr_template connector before the author token
    declared_schema_key: changelog_token_assembly.pr_conn_author
    current_value: " by @"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: pr_template connector before the number token (its trailing '#' plus the token prefix yield '##')
    declared_schema_key: changelog_token_assembly.pr_conn_number
    current_value: " in #"
  - source_file: .ocr/provenance/sources/changelog-configuration.j2
    what_it_controls: single space emitted when pr_template_trailing_space is true (boolean is consumed by a conditional, not printed)
    declared_schema_key: changelog_token_assembly.space_char
    current_value: " "

  # ---- markdown document formats, keyed by section KIND (consumed by render_markdown_document) ----
  # Per-kind (NOT per-instance) format so a section is declared structure, not literal paste.
  # README and feature_request pass DIFFERENT format sets (README: trailing space, no final
  # newline; feature_request: bold markers, newline-terminated). Manifest reform (body wrapper
  # -> declared blocks) is OPEN, so both targets stay tested:false.
  markdown_formats:
  - source_file: .ocr/provenance/sources/README-github.j2 (reform target)
    what_it_controls: readme single-line body -- prefix (none; explicit empty so the macro never reads an undefined attr under StrictUndefined)
    declared_schema_key: markdown_formats.readme_line.prefix
    current_value: ""
  - source_file: .ocr/provenance/sources/README-github.j2 (reform target)
    what_it_controls: readme single-line body -- suffix (trailing space) after the text
    declared_schema_key: markdown_formats.readme_line.suffix
    current_value: " "
  - source_file: .ocr/provenance/sources/README-github.j2 (reform target)
    what_it_controls: readme single-line body -- no terminator (no final newline)
    declared_schema_key: markdown_formats.readme_line.terminator
    current_value: ""
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: bold label prefix marker (currently pasted verbatim in the prose body)
    declared_schema_key: markdown_formats.bold_label.prefix
    current_value: "**"
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: bold label suffix marker
    declared_schema_key: markdown_formats.bold_label.suffix
    current_value: "**"
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: bold label / paragraph line terminator
    declared_schema_key: markdown_formats.bold_label.terminator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: paragraph block prefix (none; explicit empty for StrictUndefined safety)
    declared_schema_key: markdown_formats.paragraph.prefix
    current_value: ""
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: paragraph block suffix (none; explicit empty for StrictUndefined safety)
    declared_schema_key: markdown_formats.paragraph.suffix
    current_value: ""
  - source_file: .ocr/provenance/sources/feature_request.j2 (reform target)
    what_it_controls: paragraph block terminator (a blank line is a paragraph with empty text + this terminator)
    declared_schema_key: markdown_formats.paragraph.terminator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: frontmatter fence (open/close)
    declared_schema_key: markdown_formats.frontmatter.fence
    current_value: "---"
  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: frontmatter key/value separator
    declared_schema_key: markdown_formats.frontmatter.kv_separator
    current_value: ": "
  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: frontmatter line terminator
    declared_schema_key: markdown_formats.frontmatter.terminator
    current_value: "\n"
  - source_file: .ocr/provenance/sources/feature_request.j2
    what_it_controls: frontmatter blank line before the closing fence
    declared_schema_key: markdown_formats.frontmatter.blank_line
    current_value: "\n"

  # ---- LICENSE per-kind section formats (consumed by render_license_sections) ----
  # OPEN: the three component bodies are NOT yet decomposed into declared section kinds,
  # so these values are unknown; keys are declared as the required shape (renderable-OPEN).
  license_section_formats:
  - source_file: LICENSE (decomposition OPEN)
    what_it_controls: per-kind indent (title_block|heading|numbered_clause|enumerated_item|paragraph)
    declared_schema_key: license_section_formats.<kind>.indent
    current_value: null
    value_kind: renderable-OPEN
  - source_file: LICENSE (decomposition OPEN)
    what_it_controls: per-kind separator between sections
    declared_schema_key: license_section_formats.<kind>.separator
    current_value: null
    value_kind: renderable-OPEN
  - source_file: LICENSE (decomposition OPEN)
    what_it_controls: per-kind terminator
    declared_schema_key: license_section_formats.<kind>.terminator
    current_value: null
    value_kind: renderable-OPEN

  # ---- classification: how every inventoried literal is accounted for ----
  # This schema inventories the literals in the CURRENT templates. The PROPOSED macros
  # consume a REFORMED subset (some keys are renamed/replaced for compliance). Coherence
  # rule: every renderable key falls into exactly one bucket -- consumed directly (via a
  # macro param / format group), harness-covered, macro-owned policy, superseded by a
  # reformed key, or a diagnostic finding. No orphans.
  key_classification:
    findings:
    - gitignore_layout.comment_spacing_is_per_comment_data   # diagnostic (anomaly), not a render input
    - changelog_layout.title_quote_style                     # diagnostic (hazard note)
    - changelog_layout.labels_filter                         # the macro types the `to_json` filter directly (filter names are allowed); key is never read as a value
    - changelog_data.title_markdown_prefix                   # data reform note (manifest strips '## ')
    - license_sections[].kind                                # enum note; concrete values are the *_formats keys
    - feature_request_data.empty_value_representation         # diagnostic (manifest pre-serialization); handled at reform
    - json_render.to_json_implicit_kwargs                     # to_json injects these; cls=AnsibleJSONEncoder is an ENGINE CONSTANT (re-passing raises duplicate-kwarg); vault_to_text/preprocess_unsafe are OPEN (macros currently inherit the default, do not pass them)
    macro_owned:   # terminal newline is implemented by macro structure, not a runtime param
    - terminal_newline.gitignore
    - terminal_newline.gitattributes
    - terminal_newline.devcontainer
    - terminal_newline.changelog
    - terminal_newline.license
    - terminal_newline.readme_github
    - terminal_newline.feature_request
    superseded:    # current-template literal -> the reformed key the PROPOSED macro consumes
      changelog_tokens.template_wrapper: changelog_token_assembly.token_prefix + open/close_brace_char
      changelog_tokens.pr_template_skeleton: changelog_token_assembly.pr_lead / pr_conn_author / pr_conn_number
      changelog_tokens.brace_escape: changelog_token_assembly.open_brace_char / close_brace_char (assembled in-macro; no '{{' in data)
      feature_request_layout.frontmatter_fence: markdown_formats.frontmatter.fence
      feature_request_layout.kv_separator: markdown_formats.frontmatter.kv_separator
      feature_request_layout.blank_line_before_close: markdown_formats.frontmatter.blank_line (+ per-block data flag)
      readme_layout.trailing_space: markdown_formats.readme_line.suffix
      license_sections[].separator: license_section_formats.<kind>.separator
    harness_covered_keys:   # EXACT keys the render harness owns (from render_harness_fixes_required); not a loose prefix
    - render_options.trim_blocks
    - render_options.lstrip_blocks
    - render_options.newline_sequence
    - render_options.output_encoding
    - render_options.file_mode
    - render_options.dir_mode
    - render_paths.sources_dir
    - render_targets[]
    - render_targets[].consumed_path
    notes: >-
      render_targets[].consumed_path is renderable-OPEN (must be added to the harness --
      see render_harness_fixes_required). changelog_keys.* and section DATA (blocks,
      entries, groups, categories, sections) are consumed as manifest data by macro params.
      json_render.devcontainer.*, json_render.separators, json_render.ensure_ascii and
      json_render.changelog_labels.* are CONSUMED by the JSON macros (not harness-only).

  counts:
    note: computed from list lengths by the validator (not hand-maintained); see scratchpad validation.
