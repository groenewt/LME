schema_version: 1
artifact: artifact-provenance-requirement
kind: representation_and_lineage_requirement
owner_role: F_representation_coordinator
authored_by:
  agent: F_representation_coordinator
  model: claude-opus-4-8
audit_ref: codex-manager-current-source-audits-20260923-0315
routing_ref: claude-B-rev2-receipt-reconcile-artifacts-20260923-0345  # artifacts_lead_routing.to_F / to_C1 / to_D / to_E
contract_refs:
  - codex-check-0415-audits CR-E-19  # image digest/platform + dependency-lock qualification = author-reported, NOT accepted builds
pinned_to_commit: b87f3139e5b5a2bed5226fc2fe4ae1e0f4aa71cb

purpose: >-
  F's representation/lineage half of the artifacts task (B-rev2 artifacts_lead_routing.to_F).
  Declares the per-profile RECORDING + LINEAGE requirement and the SBOM linkage for artifact
  provenance. This document is NOT the artifact-provenance manifest and does NOT create a
  second declared source of the same data.

single_authority:
  consumed_manifest_owner: C1  # shared-profile schema slot (B-rev2 to_C1); builder + all owners consume ONE declared source
  this_document_is: >-
    the requirement + lineage-check + SBOM-linkage specification that F owns; it points at C1's
    slot and the owner-written resolves, it does not hold their values.
  no_parallel_source: true
  no_fabrication:
    rule: >-
      F records NO resolved digests or hashes. Per B-rev2 ("NO fabricated digests/hashes; a
      verified network resolve via skopeo/docker-manifest-inspect + pip-compile/hashin is the
      gating next step") and codex-0415 CR-E-19, image digest/platform and dependency-lock
      qualification remain AUTHOR-REPORTED until each owner performs a verified resolve. A
      declaration cannot fabricate that qualification.
    exposure_guard: >-
      A resolved base-image digest exists only in off-limits lab-state context artifacts; it is
      deliberately NOT cited or transcribed here. Master consumers are recorded as unpinned.

required_fields_per_profile:   # field names only -- values are owner-written on a verified resolve
  - resolved_base_image_digest   # "@sha256:..."; null until the owner's verified resolve
  - base_image_platform          # os/arch of the resolved digest
  - apt_lock_ref                 # path of the declared apt pin/lock (+hash) file
  - pip_lock_ref                 # path of the declared pip lock file rendered with --require-hashes
  - vendored_source_hash_refs    # references (path + locus) to in-tree source-tarball sha256 checks -- by reference, not duplicated
  - build_time_generated_locks   # in-image generated package manifests + their export/version-control requirement
  - sbom_ref                     # cross-reference to the SBOM output artifact for this profile's container

profiles:
  postgresql-platform:
    owner: D
    source:
      path: config/postgresql-platform/Containerfile
      blob_sha1: 86644a55452b057f7164c949bad91f7592dfed25   # at pinned_to_commit
      base_image: "ARG BASE_IMAGE / FROM ${BASE_IMAGE} (L2-3) -- unpinned; digest injected by builder"
    resolved_base_image_digest:
      status: pending
      resolver: D
      method: "skopeo / docker-manifest-inspect verified resolve of the Debian13 base"
      value: null
    image_artifact_binding:
      path: manifests/services/lme-pgvector.yml
      blob_sha1: cb79a3ebd04fdc4d60f997b885f30b733161837b
      current: "image: pgvector (L31) -- built-artifact reference; image->built-artifact digest binding pending (B-rev2 to_D)"
    pip_requirement:
      declared_in_source: "patroni[etcd3]==4.1.3, psycopg[binary]==3.2.9 (Containerfile RUN venv install)"
      requirement: "render a pip lock with --require-hashes (B-rev2 to_D); D writes on a verified resolve"
      status: pending
    apt_lock_ref:
      status: pending
      requirement: "declared apt package pins for the build-essential/bison/flex/... set (B-rev2 to_D); D writes"
    vendored_source_hash_refs:   # recorded BY REFERENCE; sha256 values live in the D-owned source, not duplicated here
      - source_path: config/postgresql-platform/Containerfile
        blob_sha1: 86644a55452b057f7164c949bad91f7592dfed25
        locus: "RUN sha256sum -c for postgresql-17.11.tar.bz2 and pgvector-0.8.1.tar.gz"
        note: "in-tree sha256 integrity checks present in source; the sha256 values are NOT transcribed here"
    build_time_generated_locks:
      - artifact: /opt/lme/qualified-debian-packages.txt
        generator: "dpkg-query -W (in-image, at build)"
        export_requirement: "must be exported and recorded in the C1 manifest slot bound to the exact built image; not currently version-controlled in-tree"
      - artifact: /opt/patroni/qualified-python-packages.txt
        generator: "pip freeze (in-image, at build)"
        export_requirement: "same as above"
  hertzbeat-platform:
    owner: E
    source:
      path: config/hertzbeat-platform/Containerfile
      blob_sha1: 0a5ccdfbe8541893a69220813989f0c80d46861c
      base_image: "ARG JAVA_IMAGE / FROM ${JAVA_IMAGE} (L2-3) -- unpinned; JDK25 OCI ref injected by builder"
    resolved_base_image_digest:
      status: pending
      resolver: E
      method: "resolved JDK25 OCI reference containing @sha256:<digest> (B-rev2 to_E)"
      value: null
    apt_lock_ref: {status: not_applicable, note: "no apt install layer in this Containerfile"}
    pip_lock_ref: {status: not_applicable, note: "JVM artifact; vendored distribution/ + apache-hertzbeat-1.9.0.jar COPYied"}
    vendored_source_hash_refs:
      - source_path: config/hertzbeat-platform/Containerfile
        blob_sha1: 0a5ccdfbe8541893a69220813989f0c80d46861c
        locus: "COPY distribution/ (apache-hertzbeat-1.9.0.jar) -- no in-source hash check present"
        note: "requirement: E declares a hash/lock for the vendored jar; currently unverified"
  lme-dashboard:
    owner: E
    source:
      path: lme-dashboard/Dockerfile
      blob_sha1: b2162d70a8aeda852cb0cd35ed14897f5fe6c476
      base_image: "FROM docker.io/library/python:3.11-slim (L1) -- tag only, no digest"
    resolved_base_image_digest:
      status: pending
      resolver: E
      method: "python:3.11-slim -> @sha256 digest pin (B-rev2 to_E)"
      value: null
    pip_requirement:
      requirement: "requirements pin + hash (B-rev2 to_E); E writes on a verified resolve"
      status: pending
  lme-log-analyzer:
    owner: E
    source:
      path: lme-log-analyzer/Dockerfile
      blob_sha1: 94330fce7f83e8bd7cd7242e98eed803cb747a7f
      base_image: "FROM docker.io/library/python:3.11-slim (L2) -- tag only, no digest"
    resolved_base_image_digest:
      status: pending
      resolver: E
      method: "python:3.11-slim -> @sha256 digest pin (B-rev2 to_E)"
      value: null
    pip_requirement:
      requirement: "requirements pin + hash (B-rev2 to_E); E writes on a verified resolve"
      status: pending

lineage_checks:
  - id: LC-1-resolve-chain
    check: >-
      source Containerfile/Dockerfile (unpinned ARG or floating tag) -> owner's verified resolve
      -> resolved @sha256 digest recorded in the C1 manifest slot -> SBOM cross-reference. Every
      link must be present; a missing link is a broken lineage, not a pending nicety.
  - id: LC-2-build-lock-export
    check: >-
      build-time-generated lock manifests (qualified-debian-packages.txt via dpkg-query,
      qualified-python-packages.txt via pip freeze) must be exported from the image and bound to
      the exact built artifact; an in-image-only lock is not version-controlled provenance.
  - id: LC-3-vendored-by-reference
    check: >-
      in-source vendored-tarball sha256 checks stay in the owner's source; recorded here by
      reference (path + locus). F does not duplicate the values (avoids a second authority).
  - id: LC-4-author-reported
    check: >-
      image digest/platform and dependency-lock qualification are AUTHOR-REPORTED until a verified
      resolve (CR-E-19). Status stays pending; no declaration or parity claim promotes it.

sbom_linkage:
  tooling_dir: scripts/sbom   # NOT an F-owned path; recorded here only for the linkage requirement
  do_not_run:
    script: scripts/sbom/generate-container-sbom.sh
    reason: "installs the syft tool on the host and opens a podman socket (host mutation) -- NEVER run from this role"
  outputs:
    - generator: scripts/sbom/generate-container-sbom.sh
      blob_sha1: f09753f5aad72233f49eb8d0ffbd60bd9774f872
      produces: "syft SPDX json + syft table per container, plus an LME-directory scan -> ./output/"
    - generator: scripts/sbom/generate-ansible-sbom.py
      blob_sha1: cb171d8d6978033ccc4e725def7f2fb5520f888d
      produces: "output/ansible-spdx.json (apt/nix packages parsed from the install playbooks)"
  linkage_requirement: >-
    each profile's sbom_ref cross-references the syft SPDX for that profile's container; the C1
    manifest slot is the single place binding resolved-digest <-> lock refs <-> SBOM artifact.

