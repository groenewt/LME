  - {path: config/hertzbeat-platform/Containerfile, blob_sha1: 0a5ccdfbe8541893a69220813989f0c80d46861c, representation_class: containerfile-non-yaml-jinja, owner: E, conformance_status: violation}
  - {path: lme-dashboard/Dockerfile, blob_sha1: b2162d70a8aeda852cb0cd35ed14897f5fe6c476, representation_class: dockerfile-non-yaml-jinja, owner: E, conformance_status: violation}
  - {path: lme-log-analyzer/Dockerfile, blob_sha1: 94330fce7f83e8bd7cd7242e98eed803cb747a7f, representation_class: dockerfile-non-yaml-jinja, owner: E, conformance_status: violation}
  - {path: scripts/sbom/generate-ansible-sbom.py, blob_sha1: cb171d8d6978033ccc4e725def7f2fb5520f888d, representation_class: python-must-be-generated-by-macro, owner: "pending-owner-ruling (B artifacts LEAD)", conformance_status: violation}
  - {path: scripts/sbom/generate-container-sbom.sh, blob_sha1: f09753f5aad72233f49eb8d0ffbd60bd9774f872, representation_class: bash-must-be-generated-by-macro, owner: "pending-owner-ruling (B artifacts LEAD)", conformance_status: violation}
  - {path: scripts/sbom/README.md, blob_sha1: 6d87c46358e76a5fa62ee5ddd67088bf3656aee8, representation_class: markdown-must-be-generated-by-macro, owner: "pending-owner-ruling (B artifacts LEAD)", conformance_status: violation}
