bug_or_error_report_open:
  consumed_file: .github/ISSUE_TEMPLATE/bug-or-error-report.md
  representation_class: free_form_prose_with_yaml_frontmatter
  render_status: OPEN
  conformance_status: >-
    OPEN. Not converted this tick. Two reasons render is not attempted here:
    (1) the body is free-form prose (a checklist + guidance), not decomposable
    into meaningful iterated values without cosmetic body-in-manifest wrapping;
    (2) the body embeds a Jinja-delimiter hazard -- line 46 contains the Docker
    Go-template token `{{.Names}}` inside a shell one-liner. Rendering a verbatim
    body through ansible.builtin.template would recursively evaluate `{{.Names}}`
    and fail (undefined), so a naive `{{ body }}` render is invalid.
  tractable_part:
    yaml_frontmatter:
      keys: [name, about, title, labels, assignees]
      note: >-
