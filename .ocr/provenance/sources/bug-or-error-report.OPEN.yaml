        which IS render-proven). It can be modeled as an ordered list of
        {key, raw_scalar} and iterated. The prose body remains verbatim-prose.
  remediation_plan: >-
    Split into (a) structured frontmatter manifest (iterated {key, raw}), and
    (b) a prose body carried as verbatim_consumer_text with the `{{.Names}}`
    token neutralized -- either emit the braces from the template via string
    literals ({{ '{{' }}.Names{{ '}}' }}) with the token name as data, or wrap
    the body region in {% raw %}...{% endraw %}. Then render + byte-diff. Request
    a reusable "verbatim-prose-with-escaped-delimiters" macro from C1.
  macro_request_to_c1: >-
    A macro that renders a verbatim text block while escaping embedded Jinja
    delimiters would make this (and the PR template) tractable without hand
