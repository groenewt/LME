gitignore:
  groups:
  - leading_blank: false
    comment: null
    patterns:
    - '*.pdf'
    - tmp/*
    - '*.docx'
    - .DS_Store
    - /.idea/
    - /.vscode/
    - /dashboards/exported/
    - '**/.env'
    - /Chapter 4 Files/*.dumped.ndjson
    - /Chapter 4 Files/exported/
  - leading_blank: true
    comment: '#created files should be ignored:'
    patterns:
    - Chapter 3 Files/certs/
    - Chapter 3 Files/docker-compose-stack-live.yml
    - Chapter 3 Files/logstash.edited.conf
    - Chapter 3 Files/logstash_custom.conf
    - LME/
    - files_for_windows.zip
    - Chapter*/lme.conf
    - '**/venv/'
    - /testing/tests/.env
    - '**/.pytest_cache/'
    - '**/__pycache__/'
    - /testing/**/*.password.txt
    - /testing/configure/azure_scripts/config.ps1
    - /testing/configure.zip
    - /testing/**/*.output.log
    - /testing/tests/report.html
    - testing/tests/assets/style.css
    - .history/
    - '**/get-docker.sh'
    - '**/gh-escluster-bodies/**'
    - .gh-issue-body.md
    - scripts/gh-escluster-issues.log
    - scripts/create_remaining_escluster_issues.sh
    - '*.vim'
    - '**.password.txt'
    - '**.ip.txt'
    - '**.swp'
    - '*.vim*'
    - '**/quadlet/output'
    - '**/lme-environment.env'
    - '**/env.sh'
    - testing/v2/installers/envirnment.sh
    - docker/**/environment.sh
    - '**exporter.txt'
    - testing/upgrade_testing/
  - leading_blank: false
    comment: '# AI assistant tool directories'
    patterns:
    - .aider*
    - .aider/
    - .serena/
    - .claude/
    - .cache/
    - .venv/
    - '*.env'
    - cloud.md
  - leading_blank: true
    comment: '# SELinux build artifacts'
    patterns:
    - ansible/roles/base/files/selinux/*.mod
    - ansible/roles/base/files/selinux/*.pp
  - leading_blank: true
    comment: '# Offline Install'
    patterns:
    - offline_resources/
    - lme-offline-*.tar.gz
  - leading_blank: true
    comment: '# Elastic Agent downloads'
    patterns:
    - elastic-agent-*/
    - elastic-agent-*.tar.gz
    - nohup.out
  - leading_blank: true
    comment: '# Development scripts (not for production)'
    patterns:
    - scripts/dev_uninstall_lme.sh
  - leading_blank: true
    comment: '# Credentials (never commit)'
    patterns:
    - '**/CREDENTIALS.md'
  - leading_blank: true
    comment: null
    patterns:
    - .worktrees
    - tmp/
  - leading_blank: true
    comment: null
    patterns:
    - testing/v2/installers/**/*.machines.json
    - scripts/get_container_bandwidth.sh
    - scripts/measure_container_bandwidth.sh
    - ansible/inventory/cluster.yml
    - todo.txt
    - testing/v2/installers/cluster_installer/cluster_output.log
    - CLAUDE.md
    - .claude
  - leading_blank: true
    comment: '# Sigma script runtime artifacts'
    patterns:
    - scripts/sigma/output/
    - scripts/sigma/sigma/
    - scripts/sigma/rules-emerging-threats/
    - scripts/sigma/version.txt
  - leading_blank: true
    comment: '# Misc'
    patterns:
    - elastic-agent-*.deb
    - node_modules/
    - package.json
    - package-lock.json
    - DECISIONS.md
    - EVALUATION/
