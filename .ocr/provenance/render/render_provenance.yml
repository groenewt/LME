---
# F3-provenance PROVISIONAL out-of-master render harness.
#
# Purpose: prove that each authored declarative source (manifest of values +
# Jinja template that iterates those values) regenerates its tool-consumed file
# BYTE-FOR-BYTE, using the native Ansible template engine (ansible.builtin.template).
#
# This harness is a provenance/parity check ONLY. It does NOT wire these sources
# into the production build; production render-wiring belongs to the C1 engine
# (templates/macros) and is an OPEN coordinated integration (see
# ../README-render-method.yaml). It never writes to the consumed files -- it
# renders into an out-of-tree directory (out=... extra-var, a scratchpad) that a
# caller then byte-diffs against the a3352b2 snapshot references.
#
# Reproduce (from a directory with no repo ansible.cfg, e.g. the scratchpad):
#   env -u ANSIBLE_CONFIG ansible-playbook -i localhost, -c local \
#     .ocr/provenance/render/render_provenance.yml -e out=/abs/path/to/out_dir
#
# Toolchain of record: python 3.13.9, ansible-core 2.17.14, jinja2 3.1.6.
- name: F3 provenance render parity harness
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    src: "{{ playbook_dir }}/../sources"
  tasks:
    - name: Fail early if out dir was not provided
      ansible.builtin.assert:
        that:
          - out is defined
          - out | length > 0
        fail_msg: "Pass the output directory: -e out=/abs/path/to/scratchpad/out"

    - name: Ensure output directory exists
      ansible.builtin.file:
        path: "{{ out }}"
        state: directory
        mode: "0755"

    - name: Load each declarative VALUES manifest (unique top-level key per manifest)
      ansible.builtin.include_vars: "{{ src }}/{{ item }}"
      loop:
        - gitattributes.manifest.yaml
        - gitignore.manifest.yaml
        - devcontainer.manifest.yaml
        - changelog-configuration.manifest.yaml
        - LICENSE.manifest.yaml
        - README-github.manifest.yaml
        - feature_request.manifest.yaml

    - name: Render each template over its manifest values
      ansible.builtin.template:
        src: "{{ src }}/{{ item.tmpl }}"
        dest: "{{ out }}/{{ item.dest }}"
        trim_blocks: true
        lstrip_blocks: true
        newline_sequence: "\n"
        output_encoding: utf-8
        mode: "0644"
      loop:
        - { tmpl: gitattributes.j2, dest: gitattributes.rendered }
        - { tmpl: gitignore.j2, dest: gitignore.rendered }
        - { tmpl: devcontainer.j2, dest: devcontainer.json.rendered }
        - { tmpl: changelog-configuration.j2, dest: changelog-configuration.json.rendered }
        - { tmpl: LICENSE.j2, dest: LICENSE.rendered }
        - { tmpl: README-github.j2, dest: README-github.md.rendered }
        - { tmpl: feature_request.j2, dest: feature_request.md.rendered }
