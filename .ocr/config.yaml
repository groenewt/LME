# Open Code Review Configuration
# This file is installed to .ocr/config.yaml and customized per-project.
# Context here is injected into every review request.

# ─────────────────────────────────────────────────────────────────────────────
# PROJECT CONTEXT
# ─────────────────────────────────────────────────────────────────────────────
# Injected into ALL review requests. Keep it tight—focus on what reviewers
# genuinely need to know that isn't obvious from the code itself.

# context: |
#   Tech stack: TypeScript, React, Node.js, PostgreSQL
#   Architecture: Monorepo with NX, ESM only
#   Testing: Jest + React Testing Library, mock only external services
#   Critical constraint: All public APIs must be backwards compatible

# ─────────────────────────────────────────────────────────────────────────────
# CONTEXT DISCOVERY
# ─────────────────────────────────────────────────────────────────────────────
# Files to read during Phase 1 (Context Discovery). OCR merges these into
# the review context automatically.

context_discovery:
  # OpenSpec integration - pull project context and active specs
  openspec:
    enabled: true
    config: "openspec/config.yaml"      # Project conventions from OpenSpec
    # config: "openspec/project.md"     # Use this for legacy OpenSpec projects
    specs: "openspec/specs/**/*.md"     # Merged specs for architectural context
    active_changes: "openspec/changes/**/*.md"  # In-flight change proposals
  
  # AI assistant configuration files (auto-detected)
  references:
    - "AGENTS.md"
    - "CLAUDE.md"
    - ".cursorrules"
    - ".windsurfrules"
    - ".github/copilot-instructions.md"
    - "CONTRIBUTING.md"
    - "openspec/AGENTS.md"  # OpenSpec instructions (if present)
  
  # Additional project-specific files to include
  # additional:
  #   - "docs/ARCHITECTURE.md"
  #   - "docs/API_STANDARDS.md"

# ─────────────────────────────────────────────────────────────────────────────
# REVIEW RULES
# ─────────────────────────────────────────────────────────────────────────────
# Per-severity rules for reviewers. Only add what's not obvious.

# rules:
#   critical:
#     - Security vulnerabilities (injection, path traversal, secrets in code)
#     - Breaking changes without migration path
#     - Data loss or corruption risks
#   important:
#     - Silent error handling (catch without action)
#     - Missing user-facing error messages
#     - Performance regressions in hot paths
#   consider:
#     - Naming consistency
#     - Documentation gaps
#     - Test coverage for edge cases

# ─────────────────────────────────────────────────────────────────────────────
# REVIEWER TEAM
# ─────────────────────────────────────────────────────────────────────────────

default_team:
  # SWARM is the mechanism (operator directive 2026-09-21): 12+ reviewers/round, NOT light.
  # This is the standing default — every /ocr:review resolves to this unless --team overrides up.
  principal: 4    # Holistic architecture / composability review
  quality: 4      # Code quality and maintainability
  security: 2     # Exposure / auth / tailnet-policy surface
  testing: 2      # Test coverage / e2e-gate correctness
  # => 12 reviewers/round by default (was the banned "3 agents at a time" 2+2).

  # ── Optional advanced forms ──
  # Form 2 — object: N instances, all sharing the same model.
  # quality: { count: 2, model: claude-haiku-4-5-20251001 }
  #
  # Form 3 — list of instance configs: per-instance model and optional name.
  # principal:
  #   - { model: claude-opus-4-7 }
  #   - { model: claude-sonnet-4-6, name: principal-balanced }
  #
  # Mixing forms within a single entry (e.g. count + instances) is rejected
  # at parse time. Pick one form per persona.

# ─────────────────────────────────────────────────────────────────────────────
# MODELS (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Define personal aliases for vendor-native model identifiers and an optional
# workspace-level default. OCR ships zero alias entries — this section is
# entirely user-owned. Aliases expand once at parse time.
#
models:
  aliases:
    openai-gpt-5-6-sol: "openai/gpt-5.6-sol"
    openai-gpt-5-6-luna: "openai/gpt-5.6-luna"
    ollama-cloud-deepseek-v4-flash: "ollama-cloud/deepseek-v4-flash"
    ollama-cloud-deepseek-v4-flash-0731: "ollama-cloud/deepseek-v4-flash:0731"
    ollama-cloud-deepseek-v4-pro: "ollama-cloud/deepseek-v4-pro"
    ollama-cloud-deepseek-v4-pro-0813: "ollama-cloud/deepseek-v4-pro:0813"
    ollama-cloud-deepseek-v4-1-flash: "ollama-cloud/deepseek-v4.1-flash"
    ollama-cloud-gemma4-31b: "ollama-cloud/gemma4:31b"
    ollama-cloud-glm-5-1: "ollama-cloud/glm-5.1"
    ollama-cloud-glm-5-2: "ollama-cloud/glm-5.2"
    ollama-cloud-glm-5-3: "ollama-cloud/glm-5.3"
    ollama-cloud-glm-5-3-flash: "ollama-cloud/glm-5.3-flash"
    ollama-cloud-gpt-oss-120b: "ollama-cloud/gpt-oss:120b"
    ollama-cloud-gpt-oss-20b: "ollama-cloud/gpt-oss:20b"
    ollama-cloud-kimi-k2-5: "ollama-cloud/kimi-k2.5"
    ollama-cloud-kimi-k2-6: "ollama-cloud/kimi-k2.6"
    ollama-cloud-kimi-k2-7-code: "ollama-cloud/kimi-k2.7-code"
    ollama-cloud-kimi-k3: "ollama-cloud/kimi-k3"
    ollama-cloud-minimax-m2-5: "ollama-cloud/minimax-m2.5"
    ollama-cloud-minimax-m2-7: "ollama-cloud/minimax-m2.7"
    ollama-cloud-minimax-m3: "ollama-cloud/minimax-m3"
    ollama-cloud-mistral-large-3-675b: "ollama-cloud/mistral-large-3:675b"
    ollama-cloud-nemotron-3-nano-30b: "ollama-cloud/nemotron-3-nano:30b"
    ollama-cloud-nemotron-3-super: "ollama-cloud/nemotron-3-super"
    ollama-cloud-nemotron-3-ultra: "ollama-cloud/nemotron-3-ultra"
    ollama-cloud-qwen3-5-397b: "ollama-cloud/qwen3.5:397b"
    cursor-grok-4-6-xhigh: "cursor-grok-4.6-xhigh"

# ─────────────────────────────────────────────────────────────────────────────
# RUNTIME (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Tunables that affect liveness reasoning. Defaults are usually fine.
#
# runtime:
#   agent_heartbeat_seconds: 60   # After this many seconds without an
#                                  # `ocr session beat` call, a `running`
#                                  # agent_sessions row is reclassified
#                                  # `orphaned` on the next sweep.

# ─────────────────────────────────────────────────────────────────────────────
# CODE REVIEW MAP
# ─────────────────────────────────────────────────────────────────────────────
# Configuration for the /ocr:map command.
# Increase agent redundancy for large codebases to improve accuracy.
# Note: Map is a standalone tool for humans; review command works independently.

code-review-map:
  agents:
    # SWARM is the mechanism (operator directive 2026-09-21): NOT the light 2+2 default.
    # Every /ocr:map dispatches this many disjoint, OCR-journaled analysts (range 1-10 each).
    flow_analysts: 8         # Flow Analyst agents (dependency/correctness tracing)
    requirements_mappers: 6  # Requirements Mapper agents (mandate-coverage mapping)
    # => 14 analysts/map by default (12+ floor).

# ─────────────────────────────────────────────────────────────────────────────
# OUTPUT & WORKFLOW
# ─────────────────────────────────────────────────────────────────────────────

output:
  session_dir: ".ocr/sessions"

discourse:
  enabled: true   # Set false or use --quick to skip reviewer debate phase

github:
  auto_prompt_post: false
  comment_format: "single"  # "single" or "inline"

# ─────────────────────────────────────────────────────────────────────────────
# DASHBOARD (optional)
# ─────────────────────────────────────────────────────────────────────────────
# Select the AI CLI used by dashboard actions. Dashboard-launched child
# processes inherit the environment of the shell that ran `ocr dashboard`
# (no configuration needed; restart the dashboard to pick up new exports).
#
# dashboard:
#   ai_cli: auto  # "auto", "claude", "opencode", or "off"
