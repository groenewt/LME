statement: Every authored file in MASTER is EITHER a YAML configuration/manifest OR a Jinja template. No hardcoded values are permitted inside Jinja templates. Every non-YAML/Jinja artifact (Python, Bash, JSON, Markdown, INI, dependency files, binary assets, and every other category) MUST be GENERATED from declared YAML values plus reusable Jinja macros, with verifiable provenance. The rule applies to EVERY file with NO category exemptions, INCLUDING files at the current HEAD. Each non-conforming file is a violation to be treated as such.
