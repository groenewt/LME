# matcher.yaml -- DECLARED, reproducible classification + ownership rule set.
# Satisfies Codex check-0045 requested_artifact. This file is the SINGLE source of
# truth executed by the ephemeral generator: the generator loads THIS file and
# applies its rules; it contains no independent if/elif classifier. If a rule is
# not here, the generator cannot apply it.
#
# This file itself is representation_class=config_manifest_yaml (compliant-by-form
# as declarative YAML). It is authored by area-F worker F1-register, NOT a committed
# project build artifact.
schema_version: 1
authored_by: F1-register (F_representation_provenance)
snapshot_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7

matcher_semantics:
  engine: python-fnmatch
  function: fnmatch.fnmatchcase
  comment: >-
    fnmatch.fnmatchcase is used (NOT fnmatch.fnmatch, which applies os.path.normcase
    and would fold case on some platforms). Matching is case-sensitive and applied to
    the POSIX (forward-slash) tracked path exactly as `git ls-tree -r` emits it, with
    no leading "./".
  star_crosses_slash: true
  star_comment: >-
    Under fnmatch, `*` matches ANY character INCLUDING `/`. Therefore `docs/*` matches
    `docs/superpowers/plans/x.md`, and `ansible/roles/certs/*` matches every file at
    any depth under that role. This is intentional and every rule is written with that
    behaviour in mind.
  brace_expansion: false
  brace_comment: >-
    NO brace expansion is performed. Every `{a,b}` set from the check-0045 assignment
    text has been pre-expanded into explicit literal globs in this file. A literal `{`
    in a glob would be matched as the character `{`.
  bracket_metacharacters: true
  bracket_comment: >-
    `[` `]` and `?` are fnmatch metacharacters. No tracked path in this repo relies on
    them; globs here use only `*` and literal characters.
  order: first-match-wins
  order_comment: >-
    Rules within classification_rules and within ownership_rules are ORDERED. The FIRST
    rule (top-to-bottom) whose glob list matches a path decides that path. Carve-outs
    are placed before catch-alls. No explanatory prose appears INSIDE any glob string;
    explanations live in the sibling `comment:` field (Codex rejected prose-in-glob).

representation_class_taxonomy:
  - config_manifest_yaml
  - jinja_template
  - native_ansible_yaml
  - hand_authored_allowance
  - generated_artifact_pending_source
  - verbatim_consumer_text
  - tool_consumed_config
  - documentation
  - binary_asset
  - vendored_nested

conformance_status_taxonomy:
  - allowance
  - class_allowed_content_unassessed
  - violation
  - asset
  - pending-owner-ruling

conformance_status_reserved:
  reserved_never_emitted:
    - compliant
  reserved_comment: >-
    `compliant` is RESERVED and never emitted. Zero files carry verifiable render/lineage
    provenance today, so no file can be certified compliant. The two-field model below
    keeps this honest: `class_status` is the content/representation verdict from the
    classification matcher; `conformance_status` is that same verdict UNLESS the path is
    unowned, in which case it becomes `pending-owner-ruling` (owner codex). An unowned
    violation therefore still shows class_status=violation while conformance_status
    reports the ownership gate.

evidence_bindings:
  yaml_jinja_unassessed_verdict:
    path: .superpowers/sdd/2026-09-22-manifest-reconciliation/configuration-format-audit/template-value-provenance.yaml
    sha256: 6f760211b917679dd25b1d4a2fd8e9b5cbf86bc5e3534659b784e8cc3e0db5c1
    binds: >-
      Every .yml/.yaml/.j2 is class_allowed_content_unassessed (NOT compliant). The
      standing Jinja-AST value-provenance audit above establishes that YAML/Jinja FORM
      is necessary but not sufficient: a .j2 or an Ansible task .yml may still carry
      hardcoded literals. Value-sourcing / macro-lineage / no-hardcoded-literals remain
      unaudited by this register (they are the A-E content audits, not an F form check).
  prior_f_inventory:
    path: .superpowers/sdd/2026-09-22-observability-implementation/wave1/w1-F-inv.yaml
    sha256: 65df6535a53cc8ef2d7e15808c4b05f0c8f60a806e13df9fa362320de65a8ffe
    computed_at_commit: 152161de3551e2cd3a05e9530ab888399e8043bd

secret_name_exclusion:
  action: withhold-hash-keep-path
  comment: >-
    Per the operator worker contract, any file whose NAME suggests secrets, and the
    entire .superpowers/lab-state/** subtree, are NEVER read or hashed. For tracked
    paths that match (the path is already public in git's tree listing, so listing it
    leaks nothing) the register KEEPS the path with its name-based classification and
    ownership so the 817-file total reconciles, but sets blob_sha1=null, sha256=null and
    hash_withheld="secret-name-exclusion". Their bytes are never `cat-file`-d. The SAME
    filter is applied in the untracked walks, and .superpowers/lab-state is pruned from
    directory descent before its names are ever enumerated. This is a deliberate,
    conservative OVER-exclusion: several matches (role tasks, test fixtures, an example
    env, a shell script) are not actually secret material, but a conservative miss is free.
  patterns_fullpath_and_basename_casefold:
    - "*.password.txt"
    - "*.env"
    - "CREDENTIALS.md"
    - "*secret*"
    - "*.key"
    - "id_*"
  pruned_untracked_subtree:
    - .superpowers/lab-state

# ---------------------------------------------------------------------------
# CLASSIFICATION RULES  (representation_class + class_status + violation_reason)
# ordered first-match-wins; carve-outs before extension catch-alls.
# ---------------------------------------------------------------------------
classification_rules:
  - id: c00_hand_authored_allowance
    globs: ["ansible/roles/podman/filter_plugins/lme_manifests.py"]
    representation_class: hand_authored_allowance
    class_status: allowance
    violation_reason: null
    comment: The SOLE hand-authored allowance (value-pure renderer, C1-owned).
  - id: c01_license_verbatim
    globs: ["LICENSE", "*/LICENSE"]
    representation_class: verbatim_consumer_text
    class_status: violation
    violation_reason: verbatim-no-source
    comment: Verbatim upstream legal text; disposition (macro-generate vs evidenced exemption) is an open owner ruling.
  - id: c02_tool_consumed_config
    globs:
      - "*.gitignore"
      - "*.gitattributes"
      - "*.dockerignore"
      - "devcontainer.json"
      - "*/devcontainer.json"
      - ".github/changelog-configuration.json"
      - "*/changelog-configuration.json"
    representation_class: tool_consumed_config
    class_status: violation
    violation_reason: tool-consumed-no-source
    comment: Consumed verbatim by a tool (git, docker, devcontainer, changelog); must come BEFORE the *.json data rule.
  - id: c03_binary_asset
    globs: ["*.png", "*.jpg", "*.jpeg", "*.gif", "*.ico", "*.svg", "*.pdf",
            "*.tar", "*.gz", "*.tgz", "*.zip", "*.whl", "*.jar", "*.class",
            "*.pyc", "*.db", "*.woff", "*.woff2", "*.ttf",
            "*.bz2", "*.xz", "*.zst", "*.7z", "*.deb", "*.rpm", "*.iso",
            "*.qcow2", "*.img", "*.bin", "*.so", "*.o", "*.a", "*.dll", "*.exe"]
    representation_class: binary_asset
    class_status: asset
    violation_reason: null
    comment: >-
      Binary / compiled / archive assets; conversion N/A, hash recorded (sha256 of blob bytes)
      for the tracked PNGs. Only *.png occurs in the tracked tree at a3352b2; the rest carry
      zero tracked hits and exist to classify untracked evidence trees (.ocr/.superpowers/
      .quarantine) without emitting an undeclared class.
  - id: c04_fake_bin_executable
    globs: ["*/bin/podman", "*/bin/systemctl", "*/bin/postconfig-auth", "*/bin/*"]
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: embedded-code-body
    comment: >-
      Extension-less fake-bin test stubs / command shims under a bin/ dir (executable bodies).
      Tracked hits at a3352b2 are exactly the three secret_distribution fixtures; the broader
      */bin/* covers untracked command-shim stubs (dnf, sudo, curl, ...) in evidence trees.
  - id: c05_container_build_file
    globs: ["*Dockerfile", "*Containerfile"]
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: hand-authored-non-yaml
    comment: Container build recipes (extension-less basename).
  - id: c06_jinja_template
    globs: ["*.j2"]
    representation_class: jinja_template
    class_status: class_allowed_content_unassessed
    violation_reason: null
    comment: Jinja template -- allowed FORM but may carry hardcoded literals; NOT compliant. See evidence_bindings.
  - id: c07_native_ansible_yaml
    globs: ["ansible/*.yml", "ansible/*.yaml"]
    representation_class: native_ansible_yaml
    class_status: class_allowed_content_unassessed
    violation_reason: null
    comment: >-
      YAML under ansible/ (playbooks, roles tasks/vars/defaults/handlers/meta, inventory,
      spec). Allowed native declarative form; content (embedded imperative bodies / giant
      code scalars) UNASSESSED here. Must precede the generic YAML rule.
  - id: c08_config_manifest_yaml
    globs: ["*.yml", "*.yaml"]
    representation_class: config_manifest_yaml
    class_status: class_allowed_content_unassessed
    violation_reason: null
    comment: All other YAML (manifests/**, config/**, testing/**, .github/**, root). Allowed form, content unassessed.
  - id: c09_embedded_code_body
    globs: ["*.py", "*.sh", "*.ps1", "*.exp", "*.js", "*.java", "*.ts", "*.tsx",
            "*.go", "*.rb", "*.pl", "*.psm1", "*.bat", "*.cmd"]
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: embedded-code-body
    comment: >-
      Executable source with imperative logic; must be generated from YAML+macros with verifiable
      lineage. Only .py/.sh/.ps1/.exp/.js occur in the tracked tree; .java/.ts/... carry zero
      tracked hits and classify untracked evidence/vendored code.
  - id: c10_hand_authored_nonyaml
    globs:
      - "*.sql"
      - "*.css"
      - "*.less"
      - "*.scss"
      - "*.html"
      - "*.conf"
      - "*.te"
      - "*.fc"
      - "*.service"
      - "*.path"
      - "*.socket"
      - "*.mount"
      - "*.target"
      - "*.timer"
      - "*.container"
      - "*.volume"
      - "*.network"
      - "*.toml"
      - "*.ini"
      - "*.cfg"
      - "*.xml"
      - "*.properties"
      - "*.imports"
      - "*.tpl"
      - "*.patch"
      - "*.diff"
      - "*.env_example"
      - "*.example"
      - "*.mk"
      - "Makefile"
      - "*/Makefile"
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: hand-authored-non-yaml
    comment: >-
      Hand-authored non-YAML config/text carriers (systemd + quadlet units, SELinux policy,
      TLS/app conf, stylesheets, templates-not-j2, patches/diffs, examples, build recipes).
      The systemd/quadlet, xml/properties/cfg/ini, less/scss, diff and Makefile globs carry
      zero tracked hits and classify untracked evidence trees.
  - id: c11_documentation
    globs: ["*.md"]
    representation_class: documentation
    class_status: violation
    violation_reason: hand-authored-non-yaml
    comment: >-
      Markdown docs. Remediation via managed-markdown provenance-sidecar where an
      OCR:START/END managed block already occupies the file's HTML-comment channel
      (provenance banner + ocr-managed block must coexist -- a C1/OCR-tooling open item).
  - id: c12_data_text
    globs: ["*.json", "*.txt", "*.ndjson", "*.env", "*.log", "*.mm", "*.jupyter", "*.ipynb",
            "*.jsonl", "*.hujson", "*.meta", "*.sha256", "*.sha512", "*.sha1", "*.digest",
            "*.map", "*.lock", "*.csv", "*.tsv"]
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: hand-authored-non-yaml
    comment: >-
      Non-YAML data/text (JSON fixtures, dashboard ndjson exports, mindmaps, notebooks, logs)
      EXCEPT tool-consumed configs caught by c02. The jsonl/hujson/meta/sha256/digest/map/lock/
      csv/tsv globs carry zero tracked hits and classify untracked evidence trees.
  - id: c13_noext_alert_config
    globs: ["*_alert_config"]
    representation_class: generated_artifact_pending_source
    class_status: violation
    violation_reason: hand-authored-non-yaml
    comment: Extension-less elastalert alert-config carriers (email/slack/teams/twilio).
  # NOTE: the generator ASSERTS every tracked path matches exactly one classification
  # rule above. There is intentionally no classification catch-all; an unmatched path is
  # a hard error requiring a new declared rule (never a silent default).

