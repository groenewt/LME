# testing/acceptance/CASE-SCHEMA.yml
#
# PINNED schema every cases/*.yml file in this tier conforms to. run_acceptance.yml
# reads this to validate case shape BEFORE running, so an off-schema case FAILS the
# run rather than silently no-op'ing. A case is a mapping in a file's top-level
# `cases:` list.

schema_version: 1

kinds:
  # --- REAL-CALLER cases (a probe is rendered + the real caller is invoked) -------
  resolve_admission: >-
    Drives the REAL ansible/roles/podman/tasks/resolve.yml (caller: resolve) from
    the HEAD snapshot. Proves admission / precedence / effective-input / conflict
    behavior of the shared early-resolve entrypoint under TRUE extra-var pins.
  loader_projection: >-
    Drives the REAL load_manifests.yml (caller: load_manifests) end-to-end, which
    self-composes lme_services from the manifest tree and derives the
    required_material / datastore / membership projections. Proves the projection
    readback is a faithful derivation, not equality between two uses of an
    overridable intermediate.
  # --- DECLARED / BLOCKED cases (no probe; a dependency has not landed) -----------
  backup_negative: >-
    F2 backup/restore discriminating case. DECLARED-NOW / BLOCKED until the named D
    repair + declarative-macro representation land. Never run against D's staged
    working-tree bytes and attributed to HEAD.
  custody_negative: >-
    F3 custody-transition discriminating case. DECLARED-NOW / BLOCKED until the
    JOINT C/D transition contract (guardian_cd_binding, currently
    UNWIRED_PROPOSED_AWAITING_C_ACK) lands. Source-only reasoning is NOT a passing
    runtime result, so these stay BLOCKED, not GREEN.

case_fields:
  name:        {required: true,  type: str,  note: "unique across ALL cases/*.yml; verdict key + per-case dir name"}
  kind:        {required: true,  enum: [resolve_admission, loader_projection, backup_negative, custody_negative]}
  discriminates: {required: true, type: str, note: "the codex/domain finding id this case discriminates"}
  predicted:   {required: true,  enum: [GREEN, RED, BLOCKED], note: "the SOURCE-derived prediction; the RUN's verdict is authoritative, and a mismatch is reported honestly"}
  # real-caller fields (resolve_admission / loader_projection):
  caller:      {required: false, enum: [resolve, load_manifests], note: "which real snapshot task file the probe includes; required for real-caller kinds"}
  profile:     {required: false, type: str,  note: "lme_profile passed to the caller (default 'default')"}
  base_inputs: {required: false, type: map,  note: "lme_inputs play var {selections?, observations?, origins?} -- caller-normalized inputs at PLAY-VAR precedence (below -e)"}
  pins:        {required: false, type: map,  note: "the case's hostile/valid extra-vars; materialized to pins.yml and injected with `-e @pins.yml` at TRUE extra-var precedence. Empty/omitted => a control run with no pin."}
  assert:                                     # the judge task for an accept case
    required: false
    type: map
    note: >-
      {that: [<jinja expr str>...], success_msg, fail_msg}. Rendered as the single
      `judge :: <name>` assert task after the real-caller include. For a
      reject-expected case set `that: [true]` (a documenting judge that only runs
      when the engine did NOT reject).
  expect:                                     # reject-expected classification
    required: false
    type: map
    note: >-
      {reject: bool, reject_cause: str}. When reject:true the case is GREEN
      (REJECTED-as-expected) ONLY if the real caller exits nonzero AND a failed
      task's msg contains reject_cause; rc==0 (engine did not reject) is RED;
      nonzero-but-wrong-cause is ERROR-WRONG-CAUSE. reject_cause is MANDATORY when
      reject:true (a rejection granted on ANY failure is forbidden).
  control:     {required: false, type: str,  note: "name of the GREEN control case that differs ONLY by the pin; a RED whose control is not PASS is downgraded to ERROR-CONTROL (a RED must be earned)"}
  invariant_task: {required: true, type: str, note: "the specific judge/assertion identity this verdict is keyed to (documentation; the JSON classifier keys accept cases on the rendered `judge :: <name>` task)"}
  # DECLARED/BLOCKED fields (backup_negative / custody_negative):
  queued_on:   {required: false, type: list, note: "the deliverable(s) this case waits on; REQUIRED for backup_negative/custody_negative"}
  blocked_reason: {required: false, type: str, note: "the exact gate that is not yet satisfied; REQUIRED for backup_negative/custody_negative"}

load_time_gates:
  # run_acceptance.yml FAILS the whole run BEFORE any case executes if:
  - "a case is missing name/kind/discriminates/predicted/invariant_task, or kind is unknown"
  - "case names are not unique across all files"
  - "expect.reject is true but expect.reject_cause is absent (a rejection on ANY failure is forbidden)"
  - "a backup_negative/custody_negative case is missing queued_on or blocked_reason"
  - "a real-caller case (resolve_admission/loader_projection) is missing caller"

authoring_rules:
  - "cases/NN_*.yml files are DISJOINT (one writer per file). NN orders execution."
  - "No secret VALUES in any case, pins.yml, probe render, log or receipt; synthetic fixtures only."
  - "Do NOT weaken a judge to make a run green; a RED is REPORTED, not suppressed."
  - "predicted is the source guess; the committed receipt records the RUNTIME verdict and flags any predicted!=actual."
