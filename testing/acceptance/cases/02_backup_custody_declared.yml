# testing/acceptance/cases/02_backup_custody_declared.yml
#
# F2 (backup/restore) + F3 (custody transition) discriminating cases, DECLARED-NOW
# and BLOCKED. These are recorded as the acceptance contract the domain repairs must
# satisfy, but the runner emits BLOCKED (not GREEN, not a probe) because their
# dependency has not landed at the pinned HEAD. Per codex-0900 + the G mandate:
# source-only audit reasoning is NOT a passing runtime result, so nothing here is
# faked as a pass. When D lands the named backup repair (with the declarative-macro
# representation) and C+D land the JOINT guardian_cd_binding transition contract,
# these are promoted to real backup_restore / custody probes.
#
# CRITICAL (codex-0900): these must NEVER be run against D's or C's STAGED
# working-tree bytes and attributed to HEAD. The real-caller tiers in this repo
# snapshot from the git HEAD blob only; these cases stay BLOCKED until the repair
# is COMMITTED, at which point a HEAD snapshot exercises the committed bytes.

cases:
  # ===== F2 -- backup/restore ================================================
  - name: f2-certified-volume-omission-rebinding-rejected
    kind: backup_negative
    discriminates: D-BACKUP-CERTIFIED-VOLUME-SET-AND-DIGEST-UNBOUND
    predicted: BLOCKED
    invariant_task: "reject a restore whose certified volume set is short/omitted/rebound before any mutation"
    queued_on: [D_backup_repair, D_declarative_macro_representation]
    blocked_reason: >-
      At the pinned HEAD the restore roster is derived from surviving directories and
      payloads are compared only to local manifests, so a deleted/rebound certified
      volume silently shrinks restoration. The acceptance case (reject a certified-set
      mismatch BEFORE mutation, bound to the admitted certificate) cannot be qualified
      until D binds the complete expected volume set + per-volume content to the
      admitted certificate. Not run against staged bytes.

  - name: f2-failed-io-and-publication-not-false-success
    kind: backup_negative
    discriminates: D-BACKUP-IO-AND-CERTIFICATE-PUBLICATION-FALSE-SUCCESS
    predicted: BLOCKED
    invariant_task: "a failed read/enumeration/stage/publish must propagate nonzero with a visible rejected status, never 'Bundle certified'"
    queued_on: [D_backup_repair]
    blocked_reason: >-
      content_integrity.sh.j2 returns success for missing input and suppresses
      read/mktemp/write/mv failures; the calling shell task supplies no strict mode.
      A discriminating failed-I/O / failed-publication case cannot be qualified until
      failures propagate and the committed artifact is verified before certification.

  - name: f2-complete-pre-mutation-restoration-ordering
    kind: backup_negative
    discriminates: D-RESTORE-COMPLETE-CONTENT-QUALIFICATION-AFTER-MUTATION
    predicted: BLOCKED
    invariant_task: "every required payload + its binding is qualified BEFORE any restoration mutation (install/config copy)"
    queued_on: [D_restore_repair]
    blocked_reason: >-
      A corrupt volume passes the early bundle gate while install/config copying
      happens before the per-volume mismatch is checked. A pre-mutation complete-
      qualification case cannot be qualified until restoration finishes qualifying
      every required payload before the first mutation (a task-order string assert is
      not complete pre-mutation verification).

  # ===== F3 -- custody transition (bound to the JOINT C/D contract) ===========
  - name: f3-custody-retry-enforces-expected-identity
    kind: custody_negative
    discriminates: C-CUSTODY-ROTATION-RESUME-IGNORES-EXPECTED-IDENTITY
    predicted: BLOCKED
    invariant_task: "a custody resume/noop/publish path enforces the independently bound EXPECTED_FP on every branch"
    queued_on: [guardian_cd_binding, C_custody_repair, D_authority_transition_semantics]
    blocked_reason: >-
      guardian_cd_binding in config/postgresql-platform/fencing-protocol.contract.yaml
      is UNWIRED_PROPOSED_AWAITING_C_ACK -- no joint acknowledgement and no implemented
      authority service. Custody-retry/expected-identity cases are DECLARED-NOW / RED
      until the joint transition/recovery contract lands; source-only reasoning is not
      a runtime pass.

  - name: f3-decryption-failure-must-not-grant-replacement
    kind: custody_negative
    discriminates: C-CUSTODY-DECRYPTION-FAILURE-ALLOWS-REPLACEMENT
    predicted: BLOCKED
    invariant_task: "decryption failure of existing current-epoch ciphertext must NOT itself authorize generation/replacement of custody"
    queued_on: [guardian_cd_binding, C_custody_repair]
    blocked_reason: >-
      After reboot removes runtime+marker, ROTATE=true with a blob that fails
      decryption reaches replacement without an authorized rotation transition. The
      case (require the declared, independently authorized transition + verified
      recoverable prior state; preserve unresolved ciphertext) needs the joint
      contract + implementation before it can be qualified.

  - name: f3-rotation-operation-distinguished-from-request
    kind: custody_negative
    discriminates: C-CUSTODY-ROTATION-REQUEST-NOT-DISTINGUISHED
    predicted: BLOCKED
    invariant_task: "a completed rotation is distinguished from a new unbumped request via an operation/generation record (prove BOTH unchanged-retry and unbumped-request-rejection)"
    queued_on: [guardian_cd_binding, C_custody_repair, D_authority_transition_semantics]
    blocked_reason: >-
      No operation record distinguishes a completed requested rotation from a new
      request at the same epoch. Universal same-epoch rejection is not established;
      the joint C/D semantics are required before this can be qualified.

  - name: f3-interrupted-ciphertext-runtime-promotion-checkpoint
    kind: custody_negative
    discriminates: C-CUSTODY-INTERRUPTED-CIPHERTEXT-RUNTIME-PROMOTION
    predicted: BLOCKED
    invariant_task: "an interruption between ciphertext replacement and runtime promotion is represented + recovered without discarding either identity"
    queued_on: [guardian_cd_binding, C_custody_repair]
    blocked_reason: >-
      Ciphertext replacement precedes runtime promotion; an interruption makes the new
      guard reject the old-runtime/new-ciphertext mismatch instead of resuming the
      authorized promotion. Each publication boundary must be represented + tested
      independently -- blocked on the joint checkpoint contract.
