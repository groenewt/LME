# testing/acceptance/cases/00_resolve_caller.yml
#
# F1 -- resolution / admission acceptance through the REAL resolve.yml caller, with
# the case pins injected at TRUE extra-var precedence (`-e @pins.yml`). Each RED
# case names a control that differs ONLY by the pin; a RED whose control is not
# PASS is downgraded to ERROR-CONTROL by the runner (a RED must be earned).
#
# Registry facts these cases rely on (manifests/global.yml lme_config_registry):
#   install_llm : bool, required, default true   (enable_flag)
#   install_otel: bool, required, default false  (enable_flag)
# A bare `-e <field>=...` selection is captured by resolve.yml's pristine operator
# capture and is honestly tagged origin `operator` (NOT extra_var) by the engine.

cases:
  # ---------------------------------------------------------------------------
  # 1. Old revision-pin counterexample is now INERT (codex-0900: the executable
  #    ref _lme_revision_resolved was removed at c68691e). Pinning that dead name
  #    must change nothing: a VALID `-e install_otel=true` still resolves, and the
  #    config revision is still computed (non-empty). Proves the counterexample is
  #    dead WITHOUT blanket-freezing extra-vars.
  - name: revision-pin-dead-name-is-inert
    kind: resolve_admission
    caller: resolve
    discriminates: C1-REVISION-INTERMEDIATE-EXTRAVAR-PIN (now removed; prove inert)
    predicted: GREEN
    invariant_task: "judge :: revision-pin-dead-name-is-inert"
    # cross-run discriminator: an inert dead-name pin must yield the SAME resolved
    # revision as the identical no-pin control -- if the old executable ref were
    # still live, pinning it would move the revision (the original bug).
    revision_equals: c1-eff-inputs-control
    pins:
      _lme_revision_resolved: {}   # dead name: no executable reference remains
      install_otel: true           # a VALID declared override that must still work
    assert:
      that:
        - "lme_resolved.install_otel == true"
        - "lme_resolved_revision is defined and (lme_resolved_revision | length) > 0"
      success_msg: "INERT: dead pin ignored; install_otel admitted={{ lme_resolved.install_otel }}; revision={{ lme_resolved_revision }}"
      fail_msg: "dead-name pin had an EFFECT or revision missing: install_otel={{ lme_resolved.install_otel }} revision={{ lme_resolved_revision | default('MISSING') }}"

  # ---------------------------------------------------------------------------
  # 2. A VALID declared extra-var override still flows through (no blanket freeze).
  #    Also the GREEN CONTROL for the conflict-coercion RED case (#5): it differs
  #    from #5 only by the pin type (valid bool here vs invalid int there).
  - name: valid-extra-var-override
    kind: resolve_admission
    caller: resolve
    discriminates: F1 -- valid declared override preserved (control for conflict-coercion)
    predicted: GREEN
    invariant_task: "judge :: valid-extra-var-override"
    pins:
      install_llm: false
    assert:
      that:
        - "lme_resolved.install_llm == false"
        - "lme_enable_flags.install_llm == false"
        - "lme_resolved_origins.install_llm == 'operator'"
      success_msg: "VALID override honoured: install_llm resolved={{ lme_resolved.install_llm }} origin={{ lme_resolved_origins.install_llm }}"
      fail_msg: "valid override dropped: install_llm={{ lme_resolved.install_llm }} enable={{ lme_enable_flags.install_llm }} origin={{ lme_resolved_origins.install_llm | default('MISSING') }}"

  # ---------------------------------------------------------------------------
  # 3. A VALID equivalent REPRESENTATION (string 'false' via -e) agrees with a
  #    caller-normalized false and still passes (codex: "Preserve valid equivalent
  #    representations"). String-false-vs-bool-false was the conflict-gate class
  #    fixed at c68691e; this asserts the fix did not over-reject.
  - name: typed-equivalent-string-false-agrees
    kind: resolve_admission
    caller: resolve
    discriminates: C1-CONFLICT-COERCION -- valid equivalent representation must still pass
    predicted: GREEN
    invariant_task: "judge :: typed-equivalent-string-false-agrees"
    base_inputs:
      selections:
        install_llm: false
    pins:
      install_llm: "false"     # STRING 'false' at -e; caller-normalized bool false agrees
    assert:
      that:
        - "lme_resolved.install_llm == false"
      success_msg: "typed-equivalent string 'false' agreed with caller false; resolved={{ lme_resolved.install_llm }}"
      fail_msg: "typed-equivalent over-rejected/mis-resolved: install_llm={{ lme_resolved.install_llm }}"

  # ---------------------------------------------------------------------------
  # 4. RED -- C1-DERIVED-EFFECTIVE-INPUTS-PIN (HIGH). `-e _lme_eff_inputs={}` with
  #    empty selections/observations/origins discards a declared selection WITHOUT
  #    a recomputation disagreement: resolve.yml line 124 set_fact is a no-op (the
  #    pin wins), and the read-back guard (line 212) recomputes from that SAME
  #    pinned object, so it agrees and passes. A concurrent bare `-e install_otel=
  #    true` stays true on the bare fact (extra-var beats the compat bridge) while
  #    canonical resolution sees default false -- the split-brain. This case
  #    asserts the CANONICAL artifact faithfully reflects the admitted input.
  - name: c1-eff-inputs-pin-discards-selection
    kind: resolve_admission
    caller: resolve
    discriminates: C1-DERIVED-EFFECTIVE-INPUTS-PIN
    predicted: RED
    control: c1-eff-inputs-control
    invariant_task: "judge :: c1-eff-inputs-pin-discards-selection"
    # Future-proof: a correct C1 fix may either (a) derive faithfully -> the judge
    # PASSes (GREEN), or (b) reject the pin fail-closed -> the include fails before
    # the judge with a msg matching fail_closed_cause (GREEN, REJECTED-as-expected).
    # Today it is RED (judge runs and fails). Keeps the case meaningful post-fix.
    expect:
      fail_closed_cause: "-e-pinned"
    pins:
      install_otel: true
      _lme_eff_inputs:
        selections: {}
        observations: {}
        origins: {}
    assert:
      that:
        - "lme_resolved.install_otel == true"
        - "lme_enable_flags.install_otel == install_otel"
        - "lme_resolved_origins.install_otel == 'operator'"
      success_msg: "FAITHFUL: install_otel admitted={{ lme_resolved.install_otel }} bare={{ install_otel }} origin={{ lme_resolved_origins.install_otel }}"
      fail_msg: "SPLIT-BRAIN: canonical install_otel={{ lme_resolved.install_otel }} enable={{ lme_enable_flags.install_otel }} origin={{ lme_resolved_origins.install_otel | default('default/MISSING') }} but bare -e install_otel={{ install_otel }} -- the pinned _lme_eff_inputs discarded the admitted selection and the read-back guard passed"

  # 4b. GREEN control for #4: identical, minus the _lme_eff_inputs pin.
  - name: c1-eff-inputs-control
    kind: resolve_admission
    caller: resolve
    discriminates: C1-DERIVED-EFFECTIVE-INPUTS-PIN (control -- no intermediate pin)
    predicted: GREEN
    invariant_task: "judge :: c1-eff-inputs-control"
    pins:
      install_otel: true
    assert:
      that:
        - "lme_resolved.install_otel == true"
        - "lme_enable_flags.install_otel == install_otel"
        - "lme_resolved_origins.install_otel == 'operator'"
      success_msg: "CONTROL OK: install_otel admitted={{ lme_resolved.install_otel }} origin={{ lme_resolved_origins.install_otel }}"
      fail_msg: "CONTROL BROKEN (harness): install_otel={{ lme_resolved.install_otel }} origin={{ lme_resolved_origins.install_otel | default('MISSING') }}"

  # ---------------------------------------------------------------------------
  # 5. RED -- C1-CONFLICT-COERCION-FAILURE-RAW-EQUALITY (HIGH). A bare `-e
  #    install_llm=0` (INTEGER) is captured as the operator selection; the caller
  #    also normalized install_llm=false. Strict declared-type coercion of int 0
  #    fails and the conflict gate falls back to raw operands, where Python 0 ==
  #    False raises NO conflict; combine() then replaces the malformed int with the
  #    caller false and final validation only ever sees a valid bool. So an
  #    INVALID-TYPED declared input is silently laundered instead of rejected at
  #    admission. This case EXPECTS a rejection; rc==0 (no rejection) is the RED.
  #    Control = valid-extra-var-override (#2), which differs only by the pin type.
  - name: c1-conflict-coercion-int0-not-rejected
    kind: resolve_admission
    caller: resolve
    discriminates: C1-CONFLICT-COERCION-FAILURE-RAW-EQUALITY
    predicted: RED
    control: c1-conflict-coercion-control
    invariant_task: "judge :: c1-conflict-coercion-int0-not-rejected (expect admission rejection)"
    # reject_cause is a REGEX ALTERNATION (the classifier uses `search`): a fixed
    # engine may reject at the conflict gate ("selection conflict") OR at the
    # resolver's declared-type gate ("enable flag must be true or false"). C1 should
    # confirm the exact fixed message. Today rc==0 (no rejection) => RED.
    expect:
      reject: true
      reject_cause: "selection conflict|enable flag must be true or false|non-canonical|invalid declared type"
    base_inputs:
      selections:
        install_llm: false
    pins:
      install_llm: 0     # INTEGER 0 for a declared bool field -- an invalid declared type
    assert:
      that:
        - "true"   # documenting judge: only runs when the engine did NOT reject
      success_msg: "NO-REJECTION (RED): invalid int-0 install_llm was laundered through admission; resolved={{ lme_resolved.install_llm }} origin={{ lme_resolved_origins.install_llm }} -- an invalid declared-type input reached a clean resolution instead of being rejected"

  # 5b. GREEN control for #5 -- differs from the int-0 case ONLY by the pin TYPE
  #     (bool false here vs int 0 there), with the SAME caller-normalized false. It
  #     exercises the conflict gate with two AGREEING valid representations and is
  #     accepted, isolating the RED to the invalid declared TYPE, not the presence
  #     of a caller selection.
  - name: c1-conflict-coercion-control
    kind: resolve_admission
    caller: resolve
    discriminates: C1-CONFLICT-COERCION-FAILURE-RAW-EQUALITY (control -- valid type, same conflict-gate path)
    predicted: GREEN
    invariant_task: "judge :: c1-conflict-coercion-control"
    base_inputs:
      selections:
        install_llm: false
    pins:
      install_llm: false   # BOOL false -- a valid declared type; agrees with the caller
    assert:
      that:
        - "lme_resolved.install_llm == false"
      success_msg: "CONTROL OK: valid bool false through the conflict gate; resolved={{ lme_resolved.install_llm }}"
      fail_msg: "CONTROL BROKEN (harness): install_llm={{ lme_resolved.install_llm }}"

  # 5c. Discriminating companion: the SAME invalid int-0 WITHOUT a caller selection.
  #     The resolver's declared-type gate correctly REJECTS it ("enable flag must be
  #     true or false"). This proves the #5 RED is caused SPECIFICALLY by the
  #     conflict-gate raw-equality fallback + combine() masking the int with the
  #     caller false BEFORE the resolver's type gate sees it -- not by resolver
  #     type-blindness. A precise pointer for C1.
  - name: c1-conflict-lone-int0-is-rejected
    kind: resolve_admission
    caller: resolve
    discriminates: C1-CONFLICT-COERCION-FAILURE-RAW-EQUALITY (isolate -- resolver DOES type-reject absent the conflict masking)
    predicted: GREEN
    invariant_task: "judge :: c1-conflict-lone-int0-is-rejected (expect declared-type rejection)"
    expect:
      reject: true
      reject_cause: "enable flag must be true or false"
    pins:
      install_llm: 0     # int-0 with NO caller selection -> resolver type gate rejects
    assert:
      that:
        - "true"
      success_msg: "unexpectedly reached judge -- lone int-0 was NOT rejected"

  # ---------------------------------------------------------------------------
  # 6. GREEN reject CONTROL -- proves the reject-classifier is not vacuous: an
  #    undeclared selection key is correctly REJECTED at admission by the pure
  #    resolver (undeclared-name gate), with the expected cause. If THIS is not
  #    REJECTED-as-expected, the reject-path of the harness is broken.
  - name: reject-undeclared-selection-key
    kind: resolve_admission
    caller: resolve
    discriminates: F1 -- admission rejects an undeclared selection (reject-classifier control)
    predicted: GREEN
    invariant_task: "judge :: reject-undeclared-selection-key (expect undeclared-name rejection)"
    expect:
      reject: true
      reject_cause: "selection names"
    base_inputs:
      selections:
        no_such_field_zzz: true
    assert:
      that:
        - "true"
      success_msg: "unexpectedly reached judge -- undeclared key was NOT rejected"
