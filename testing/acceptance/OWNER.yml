# testing/acceptance/OWNER.yml
#
# OWNER DECLARATION + REPRESENTATION CONTRACT for the LME real-caller ACCEPTANCE
# tier (swarm role G, session lme-02). This file is DATA (a value-pure YAML
# register); the human-readable rationale lives in these header comments, per the
# swarm full-declarative rule. The ONLY hand-authored non-YAML/non-Jinja file the
# swarm permits is ansible/roles/podman/filter_plugins/lme_manifests.py (C1's) --
# this tier authors NO Python and extends NO Python test file.
#
# WHAT THIS TIER IS
#   The independent ACCEPTANCE qualifier for the declarative resolution engine +
#   domain repairs, exercised through the ACTUAL Ansible caller path with
#   DISCRIMINATING negative cases. Every case drives the REAL shared caller
#   (ansible/roles/podman/tasks/resolve.yml OR load_manifests.yml), snapshotted
#   from the git HEAD blob, mutation-free (become:false, gather_facts:false,
#   connection:local; ACCEPT runs prove changed=0). Verdicts are read from the
#   Ansible JSON stdout callback (parsed task results + stats), NEVER from stdout
#   substring scraping, so a crash or a wrong-cause failure can never masquerade
#   as an expected outcome.
#
# HOW THIS DIFFERS FROM testing/tests/loader_integration (NOT a duplicate)
#   loader_integration (also G-owned) drives the same resolve.yml, but supplies
#   caller inputs ONLY via play `vars:` -- which sit BELOW extra-var precedence.
#   The codex C1 counterexamples (DERIVED-EFFECTIVE-INPUTS-PIN, PROJECTION-READBACK
#   -TRUSTS-PINNED-INTERMEDIATES, CONFLICT-COERCION) are all about a PRIVATE derived
#   intermediate being pinned at TRUE extra-var precedence (`-e _lme_eff_inputs={}`
#   etc.). loader_integration structurally cannot reach that layer. THIS tier's one
#   distinguishing capability: it materializes each case's hostile/valid pins to a
#   pins.yml and injects them with `ansible-playbook probe.yml -e @pins.yml` -- the
#   real extra-var channel. That is the whole reason this tier exists; it does not
#   re-run loader_integration's scenarios.
#
# NON-INTERFERENCE
#   loader_integration/** currently has live UNCOMMITTED peer edits (a concurrent
#   G-lane worker). This tier is a DISJOINT path and never reads, writes, renders
#   or imports anything under loader_integration/**. It never edits the shared
#   engine (resolve.yml / load_manifests.yml / validate_resolved_config.yml /
#   lme_manifests.py / global.yml -- C1's) or C's/D's role files; it EXERCISES them
#   through the real caller from an immutable HEAD snapshot and modifies nothing.

schema_version: 1
tier: acceptance
owner: G_acceptance
session: lme-02

represents:
  data: "*.yml case/registry/receipt files (behavior specification + evidence + traceability)"
  templates: "macros/*.j2 (Jinja) render the Ansible probe playbook per case"
  runner: "run_acceptance.yml + one_case_acceptance.yml (value-pure Ansible task YAML)"
  no_new_python: true
  no_embedded_programs: true   # no shell/python program body wrapped in a YAML scalar

exclusive_paths:
  - "testing/acceptance/**"

do_not_edit:
  - "testing/tests/loader_integration/**  (sibling G tier; live peer edits -- disjoint)"
  - "ansible/**, manifests/**  (product source owned by A/B/C/D/E; snapshotted read-only)"
  - "testing/tests/unit/**  (C1/D/B Python unit files; this tier authors no Python tests)"

evidence_policy:
  work_root: scratchpad          # per-run probes + full logs live in the session scratchpad
  committed: [mechanism, receipts/LATEST.yml]   # only the mechanism + a declared receipt is committed
  probe_mutation_free: true      # every ACCEPT probe asserts stats.changed == 0
  verdict_source: ansible_json_stdout_callback   # parsed, not substring-scraped

verdicts:
  # GREEN  = engine behaved correctly (accepted a valid input, or rejected an
  #          invalid one with the RIGHT cause).  PASS / REJECTED-as-expected.
  # RED    = an EARNED engine/domain gap: the named judge assertion failed on a
  #          run that has a GREEN control differing ONLY by the pin, OR a
  #          reject-expected case exited 0 (no rejection). A RED is never inferred
  #          from source alone (that is DECLARED), and never from a failure that
  #          landed anywhere but the judge / expected-cause.
  # BLOCKED = a declared case whose dependency (a D/C repair, or the joint
  #           guardian_cd_binding transition contract) has not landed; recorded
  #           RED-until, never faked as a pass.
  green: [PASS, REJECTED-as-expected]
  red: [RED]
  blocked: [BLOCKED]
  error: [ERROR-JSON, ERROR-MUTATION, ERROR-VACUOUS, ERROR-WRONG-CAUSE, ERROR-CONTROL, ERROR]
