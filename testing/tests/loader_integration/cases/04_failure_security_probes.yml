# testing/tests/loader_integration/cases/04_failure_security_probes.yml
#
# HOSTILE / FAILURE / SECURITY probes + the deferred explicit-zero/null/empty subcases
# for the LME resolved-config INTEGRATION acceptance tier. The acceptance matrix must
# NOT shrink: the false-like-distinct-from-absent subcases are retained here as QUEUED
# (they need C1 to declare fields whose schema gives 0/null/empty meaning, and D/E to
# declare those fields), not dropped.
#
# Security discipline (carried from prior OCR findings): acceptance means real
# DATA-FLOW, never mere agent check-in / green-install (the B2 false-success pattern);
# the resolved artifact + results.yml carry NO secret VALUES (synthetic fixtures only);
# the cluster leg stays a declared typed-obstruction, never a silent drop nor a false
# pass. Interrupted-recovery / same-deployment reconciliation need B + a lab VM and are
# SPEC'd here with their environment named.
#
# All contract-dependent; QUEUED until C1 (and named consumers) bind. No secret VALUES.

schema_version: 1
cases:
  - name: resolved-artifact-and-results-contain-no-secret-values
    kind: security_probe
    queued_on: [C1, C]
    environment: localhost
    expect:
      no_secret_values: true
    invariant_task: "no-secret-leak: the resolved artifact and results.yml contain field NAMES/identities and synthetic fixtures only, never a secret VALUE"
    fail_msg: "a secret value appeared in the resolved artifact or results evidence (secrets must stay out of committed + emitted evidence)"

  - name: consumer-rejects-stale-or-mismatched-revision-artifact
    kind: security_probe
    queued_on: [C1]
    environment: localhost
    expect:
      reject: true
    invariant_task: "stale-artifact reject: a consumer refuses a resolved artifact whose revision is stale/mismatched vs the current deployment resolution"
    fail_msg: "a consumer accepted a stale/mismatched-revision resolved artifact (broken lineage / snapshot reuse)"

  - name: runner-refuses-to-reuse-prior-run-evidence
    kind: security_probe
    queued_on: [C1]
    environment: localhost
    expect:
      reject: true
    invariant_task: "fresh-by-construction: an acceptance run refuses to overwrite or reuse a prior run's results evidence"
    fail_msg: "a run reused/overwrote a prior run's evidence identity (evidence must be preserved per HEAD+timestamp)"

  - name: acceptance-requires-data-flow-not-check-in
    kind: security_probe
    queued_on: [E, B]
    environment: lab VM
    expect:
      no_secret_values: true
    invariant_task: "data-flow-not-check-in: acceptance is judged on observed end-to-end data flow, never on agent check-in or a green install alone (OCR B2 false-success pattern)"
    fail_msg: "acceptance was declared on check-in/green-install without proving data flow (false success)"

  - name: cluster-leg-remains-typed-obstruction
    kind: security_probe
    queued_on: [B, E]
    environment: multi-node cluster
    expect:
      reject: true
    invariant_task: "cluster-leg: the cluster path stays a DECLARED typed-obstruction (explicit, adjudicated), not a silent drop and not a false pass"
    fail_msg: "the cluster leg was silently dropped or falsely passed instead of surfacing a typed obstruction"

  - name: explicit-zero-distinct-from-absent
    kind: precedence
    queued_on: [C1, D, E]
    environment: localhost
    inputs:
      extra_vars:
        _numeric_field_pending_schema: 0
    expect:
      resolved:
        _numeric_field_pending_schema: 0
    invariant_task: "explicit 0 retains its declared semantics and is NOT replaced by detection because it is false-like (field declared by D/E against the resolved schema)"
    fail_msg: "explicit zero was treated as absent and overwritten by detection/default"

  - name: explicit-null-distinct-from-absent
    kind: precedence
    queued_on: [C1, D, E]
    environment: localhost
    inputs:
      extra_vars:
        _nullable_field_pending_schema: null
    expect:
      resolved:
        _nullable_field_pending_schema: null
    invariant_task: "explicit null is distinct from absent and retains declared semantics (nullable field declared by D/E)"
    fail_msg: "explicit null was treated as absent and overwritten by detection/default"

  - name: explicit-empty-collection-distinct-from-absent
    kind: precedence
    queued_on: [C1, D, E]
    environment: localhost
    inputs:
      extra_vars:
        _list_field_pending_schema: []
    expect:
      resolved:
        _list_field_pending_schema: []
    invariant_task: "an explicit empty list/map is distinct from absent and retains declared semantics (collection field declared by D/E)"
    fail_msg: "an explicit empty collection was treated as absent and overwritten by detection/default"

  - name: interrupted-recovery-same-deployment-reconciliation
    kind: security_probe
    queued_on: [B]
    environment: lab VM
    expect:
      no_secret_values: true
    invariant_task: "interrupted-recovery: a re-resolution after an interrupted run reconciles to the SAME deployment's CURRENT declared inputs (no stale snapshot, no partial-state promotion)"
    fail_msg: "recovery promoted partial/stale state or resolved against a different deployment revision"
