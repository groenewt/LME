# testing/tests/loader_integration/cases/06_caller_negative_recovery.yml
#
# CALLER-NEGATIVE + interrupted-operation acceptance requirements routed to G by D and B
# (codex-check-0315 item 2b, codex-check-0330 items 1+2). These are LIFECYCLE negatives:
# a destructive/recovery caller must REFUSE on unsafe evidence, and an interrupted
# activation must be tracked + reconciled -- NOT silently skipped -- on rerun.
#
# None is engine-testable now: each needs D's rollback/restore playbooks (or B's agent
# activation path) plus a lab VM to interrupt/fault a real run. They are therefore QUEUED
# on their real owner(s) + a lab VM, fail-closed (codex-check-0015): a documented typed
# obstruction NEVER counts as a completed acceptance. Durability-model specifics
# (integrity manifest shape, restore content check) are pending D coordination -- authored
# here against the DOCUMENTED defect surface (M1 checks only backup dir existence/type;
# rollback can exit zero with required secrets absent).
#
# No secret VALUES appear here (identities + synthetic fault descriptions only).

schema_version: 1
cases:
  # --- B2 interrupted-operation regression (codex-0330 #1) -----------------------------
  - name: interrupted-augenrules-activation-reconciles-on-rerun
    kind: security_probe
    requires_contract: false
    queued_on: [B]
    environment: lab VM
    spec_only: true       # needs a lab VM to interrupt augenrules loading mid-run
    invariant_task: >-
      interrupted-activation: in ludus_lme_agents/tasks/elastic.yml:153-171, when the rules DOWNLOAD
      succeeds but augenrules LOADING fails/interrupts, the applied-vs-pending-activation state
      is tracked so that a rerun with the UNCHANGED download still RECONCILES (re-runs
      activation), never skips it as already-applied
    fail_msg: >-
      interrupted-activation REGRESSION: a rerun after a failed augenrules load skipped
      activation because the (unchanged) rules download reported 'ok'/changed=false -- the
      download's idempotency masked the un-activated state, leaving rules downloaded but not loaded

  # --- RECOVERY-INTEGRITY-QUALIFICATION negatives (codex-0315 #2b + codex-0330 #2, D+G) -
  - name: recovery-rejects-missing-stop-evidence
    kind: caller_negative
    requires_contract: false
    queued_on: [D]
    environment: lab VM
    spec_only: true
    invariant_task: "recovery-negative: the recovery/rollback path REFUSES to proceed when there is no evidence the services were stopped (no restore over a live/running deployment)"
    fail_msg: "recovery proceeded without stop evidence, risking a restore over a live deployment (M1 gap: existence/type check only)"

  - name: recovery-refuses-without-explicit-override
    kind: caller_negative
    requires_contract: false
    queued_on: [D]
    environment: lab VM
    spec_only: true
    invariant_task: "recovery-negative: a destructive rollback REFUSES (nonzero) unless the operator supplies the explicit override=true, i.e. it is not destructive-by-default"
    fail_msg: "rollback performed destructive actions without the explicit operator override (override=false must fail closed)"

  - name: rollback-does-not-destroy-on-unsafe-or-unverified-backup
    kind: caller_negative
    requires_contract: false
    queued_on: [D]
    environment: lab VM
    spec_only: true
    invariant_task: >-
      recovery-negative (M1 verify-before-destroy, D3b/1f7a317): the rollback VERIFIES backup
      integrity BEFORE destroying current state; an unsafe/unverified backup makes it REFUSE to
      destroy, so a failed verification never leaves the host with neither current nor restorable state
    fail_msg: "rollback destroyed current state before/without verifying the backup (M1 only checks the backup dir exists + is a dir), risking total loss on a bad backup"

  - name: recovery-rejects-failed-pre-destruction-integrity
    kind: caller_negative
    requires_contract: false
    queued_on: [D]
    environment: lab VM
    spec_only: true
    invariant_task: "recovery-negative: a FAILED pre-destruction integrity check (e.g. checksum/manifest mismatch on the backup) makes recovery REJECT rather than proceed"
    fail_msg: "recovery proceeded past a failed pre-destruction integrity check (integrity not gated -- existence/type only)"

  - name: recovery-rejects-bad-restore-exit-or-content
    kind: caller_negative
    requires_contract: false
    queued_on: [D]
    environment: lab VM
    spec_only: true
    invariant_task: "recovery-negative: a nonzero restore exit OR restored content that fails a content/shape check makes recovery REJECT (a bad restore is a typed failure, not a green rollback)"
    fail_msg: "recovery reported success on a bad restore (nonzero exit or content check failure) -- a false-success rollback"

  - name: rollback-refuses-zero-exit-with-required-secrets-absent
    kind: caller_negative
    requires_contract: false
    queued_on: [D, C]     # RECOVERY-MISSING-REQUIRED-SECRETS owners D+C (codex-0330)
    environment: lab VM
    spec_only: true
    invariant_task: >-
      recovery-negative (missing required secrets, rollback_lme.yml ~:503/:529/:543): required
      secrets DERIVED from the declared recovery contract must all be accounted for -- missing
      manifest payloads / missing legacy vault files / positional fallback create-failures must
      increment the failure count so rollback CANNOT exit zero with required secrets absent
    fail_msg: "rollback exited zero with required secrets absent (missing payloads/vault files/create-failures did not all increment SECRET_FAILURES) -- a silent broken recovery reported as success; preserve diagnostic evidence WITHOUT secret values"

  # NB: the CR-B4 es/cluster incidental-play-var flip-timing case (codex-0315 #4) was DEDUPED
  # out of this file -- it is the same input/expectation as
  # cases/01 `incidental-play-defaults-never-promoted-to-operator`, which now carries the
  # flip_timing block. Kept here as a pointer only, not a second case, to avoid a duplicate
  # verdict for one behavior.
