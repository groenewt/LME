# testing/tests/loader_integration/cases/03_extended_contract.yml
#
# INTEGRATION cases for Codex required_contract_test #7:
#   "the already required Tailscale reload, newly declared field, changed-input,
#    early-offline and missing-dependency tests remain required."
# Authored at the INTEGRATION tier (real entrypoint variable context + full profile
# composition), complementing C1's isolated loader unit suite -- NOT a duplicate.
#
# Grounding: codex-loader-regression-20260923-0100 finding #2 proved the stale-state +
# inventory-clobber pattern extends BEYOND the 5 enable flags to other profile vars
# written directly as host facts (tailscale_serve_* in manifests/profiles/tailscale.yml).
# Required proof: tailscale-to-default reset, inventory-false on an independent feature
# control, and a NEWLY DECLARED profile variable resolved WITHOUT adding its name to
# executable code.
#
# The C1 lme_resolved.* contract + its revision field are NOT landed at a3352b2
# (contract_binding.status == pending_c1_sitrep). Every case here is contract-dependent
# and is marked QUEUED by the runner until C1 binds. That is the correct fail-closed
# state (codex-check-0015: queue bookkeeping must never turn unresolved behavior into a
# passing gate). No secret VALUES appear here.

schema_version: 1
cases:
  - name: tailscale-to-default-resets-stale-serve-controls
    kind: profile_switch
    queued_on: [C1, C]
    entrypoints: [site]
    inputs:
      profile_switch_from: tailscale
      profile_switch_to: default
    expect:
      resolved:
        tailscale_serve_ingress: false
        tailscale_serve_egress: false
        tailscale_serve_services: false
    invariant_task: "tailscale->default: non-flag serve controls revert to their default (no stale host fact survives the switch)"
    fail_msg: "REGRESSED: a tailscale_serve_* control survived the switch to the default profile (stale host fact, finding #2)"

  - name: tailscale-inventory-false-on-independent-serve-control
    kind: precedence
    queued_on: [C1, C]
    entrypoints: [site]
    inputs:
      profile: tailscale
      inventory_vars:
        tailscale_serve_egress: false
    expect:
      resolved:
        tailscale_serve_egress: false
        tailscale_serve_ingress: true
    invariant_task: "tailscale: explicit inventory false on an independent serve control beats the profile's true"
    fail_msg: "REGRESSED: profile host fact clobbered an explicit inventory false on tailscale_serve_egress"

  - name: newly-declared-profile-field-resolves-without-code-change
    kind: newly_declared_field
    queued_on: [C1]
    entrypoints: [site]
    inputs:
      profile: tailscale
      profile_field_added:
        lme_new_declared_probe_field: profile_value
    expect:
      resolved:
        lme_new_declared_probe_field: profile_value
      origin:
        lme_new_declared_probe_field: profile
    invariant_task: "newly declared field: a field added only in profile/data resolves with correct precedence, no executable-code name added"
    fail_msg: "a newly declared profile field required a code change to resolve (the resolver still consults a fixed roster, not the declarations)"

  - name: changed-input-changes-resolved-revision
    kind: revision
    queued_on: [C1]
    entrypoints: [site]
    inputs:
      profile: default
      extra_vars:
        offline_mode: true
    expect:
      revision: "differs_from unchanged-input-keeps-resolved-revision"
    invariant_task: "changed input yields a NEW resolved revision (revision tracks the actual inputs)"
    fail_msg: "resolved revision did not change when an input changed (snapshot-once or a static revision)"

  - name: unchanged-input-keeps-resolved-revision
    kind: revision
    queued_on: [C1]
    entrypoints: [site]
    inputs:
      profile: default
    expect:
      # TWO resolutions of identical inputs within ONE probe run must produce the SAME
      # content-addressed revision (not a HEAD+timestamp id, which would differ per instant --
      # see claude-c1-resolver-milestone correction_2). Needs the probe handler's two-resolution
      # support (G_probe_handler); auto-marked QUEUED until then.
      revision: two_in_run_resolutions_agree
    invariant_task: "unchanged inputs: two resolutions in one run yield the SAME content-addressed resolved revision"
    fail_msg: "two resolutions of identical inputs produced DIFFERENT revisions (non-deterministic / timestamp-keyed revision)"

  - name: early-offline-resolved-before-first-mutation
    kind: preservation
    queued_on: [C1, B]
    entrypoints: [upgrade]
    inputs:
      markers:
        offline_marker: present
    expect:
      resolved:
        offline_mode: true
    invariant_task: "early-offline: offline_mode is resolved BEFORE the earliest upgrade consumer/mutation (not only at the include_role near line 742)"
    fail_msg: "an early upgrade consumer (upgrade_lme.yml:160/422/443/674) ran before offline was resolved through the contract"

  - name: missing-dependency-selector-boundary-rejects
    kind: boundary
    queued_on: [C1, D, E]
    entrypoints: [site]
    inputs:
      extra_vars:
        lme_telemetry_profile: otel-hertzbeat
    expect:
      reject: true
    invariant_task: "missing-dependency: an un-integrated telemetry/database selector makes the loader REJECT (nonzero) until D/E integrate the composition"
    fail_msg: "loader accepted an un-integrated selector instead of rejecting it (broken lineage / false success)"
