# testing/tests/loader_integration/cases/00_static_scan.yml
#
# SEAM-OWNED, RUNNABLE-NOW case (coordinator-authored, not a leaf file). A read-only
# structural lint of the four real entrypoints, run at the real HEAD. It is:
#   (1) the "before" evidence identity for contract test #8 -- it catalogues the
#       caller-composed detection-as-default params and flag/profile play-vars that
#       codex-loader-regression-20260923-0100 flagged, WITH the matching source lines;
#   (2) the proof that this tier's runner + representation actually execute.
#
# TWO expectations per target (see scan_target.yml) so this ONE case gates in BOTH modes:
#   expect_present -- the state at a3352b2 (the pre-fix baseline). mode=design gates on it.
#   accept_present -- the REQUIRED state after B/C/D/E migrate the entrypoint to the C1
#                     resolved-config contract. mode=acceptance gates on it. Declared
#                     `false` ONLY where codex-check-0200 / codex-loader-regression-0100
#                     unambiguously require the pattern REMOVED (the incidental play-var
#                     offline_mode:false and the detection-as-default `| default(marker)`
#                     compositions). Where absent, it defaults to expect_present.
#   evidence_only:true -- the exact post-migration spelling is C1/B's to pin (lme_profile
#                     resolution + the _render_* fact names), so we catalogue it as
#                     before-evidence but do NOT gate it in acceptance mode (still gated
#                     in design). This is deliberately NOT guessed -- it tightens to
#                     accept_present:false once C1/B publish the migrated spelling.
#
# Design-mode behavior: every target is checked against expect_present (self-proof).
# Acceptance-mode behavior: gated targets are checked against accept_present; when B/E
# have NOT yet removed a pattern, found=true vs accept_present=false -> FAIL (the real
# acceptance signal). evidence_only targets are recorded but not gated.

schema_version: 1
cases:
  - name: static-scan-caller-composed-defaults-at-head
    kind: static_scan
    requires_contract: false
    entrypoints: [elasticsearch, convert_to_cluster, upgrade, site]
    invariant_task: "static_scan: caller-composed defaults + flag play-vars catalogued at HEAD (before-evidence); acceptance gates on their required removal"
    fail_msg: "an entrypoint's caller-composed default/play-var state is not at its expected (before in design / after in acceptance) baseline; re-baseline and route acceptance to the contract-bound cases"
    targets:
      # E-owned: elasticsearch.yml play-var offline_mode:false (codex-check-0200 -> E removes/demotes below profile)
      - {entrypoint: elasticsearch, label: play-var-offline_mode-false, pattern: '^offline_mode:\s*false', expect_present: true, accept_present: false}
      # B-owned: convert_to_cluster.yml incidental play-var offline_mode:false (codex-check-0200 -> B removes)
      - {entrypoint: convert_to_cluster, label: play-var-offline_mode-false, pattern: '^offline_mode:\s*false', expect_present: true, accept_present: false}
      # B-owned: convert_to_cluster.yml hardcoded lme_profile:cluster -- post-migration spelling of
      # profile selection is C1/B's to pin (may become a contract selector, not a play var); NOT guessed.
      - {entrypoint: convert_to_cluster, label: task-var-lme_profile-cluster, pattern: '^lme_profile:\s*cluster', expect_present: true, evidence_only: true}
      # B-owned: upgrade_lme.yml detection-composed-as-default -- codex-loader-regression-0100 requires
      # these `| default(marker)` compositions removed (value moves to the declared preservation tier).
      - {entrypoint: upgrade, label: detection-as-default-elastic-pack, pattern: 'install_elastic_services\s*\|\s*default\(elastic_pack_quadlet', expect_present: true, accept_present: false}
      - {entrypoint: upgrade, label: detection-as-default-offline-marker, pattern: 'offline_mode\s*\|\s*default\(offline_marker', expect_present: true, accept_present: false}
      # B-owned: marker-derived lme_profile default -- lme_profile after-state (preserved fallback vs
      # dropped) is C1/B's to pin; NOT guessed (advisor: don't guess the lme_profile after-state).
      - {entrypoint: upgrade, label: marker-derived-lme_profile, pattern: 'lme_profile\s*\|\s*default\(', expect_present: true, evidence_only: true}
      # B-owned: caller-composed _render_* facts -- the post-migration fact names are C1/B's to pin; NOT guessed.
      - {entrypoint: upgrade, label: caller-composed-render-offline, pattern: '_render_offline_mode', expect_present: true, evidence_only: true}
      - {entrypoint: upgrade, label: caller-composed-render-profile, pattern: '_render_lme_profile', expect_present: true, evidence_only: true}
      # positive control: site.yml deliberately keeps enable flags OUT of play vars -- absent before AND
      # after (accept_present defaults to expect_present:false), so this stays gated in acceptance too.
      - {entrypoint: site, label: control-site-no-flag-play-var, pattern: '^offline_mode:\s*false', expect_present: false}
