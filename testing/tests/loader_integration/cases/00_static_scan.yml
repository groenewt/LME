# testing/tests/loader_integration/cases/00_static_scan.yml
#
# SEAM-OWNED, RUNNABLE-NOW case (coordinator-authored, not a leaf file). A read-only
# structural lint of the four real entrypoints, run at the real HEAD. It is:
#   (1) the "before" evidence identity for contract test #8 -- it catalogues the
#       caller-composed detection-as-default params and flag/profile play-vars that
#       codex-loader-regression-20260923-0100 flagged, WITH the matching source lines;
#   (2) the proof that this tier's runner + representation actually execute.
#
# expect_present:true documents a pattern that IS present at a3352b2 (the pre-fix
# state). When B/E migrate the entrypoints to the C1 resolved-config contract and
# remove these, this case FLIPS to FAIL -- an intended tripwire telling G to re-baseline
# and rely on the (by-then-unblocked) contract-bound cases in 01_*/02_*/03_* that assert
# the RESOLVED behavior. expect_present:false targets are positive controls proving the
# scan discriminates (site.yml already keeps flags out of play vars).

schema_version: 1
cases:
  - name: static-scan-caller-composed-defaults-at-head
    kind: static_scan
    requires_contract: false
    entrypoints: [elasticsearch, convert_to_cluster, upgrade, site]
    invariant_task: "static_scan: caller-composed defaults + flag play-vars catalogued at HEAD (before-evidence)"
    fail_msg: "an entrypoint's caller-composed default/play-var state changed vs the a3352b2 before-baseline; re-baseline and route acceptance to the contract-bound cases"
    targets:
      # E-owned: elasticsearch.yml play-var offline_mode:false (codex-check-0200 -> E removes)
      - {entrypoint: elasticsearch, label: play-var-offline_mode-false, pattern: '^offline_mode:\s*false', expect_present: true}
      # B-owned: convert_to_cluster.yml play-var offline_mode:false + hardcoded lme_profile:cluster
      - {entrypoint: convert_to_cluster, label: play-var-offline_mode-false, pattern: '^offline_mode:\s*false', expect_present: true}
      - {entrypoint: convert_to_cluster, label: task-var-lme_profile-cluster, pattern: '^lme_profile:\s*cluster', expect_present: true}
      # B-owned: upgrade_lme.yml detection-composed-as-default (install_*/offline/profile)
      - {entrypoint: upgrade, label: detection-as-default-elastic-pack, pattern: 'install_elastic_services\s*\|\s*default\(elastic_pack_quadlet', expect_present: true}
      - {entrypoint: upgrade, label: detection-as-default-offline-marker, pattern: 'offline_mode\s*\|\s*default\(offline_marker', expect_present: true}
      - {entrypoint: upgrade, label: marker-derived-lme_profile, pattern: 'lme_profile\s*\|\s*default\(', expect_present: true}
      - {entrypoint: upgrade, label: caller-composed-render-offline, pattern: '_render_offline_mode', expect_present: true}
      - {entrypoint: upgrade, label: caller-composed-render-profile, pattern: '_render_lme_profile', expect_present: true}
      # positive control: site.yml deliberately keeps enable flags OUT of play vars
      - {entrypoint: site, label: control-site-no-flag-play-var, pattern: '^offline_mode:\s*false', expect_present: false}
