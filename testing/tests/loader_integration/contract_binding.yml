# testing/tests/loader_integration/contract_binding.yml
#
# SINGLE SOURCE for every name this tier borrows from the C1 shared resolved-config
# contract. At HEAD a3352b2 that contract is NOT YET LANDED (only the internal
# _lme_resolved_flags fact exists in load_manifests.yml). We therefore DO NOT GUESS
# C1's public names. Every field below is `pending_c1_sitrep` until C1 publishes its
# schema + lme_resolved.* dict + versioned artifact; the coordinator then edits ONLY
# this file to `status: bound` and fills the actual names, and every resolution case
# becomes runnable without touching case data, macros or the runner.
#
# FAIL-CLOSED: while status != bound the runner marks every contract-dependent case
# QUEUED (never PASS, never SKIP). See run_integration.yml.

schema_version: 1
status: pending_c1_sitrep          # -> "bound" once C1 sitrep lands (SHA recorded below)
bound_c1_commit: null              # C1 shared-contract commit SHA (fill on bind)
bound_c1_sitrep: null              # channel message_id of the C1 sitrep (fill on bind)

# --- C1 public names this tier reads (ALL pending; do not invent) --------------
names:
  resolved_dict_var: null          # e.g. the top-level resolved-config fact name (C1 to declare)
  resolved_revision_field: null    # field carrying the per-resolution revision identity
  input_record_var: null           # the record of raw caller inputs + their ORIGIN
  origin_field: null               # per-field origin marker (extra_var|inventory|profile|preservation|default)
  enable_flags_field: null         # resolved enable-flags subtree (unit suite uses lme_enable_flags)
  services_field: null             # resolved service-membership collection (unit suite uses lme_services)
  artifact_path_template: null     # on-disk versioned OUTPUT-ONLY artifact path template

# --- Precedence + defaults are DECLARED by the contract (codex-check-0200) and are
# stable enough to encode now; the runner asserts the resolved values, keyed to the
# names above once bound. --------------------------------------------------------
declared_precedence_high_to_low:
  - explicit_extra_vars
  - explicit_inventory_or_host_vars
  - explicitly_selected_ordered_profile_overlays
  - declared_upgrade_preservation_fallback   # schema-permitted, observation-backed only
  - declared_global_defaults

enable_flags:
  keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]
  declared_defaults:
    install_llm: true
    install_elastic_services: false
    offline_mode: false
    install_otel: false
    install_legacy_beats: true

profiles: [default, offline, tailscale, cluster, consumer, multinode]

# Real deployment entrypoints this INTEGRATION tier binds to (codex-check-0200 keeps
# all direct entrypoints in scope, not just site.yml play 0).
entrypoints:
  site: ansible/site.yml
  upgrade: ansible/upgrade_lme.yml
  elasticsearch: ansible/elasticsearch.yml
  convert_to_cluster: ansible/convert_to_cluster.yml

# The three consumer tiers that must agree on ONE resolved revision (contract test #6).
consumer_gates:
  early_upgrade_gate:
    file: ansible/upgrade_lme.yml
    evidence_lines_at_a3352b2: [160, 161, 422, 443, 674, 738, 739, 746, 747, 748, 749]
  rendered_service_membership:
    file: ansible/roles/podman/tasks/render_units.yml
    evidence: "is_enabled() over resolved enable-flags -> lme_services membership"
  credential_certificate_gate:
    file: ansible/roles/podman/tasks/load_manifests.yml
    evidence: "Require resolved consumer secret and certificate bindings (consumer profile)"
