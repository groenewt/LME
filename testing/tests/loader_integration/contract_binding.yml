# contract. The loader now CALLS the resolver (cutover ba50994), but the FULL contract
# (caller migration + complete operational artifact + revision-over-complete-config +
# optional-value reset) is NOT yet landed, so we still DO NOT rely on the public names for
# the entrypoint probe. Every name field stays `pending_c1_sitrep` until the caller
# acceptance + resolve-only seam land; the coordinator then edits ONLY this file to
# `status: bound` and fills the actual names, and every resolution case becomes runnable
# without touching case data, macros or the runner.
#
# FAIL-CLOSED: while status != bound the runner marks every contract-dependent case
# QUEUED (never PASS, never SKIP). See run_integration.yml. NOTE (requalification,
# reconcile-codex0345-0400): the cutover confirms ONLY that the production loader calls the
# resolver + shared validation (+ non-mapping/type rejection). G's probes are FILTER-BEHAVIOR
# evidence (the engine leg), kept DISTINCT from full loader/caller acceptance (the entrypoint leg).

schema_version: 1
status: pending_c1_sitrep          # -> "bound" only after CALLER MIGRATION + resolve-only seam + complete artifact land (cutover alone is not enough)
bound_c1_commit: null              # the caller-acceptance/bind commit SHA (fill on bind); NOT the engine milestone nor the cutover alone
bound_c1_sitrep: null              # channel message_id of the C1 bind sitrep (fill on bind)

# C1 milestone state. The pure ENGINE landed + its codex-0245 audit (A1-A5) CLOSED at 8ceb297,
# and the LOADER CUTOVER has now LANDED: load_manifests.yml:76 `include_tasks: resolve.yml`
# resolves via lme_resolve_config (declared precedence) and validates via
# validate_resolved_config.yml (fail-closed), publishing lme_resolved / _origins /
# lme_enable_flags + a config-only revision + a bare-name bridge (ba50994; resolve.yml extracted
# at 1106765; revision made config-ALONE, origins DROPPED, at 63b2658; the 2 resolver findings
# closed at 6534821). Render-neutral: C1 reports 5/5 profile byte-parity vs pre-swarm goldens.
# At the worktree HEAD the 3 non-site entrypoints (upgrade/elasticsearch/convert_to_cluster) are
# byte-identical to a3352b2; site.yml has a COMMENT-ONLY delta (the cutover doc note) -- verified
# via `git diff a3352b2 HEAD -- <entrypoint>` (site.yml changed lines are all comments/blank).
# STILL OPEN (requalification reconcile-codex0345-0400, NOT closed by the cutover): caller
# migration; the once-only capture + bare bridge; optional-value reset (a LIVE tailscale
# profile-switch regression, load_manifests.yml:174-179 + tailscale_service.yml:636); the global
# pre-mutation barrier; ordered overlays + truthful explicit-vs-inferred origins; the complete
# operational artifact + revision-over-COMPLETE-config. Binding waits on caller acceptance, not the engine.
c1_milestone_landed:
  # registry_schema: the lme_config_registry IS materialised in the worktree at HEAD --
  # manifests/global.yml lines 221-262 (VERIFIED by loading it: precedence, channels,
  # origin_vocabulary and the 12 field declarations are all present). The real-registry
  # engine case (cases/05) loads THIS file and resolves against it, so the shape is not
  # assumed -- it is exercised.
  registry_schema: {commit: 2eb54c3, name: lme_config_registry, locus: "manifests/global.yml lines 221-262 (materialised + loaded by the real-registry engine case)"}
  resolver_engine: {commit: 0058948, filters: [lme_resolve_config, lme_validate_config, lme_config_revision, lme_known_enable_flags], locus: "ansible/roles/podman/filter_plugins/lme_manifests.py", resolver_sha256_at_0058948: 784a5cabb79f8450bee46f3b09e5da22326d767e7f5d66a2681c3fd91906b37b}
  resolver_audit_closed: {commit: 8ceb297, items: [A1_failclosed_validate, A2_effective_precedence, A3_canonical_validation, A5_honest_origins, extended_types], resolver_sha256_now: ddb92eaea08dd82839e59188d9f527d2d0a17a077ca80136292b004c9adc4614}
  # emitted origin tokens VERIFIED two ways: (a) the resolver's _honest_origin at 8ceb297,
  # and (b) the SHIPPED registry's declared origin_vocabulary at manifests/global.yml:246 =
  # [extra_var, inventory, operator, profile, observation, default]. So `operator` + the finer
  # `extra_var`/`inventory` are BOTH declared -- the finer-verified-origin engine case (which
  # preserves a caller-verified `inventory`) is valid against the REAL registry, not only the
  # synthetic mirror.
  emitted_origin_tokens_at_8ceb297: [operator, profile, observation, default]   # combined-operator + tier names
  real_registry_origin_vocabulary: [extra_var, inventory, operator, profile, observation, default]   # manifests/global.yml:246
  loader_cutover_landed: {cutover: ba50994, resolve_extracted: 1106765, revision_config_only: 63b2658, resolver_findings_closed: 6534821, locus: "load_manifests.yml:76 include_tasks resolve.yml -> lme_resolve_config + validate_resolved_config.yml; publishes lme_resolved/_origins/lme_enable_flags + config-only revision + bare bridge", render_neutral: "5/5 profile byte-parity vs pre-swarm goldens (per C1)"}
  # STILL OPEN after the cutover (requalification reconcile-codex0345-0400) -- these gate BINDING,
  # not the cutover; the entrypoint leg stays QUEUED on them + the G resolve-only seam:
  NOT_landed: [caller_migration, capture_and_bare_bridge_removal, optional_value_reset_tailscale_profile_switch, global_pre_mutation_barrier, ordered_overlays_truthful_origins, complete_operational_artifact, revision_over_complete_config]

