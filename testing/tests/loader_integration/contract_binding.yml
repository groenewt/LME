  resolve_filter: lme_resolve_config                # CONFIRMED landed (0058948)
  validate_filter: lme_validate_config              # CONFIRMED landed (0058948); signature bug closed at 8ceb297 (A1)
  resolved_dict_var: null                           # PUBLISHED as "lme_resolved" at cutover (ba50994); still null here = UNCONFIRMED for the entrypoint probe until bind
  resolved_revision_field: null                     # PUBLISHED (config-ONLY revision, 63b2658); revision-over-COMPLETE-config still OPEN, so unbound here
  input_record_var: null                            # origins PUBLISHED as "_origins" at cutover; truthful explicit-vs-inferred origin composition still OPEN (unbound)
  origin_field: null                                # per-field origin; codex-0245 C1-ORIGIN-VALIDATION open
  enable_flags_field: null                          # resolved enable-flags subtree (unit suite uses lme_enable_flags)
  services_field: null                              # resolved service-membership (unit suite uses lme_services); probe.j2 reads names.services_field
  artifact_path_template: null                      # versioned OUTPUT-ONLY artifact (RC-OPEN-7; content-addressed)

# Origin vocabulary, RULED by codex-manager-input-artifact-rulings-20260923-0245 (Q2) and
# RECONCILED to the resolver's actual emitted tokens at 8ceb297 (A5 _honest_origin closed).
# The ruling: extra-var and inventory/host_var are ONE explicit-operator tier selected by NATIVE
# Ansible precedence (extra-var beats inventory); the resolver must NOT re-implement a second
# variable engine, and a native-selected/merged value WITHOUT finer provenance must NOT be falsely
# labelled extra_var or inventory -- record the honest COMBINED label. The resolver implements
# that combined label as the literal token `operator` (_COMBINED_OPERATOR), NOT `explicit_operator`
# (my earlier coinage), and labels observation-backed / marker / upgrade-preservation-fallback
# values `observation` (the tier name), NOT `preservation`. So the tokens THIS tier asserts are:
#   origin values = operator | profile | observation | default
#   where `operator` is the native-Ansible-combined tier; extra_var / inventory are finer sub-labels
#   ONLY when the loader genuinely exposes a single non-merged caller-verified source. Value-precedence
#   (extra-var>inventory, operator>observation) is still asserted in BOTH directions via real -e/-i.
# CONFIRMED against the SHIPPED registry: manifests/global.yml:246 declares
# origin_vocabulary: [extra_var, inventory, operator, profile, observation, default] -- the
# SAME token set as (values + finer_when_exposed) below. So this reconciliation already holds
# against the real registry, not just the resolver; no divergence to reconcile at cutover.
# (fail-closed: were a token to mismatch at bind, it fails, never a false pass).
origin_vocabulary:
  ruled_by: codex-manager-input-artifact-rulings-20260923-0245
  reconciled_to_resolver: 8ceb297
  confirmed_against_shipped_registry: "manifests/global.yml:246"
  values: [operator, profile, observation, default]
  finer_when_exposed: [extra_var, inventory]

# Probe-handler capability of THIS tier's runner (G-owned; independent of C1). TWO legs:
#   engine_leg  -- READY NOW (codex-0315/0330): engine_probe.yml.j2 invokes the REAL resolver
#                  filters (lme_resolve_config/lme_validate_config) via ansible-playbook Jinja
#                  against an immutable per-run resolver copy (sha256-banked). kind:engine_regression
#                  cases RUN now (cases/05); they need NO C1 loader cutover. See engine_leg below.
#   entrypoint_leg (this `status`) -- the CONTRACT-bound integration probe (real -e/-i through
#                  site/upgrade/elasticsearch/convert_to_cluster via a resolve-only seam). Still
#                  NOT ready. Until it is, the runner marks CONTRACT cases QUEUED on G_probe_handler
#                  even after C1 binds, so no contract case can false-pass. A running engine leg
#                  NEVER satisfies an entrypoint/caller leg (a typed obstruction is not an acceptance).
engine_leg:
  status: ready
  built: [engine_probe.yml.j2, "cases/05_engine_regressions.yml", "run_integration.yml resolver copy+sha256"]
  invokes: [lme_resolve_config, lme_validate_config, lme_config_revision, lme_known_enable_flags]
  cases: 12
  proves: [reversed-pipe-fail-closed_A1, reordered-precedence_A2, extended-types, origin-rejection_A5,
           finer-verified-origin_A5, optional-nonmapping, unknown-nullable-type,
           real-registry-defaults+validate-roundtrip+enable-flag-drift, revision-deterministic, revision-sensitive]
  raises_are_reason_checked: true   # every raises:true case ALSO asserts a raises_match substring in the error
  mutation_verified: "6 guard mutations (no-fields/non-mapping/unsupported-type/precedence/honest-origin/enable-flag-drift) each flip their target case RED; baselines PASS -- so no case is fail-open (M1 in particular: a DIFFERENT error no longer passes the reversed-pipe case)"
  provenance: "immutable per-run copy at runs/<run_id>/_engine/filter_plugins; engine_resolver_sha256 banked in results.yml"
probe_handler:
  status: not_ready                 # the ENTRYPOINT leg (see above); engine leg is separate + ready
  supported_input_keys: []          # extra_vars-as-play-vars is the WRONG layer (must be -e); no entrypoint seam yet
  supported_expect_keys: []         # resolved/origin renderable but unverified; revision/gates_agree/reject/no_secret_values NOT rendered at entrypoint scope
  supported_environments: [localhost]
  debt_owner: G_acceptance
  # C1 cutover contract change (claude-C1-cutover-milestone-20260923): the full-loader probe's
  # isolated_source copy-set MUST include BOTH extracted task files the loader now include_tasks:
  #   ansible/roles/podman/tasks/resolve.yml               (CR-B3 extracted early-resolve entrypoint)
  #   ansible/roles/podman/tasks/validate_resolved_config.yml (shared fail-closed validator)
  # or the isolated loader copy will fail to find its included task files. Record here so the
  # entrypoint-leg build (below) copies them; C1 already applied this to the scratch cases.yml.
  full_loader_isolated_source_must_include:
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/validate_resolved_config.yml
  todo: "isolated sha256-verified source copy (INCLUDING resolve.yml + validate_resolved_config.yml per C1 cutover); -e extra-vars + -i inventory + host_vars + markers layering; ordered profile overlays + profile_switch; real entrypoint invocation via a RESOLVE-ONLY seam (upgrade_lme.yml/convert_to_cluster.yml are become:yes and touch live host paths -- the probe must exercise resolution WITHOUT the mutating tasks, e.g. a C1/B-provided resolve-only tag/seam), not just load_manifests; render revision/gates_agree/reject/no_secret_values asserts; zero-assertion render == ERROR"
  marker_path_policy: "marker fixtures (installed_pack_quadlet, offline_marker, ...) are created and read ONLY inside the isolated per-case work dir under a REMAPPED marker root -- NEVER the live host marker locations (e.g. /opt/lme/* paths). The probe must not stat, read or write any live host path; the resolve-only seam must accept an overridable marker root so detection runs entirely in the sandbox."

# --- Precedence + defaults are DECLARED by the contract (codex-check-0200) and are
# stable enough to encode now; the runner asserts the resolved values, keyed to the
# names above once bound. --------------------------------------------------------
declared_precedence_high_to_low:
  - explicit_extra_vars
  - explicit_inventory_or_host_vars
  - explicitly_selected_ordered_profile_overlays
  - declared_upgrade_preservation_fallback   # schema-permitted, observation-backed only
  - declared_global_defaults

enable_flags:
  keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]
  declared_defaults:
    install_llm: true
    install_elastic_services: false
    offline_mode: false
    install_otel: false
    install_legacy_beats: true

profiles: [default, offline, tailscale, cluster, consumer, multinode]

# Real deployment entrypoints this INTEGRATION tier binds to (codex-check-0200 keeps
# all direct entrypoints in scope, not just site.yml play 0).
entrypoints:
  site: ansible/site.yml
  upgrade: ansible/upgrade_lme.yml
  elasticsearch: ansible/elasticsearch.yml
  convert_to_cluster: ansible/convert_to_cluster.yml

