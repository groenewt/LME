# testing/tests/loader_integration/contract_binding.yml
#
# SINGLE SOURCE for every name this tier borrows from the C1 shared resolved-config
# contract. At HEAD a3352b2 that contract is NOT YET LANDED (only the internal
# _lme_resolved_flags fact exists in load_manifests.yml). We therefore DO NOT GUESS
# C1's public names. Every field below is `pending_c1_sitrep` until C1 publishes its
# schema + lme_resolved.* dict + versioned artifact; the coordinator then edits ONLY
# this file to `status: bound` and fills the actual names, and every resolution case
# becomes runnable without touching case data, macros or the runner.
#
# FAIL-CLOSED: while status != bound the runner marks every contract-dependent case
# QUEUED (never PASS, never SKIP). See run_integration.yml.

schema_version: 1
status: pending_c1_sitrep          # -> "bound" only after the LOADER CUTOVER + artifact + consumer migration land
bound_c1_commit: null              # the loader-cutover commit SHA (fill on bind); NOT the engine milestone
bound_c1_sitrep: null              # channel message_id of the C1 loader-cutover sitrep (fill on bind)

# C1 milestone state (channel: claude-c1-resolver-milestone-20260923-0246; codex-resolver-audit-0245).
# The pure ENGINE has landed AND its codex-0245 audit (A1-A5) is CLOSED at 8ceb297. What is STILL
# NOT landed: the loader CUTOVER, versioned artifact, content-addressed revision and consumer
# migration -- the live loader is STILL a3352b2 (self-capture load_manifests.yml:164-169 + guard
# :146 still shipping; the 4 entrypoints are byte-identical to a3352b2, verified at run HEAD via
# `git diff --stat a3352b2 HEAD -- <entrypoints>` = empty). The HIGH engine defects codex-0245
# flagged (reversed lme_validate_config signature; precedence never read; type coverage bool|str
# only; origin labels echoed unvalidated) are the A1-A5 that 8ceb297 closed. Binding therefore
# still waits on the CUTOVER sitrep, not the engine.
c1_milestone_landed:
  registry_schema: {commit: 2eb54c3, name: lme_config_registry, locus: "manifests/global.yml (~line 228); NB registry data NOT materialised in worktree at HEAD"}
  resolver_engine: {commit: 0058948, filters: [lme_resolve_config, lme_validate_config], locus: "ansible/roles/podman/filter_plugins/lme_manifests.py", resolver_sha256_at_0058948: 784a5cabb79f8450bee46f3b09e5da22326d767e7f5d66a2681c3fd91906b37b}
  resolver_audit_closed: {commit: 8ceb297, items: [A1_failclosed_validate, A2_effective_precedence, A3_canonical_validation, A5_honest_origins, extended_types], resolver_sha256_now: ddb92eaea08dd82839e59188d9f527d2d0a17a077ca80136292b004c9adc4614}
  emitted_origin_tokens_at_8ceb297: [operator, profile, observation, default]   # _honest_origin: vocab = precedence tiers + _COMBINED_OPERATOR('operator'); finer extra_var|inventory only when caller-verified
  NOT_landed: [loader_cutover, versioned_output_artifact, content_addressed_revision, consumer_migration]

# --- C1 public names this tier reads. Registry + engine CONFIRMED; the resolved-dict / revision /
# origin names are ANTICIPATED from the observed UNCOMMITTED loader and stay UNCONFIRMED (do not
# rely on them) until the cutover commits. -------------------------------------------------------
names:
  registry_var: lme_config_registry                 # CONFIRMED landed (2eb54c3)
  resolve_filter: lme_resolve_config                # CONFIRMED landed (0058948)
  validate_filter: lme_validate_config              # CONFIRMED landed (0058948); NB codex-0245 C1-VALIDATE-CALL signature bug
  resolved_dict_var: null                           # ANTICIPATED "lme_resolved" (codex-0245:35 observed uncommitted loader); UNCONFIRMED until cutover
  resolved_revision_field: null                     # content-addressed revision (per correction_2); not implemented (RC-OPEN-7)
  input_record_var: null                            # raw caller inputs + ORIGIN; loader-side split pending (RC-OPEN-8)
  origin_field: null                                # per-field origin; codex-0245 C1-ORIGIN-VALIDATION open
  enable_flags_field: null                          # resolved enable-flags subtree (unit suite uses lme_enable_flags)
  services_field: null                              # resolved service-membership (unit suite uses lme_services); probe.j2 reads names.services_field
  artifact_path_template: null                      # versioned OUTPUT-ONLY artifact (RC-OPEN-7; content-addressed)

# Origin vocabulary, RULED by codex-manager-input-artifact-rulings-20260923-0245 (Q2) and
# RECONCILED to the resolver's actual emitted tokens at 8ceb297 (A5 _honest_origin closed).
# The ruling: extra-var and inventory/host_var are ONE explicit-operator tier selected by NATIVE
# Ansible precedence (extra-var beats inventory); the resolver must NOT re-implement a second
# variable engine, and a native-selected/merged value WITHOUT finer provenance must NOT be falsely
# labelled extra_var or inventory -- record the honest COMBINED label. The resolver implements
# that combined label as the literal token `operator` (_COMBINED_OPERATOR), NOT `explicit_operator`
# (my earlier coinage), and labels observation-backed / marker / upgrade-preservation-fallback
# values `observation` (the tier name), NOT `preservation`. So the tokens THIS tier asserts are:
#   origin values = operator | profile | observation | default
#   where `operator` is the native-Ansible-combined tier; extra_var / inventory are finer sub-labels
#   ONLY when the loader genuinely exposes a single non-merged caller-verified source. Value-precedence
#   (extra-var>inventory, operator>observation) is still asserted in BOTH directions via real -e/-i.
# If the registry's DECLARED origin_vocabulary at cutover differs, the coordinator reconciles here
# (fail-closed: a token mismatch fails at bind, never a false pass).
origin_vocabulary:
  ruled_by: codex-manager-input-artifact-rulings-20260923-0245
  reconciled_to_resolver: 8ceb297
  values: [operator, profile, observation, default]
  finer_when_exposed: [extra_var, inventory]

# Probe-handler capability of THIS tier's runner (G-owned; independent of C1). TWO legs:
#   engine_leg  -- READY NOW (codex-0315/0330): engine_probe.yml.j2 invokes the REAL resolver
#                  filters (lme_resolve_config/lme_validate_config) via ansible-playbook Jinja
#                  against an immutable per-run resolver copy (sha256-banked). kind:engine_regression
#                  cases RUN now (cases/05); they need NO C1 loader cutover. See engine_leg below.
#   entrypoint_leg (this `status`) -- the CONTRACT-bound integration probe (real -e/-i through
#                  site/upgrade/elasticsearch/convert_to_cluster via a resolve-only seam). Still
#                  NOT ready. Until it is, the runner marks CONTRACT cases QUEUED on G_probe_handler
#                  even after C1 binds, so no contract case can false-pass. A running engine leg
#                  NEVER satisfies an entrypoint/caller leg (a typed obstruction is not an acceptance).
engine_leg:
  status: ready
  built: [engine_probe.yml.j2, "cases/05_engine_regressions.yml", "run_integration.yml resolver copy+sha256"]
  invokes: [lme_resolve_config, lme_validate_config]
  proves: [reversed-pipe-fail-closed_A1, reordered-precedence_A2, extended-types, origin-rejection_A5, optional-nonmapping, unknown-nullable-type]
  provenance: "immutable per-run copy at runs/<run_id>/_engine/filter_plugins; engine_resolver_sha256 banked in results.yml"
probe_handler:
  status: not_ready                 # the ENTRYPOINT leg (see above); engine leg is separate + ready
  supported_input_keys: []          # extra_vars-as-play-vars is the WRONG layer (must be -e); no entrypoint seam yet
  supported_expect_keys: []         # resolved/origin renderable but unverified; revision/gates_agree/reject/no_secret_values NOT rendered at entrypoint scope
  supported_environments: [localhost]
  debt_owner: G_acceptance
  todo: "isolated sha256-verified source copy; -e extra-vars + -i inventory + host_vars + markers layering; ordered profile overlays + profile_switch; real entrypoint invocation via a RESOLVE-ONLY seam (upgrade_lme.yml/convert_to_cluster.yml are become:yes and touch live host paths -- the probe must exercise resolution WITHOUT the mutating tasks, e.g. a C1/B-provided resolve-only tag/seam), not just load_manifests; render revision/gates_agree/reject/no_secret_values asserts; zero-assertion render == ERROR"
  marker_path_policy: "marker fixtures (installed_pack_quadlet, offline_marker, ...) are created and read ONLY inside the isolated per-case work dir under a REMAPPED marker root -- NEVER the live host marker locations (e.g. /opt/lme/* paths). The probe must not stat, read or write any live host path; the resolve-only seam must accept an overridable marker root so detection runs entirely in the sandbox."

# --- Precedence + defaults are DECLARED by the contract (codex-check-0200) and are
# stable enough to encode now; the runner asserts the resolved values, keyed to the
# names above once bound. --------------------------------------------------------
declared_precedence_high_to_low:
  - explicit_extra_vars
  - explicit_inventory_or_host_vars
  - explicitly_selected_ordered_profile_overlays
  - declared_upgrade_preservation_fallback   # schema-permitted, observation-backed only
  - declared_global_defaults

enable_flags:
  keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]
  declared_defaults:
    install_llm: true
    install_elastic_services: false
    offline_mode: false
    install_otel: false
    install_legacy_beats: true

profiles: [default, offline, tailscale, cluster, consumer, multinode]

# Real deployment entrypoints this INTEGRATION tier binds to (codex-check-0200 keeps
# all direct entrypoints in scope, not just site.yml play 0).
entrypoints:
  site: ansible/site.yml
  upgrade: ansible/upgrade_lme.yml
  elasticsearch: ansible/elasticsearch.yml
  convert_to_cluster: ansible/convert_to_cluster.yml

# The three consumer tiers that must agree on ONE resolved revision (contract test #6).
consumer_gates:
  early_upgrade_gate:
    file: ansible/upgrade_lme.yml
    evidence_lines_at_a3352b2: [160, 161, 422, 443, 674, 738, 739, 746, 747, 748, 749]
  rendered_service_membership:
    file: ansible/roles/podman/tasks/render_units.yml
    evidence: "is_enabled() over resolved enable-flags -> lme_services membership"
  credential_certificate_gate:
    file: ansible/roles/podman/tasks/load_manifests.yml
    evidence: "Require resolved consumer secret and certificate bindings (consumer profile)"
