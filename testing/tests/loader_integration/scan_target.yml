---
# testing/tests/loader_integration/scan_target.yml
# One static_scan target = one regex over one entrypoint's pre-slurped lines.
# `target` is the loop var; `case` is in scope. Appends one finding to scan_findings.
#
# A target with expect_present:true asserts the pattern IS present at this HEAD
# (before-evidence: caller-composed default / play-var still there). When B/E remove
# it, `found` flips to false and `ok` flips to false -> the case FAILs, which is the
# acceptance signal that the play-default was removed. expect_present:false asserts a
# forbidden pattern is already absent.
- name: "scan {{ target.entrypoint }} :: {{ target.label }}"
  ansible.builtin.set_fact:
    _match_lines: "{{ (entrypoint_lines[target.entrypoint] | default([])) | map('trim') | select('search', target.pattern) | list }}"

- name: "record finding {{ target.entrypoint }} :: {{ target.label }}"
  ansible.builtin.set_fact:
    scan_findings: >-
      {{ scan_findings + [ {
           'case': case.name,
           'entrypoint': target.entrypoint,
           'label': target.label,
           'pattern': target.pattern,
           'expect_present': target.expect_present,
           'found': ((_match_lines | length) > 0),
           'match_count': (_match_lines | length),
           'sample': (_match_lines[:4]),
           'ok': (((_match_lines | length) > 0) == target.expect_present)
         } ] }}
