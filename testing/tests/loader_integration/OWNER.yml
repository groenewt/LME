# testing/tests/loader_integration/OWNER.yml
#
# OWNER DECLARATION + REPRESENTATION CONTRACT for the LME resolved-config
# INTEGRATION acceptance tier. This is DATA (a value-pure YAML register); the
# human-readable rationale lives in these header comments, per the swarm's
# full-declarative rule (no proactive *.md; the only hand-authored non-YAML/Jinja
# allowance is ansible/roles/podman/filter_plugins/lme_manifests.py).
#
# WHY THIS TIER EXISTS
#   codex-check-0015 admits testing/tests/loader_integration as a SEPARATELY
#   reported real-Ansible tier. It is the INTEGRATION complement to C1's ISOLATED
#   loader unit tests:
#     - C1 loader-tests (.superpowers/sdd/2026-09-22-observability-implementation/
#       loader-tests/**) resolve ONE dict in an isolated source copy and check
#       single-dict invariants. C1 OWNS those; this tier does NOT edit or duplicate
#       them.
#     - THIS tier exercises the resolved-config contract through the ACTUAL
#       DEPLOYMENT ENTRYPOINTS with the real variable context, and proves the ONE
#       resolved authority is read identically by early upgrade gates, rendered
#       service membership and later credential/certificate gates (the exact gap
#       codex-loader-regression-20260923-0100 proved the isolated probe cannot see:
#       site/play defaults captured as operator overrides).
#
# NON-DUPLICATION IS AUDITABLE
#   acceptance-requirements.yml maps every codex-check-0200 required_contract_test
#   to (a) the C1 unit-level case that covers it, (b) the integration case here,
#   (c) the entrypoint(s) it binds. Overlapping behavior names (inventory-override,
#   profile-switch) are INTENTIONAL: same behavior, different tier (unit vs
#   integration). The mapping makes that explicit so it is not read as a dupe.

schema_version: 1
tier: loader_integration
owner: G_acceptance
bound_to_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7

represents:
  # Full-declarative representation contract for every file in this tier.
  data: "*.yml case/registry files (behavior specification + evidence + traceability)"
  templates: "macros/*.j2 (Jinja) render the Ansible probe playbooks"
  runner: "run_integration.yml + one_case.yml (value-pure Ansible task YAML; no hand-authored Python)"
  no_new_python: true

exclusive_paths:
  - "testing/tests/loader_integration/**"

preserved_exceptions_not_g_owned:
  # G owns testing/* MINUS these carve-outs (per ownership-map-amendment
  # rule_table + codex-check-0000/0015/0030/0045). None live under this subtree,
  # so this tier never touches them; recorded here so a future promotion does not
  # clobber them.
  - path: testing/tests/unit/test_lme_manifests.py
    owner: A_C1
    reason: "named C1 filter-test; C1 retains ownership (check-0030)"
  - path: testing/e2e/deploy_gate.sh
    owner: B_lifecycle
    reason: "B deploy-gate exception (check-0000/0045)"
  - path: testing/tests/unit/test_deploy_gate.py
    owner: B_lifecycle
    reason: "B deploy-gate exception (unit)"

do_not_edit:
  # Sibling-swarm scopes this tier must never write.
  - ".superpowers/sdd/2026-09-22-observability-implementation/loader-tests/**  (C1 isolated loader unit suite)"
  - "ansible/**, manifests/**  (product source owned by A/B/C/D/E)"
  - ".gitignore (root)  (F provenance)"

gate_policy:
  # codex-check-0015: xfail bookkeeping CANNOT turn required unresolved behavior
  # into a passing overall gate. This tier's runner is fail-closed:
  #   - a case that requires the (not-yet-landed) C1 resolved-config contract
  #     resolves to QUEUED, never PASS and never SKIP;
  #   - QUEUED is always visible in results and in the overall gate summary;
  #   - the acceptance gate is GREEN only when zero cases are QUEUED and every
  #     case is at its expected verdict.
  runnable_now: [static_scan]
  fail_closed_when_unbound: true
