# testing/tests/loader_integration/queued-runs.yml
#
# 1:1 map of each acceptance RUN to the implementation deliverable(s) it waits on and
# the environment it needs. The test DESIGN + authoring is READY NOW; the RUNS below
# are dependency-blocked. The runner marks each QUEUED (fail-closed) until its blocker
# lands; on bind, `run_integration.yml -e mode=acceptance` runs them and any remaining
# QUEUED case FAILS the acceptance gate (codex-check-0015).
#
# Primary gate for ALL contract cases: contract_binding.status flips to "bound" when the
# C1 sitrep publishes lme_resolved.* schema + resolved dict + versioned artifact + the
# revision/origin field names; the coordinator edits contract_binding.yml ONLY.

schema_version: 1
authored_at_head: 0058948                # C1 engine milestone (a3352b2 ancestor); live loader still a3352b2
reference_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7

# NOTE (probe-handler debt, G-owned, NOT C1-blocked): this tier's runner bound-path is
# probe_handler.status=not_ready (see contract_binding.yml). Every contract case therefore also
# carries an implicit queued_on G_probe_handler until G builds the full integration probe (isolated
# sha256 copy, -e/-i/host_var/marker layering, ordered profiles + profile_switch, real entrypoint
# invocation, and render of revision/gates_agree/reject/no_secret_values asserts). Binding C1 alone
# will NOT release these; G_probe_handler must also complete.

runnable_now:
  - case: static-scan-caller-composed-defaults-at-head
    status: RUN
    environment: localhost
    note: "read-only entrypoint lint; produced the before-baseline evidence at run head 0058948-dirty (entrypoint bytes identical to a3352b2). Design-mode verdict PASS. DUAL-MODE: in mode=acceptance it also gates on each target's accept_present (the required post-migration state), so it is a real acceptance signal, not just before-evidence."

queued_runs:
  - case: installed-marker-preserves-upgrade-behavior
    queued_on: [C1, B]
    environment: localhost
    unblock_trigger: "C1 binds resolved contract + B migrates upgrade_lme.yml to pass raw observations (resolve before line 422)"
  - case: absent-marker-baseline-upgrade-behavior
    queued_on: [C1, B]
    environment: localhost
    unblock_trigger: "C1 bind + B upgrade migration"
  - case: inventory-false-beats-detected-true
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 sitrep binds lme_resolved.* + precedence resolution"
  - case: extra-var-false-beats-inventory-true
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind"
  - case: extra-var-true-beats-inventory-false
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind"
  - case: explicit-profile-field-beats-detection
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind (profile overlay precedence)"
  - case: omitted-profile-field-leaves-preservation-fallback
    queued_on: [C1, B]
    environment: localhost
    unblock_trigger: "C1 bind + B preservation-fallback wiring"
  - case: incidental-play-defaults-never-promoted-to-operator
    queued_on: [C1, B, E]
    environment: localhost
    unblock_trigger: "C1 bind + B convert_to_cluster play-var removal + E elasticsearch.yml play-var removal"
  - case: install-llm-true-is-declared-default-not-operator-override
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind (origin field)"
  - case: early-upgrade-gate-rendered-membership-credential-gate-same-revision
    queued_on: [C1, B, C]
    environment: localhost
    unblock_trigger: "C1 revision field + B early-gate migration + C credential/cert consumer migration"
  - case: consumer-profile-requires-resolved-secret-cert-endpoints
    queued_on: [C1, C]
    environment: localhost
    unblock_trigger: "C1 bind + C secret/cert consumer migration"
  - case: rendered-service-membership-matches-resolved-enable-flags
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind (resolved enable-flags -> lme_services)"
  - case: marker-inferred-profile-not-recorded-as-explicit-operator-choice
    queued_on: [C1, B]
    environment: localhost
    unblock_trigger: "C1 origin field + B upgrade migration (retain inferred origin)"
  - case: same-deployment-new-revision-no-snapshot-once-across-consumers
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 bind (recompute-from-scratch, no snapshot-once)"
  - case: tailscale-to-default-resets-stale-serve-controls
    queued_on: [C1, C]
    environment: localhost
    unblock_trigger: "C1 bind + C tailscale serve-control resolution (finding #2 general profile composition)"
  - case: tailscale-inventory-false-on-independent-serve-control
    queued_on: [C1, C]
    environment: localhost
    unblock_trigger: "C1 bind + C tailscale serve-control resolution"
  - case: newly-declared-profile-field-resolves-without-code-change
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 resolves declarations (not a fixed roster)"
  - case: changed-input-changes-resolved-revision
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 revision field"
  - case: unchanged-input-keeps-resolved-revision
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 revision field"
  - case: early-offline-resolved-before-first-mutation
    queued_on: [C1, B]
    environment: localhost
    unblock_trigger: "C1 bind + B resolve-before-first-mutation ordering in upgrade_lme.yml"
  - case: missing-dependency-selector-boundary-rejects
    queued_on: [C1, D, E]
    environment: localhost
    unblock_trigger: "boundary rejects until D (database) + E (telemetry) integrate the selector composition"
  - case: resolved-artifact-and-results-contain-no-secret-values
    queued_on: [C1, C]
    environment: localhost
    unblock_trigger: "C1 artifact shape + C secret handling"
  - case: consumer-rejects-stale-or-mismatched-revision-artifact
    queued_on: [C1]
    environment: localhost
    unblock_trigger: "C1 revision-checked artifact"
  - case: runner-refuses-to-reuse-prior-run-evidence
    queued_on: [G_probe_handler]
    environment: localhost
    unblock_trigger: "G-owned: run_integration.yml already enforces fresh-by-construction (the 'Refuse to reuse a prior run's evidence' task); this case formalizes it as an acceptance assertion. NOT C1-blocked."
  - case: acceptance-requires-data-flow-not-check-in
    queued_on: [E, B]
    environment: lab VM
    unblock_trigger: "E collection data-flow + B deploy on a lab VM"
  - case: cluster-leg-remains-typed-obstruction
    queued_on: [B, E]
    environment: multi-node cluster
    unblock_trigger: "B cluster lifecycle + E cluster ES on a multi-node cluster"
  - case: explicit-zero-distinct-from-absent
    queued_on: [C1, D, E]
    environment: localhost
    unblock_trigger: "C1 field schema + D/E declare a numeric field whose 0 is meaningful"
  - case: explicit-null-distinct-from-absent
    queued_on: [C1, D, E]
    environment: localhost
    unblock_trigger: "C1 field schema + D/E declare a nullable field"
  - case: explicit-empty-collection-distinct-from-absent
    queued_on: [C1, D, E]
    environment: localhost
    unblock_trigger: "C1 field schema + D/E declare a list/map field"
  - case: interrupted-recovery-same-deployment-reconciliation
    queued_on: [B]
    environment: lab VM
    unblock_trigger: "B lifecycle + a lab VM to interrupt and re-resolve"

release_groups:
  on_C1_sitrep_localhost:
    trigger: "contract_binding.status -> bound (C1 lme_resolved.* + revision + origin fields)"
    releases:
      - inventory-false-beats-detected-true
      - extra-var-false-beats-inventory-true
      - extra-var-true-beats-inventory-false
      - explicit-profile-field-beats-detection
      - install-llm-true-is-declared-default-not-operator-override
      - rendered-service-membership-matches-resolved-enable-flags
      - same-deployment-new-revision-no-snapshot-once-across-consumers
      - newly-declared-profile-field-resolves-without-code-change
      - changed-input-changes-resolved-revision
      - unchanged-input-keeps-resolved-revision
      - consumer-rejects-stale-or-mismatched-revision-artifact
      - runner-refuses-to-reuse-prior-run-evidence
  on_C1_plus_B:
    releases:
      - installed-marker-preserves-upgrade-behavior
      - absent-marker-baseline-upgrade-behavior
      - omitted-profile-field-leaves-preservation-fallback
      - marker-inferred-profile-not-recorded-as-explicit-operator-choice
      - early-offline-resolved-before-first-mutation
  on_C1_plus_B_plus_C:
    releases:
      - early-upgrade-gate-rendered-membership-credential-gate-same-revision
  on_C1_plus_C:
    releases:
      - consumer-profile-requires-resolved-secret-cert-endpoints
      - tailscale-to-default-resets-stale-serve-controls
      - tailscale-inventory-false-on-independent-serve-control
      - resolved-artifact-and-results-contain-no-secret-values
  on_C1_plus_B_plus_E:
    releases:
      - incidental-play-defaults-never-promoted-to-operator
  on_C1_plus_D_plus_E:
    releases:
      - missing-dependency-selector-boundary-rejects
      - explicit-zero-distinct-from-absent
      - explicit-null-distinct-from-absent
      - explicit-empty-collection-distinct-from-absent
  on_lab_vm_or_cluster:
    releases:
      - acceptance-requires-data-flow-not-check-in
      - cluster-leg-remains-typed-obstruction
      - interrupted-recovery-same-deployment-reconciliation
