# testing/tests/loader_integration/CASE-SCHEMA.yml
#
# PINNED schema every cases/*.yml file in this tier conforms to. The coordinator
# authors this seam; leaf workers author disjoint cases/NN_*.yml files against it.
# The runner (run_integration.yml) reads this to validate case shape before running,
# so an off-schema case FAILS the run rather than silently no-op'ing.
#
# A case is a mapping in a file's top-level `cases:` list.

schema_version: 1

case_fields:
  name:
    required: true
    type: str
    note: "unique across ALL cases/*.yml files; used as the verdict key and dir name"
  kind:
    required: true
    enum:
      - static_scan            # read-only entrypoint lint; RUNNABLE NOW (no contract)
      - precedence             # a higher tier beats a lower tier for a field
      - preservation           # omitted field keeps its permitted fallback/default
      - origin                 # the input record records the correct ORIGIN of a value
      - profile_switch         # switching profiles resets non-selected fields (no stale state)
      - consumer_agreement     # >=2 consumer gates read the SAME resolved revision
      - revision               # resolved revision changes iff inputs change (no snapshot-once)
      - newly_declared_field   # a field added only in data/profile resolves w/o code change
      - boundary               # the loader must REJECT (nonzero) an un-integrated selector
      - security_probe         # hostile/negative: no secret leak, stale-artifact reject, etc.
  requires_contract:
    required: false
    type: bool
    default: true
    note: >-
      true (default) => needs the C1 lme_resolved.* contract; runner marks it QUEUED
      until contract_binding.status == bound. static_scan sets this false.
  queued_on:
    required: false
    type: list
    note: "implementation deliverable(s) this run waits on, e.g. [C1, B, E]; required when requires_contract"
  entrypoints:
    required: false
    type: list
    note: "which of contract_binding.entrypoints the case exercises (site/upgrade/elasticsearch/convert_to_cluster)"
  inputs:
    required: false
    type: map
    note: >-
      declarative input layers the probe applies. Recognized subkeys:
      extra_vars{}, inventory_vars{}, host_vars{}, profile (str) or profile_sequence[list],
      play_var_overrides{} (to model the entrypoint's own play vars), markers{} (on-disk
      state e.g. installed pack quadlet / offline marker), profile_field_added{} (for
      newly_declared_field), profile_switch_from/profile_switch_to.
  expect:
    required: false
    type: map
    note: >-
      the declared expected outcome. Recognized subkeys:
      resolved{field: value} (assert the resolved value), origin{field: origin_name},
      revision (str: 'same_as' <case> | 'differs_from' <case>), members_include[list],
      members_exclude[list], gates_agree[list of consumer_gate names], reject (bool, for
      boundary), no_secret_values (bool, for security_probe).
  invariant_task:
    required: true
    type: str
    note: >-
      the SPECIFIC probe task name that carries the assertion; the verdict is keyed to
      THIS name plus fail_msg (strict, per C1). A crash / missing binding can never
      masquerade as an expected outcome.
  fail_msg:
    required: false
    type: str
    note: "regression-guard message asserted on failure; retained even after the case flips to PASS"
  # static_scan-only fields:
  targets:
    required: false
    type: list
    note: "static_scan: list of {entrypoint, patterns:[regex...], expect_present: bool}"

verdicts:
  # produced by the runner; the acceptance gate is green only on the first group with
  # ZERO cases in QUEUED.
  expected_when_bound: [PASS, XFAIL-as-expected, REJECTED-as-expected]
  design_state: [QUEUED]        # contract-dependent case at an unbound HEAD (fail-closed)
  failing: [FAIL, ERROR, OFF-EXPECTATION]

authoring_rules:
  - "cases/NN_*.yml files are DISJOINT (one writer per file). NN orders execution."
  - "Every contract-dependent case MUST set queued_on naming its blocking deliverable(s)."
  - "Do NOT weaken an assertion to make a run green; the acceptance matrix must not shrink."
  - "No secret VALUES in any case, probe render, or results.yml; use synthetic fixtures only."
  - "binds_to: never a fabricated SHA -- the runner records the REAL git HEAD at run time."
