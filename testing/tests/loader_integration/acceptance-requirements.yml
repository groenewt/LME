# testing/tests/loader_integration/acceptance-requirements.yml
#
# TRACEABILITY + AUDITABLE NON-DUPLICATION register for the LME resolved-config
# INTEGRATION acceptance tier. For every codex-check-0200 required_contract_test it
# records (a) the C1 ISOLATED unit case(s) that cover it in
# .superpowers/sdd/2026-09-22-observability-implementation/loader-tests/cases.yml,
# (b) the G INTEGRATION case(s) here, (c) the entrypoint(s) bound, and (d) why the
# integration case is NOT a duplicate of the unit case.
#
# OVERLAPPING BEHAVIOR NAMES (inventory-override, profile-switch, boundary) across the
# two tiers are INTENTIONAL cross-tier coverage, not duplication:
#   - C1 unit tier: resolves ONE dict in an isolated source copy; single-dict invariant.
#   - G integration tier: exercises the resolved contract through the ACTUAL deployment
#     entrypoints with the real variable context, and proves cross-consumer agreement --
#     the exact gap codex-loader-regression-20260923-0100 proved the isolated probe cannot
#     see (site/play defaults captured as operator overrides).

schema_version: 1
authored_at_head: 0058948                # C1 engine milestone (a3352b2 ancestor); entrypoint bytes identical to a3352b2
reference_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7
c1_unit_suite: .superpowers/sdd/2026-09-22-observability-implementation/loader-tests/cases.yml

requirements:
  - codex_test: T1
    text: "Existing installed pack/offline marker without explicit choices preserves the declared upgrade behavior."
    c1_unit_cases: []
    c1_note: "not covered at the unit tier (needs the real upgrade entrypoint marker/detection context)"
    integration_cases: [installed-marker-preserves-upgrade-behavior]
    entrypoints: [upgrade]
    tier_distinction: "integration-only: reads the on-disk pack quadlet + offline marker through upgrade_lme.yml, which the isolated loader probe has no access to."

  - codex_test: T2
    text: "Absent pack/marker without explicit choices retains the declared baseline upgrade behavior."
    c1_unit_cases: [default-labfree]
    integration_cases: [absent-marker-baseline-upgrade-behavior]
    entrypoints: [upgrade]
    tier_distinction: "unit checks the lab-free default resolves; integration checks the upgrade entrypoint with markers absent reverts to the declared baseline (real detection context)."

  - codex_test: T3
    text: "Explicit inventory false beats detected true; extra-var false beats inventory true; and the inverse."
    c1_unit_cases: [inventory-override-explicit-false, inventory-override-extra-var-beats-inventory, inventory-override-absent-key-profile-wins]
    integration_cases: [inventory-false-beats-detected-true, extra-var-false-beats-inventory-true, extra-var-true-beats-inventory-false]
    entrypoints: [site, upgrade]
    tier_distinction: "unit uses a real -i inventory in isolation; integration adds the detected-true (marker/detection) source and the inverse, in the real entrypoint context where play vars would otherwise shadow inventory."

  - codex_test: T4
    text: "An explicit profile field beats contradictory detection; an omitted profile field leaves permitted preservation fallback available."
    c1_unit_cases: [profile-switch, inventory-override-absent-key-profile-wins]
    integration_cases: [explicit-profile-field-beats-detection, omitted-profile-field-leaves-preservation-fallback]
    entrypoints: [site, upgrade]
    tier_distinction: "unit resolves profile-vs-inventory in isolation; integration pits an explicitly selected profile against real detection and verifies the schema-permitted preservation fallback survives an omitted field."

  - codex_test: T5
    text: "Incidental play defaults are never promoted to operator overrides."
    c1_unit_cases: [inventory-override-absent-key-profile-wins]
    c1_note: "unit derives site.yml play vars mechanically; but the elasticsearch.yml/convert_to_cluster.yml play defaults are integration-only"
    integration_cases: [incidental-play-defaults-never-promoted-to-operator, install-llm-true-is-declared-default-not-operator-override, marker-inferred-profile-not-recorded-as-explicit-operator-choice]
    entrypoints: [elasticsearch, convert_to_cluster, site, upgrade]
    tier_distinction: "THE regression codex-loader-regression-0100 flagged: a play-level default (elasticsearch.yml:28, convert_to_cluster.yml:386) captured as an operator override. Only visible through the real entrypoints. install_llm=true origin=default is the same class; marker-inferred-profile extends it to a marker-derived offline posture stamped 'operator' at load_manifests.yml:105 (recorded observation-backed/preservation, never operator)."

  - codex_test: T6
    text: "Early upgrade gates, rendered service membership and later credential gates agree on the same resolved revision."
    c1_unit_cases: []
    c1_note: "cross-consumer agreement is inherently integration-scope; not expressible at the single-dict unit tier"
    integration_cases:
      - early-upgrade-gate-rendered-membership-credential-gate-same-revision
      - consumer-profile-requires-resolved-secret-cert-endpoints
      - rendered-service-membership-matches-resolved-enable-flags
      - same-deployment-new-revision-no-snapshot-once-across-consumers
    entrypoints: [upgrade, site]
    tier_distinction: "integration-only: three distinct consumers (upgrade_lme.yml early gates 160/161/422/443/674, render_units is_enabled->lme_services, load_manifests credential/cert gate) must read ONE resolved revision."

  - codex_test: T7
    text: "Tailscale reload/reset, newly-declared field, changed-input, early-offline and missing-dependency remain required."
    c1_unit_cases: [profile-switch, boundary-rejects-selector]
    integration_cases:
      - tailscale-to-default-resets-stale-serve-controls
      - tailscale-inventory-false-on-independent-serve-control
      - newly-declared-profile-field-resolves-without-code-change
      - changed-input-changes-resolved-revision
      - unchanged-input-keeps-resolved-revision
      - early-offline-resolved-before-first-mutation
      - missing-dependency-selector-boundary-rejects
    entrypoints: [site, upgrade]
    tier_distinction: "extends the enable-flag proofs to the non-flag profile vars (tailscale_serve_*) that finding #2 showed still leak as stale host facts, plus revision + early-offline + boundary at integration scope."

  - codex_test: T8
    text: "Before/after results preserve actual source, copied inputs, runner/macro hashes and resolved outputs under distinct evidence identities."
    c1_unit_cases: []
    c1_note: "C1 runner banks its own per-run evidence; this tier banks the INTEGRATION before/after identities (see evidence-matrix.yml)"
    integration_cases: [static-scan-caller-composed-defaults-at-head]
    integration_cases_supporting: [resolved-artifact-and-results-contain-no-secret-values, consumer-rejects-stale-or-mismatched-revision-artifact, runner-refuses-to-reuse-prior-run-evidence]
    entrypoints: [site, upgrade, elasticsearch, convert_to_cluster]
    tier_distinction: "the runner records HEAD (never fabricated), toolchain, per-entrypoint sha256, authored case+macro sha256 and resolved-output hashes per run under runs/<run_id>/results.yml. The static_scan run at 0058948-dirty (entrypoint bytes byte-identical to a3352b2) IS the banked 'before' identity."

# Acceptance requirements from the operator brief that extend BEYOND the 8 codex
# required_contract_tests (security/failure/boundary probes + same-deployment
# reconciliation + interrupted recovery). Retained so the acceptance matrix does NOT
# shrink; each is contract- and/or downstream-dependent and QUEUED accordingly.
additional_acceptance_requirements:
  - id: AR1
    text: "Acceptance is judged on observed end-to-end DATA FLOW, never on agent check-in or a green install alone (OCR B2 false-success pattern)."
    integration_cases: [acceptance-requires-data-flow-not-check-in]
    environment: lab VM
    origin: operator-brief (security/failure probes)
  - id: AR2
    text: "The cluster leg stays a DECLARED typed-obstruction (adjudicated), never a silent drop nor a false pass."
    integration_cases: [cluster-leg-remains-typed-obstruction]
    environment: multi-node cluster
    origin: operator-brief (hostile rejection of false success)
  - id: AR3
    text: "An explicit false-like value (0 / null / empty collection) is distinct from absent and retains its declared semantics (needs D/E to declare fields whose schema gives 0/null/empty meaning)."
    integration_cases: [explicit-zero-distinct-from-absent, explicit-null-distinct-from-absent, explicit-empty-collection-distinct-from-absent]
    environment: localhost
    origin: operator-brief (input semantics; deferred subcases retained, not dropped)
  - id: AR4
    text: "A re-resolution after an interrupted run reconciles to the SAME deployment's CURRENT declared inputs (no stale snapshot, no partial-state promotion)."
    integration_cases: [interrupted-recovery-same-deployment-reconciliation]
    environment: lab VM
    origin: operator-brief (same-deployment reconciliation + interrupted recovery)
  - id: AR5
    text: "The multinode FLEET profile is NOT a cluster: es_discovery resolves single-node at origin=profile (remote-agent enrollment against ONE ES node), guarding the multinode/cluster confusion."
    integration_cases: [multinode-profile-keeps-es-discovery-single-node-at-profile-origin]
    environment: localhost
    origin: operator-brief (profile-membership; multinode != cluster, manifests/profiles/multinode.yml:74-77)

# RESOLVER regressions Codex's audit (codex-resolver-audit-0245 / codex-check-0330) says are
# missing at unit tier. G owns the INTEGRATION-tier leg (real-Jinja through engine_probe.yml.j2
# against the real resolver); C1 owns the pure-engine UNIT sources (test_lme_manifests.py /
# test_lme_resolve_config.py) -- these RES specs are supplied to C1. RUNNABLE NOW (no C1 cutover).
resolver_regression_requirements:
  owner_split: {integration_tier: G_acceptance, unit_tier: C1, specs_supplied_to_c1: "cases/05_engine_regressions.yml"}
  # Every raises:true case ALSO asserts a raises_match substring in the error (the reversed pipe
  # must fail for the 'no fields' reason, not any error -- closes the fail-OPEN hole where any
  # raise passed). VERIFIED by a mutation check: neutralizing each of 6 guards (no-fields,
  # non-mapping, unsupported-type, precedence, honest-origin, enable-flag-drift) flips its target
  # case RED while baselines PASS -- so no engine case is fail-open.
  raises_are_reason_checked: true
  mutation_verified: 6
  requirements:
    - id: RES1
      text: "Real-Jinja argument-ORDER: the reversed pipe resolved|lme_validate_config(registry) fails closed on the registry-shape gate."
      integration_cases: [reversed-validate-pipe-fails-closed, correct-validate-pipe-accepts-canonical]
    - id: RES2
      text: "Reordered precedence: the resolver honors registry.precedence (A2 effective precedence), proven by flipping the declared order."
      integration_cases: [precedence-is-declaration-driven-operator-first, precedence-is-declaration-driven-profile-first]
    - id: RES3
      text: "Extended type: explicit int 0 / empty list / empty map / null (nullable) preserved by membership, not overwritten."
      integration_cases: [extended-types-explicit-falselike-preserved]
    - id: RES4
      text: "Origin rejection (A5): a false caller origin claim is discarded to operator; a caller-verified declared finer origin is preserved."
      integration_cases: [false-origin-claim-discarded-as-operator, finer-verified-origin-preserved]
    - id: RES5
      text: "C1-OPTIONAL-NONMAPPING: a non-mapping resolved input is rejected regardless of whether any field is required."
      integration_cases: [optional-only-registry-rejects-nonmapping-resolved]
    - id: RES6
      text: "C1-UNKNOWN-NULLABLE-TYPE: an unsupported declared type fails the registry-shape gate before value inspection, even nullable."
      integration_cases: [unsupported-declared-type-fails-schema-even-nullable]
    - id: RES7
      text: "REAL-registry (not a synthetic mirror): the SHIPPED manifests/global.yml lme_config_registry resolves declared defaults (origin=default) with empty inputs, validates round-trip, AND its enable_flag keys match the resolver's KNOWN_ENABLE_FLAGS (is_enabled typo-guard drift enforcement)."
      integration_cases: [real-registry-empty-resolve-yields-declared-defaults-and-no-enableflag-drift]
    - id: RES8
      text: "Content-addressed revision (lme_config_revision) over the CONFIG ALONE (C1 63b2658 dropped origins): identical resolved config yields the SAME revision id (deterministic, no timestamp/HEAD/origin leak); a changed config VALUE changes the id (a stale config cannot pass the cross-consumer agreement gate)."
      integration_cases: [resolved-revision-is-deterministic-for-identical-config, resolved-revision-changes-when-a-config-value-changes]
    - id: RES9
      text: "Adversarial resolver caller (codex-0400): a selection naming an UNDECLARED field is rejected (managed-key assert); a REQUIRED field with no value at any tier fails closed BEFORE any mutation."
      integration_cases: [resolver-rejects-selection-naming-undeclared-field, resolver-required-field-with-no-value-fails-closed-pre-mutation]

# CALLER-NEGATIVE + interrupted-operation requirements routed to G by D and B
# (codex-0315 #1/#2b, codex-0330 #1/#2). All QUEUED on D/B + a lab VM (fail-closed).
caller_negative_requirements:
  - id: CN1
    text: "B2 interrupted augenrules activation (ludus_lme_agents/tasks/elastic.yml:153-171 + 1a5c5a4 residual, reconcile-0410): a rerun after a failed load RECONCILES activation; old/partial marker still reruns; single-rule drift re-activates; a probe failure is not masked by the marker; an unchanged-healthy rerun VERIFIES applied kernel rules + preserves unrelated rules (marker+non-empty-ruleset is insufficient)."
    integration_cases: [interrupted-augenrules-activation-reconciles-on-rerun, b2-audit-rules-old-marker-partial-reruns-activation, b2-audit-rules-single-rule-drift-reconciles, b2-audit-rules-probe-failure-not-masked-by-marker, b2-audit-rules-unchanged-healthy-run-verifies-not-skips]
    queued_on: [B]
  - id: CN2
    text: "RECOVERY-INTEGRITY-QUALIFICATION (M1 gap: existence/type only): recovery REJECTS on missing stop evidence, no explicit override, unsafe/unverified backup, failed pre-destruction integrity, and bad restore exit/content."
    integration_cases: [recovery-rejects-missing-stop-evidence, recovery-refuses-without-explicit-override, rollback-does-not-destroy-on-unsafe-or-unverified-backup, recovery-rejects-failed-pre-destruction-integrity, recovery-rejects-bad-restore-exit-or-content]
    queued_on: [D]
  - id: CN3
    text: "RECOVERY-MISSING-REQUIRED-SECRETS (rollback_lme.yml ~:503/:529/:543): rollback cannot exit zero with required secrets absent."
    integration_cases: [rollback-refuses-zero-exit-with-required-secrets-absent]
    queued_on: [D, C]
  - id: CN5
    text: "restore_elasticsearch_snapshot negatives (reconcile-0410 my_retractions.a; 30f0edb REOPENED for B, D supplies the recovery model): async 'accepted' is admission-only not completion (poll/finalize + verify CONTENT); health requires an allowed state AND honors timed_out (not only literal-red); Kibana stop/start must ESTABLISH 'cleanly stopped' (no ignore_errors) + record prior state/checkpoints for resume."
    integration_cases: [restore-es-async-accepted-is-not-completion, restore-es-health-requires-allowed-state-and-honors-timeout, restore-es-kibana-clean-stop-must-be-established]
    queued_on: [B, D]
  - id: CN4
    text: "CR-B4 es/cluster incidental play-var (elasticsearch.yml:28 + convert_to_cluster.yml:386) not captured as operator; flip-timing: B+E delete together (see case flip_timing)."
    # DEDUPED: this is the same input/expectation as T5's incidental-play-defaults case, which now
    # carries the flip_timing block (was a separate case in cases/06; removed to avoid a duplicate verdict).
    integration_cases: [incidental-play-defaults-never-promoted-to-operator]
    queued_on: [C1, B, E]

# NETWORK/CONSUMER guard-classification requirements routed to G by C (T-1). QUEUED on C + a
# lab VM (fail-closed). State-classification invariants: decide from the real service/daemon
# state word, never a lying proxy (a zero exit, an 'absent' rc, a serve-config that says up).
network_consumer_guard_requirements:
  - id: NG1
    text: "distribute_ca restart gate: a co-enabled ALREADY-ACTIVE service with NO CA change is NOT restarted (guard refuses a needless bounce); a CA-only change on an active service DOES restart."
    integration_cases: [distribute-ca-co-enabled-active-service-is-not-restarted, distribute-ca-only-change-on-active-service-does-restart]
    queued_on: [C]
  - id: NG2
    text: "systemd absent-unit classification: the guard reads the ActiveState WORD, not the rc -- `systemctl is-active` exits rc=4 for an absent unit while printing 'inactive'/'unknown'."
    integration_cases: [systemctl-absent-unit-classified-by-activestate-word-not-rc]
    queued_on: [C]
  - id: NG3
    text: "tailscale logged-out classification: liveness reads BackendState=='Running', not the exit code -- `tailscale status --json` exits 0 even when logged out."
    integration_cases: [tailscale-logged-out-classified-by-backendstate-not-exit-code]
    queued_on: [C]

