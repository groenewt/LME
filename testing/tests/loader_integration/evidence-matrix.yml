# testing/tests/loader_integration/evidence-matrix.yml
#
# OPERATIONAL EVIDENCE MATRIX for the LME resolved-config INTEGRATION acceptance tier.
# Covers Codex required_contract_test #8 (before/after results under DISTINCT evidence
# identities) and the full operational acceptance dimensions (build / execution /
# geometric readback). Acceptance criteria MUST NOT shrink; every row names what a
# FALSE success looks like so it can be rejected.

schema_version: 1
bound_to_commit: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7

# --- Test #8: the fields every run banks under a distinct evidence identity ---------
evidence_identity:
  written_by: run_integration.yml -> runs/<run_id>/results.yml
  run_id: "<head[:12]>-<UTC-timestamp>[-dirty]  (source-bound; a dirty tree is visible)"
  fields:
    - head: "real git rev-parse HEAD (NEVER a fabricated SHA; broken lineage is rejected)"
    - worktree_dirty: "git status --porcelain non-empty"
    - toolchain: "python / jinja2 / pyyaml / ansible versions"
    - entrypoints_sha256: "sha256 of site.yml, upgrade_lme.yml, elasticsearch.yml, convert_to_cluster.yml"
    - authored_sha256: "sha256 of every cases/*.yml + macros/probe.j2"
    - resolved_outputs: "per-case resolved values / hashes (once C1 binds and probes run)"
    - tally: "pass / queued / hard_fail counts; QUEUED never counts as pass"
  preservation_rule: "each run lands in its OWN run_id dir; a later run never deletes an earlier run's evidence (runs/ is gitignored, on-disk only)."

# --- The banked BEFORE identity (already produced at a3352b2) -----------------------
before_baseline:
  case: static-scan-caller-composed-defaults-at-head
  produced: true
  head: a3352b27652c3c81ce9ebb5c588b9a4d8c36c9d7
  authoritative_values_in: runs/<run_id>/results.yml   # exact sha256s + samples live here; not transcribed (no fabricated hashes)
  captured:
    - "8 caller-composed detection-as-default / flag+profile play-vars catalogued as PRESENT (with matching source lines): elasticsearch.yml offline_mode:false; convert_to_cluster.yml offline_mode:false + lme_profile:cluster; upgrade_lme.yml install_elastic_services|default(elastic_pack_quadlet), offline_mode|default(offline_marker), lme_profile|default(...), _render_offline_mode x2, _render_lme_profile x2."
    - "positive control: site.yml carries NO enable-flag play var (found:false) -- proves the scan discriminates."
  after_expectation: "when B/E migrate the entrypoints to the resolved-config contract and remove these caller-composed defaults, re-running static_scan FLIPS to FAIL (a tripwire): re-baseline and route acceptance to the now-unblocked contract-bound cases (01/02/03/04)."

# --- Operational acceptance matrix (build / execution / geometric readback) ---------
# dimension | acceptance_means (data-flow, not check-in) | false_success_to_reject | evidence_artifact | environment | queued_on
operational_evidence_matrix:
  - dimension: resolved-contract-build
    acceptance_means: "one validated resolved dictionary + versioned OUTPUT-ONLY artifact recomputed from scratch each resolution"
    false_success_to_reject: "a snapshot-once cached first-load result reused as authoritative"
    evidence_artifact: runs/<run_id>/results.yml + the C1 versioned artifact
    environment: localhost
    queued_on: [C1]
  - dimension: install-deploy-build
    acceptance_means: "the deploy renders + starts the resolved service membership on a real host"
    false_success_to_reject: "green install checks that verify check-in, not running services"
    evidence_artifact: deploy_gate stage evidence (B-owned; separate tier)
    environment: lab VM
    queued_on: [B]
  - dimension: collection-data-flow
    acceptance_means: "observed end-to-end telemetry/log DATA arriving at the resolved sink"
    false_success_to_reject: "agent check-in / policy-attached counted as delivery (OCR B2 false-success pattern)"
    evidence_artifact: query of the sink for real documents (E-owned; referenced here)
    environment: lab VM
    queued_on: [E, B]
  - dimension: cross-consumer-revision-agreement
    acceptance_means: "early upgrade gate == rendered membership == credential/cert gate read one resolved revision"
    false_success_to_reject: "each consumer re-deriving its own caller-composed selection"
    evidence_artifact: results.yml gates_agree + revision fields
    environment: localhost
    queued_on: [C1, B, C]
  - dimension: airgapped-offline
    acceptance_means: "offline resolved from marker as declared preservation fallback; deploy runs with no egress"
    false_success_to_reject: "offline flipped false by a captured play default; silent network reach"
    evidence_artifact: results.yml offline resolution + B airgapped deploy_gate
    environment: airgapped
    queued_on: [C1, B]
  - dimension: tailscale-vip-liveness
    acceptance_means: "advertised svc VIPs are actually live (require_vip_live) after the serve controls resolve"
    false_success_to_reject: "an undefined service publishes green with no live VIP (silent-dead-VIP)"
    evidence_artifact: CapMap liveness assert + results.yml tailscale_serve_* resolution
    environment: tailnet
    queued_on: [C1, C]
  - dimension: cluster-leg
    acceptance_means: "cluster path either passes on real multi-node evidence or surfaces a DECLARED typed-obstruction"
    false_success_to_reject: "silent drop of the cluster leg, or a false pass"
    evidence_artifact: typed-obstruction record + multi-node run
    environment: multi-node cluster
    queued_on: [B, E]
  - dimension: secrets-absent-from-evidence
    acceptance_means: "resolved artifact + results.yml carry field identities + synthetic fixtures only"
    false_success_to_reject: "any secret VALUE present in committed or emitted evidence"
    evidence_artifact: results.yml scanned for secret values
    environment: localhost
    queued_on: [C1, C]
  - dimension: interrupted-recovery-reconciliation
    acceptance_means: "re-resolution after interruption reconciles to the same deployment's current declared inputs"
    false_success_to_reject: "partial/stale state promoted; resolution against a different revision"
    evidence_artifact: before/after results.yml pair under distinct identities
    environment: lab VM
    queued_on: [B]

acceptance_matrix_must_not_shrink: true
