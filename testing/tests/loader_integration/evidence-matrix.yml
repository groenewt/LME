# testing/tests/loader_integration/evidence-matrix.yml
#
# OPERATIONAL EVIDENCE MATRIX for the LME resolved-config INTEGRATION acceptance tier.
# Covers Codex required_contract_test #8 (before/after results under DISTINCT evidence
# identities) and the full operational acceptance dimensions (build / execution /
# geometric readback). Acceptance criteria MUST NOT shrink; every row names what a
# FALSE success looks like so it can be rejected.

schema_version: 1
authored_at_head: 0058948            # C1 engine milestone (a3352b2 is its ancestor)
entrypoint_bytes_identical_to: a3352b2   # verified via git show a3352b2:<path> | sha256sum
live_loader_still_at: a3352b2

# --- Test #8: the fields every run banks under a distinct evidence identity ---------
evidence_identity:
  written_by: run_integration.yml -> runs/<run_id>/results.yml
  run_id: "<head[:12]>-<UTC-timestamp>[-dirty]  (source-bound; a dirty tree is visible)"
  fields:
    - head: "real git rev-parse HEAD (NEVER a fabricated SHA; broken lineage is rejected)"
    - worktree_dirty: "git status --porcelain non-empty"
    - toolchain: "python / jinja2 / pyyaml / ansible versions"
    - entrypoints_sha256: "sha256 of site.yml, upgrade_lme.yml, elasticsearch.yml, convert_to_cluster.yml"
    - engine_resolver_sha256: "sha256 of the IMMUTABLE per-run resolver copy the engine_regression cases run against (runs/<run_id>/_engine/filter_plugins/lme_manifests.py)"
    - authored_sha256: "sha256 of every cases/*.yml + macros/probe.j2"
    - resolved_outputs: "per-case resolved values / hashes (once C1 binds and probes run)"
    - tally: "pass / queued / hard_fail counts; QUEUED never counts as pass"
  preservation_rule: "each run lands in its OWN run_id dir; a later run never deletes an earlier run's evidence (runs/ is gitignored, on-disk only)."

# --- The banked BEFORE identity (already produced at a3352b2) -----------------------
before_baseline:
  case: static-scan-caller-composed-defaults-at-head
  produced: true
  run_head: 0058948            # actual run head (worktree HEAD; dirty due to concurrent sibling work)
  run_dirty: true
  entrypoint_bytes_identical_to: a3352b2   # all 4 entrypoints byte-identical to a3352b2; live loader still a3352b2
  authoritative_values_in: runs/<run_id>/results.yml   # exact sha256s + samples live here; not transcribed (no fabricated hashes)
  captured:
    - "8 caller-composed detection-as-default / flag+profile play-vars catalogued as PRESENT (with matching source lines): elasticsearch.yml offline_mode:false; convert_to_cluster.yml offline_mode:false + lme_profile:cluster; upgrade_lme.yml install_elastic_services|default(elastic_pack_quadlet), offline_mode|default(offline_marker), lme_profile|default(...), _render_offline_mode x2, _render_lme_profile x2."
    - "positive control: site.yml carries NO enable-flag play var (found:false) -- proves the scan discriminates."
  after_expectation: "when B/E migrate the entrypoints to the resolved-config contract and remove these caller-composed defaults, re-running static_scan FLIPS to FAIL (a tripwire): re-baseline and route acceptance to the now-unblocked contract-bound cases (01/02/03/04)."

# --- The RUNNABLE-NOW engine leg (codex-0315/0330; cases/05) ------------------------
# Distinct from the before_baseline (a textual scan): this leg EXECUTES the real resolver
# filters through ansible-playbook Jinja against an immutable per-run copy, so it is live
# behavioral evidence the engine-audit regressions are closed -- and a tripwire if they reopen.
engine_regression_leg:
  runnable_now: true
  needs_c1_cutover: false
  probe: engine_probe.yml.j2
  under_test: "runs/<run_id>/_engine/filter_plugins/lme_manifests.py (immutable copy; engine_resolver_sha256 banked)"
  cases: 12
  verdict_at_head: "all 12 PASS (engine correct at 8ceb297); each goes RED on the named regression"
  proves: [A1_reversed_pipe_fail_closed, A2_reordered_precedence, extended_types, A5_origin_rejection,
           A5_finer_verified_origin, C1_OPTIONAL_NONMAPPING, C1_UNKNOWN_NULLABLE_TYPE,
           real_registry_defaults_and_validate_roundtrip_and_enable_flag_drift,
           revision_deterministic, revision_sensitive]
  invokes: [lme_resolve_config, lme_validate_config, lme_config_revision, lme_known_enable_flags]
  raises_are_reason_checked: "every raises:true case also asserts a raises_match substring in the error (no fail-OPEN on any error)"
  mutation_verified: "6 guard mutations (no-fields / non-mapping / unsupported-type / precedence / honest-origin / enable-flag-drift) each flip their target case RED while baselines PASS -- so no engine case is fail-open (M1: a DIFFERENT error no longer passes the reversed-pipe case)"
  real_registry: "the real-registry case loads the SHIPPED manifests/global.yml via include_vars (not a synthetic mirror) and resolves against it"
  false_success_to_reject: "a probe that renders ZERO assertions (ERROR, never PASS); a mutated resolver (sha256 mismatch); a raises:true that passes on ANY error"
  distinct_from: "the ENTRYPOINT integration leg (real -e/-i via a resolve-only seam) which stays QUEUED -- a running engine leg never satisfies an entrypoint/caller leg"

# --- Operational acceptance matrix (build / execution / geometric readback) ---------
# dimension | acceptance_means (data-flow, not check-in) | false_success_to_reject | evidence_artifact | environment | queued_on
operational_evidence_matrix:
  - dimension: resolved-contract-build
    acceptance_means: "one validated resolved dictionary + versioned OUTPUT-ONLY artifact recomputed from scratch each resolution"
    false_success_to_reject: "a snapshot-once cached first-load result reused as authoritative"
    evidence_artifact: runs/<run_id>/results.yml + the C1 versioned artifact
    environment: localhost
    queued_on: [C1]
  - dimension: install-deploy-build
    acceptance_means: "the deploy renders + starts the resolved service membership on a real host"
    false_success_to_reject: "green install checks that verify check-in, not running services"
    evidence_artifact: deploy_gate stage evidence (B-owned; separate tier)
    environment: lab VM
    queued_on: [B]
  - dimension: collection-data-flow
    acceptance_means: "observed end-to-end telemetry/log DATA arriving at the resolved sink"
    false_success_to_reject: "agent check-in / policy-attached counted as delivery (OCR B2 false-success pattern)"
    evidence_artifact: query of the sink for real documents (E-owned; referenced here)
    environment: lab VM
    queued_on: [E, B]
  - dimension: cross-consumer-revision-agreement
    acceptance_means: "early upgrade gate == rendered membership == credential/cert gate read one resolved revision"
    false_success_to_reject: "each consumer re-deriving its own caller-composed selection"
    evidence_artifact: results.yml gates_agree + revision fields
    environment: localhost
    queued_on: [C1, B, C]
  - dimension: airgapped-offline
    acceptance_means: "offline resolved from marker as declared preservation fallback; deploy runs with no egress"
    false_success_to_reject: "offline flipped false by a captured play default; silent network reach"
    evidence_artifact: results.yml offline resolution + B airgapped deploy_gate
    environment: airgapped
    queued_on: [C1, B]
  - dimension: tailscale-vip-liveness
    acceptance_means: "advertised svc VIPs are actually live (require_vip_live) after the serve controls resolve"
    false_success_to_reject: "an undefined service publishes green with no live VIP (silent-dead-VIP)"
    evidence_artifact: CapMap liveness assert + results.yml tailscale_serve_* resolution
    environment: tailnet
    queued_on: [C1, C]
  - dimension: cluster-leg
    acceptance_means: "cluster path either passes on real multi-node evidence or surfaces a DECLARED typed-obstruction"
    false_success_to_reject: "silent drop of the cluster leg, or a false pass"
    evidence_artifact: typed-obstruction record + multi-node run
    environment: multi-node cluster
    queued_on: [B, E]
  - dimension: secrets-absent-from-evidence
    acceptance_means: "resolved artifact + results.yml carry field identities + synthetic fixtures only"
    false_success_to_reject: "any secret VALUE present in committed or emitted evidence"
    evidence_artifact: results.yml scanned for secret values
    environment: localhost
    queued_on: [C1, C]
  - dimension: interrupted-recovery-reconciliation
    acceptance_means: "re-resolution after interruption reconciles to the same deployment's current declared inputs"
    false_success_to_reject: "partial/stale state promoted; resolution against a different revision"
    evidence_artifact: before/after results.yml pair under distinct identities
    environment: lab VM
    queued_on: [B]
  - dimension: interrupted-audit-activation
    acceptance_means: "after a failed augenrules load, a rerun with the unchanged rules download RE-RUNS activation (applied-vs-pending tracked)"
    false_success_to_reject: "the download's idempotency (ok/changed=false) masks the un-activated state, so activation is skipped on rerun"
    evidence_artifact: applied-state manifest + rerun activation evidence (B-owned)
    environment: lab VM
    queued_on: [B]
  - dimension: recovery-integrity-qualification
    acceptance_means: "recovery REJECTS on missing stop evidence, no override, unsafe/unverified backup, failed pre-destruction integrity, bad restore exit/content, or absent required secrets"
    false_success_to_reject: "M1 existence/type-only check lets rollback exit zero on a bad backup or with required secrets absent (a silent broken recovery)"
    evidence_artifact: recovery reject records + non-secret diagnostic evidence (D/C-owned)
    environment: lab VM
    queued_on: [D, C]
  - dimension: engine-resolver-regression
    acceptance_means: "the real resolver, run via Jinja against an immutable copy, upholds A1/A2/A5 + extended-type + non-mapping + unknown-type + finer-verified-origin + REAL-registry defaults/validate/enable-flag-drift + revision determinism/sensitivity (all 12 cases PASS); every raises case is reason-checked; mutation-verified RED"
    false_success_to_reject: "a zero-assertion probe; a mutated resolver; a reversed pipe validating silently; a raises:true passing on ANY error; KNOWN_ENABLE_FLAGS drifting from the registry"
    evidence_artifact: runs/<run_id>/results.yml (engine_regression verdicts + engine_resolver_sha256)
    environment: localhost
    queued_on: []      # RUNNABLE NOW -- no dependency
  - dimension: network-consumer-guard-classification
    acceptance_means: "guards classify on the ACTUAL state word, not a lying proxy: distribute_ca restarts iff a CA change warrants it (not a needless bounce, and not never); systemd absent-unit read by ActiveState word not rc=4; tailnet liveness reads BackendState==Running not the status --json exit 0"
    false_success_to_reject: "a co-enabled active service bounced with no CA change; an rc-driven guard reading rc=4 (absent unit) as a real failure; a logged-out node advertised live because status --json exited 0 (silent-dead pattern)"
    evidence_artifact: C-owned distribute_ca / service-state / tailnet-liveness guard evidence (referenced here; QUEUED on C)
    environment: lab VM / tailnet
    queued_on: [C]
  - dimension: multinode-profile-not-cluster
    acceptance_means: "the multinode FLEET profile resolves es_discovery=single-node at origin=profile (remote-agent enrollment against ONE ES node), never a cluster/multi value nor origin=default"
    false_success_to_reject: "the multinode profile silently resolving a cluster es_discovery, or recording the overlay value as origin=default"
    evidence_artifact: results.yml resolved es_discovery + origin for profile=multinode
    environment: localhost
    queued_on: [C1]

acceptance_matrix_must_not_shrink: true
