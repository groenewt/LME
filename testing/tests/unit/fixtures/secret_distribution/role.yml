---
- name: Exercise the production distribution guard
  hosts: consumers
  gather_facts: false
  environment:
    PATH: "{{ lme_fixture_bin }}:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
    LME_FAKE_PODMAN_ROOT: "{{ lme_fake_podman_root }}"
    LME_FAKE_SERVICE_ACTIVE: "{{ lme_fake_service_active | default('0') }}"
  tasks:
    - name: Include production secret distribution role tasks
      ansible.builtin.include_tasks: "{{ lme_repo_root }}/ansible/roles/secrets_distribution/tasks/main.yml"
