---
- name: Exercise scoped secret distribution against synthetic stores
  hosts: consumers
  gather_facts: false
  environment:
    PATH: "{{ lme_fixture_bin }}:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
    LME_FAKE_PODMAN_ROOT: "{{ lme_fake_podman_root }}"
  tasks:
    - name: Include production secret distribution
      ansible.builtin.include_tasks: "{{ lme_repo_root }}/ansible/roles/podman/tasks/distribute_secrets.yml"
