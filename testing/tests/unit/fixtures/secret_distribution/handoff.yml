---
- name: Exercise cluster distribution to post-config handoff
  hosts: consumers
  gather_facts: false
  environment:
    PATH: "{{ lme_fixture_bin }}:{{ ansible_env.PATH | default('/usr/bin:/bin') }}"
    LME_FAKE_PODMAN_ROOT: "{{ lme_fake_podman_root }}"
    LME_FAKE_SERVICE_ACTIVE: "0"
  tasks:
    - name: Include production secret distribution role tasks
      ansible.builtin.include_tasks: "{{ lme_repo_root }}/ansible/roles/secrets_distribution/tasks/main.yml"

    - name: Authenticate synthetic post-config operation with distributed in-memory credentials
      ansible.builtin.command:
        argv:
          - postconfig-auth
        stdin: >-
          {{ {
               'elastic': global_secrets.elastic,
               'kibana_system': global_secrets.kibana_system
             } | to_json }}
        stdin_add_newline: false
      environment:
        LME_FAKE_PODMAN_ROOT: "{{ lme_fake_podman_root }}"
        LME_SECRET_SCOPE_HOST: "{{ inventory_hostname }}"
      changed_when: false
      no_log: true
      diff: false

    - name: Report sanitized post-config handoff receipt
      ansible.builtin.debug:
        msg: >-
          stage=postconfig-auth code=postconfig-authenticated target={{ inventory_hostname }}
          secret_refs=elastic,kibana_system
