---
# cases-c1-iso6-port.yml -- MULTINODE-217-TEMPLATED-PORT-TYPE controls (codex choice a), hand-authored DATA;
# expressions in macros/c1_iso6_port.j2. The REAL manifests/profiles/multinode.yml (no fixture; its ES host port is
# templated and conditional on tailscale_serve_services). Head seed06-final after the PORT commit. Entry =
# load_manifests (site.yml path). Run on BOTH cores (2.19.11 and 2.17.14); the historical 2.17 UNEXPECTED-FAIL
# receipts (8308eee5ad13-reproduction-iso5-mn-217-*) are retained, not rewritten.
# Positives: declared defaults, tailscale on/off, bind overrides (extra-var and inventory), operator port overrides
# as canonical strings and as ints (the override wins over both tailscale branches) -- every declared port leaf a
# STRICT int; undeclared fields (an item's bind, ulimits) never converted; an unchanged reapply resolves the same.
# Negatives here: the REASON for every value the declared rule refuses (non-canonical strings, out of range, bool,
# float, null) and for a malformed declaration, plus a typed lme_resolved pin that the conversion must not make
# acceptable. The build-path location of those refusals is in cases-c1-iso6-port-build-{217,219}.yml (see below).
# DISCLOSED residual (pre-existing, load_manifests.yml "RESIDUAL"): a WHOLE -e lme_services pin is not normalized (the
# build is a no-op under it) and has no read-back anchor; it moves the revision. Not widened or closed here.
schema_version: 1
binds_to: null
loader_entry: {role: podman, tasks_from: load_manifests}
isolated_source:
  files: [ansible/roles/podman/tasks/load_manifests.yml, ansible/roles/podman/tasks/resolve.yml, ansible/roles/podman/tasks/validate_resolved_config.yml,
          ansible/roles/podman/defaults/main.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, ansible/site.yml,
          testing/remote_harness/templates/lme-controller-seed.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2]
  trees: [manifests]
play_vars_source: {file: ansible/site.yml, play_index: 0, restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]}
task_names:
  build: &T_BUILD "Build lme_services map (service | profile.services[id] | effective override[id] LAST)"
  readback: &T_RB "Read-back guard -- reject an -e-pinned resolution / resolved config / origins / revision (untamperable)"
fixtures: {}
cases:
  # ---- positives (strict int output) ----
  - name: pt-default-ports-int
    kind: control
    profile: multinode
    expected_now: pass
    invariant_task: "port: declared defaults publish strict int ports on every core"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_default') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('unrelated_untouched') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('revision_hex') }}"
    dump_vars: [lme_services, lme_resolved_revision]
  - name: pt-reapply-stable
    kind: profile_switch
    profile: multinode
    initial_profile: multinode
    switch_to: multinode
    expected_now: pass
    invariant_task: "port: an unchanged reapply resolves the same strict int ports"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_default') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
    dump_vars: [lme_services, lme_resolved_revision]
  - name: pt-tailscale-on-int
    kind: control
    profile: multinode
    extra_vars: {tailscale_serve_services: true}
    expected_now: pass
    invariant_task: "port: tailscale serve branch -> backend 127.0.0.1:19200 (tailnet 9200), strict int"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_tailscale') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
    dump_vars: [lme_services, lme_resolved_revision]
  - name: pt-tailscale-off-explicit-int
    kind: control
    profile: multinode
    extra_vars: {tailscale_serve_services: false}
    expected_now: pass
    invariant_task: "port: tailscale explicitly off -> the default branch, strict int"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_default') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
    dump_vars: [lme_services, lme_resolved_revision]
  - name: pt-bind-override-extravar
    kind: control
    profile: multinode
    extra_vars: {fleet_output_bind_address: 100.70.80.90}
    expected_now: pass
    invariant_task: "port: an extra-var bind address composes; the port stays a strict int"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_bind', '100.70.80.90') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
  - name: pt-bind-override-inventory
    kind: control
    profile: multinode
    inventory_vars: {fleet_output_bind_address: 100.70.80.92}
    expected_now: pass
    invariant_task: "port: an inventory bind address composes; the port stays a strict int"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('mn_bind', '100.70.80.92') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
  - name: pt-override-canonical-strings
    kind: control
    profile: multinode
    extra_vars:
      lme_service_overrides:
        elasticsearch:
          publish_ports: [{host: '9300', container: '9200', bind: '9200', tailnet_port: '9200', serve: tcp}]
    expected_now: pass
    invariant_task: "port: an operator override's canonical decimal strings bind as ints (declared fields only; bind stays a string)"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('override_string') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
    dump_vars: [lme_services, lme_resolved_revision]
  - name: pt-override-int-wins-over-tailscale
    kind: control
    profile: multinode
    extra_vars: {tailscale_serve_services: true}
    inventory_vars:
      lme_service_overrides:
        elasticsearch:
          publish_ports: [{host: 9301, container: 9200, bind: 127.0.0.1}]
    expected_now: pass
    invariant_task: "port: an inventory int override is preserved as the last layer (over the tailscale branch)"
    assert_that:
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('override_int_tailscale') }}"
      - "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('all_ports_int') }}"
  # ---- the ten build-path refusals (REAL build task, before any consumer or revision) are NOT in this file ----
  # ATTRIBUTED CASE SPLIT (core surface, not C1): the build task is a LOOP; the runner records
  # ansible_failed_result.msg. Same case bytes ea808e9f, same head c5dd512b:
  #   c5dd512bb9cf-reproduction-fin-port-219-core2.19.11-20260924T042120Z  -> NOT-REJECTED x10: failed_task == Build,
  #     msg is only the aggregate "One or more items failed" (the item's filter error is not in msg)
  #   c5dd512bb9cf-reproduction-fin-port-217-core2.17.14-20260924T042643Z  -> REJECTED-as-expected x10: failed_task ==
  #     Build, msg is "the field 'args' has an invalid value (...)" embedding the EXACT filter error; the aggregate
  #     text is absent from that run's retained output
  # Both runs are retained, not rewritten. No single substring is common to both cores, so the build-path cases live in
  # core-declared files, each run ONLY on its declared core:
  #   cases-c1-iso6-port-build-217.yml  needle = the EXACT reason (2.17 surfaces it on the build path)
  #   cases-c1-iso6-port-build-219.yml  needle = the aggregate (2.19 surfaces only WHERE, not WHY)
  # The REASON on BOTH cores is proven by the pt-reason-* controls below (same filter, same loaded registry, same
  # values, non-loop evaluation). The 2.19 aggregate needle never stands in for the reason.
  # ---- the REASON for each refusal (paired with the core-declared build-path cases) ----
  - &WHY
    name: pt-reason-leading-zero
    kind: control
    profile: multinode
    expected_now: reject
    invariant_task: &V_WHY "port reason: the declared typed-input rule refuses this value"
    expected_failed_task: *V_WHY
    boundary_msg: "elasticsearch.publish_ports[0].host = '09200' (str) is not a canonical decimal"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', \"'09200'\") }}"]
  - <<: *WHY
    name: pt-reason-signed
    boundary_msg: "elasticsearch.publish_ports[0].host = '+9200' (str) is not a canonical decimal"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', \"'+9200'\") }}"]
  - <<: *WHY
    name: pt-reason-space
    boundary_msg: "elasticsearch.publish_ports[0].host = ' 9200' (str) is not a canonical decimal"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', \"' 9200'\") }}"]
  - <<: *WHY
    name: pt-reason-decimal-point-string
    boundary_msg: "elasticsearch.publish_ports[0].host = '9200.0' (str) is not a canonical decimal"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', \"'9200.0'\") }}"]
  - <<: *WHY
    name: pt-reason-out-of-range
    boundary_msg: "elasticsearch.publish_ports[0].host = 70000 is outside the declared range 1..65535"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', '70000') }}"]
  - <<: *WHY
    name: pt-reason-zero
    boundary_msg: "elasticsearch.publish_ports[0].container = 0 is outside the declared range 1..65535"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_container', '0') }}"]
  - <<: *WHY
    name: pt-reason-bool
    boundary_msg: "elasticsearch.publish_ports[0].host = True (bool) is not a declared integer input"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', 'true') }}"]
  - <<: *WHY
    name: pt-reason-float
    boundary_msg: "elasticsearch.publish_ports[0].host = 9200.5 (float) is not a declared integer input"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', '9200.5') }}"]
  - <<: *WHY
    name: pt-reason-null
    boundary_msg: "elasticsearch.publish_ports[0].host = None (NoneType) is not a declared integer input"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_host', 'none') }}"]
  - <<: *WHY
    name: pt-reason-decl-max-string
    boundary_msg: "registry service_input_types.publish_ports must be {item_int_fields, canonical_regex, min, max}"
    assert_that: ["{% import 'macros/c1_iso6_port.j2' as m %}{{ m.check('reason_decl_max_string') }}"]
  # ---- the conversion never makes a typed lme_resolved pin acceptable ----
  - name: pt-typed-resolved-pin-refused
    kind: control
    profile: multinode
    extra_vars: {lme_resolved: "{% import 'macros/c1_iso6_port.j2' as m %}{{ m.pin('bool_as_string') }}"}
    expected_now: reject
    expected_failed_task: *T_RB
    boundary_msg: "a resolver output fact"
