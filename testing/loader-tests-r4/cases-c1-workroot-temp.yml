---
# cases-c1-workroot-temp.yml -- RH-NESTED-PROBE-EXECUTOR-C1-JOIN controls (codex 144541), hand-authored DATA.
# The nested probe runs the DECLARED probe binary under env -i; one_case.yml builds its environment as
#   case.ambient_env < lme_resolved_run.env < fixed scrub < per-case temp roots (<casedir>/tmp, /atmp, /rtmp).
# These cases prove ACTUAL path behaviour (a real ansible.builtin.tempfile through the library default dir, and the
# temp dirs ansible itself resolves), not the absence of literal /tmp text.
# The conflicting ambient values name a root that does NOT exist (/nonexistent-lme-ambient): if any of them leaked,
# the tempfile task itself would fail (a visible, differently-attributed failure), and nothing is written to /tmp.
# C1-WORKROOT-REMOTE-TMP-LOOKUP (codex 150309, ATTRIBUTED): remote_tmp is a SHELL-plugin option (doc_fragments/shell_common.py
# remote_tmp; env ANSIBLE_REMOTE_TEMP / ANSIBLE_REMOTE_TMP, ini defaults.remote_tmp, var ansible_remote_tmp), not a core
# key; the earlier lookup of 'DEFAULT_REMOTE_TMP' (a0e341e, lines 57/71) is replaced by the plugin-option lookup for the
# selected local-connection shell plugin 'sh', error-on-missing (no default). The actual tempfile-path assertions stay.
# ROUTE 814cf6a REBIND (ATTRIBUTED): the seed's lme_resolved_run.env now records ANSIBLE_HOME (the run's ansible home);
# one_case.yml makes it per-case (<casedir>/ansible-home) like the temp roots, asserted in both positive cases and
# injected as a conflicting ambient value.
# A conflicting ambient value in the RUNNER's own environment is refused by run_loader_tests.yml before any case
# (every lme_resolved_run.env item must equal the runner's environment); that refusal is a run-level gate, not a case.
# Bindings, inventory and base are the passing endpoint baseline's (cases-c1-iso6-endpoint.yml, e3f80ebe), unchanged.
schema_version: 1
binds_to: null
loader_entry: {role: podman, tasks_from: resolve}
isolated_source:
  files: [ansible/roles/podman/tasks/load_manifests.yml, ansible/roles/podman/tasks/resolve.yml, ansible/roles/podman/tasks/validate_resolved_config.yml,
          ansible/roles/podman/defaults/main.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, ansible/site.yml,
          testing/remote_harness/templates/lme-controller-seed.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2]
  trees: [manifests]
play_vars_source: {file: ansible/site.yml, play_index: 0, restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]}

hosts:
  ok: &HOSTS
    localhost: {ansible_connection: local}
    t1: {ansible_connection: local, ansible_host: 10.0.0.1, ansible_port: 2222, lme_toolchain_owner: u1}
    t2: {ansible_connection: local, ansible_host: Host-B, ansible_ssh_common_args: '-o ProxyJump=jump@j1', lme_toolchain_owner: u2}
  groups: &GROUPS {lme_toolchain_targets: [t1, t2]}
ambient:
  conflicting: &AMBIENT
    TMPDIR: /nonexistent-lme-ambient/tmpdir
    TMP: /nonexistent-lme-ambient/tmp
    TEMP: /nonexistent-lme-ambient/temp
    ANSIBLE_LOCAL_TEMP: /nonexistent-lme-ambient/local
    ANSIBLE_REMOTE_TMP: /nonexistent-lme-ambient/remote
    ANSIBLE_HOME: /nonexistent-lme-ambient/ansible-home
base: &BASE
  kind: control
  profile: remote-harness
  inventory_hosts: *HOSTS
  inventory_groups: *GROUPS
  probe_hosts: all
  expected_outcome_hosts: [localhost, t1, t2]
  tempfile_probe: true
fixtures: {}

cases:
  - <<: *BASE
    name: wrt-resolved-env-temp-under-casedir
    expected_now: pass
    invariant_task: "workroot-temp: the probe's temp roots and an actual temp file are under the case dir"
    assert_that:
      - "lookup('ansible.builtin.env', 'HOME') == clone_directory"
      - "lookup('ansible.builtin.env', 'ANSIBLE_HOME') == clone_directory ~ '/ansible-home'"
      - "lookup('ansible.builtin.env', 'TMPDIR') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'TMP') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'TEMP') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'ANSIBLE_LOCAL_TEMP') == clone_directory ~ '/atmp'"
      - "lookup('ansible.builtin.env', 'ANSIBLE_REMOTE_TMP') == clone_directory ~ '/rtmp'"
      - "lookup('ansible.builtin.config', 'remote_tmp', plugin_type='shell', plugin_name='sh') == clone_directory ~ '/rtmp'"
      - "(lookup('ansible.builtin.config', 'DEFAULT_LOCAL_TMP') ~ '/') is match('^' ~ ((clone_directory ~ '/atmp/') | regex_escape))"
      - "_lme_case_tempfile.path is match('^' ~ ((clone_directory ~ '/tmp/') | regex_escape))"
  - <<: *BASE
    name: wrt-ambient-conflict-temp-under-casedir
    ambient_env: *AMBIENT
    expected_now: pass
    invariant_task: "workroot-temp: conflicting ambient temp settings lose; temp roots and an actual temp file stay under the case dir"
    assert_that:
      - "lookup('ansible.builtin.env', 'ANSIBLE_HOME') == clone_directory ~ '/ansible-home'"
      - "lookup('ansible.builtin.env', 'TMPDIR') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'TMP') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'TEMP') == clone_directory ~ '/tmp'"
      - "lookup('ansible.builtin.env', 'ANSIBLE_LOCAL_TEMP') == clone_directory ~ '/atmp'"
      - "lookup('ansible.builtin.env', 'ANSIBLE_REMOTE_TMP') == clone_directory ~ '/rtmp'"
      - "lookup('ansible.builtin.config', 'remote_tmp', plugin_type='shell', plugin_name='sh') == clone_directory ~ '/rtmp'"
      - "(lookup('ansible.builtin.config', 'DEFAULT_LOCAL_TMP') ~ '/') is match('^' ~ ((clone_directory ~ '/atmp/') | regex_escape))"
      - "_lme_case_tempfile.path is match('^' ~ ((clone_directory ~ '/tmp/') | regex_escape))"
      - "not (_lme_case_tempfile.path is match('^/nonexistent-lme-ambient/'))"
  # negative control: the path assertion really evaluates the created file's path. Reached only when the tempfile
  # task SUCCEEDED (under the case dir); a leaked ambient root would fail the tempfile task instead (NOT-REPRODUCED).
  - <<: *BASE
    name: wrt-ambient-root-not-used-control
    ambient_env: *AMBIENT
    expected_now: fail
    invariant_task: "workroot-temp control: the actual temp file is under the ambient root"
    fail_msg: "C1-WORKROOT-TEMP-CONTROL actual temp file is not under the ambient root"
    assert_that:
      - "_lme_case_tempfile.path is match('^/nonexistent-lme-ambient/')"
