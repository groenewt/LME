          # -- asserted BEFORE the record is parsed (the parse below is reached only through these, in order) -- and the
          # parsed record is the PASS readback of exactly the R bytes this runner read
          - ('readback' not in _a) or (_a.readback is mapping and (_a.readback.keys() | map('string') | sort | list) == ['path', 'sha256'])
          - ('readback' not in _a) or (_a.readback.path == managed_bootstrap_review_components[4])
          - ('readback' not in _a) or ((review_raw.results[1].content | b64decode | hash('sha256')) == _a.readback.sha256)
          - ('readback' not in _a) or (review_path_stat.results[4].stat.checksum == _a.readback.sha256)
          - ('readback' not in _a) or ((review_raw.results[1].content | b64decode | from_yaml) is mapping)
          - ('readback' not in _a) or ((review_raw.results[1].content | b64decode | from_yaml).verdict | default('') == 'PASS')
          - ('readback' not in _a) or ((review_raw.results[1].content | b64decode | from_yaml).receipt.sha256 | default('') == (receipt_raw.content | b64decode | hash('sha256')))
        fail_msg: >-
          review artifact A {{ managed_bootstrap_review_path }} is not a schema_version {{ _vc.schema_version }} {{ _vc.kind }}
          with exactly {{ _vc.required_keys }} (+ optional {{ _vc.optional_keys }}), message_id ==
          {{ managed_bootstrap_catalog_entry.review.message_id }}, receipt_sha256 == the measured R digest
          {{ receipt_stat.stat.checksum | default('?') }} and decision == {{ _vc.accepted_decision }}; or its `readback`
          is not {path: {{ managed_bootstrap_review_components[4] | default('?') }}, sha256: <the bytes read of that PASS
          readback of this R>}; got {{ _a | to_json }} (codex-tick337 / tick348 RUN-4)
      when: interpreter_policy == 'managed_only'

    - name: "r4 -- bind every selected executable (path + sha256) to the accepted bootstrap receipt"
      vars:
        _rc: "{{ (managed_bootstrap_catalog_raw.content | b64decode | from_yaml).receipt_contract }}"
        # the SAME single read whose decoded bytes were bound to the accepted digest above (C1 G2 rename: managed_receipt_doc,
        # managed_measured, managed_measured_path are reserved_outputs; the generic receipt / measured / measured_path are not)
        managed_receipt_doc: "{{ receipt_raw.content | b64decode | from_yaml }}"
        managed_measured: >-
          {{ dict(['probe_ansible_playbook', 'probe_python', 'runner_python']
                  | zip(exec_stat.results | map(attribute='stat'))) }}
        managed_measured_path:
          probe_ansible_playbook: "{{ probe_ansible_playbook }}"
          probe_python: "{{ interpreter_resolved.probe_python | default(interpreter_declared.probe_python, true) }}"
          runner_python: "{{ interpreter_resolved.runner_python | default(interpreter_declared.runner_python, true) }}"
      ansible.builtin.assert:
        that:
          - managed_receipt_doc.executables[item] is mapping
          - (managed_receipt_doc.executables[item].keys() | map('string') | sort | list) == (_rc.executable_fields | sort | list)
          # CHANGED EXECUTABLE: the measured path and bytes must be exactly the receipt's
          - managed_receipt_doc.executables[item].path == managed_measured_path[item]
          - managed_receipt_doc.executables[item].sha256 == managed_measured[item].checksum
          - managed_receipt_doc.executables[item].path is match('^' ~ (managed_receipt_doc.managed_root | regex_escape) ~ '/')
        fail_msg: >-
          {{ item }} measured {{ managed_measured_path[item] }} sha256 {{ managed_measured[item].checksum | default('?') }} does not
          match the accepted bootstrap receipt {{ managed_bootstrap_receipt }} ({{ managed_receipt_doc.executables[item] | default('absent') }},
          managed root {{ managed_receipt_doc.managed_root | default('?') }}) (R3-MANAGED-IDENTITY)
      loop: [probe_ansible_playbook, probe_python, runner_python]
      when: interpreter_policy == 'managed_only'

    - name: Enumerate the manifests input tree with sha256 checksums (find module; no shell)
      ansible.builtin.find:
        paths: "{{ repo_root }}/manifests"
        recurse: true
        file_type: file
        hidden: true
        get_checksum: true
        checksum_algorithm: sha256
      register: manifests_found

    # Roster = every file under this directory the runner or one_case.yml reads. macros/key_remove.j2 is consumed by
    # one_case.yml (key_remove present/remove lookups; codex-tick335-336 C1-KEY-REMOVE-INSTRUMENT-REPORT). NOT listed:
    # macros/bootstrap_receipt.j2, project_bootstrap_receipt.yml and readback_bootstrap_receipt.yml -- never read by
    # this runner (they are the bootstrap_receipt / _readback runners' own playbook and template; their output R is
    # bound here by its exact bytes, and A by its locator + bytes, recorded in consumed_inputs below).
    - name: Hash every instrument file actually used by this run
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/{{ item }}"
        checksum_algorithm: sha256
      register: instrument_stat
      loop: [run_loader_tests.yml, one_case.yml, macros/probe.j2, macros/manifest_digest.j2, macros/classify.j2,
             macros/diff.j2, macros/dump_integrity.j2, macros/key_remove.j2, fixture_config.yml, managed-bootstrap-receipts.yml,
             "{{ cases_file }}"]

    - name: sha256 of loader inputs BEFORE the run (source-unchanged baseline)
      ansible.builtin.stat: {path: "{{ repo_root }}/{{ item }}", checksum_algorithm: sha256}
      register: src_before
      loop: "{{ isolated_source.files }}"

    - name: Publish evidence facts + a source/version-bound run id
      ansible.builtin.set_fact:
        manifests_tree: >-
          {{ dict(manifests_found.files | map(attribute='path') | map('regex_replace', '^' ~ (repo_root | regex_escape) ~ '/', '')
                  | zip(manifests_found.files | map(attribute='checksum'))) }}
        instruments: >-
          {{ dict(instrument_stat.results | map(attribute='item') | zip(instrument_stat.results | map(attribute='stat.checksum'))) }}
        src_before_map: "{{ dict(isolated_source.files | zip(src_before.results | map(attribute='stat.checksum') | list)) }}"
        run_id: >-
          {{ head_rev.stdout[:12] }}-{{ run_mode }}-{{ run_label }}-core{{ toolchain.probe_ansible_core }}-{{ run_ts.stdout }}

    # RX-CATALOG-READ roster cross-check: the published instrument digest of the catalog must be the sha256 of exactly the
    # bytes the runner READ, bound and parsed above (a replacement after the bound read shows here, not in evidence).
    - name: "RX-CATALOG-READ -- the instrument roster's catalog digest is the digest of the bytes read and parsed"
      ansible.builtin.assert:
        that:
          - instruments['managed-bootstrap-receipts.yml'] == (managed_bootstrap_catalog_raw.content | b64decode | hash('sha256'))
        fail_msg: >-
          REFUSED RX-CATALOG-READ: the roster records managed-bootstrap-receipts.yml as
          {{ instruments['managed-bootstrap-receipts.yml'] | default('<absent>') }} but the bytes read and parsed hash to
          {{ managed_bootstrap_catalog_raw.content | default('') | b64decode | hash('sha256') }} (catalog replaced after the bound read)
      when: interpreter_policy == 'managed_only'

    # r2 C1-AGGREGATE-MANIFEST-DIGEST: the v6.2 expression joined each dict2items RECORD, and joining a
    # dict joins its KEYS ('key', 'value'), so every same-size manifest set produced the same digest.
    # The canonical serialization now lives in macros/manifest_digest.j2 (shared with the self-test).
    - name: Canonical member serialization of the manifests tree (macros/manifest_digest.j2, path-tab-sha256-v1)
      ansible.builtin.set_fact:
        manifests_digest_render: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/macros/manifest_digest.j2',
                    template_vars={'members': manifests_tree}) | from_json }}

    - name: Refuse an empty, partial or malformed manifests member set
      ansible.builtin.assert:
        that:
          - manifests_tree | length > 0
          - manifests_digest_render.invalid | length == 0
          - manifests_digest_render.count == manifests_tree | length
          - manifests_digest_render.scheme == 'path-tab-sha256-v1'
        fail_msg: "manifests member set not digestable: invalid={{ manifests_digest_render.invalid }} count={{ manifests_digest_render.count }}/{{ manifests_tree | length }}"

    - name: Aggregate digest of the manifests tree = sha256 of the canonical member serialization
      ansible.builtin.set_fact:
        manifests_tree_sha256: "{{ manifests_digest_render.serialization | hash('sha256') }}"
        work: "{{ work_root }}/{{ run_id }}"

    - name: Create the per-run work dir (fresh by construction; prior runs preserved under runs/)
      ansible.builtin.file:
        path: "{{ work }}"
        state: directory

    - name: Retain the raw measured probe --version output
      ansible.builtin.copy:
        dest: "{{ work }}/probe-version.txt"
        content: "{{ probe_version_raw.stdout }}\n"

    - name: "r3 -- consumed-input manifest (everything this run reads; bound into results.yml by sha256)"
      ansible.builtin.set_fact:
        consumed_inputs:
          schema: 1
          run_mode: "{{ run_mode }}"
          source_commit: "{{ source_commit }}"
          baseline_commit: "{{ baseline_commit | default(none) }}"
          executed_checkpoint: "{{ head_rev.stdout }}"
          repo_root: "{{ repo_root }}"
          loader_inputs_sha256: "{{ src_before_map }}"
          entrypoint_play_vars_source: "{{ play_vars_source }}"
          manifests_tree_sha256: "{{ manifests_tree_sha256 }}"
          manifests_tree_digest_scheme: "{{ manifests_digest_render.scheme }}"
          manifests_tree: "{{ manifests_tree }}"
          instruments_sha256: "{{ instruments }}"
          cases_file: "{{ cases_file }}"
          executables: >-
            {{ dict(['probe_ansible_playbook', 'probe_python', 'runner_python']
                    | zip(exec_stat.results | map(attribute='stat')
                          | map('dict2items') | map('selectattr', 'key', 'in', ['path', 'lnk_source', 'checksum', 'exists'])
                          | map('items2dict'))) }}
          declared_toolchain:
            runner_ansible_core: "{{ expected_runner_ansible_core }}"
            probe_ansible_core: "{{ expected_probe_ansible_core }}"
            probe_python_executable: "{{ expected_probe_python_executable }}"
            probe_python_version: "{{ expected_probe_python_version }}"
          measured_toolchain: "{{ toolchain }}"
          interpreter_policy: "{{ interpreter_policy }}"
          managed_interpreter_root: "{{ managed_interpreter_root }}"
          interpreters_resolved: "{{ interpreter_resolved }}"
          managed_bootstrap_receipt: >-
            {{ {'path': managed_bootstrap_receipt, 'sha256': managed_bootstrap_receipt_sha256,
                'read_sha256': receipt_raw.content | b64decode | hash('sha256')}
               if interpreter_policy == 'managed_only' else none }}
          # codex-tick332 F3: the detached review metadata of the matched catalog entry (evidence; not a measured value)
          managed_bootstrap_catalog_entry: "{{ managed_bootstrap_catalog_entry if interpreter_policy == 'managed_only' else none }}"
          # codex-tick337: the review artifact A actually read (resolved path + its measured bytes digest), and (RUN-4) the
          # readback record beside it as read
          managed_bootstrap_review: >-
            {{ {'locator': managed_bootstrap_catalog_entry.review.locator, 'path': managed_bootstrap_review_path,
                'sha256': review_raw.results[0].content | b64decode | hash('sha256'),
                'stat_sha256': review_path_stat.results[3].stat.checksum,
                'readback': {'path': managed_bootstrap_review_components[4],
                             'sha256': review_raw.results[1].content | b64decode | hash('sha256'),
                             'stat_sha256': review_path_stat.results[4].stat.checksum}}
               if interpreter_policy == 'managed_only' else none }}
          # RUN-1 preflight binding (codex-tick348 RUN_1 "bind the actual resolver/global/profile inputs"): the policy the
          # review location was read from -- its engine revisions and the profile bytes -- plus the include itself (its
          # bytes are bound by the clean source_commit checkout checked above)
          runner_policy_preflight: >-
            {{ {'include': 'testing/remote_harness/tasks/resolve_policy.yml', 'policy_sha256': rh_config_revision,
                'lme_resolved_revision': rh_engine_revision, 'profile_sha256': rh_profile_sha256}
               if interpreter_policy == 'managed_only' else none }}
          qualifies_leg: "{{ interpreter_policy == 'managed_only' }}"
          # RH-RUNNER-RESOLVED-WORKROOT: the resolved run input this run consumed (receipt measured above)
          resolved_run: "{{ lme_resolved_run }}"
          resolved_run_receipt_measured_sha256: "{{ resolved_run_receipt_stat.stat.checksum }}"

    - name: "r3 -- write consumed-inputs.yml"
      ansible.builtin.copy:
        dest: "{{ work }}/consumed-inputs.yml"
        content: "{{ consumed_inputs | to_nice_yaml(sort_keys=True) }}"

    - name: "r3 -- sha256 of the written consumed-input manifest"
      ansible.builtin.stat: {path: "{{ work }}/consumed-inputs.yml", checksum_algorithm: sha256}
      register: consumed_stat

    - name: Run each case
      ansible.builtin.include_tasks: one_case.yml
      loop: "{{ cases }}"
      loop_control: {loop_var: case, label: "{{ case.name }}"}

    - name: sha256 of loader inputs AFTER the run
      ansible.builtin.stat: {path: "{{ repo_root }}/{{ item }}", checksum_algorithm: sha256}
      register: src_after
      loop: "{{ isolated_source.files }}"

    - name: Assert loader inputs unchanged by the run
      ansible.builtin.assert:
        that: "src_before_map == dict(isolated_source.files | zip(src_after.results | map(attribute='stat.checksum') | list))"
        fail_msg: "a loader input changed during the run (source not read-only)"

    - name: Write results.yml (source-, instrument- and version-bound)
      ansible.builtin.copy:
        dest: "{{ work }}/results.yml"
        content: >-
          {{ {'run_id': run_id, 'repo_root': repo_root, 'head': head_rev.stdout,
              'run_mode': run_mode, 'source_commit': source_commit, 'baseline_commit': baseline_commit | default(none),
              'executed_checkpoint': head_rev.stdout,
              'interpreter_policy': interpreter_policy, 'qualifies_leg': (interpreter_policy == 'managed_only'),
              'consumed_inputs_sha256': consumed_stat.stat.checksum,
              'work_root': work_root, 'resolved_run': lme_resolved_run,
              'worktree_dirty': (git_porcelain.stdout_lines | length > 0),
              'git_status_porcelain': git_porcelain.stdout_lines, 'toolchain': toolchain,
              'cases_file': cases_file, 'instruments_sha256': instruments,
              'site_flag_playvars_derived_from_entrypoint': site_flag_playvars,
              'manifests_tree_sha256': manifests_tree_sha256,
              'manifests_tree_digest_scheme': manifests_digest_render.scheme,
              'manifests_tree': manifests_tree,
              'probe_fixture': probe_fixture,
              'loader_inputs_before': src_before_map, 'loader_inputs_unchanged_after': true,
              'results': results} | to_nice_yaml }}

    - name: Update the runs/LATEST pointer (convenience; each run is preserved by run_id)
      ansible.builtin.copy:
        dest: "{{ work_root }}/LATEST"
        content: "{{ run_id }}\n"

    - name: Summary line per case
      ansible.builtin.debug:
        msg: "{{ '%-48s expected=%-7s rc=%-3s verdict=%s' | format(item.case, item.expected_now, item.probe_rc, item.verdict) }}"
      loop: "{{ results }}"
      loop_control: {label: "{{ item.case }}"}

    - name: Overall gate -- every case at its expected verdict (fail-closed)
      ansible.builtin.assert:
        that:
          - "results | length == cases | length"
          - "results | selectattr('verdict', 'in', ['PASS','XFAIL-as-expected','REJECTED-as-expected']) | list | length == results | length"
        fail_msg: >-
          loader-test suite has off-expectation verdicts:
          {{ results | rejectattr('verdict', 'in', ['PASS','XFAIL-as-expected','REJECTED-as-expected']) | map(attribute='case') | list }}
        success_msg: "all {{ results | length }} loader cases at expected verdict ({{ run_id }})"
