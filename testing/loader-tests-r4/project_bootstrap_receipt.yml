---
# testing/loader-tests-r4/project_bootstrap_receipt.yml -- APPLY ADAPTER, projection half (codex-tick332 apply_adapter
# + F3). Projects the managed interpreter bootstrap receipt R (managed-bootstrap-receipts.yml receipt_contract,
# schema 2) from the SEALED installation receipt of the generation this runner was launched with,
# <generation>/<layout.receipts_dir>/toolchain.json (lme_resolved_run.receipt, schema toolchain_receipt_schema), plus the
# ACTUAL executables measured here. Never from an acquisition receipt (archives fetched is not installation) and never
# from a directory name: every claim of toolchain.json is compared with an independent measurement first, and R's
# `executables` are built from the measurements only. R carries NO review of itself (codex-tick332 F3: the review is the
# detached accepted-catalog entry). The independent re-measurement is the SEPARATE runner bootstrap_receipt_readback
# (readback_bootstrap_receipt.yml); this play never reads that one's values, and that one never reuses these.
# Launched ONLY by the declared seed, started by the bundle's generated launcher:
#   <bundle>/lme-seed-launch.sh run-local <checkout>/.work/toolchain bootstrap_receipt -e br_label=<attempt>
#     -e br_source_commit=<40-hex commit the checkout must be clean at> (RX-CATALOG-READ; C1 PROPOSAL: required_inputs)
#   (controller.bootstrap.seed_launcher.caller_argv -- the mode_args' `--` is the LAUNCHER's word, never the caller's;
#   work_roots.run_local.runners.bootstrap_receipt), which supplies
# br_work_root and, LAST, lme_resolved_run; no default work root, no raw-profile read for one.
# Output (write-once, 0400): <br_work_root>/<br_label>/managed-bootstrap-receipt.yml; its sha256 is printed last.
# Refusal: RH-BOOTSTRAP-RECEIPT-PROJECTION (every assert; nothing is written before the last one passes).
- name: Project the managed interpreter bootstrap receipt from the sealed generation receipt (route-owned)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs and derive the repository root
      ansible.builtin.include_tasks: ../remote_harness/tasks/refuse_pinned_outputs.yml

    - name: Resolve the harness policy through the engine
      ansible.builtin.include_tasks: ../remote_harness/tasks/resolve_policy.yml

    - name: Admit the resolved run and the attempt label (declared seed run-local --runner bootstrap_receipt)
      vars:
        _rs: "{{ rh.controller.bootstrap.work_roots.run_local.resolved_run }}"
        _att: "{{ rh.controller.bootstrap.genesis.seed_step_record.attempt }}"
      ansible.builtin.assert:
        that:
          - lme_resolved_run is defined and lme_resolved_run is mapping
          - (lme_resolved_run.keys() | map('string') | sort | list) == (_rs.fields | sort | list)
          - lme_resolved_run.runner == 'bootstrap_receipt'
          - br_work_root is defined and br_work_root is string and br_work_root == lme_resolved_run.work_root
          - br_work_root is match(rh.controller.bootstrap.path_admission.regex)
          - "'TMPDIR' in lme_resolved_run.env"
          - lme_resolved_run.receipt is mapping
          - (lme_resolved_run.receipt.keys() | map('string') | sort | list) == (_rs.receipt_fields | sort | list)
          - lme_resolved_run.receipt.path is string and lme_resolved_run.receipt.path is match(rh.controller.bootstrap.path_admission.regex)
          - lme_resolved_run.receipt.sha256 is string and lme_resolved_run.receipt.sha256 is match('^[0-9a-f]{64}$')
          - ansible_playbook_python == lme_resolved_run.python
          - _att.match == 'fullmatch'
          - br_label is defined and br_label is string and br_label is ansible.builtin.regex(_att.regex, match_type=_att.match)
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: project_bootstrap_receipt.yml runs only under the declared seed
          run-local (--runner bootstrap_receipt), which passes br_work_root and {{ _rs.var }} (fields {{ _rs.fields }}),
          with -e br_label=<attempt> matching {{ _att.regex }} as a {{ _att.match }}.
        quiet: true

    - name: Derive the DECLARED locations of this run's generation (from the resolved run and the policy; nothing inferred)
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _gen: "{{ lme_resolved_run.receipt.path | dirname | dirname }}"
      ansible.builtin.set_fact:
        _rh_br_loc:
          receipt: "{{ lme_resolved_run.receipt.path }}"
          gen: "{{ _gen }}"
          # the declared seed root and its generations dir (run-local requires root == <work root>/<sub_roots.toolchain>)
          generations: "{{ rh_repo_root ~ '/' ~ _bs.work_roots.root_rel ~ '/' ~ _bs.work_roots.sub_roots.toolchain ~ '/' ~ _bs.layout.generations_dir }}"
          toolchain_root: "{{ rh_repo_root ~ '/' ~ _bs.work_roots.root_rel ~ '/' ~ _bs.work_roots.sub_roots.toolchain }}"
          venv_bin: "{{ _gen ~ '/' ~ _bs.layout.gen_dirs.venv ~ '/bin' }}"
          interpreter: "{{ _gen ~ '/' ~ _bs.python.interpreter_rel }}"
          config: "{{ _gen ~ '/' ~ _bs.layout.config_file }}"
          receipts_dir: "{{ _gen ~ '/' ~ _bs.layout.receipts_dir }}"
          label_dir: "{{ br_work_root ~ '/' ~ br_label }}"
          out: "{{ br_work_root ~ '/' ~ br_label ~ '/managed-bootstrap-receipt.yml' }}"

    - name: Refuse a resolved-run receipt that is not the sealed toolchain.json of a generation under the declared root
      ansible.builtin.assert:
        that:
          - _rh_br_loc.receipt == _rh_br_loc.receipts_dir ~ '/toolchain.json'
          - (_rh_br_loc.gen | dirname) == _rh_br_loc.generations
          - lme_resolved_run.ansible_playbook == _rh_br_loc.venv_bin ~ '/ansible-playbook'
          - lme_resolved_run.python == _rh_br_loc.venv_bin ~ '/python'
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the resolved run's receipt {{ _rh_br_loc.receipt }}, ansible-playbook
          {{ lme_resolved_run.ansible_playbook }} and python {{ lme_resolved_run.python }} must be the sealed receipt and the
          venv executables of ONE generation under {{ _rh_br_loc.generations }}.
        quiet: true

    - name: Refuse an existing output (R is write-once; an attempt label is never reused)
      ansible.builtin.stat: {path: "{{ _rh_br_loc.label_dir }}", follow: false, get_checksum: false}
      register: _rh_br_pre

    - name: Refuse a reused attempt label
      ansible.builtin.assert:
        that: not _rh_br_pre.stat.exists
        fail_msg: "REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: {{ _rh_br_loc.label_dir }} exists; R is write-once (new br_label)."
        quiet: true

    # ---- the producer's claims: the sealed generation receipt, byte-bound ----
    - name: Measure the sealed generation receipt (not followed)
      ansible.builtin.stat: {path: "{{ _rh_br_loc.receipt }}", follow: false, checksum_algorithm: sha256}
      register: _rh_br_tc

    - name: Read the sealed generation receipt
      ansible.builtin.slurp: {src: "{{ _rh_br_loc.receipt }}"}
      register: _rh_br_tc_raw

    # PARSED-BYTE BINDING (codex-tick355; managed-bootstrap-receipts.yml payload_binding_contract): the stat above proves
    # only the inode it measured. The decoded payload of the ONE read above is hashed against the resolved-run digest
    # BEFORE it is parsed (own task; the parse below is reached only through it), so a rename-replacement of
    # toolchain.json between the stat and the read refuses here instead of projecting R from other bytes.
    - name: Bind the bytes READ of the sealed generation receipt to the resolved-run digest BEFORE parsing
      vars:
        _b: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/macros/bootstrap_receipt.j2',
                    template_vars={'op': 'payload_binding', 'content': _rh_br_tc_raw.content | default(none),
                                   'expected': lme_resolved_run.receipt.sha256, 'stat': _rh_br_tc.stat | default(none),
                                   'sealed': true}) | from_json }}
      ansible.builtin.assert:
        that:
          - _b is mapping and _b.op | default('') == 'payload_binding'
          - _b.bound is sameas true
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the bytes read from {{ _rh_br_loc.receipt }} are not the resolved-run
          receipt {{ lme_resolved_run.receipt.sha256 }} (payload_binding {{ _b | to_json }}). Nothing was parsed or written.
        quiet: true

    - name: Parse the producer claims (verbatim; compared with measurements below, never trusted as measurements)
      ansible.builtin.set_fact:
        _rh_br_claims: "{{ _rh_br_tc_raw.content | b64decode | from_json }}"

    - name: Refuse a generation receipt that is not the sealed, declared-schema receipt of this generation
      ansible.builtin.assert:
        that:
          - _rh_br_tc.stat.exists and _rh_br_tc.stat.isreg and not _rh_br_tc.stat.islnk
          - _rh_br_tc.stat.checksum == lme_resolved_run.receipt.sha256
          - not (_rh_br_tc.stat.wusr or _rh_br_tc.stat.wgrp or _rh_br_tc.stat.woth)
          - _rh_br_claims is mapping
          - _rh_br_claims.schema == rh.controller.bootstrap.toolchain_receipt_schema
          - _rh_br_claims.generation_dir == _rh_br_loc.gen
          - _rh_br_claims.generation == (_rh_br_loc.gen | basename)
          - _rh_br_claims.sealed_receipt == _rh_br_loc.receipt
          - _rh_br_claims.root == _rh_br_loc.toolchain_root
          - _rh_br_claims.ansible_playbook == lme_resolved_run.ansible_playbook
          - _rh_br_claims.python == lme_resolved_run.python
          - _rh_br_claims.interpreter == _rh_br_loc.interpreter
          - _rh_br_claims.ansible_config == _rh_br_loc.config
          - _rh_br_claims.python_version == rh.controller.bootstrap.python.version
          - _rh_br_claims.ansible_playbook_sha256 is match('^[0-9a-f]{64}$') and _rh_br_claims.interpreter_sha256 is match('^[0-9a-f]{64}$')
          - _rh_br_claims.seed_sha256 is match('^[0-9a-f]{64}$') and _rh_br_claims.ansible_config_sha256 is match('^[0-9a-f]{64}$')
          - _rh_br_claims.tree_manifest_sha256 is match('^[0-9a-f]{64}$') and _rh_br_claims.tree_list_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: {{ _rh_br_loc.receipt }} (measured {{ _rh_br_tc.stat.checksum | default('<absent>') }},
          resolved {{ lme_resolved_run.receipt.sha256 }}, writable {{ _rh_br_tc.stat.wusr | default('?') }}) is not the sealed
          {{ rh.controller.bootstrap.toolchain_receipt_schema }} receipt of generation {{ _rh_br_loc.gen }} with the
          declared executables: {{ _rh_br_claims | default({}) | to_json }}
        quiet: true

    # ---- independent measurements (actual installed bytes; never copied from the claims) ----
    - name: Measure the generation's ansible-playbook, venv python (link), interpreter, config and seals (not followed)
      ansible.builtin.stat: {path: "{{ item }}", follow: false, checksum_algorithm: sha256}
      loop:
        - "{{ _rh_br_loc.venv_bin }}/ansible-playbook"
        - "{{ lme_resolved_run.python }}"
        - "{{ _rh_br_loc.interpreter }}"
        - "{{ _rh_br_loc.config }}"
        - "{{ _rh_br_loc.receipts_dir }}/tree.sha256"
        - "{{ _rh_br_loc.receipts_dir }}/tree.list"
        - "{{ _rh_br_claims.seed_path }}"
        - "{{ (_rh_br_claims.seed_path | dirname) ~ '/' ~ rh.controller.bootstrap.bundle.manifest_file }}"
      register: _rh_br_st

    - name: Measure the venv python as the loader does (links followed -- the bytes it executes)
      ansible.builtin.stat: {path: "{{ lme_resolved_run.python }}", follow: true, checksum_algorithm: sha256}
      register: _rh_br_pyf

    - name: Measure the running interpreter (the generation's own module python; read-only)
      ansible.builtin.setup:
        gather_subset: ['!all', '!min', 'python']

    - name: Read the bundle manifest the seed was published with
      ansible.builtin.slurp: {src: "{{ (_rh_br_claims.seed_path | dirname) ~ '/' ~ rh.controller.bootstrap.bundle.manifest_file }}"}
      register: _rh_br_bm_raw

    # PARSED-BYTE BINDING (codex-tick355): the bundle manifest is recorded in R by its measured digest (_rh_br_st item 7,
    # stat'ed before this read); the decoded payload of the ONE read above must hash to exactly that digest before its
    # fields (schema, seed_sha256, expected_generation, profile_sha256, source) are parsed into R's `bootstrap` block.
    - name: Bind the bytes READ of the bundle manifest to its measured digest BEFORE parsing
      vars:
        _b: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/macros/bootstrap_receipt.j2',
                    template_vars={'op': 'payload_binding', 'content': _rh_br_bm_raw.content | default(none),
                                   'expected': _rh_br_st.results[7].stat.checksum | default(''),
                                   'stat': _rh_br_st.results[7].stat | default(none), 'sealed': false}) | from_json }}
      ansible.builtin.assert:
        that:
          - _b is mapping and _b.op | default('') == 'payload_binding'
          - _b.bound is sameas true
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the bytes read from the bundle manifest beside
          {{ _rh_br_claims.seed_path }} are not the bytes it measured (payload_binding {{ _b | to_json }}). Nothing was written.
        quiet: true

    - name: Measure the declared git tool before using it (identity)
      ansible.builtin.stat: {path: "{{ rh.controller.bootstrap.os_tools.git.path }}", follow: false, checksum_algorithm: sha256}
      register: _rh_br_git

    - name: Refuse an undeclared git tool
      ansible.builtin.assert:
        that:
          - _rh_br_git.stat.exists and _rh_br_git.stat.isreg and not _rh_br_git.stat.islnk
          - _rh_br_git.stat.checksum == rh.controller.bootstrap.os_tools.git.identity.sha256
        fail_msg: "REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: {{ rh.controller.bootstrap.os_tools.git.path }} is not the declared git (os_tools.git.identity)"
        quiet: true

    - name: Measure the source checkout commit and tree (read-only)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.git.path }}", -C, "{{ rh_repo_root }}", rev-parse, HEAD, 'HEAD^{tree}']
      register: _rh_br_head
      changed_when: false

    - name: Measure the source checkout status
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.git.path }}", -C, "{{ rh_repo_root }}", status, --porcelain]
      register: _rh_br_status
      changed_when: false

    # ---- RX-CATALOG-READ (codex-tick368): the catalog, read ONCE and bound to an independently admitted revision ----
    # No existing admission of this play establishes HEAD as an expected revision (lme_resolved_run carries no revision:
    # profile resolved_run.fields [runner, work_root, ansible_playbook, python, env, receipt]; rh_engine_revision is the
    # config-only lme_resolved_revision; the bundle manifest's source.repo_head is bound only to its own stat). So the
    # anchor is a NEW declared input br_source_commit (40-hex; C1 PROPOSAL: runners.bootstrap_receipt.required_inputs
    # [br_label, br_source_commit] -- lands atomically). The checkout must be CLEAN at exactly br_source_commit (the
    # measured HEAD above is compared to it, never used as the anchor), and the catalog bytes READ once
    # (hash-object --no-filters --stdin) must be the regular-file blob ls-tree of br_source_commit records at the same
    # path. The catalog declares no digest of itself (no admission cycle). R's source.commit (rendered from the
    # measured HEAD) therefore equals the admitted br_source_commit -- the anchor readback_bootstrap_receipt.yml uses.
    - name: "RX-CATALOG-READ -- read the catalog ONCE (the bytes every catalog check below parses)"
      ansible.builtin.slurp: {src: "{{ rh_repo_root ~ '/' ~ ((playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root)) }}"}
      register: _rh_br_catraw
      failed_when: false

    - name: "RX-CATALOG-READ -- the object the admitted br_source_commit records at the catalog path (read-only; never HEAD)"
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.git.path }}", -C, "{{ rh_repo_root }}", ls-tree, --full-tree,
               "{{ br_source_commit }}", --, "{{ (playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root) }}"]
      register: _rh_br_cattree
      changed_when: false
      failed_when: false
      when:
        - br_source_commit is defined and br_source_commit is string and br_source_commit is match('^[0-9a-f]{40}$')

    - name: "RX-CATALOG-READ -- the git object id of exactly the catalog bytes READ (stdin; no filters, no re-open by path)"
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.git.path }}", -C, "{{ rh_repo_root }}", hash-object, --no-filters, --stdin]
        stdin: "{{ _rh_br_catraw.content | b64decode }}"
        stdin_add_newline: false
      register: _rh_br_catoid
      changed_when: false
      failed_when: false
      when: _rh_br_catraw.content is defined

    - name: "RX-CATALOG-READ -- bind the catalog bytes READ to the blob the admitted br_source_commit records BEFORE parsing"
      vars:
        _l: "{{ _rh_br_cattree.stdout_lines | default([]) }}"
        _m: "{{ ((_l[0] | default('')).split('\t')[0]).split(' ') }}"
        _p: "{{ ((_l[0] | default('')).split('\t') + [''])[1] }}"
      ansible.builtin.assert:
        that:
          # the ADMITTED anchor, and this checkout is clean at exactly it (HEAD compared, not trusted)
          - br_source_commit is defined and br_source_commit is string and br_source_commit is match('^[0-9a-f]{40}$')
          - (_rh_br_head.stdout_lines[0] | default('')) == br_source_commit
          - (_rh_br_status.stdout_lines | length) == 0
          # the read and the git lookup name the SAME file of this checkout
          - "'..' not in ((playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root)).split('/')"
          - (rh_repo_root ~ '/' ~ ((playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root))) == (playbook_dir ~ '/managed-bootstrap-receipts.yml')
          # ABSENT CATALOG (worktree)
          - _rh_br_catraw.content is defined and _rh_br_catraw.content is string
          # ABSENT CATALOG (commit): exactly one regular-file blob at this path (no link, no gitlink)
          - _rh_br_cattree.rc | default(1) == 0
          - (_l | length) == 1
          - (_m | length) == 3
          - _m[0] in ['100644', '100755'] and _m[1] == 'blob'
          - _p == ((playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root))
          # CATALOG MISMATCH: the bytes READ are exactly that blob
          - _rh_br_catoid.rc | default(1) == 0
          - (_rh_br_catoid.stdout | default('')) is match('^([0-9a-f]{40}|[0-9a-f]{64})$')
          - _rh_br_catoid.stdout == _m[2]
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the checkout is not clean at the admitted -e br_source_commit
          {{ br_source_commit | default('<absent>') }} (HEAD {{ _rh_br_head.stdout_lines[0] | default('?') }}), or the catalog
          bytes read (object {{ _rh_br_catoid.stdout | default('<not read>') }}) are not the regular-file blob it records at
          {{ (playbook_dir ~ '/managed-bootstrap-receipts.yml') | relpath(rh_repo_root) }} ({{ _l | to_json }})
          (codex-tick368 RX-CATALOG-READ). Nothing was parsed or written.
        quiet: true

    - name: "RX-CATALOG-READ -- the bound catalog is one mapping with every top-level section (criteria hard-coded, not read from it)"
      vars:
        # parsed ONLY from the read bound above; a YAML syntax error fails THIS task (MALFORMED CATALOG)
        _catalog: "{{ _rh_br_catraw.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - _catalog is mapping
          - (['entry_contract', 'accepted', 'review_contract', 'receipt_contract'] | reject('in', _catalog.keys() | map('string') | list) | list | length) == 0
          - _catalog.entry_contract is mapping and _catalog.review_contract is mapping and _catalog.receipt_contract is mapping
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the bound catalog is not one mapping carrying entry_contract, accepted,
          review_contract and receipt_contract (MALFORMED CATALOG; codex-tick368 RX-CATALOG-READ). Nothing was written.
        quiet: true

    - name: Measure the profile bytes the policy was resolved from
      ansible.builtin.stat: {path: "{{ rh_repo_root }}/manifests/profiles/remote-harness.yml", follow: false, checksum_algorithm: sha256}
      register: _rh_br_prof

    - name: Collect the measurements (kept apart from the claims)
      vars:
        _s: "{{ _rh_br_st.results | map(attribute='stat') | list }}"
        _bm: "{{ _rh_br_bm_raw.content | b64decode | from_json }}"
      ansible.builtin.set_fact:
        _rh_br_m:
          ansible_playbook: {path: "{{ _s[0].path | default('') }}", isreg: "{{ _s[0].isreg | default(false) }}", islnk: "{{ _s[0].islnk | default(true) }}", sha256: "{{ _s[0].checksum | default('') }}"}
          python: {path: "{{ lme_resolved_run.python }}", islnk: "{{ _s[1].islnk | default(false) }}", lnk_source: "{{ _s[1].lnk_source | default('') }}", followed_sha256: "{{ _rh_br_pyf.stat.checksum | default('') }}"}
          runner_python: {path: "{{ ansible_playbook_python }}", lnk_source: "{{ _s[1].lnk_source | default('') if ansible_playbook_python == lme_resolved_run.python else '' }}", followed_sha256: "{{ _rh_br_pyf.stat.checksum | default('') if ansible_playbook_python == lme_resolved_run.python else '' }}"}
          interpreter: {path: "{{ _rh_br_loc.interpreter }}", isreg: "{{ _s[2].isreg | default(false) }}", islnk: "{{ _s[2].islnk | default(true) }}", sha256: "{{ _s[2].checksum | default('') }}"}
          ansible_config: {path: "{{ _rh_br_loc.config }}", sha256: "{{ _s[3].checksum | default('') }}"}
          tree_manifest_sha256: "{{ _s[4].checksum | default('') }}"
          tree_list_sha256: "{{ _s[5].checksum | default('') }}"
          seed: {path: "{{ _rh_br_claims.seed_path }}", sha256: "{{ _s[6].checksum | default('') }}"}
          running: {ansible_core: "{{ ansible_version.full }}", python_executable: "{{ ansible_facts.python.executable }}",
                    python_version: "{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}.{{ ansible_facts.python.version.micro }}"}
        _rh_br_boot:
          seed: {path: "{{ _rh_br_claims.seed_path }}", sha256: "{{ _s[6].checksum | default('') }}"}
          bundle_manifest:
            path: "{{ (_rh_br_claims.seed_path | dirname) ~ '/' ~ rh.controller.bootstrap.bundle.manifest_file }}"
            sha256: "{{ _s[7].checksum | default('') }}"
            schema: "{{ _bm.schema | default('') }}"
            seed_sha256: "{{ _bm.seed_sha256 | default('') }}"
            expected_generation: "{{ _bm.expected_generation | default('') }}"
            profile_sha256: "{{ _bm.profile_sha256 | default('') }}"
            source: "{{ _bm.source | default({}) }}"
        _rh_br_src:
          checkout: "{{ rh_repo_root }}"
          commit: "{{ _rh_br_head.stdout_lines[0] | default('') }}"
          tree: "{{ _rh_br_head.stdout_lines[1] | default('') }}"
          worktree_clean: "{{ _rh_br_status.stdout_lines | length == 0 }}"
        _rh_br_cfg:
          profile_rel: manifests/profiles/remote-harness.yml
          profile_sha256: "{{ _rh_br_prof.stat.checksum | default('') }}"
          policy_sha256: "{{ rh_config_revision }}"
          resolved_revision: "{{ rh_engine_revision }}"

    - name: Refuse every claim that its independent measurement does not reproduce (nothing is written before this)
      ansible.builtin.assert:
        that:
          - _rh_br_m.ansible_playbook.isreg and not _rh_br_m.ansible_playbook.islnk
          - _rh_br_m.ansible_playbook.sha256 == _rh_br_claims.ansible_playbook_sha256
          - _rh_br_m.python.islnk and _rh_br_m.python.lnk_source == _rh_br_claims.interpreter
          - _rh_br_m.python.followed_sha256 == _rh_br_claims.interpreter_sha256
          - _rh_br_m.runner_python.path == _rh_br_claims.python
          - _rh_br_m.runner_python.lnk_source == _rh_br_claims.interpreter
          - _rh_br_m.interpreter.isreg and not _rh_br_m.interpreter.islnk
          - _rh_br_m.interpreter.sha256 == _rh_br_claims.interpreter_sha256
          - _rh_br_m.ansible_config.sha256 == _rh_br_claims.ansible_config_sha256
          - _rh_br_m.tree_manifest_sha256 == _rh_br_claims.tree_manifest_sha256
          - _rh_br_m.tree_list_sha256 == _rh_br_claims.tree_list_sha256
          - _rh_br_m.seed.sha256 == _rh_br_claims.seed_sha256
          - _rh_br_boot.bundle_manifest.seed_sha256 == _rh_br_claims.seed_sha256
          - _rh_br_boot.bundle_manifest.expected_generation == _rh_br_claims.generation
          - _rh_br_m.running.ansible_core == _rh_br_claims.expect_core
          - _rh_br_m.running.python_executable == _rh_br_claims.python
          - _rh_br_m.running.python_version == _rh_br_claims.python_version
          - _rh_br_src.commit is match('^[0-9a-f]{40}$') and _rh_br_src.tree is match('^[0-9a-f]{40}$')
          - _rh_br_src.worktree_clean
          - _rh_br_cfg.profile_sha256 is match('^[0-9a-f]{64}$')
        fail_msg: >-
          REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the sealed receipt's claims are not reproduced by the actual
          installation (or the source is dirty): claims {{ _rh_br_claims | to_json }}; measured {{ _rh_br_m | to_json }};
          bootstrap {{ _rh_br_boot | to_json }}; source {{ _rh_br_src | to_json }}. No receipt was written.
        quiet: true

    - name: Render R through the declared template (receipt_contract; measurements only in `executables`)
      vars:
        _rc: "{{ (_rh_br_catraw.content | b64decode | from_yaml).receipt_contract }}"
      ansible.builtin.set_fact:
        _rh_br_text: >-
          {{ lookup('ansible.builtin.template', playbook_dir ~ '/macros/bootstrap_receipt.j2',
                    template_vars={'op': 'render', 'contract': _rc, 'claims': _rh_br_claims,
                                   'tc': {'path': _rh_br_loc.receipt, 'sha256': _rh_br_tc_raw.content | b64decode | hash('sha256')},
                                   'gen': _rh_br_loc.gen, 'm': _rh_br_m,
                                   'sel': {'probe_ansible_playbook': lme_resolved_run.ansible_playbook,
                                           'probe_python_executable': lme_resolved_run.python,
                                           'runner_python': lme_resolved_run.python},
                                   'src': _rh_br_src, 'cfg': _rh_br_cfg, 'boot': _rh_br_boot,
                                   'proj': {'runner': lme_resolved_run.runner,
                                            'playbook_rel': 'testing/loader-tests-r4/project_bootstrap_receipt.yml',
                                            'template_rel': 'testing/loader-tests-r4/macros/bootstrap_receipt.j2'}}) }}

    - name: Refuse a rendering outside the receipt contract (shape, no self-review, executables == measurements)
      vars:
        _rc: "{{ (_rh_br_catraw.content | b64decode | from_yaml).receipt_contract }}"
        _r: "{{ _rh_br_text | from_yaml }}"
      ansible.builtin.assert:
        that:
          - _r is mapping
          - (_r.keys() | map('string') | select('in', _rc.forbidden_keys) | list | length) == 0
          - (_r.keys() | map('string') | sort | list) == (_rc.top_level_keys | sort | list)
          - _r.kind == _rc.kind and _r.schema == _rc.schema
          - (_r.executables.keys() | map('string') | sort | list) == (_rc.executable_keys | sort | list)
          - (_r.selected.keys() | map('string') | sort | list) == (_rc.selected_keys | sort | list)
          - (_r.toolchain_receipt.keys() | map('string') | sort | list) == (_rc.toolchain_receipt_keys | sort | list)
          - "_r.executables.probe_ansible_playbook == {'path': lme_resolved_run.ansible_playbook, 'sha256': _rh_br_m.ansible_playbook.sha256}"
          - "_r.executables.probe_python == {'path': _rh_br_m.python.lnk_source, 'sha256': _rh_br_m.python.followed_sha256}"
          - "_r.executables.runner_python == {'path': _rh_br_m.runner_python.lnk_source, 'sha256': _rh_br_m.runner_python.followed_sha256}"
          - _r.managed_root == _rh_br_loc.gen
        fail_msg: "REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: the rendered receipt is outside receipt_contract: {{ _rh_br_text }}"
        quiet: true

    - name: Create the attempt directory (owned, 0700; absent before, checked above)
      ansible.builtin.file: {path: "{{ _rh_br_loc.label_dir }}", state: directory, mode: '0700'}

    - name: Write R once (0400)
      ansible.builtin.copy:
        dest: "{{ _rh_br_loc.out }}"
        content: "{{ _rh_br_text }}"
        mode: '0400'
        force: false

    - name: Measure the written R
      ansible.builtin.stat: {path: "{{ _rh_br_loc.out }}", follow: false, checksum_algorithm: sha256}
      register: _rh_br_out

    - name: Refuse a written R that is not exactly the rendering (then report its digest for review)
      ansible.builtin.assert:
        that:
          - _rh_br_out.stat.exists and _rh_br_out.stat.isreg and not _rh_br_out.stat.islnk
          - _rh_br_out.stat.checksum == (_rh_br_text | hash('sha256'))
          - not (_rh_br_out.stat.wgrp or _rh_br_out.stat.woth or _rh_br_out.stat.wusr)
        fail_msg: "REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION: {{ _rh_br_loc.out }} does not hold exactly the rendered receipt"
        success_msg: >-
          BOOTSTRAP-RECEIPT {{ _rh_br_loc.out }} sha256={{ _rh_br_out.stat.checksum }} from {{ _rh_br_loc.receipt }}
          read sha256={{ _rh_br_tc_raw.content | b64decode | hash('sha256') }} (generation {{ _rh_br_claims.generation }}); next: the separate
          bootstrap_receipt_readback runner, then the detached review (managed-bootstrap-receipts.yml)
        quiet: false
