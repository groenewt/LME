cases:
  # ============================== (1) GUEST POLICY (contract guest_lifecycle) ==============================
  - <<: *G_BASE
    name: g-policy-declared-admitted
    expected_now: pass
    invariant_task: "guest: the RS-shaped section is one admitted section of the resolved policy; no allocation without a host override"
    assert_that:
      - "lme_resolved.remote_harness.policy.guest.modes.allowed == ['provision', 'verify', 'retire']"
      - "lme_resolved.remote_harness.policy.guest.tools == {'qemu_img': 'qemu-img', 'qemu_system': 'qemu-system-x86_64', 'cloud_localds': 'cloud-localds', 'systemd_run': 'systemd-run', 'systemctl': 'systemctl', 'mkdir': 'mkdir', 'mv': 'mv', 'df': 'df', 'timeout': 'timeout', 'env': 'env', 'flock': 'flock'}"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.timeout.required_by == ['observation', 'guest']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.env.required_by == ['seed', 'guest']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.flock.required_by == ['seed', 'guest']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.flock.path == '/usr/bin/flock'"
      - "lme_resolved.remote_harness.policy.guest.record.schema == 'lme-guest-record/2'"
      - "lme_resolved.remote_harness.policy.guest.refusals.record_version == 'GUEST-RECORD-VERSION'"
      - "lme_resolved.remote_harness.policy.guest.refusals.lease_recovery == 'GUEST-LEASE-RECOVERY'"
      - "lme_resolved.remote_harness.policy.guest.layout.epoch_partial_infix == '.partial-epoch-'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.df.path == '/usr/bin/df'"
      - "lme_resolved.remote_harness.policy.guest.refusals.host_keys == 'GUEST-HOST-KEYS'"
      - "lme_resolved.remote_harness.policy.guest.refusals.disk_identity == 'GUEST-DISK-IDENTITY'"
      - "lme_resolved.remote_harness.policy.guest.refusals.recovery == 'GUEST-RECOVERY'"
      - "lme_resolved.remote_harness.policy.guest.lease == {'schema': 'lme-guest-lease/3', 'epoch_prefix': '.lease-epoch-', 'stage_prefix': '.lease-stage-', 'live_dir': 'live', 'revoked_prefix': 'revoked-by-', 'lock_wait_s': 30, 'busy_rc': 75, 'holder_file': 'holder.json', 'holder_fields': ['acquired_epoch', 'broke', 'epoch', 'hypervisor', 'mode', 'nonce', 'owner_uid', 'recovered', 'run_id', 'schema', 'term_end_epoch', 'ttl_s'], 'released_file': 'released.json', 'released_fields': ['epoch', 'nonce', 'released_epoch', 'schema'], 'break_var': 'lme_guest_lease_break', 'recover_var': 'lme_guest_lease_recover', 'evidence_prefix': '.lease-evidence-', 'ttl_s': 9000, 'step_s': 180, 'kill_after_s': 10, 'margin_s': 60}"
      - "lme_resolved.remote_harness.policy.guest.recovery == {'var': 'lme_guest_recover', 'gone_active_states': ['failed', 'inactive'], 'console_evidence_infix': 'evidence'}"
      - "lme_resolved.remote_harness.policy.guest.cloud_init.console_host_keys.wait_s == 120"
      - "'lease_epoch' in lme_resolved.remote_harness.policy.guest.record.fields and 'recoveries' in lme_resolved.remote_harness.policy.guest.record.fields"
      - "lme_resolved.remote_harness.policy.guest.cloud_init.console_host_keys.type_map == {'ed25519': 'ssh-ed25519', 'ecdsa': 'ecdsa-sha2-nistp256'}"
      - "'host_public_keys' in lme_resolved.remote_harness.policy.guest.record.fields"
      - "lme_resolved.remote_harness.policy.guest.qemu.net.bind == '127.0.0.1'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.inventory.role_groups.hypervisors == 'lme_hypervisors'"
      - "'allocation' not in lme_resolved.remote_harness.policy.guest"
      - "lme_remote_harness_overridden_paths == []"
  - <<: *G_REJ
    name: g-role-groups-absent-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {os_tools: *OS_TOOLS}}, guest: *GUEST}}}}
    # role_groups is CANONICAL in the profile (role_groups join): absence is key_remove, never overlay omission
    key_remove:
      - path: manifests/profiles/remote-harness.yml
        key_paths: [[profile_overlay, lme_global, remote_harness, controller, bootstrap, inventory, role_groups]]
    boundary_msg: "remote_harness.controller.bootstrap.inventory.role_groups.hypervisors fails contract_admission.guest_lifecycle (pattern): is not declared"
  - <<: *G_REJ
