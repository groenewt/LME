        merge: {profile_overlay: {lme_global: {remote_harness: {controller: *CTL, guest: {<<: *GUEST, modes: {var: tr_dir, allowed: [provision, verify, retire]}}}}}}
    boundary_msg: "remote_harness.guest.modes.var fails contract_admission.guest_lifecycle (not_in): is a registry ['reserved_outputs', 'reserved_output_patterns.reserved_transfer_vars'] name"
  - <<: *G_BASE
