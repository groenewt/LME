  # ======================= (4) TARGET PREREQUISITE POLICY (contract target_prereq; B decl rev 3) =======================
  # remote_harness.controller.bootstrap.target_prereq (codex decision: emitted through rh). Every case overlays the
  # bootstrap tools + role groups (P_BS) and rh.packages (PKGS: Debian + RedHat, the RedHat names UNVERIFIED).
  # TP-REG (BLOCKER-A): the rev-3 node (B frozen decl 743b68e8) and the hypervisor package mappings are now CANONICAL in
  # the profile. Overlays merge recursively over them, so a "member absent" negative uses key_remove (never omission).
  - name: tp-policy-admitted
    kind: control
    profile: remote-harness
    overlay_merge: [*P_OVL]
    expected_now: pass
    invariant_task: "target prereq: B's rev-4 policy is one admitted section of rh.controller.bootstrap; hypervisor packages mapped in every os family; linger / key tools are declared executable NAMES"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.revision == 4"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.resume.done_ops == 'readback_refuse_on_drift'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.preflight.listener_sources == ['/proc/net/tcp', '/proc/net/tcp6']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.hypervisor.capacity.alternatives == ['another_hypervisor_member', 'not_a_hypervisor_member', 'more_host_memory', 'raise_budget_and_fail']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.observation.required_by == ['target_adapter', 'privileged_contact', 'target_prereq', 'observation']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.observation.hypervisor_required_by == ['guest']"
      # C1-PREREQ-MODE-DOMAIN join: B's exact rev-3 regex passes the structural domain check (both mode rules)
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.layout.work_parent_rule.mode_regex == '^0[0-7][0145][0145]$'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.owner_account.home_mode_regex == '^0[0-7][0145][0145]$'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.loginctl.required_by == ['target_prereq']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.linger.tool == 'loginctl'"
      - "'owner_key' not in lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools['ssh-keygen'].required_by == ['owner_key_generation']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.packages.hypervisor_required == ['qemu_utils', 'qemu_system_x86', 'cloud_image_utils']"
      - "lme_resolved.remote_harness.policy.packages.by_os_family.Debian.qemu_system_x86 == 'qemu-system-x86'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq.journal.ops[-1] == 'storage_root'"
      - "'inputs' not in lme_resolved.remote_harness.policy.controller.bootstrap.target_prereq"
      - "'target_prereq' not in lme_resolved.remote_harness.policy"
