      - "lme_resolved.remote_harness.policy.guest.recovery.var == 'lme_transfer_target'"
  # ---- J-KEY owner key name family (c1-jkey-proposal JK-4): jk_* / _jk_* refuse by reserved_owner_key_vars, the bare
