        merge: {profile_overlay: {lme_global: {remote_harness: {controller: *CTL, guest: {<<: *GUEST, modes: {var: rh, allowed: [provision, verify, retire]}}}}}}
    boundary_msg: "remote_harness.guest.modes.var fails contract_admission.guest_lifecycle (not_in): is a registry ['reserved_outputs'] name"
  - <<: *G_REJ
    name: g-mode-var-reserved-family-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: *CTL, guest: {<<: *GUEST, modes: {var: g_mode, allowed: [provision, verify, retire]}}}}}}
    boundary_msg: "remote_harness.guest.modes.var fails contract_admission.guest_lifecycle (not_in): is a registry ['reserved_output_patterns.reserved_guest_vars'] name"
  # ---- B transfer / prerequisite name families (codex-tick333; B proposal 2a28228a hunk A): any declared input name
  # checked not_in [reserved_outputs] refuses a family member and the exact bare names; neighbouring public names pass.
  # (guest.modes.var is the witness input; every not_in [reserved_outputs] check honours the same families.)
  - <<: *G_REJ
