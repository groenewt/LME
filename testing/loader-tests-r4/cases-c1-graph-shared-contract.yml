      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: *CTL, guest: {<<: *GUEST, modes: {var: trace, allowed: [provision, verify, retire]}, recovery: {<<: *RECOVERY, var: tpl}}}}}}
    expected_now: pass
    invariant_task: "families: 'trace' and 'tpl' (no '<prefix>_' separator) are not tr_ / tp_ family members"
    assert_that:
