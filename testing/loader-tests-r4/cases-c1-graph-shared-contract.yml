    boundary_msg: "remote_harness.guest.tools fails contract_admission.guest_lifecycle (within): must be a non-empty string (subject: scalar; a list is not a key)"
  # C1-GUEST-TOOL-ROLES (codex-tick328, MEDIUM): the exact role set -- a missing role, an empty map and an extra role
