---
# cases-c1-graph-shared-contract.yml -- GRAPH-SHARED-CONTRACT real-loader controls. C1 owns the shared contract:
#   codex-tick304-graph-shared-contract-owner-20260925, codex-tick307-observation-job-binding-20260925 (jobs_sha256),
#   codex-graph-guest-security-prerequisite-decisions-20260925 (target_prereq through rh; one hypervisor group name).
# This file is hand-authored DATA for the m1-1 (CONNECTED) lineage only. Its binding blocks are copied from
# cases-c1-contract-admission.yml (same loader slice), without that file's declared-import fixtures.
# Producer shapes are joined into the ONE resolved contract lme_resolved.remote_harness (validated, revision-bound),
# each by the existing loader. Every declaration below is a CASE OVERLAY (profile_overlay / extra-var / inventory):
# the canonical profile declares none of these sections yet (its hunks are batched, serialized through C1, and gated
# on measured tool identities), so the canonical projection is unchanged.
#   (1) GUEST policy remote_harness.guest (RS proposal a51cc226 + 86abbf8f console_host_keys / host_keys; contract
#       guest_lifecycle, exact keys with `allocation` the one optional member) + per-hypervisor allocation (THAT host's
#       lme_global_override only; contract guest_allocation; run_id / name distinct across targets). Consumer:
#       testing/e2e/guest/guest.yml.
#   (2) ONE role-group declaration controller.bootstrap.inventory.role_groups (hypervisors = lme_hypervisors).
#   (3) DECLARED TARGET INPUTS (host_scope.target_inputs; contract target_input_roles; frozen contract codex-tick315;
#       CANONICAL since the C1 profile hunk, every role optional) -> binding.deployment.target_inputs. Consumers: B-graph
#       target_prereq.yml (owner / key refs / prereq_* roles) and route observe.yml (obs_paths / obs_prior_dirs /
#       obs_unit_patterns).
#   (4) TARGET PREREQUISITE policy remote_harness.controller.bootstrap.target_prereq (B decl REVISION 3 per B handback
#       c1-delta-from-B-20260925T0250, decl sha256 0a254bd7 not read by C1; was rev 2 / 06005861; contracts target_prereq + target_prereq_owner_key; hypervisor packages mapped in EVERY os family via
#       package_mapping.required_lists).
#   (5) OBSERVATION JOB BINDING controller.bootstrap.observation (route node; CANONICAL; contract observation_jobs).
#   (6) SEED FRAGMENTS controller.bootstrap.seed_fragments (CANONICAL; contract seed_fragments; shared artifact
#       installed_set_gate, whose templates the loader reads unconditionally -- isolated_source lists them).
# Reject boundaries:
#   - contract refusals at the publish task, as `remote_harness.<path> fails contract_admission.<contract> (<kind>)`;
#   - target-input VALUES at the publish task (_rh_scoped);
#   - a malformed target-input DECLARATION at the scope-context task, where lme_rh_connection_values selects by it.
# The fixture digests below are FIXTURE values, not measured identities.
schema_version: 1
binds_to: null
loader_entry:
  role: podman
  tasks_from: resolve
isolated_source:
  files:
    - ansible/roles/podman/tasks/load_manifests.yml
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/validate_resolved_config.yml
    - ansible/roles/podman/defaults/main.yml
    - ansible/roles/podman/filter_plugins/lme_manifests.py
    - ansible/site.yml
    - testing/remote_harness/templates/lme-controller-seed.sh.j2
    - testing/remote_harness/templates/macros/controller_seed.j2
    - testing/remote_harness/templates/lme-seed-launcher.sh.j2
    - testing/remote_harness/templates/lme-seed-launch-params.json.j2
    - testing/remote_harness/templates/lme-seed-installed-set-gate.sh.j2
  trees:
    - manifests
play_vars_source:
  file: ansible/site.yml
  play_index: 0
  restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]

task_names:
  publish: &T_PUB "Publish namespaced resolved config, origins and enable flags (OUTPUT names)"
  scope: &T_SCOPE "Resolve the remote-harness scope context (controller + inventory scopes; one composition each)"

fixtures: {}

# ---- declarations (anchors only; nothing here is read by the runner) ----
base:
  os_tools: &OS_TOOLS
    # os_tools KEYS are the executables' binary names (profile convention; MAIN relay item 4). The guest ROLE keys
    # (qemu_img, qemu_system, cloud_localds) are guest.tools keys that REFERENCE these names.
    qemu-img: {path: /usr/bin/qemu-img, required_by: [guest], identity: {kind: file_sha256, sha256: 1111111111111111111111111111111111111111111111111111111111111111}}
    qemu-system-x86_64: {path: /usr/bin/qemu-system-x86_64, required_by: [guest], identity: {kind: file_sha256, sha256: 2222222222222222222222222222222222222222222222222222222222222222}}
    # B rev 3 tag [target_prereq] (B handback: the linger tool's one consumer): a TARGET label of
    # controller.bootstrap.os_tool_consumers, so package.yml skips it on the controller (codex-tick328-329 partition)
    # while target_prereq.linger.tool finds required_by CONTAINING target_prereq. Fixture identity only.
    # ssh-keygen is NOT here: the CANONICAL profile declares it (J-KEY JK-1, required_by [owner_key_generation], a
    # CONTROLLER consumer); the recursive overlay keeps it. OKG_TOOLS re-declares it with a fixture identity.
    loginctl: {path: /usr/bin/loginctl, required_by: [target_prereq], identity: {kind: file_sha256, sha256: 3333333333333333333333333333333333333333333333333333333333333333}}
    cloud-localds: {path: /usr/bin/cloud-localds, required_by: [guest], identity: {kind: file_sha256, sha256: 4444444444444444444444444444444444444444444444444444444444444444}}
    # the CANONICAL observation entry (profile: measured controller-fixture identity, required_by [observation]) extended
    # by the guest consumer label; recursive overlay, path and identity stay as declared
    systemctl: {required_by: [observation, guest]}
    # the EXISTING profile entry (key systemd-run, required_by [seed]) extended by the consumer label -- never a second
    # declaration of the same executable (RS proposed a new key systemd_run). Recursive overlay: only required_by is
    # replaced (seed kept); the profile's measured path and identity stay as declared.
    systemd-run: {required_by: [seed, guest]}
    # C1-GUEST-TOOL-ROLES (codex-tick328): the four remaining guest roles bind the EXISTING canonical entries, each
    # extended by the guest label only (recursive overlay: required_by replaced, path / identity as declared). df/mkdir/mv
    # stay controller-admitted (mixed labels); timeout stays target-only ([observation, guest] both target labels).
    df: {required_by: [seed, guest]}
    mkdir: {required_by: [seed, uv_installer, guest]}
    mv: {required_by: [seed, uv_installer, guest]}
    timeout: {required_by: [observation, guest]}
    # RS FINAL delta tick336 (codex tick331 fence): the EXISTING seed entries env / flock, extended by the guest label
    # only (no second entry; controller-admitted through seed)
    env: {required_by: [seed, guest]}
    flock: {required_by: [seed, guest]}
  role_groups: &ROLE_GROUPS {hypervisors: lme_hypervisors, telemetry_sources: lme_telemetry_sources, workload: lme_workload}
  controller: &CTL {bootstrap: {os_tools: *OS_TOOLS, inventory: {role_groups: *ROLE_GROUPS}}}
  # RS proposal a51cc226 A1 minus the three members the codex decisions retire (hypervisor_group: the ONE name is
  # controller.bootstrap.inventory.role_groups.hypervisors; allocation_fields: contract guest_allocation;
  # allocation: {}: per-host override only). guest_nokvm is the section minus kvm_device (the missing-leaf case).
  guest_nokvm: &GUEST_NOKVM
    schema_version: 1
    modes: &MODES {var: lme_guest_mode, allowed: [provision, verify, retire]}
    # the exact eleven roles (contract guest_lifecycle tools keys; RS proposal 91f9f744 FINAL delta tick336: + env, flock)
    tools: &GTOOLS
      {qemu_img: qemu-img, qemu_system: qemu-system-x86_64, cloud_localds: cloud-localds, systemd_run: systemd-run, systemctl: systemctl,
       mkdir: mkdir, mv: mv, df: df, timeout: timeout, env: env, flock: flock}
    proc_meminfo: /proc/meminfo
    proc_root: /proc
    uuid_source: /proc/sys/kernel/random/uuid
    linger_dir: /var/lib/systemd/linger
    boot_timeout_s: 900
    endpoint_timeout_s: 120
    layout: &LAYOUT
      bases_dir: bases
      runs_dir: runs
      preserved_dir: preserved
      claim_prefix: .claim-
      epoch_partial_infix: .partial-epoch-
      run_files: &RUN_FILES
        {os_disk: os.qcow2, data_disk: data.qcow2, seed: seed.img, user_data: user-data, meta_data: meta-data,
         console: console.log, qmp: qmp.sock, record: record.json,
         os_disk_partial: os.qcow2.partial, data_disk_partial: data.qcow2.partial, seed_partial: seed.img.partial}
      dir_mode: '0700'
      file_mode: '0600'
    # lease /3 (RS proposal 7af38949 A1 + FINAL delta tick336, superseding 91f9f744: epochs published complete from a
    # staging, a recorded term, a live token; /2 retired; tick339-340 recover_var / evidence_prefix / holder
    # recovered). POLICY VALUES tick331: ttl 9000, step 180, kill 10, lock_wait 30 -- boot 900 + wait 120 +
    # endpoint 120 + margin 60 + 30 * (30 + 180 + 10) = 1200 + 6600 = 7800 < 9000 (the v2 values ttl 3600 / step
    # 300 / kill 30 fail the 30-operation bound: 1200 + 30 * (30 + 300 + 30) = 12000)
    lease: &LEASE
      schema: lme-guest-lease/3
      epoch_prefix: .lease-epoch-
      stage_prefix: .lease-stage-
      live_dir: live
      revoked_prefix: revoked-by-
      lock_wait_s: 30
      busy_rc: 75
      holder_file: holder.json
      holder_fields: [acquired_epoch, broke, epoch, hypervisor, mode, nonce, owner_uid, recovered, run_id, schema, term_end_epoch, ttl_s]
      released_file: released.json
      released_fields: [epoch, nonce, released_epoch, schema]
      break_var: lme_guest_lease_break
      recover_var: lme_guest_lease_recover
      evidence_prefix: .lease-evidence-
      ttl_s: 9000
      step_s: 180
      kill_after_s: 10
      margin_s: 60
    recovery: &RECOVERY {var: lme_guest_recover, gone_active_states: [failed, inactive], console_evidence_infix: evidence}
    preserved_physical_prefixes: [/var/lib/containers/, /run/containers/, /etc/containers/, /etc/lme/, /opt/lme/, /root/]
    unit: {name: 'lme-guest-{run_id}.service', properties: [Type=exec, KillMode=mixed, TimeoutStopSec=120]}
    qemu: &QEMU
      accel: kvm
      machine: q35
      cpu: host
      display: none
      net: {mode: user, bind: '127.0.0.1', guest_port: 22, device: virtio-net-pci}
      disk_device: virtio-blk-pci
      data_serial_prefix: lme-data-
      os_serial_prefix: lme-os-
    cloud_init: &CI
      privileged_account: &CI_ACCT {name: root, disable_root: false, lock_passwd: true}
      ssh: &CI_SSH {pwauth: false, deletekeys: true, genkeytypes: [ed25519, ecdsa]}
      data_fs: &CI_FS
        {label: lme-data, filesystem: ext4, partition: none, overwrite: false, mount: /data,
         mount_options: 'defaults,nofail,x-systemd.device-timeout=30', dump: '0', pass: '2', device_prefix: /dev/disk/by-id/virtio-}
      identity_check: &CI_ID {shell: sh, source: /sys/class/dmi/id/product_uuid, marker: LME-GUEST-IDENTITY-MISMATCH, console: /dev/console, on_mismatch: [poweroff]}
      console_fingerprints: &CI_FP
        begin_marker: '-----BEGIN SSH HOST KEY FINGERPRINTS-----'
        end_marker: '-----END SSH HOST KEY FINGERPRINTS-----'
        line_regex: '([0-9]+) (SHA256:[A-Za-z0-9+/]+) .* \(([A-Z0-9-]+)\)\s*$'
      # RS 86abbf8f: the console host-key block (type_map short -> OpenSSH algorithm; rsa retired by the contract)
      console_host_keys: &CI_HK
        begin_marker: '-----BEGIN SSH HOST KEY KEYS-----'
        end_marker: '-----END SSH HOST KEY KEYS-----'
        wait_s: 120
        line_regex: '^((ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521) ([A-Za-z0-9+/]+={0,3}))( [ -~]*)?$'
        type_map: {ed25519: ssh-ed25519, ecdsa: ecdsa-sha2-nistp256}
    # record.schema /2 + refusals.record_version (codex-tick331; hold lifted by MAIN relay of RS 91f9f744)
    record: &RECORD
      schema: lme-guest-record/2
      fields: [schema, run_id, name, hypervisor, owner_uid, uuid, generation, state, lease_nonce, lease_epoch, storage_root, run_dir, base, base_sha512, disks, unit, endpoint, allocation, host_key_fingerprints, host_public_keys, recoveries, observed_at_utc]
      states: [claimed, starting, started, retired]
    refusals: &GREF
      {decl_invalid: GUEST-DECL-INVALID, scope: GUEST-HYPERVISOR-SCOPE, tool: GUEST-TOOL-MISSING, kvm: GUEST-KVM-ACCESS,
       user_manager: GUEST-USER-MANAGER, storage: GUEST-STORAGE-ROOT, capacity: GUEST-CAPACITY, memory: GUEST-MEMORY,
       base: GUEST-BASE-IMAGE, present: GUEST-RECORD-PRESENT, mismatch: GUEST-RECORD-MISMATCH, unit: GUEST-UNIT,
       endpoint: GUEST-ENDPOINT, host_keys: GUEST-HOST-KEYS, ambiguous: GUEST-STATE-AMBIGUOUS, unit_reused: GUEST-UNIT-REUSED,
       lease_held: GUEST-LEASE-HELD, lease_lost: GUEST-LEASE-LOST, disk_identity: GUEST-DISK-IDENTITY, recovery: GUEST-RECOVERY,
       record_version: GUEST-RECORD-VERSION, lease_recovery: GUEST-LEASE-RECOVERY}
  # the retired v1 lease shape (dir / broken_prefix), used only by the retired-shape negative
  lease_v1: &LEASE_V1
    schema: lme-guest-lease/1
    dir: .lease
    holder_file: holder.json
    broken_prefix: .lease.broken-
    break_var: lme_guest_lease_break
    ttl_s: 3600
    step_s: 300
    margin_s: 60
  guest: &GUEST
    <<: *GUEST_NOKVM
    kvm_device: /dev/kvm
  alloc: &ALLOC
    run_id: graph-obs-01
    name: lme-guest-01
    vcpus: 8
    memory_mib: 13312
    os_disk_gib: 40
    data_disk_gib: 256
    storage_root: /data/lme-e2e
    storage_mount: /data
    physical_reserve_gib: 100
    host_headroom_mib: 2048
    forward_port: 22022
    base_image: {file: debian-13-genericcloud-amd64.qcow2, sha512: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb}
    privileged_authorized_keys_file: /data/lme-deploy/observability/keys/guest-root.pub
  alloc_h2: &ALLOC_H2
    <<: *ALLOC
    run_id: graph-obs-02
    name: lme-guest-02
  g_overlay: &G_OVL
    path: manifests/profiles/remote-harness.yml
    merge: {profile_overlay: {lme_global: {remote_harness: {controller: *CTL, guest: *GUEST}}}}
  # B-graph target_prereq.decl.yml REVISION 2 (sha256 06005861) minus the members that re-declare another authority
  # (inputs, target_inputs, packages.source, hypervisor.group, linger.runtime_dir / bus_rel) and with the three
  # corrections its values need to be admitted: linger.tool = the os_tools NAME, and both mode regexes never admitting
  # a group/other-writable mode ('^0[0-7][0-5][0-5]$' admits 0722 / 0733 / 0766: the write bit is 2).
  prereq_mode_regex: &MODE_RX '^0[0-7][0145][0145]$'
  # REVISION 3 (B handback c1-delta-from-B-20260925T0250): JOINED to B's actual decl
  # testing/remote_harness/target_prereq.decl.yml sha256 0a254bd7 (MAIN relay) -- PREREQ equals its target_prereq
  # member for member (one C1 draft value, preflight.record_suffix, aligned to B's '.prereq-preflight.json'):
  # + resume (pinned words) + preflight + hypervisor.capacity.alternatives + observation.hypervisor_required_by; the
  # observation label lists name only TARGET consumers (B: seed / uv_installer dropped).
  # REVISION 4 (C1 hunk 2, rebound hunk 3; B r4 proposal d96f4ed9): revision 4, preflight.record_schema v2, reuse.preflight_rel, hypervisor
  # without preserved_refused_*; preservation / observe are NOT restated here -- the overlay merges recursively over the
  # canonical profile, which declares them.
  prereq: &PREREQ
    revision: 4
    resume: &PRESUME {done_ops: readback_refuse_on_drift, owner_home_writes: only_while_authorized_key_pending, after_key_install: observation_only,
                      existing_account: observation_only, file_tasks: only_when_absent}
    preflight: &PPF {record_suffix: .prereq-preflight.json, record_schema: lme-target-prereq-preflight/v2, listener_sources: [/proc/net/tcp, /proc/net/tcp6]}
    runner: MAIN_only
    connection_profile: privileged
    refusal: RH-TARGET-PREREQ
    reuse: {transfer_dir_rel: testing/e2e/transfer, transfer_decl: transfer.decl.yml, controller_prelude: tasks/bind_controller.yml, contact_rel: testing/remote_harness/tasks/initial_contact.yml, contact_variant: privileged,
            preflight_rel: testing/e2e/target_prereq/tasks/prereq_preflight.yml}
    layout: &PLAYOUT {toolchain_rel: toolchain, bundles_rel: bundles, bundle_leaf_regex: '^[0-9a-f]{64}$', owner_dir_mode: '0700',
                      work_parent_rule: {path: dirname_of_work_root, owner: root, mode_regex: *MODE_RX}}
    owner_account: &PACCT {gecos: 'LME remote-harness deployment owner (target_prereq)', create_home: true, system: false, passwd_fields: {gecos: 3, home: 4, shell: 5}, home_mode_regex: *MODE_RX}
    authorized_keys: &PAK {dir_rel: .ssh, dir_mode: '0700', file_rel: .ssh/authorized_keys, file_mode: '0600', pubkey_regex: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+={0,3}( [ -~]*)?$'}
    journal: &PJOURNAL
      dir: /var/lib/lme-target-prereq
      dir_mode: '0700'
      file_mode: '0600'
      file_suffix: .journal.json
      schema: lme-target-prereq-journal/v1
      ops: [account, ssh_dir, authorized_key, linger, work_root, work_children, work_handover, storage_root]
      states: [pending, started, done]
      binding: [owner, uid, gecos, pubkey_sha256]
    linger: {tool: loginctl, marker_dir: /var/lib/systemd/linger, wait: {retries: 20, delay: 1}}
    packages: {install_module: ansible.builtin.package, hypervisor_required: [qemu_utils, qemu_system_x86, cloud_image_utils]}
    hypervisor: &PHV
      kvm_group: kvm
      storage_mode: '0700'
      base_image_checksum: sha512
      capacity: &PCAP {meminfo: /proc/meminfo, admits_provision: false, refusal: RH-TARGET-PREREQ-CAPACITY,
                       alternatives: [another_hypervisor_member, not_a_hypervisor_member, more_host_memory, raise_budget_and_fail]}
    endpoint: &PEP
      ancestry_max_depth: 16
      admitted_server_exe_regex: '^/usr/(sbin/sshd|lib/openssh/sshd-session)$'
      refused_exe_regex: '(^|/)tailscaled$'
      refusal: RH-TARGET-PREREQ-SSH-INTERCEPT
      ancestry_program: >-
        p=$PPID; n=0;
        while [ "$p" -gt 1 ] && [ "$n" -lt "$1" ]; do
        "$2" -e "/proc/$p/exe" 2>/dev/null || echo "?";
        p=$("$3" -n 's/^PPid:[[:space:]]*//p' "/proc/$p/status"); n=$((n+1)); done
    observation: &POBS {required_by: [target_adapter, privileged_contact, target_prereq, observation], hypervisor_required_by: [guest], override_path: [remote_harness, controller, bootstrap, os_tools], identity_kind: file_sha256, record_suffix: .prereq.json, record_schema: lme-target-prereq/v1}
  # LEGACY target_prereq.owner_key (OPTIONAL member of target_prereq; codex-tick328-329 ssh_keygen; contract
  # target_prereq_owner_key, left in place): NOT in the PREREQ base. Since J-KEY JK-1/JK-3 the canonical profile declares
  # os_tools.ssh-keygen (required_by [owner_key_generation]) and the SEPARATE node controller.bootstrap.owner_key
  # (contract owner_key); the legacy "generator absent" cases therefore key_remove both. OKG_TOOLS re-declares the
  # canonical generator with a fixture identity.
  prereq_owner_key: &POKEY {status: proposal, generator_tool: ssh-keygen, key_type: ed25519, storage_rel: keys, dir_mode: '0700', file_mode: '0600',
                            rotation: [admit_replacement, prove_access, retire_prior], never_rotated: [privileged_bootstrap_key]}
  owner_key_generator: &OKG_TOOLS
    ssh-keygen: {path: /usr/bin/ssh-keygen, required_by: [owner_key_generation], identity: {kind: file_sha256, sha256: 6666666666666666666666666666666666666666666666666666666666666666}}
  packages: &PKGS
    by_os_family:
      Debian: {qemu_utils: qemu-utils, qemu_system_x86: qemu-system-x86, cloud_image_utils: cloud-image-utils}
      RedHat: {qemu_utils: qemu-img, qemu_system_x86: qemu-kvm, cloud_image_utils: cloud-utils}   # UNVERIFIED names (B)
  prereq_bootstrap: &P_BS {os_tools: *OS_TOOLS, inventory: {role_groups: *ROLE_GROUPS}}
  p_overlay: &P_OVL
    path: manifests/profiles/remote-harness.yml
    merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {<<: *P_BS, target_prereq: *PREREQ}}, packages: *PKGS}}}}
  p_base: &P_BASE
    kind: control
    profile: remote-harness
    expected_now: reject
    expected_failed_task: *T_PUB
  # declared target inputs (ONE inventory.target_inputs node, frozen contract codex-tick315): the loader-bound roles
  # (owner / toolchain_root required), the key PATH references, B-graph's six prereq_* roles (rev 2; its mapping role
  # prereq_work_parent is four string roles: the frozen contract has no mapping type) and route's obs_* selections
  target_inputs: &TIN
    owner: {var: lme_toolchain_owner, type: string, required: true, pattern: account_name}
    toolchain_root: {var: lme_toolchain_root, type: string, required: true, pattern: abs_path}
    bundle_dir: {var: lme_toolchain_bundle_dir, type: string, required: false, pattern: abs_path}
    owner_key: {var: lme_toolchain_owner_key, type: string, required: false, pattern: abs_path}
    privileged_key: {var: lme_privileged_key, type: string, required: false, pattern: abs_path}
    owner_pubkey: {var: lme_toolchain_owner_pubkey, type: string, required: false, pattern: abs_path}
    prereq_owner_shell: {var: lme_deploy_owner_shell, type: string, required: false, pattern: abs_path}
    prereq_owner_home: {var: lme_deploy_owner_home, type: string, required: false, pattern: abs_path}
    prereq_work_root: {var: lme_deploy_work_root, type: string, required: false, pattern: abs_path}
    prereq_bundle_root: {var: lme_deploy_bundle_root, type: string, required: false, pattern: abs_path}
    prereq_work_parent_path: {var: lme_deploy_work_parent_path, type: string, required: false, pattern: abs_path}
    prereq_work_parent_owner: {var: lme_deploy_work_parent_owner, type: string, required: false, pattern: account_name}
    prereq_work_parent_group: {var: lme_deploy_work_parent_group, type: string, required: false, pattern: account_name}
    prereq_work_parent_mode: {var: lme_deploy_work_parent_mode, type: string, required: false, pattern: lock_mode}
    prereq_preserved_units: {var: lme_lab_preserved_units, type: string_list, required: false, pattern: service_name}
    obs_paths: {var: lme_obs_paths, type: string_list, required: false, pattern: abs_path}
    obs_prior_dirs: {var: lme_obs_prior_dirs, type: string_list, required: false, pattern: abs_path}
    obs_unit_patterns: {var: lme_obs_unit_patterns, type: string_list, required: false, pattern: unit_glob}
  ti_overlay: &TI_OVL
    path: manifests/profiles/remote-harness.yml
    merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {inventory: {target_inputs: *TIN, connection_profiles: {owner: {pubkey_var: lme_toolchain_owner_pubkey}}}}}}}}}
