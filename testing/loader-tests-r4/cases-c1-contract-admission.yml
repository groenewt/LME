    boundary_msg: "registry contract_admission.contracts.lock_file.checks[0] must carry exactly one of path/at, exactly one check kind"
  # C1-CONTRACT-SCALAR-SHAPE (codex 193253): a membership check without a declared value shape is a malformed registry
  - name: ca-registry-within-without-subject-refused
    kind: control
