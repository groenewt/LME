    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry contract_admission.contracts.seed_launch.checks[0] within argument/modifiers are malformed"
  # C1-ACT-REQUIRED-COMPONENT (codex 193337): the required-value declaration is itself fail-closed (validated on this
  # lineage too; its runtime admission applies only where genesis.launch is declared)
  - name: ca-registry-required-value-unknown-pattern-refused
