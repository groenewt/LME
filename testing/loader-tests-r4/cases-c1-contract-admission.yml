---
# cases-c1-contract-admission.yml -- C1-BOOTSTRAP-CONTRACT-VALUE-ADMISSION real-loader controls
# (codex-C1-four-contract-admission-audit-20260924-191117, MEDIUM; route codex-tick213-215-route-C1-caller-decisions-
# 20260924-191017 (2)). Binding blocks (loader_entry, isolated_source, play_vars_source, task_names) are copied
# unchanged from cases-c1-iso6-rh.yml (same loader slice: the loader reads the declared seed templates).
# Every reject case makes ONE registry-declared check of lme_config_registry.remote_harness_schema.contract_admission
# refuse at resolve (the publish task; before any mutation). The boundary is the validator's own message prefix
# `<policy_key>.<path> fails contract_admission.<contract> (<kind>)`. Invalid dependencies (a tool the seed does not
# admit, an env name outside base_env/inherited, a mode outside mode_args) refuse HERE instead of at render
# (controller_seed.j2 x(bs, dh.tool)). The declaration-pinned / tunable boundary is unchanged:
# ca-override-pinned-contract-refused (a pinned contract leaf stays pinned) and ca-override-admitted-tool-location
# (an admitted os_tools path+identity override keeps satisfying the reference). genesis.launch is declared on BOTH
# lineages (ROUTE-X P2, codex-tick332 F1: the m1-1g launch block landed verbatim on m1-1), so the registry contract
# genesis_act runs on both and its cases (ca-act-*, E81 fixtures) are carried here as on the m1-1g copy.
# SECOND EDIT (C1-CONTRACT-SCALAR-SHAPE codex 193253 + C1-ACT-REQUIRED-COMPONENT / regex scope codex 193337; after the
# 3af3d9e8 commit): every `within` declares its value shape (subject) -- wrong-type controls {} / [] / [x] refuse at the
# resolver with the shape reason; required_values is a fail-closed registry block; bracket negation is an unsupported
# ERE input. ca-registry-absent's needle now names required_values. The act-value cases (ca-act-*) were m1-1g only
# until ROUTE-X P2 declared genesis.launch on m1-1 (CA1 below). Earlier cases unchanged.
# THIRD EDIT (codex-tick217 R1 launcher-schema slice, route hunk for C1): isolated_source adds the launcher entry
# template (host_scope.shared_artifacts.launcher; the loader reads every declared template); the declared control also
# asserts the launcher fields; one reject case per new check of bundle_launcher / seed_launcher (incl. the resolve-time
# mirrors of controller_seed.j2 launch_word / launch_params / launch_exec), the new vocabulary's fail-closed registry
# controls, and the launcher template proof. The block is byte-identical on both lineages. Earlier cases unchanged.
# FOURTH EDIT (C1 follow-up: route F3 / F4 dispositions): seed_launcher.template_rel is admitted by equals_registry
# against host_scope.shared_artifacts.launcher.templates[0] (the registry holds the one literal), so
# ca-launcher-template-rel-other-refused's needle names equals_registry; the fixed-value-as-param note now says the
# registry and the macro (route F3 launch_fixed) apply the same rule; +4 cases (the registry side differs, and the
# equals_registry vocabulary fail-closed: absent path, index outside the list, malformed argument), appended
# byte-identically on both lineages.
# FIFTH EDIT (codex 203437 limit: rejections alone do not qualify the positive variations): +4 PASS cases, appended
# byte-identically on both lineages. There is NO composability matrix for the contract files (loader-tests-r4 holds
# per-concern case files only), so they are pass cases here with overlay_merge of the profile DECLARATION (these
# fields are declaration-pinned, never lme_global_override tunables): a renamed launcher member, a renamed carried
# parameter (mode_args.run and carried_param together), a second carried ssh_auth mode, and all three composed.
# SIXTH EDIT (codex 203817 C1-EQUALS-REGISTRY-NESTED-TYPES, fix (a)): equals_registry compares scalars only; +3
# reject cases after the equals_registry block, byte-identical on both lineages: a nested bool-vs-int mapping pair
# (the pre-fix code admitted it: outer kinds equal, then Python True == 1), a registry container node, a policy
# container value. The F4 string check and its cases are unchanged.
# EIGHTH EDIT (codex 212700 params_rel; both lineages): seed_launcher.params_rel (the route's launch-params export
# template) is admitted by equals_registry against host_scope.shared_artifacts.launcher_params.templates[0] and is
# distinct_from template_rel; the loader proves the launcher_params artifact against its templates like every shared
# artifact, so isolated_source adds the export template and ca-declared-admitted asserts params_rel. +3 reject cases
# appended byte-identically on both lineages (another path; equal to template_rel with the registry entry pointed at
# the launcher entry, so ONLY distinct_from trips; the registry side differs). Requires the route's template + profile
# params_rel (committed together with this registry batch).
# SEVENTH EDIT (E81 genesis act fixtures, codex 211654; adopted on m1-1 by ROUTE-X CA1, see below): the
# resolve-time `rejects` probes are a FINITE screen, not the component guard -- a profile act.regex admitting a
# slash-bearing or dot-leading act that fullmatches none of '', '.', '..', 'a/b' is ADMITTED at resolve. +3 PASS
# cases appended ('^x/y$', '^[.][.]/x$', '^[.]hidden$'): each is the resolvable profile G's Route 3 declared clone
# (variant_checkout: clone, tasks/variant_clone.yml: an exact-commit --no-hardlinks clone with the patched profile;
# a MAIN-staged rhc_variants copy is NOT an admissible source) carries into E81 genesis.launch.act-identity, whose runtime act
# ('x/y', '../x', '.hidden') the profile admits and ONLY the registry required_values.genesis_act rel_segment
# fullmatch refuses (admit_builder.yml, before the profile regex and before any path/mkdir). The '^$' copy stays
# unbuildable by design: ca-act-regex-admits-empty-refused, whose needle now names the probe (['']); the empty act
# itself is E81's committed-profile row (admit_builder `(_act | length) > 0`). Earlier cases unchanged otherwise.
# NINTH EDIT (codex 213721 / 214135 declared-reference import + consumers; one byte-identical block on both lineages):
# the launch-params export imports its macros through the ONE declared-reference form
# `lme_seed_bs.macros_rel | relpath(lme_seed_bs.seed_launcher.params_rel | dirname)` (a bounded AST, shape-proved
# BEFORE the free-variable analysis, with parse-only relpath / dirname stand-ins admitted in that operand only; the
# values are bound against EVERY scope policy; loader layout = the target strictly inside the entry directory).
# macros_rel is tied to the registry by the contract bootstrap_macros (equals_registry seed.templates[1]), which runs
# FIRST at resolve, so the value rejects on macros_rel (another path, null, absolute, '..') carry the contract needle.
# The proof's own mismatch / outside-directory refusals are reached from the REGISTRY side (launcher_params.templates
# overlays, macros_rel canonical); its shape refusals go through declared fixture templates under
# testing/loader-tests-r4/fixtures/declared-import/ (isolated_source adds them). consumers: [] is the truthful value
# for the pure metadata export (launcher_params); malformed consumer values and an executable artifact missing a
# consumed input still refuse. +19 cases (2 pass / 17 reject). The declared-RELOCATION positive is HELD: as anchored,
# bootstrap_macros pins macros_rel to the canonical macros, which no relocated entry under this directory contains
# (MAIN decision pending). The pass cases and the registry-side mismatch need the route's export template in exactly
# the declared form (no relpath / dirname outside the import).
# TENTH EDIT (codex 220953 / 221058 / 221203; one byte-identical block on both lineages; supersedes the NINTH EDIT's
# "relocation HELD" and its mismatch / outside-directory overlays):
#  - SOFT-FRAME: every filter and test NAME is validated explicitly in EVERY frame (if test, if body, condexpr
#    included), not by the compile inside find_undeclared_variables (which refuses only in hard frames). Admitted: the
#    Jinja builtin filters / tests, the compiler-only known capability `match` (inert; the canonical macros use it),
#    relpath / dirname in the proved import operand only. INDIRECT names count: the literal test name given to select /
#    reject / selectattr / rejectattr and the literal filter name given to map are checked against the same sets
#    (map(attribute=...) names none); a non-literal name refuses.
#  - C1-IMPORT-MACRO-NAME-SHADOW: a macro declaration named like a referenced root shadows it (Macro.name is a string).
#  - minimal_shared_member_contract: bootstrap_macros requires macros_rel == seed / launcher / launcher_params
#    templates[1] (three equals_registry checks); one invariant case per single differing member. With it the
#    proof's mismatch refusal is unreachable from any declaration (the contract makes the target the declared member),
#    so ca-declared-import-mismatch-refused became the launcher_params member invariant; the outside-directory case now
#    keeps the canonical macros member and moves only the entry.
#  - RELOCATION: the seed anchor stays. The small relocated fixture is used ONLY by
#    ca-proof-import-capability-relocated-fixture-not-canonical-admitted, a PROOF-LEVEL import-capability case that
#    replaces the bootstrap_macros checks by overlay; it is NOT the canonical relocation (route owns the fixture /
#    layout and G the managed clone / control of that). C1 owns the invariant (ca-relocated-member-without-anchor-refused)
#    and the mismatch / outside-directory proof cases.
# ROUTE-X CA1 EDIT (codex-tick332 F1 + apply adapter; coordinator relay, ROUTE-X c1-profile-proposal e10d1fd8): the
# profile now declares genesis.launch on m1-1 (P2, verbatim from m1-1g), so ca-declared-admitted asserts act.var
# instead of "genesis.launch is not defined", and the m1-1g genesis_act cases are adopted unchanged (the 13 ca-act-*
# rejects of "genesis.launch.stage_root.act" + the 3 E81 PASS fixtures of the SEVENTH EDIT; source
# m1-1g cases-c1-contract-admission.yml 23df8778, only "(m1-1g lineage only)" dropped from their comments). +2 PASS
# cases (ca-runners-bootstrap-receipt-*) pin the route X runner registry rows: work_roots.runners evidence dirs
# (P4; ROUTE-X R1 bootstrap-receipt-review is NOT landed -- codex-tick339-340 rules out a runner-less evidence key: A
# lives in the readback runner's attempt dir, .scratchpad-14bbf94b/C1/review-location-join.yml), run_local.runners rows (P5)
# and the join (every run_local runner names a declared evidence dir). Registry-shape
# NEGATIVES are not declared: no contract_admission contract covers work_roots.runners / run_local.runners (a draft is
# held for MAIN; a reserved-output required_inputs member additionally needs an each-capable not_in in the engine).
# DECLARED; NOT EXECUTED by C1 in this packet (runner: run_loader_tests.yml -e cases_file=cases-c1-contract-admission.yml).
schema_version: 1
binds_to: null
loader_entry:
  role: podman
  tasks_from: resolve
isolated_source:
  files:
    - ansible/roles/podman/tasks/load_manifests.yml
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/validate_resolved_config.yml
    - ansible/roles/podman/defaults/main.yml
    - ansible/roles/podman/filter_plugins/lme_manifests.py
    - ansible/site.yml
    - testing/remote_harness/templates/lme-controller-seed.sh.j2
    - testing/remote_harness/templates/macros/controller_seed.j2
    - testing/remote_harness/templates/lme-seed-launcher.sh.j2
    - testing/remote_harness/templates/lme-seed-launch-params.json.j2
    # host_scope.shared_artifacts.installed_set_gate (codex-tick313 R2(a)): the loader reads EVERY declared template
    # (resolve.yml artifact_sources), whether or not the artifact is active for the profile
    - testing/remote_harness/templates/lme-seed-installed-set-gate.sh.j2
    - testing/loader-tests-r4/fixtures/declared-import/relocated/params.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/relocated/lib/params_macros.j2
    - testing/loader-tests-r4/fixtures/declared-import/with-context.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/undeclared-root.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/getitem.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/call.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/other-filter.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/rebind.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/stray-filter.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/ansible-filter.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-filter-if-body.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-filter-if-test.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-filter-condexpr.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-test-if-body.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-test-if-test.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-test-condexpr.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-reject-unknown-test.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-map-unknown-filter.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-test-name-nonliteral.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-known-capabilities.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/macro-shadow.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-map-map-unknown-filter.json.j2
    - testing/loader-tests-r4/fixtures/declared-import/sf-map-reject-unknown-test.json.j2
  trees:
    - manifests
play_vars_source:
  file: ansible/site.yml
  play_index: 0
  restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]


task_names:
  publish: &T_PUB "Publish namespaced resolved config, origins and enable flags (OUTPUT names)"

fixtures: {}

cases:
  # ---- controls: the declared contracts are admitted; the boundary is unchanged ----
  - name: ca-declared-admitted
    kind: control
    profile: remote-harness
    expected_now: pass
    invariant_task: "control: the declared bootstrap contracts pass contract_admission at resolve"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.derive.home.tool == 'getent'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.checksum_format.terminator == 'newline'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.staging_retention.lease.lock_file.mode == '0600'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.genesis.launch.stage_root.act.var == 'rh_gen_act'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.carried_param == 'ssh_auth_mode'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.launcher_file == 'lme-seed-launch.sh'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.params_rel == 'testing/remote_harness/templates/lme-seed-launch-params.json.j2'"
      - "lme_remote_harness_overridden_paths == []"
  - name: ca-override-admitted-tool-location
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {bootstrap: {os_tools: {getent: {path: /usr/local/bin/getent, identity: {kind: file_sha256, sha256: 15e94df587fe67e13e9b4255163d5d5c854d48272aff771a1773eeb222f41fb5}}}}}}}}
    expected_now: pass
    invariant_task: "control: an admitted os_tools path+identity override keeps satisfying the seed_launch.derive.home.tool reference"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.getent.path == '/usr/local/bin/getent'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.derive.home.tool == 'getent'"
      - "lme_remote_harness_overridden_paths == ['controller.bootstrap.os_tools.getent.identity.kind', 'controller.bootstrap.os_tools.getent.identity.sha256', 'controller.bootstrap.os_tools.getent.path']"
  - name: ca-override-pinned-contract-refused
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: getent}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "lme_global_override.remote_harness.controller.bootstrap.seed_launch.derive.home.tool is not a tunable path"
  # ---- registry fail-closed ----
  - name: ca-registry-absent-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: null}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry remote_harness_schema.contract_admission must declare {patterns, contracts, required_values}"
  - name: ca-registry-empty-checks-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: {contracts: {seed_launch: {checks: []}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry contract_admission.contracts.seed_launch must be {root, checks[, when_present]}"
  - name: ca-registry-unknown-kind-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: {contracts: {lock_file: {checks: [{path: mode, regex: '^0600$'}]}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry contract_admission.contracts.lock_file.checks[0] must carry exactly one of path/at, exactly one check kind"
  # C1-CONTRACT-SCALAR-SHAPE (codex 193253): a membership check without a declared value shape is a malformed registry
  - name: ca-registry-within-without-subject-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: {contracts: {seed_launch: {checks: [{path: derive.home.tool, within: [controller.bootstrap.os_tools]}]}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry contract_admission.contracts.seed_launch.checks[0] within argument/modifiers are malformed"
  # C1-ACT-REQUIRED-COMPONENT (codex 193337): the required-value declaration is itself fail-closed (its runtime
  # admission now applies on this lineage too: ROUTE-X P2 declares genesis.launch on m1-1)
  - name: ca-registry-required-value-unknown-pattern-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: {required_values: {genesis_act: {pattern: no_such_pattern}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry contract_admission.required_values.genesis_act must be {var_at, pattern (a declared patterns name)"
  # ---- seed_launch: scalar reference shape (C1-CONTRACT-SCALAR-SHAPE; x(bs, dh.tool) indexes os_tools with ONE key) ----
  - name: ca-seed-home-tool-empty-mapping-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: {}}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.tool fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-home-tool-empty-list-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: []}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.tool fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-home-tool-singleton-list-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: [getent]}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.tool fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-carried-mode-singleton-list-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {env: {carried: {when: {mode: [run]}}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.env.carried.when.mode fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-carried-mode-empty-mapping-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {env: {carried: {when: {mode: {}}}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.env.carried.when.mode fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-carried-agent-singleton-list-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {env: {carried: {when: {ssh_auth_agent: [carried]}}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.env.carried.when.ssh_auth_agent fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  - name: ca-seed-carried-agent-empty-list-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {env: {carried: {when: {ssh_auth_agent: []}}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.env.carried.when.ssh_auth_agent fails contract_admission.seed_launch (within): must be a non-empty string (subject: scalar"
  # ---- seed_launch ----
  - name: ca-seed-home-tool-missing-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: missing_tool}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.tool fails contract_admission.seed_launch (within)"
  - name: ca-seed-home-tool-not-seed-admitted-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: curl}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.tool fails contract_admission.seed_launch (within)"
  - name: ca-seed-home-field-type-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {field: '6'}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.derive.home.field fails contract_admission.seed_launch (positive_int)"
  - name: ca-seed-env-order-undeclared-name-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {env: {order: [PATH, LC_ALL, HOME, EXTRA_NAME]}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "remote_harness.controller.bootstrap.seed_launch.env.order fails contract_admission.seed_launch (within)"
  - name: ca-seed-env-order-malformed-name-refused
    kind: control
    profile: remote-harness
