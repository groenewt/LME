---
# cases-c1-contract-admission.yml -- C1-BOOTSTRAP-CONTRACT-VALUE-ADMISSION real-loader controls
# (codex-C1-four-contract-admission-audit-20260924-191117, MEDIUM; route codex-tick213-215-route-C1-caller-decisions-
# 20260924-191017 (2)). Binding blocks (loader_entry, isolated_source, play_vars_source, task_names) are copied
# unchanged from cases-c1-iso6-rh.yml (same loader slice: the loader reads the declared seed templates).
# Every reject case makes ONE registry-declared check of lme_config_registry.remote_harness_schema.contract_admission
# refuse at resolve (the publish task; before any mutation). The boundary is the validator's own message prefix
# `<policy_key>.<path> fails contract_admission.<contract> (<kind>)`. Invalid dependencies (a tool the seed does not
# admit, an env name outside base_env/inherited, a mode outside mode_args) refuse HERE instead of at render
# (controller_seed.j2 x(bs, dh.tool)). The declaration-pinned / tunable boundary is unchanged:
# ca-override-pinned-contract-refused (a pinned contract leaf stays pinned) and ca-override-admitted-tool-location
# (an admitted os_tools path+identity override keeps satisfying the reference). m1-1 LINEAGE COPY: genesis.launch is
# not declared here, so the registry contract genesis_act is skipped (when_present) and its cases (ca-act-*) exist in
# the m1-1g copy only; otherwise identical to the m1-1g copy.
# SECOND EDIT (C1-CONTRACT-SCALAR-SHAPE codex 193253 + C1-ACT-REQUIRED-COMPONENT / regex scope codex 193337; after the
# 3af3d9e8 commit): every `within` declares its value shape (subject) -- wrong-type controls {} / [] / [x] refuse at the
# resolver with the shape reason; required_values is a fail-closed registry block; bracket negation is an unsupported
# ERE input. ca-registry-absent's needle now names required_values. The act-value cases (ca-act-*) stay m1-1g only.
# Earlier cases unchanged.
# THIRD EDIT (codex-tick217 R1 launcher-schema slice, route hunk for C1): isolated_source adds the launcher entry
# template (host_scope.shared_artifacts.launcher; the loader reads every declared template); the declared control also
# asserts the launcher fields; one reject case per new check of bundle_launcher / seed_launcher (incl. the resolve-time
# mirrors of controller_seed.j2 launch_word / launch_params / launch_exec), the new vocabulary's fail-closed registry
# controls, and the launcher template proof. The block is byte-identical on both lineages. Earlier cases unchanged.
# FOURTH EDIT (C1 follow-up: route F3 / F4 dispositions): seed_launcher.template_rel is admitted by equals_registry
# against host_scope.shared_artifacts.launcher.templates[0] (the registry holds the one literal), so
# ca-launcher-template-rel-other-refused's needle names equals_registry; the fixed-value-as-param note now says the
# registry and the macro (route F3 launch_fixed) apply the same rule; +4 cases (the registry side differs, and the
# equals_registry vocabulary fail-closed: absent path, index outside the list, malformed argument), appended
# byte-identically on both lineages.
# FIFTH EDIT (codex 203437 limit: rejections alone do not qualify the positive variations): +4 PASS cases, appended
# byte-identically on both lineages. There is NO composability matrix for the contract files (loader-tests-r4 holds
# per-concern case files only), so they are pass cases here with overlay_merge of the profile DECLARATION (these
# fields are declaration-pinned, never lme_global_override tunables): a renamed launcher member, a renamed carried
# parameter (mode_args.run and carried_param together), a second carried ssh_auth mode, and all three composed.
# DECLARED; NOT EXECUTED by C1 in this packet (runner: run_loader_tests.yml -e cases_file=cases-c1-contract-admission.yml).
schema_version: 1
binds_to: null
loader_entry:
  role: podman
  tasks_from: resolve
isolated_source:
  files:
    - ansible/roles/podman/tasks/load_manifests.yml
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/validate_resolved_config.yml
    - ansible/roles/podman/defaults/main.yml
    - ansible/roles/podman/filter_plugins/lme_manifests.py
    - ansible/site.yml
    - testing/remote_harness/templates/lme-controller-seed.sh.j2
    - testing/remote_harness/templates/macros/controller_seed.j2
    - testing/remote_harness/templates/lme-seed-launcher.sh.j2
  trees:
    - manifests
play_vars_source:
  file: ansible/site.yml
  play_index: 0
  restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]


task_names:
  publish: &T_PUB "Publish namespaced resolved config, origins and enable flags (OUTPUT names)"

fixtures: {}

cases:
  # ---- controls: the declared contracts are admitted; the boundary is unchanged ----
  - name: ca-declared-admitted
    kind: control
    profile: remote-harness
    expected_now: pass
    invariant_task: "control: the declared bootstrap contracts pass contract_admission at resolve (genesis_act skipped: not declared)"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.derive.home.tool == 'getent'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.checksum_format.terminator == 'newline'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.staging_retention.lease.lock_file.mode == '0600'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.genesis.launch is not defined"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.carried_param == 'ssh_auth_mode'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.launcher_file == 'lme-seed-launch.sh'"
      - "lme_remote_harness_overridden_paths == []"
  - name: ca-override-admitted-tool-location
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {bootstrap: {os_tools: {getent: {path: /usr/local/bin/getent, identity: {kind: file_sha256, sha256: 15e94df587fe67e13e9b4255163d5d5c854d48272aff771a1773eeb222f41fb5}}}}}}}}
    expected_now: pass
    invariant_task: "control: an admitted os_tools path+identity override keeps satisfying the seed_launch.derive.home.tool reference"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.os_tools.getent.path == '/usr/local/bin/getent'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.derive.home.tool == 'getent'"
      - "lme_remote_harness_overridden_paths == ['controller.bootstrap.os_tools.getent.identity.kind', 'controller.bootstrap.os_tools.getent.identity.sha256', 'controller.bootstrap.os_tools.getent.path']"
  - name: ca-override-pinned-contract-refused
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {bootstrap: {seed_launch: {derive: {home: {tool: getent}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "lme_global_override.remote_harness.controller.bootstrap.seed_launch.derive.home.tool is not a tunable path"
  # ---- registry fail-closed ----
  - name: ca-registry-absent-refused
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {remote_harness_schema: {contract_admission: null}}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "registry remote_harness_schema.contract_admission must declare {patterns, contracts, required_values}"
  - name: ca-registry-empty-checks-refused
