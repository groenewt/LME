      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.launcher_file == 'lme-seed-entry.sh'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.seed_file == 'lme-controller-seed.sh'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.member == 'bundle.launcher_file'"
      - "lme_remote_harness_overridden_paths == []"
  # carried-parameter rename: the carried mode's parameter and carried_param renamed TOGETHER (one var_name token)
  - name: ca-launcher-carried-param-renamed-admitted
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {seed_launch: {mode_args: {run: ['--ssh-auth', '{auth_mode}', '--', '{args}']}}, seed_launcher: {carried_param: auth_mode}}}}}}}
    expected_now: pass
    invariant_task: "variation: a renamed carried parameter, consistent in mode_args.run and carried_param, is admitted"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.carried_param == 'auth_mode'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.mode_args.run == ['--ssh-auth', '{auth_mode}', '--', '{args}']"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launch.mode_args['run-local'] == ['--runner', '{runner}', '--', '{args}']"
      - "lme_remote_harness_overridden_paths == []"
  # a SECOND carried ssh_auth mode: the where-selection admits every carried mode that declares its socket_env
  # (the schema carries ONE seed-launch mode, env.carried.when.mode, a scalar; ssh_auth modes may be many)
  - name: ca-launcher-second-carried-mode-admitted
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {ssh_auth: {modes: {agent_alt: {agent: carried, socket_env: LME_AGENT_SOCK, ssh_common_args: '-o IdentitiesOnly=no'}}}}}}}}}
    expected_now: pass
    invariant_task: "variation: a second carried ssh_auth mode with its own socket_env is admitted"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.ssh_auth.modes.agent_alt.socket_env == 'LME_AGENT_SOCK'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.ssh_auth.modes.agent.socket_env == 'SSH_AUTH_SOCK'"
      - "(lme_resolved.remote_harness.policy.controller.bootstrap.ssh_auth.modes.values() | selectattr('agent', 'equalto', 'carried') | list | length) == 2"
      - "lme_remote_harness_overridden_paths == []"
  # all three variations composed in ONE declaration
  - name: ca-launcher-variations-composed-admitted
    kind: control
    profile: remote-harness
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {bundle: {launcher_file: lme-seed-entry.sh}, seed_launch: {mode_args: {run: ['--ssh-auth', '{auth_mode}', '--', '{args}']}}, seed_launcher: {carried_param: auth_mode}, ssh_auth: {modes: {agent_alt: {agent: carried, socket_env: LME_AGENT_SOCK, ssh_common_args: '-o IdentitiesOnly=no'}}}}}}}}}
    expected_now: pass
    invariant_task: "variation: launcher rename, carried-parameter rename and a second carried mode compose"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.bootstrap.bundle.launcher_file == 'lme-seed-entry.sh'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.seed_launcher.carried_param == 'auth_mode'"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.ssh_auth.modes.agent_alt.socket_env == 'LME_AGENT_SOCK'"
      - "lme_remote_harness_overridden_paths == []"
