---
# cases-c1-iso6-multinode.yml -- copy of cases-c1-iso5-multinode.yml; ONE edit: isolated_source.files add the two
# declared seed templates (runner limit one_case.yml:153-155; C1-ARTIFACT-REUSE-INPUT-COVERAGE). Expectations UNCHANGED:
# the four 2.17 UNEXPECTED-FAIL receipts (8308eee5ad13-reproduction-iso5-mn-217-*T031135Z) are retained; the new source
# (MULTINODE-217-TEMPLATED-PORT-TYPE) is judged by these same unchanged assertions on both cores.
# cases-c1-iso5-multinode.yml -- C1-MULTINODE-REAL-PATH on the REAL manifests/profiles/multinode.yml (no fixture).
# Tree iso5-p-cand (head 8308eee). Entry = load_manifests (site.yml path). Real resolution with declared defaults, valid
# overrides (extra-var bind addresses, tailscale serve, inventory bind address), re-entry default -> multinode, and
# forged-fact negatives: a static snapshot pin and a lazy profile pin refused at the sentinel; a pin equal to the global
# bytes refused at the replace check; a global-file pin refused at the global bind. Residual (not tested, stated): an -e
# lazy template that observes play state and changes value after the replace check.
schema_version: 1
binds_to: null
loader_entry: {role: podman, tasks_from: load_manifests}
isolated_source:
  files: [ansible/roles/podman/tasks/load_manifests.yml, ansible/roles/podman/tasks/resolve.yml, ansible/roles/podman/tasks/validate_resolved_config.yml,
          ansible/roles/podman/defaults/main.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, ansible/site.yml,
          testing/remote_harness/templates/lme-controller-seed.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2]
  trees: [manifests]
play_vars_source: {file: ansible/site.yml, play_index: 0, restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]}
task_names:
  bind: &T_BIND "Bind the loaded config facts to the declared manifest bytes (fail-closed, pre-mutation)"
  sentinel: &T_SENT "Refuse a profile fact the loader cannot write (sentinel must be the declared global bytes)"
  replace: &T_REPL "Refuse a profile fact the declared profile load did not replace (fail-closed, pre-mutation)"
fixtures: {}
cases:
  - name: mn-real-default-ports
    kind: control
    profile: multinode
    expected_now: pass
    invariant_task: "control: the REAL multinode profile resolves with its declared defaults"
    assert_that: ["{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_default') }}"]
    dump_vars: [lme_services, lme_resolved_revision]
  - name: mn-real-bind-override
    kind: control
    profile: multinode
    extra_vars: {fleet_output_bind_address: 100.70.80.90, fleet_enrollment_bind_address: 100.70.80.91}
    expected_now: pass
    invariant_task: "control: declared bind-address inputs reach the composed services"
    assert_that:
      - "{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_bind', '100.70.80.90') }}"
      - "{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_fleet_bind', '100.70.80.91') }}"
  - name: mn-real-tailscale-override
    kind: control
    profile: multinode
    extra_vars: {tailscale_serve_services: true}
    expected_now: pass
    invariant_task: "control: tailscale serve moves the ES backend to 127.0.0.1:19200 (tailnet 9200)"
    assert_that: ["{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_tailscale') }}"]
  - name: mn-real-inventory-override
    kind: control
    profile: multinode
    inventory_vars: {fleet_output_bind_address: 100.70.80.92}
    expected_now: pass
    invariant_task: "control: an inventory bind address reaches the composed services"
    assert_that: ["{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_bind', '100.70.80.92') }}"]
  - name: mn-real-reentry
    kind: profile_switch
    profile: multinode
    initial_profile: default
    switch_to: multinode
    expected_now: pass
    invariant_task: "control: re-entry default -> multinode binds the multinode profile"
    assert_that: ["{% import 'macros/c1_iso5.j2' as m %}{{ m.check('mn_profile_bound') }}"]
  - name: mn-forged-static-snapshot-refused
    kind: control
    profile: multinode
    extra_vars:
      tailscale_serve_services: true
      _lme_profile_file:
        profile_overlay:
          lme_global: {}
          services: {elasticsearch: {publish_ports: [{host: 9200, container: 9200, bind: 0.0.0.0, tailnet_port: 9200, serve: tcp}]}}
          vars: {es_discovery: single-node}
    expected_now: reject
    expected_failed_task: *T_SENT
    boundary_msg: "is bound outside the loader"
  - name: mn-lazy-profile-pin-refused
    kind: control
    profile: multinode
    extra_vars: {_lme_profile_file: "{% import 'macros/c1_iso5.j2' as m %}{{ m.pin('profile_multinode') }}"}
    expected_now: reject
    expected_failed_task: *T_SENT
    boundary_msg: "is bound outside the loader"
  - name: mn-global-pin-refused
    kind: control
    profile: multinode
    extra_vars: {_lme_profile_file: "{% import 'macros/c1_iso5.j2' as m %}{{ m.pin('global_manifest') }}"}
    expected_now: reject
    expected_failed_task: *T_REPL
    boundary_msg: "still holds the sentinel"
  - name: mn-global-file-pin-refused
    kind: control
    profile: multinode
    extra_vars: {_lme_global_file: {lme_global: {}}}
    expected_now: reject
    expected_failed_task: *T_BIND
    boundary_msg: "does not match the declared manifest bytes"
