---
# managed-bootstrap-receipts.yml -- r4 R3-MANAGED-IDENTITY (codex-213359). The ONLY bootstrap receipts
# run_loader_tests.yml accepts for interpreter_policy=managed_only, each by the sha256 of its bytes and the
# review that accepted it. This file is a hashed harness instrument: adding an entry changes the instrument
# index and is itself reviewed. EMPTY today: tick112 (claude-tick112-artifact-acquisition-receipt, d26e4b4c)
# acquired archives only and makes no installed-executable claim, so managed_only FAILS CLOSED. An ACQUISITION
# receipt is never admissible here (it proves archives were fetched, not that executables were installed).
#
# DETACHED REVIEW (codex-tick332 F3; acyclic, no self-reference):
#   R  = the immutable observation receipt, projected by the run-local runner bootstrap_receipt
#        (project_bootstrap_receipt.yml) from the SEALED installation receipt <generation>/receipts/toolchain.json
#        plus actual executable measurements, and re-measured by the separate runner bootstrap_receipt_readback
#        (readback_bootstrap_receipt.yml). R carries NO field claiming a review of R (receipt_contract.forbidden_keys).
#   A  = the reviewer's separate review message: it cites sha256(R) and the readback record; it is never inside R.
#   entry (below, under accepted) = {sha256: sha256(R), review: {locator: <A's locator>, message_id: <A's message id>,
#        sha256: sha256(A)}}.
#   Neither R nor A contains this file's digest, so R -> A -> entry is acyclic. The review is a detached EVIDENCE
#   record: it never changes a measured value, and run_loader_tests.yml still binds the exact R bytes, the selected
#   executable paths/sha256, the managed root and the resolved-run toolchain receipt (see receipt_contract).
# REVIEW ARTIFACT A (codex-tick337-detached-review-binding-decision-20260925): the runner READS A's actual bytes --
#   its full-byte sha256 == entry.review.sha256, its message_id == entry.review.message_id, its decision == accepted,
#   its receipt_sha256 == the digest the runner itself MEASURED of R -- before any dependent case (review_contract).
#   A is located ONLY by review_contract.locator: anchored at the resolved run's evidence root (the parent of
#   lme_resolved_run.work_root = <work root>/<sub_roots.run>, the existing RH-RUNNER-RESOLVED-WORKROOT contract), at
#   <runners[locator.runner_key]>/<attempt>/<locator.leaf>, all three read from the resolved profile / this file -- no
#   literal directory name, no workspace path, no channel path, no host name, no search. MAIN
#   relocates A's published bytes there unchanged (a relocation never changes bytes; the digest proves it).
#   Projection and readback never read A (they run before A exists); only managed_only loader runs require it.
# Adding an entry is the ONLY change of the Y commit (X -> Y); receipt_contract, entry_contract, review_contract and
# payload_binding_contract stay fixed.

# PARSED-BYTE BINDING (codex-tick355 BOOTSTRAP-READBACK-PARSED-BYTE-BINDING, pattern action). A stat checksum proves only
# the inode it measured; a rename-replacement between the stat and the read hands the read other bytes. Every consumer
# that stats, reads and PARSES a receipt / review / seal therefore reads it ONCE (slurp), hashes that one decoded payload
# against an ADMITTED digest in its own task BEFORE anything parses it, parses only that same payload, and records /
# reports the verified read digest. One declaration; the check is macros/bootstrap_receipt.j2 op payload_binding
# (template_vars content, expected, stat, sealed -- all passed explicitly; see the macro header for the reasons).
payload_binding_contract:
  macro: macros/bootstrap_receipt.j2
  op: payload_binding
  inputs: [content, expected, sealed, stat]
  outputs: [bound, expected_sha256, op, read_sha256, reasons, stat_sha256]
  reasons: [expected-not-sha256, content-missing, read-mismatch, stat-not-mapping, stat-absent, stat-not-regular,
            stat-link, stat-mismatch, stat-writable]
  rule: {read_once: true, bind_task_precedes_parse: true, parse_same_content: true, record_read_digest: true,
         lookup_file_text_forbidden: true}
  # the bound consumers (register -> admitted digest). run_loader_tests.yml binds R and A INLINE with the same rule
  # (receipt_raw / review_raw: hash asserted before parse); it does not call the macro, which is not an instrument on
  # its roster.
  consumers:
    - {file: readback_bootstrap_receipt.yml, read: _rh_brr_rraw, expected: brr_receipt_sha256, stat: _rh_brr_rst, sealed: true}
    - {file: readback_bootstrap_receipt.yml, read: _rh_brr_tcraw, expected: lme_resolved_run.receipt.sha256, stat: _rh_brr_tcst, sealed: true}
    - {file: readback_bootstrap_receipt.yml, read: _tree, expected: '_rh_brr_seal.results[0].stat.checksum', stat: '_rh_brr_seal.results[0]', sealed: false}
    - {file: project_bootstrap_receipt.yml, read: _rh_br_tc_raw, expected: lme_resolved_run.receipt.sha256, stat: _rh_br_tc, sealed: true}
    - {file: project_bootstrap_receipt.yml, read: _rh_br_bm_raw, expected: '_rh_br_st.results[7].stat.checksum', stat: '_rh_br_st.results[7]', sealed: false}
    - {file: run_loader_tests.yml, read: receipt_raw, expected: managed_bootstrap_receipt_sha256, stat: receipt_stat, sealed: false, form: inline}
    - {file: run_loader_tests.yml, read: 'review_raw.results[0]', expected: managed_bootstrap_catalog_entry.review.sha256, stat: 'review_path_stat.results[3]', sealed: true, form: inline}
    - {file: run_loader_tests.yml, read: 'review_raw.results[1]', expected: A.readback.sha256, stat: 'review_path_stat.results[4]', sealed: true, form: inline}
    # RX-CATALOG-READ (codex-tick361): THIS file, read once by the loader and bound BEFORE parse to the regular-file blob
    # the declared source_commit records at its path (declared git: ls-tree of source_commit vs hash-object --no-filters
    # --stdin of the read bytes). The anchor is the git object id, never a digest declared here (no self-admission).
    - {file: run_loader_tests.yml, read: managed_bootstrap_catalog_raw, expected: 'git blob of source_commit at managed_bootstrap_catalog_rel (managed_bootstrap_catalog_tree)', stat: none, sealed: false, form: inline_git_blob}
    # codex-tick368: the projection and readback read THIS file the same way; anchors are admitted revisions, never HEAD:
    # projection = -e br_source_commit (checkout asserted clean at it); readback = R's source.commit (R bound to brr_receipt_sha256).
    - {file: project_bootstrap_receipt.yml, read: _rh_br_catraw, expected: 'git blob of br_source_commit at this path (_rh_br_cattree)', stat: none, sealed: false, form: inline_git_blob}
    - {file: readback_bootstrap_receipt.yml, read: _rh_brr_catraw, expected: 'git blob of R source.commit at this path (_rh_brr_cattree)', stat: none, sealed: false, form: inline_git_blob}

# The shape of R. Consumed by run_loader_tests.yml (managed_only), the producer project_bootstrap_receipt.yml
# (via macros/bootstrap_receipt.j2) and readback_bootstrap_receipt.yml: one declaration, three consumers.
receipt_contract:
  kind: managed_interpreter_bootstrap_receipt
  schema: 2                       # schema 1 (codex-213359) carried review {message_id, sha256} INSIDE R: retired
  top_level_keys: [bootstrap, config, executables, kind, managed_root, measured, producer_claims, projector, schema,
                   selected, source, toolchain_receipt]
  forbidden_keys: [review]        # a receipt claiming its own review refuses (it cannot hash bytes holding its id)
  executable_keys: [probe_ansible_playbook, probe_python, runner_python]
  executable_fields: [path, sha256]
  selected_keys: [probe_ansible_playbook, probe_python_executable, runner_python]
  toolchain_receipt_keys: [generation, generation_dir, path, schema, sha256]

# The shape of one accepted entry (the detached review binding).
entry_contract:
  entry_keys: [review, sha256]
  review_keys: [locator, message_id, sha256]
  message_id_regex: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
  sha256_regex: '^[0-9a-f]{64}$'

# The review artifact A (codex-tick337). Consumed ONLY by run_loader_tests.yml (managed_only).
review_contract:
  locator:
    fields: [anchor, rel]           # (named `fields`, not `keys`: a Jinja attribute `keys` is the mapping method)
    # run_evidence_root = dirname(lme_resolved_run.work_root) = <work root>/<work_roots.sub_roots.run> (the seed-admitted
    # run root; runner evidence dirs live directly under it). No other anchor exists.
    anchors: [run_evidence_root]
    # rel = <runners[runner_key]>/<attempt>/<leaf> (exactly 3 segments). The directory NAME is never written here: the
    # runner reads it from the RESOLVED controller.bootstrap.work_roots.runners[runner_key]; the attempt is judged by
    # the resolved controller.bootstrap.genesis.seed_step_record.attempt (fullmatch). A lives in the COMPLETED readback
    # attempt it reviews, beside readback.yml (codex-tick339-340 location ruling; C1 review-location-join.yml).
    runner_key: bootstrap_receipt_readback
    leaf: review.yml
  # A is YAML: one mapping with EXACTLY required_keys plus any of optional_keys (the channel-message envelope);
  # nothing else (so no catalog digest can ride inside A).
  required_keys: [decision, kind, message_id, receipt_sha256, schema_version]
  optional_keys: [authority, in_reply_to, notes, observed_at_utc, readback, recipient, sender]
  kind: managed_bootstrap_receipt_review
  schema_version: 1
  decision_values: [accepted, rejected]
  accepted_decision: accepted
  immutable: {mode_write_bits: none, regular_file: true, link: false}

accepted: []
#  - {sha256: <64 hex of R's bytes>,
#     review: {locator: {anchor: run_evidence_root, rel: bootstrap-receipt-readback/<readback attempt>/review.yml},
#              message_id: <A's message id>, sha256: <64 hex of A's bytes>}}
# A (example shape, YAML, 0400):
#   schema_version: 1
#   kind: managed_bootstrap_receipt_review
#   message_id: <A's message id>
#   receipt_sha256: <64 hex of R's bytes>
#   decision: accepted
#   readback: {path: <abs path of the readback.yml beside A>, sha256: <its digest>}   # optional; when present the runner
#             reads that record once, binds its bytes to this sha256 before parsing, and requires verdict PASS for R (RUN-4)
