---
# cases-c1-iso6-endpoint.yml -- C1-EFFECTIVE-ENDPOINT-BINDING controls (codex 035141), hand-authored DATA; expressions
# in macros/c1_iso6_endpoint.j2. Head seed06-final after commit B; probe tree iso6-p-candB (FIXTURE commit: the
# worktree's IN-PROGRESS remote-harness.yml -- carries the route's composition.address / endpoint_key / inventory_forms
# (codex 040323) -- sha recorded in the probe commit; INTERIM: the route's PUBLISHED profile bytes (MAIN relays the
# sha) replace it for final receipts -- + worktree seed templates + toolchain lock).
# Entry = resolve. Baseline inventory: t1 explicit port (int) + address, t2 upper-case address + absent port + ProxyJump.
# Positives: exact bound endpoints in the route key order; unchanged re-projection byte-identical; the SAME inventory id
# with a changed address / explicit port / absent port / route / owner moves this host's, the controller's and the
# deployment's scope identities (policy unchanged); a string port binds as the same canonical key as the int.
# Negatives: every value the declared rule refuses; a rule the resolver cannot apply as declared; verifier tampers.
# iso7 (seed06-final a99fdcd, probe tree iso7-p-cand a4f16f92, fixture profile r3h fabb0712): + owner-absent from the
# declared owner rule; + C1-ENDPOINT-EXPLICIT-NULL paired absent / supplied-null controls (real inventory + projection);
# moved_port_absent now drops the key (attributed; a supplied null no longer means absent).
# NOT covered here (consumer-owned, route/B): an old endpoint receipt / another target's artifact failing at the actual
# consumers; C1 supplies the moved scope_sha256 they bind.
schema_version: 1
binds_to: null
loader_entry: {role: podman, tasks_from: resolve}
isolated_source:
  files: [ansible/roles/podman/tasks/load_manifests.yml, ansible/roles/podman/tasks/resolve.yml, ansible/roles/podman/tasks/validate_resolved_config.yml,
          ansible/roles/podman/defaults/main.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, ansible/site.yml,
          testing/remote_harness/templates/lme-controller-seed.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2]
  trees: [manifests]
play_vars_source: {file: ansible/site.yml, play_index: 0, restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]}
task_names:
  publish: &T_PUB "Publish namespaced resolved config, origins and enable flags (OUTPUT names)"
  scope: &T_SCOPE "Resolve the remote-harness scope context (controller + inventory scopes; one composition each)"

hosts:
  ok: &HOSTS
    localhost: {ansible_connection: local}
    t1: {ansible_connection: local, ansible_host: 10.0.0.1, ansible_port: 2222, lme_toolchain_owner: u1}
    t2: {ansible_connection: local, ansible_host: Host-B, ansible_ssh_common_args: '-o ProxyJump=jump@j1', lme_toolchain_owner: u2}
  groups: &GROUPS {lme_toolchain_targets: [t1, t2]}
base: &BASE
  kind: control
  profile: remote-harness
  inventory_hosts: *HOSTS
  inventory_groups: *GROUPS
  probe_hosts: all
  expected_outcome_hosts: [localhost, t1, t2]
fixtures: {}

cases:
  - <<: *BASE
    name: ep-baseline-bound
    expected_now: pass
    invariant_task: "endpoint: every target's effective declared endpoint is bound; changes move the identities; unchanged is stable"
    assert_that:
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('verified') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('endpoints', \"{'t1': ['10.0.0.1', '2222', '', 'u1'], 't2': ['host-b', '<ssh_config>', 'jump@j1', 'u2']}\") }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('same_all_hosts') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('unchanged_stable') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('moved_address') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('moved_port') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('moved_port_absent') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('moved_route') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('moved_owner') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('absent_address') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('absent_owner') }}"
    dump_vars: [lme_resolved, lme_resolved_revision]
  # ---- C1-ENDPOINT-EXPLICIT-NULL (codex 063540): paired ABSENT vs SUPPLIED-NULL, real inventory (canonical
  # resolution) and the same projection. Absent -> the declared absent rule; a supplied null -> refused. Owner absence
  # is the separate declared owner rule (fixture profile fabb0712: inventory.owner {var: lme_toolchain_owner, absent: ''}).
  - <<: *BASE
    name: ep-absent-all-bound
    inventory_hosts:
      localhost: {ansible_connection: local}
      t1: {ansible_connection: local}
      t2: {ansible_connection: local, ansible_host: Host-B, ansible_ssh_common_args: '-o ProxyJump=jump@j1', lme_toolchain_owner: u2}
    expected_now: pass
    invariant_task: "endpoint: absent address/port/common args/owner bind the declared absent values"
    assert_that:
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('verified') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('endpoints', \"{'t1': ['t1', '<ssh_config>', '', ''], 't2': ['host-b', '<ssh_config>', 'jump@j1', 'u2']}\") }}"
    dump_vars: [lme_resolved, lme_resolved_revision]
  - <<: *BASE
    name: ep-null-address-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_host: null}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "address ansible_host was supplied as None (NoneType); a supplied address must be a non-empty string"
  - <<: *BASE
    name: ep-null-port-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_port: null}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "port ansible_port was supplied as null; a supplied port must be an explicit port by the declared rule"
  - <<: *BASE
    name: ep-null-common-args-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_ssh_common_args: null}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "ansible_ssh_common_args None is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-null-owner-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, lme_toolchain_owner: null}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "a supplied owner must be a string; got None (NoneType)"
  - <<: *BASE
    name: ep-null-address-projection-refused
    expected_now: reject
    invariant_task: &VN1 "endpoint: a supplied null address is refused through the projection"
    expected_failed_task: *VN1
    boundary_msg: "address ansible_host was supplied as None (NoneType)"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('null_address') }}"]
  - <<: *BASE
    name: ep-null-port-projection-refused
    expected_now: reject
    invariant_task: &VN2 "endpoint: a supplied null port is refused through the projection"
    expected_failed_task: *VN2
    boundary_msg: "port ansible_port was supplied as null"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('null_port') }}"]
  - <<: *BASE
    name: ep-null-common-args-projection-refused
    expected_now: reject
    invariant_task: &VN3 "endpoint: supplied null common args are refused through the projection"
    expected_failed_task: *VN3
    boundary_msg: "ansible_ssh_common_args None is none of the declared accepted inventory forms"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('null_common_args') }}"]
  - <<: *BASE
    name: ep-null-owner-projection-refused
    expected_now: reject
    invariant_task: &VN4 "endpoint: a supplied null owner is refused through the projection"
    expected_failed_task: *VN4
    boundary_msg: "a supplied owner must be a string; got None (NoneType)"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('null_owner') }}"]
  - <<: *BASE
    name: ep-reapply-stable
    kind: profile_switch
    initial_profile: remote-harness
    switch_to: remote-harness
    expected_now: pass
    invariant_task: "endpoint: an unchanged reapply binds the identical endpoints and revision"
    assert_that:
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('verified') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('endpoints', \"{'t1': ['10.0.0.1', '2222', '', 'u1'], 't2': ['host-b', '<ssh_config>', 'jump@j1', 'u2']}\") }}"
    dump_vars: [lme_resolved, lme_resolved_revision]
  - <<: *BASE
    name: ep-string-port-canonical
    inventory_hosts:
      localhost: {ansible_connection: local}
      t1: {ansible_connection: local, ansible_host: 10.0.0.1, ansible_port: '2222', lme_toolchain_owner: u1}
      t2: {ansible_connection: local, ansible_host: Host-B, ansible_ssh_common_args: '-o ProxyJump=jump@j1', lme_toolchain_owner: u2}
    expected_now: pass
    invariant_task: "endpoint: an INI-style string port binds as the same canonical key as the int"
    assert_that:
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('verified') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('endpoints', \"{'t1': ['10.0.0.1', '2222', '', 'u1'], 't2': ['host-b', '<ssh_config>', 'jump@j1', 'u2']}\") }}"
    dump_vars: [lme_resolved, lme_resolved_revision]
  # ---- values the declared rule refuses (real loader) ----
  - <<: *BASE
    name: ep-port-leading-zero-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_port: '022'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is not an explicit port by the declared rule"
  - <<: *BASE
    name: ep-port-out-of-range-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_port: 70000}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is not an explicit port by the declared rule"
  - <<: *BASE
    name: ep-port-bool-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_port: true}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "(bool) is not an explicit port by the declared rule"
  # ATTRIBUTED CASE CHANGE (retained runs: 5e26f1b91cec-...-endpoint-219-...T041208Z HOSTS-MISMATCH -- t1 recorded no
  # outcome on 2.19.11; 5e26f1b91cec-...-endpoint-217-...T041823Z REJECTED-as-expected on all three hosts). A float on a
  # host's OWN ansible_port is handled differently by the two cores before/around the loader, so the host set is
  # core-dependent. The control now drives the float through the SAME resolver projection (t1's collected port value
  # replaced, as the moved_* positives do), evaluated identically on every host and both cores.
  - <<: *BASE
    name: ep-port-float-refused
    expected_now: reject
    invariant_task: &V3 "endpoint: a float port value is refused by the declared rule"
    expected_failed_task: *V3
    boundary_msg: "(float) is not an explicit port by the declared rule"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('alt_port_float') }}"]
  # ---- ENDPOINT PARITY (codex 040323): the declared accepted inventory forms (composition.inventory_forms, read by
  # the route's target_bootstrap.yml rh_conn + admit_transport.yml): absent, empty, EXACTLY the host mode's own
  # ssh_common_args -> ''; the ProxyJump form -> its capture; any other value refuses ----
  - <<: *BASE
    name: ep-forms-accepted-all-four
    inventory_hosts:
      localhost: {ansible_connection: local}
      t1: {ansible_connection: local, lme_ssh_auth_mode: tailnet_identity}
      t2: {ansible_connection: local, lme_ssh_auth_mode: tailnet_identity, ansible_ssh_common_args: ''}
      t3: {ansible_connection: local, lme_ssh_auth_mode: tailnet_identity, ansible_ssh_common_args: '-o IdentityAgent=none -o PubkeyAuthentication=no'}
      t4: {ansible_connection: local, lme_ssh_auth_mode: explicit_key, ansible_ssh_common_args: '-o IdentityAgent=none -o IdentitiesOnly=yes'}
      t5: {ansible_connection: local, lme_ssh_auth_mode: tailnet_identity, ansible_ssh_common_args: '-o ProxyJump=bastion.example:2200'}
    inventory_groups: {lme_toolchain_targets: [t1, t2, t3, t4, t5]}
    expected_outcome_hosts: [localhost, t1, t2, t3, t4, t5]
    expected_now: pass
    invariant_task: "endpoint: absent, empty and the host mode's exact args bind no jump; the ProxyJump form binds its capture"
    assert_that:
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('verified') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('endpoints', \"{'t1': ['t1', '<ssh_config>', '', ''], 't2': ['t2', '<ssh_config>', '', ''], 't3': ['t3', '<ssh_config>', '', ''], 't4': ['t4', '<ssh_config>', '', ''], 't5': ['t5', '<ssh_config>', 'bastion.example:2200', '']}\") }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('same_all_hosts') }}"
      - "{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('unchanged_stable') }}"
    dump_vars: [lme_resolved, lme_resolved_revision]
  - <<: *BASE
    name: ep-route-proxycommand-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_ssh_common_args: '-o ProxyCommand=nc %h %p'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-route-other-mode-args-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, lme_ssh_auth_mode: explicit_key, ansible_ssh_common_args: '-o IdentityAgent=none -o PubkeyAuthentication=no'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-route-mode-args-without-mode-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_ssh_common_args: '-o IdentityAgent=none -o PubkeyAuthentication=no'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-route-mode-args-plus-jump-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, lme_ssh_auth_mode: tailnet_identity, ansible_ssh_common_args: '-o IdentityAgent=none -o PubkeyAuthentication=no -o ProxyJump=j1'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-route-extra-option-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_ssh_common_args: '-o StrictHostKeyChecking=no'}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "is none of the declared accepted inventory forms"
  - <<: *BASE
    name: ep-address-empty-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, ansible_host: ''}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "address must be a non-empty string"
  - <<: *BASE
    name: ep-owner-not-string-refused
    inventory_hosts: {localhost: {ansible_connection: local}, t1: {ansible_connection: local, lme_toolchain_owner: 1000}, t2: {ansible_connection: local}}
    expected_now: reject
    expected_failed_task: *T_PUB
    boundary_msg: "owner must be a string"
  # ---- a rule the resolver cannot apply exactly as declared ----
  - <<: *BASE
    name: ep-rule-address-absent-guess-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {ssh_auth: {composition: {address: {absent: guessed_default}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_SCOPE
    boundary_msg: "address must be {var, absent: inventory_hostname, normalize: lower}"
  - <<: *BASE
    name: ep-rule-port-default-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {ssh_auth: {composition: {port: {absent: 22}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_SCOPE
    boundary_msg: "port must be {var, absent: delegate_ssh_config"
  - <<: *BASE
    name: ep-rule-form-test-undeclared-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {ssh_auth: {composition: {inventory_forms: {accepted: [{form: absent, test: undefined, proxy_jump: ''}, {form: any, test: anything, proxy_jump: ''}]}}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_SCOPE
    boundary_msg: "inventory_forms must be {var, accepted:"
  - <<: *BASE
    name: ep-rule-endpoint-key-reordered-refused
    overlay_merge:
      - path: manifests/profiles/remote-harness.yml
        merge: {profile_overlay: {lme_global: {remote_harness: {controller: {bootstrap: {ssh_auth: {composition: {endpoint_key: [port, address, proxy_jump, owner]}}}}}}}}
    expected_now: reject
    expected_failed_task: *T_SCOPE
    boundary_msg: "endpoint_key must be"
  # ---- verifier ----
  - <<: *BASE
    name: ep-vf-endpoint-changed-alone-refused
    expected_now: reject
    invariant_task: &V1 "verifier: one bound endpoint changed alone"
    expected_failed_task: *V1
    boundary_msg: "scope_sha256 is not bound to its scope/binding/policy"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('vf_endpoint_port_only') }}"]
  - <<: *BASE
    name: ep-vf-endpoint-missing-target-refused
    expected_now: reject
    invariant_task: &V2 "verifier: a bound target's endpoint dropped"
    expected_failed_task: *V2
    boundary_msg: "binding.deployment.endpoints must map every bound target"
    assert_that: ["{% import 'macros/c1_iso6_endpoint.j2' as m %}{{ m.check('vf_endpoint_missing_target') }}"]
