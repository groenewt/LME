---
# cases-c1-iso6-port-build-217.yml -- MULTINODE-217-TEMPLATED-PORT-TYPE build-path refusals, CORE-DECLARED: run ONLY
# under ansible-core 2.17.14. Hand-authored DATA (no generator). Companion files: cases-c1-iso6-port.yml (shared, both
# cores: positives + pt-reason-* + typed pin) and cases-c1-iso6-port-build-219.yml (the 2.19 surface).
# ATTRIBUTED CASE SPLIT (core surface, not C1). The build task is a LOOP; the runner records ansible_failed_result.msg.
# On 2.17.14 that msg is "the field 'args' has an invalid value (...)" and embeds the EXACT filter error, so this file
# needs the EXACT reason in the build-path cause (failed_task == the Build task). Evidence (same case bytes ea808e9f,
# same head c5dd512b, both retained): c5dd512bb9cf-reproduction-fin-port-217-core2.17.14-20260924T042643Z
# REJECTED-as-expected x10, with each needle below verbatim in that run's outcome msg; the 2.19 run T042120Z was
# NOT-REJECTED x10 (aggregate msg only). This file is not run on 2.19: there the reason is not on the build-path surface.
schema_version: 1
binds_to: null
loader_entry: {role: podman, tasks_from: load_manifests}
# isolated_source lists the three declared shared-artifact templates: the two seed templates and, since codex-tick217 R1,
# the launcher entry template (host_scope.shared_artifacts.launcher; the loader reads every declared template).
isolated_source:
  files: [ansible/roles/podman/tasks/load_manifests.yml, ansible/roles/podman/tasks/resolve.yml, ansible/roles/podman/tasks/validate_resolved_config.yml,
          ansible/roles/podman/defaults/main.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, ansible/site.yml,
          testing/remote_harness/templates/lme-controller-seed.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2,
          testing/remote_harness/templates/lme-seed-launcher.sh.j2]
  trees: [manifests]
play_vars_source: {file: ansible/site.yml, play_index: 0, restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]}
task_names:
  build: &T_BUILD "Build lme_services map (service | profile.services[id] | effective override[id] LAST)"
fixtures: {}
cases:
  - &REJ
    name: pt-port-leading-zero-refused
    kind: control
    profile: multinode
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: '09200', container: 9200}]}}}
    expected_now: reject
    expected_failed_task: *T_BUILD
    boundary_msg: "elasticsearch.publish_ports[0].host = '09200' (str) is not a canonical decimal"
  - <<: *REJ
    name: pt-port-signed-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: '+9200', container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = '+9200' (str) is not a canonical decimal"
  - <<: *REJ
    name: pt-port-space-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: ' 9200', container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = ' 9200' (str) is not a canonical decimal"
  - <<: *REJ
    name: pt-port-decimal-point-string-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: '9200.0', container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = '9200.0' (str) is not a canonical decimal"
  - <<: *REJ
    name: pt-port-out-of-range-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: 70000, container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = 70000 is outside the declared range 1..65535"
  - <<: *REJ
    name: pt-port-zero-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: 9200, container: 0}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].container = 0 is outside the declared range 1..65535"
  - <<: *REJ
    name: pt-port-bool-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: true, container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = True (bool) is not a declared integer input"
  - <<: *REJ
    name: pt-port-float-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: 9200.5, container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = 9200.5 (float) is not a declared integer input"
  - <<: *REJ
    name: pt-port-null-refused
    extra_vars: {lme_service_overrides: {elasticsearch: {publish_ports: [{host: null, container: 9200}]}}}
    boundary_msg: "elasticsearch.publish_ports[0].host = None (NoneType) is not a declared integer input"
  - <<: *REJ
    name: pt-decl-max-string-refused
    extra_vars: {}
    overlay_merge:
      - path: manifests/global.yml
        merge: {lme_config_registry: {service_input_types: {publish_ports: {max: '65535'}}}}
    boundary_msg: "registry service_input_types.publish_ports must be {item_int_fields, canonical_regex, min, max}"
