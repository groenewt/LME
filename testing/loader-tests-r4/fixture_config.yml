# fixture_config.yml -- DECLARED fixture configuration for the C1 loader-test instruments (r2;
# codex-1931 C1-PRIVATE-PROBE-DEFAULTS). Every sentinel / label / protocol constant the probe macro
# (macros/probe.j2) and the per-case judge (one_case.yml) previously carried as a private literal is
# declared HERE and passed to them as data. run_loader_tests.yml loads this file, asserts its shape,
# and hashes it as an instrument; each probe's provenance sidecar binds it as a generator input.
# The values equal the retired private literals, so a legacy case renders a byte-identical probe.
# STATUS: UNEXECUTED (authored only; nothing has been run).
probe_fixture:
  # value a dump writes when the dumped variable is undefined in the probe (was probe.j2:57).
  # Interpolated into a single-quoted Jinja string literal -> the runner restricts it to [A-Za-z0-9_].
  undefined_sentinel: __LME_PROBE_UNDEFINED__
  # outcome.task label for a case that declares no invariant_task (was probe.j2:75 and :88).
  control_task_label: control
  # outcome.msg_source protocol shared by probe.j2 (writer) and one_case.yml (reader).
  msg_source_captured: ansible_failed_result
  msg_source_uncaptured: uncaptured
  # probe play host pattern when a case declares no probe_hosts (legacy behaviour: localhost).
  probe_hosts_default: localhost
