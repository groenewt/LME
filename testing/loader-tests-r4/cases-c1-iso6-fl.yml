---
# cases-c1-iso6-fl.yml -- copy of cases-c1-iso5-fl.yml; ONE edit: isolated_source.files add the two declared
# seed templates (runner limit one_case.yml:153-155 binds only the manifests tree) (C1-ARTIFACT-REUSE-INPUT-COVERAGE: the loader reads the declared seed templates).
# cases-c1-iso5-fl.yml -- copy of cases-seed06-fullload-iso.yml (sha256 67116fd7...) for C1 head 8308eee (seed06-final), tree
# iso5-p-cand-rh. Edit: every expected no-override projection passes macros/c1_iso5.j2 SCOPE0(). Nothing else changed.
# cases-seed06-fullload-iso.yml:cases-seed06-fullload.yml (0c126f83...) minus the stack-only admission_receipt_check.yml input (absent at 7ff8b943).
# cases-seed06-fullload.yml -- SEED-06 full-load equivalence (codex-232517 "verify full-load and early-resolve
# semantics stay equivalent"), C1-owned. Entry = load_manifests (site.yml path) on profile remote-harness; the same
# COMPAT fixture tree as cases-seed06-remote-harness.yml. Proves the section built by the early resolve survives
# the full composition unchanged, is bound into the COMPLETE revision, moves it on a tunable change and keeps it
# on a same-value override.
schema_version: 1
binds_to: null
loader_entry:
  role: podman
  tasks_from: load_manifests
isolated_source:
  files:
    - ansible/roles/podman/tasks/load_manifests.yml
    - ansible/roles/podman/tasks/resolve.yml
    - ansible/roles/podman/tasks/validate_resolved_config.yml
    - ansible/roles/podman/defaults/main.yml
    - ansible/roles/podman/filter_plugins/lme_manifests.py
    - ansible/site.yml
    - testing/remote_harness/templates/lme-controller-seed.sh.j2
    - testing/remote_harness/templates/macros/controller_seed.j2
    - testing/remote_harness/templates/lme-seed-launcher.sh.j2
  trees:
    - manifests
play_vars_source:
  file: ansible/site.yml
  play_index: 0
  restrict_to_flag_keys: [install_llm, install_elastic_services, offline_mode, install_otel, install_legacy_beats]

task_names:
  projection: &T_PROJ "C1 -- compose + merge the material/datastore/membership projections (inline; untamperable)"

fixtures: {}

cases:
  - name: rhf-declared
    kind: control
    profile: remote-harness
    expected_now: pass
    invariant_task: "control: full load carries the early-resolve section unchanged and binds it into the complete revision"
    assert_that:
      - "lme_resolved.remote_harness == ((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)), {}, _lme_global_file.lme_config_registry.remote_harness_schema, {% import 'macros/c1_iso5.j2' as m %}{{ m.SCOPE0() }}))"
      - "lme_resolved.remote_harness.policy == lme_global.remote_harness"
      - "lme_remote_harness_overridden_paths == []"
      - "lme_resolved_revision == ((lme_resolved | combine({'remote_harness': ((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)), {}, _lme_global_file.lme_config_registry.remote_harness_schema, {% import 'macros/c1_iso5.j2' as m %}{{ m.SCOPE0() }}))})) | lme_bind_revision(_lme_global_file.lme_config_registry, [{'name': lme_profile, 'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}], lme_services, (lme_global | combine({'remote_harness': (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)).remote_harness}, recursive=True)), lme_host_rendered_services))"
      - "lme_resolved_revision != ((lme_resolved | dict2items | rejectattr('key', 'eq', 'remote_harness') | items2dict) | lme_bind_revision(_lme_global_file.lme_config_registry, [{'name': lme_profile, 'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}], lme_services, lme_global, lme_host_rendered_services))"
  - name: rhf-tunable-override-moves-revision
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {local_envelope: {vcpu: 4}}}}}
    expected_now: pass
    invariant_task: "control: a tunable change reaches the full-load section and moves the complete revision"
    assert_that:
      - "lme_resolved.remote_harness.policy.controller.local_envelope.vcpu == 4"
      - "lme_global.remote_harness.controller.local_envelope.vcpu == 4"
      - "lme_remote_harness_overridden_paths == ['controller.local_envelope.vcpu']"
      - "lme_resolved_revision != ((lme_resolved | combine({'remote_harness': ((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)), {}, _lme_global_file.lme_config_registry.remote_harness_schema, {% import 'macros/c1_iso5.j2' as m %}{{ m.SCOPE0() }}))})) | lme_bind_revision(_lme_global_file.lme_config_registry, [{'name': lme_profile, 'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}], lme_services, (lme_global | combine({'remote_harness': (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)).remote_harness}, recursive=True)), lme_host_rendered_services))"
  - name: rhf-same-value-override-keeps-revision
    kind: control
    profile: remote-harness
    extra_vars: {lme_global_override: {remote_harness: {controller: {local_envelope: {vcpu: 8}}}}}
    expected_now: pass
    invariant_task: "control: override provenance is audit only on the full load too"
    assert_that:
      - "lme_remote_harness_overridden_paths == ['controller.local_envelope.vcpu']"
      - "lme_resolved_revision == ((lme_resolved | combine({'remote_harness': ((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)) | lme_project_remote_harness((_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)), {}, _lme_global_file.lme_config_registry.remote_harness_schema, {% import 'macros/c1_iso5.j2' as m %}{{ m.SCOPE0() }}))})) | lme_bind_revision(_lme_global_file.lme_config_registry, [{'name': lme_profile, 'sha256': lookup('file', lme_manifests_dir ~ '/profiles/' ~ lme_profile ~ '.yml') | hash('sha256')}], lme_services, (lme_global | combine({'remote_harness': (_lme_global_file.lme_global | combine(_lme_profile_file.profile_overlay.lme_global, recursive=True)).remote_harness}, recursive=True)), lme_host_rendered_services))"
