---
# testing/e2e/inventory_binding/render_run_binding.yml -- ENTRY: RENDER-RUNNER for the run binding
# <run>/.work/inventory/<lab>/20-binding.yml (B-owned; B coordinator packet after the JK-6 freeze). AUTHORED, NEVER
# EXECUTED. Its C1 dependencies are registered in the current profile (2a1eb60c...): rh.controller.bootstrap.owner_key
# location_rule_rel (~:1955; read by macros/run_binding.j2:78) and inventory.role_groups. The ^_?rb_ family is reserved in
# global.yml (8997a715..., reserved_rb_vars :1119), so the shared family guard refuses a pinned rb_ name before the inline guard.
#
# CHICKEN-AND-EGG, resolved through the EXISTING mechanism: resolve_harness.yml needs the controller root / owner
# (inventory.root_var / owner_var), which only the binding supplies. This entry therefore stops at the ENGINE resolve
# (tasks/resolve_policy.yml: profile remote-harness over the checkout), which already yields rh.controller.bootstrap and
# lme_resolved -- everything the macros need. It never calls resolve_harness.yml / verify_toolchain_receipt.yml; the
# managed executor is still the seed launcher's `run <controller root>` environment. No second loader, no merge engine,
# no raw inventory read: the file inputs are the per-run data (MAIN's; read ONCE as exact bytes, hashed and parsed from
# those bytes) and the lab copy (hashed by stat, never parsed here: the engine resolve read it as inventory).
#
# ARGV. ONE entry, TWO declared launches (controller.bootstrap.run_binding.launches; codex-tick400 R4-BOOTSTRAP-CYCLE),
# both started by MAIN as the NON-ROOT controller owner, both with the inventory kind run_binding_sources
# (genesis.launch.inventory_kinds: -i <operator controller inventory> -i <dir>/10-lab.yml, in that order):
#  managed (act_supplied false; today's launch) -- AFTER apply (10-lab.yml copied) and BEFORE owner_key.yml:
#   <bundle>/lme-seed-launch.sh run <run>/.work/toolchain explicit_key \
#     -i <operator controller inventory> -i <run>/.work/inventory/<lab>/10-lab.yml \
#     testing/e2e/inventory_binding/render_run_binding.yml \
#     -e <inputs.data>=<run>/.work/inventory/<lab>.run-data.yml \
#     -e <inputs.destination>=<run>/.work/inventory/<lab>/20-binding.yml \
#     [-e <inputs[lifecycle.transition_input.role]>=<sha256 of the receipt being superseded>]
#   (r5r C1-R5R-1: every input name is the value of its role in the ONE declared mapping run_binding.inputs; the names
#   are C1's declaration, never restated in this file)
#   (the launcher's SSH auth mode is unused: this leg contacts no host). Both -i reach ansible-playbook unchanged: the
#   launcher execs the seed with "$@" (controller_seed.j2 launch_exec {args}), and seed `run` rebuilds
#   `run --root R --ssh-auth M -- "$@"` and execs the generation's ansible-playbook "$@" UNSCREENED (only run-local
#   screens its arguments).
#  genesis (act_supplied true; stage run_binding.launches.genesis.stage) -- NO applied generation: the genesis.launch exec
#   vector (env -i <declared pairs of this stage and act> <builder.executable> <inventory_args> -e <act.var>=<act>
#   <stage_extra_vars> <checkout>/<entry_rel>), MAIN's declared preparation having created the act stage root, the
#   binding dir and the 10-lab.yml copy. The supplied act var selects this launch; tasks/admit_builder.yml then admits
#   EXACTLY the declared builder and environment before the first module (a managed process given the act var refuses
#   there). This breaks the measurement cycle: a fresh controller, or a changed profile digest, renders a zero-target
#   controller-operation binding without any generation (the resolve reads the checkout profile directly).
# ONE play, localhost, connection local, no become.
#
# INPUTS
#   <inputs.data>               MAIN's per-run data file: the top keys of run_binding.run_data.top ONLY -- hosts.<alias>
#                               (optional; e.g. graph: {roles: {privileged_key: <path>}, bundle: {leaf: <64 hex>}}) and
#                               controller (REQUIRED: {operation: <inventory.controller_operations key>, inputs: {<role>:
#                               value}} -- inputs present EXACTLY when the operation is inputs_in_run_data, with exactly
#                               its declared roles; there is NO default operation). Any other top-level key refuses in the
#                               macro (RUN-BINDING-DERIVED-INPUT). Absolute, normalized, OUTSIDE the binding's directory.
#   <inputs.destination>        the binding path <dir>/20-binding.yml; <dir>/<run_binding.lab_basename> is the lab copy
#                               (declared once; value 10-lab.yml; codex-tick578 B-LAB-LITERAL).
#   <transition input>          the input whose role is lifecycle.transition_input.role in run_binding.inputs (r5r: read
#                               ONLY through that mapping, one selection rb_ti; its name is distinct from every other
#                               role's, admitted before selection; no other spelling is an input). OPTIONAL, 64 hex: the explicit configuration-revision transition input -- the sha256
#                               of the CURRENT RECEIPT file <dir><run_binding.receipt_suffix> (its exact bytes, one read; the
#                               FULL revision identity of the pair: it binds binding_sha256, data/lab digests,
#                               every declared receipt_bindings field, controller_inventory and its own transition). The
#                               superseded pair is retained under <dir>.superseded/<that sha256>/, so equal-output
#                               (input-only) revisions each keep a distinct retained pair (codex-tick370
#                               RUN-BINDING-EQUAL-OUTPUT-REVISION-CHAIN).
#   inventory sources           EXACTLY two: the lab copy <dir>/10-lab.yml (whose all.vars declares
#                               lme_deployment_identity, codex-tick360) and the operator controller inventory
#                               (the one package.yml used; localhost carries rh_bundle_dir / rh_artifact_source /
#                               rh_acquisition_receipt). No source may be (or contain) the binding dir, the binding, the
#                               receipt, the superseded root or the run data. Membership of the lab in
#                               ansible_inventory_sources shows the lab was GIVEN to the resolve. The CLI normalizes
#                               each -i path (ansible/cli/__init__.py: unfrackpath(opt, follow=False)), so the lab must
#                               be passed as <dir>/10-lab.yml (not through a link to it).
# DERIVED (rb_derived; never inputs -- every ^_?rb_ name is refused pre-supplied, RUN-BINDING-RENDER-PINNED):
#   deployment_identity  lme_resolved | lme_validated_deployment_identity (the J-KEY leg's canonical filter,
#                        bind_controller.yml) -- the EFFECTIVE resolved value. The lab all.vars is its declared source,
#                        but NOT an exclusive origin: Ansible precedence lets an approved operator input (extra var,
#                        controller-inventory var) override it, and such approved overrides are preserved; the runner
#                        validates the effective value only. Never from rb_run (the macro refuses any undeclared key).
#                        Q7 (codex-tick400): a zero-target lab may declare none; null is admitted ONLY for an operation
#                        declared identity_nullable, as null DIAGNOSTIC ATTRIBUTION (the helper returns None and the
#                        equality below is null == null): it proves nothing about any deployment, and the macro refuses
#                        a derived owner key without an identity (RUN-BINDING-OWNER-IDENTITY).
#   lab_sha256           stat sha256 of <dir>/10-lab.yml.
#   controller           {toolchain_root: rh_repo_root/<work_roots.root_rel>/<work_roots.sub_roots.toolchain>,
#                         owner: `<os_tools.id> -un`, operation: the run data's controller.operation,
#                         inputs: {<role>: value} of EXACTLY that operation's declared inputs
#                         (inventory.controller_operations.<op>.inputs) -- from the controller inventory's localhost
#                         vars <inputs.<role>.var> (inputs_in_run_data false: acquisition = rh_bundle_dir /
#                         rh_artifact_source / rh_acquisition_receipt, today's bytes) or from the run data's
#                         controller.inputs (inputs_in_run_data true: e.g. the measurement's mode / root). A run_data
#                         operation never reads, invents or carries an acquisition input. Each path input and the
#                         toolchain root is an admitted absolute path (controller.bootstrap.path_admission); each
#                         non-path input fully matches its declared regex.
#   bound                lme_resolved.remote_harness.binding.deployment.target_inputs. r5u (X-B-02): no fallback
#                        mapping. The loader publishes it EXACTLY when the policy declares target inputs
#                        (controller.bootstrap.inventory.target_inputs). codex-tick500 R5U-PRESERVE-NO-TARGET-INPUT-
#                        PROFILE: DECLARED inputs -> the published key is required by exact key (else RUN-BINDING
#                        controller refusal); NO declaration -> the loader publishes no key (refused if it does) and
#                        the render binds the declared absence value run_binding.target_inputs_absent (contract
#                        run_binding pins it to the empty mapping) -- no inline fallback.
# OUTPUTS (0600 files, 0700 dirs; created only when absent, never chmod/chown of an existing path):
#   <inputs.destination>                       the rendered binding (exact bytes of the in-memory render)
#   <dir><run_binding.receipt_suffix>          (the ONE declared suffix, controller.bootstrap.run_binding.receipt_suffix =
#                                               .binding-receipt.yml; r5f addendum R4 r4c J-B1, the route reads the same name)
#                                              key set = the declared run_binding.receipt_keys; the resolve-bound fields
#                                              and the current-resolve records they read = run_binding.receipt_bindings
#                                              {<field>: {role, var, path}} (r5h, codex-tick421 J-B8): role `attributed`
#                                              (engine_revision, the PRODUCER's resolved-state revision: recorded, never
#                                              compared with a consumer's) or `compared` (effective policy digest, manifest
#                                              source edition, consumer-interface aggregate: every reader iterates them);
#                                              ONE declaration, no second pair mapping. Loader bytes are NOT bound (open)
#                                              {binding, binding_sha256, controller_inventory, data, data_sha256,
#                                               deployment_identity, lab, lab_sha256, <every receipt_bindings field>,
#                                               <history.key> (r5j; declared, e.g. transition; the lifecycle state
#                                               name `transition` and rb_plan.transition are internal, not this key):
#                                               null | {from (superseded receipt sha256),
#                                               from_binding_sha256, to (new binding sha256), retained,
#                                               <history.bindings>: {<every receipt_bindings field>: superseded value}}}
#   <dir>.superseded/<S>/{binding.yml, receipt.yml}   retained superseded pair (transition only; <S> = superseded
#                                               receipt sha256; dir created exclusively). The member names are FIXED
#                                               literals, never derived from the dest / receipt basenames, so the two
#                                               retained members cannot collide (codex-tick370
#                                               RUN-BINDING-RETAINED-PATH-COLLISION); every path is also refused
#                                               colliding before any effect (RUN-BINDING-RENDER-COLLISION).
#   (receipt and superseded tree sit OUTSIDE the -i paths, so no inventory parser ever reads them)
# RENDER LIFECYCLE (codex-tick360 render_lifecycle). The binding text is rendered IN MEMORY (template lookup of the
# thin caller ansible/inventory/graph_lab_run_binding.yml.j2) and hashed (H); the destination pair is observed
# (stat, follow: false). Every CONSUMED receipt (current and retained) is bound with the SAME one-read mechanism as the
# run data (codex-tick370 RUN-BINDING-LIFECYCLE-RECEIPT-BYTES): ONE slurp, sha256 of those bytes == the stat checksum
# (else CONFLICT: replaced between observation and read), parsed from those same bytes. Then the pair is classified
# ONCE into exactly one state, BEFORE any write (S = supersedes = a receipt sha256; B_old = that receipt's
# binding_sha256):
#   publish             binding + receipt absent (no supersedes)       -> write binding, read back == H, write receipt
#   reuse               binding == H, receipt verified, same inputs    -> NO write; report reused (with supersedes: only
#                                                                         if the receipt's transition.from equals it)
#   resume_receipt      binding == H, receipt absent (no supersedes)   -> write the receipt only (interrupted publish)
#   transition          supersedes S given, verified pair whose receipt file sha256 == S, rendered bytes or inputs
#                       differ (an equal-output, input-only revision included) -> mkdir <dir>.superseded (if absent)
#                       and .../<S> (EXCLUSIVE), mv -n -T receipt -> <S>/receipt.yml, read back (source gone,
#                       destination sha256 == S), mv -n -T binding -> <S>/binding.yml, read back (source gone,
#                       destination sha256 == B_old); a no-clobber move that did not happen refuses CONFLICT with both
#                       byte sets preserved; then publish the new pair with the transition recorded. EXTENSION (beyond
#                       the single interrupted case): an interrupted transition resumes from the verified retained pair
#                       with the SAME -e supersedes (retained dir present; each step done only when its verified
#                       precondition holds). LINEAGE: while <dir>.superseded exists, publish and resume_receipt are NOT
#                       admitted without -e supersedes (an absent pair or a receipt-less binding may be an interrupted
#                       transition) -> CONFLICT; the rerun must name S.
#   revision            verified pair, binding != H or inputs differ, no supersedes  -> REFUSED RUN-BINDING-RENDER-REVISION
#   supersedes_mismatch supersedes S is not the verified receipt's sha256 / recorded transition -> REFUSED ...-REVISION
#   supersedes_nothing  supersedes S given but no pair exists          -> REFUSED ...-REVISION
#   conflict            anything unverified: receipt without binding, binding != H without a verified receipt, receipt
#                       unparseable / read bytes != stat digest / wrong key set / other binding path /
#                       binding_sha256 != file, link or
#                       non-regular, wrong owner or mode (files 0600, dirs 0700), inconsistent retained state, or a
#                       read-back mismatch after a write -> REFUSED RUN-BINDING-RENDER-CONFLICT; every byte preserved,
#                       paths and observed sha256 reported.
#   Reading (codex-tick360 "changed inputs need an explicit configuration-revision transition"): a verified pair whose
#   recorded inputs differ from the current ones (policy_sha256, data, lab, ...) is REVISION, not CONFLICT, even when
#   the rendered bytes are equal; CONFLICT is reserved for receipts that do not vouch for the observed binding.
#   Receipts from the frozen 07f4c3d8 renderer (different key set) classify as CONFLICT -- intended.
# Refusals: RUN-BINDING-RENDER-PINNED, RUN-BINDING-RENDER-INPUT, RUN-BINDING-RENDER-COLLISION, RUN-BINDING-RENDER-LAB,
# RUN-BINDING-RENDER-IDENTITY, RUN-BINDING-RENDER-CONTROLLER, RUN-BINDING-RENDER-REVISION,
# RUN-BINDING-RENDER-CONFLICT, the missing-declaration code refusal_grammar.declaration_codes.run_binding (r5g,
# codex-tick410-412 R5F-NEW-LITERAL-SOURCING: sourced from the ALWAYS-admitted parent grammar, which the loader admits in
# resolve_policy.yml BEFORE the staged declaration assert; no literal), the declared run_binding.refusals codes (launch, operation, identity, controller,
# placement, owner_identity, receipt [r5g]), the genesis builder admission's refusal (tasks/admit_builder.yml) on the genesis launch,
# and every RUN-BINDING-*
# refusal of ansible/inventory/macros/run_binding.j2 (its REFUSED text appears inside the render task's lookup error
# chain; the render task is not in a rescue block, so no code is rewritten).
- name: render-run-binding
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    # every fact, register, task var and loop var of this entry fully matches ^_?rb_[A-Za-z0-9_]+$; extra-vars outrank
    # all of them, so the WHOLE family is refused inline (no name list to miss; rb_refused must stay undefined: the
    # macros' refusal sentinel)
    - name: Refuse any supplied render-derived name (the ^_?rb_ family; extra-vars / inventory outrank derivations)
      ansible.builtin.assert:
        that:
          - (vars | list) | select('match', '^_?rb_') | list | length == 0
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-PINNED: {{ (vars | list) | select('match', '^_?rb_') | sort | list }} are derived by
          this entry (the ^_?rb_ family), never inputs.
        quiet: true

    # MOVED here by the r5f addendum (R4 r4c J-B1) from after the inventory-source refusals: resolve_policy.yml reads only
    # the checkout profile, the lock and the harness files (lookups / set_fact; no module, no rb_ or lme_run_binding_*
    # input), so the declared receipt suffix is resolved and presence-asserted BEFORE the first path derivation reads it.
    - name: Resolve the harness policy through the engine (no controller root / owner needed; rh.controller.bootstrap)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

    # STAGED: presence and type of every declaration this entry now consumes, before any use of its members.
    # r5g (codex-tick410-412 R5F-NEW-LITERAL-SOURCING): this refusal reports the ABSENCE of run_binding, so its code and
    # framing come from the mandatory PARENT: controller.bootstrap.refusal_grammar (route-r4c N-P2, C1-R5G-6) carries
    # declaration_codes.run_binding, and the contract refusal_grammar (N-G2 as amended by C1-R5G-7) has NO when_present,
    # so the loader run by resolve_policy.yml above has ALREADY refused a profile without it (lme_manifests.py
    # _rh_admit_contracts: an undeclared root refuses). The message is formatted by the ONE grammar entry
    # (refusal_grammar.entry_rel, reached by the declared path_admission.separator); no private fallback.
    - name: Refuse a resolve without the run-binding declarations (presence and type first; nothing derived yet)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.run_binding is defined
          - rh.controller.bootstrap.run_binding is mapping
          - rh.controller.bootstrap.run_binding.launches is mapping
          - rh.controller.bootstrap.run_binding.run_data is mapping
          - rh.controller.bootstrap.run_binding.refusals is mapping
          - rh.controller.bootstrap.run_binding.lab_role is string
          - rh.controller.bootstrap.run_binding.receipt_suffix is string
          - rh.controller.bootstrap.run_binding.receipt_suffix | length > 0
          - rh.controller.bootstrap.run_binding.receipt_keys is sequence
          - rh.controller.bootstrap.run_binding.receipt_keys is not string
          - rh.controller.bootstrap.run_binding.receipt_bindings is mapping
          - rh.controller.bootstrap.run_binding.receipt_bindings | length > 0
          - rh.controller.bootstrap.run_binding.binding_roles is mapping
          - rh.controller.bootstrap.run_binding.binding_roles.compared is string
          - rh.controller.bootstrap.run_binding.binding_roles.attributed is string
          - rh.controller.bootstrap.run_binding.history is mapping
          - rh.controller.bootstrap.run_binding.history.key is string
          - rh.controller.bootstrap.run_binding.history.bindings is string
          - rh.controller.bootstrap.run_binding.history.prior_keys is sequence
          - rh.controller.bootstrap.run_binding.history.prior_keys is not string
          - rh.controller.bootstrap.run_binding.history.lineage is mapping
          # r5m (R5L-CHANGED-CLASSIFIER-SOURCING): the lineage ROLE LIST is C1's declared history.lineage_roles (the
          # contract's key set for history.lineage, C1-R5M-2), never a literal list here
          - rh.controller.bootstrap.run_binding.history.lineage_roles is sequence
          - rh.controller.bootstrap.run_binding.history.lineage_roles is not string
          - >-
            (rh.controller.bootstrap.run_binding.history.lineage.keys() | list | sort)
            == (rh.controller.bootstrap.run_binding.history.lineage_roles | sort)
          - rh.controller.bootstrap.run_binding.history.lineage.values() | reject('string') | list | length == 0
          - rh.controller.bootstrap.run_binding.history.lineage.from is string    # the one role this file indexes by name
          - rh.controller.bootstrap.run_binding.texts.lineage_malformed is string
          # r5m: the lifecycle STATE vocabulary and the optional transition input's absence semantics (C1-R5M-3); each
          # state role this file reads is presence/type-asserted here, and every group names declared roles only
          - rh.controller.bootstrap.run_binding.lifecycle is mapping
          - rh.controller.bootstrap.run_binding.lifecycle.states is mapping
          - rh.controller.bootstrap.run_binding.lifecycle.states.values() | reject('string') | list | length == 0
          - >-
            (rh.controller.bootstrap.run_binding.lifecycle.states.values() | list | unique | length)
            == (rh.controller.bootstrap.run_binding.lifecycle.states | length)
          - rh.controller.bootstrap.run_binding.lifecycle.states.publish is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.resume_receipt is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.reuse is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.revision is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.transition is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.conflict is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.supersedes_mismatch is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.supersedes_nothing is string
          - rh.controller.bootstrap.run_binding.lifecycle.states.lineage_malformed is string
          - rh.controller.bootstrap.run_binding.lifecycle.proceed is sequence
          - rh.controller.bootstrap.run_binding.lifecycle.proceed is not string
          - rh.controller.bootstrap.run_binding.lifecycle.proceed | reject('in', rh.controller.bootstrap.run_binding.lifecycle.states) | list | length == 0
          - rh.controller.bootstrap.run_binding.lifecycle.revision_refused is sequence
          - rh.controller.bootstrap.run_binding.lifecycle.revision_refused is not string
          - rh.controller.bootstrap.run_binding.lifecycle.revision_refused | reject('in', rh.controller.bootstrap.run_binding.lifecycle.states) | list | length == 0
          - rh.controller.bootstrap.run_binding.lifecycle.writes_receipt is sequence
          - rh.controller.bootstrap.run_binding.lifecycle.writes_receipt is not string
          - rh.controller.bootstrap.run_binding.lifecycle.writes_receipt | reject('in', rh.controller.bootstrap.run_binding.lifecycle.states) | list | length == 0
          # r5r (codex-tick461 R5P-TRANSITION-ROLE-COLLISION; C1-R5R-1): the transition input carries NO name of its own;
          # it names its ROLE in the ONE render-input ownership mapping run_binding.inputs (admitted below, before any
          # selection). lifecycle.transition_input.var is RETIRED (no second spelling).
          - rh.controller.bootstrap.run_binding.lifecycle.transition_input is mapping
          - rh.controller.bootstrap.run_binding.lifecycle.transition_input.role is string
          - rh.controller.bootstrap.run_binding.lifecycle.transition_input.var is not defined
          - rh.controller.bootstrap.run_binding.lifecycle.transition_input.optional is sameas true
          # r5n (R5L-CHANGED-CLASSIFIER-SOURCING closure; C1-R5M-3b): the custody-class vocabulary the rb_obs producer
          # emits and the classifier compares, and the receipt-member roles the classifier indexes. One declaration
          # each; values distinct strings. Every receipt role names a declared receipt_keys member.
          - rh.controller.bootstrap.run_binding.lifecycle.custody_classes is mapping
          - rh.controller.bootstrap.run_binding.lifecycle.custody_classes.absent is string
          - rh.controller.bootstrap.run_binding.lifecycle.custody_classes.ok is string
          - rh.controller.bootstrap.run_binding.lifecycle.custody_classes.bad is string
          - rh.controller.bootstrap.run_binding.lifecycle.custody_classes.not_requested is string
          - >-
            (rh.controller.bootstrap.run_binding.lifecycle.custody_classes.values() | list | unique | length)
            == (rh.controller.bootstrap.run_binding.lifecycle.custody_classes | length)
          - rh.controller.bootstrap.run_binding.receipt_roles is mapping
          - rh.controller.bootstrap.run_binding.receipt_roles.binding is string
          - rh.controller.bootstrap.run_binding.receipt_roles.binding_digest is string
          - >-
            (rh.controller.bootstrap.run_binding.receipt_roles.values() | list | unique | length)
            == (rh.controller.bootstrap.run_binding.receipt_roles | length)
          - >-
            rh.controller.bootstrap.run_binding.receipt_roles.values()
            | reject('in', rh.controller.bootstrap.run_binding.receipt_keys) | list | length == 0
          # r5p (codex-tick451 R5O-RECEIPT-ROLE-DISJOINTNESS): the ATTRIBUTION members of the receipt are declared roles
          # too (C1-R5P-1 extends receipt_roles); construction below reads each by its role, never by a literal key.
          - rh.controller.bootstrap.run_binding.receipt_roles.controller_inventory is string
          - rh.controller.bootstrap.run_binding.receipt_roles.data is string
          - rh.controller.bootstrap.run_binding.receipt_roles.data_sha256 is string
          - rh.controller.bootstrap.run_binding.receipt_roles.deployment_identity is string
          - rh.controller.bootstrap.run_binding.receipt_roles.lab is string
          - rh.controller.bootstrap.run_binding.receipt_roles.lab_sha256 is string
          - rh.controller.bootstrap.run_binding.texts.receipt_ownership_collision is string
          # r5p (codex-tick451 known_open: transition-input-name collision): the declared render-input set is the
          # genesis.launch stage whose playbook_rel is run_binding.entry_rel (its extra_vars, C1-R5F stages.render_binding)
          - rh.controller.bootstrap.run_binding.entry_rel is string
          - rh.controller.bootstrap.run_binding.refusals.input is string
          - rh.controller.bootstrap.run_binding.texts.transition_input_collision is string
          # r5r (C1-R5R-1): the ONE semantic role -> input-name ownership mapping of this render, and its texts
          - rh.controller.bootstrap.run_binding.inputs is mapping
          # r5s (codex-tick480 R5R-TRANSITION-SEMANTIC-ROLE; C1-R5S-2): the CANONICAL role ownership declaration
          # run_binding.input_roles {<role>: {required: bool}} and its semantic-role refusal text
          - rh.controller.bootstrap.run_binding.input_roles is mapping
          - rh.controller.bootstrap.run_binding.texts.transition_role_semantic is string
          - rh.controller.bootstrap.run_binding.texts.input_projection_mismatch is string
          - rh.controller.bootstrap.run_binding.texts.input_absent is string
          - rh.controller.bootstrap.run_binding.texts.input_shape is string
          - rh.controller.bootstrap.run_binding.texts.history_collision is string
          - rh.controller.bootstrap.run_binding.pre_execution_fields is sequence
          - rh.controller.bootstrap.run_binding.pre_execution_fields is not string
          - rh.controller.bootstrap.run_binding.loader_output_vars is sequence
          - rh.controller.bootstrap.run_binding.loader_output_vars is not string
          - rh.controller.bootstrap.run_binding.presence is mapping
          - rh.controller.bootstrap.run_binding.presence.var is string
          - rh.controller.bootstrap.run_binding.presence.expected_var is string
          - rh.controller.bootstrap.run_binding.presence.expected_path is sequence
          - rh.controller.bootstrap.run_binding.presence.expected_path is not string
          - rh.controller.bootstrap.run_binding.texts.loader_source_post_execution is string
          - rh.controller.bootstrap.run_binding.texts.presence_incomplete is string
          # r5p (codex-tick455 R4H-SUPPLIED-NULL-ADMISSION, producer side; C1-R5P-6): the writer's supplied-null refusal text
          - rh.controller.bootstrap.run_binding.texts.presence_supplied_null is string
          - rh.controller.bootstrap.run_binding.refusals.receipt is string
          - rh.controller.bootstrap.run_binding.refusals.placement is string
          - rh.controller.bootstrap.run_binding.texts is mapping
          - rh.controller.bootstrap.run_binding.texts.receipt_fact_absent is string
          - rh.controller.bootstrap.run_binding.texts.receipt_keys_mismatch is string
          - rh.controller.bootstrap.run_binding.texts.hosts_not_mapping is string
          - rh.controller.bootstrap.inventory.controller_operations is defined
          - rh.controller.bootstrap.inventory.controller_operations is mapping
          - rh.controller.bootstrap.genesis.launch.inventory_kinds is defined
          - rh.controller.bootstrap.genesis.launch.inventory_kinds is mapping
          - rh.controller.bootstrap.genesis.launch.stages is mapping
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.refusal_grammar.declaration_codes.run_binding,
                                   'rh_rf_detail': [rh.controller.bootstrap.refusal_grammar.declaration_texts.run_binding]}) | trim }}
        quiet: true

    # r5p (codex-tick451 R5O-RECEIPT-ROLE-DISJOINTNESS): ONE ownership map of EVERY field written at the receipt's top
    # level, admitted from the declarations alone BEFORE anything is read, derived or constructed. Each field group comes
    # from its existing authoritative declaration -- run_binding.receipt_roles (binding path, binding digest and the
    # attribution members), run_binding.receipt_bindings (every compared / attributed binding field) and
    # run_binding.history.key (the lineage member) -- and no second literal reserved-name list exists. The owner label
    # of each entry is the declaring group plus its role / field (diagnostics only). The fields must be pairwise
    # distinct (no group can overwrite another's member under combine) and must be EXACTLY the declared receipt_keys.
    # Checked against the declared names, never against a constructed document (a constructed mapping has already
    # collapsed a collision). NESTED names (history.lineage sub-keys, history.bindings, the superseded-value mapping
    # inside the history member) live one level down and are deliberately NOT members: their reuse of a top-level
    # name stays legitimate (LR-12b).
    - name: Admit the one disjoint receipt-field ownership map (declarations only; before construction)
      ansible.builtin.set_fact:
        rb_own: >-
          {%- set ns = namespace(o=[]) -%}
          {%- for r, f in rh.controller.bootstrap.run_binding.receipt_roles.items() -%}
          {%- set ns.o = ns.o + [{'field': f, 'owner': ['receipt_roles', r]}] -%}
          {%- endfor -%}
          {%- for f in rh.controller.bootstrap.run_binding.receipt_bindings -%}
          {%- set ns.o = ns.o + [{'field': f, 'owner': ['receipt_bindings', f]}] -%}
          {%- endfor -%}
          {%- set ns.o = ns.o + [{'field': rh.controller.bootstrap.run_binding.history.key, 'owner': ['history', 'key']}] -%}
          {{ ns.o }}

    - name: Refuse a receipt-field ownership collision or a field set other than the declared receipt_keys
      ansible.builtin.assert:
        that:
          - (rb_own | map(attribute='field') | unique | list | length) == (rb_own | length)
          - (rb_own | map(attribute='field') | sort) == (rh.controller.bootstrap.run_binding.receipt_keys | sort)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.receipt_ownership_collision,
                                                    rb_own | to_json,
                                                    rh.controller.bootstrap.run_binding.receipt_keys | sort | to_json]}) | trim }}
        quiet: true

    # r5r (codex-tick461 R5P-TRANSITION-ROLE-COLLISION; C1-R5R-1). r5p counted one occurrence of the transition name in
    # the stage extra_vars, which does not prove ownership (a transition name equal to the destination's occurs once and
    # passed; appending the transition name to the fixed legacy list duplicated the default). Now there is ONE declared
    # semantic ownership mapping run_binding.inputs {<role>: <input name>} (roles: data, destination and the role named by
    # lifecycle.transition_input.role). Admitted HERE, from the declarations alone, BEFORE any input is selected or read:
    #   (1) every role names a string and the names are pairwise distinct (no two roles can share one input);
    #   (2) the transition role exists and its name differs from EVERY other role's name (explicit, not by count);
    #   (3) the render stage's extra_vars (genesis.launch stage whose playbook_rel is run_binding.entry_rel) are C1's
    #       PROJECTION of the mapping values (C1-R5R-1 asks C1 to project them; checked here as a projection, never
    #       edited as a second list): same members, no duplicate.
    # No input name is restated in this file; every input is read through its role below (rb_in).
    # r5s (codex-tick480 R5R-TRANSITION-SEMANTIC-ROLE; C1-R5S-2): distinct NAMES do not prove the transition role is the
    # transition SEMANTICS -- r5r admitted transition_input.role: data (or destination), and selection then treated that
    # mandatory input as the optional transition. The optional transition identity is now BOUND to the canonical role
    # ownership declaration run_binding.input_roles {<role>: {required: bool}} (C1's schema refuses the same):
    #   (0) inputs and input_roles name the SAME roles; every required flag is a boolean;
    #   (1) the mandatory roles (required true) include the roles this render consumes directly (data, destination);
    #   (2) exactly ONE role is optional (required false) and transition_input.role IS that role -- so it can never be
    #       a mandatory role, whatever names the roles carry. Valid input-NAME renames are unaffected (names are values).
    - name: Refuse a transition role that is not the one optional role of the canonical role ownership (before selection)
      vars:
        _rb_ir: "{{ rh.controller.bootstrap.run_binding.input_roles }}"
        _rb_tr: "{{ rh.controller.bootstrap.run_binding.lifecycle.transition_input.role }}"
        _rb_opt: "{{ rh.controller.bootstrap.run_binding.input_roles | dict2items | rejectattr('value.required') | map(attribute='key') | list }}"
        _rb_man: "{{ rh.controller.bootstrap.run_binding.input_roles | dict2items | selectattr('value.required') | map(attribute='key') | list }}"
      ansible.builtin.assert:
        that:
          - _rb_ir.values() | reject('mapping') | list | length == 0
          - _rb_ir.values() | map(attribute='required') | reject('boolean') | list | length == 0
          - (_rb_ir.keys() | list | sort) == (rh.controller.bootstrap.run_binding.inputs.keys() | list | sort)
          - "'data' in _rb_man and 'destination' in _rb_man"
          - _rb_opt | length == 1
          - _rb_opt == [_rb_tr]
          - _rb_tr not in _rb_man
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.input,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.transition_role_semantic,
                                                    _rb_tr, _rb_ir | to_json]}) | trim }}
        quiet: true

    - name: Refuse a render-input role mapping whose transition role collides with another role (before selection)
      vars:
        _rb_im: "{{ rh.controller.bootstrap.run_binding.inputs }}"
        _rb_tr: "{{ rh.controller.bootstrap.run_binding.lifecycle.transition_input.role }}"
      ansible.builtin.assert:
        that:
          - _rb_im.data is defined and _rb_im.destination is defined
          - _rb_tr in _rb_im
          - _rb_im.values() | reject('string') | list | length == 0
          - (_rb_im.values() | list | unique | length) == (_rb_im | length)
          - >-
            _rb_im | dict2items | rejectattr('key', 'equalto', _rb_tr) | map(attribute='value')
            | select('equalto', _rb_im[_rb_tr]) | list | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.input,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.transition_input_collision,
                                                    _rb_tr, _rb_im | to_json]}) | trim }}
        quiet: true

    - name: Refuse a render stage whose extra_vars are not the projection of the role mapping (before selection)
      vars:
        _rb_ri: >-
          {{ rh.controller.bootstrap.genesis.launch.stages | dict2items
             | selectattr('value.playbook_rel', 'equalto', rh.controller.bootstrap.run_binding.entry_rel) | list }}
      ansible.builtin.assert:
        that:
          - _rb_ri | length == 1
          - _rb_ri[0].value.extra_vars is defined
          - _rb_ri[0].value.extra_vars is sequence
          - _rb_ri[0].value.extra_vars is not string
          - _rb_ri[0].value.extra_vars | reject('string') | list | length == 0
          - (_rb_ri[0].value.extra_vars | unique | list | length) == (_rb_ri[0].value.extra_vars | length)
          - (_rb_ri[0].value.extra_vars | sort) == (rh.controller.bootstrap.run_binding.inputs.values() | list | sort)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.input,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.input_projection_mismatch,
                                                    rh.controller.bootstrap.run_binding.inputs | to_json,
                                                    (_rb_ri | map(attribute='value') | map(attribute='extra_vars') | list) | to_json]}) | trim }}
        quiet: true

    # r5o (codex-tick444 R5M-TRANSITION-INPUT-CLOSURE), r5r (C1-R5R-1): ONE admitted selection per declared role of
    # run_binding.inputs. Each input's PRESENCE is a varnames match of exactly its declared name (regex-escaped, so the
    # name is never a pattern) and its value is read only when present (no lookup of an undefined name, no default).
    # rb_ti is the transition role's selection (lifecycle.transition_input.role); every consumer below -- validation,
    # retained paths, collision count, retained stat, classifier, plan, revision text, move readback -- reads rb_ti, and
    # the data / destination consumers read rb_in. A value supplied under any other name is not an input of this render.
    - name: Select the declared render inputs (one selection per role; presence by the declared name only)
      ansible.builtin.set_fact:
        rb_in: >-
          {%- set ns = namespace(m={}) -%}
          {%- for role, name in rh.controller.bootstrap.run_binding.inputs.items() -%}
          {%- set given = q('ansible.builtin.varnames', '^' ~ (name | regex_escape) ~ '$') | length == 1 -%}
          {%- set ns.m = ns.m | combine({role: {'var': name, 'given': given,
                                                'value': (lookup('ansible.builtin.vars', name) if given else none)}}) -%}
          {%- endfor -%}
          {{ ns.m }}

    - name: The transition role's selection (rb_ti; the role named by lifecycle.transition_input.role)
      ansible.builtin.set_fact:
        rb_ti: "{{ rb_in[rh.controller.bootstrap.run_binding.lifecycle.transition_input.role] }}"

    - name: Refuse an absent required render input (every role the canonical input_roles declares required)
      vars:
        _rb_req: "{{ rh.controller.bootstrap.run_binding.input_roles | dict2items | selectattr('value.required') | map(attribute='key') | list }}"
        _rb_miss: >-
          {{ rb_in | dict2items | selectattr('key', 'in', _rb_req)
             | rejectattr('value.given') | map(attribute='value.var') | list }}
      ansible.builtin.assert:
        that:
          - _rb_miss | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.input,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.input_absent, _rb_miss | to_json]}) | trim }}
        quiet: true

    - name: Refuse misplaced inputs (absolute paths; data outside the binding directory; transition shape)
      vars:
        _rb_d: "{{ rb_in.data.value }}"
        _rb_b: "{{ rb_in.destination.value }}"
      ansible.builtin.assert:
        that:
          - _rb_d is string and _rb_d is abs
          - _rb_b is string and _rb_b is abs
          - _rb_d | normpath == _rb_d
          - _rb_b | normpath == _rb_b
          - (_rb_b | dirname) != '/'
          - (_rb_b | basename) != rh.controller.bootstrap.run_binding.lab_basename
          # codex-tick578 B-LAB-LITERAL: the declared lab basename is ONE safe relative segment of the existing path
          # grammar (no separator, no . / .. segment, the joined path admitted); path noncollision is the collision assert
          - rh.controller.bootstrap.run_binding.lab_basename is string
          - rh.controller.bootstrap.path_admission.separator not in rh.controller.bootstrap.run_binding.lab_basename
          - rh.controller.bootstrap.run_binding.lab_basename is not regex(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - >-
            ((_rb_b | dirname) ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.run_binding.lab_basename)
            is regex(rh.controller.bootstrap.path_admission.regex, match_type='fullmatch')
          - (_rb_d | dirname) != (_rb_b | dirname)
          - not (_rb_d.startswith((_rb_b | dirname) ~ '/'))
          - not (_rb_d.startswith((_rb_b | dirname) ~ '.superseded/'))
          - _rb_d != (_rb_b | dirname) ~ rh.controller.bootstrap.run_binding.receipt_suffix
          - rb_ti.var == rh.controller.bootstrap.run_binding.inputs[rh.controller.bootstrap.run_binding.lifecycle.transition_input.role]
          - (rb_ti.given | bool) or rb_ti.value is none
          - >-
            not (rb_ti.given | bool) or (rb_ti.value is string
            and rb_ti.value is regex('[0-9a-f]{64}', match_type='fullmatch'))
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.input,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.input_shape,
                                                    rb_in | dict2items | map(attribute='value.var') | list | to_json,
                                                    rb_ti.var]}) | trim }}
        quiet: true

    - name: Derive the render paths (binding, receipt, superseded root, lab copy, run data)
      vars:
        _rb_b: "{{ rb_in.destination.value }}"
      ansible.builtin.set_fact:
        rb_out:
          binding: "{{ _rb_b }}"
          dir: "{{ _rb_b | dirname }}"
          receipt: "{{ (_rb_b | dirname) ~ rh.controller.bootstrap.run_binding.receipt_suffix }}"
          root: "{{ _rb_b | dirname }}.superseded"
          retained: >-
            {{ ((_rb_b | dirname) ~ '.superseded/' ~ rb_ti.value)
               if (rb_ti.given | bool) else '' }}
          # FIXED member names (never the dest / receipt basenames): the retained members cannot collide
          kept_binding: >-
            {{ ((_rb_b | dirname) ~ '.superseded/' ~ rb_ti.value ~ '/binding.yml')
               if (rb_ti.given | bool) else '' }}
          kept_receipt: >-
            {{ ((_rb_b | dirname) ~ '.superseded/' ~ rb_ti.value ~ '/receipt.yml')
               if (rb_ti.given | bool) else '' }}
          lab: "{{ (_rb_b | dirname) ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.run_binding.lab_basename }}"
          data: "{{ rb_in.data.value }}"

    - name: Refuse colliding render paths (every consumed / written / retained path distinct; before any effect)
      ansible.builtin.assert:
        that:
          - >-
            ([rb_out.binding, rb_out.receipt, rb_out.lab, rb_out.data, rb_out.dir, rb_out.root]
             + ([rb_out.retained, rb_out.kept_binding, rb_out.kept_receipt] if (rb_ti.given | bool) else []))
            | unique | list | length
            == 6 + (3 if (rb_ti.given | bool) else 0)
          - >-
            not (rb_ti.given | bool)
            or ((rb_out.kept_binding | basename) != (rb_out.kept_receipt | basename)
                and (rb_out.kept_binding | dirname) == rb_out.retained
                and (rb_out.kept_receipt | dirname) == rb_out.retained
                and (rb_out.retained | dirname) == rb_out.root)
          - (rb_out.binding | dirname) == rb_out.dir and (rb_out.lab | dirname) == rb_out.dir
          - (rb_out.binding | basename) != (rb_out.lab | basename)
          - not ((rb_out.data ~ '/').startswith(rb_out.root ~ '/'))
          - not ((rb_out.root ~ '/').startswith(rb_out.data ~ '/'))
          - not ((rb_out.dir ~ '/').startswith(rb_out.data ~ '/'))
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-COLLISION: the render paths collide (binding {{ rb_out.binding }}, receipt
          {{ rb_out.receipt }}, lab {{ rb_out.lab }}, data {{ rb_out.data }}, dir {{ rb_out.dir }}, superseded root
          {{ rb_out.root }}, retained
          {{ ([rb_out.retained, rb_out.kept_binding, rb_out.kept_receipt] if (rb_ti.given | bool) else []) | to_json }});
          nothing touched.
        quiet: true

    - name: Refuse a run whose inventory sources are not exactly the lab copy plus one controller inventory
      ansible.builtin.assert:
        that:
          - rb_out.lab in ansible_inventory_sources
          - ansible_inventory_sources | reject('equalto', rb_out.lab) | list | length == 1
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-LAB: the inventory sources {{ ansible_inventory_sources }} must be exactly the lab
          copy {{ rb_out.lab }} (the file the resolve reads; its all.vars declares lme_deployment_identity) and ONE
          operator controller inventory.
        quiet: true

    - name: Refuse an inventory source that is, contains or lies in a render output or the run data
      ansible.builtin.assert:
        that:
          - rb_src_i is string and rb_src_i is abs
          - >-
            rb_src_i == rb_out.lab
            or ([rb_out.dir, rb_out.binding, rb_out.receipt, rb_out.root, rb_out.data]
                | map('regex_replace', '$', '/') | select('match', (rb_src_i ~ '/') | regex_escape) | list | length == 0)
          - >-
            rb_src_i == rb_out.lab
            or not ((rb_src_i ~ '/').startswith(rb_out.dir ~ '/') or (rb_src_i ~ '/').startswith(rb_out.root ~ '/'))
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-INPUT: inventory source {{ rb_src_i }} is not absolute, or is / contains / lies in
          the binding directory {{ rb_out.dir }}, the receipt {{ rb_out.receipt }}, the superseded root {{ rb_out.root }}
          or the run data {{ rb_out.data }} (only the lab copy may be an -i path there).
        quiet: true
      loop: "{{ ansible_inventory_sources }}"
      loop_control:
        loop_var: rb_src_i

    # LAUNCH (r5f; codex-tick400 R4-BOOTSTRAP-CYCLE). Controller-side lookups / asserts / set_fact only until the builder
    # admission: no module has run yet, so a genesis process is admitted before its first module (admit_builder.yml).
    # (The resolve and the staged run-binding declaration assert now run BEFORE the input refusals: the receipt path
    # derives from the declared run_binding.receipt_suffix; r5f addendum, R4 r4c J-B1.)

    # the genesis launch ALWAYS carries the act var (genesis.launch.argv); the managed launch never needs it. Its
    # presence is the selector; the declared launches say which act_supplied value each one has (no launch name here).
    - name: Select the declared launch by the presence of the genesis act var
      ansible.builtin.set_fact:
        rb_launch_keys: >-
          {{ rh.controller.bootstrap.run_binding.launches | dict2items
             | selectattr('value.act_supplied', 'sameas',
                          q('ansible.builtin.varnames', '^' ~ rh.controller.bootstrap.genesis.launch.stage_root.act.var ~ '$') | length > 0)
             | map(attribute='key') | list }}

    - name: Refuse a launch selection that is not exactly one declared launch with a declared inventory kind
      ansible.builtin.assert:
        that:
          - rb_launch_keys | length == 1
          - rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].inventory in rh.controller.bootstrap.genesis.launch.inventory_kinds
          - >-
            (not rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].act_supplied)
            or (rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].stage in rh.controller.bootstrap.genesis.launch.stages
                and rh.controller.bootstrap.genesis.launch.stages[rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].stage].playbook_rel
                    == rh.controller.bootstrap.run_binding.entry_rel
                and rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].inventory
                    in rh.controller.bootstrap.genesis.launch.stages[rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].stage].inventory)
          # r5g (R5F-NEW-LITERAL-SOURCING): the join uses the declared core path grammar (path_admission.separator,
          # route-r4c N-P1; admitted ALWAYS by contract path_admission_grammar, N-G2) -- not a '/' literal
          - ((rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.run_binding.entry_rel) | dirname) == playbook_dir
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.launch }}: the declared launches
          {{ rh.controller.bootstrap.run_binding.launches | to_json }} select {{ rb_launch_keys }} for this process (genesis act
          var {{ rh.controller.bootstrap.genesis.launch.stage_root.act.var }} supplied:
          {{ q('ansible.builtin.varnames', '^' ~ rh.controller.bootstrap.genesis.launch.stage_root.act.var ~ '$') | length > 0 }});
          exactly one must match, name a declared inventory kind, and a genesis launch must name the genesis stage whose
          playbook_rel is run_binding.entry_rel and whose admitted inventory kinds include the launch's. Nothing was derived.
        quiet: true

    - name: Bind the selected launch (derived; the ^_?rb_ family is refused when supplied)
      ansible.builtin.set_fact:
        rb_launch: "{{ rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]] }}"
        rb_kind: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh.controller.bootstrap.run_binding.launches[rb_launch_keys[0]].inventory] }}"

    # GENESIS ADMISSION (route-owned, unchanged): every env pair, temp binding, act, interpreter and builder identity of
    # the declared genesis stage, BEFORE the first module of this play (the id read below). Not run on the managed launch.
    - name: Admit exactly the declared genesis builder (genesis launch only; before the first module)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_builder.yml"
      vars:
        rh_gen_stage: "{{ rb_launch.stage }}"
      when: rb_launch.act_supplied

    # Q3 (codex-tick400): explicitly ORDERED inventory files of the declared kind; the lab copy sits at its declared role
    - name: Refuse inventory sources that are not the selected launch's declared ordered inventory kind
      ansible.builtin.assert:
        that:
          - rb_kind.files is sequence and rb_kind.files is not string
          - rh.controller.bootstrap.run_binding.lab_role in rb_kind.files
          - ansible_inventory_sources | length == rb_kind.files | length
          - ansible_inventory_sources[rb_kind.files.index(rh.controller.bootstrap.run_binding.lab_role)] == rb_out.lab
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.launch }}: the inventory sources {{ ansible_inventory_sources }}
          are not the declared ordered kind {{ rb_launch.inventory }} {{ rb_kind.files }} with the lab copy {{ rb_out.lab }}
          at {{ rh.controller.bootstrap.run_binding.lab_role }}.
        quiet: true

    - name: Read the running uid (controller; declared tool)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.id.path }}", -u]
      register: rb_uid
      changed_when: false

    - name: Read the running account name (controller owner; declared tool)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.id.path }}", -un]
      register: rb_user
      changed_when: false

    - name: Observe the lab copy, the run data and the binding directory (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ rb_out.lab }}", "{{ rb_out.data }}", "{{ rb_out.dir }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_in

    - name: Refuse an absent or non-regular lab copy / run data, or a binding directory that is not a real directory
      ansible.builtin.assert:
        that:
          - rb_st_in.results[0].stat.exists and rb_st_in.results[0].stat.isreg and not rb_st_in.results[0].stat.islnk
          - rb_st_in.results[1].stat.exists and rb_st_in.results[1].stat.isreg and not rb_st_in.results[1].stat.islnk
          - rb_st_in.results[2].stat.exists and rb_st_in.results[2].stat.isdir and not rb_st_in.results[2].stat.islnk
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-LAB: {{ rb_out.lab }} and {{ rb_out.data }} must be existing regular files (no
          link) and {{ rb_out.dir }} a real directory.
        quiet: true

    - name: Read the run data ONCE as exact bytes (hashed and parsed from these same bytes)
      ansible.builtin.slurp:
        src: "{{ rb_out.data }}"
      register: rb_data_raw

    - name: Refuse run data whose read bytes are not the observed file, or that is not a mapping
      ansible.builtin.assert:
        that:
          - (rb_data_raw.content | b64decode | hash('sha256')) == rb_st_in.results[1].stat.checksum
          - (rb_data_raw.content | b64decode | from_yaml) is mapping
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-INPUT: {{ rb_out.data }} changed between observation
          ({{ rb_st_in.results[1].stat.checksum }}) and read ({{ rb_data_raw.content | b64decode | hash('sha256') }}),
          or its YAML is not a mapping.
        quiet: true

    - name: Bind the per-run data and its declared shape (parsed from the read bytes)
      ansible.builtin.set_fact:
        rb_run: "{{ rb_data_raw.content | b64decode | from_yaml }}"
        rb_rd: "{{ rh.controller.bootstrap.run_binding.run_data }}"

    # OPERATION (r5f; codex-tick400 operation-aware consumer join). STAGED: the controller key, its operation and the
    # operation's declaration are admitted (presence, type, membership) BEFORE any member is read. There is NO default
    # operation: an absent one is refused, never implied.
    - name: Refuse run data without a declared controller operation (presence and type first; no implied operation)
      ansible.builtin.assert:
        that:
          - rb_rd.top is mapping and rb_rd.controller is mapping
          - rb_rd.top.controller in rb_run
          - rb_run[rb_rd.top.controller] is mapping
          - rb_rd.controller.operation in rb_run[rb_rd.top.controller]
          - rb_run[rb_rd.top.controller][rb_rd.controller.operation] is string
          - rb_run[rb_rd.top.controller][rb_rd.controller.operation] in rh.controller.bootstrap.inventory.controller_operations
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.operation }}: the run data {{ rb_out.data }} must carry
          {{ rb_rd.top.controller }}.{{ rb_rd.controller.operation }} naming one of
          {{ rh.controller.bootstrap.inventory.controller_operations | list }} (got
          {{ (rb_run[rb_rd.top.controller] | to_json) if (rb_rd.top.controller in rb_run) else 'no ' ~ rb_rd.top.controller ~ ' key' }});
          there is no default operation. Nothing was derived.
        quiet: true

    - name: Bind the selected operation's declaration and the run data's controller part
      ansible.builtin.set_fact:
        rb_ctl_run: "{{ rb_run[rb_rd.top.controller] }}"
        rb_op: "{{ rh.controller.bootstrap.inventory.controller_operations[rb_run[rb_rd.top.controller][rb_rd.controller.operation]] }}"

    - name: Refuse controller inputs the selected operation does not declare (run data inputs exactly when declared so)
      ansible.builtin.assert:
        that:
          - rb_op.inputs is mapping
          - rb_op.inputs_in_run_data is boolean
          - rb_op.identity_nullable is boolean
          - >-
            (rb_ctl_run.keys() | list | sort)
            == ([rb_rd.controller.operation] + ([rb_rd.controller.inputs] if rb_op.inputs_in_run_data else [])) | sort
          - (not rb_op.inputs_in_run_data) or rb_ctl_run[rb_rd.controller.inputs] is mapping
          - >-
            (not rb_op.inputs_in_run_data)
            or ((rb_ctl_run[rb_rd.controller.inputs].keys() | list | sort) == (rb_op.inputs.keys() | list | sort))
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: operation
          {{ rb_ctl_run[rb_rd.controller.operation] }} declares inputs {{ rb_op.inputs | list }} taken from
          {{ 'the run data ' ~ rb_rd.top.controller ~ '.' ~ rb_rd.controller.inputs if rb_op.inputs_in_run_data
             else 'the operator controller inventory (localhost vars), never from the run data' }}; the run data carries
          {{ rb_ctl_run | to_json }}. Nothing was derived.
        quiet: true

    # controller-inventory operations (inputs_in_run_data false): each declared localhost var must be PRESENT (the
    # varnames lookup, as tasks/admit_builder.yml binds absence explicitly); never defaulted, never invented
    - name: Refuse an absent controller-inventory input of the selected operation (one declared var per item)
      ansible.builtin.assert:
        that:
          - q('ansible.builtin.varnames', '^' ~ rb_in_i.value.var ~ '$') | length == 1
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: operation
          {{ rb_ctl_run[rb_rd.controller.operation] }} input {{ rb_in_i.key }} needs the localhost var {{ rb_in_i.value.var }}
          of the operator controller inventory {{ ansible_inventory_sources | reject('equalto', rb_out.lab) | list }}; it is absent.
        quiet: true
      loop: "{{ rb_op.inputs | dict2items }}"
      loop_control:
        loop_var: rb_in_i
      when: not rb_op.inputs_in_run_data

    # ENDPOINT PRESENCE (r5k; codex-tick427-428 R4E-ENDPOINT-PRESENCE-BINDING, writer side): the EXPECTED set of
    # declared endpoint / input vars per alias, with their vouched lab-inherited values and declared absence (null), is
    # C1's projection at run_binding.presence.{expected_var, expected_path}. STAGED: the path must exist and be a mapping
    # of alias -> mapping before the macro reads it.
    # r5m (codex-tick433 R5K-PRESENCE-COMPLETENESS-JOIN): this assert checks SHAPE ONLY. It does NOT check coverage or
    # completeness. An alias mapped to {} or a partial var set passes it. Exact-universe coverage is C1's projection
    # join (C1-R5M-5), and the reader binding is R4's. Negative controls PRS-01/PRS-02 (UNRUN) depend on that join.
    - name: Refuse an absent or mis-shaped expected endpoint-presence projection (SHAPE ONLY, not coverage; before the render reads it)
      vars:
        rb_pres_ok: >-
          {%- set ns = namespace(v=none, ok=(q('ansible.builtin.varnames', '^' ~ rh.controller.bootstrap.run_binding.presence.expected_var ~ '$') | length == 1)) -%}
          {%- if ns.ok -%}{%- set ns.v = lookup('ansible.builtin.vars', rh.controller.bootstrap.run_binding.presence.expected_var) -%}{%- endif -%}
          {%- for k in rh.controller.bootstrap.run_binding.presence.expected_path -%}
          {%- if ns.ok and ns.v is mapping and k in ns.v -%}{%- set ns.v = ns.v[k] -%}{%- else -%}{%- set ns.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.ok and ns.v is mapping and (ns.v.values() | reject('mapping') | list | length == 0) }}
      ansible.builtin.assert:
        that:
          - rb_pres_ok | bool
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.placement,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.presence_incomplete,
                                                    rh.controller.bootstrap.run_binding.presence | to_json]}) | trim }}
        quiet: true

    # r5u (X-B-02) + codex-tick500 R5U-PRESERVE-NO-TARGET-INPUT-PROFILE: the bound target inputs are read by EXACT KEY,
    # never through a fallback mapping. The loader publishes binding.deployment.target_inputs exactly when the policy
    # declares target inputs (lme_manifests published-binding check). Declared -> the published key is required;
    # not declared -> no published key may exist and the render binds the DECLARED absence value
    # run_binding.target_inputs_absent (the legitimate no-target-input profile keeps rendering).
    - name: Refuse declared target inputs without their published binding, or a binding without a declaration
      ansible.builtin.assert:
        that:
          - lme_resolved.remote_harness.binding.deployment is mapping
          - "'target_inputs_absent' in rh.controller.bootstrap.run_binding"
          - rh.controller.bootstrap.run_binding.target_inputs_absent is mapping
          - >-
            ('target_inputs' in lme_resolved.remote_harness.binding.deployment
             and lme_resolved.remote_harness.binding.deployment.target_inputs is mapping)
            if 'target_inputs' in rh.controller.bootstrap.inventory
            else ('target_inputs' not in lme_resolved.remote_harness.binding.deployment)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: the policy declares target inputs
          (controller.bootstrap.inventory.target_inputs) but the resolve publishes no bound mapping
          (lme_resolved.remote_harness.binding.deployment.target_inputs, by exact key), or it publishes one the policy
          does not declare, or run_binding.target_inputs_absent is not declared; the render takes no fallback mapping;
          nothing touched.
        quiet: true

    - name: Derive the render inputs (policy and identity from the resolve, controller from the run, hosts from MAIN)
      ansible.builtin.set_fact:
        rb_bs: "{{ rh.controller.bootstrap }}"
        rb_repo_root: "{{ rh_repo_root }}"
        rb_derived:
          deployment_identity: "{{ lme_resolved | lme_validated_deployment_identity }}"
          lab_sha256: "{{ rb_st_in.results[0].stat.checksum }}"
          controller:
            toolchain_root: >-
              {{ rh_repo_root ~ '/' ~ rh.controller.bootstrap.work_roots.root_rel ~ '/'
                 ~ rh.controller.bootstrap.work_roots.sub_roots.toolchain }}
            owner: "{{ rb_user.stdout }}"
            operation: "{{ rb_ctl_run[rb_rd.controller.operation] }}"
            # role -> value of EXACTLY the declared inputs: the run data's (admitted above) or the declared localhost vars
            # (read-only vars lookup of the admitted-present names, in the declaration's key order)
            inputs: >-
              {{ rb_ctl_run[rb_rd.controller.inputs] if rb_op.inputs_in_run_data
                 else dict(rb_op.inputs.keys() | list
                           | zip(q('ansible.builtin.vars', *(rb_op.inputs.values() | map(attribute='var') | list)))) }}
          bound: >-
            {{ lme_resolved.remote_harness.binding.deployment.target_inputs
               if 'target_inputs' in rh.controller.bootstrap.inventory
               else rh.controller.bootstrap.run_binding.target_inputs_absent }}
          # r5k: {<alias>: {<declared var>: vouched lab value | null (declared absent)}} -- C1 projection, walked
          presence: >-
            {%- set ns = namespace(v=lookup('ansible.builtin.vars', rh.controller.bootstrap.run_binding.presence.expected_var)) -%}
            {%- for k in rh.controller.bootstrap.run_binding.presence.expected_path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
            {{ ns.v }}

    - name: Refuse an absent effective deployment identity unless the operation declares it nullable (null attribution only)
      ansible.builtin.assert:
        that:
          - >-
            (rb_derived.deployment_identity is string and rb_derived.deployment_identity | length > 0)
            or (rb_op.identity_nullable and rb_derived.deployment_identity is none)
          - rb_derived.deployment_identity == (lme_resolved | lme_validated_deployment_identity)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.identity }}: the effective resolved lme_deployment_identity
          (declared in the lab copy {{ rb_out.lab }} all.vars unless an approved operator input overrides it by Ansible
          precedence; validated by lme_validated_deployment_identity) is unset or empty, and operation
          {{ rb_derived.controller.operation }} does not declare identity_nullable; the render never takes it from the run
          data or mints one. (A null identity of a nullable operation is diagnostic attribution only, never proof.)
        quiet: true

    - name: Fix the admitted path set (toolchain root + the operation's path inputs) and its non-path inputs
      ansible.builtin.set_fact:
        rb_ctl_paths: >-
          {{ [rb_derived.controller.toolchain_root]
             + (rb_op.inputs | dict2items | selectattr('value.path') | map(attribute='key')
                | map('extract', rb_derived.controller.inputs) | list) }}
        rb_ctl_tokens: "{{ rb_op.inputs | dict2items | rejectattr('value.path') | list }}"

    - name: Refuse controller values that are not admitted absolute paths / a non-root owner
      ansible.builtin.assert:
        that:
          - (rb_uid.stdout | int) != 0
          - rb_user.stdout is string and rb_user.stdout is regex('[A-Za-z0-9._][A-Za-z0-9._-]*', match_type='fullmatch')
          - rh.controller.bootstrap.work_roots.root_rel is regex('[A-Za-z0-9._-]+', match_type='fullmatch')
          - rh.controller.bootstrap.work_roots.sub_roots.toolchain is regex('[A-Za-z0-9._-]+', match_type='fullmatch')
          - rb_derived.bound is mapping
          - (rb_derived.controller.inputs.keys() | list | sort) == (rb_op.inputs.keys() | list | sort)
          - rb_ctl_paths | reject('string') | list | length == 0
          - rb_ctl_paths | reject('abs') | list | length == 0
          - rb_ctl_paths | map('normpath') | list == rb_ctl_paths
          - rb_ctl_paths | reject('match', rh.controller.bootstrap.path_admission.regex) | list | length == 0
          - rb_ctl_paths | select('search', rh.controller.bootstrap.path_admission.forbidden_segment_regex) | list | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: the controller values
          {{ rb_derived.controller }} must be admitted normalized absolute paths (controller.bootstrap.path_admission: the
          toolchain root and every path input of operation {{ rb_derived.controller.operation }}
          {{ rb_op.inputs | dict2items | selectattr('value.path') | map(attribute='key') | list }}), the owner the
          non-root running account, and the lab binding a mapping.
        quiet: true

    - name: Refuse a non-path controller input that is not a string fully matching its declared regex
      ansible.builtin.assert:
        that:
          - rb_derived.controller.inputs[rb_tok_i.key] is string
          - rb_derived.controller.inputs[rb_tok_i.key] is regex(rb_tok_i.value.regex, match_type='fullmatch')
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: operation
          {{ rb_derived.controller.operation }} input {{ rb_tok_i.key }} = {{ rb_derived.controller.inputs[rb_tok_i.key] | to_json }}
          must be a string fully matching {{ rb_tok_i.value.regex }}.
        quiet: true
      loop: "{{ rb_ctl_tokens }}"
      loop_control:
        loop_var: rb_tok_i

    # MR03-STAGING (codex-tick616 STG-MEASUREMENT-ROOT-BINDING): a path input declaring a location
    # (inventory.controller_operations.<op>.inputs.<role>.location {sub, rel}) has ONE authority: <checkout>/
    # <work_roots.root_rel>/<sub_roots[sub]>/<rel>/<binding dir basename> -- the dir the genesis entry staged
    # (genesis.entry.staging.measurement). The run-data value must EQUAL it, BEFORE the binding is rendered or published
    # and before any measurement; an existing owned 0700 directory elsewhere is refused exactly like an absent one.
    - name: Refuse a located controller path input that is not its declared staged location
      ansible.builtin.assert:
        that:
          - >-
            rb_derived.controller.inputs[rb_loc_i.key]
            == [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
                rh.controller.bootstrap.work_roots.sub_roots[rb_loc_i.value.location.sub], rb_loc_i.value.location.rel,
                rb_in.destination.value | dirname | basename] | join(rh.controller.bootstrap.path_admission.separator)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.run_binding.refusals.controller }}: operation
          {{ rb_derived.controller.operation }} input {{ rb_loc_i.key }} = {{ rb_derived.controller.inputs[rb_loc_i.key] | to_json }}
          is not its declared location <checkout>/<work_roots.root_rel>/<sub_roots[{{ rb_loc_i.value.location.sub }}]>/
          {{ rb_loc_i.value.location.rel }}/<binding dir basename> (the dir the genesis entry staged); nothing was rendered.
        quiet: true
      loop: "{{ rb_op.inputs | dict2items | selectattr('value.location', 'defined') | list }}"
      loop_control:
        loop_var: rb_loc_i

    # the macros' RUN-BINDING-* refusals surface in this task's lookup error (it is NOT in a rescue block)
    - name: Render the run binding IN MEMORY (thin caller over the generic macros; nothing written)
      ansible.builtin.set_fact:
        rb_text: >-
          {{ lookup('ansible.builtin.template', rh_repo_root ~ '/ansible/inventory/graph_lab_run_binding.yml.j2',
                    template_vars={'rb_bs': rb_bs, 'rb_repo_root': rb_repo_root, 'rb_run': rb_run,
                                   'rb_derived': rb_derived}) }}

    # RECEIPT BINDINGS (r5h; codex-tick421 J-B8, replacing r5g's flat receipt_revisions): the receipt's resolve-bound
    # fields are declared ONCE in run_binding.receipt_bindings {<field>: {role, var, path}} -- role one of
    # run_binding.binding_roles {compared, attributed}; var ONE existing current-resolve record (e.g. rh_config_revision,
    # lme_resolved, rh_engine_revision) and path the key steps inside it (no new resolver, no second pair mapping). This
    # writer RECORDS every field (both roles); every reader ITERATES the same declaration (route admit_binding_receipt.yml
    # compares the `compared` role, records `attributed` producer and consumer values separately, never forced equal).
    # The value walk is the construction R4 proposes for both sides (r4e W-1; PROVISIONAL until that proposal joins).
    # STAGED: each declared record is present and every path step exists before any value is read.
    - name: Refuse a declared receipt binding whose current-resolve record or path is absent (one declared binding per item)
      vars:
        rb_walk_ok: >-
          {%- set ns = namespace(v=lookup('ansible.builtin.vars', rb_rev_i.value.var), ok=true) -%}
          {%- for k in rb_rev_i.value.path -%}
          {%- if ns.ok and ns.v is mapping and k in ns.v -%}{%- set ns.v = ns.v[k] -%}{%- else -%}{%- set ns.ok = false -%}{%- endif -%}
          {%- endfor -%}{{ ns.ok }}
      ansible.builtin.assert:
        that:
          - rb_rev_i.value is mapping
          - rb_rev_i.value.role in (rh.controller.bootstrap.run_binding.binding_roles.values() | list)
          - rb_rev_i.value.var is string
          - rb_rev_i.value.path is sequence and rb_rev_i.value.path is not string
          - q('ansible.builtin.varnames', '^' ~ rb_rev_i.value.var ~ '$') | length == 1
          - rb_walk_ok | bool
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.receipt_fact_absent,
                                                    rb_rev_i.key, rb_rev_i.value | to_json]}) | trim }}
        quiet: true
      loop: "{{ rh.controller.bootstrap.run_binding.receipt_bindings | dict2items }}"
      loop_control:
        loop_var: rb_rev_i

    # LOADER SOURCE (r5k; codex-tick427-428 OPEN-LOADER-BYTES resolved): the admitted loader-source digest
    # (ansible/roles/podman/filter_plugins/lme_manifests.py) is ONE compared receipt binding, listed in
    # run_binding.pre_execution_fields. A digest computed by the already-executed loader is no proof, so such a field
    # must be sourced from the PRE-EXECUTION admission record the resolve publishes (C1 / route, bound to the bytes
    # admitted against the trusted checkout before the loader ran) -- never from a declared loader output var
    # (run_binding.loader_output_vars, e.g. lme_resolved). This writer records it through the same walk; R4 reads it.
    - name: Refuse a pre-execution receipt field sourced from loader output (or not a compared binding)
      ansible.builtin.assert:
        that:
          - rb_pre_i in rh.controller.bootstrap.run_binding.receipt_bindings
          - >-
            rh.controller.bootstrap.run_binding.receipt_bindings[rb_pre_i].role
            == rh.controller.bootstrap.run_binding.binding_roles.compared
          - >-
            rh.controller.bootstrap.run_binding.receipt_bindings[rb_pre_i].var
            not in rh.controller.bootstrap.run_binding.loader_output_vars
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.loader_source_post_execution,
                                                    rb_pre_i,
                                                    rh.controller.bootstrap.run_binding.loader_output_vars | to_json]}) | trim }}
        quiet: true
      loop: "{{ rh.controller.bootstrap.run_binding.pre_execution_fields }}"
      loop_control:
        loop_var: rb_pre_i

    - name: Hash the rendered text and fix the current receipt inputs
      ansible.builtin.set_fact:
        rb_sha256: "{{ rb_text | hash('sha256') }}"
        # the attribution fields (unchanged), then EVERY declared receipt binding (both roles) walked from its record
        rb_in: >-
          {%- set ns = namespace(d={}, v=none) -%}
          {%- for f, b in rh.controller.bootstrap.run_binding.receipt_bindings.items() -%}
          {%- set ns.v = lookup('ansible.builtin.vars', b.var) -%}
          {%- for k in b.path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
          {%- set ns.d = ns.d | combine({f: ns.v}) -%}
          {%- endfor -%}
          {#- r5p (R5O-RECEIPT-ROLE-DISJOINTNESS): every attribution member by its DECLARED role (receipt_roles); the
              ownership map admitted before construction guarantees these names and the receipt_bindings fields are
              pairwise distinct, so combine never overwrites one member with another -#}
          {%- set rr = rh.controller.bootstrap.run_binding.receipt_roles -%}
          {{ {rr.binding: rb_out.binding,
              rr.controller_inventory: ansible_inventory_sources | reject('equalto', rb_out.lab) | list,
              rr.data: rb_out.data,
              rr.data_sha256: rb_data_raw.content | b64decode | hash('sha256'),
              rr.deployment_identity: rb_derived.deployment_identity,
              rr.lab: rb_out.lab,
              rr.lab_sha256: rb_derived.lab_sha256}
             | combine(ns.d) }}

    # HISTORY KEY (r5j; codex-tick425-426 R5H-HISTORY-KEY-CONSUMPTION): the receipt's lineage member is the DECLARED
    # run_binding.history.key everywhere below (construction, lifecycle classification, readback, report) -- no
    # literal. It is a role of its own: it must be a receipt_keys member, never a receipt_bindings field (compared or
    # attributed), never an attribution field or binding_sha256 of this receipt, and never one of its own prior keys;
    # history.bindings must not shadow a lineage sub-key of the transition record. Refused HERE, before anything is
    # recorded, so a colliding key can never overwrite a bound field. history.prior_keys are the earlier declared keys
    # whose receipts stay READABLE (verified, attributable, retained by a transition) but are never reused as-is.
    # r5l (codex-tick431-432 R5J-CHANGED-VALUE-SOURCING): the lineage sub-keys are the DECLARED roles
    # run_binding.history.lineage {from, from_binding, to, retained} (role -> receipt sub-key), consumed here, by the
    # transition construction and by the reuse branch -- no literal sub-key. The binding digest member is not restated
    # here: a history key equal to it collapses the combined document and the key-set assert below refuses it.
    - name: Refuse a declared history key that collides with a receipt field (before any record)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.run_binding.history.key in rh.controller.bootstrap.run_binding.receipt_keys
          - rh.controller.bootstrap.run_binding.history.key not in rh.controller.bootstrap.run_binding.receipt_bindings
          - rh.controller.bootstrap.run_binding.history.key not in rb_in
          # r5o (codex-tick444 R5M-CONTROL-BOUNDARIES LR-12): the history key and the binding-digest member are BOTH
          # top-level receipt members; equal names would collapse one into the other, so they are refused here by the
          # declared role (receipt_roles.binding_digest), not left to the key-set count. Lineage sub-keys live one level
          # down (inside the history member) and may reuse a top-level name harmlessly.
          - rh.controller.bootstrap.run_binding.history.key != rh.controller.bootstrap.run_binding.receipt_roles.binding_digest
          - rh.controller.bootstrap.run_binding.history.key not in rh.controller.bootstrap.run_binding.history.prior_keys
          - >-
            rh.controller.bootstrap.run_binding.history.prior_keys
            | select('in', rh.controller.bootstrap.run_binding.receipt_keys) | list | length == 0
          - >-
            (rh.controller.bootstrap.run_binding.history.lineage.values() | list | unique | list | length)
            == (rh.controller.bootstrap.run_binding.history.lineage | length)
          - >-
            rh.controller.bootstrap.run_binding.history.bindings
            not in (rh.controller.bootstrap.run_binding.history.lineage.values() | list)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.history_collision,
                                                    rh.controller.bootstrap.run_binding.history | to_json,
                                                    rh.controller.bootstrap.run_binding.receipt_bindings | list | to_json]}) | trim }}
        quiet: true

    - name: Refuse a receipt document whose key set is not the declared receipt_keys (writer conforms to the schema)
      ansible.builtin.assert:
        that:
          - >-
            (rb_in | combine({rh.controller.bootstrap.run_binding.receipt_roles.binding_digest: rb_sha256, rh.controller.bootstrap.run_binding.history.key: none})).keys() | list | sort
            == rh.controller.bootstrap.run_binding.receipt_keys | sort
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.receipt_keys_mismatch,
                                                    (rb_in | combine({rh.controller.bootstrap.run_binding.receipt_roles.binding_digest: rb_sha256, rh.controller.bootstrap.run_binding.history.key: none})).keys() | list | sort | to_json,
                                                    rh.controller.bootstrap.run_binding.receipt_keys | sort | to_json]}) | trim }}
        quiet: true

    - name: Observe the destination pair and the superseded root (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ rb_out.binding }}", "{{ rb_out.receipt }}", "{{ rb_out.root }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_pair

    - name: Observe the retained pair named by the transition input (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ rb_out.retained }}", "{{ rb_out.kept_binding }}", "{{ rb_out.kept_receipt }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_ret
      when: rb_ti.given | bool

    # custody: file = regular, no link, owned by the running uid, mode 0600; dir = real dir, no link, owned, 0700
    # r5n (R5L-CHANGED-CLASSIFIER-SOURCING closure): every class this producer emits is a declared
    # lifecycle.custody_classes value (the classifier compares the SAME declaration). r5o (R5M-TRANSITION-INPUT-CLOSURE):
    # the transition input's presence is the ONE selection rb_ti (no second varnames query). Values equal the r5m
    # literals, so no receipt or output byte changes.
    - name: Classify the custody of every observed path (declared custody classes; not_requested without a transition input)
      vars:
        rb_cc: "{{ rh.controller.bootstrap.run_binding.lifecycle.custody_classes }}"
        rb_tg: "{{ rb_ti.given | bool }}"
      ansible.builtin.set_fact:
        rb_obs:
          b: >-
            {{ rb_cc.absent if not rb_st_pair.results[0].stat.exists else (rb_cc.ok if (rb_st_pair.results[0].stat.isreg
               and not rb_st_pair.results[0].stat.islnk and rb_st_pair.results[0].stat.uid == (rb_uid.stdout | int)
               and rb_st_pair.results[0].stat.mode == '0600') else rb_cc.bad) }}
          # r5u (X-B-02 scan): a digest is the stat's checksum by EXACT KEY, else none (no digest observed: absent,
          # not a regular file, or unreadable); every comparison below is guarded by the custody class, and none
          # equals no 64-hex value (r5p's '' fallback had the same effect)
          b_sha: "{{ rb_st_pair.results[0].stat.checksum if 'checksum' in rb_st_pair.results[0].stat else none }}"
          r: >-
            {{ rb_cc.absent if not rb_st_pair.results[1].stat.exists else (rb_cc.ok if (rb_st_pair.results[1].stat.isreg
               and not rb_st_pair.results[1].stat.islnk and rb_st_pair.results[1].stat.uid == (rb_uid.stdout | int)
               and rb_st_pair.results[1].stat.mode == '0600') else rb_cc.bad) }}
          r_sha: "{{ rb_st_pair.results[1].stat.checksum if 'checksum' in rb_st_pair.results[1].stat else none }}"
          root: >-
            {{ rb_cc.absent if not rb_st_pair.results[2].stat.exists else (rb_cc.ok if (rb_st_pair.results[2].stat.isdir
               and not rb_st_pair.results[2].stat.islnk and rb_st_pair.results[2].stat.uid == (rb_uid.stdout | int)
               and rb_st_pair.results[2].stat.mode == '0700') else rb_cc.bad) }}
          rd: >-
            {{ rb_cc.not_requested if not (rb_tg | bool) else (rb_cc.absent if not rb_st_ret.results[0].stat.exists
               else (rb_cc.ok if (rb_st_ret.results[0].stat.isdir and not rb_st_ret.results[0].stat.islnk
               and rb_st_ret.results[0].stat.uid == (rb_uid.stdout | int) and rb_st_ret.results[0].stat.mode == '0700')
               else rb_cc.bad)) }}
          rb: >-
            {{ rb_cc.not_requested if not (rb_tg | bool) else (rb_cc.absent if not rb_st_ret.results[1].stat.exists
               else (rb_cc.ok if (rb_st_ret.results[1].stat.isreg and not rb_st_ret.results[1].stat.islnk
               and rb_st_ret.results[1].stat.uid == (rb_uid.stdout | int) and rb_st_ret.results[1].stat.mode == '0600')
               else rb_cc.bad)) }}
          rb_sha: >-
            {{ none if not (rb_tg | bool)
               else (rb_st_ret.results[1].stat.checksum if 'checksum' in rb_st_ret.results[1].stat else none) }}
          rr: >-
            {{ rb_cc.not_requested if not (rb_tg | bool) else (rb_cc.absent if not rb_st_ret.results[2].stat.exists
               else (rb_cc.ok if (rb_st_ret.results[2].stat.isreg and not rb_st_ret.results[2].stat.islnk
               and rb_st_ret.results[2].stat.uid == (rb_uid.stdout | int) and rb_st_ret.results[2].stat.mode == '0600')
               else rb_cc.bad)) }}
          rr_sha: >-
            {{ none if not (rb_tg | bool)
               else (rb_st_ret.results[2].stat.checksum if 'checksum' in rb_st_ret.results[2].stat else none) }}

    # RECEIPT BYTES (codex-tick370 RUN-BINDING-LIFECYCLE-RECEIPT-BYTES): each consumed receipt is read ONCE (slurp);
    # the digest of THOSE bytes must equal the stat checksum the classification uses, and the parse is of THOSE bytes
    # r5o (codex-tick444, continued custody-class sourcing): every gate below compares the declared
    # lifecycle.custody_classes.ok, the SAME declaration the rb_obs producer emits; no class literal.
    - name: Read the destination receipt ONCE as exact bytes (custody-admitted only)
      ansible.builtin.slurp:
        src: "{{ rb_out.receipt }}"
      register: rb_rc_cur_raw
      when: rb_obs.r == rh.controller.bootstrap.run_binding.lifecycle.custody_classes.ok

    - name: Read the retained receipt ONCE as exact bytes (custody-admitted only)
      ansible.builtin.slurp:
        src: "{{ rb_out.kept_receipt }}"
      register: rb_rc_old_raw
      when: rb_obs.rr == rh.controller.bootstrap.run_binding.lifecycle.custody_classes.ok

    - name: Refuse a receipt whose read bytes are not the observed file (replaced between stat and read)
      vars:
        rb_cc: "{{ rh.controller.bootstrap.run_binding.lifecycle.custody_classes }}"
      ansible.builtin.assert:
        that:
          - rb_obs.r != rb_cc.ok or (rb_rc_cur_raw.content | b64decode | hash('sha256')) == rb_obs.r_sha
          - rb_obs.rr != rb_cc.ok or (rb_rc_old_raw.content | b64decode | hash('sha256')) == rb_obs.rr_sha
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: a receipt changed between observation and read: {{ rb_out.receipt }}
          (stat {{ rb_obs.r_sha | to_json }}, read
          {{ (rb_rc_cur_raw.content | b64decode | hash('sha256')) if rb_obs.r == rb_cc.ok else 'none' }}),
          {{ rb_out.kept_receipt | to_json }} (stat {{ rb_obs.rr_sha | to_json }}, read
          {{ (rb_rc_old_raw.content | b64decode | hash('sha256')) if rb_obs.rr == rb_cc.ok else 'none' }}); every byte preserved.
        quiet: true

    # only the receipt parse is in the rescue: an unparseable receipt is an unverified state (CONFLICT), bytes preserved
    - name: Parse the bound receipts (from the same read bytes)
      block:
        - name: Parse the destination receipt and the retained receipt
          vars:
            rb_cc: "{{ rh.controller.bootstrap.run_binding.lifecycle.custody_classes }}"
          ansible.builtin.set_fact:
            rb_rc:
              cur: "{{ (rb_rc_cur_raw.content | b64decode | from_yaml) if rb_obs.r == rb_cc.ok else none }}"
              old: "{{ (rb_rc_old_raw.content | b64decode | from_yaml) if rb_obs.rr == rb_cc.ok else none }}"
      rescue:
        - name: Refuse an unparseable receipt (unverified state; nothing touched)
          ansible.builtin.fail:
            msg: >-
              REFUSED RUN-BINDING-RENDER-CONFLICT: a receipt could not be parsed: {{ rb_out.receipt }}
              (sha256 {{ rb_obs.r_sha | to_json }}), {{ rb_out.kept_receipt | to_json }}
              (receipt sha256 {{ rb_obs.rr_sha | to_json }}); every byte is preserved.

    - name: Classify the destination pair into exactly ONE lifecycle state (before any write)
      ansible.builtin.set_fact:
        rb_state: |-
          {#- r5m (R5L-CHANGED-CLASSIFIER-SOURCING): no private fallback. The optional transition input is the declared
              input of role lifecycle.transition_input.role (r5r: run_binding.inputs; selection rb_ti); its PRESENCE is tested (Sg) and S is read only when present (declared
              optional: absence means no transition was requested). Every emitted label is a declared lifecycle state. -#}
          {%- set LS = rh.controller.bootstrap.run_binding.lifecycle -%}
          {%- set st = LS.states -%}
          {#- r5o (R5M-TRANSITION-INPUT-CLOSURE): Sg / S are the ONE admitted selection rb_ti (validated above), never a
              second read of any name -#}
          {%- set Sg = (rb_ti.given | bool) -%}
          {%- set S = rb_ti.value if Sg else none -%}
          {%- set H = rb_sha256 -%}
          {%- set o = rb_obs -%}
          {#- r5n (R5L-CHANGED-CLASSIFIER-SOURCING closure): custody classes and receipt-member roles are the declared
              lifecycle.custody_classes (cc, the SAME declaration the rb_obs producer emits) and run_binding.receipt_roles
              (rr_b = the binding path member, rr_d = the binding digest member); no class or member literal below -#}
          {%- set cc = LS.custody_classes -%}
          {%- set rr_b = rh.controller.bootstrap.run_binding.receipt_roles.binding -%}
          {%- set rr_d = rh.controller.bootstrap.run_binding.receipt_roles.binding_digest -%}
          {#- r5g: the receipt key set is the declared run_binding.receipt_keys (the writer conforms, asserted above) -#}
          {%- set keys = rh.controller.bootstrap.run_binding.receipt_keys | sort -%}
          {%- set cur = rb_rc.cur -%}
          {%- set old = rb_rc.old -%}
          {#- r5j: the lineage member is the DECLARED history.key (hk); a receipt recorded under exactly ONE declared prior
              key (history.prior_keys) still verifies (attributable, retainable) but is never unchanged / reused -#}
          {%- set hk = rh.controller.bootstrap.run_binding.history.key -%}
          {%- set hprior = rh.controller.bootstrap.run_binding.history.prior_keys -%}
          {%- set cur_hk = (hprior | select('in', cur) | list | first) if (cur is mapping and hk not in cur and (hprior | select('in', cur) | list | length) == 1) else hk -%}
          {%- set old_hk = (hprior | select('in', old) | list | first) if (old is mapping and hk not in old and (hprior | select('in', old) | list | length) == 1) else hk -%}
          {%- set cur_fmt = (cur is mapping and cur_hk in cur and ((cur.keys() | list | reject('equalto', cur_hk) | list) + [hk]) | sort == keys) -%}
          {%- set old_fmt = (old is mapping and old_hk in old and ((old.keys() | list | reject('equalto', old_hk) | list) + [hk]) | sort == keys) -%}
          {%- set r_ver = (o.b == cc.ok and o.r == cc.ok and cur_fmt and cur[rr_b] == rb_out.binding and cur[rr_d] == o.b_sha) -%}
          {%- set same = (r_ver and ((cur | dict2items | rejectattr('key', 'in', [rr_d, cur_hk]) | items2dict) == rb_in)) -%}
          {%- set unchanged = (r_ver and o.b_sha == H and same and cur_hk == hk) -%}
          {#- S names a RECEIPT (its file sha256, the full revision identity); B_old is that receipt's binding_sha256 -#}
          {%- set rr_ver = (Sg and o.rr == cc.ok and o.rr_sha == S and old_fmt and old[rr_b] == rb_out.binding and old[rr_d] is string) -%}
          {%- set rb_ver = (rr_ver and o.rb == cc.ok and o.rb_sha == old[rr_d]) -%}
          {#- r5m (R5L-MALFORMED-LINEAGE-CLAIM): ONE common lineage validation, BEFORE both reuse paths (with and without
              the transition input). It runs only when `unchanged`, which implies cur_fmt with cur_hk == hk, so hk IS a key
              of cur and cur[hk] is a valid index (INVARIANT; the malformed-lineage refusal below relies on it). null is
              the schema's DECLARED absence (no recorded transition); a mapping must carry exactly the declared lineage
              roles' sub-keys plus history.bindings with a string from-role value; anything else is lineage_malformed. -#}
          {%- set lin = rh.controller.bootstrap.run_binding.history.lineage -%}
          {%- set lv = namespace(ok=true, hv=none) -%}
          {%- if unchanged -%}
          {%- set lv.hv = cur[hk] -%}
          {%- if lv.hv is not none and (lv.hv is not mapping
                   or (lv.hv.keys() | list | sort) != ((lin.values() | list) + [rh.controller.bootstrap.run_binding.history.bindings]) | sort
                   or lv.hv[lin['from']] is not string) -%}{%- set lv.ok = false -%}{%- endif -%}
          {%- endif -%}
          {%- set ns = namespace(st=st.conflict) -%}
          {%- if cc.bad in [o.b, o.r, o.root, o.rd, o.rb, o.rr] -%}
          {%- set ns.st = st.conflict -%}
          {%- elif unchanged and not lv.ok -%}
          {%- set ns.st = st.lineage_malformed -%}
          {%- elif not Sg -%}
          {#- lineage (coordinator review): with a superseded root present, an absent pair or a receipt-less binding can
              be an interrupted TRANSITION; without the transition input it is unverified (conflict), never a
              transition-free publish / resume that would drop the recorded lineage -#}
          {%- if o.b == cc.absent and o.r == cc.absent and o.root == cc.absent -%}{%- set ns.st = st.publish -%}
          {%- elif o.b == cc.ok and o.r == cc.absent and o.b_sha == H and o.root == cc.absent -%}{%- set ns.st = st.resume_receipt -%}
          {%- elif unchanged -%}{%- set ns.st = st.reuse -%}
          {%- elif r_ver -%}{%- set ns.st = st.revision -%}
          {%- endif -%}
          {%- elif unchanged -%}
          {#- the lineage is validated above (lv.ok): null -> S names nothing it recorded -> supersedes_mismatch -#}
          {%- set ns.st = st.reuse if (lv.hv is not none and lv.hv[lin['from']] == S) else st.supersedes_mismatch -%}
          {%- elif o.rd == cc.absent -%}
          {%- if o.b == cc.absent and o.r == cc.absent -%}{%- set ns.st = st.supersedes_nothing -%}
          {%- elif r_ver and o.r_sha == S -%}{%- set ns.st = st.transition -%}
          {%- elif r_ver -%}{%- set ns.st = st.supersedes_mismatch -%}
          {%- endif -%}
          {%- elif o.rb == cc.absent and o.rr == cc.absent and r_ver and o.r_sha == S -%}{%- set ns.st = st.transition -%}
          {%- elif rr_ver and o.rb == cc.absent and o.r == cc.absent and o.b == cc.ok and o.b_sha == old[rr_d] -%}{%- set ns.st = st.transition -%}
          {%- elif rr_ver and rb_ver and o.r == cc.absent and o.b == cc.absent -%}{%- set ns.st = st.transition -%}
          {%- elif rr_ver and rb_ver and o.r == cc.absent and o.b == cc.ok and o.b_sha == H -%}{%- set ns.st = st.transition -%}
          {%- endif -%}
          {{- ns.st -}}

    # r5l: a verified current receipt whose recorded lineage member is malformed (not null, not exactly the declared
    # lineage sub-keys + history.bindings, or a non-string `from` role) refuses with its own declared text -- never an
    # undefined-variable error, never a reuse or supersedes verdict built on a private default.
    # r5m (R5L-UNCONDITIONAL-DIAGNOSTIC-INDEX): Ansible templates fail_msg BEFORE it evaluates `that`, so this task RUNS
    # ONLY in the classified malformed state (when:); a skipped task templates nothing. In that state the classifier's
    # INVARIANT holds (lineage_malformed only when `unchanged`, hence hk in rb_rc.cur), so the diagnostic index below is
    # valid; fresh publish (cur null), receipt-resume and a prior-key receipt never reach it.
    - name: Refuse a malformed recorded lineage (preserve every byte)
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.lineage_malformed
      ansible.builtin.assert:
        that:
          - rb_state != rh.controller.bootstrap.run_binding.lifecycle.states.lineage_malformed
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.run_binding.refusals.receipt,
                                   'rh_rf_detail': [rh.controller.bootstrap.run_binding.texts.lineage_malformed,
                                                    rb_out.receipt,
                                                    rh.controller.bootstrap.run_binding.history | to_json,
                                                    rb_rc.cur[rh.controller.bootstrap.run_binding.history.key] | to_json]}) | trim }}
        quiet: true

    - name: Refuse a revision without a valid explicit transition input (preserve every byte)
      ansible.builtin.assert:
        that:
          - >-
            rb_state not in (rh.controller.bootstrap.run_binding.lifecycle.revision_refused
                             | map('extract', rh.controller.bootstrap.run_binding.lifecycle.states) | list)
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-REVISION ({{ rb_state }}): the binding {{ rb_out.binding }} (sha256
          {{ rb_obs.b_sha | to_json }}) with its verified receipt {{ rb_out.receipt }} (sha256
          {{ rb_obs.r_sha | to_json }}) differs from this render (sha256 {{ rb_sha256 }}) or from its
          recorded inputs, and
          {{ (rb_ti.var ~ '=' ~ rb_ti.value ~ ' does not name that receipt or its recorded transition, or there is no pair to supersede')
             if (rb_ti.given | bool) else 'no transition input was given' }}.
          A configuration-revision transition needs -e {{ rb_ti.var }}=<the observed RECEIPT sha256>; the
          superseded pair is then retained under {{ rb_out.root }}/<that sha256>/{binding.yml, receipt.yml}. Nothing touched.
        quiet: true

    - name: Refuse an unverified or conflicting state (preserve every byte; report paths and observed sha256)
      ansible.builtin.assert:
        that:
          - >-
            rb_state in (rh.controller.bootstrap.run_binding.lifecycle.proceed
                         | map('extract', rh.controller.bootstrap.run_binding.lifecycle.states) | list)
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT ({{ rb_state }}): unverified destination state, nothing touched --
          binding {{ rb_out.binding }} [{{ rb_obs.b }}] sha256={{ rb_obs.b_sha | to_json }};
          receipt {{ rb_out.receipt }} [{{ rb_obs.r }}] sha256={{ rb_obs.r_sha | to_json }};
          superseded root {{ rb_out.root }} [{{ rb_obs.root }}];
          retained {{ rb_out.retained | to_json }} [{{ rb_obs.rd }}] binding [{{ rb_obs.rb }}]
          sha256={{ rb_obs.rb_sha | to_json }} receipt [{{ rb_obs.rr }}]
          sha256={{ rb_obs.rr_sha | to_json }}; rendered sha256={{ rb_sha256 }}. Files must be owned
          regular 0600 files, dirs owned real 0700 dirs, and every receipt must vouch for the binding it names.
        quiet: true

    # r5n (R5L-CHANGED-CLASSIFIER-SOURCING closure): the plan reads the classified custody through the declared
    # custody_classes and the superseded receipt's binding digest through receipt_roles.binding_digest; the transition
    # input value through its declared var (a transition state implies the input is present, see the classifier).
    # r5o (R5M-TRANSITION-INPUT-CLOSURE): that value is the ONE selection rb_ti.value (no second lookup).
    - name: Plan the writes of the classified state (reuse writes nothing)
      vars:
        rb_cc: "{{ rh.controller.bootstrap.run_binding.lifecycle.custody_classes }}"
        rb_rrd: "{{ rh.controller.bootstrap.run_binding.receipt_roles.binding_digest }}"
      ansible.builtin.set_fact:
        rb_plan:
          mkroot: "{{ rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition and rb_obs.root == rb_cc.absent }}"
          mkdir: "{{ rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition and rb_obs.rd == rb_cc.absent }}"
          mv_receipt: "{{ rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition and rb_obs.r == rb_cc.ok }}"
          # B_old: the superseded receipt's binding digest (the current receipt before its move, else the retained one)
          old_binding_sha256: >-
            {{ ((rb_rc.cur if rb_obs.r == rb_cc.ok else rb_rc.old)[rb_rrd]) if rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition else '' }}
          mv_binding: >-
            {{ rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition and rb_obs.b == rb_cc.ok and rb_obs.rb == rb_cc.absent
               and rb_obs.b_sha == (rb_rc.cur if rb_obs.r == rb_cc.ok else rb_rc.old)[rb_rrd] }}
          write_binding: >-
            {{ rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.publish or (rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition and (rb_obs.b == rb_cc.absent
               or (rb_obs.rb == rb_cc.absent and rb_obs.b_sha == (rb_rc.cur if rb_obs.r == rb_cc.ok else rb_rc.old)[rb_rrd]))) }}
          write_receipt: >-
            {{ rb_state in (rh.controller.bootstrap.run_binding.lifecycle.writes_receipt
                            | map('extract', rh.controller.bootstrap.run_binding.lifecycle.states) | list) }}
          transition: >-
            {{ ({rh.controller.bootstrap.run_binding.history.lineage['from']: rb_ti.value,
                 rh.controller.bootstrap.run_binding.history.lineage.from_binding: (rb_rc.cur if rb_obs.r == rb_cc.ok else rb_rc.old)[rb_rrd],
                 rh.controller.bootstrap.run_binding.history.lineage.to: rb_sha256,
                 rh.controller.bootstrap.run_binding.history.lineage.retained: rb_out.retained}
                | combine({rh.controller.bootstrap.run_binding.history.bindings:
                            dict(rh.controller.bootstrap.run_binding.receipt_bindings | list
                                 | zip(rh.controller.bootstrap.run_binding.receipt_bindings | list
                                       | map('extract', rb_rc.cur if rb_obs.r == rb_cc.ok else rb_rc.old) | list))}))
               if rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition else none }}

    - name: Create the superseded root if absent (declared mkdir, 0700; never chmod of an existing dir)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.mkdir.path }}", -m, '0700', --, "{{ rb_out.root }}"]
      when: rb_plan.mkroot | bool

    - name: Create the retained dir EXCLUSIVELY (no -p; an existing one fails)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.mkdir.path }}", -m, '0700', --, "{{ rb_out.retained }}"]
      when: rb_plan.mkdir | bool

    - name: Read back the superseded root and the retained dir (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: false
      loop: ["{{ rb_out.root }}", "{{ rb_out.retained }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_mk
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    - name: Refuse retained dirs that are not owned private real directories on the binding's device
      ansible.builtin.assert:
        that:
          - rb_st_mk.results | map(attribute='stat') | rejectattr('exists') | list | length == 0
          - rb_st_mk.results | map(attribute='stat') | selectattr('islnk') | list | length == 0
          - rb_st_mk.results | map(attribute='stat') | rejectattr('isdir') | list | length == 0
          - rb_st_mk.results | map(attribute='stat') | map(attribute='uid') | reject('equalto', rb_uid.stdout | int) | list | length == 0
          - rb_st_mk.results | map(attribute='stat') | map(attribute='mode') | reject('equalto', '0700') | list | length == 0
          - rb_st_mk.results | map(attribute='stat') | map(attribute='dev') | reject('equalto', rb_st_in.results[2].stat.dev) | list | length == 0
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: {{ rb_out.root }} / {{ rb_out.retained }} must be owned 0700 real
          directories on the same device as {{ rb_out.dir }} (a move must be a rename); nothing moved.
        quiet: true
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    # NO-OVERWRITE MOVES (codex-tick370 RUN-BINDING-RETAINED-PATH-COLLISION): `mv -n -T` never replaces an existing
    # destination; its exit status is NOT trusted (coreutils 9.x changed -n exit semantics), so the task never fails on
    # rc and the read-back decides: the source must be gone and the destination must hold exactly the recorded digest.
    # A skipped (no-clobber) move therefore leaves BOTH byte sets in place and refuses CONFLICT before the next step.
    - name: Retain the superseded receipt (declared mv, no-clobber; a rename on the same device)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.mv.path }}", -n, -T, --, "{{ rb_out.receipt }}", "{{ rb_out.kept_receipt }}"]
      register: rb_mv_rcpt
      failed_when: false
      when: rb_plan.mv_receipt | bool

    - name: Read back the receipt move (source and destination; no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ rb_out.receipt }}", "{{ rb_out.kept_receipt }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_mv_rcpt
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    - name: Refuse a receipt move that did not land exactly (source gone; destination == S, owned 0600 regular)
      ansible.builtin.assert:
        that:
          - not rb_st_mv_rcpt.results[0].stat.exists
          - rb_st_mv_rcpt.results[1].stat.exists and rb_st_mv_rcpt.results[1].stat.isreg and not rb_st_mv_rcpt.results[1].stat.islnk
          - rb_st_mv_rcpt.results[1].stat.uid == (rb_uid.stdout | int) and rb_st_mv_rcpt.results[1].stat.mode == '0600'
          - rb_st_mv_rcpt.results[1].stat.checksum == rb_ti.value
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: retaining {{ rb_out.receipt }} (source
          {{ ('present sha256=' ~ ((rb_st_mv_rcpt.results[0].stat.checksum if 'checksum' in rb_st_mv_rcpt.results[0].stat else none) | to_json))
             if rb_st_mv_rcpt.results[0].stat.exists else 'gone' }})
          at {{ rb_out.kept_receipt }} (sha256
          {{ (rb_st_mv_rcpt.results[1].stat.checksum if 'checksum' in rb_st_mv_rcpt.results[1].stat else none) | to_json }}) did not
          yield the superseded receipt (sha256 {{ rb_ti.value if (rb_ti.given | bool) else 'none' }}); mv rc
          {{ (rb_mv_rcpt.rc if 'rc' in rb_mv_rcpt else none) | to_json }} (null = the mv did not run). Nothing
          overwritten, every byte preserved, binding not moved.
        quiet: true
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    - name: Retain the superseded binding (declared mv, no-clobber; a rename on the same device)
      ansible.builtin.command:
        argv: ["{{ rh.controller.bootstrap.os_tools.mv.path }}", -n, -T, --, "{{ rb_out.binding }}", "{{ rb_out.kept_binding }}"]
      register: rb_mv_bind
      failed_when: false
      when: rb_plan.mv_binding | bool

    - name: Read back the binding move (source and destination; no link followed)
      ansible.builtin.stat:
        path: "{{ rb_st_i }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: ["{{ rb_out.binding }}", "{{ rb_out.kept_binding }}"]
      loop_control:
        loop_var: rb_st_i
      register: rb_st_mv_bind
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    # after the move the destination binding path is absent (moved) or already the new render (resume state P4)
    - name: Refuse a binding move that did not land exactly (destination == B_old, owned 0600 regular; source moved)
      ansible.builtin.assert:
        that:
          - rb_st_mv_bind.results[1].stat.exists and rb_st_mv_bind.results[1].stat.isreg and not rb_st_mv_bind.results[1].stat.islnk
          - rb_st_mv_bind.results[1].stat.uid == (rb_uid.stdout | int) and rb_st_mv_bind.results[1].stat.mode == '0600'
          - rb_st_mv_bind.results[1].stat.checksum == rb_plan.old_binding_sha256
          - >-
            (not rb_st_mv_bind.results[0].stat.exists)
            or (not (rb_plan.write_binding | bool) and 'checksum' in rb_st_mv_bind.results[0].stat
                and rb_st_mv_bind.results[0].stat.checksum == rb_sha256)
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: retaining {{ rb_out.binding }} (now
          {{ ('present sha256=' ~ ((rb_st_mv_bind.results[0].stat.checksum if 'checksum' in rb_st_mv_bind.results[0].stat else none) | to_json))
             if rb_st_mv_bind.results[0].stat.exists else 'gone' }})
          at {{ rb_out.kept_binding }} (sha256
          {{ (rb_st_mv_bind.results[1].stat.checksum if 'checksum' in rb_st_mv_bind.results[1].stat else none) | to_json }}) did not
          yield the superseded binding (sha256 {{ rb_plan.old_binding_sha256 }}); mv rc
          {{ (rb_mv_bind.rc if 'rc' in rb_mv_bind else none) | to_json }} (null = the mv did not run). Nothing
          overwritten, every byte preserved, no new binding written.
        quiet: true
      when: rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.transition

    - name: Publish the rendered binding (exact in-memory bytes; 0600; only when absent)
      ansible.builtin.copy:
        dest: "{{ rb_out.binding }}"
        content: "{{ rb_text }}"
        mode: '0600'
        force: false
      when: rb_plan.write_binding | bool

    - name: Read back the binding (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_out.binding }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: rb_st_bound

    - name: Refuse a binding that is not the rendered bytes in owned 0600 custody (before any receipt)
      ansible.builtin.assert:
        that:
          - rb_st_bound.stat.exists and rb_st_bound.stat.isreg and not rb_st_bound.stat.islnk
          - rb_st_bound.stat.uid == (rb_uid.stdout | int) and rb_st_bound.stat.mode == '0600'
          - rb_st_bound.stat.checksum == rb_sha256
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: {{ rb_out.binding }} (sha256
          {{ (rb_st_bound.stat.checksum if 'checksum' in rb_st_bound.stat else none) | to_json }}) is not the rendered binding (sha256 {{ rb_sha256 }}) in an
          owned 0600 regular file; no receipt is written, every byte preserved.
        quiet: true

    - name: Record the binding receipt LAST (0600, only when absent; outside the inventory paths)
      ansible.builtin.copy:
        dest: "{{ rb_out.receipt }}"
        mode: '0600'
        force: false
        content: "{{ rb_in | combine({rh.controller.bootstrap.run_binding.receipt_roles.binding_digest: rb_sha256, rh.controller.bootstrap.run_binding.history.key: rb_plan.transition}) | to_nice_yaml }}"
      when: rb_plan.write_receipt | bool

    - name: Read back the receipt (no link followed)
      ansible.builtin.stat:
        path: "{{ rb_out.receipt }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      register: rb_st_rcpt

    - name: Refuse a receipt that is not the recorded document in owned 0600 custody
      ansible.builtin.assert:
        that:
          - rb_st_rcpt.stat.exists and rb_st_rcpt.stat.isreg and not rb_st_rcpt.stat.islnk
          - rb_st_rcpt.stat.uid == (rb_uid.stdout | int) and rb_st_rcpt.stat.mode == '0600'
          - >-
            rb_st_rcpt.stat.checksum == (rb_obs.r_sha if rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.reuse else
            (rb_in | combine({rh.controller.bootstrap.run_binding.receipt_roles.binding_digest: rb_sha256, rh.controller.bootstrap.run_binding.history.key: rb_plan.transition}) | to_nice_yaml | hash('sha256')))
        fail_msg: >-
          REFUSED RUN-BINDING-RENDER-CONFLICT: {{ rb_out.receipt }} (sha256
          {{ (rb_st_rcpt.stat.checksum if 'checksum' in rb_st_rcpt.stat else none) | to_json }})
          is not the recorded receipt in an owned 0600 regular file; every byte preserved.
        quiet: true

    - name: Report the run binding
      ansible.builtin.debug:
        msg: >-
          RUN-BINDING-{{ 'REUSED' if rb_state == rh.controller.bootstrap.run_binding.lifecycle.states.reuse else 'RENDERED' }} state={{ rb_state }}
          binding={{ rb_out.binding }} sha256={{ rb_sha256 }} receipt={{ rb_out.receipt }}
          receipt_sha256={{ rb_st_rcpt.stat.checksum }} deployment_identity={{ rb_derived.deployment_identity }}
          policy_sha256={{ rh_config_revision }} engine_revision={{ rh_engine_revision }}
          {{ rh.controller.bootstrap.run_binding.history.key }}={{ rb_plan.transition | to_json }}
