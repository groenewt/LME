---
# testing/e2e/guest/guest.yml -- ENTRY: the Debian 13 lab GUEST lifecycle on every host of the declared hypervisor role
# group, RS-owned. FIRST REVIEWABLE PATCH: authored only, never executed. INERT until C1 + route admit the policy
# section (below): with no resolved rh.guest every hypervisor refuses GUEST-DECL-ABSENT before its first guest effect.
#
# TOPOLOGY (codex-tick302): the physical hypervisor (graph) stays a hypervisor + telemetry source; the guest is the
# workload member. The guest's identity and connection are OBSERVATIONS written by this lifecycle into its record
# (tasks/record + verify) and bound into inventory by B -- never hard-coded, never a host-name branch. The record's
# host_key_fingerprints are structured serial-console observations, NOT a known_hosts file and NOT authentication:
# binding the host key the endpoint presents to them before any privileged SSH is B's step.
#
# LIFECYCLE (codex lifecycle review): every mutating mode (provision = claim/reconcile, retire) runs under ONE owned
# lease per storage root (tasks/lease.yml) and re-decides the observed state under it; provision is a staged,
# resumable apply of ONE generation (tasks/provision.yml); a completed retirement is effect-free. Storage ancestry is
# the route's admit_ancestry.yml (pinned below), included at admission and again at every use boundary.
# Cloud-init policy (root/login, key algorithms, filesystem, mount options, identity check) is gd.cloud_init (C1-owned
# leaves, PROPOSED), rendered only through templates/macros/cloud_init.j2.
#
# POLICY AUTHORITY (codex-tick302 (4)): every value read here comes from the EXISTING loader's resolved, validated and
# revision-bound policy `rh` (resolve_policy.yml -> lme_resolved.remote_harness.policy):
#   rh.guest                     lifecycle policy: a section of the remote-harness profile (route-owned; PROPOSED)
#   rh.guest.allocation          per-host allocation, from THAT host's lme_global_override.remote_harness.guest.allocation,
#                                admitted deny-by-default by C1's remote_harness_schema (tunable/extensible/typed; PROPOSED)
#   rh.controller.bootstrap.os_tools[<name>]  every executable, with its declared identity (PROPOSED entries)
# No raw file lookup, no second config authority, no runtime merge: this playbook composes nothing.
#
# ENTRY CONTRACT (codex GUEST-REENTRY-SELF-REFUSAL; option (a), separately bound managed invocations): launched through
# the generated launcher exactly like target_bootstrap.yml and only AFTER that invocation succeeded:
#   1. <bundle>/lme-controller-seed.sh run --root <controller root> --ssh-auth <mode> -- \
#          -i <inventory> testing/remote_harness/target_bootstrap.yml                  (route; unchanged)
#   2. <bundle>/lme-controller-seed.sh run --root <controller root> --ssh-auth <mode> -- \
#          -i <inventory> testing/e2e/guest/guest.yml -e lme_guest_mode=<provision|verify|retire>
# Never imports target_bootstrap.yml: each host is entered by exactly ONE play of this invocation (localhost by the
# controller play; each hypervisor by the guest play -- disjoint by C1's projection), and refuse_pinned_outputs.yml is
# the FIRST task of each (a genuine first entry, refuse_pinned_outputs.yml:18-24), followed by this entry's own
# guest-name guard. Nothing is inherited across invocations except files, which are re-admitted (the target's
# toolchain receipt by verify_toolchain_receipt.yml). No guard is skipped, suppressed or satisfied by fact wiping.
#
# ROUTE FILES INCLUDED: consumer interface revision 10 files (each pinned to the resolved consumer_interface.files
# digest; revision + interface_sha256 pinned as literals) plus three files
# OUTSIDE it (admit_controller.yml, admit_transport.yml, and target_bootstrap.yml whose rh_conn projection is copied
# verbatim below), pinned by sha256 literals here until route publishes them (interface-revision proposal).
- name: Guest lifecycle -- controller side (policy, executor, target connection projection; observe-only)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  vars:
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', 'TMPDIR') or '~/.ansible/tmp' }}"
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; FIRST task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    # GUEST-ENTRY-GUARD: this entry's own derived names (gd gg gp gt g_* _g_*) are outputs, never inputs; an extra-var
    # or inventory value would outrank their set_fact/register. Inline pattern (a task var could itself be outranked).
    - name: Refuse pre-supplied guest-lifecycle outputs (extra-vars / inventory cannot pin them)
      ansible.builtin.assert:
        that:
          - vars.keys() | select('match', '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$') | list | length == 0
        fail_msg: >-
          REFUSED GUEST-DERIVED-OUTPUT-PINNED on {{ inventory_hostname }}:
          {{ vars.keys() | select('match', '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$') | list }} are outputs of
          this entry, never inputs.
        quiet: true

    - name: Refuse route files that are not the ones this entry was written against (pins; before any include)
      ansible.builtin.assert:
        that:
          - (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/tasks/admit_controller.yml', rstrip=false) | hash('sha256'))
            == 'd7b7faa21ab1ebc0a5b46e0ff0e3c0c1115f2582b0e1fdc76bec7730e9f8435e'
        fail_msg: "REFUSED GUEST-ROUTE-PIN: route file admit_controller.yml changed; re-review this entry against it."
        quiet: true

    - name: Bind the effective controller connection before any effect (route; local, localhost, no become)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_controller.yml"

    - name: Resolve the harness policy, verify the controller receipt and bind the managed executor (route)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_harness.yml"

    - name: Refuse a route consumer interface or route file other than the ones this entry binds (pins)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.consumer_interface.revision == 10
          - rh.controller.bootstrap.consumer_interface.interface_sha256 == '09addbb58ff40cb7506a7de8b5020ac1a321582edc9e72680ef3d98a98011471'
          - (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/target_bootstrap.yml', rstrip=false) | hash('sha256'))
            == '4c6cf764a1bcd3c8311756e4a96492917c8b36870934ef47f58be3db00eaef14'
          - (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/tasks/admit_transport.yml', rstrip=false) | hash('sha256'))
            == 'f223f8053ab60364fd4b3aa7caf459c50b867363ffe4e8af7875ec2191c98e4b'
          - rh.controller.bootstrap.inventory.target_group == 'lme_toolchain_targets'
          # NARROW controller-scope binding (target_bootstrap.yml runs scope_classes.yml, which also derives artifact
          # classes this entry does not need); route proposal A5 publishes a controller-scope admission to include
          - lme_resolved.remote_harness.scope | default({}) == dict(kind='controller', id='localhost')
          - lme_resolved.remote_harness.scope_sha256 | default('') is match('^[0-9a-f]{64}$')
          - lme_resolved.remote_harness.scopes.controller.scope_sha256 | default('') == lme_resolved.remote_harness.scope_sha256
          - lookup('ansible.builtin.env', 'TMPDIR') is match('^' ~ (rh_owned_root | regex_escape) ~ '/' ~ rh.controller.bootstrap.layout.run_dir ~ '/[^/]+/tmp$')
          - ansible_remote_tmp == lookup('ansible.builtin.env', 'TMPDIR')
        fail_msg: >-
          REFUSED GUEST-ROUTE-PIN: the resolved consumer interface ({{ rh.controller.bootstrap.consumer_interface.revision | default('?') }}
          {{ rh.controller.bootstrap.consumer_interface.interface_sha256 | default('?') }}) or target_bootstrap.yml /
          admit_transport.yml is not the one this entry binds, or this run is not under `seed run` (TMPDIR).
        quiet: true

    - name: Refuse an included interface file whose bytes are not the resolved interface's declared digest
      ansible.builtin.assert:
        that:
          - item in rh.controller.bootstrap.consumer_interface.files
          - (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/' ~ item, rstrip=false) | hash('sha256'))
            == rh.controller.bootstrap.consumer_interface.files[item]
        fail_msg: "REFUSED GUEST-ROUTE-PIN: testing/remote_harness/{{ item }} is not the resolved consumer interface's file."
        quiet: true
      loop: [tasks/refuse_pinned_outputs.yml, tasks/resolve_policy.yml, tasks/resolve_harness.yml, tasks/initial_contact.yml,
             tasks/verify_toolchain_receipt.yml, tasks/admit_ancestry.yml, tasks/decide_private_group.yml]

    # INTERIM VERBATIM COPY of target_bootstrap.yml:109-119 (pinned above; route proposal: extract it into a shared
    # tasks/project_target_conn.yml in the next consumer interface revision and include it here instead).
    - name: Project each target's effective SSH common args (run mode args + B's admitted ProxyJump form; derived output)
      vars:
        _sa: "{{ rh.controller.bootstrap.ssh_auth }}"
        _mode_args: "{{ (_sa.modes[lookup('ansible.builtin.env', _sa.env_mode)] | default({})).ssh_common_args | default('') }}"
      ansible.builtin.set_fact:
        rh_conn: >-
          {% set ns = namespace(d={}) %}{% for h in groups[rh.controller.bootstrap.inventory.target_group] | default([]) %}{% set raw
          = hostvars[h][_sa.composition.inventory_forms.var] | default('') %}{% set jump = (raw | regex_replace(_sa.composition.proxy_jump.form_regex, '\\1'))
          if raw is match(_sa.composition.proxy_jump.form_regex) else '' %}{% set ns.d = ns.d | combine({h: {'inventory_common_args': raw,
          'proxy_jump': jump, 'ansible_ssh_common_args': _mode_args ~ ((' -o ProxyJump=' ~ jump) if jump | length > 0 else '')}}) %}{% endfor
          %}{{ ns.d }}

    # codex tick331 GUEST-DECLARED-GROUP-DISPATCH: the hypervisor play dispatches from the RESOLVED declared role group
    # (rh.controller.bootstrap.inventory.role_groups.hypervisors), never from a literal group name and never by equality
    # to one. The name, its membership and its disjointness from the controller are admitted HERE, before any contact;
    # a consistently renamed group dispatches unchanged, a host outside it is never entered.
    - name: Refuse a declared hypervisor role group that is not a present, non-empty group of admitted targets (no contact)
      vars:
        _g_hg: "{{ rh.controller.bootstrap.inventory.role_groups.hypervisors | default('') }}"
      ansible.builtin.assert:
        that:
          - _g_hg is string and _g_hg is match('^[A-Za-z_][A-Za-z0-9_]*$')
          - _g_hg not in ['all', 'ungrouped', rh.controller.bootstrap.inventory.target_group]
          - _g_hg in groups
          - groups[_g_hg] | length > 0
          - "'localhost' not in groups[_g_hg]"
          - groups[_g_hg] | reject('in', groups[rh.controller.bootstrap.inventory.target_group] | default([])) | list | length == 0
        fail_msg: >-
          REFUSED GUEST-HYPERVISOR-SCOPE on {{ inventory_hostname }}: the declared hypervisor role group '{{ _g_hg }}'
          (rh.controller.bootstrap.inventory.role_groups.hypervisors) is not a plain group name, is absent or empty, contains
          localhost, or has members that are not {{ rh.controller.bootstrap.inventory.target_group }} targets
          ({{ (groups[_g_hg] | default([])) | reject('in', groups[rh.controller.bootstrap.inventory.target_group] | default([])) | list }}).
          Nothing was contacted.
        quiet: true

    - name: Bind the hypervisor play's host pattern to the declared role group (derived output; read by the next play)
      ansible.builtin.set_fact:
        g_hypervisor_group: "{{ rh.controller.bootstrap.inventory.role_groups.hypervisors }}"

- name: Guest lifecycle -- hypervisor side (declared owner connection profile; no become)
  # ONE hypervisor group (codex decision (4); codex tick331 GUEST-DECLARED-GROUP-DISPATCH): the pattern is the ONE
  # declared role group rh.controller.bootstrap.inventory.role_groups.hypervisors, admitted and bound by the controller
  # play above (g_hypervisor_group); no group literal (C1 contract guest_lifecycle 32d26c0d: the guest section carries
  # no group name). UNVERIFIED: play-level `hosts:` templating from hostvars['localhost'] under ansible-core 2.19; an
  # undefined value fails the play (fail-closed, but untyped) -- never falls back to a literal.
  hosts: "{{ hostvars['localhost'].g_hypervisor_group }}"
  gather_facts: false
  become: false
  any_errors_fatal: true
  # the route's `owner` connection profile, verbatim from target_bootstrap.yml:148-158 (PLAY vars outrank inventory)
  vars:
    ansible_user: "{{ lme_toolchain_owner | default('') }}"
    ansible_ssh_private_key_file: "{{ lme_toolchain_owner_key | default('') }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].rh_conn[inventory_hostname].ansible_ssh_common_args | default('') }}"
    ansible_remote_tmp: >-
      {{ ((lme_toolchain_root | default('') | dirname) ~ '/' ~ rh.controller.bootstrap.work_roots.sub_roots.tmp ~ '/'
          ~ rh.controller.bootstrap.work_roots.remote_tmp_rel)
         if (rh is defined and (lme_toolchain_root | default('')) is match('^/.+/[^/]+$')) else '~/.ansible/tmp' }}
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; FIRST task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied guest-lifecycle outputs (GUEST-ENTRY-GUARD; inline, first entry)
      ansible.builtin.assert:
        that:
          - vars.keys() | select('match', '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$') | list | length == 0
        fail_msg: >-
          REFUSED GUEST-DERIVED-OUTPUT-PINNED on {{ inventory_hostname }}:
          {{ vars.keys() | select('match', '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$') | list }} are outputs of
          this entry, never inputs.
        quiet: true

    - name: Resolve the harness policy (incl. this host's guest allocation) through the engine
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

    - name: Refuse a hypervisor whose resolved policy carries no guest section (inert until C1 + route admit it)
      ansible.builtin.assert:
        that:
          - rh.guest is defined and rh.guest is mapping
          - rh.guest.schema_version | default(none) == 1
          - rh.guest.allocation is defined and rh.guest.allocation is mapping and rh.guest.allocation | length > 0
        fail_msg: >-
          REFUSED GUEST-DECL-ABSENT on {{ inventory_hostname }}: the resolved remote-harness policy has no guest section
          or no allocation for this host (profile section + C1 registry admission pending; allocation is this host's
          lme_global_override.remote_harness.guest.allocation). Nothing was contacted.
        quiet: true

    # The recovery round (codex tick318-321) reads leaves that C1's registered contract guest_lifecycle (32d26c0d) does
    # not carry yet (RS proposal B1.contract_delta_32d26c0d). A section declared exactly per 32d26c0d (dir /
    # broken_prefix lease, no recovery, no wait_s) must refuse HERE, typed, before any contact -- never reach an
    # undefined-value error or a misleading tool refusal later.
    - name: Refuse a guest section without the recovery-round leaves (C1 contract delta pending; no contact yet)
      ansible.builtin.assert:
        that:
          - rh.guest.lease is mapping
          - >-
            ['epoch_prefix', 'released_file', 'kill_after_s', 'holder_file', 'break_var', 'ttl_s', 'step_s', 'margin_s',
             'schema', 'stage_prefix', 'live_dir', 'revoked_prefix', 'lock_wait_s', 'busy_rc', 'holder_fields',
             'released_fields', 'recover_var', 'evidence_prefix'] | reject('in', rh.guest.lease) | list | length == 0
          # codex tick339-340 ownership-proven lease recovery (tasks/lease_recover.yml)
          - "'recovered' in rh.guest.lease.holder_fields"
          - rh.guest.refusals.lease_recovery is defined
          # codex tick331 host-side epoch fence (tasks/lease.yml): the lease layout it reads is lme-guest-lease/3
          - rh.guest.lease.schema == 'lme-guest-lease/3'
          - rh.guest.lease.lock_wait_s is integer and rh.guest.lease.busy_rc is integer
          - rh.guest.layout is mapping and rh.guest.layout.epoch_partial_infix is defined
          - rh.guest.tools.env is defined and rh.guest.tools.flock is defined
          - rh.guest.recovery is defined and rh.guest.recovery is mapping
          - >-
            ['var', 'gone_active_states', 'console_evidence_infix'] | reject('in', rh.guest.recovery) | list | length == 0
          - rh.guest.cloud_init.console_host_keys.wait_s is defined and rh.guest.cloud_init.console_host_keys.wait_s is integer
          - >-
            ['disk_identity', 'recovery', 'decl_invalid', 'host_keys', 'endpoint', 'record_version']
            | reject('in', rh.guest.refusals) | list | length == 0
          - rh.guest.tools.timeout is defined
          # codex tick331 RECORD VERSION: the ONE pin of the record schema this consumer produces and reads. The
          # producer (templates/record.json.j2) writes gd.record.schema and every reader compares with gd.record.schema,
          # so a stale policy naming lme-guest-record/1 must refuse HERE -- it can never make /1 producible or readable.
          - rh.guest.record is mapping and (rh.guest.record.schema | default(none)) == 'lme-guest-record/2'
        fail_msg: >-
          REFUSED GUEST-DECL-INVALID on {{ inventory_hostname }}: the resolved guest section lacks the recovery-round
          leaves (lease epoch_prefix / released_file / kill_after_s and the lme-guest-lease/3 fence leaves stage_prefix /
          live_dir / revoked_prefix / lock_wait_s / busy_rc / holder_fields (incl. recovered) / released_fields /
          recover_var / evidence_prefix, refusals.lease_recovery, layout.epoch_partial_infix,
          recovery.*, cloud_init.console_host_keys.wait_s, refusals disk_identity / recovery / record_version,
          tools.timeout / env / flock) or does not declare record.schema
          lme-guest-record/2 (got {{ rh.guest.record.schema | default('undeclared') }}): C1 contract delta to
          guest_lifecycle 32d26c0d pending (RS proposal B1.contract_delta_32d26c0d). Nothing was contacted.
        quiet: true

    - name: Bind the lifecycle policy and this host's allocation (derived views of rh; guarded above)
      ansible.builtin.set_fact:
        gd: "{{ rh.guest }}"
        gg: "{{ rh.guest.allocation }}"

    - name: Refuse a mode, group or scope outside the policy (no contact yet)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', gd.modes.var, default='') in gd.modes.allowed
          # dispatched from the controller's admitted declared group; this host's resolved declaration must be that group
          - hostvars['localhost'].g_hypervisor_group | default('') | length > 0
          - (rh.controller.bootstrap.inventory.role_groups.hypervisors | default('')) == hostvars['localhost'].g_hypervisor_group
          - inventory_hostname in (groups[rh.controller.bootstrap.inventory.target_group] | default([]))
          - inventory_hostname in (groups[hostvars['localhost'].g_hypervisor_group] | default([]))
          - inventory_hostname != 'localhost'
          - rh.controller.bootstrap.inventory.root_var == 'lme_toolchain_root'
        fail_msg: >-
          REFUSED {{ gd.refusals.scope }} on {{ inventory_hostname }}: {{ gd.modes.var }} must be one of
          {{ gd.modes.allowed }} (got '{{ lookup('ansible.builtin.vars', gd.modes.var, default='') }}') and every
          {{ rh.controller.bootstrap.inventory.role_groups.hypervisors | default('(role_groups.hypervisors undeclared)') }}
          host must be a {{ rh.controller.bootstrap.inventory.target_group }} target.
        quiet: true

    # NARROW form of target_bootstrap.yml:201-240 (RH-SCOPE-BINDING). Route proposal: extract the full check into a
    # shared tasks/admit_target_scope.yml (next interface revision) and include it here instead.
    - name: Refuse a target scope that is not this inventory identity's expected scope (RH-SCOPE-BINDING; no contact)
      ansible.builtin.assert:
        that:
          - lme_resolved.remote_harness.scope | default({}) == dict(kind='target', id=inventory_hostname)
          - hostvars['localhost'].lme_resolved.remote_harness.scopes.targets | default(none) is mapping
          - inventory_hostname in hostvars['localhost'].lme_resolved.remote_harness.scopes.targets
          - lme_resolved.remote_harness.scope_sha256 | default('') is match('^[0-9a-f]{64}$')
          - lme_resolved.remote_harness.scope_sha256 == hostvars['localhost'].lme_resolved.remote_harness.scopes.targets[inventory_hostname].scope_sha256 | default('')
          - lme_resolved.remote_harness.policy_sha256 == hostvars['localhost'].lme_resolved.remote_harness.scopes.targets[inventory_hostname].policy_sha256 | default('')
          - lme_resolved.remote_harness.scopes_sha256 | default('') == hostvars['localhost'].lme_resolved.remote_harness.scopes_sha256 | default('x')
          - lme_resolved.remote_harness.binding | default({}) == hostvars['localhost'].lme_resolved.remote_harness.binding | default(none)
        fail_msg: >-
          REFUSED RH-SCOPE-BINDING on {{ inventory_hostname }}: this host's resolved scope is not the controller's expected
          target scope for this inventory identity. Nothing was contacted.
        quiet: true

    - name: Refuse a target module temp that is not derived from this target's declared work root (work_roots)
      vars:
        _wr: "{{ rh.controller.bootstrap.work_roots }}"
        _troot: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var, default='') }}"
      ansible.builtin.assert:
        that:
          - _troot is string and _troot is match(rh.controller.bootstrap.path_admission.regex)
          - _troot is match('^/.+/[^/]+$')
          - ansible_remote_tmp == (_troot | dirname) ~ '/' ~ _wr.sub_roots.tmp ~ '/' ~ _wr.remote_tmp_rel
          - ((_troot | dirname) ~ '/') is not match('(' ~ (_wr.admission.refused_prefixes | map('regex_escape') | join('|')) ~ ')')
        fail_msg: >-
          REFUSED {{ _wr.admission.refusal }} on {{ inventory_hostname }}: module temp '{{ ansible_remote_tmp }}' is not
          <parent of {{ rh.controller.bootstrap.inventory.root_var }}>/{{ _wr.sub_roots.tmp }}/{{ _wr.remote_tmp_rel }}.
        quiet: true

    - name: Admit transport authentication, owner connection and no-become (route; no contact yet)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_transport.yml"

    - name: INITIAL CONTACT, owner variant (raw only; the route's shared task file) before any module stages
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/initial_contact.yml"
      vars:
        rh_ic_variant: owner

    - name: The target's managed toolchain is the verified bootstrap receipt (route; read-only; invocation 1 happened)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/verify_toolchain_receipt.yml"
      vars:
        rh_tc_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var, default='') }}"
        rh_tc_owner: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.owner_var, default='') }}"

    - name: Admit the allocation and this hypervisor (read-only; every refusal before the first guest effect)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/admit.yml"

    - name: Run the declared mode
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/{{ lookup('ansible.builtin.vars', gd.modes.var) }}.yml"
