---
# testing/e2e/guest/tasks/provision.yml -- create, or RESUME and reconcile, ONE guest generation (lme_guest_mode=provision).
# Included by guest.yml after tasks/admit.yml admitted everything read-only. Every effect happens under the ONE
# lifecycle lease of the storage root (tasks/lease.yml; codex GUEST-LIFECYCLE-SERIALIZATION), which is released on
# every exit this play survives (a typed refusal included) and survives only a real interruption (then: declared
# break, tasks/lease.yml). The stages themselves are tasks/provision_stages.yml (codex GUEST-INTERRUPTED-PROVISION):
# a staged, resumable apply of the generation the record names; an unchanged apply reads back and writes nothing.
# codex tick331: every target mutation carries the host-side epoch fence (tasks/lease.yml g_step_argv); the rescue
# types a fence stop as GUEST-LEASE-LOST and ALWAYS re-raises (never swallowed); a failed MODULE write preserves the
# epoch HELD instead of releasing it (its remote module may still be writing its epoch partial).

- name: PROVISION under the lifecycle lease
  block:
    - name: Acquire the lifecycle lease of this storage root (exclusive; typed refusal when held)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/lease.yml"
      vars:
        _g_lease_op: acquire

    - name: Run the provision stages (claim, disks, seed, start, observe, record) under the lease
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/provision_stages.yml"
  rescue:
    - name: Classify the failure, decide lease preservation and RE-RAISE it (tasks/lease.yml op=failed)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/lease.yml"
      vars:
        _g_lease_op: failed
  always:
    - name: Release the lease only when quiescent and no module write failed (tasks/lease.yml; else PRESERVED-HELD)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/lease.yml"
      vars:
        _g_lease_op: release
        _g_lease_preserve: "{{ g_lease_preserve | default(false) }}"
