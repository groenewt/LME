---
# testing/e2e/guest/tasks/record_admit.yml -- the ONE owner/shape admission of a PARSED lme-guest-record/2 record for
# THIS allocation (codex tick342-346 GUEST-RECOVERY-RECORD-AMBIGUITY: extracted verbatim from provision_stages.yml S2 so
# provision S2 and tasks/lease_recover.yml's record_chain apply the SAME binding, never a parallel check). READ-ONLY and
# DERIVED: it never fails by itself; a record whose values do not even type-check is simply NOT admitted (rescue).
# Input:  _g_ra_rec    the parsed record (any JSON value)
#         _g_ra_states the record states the caller admits (provision: claimed/starting/started; lease_recover.yml:
#                      runs/ candidate claimed/starting/started/retired, preserved/ candidate retired)
# Output: _g_ra_ok     true only when every check below holds (the version check included: schema == gd.record.schema)

- name: RECORD admit -- bind the owner/shape admission (derived; a type error admits nothing)
  block:
    - name: RECORD admit -- evaluate (derived)
      vars:
        _r: "{{ _g_ra_rec }}"
      ansible.builtin.set_fact:
        _g_ra_ok: >-
          {{ _r is mapping
             and (_r.schema | default(none)) == gd.record.schema
             and _r.keys() | list | sort == gd.record.fields | sort
             and _r.state in _g_ra_states
             and _r.run_id == gg.run_id and _r.name == gg.name
             and _r.hypervisor == inventory_hostname and _r.owner_uid == g_owner_uid | int
             and _r.run_dir == gp.run and _r.storage_root == gg.storage_root
             and _r.base == gp.base and _r.base_sha512 == gg.base_image.sha512
             and _r.unit is mapping and _r.unit.name == gp.unit and _r.unit.scope == 'user'
             and _r.endpoint is mapping and _r.endpoint.address == gd.qemu.net.bind and _r.endpoint.port == gg.forward_port
             and _r.allocation is mapping
             and _r.allocation.vcpus == gg.vcpus and _r.allocation.memory_mib == gg.memory_mib
             and _r.allocation.os_disk_gib == gg.os_disk_gib and _r.allocation.data_disk_gib == gg.data_disk_gib
             and _r.disks is mapping and _r.disks.os is mapping and _r.disks.data is mapping
             and _r.disks.os.file == gp.files.os_disk and _r.disks.data.file == gp.files.data_disk
             and _r.uuid is string and _r.uuid is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
             and _r.generation is string and _r.generation is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
             and _r.lease_epoch is integer
             and (_r.disks.os.identity is none) == (_r.disks.data.identity is none)
             and (_r.state == 'claimed' or _r.disks.os.identity is mapping)
             and _r.recoveries is sequence and _r.recoveries is not string and _r.recoveries is not mapping
             and (_r.state in ['started', 'retired'] or _r.recoveries | length == 0)
             and (_r.state != 'started' or _r.unit.invocation_id is not none
                  or (_r.recoveries | length > 0 and _r.recoveries[-1].invocation_id is none))
             and _r.recoveries | map(attribute='invocation_id') | select('none') | list | length <= 1 }}
  rescue:
    - name: RECORD admit -- a record that does not type-check is not admitted (derived)
      ansible.builtin.set_fact:
        _g_ra_ok: false
