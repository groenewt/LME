---
# testing/e2e/reclaim/reclaim.decl.yml -- B-owned DECLARATION of the ONE admission contract for every destructive
# wipe / teardown entrypoint (codex-tick333-lifecycle-prefix-decisions TASK 1, render source (b)). DATA ONLY: read by
# lookup + from_yaml from reclaim.yml (entry guard: rcl / rcl_dir are derived, never inputs). STATUS: AUTHORED, NEVER
# EXECUTED; INERT until the joins at the bottom land (each is named, none is assumed).
#
# WHAT THIS REPLACES (legacy, still in execution until this qualifies; see legacy_quarantine):
#   testing/e2e/deploy_gate.sh do_wipe (:261) / do_teardown (:1562): a HOSTNAME check (refuse_physical_silmaril_wipe,
#   `${HOST%%.*} = silmaril`), a machine-id re-read, then `bash scripts/wipe_lme.sh` -- a BLANKET wipe (podman stop/rm
#   -a, volume/secret rm -a, image prune, rm -rf /opt/lme /etc/lme /root/.config/containers, every lme* unit, tailscale
#   serve). A renamed / aliased / IP-addressed physical host passes the hostname check; the wipe touches resources no
#   run created.
#
# THE CONTRACT (codex (a)-(e)); every clause is enforced by reclaim.yml and named by its refusal code below:
#   (a) GUEST destruction binds the APPROVED RUN RECORD (run_id, generation, uuid, exact disks, the RS record digest)
#       AND the OBSERVED endpoint, host public key and machine id of the target; an identity receipt alone is not
#       proof. Every binding is re-observed IMMEDIATELY before the effect (revalidate). The effect itself is RS's
#       retire (preserve-not-delete, lease-fenced), handed the admission record -- B never deletes a guest disk.
#   (b) NATIVE teardown reconciles ONLY resources named in the target's declared OWNERSHIP LEDGER (service / unit /
#       container / volume / secret / credential / path), each re-observed equal to its ledger entry before its
#       effect. Exact removal of ONE owned native service is a separate scoped op (native_service_remove).
#   (c) A BLANKET wipe of a physical machine is always refused: the op vocabulary has no blanket op, and the legacy
#       blanket path is quarantined (below).
#   (d) Alias, IP, renamed host: the CLASS of a target is decided only by observed machine id + host public key +
#       endpoint against an approved run record / ownership ledger -- never by inventory name, alias, address or
#       group. Group membership (lme_transfer_target's group) selects scope; it is never proof.
#   (e) Foreign resources, pending obligations and recovery evidence are preserved: a ledger entry whose observation
#       differs (foreign), carries an open obligation, or is marked evidence is never an effect target; a ledger with
#       any pending obligation refuses the whole op.
reclaim:
  schema: lme-reclaim-decl/1
  revision: 1
  tasks_dir: tasks

  # ---- entry guard (same shape as transfer.decl.yml entry_guard; the family guard is B's shared one) ----
  entry_guard:
    guard_route_rel: testing/remote_harness/tasks/refuse_pinned_outputs.yml
    guard_include: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"
    family_include: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"
    derived: [rcl_dir, rcl, tr_dir, tr]
    # bare names no registered family covers (rcl, tr, tp): refused by C1's exact reserved_outputs once registered
    # and, independently, by this entry's equality assert (rcl, tr)
    bare_reserved: [rcl, tr, tp]
    family: '^_?rcl_[A-Za-z0-9_]+$'

  # ---- public inputs (namespaces lme_transfer_* / lme_reclaim_*; none matches a reserved family) ----
  inputs:
    op_var: lme_reclaim_op
    nonce_var: lme_reclaim_nonce
    approval_var: lme_reclaim_approval       # absolute path of the APPROVED run record ('' for a native target)
    nonce_regex: '^[0-9A-Za-z._-]{8,64}$'
    reused_transfer_inputs: [lme_transfer_target, lme_transfer_ssh_key, lme_transfer_state_dir, lme_transfer_label,
                             lme_transfer_remote_dir]

  # ---- op vocabulary: deploy_gate stage -> reclaim op; nothing else exists (no blanket op) ----
  # guest / native: what the op does for that class -- ledger_reconcile (owned ledger entries only), ledger_service
  # (the entries of ONE owned service only), retire_handoff (admission record for RS retire; no effect here).
  # absent_ledger: what a ledger path does when no ledger exists -- no_owned_state (reconcile nothing, SAY so: never a
  # clean-host claim) or refuse. A guest is only a guest when the approval binds it, so a FRESH OWNED guest (approval
  # admitted, no ledger yet) is no_owned_state while an UNOWNED host (no approval, no ledger) is decided by the native
  # absent_ledger -- the two are never confused.
  ops:
    wipe:
      stage: pre-install reclaim
      guest: ledger_reconcile
      native: ledger_reconcile
      absent_ledger: {guest: no_owned_state, native: no_owned_state}   # DECISION FOR CODEX (native): a never-installed
                                                                       # host reconciles nothing and says so
    teardown:
      stage: final reclaim
      guest: retire_handoff
      native: ledger_reconcile
      absent_ledger: {guest: no_owned_state, native: refuse}   # a native teardown with no ledger could only be a blanket guess
    native_service_remove:
      stage: exact removal of ONE owned native service (separate scoped op; lme_reclaim_service names it)
      guest: ledger_service
      native: ledger_service
      absent_ledger: {guest: refuse, native: refuse}
  service_var: lme_reclaim_service
  service_regex: '^[a-z][a-z0-9-]{1,62}$'

  # ---- classification (observations only; see contract (d)) ----
  classes:
    guest: an approved run record is supplied AND its machine_id, host_public_keys and endpoint equal the observed ones
    native: no approval supplied; a ledger exists at native.ledger_path whose machine_id equals the observed one
    unowned: no approval and no ledger (or a ledger bound to another machine id)
    physical_hypervisor: the observed machine id equals an approved record's hypervisor_machine_id (a guest's host)

  # ---- APPROVED RUN RECORD (produced by the approval producer -- JOIN-APPROVAL-PRODUCER; controller file) ----
  approval:
    schema: lme-reclaim-approval/1
    location: under lme_transfer_state_dir, a regular file owned by the gate user, mode 0600, not a link
    required_fields: [schema, run_id, generation, uuid, name, hypervisor, hypervisor_machine_id, disks, endpoint,
                      host_public_keys, machine_id, record_schema, record_sha256, approved_by, approved_at, ops]
    field_rules:
      run_id: '^[0-9A-Za-z._-]{6,64}$'
      uuid: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      machine_id: '^[0-9a-f]{32}$'
      hypervisor_machine_id: '^[0-9a-f]{32}$'
      record_sha256: '^[0-9a-f]{64}$'
      record_schema: lme-guest-record/2
      generation: positive integer
      disks: '{os: {file, serial, dev, inode}, data: {file, serial, dev, inode}} -- exact, as the RS record holds them'
      endpoint: '{host, port} -- equal to the contract endpoint this run connected to'
      host_public_keys: '["<type> <base64>", ...] -- equal-set to the RS record host_public_keys'
      ops: subset of [wipe, teardown]
    refuse_expired_after_seconds: 3600

  # ---- NATIVE OWNERSHIP LEDGER (produced by the install leg -- JOIN-NATIVE-LEDGER-PRODUCER; target file) ----
  native:
    ledger_path: /var/lib/lme-owned/ledger.json
    ledger_owner: {uid: 0, gid: 0, mode: '0600'}
    schema: lme-native-ownership/1
    required_fields: [schema, machine_id, generation, created_by_run, resources, pending_obligations]
    resource_kinds:
      # `observe`: EXACTLY the keys of a ledger entry's `observed` and of tasks/observe_item.yml's observation
      unit:       {key: name, name_regex: '^lme[a-z0-9@_.-]*\.(service|timer|socket)$', observe: [FragmentPath, FragmentPath_sha256, Id]}
      container:  {key: id,   id_regex: '^[0-9a-f]{64}$',   observe: [Id, label_lme_owner_run]}
      volume:     {key: name, name_regex: '^lme[a-z0-9_.-]*$', observe: [Name, label_lme_owner_run]}
      secret:     {key: id,   id_regex: '^[0-9a-f]{25}$',   observe: [ID, Spec_Name]}     # names/ids only, never content
      path:       {key: path, path_regex: '^/(opt|etc|var/lib)/lme(/[A-Za-z0-9._-]+)*$', observe: [dev, inode, uid, gid, mode, sha256_if_file]}
    per_resource_fields: [kind, key_value, service, observed, evidence, obligations]
    never_targets: [recovery evidence (evidence true), an entry with open obligations, an entry observed different (foreign)]
    tools: {podman: podman, systemctl: systemctl}   # names in rh.controller.bootstrap.os_tools (PROPOSED entries)

  # ---- stale ownership: re-read and compare IMMEDIATELY before each effect (tasks/revalidate.yml) ----
  # (the approval is a controller file: its sha256 is bound into the admission record, and RS retire re-verifies it
  # under its lease -- JOIN-RS-RETIRE-ADMISSION; B's target-side effects never read it again)
  revalidate: [machine_id, host_public_keys, ledger_sha256, the item's observation]

  # ---- outputs (controller state dir; deploy_gate reads the receipt, whose nonce must equal the one it passed) ----
  outputs:
    admission: 'gate.<label>.reclaim.<op>.admission.json'
    receipt: 'gate.<label>.reclaim.<op>.json'
    receipt_schema: lme-reclaim-receipt/1
    receipt_status: [reconciled, no_owned_state, retire_handoff_admitted]

  refusals:
    op: RECLAIM-OP-UNDECLARED
    input: RECLAIM-INPUT
    pinned: RECLAIM-DERIVED-OUTPUT-PINNED
    approval: RECLAIM-APPROVAL
    identity: RECLAIM-IDENTITY-MISMATCH
    physical: RECLAIM-PHYSICAL-BLANKET-REFUSED
    unowned: RECLAIM-UNOWNED-TARGET
    ledger: RECLAIM-LEDGER
    foreign: RECLAIM-FOREIGN-PRESERVED
    obligation: RECLAIM-PENDING-OBLIGATION
    stale: RECLAIM-STALE-OWNERSHIP
    join: RECLAIM-JOIN-PENDING

  # ---- legacy quarantine PLAN (nothing is deleted or moved by this patch) ----
  legacy_quarantine:
    gate: >-
      only after (1) JOIN-NATIVE-LEDGER-PRODUCER and JOIN-APPROVAL-PRODUCER land, (2) C1 registers controller.bootstrap
      .reclaim + the reclaim_gate shared artifact and route renders lme-gate-reclaim.sh into the bundle, (3) every case
      in controls/CASES.yml has run green on a disposable VM, and (4) codex review.
    steps:
      - deploy_gate.sh sources the rendered bundle member lme-gate-reclaim.sh after verifying its digest against the
        bundle digest (the same custody as the launcher); the fragment defines do_wipe / do_teardown with the same
        names, return codes and cleanup GATE_RESULT vocabulary (cleanup required/applicable/executed, PASS / BLOCKED /
        FAIL), so run_stage is unchanged.
      - the hand-written do_wipe / do_teardown bodies (deploy_gate.sh:261-268, :1562-1569) and
        refuse_physical_silmaril_wipe (:253-259) are REMOVED from deploy_gate.sh execution.
      - scripts/wipe_lme.sh is REMOVED from execution (no caller; not a backend, never wrapped as a YAML scalar).
      - both are preserved with provenance under a quarantine record (path, last sha256, last commit, removal reason
        codex-tick333, the replacement's digest), not deleted from history; the quarantine location is route/MAIN's
        choice (C1 registry), never re-executable by any declared runner.
  joins:
    - {id: JOIN-C1-REGISTRY, owner: C1, what: 'reserved families + bare names, controller.bootstrap.reclaim, reclaim_gate shared artifact (proposal file)'}
    - {id: JOIN-ROUTE-RENDER, owner: route, what: 'package_bundle.yml renders reclaim_gate into the bundle; digest leaf equals_registry'}
    - {id: JOIN-APPROVAL-PRODUCER, owner: RS + MAIN, what: 'writes lme-reclaim-approval/1 from the RS record (lme-guest-record/2) + operator approval'}
    - {id: JOIN-RS-RETIRE-ADMISSION, owner: RS, what: 'guest.yml retire consumes the reclaim admission record and re-verifies run_id/generation/uuid/disks/record_sha256 under its lease'}
    - {id: JOIN-NATIVE-LEDGER-PRODUCER, owner: install leg, what: 'writes lme-native-ownership/1 at each owned creation, before the effect'}
    - {id: JOIN-OS-TOOLS, owner: C1, what: 'os_tools entries podman / systemctl with identity (PROPOSED)'}
    - {id: JOIN-GATE-SEED-PB-ROOT, owner: B + MAIN, what: 'gate_seed_run resolves $_SELF_DIR/transfer/<pb>; the fragment passes ../reclaim/reclaim.yml until it takes a registered entry path'}
    - {id: JOIN-CHECK-WALKER, owner: B, what: 'check.yml walks transfer.yml / resolve_target.yml only; reclaim.yml is not walked yet (coverage gap)'}
