---
# testing/e2e/reclaim/tasks/record.yml -- the nonce-bound receipt deploy_gate requires (localhost, effect: one 0600
# file in the admitted state dir). Reached only when every earlier play passed (any_errors_fatal). The gate fragment
# accepts PASS only for status reconciled / no_owned_state carrying ITS nonce; retire_handoff_admitted is reported
# BLOCKED until RS retire consumes the admission (JOIN-RS-RETIRE-ADMISSION) -- never a false success.
# Inputs: rcl, rcl_plan, tr_state, lme_transfer_label.

- name: Write the receipt
  ansible.builtin.copy:
    dest: "{{ tr_state.dir }}/gate.{{ lme_transfer_label }}.reclaim.{{ rcl_plan.op }}.json"
    content: >-
      {{ {'schema': rcl.outputs.receipt_schema, 'op': rcl_plan.op, 'nonce': rcl_plan.nonce, 'class': rcl_plan.class,
          'status': rcl_plan.status, 'machine_id': rcl_plan.machine_id, 'run': rcl_plan.run,
          'reclaimed': rcl_plan['items'] | map(attribute='key_value') | list,
          'preserved': rcl_plan.preserved | map(attribute='key_value') | list,
          'ledger_sha256': rcl_plan.ledger_sha256, 'approval_sha256': rcl_plan.approval_sha256} | to_json }}
    mode: '0600'
