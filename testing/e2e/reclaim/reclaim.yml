---
# testing/e2e/reclaim/reclaim.yml -- ENTRY: the ONE admission contract for every destructive wipe / teardown
# (codex-tick333 TASK 1; reclaim.decl.yml). B-owned. AUTHORED, NEVER EXECUTED; inert until the declared joins land.
# Started only by the generated gate fragment (templates/lme-gate-reclaim.sh.j2 -> do_wipe / do_teardown) through the
# route's seed launcher, AFTER resolve_target.yml recorded the contract:
#   <launcher> run <root> <ssh auth mode> -i <inventory> testing/e2e/reclaim/reclaim.yml \
#     -e lme_transfer_target=<alias> ... (the five lme_transfer_* inputs) \
#     -e lme_reclaim_op=<wipe|teardown|native_service_remove> -e lme_reclaim_nonce=<n> -e lme_reclaim_approval=<path|''>
# Plays:
#   reclaim-controller (localhost) entry guard, B's ONE contract (bind_controller + the recorded contract), op + inputs,
#                                  the approved run record (guest) -- observe-only
#   reclaim-observe    (target)    entry guard, privileged contact (bind_target), OBSERVED machine id + host public key
#                                  + endpoint, the ownership ledger and each owned resource -- observe-only
#   reclaim-admit      (localhost) classify by observation only, build the exact plan, write the admission record
#   reclaim-effect     (target)    ledger items only: per item, REVALIDATE (stale ownership) then exactly one effect;
#                                  a guest teardown has NO effect here (retire_handoff: RS retire consumes the
#                                  admission record under its own lease -- JOIN-RS-RETIRE-ADMISSION)
#   reclaim-record     (localhost) the receipt (nonce-bound) deploy_gate requires for PASS
# No hostname, alias, address or group decides anything (contract (d)); there is no blanket op (contract (c)).
- name: reclaim-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    - name: Derive the reclaim and transfer declarations and their directories (entry guard; never inputs)
      ansible.builtin.set_fact:
        rcl_dir: "{{ playbook_dir }}"
        rcl: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/reclaim.decl.yml') | from_yaml).reclaim }}"
        tr_dir: "{{ playbook_dir | dirname ~ '/transfer' }}"
        tr: "{{ (lookup('ansible.builtin.file', playbook_dir | dirname ~ '/transfer/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Refuse a pinned declaration or directory (entry guard; an extra var outranks the set_fact above)
      ansible.builtin.assert:
        that:
          - rcl_dir == playbook_dir
          - rcl == (lookup('ansible.builtin.file', playbook_dir ~ '/reclaim.decl.yml') | from_yaml).reclaim
          - tr_dir == playbook_dir | dirname ~ '/transfer'
          - tr == (lookup('ansible.builtin.file', playbook_dir | dirname ~ '/transfer/transfer.decl.yml') | from_yaml).transfer
          - "'tp' not in vars"
          - >-
            'reserved_reclaim_vars' in ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml)
            .lme_config_registry.remote_harness_schema.reserved_output_patterns | default([]))
        fail_msg: >-
          RECLAIM-DERIVED-OUTPUT-PINNED (or RESERVED-FAMILY-REGISTRY: reserved_reclaim_vars not registered yet): one of rcl_dir / rcl / tr_dir / tr / tp was supplied from outside the entry
          (extra-var / inventory); they are derived here from playbook_dir, never inputs.
        quiet: true

    - name: Controller prelude (policy, executor, the ONE privileged contract, state dir) -- B's, reused unchanged
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_controller.yml"

    - name: Reclaim addresses the contract every other stage recorded (resolve_target.yml)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/check_recorded_contract.yml"

    - name: Admit the op, the nonce and (guest) the approved run record
      ansible.builtin.include_tasks: "{{ rcl_dir }}/tasks/admit_controller.yml"

- name: reclaim-observe
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
    ansible_ssh_password: "{{ hostvars['localhost'].tr_conn.ansible_ssh_password }}"
    ansible_private_key: "{{ hostvars['localhost'].tr_conn.ansible_private_key }}"
    ansible_ssh_private_key: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key }}"
    ansible_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_private_key_passphrase }}"
    ansible_ssh_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_passphrase }}"
  tasks:
    - name: Refuse pre-supplied harness outputs (route author; first task on this host)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    - name: Derive the reclaim and transfer declarations and their directories (entry guard; never inputs)
      ansible.builtin.set_fact:
        rcl_dir: "{{ playbook_dir }}"
        rcl: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/reclaim.decl.yml') | from_yaml).reclaim }}"
        tr_dir: "{{ playbook_dir | dirname ~ '/transfer' }}"
        tr: "{{ (lookup('ansible.builtin.file', playbook_dir | dirname ~ '/transfer/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Refuse a pinned declaration or directory (entry guard; an extra var outranks the set_fact above)
      ansible.builtin.assert:
        that:
          - rcl_dir == playbook_dir
          - rcl == (lookup('ansible.builtin.file', playbook_dir ~ '/reclaim.decl.yml') | from_yaml).reclaim
          - tr_dir == playbook_dir | dirname ~ '/transfer'
          - tr == (lookup('ansible.builtin.file', playbook_dir | dirname ~ '/transfer/transfer.decl.yml') | from_yaml).transfer
          - "'tp' not in vars"
          - >-
            'reserved_reclaim_vars' in ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml)
            .lme_config_registry.remote_harness_schema.reserved_output_patterns | default([]))
        fail_msg: >-
          RECLAIM-DERIVED-OUTPUT-PINNED (or RESERVED-FAMILY-REGISTRY: reserved_reclaim_vars not registered yet) on {{ inventory_hostname }}: one of rcl_dir / rcl / tr_dir / tr / tp was
          supplied from outside the entry; they are derived here, never inputs.
        quiet: true

    - name: Target prelude (privileged contact, scope, revision, tools, privilege, machine id) -- B's, reused unchanged
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_target.yml"

    - name: Refuse an endpoint that is not the one every other stage addressed
      ansible.builtin.assert:
        that:
          - tr_target.identity == hostvars['localhost'].tr_recorded.identity
        fail_msg: >-
          {{ rcl.refusals.identity }}: {{ tr.contract.identity_file }} {{ tr_target.identity }} != recorded
          {{ hostvars['localhost'].tr_recorded.identity }}
        quiet: true

    - name: Observe host public key, ownership ledger and every owned resource (observe-only)
      ansible.builtin.include_tasks: "{{ rcl_dir }}/tasks/observe_target.yml"

- name: reclaim-admit
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Classify by observation only, build the exact plan, write the admission record
      ansible.builtin.include_tasks: "{{ rcl_dir }}/tasks/admit_plan.yml"

- name: reclaim-effect
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
    ansible_ssh_password: "{{ hostvars['localhost'].tr_conn.ansible_ssh_password }}"
    ansible_private_key: "{{ hostvars['localhost'].tr_conn.ansible_private_key }}"
    ansible_ssh_private_key: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key }}"
    ansible_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_private_key_passphrase }}"
    ansible_ssh_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_passphrase }}"
  tasks:
    # an earlier play's admission is not carried over: re-admit before this play's first module
    - name: The route's PRIVILEGED INITIAL CONTACT (raw only; first, before any module)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_contact.yml"

    - name: Reconcile each admitted item (revalidate immediately before its one effect)
      when: hostvars['localhost'].rcl_plan['items'] | length > 0
      ansible.builtin.include_tasks: "{{ rcl_dir }}/tasks/reclaim_item.yml"
      # reverse creation order (the ledger is append-only in creation order): children before their directory
      loop: "{{ hostvars['localhost'].rcl_plan['items'] | reverse | list }}"
      loop_control:
        loop_var: rcl_item
        label: "{{ rcl_item.kind }} {{ rcl_item.key_value }}"

- name: reclaim-record
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Write the nonce-bound receipt deploy_gate requires for PASS
      ansible.builtin.include_tasks: "{{ rcl_dir }}/tasks/record.yml"
