---
# testing/e2e/reclaim/controls/CASES.yml -- DECLARED CASES for testing/e2e/reclaim/reclaim.yml (codex-tick333 TASK 1
# negative cases + the fresh-owned-guest distinction). STATUS: DECLARED, NO RUNNER, NOT EVIDENCE: nothing reads this
# file and no case has run. Each needs DISPOSABLE VM targets (never graph, never a physical host, never silmaril),
# MAIN (root) for pre-state, and the joins of reclaim.decl.yml. `unchanged`: paths / resources whose before/after
# observation must be equal -- a refusal changes nothing. <g> is an approved guest, <hv> its (disposable, nested)
# hypervisor stand-in, <n> a native disposable target with a ledger, <a> the approval file.
schema: lme-reclaim-cases/v1
status: declared_unrun
cases:
  - id: R01-alias-of-guest-with-different-endpoint-refused
    contract: (d)
    pre_state: {inventory: 'alias g2 -> same VM as <g> by another name AND address', approval: '<a> for <g>'}
    invocation: 'LME_RECLAIM_APPROVAL=<a> deploy_gate --stage teardown --host g2'
    expect: {rc: fail, out: [RECLAIM-IDENTITY-MISMATCH], gate: 'cleanup BLOCKED'}
    note: the endpoint is part of the binding; the same machine reached another way is re-approved, never inferred
  - id: R02-ip-address-of-physical-host-under-guest-approval-refused
    contract: (c)(d)
    pre_state: {inventory: 'host 10.x.y.z = <hv> address', approval: '<a> for <g> (hypervisor_machine_id = <hv>)'}
    invocation: 'LME_RECLAIM_APPROVAL=<a> deploy_gate --stage teardown --host 10.x.y.z'
    expect: {rc: fail, out: [RECLAIM-PHYSICAL-BLANKET-REFUSED], gate: 'cleanup BLOCKED'}
    unchanged: ['every <hv> unit, container, volume, secret, /opt/lme, /etc/lme']
  - id: R03-renamed-host-without-ledger-refused
    contract: (d)
    pre_state: {inventory: '<n> renamed (new alias, same endpoint)', target: 'ledger removed'}
    invocation: 'deploy_gate --stage teardown --host <new alias>'
    expect: {rc: fail, out: [RECLAIM-UNOWNED-TARGET], gate: 'cleanup BLOCKED'}
  - id: R04-physical-host-teardown-without-ledger-refused
    contract: (c)
    pre_state: {target: '<hv> (no ledger, no approval); LME containers present'}
    invocation: 'deploy_gate --stage teardown --host <hv>'
    expect: {rc: fail, out: [RECLAIM-UNOWNED-TARGET, 'A blanket wipe is never performed'], gate: 'cleanup BLOCKED'}
    unchanged: ['every container, volume, secret, unit and path on <hv>']
  - id: R05-foreign-resource-in-scope-refused-and-preserved
    contract: (e)
    pre_state: {target: '<n> ledger names container C; C was replaced by another container of the same name (new id / label)'}
    invocation: 'deploy_gate --stage teardown --host <n>'
    expect: {rc: fail, out: [RECLAIM-FOREIGN-PRESERVED], gate: 'cleanup BLOCKED'}
    unchanged: ['every ledger resource', 'the replacement container']
  - id: R06-stale-ownership-between-admission-and-effect-refused
    contract: (a)(b) stale
    pre_state: {target: '<n> ledger with items U1 (unit), P1 (path)'}
    injection: 'after reclaim-admit wrote the admission record and before reclaim-effect revalidates P1, P1 is rewritten (new sha256)'
    expect: {rc: fail, out: [RECLAIM-STALE-OWNERSHIP, P1], gate: 'cleanup BLOCKED'}
    unchanged: [P1, 'every item after P1 in reverse creation order']
  - id: R07-stale-ledger-digest-refused
    contract: stale
    injection: 'the ledger file is rewritten between admission and the first effect'
    expect: {rc: fail, out: [RECLAIM-STALE-OWNERSHIP], gate: 'cleanup BLOCKED'}
  - id: R08-pending-obligation-preserved-whole
    contract: (e)
    pre_state: {target: '<n> ledger pending_obligations: [evidence-upload]'}
    expect: {rc: fail, out: [RECLAIM-PENDING-OBLIGATION], gate: 'cleanup BLOCKED'}
    unchanged: ['every ledger resource']
  - id: R09-recovery-evidence-entry-never-an-effect
    contract: (e)
    pre_state: {target: '<n> ledger: P2 evidence true, P3 owned'}
    expect: {rc: 0, receipt: {status: reconciled, reclaimed: [P3], preserved: [P2]}, gate: 'cleanup PASS'}
    unchanged: [P2]
  - id: R10-fresh-owned-guest-empty-set-no-owned-state
    contract: distinction
    pre_state: {target: '<g> freshly provisioned; no ledger yet', approval: '<a> for <g> with ops [wipe]'}
    invocation: 'LME_RECLAIM_APPROVAL=<a> deploy_gate --stage wipe --host <g>'
    expect: {rc: 0, receipt: {class: guest, status: no_owned_state, reclaimed: []}, gate: 'cleanup PASS'}
  - id: R11-unowned-host-teardown-distinct-from-fresh-guest
    contract: distinction
    pre_state: {target: '<n2> never installed; no ledger; no approval'}
    invocation: 'deploy_gate --stage teardown --host <n2>'
    expect: {rc: fail, out: [RECLAIM-UNOWNED-TARGET], gate: 'cleanup BLOCKED'}
  - id: R12-guest-teardown-hands-off-to-rs-retire
    contract: (a)
    pre_state: {approval: '<a> for <g> with ops [teardown]'}
    expect: {rc: 0, receipt: {class: guest, status: retire_handoff_admitted}, gate: 'cleanup BLOCKED RECLAIM-JOIN-PENDING', admission: 'run_id/generation/uuid/disks/record_sha256 bound'}
    note: no guest disk is touched by B; PASS only after JOIN-RS-RETIRE-ADMISSION
  - id: R13-forged-reserved-family-refused-before-contact
    contract: prefix families
    invocation: '-e rcl_plan={...}  (separately: -e _rcl_x=1, -e tr_conn={...})'
    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED], contacted: false}
  - id: R14-forged-bare-rcl-refused
    contract: bare names
    invocation: '-e rcl={...}'
    expect: {rc: fail, out: [DERIVED-OUTPUT-PINNED], contacted: false}
  - id: R15-expired-or-foreign-op-approval-refused
    contract: (a)
    pre_state: {approval: '<a> approved_at older than refuse_expired_after_seconds, or ops lacks the requested op'}
    expect: {rc: fail, out: [RECLAIM-APPROVAL], contacted: false}
  - id: R16-render-input-not-admitted-fails-closed
    contract: render
    pre_state: {render: 'controller.bootstrap.reclaim with a stage word containing a space or quote'}
    expect: {fragment: 'do_wipe / do_teardown emit cleanup BLOCKED RECLAIM-RENDER-INPUT, rc 2, no launcher start'}
