---
# testing/e2e/transfer/controls/load_paths.yml -- SOURCE-REF load binding, check B: the roots a PHASE row actually
# loads, asserted at runtime by realpath after the route's refuse_pinned_outputs.yml + resolve_policy.yml and before
# any B step. Included by phase_driver.yml (harness only; never by the entry playbooks).
# Inputs: drv_candidate_root (the admitted source = the runner), drv_clone_dirs (the verified clones of its commit),
#         lp_write (true in the controller play: write drv_load_paths_out for the verdict), and the loaded values
#         rh_repo_root, transfer_dir, tr_dir, playbook_dir, lme_manifests_dir, tr_repo_root, lme_transfer_src;
#         and rh (the RESOLVED policy, already loaded by the including play): rh.controller.bootstrap.work_roots.root_rel
#         (e.g. .work) names <source>/<root_rel>/, the run's git-ignored scratch INCLUDING the verified clones, so
#         "inside the source" excludes it -- a loaded root under it (a clone's or a copy's testing/e2e/transfer) is NOT
#         candidate bytes and is refused.
# Refusal: CONTROLS-SOURCE-LOAD-PATH. Covered by path only (not content-scanned): the route task files and the
# engine role (ansible/roles/podman, incl. filter_plugins/lme_manifests.py) -- they must resolve inside the source.

- name: LOAD-PATHS -- the resolved run-scratch prefix
  ansible.builtin.set_fact:
    _lp_wrel: "{{ rh.controller.bootstrap.work_roots.root_rel | default('') }}"

- name: LOAD-PATHS -- the resolved run-scratch prefix is well-formed (CONTROLS-SOURCE-LOAD-PATH)
  ansible.builtin.assert:
    that:
      - _lp_wrel is string and _lp_wrel | length > 0
      - not _lp_wrel.startswith('/') and _lp_wrel == (_lp_wrel | normpath) and not _lp_wrel.startswith('..')
    fail_msg: "CONTROLS-SOURCE-LOAD-PATH: rh.controller.bootstrap.work_roots.root_rel '{{ _lp_wrel }}' is not a relative normalized path"
    quiet: true

- name: LOAD-PATHS -- the loaded roots
  ansible.builtin.set_fact:
    _lp_c: "{{ drv_candidate_root | realpath }}"
    _lp_x: "{{ (drv_candidate_root | realpath) ~ '/' ~ _lp_wrel ~ '/' }}"
    _lp:
      rh_repo_root: "{{ rh_repo_root | default('') | realpath }}"
      transfer_dir: "{{ transfer_dir | realpath }}"
      tr_dir: "{{ tr_dir | realpath }}"
      playbook_dir: "{{ playbook_dir | realpath }}"
      lme_manifests_dir: "{{ lme_manifests_dir | default('') | realpath }}"
      engine_role: "{{ (rh_repo_root | default('') ~ '/ansible/roles/podman') | realpath }}"
      tr_repo_root: "{{ tr_repo_root | default('') | realpath }}"
      lme_transfer_src: "{{ lme_transfer_src | default('') | realpath }}"

- name: LOAD-PATHS -- every project root is the source; the shipped source is a verified clone (CONTROLS-SOURCE-LOAD-PATH)
  ansible.builtin.assert:
    that:
      - drv_candidate_root is defined and drv_candidate_root is string and drv_candidate_root.startswith('/')
      - drv_clone_dirs is defined and drv_clone_dirs | length > 0
      - _lp.rh_repo_root == _lp_c
      - (_lp.transfer_dir ~ '/').startswith(_lp_c ~ '/') and not (_lp.transfer_dir ~ '/').startswith(_lp_x)
      - (_lp.tr_dir ~ '/').startswith(_lp_c ~ '/') and not (_lp.tr_dir ~ '/').startswith(_lp_x)
      - (_lp.playbook_dir ~ '/').startswith(_lp_c ~ '/') and not (_lp.playbook_dir ~ '/').startswith(_lp_x)
      - lme_manifests_dir is defined and (_lp.lme_manifests_dir ~ '/').startswith(_lp_c ~ '/')
      - not (_lp.lme_manifests_dir ~ '/').startswith(_lp_x)
      - _lp.engine_role is directory and (_lp.engine_role ~ '/').startswith(_lp_c ~ '/')
      - not (_lp.engine_role ~ '/').startswith(_lp_x)
      - _lp.tr_repo_root in (drv_clone_dirs | map('realpath') | list)
      - _lp.lme_transfer_src in (drv_clone_dirs | map('realpath') | list)
    fail_msg: >-
      CONTROLS-SOURCE-LOAD-PATH: a phase row loads from outside the admitted source {{ _lp_c }} (or from its run
      scratch {{ _lp_x }}) or ships other than a verified clone {{ drv_clone_dirs | default([]) }}: {{ _lp | to_json }}
    quiet: true

- name: LOAD-PATHS -- record them for the verdict
  ansible.builtin.copy:
    content: >
      {{ _lp | combine({'candidate_root': _lp_c, 'excluded_prefix': _lp_x,
                        'clone_dirs': drv_clone_dirs | map('realpath') | list}) | to_nice_json }}

    dest: "{{ drv_load_paths_out }}"
    mode: '0644'
  when: lp_write | default(false) | bool
