---
# testing/e2e/transfer/controls/inner_failure_custody.yml -- NEW (r5u-rf4; codex-tick526 RF3-INNER-FAILURE-CUSTODY).
# The ONE rule that derives a case's OUTER failures from its INNER (raw) failures. Pure: one set_fact, no I/O.
# AUTHORED, NEVER EXECUTED (controls UNRUN).
# Used by run_one_case.yml (every runnable case, before its rc / output expectations) and by run_controls.yml's
# custody self-test over the declared fixtures CASES harness.inner_failure.controls (so the controls exercise this file).
# Inputs (no defaults):
#   ifc_failures  the raw inner failure strings (in recorded order)
#   ifc_reasons   the identities of the declared inner failures recorded (harness.inner_failure.reasons values; each a
#                 key of ifc_texts whose text was appended to ifc_failures when recorded)
#   ifc_expected  none (an ordinary case: the outer failures ARE the inner ones, unchanged) or the declared expected
#                 identities of a negative control (expect.harness_failures), with their occurrence counts
#   ifc_texts     the declared texts mapping (CASES harness.texts; a self-test fixture may add alias keys to it)
#   ifc_record    (self-test only) the fixture id; when given, {id, outer} is appended to _ifc_results
# Output: _ifc_outer, the outer failure list:
#   (1) every identity of expected + observed whose expected count != observed count -> the declared diagnostic
#       texts.inner_failure_mismatch + [identity, expected count, observed count]
#   (2) every expected identity whose declared text is not unique among ifc_texts values (a same-text alias: one raw
#       observation could stand for two identities) -> texts.inner_failure_alias + [identity, the alias keys]
#   (3) the raw inner failures, minus exactly min(expected, observed) occurrences of each NON-ambiguous matched
#       identity's text -- so unmatched, extra (repeated) and unrelated failures all stay
# Outer success therefore needs: every expected identity observed exactly as often as declared, no alias, and no other
# inner failure. The inner verdict itself is never rewritten (run_one_case.yml keeps it in _inner).

- name: "INNER-FAILURE-CUSTODY -- derive the outer failures (identities and counts exact; aliases refused; nothing else consumed)"
  ansible.builtin.set_fact:
    _ifc_outer: >-
      {%- if ifc_expected is none -%}
      {{ ifc_failures }}
      {%- else -%}
      {%- set ns = namespace(o=[], ids=[], consume=[]) -%}
      {%- for k in ifc_expected + ifc_reasons if k not in ns.ids -%}{%- set ns.ids = ns.ids + [k] -%}{%- endfor -%}
      {%- for k in ns.ids -%}
      {%- set e = ifc_expected | select('equalto', k) | list | length -%}
      {%- set o = ifc_reasons | select('equalto', k) | list | length -%}
      {%- set al = namespace(keys=[]) -%}
      {%- for tk, tv in ifc_texts.items() if (k in ifc_texts) and tv == ifc_texts[k] -%}{%- set al.keys = al.keys + [tk] -%}{%- endfor -%}
      {%- if e != o -%}
      {%- set ns.o = ns.o + [ifc_texts.inner_failure_mismatch ~ ' ' ~ ([k, e, o] | to_json)] -%}
      {%- endif -%}
      {%- if (k not in ifc_texts) or (al.keys | length) != 1 -%}
      {%- if e > 0 -%}{%- set ns.o = ns.o + [ifc_texts.inner_failure_alias ~ ' ' ~ ([k, al.keys] | to_json)] -%}{%- endif -%}
      {%- else -%}
      {%- for i in range([e, o] | min) -%}{%- set ns.consume = ns.consume + [ifc_texts[k]] -%}{%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set seen = namespace(t=[]) -%}
      {%- for f in ifc_failures if f not in seen.t -%}
      {%- set seen.t = seen.t + [f] -%}
      {%- set keep = (ifc_failures | select('equalto', f) | list | length) - (ns.consume | select('equalto', f) | list | length) -%}
      {%- for i in range(keep) -%}{%- set ns.o = ns.o + [f] -%}{%- endfor -%}
      {%- endfor -%}
      {{ ns.o }}
      {%- endif -%}

- name: "INNER-FAILURE-CUSTODY -- record a self-test result (run_controls.yml custody self-test only)"
  ansible.builtin.set_fact:
    _ifc_results: "{{ _ifc_results + [{'id': ifc_record, 'outer': _ifc_outer}] }}"
  when: ifc_record is defined
