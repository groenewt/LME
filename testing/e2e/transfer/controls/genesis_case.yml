---
# testing/e2e/transfer/controls/genesis_case.yml -- run ONE case of a genesis kind (CASES harness.genesis.kinds) and set
# _run / _fail / _gstage / _gx for run_one_case.yml's verdict writer. brr-follow-s2 PJ-CONTROLS / U-12 (codex-tick546
# settled_join_continuity; OD-BRR-12; genesis controls-04 a42e5265 + controls-04b 5037978a, FROZEN; codex-tick556 /
# Codex557 / codex-tick560 joins). Only genesis_entry is runnable (harness.kinds); genesis_stage / genesis_render rows
# are declared_unrun and never reach this file (run_one_case's `_k_unrun` gate).
#
# CASE SHAPE (admitted here before anything is executed; every key and vocabulary is CASES harness.genesis):
#   host: <host_conditions member>          neighbour: <case id> (optional; binds neighbour_run on the SAME host)
#   generation: {stage, isolation: <variant_isolation value>, concurrent: 1 | 2, variants: [<variant>, ...]}
#     variant (variant_keys): fixture (REQUIRED, a fixtures id), inputs {name: value} (operator inputs; each declared in
#       genesis.launch.operator_inputs and a member of its projected domain _wrp.operator_inputs[name].values; a subset is
#       allowed), entry_args [word, ...] (VERBATIM after the declared arguments, never admitted here, only on a case
#       whose EVERY admitted outcome is a refusal), worktree_edit {rel, append}, inventory {mode, content},
#       declaration_digest <declaration_digest_classes value> (codex-tick563 GEN3-27; non-baseline fixtures only): WHICH
#       committed declaration the binding's reviewed declaration_sha256 must be -- admitted = the parent (admitted)
#       commit's declaration AND not the fixture commit's (case (a): new ED, previous good DS); fixture = the fixture
#       commit's own declaration (case (b): new ED with its matching DS). Read back on the host before any row runs; a
#       mismatch fails the baseline (texts.genesis_baseline) -- the runner never supplies or repairs the digest
#   expect: {variants: [<expectation>, ...]}  (exactly one per variant)
#     expectation: outcomes [<outcome>, ...] (concurrent 1: alternatives for the one process) | pairs [[<o>, <o>], ...]
#       (concurrent 2: symmetric (A, B) alternatives, codex-tick556); out / out_absent (every process output);
#       out_success (every rc-0 process); store {<store_evidence.keys key>: value}; inner {stage, exit_status}
#       (concurrent 1 only; codex-tick560 GEN3-28 OUTER STATUS: the stage step record's exit_status, asserted SEPARATELY
#       from the outer entry status; {legs: {<ansible_legs member>: int}} = exact per Ansible leg (the binding record's
#       ansible_leg selects; a leg without a status -> STATUS-UNDECLARED; codex-tick563 / codex-tick564), {pending: <open
#       decision>} = declared pending -> STATUS-UNDECLARED)
#     outcome: {ok: true} | {entry_refusal: <genesis.entry codes/statuses role>} | {refusal: <controller.bootstrap.refusals key>}
#              | {pending: <open decision id>} (declared pending a Codex ruling: STATUS-UNDECLARED, never creditable)
# Statuses are READ from the declarations; an expected code without a declared status refuses
# CONTROLS-GENESIS-STATUS-UNDECLARED before anything runs (no catch-all rc 1, no arbitrary nonzero, no fallback; Codex557).
# The verdict's top-level rc stays -1 (the reset value: a genesis case is not ONE process); the per-variant rcs are in
# the verdict's `variants` (_gx), and `out` is every captured output.
#
# ISOLATION (Codex557 GEN3-CASE-FIXTURE-ISOLATION = genesis PJ-CONTROLS-ROW-ISOLATION): with isolation `isolated` every
# variant runs on its OWN bound checkout (pairwise distinct paths) on the ONE common admitted parent (successor-06
# S2-ISOLATED-FIXTURE-COMMIT: a baseline-fixture run AT the admitted commit; any other fixture run at its OWN fixture
# commit whose only parent is the admitted commit, one commit per fixture); before ANY row mutation each run reads back
# on its host that HEAD == its bound commit, `git status --porcelain` is EMPTY and (non-baseline) the commit's parent
# line, else NO row of the case is run (texts.genesis_baseline). A case with a worktree_edit must be isolated. No reset
# of a shared checkout.
#
# HOST BINDING (SC-S2-HOST): one record per run `<case id><separator><variant index>` in the JSON file named by the extra
# var harness.genesis.host_binding.var. Until MAIN's QEMU leg produces it every case refuses CONTROLS-GENESIS-HOST-UNBOUND
# at pre_launch (typed; never creditable). Execution is ansible.builtin.raw on add_host'ed hosts (no module, no Python
# required on the fresh_base host). NOTHING here was executed (brr-follow-s2: authored only, UNRUN).

- name: "{{ case.id }} -- genesis: name the declarations this case reads (resolved bootstrap and CASES only)"
  ansible.builtin.set_fact:
    _ge: "{{ _wrp.bootstrap.genesis.entry }}"
    _gl: "{{ _wrp.bootstrap.genesis.launch }}"
    _gh: "{{ C.harness.genesis }}"
    _gsep: "{{ _wrp.bootstrap.path_admission.separator }}"
    _gstage: "{{ C.harness.generation.verdict_stage.pre_launch }}"
    _gpre: false
    _gargs: []                                     # set by the argv composition; empty keeps every run loop empty when it is skipped

- name: "{{ case.id }} -- genesis: pre-launch admission (shape, outcomes, inputs, statuses, host binding)"
  block:
    - name: Refuse a malformed genesis case (shape first; CONTROLS-GENESIS-INPUT)
      vars:
        _g: "{{ _xc.generation }}"
        _v: "{{ _xc.generation.variants }}"
        _e: "{{ _xc.expect.variants }}"
        _olist: >-
          {{ (_e | selectattr('outcomes', 'defined') | map(attribute='outcomes') | flatten(levels=1) | list)
             + (_e | selectattr('pairs', 'defined') | map(attribute='pairs') | flatten(levels=2) | list) }}
      ansible.builtin.assert:
        that:
          - _xc.host is string and _xc.host in _gh.host_conditions
          - _g is mapping and _g.stage is string and _g.stage in _ge.stages
          - _g.isolation is string and _g.isolation in (_gh.variant_isolation.values() | list)
          - _g.concurrent in [1, 2]
          - _v is sequence and _v is not string and _v | length > 0
          - _v | reject('mapping') | list | length == 0
          - _v | map('list') | flatten(levels=1) | reject('in', _gh.variant_keys) | list | length == 0
          - _v | rejectattr('fixture', 'defined') | list | length == 0
          - _v | map(attribute='fixture') | reject('in', _gh.fixtures.keys() | list) | list | length == 0
          - _xc.expect is mapping and _e is sequence and _e is not string and _e | reject('mapping') | list | length == 0
          - (_e | length) == (_v | length)
          - (_g.concurrent == 1 and (_e | rejectattr('outcomes', 'defined') | list | length == 0)) or (_g.concurrent == 2 and (_e | rejectattr('pairs', 'defined') | list | length == 0))
          - (_g.concurrent == 1) or (_v | length == 1)
          - _e | selectattr('pairs', 'defined') | map(attribute='pairs') | flatten(levels=1) | map('length') | reject('equalto', 2) | list | length == 0
          - _olist | reject('mapping') | list | length == 0
          - _olist | map('length') | reject('equalto', 1) | list | length == 0
          - _olist | map('list') | flatten(levels=1) | reject('in', _gh.outcomes.values() | list) | list | length == 0
          - (_v | selectattr('entry_args', 'defined') | list | length == 0) or (_olist | selectattr(_gh.outcomes.ok, 'defined') | list | length == 0)
          - _v | selectattr('entry_args', 'defined') | map(attribute='entry_args') | select('string') | list | length == 0
          - _v | selectattr('entry_args', 'defined') | map(attribute='entry_args') | flatten(levels=1) | reject('string') | list | length == 0
          - _v | selectattr('inputs', 'defined') | map(attribute='inputs') | reject('mapping') | list | length == 0
          - _v | selectattr('worktree_edit', 'defined') | map(attribute='worktree_edit') | map('list') | map('sort') | reject('equalto', ['append', 'rel']) | list | length == 0
          - _v | selectattr('inventory', 'defined') | map(attribute='inventory') | map('list') | map('sort') | reject('equalto', ['content', 'mode']) | list | length == 0
          - _v | selectattr('inventory_absent', 'defined') | map(attribute='inventory_absent') | reject('sameas', true) | list | length == 0
          - _v | selectattr('inventory_absent', 'defined') | selectattr('inventory', 'defined') | list | length == 0
          - _v | selectattr('declaration_digest', 'defined') | map(attribute='declaration_digest') | reject('in', _gh.declaration_digest_classes.values() | list) | list | length == 0
          - _v | selectattr('declaration_digest', 'defined') | selectattr('fixture', 'equalto', _gh.baseline_fixture) | list | length == 0
          - _e | selectattr('home_absent', 'defined') | map(attribute='home_absent') | select('string') | list | length == 0
          - _e | selectattr('home_absent', 'defined') | map(attribute='home_absent') | flatten(levels=1) | reject('string') | list | length == 0
          # the four-key rel_path_grammar (F05-S4 groups-summary 36865155): terminator, pattern fullmatch, refused components
          - _e | selectattr('home_absent', 'defined') | map(attribute='home_absent') | flatten(levels=1) | select('search', _wrp.bootstrap.source_admission.rel_path_grammar.terminator | regex_escape) | list | length == 0
          - _e | selectattr('home_absent', 'defined') | map(attribute='home_absent') | flatten(levels=1) | reject('match', '(?:' ~ _wrp.bootstrap.source_admission.rel_path_grammar.pattern ~ ')\Z') | list | length == 0
          - _e | selectattr('home_absent', 'defined') | map(attribute='home_absent') | flatten(levels=1) | map('split', _wrp.bootstrap.source_admission.rel_path_grammar.separator) | map('intersect', _wrp.bootstrap.source_admission.rel_path_grammar.refused_components) | reject('equalto', []) | list | length == 0
          - (_v | selectattr('worktree_edit', 'defined') | list | length == 0) or (_g.isolation == _gh.variant_isolation.isolated)
          - _e | selectattr('store', 'defined') | map(attribute='store') | map('list') | flatten(levels=1) | reject('in', _gh.store_evidence['keys'].keys() | list) | list | length == 0
          # successor-06 S2-STORE-READBACK-FALSE-PASS: an expected frame is a declared frames value; a frame other than
          # ok is the expectation's ONLY store key; a store_fault is a declared store_faults key on a variant whose
          # expectation declares a frame; published_covers_declared needs the projected declaration-derived row set
          - _e | selectattr('store', 'defined') | map(attribute='store') | selectattr('frame', 'defined') | map(attribute='frame') | reject('in', _gh.store_evidence.frames.values() | list) | list | length == 0
          - _e | selectattr('store', 'defined') | map(attribute='store') | selectattr('frame', 'defined') | rejectattr('frame', 'equalto', _gh.store_evidence.frames.ok) | map('length') | reject('equalto', 1) | list | length == 0
          - _v | selectattr('store_fault', 'defined') | map(attribute='store_fault') | reject('in', _gh.store_faults.keys() | list) | list | length == 0
          - >-
            _v | zip(_e) | selectattr('0.store_fault', 'defined') | map('last')
            | rejectattr('store', 'defined') | list | length == 0
          - >-
            _v | zip(_e) | selectattr('0.store_fault', 'defined') | map('last') | selectattr('store', 'defined')
            | map(attribute='store') | rejectattr('frame', 'defined') | list | length == 0
          - >-
            (_e | selectattr('store', 'defined') | map(attribute='store') | selectattr('published_covers_declared', 'defined') | list | length == 0)
            or (_wrp.genesis_store_files is defined and _wrp.genesis_store_files is sequence and _wrp.genesis_store_files | length > 0)
          - (_g.concurrent == 1) or (_e | selectattr('inner', 'defined') | list | length == 0)
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map('list') | map('sort') | reject('equalto', _gh.inner_keys | sort) | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='stage') | reject('in', _ge.stages) | list | length == 0
          # codex-tick563 / codex-tick564: the inner status is declared PER ANSIBLE LEG ({legs: {<ansible_legs member>: int}})
          # or {pending: <id>}; no leg-independent int, so no leg inherits another's credit
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | reject('mapping') | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | map('list') | reject('in', [[_gh.inner_forms.legs], [_gh.outcomes.pending]]) | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | selectattr(_gh.inner_forms.legs, 'defined') | map(attribute=_gh.inner_forms.legs) | reject('mapping') | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | selectattr(_gh.inner_forms.legs, 'defined') | map(attribute=_gh.inner_forms.legs) | map('length') | select('equalto', 0) | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | selectattr(_gh.inner_forms.legs, 'defined') | map(attribute=_gh.inner_forms.legs) | map('list') | flatten(levels=1) | reject('in', _gh.ansible_legs) | list | length == 0
          - _e | selectattr('inner', 'defined') | map(attribute='inner') | map(attribute='exit_status') | selectattr(_gh.inner_forms.legs, 'defined') | map(attribute=_gh.inner_forms.legs) | map('dict2items') | flatten(levels=1) | map(attribute='value') | reject('integer') | list | length == 0
          - (case.neighbour is not defined) or (case.neighbour is string)
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_input,
                                   'rh_rf_detail': [C.harness.texts.genesis_input, case.id]}) | trim }}
        quiet: true

    - name: Refuse an operator input not declared or outside its projected domain (the generation kind's producer rule)
      vars:
        _bad: >-
          {%- set ns = namespace(b=[]) -%}
          {%- for v in _xc.generation.variants -%}
          {%- set i = loop.index0 -%}
          {%- for n, val in (v.inputs if (v.inputs is defined) else {}) | dictsort(case_sensitive=true) -%}
          {%- if _wrp.operator_inputs is not defined or n not in _wrp.operator_inputs or val is not string
                 or val not in _wrp.operator_inputs[n]['values'] -%}{%- set ns.b = ns.b + [i] -%}{%- endif -%}
          {%- endfor -%}
          {%- endfor -%}{{ ns.b | unique | list }}
      ansible.builtin.assert:
        that: [_bad | length == 0]
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_input,
                                   'rh_rf_detail': [C.harness.texts.genesis_input, case.id, _bad | to_json]}) | trim }}
        quiet: true

    # every expected outcome resolves to its DECLARED (rc, refusal prefix) here, before anything runs: entry_refusal roles
    # through the ONE role map genesis.entry.codes / statuses; refusal codes through controller.bootstrap.refusals. A
    # code or role without a declared status (e.g. an RH-SOURCE-* code before the F05 rh-source-status group 40..57 is in
    # the composed source) is collected.
    # admitted[i] = the alternatives of variant i; an alternative = the per-process list of {rc, prefix}.
    - name: Resolve every expected outcome to its declared (rc, refusal prefix)
      vars:
        _o: "{{ _gh.outcomes }}"
      ansible.builtin.set_fact:
        _gres: >-
          {%- set ns = namespace(r=[], undeclared=[]) -%}
          {%- for e in _xc.expect.variants -%}
          {%- set groups = ((e.outcomes | batch(1) | list) if (e.outcomes is defined) else e.pairs) -%}
          {%- set conv = namespace(v=[]) -%}
          {%- for group in groups -%}
          {%- set g2 = namespace(v=[]) -%}
          {%- for o in group -%}
          {%- if _o.ok in o -%}{%- set g2.v = g2.v + [{'rc': 0, 'prefix': none}] -%}
          {%- elif _o.pending in o -%}{%- set ns.undeclared = ns.undeclared + [_o.pending ~ ' ' ~ o[_o.pending]] -%}
          {%- elif _o.entry_refusal in o -%}
          {%- set role = o[_o.entry_refusal] -%}
          {%- if role in _ge.codes and role in _ge.statuses -%}{%- set g2.v = g2.v + [{'rc': _ge.statuses[role], 'prefix': 'REFUSED ' ~ _ge.codes[role]}] -%}
          {%- else -%}{%- set ns.undeclared = ns.undeclared + [role] -%}{%- endif -%}
          {%- else -%}
          {%- set code = o[_o.refusal] -%}
          {%- if code in _wrp.bootstrap.refusals -%}{%- set g2.v = g2.v + [{'rc': _wrp.bootstrap.refusals[code], 'prefix': 'REFUSED ' ~ code ~ ' '}] -%}
          {%- else -%}{%- set ns.undeclared = ns.undeclared + [code] -%}{%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- set conv.v = conv.v + [g2.v] -%}
          {%- endfor -%}
          {%- if e.inner is defined and _o.pending in e.inner.exit_status -%}{%- set ns.undeclared = ns.undeclared + [_o.pending ~ ' ' ~ e.inner.exit_status[_o.pending]] -%}{%- endif -%}
          {%- set ns.r = ns.r + [conv.v] -%}
          {%- endfor -%}
          {{ {'admitted': ns.r, 'undeclared': ns.undeclared | unique | list} }}

    - name: Refuse an expected refusal without a declared exit status (CONTROLS-GENESIS-STATUS-UNDECLARED; Codex557)
      ansible.builtin.assert:
        that: [_gres.undeclared | length == 0]
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_status_undeclared,
                                   'rh_rf_detail': [C.harness.texts.genesis_status_undeclared, case.id, _gres.undeclared | to_json]}) | trim }}
        quiet: true

    - name: Refuse an absent host binding (the declared extra var; no default, no ambient host)
      ansible.builtin.assert:
        that:
          - _gh.host_binding.var in vars
          - lookup('ansible.builtin.vars', _gh.host_binding.var) is string
          - lookup('ansible.builtin.vars', _gh.host_binding.var) is match(_wrp.bootstrap.path_admission.regex)
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_host_unbound,
                                   'rh_rf_detail': [C.harness.texts.genesis_host_unbound, case.id, [_gh.host_binding.var] | to_json]}) | trim }}
        quiet: true

    - name: Stat the host binding file (no link followed)
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', _gh.host_binding.var) }}"
        follow: false
      register: _ghbs

    - name: Refuse a host binding file that is not a regular file free of group/other write
      ansible.builtin.assert:
        that:
          - _ghbs.stat.exists and _ghbs.stat.isreg and not _ghbs.stat.islnk
          - not (_ghbs.stat.wgrp or _ghbs.stat.woth)
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_host_unbound,
                                   'rh_rf_detail': [C.harness.texts.genesis_host_unbound, case.id, [lookup('ansible.builtin.vars', _gh.host_binding.var)] | to_json]}) | trim }}
        quiet: true

    # an unreadable file or bytes that are not JSON refuse with the DECLARED host-unbound code and text (never the
    # parser's message alone): the read and parse run in their own block whose rescue fails typed
    - name: Read the host binding records (read / parse failure -> CONTROLS-GENESIS-HOST-UNBOUND)
      block:
        - name: Read and parse the host binding records ONCE
          ansible.builtin.set_fact:
            _ghb_all: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.vars', _gh.host_binding.var)) | from_json }}"
      rescue:
        - name: Refuse an unreadable or unparsable host binding file (typed)
          ansible.builtin.fail:
            msg: >-
              {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                        template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_host_unbound,
                                       'rh_rf_detail': [C.harness.texts.genesis_host_unbound, case.id, [lookup('ansible.builtin.vars', _gh.host_binding.var)] | to_json]}) | trim }}

    - name: Select this case's run records and name the malformed ones
      vars:
        _modes: "{{ _wrp.bootstrap.ssh_auth.modes }}"
      ansible.builtin.set_fact:
        _ghb: >-
          {%- set ns = namespace(r=[], bad=[]) -%}
          {%- for v in _xc.generation.variants -%}
          {%- set k = case.id ~ _gsep ~ loop.index0 -%}
          {%- set r = _ghb_all[k] if (_ghb_all is mapping and k in _ghb_all) else none -%}
          {%- if r is not mapping or (r.keys() | list | sort) != (_gh.host_binding.record_keys | sort)
                 or r.connection is not mapping or (r.connection.keys() | list | sort) != (_gh.host_binding.connection_keys | sort)
                 or r.connection.mode not in _modes or r.host_condition != _xc.host or r.fixture != v.fixture
                 or r.run != k
                 or (('key_var' in _modes[r.connection.mode]) != (r.connection.key_ref is string)) -%}
          {%- set ns.bad = ns.bad + [k] -%}
          {%- else -%}{%- set ns.r = ns.r + [r] -%}{%- endif -%}
          {%- endfor -%}
          {{ {'runs': ns.r, 'bad': ns.bad} }}

    # ancestry (brr-follow-s2 successor-06 S2-ISOLATED-FIXTURE-COMMIT, codex-572): baseline_fixture runs are AT the
    # admitted commit; every other fixture run is bound to ITS OWN fixture commit -- a commit other than the admitted one
    # whose recorded parent is the admitted commit (read back below: its ONLY parent is the admitted commit); runs of the
    # same fixture share one fixture commit and distinct fixtures have distinct commits (one reviewed single-mutation
    # commit per fixture; the former "ONE commit for all isolated runs" rule contradicted GEN3-27C's five fixture commits).
    # isolated: pairwise distinct checkouts (Codex557), all on the ONE common admitted parent. neighbour: each run's
    # neighbour_run is a bound run of the neighbour case on the SAME host_id; no neighbour declared -> neighbour_run null.
    - name: Refuse a missing / malformed run record, wrong ancestry, shared isolated checkouts or an unbound neighbour
      vars:
        _runs: "{{ _ghb.runs }}"
        _nb: "{{ _ghb.runs | rejectattr('fixture', 'equalto', _gh.baseline_fixture) | list }}"
        _nbpairs: "{{ _nb | map(attribute='fixture') | zip(_nb | map(attribute='checkout_commit')) | map('list') | map('to_json') | unique(case_sensitive=true) | list }}"
        _nprefix: "{{ (case.neighbour ~ _gsep) if (case.neighbour is defined) else none }}"
      ansible.builtin.assert:
        that:
          - _ghb.bad | length == 0
          - _runs | selectattr('fixture', 'equalto', _gh.baseline_fixture) | rejectattr('checkout_commit', 'equalto', sr.commit) | list | length == 0
          - _nb | rejectattr('checkout_parent', 'equalto', sr.commit) | list | length == 0
          - _nb | selectattr('checkout_commit', 'equalto', sr.commit) | list | length == 0
          - _nbpairs | length == _nb | map(attribute='fixture') | unique(case_sensitive=true) | list | length
          - _nbpairs | length == _nb | map(attribute='checkout_commit') | unique(case_sensitive=true) | list | length
          - >-
            (_xc.generation.isolation != _gh.variant_isolation.isolated)
            or (_runs | map(attribute='checkout') | unique(case_sensitive=true) | list | length == _runs | length)
          - (_nprefix is not none) or (_runs | rejectattr('neighbour_run', 'none') | list | length == 0)
          - (_nprefix is none) or (_runs | map(attribute='neighbour_run') | reject('string') | list | length == 0)
          - (_nprefix is none) or (_runs | map(attribute='neighbour_run') | reject('in', _ghb_all.keys() | list) | list | length == 0)
          - (_nprefix is none) or (_runs | map(attribute='neighbour_run') | reject('match', _nprefix | regex_escape) | list | length == 0)
          - >-
            (_nprefix is none)
            or ((_runs | map(attribute='neighbour_run') | map('extract', _ghb_all) | map(attribute='host_id') | list)
                == (_runs | map(attribute='host_id') | list))
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.genesis_host_unbound,
                                   'rh_rf_detail': [C.harness.texts.genesis_host_unbound, case.id, _ghb.bad | to_json]}) | trim }}
        quiet: true

    # codex-tick563 / codex-tick564 OD-S2-INNER-STATUS(-217): the run's Ansible leg is the binding record's ansible_leg (a
    # declared ansible_legs member, else HOST-UNBOUND); an inner expectation with NO status for that leg is undeclared
    # for the run (STATUS-UNDECLARED before launch) -- one leg's status is never applied to another leg
    - name: Refuse an undeclared Ansible leg, or an inner expectation without a status for the run's leg
      vars:
        _lg: "{{ _gh.inner_forms.legs }}"
        _legbad: "{{ _ghb.runs | map(attribute='ansible_leg') | reject('in', _gh.ansible_legs) | list }}"
        _legund: >-
          {%- set ns = namespace(u=[]) -%}
          {%- for pair in _ghb.runs | zip(_xc.expect.variants) -%}
          {%- if pair[1].inner is defined and _lg in pair[1].inner.exit_status and pair[0].ansible_leg not in pair[1].inner.exit_status[_lg] -%}
          {%- set ns.u = ns.u + [[pair[0].run, pair[0].ansible_leg]] -%}{%- endif -%}
          {%- endfor -%}{{ ns.u }}
      ansible.builtin.assert:
        that: [_legbad | length == 0, _legund | length == 0]
        fail_msg: >-
          {{ lookup('ansible.builtin.template', repo_root ~ _gsep ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': _hrf_grammar,
                                   'rh_rf_code': (C.harness.refusals.genesis_host_unbound if (_legbad | length > 0) else C.harness.refusals.genesis_status_undeclared),
                                   'rh_rf_detail': [(C.harness.texts.genesis_host_unbound if (_legbad | length > 0) else C.harness.texts.genesis_status_undeclared),
                                                    case.id, (_legbad + _legund) | to_json]}) | trim }}
        quiet: true

  rescue:
    - name: Record the pre-launch refusal (nothing was executed; never creditable)
      ansible.builtin.set_fact:
        _fail: "{{ _fail + [ansible_failed_result.msg] }}"
        _gstage: "{{ C.harness.generation.verdict_stage.pre_launch }}"
        _gpre: true

# ============================ execution (bound hosts; raw only) ============================
- name: "{{ case.id }} -- genesis: run every variant on its bound host"
  when: not _gpre
  block:
    # identity options ONLY from the run's declared ssh_auth mode; the key reference only for a mode declaring key_var
    # (the admission above refused a key_ref that is present for a keyless mode or absent for a key mode)
    - name: Bind each run's host (a mode declaring key_var)
      ansible.builtin.add_host:
        name: "{{ item.run }}"
        ansible_host: "{{ item.connection.address }}"
        ansible_port: "{{ item.connection.port }}"
        ansible_user: "{{ item.connection.user }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "{{ _wrp.bootstrap.ssh_auth.modes[item.connection.mode].ssh_common_args }}"
        ansible_ssh_private_key_file: "{{ item.connection.key_ref }}"
      loop: "{{ _ghb.runs | selectattr('connection.key_ref', 'string') | list }}"
      loop_control:
        label: "{{ item.run }}"

    - name: Bind each run's host (a mode without key_var)
      ansible.builtin.add_host:
        name: "{{ item.run }}"
        ansible_host: "{{ item.connection.address }}"
        ansible_port: "{{ item.connection.port }}"
        ansible_user: "{{ item.connection.user }}"
        ansible_connection: ssh
        ansible_ssh_common_args: "{{ _wrp.bootstrap.ssh_auth.modes[item.connection.mode].ssh_common_args }}"
      loop: "{{ _ghb.runs | rejectattr('connection.key_ref', 'string') | list }}"
      loop_control:
        label: "{{ item.run }}"

    # the read prefix of R2's ONE declared git policy (run_controls.yml _gitr: [env, env_clear] + env_pairs + [git] +
    # global) + <checkout> + subcommand; prints HEAD then the porcelain lines
    - name: Clean-baseline readback on every bound checkout BEFORE any row mutation (HEAD == bound commit; empty status)
      vars:
        _sa: "{{ _wrp.bootstrap.source_admission }}"
        _gp: >-
          {{ [_wrp.bootstrap.os_tools[_sa.tool_roles.env].path, _sa.git.env_clear] + _sa.git.env_pairs
             + [_wrp.bootstrap.os_tools[_sa.tool_roles.git].path] + _sa.git.global }}
        _gdr: "{{ _sa.bootstrap_input.declaration_rel }}"
        _gsha: "{{ _wrp.bootstrap.os_tools.sha256sum.path | quote }}"
      # an inventory_absent run also prints `inventory-present` when its record's inventory path exists (any type); a
      # declaration_digest run also prints the sha256 of the COMMITTED declaration at the parent and at the bound commit
      # (git show <rev>:<declaration_rel>; a failed show digests empty input and so never equals a reviewed digest).
      # successor-06 S2-ISOLATED-FIXTURE-COMMIT: a non-baseline run also prints git's own `<commit> <parent>...` line
      # (rev-list --parents -n 1 of its bound commit: exactly ONE parent, the admitted commit) and, for a declaration_digest
      # variant, each path the fixture commit changes against that parent (diff-tree --name-only; the decl_* fixtures
      # change ONLY the bound declaration rel). Each is its own &&-chained git command (a failed git exits non-zero, rc
      # checked below; no command substitution) and the readback compares the WHOLE ordered line list.
      ansible.builtin.raw: >-
        {{ (_gp + [item.0.checkout, 'rev-parse', 'HEAD']) | map('quote') | join(' ') }} &&
        {{ (_gp + [item.0.checkout, 'status', '--porcelain']) | map('quote') | join(' ') }}
        {%- if item.1.fixture != _gh.baseline_fixture %} &&
        {{ (_gp + [item.0.checkout, 'rev-list', '--parents', '-n', '1', item.0.checkout_commit]) | map('quote') | join(' ') }}{% endif %}
        {%- if item.1.declaration_digest is defined %} &&
        {{ (_gp + [item.0.checkout, 'diff-tree', '--no-commit-id', '--name-only', '-r', item.0.checkout_parent, item.0.checkout_commit]) | map('quote') | join(' ') }}{% endif %}
        {%- if item.1.inventory_absent is defined %} && { if [ -e {{ item.0.inventory | quote }} ] || [ -L {{ item.0.inventory | quote }} ]; then printf '%s\n' inventory-present; fi; }{% endif %}
        {%- if item.1.declaration_digest is defined %} &&
        printf 'declaration-sha256-parent %s\n' "$({{ (_gp + [item.0.checkout, 'show', item.0.checkout_parent ~ ':' ~ _gdr]) | map('quote') | join(' ') }} | {{ _gsha }})" &&
        printf 'declaration-sha256-commit %s\n' "$({{ (_gp + [item.0.checkout, 'show', item.0.checkout_commit ~ ':' ~ _gdr]) | map('quote') | join(' ') }} | {{ _gsha }})"{% endif %}
      delegate_to: "{{ item.0.run }}"
      register: _gpc
      changed_when: false
      failed_when: false
      loop: "{{ _ghb.runs | zip(_xc.generation.variants) | list }}"
      loop_control:
        label: "{{ item.0.run }}"

    # declaration_digest (codex-tick563 GEN3-27): admitted = the reviewed digest is the parent's declaration and NOT the
    # fixture commit's; fixture = the reviewed digest is the fixture commit's declaration
    - name: Name every run whose readback is not exactly [its bound commit] (rc 0, HEAD line, no porcelain line) or whose reviewed digest is not its declared class
      vars:
        _dc: "{{ _gh.declaration_digest_classes }}"
      ansible.builtin.set_fact:
        _gbase_bad: >-
          {%- set ns = namespace(b=[]) -%}
          {%- for pair in _gpc.results | zip(_ghb.runs, _xc.generation.variants) -%}
          {%- set lines = pair[0].stdout_lines | reject('equalto', '') | list -%}
          {%- set dp = lines | select('match', '^declaration-sha256-parent ') | map('split') | map(attribute=1) | list -%}
          {%- set dcm = lines | select('match', '^declaration-sha256-commit ') | map('split') | map(attribute=1) | list -%}
          {%- set v = pair[2] -%}
          {%- set ds = pair[1].declaration_sha256 -%}
          {#- successor-06: the exact ordered readback: HEAD; then (non-baseline) `<commit> <admitted parent>`; then
              (declaration_digest) the ONE changed path = the bound declaration rel -#}
          {%- set want = [pair[1].checkout_commit]
                         + ([pair[1].checkout_commit ~ ' ' ~ sr.commit] if (v.fixture != _gh.baseline_fixture) else [])
                         + ([_wrp.bootstrap.source_admission.bootstrap_input.declaration_rel] if (v.declaration_digest is defined) else []) -%}
          {%- if pair[0].rc != 0 or (lines | reject('match', '^declaration-sha256-(parent|commit) ') | list) != want -%}
          {%- set ns.b = ns.b + [[pair[1].run, pair[0].stdout_lines]] -%}
          {%- elif v.declaration_digest is defined and (dp | length != 1 or dcm | length != 1
                   or (v.declaration_digest == _dc.admitted and not (dp[0] == ds and dcm[0] != ds))
                   or (v.declaration_digest == _dc.fixture and dcm[0] != ds)) -%}
          {%- set ns.b = ns.b + [[pair[1].run, v.declaration_digest, ds, dp, dcm]] -%}{%- endif -%}
          {%- endfor -%}{{ ns.b }}

    - name: Fail the case on a dirty or foreign baseline (no row of the case runs; texts.genesis_baseline)
      ansible.builtin.set_fact:
        _fail: "{{ _fail + [C.harness.texts.genesis_baseline ~ ' ' ~ (_gbase_bad | to_json)] }}"
      when: _gbase_bad | length > 0

    - name: Write each variant's operator inventory on its host (variants that declare one)
      ansible.builtin.raw: >-
        umask 077 && printf '%s' {{ item.1.inventory.content | quote }} > {{ item.0.inventory | quote }} &&
        chmod {{ item.1.inventory.mode | quote }} {{ item.0.inventory | quote }}
      delegate_to: "{{ item.0.run }}"
      loop: "{{ _ghb.runs | zip(_xc.generation.variants) | list }}"
      loop_control:
        label: "{{ item.0.run }}"
      when: _fail | length == 0 and item.1.inventory is defined

    - name: Apply each variant's worktree edit on its OWN checkout (never committed; isolated cases only)
      ansible.builtin.raw: >-
        printf '%s\n' {{ item.1.worktree_edit.append | quote }} >> {{ (item.0.checkout ~ _gsep ~ item.1.worktree_edit.rel) | quote }}
      delegate_to: "{{ item.0.run }}"
      loop: "{{ _ghb.runs | zip(_xc.generation.variants) | list }}"
      loop_control:
        label: "{{ item.0.run }}"
      when: _fail | length == 0 and item.1.worktree_edit is defined

    # the DECLARED invocation (genesis.entry.invocation; cli; controller.bootstrap.base_env), each word shell-quoted:
    #   env -i HOME=<passwd home> PATH=<base_env.PATH> LC_ALL=<base_env.LC_ALL> /bin/sh <checkout>/<generated_rel>
    #   --act <act> --edition <bound commit> --declaration-sha256 <reviewed sha> --inventory <inventory>
    #   [--input-<name> <value> ...] [entry_args ...]
    # act = <case id>-v<index>[-a|-b] (every row authored here fullmatches genesis.launch.stage_root.act.regex)
    - name: Compose each run's argv (one per process)
      ansible.builtin.set_fact:
        _gargs: >-
          {%- set ns = namespace(r=[]) -%}
          {%- set cli = _ge.cli -%}
          {%- for pair in _ghb.runs | zip(_xc.generation.variants) -%}
          {%- set r = pair[0] -%}{%- set v = pair[1] -%}{%- set i = loop.index0 -%}
          {%- set per = namespace(w=[], acts=[]) -%}
          {%- for who in (['a', 'b'] if _xc.generation.concurrent == 2 else ['']) -%}
          {%- set act = case.id ~ '-v' ~ i ~ (('-' ~ who) if who else '') -%}
          {%- set w = namespace(l=['env', '-i', 'HOME=' ~ r.passwd_home, 'PATH=' ~ _wrp.bootstrap.base_env.PATH, 'LC_ALL=' ~ _wrp.bootstrap.base_env.LC_ALL,
                       '/bin/sh', r.checkout ~ _gsep ~ _ge.generated_rel,
                       cli.prefix ~ cli.args.act, act, cli.prefix ~ cli.args.edition, r.checkout_commit,
                       cli.prefix ~ cli.args.declaration_sha256, r.declaration_sha256, cli.prefix ~ cli.args.inventory, r.inventory]) -%}
          {%- for n, val in (v.inputs if (v.inputs is defined) else {}) | dictsort(case_sensitive=true) -%}
          {%- set w.l = w.l + [cli.prefix ~ cli.input_prefix ~ n, val] -%}
          {%- endfor -%}
          {%- set w.l = w.l + (v.entry_args if (v.entry_args is defined) else []) -%}
          {%- set per.w = per.w + [w.l | map('quote') | join(' ')] -%}
          {%- set per.acts = per.acts + [act] -%}
          {%- endfor -%}
          {%- set ns.r = ns.r + [{'cmds': per.w, 'acts': per.acts}] -%}
          {%- endfor -%}{{ ns.r }}
      when: _fail | length == 0

    - name: Run each single-process variant (rc and merged output captured; the expectation judges)
      ansible.builtin.raw: "{{ item.1.cmds[0] }} 2>&1"
      delegate_to: "{{ item.0.run }}"
      register: _grun1
      changed_when: false
      failed_when: false
      loop: "{{ _ghb.runs | zip(_gargs) | list }}"
      loop_control:
        label: "{{ item.0.run }}"
      when: _fail | length == 0 and _xc.generation.concurrent == 1

    # GEN2-07A: both entries start together with NO designated winner (codex-tick556); each process's rc and output
    # are written separately under the run's owned evidence dir, then printed between fences
    - name: Run the concurrent pair (two entries started together; separate rc / output per process)
      ansible.builtin.raw: >-
        cd {{ item.0.evidence_dir | quote }} || exit 1;
        ( {{ item.1.cmds[0] }} > a.out 2>&1; echo $? > a.rc ) &
        ( {{ item.1.cmds[1] }} > b.out 2>&1; echo $? > b.rc ) &
        wait; printf 'A-RC=%s\n' "$(cat a.rc)"; printf 'B-RC=%s\n' "$(cat b.rc)";
        printf '%s\n' '--A--'; cat a.out; printf '%s\n' '--B--'; cat b.out
      delegate_to: "{{ item.0.run }}"
      register: _grun2
      changed_when: false
      failed_when: false
      loop: "{{ _ghb.runs | zip(_gargs) | list }}"
      loop_control:
        label: "{{ item.0.run }}"
      when: _fail | length == 0 and _xc.generation.concurrent == 2

    - name: Read which home_absent paths exist after the run (evidence; read-only; GEN3-28 sentinel)
      vars:
        _exp: "{{ _xc.expect.variants[_gidx] }}"
      ansible.builtin.raw: >-
        {% for rel in _exp.home_absent %}if [ -e {{ (_ghb.runs[_gidx].passwd_home ~ _gsep ~ rel) | quote }} ] || [ -L {{ (_ghb.runs[_gidx].passwd_home ~ _gsep ~ rel) | quote }} ]; then printf 'present %s\n' {{ rel | quote }}; fi; {% endfor %}true
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _ghome
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.expect.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.expect.variants[_gidx].home_absent is defined

    # brr-follow-s2 successor-06 S2-STORE-READBACK-FALSE-PASS (codex-572): the store evidence of a store-asserting
    # variant is read by THREE separate commands, each its own task and result (no `;` chain that masks a failed read):
    # (1) presence of the ops log (`[ -e ] || [ -L ]`: rc 0 present, rc 1 absent), (2) the ops log bytes (cat, rc 0
    # required), (3) the generation dirs (ls -1, rc 0 required). Each result is attributed by its loop index. A variant
    # declaring store_fault first gets that declared fault applied to its ops log (CASES harness.genesis.store_faults:
    # fault -> mode; a negative control of THIS readback, never of the entry).
    - name: Apply each variant's declared store fault to its ops log AFTER its run (negative readback controls only)
      vars:
        _st: "{{ _ge.store }}"
      ansible.builtin.raw: >-
        chmod {{ _gh.store_faults[_xc.generation.variants[_gidx].store_fault] | quote }}
        {{ (_ghb.runs[_gidx].passwd_home ~ _gsep ~ _st.sub ~ _gsep ~ _st.rel ~ _gsep ~ _st.ops_log) | quote }}
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _gfault
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.generation.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.generation.variants[_gidx].store_fault is defined

    - name: Read whether the store operations log exists (store-asserting variants; rc 0 present, rc 1 absent)
      vars:
        _st: "{{ _ge.store }}"
        _p: "{{ _ghb.runs[_gidx].passwd_home ~ _gsep ~ _st.sub ~ _gsep ~ _st.rel ~ _gsep ~ _st.ops_log }}"
      ansible.builtin.raw: "[ -e {{ _p | quote }} ] || [ -L {{ _p | quote }} ]"
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _gevp
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.expect.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.expect.variants[_gidx].store is defined

    - name: Read the store operations log bytes (store-asserting variants; its own result)
      vars:
        _st: "{{ _ge.store }}"
      ansible.builtin.raw: >-
        cat {{ (_ghb.runs[_gidx].passwd_home ~ _gsep ~ _st.sub ~ _gsep ~ _st.rel ~ _gsep ~ _st.ops_log) | quote }}
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _gevl
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.expect.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.expect.variants[_gidx].store is defined

    - name: Read the generation dirs (store-asserting variants; its own result)
      ansible.builtin.raw: >-
        ls -1 {{ (_ghb.runs[_gidx].owned_root ~ _gsep ~ _wrp.bootstrap.layout.generations_dir) | quote }}
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _gevg
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.expect.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.expect.variants[_gidx].store is defined

    # codex-tick560 GEN3-28: the INNER status is the stage step record's exit_status (genesis.launch.step_record), read
    # SEPARATELY from the outer entry rc; the stage act is the entry's --act (SC-S2-STAGE-ACT: rebind here if the entry
    # derives per-stage acts)
    - name: Read the declared step record of each inner-asserting variant
      vars:
        _sr: "{{ _gl.step_record }}"
        _exp: "{{ _xc.expect.variants[_gidx] }}"
      ansible.builtin.raw: >-
        cat {{ (_ghb.runs[_gidx].checkout ~ _gsep ~ _wrp.work_roots.root_rel ~ _gsep ~ _wrp.work_roots.sub_roots.run ~ _gsep
                ~ _gl.stage_root.rel ~ _gsep ~ _exp.inner.stage ~ _gsep ~ _gargs[_gidx].acts[0] ~ _gsep ~ _sr.files.record) | quote }}
      delegate_to: "{{ _ghb.runs[_gidx].run }}"
      register: _ginner
      changed_when: false
      failed_when: false
      loop: "{{ range(_xc.expect.variants | length) | list }}"
      loop_control:
        loop_var: _gidx
      when: _fail | length == 0 and _xc.expect.variants[_gidx].inner is defined

    # ---- evaluation (typed; per variant) ----
    - name: Evaluate every variant against its admitted outcomes, output, store and inner expectations
      vars:
        _m: "{{ _ge.markers }}"
        _lw: "{{ _ge.store.log_words }}"
        _cmp: "{{ _gh.store_evidence.comparators }}"
      ansible.builtin.set_fact:
        _gx: >-
          {%- set ns = namespace(x=[]) -%}
          {%- for e in _xc.expect.variants -%}
          {%- set i = loop.index0 -%}
          {%- if _xc.generation.concurrent == 1 -%}
          {%- set rr = _grun1.results[i] -%}
          {%- set procs = [{'rc': rr.rc, 'out': rr.stdout ~ rr.stderr}] -%}
          {%- else -%}
          {%- set txt = _grun2.results[i].stdout -%}
          {%- set arc = txt.splitlines() | select('match', '^A-RC=[0-9]+$') | list -%}
          {%- set brc = txt.splitlines() | select('match', '^B-RC=[0-9]+$') | list -%}
          {#- a missing / repeated rc line is a typed outcome failure (rc -1 never matches an admitted outcome) -#}
          {%- set procs = [{'rc': (arc[0].split('=')[1] | int) if (arc | length == 1) else -1, 'out': txt.split('--A--\n')[-1].split('--B--\n')[0]},
                           {'rc': (brc[0].split('=')[1] | int) if (brc | length == 1) else -1, 'out': txt.split('--B--\n')[-1]}] -%}
          {%- endif -%}
          {%- set f = namespace(l=[], hit=false) -%}
          {%- for alt in _gres.admitted[i] -%}
          {%- set m = namespace(ok=(alt | length) == (procs | length)) -%}
          {%- for p in procs -%}
          {%- if m.ok and (p.rc != alt[loop.index0].rc or (alt[loop.index0].prefix is not none and alt[loop.index0].prefix not in p.out)) -%}{%- set m.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- if m.ok -%}{%- set f.hit = true -%}{%- endif -%}
          {%- endfor -%}
          {%- if not f.hit -%}{%- set f.l = f.l + [C.harness.texts.genesis_outcome ~ ' ' ~ ([i, procs | map(attribute='rc') | list] | to_json)] -%}{%- endif -%}
          {%- for p in procs -%}
          {%- for s in (e.out if (e.out is defined) else []) if s not in p.out -%}{%- set f.l = f.l + ['output lacks: ' ~ s] -%}{%- endfor -%}
          {%- for s in (e.out_absent if (e.out_absent is defined) else []) if s in p.out -%}{%- set f.l = f.l + ['output has: ' ~ s] -%}{%- endfor -%}
          {%- if p.rc == 0 -%}{%- for s in (e.out_success if (e.out_success is defined) else []) if s not in p.out -%}{%- set f.l = f.l + ['successful process lacks: ' ~ s] -%}{%- endfor -%}{%- endif -%}
          {%- endfor -%}
          {%- if e.store is defined -%}
          {#- successor-06 S2-STORE-READBACK-FALSE-PASS: the evidence FRAME is validated before any store key is
              evaluated. frame = the first failing condition, in order: unattributed (a result of another index, or a
              skipped read), fault_unapplied (a declared store_fault whose chmod did not exit 0), log_missing (presence
              probe rc 1), log_probe_failed (presence probe rc other than 0 / 1), log_unreadable (cat rc != 0),
              generations_unreadable (ls rc != 0), log_malformed (a non-empty log line that is not `<declared log word>
              <op> <file>`); else ok. The expected frame is the expectation's store.frame (a frames value; absent = ok);
              a frame other than ok evaluates NO other store key (admission: such an expectation carries none). -#}
          {%- set fr = _gh.store_evidence.frames -%}
          {%- set vp = _gevp.results[i] -%}{%- set vl = _gevl.results[i] -%}{%- set vg = _gevg.results[i] -%}
          {%- set vf = _gfault.results[i] -%}
          {%- set v = _xc.generation.variants[i] -%}
          {%- set lre = '^(' ~ (_lw.values() | map('regex_escape') | join('|')) ~ ') [^ ]+ [^ ]+$' -%}
          {%- set log = (vl.stdout_lines | reject('equalto', '') | list) if (vl.stdout_lines is defined) else [] -%}
          {%- if vp._gidx != i or vl._gidx != i or vg._gidx != i or vp.rc is not defined or vl.rc is not defined or vg.rc is not defined -%}{%- set frame = fr.unattributed -%}
          {%- elif v.store_fault is defined and (vf._gidx != i or vf.rc is not defined or vf.rc != 0) -%}{%- set frame = fr.fault_unapplied -%}
          {%- elif vp.rc == 1 -%}{%- set frame = fr.log_missing -%}
          {%- elif vp.rc != 0 -%}{%- set frame = fr.log_probe_failed -%}
          {%- elif vl.rc != 0 -%}{%- set frame = fr.log_unreadable -%}
          {%- elif vg.rc != 0 -%}{%- set frame = fr.generations_unreadable -%}
          {%- elif log | reject('match', lre) | list | length > 0 -%}{%- set frame = fr.log_malformed -%}
          {%- else -%}{%- set frame = fr.ok -%}{%- endif -%}
          {%- set wframe = e.store.frame if ('frame' in e.store) else fr.ok -%}
          {%- if frame != wframe -%}
          {%- set f.l = f.l + [C.harness.texts.genesis_store_frame ~ ' ' ~ ([i, wframe, frame, [(vp.rc if (vp.rc is defined) else none), (vl.rc if (vl.rc is defined) else none), (vg.rc if (vg.rc is defined) else none)]] | to_json)] -%}
          {%- elif frame == fr.ok -%}
          {%- set gens = vg.stdout_lines | reject('equalto', '') | list -%}
          {%- set pub = log | select('match', (_lw.published | regex_escape) ~ ' ') | map('split', ' ') | map('last') | list -%}
          {%- set starts = log | select('match', (_lw.start | regex_escape) ~ ' ') | map('split', ' ') | map('last') | list -%}
          {%- set allout = procs | map(attribute='out') | join('\n') -%}
          {#- published_distinct requires a NON-EMPTY publication set (an empty set is never distinct-and-complete);
              published_covers_declared = the published files are exactly the declaration-derived store rows
              (_wrp.genesis_store_files, resolve_work_root.yml) -#}
          {%- set obs = {'frame': frame,
                         'published_distinct': (pub | length > 0) and (pub | unique | list | length == pub | length) and ((pub | sort) == (starts | unique | sort | list)),
                         'published_covers_declared': (pub | length > 0) and ((pub | unique | sort | list) == (_wrp.genesis_store_files | unique | sort | list)),
                         'removed_partial': log | select('match', (_lw.removed | regex_escape) ~ ' ') | list | length,
                         'cold_markers': allout.splitlines() | select('match', _m.store_cold | regex_escape) | list | length,
                         'generation_dirs': gens | length,
                         'same_generation': allout.splitlines() | select('match', (_m.generation | regex_escape) ~ ' ') | unique | list | length <= 1} -%}
          {%- for k, want in e.store | dictsort -%}
          {%- set c = _gh.store_evidence['keys'][k] -%}
          {%- if (c == _cmp.at_most and obs[k] > want) or (c == _cmp.equal and obs[k] != want) -%}
          {%- set f.l = f.l + [C.harness.texts.genesis_store_evidence ~ ' ' ~ ([i, k, want, obs[k]] | to_json)] -%}{%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endif -%}
          {%- if e.inner is defined -%}
          {%- set ir = _ginner.results[i] -%}
          {%- set rec = (ir.stdout | from_yaml) if (ir.rc == 0 and ir.stdout | trim | length > 0) else none -%}
          {%- set got = rec.exit_status if (rec is mapping and 'exit_status' in rec) else none -%}
          {#- a pending inner status, or a leg without a declared status, never reaches here (STATUS-UNDECLARED at
              pre_launch); only the exact int declared for THIS run's Ansible leg is compared -#}
          {%- set want = e.inner.exit_status[_gh.inner_forms.legs][_ghb.runs[i].ansible_leg] -%}
          {%- set ok_inner = (got is integer) and (want is integer) and (got == want) -%}
          {%- if not ok_inner -%}{%- set f.l = f.l + [C.harness.texts.genesis_inner_status ~ ' ' ~ ([i, e.inner.stage, _ghb.runs[i].ansible_leg, want, got] | to_json)] -%}{%- endif -%}
          {%- endif -%}
          {%- if e.home_absent is defined -%}
          {%- set hr = _ghome.results[i] -%}
          {%- if hr.rc != 0 or (hr.stdout | trim | length > 0) -%}{%- set f.l = f.l + ['home_absent: ' ~ ([i, hr.rc, hr.stdout_lines] | to_json)] -%}{%- endif -%}
          {%- endif -%}
          {%- set ns.x = ns.x + [{'variant': i, 'run': _ghb.runs[i].run, 'host_id': _ghb.runs[i].host_id,
                                   'checkout_commit': _ghb.runs[i].checkout_commit, 'fixture': _ghb.runs[i].fixture,
                                   'rcs': procs | map(attribute='rc') | list, 'ok': f.l | length == 0, 'failures': f.l}] -%}
          {%- endfor -%}{{ ns.x }}
      when: _fail | length == 0

    - name: Fold the variant verdicts into the case (ok only when EVERY declared variant ran and is ok)
      ansible.builtin.set_fact:
        _fail: >-
          {{ _fail
             + ([] if (_gx | length) == (_xc.generation.variants | length)
                else [C.harness.texts.genesis_variant_count ~ ' ' ~ ([_xc.generation.variants | length, _gx | length] | to_json)])
             + (_gx | map(attribute='failures') | flatten(levels=1) | list) }}
        _run: >-
          {{ {'rc': -1,
              'out': ((_grun1.results if (_xc.generation.concurrent == 1) else _grun2.results)
                      | selectattr('stdout', 'defined') | map(attribute='stdout') | join('\n'))} }}
        _gstage: "{{ C.harness.generation.verdict_stage.generated if (_gx | length > 0) else C.harness.generation.verdict_stage.pre_launch }}"
