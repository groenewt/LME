---
# testing/e2e/transfer/controls/fixture_fresh_dest.yml -- NEW (r5s; R2 r2l C1-R2L-GIT-FRESH-INIT, r2l-c1-hunks.yml
# cf0678fd :627-638, consumed). The DESTINATION step of the declared FRESH order
#   destination admission -> init (or clone) -> location -> config listing -> mutation -> location -> readback
# for a fixture repository B creates (check fixture init; generation case clone). It adds no policy: the destination
# rule is fresh_init.destination of the ONE git.mutation node, applied in its STRICTER sub-case -- B always creates the
# repository itself, so the destination must be ABSENT (r2l also admits an empty owned directory; B never needs it):
#   (1) realpath(dest) == dest (no link component, including a linked parent)
#   (2) the parent through the route's ONE ancestry include (admit_ancestry.yml: owned, not group/other-writable, no link)
#   (3) lstat(dest) absent -- hence lstat(dest/.git) absent; parent-repository adoption is impossible because the
#       init / clone that follows is fenced to dest and post-init location must equal [realpath(dest)/.git, realpath(dest)]
#       (fixture_git_admit.yml, the post_init step)
# The caller then creates dest (fresh_init.dir_mode) and runs mutation.init under the mutation prefix + fence, or the
# declared clone, and includes fixture_git_admit.yml (post_init). AUTHORED, NEVER EXECUTED (controls UNRUN).
# r5s (codex-tick482 R2L-B-CLONE-SEQUENCE): the destination step is SHARED by two distinct declared operation sequences
# of the SAME git.mutation policy -- fresh_init (check fixture) and clone_sequence (generation clone; C1-R5S-5) -- and
# the caller names which one (ff_seq) so the helper admits that sequence's destination node; clone is never
# re-expressed as fresh-init words.
# Inputs (no defaults): ff_dest (absolute destination), ff_case (diagnostics), ff_seq (the declared sequence node:
# _gitp.mutation.fresh_init or _gitp.mutation.clone_sequence).
# Refusal: C.harness.refusals.git_fresh_init (B-declared code of this node's mutation refusal) with
# C.harness.texts.git_fresh_init, through the shared refusal grammar entry.

- name: "FRESH-DEST -- refuse an undeclared fresh-init node, a malformed destination or a linked path (before any stat)"
  vars:
    _ffs: "{{ _wrp.bootstrap.path_admission.separator }}"
  ansible.builtin.assert:
    that:
      - ff_seq is defined and ff_seq is mapping and ff_seq.destination is defined
      - _gitp.mutation.fresh_init is defined and _gitp.mutation.fresh_init is mapping
      - _gitp.mutation.fresh_init.dir_mode is string
      - _gitp.mutation.order is mapping and _gitp.mutation.order.fresh is defined and _gitp.mutation.order.existing is defined
      - ff_dest is string and ff_dest is match(_wrp.bootstrap.path_admission.regex)
      - ff_dest is not search(_wrp.bootstrap.path_admission.forbidden_segment_regex)
      - (ff_dest | normpath) == ff_dest
      - (ff_dest | realpath) == ff_dest
      - (ff_dest | dirname) != _ffs
    fail_msg: >-
      {{ lookup('ansible.builtin.template', repo_root ~ _wrp.bootstrap.path_admission.separator ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.git_fresh_init,
                               'rh_rf_detail': [C.harness.texts.git_fresh_init, ff_case, ff_dest]}) | trim }}
    quiet: true

- name: "FRESH-DEST -- the parent through the route's ONE ancestry rule (owned, not group/other-writable, no link)"
  ansible.builtin.include_tasks: "{{ repo_root }}/testing/remote_harness/tasks/admit_ancestry.yml"
  vars:
    rh_anc_bs: "{{ _wrp.bootstrap }}"
    rh_anc_repo_root: "{{ _wrp.repo_root }}"
    rh_anc_path: "{{ ff_dest | dirname }}"
    rh_anc_refusal: "{{ C.harness.refusals.git_fresh_init }}"

- name: "FRESH-DEST -- lstat the destination (no link followed)"
  ansible.builtin.stat:
    path: "{{ ff_dest }}"
    follow: false
    get_checksum: false
  register: _ff_st

- name: "FRESH-DEST -- refuse an existing destination (B creates every fixture repository itself; no adoption)"
  ansible.builtin.assert:
    that:
      - not _ff_st.stat.exists
    fail_msg: >-
      {{ lookup('ansible.builtin.template', repo_root ~ _wrp.bootstrap.path_admission.separator ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.git_fresh_init,
                               'rh_rf_detail': [C.harness.texts.git_fresh_init, ff_case, ff_dest]}) | trim }}
    quiet: true
