---
# testing/e2e/transfer/controls/fixture_git_admit.yml -- NEW (r5r; codex-tick461 R5P-FIXTURE-GIT-ISOLATION). The
# location + configuration admission R2's declared order requires around EVERY fixture mutation
# (C1-R2K-GIT-MUTATION order: location -> config listing -> mutation -> location -> readback): it adds no policy of its
# own -- every argv word, regex and record grammar is the resolved bootstrap source_admission.git node (_gitp) and its
# mutation sub-node, run through the prefixes run_controls.yml binds (_gitm mutation + fence; _giti inspection).
# Read-only. AUTHORED, NEVER EXECUTED (controls UNRUN).
#   location  mutation.location (rev-parse --absolute-git-dir --show-toplevel) under the mutation prefix and fence:
#             the git dir must be realpath(<fg_repo>/.git) and the top level realpath(<fg_repo>) -- a gitfile or
#             redirected git dir refuses (C.harness.refusals.git_location)
#   config    git.config (key-only effective listing, no values) under the inspection prefix: every key must be of
#             git.config_key_regex form and match NEITHER git.config_refused_regex NOR mutation.refused_config_regex
#             (ignorecase, as R2's admission) -- refuses C.harness.refusals.git_config
# Inputs (no defaults): fg_repo (absolute fixture repository), fg_case (case id, diagnostics).
# r5s (codex-tick480 R5R-ASSERT-TASK-SHAPE): fail_msg / quiet are ARGUMENTS of each ansible.builtin.assert (r5r had them
# as task-level siblings; the helper could not load).

- name: "FIXTURE-GIT -- the fixture repository's git dir and top level (declared location argv; mutation prefix + fence)"
  ansible.builtin.command:
    argv: "{{ _gitm + [fg_repo] + _gitp.mutation.fence + _gitp.mutation.location }}"
  register: _fg_loc
  changed_when: false
  failed_when: false

- name: "FIXTURE-GIT -- refuse a repository that is not exactly the fixture (before the next mutation)"
  ansible.builtin.assert:
    that:
      - _fg_loc.rc == 0
      - _fg_loc.stdout_lines | length == 2
      - (_fg_loc.stdout_lines[0] | realpath) == ((fg_repo ~ _wrp.bootstrap.path_admission.separator ~ '.git') | realpath)
      - (_fg_loc.stdout_lines[1] | realpath) == (fg_repo | realpath)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', repo_root ~ _wrp.bootstrap.path_admission.separator ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.git_location,
                               'rh_rf_detail': [C.harness.texts.git_location, fg_case, fg_repo,
                                                [_fg_loc.rc, _fg_loc.stdout_lines, _fg_loc.stderr] | to_json]}) | trim }}
    quiet: true

- name: "FIXTURE-GIT -- the effective configuration keys (declared key-only listing; inspection prefix)"
  ansible.builtin.command:
    argv: "{{ _giti + [fg_repo] + _gitp.config }}"
  register: _fg_cfg
  changed_when: false
  failed_when: false

- name: "FIXTURE-GIT -- refuse configuration that can run code, sign, template or convert (R2 regexes, ignorecase)"
  vars:
    _fg_raw: "{{ _fg_cfg.stdout }}"
    _fg_keys: "{{ _fg_raw.split(_gitp.config_record.terminator)[:-1] if _fg_raw | length > 0 else [] }}"
    _fg_form: "{{ _fg_keys | reject('match', _gitp.config_key_regex) | list }}"
    _fg_bad: >-
      {{ (_fg_keys | select('match', _gitp.config_refused_regex, ignorecase=true) | list)
         + (_fg_keys | select('match', _gitp.mutation.refused_config_regex, ignorecase=true) | list) }}
  ansible.builtin.assert:
    that:
      - _fg_cfg.rc == 0
      - _fg_raw | length == 0 or _fg_raw.endswith(_gitp.config_record.terminator)
      - _fg_form | length == 0
      - _fg_bad | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', repo_root ~ _wrp.bootstrap.path_admission.separator ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.git_config,
                               'rh_rf_detail': [C.harness.texts.git_config, fg_case, fg_repo,
                                                [_fg_cfg.rc, _fg_form, _fg_bad, _fg_cfg.stderr] | to_json]}) | trim }}
    quiet: true
