---
# testing/e2e/transfer/controls/launch_record.yml -- NEW (r5r; codex-tick461 R5P-TYPED-STAGE-INPUTS + R5P-CHECK-CLOSURE
# carried; R2 r2k C1-R2K-CARRIER 51b9c0fc). The ONE builder of the harness's typed source-bootstrap record, used by the
# check fixture and by the generation case clone alike (r5p built it inline in the check kind only). The record is the
# six-key typed record of C1-R2K-CARRIER: its key set is the resolved bootstrap's bootstrap_input.record_keys and each
# field comes from its declared source token (CASES harness.check_launch.fields):
#   record_src          the bound declaration node's same-named field (declaration_rel, declaration_path: list)
#   record_parent       source_admission's same-named field (controller_delegate)
#   fixture_head        the POST-MUTATION fixture commit (lr_head: the commit the readback admitted)
#   declaration_digest  the fixture's bound-declaration bytes under source_admission.digest_algorithm (stat AFTER the
#                       commit and its readback -- the bytes the producer admits)
#   packaged_tools      (r5s) {role: {path, sha256}} from tool_roles over the packaged effective os_tools identity
#   early_context       {field: value at key path} of source_admission.early_view.context_fields under the EFFECTIVE
#                       resolved controller.bootstrap (_wrp.bootstrap), typed as the node holds them
# JSON types are preserved: the record is a mapping rendered ONCE by to_json into one extra-vars word by the caller.
# Key-set driven, never six hardcoded keys (R2K-TOOL-FIRST-USE-BINDING, r2l pending): the record's keys are exactly
# bootstrap_input.record_keys and must equal the declared field->token map (CASES harness.check_launch.fields); a key
# r2l adds (e.g. the effective Git/env tool contract) refuses here until it is given a declared token -- no fallback.
# Context is read from the EFFECTIVE resolved node (_wrp.bootstrap, after lme_global_override composition), never the
# raw base (R2K-OVERRIDE-ROOT: the override root is remote_harness).
# r5s (R2 r2l C1-R2L-TOOL-BINDING, cf0678fd :595-617, consumed): record_keys are now SEVEN (+ tools). Token
# packaged_tools = {role: {tool_fields.path: os_tools[key].path, tool_fields.sha256: os_tools[key].identity.sha256}}
# for each role -> key of source_admission.tool_roles, read from the PACKAGED effective resolved bootstrap
# (_wrp.bootstrap; the same trust root as declaration_sha256) -- never from case or caller data; an absent role row
# refuses (missing). R2K-OVERRIDE-ROOT: r2l did not move the payload (early_view.override.layer_root); no B change.
# r5s (codex-tick482 R2K-TOOL-FIRST-USE-BINDING, conditional credit): the token is trust-bearing ONLY when
# _wrp.bootstrap is the INDEPENDENTLY ADMITTED seed/genesis packaged projection (SEED-EFFECTIVE). A caller-provided
# matching path, digest or record never establishes trust: nothing here reads case, extra-vars or caller data, and B
# consumes the SAME admitted launcher contract as every non-seed launcher (C1-R5S-6) -- until that join binds the
# admitted provenance node, packaged_tools is a projection, not an admission (TOOLS-01 BLOCKED on it).
# Inputs (no defaults): lr_repo (absolute fixture repository), lr_head (admitted fixture commit), lr_case (diagnostics).
# Output: _lrec. Refusal: C.harness.refusals.check_input with C.harness.texts.launch_record.
# r5s (codex-tick480 R5R-ASSERT-TASK-SHAPE): fail_msg / quiet are ARGUMENTS of the ansible.builtin.assert (r5r had them
# as task-level siblings; the helper could not load).

- name: "LAUNCH-RECORD -- resolve the declared record source, its parent and the early-view context (key paths only)"
  ansible.builtin.set_fact:
    _lr_src: >-
      {%- set ns = namespace(node=_wrp.bootstrap, miss=[]) -%}
      {%- for k in C.harness.check_launch.record_from[:-1] -%}
      {%- set ns.node = ns.node[k] if (ns.node is mapping and k in ns.node) else none -%}
      {%- endfor -%}
      {%- set par = ns.node -%}
      {%- set last = C.harness.check_launch.record_from | last -%}
      {%- set src = par[last] if (par is mapping and last in par) else none -%}
      {%- set ctx = namespace(m={}) -%}
      {%- set cf = (par.early_view.context_fields
                    if (par is mapping and par.early_view is defined and par.early_view is mapping
                        and par.early_view.context_fields is defined and par.early_view.context_fields is mapping) else none) -%}
      {#- brr-follow (f05-s3 S3-SEAM-03, SUP01 consumers_added run_one_case): the record context ALSO carries the
          launch_context_fields values (rel_path) walked over the SAME effective node as context_fields (the seed's
          projection); the two maps must be disjoint. An absent map, an overlapping key or a missing key path is a
          missing field, refused by the assert below (no fallback). -#}
      {%- set lf = (par.early_view.launch_context_fields
                    if (par is mapping and par.early_view is defined and par.early_view is mapping
                        and par.early_view.launch_context_fields is defined and par.early_view.launch_context_fields is mapping) else none) -%}
      {%- if cf is mapping and lf is mapping -%}
      {%- for f in cf.keys() if f in lf -%}{%- set ns.miss = ns.miss + ['disjoint.' ~ f] -%}{%- endfor -%}
      {%- for fm in [cf, lf] -%}
      {%- for f, kp in fm.items() -%}
      {%- set ns.node = _wrp.bootstrap -%}
      {%- for k in kp -%}{%- set ns.node = ns.node[k] if (ns.node is mapping and k in ns.node) else none -%}{%- endfor -%}
      {%- if ns.node is none -%}{%- set ns.miss = ns.miss + [f] -%}{%- else -%}{%- set ctx.m = ctx.m | combine({f: ns.node}) -%}{%- endif -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- endif -%}
      {%- set tl = namespace(m={}) -%}
      {%- set tr = par.tool_roles if (par is mapping and par.tool_roles is defined and par.tool_roles is mapping) else none -%}
      {%- set tf = par.tool_fields if (par is mapping and par.tool_fields is defined and par.tool_fields is mapping
                                       and par.tool_fields.path is defined and par.tool_fields.sha256 is defined) else none -%}
      {%- set ot = _wrp.bootstrap.os_tools if (_wrp.bootstrap.os_tools is defined and _wrp.bootstrap.os_tools is mapping) else none -%}
      {%- if tr is mapping and tf is mapping and ot is mapping -%}
      {%- for role, key in tr.items() -%}
      {%- set row = ot[key] if (key in ot and ot[key] is mapping) else none -%}
      {%- if row is mapping and row.path is defined and row.identity is defined and row.identity is mapping
             and row.identity.sha256 is defined -%}
      {%- set tl.m = tl.m | combine({role: {tf.path: row.path, tf.sha256: row.identity.sha256}}) -%}
      {%- else -%}{%- set ns.miss = ns.miss + ['tools.' ~ role] -%}{%- endif -%}
      {%- endfor -%}
      {%- else -%}{%- set ns.miss = ns.miss + ['tools'] -%}{%- endif -%}
      {{ {'parent': par, 'src': src, 'context_fields': cf, 'launch_context_fields': lf, 'context': ctx.m, 'tools': tl.m, 'missing': ns.miss} }}

- name: "LAUNCH-RECORD -- refuse an undeclared record source, parent, context or field token (before any digest)"
  ansible.builtin.assert:
    that:
      - _lr_src.parent is mapping
      - _lr_src.parent.digest_algorithm is string
      - _lr_src.src is mapping
      - _lr_src.src.record_keys is sequence and _lr_src.src.record_keys is not string
      - _lr_src.src.declaration_rel is string
      - _lr_src.context_fields is mapping
      - _lr_src.launch_context_fields is mapping
      - _lr_src.missing | length == 0
      - (_lr_src.src.record_keys | sort) == (C.harness.check_launch.fields.keys() | list | sort)
      - C.harness.check_launch.fields.values() | reject('in', C.harness.check_launch.tokens) | list | length == 0
      - lr_head is string
    fail_msg: >-
      {{ lookup('ansible.builtin.template', repo_root ~ _wrp.bootstrap.path_admission.separator ~ _wrp.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _hrf_grammar, 'rh_rf_code': C.harness.refusals.check_input,
                               'rh_rf_detail': [C.harness.texts.launch_record, lr_case,
                                                C.harness.check_launch.record_from | to_json, _lr_src.missing | to_json]}) | trim }}
    quiet: true

- name: "LAUNCH-RECORD -- admit the bound declaration path inside the fixture (declared grammar, ancestry, regular file)"
  ansible.builtin.include_tasks: admit_case_paths.yml
  vars:
    ap_root: "{{ lr_repo }}"
    ap_items: "{{ [{'rel': _lr_src.src.declaration_rel, 'need': C.harness.case_path_classes.file}] }}"
    ap_case: "{{ lr_case }}"

- name: "LAUNCH-RECORD -- digest the fixture's bound declaration (after the commit and its readback)"
  ansible.builtin.stat:
    path: "{{ lr_repo ~ _wrp.bootstrap.path_admission.separator ~ _lr_src.src.declaration_rel }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _lr_src.parent.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  register: _lr_decl

- name: "LAUNCH-RECORD -- build the typed record (each field from its declared token; types kept)"
  vars:
    _lr_tok: >-
      {{ {'fixture_head': lr_head, 'declaration_digest': _lr_decl.stat.checksum, 'early_context': _lr_src.context,
          'packaged_tools': _lr_src.tools} }}
  ansible.builtin.set_fact:
    _lrec: >-
      {%- set ns = namespace(r={}) -%}
      {%- for f, tok in C.harness.check_launch.fields.items() -%}
      {%- if tok == 'record_src' -%}{%- set ns.r = ns.r | combine({f: _lr_src.src[f]}) -%}
      {%- elif tok == 'record_parent' -%}{%- set ns.r = ns.r | combine({f: _lr_src.parent[f]}) -%}
      {%- else -%}{%- set ns.r = ns.r | combine({f: _lr_tok[tok]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.r }}
