  # B-INHERITED-OWNER-KEY (codex tick165/166): the host inherits the OWNER profile's ansible_ssh_private_key_file.
  # Every connection-plugin credential selector is bound explicitly from tr_conn (bind_key -> the contract key, or ''
  # when the mode takes none; clear -> ''), and the target plays bind them as play vars (which outrank inventory), so
  # the inherited owner key can never be the plugin's key on the privileged leg. KKEY/KCLR print the bound values.
