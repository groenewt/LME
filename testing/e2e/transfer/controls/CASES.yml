  # r5u-rf2 (codex-tick510 RF-OD-2): the contract refusal family omitted. decl_overrides is a recursive combine, which
  # can null a key but not delete it; both members nulled is the omitted-family form it can express (the guard's
  # `is defined and is mapping` refuses absence and null alike). The FIRST task of resolve_contract.yml refuses through
  # the family's parent diagnostic before any member is read: no undefined-variable error, no member code, no contract
  # value. The peer carries key-bearing values (key file content, an inline owner key marker) that must not appear.
  - id: K22-contract-refusal-family-omitted-refused
    kind: phase
    neighbour: K14-missing-host-mode-refused
    setup:
      - {file: '@cd@/id_priv', content: 'not a real key', mode: '0600'}
    phase:
      steps: {observe_controller_steps: [resolve_contract], observe_target_steps: [], stage_controller_steps: [], place_target_steps: []}
      k_vars: {lme_ssh_auth_mode: explicit_key, lme_privileged_key: '@cd@/id_priv', ansible_ssh_private_key: 'OWNER-INLINE-KEY-MARKER'}
      decl_overrides: {contract: {refusals: null, texts: null}}
    expect: {rc: fail, out: ['REFUSED TRANSFER-CONTRACT-FAMILY: transfer.contract.refusals / texts is not the declared refusal family', '{"refusals": null, "texts": null}'],
             out_absent: [KARGV, 'not a real key', 'MARKER', 'TRANSFER-CONTRACT-INPUT', 'is undefined', 'AnsibleUndefinedVariable']}

