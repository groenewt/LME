    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED, "'_tp_x'", "'tp_pre'"], out_absent: [KARGV]}

  # bare `tp` matches no family (the pattern needs the trailing '_<name>'): it is an EXACT reservation, refused by the
  # route's refuse_pinned_outputs.yml once C1's reserved_outputs lists it (this entry never derives tp).
  - id: E10-forged-extra-var-bare-tp-refused
    kind: phase
