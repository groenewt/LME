  # POSITIVE: the declared public namespaces (lme_* operational inputs, drv_* driver seams, transfer_dir,
  # decl_overrides) never match a family; extra benign names in them leave K01's run and its argv unchanged, and the
  # unchanged caller/callee pairs (entry -> tasks/*.yml, entry -> route tasks) still pass check (C00-check-neighbour).
  - id: E11-legitimate-namespace-extra-vars-admitted
