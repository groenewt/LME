  # ---- r5p GENERATION / RELOCATION (C1-S8-HARNESS-RELOCATE-KIND; R1 s8 GEN-S8-* / REL-S8-DEPTH; codex-tick451). The
  # ACTUAL generator under the declared genesis launch (kind `generation`). Every refusal case names GEN-S8-OWNER-KEY
  # as its neighbour and lists the EARLIER gates' codes in out_absent (source admission, builder admission, generation
  # record custody), so it cannot pass by refusing early. inputs: the names are the CASE-SOURCED typed stage_inputs of
  # the package stage (r5r proposal C1-R5R-4, superseding C1-R5P-H1: genesis.launch.stages.<stage>.stage_inputs
  # [{name, source}], source in genesis.launch.input_sources); each is rendered as ONE typed extra-vars word. The
  # source-bootstrap record (C1-R2K-CARRIER; key set = bootstrap_input.record_keys) is NOT a case input: the harness
  # builds it with launch_record.yml from the POST-MUTATION fixture head and places it as the LITERAL FINAL extra-vars
  # word (X-R2K-TSI-ORDER option 1, codex-tick473). These cases carry only rh_entry_operation and stay UNRUN: BLOCKED
  # until the R2j join (roster testing/e2e/transfer/entry_roster.yml, records, genesis admission), C1-R5R-4 (including
  # MAIN's generated-name collision admission node) and R2's r2l fresh-init sequence land.
  - id: GEN-S8-OWNER-KEY
    kind: generation
    status: OPEN
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
      # sha256 of B-r1 join-s8 expected/owner_key.yml: bound to the JOINED decl / template edition (R1 s8 + C1-R5M-4);
      # a later decl or template revision re-derives it (never edited to match an observed output)
      output_sha256: afe8c43277da20b8a897561fb1c8c0fad50315bf5ff9db86ea32a00731cc4af9
    expect: {rc: 0, out_absent: ['ENTRY-GENERATION-WITHHELD', 'Traceback', 'AnsibleUndefinedVariable']}

  - id: GEN-S8-MISSING-REMOTE
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate:
        - file: testing/e2e/transfer/transfer.decl.yml
          regexp: '^      remote: \{controller_operation: "hostvars\[''%\(host\)s''\]\.rh_cpq_host"\}\n'
          replace: ''
      output_rel: testing/remote_harness/controller_prereq.yml
    expect:
      rc: fail
      out: ['REFUSED ENTRY-GENERATION-WITHHELD:', 'testing/remote_harness/controller_prereq.yml', 'ENTRY-PLACEMENT-REMOTE', '(absent)']
      out_absent: ['Traceback', 'AnsibleUndefinedVariable', 'RH-BUILDER-UNSUPPORTED', 'RH-SOURCE-', 'TRANSFER-GENERATION-RECORD-',
                   'TRANSFER-GENERATION-ORPHAN-OUTPUT']

  - id: C-S6-R2-WITHHELD
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate:
        - file: testing/e2e/transfer/transfer.decl.yml
          regexp: '^(      owner_key\.yml:\n        output: generated\n        head: \[include, family)\]'
          replace: '\1, undeclared_role]'
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED ENTRY-GENERATION-WITHHELD:', 'testing/e2e/target_prereq/owner_key.yml']
      out_absent: ['Traceback', 'AnsibleUndefinedVariable', 'RH-BUILDER-UNSUPPORTED', 'RH-SOURCE-', 'TRANSFER-GENERATION-RECORD-',
                   'TRANSFER-GENERATION-ORPHAN-OUTPUT']

  # REL-S8-DEPTH, beyond depth (also covers C-S6-BEYOND-DISCOVERY): the whole entry directory (entry + bodies) moved to
  # depth 5 (> entry_forms.discovery.max_up 3); the decl and the roster follow the move. Generation refuses.
  - id: REL-S8-DEPTH-BEYOND
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate:
        - {from: testing/e2e/target_prereq, to: testing/e2e/deep/x/target_prereq}
      mutate:
        - {file: testing/e2e/transfer/transfer.decl.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/deep/x/target_prereq'}
        - {file: testing/e2e/transfer/entry_roster.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/deep/x/target_prereq'}
      output_rel: testing/e2e/deep/x/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED ENTRY-GENERATION-WITHHELD:', 'ENTRY-BEYOND-DISCOVERY', 'exceeds the route guard discovery of playbook_dir plus 3 ancestors']
      out_absent: ['Traceback', 'AnsibleUndefinedVariable', 'RH-BUILDER-UNSUPPORTED', 'RH-SOURCE-', 'TRANSFER-GENERATION-RECORD-',
                   'TRANSFER-GENERATION-ORPHAN-OUTPUT']

  # REL-S8-DEPTH, within depth: the same move to a sibling at depth 3 (== max_up; the family guard stays one level up).
  # Generation must PASS; the generated entry is placed at its relocated output_rel and run with the first declared
  # derived name (transfer entry_guard.derived: tr) pinned. The harness asserts REACHABILITY (the first task header of
  # entry_guard.guard_route_rel, read from the clone) separately from the refusal, and that no body task ran. The
  # refusal itself is the route's first guard (tr is an exact registry reserved_outputs name): its code is the route's
  # string (needle_pending R2), so out carries only the grammar marker.
  - id: REL-S8-DEPTH-WITHIN
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate:
        - {from: testing/e2e/target_prereq, to: testing/e2e/prereq_relocated}
      mutate:
        - {file: testing/e2e/transfer/transfer.decl.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/prereq_relocated'}
        - {file: testing/e2e/transfer/entry_roster.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/prereq_relocated'}
      output_rel: testing/e2e/prereq_relocated/owner_key.yml
      reach: {pin_value: x}
    expect:
      rc: fail
      out: ['REFUSED ']
      out_absent: ['Traceback', 'could not find or access', 'ENTRY-GENERATION-WITHHELD', 'RESERVED-FAMILY-REGISTRY']

  # r5u-rf3 (codex-tick518 RF2-PRELAUNCH-REACH-FALSE-PASS) CONTROL: REL-S8-DEPTH-WITHIN with an UNRELATED pre-launch
  # refusal injected (the output area is the protected clone directory `src`). Its rc / output expectations are the
  # reach case's own (rc fail + the bare grammar marker, which the injected refusal satisfies -- the rf2 false pass)
  # plus the injected site's code + text; expect.harness_failures (OD-f: harness.texts KEYS, whole-string equality)
  # REQUIRES the inner harness verdict to be FAILED by the reach discriminator with the declared text reach_prelaunch
  # (a captured refusal proves only the pre-launch stage). No clone, no generation, no reach.
  # r5u-rf4 (codex-tick526 RF3-INNER-FAILURE-CUSTODY / RF3-PRELAUNCH-VERDICT-SOURCE): the identity reach_prelaunch is
  # matched with its exact occurrence count (once); the verdict publishes ok (the negative assertion) beside inner
  # {failed: true, failures: [the reach_prelaunch text], reasons: [reach_prelaunch]}, stage pre_launch, the out_tail,
  # and no source / launch fields; the receipt lists it under pre_launch and inner_failed.
  - id: GEN-RF3-REACH-PRELAUNCH-REFUSED
    kind: generation
    status: OPEN
    neighbour: REL-S8-DEPTH-WITHIN
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: src, files: {operator_controller_inventory: inventory.yml}}
      relocate:
        - {from: testing/e2e/target_prereq, to: testing/e2e/prereq_relocated}
      mutate:
        - {file: testing/e2e/transfer/transfer.decl.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/prereq_relocated'}
        - {file: testing/e2e/transfer/entry_roster.yml, regexp: 'testing/e2e/target_prereq', replace: 'testing/e2e/prereq_relocated'}
      output_rel: testing/e2e/prereq_relocated/owner_key.yml
      reach: {pin_value: x}
    expect:
      rc: fail
      out: ['REFUSED ', 'REFUSED CONTROLS-CASE-PATH: the case generation.produce output area is not a declared-grammar case-relative path',
            'GEN-RF3-REACH-PRELAUNCH-REFUSED src ["src"]']
      out_absent: ['Traceback', 'could not find or access', 'ENTRY-GENERATION-WITHHELD', 'RESERVED-FAMILY-REGISTRY']
      harness_failures: [reach_prelaunch]
      absent: ['@cd@/src']

  # ---- r5u-rf2 PRODUCER / OUTPUT-AREA NEGATIVES (codex-tick510 RF-OD-4, RF-OD-5). Each refuses BEFORE the clone and
  # before any produced write (absent: the clone dir and the output area / redirected target), names its own site by
  # code + text, and lists the sibling sites' texts in out_absent. UNRUN, OPEN with the other generation cases.
  # RF-OD-4: acquire ADMITS controller_operation_binding by membership (stages.acquire.inventory), so the stage gate
  # passes (its text is out_absent); the kind's obligations (files lab_copy / run_binding, receipt run_binding_receipt)
  # have no declared producer here -> the explicit unsupported-combination refusal. This does NOT qualify the
  # receipt-bearing positive case, which stays with the measurement path (not satisfied here).
  - id: GEN-RF2-RECEIPT-KIND-UNSUPPORTED
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: acquire
      inputs: {}
      operator_inputs: {}
      produce: {kind: controller_operation_binding, area: produced, files: {lab_copy: lab.yml, run_binding: binding.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-GENERATION-LAUNCH-UNBOUND: the selected inventory kind declares an obligation this harness has no producer for',
            '["receipt", "run_binding_receipt"]']
      out_absent: ['the generation stage does not admit the case''s selected inventory kind', 'Traceback', 'AnsibleUndefinedVariable']
      absent: ['@cd@/src', '@cd@/produced']

  # RF-OD-5 duplicate: two roles name the same normalized path (the second would overwrite the first and both inventory
  # words would read the last bytes). The path gate runs before the stage gate, so the kind's stage membership is
  # never reached (its text is out_absent).
  - id: GEN-RF2-PRODUCED-PATH-DUPLICATE
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: run_binding_sources, area: produced, files: {operator_controller_inventory: inventory.yml, lab_copy: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: the case generation.produce output area is not a declared-grammar case-relative path', '["inventory.yml"]']
      out_absent: ['the generation stage does not admit the case''s selected inventory kind',
                   'the selected inventory kind declares an obligation this harness has no producer for', 'Traceback']
      absent: ['@cd@/src', '@cd@/produced']

  # RF-OD-5 protected collision: the output area IS the clone directory (a protected case artifact)
  - id: GEN-RF2-PRODUCED-AREA-PROTECTED
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: src, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: the case generation.produce output area is not a declared-grammar case-relative path', '["src"]']
      out_absent: ['the generation stage does not admit the case''s selected inventory kind',
                   'the selected inventory kind declares an obligation this harness has no producer for', 'Traceback']
      absent: ['@cd@/src']

  # RF-OD-5 traversal: a produced path that climbs out of the area (into the protected clone) is refused by the
  # EXISTING admission (admit_case_paths.yml: forbidden segment / containment) under the area root
  - id: GEN-RF2-PRODUCED-PATH-TRAVERSAL
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: ../src/inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: a case path is not an admitted fixture-relative path', '["../src/inventory.yml"]']
      out_absent: ['the case generation.produce output area is not a declared-grammar case-relative path',
                   'the generation stage does not admit the case''s selected inventory kind', 'Traceback']
      absent: ['@cd@/src', '@cd@/produced']

  # RF-OD-5 symlink: the output area is pre-planted as a link to the case directory (a write through it would land
  # beside the protected artifacts). The area is admitted `absent` (not even a link) by the EXISTING admission; the
  # link is the case's declared `setup` (generation accepts link entries only).
  - id: GEN-RF2-PRODUCED-AREA-SYMLINK
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    setup:
      - {link: '@cd@/produced', to: '@cd@'}
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: a case path is not an admitted fixture-relative path', '[["produced", "absent"]]']
      out_absent: ['the case generation.produce output area is not a declared-grammar case-relative path',
                   'the generation stage does not admit the case''s selected inventory kind', 'Traceback',
                   'a generation setup link is not an owned case fixture']
      absent: ['@cd@/src', '@cd@/inventory.yml']

  # ---- r5u-rf3 SETUP-LINK NEGATIVES (codex-tick518 RF2-SETUP-LINK-OUTSIDE-CASE). Every setup destination is admitted
  # (under the case directory, outside the protected artifacts and the other links, then the EXISTING admission:
  # grammar, forbidden segment, normalized containment, ancestry, absent) BEFORE any link; each negative verifies that
  # no link was created (absent, stat without following) and that nothing was cloned or produced. UNRUN, OPEN.
  # traversal: the destination climbs out of the case into a sibling of the case directory; it IS under the case
  # prefix by string, so the EXISTING admission refuses it (forbidden segment `..`) -- the setup gate's text is absent
  - id: GEN-RF3-SETUP-LINK-TRAVERSAL
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    setup:
      - {link: '@cd@/../GEN-RF3-SETUP-LINK-TRAVERSAL-sibling', to: '@cd@'}
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: a case path is not an admitted fixture-relative path', '["../GEN-RF3-SETUP-LINK-TRAVERSAL-sibling"]']
      out_absent: ['a generation setup link is not an owned case fixture', 'Traceback', 'AnsibleUndefinedVariable']
      absent: ['@cd@/../GEN-RF3-SETUP-LINK-TRAVERSAL-sibling', '@cd@/src', '@cd@/produced']

  # outside the case: the destination is a sibling path that merely shares the case directory's name as a prefix
  # (<cd>-outside, not <cd>/...): refused by the setup gate before the admission
  - id: GEN-RF3-SETUP-LINK-OUTSIDE-CASE
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    setup:
      - {link: '@cd@-outside', to: '@cd@'}
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: a generation setup link is not an owned case fixture', '["@cd@-outside"]']
      out_absent: ['a case path is not an admitted fixture-relative path', 'Traceback', 'AnsibleUndefinedVariable']
      absent: ['@cd@-outside', '@cd@/src', '@cd@/produced']

  # target outside the case: the destination is owned (@cd@/produced) but the link would point at the repository; the
  # hostile-link fixture must stay inside owned fixture space, so the setup gate refuses before any link
  - id: GEN-RF3-SETUP-TARGET-OUTSIDE-CASE
    kind: generation
    status: OPEN
    neighbour: GEN-S8-OWNER-KEY
    setup:
      - {link: '@cd@/produced', to: '@repo@'}
    generation:
      stage: package
      inputs: {}
      operator_inputs: {rh_entry_operation: generate}
      produce: {kind: operator_controller_inventory, area: produced, files: {operator_controller_inventory: inventory.yml}}
      relocate: []
      mutate: []
      output_rel: testing/e2e/target_prereq/owner_key.yml
    expect:
      rc: fail
      out: ['REFUSED CONTROLS-CASE-PATH: a generation setup link is not an owned case fixture', '[] ["@repo@"]']
      out_absent: ['a case path is not an admitted fixture-relative path', 'Traceback', 'AnsibleUndefinedVariable']
      absent: ['@cd@/produced', '@cd@/src']

  # ============================ brr-follow-s2 PJ-CONTROLS / U-12: genesis rows ============================
  # B CASES form of genesis controls-04 (a42e5265) / controls-04b (5037978a) rows, run by controls/genesis_case.yml.
  # Each row keeps the controls-04/-04b id (`binds`); ALL UNRUN. Every genesis_entry row refuses
  # CONTROLS-GENESIS-HOST-UNBOUND at pre_launch until MAIN's QEMU leg supplies the host binding (SC-S2-HOST); fixture
  # bytes other than `baseline` are the binding producer's (SC-S2-FIXTURE-BYTES). The other controls-04 rows are
  # fold_pending (controls.yml S2-FOLD-PENDING).

  # GEN2-01 (U-11 / OD-BRR-11 first half: the owned-fixture COLD install through the REAL installer path): the genesis
  # entry on a fresh_base host bound by MAIN's qualification-time binding (an owned checkout, owned passwd home, owned
  # seed root), cold store, one generation. GEN2-26 (bundle on a second fresh base) is fold_pending: it needs a declared
  # bundle relocation producer and a cross-host neighbour binding (controls.yml S2-U11-GEN2-26).
  - id: GEN2-01-COLD-REACH
    binds: {file: controls-04.yml, sha256: a42e5265601739971ad38caf4996618e31695555cc1d1bd606c3a383367f49a3, id: GEN2-01-COLD-REACH}
    kind: genesis_entry
    status: OPEN
    credit: cold
    host: fresh_base
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 1
      variants:
        - {fixture: baseline, inputs: {rh_entry_operation: generate}}
    expect:
      variants:
        - outcomes: [{ok: true}]
          out: ['GENESIS-STORE COLD', 'INSTALLED ', 'GENESIS-GENERATION ', 'SOURCE-RECORD ', 'GENESIS-ENTRY COMPLETE']
          out_absent: ['REFUSED', 'Traceback', 'AnsibleUndefinedVariable', 'UNCHANGED ']
          store: {published_distinct: true, published_covers_declared: true, removed_partial: 0, cold_markers: 1, generation_dirs: 1, same_generation: true}

  # GEN2-07A: two entries started together on ONE clone with distinct acts; NO designated winner. SYMMETRIC outcome
  # pairs (codex-tick556 GEN3-CONCURRENCY-WINNER-ASSUMPTION): (ok, ok) | (ok, RH-SEED-BUSY) | (RH-SEED-BUSY, ok); the
  # only admitted refusal is RH-SEED-BUSY at its declared status (controller.bootstrap.refusals); a double refusal or any
  # other code / status fails.
  - id: GEN2-07A-CONCURRENT-OVERLAP
    binds: {file: controls-04.yml, sha256: a42e5265601739971ad38caf4996618e31695555cc1d1bd606c3a383367f49a3, id: GEN2-07A-CONCURRENT-OVERLAP}
    kind: genesis_entry
    status: OPEN
    credit: cold
    host: fresh_base
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 2
      variants:
        - {fixture: baseline, inputs: {rh_entry_operation: generate}}
    expect:
      variants:
        - pairs:
            - [{ok: true}, {ok: true}]
            - [{ok: true}, {refusal: RH-SEED-BUSY}]
            - [{refusal: RH-SEED-BUSY}, {ok: true}]
          out_success: ['GENESIS-STORE ', 'GENESIS-GENERATION ', 'GENESIS-ENTRY COMPLETE']
          out_absent: ['RECOVERED-PARTIAL', 'PRESERVED-UNKNOWN', 'Traceback']
          store: {published_distinct: true, published_covers_declared: true, removed_partial: 0, cold_markers: 1, generation_dirs: 1, same_generation: true}

  # GEN2-07B: after BOTH GEN2-07A entries exited, a rerun with a new act on the SAME host (neighbour binding): warm
  # store, unchanged generation, no new publication (the cumulative log still has one published line per artifact and
  # exactly one generation dir exists: the 07A generation).
  - id: GEN2-07B-RETRY-AFTER-COMPLETION
    binds: {file: controls-04.yml, sha256: a42e5265601739971ad38caf4996618e31695555cc1d1bd606c3a383367f49a3, id: GEN2-07B-RETRY-AFTER-COMPLETION}
    kind: genesis_entry
    status: OPEN
    credit: warm
    host: prepared
    neighbour: GEN2-07A-CONCURRENT-OVERLAP
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 1
      variants:
        - {fixture: baseline, inputs: {rh_entry_operation: generate}}
    expect:
      variants:
        - outcomes: [{ok: true}]
          out: ['GENESIS-STORE WARM', 'UNCHANGED ', 'GENESIS-ENTRY COMPLETE']
          out_absent: ['REFUSED', 'INSTALLED ', 'RECOVERED-PARTIAL', 'PRESERVED-UNKNOWN']
          store: {published_distinct: true, published_covers_declared: true, removed_partial: 0, cold_markers: 0, generation_dirs: 1}

  # successor-06 S2-STORE-READBACK-FALSE-PASS (codex-572): negative controls of the STORE READBACK itself, through the
  # same genesis_case runner. MISSING: a fresh_base entry refused at usage (before the base phase: no store exists) --
  # the readback must report frame log_missing (never published_distinct over an empty log); the expectation declares
  # the frame only (an intentional pre-publication negative requires no publication). UNREADABLE: a successful cold
  # entry whose ops log gets the declared store_fault (mode store_faults.unreadable) AFTER the run -- the readback must
  # report frame log_unreadable (the cat failure is never masked). Both on their own fresh_base host (a store fault never
  # lands on a host a neighbour case reuses).
  - id: GEN-S2-STORE-LOG-MISSING
    binds: {relay: codex-572, item: S2-STORE-READBACK-FALSE-PASS, control: missing-ops-log}
    kind: genesis_entry
    status: OPEN
    credit: cold
    host: fresh_base
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 1
      variants:
        - {fixture: baseline, entry_args: ['--input-rh_entry_operation']}
    expect:
      variants:
        - outcomes: [{entry_refusal: usage}]
          out_absent: ['lme-genesis-entry: base', 'GENESIS-STORE']
          store: {frame: log_missing}

  - id: GEN-S2-STORE-LOG-UNREADABLE
    binds: {relay: codex-572, item: S2-STORE-READBACK-FALSE-PASS, control: unreadable-ops-log}
    kind: genesis_entry
    status: OPEN
    credit: cold
    host: fresh_base
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 1
      variants:
        - {fixture: baseline, inputs: {rh_entry_operation: generate}, store_fault: unreadable}
    expect:
      variants:
        - outcomes: [{ok: true}]
          out: ['GENESIS-ENTRY COMPLETE']
          out_absent: ['REFUSED', 'Traceback']
          store: {frame: log_unreadable}

  # GEN2-21: operator-input / argument negatives; every variant is the entry usage refusal (texts.duplicate rows refuse
  # BEFORE the base phase). entry_args are verbatim words after the declared arguments (no false pass: no variant of
  # this case expects success).
  - id: GEN2-21-OPERATOR-INPUT-NEGATIVES
    binds: {file: controls-04.yml, sha256: a42e5265601739971ad38caf4996618e31695555cc1d1bd606c3a383367f49a3, id: GEN2-21-OPERATOR-INPUT-NEGATIVES}
    kind: genesis_entry
    status: OPEN
    credit: warm
    host: prepared
    generation:
      stage: source_bootstrap
      isolation: shared
      concurrent: 1
      variants:
        - {fixture: baseline, entry_args: ['--input-rh_entry_operation', 'undeclared-value']}
        - {fixture: baseline}
        - {fixture: baseline, entry_args: ['--input-rh_entry_operation', 'generate', '--input-rh_entry_operation', 'verify']}
        - {fixture: baseline, inputs: {rh_entry_operation: generate}, entry_args: ['--act', 'GEN2-21-duplicate-act']}
        - {fixture: baseline, inputs: {rh_entry_operation: generate}, entry_args: ['--input-undeclared_name', 'x']}
        - {fixture: baseline, entry_args: ['--input-rh_entry_operation']}
    expect:
      variants:
        - {outcomes: [{entry_refusal: usage}], out_absent: ['lme-genesis-entry: base', 'GENESIS-STORE']}
        - {outcomes: [{entry_refusal: usage}], out_absent: ['lme-genesis-entry: base', 'GENESIS-STORE']}
        - {outcomes: [{entry_refusal: usage}], out_absent: ['lme-genesis-entry: base', 'GENESIS-STORE']}
