        regexp: '^(            ansible_connection: )[^\n]*$'
        replace: '\1"{{ ''ssh'' if ''controller_delegation.connection'' else ''local'' }}"'
    expect: {rc: fail, out: ['controller_ledger.yml] Re-admit the state directory''s ancestry at the use boundary (route''s ONE rule): owner-only route include testing/remote_harness/tasks/admit_ancestry.yml in target context after the PRIVILEGED contact']}

  # counterexample 2: a DESCENDANT override (here the admit_ancestry include's own parameter ansible_connection, which
  # outranks the inherited `apply` pin) recomputes the scope: target context, refused (no inherited OR).
  - id: C21-controller-scope-descendant-override-is-target-context
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/transfer/tasks/controller_ledger.yml
        regexp: '^(    rh_anc_refusal: TRANSFER-STATE-DIR\n)'
        replace: '\1    ansible_connection: ssh\n'
    expect: {rc: fail, out: ['controller_ledger.yml] Re-admit the state directory''s ancestry at the use boundary (route''s ONE rule): owner-only route include testing/remote_harness/tasks/admit_ancestry.yml in target context after the PRIVILEGED contact']}

  # counterexample 2b: a descendant BLOCK that re-delegates elsewhere under the pinned `apply` is target context too.
  - id: C22-controller-scope-descendant-block-redelegation-is-target-context
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/transfer/tasks/controller_ledger.yml
        regexp: '^- name: Re-admit the state directory''s ancestry at the use boundary \(route''s ONE rule\)\n  ansible\.builtin\.include_tasks: ([^\n]*)\n  vars:\n((?:    [^\n]*\n)+)'
        replace: "- name: redelegated block\n  delegate_to: other.example\n  block:\n    - name: Re-admit the state directory's ancestry at the use boundary (route's ONE rule)\n      ansible.builtin.include_tasks: \\1\n      vars:\n        rh_anc_bs: \"{{ _cl_bs }}\"\n        rh_anc_repo_root: \"{{ rh_repo_root }}\"\n        rh_anc_path: \"{{ _cl_state.dir }}\"\n        rh_anc_refusal: TRANSFER-STATE-DIR\n"
    expect: {rc: fail, out: ['controller_ledger.yml] Re-admit the state directory''s ancestry at the use boundary (route''s ONE rule): owner-only route include testing/remote_harness/tasks/admit_ancestry.yml in target context after the PRIVILEGED contact']}

  # B-CONTROLLER-SCOPE-INCLUDE-PRECEDENCE (codex 170810): an OUTER include parameter (ansible_connection: ssh on the
  # terminal controller_ledger include) outranks every task/block var below it (Ansible 2.19 include params > task
  # vars), so an inner block re-pinning the EXACT declared connection expression cannot make it controller-local:
  # target context, refused (the include-param layer is kept separate, never folded under block vars).
  - id: C23-controller-scope-outer-include-param-outranks-inner-block-pin
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/transfer/tasks/target_place.yml
        regexp: '^(        _cl_bs: [^\n]*\n)'
        replace: '\1        ansible_connection: ssh\n'
      - file: testing/e2e/transfer/tasks/controller_ledger.yml
        regexp: '^- name: Re-admit the state directory''s ancestry at the use boundary \(route''s ONE rule\)\n  ansible\.builtin\.include_tasks: ([^\n]*)\n  vars:\n((?:    [^\n]*\n)+)'
        replace: "- name: re-pinned block under an outer ssh include parameter\n  vars:\n    ansible_connection: \"{{ hostvars['localhost'].tr_bs.inventory.controller_delegation.connection }}\"\n  block:\n    - name: Re-admit the state directory's ancestry at the use boundary (route's ONE rule)\n      ansible.builtin.include_tasks: \\1\n      vars:\n        rh_anc_bs: \"{{ _cl_bs }}\"\n        rh_anc_repo_root: \"{{ rh_repo_root }}\"\n        rh_anc_path: \"{{ _cl_state.dir }}\"\n        rh_anc_refusal: TRANSFER-STATE-DIR\n"
    expect: {rc: fail, out: ['controller_ledger.yml] Re-admit the state directory''s ancestry at the use boundary (route''s ONE rule): owner-only route include testing/remote_harness/tasks/admit_ancestry.yml in target context after the PRIVILEGED contact']}

  # CREDENTIAL-SELECTORS-CLEAR (route audit; the genesis env.clear bug): credential_selectors' `clear` key must be read
  # by SUBSCRIPT; the attribute form is the dict METHOD (iterating it fails, `| bool` is False). C24 (positive, the
  # real render): the host inherits the 2.19 inline owner key and its passphrase, both in the non-empty clear list;
  # every cleared selector must be bound to '' (8 values, all empty) and neither marker may appear. The attribute
  # form fails the ansible_conn render (rc fail, no KCLR line). C25 (static): the attribute form is refused by
  # check.yml METHOD-ATTR before any run.
  - id: C24-credential-selectors-clear-takes-effect
    kind: phase
    neighbour: K17-inherited-owner-key-bound-to-privileged-key
    setup:
      - {file: '@cd@/id_priv', content: 'not a real key', mode: '0600'}
    phase:
      steps: {observe_controller_steps: [resolve_contract], observe_target_steps: [], stage_controller_steps: [], place_target_steps: []}
      k_vars: {lme_ssh_auth_mode: explicit_key, lme_privileged_key: '@cd@/id_priv',
               ansible_ssh_private_key: 'OWNER-INLINE-KEY-MARKER', ansible_ssh_private_key_passphrase: 'OWNER-INLINE-PASS-MARKER'}
    expect: {rc: 0, out: ['KKEY=@cd@/id_priv|@cd@/id_priv KCLR=||||||| KEND'], out_absent: [OWNER-INLINE-KEY-MARKER, OWNER-INLINE-PASS-MARKER, TRANSFER-CONTRACT]}

  - id: C25-credential-selectors-clear-attribute-read-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/transfer/templates/macros/transfer.j2
        regexp: '(\{%- for v in tr\.contract\.credential_selectors)\[''clear''\]'
        replace: '\1.clear'
    expect: {rc: fail, out: ['TRANSFER-CHECK-METHOD-ATTR', 'templates/macros/transfer.j2: .clear']}

  # GATE SEED LAUNCH (codex tick217 R1; transfer.decl.yml gate_launch, check.yml GATE-LAUNCH): deploy_gate.sh starts
  # the seed only through the route's bundle launcher and constructs no environment. Each negative inserts ONE
  # violation at the top of gate_seed_run (independent of the launcher call below it) and must be refused by FULL
  # VALUE: the direct call (C26), an env -i literal (C28), a nameref alias of the seed variable (C29), and a direct
  # call whose variable name is split by a backslash-newline continuation (C30; bash rejoins it, so must the check).
  - id: C26-gate-direct-seed-call-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '^(gate_seed_run\(\) \{\n)'
        replace: '\1  "$LME_CONTROLLER_SEED" run --root "$LME_CONTROLLER_ROOT" --ssh-auth "$LME_SSH_AUTH_MODE" -- "$@"\n'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'expansion $LME_CONTROLLER_SEED']}

  - id: C28-gate-env-vector-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '^(gate_seed_run\(\) \{\n)'
        replace: '\1  /usr/bin/env -i PATH=/usr/bin:/bin LC_ALL=C.UTF-8 true\n'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'env word /usr/bin/env']}

  - id: C29-gate-seed-nameref-alias-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '^(gate_seed_run\(\) \{\n)'
        replace: '\1  declare -n _s=LME_CONTROLLER_SEED; "$_s" run -- "$@"\n'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'statement naming LME_CONTROLLER_SEED: declare -n _s=LME_CONTROLLER_SEED;']}

  - id: C30-gate-split-seed-call-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '^(gate_seed_run\(\) \{\n)'
        replace: '\1  "$LME_CONTROLLER_\\\nSEED" run -- "$@"\n'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'expansion $LME_CONTROLLER_SEED']}

  # The launcher input itself (route R1 relay): every expansion of LME_CONTROLLER_LAUNCHER outside the absolute-path
  # test must be the ONE declared positional call (gate_launch.launch_call_regex, exactly launch_call_count). A second
  # launcher call in another shape is refused by statement (C32); the old seed separator `--` in the call breaks the
  # caller_argv shape: 0 declared calls and a refused statement (C33).
  - id: C32-gate-extra-launcher-statement-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '^(gate_seed_run\(\) \{\n)'
        replace: '\1  "$LME_CONTROLLER_LAUNCHER" run "$LME_CONTROLLER_ROOT" explicit_key "$@"\n'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'launcher statement: "$LME_CONTROLLER_LAUNCHER" run "$LME_CONTROLLER_ROOT" explicit_key "$@"']}

  - id: C33-gate-launcher-call-shape-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '"\$LME_CONTROLLER_LAUNCHER" run "\$LME_CONTROLLER_ROOT" "\$LME_SSH_AUTH_MODE" -i '
        replace: '"$LME_CONTROLLER_LAUNCHER" run "$LME_CONTROLLER_ROOT" "$LME_SSH_AUTH_MODE" -- -i '
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'launcher calls 0 != 1', 'launcher statement: "$LME_CONTROLLER_LAUNCHER" run "$LME_CONTROLLER_ROOT" "$LME_SSH_AUTH_MODE" -- -i ']}

  # B-R1-CONTROL-QUOTING (codex 202245): ONE interior argument of the call unquoted (word splitting / globbing on
  # $REMOTE_DIR). The earlier launch_call_regex (an unrestricted `.*` between the fixed prefix and "$@") ACCEPTED this
  # text; the quoted-token grammar refuses it: 0 declared calls and the call statement refused.
  - id: C34-gate-launcher-unquoted-argument-refused
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/deploy_gate.sh
        regexp: '-e "lme_transfer_remote_dir=\$REMOTE_DIR"'
        replace: '-e lme_transfer_remote_dir=$REMOTE_DIR'
    expect: {rc: fail, out: ['TRANSFER-GATE-LAUNCH', 'launcher calls 0 != 1', 'launcher statement: "$LME_CONTROLLER_LAUNCHER" run "$LME_CONTROLLER_ROOT" "$LME_SSH_AUTH_MODE" -i ']}

  # The launcher is invoked by an ABSOLUTE path only (caller_argv; a bare or relative value would be resolved by the
  # gate's ambient PATH / cwd, and bash would then hand the launcher an absolute $0, so its own check cannot see it).
  # The value here is relative and EXISTS (<case>/bundle/<launcher_file>, the gate case's cwd is <case>), so the
  # refusal is the gate's input rule, not a missing file: nothing is executed.
  - id: C31-gate-relative-launcher-refused
    kind: gate
    neighbour: G02-contract-loaded-exact-seed-argv
    gate: {host: tgt, label: g, remote_dir: /srv/lme, launcher: bundle/lme-seed-launch.sh, calls: [resolve_target_contract],
           contract_identity: 0123456789abcdef0123456789abcdef, endpoint_identity: 0123456789abcdef0123456789abcdef}
    expect: {rc: 0, out: ['CALL resolve_target_contract rc=1'], absent: ['@cd@/seed.calls'],
             file_has: [{path: '@cd@/gate.results.jsonl', text: 'TRANSFER_INPUT_NOT_ABSOLUTE: LME_CONTROLLER_LAUNCHER'}]}

  # C27 -- ARGV/ENVIRONMENT-CONSTRUCTION PROOF ONLY (recording stand-in seed; the real seed apply on the final bundle
  # proves compatibility separately). The gate launches through route's launcher -- rendered by run_one_case.yml from
  # controller.bootstrap.seed_launcher.template_rel with the RESOLVED policy into <case>/bundle/<bundle.launcher_file>,
  # the stand-in at <case>/bundle/<bundle.seed_file> beside it; not an admitted bundle -- under a hostile ambient
  # environment: shadow env/getent/id/realpath/sh lead PATH, LC_ALL/LANG are POSIX, HOME / XDG_RUNTIME_DIR /
  # DBUS_SESSION_BUS_ADDRESS / USER are foreign and SSH_AUTH_SOCK is set. The stand-in records its exact initial
  # environment (launch order) and its %q argv. Expected: exactly PATH LC_ALL HOME (seed_launch.env.order; base_env
  # values; HOME equal to the INDEPENDENT passwd-home oracle @passwd_home@ (run_controls.yml PASSWD-HOME, the getent
  # module; never the launcher's own value), never the caller's) -- plus SSH_AUTH_SOCK with the caller's value ONLY in the
  # carried-agent mode (C27b), never otherwise (C27a); no shadow tool runs; argument boundaries (a word with a space,
  # an empty word, a trailing '=') reach the seed unchanged, and the seed receives the seed_launch argv
  # (run --root <root> --ssh-auth <mode> -- <args>) built by the launcher from the gate's positional call.
  - id: C27a-gate-launch-hostile-ambient-no-agent
    kind: gate
    neighbour: G02-contract-loaded-exact-seed-argv
    gate:
      host: tgt
      label: g
      remote_dir: /srv/lme
      auth_mode: explicit_key
      record_env: true
      hostile:
        shadow_tools: [env, getent, id, realpath, sh]
        env: {LC_ALL: POSIX, LANG: POSIX, HOME: /nonexistent/foreign-home, XDG_RUNTIME_DIR: /nonexistent/foreign-xdg,
              DBUS_SESSION_BUS_ADDRESS: 'unix:path=/nonexistent/foreign-bus', USER: not-the-invoker,
              SSH_AUTH_SOCK: /nonexistent/hostile-agent.sock}
      calls: ["gate_seed_run resolve_target.yml -e 'lme_x=a b' '' -e 'lme_y='"]
      contract_identity: 0123456789abcdef0123456789abcdef
      endpoint_identity: 0123456789abcdef0123456789abcdef
    expect:
      rc: 0
      absent: ['@cd@/shadow.calls']
      file_has:
        - {path: '@cd@/seed.env', text: 'ENVNAMES PATH LC_ALL HOME END'}
        - {path: '@cd@/seed.env', text: "\nHOME=@passwd_home@\n"}      # the independent PASSWD-HOME oracle, whole line
        - {path: '@cd@/seed.env', text: 'PATH=/usr/bin:/bin'}
        - {path: '@cd@/seed.env', text: 'LC_ALL=C.UTF-8'}
        - {path: '@cd@/seed.calls', text: 'run --root @cd@/ctlroot --ssh-auth explicit_key -- -i @cd@/inventory.json @repo@/testing/e2e/transfer/resolve_target.yml'}
        - {path: '@cd@/seed.calls', text: '-e lme_transfer_remote_dir=/srv/lme -e lme_x=a\ b '''' -e lme_y= '}
      file_lacks:
        - {path: '@cd@/seed.env', text: 'SSH_AUTH_SOCK'}
        - {path: '@cd@/seed.env', text: '/nonexistent/foreign-home'}
        - {path: '@cd@/seed.env', text: 'XDG_RUNTIME_DIR'}
        - {path: '@cd@/seed.env', text: 'DBUS_SESSION_BUS_ADDRESS'}
        - {path: '@cd@/seed.env', text: 'USER='}
        - {path: '@cd@/seed.env', text: 'LANG='}
        - {path: '@cd@/seed.env', text: 'POSIX'}
        - {path: '@cd@/seed.env', text: 'shadow'}

  - id: C27b-gate-launch-hostile-ambient-carried-agent
    kind: gate
    neighbour: C27a-gate-launch-hostile-ambient-no-agent
    gate:
      host: tgt
      label: g
      remote_dir: /srv/lme
      auth_mode: agent
      record_env: true
      hostile:
        shadow_tools: [env, getent, id, realpath, sh]
        env: {LC_ALL: POSIX, LANG: POSIX, HOME: /nonexistent/foreign-home, XDG_RUNTIME_DIR: /nonexistent/foreign-xdg,
              DBUS_SESSION_BUS_ADDRESS: 'unix:path=/nonexistent/foreign-bus', USER: not-the-invoker,
              SSH_AUTH_SOCK: /nonexistent/carried-agent.sock}
      calls: ["gate_seed_run resolve_target.yml -e 'lme_x=a b' '' -e 'lme_y='"]
      contract_identity: 0123456789abcdef0123456789abcdef
      endpoint_identity: 0123456789abcdef0123456789abcdef
    expect:
      rc: 0
      absent: ['@cd@/shadow.calls']
      file_has:
        - {path: '@cd@/seed.env', text: 'ENVNAMES PATH LC_ALL HOME SSH_AUTH_SOCK END'}
        - {path: '@cd@/seed.env', text: "\nHOME=@passwd_home@\n"}      # the independent PASSWD-HOME oracle, whole line
        - {path: '@cd@/seed.env', text: 'SSH_AUTH_SOCK=/nonexistent/carried-agent.sock'}
        - {path: '@cd@/seed.env', text: 'PATH=/usr/bin:/bin'}
        - {path: '@cd@/seed.env', text: 'LC_ALL=C.UTF-8'}
        - {path: '@cd@/seed.calls', text: 'run --root @cd@/ctlroot --ssh-auth agent -- -i @cd@/inventory.json @repo@/testing/e2e/transfer/resolve_target.yml'}
        - {path: '@cd@/seed.calls', text: '-e lme_transfer_remote_dir=/srv/lme -e lme_x=a\ b '''' -e lme_y= '}
      file_lacks:
        - {path: '@cd@/seed.env', text: '/nonexistent/foreign-home'}
        - {path: '@cd@/seed.env', text: 'XDG_RUNTIME_DIR'}
        - {path: '@cd@/seed.env', text: 'DBUS_SESSION_BUS_ADDRESS'}
        - {path: '@cd@/seed.env', text: 'USER='}
        - {path: '@cd@/seed.env', text: 'LANG='}
        - {path: '@cd@/seed.env', text: 'POSIX'}
        - {path: '@cd@/seed.env', text: 'shadow'}

  # B-R1-CONTROL-PASSWD-HOME (codex 202245): a WRONG-HOME launcher. This case's launcher is rendered from the resolved
  # policy with ONE deliberate mutation (seed_launch.derive.home.field 7: the passwd SHELL field instead of the home),
  # so the seed receives a HOME that is neither the caller's hostile value nor the passwd home. The earlier C27
  # control (HOME named in ENVNAMES + not the one foreign value) is satisfied by this wrong launcher (the first
  # file_has / file_lacks pair below restates it); the independent PASSWD-HOME oracle is NOT (file_lacks the exact
  # "\nHOME=<passwd home>\n" line): the case passes only when the recorded HOME differs from the oracle, i.e. when the
  # C27a/b oracle line would refuse this launcher. Fixture mutation of a case-dir render only; never a bundle.
  - id: C35-gate-launch-wrong-home-caught-by-passwd-oracle
    kind: gate
    neighbour: C27a-gate-launch-hostile-ambient-no-agent
    gate:
      host: tgt
      label: g
      remote_dir: /srv/lme
      auth_mode: explicit_key
      record_env: true
      launcher_policy_mutation: {seed_launch: {derive: {home: {field: 7}}}}
      hostile:
        shadow_tools: [env, getent, id, realpath, sh]
        env: {HOME: /nonexistent/foreign-home}
      calls: [resolve_target_contract]
      contract_identity: 0123456789abcdef0123456789abcdef
      endpoint_identity: 0123456789abcdef0123456789abcdef
    expect:
      rc: 0
      absent: ['@cd@/shadow.calls']
      file_has:
        - {path: '@cd@/seed.env', text: 'ENVNAMES PATH LC_ALL HOME END'}
        - {path: '@cd@/seed.env', text: "\nHOME=/"}
      file_lacks:
        - {path: '@cd@/seed.env', text: '/nonexistent/foreign-home'}
        - {path: '@cd@/seed.env', text: "\nHOME=@passwd_home@\n"}

  # ... and so is a root play that binds the module temp the contact owns (a play var would be a second authority).
  - id: C18-root-play-binds-remote-tmp
    kind: check
    neighbour: C00-check-neighbour
    mutate:
      - file: testing/e2e/transfer/transfer.yml
        regexp: '^(- name: place-target\n(?:  [^\n]*\n)*?  vars:\n)'
        replace: "\\1    ansible_remote_tmp: /var/tmp/x\n"
    expect: {rc: fail, out: ['transfer.yml:place-target: root target play binds ansible_remote_tmp (the PRIVILEGED contact owns it)']}

  # ---------------- exclusions (the one macro) ----------------
  - id: X01-nested-exclusions
    kind: regex
    excluded: [.git/HEAD, a/b/.git/config, ansible/roles/x/__pycache__/m.cpython-313.pyc, deep/x.pyc,
               src/node_modules/p/i.js, .ocr/index/MASTER.md, tools/.ocr/y, vm/disk.qcow2, a/scratchpad/n.txt,
               config/lme-environment.env, config/lme-environment.env/extra, x/offline_resources/b.tar,
               .lme-transfer/owned.sha256, sub/.lme-transfer/x]
    kept: [config/lme-environment.env.example, config/example.env, ansible/roles/x/tasks/main.yml, my.git/x,
           node_modules_x/y, pycache/x.py, x.pyc.txt, a/scratchpad2/n, image.img.sha256, offline_resourcesX/y]
    expect: {rc: 0}

  # ---------------- B2-OWNED-SOURCE-EDITION: the source ----------------
  - id: S01-real-archive-members
    kind: phase
    phase:
      steps: {observe_target_steps: [], place_target_steps: []}
    expect:
      rc: 0
      archive:
        excluded_prefixes: [.ocr/, .superpowers/, testing/]  # independent of the macro: the committed paths it must drop
        must_contain: [install.sh, ansible/site.yml, scripts/wipe_lme.sh]
        blob_equal: [install.sh, scripts/wipe_lme.sh]  # tar member bytes == git blob of HEAD

  - id: S02-dirty-source
    kind: phase
    neighbour: S01-real-archive-members
    phase: {src: clone}
    setup:
      - {file: '@cd@/src/README.md', content: 'dirty', mode: '0644'}
    expect: {rc: fail, out: [TRANSFER-SOURCE-DIRTY], dir_empty: ['@cd@/state']}

  - id: S03-substituted-source
    kind: phase
    neighbour: S01-real-archive-members
    phase: {src: clone, substitute: true}
    expect: {rc: fail, out: [TRANSFER-SOURCE-SUBSTITUTED], dir_empty: ['@cd@/state']}

  # untracked, not-ignored source file (MAIN/RS finding 3): source_admit's status argv is the declared
  # tr.controls_source.status_args, so an untracked file refuses exactly like a tracked edit (S02); nothing is staged.
  # The file sits in a NEW directory, which `--untracked-files=normal` reports collapsed ("?? ansible/extra/").
  - id: S04-untracked-source-refused
    kind: phase
    neighbour: S01-real-archive-members
    phase: {src: clone}
    setup:
      - {dir: '@cd@/src/ansible/extra', mode: '0755'}
      - {file: '@cd@/src/ansible/extra/untracked.yml', content: 'x: 1', mode: '0644'}
    expect:
      rc: fail
      out: [TRANSFER-SOURCE-DIRTY, ansible/extra/]
      absent: ['@cd@/tgt/srv/lme/install.sh', '@cd@/tgt/srv/lme/ansible/extra/untracked.yml']
      dir_empty: ['@cd@/state']

  # B-COMMIT-INDEX-RACE (codex tick165/166): the index moves between source_admit's observation and source_stage's
  # binding (a concurrent `git add`; phase_driver tamper). Membership/blob ids are the admitted commit's tree, so a
  # staged edit refuses (the archived bytes are not the tree blob) and a staged new path is never shipped.
  - id: S05-index-edit-staged-between-observations-refused
    kind: phase
    neighbour: S01-real-archive-members
    phase: {src: clone, runs: [{tamper: index_stage_edit}]}
    expect:
      rc: fail
      out: ['TRANSFER-SOURCE-BINDING', 'TRANSFER-STAGE-FAILED']
      absent: ['@cd@/tgt/srv/lme/install.sh']
      file_has: [{path: '@cd@/state/operations.log', text: 'fail '}]
      dir_empty: ['@cd@/state/pending']

  - id: S06-index-new-path-staged-between-observations-not-shipped
    kind: phase
    neighbour: S01-real-archive-members
    phase: {src: clone, runs: [{tamper: index_add_new}]}
    expect:
      rc: 0
      absent: ['@cd@/tgt/srv/lme/lme-index-only.txt']
      present: ['@cd@/tgt/srv/lme/install.sh']
      file_lacks: [{path: '@cd@/tgt/srv/lme/.lme-transfer/owned.sha256', text: 'lme-index-only.txt'}]

  # ---------------- REMOTE_DIR admission + target dependencies ----------------
  - id: T01-dotdot-remote-dir
    kind: phase
