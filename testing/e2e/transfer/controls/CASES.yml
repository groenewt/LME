                 {path: '@cd@/tgt/srv/lme/.lme-transfer/edition.json', text: '"completed_by": "@token@"'}]
      line_count: [{path: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', regex: '^complete ', n: 2},
                   {path: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', regex: '^start @op_grammar@ @token@$', n: 2},
                   {path: '@cd@/state/operations.log', regex: '^complete ', n: 2}]
      dir_empty: ['@cd@/state/pending', '@cd@/tgt/srv/lme/.lme-transfer/staging', '@cd@/tgt/srv/lme/.lme-transfer/incoming', '@cd@/tgt/srv/lme/.lme-transfer/ops']
      owned_check: '@cd@/tgt/srv/lme'

  - id: D09c-target-staging-bounded
    kind: phase
    neighbour: U01-edition-unchanged-rerun
    setup:
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-cccccccccccc', mode: '0700'}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-cccccccccccc/x', content: 'foreign in-flight', mode: '0600'}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', mode: '0600',
