    phase: {remote_dir: '@cd@/tgt/srv/../lme'}
    expect: {rc: fail, out: ['TRANSFER-REMOTE-DIR:'], absent: ['@cd@/tgt/lme', '@cd@/tgt/srv/lme'], dir_empty: ['@cd@/state/pending']}

  - id: T02-symlinked-ancestor
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    setup:
      - {dir: '@cd@/tgt/real', mode: '0755'}
      - {link: '@cd@/tgt/via', to: '@cd@/tgt/real'}
    phase: {remote_dir: '@cd@/tgt/via/lme'}
    expect: {rc: fail, out: [TRANSFER-REMOTE-DIR-ANCESTRY], absent: ['@cd@/tgt/real/lme'], dir_empty: ['@cd@/state/pending']}

  - id: T03-group-writable-ancestor
    kind: phase
