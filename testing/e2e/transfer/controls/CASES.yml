  # B-INHERITED-OWNER-KEY residual (codex 150646): the host inherits the owner profile's FILE key AND a 2.19 INLINE
  # key (ansible_ssh_private_key; checked before private_key_file by the plugin). The consume-contract play runs ONE raw
  # task through the real ssh connection plugin with the target plays' exact bindings; contract.ssh_client is a
  # recording client (fixture: writes its argv, exits 0; nothing is contacted). Discriminating: with the inline key
  # NOT cleared the plugin refuses before the client runs (SSH_AGENT none: 'Failed to add configured private key'),
  # so ssh.argv is absent; cleared, the argv carries the plugin's own IdentityFile="<contract key>" (bind_key), never
  # the owner key, and PasswordAuthentication=no (password selectors cleared). The key marker is never printed.
  - id: K19-plugin-consumes-only-contract-key-inline-owner-key-cleared
    kind: phase
    neighbour: K17-inherited-owner-key-bound-to-privileged-key
    setup:
      - {file: '@cd@/id_priv', content: 'not a real key', mode: '0600'}
      - {file: '@cd@/id_owner', content: 'not a real key (owner profile)', mode: '0600'}
      - {file: '@cd@/rec-ssh', mode: '0755', content: "#!/bin/sh\nfor a in \"$@\"; do printf '%s\\n' \"$a\"; done >> '@cd@/ssh.argv'\nexit 0"}
    phase:
      steps: {observe_controller_steps: [resolve_contract], observe_target_steps: [], stage_controller_steps: [], place_target_steps: []}
      k_vars: {lme_ssh_auth_mode: explicit_key, lme_privileged_key: '@cd@/id_priv', ansible_ssh_private_key_file: '@cd@/id_owner',
               ansible_ssh_private_key: 'OWNER-INLINE-KEY-MARKER', ansible_private_key_passphrase: 'OWNER-INLINE-PASS-MARKER'}
      decl_overrides: {contract: {ssh_client: '@cd@/rec-ssh'}}
      consume_probe: true
    expect:
      rc: 0
      out: [KCONSUMED]
      out_absent: [OWNER-INLINE-KEY-MARKER, OWNER-INLINE-PASS-MARKER, id_owner, 'Failed to add configured private key', TRANSFER-CONTRACT]
      file_has: [{path: '@cd@/ssh.argv', text: 'IdentityFile="@cd@/id_priv"'},
                 {path: '@cd@/ssh.argv', text: 'PasswordAuthentication=no'}]
      file_lacks: [{path: '@cd@/ssh.argv', text: 'id_owner'}, {path: '@cd@/ssh.argv', text: 'MARKER'}]

  - id: K20-plugin-consumes-no-key-when-mode-takes-none-inline-owner-key-cleared
    kind: phase
