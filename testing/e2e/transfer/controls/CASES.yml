---
# testing/e2e/transfer/controls/CASES.yml -- the declared controls for the deploy_gate target contract and
# transfer (WP1A round 2). Runner: controls/run_controls.yml (generic). Placeholders in phase and gate data are
# replaced by the runner: @cd@ becomes this case's directory, @src@ the shared clean clone, and @token@ the phase
# driver's controller writer token (a ledger `start <op> <token>` line with it is THIS controller's).
# status: OPEN marks a declared regression that stays open until the joined controls run (TR01); it is listed in
# the receipt's `open`, never in `covered`, and a refusal never covers it.
#
# kinds:
#   check        copies the entry playbooks, B's task files, deploy_gate.sh and the four route include files to
#                their real relative paths, applies the declared mutations (Python `re`, MULTILINE), and runs
#                check.yml on the copy. C00 is the unmutated neighbour of every check case. r5p/r5q: the copy is
#                committed as its own one-commit repository (X-R1-S9-4), so check needs -e allow_git_fixture=true
#                (harness.kinds.check.git_fixture own_commit).
#   regex        evaluates the exclusion_regex macro on the declared decl against declared paths.
#   phase        runs phase_driver.yml (a phase DIAGNOSTIC, narrower than integration; see phase_driver.yml)
#                against a clean clone of HEAD. Policy = the route's resolve_policy.yml (resolved `rh`); no managed
#                generation. The target is a local stand-in, and decl_overrides narrows privilege uid and owner uids
#                to the local user. Needs -e allow_git_fixture=true and C1's registry/projection (else refused).
#   gate         sources the real deploy_gate.sh, with a fake seed (executor test double) and a fake ssh. This
#                checks the wrapper's argv, rc and output handling only.
#   scope        runs controls/scope_case.yml: the SYNTHETIC schema-3 projections of harness.scope_fixture, patched
#                per case, through B's real scope task files (B-PER-HOST-POLICY-BINDING). No resolver, no transport.
#   source       runs controls/source_case.yml: SOURCE-REF admission (controls/source_ref.yml) and the checked clone
#                (controls/source_clone.yml) against a LOCAL FIXTURE clone of this repository (not the candidate).
#                Every refusal must leave no candidate clone. SR05 is the non-vacuity control: a mutated copy of
#                run_controls.yml that runs a phase selection with an unused source must refuse
#                CONTROLS-SOURCE-VACUOUS. Needs -e allow_git_fixture=true.
#   generation   (r5p; C1-S8-HARNESS-RELOCATE-KIND) runs the route GENERATOR (the package.yml stage) under the DECLARED
#                genesis launch (controller.bootstrap.genesis.launch: env -i pairs, builder, controller-only inventory,
#                act = case id, declared stage inputs) in a per-case clone of the admitted source; a relocating /
#                mutating case commits its fixture in that clone first (parent = the admitted commit). Expectations
#                read the generator's output; output_sha256 compares the mirror bytes; reach places the generated
#                entry at output_rel and runs it with the first declared derived name pinned (first-guard task header =
#                reachability, asserted separately from the refusal). Needs -e allow_git_fixture=true, the R2j join
#                (roster, records, genesis admission) and C1-R5R-4 (typed stage inputs, declared template slots, the
#                launch envelope; r5r, superseding C1-R5P-H1); refused before any launch otherwise (typed obstruction).
#   integration  DECLARED, NOT RUN here. It needs MAIN's real seed-built throwaway generation (package.yml
#                bundle, seed apply, a root under an owned $HOME subdirectory) and a real target. Never counted
#                as green.
# expect vocabulary: rc (0 | fail), out / out_absent (substrings of stdout+stderr), present / absent (paths),
#   file_has / file_lacks ({path, text}), line_count ({path, regex, n}), dir_empty (paths), owned_check (a deployment root whose
#   .lme-transfer/owned.sha256 must verify), archive (S01 only; independent member expectations).
harness:
  python: /usr/bin/python3
  ansible_playbook: /usr/bin/ansible-playbook
  ansible_config: /usr/bin/ansible-config          # SOURCE-REF load binding (check A): the config dump
  flock: /usr/bin/flock                            # hold_lock runs (D09c): the runner holds the target's state lock
  work_root_rule: >-
    default <checkout>/<work_roots.root_rel>/<sub_roots.run>/<runners.transfer_controls> from the RESOLVED policy
    (resolve_work_root.yml; -e work_root overrides); admitted by path_admission (regex, forbidden segments; ancestry
    through the route's ONE rule testing/remote_harness/tasks/admit_ancestry.yml incl. owner_private_group) and
    work_roots.admission.refused_prefixes;
    inside the checkout it must be git-ignored; SOURCE-REF's "inside the source" excludes <source>/<root_rel>/
    (CONTROLS-WORK-ROOT; free bytes, inodes and fs type are the run-local seed's admission, not this runner's)
  check_copy:                                     # paths copied for check cases (repository-relative)
    - testing/e2e/deploy_gate.sh
    - testing/e2e/transfer
    - testing/remote_harness/tasks/admit_ancestry.yml
    - testing/remote_harness/tasks/decide_private_group.yml
    - testing/remote_harness/tasks/initial_contact.yml
    - testing/remote_harness/tasks/refuse_pinned_outputs.yml
    - testing/remote_harness/tasks/resolve_policy.yml
    - testing/remote_harness/tasks/resolve_harness.yml
    - testing/remote_harness/tasks/verify_toolchain_receipt.yml
    # r5h (codex-tick417 bounded unfreeze, defect 1): the declared fixture INPUT CLOSURE of the entry_sets verifier
    # (transfer.decl.yml entry_sets: every <dir>/<file> member and every generated play body is read by
    # templates/macros/transfer.j2 from repo_root); without these the copied structural case cannot reach them
    - testing/e2e/target_prereq/prereq_observe.yml
    - testing/e2e/target_prereq/owner_key.yml
    - testing/remote_harness/target_prereq.yml
    - testing/remote_harness/controller_prereq.yml
    # brr-follow-s2 J-RNP-01 (X-R1-R5M-2 containment): the two RENDERED entry_sets members (transfer.decl.yml
    # entry_sets testing/remote_harness, output rendered; no plays, so no body dir). GENERATED by the genesis render, so
    # the copy source exists only after it (as controller_prereq.yml above): until then C00 refuses on the absent
    # source -- never skipped. Lands in the SAME apply as the transfer.decl.yml S2-RNP-DECL records.
    - testing/remote_harness/lme-genesis-entry.sh
    - testing/remote_harness/source_bootstrap.yml
    - testing/e2e/target_prereq/entry_bodies
    - testing/remote_harness/entry_bodies
    # r5m (codex-tick430-434 fixture_closure; transfer.decl.yml fixture_closure.guard_inputs): the first guard
    # refuse_pinned_outputs.yml discovers the profile from a generated entry, then ../global.yml. Both are C1-owned
    # check-fixture INPUTS (C1-R5M-6), never outputs. Both exist in the candidate m1-1 tree that also carries the route
    # and target_prereq.yml (b278443b), i.e. the same copy source as every entry above. Key names checked only, values
    # not read: global.yml top keys lme_global / lme_config_registry / legacy_service_override_projection; the profile
    # has secret-word keys token_regex / token / token_in (grammar) and passphrase (:2019, a contract key). Both are
    # tracked committed policy files the harness already resolves. brr-follow (codex-tick522 OD-S2-08 a): R4's
    # testing/remote_harness/controller_prereq.yml joins above in THIS join (its body dir is under
    # testing/remote_harness/entry_bodies); it is a GENERATED output, so the copy source exists only after the declared
    # first generation (OD-BRR-02): until then C00 refuses on the absent source -- never skipped.
    - manifests/profiles/remote-harness.yml
    - manifests/global.yml
  # r5p X-R1-S9-4 (R1 s9 c1-proposals X-R1-S9-4; codex-tick446 option c): check.yml play 1 includes the R2 early-view
  # producer (admit_loader_source.yml), so the check fixture also carries the PRODUCER CLOSURE. Every member is SOURCED
  # by key path from its declaration (run_one_case.yml resolves and refuses an absent / mistyped node, CONTROLS-CHECK-INPUT),
  # never restated here: the producer (transfer structural_check.early_view.producer_rel), its git admission include
  # (bootstrap source_admission.git.include_rel), the shared refusal grammar entry / macros check.yml frames through, and
  # every source_admission member (registry, profile, engine filter plugins, resolve role files). The copy is then
  # committed as its own one-commit repository (the producer admits HEAD == edition, tracked blobs only).
  check_copy_sourced:
    transfer: [[structural_check, early_view, producer_rel]]
    bootstrap_paths: [[source_admission, git, include_rel], [refusal_grammar, entry_rel], [refusal_grammar, macros_rel]]
    bootstrap_lists: [[source_admission, members_rel]]
  # the launcher record check.yml requires as the LAST -e word (R2 r2k admit_loader_source.yml :54-66; the seed's
  # run-local launcher record). record_var is R2's interface constant (needle_pending R2; C1-R5P-7 asks for it to be
  # declared beside bootstrap_input). record_from = the key path of the bound declaration's bootstrap_input under the
  # RESOLVED controller.bootstrap; fields = record key -> source token (record_src: that node's same-named field;
  # record_parent: source_admission's same-named field; fixture_head: the fixture commit; declaration_digest: the
  # fixture's bound-declaration bytes under source_admission.digest_algorithm). The key set must equal
  # bootstrap_input.record_keys (asserted).
  # r5r (R2 r2k C1-R2K-CARRIER 51b9c0fc; codex-tick461 R5P-TYPED-STAGE-INPUTS): the record is the SIX-key typed record
  # (record_keys gains `context`, the early-view context typed as the effective node holds it; token early_context).
  # ONE declaration for both fixture kinds: controls/launch_record.yml builds it for the check fixture AND the
  # generation case clone (bound to the post-mutation fixture commit and declaration bytes).
  # r5s (R2 r2l C1-R2L-TOOL-BINDING, r2l-c1-hunks.yml cf0678fd :595-617): record_keys gains `tools` (seven keys);
  # token packaged_tools = {<role>: {<tool_fields.path>: os_tools[<key>].path, <tool_fields.sha256>:
  # os_tools[<key>].identity.sha256}} for every role -> key of source_admission.tool_roles, read from the PACKAGED
  # effective resolved controller.bootstrap (_wrp.bootstrap) -- never from case or caller data.
  check_launch:
    record_var: rh_source_bootstrap
    record_from: [source_admission, bootstrap_input]
    tokens: [record_src, record_parent, fixture_head, declaration_digest, early_context, packaged_tools]
    fields:
      tools: packaged_tools
      context: early_context
      edition: fixture_head
      declaration_rel: record_src
      declaration_path: record_src
      declaration_sha256: declaration_digest
      controller_delegate: record_parent
  # r5p generation kind (run_one_case.yml `generation`): the case-clone fixture commit identity (a commit in the
  # per-case clone only, never in the admitted source), the controller-only inventory the declared genesis launch
  # names (operator_controller_inventory: no ansible_* var), and the token of genesis.launch.env.inherited that means
  # "the invoking uid's passwd home" (the runner's PASSWD-HOME oracle value, @passwd_home@).
  # r5r: the fixture commit IDENTITY (author / committer name, email, date) is no longer restated here: it is the
  # declared git.mutation.env_pairs of R2's policy node (C1-R2K-GIT-MUTATION "B declares"; values proposed in
  # c1-proposal C1-R5R-2). Only the message stays a harness value.
  generation:
    fixture_commit: {message: 'controls generation fixture'}
    # r5u-rf (codex-tick500 R5U-REFUSAL-AND-INVENTORY-CONTRACT): the inventory binding is NAMED, not inferred from a
    # singleton shape. r5u-rf2 (codex-tick510 RF-OD-4 / RF-OD-5): the SELECTION is per case (generation.produce:
    # kind = a genesis.launch.inventory_kinds key the stage ADMITS by membership; area = the case-relative output area;
    # files = role -> area-relative file) and THIS node declares what the harness can PRODUCE:
    #   obligations  obligation key of an inventory kind -> the roles of that obligation this harness produces. Every
    #                key the selected kind declares must be listed here and every role it names must be listed under
    #                that key, else CONTROLS-GENERATION-LAUNCH-UNBOUND (generation_producer) before the clone. files =
    #                the file roles with declared contents; receipt = [] (this harness produces and admits NO receipt:
    #                a receipt-bearing kind -- controller_operation_binding / run_binding_receipt -- refuses here, and
    #                its positive case belongs to the measurement path, never qualified by this refusal).
    #   contents     file role -> content (no ansible_* var; the declared operator_controller_inventory rule)
    #   protected    case-directory artifacts the output area must neither equal, contain nor lie inside (whole
    #                normalized segments, path_admission.case_sensitive identity): the clone / fixture (src, repo), the
    #                controller state and target stand-ins (state, tgt, ctlroot), the bundle and the run records and
    #                launch files (vars.json, inventory.json, load_paths.json, gate_case.sh)
    producer:
      obligations:
        files: [operator_controller_inventory]
        receipt: []
      contents:
        operator_controller_inventory: {all: {hosts: {localhost: {}}}}
      protected: [src, repo, state, tgt, ctlroot, bundle, vars.json, inventory.json, load_paths.json, gate_case.sh]
    inherited_sources: {passwd_home: invoker_passwd_home}
    # r5u-rf4 (codex-tick526 RF3-PRELAUNCH-VERDICT-SOURCE): the stage a generation verdict publishes.
    #   pre_launch  a pre-launch check refused (rescue): nothing was cloned, prepared, written or launched; the verdict
    #               carries NO source_commit / source_tree / source_parent / launch, and the aggregate lists it under
    #               pre_launch (never a source mismatch, never a generation that ran)
    #   generated   the generation block ran to its end; the verdict carries the clone's source and the launch record
    verdict_stage: {pre_launch: pre_launch, generated: generated}
  # brr-follow-s2 PJ-CONTROLS / U-12 (codex-tick546 settled_join_continuity; OD-BRR-12; genesis controls-04 a42e5265,
  # FROZEN): the GENESIS kinds (genesis_entry / genesis_stage / genesis_render), run by controls/genesis_case.yml (included
  # by run_one_case.yml for exactly the kinds listed here -- the ONE list; run_one_case's generic evaluator skips them).
  #   kinds            the kinds genesis_case.yml runs (each also a harness.kinds row)
  #   host_conditions  the declared host-condition vocabulary of controls-04 (a genesis_entry case names one in `host`)
  #   host_binding     the binding of a run to its host. NO declared producer of a fresh-image host output exists that
  #                    this runner can consume (SC-S2-HOST, seams.yml): MAIN's QEMU leg supplies, per run, ONE JSON record
  #                    in the file named by the extra var `var`, keyed by `<case id>/<variant index>`; each record has
  #                    exactly record_keys. Absent var, absent / unreadable file, a missing run or a record of another
  #                    shape refuses CONTROLS-GENESIS-HOST-UNBOUND before anything is executed (pre_launch, never
  #                    creditable). connection.mode must be a declared ssh_auth mode; a case with `neighbour: <case id>`
  #                    binds every run's neighbour_run to a run of that case on the SAME host_id (a case without one binds
  #                    neighbour_run null); isolated variants (variant_isolation: isolated) have pairwise distinct
  #                    run checkouts on the ONE common admitted parent (GEN3-CASE-FIXTURE-ISOLATION, Codex557):
  #                    successor-06 S2-ISOLATED-FIXTURE-COMMIT (codex-572) -- a baseline-fixture run at the admitted
  #                    commit, every other fixture run at its OWN reviewed single-mutation fixture commit (only parent =
  #                    the admitted commit, read back; one commit per fixture id, distinct across fixture ids).
  #   variant_keys     the keys a variant may carry: inputs (operator inputs, admitted against the projected domains --
  #                    a subset is allowed: an absent input is the entry's own refusal under test), entry_args (raw words
  #                    appended VERBATIM after the declared arguments, never admitted by this runner; only on a case
  #                    whose every variant expects a refusal outcome, else CONTROLS-GENESIS-INPUT -- no false pass),
  #                    fixture (a fixture id of `fixtures`), worktree_edit ({rel, append}: appended on the bound host
  #                    checkout after the baseline readback, never committed), inventory ({mode, content}: the operator
  #                    inventory written on the bound host for this run; absent = the binding producer's inventory at
  #                    the record's path is used), inventory_absent (true: codex-tick558 PRO-03 missing supplied -i source
  #                    -- the record's inventory path must NOT exist at the baseline readback; exclusive with inventory)
  #                    An expectation may also carry home_absent [rel, ...]: paths below the run's passwd_home that must
  #                    not exist after the run (the executable-inventory sentinel of GEN3-28)
  #   outcomes         typed outcome vocabulary (each outcome is a one-key mapping). ok = rc 0 and every out_success line;
  #                    entry_refusal: <role> = rc genesis.entry.statuses[<role>] and `REFUSED <genesis.entry.codes[<role>]>`;
  #                    refusal: <code> = rc controller.bootstrap.refusals[<code>] and `REFUSED <code> `; a code with NO declared status
  #                    there refuses CONTROLS-GENESIS-STATUS-UNDECLARED before launch: no catch-all status (rc 1), no
  #                    arbitrary-nonzero, no private numeric fallback (Codex557). RH-SOURCE-STAGED = 55 is DECLARED by the
  #                    frozen F05-S4 rh-source-status group (groups-summary 36865155, J-RHS-01; table 40..57), READ from
  #                    controller.bootstrap.refusals, never restated here; pending: <open decision id> = an outcome
  #                    DECLARED PENDING a ruling (the row is not creditable): it refuses CONTROLS-GENESIS-STATUS-UNDECLARED
  #                    the same way (no row of this packet uses it after codex-tick563)
  #   store_evidence   store-log checks (genesis.entry.store.ops_log under <passwd_home>/<store.sub>/<store.rel>, words
  #                    from store.log_words; markers from genesis.entry.markers), read on the bound host after the run;
  #                    keys: evidence key -> comparator (a `comparators` value): equal = observed == expected, at_most =
  #                    observed <= expected
  #   inner            codex-tick560 GEN3-28 OUTER STATUS: an expectation's `inner: {stage, exit_status}` asserts the
  #                    INNER status SEPARATELY from the outer entry status: the stage's step record (genesis.launch.
  #                    step_record: <work root>/<work_roots.sub_roots.run>/<stage_root.rel>/<stage>/<act>/<files.record>,
  #                    read on the bound host) carries exit_status; exit_status is {legs: {<ansible_legs member>: int}}
  #                    (exact, PER ANSIBLE LEG: the binding record's ansible_leg selects; a run on a leg with no declared
  #                    status refuses CONTROLS-GENESIS-STATUS-UNDECLARED before launch) or {pending: <open decision id>}
  #                    (declared pending: STATUS-UNDECLARED, never an arbitrary-nonzero acceptance).
  #                    codex-tick563 OD-S2-INNER-STATUS (2.19.11) + codex-tick564 OD-S2-INNER-STATUS-217 (2.17.14; official
  #                    v2.17.14 manager.py :327-328, cli :674-676 / :700): the ANY_UNPARSED_IS_FAILED inventory path of an
  #                    EXPLICITLY supplied inventory = inner 1 on each leg, declared per leg and executed per leg, bound
  #                    ONLY to rows whose first failure is that path (its own output line); never transferred to a task
  #                    or filter exception or to an omitted / default inventory. A failed task (assert / fail) keeps
  #                    ansible-playbook's own exit: 2.19.11 = 2 (B's source-bound trace, verify.yml V-S2-INNER-TASK-219,
  #                    UNRUN); NO 2.17.14 value is declared for it (that leg refuses STATUS-UNDECLARED). Shell raisers
  #                    use the numeric RH-SOURCE statuses (40..57); Ansible task refusals never do.
  #   fixtures         fixture id -> what the binding producer must commit (BYTES NOT AUTHORED HERE: they need a rendered
  #                    entry / declaration that does not exist yet -- SC-S2-FIXTURE-BYTES); the runner verifies the
  #                    record's fixture id and commit ancestry (baseline_fixture = the admitted commit; every other
  #                    fixture = one fixture commit on it). codex-tick560 GEN4-PATH-CONTROL-REACHABILITY: the F05 loader
  #                    refuses a malformed closure declaration before render (S4-C33) and the closure list is baked at
  #                    render (genesis macros-04 :274), so no rendered entry carries a malformed rel; the only real-
  #                    launcher shape is a malformed source declaration committed BESIDE the entry rendered from the
  #                    admitted one (decl_* fixtures). codex-tick563 case boundaries: (a) previous good DS -> 32 at the
  #                    declaration digest; (b) the fixture's own DS -> the first refusal inside the stage (GEN3-27C); the
  #                    variant's declaration_digest class is read back on the host (declaration_digest_classes). The
  #                    newline helper rows are S4-C40 consumer-fixture rows, narrower (controls.yml S2-GEN3-27H)
  genesis:
    kinds: [genesis_entry, genesis_stage, genesis_render]
    host_conditions: [fresh_base, prepared, second_fresh_base]
    host_binding:
      var: genesis_host_binding
      # declaration_sha256 = the operator-REVIEWED declaration digest the entry is given (an operator value, carried by
      # the binding, never computed by this runner from the bytes it tests); owned_root / evidence_dir = the run's seed
      # owned root and an owned scratch dir on the host (concurrent runs write their rc / output there)
      record_keys: [run, host_id, host_condition, connection, checkout, checkout_commit, checkout_parent, fixture, inventory,
                    passwd_home, neighbour_run, declaration_sha256, owned_root, evidence_dir, ansible_leg]
      connection_keys: [address, port, user, mode, key_ref]
    # codex-tick563 / codex-tick564: the Ansible legs a run is bound to (record ansible_leg); each leg is bound and
    # executed independently and inherits no other leg's credit. inner_forms.legs = the per-leg exit_status key
    ansible_legs: ['2.19.11', '2.17.14']
    inner_forms: {legs: legs}
    variant_isolation: {isolated: isolated, shared: shared}
    variant_keys: [inputs, entry_args, fixture, worktree_edit, inventory, inventory_absent, declaration_digest, store_fault]
    # codex-tick563 GEN3-27: which committed declaration the binding's reviewed declaration_sha256 is (genesis_case.yml)
    declaration_digest_classes: {admitted: admitted, fixture: fixture}
    outcomes: {ok: ok, entry_refusal: entry_refusal, refusal: refusal, pending: pending}
    # successor-06 S2-STORE-READBACK-FALSE-PASS (codex-572): frame = the validated evidence frame (genesis_case.yml; read
    # by separate, index-attributed commands; absent from an expectation = ok); a frame other than ok is the
    # expectation's only store key (an intentional pre-publication negative declares no publication).
    # published_distinct is false for an EMPTY publication set; published_covers_declared = the published files equal
    # the declaration-derived store rows (resolve_work_root.yml genesis_store_files); positive store rows carry it.
    store_evidence:
      comparators: {equal: equal, at_most: at_most}
      keys: {frame: equal, published_distinct: equal, published_covers_declared: equal, removed_partial: equal, cold_markers: at_most,
             generation_dirs: equal, same_generation: equal}
      frames: {ok: ok, unattributed: unattributed, fault_unapplied: fault_unapplied, log_missing: log_missing,
               log_probe_failed: log_probe_failed, log_unreadable: log_unreadable, generations_unreadable: generations_unreadable,
               log_malformed: log_malformed}
    # store_fault (a variant key): fault -> the chmod mode applied to the run's ops log AFTER its run, before the readback
    # (a negative control of the store readback only; the bound host is the run's owned fixture host)
    store_faults: {unreadable: '0000'}
    inner_keys: [stage, exit_status]
    baseline_fixture: baseline
    fixtures:
      baseline: 'the admitted commit, unmutated (checkout_commit == admitted commit)'
      decl_dot_component: 'one fixture commit on the admitted one whose ONLY change is the committed source declaration (manifests/profiles/remote-harness.yml): ONE item a/./b.yml appended to controller.bootstrap.source_admission.members_rel (no other key, no other file; the generated entry, its closure and every other member stay the admitted bytes; GEN3-27B, GEN3-27C v0)'
      decl_dotdot_component: 'as decl_dot_component with the members_rel item a/../b.yml (GEN3-27C v1)'
      decl_space_byte: 'as decl_dot_component with the members_rel item a/b c.yml (GEN3-27C v2)'
      decl_newline_dotdot: 'as decl_dot_component with the members_rel item a<LF>.. (one YAML double-quoted scalar "a\n.."; GEN3-27C v3)'
      decl_newline_lines: 'as decl_dot_component with the members_rel item a<LF>b (one YAML double-quoted scalar "a\nb"; GEN3-27C v4)'
      closure_case_distinct: 'one fixture commit on the admitted one declaring BOTH tasks/Case.yml and tasks/case.yml as committed closure members (GEN3-29 baseline; bytes: SC-S2-FIXTURE-BYTES)'
  # r5u-rf4 (codex-tick526 RF3-INNER-FAILURE-CUSTODY; OD-f accepted for explicit negative controls only):
  #   reasons   role -> identity (a harness.texts key) of each DECLARED inner failure the runner records; a negative
  #             control's expect.harness_failures names these identities (with repetition = occurrence count)
  #   controls  the custody self-test fixtures run_controls.yml feeds through controls/inner_failure_custody.yml before
  #             any case (pure; a mismatch refuses CONTROLS-CASES): reasons / failures = the inner verdict ({text: key}
  #             or {raw: string}), expected = the declared identities (absent = an ordinary case), texts_alias = extra
  #             text keys that COPY an existing key's text (a same-text alias), outer = the EXACT outer failure list
  #             ({text: key} | {raw: string} | {mismatch: [identity, expected, observed]} | {alias: [identity, keys]})
  inner_failure:
    reasons: {reach_prelaunch: reach_prelaunch}
    controls:
      # ordinary reach prelaunch rejection: no expectation -> the inner failure IS the outer failure (stays failed)
      - id: IFC-ORDINARY-REACH-PRELAUNCH
        reasons: [reach_prelaunch]
        failures: [{text: reach_prelaunch}]
        outer: [{text: reach_prelaunch}]
      # exactly one expected failure: successful negative assertion; the inner verdict (kept by run_one_case) failed
      - id: IFC-EXACT-ONE
        reasons: [reach_prelaunch]
        failures: [{text: reach_prelaunch}]
        expected: [reach_prelaunch]
        outer: []
      # an unrelated additional failure stays
      - id: IFC-UNRELATED-EXTRA
        reasons: [reach_prelaunch]
        failures: [{text: reach_prelaunch}, {raw: 'rc -1 != expected pass'}]
        expected: [reach_prelaunch]
        outer: [{raw: 'rc -1 != expected pass'}]
      # a missing expected failure stays failed
      - id: IFC-MISSING
        reasons: []
        failures: []
        expected: [reach_prelaunch]
        outer: [{mismatch: [reach_prelaunch, 1, 0]}]
      # a repeated observed failure cannot disappear: count mismatch + the unconsumed occurrence
      - id: IFC-REPEATED
        reasons: [reach_prelaunch, reach_prelaunch]
        failures: [{text: reach_prelaunch}, {text: reach_prelaunch}]
        expected: [reach_prelaunch]
        outer: [{mismatch: [reach_prelaunch, 1, 2]}, {text: reach_prelaunch}]
      # equal-text aliases: one observation cannot satisfy two identities; nothing is consumed
      - id: IFC-EQUAL-TEXT-ALIAS
        texts_alias: {reach_prelaunch_alias: reach_prelaunch}
        reasons: [reach_prelaunch]
        failures: [{text: reach_prelaunch}]
        expected: [reach_prelaunch, reach_prelaunch_alias]
        outer: [{alias: [reach_prelaunch, [reach_prelaunch, reach_prelaunch_alias]]},
                {mismatch: [reach_prelaunch_alias, 1, 0]},
                {alias: [reach_prelaunch_alias, [reach_prelaunch, reach_prelaunch_alias]]},
                {text: reach_prelaunch}]
  # r5q KIND ADMISSION (X-MAIN-R5P-1; codex-tick461): the ONE declaration of the supported case kinds and of each
  # kind's fixture and source requirements. run_controls.yml reads ONLY this node to admit a kind (it never derives
  # the vocabulary from the cases it validates): a case whose kind is not a key here refuses CONTROLS-CASES before
  # anything is written, and every selected case is checked against its kind's row before any fixture exists.
  #   runnable     false = declared, listed declared_unrun in the receipt, never counted green (no verdict written)
  #   git_fixture  the git fixture the kind creates (vocabulary kind_vocabulary.git_fixture); anything but `none`
  #                needs -e allow_git_fixture=true or the selection refuses CONTROLS-GIT-FIXTURE (never skipped)
  #   source       none = no SOURCE-REF; admitted = SOURCE-REF admission (source_ref.yml) before any clone, the kind
  #                clones per case and its verdict's source_parent must be the admitted commit; shared_clone =
  #                admission + the shared clone <run_dir>/src, the verdict's source_commit / source_tree must be the
  #                admitted ones (vocabulary kind_vocabulary.source)
  #   case_keys    keys a selected case of this kind must carry (refused before any fixture otherwise)
  # check gained its own-commit fixture in r5p (X-R1-S9-4: the one-commit check repository), so check selections now
  # need allow_git_fixture; regex / gate / scope stay git-free.
  # r5r (codex-tick464 r5q-changed-source-value-sourcing): every SEMANTIC CLASS the runner compares is a declared role
  # here (classes: role -> vocabulary member; case_status: role -> status value) and every row field the runner reads
  # is a declared role (row_roles: role -> row key; r5q's positional row_keys is RETIRED -- the row key set is
  # row_roles' values). run_controls.yml reads these roles only; it carries no class, status or row-key value.
  kind_vocabulary:
    git_fixture: [none, own_commit, source_clone, fixture_clones, case_clone]
    source: [none, admitted, shared_clone]
    row_roles: {runnable: runnable, git_fixture: git_fixture, source: source, case_keys: case_keys}
    classes: {no_fixture: none, no_source: none, shared_source: shared_clone, admitted_source: admitted}
    case_status: {open: OPEN}
  # r5r (codex-tick464): the harness refusal codes and diagnostic texts of the kind admission and of the r5r git /
  # path / launch fences. Composed through the ONE shared refusal grammar entry (resolved bootstrap
  # refusal_grammar.entry_rel; template_vars rh_rf_grammar / rh_rf_code / rh_rf_detail), the same macro path
  # render_run_binding.yml and check.yml use; the runner restates no code or text. The one pre-grammar diagnostic is
  # the family PARENT harness.family (r5u-rf2; formerly texts.grammar_absent), composed in the R2 admit_git_paths form
  # `REFUSED <code>: <text>` from its declared values (the grammar itself cannot report its own absence).
  # r5r (codex-tick461 R5P-FIXTURE-GIT-ISOLATION): the fixture READBACK is R2's ONE admission include
  # testing/remote_harness/tasks/admit_git_paths.yml (r2k 6ede9063; C1-R2K-GIT-MUTATION readback), never a private
  # readback. It takes refusal codes and texts keyed EXACTLY by the declared git.cause_keys (asserted by the include);
  # these are the harness's. CONTROLS-GIT-* family; B-owned strings.
  git_readback:
    codes:
      tool: CONTROLS-GIT-TOOL
      edition: CONTROLS-GIT-EDITION
      object_format: CONTROLS-GIT-OBJECT-FORMAT
      config: CONTROLS-GIT-CONFIG
      conversion: CONTROLS-GIT-CONVERSION
      untracked: CONTROLS-GIT-UNTRACKED
      staged_change: CONTROLS-GIT-STAGED
      commit_bytes: CONTROLS-GIT-COMMIT-BYTES
      uncommitted: CONTROLS-GIT-UNCOMMITTED
      absent: CONTROLS-GIT-ABSENT
    texts:
      tool: 'a fixture readback git call returned non-zero'
      edition: 'the fixture HEAD is malformed or not the fixture commit'
      object_format: 'the fixture repository object format is not the declared one'
      config: 'the fixture repository configuration can execute code or convert bytes'
      conversion: 'a fixture path carries a checkout-conversion attribute'
      untracked: 'a fixture path is not a tracked blob of the fixture commit'
      staged_change: 'a fixture path has a staged change'
      commit_bytes: 'a fixture path worktree bytes are not the fixture commit blob'
      uncommitted: 'a fixture path has an uncommitted change'
      absent: 'a must-be-absent fixture path is still tracked'
  # r5r (codex-tick461 R5P-GENERATION-PATH-ADMISSION): the presence classes controls/admit_case_paths.yml admits a
  # case-supplied fixture path under (file: existing regular file; tree: existing regular file or directory; absent:
  # nothing there, not even a link; replaceable: an existing regular non-link file or nothing -- a placement target).
  # run_one_case.yml names each use's class by these roles only.
  case_path_classes: {file: file, tree: tree, absent: absent, replaceable: replaceable}
  # FAMILY ADMISSION (r5u-rf2; codex-tick510 RF-OD-2): the PARENT diagnostic of the harness refusal family
  # (refusals / texts below), read by run_controls.yml's first grammar task (its single consumer) before any member is
  # read. members = the exact key sets of refusals / texts (member NAMES, not codes: no code registry; codex-tick508).
  # refusal / text sit OUTSIDE the family (text was texts.grammar_absent; refusal keeps that diagnostic's code), so an
  # omitted, null or partial family refuses typed instead of failing as an undefined variable.
  # r5u-rf3 (codex-tick518 RF2-CASES-REFUSAL-DOUBLE-OWNER): family.refusal is the SOLE owner of CONTROLS-CASES; the
  # case-admission refusals of run_controls.yml read it here (refusals.cases and its member entry are retired).
  family:
    members:
      refusals: [git_fixture, git_policy, git_location, git_config, case_path, launch_unbound, check_input,
                 git_fresh_init, generation_input, generation_act, source_mismatch,
                 genesis_host_unbound, genesis_status_undeclared, genesis_input]
      texts: [git_fresh_init, kinds_declaration, cases_malformed, undeclared_kinds, cases_missing_keys, git_fixture,
              source_parent_differs, git_policy, git_location, git_config, case_path, launch_slot, launch_inputs,
              launch_emission, launch_record, launch_inventory, check_shape, check_closure, generation_input,
              generation_source, generation_act, generation_inventory, generation_paths, generation_producer,
              generation_setup, reach_prelaunch, inner_failure_mismatch, inner_failure_alias, inner_failure_selftest,
              genesis_host_unbound, genesis_status_undeclared, genesis_input, genesis_outcome, genesis_store_evidence,
              genesis_variant_count, genesis_inner_status, genesis_baseline, genesis_store_frame]
    refusal: CONTROLS-CASES
    text: 'the resolved bootstrap carries no refusal_grammar entry, or CASES harness.refusals / texts is not the declared family (each a mapping of strings whose key set is exactly harness.family.members); nothing was selected or written'
  refusals:
    git_fixture: CONTROLS-GIT-FIXTURE
    git_policy: CONTROLS-GIT-POLICY
    git_location: CONTROLS-GIT-LOCATION
    git_config: CONTROLS-GIT-CONFIG
    case_path: CONTROLS-CASE-PATH
    launch_unbound: CONTROLS-GENERATION-LAUNCH-UNBOUND
    check_input: CONTROLS-CHECK-INPUT
    # r5s (r2l C1-R2L-GIT-FRESH-INIT: "the mutation refusal of this node (B declares the code)") -- the harness code
    git_fresh_init: CONTROLS-GIT-FRESH-INIT
    # r5u-rf (codex-tick500 R5U-REFUSAL-AND-INVENTORY-CONTRACT): the generation / clone codes run_one_case.yml emitted
    # inline (r5p..r5t); now declared and composed through the shared grammar entry like every harness code
    generation_input: CONTROLS-GENERATION-INPUT
    generation_act: CONTROLS-GENERATION-ACT
    source_mismatch: CONTROLS-SOURCE-MISMATCH
    # brr-follow-s2 PJ-CONTROLS (genesis kinds; harness.genesis)
    genesis_host_unbound: CONTROLS-GENESIS-HOST-UNBOUND
    genesis_status_undeclared: CONTROLS-GENESIS-STATUS-UNDECLARED
    genesis_input: CONTROLS-GENESIS-INPUT
  texts:
    git_fresh_init: 'the fresh fixture repository destination is not admitted (not absent, a link component, an unadmitted ancestor, or a copy member that would replace its .git), or the fresh-init node is undeclared; nothing was initialised, cloned or copied'
    kinds_declaration: 'harness.kinds / harness.kind_vocabulary is not the declared kind admission (kind -> one value per declared row role, over the declared vocabulary and classes); nothing was selected or written'
    cases_malformed: 'CASES.yml is malformed (duplicate id, a kind not declared in harness.kinds, missing kind or expect, unknown neighbour or status, an expect.harness_failures that is not a non-empty list of declared inner-failure identities (harness.inner_failure.reasons values) on a case declaring generation.reach and expecting rc fail whose neighbour is a declared reach case without expect.harness_failures), or `only` names an unknown id; nothing was written'
    undeclared_kinds: 'undeclared kinds:'
    cases_missing_keys: 'selected cases lack their kind''s declared case_keys; nothing was written'
    git_fixture: 'selected cases are of kinds whose declared git_fixture is not the no-fixture class; pass -e allow_git_fixture=true where git is permitted, or select only the kinds listed last'
    source_parent_differs: 'source_parent differs:'
    git_policy: 'the resolved bootstrap source_admission git policy (tool_roles, env_clear, env_pairs, global, inspect_global, config grammar, mutation sub-node) is absent or malformed; no fixture repository was created, cloned or changed'
    git_location: 'the fixture repository is not exactly the case directory (git dir / top level differ, or a pre-existing .git entry); nothing was added, moved or committed'
    git_config: 'the fixture repository configuration has a malformed key or a key the declared git policy refuses (code execution, signing, templates, conversion); nothing was added, moved or committed'
    case_path: 'a case path is not an admitted fixture-relative path (path grammar, forbidden segment, containment, link or ancestry, or presence class); nothing was read or changed'
    launch_slot: 'the declared genesis launch argv has an unresolved or undeclared placeholder slot, a list slot that is not a whole word, an unbound declared scalar role, or a source-record slot that is not the literal final word after every caller word; nothing was launched'
    # brr-follow-s2 OPEN-B (codex-tick542 OD-GEN-06; OD-BRR-15): the producer implements the case class AND the operator
    # class (a value of the input's declared domain, projected by resolve_work_root.yml as operator_inputs)
    launch_inputs: 'the stage declares no typed stage_inputs, a stage input names a source class this harness does not produce (only the case and operator classes are produced), the case inputs (generation.inputs) are not exactly its case-class stage input names, the case operator inputs (generation.operator_inputs) are not exactly its operator-class stage input names, an operator-class input is not declared in genesis.launch.operator_inputs with that class or its value is not a string member of its projected domain (or the domains were not projected), or a stage input collides with a generated envelope name; nothing was cloned or launched (case, stage, case inputs, operator inputs):'
    # r5s (codex-tick480 R5R-STAGE-SOURCE-OMISSION): the post-clone emission check (a declared stage input the producer
    # did not emit); fixtures may exist, nothing was launched
    launch_emission: 'the produced stage-input words do not carry every declared stage input of the stage; nothing was launched'
    launch_record: 'the source-bootstrap record source, parent, early-view context or field tokens are undeclared, or the record is not after every caller-supplied extra-vars word; nothing was launched'
    # r5u-rf (codex-tick500): the texts of the former inline run_one_case.yml refusals and of the named inventory
    # binding gate; each text ends with the names of the observed values that follow it
    launch_inventory: 'the generation stage does not admit the case''s selected inventory kind (generation.produce.kind), that kind is undeclared or its file roles are not declared file roles, they are not exactly the case''s produced roles (generation.produce.files), or the stage declares extra vars this harness has no producer for; nothing was cloned or launched (stage, selected kind, stage declaration, produced roles):'
    check_shape: 'harness.check_copy / check_copy_sourced / check_launch are not the declared shapes; nothing was copied'
