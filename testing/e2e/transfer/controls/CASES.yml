      out: ['KARGV /usr/bin/ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o IdentityAgent=none -o IdentitiesOnly=yes -o Port=2222 -o IdentityFile=@cd@/id_priv root@10.1.2.3 KCOMMON']
