      owned_check: '@cd@/tgt/srv/lme'

  - id: D09c-state-lock-busy
    kind: phase
    neighbour: D09c-own-dead-op-reaped
    setup:
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer', mode: '0750'}
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-dddddddddddd', mode: '0700'}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', mode: '0600', content: "start 20260101T000000Z-dddddddddddd @token@"}
      # the lock exists 0600 BEFORE the runner's flock opens it (custody: never a umask-dependent create)
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/.lock', content: '', mode: '0600'}
    phase: {hold_lock: '@cd@/tgt/srv/lme/.lme-transfer/.lock', runs: [{hold_lock: true}]}
    expect:
      rc: fail
      out: ['TRANSFER-TARGET-BUSY', 'rc=75']
      present: ['@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-dddddddddddd']
      absent: ['@cd@/tgt/srv/lme/install.sh']
      line_count: [{path: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', regex: '.', n: 1}]

  # B-TARGET-INTERNAL-CUSTODY (codex tick165/166): the whole .lme-transfer/{state,staging,incoming,ops,.lock} ancestry
  # (and the ledger/manifests/edition record) is admitted -- not a link, the declared kind, not group/other-writable,
  # owner uid admitted -- in target_observe and again at the start of target_place, BEFORE any mutation. A decoy the
  # link points at is never touched. (A foreign-uid internal dir needs root to build; not constructible here.)
  - id: D09d-linked-internal-staging-dir-refused
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    setup:
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer', mode: '0750'}
      - {dir: '@cd@/tgt/elsewhere', mode: '0750'}
      - {file: '@cd@/tgt/elsewhere/decoy.keep', content: 'not ours to touch', mode: '0600'}
      - {link: '@cd@/tgt/srv/lme/.lme-transfer/staging', to: '@cd@/tgt/elsewhere'}
    expect:
      rc: fail
      out: [TRANSFER-TARGET-INTERNAL-CUSTODY]
      absent: ['@cd@/tgt/srv/lme/install.sh']
      file_has: [{path: '@cd@/tgt/elsewhere/decoy.keep', text: 'not ours to touch'}]
