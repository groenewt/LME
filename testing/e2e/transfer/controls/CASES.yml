  # ---------------- ENTRY GUARD / RESERVED OUTPUTS (codex tick318-321 item 2) ----------------
  # tr, tr_dir are derived at first entry (entry_guard in transfer.decl.yml) and tr_repo_root after admission
  # (bind_controller.yml; the driver input is drv_repo_root). Extra vars outrank set_fact, so each derived value is
  # compared with its derivation before use. The forged values reach the entry through phase.forged_extra_vars, merged
  # LAST into the driver's -e @file (run_one_case.yml; negative/precedence controls only). Before the C1
  # reserved_outputs hunk the refusal is B's TRANSFER-DERIVED-OUTPUT-PINNED; after it, the route's
  # RH-DERIVED-OUTPUT-PINNED fires first: both contain DERIVED-OUTPUT-PINNED, so these cases hold on either lineage.
  # (Was K20-pinned-contract-output-refused, whose id collided with K20-plugin-consumes-no-key-...)
  # COVERAGE (codex-tick333): every E case is a `phase` case, i.e. it runs testing/e2e/transfer/phase_driver.yml (the
  # control driver with its stand-in target) -- NOT the production entries resolve_target.yml / transfer.yml under the
  # route's executor (seed launcher), and NOT receipt admission (record_transfer / the deploy_gate receipt read). The
  # production entries' guard is covered only STATICALLY (check cases C36-C43, structure of the first plays); no
  # runnable control here launches them with a forged extra var.
  # RESERVED FAMILIES (codex-tick333 (2)): tr_* / _tr_* / tp_* / _tp_* (and rcl_*) are refused by B's family guard
  # (tasks/refuse_reserved_families.yml, second task of each host's first play) with
  # RESERVED-FAMILY-DERIVED-OUTPUT-PINNED ... ['<name>']. ATOMIC JOIN: until C1's pattern hunk registers
  # reserved_transfer_vars / reserved_prereq_vars (reserved_reclaim_vars is required only by reclaim.yml), EVERY phase case refuses
  # RESERVED-FAMILY-REGISTRY at that guard -- the positives (K01.., E05, E11) are red until then, by design.
  - id: E01-pinned-contract-output-host-var-refused
    kind: phase
    status: OPEN            # gated on C1's pattern hunk (reserved_transfer_vars); host-var channel on the stand-in target
    neighbour: K05-refused-connection-var
    phase:
      steps: {observe_controller_steps: [], observe_target_steps: [], stage_controller_steps: [], place_target_steps: []}
      tgt_vars: {tr_conn: {ansible_host: pinned.example, ansible_user: root}}
    expect: {rc: fail, out: [DERIVED-OUTPUT-PINNED, tr_conn], out_absent: [KARGV]}

  - id: E02-forged-extra-var-tr-refused
