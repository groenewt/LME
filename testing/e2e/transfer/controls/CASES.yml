      present: ['@cd@/tgt/srv/lme/install.sh', '@cd@/tgt/srv/lme/scripts/wipe_lme.sh']
      absent: ['@cd@/tgt/srv/lme/.ocr', '@cd@/tgt/srv/lme/.git']
