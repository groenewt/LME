  # PRECEDENCE (pinned toolchain ansible-core 2.19.11, rh.controller.expect_core): playbook_dir is a magic var set
  # after extra vars (vars/manager.py), so a forged extra-var playbook_dir does NOT move tr_dir/tr: the run is K01's
