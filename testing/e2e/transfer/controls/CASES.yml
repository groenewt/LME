    expect: >-
      exactly one completes; the other refuses TRANSFER-TARGET-BUSY / TRANSFER-TARGET-LEDGER-MOVED (rc 75) or
      TRANSFER-TARGET-FOREIGN-UNFINISHED with nothing removed; no age-based deletion

  # ---------------- B-PER-HOST-POLICY-BINDING (C1 field contract 033500; codex 021809/023332) ----------------
  # `scope` rows (runnable, SYNTHETIC): harness.scope_fixture projections through B's real scope_expect.yml,
  # scope_admit.yml, record_contract.yml and check_recorded_contract.yml. They prove the admission logic only; that a
  # refusal precedes target mutation in the real entries rests on position (bind_target.yml includes scope_admit.yml
  # before target_observe.yml; the observe play precedes every effect play), which check.yml walks.
  # Integration rows (MAIN, evidence_class real): C1's schema-3 projection in the resolved source, a managed
  # controller and a real target over the real transport. A synthetic row never stands in for a real one.
  - id: PS00-scope-neighbour
    kind: scope
    scope: {target: t1, record_patch: {}, receipt_patch: {}}
    expect:
      rc: 0
      out: ['SCOPE-EXPECT-OK t1 2222222222222222222222222222222222222222222222222222222222222222',
            'SCOPE-ADMIT-OK t1 2222222222222222222222222222222222222222222222222222222222222222 1111111111111111111111111111111111111111111111111111111111111111',
            'RECEIPT-OK t1 2222222222222222222222222222222222222222222222222222222222222222']
      file_has:
        - {path: '@cd@/gate.sc.contract.json', text: '"scope_sha256": "2222222222222222222222222222222222222222222222222222222222222222"'}
        - {path: '@cd@/gate.sc.transfer.json', text: '"scopes_sha256": "7777777777777777777777777777777777777777777777777777777777777777"'}
        - {path: '@cd@/gate.sc.transfer.json', text: '"t1": ['}
        - {path: '@cd@/gate.sc.transfer.json', text: '"schema": "lme-deploy-transfer/v2"'}
        - {path: '@cd@/gate.sc.contract.json', text: '"scopes_sha256": "7777777777777777777777777777777777777777777777777777777777777777"'}

