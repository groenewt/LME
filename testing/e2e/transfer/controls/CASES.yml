             absent: ['@cd@/tgt/srv/lme'], dir_empty: ['@cd@/state/pending']}

  # codex 155203: the root leg no longer verifies the owner receipt, so the owner root is the inventory DECLARATION
  # (route inventory.root_var, lme_toolchain_root) read as a string only; an interpreter inside it is refused.
  - id: T05-owner-interpreter-on-privileged-tasks
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    phase:
      tgt_vars:
        lme_toolchain_root: '@cd@/tc'
        ansible_python_interpreter: '@cd@/tc/gen/venv/bin/python'
    expect: {rc: fail, out: [TRANSFER-TARGET-INTERPRETER], absent: ['@cd@/tgt/srv/lme']}

  # B-TOOL-PREADMISSION-EXEC (codex tick165/166): id and cat at their derived paths are SUBSTITUTED files (the
  # engine's identity sha256 unchanged; phase_driver drv_tool_subst). Each substitute records any execution in a
  # marker file; the refusal must come from stat alone, with ZERO executions (no marker, no privilege read).
  - id: T06-substituted-id-cat-refused-before-execution
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    setup:
      - {dir: '@cd@/subst', mode: '0755'}
      - {file: '@cd@/subst/id', mode: '0755', content: "#!/bin/sh\necho executed >> '@cd@/subst/id.ran'\necho 0"}
      - {file: '@cd@/subst/cat', mode: '0755', content: "#!/bin/sh\necho executed >> '@cd@/subst/cat.ran'\necho 0123456789abcdef0123456789abcdef"}
    phase:
      tool_subst: {id: '@cd@/subst/id', cat: '@cd@/subst/cat'}
    expect:
      rc: fail
      out: [TRANSFER-TARGET-TOOL-IDENTITY]
      out_absent: [TRANSFER-TARGET-PRIVILEGE, TRANSFER-TARGET-PATH-TOOL]
      absent: ['@cd@/subst/id.ran', '@cd@/subst/cat.ran', '@cd@/tgt/srv/lme']

  # ---------------- owned placement ----------------
  - id: P01-first-place-preserves-unrelated
    kind: phase
    setup:
      - {dir: '@cd@/tgt/srv/lme/local', mode: '0750'}
      - {file: '@cd@/tgt/srv/lme/local/keep.me', content: 'operator data', mode: '0600'}
    expect:
