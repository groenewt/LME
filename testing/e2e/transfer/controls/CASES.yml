    phase: {remote_dir: '@cd@/tgt/gw/lme'}
    expect: {rc: fail, out: [TRANSFER-REMOTE-DIR-ANCESTRY], absent: ['@cd@/tgt/gw/lme']}

  - id: T04-undeclared-target-tool
    kind: phase
