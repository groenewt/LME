  # ---------------- integration: DECLARED, NOT RUN here (MAIN, real seed-built throwaway generation) ----------------
  - id: I1-positive-end-to-end
    kind: integration
    run: >-
      MAIN: package.yml bundle -> seed apply to a throwaway root under an owned $HOME subdirectory (controller) and
      target_bootstrap.yml for the target owner; inventory with ansible_user=root and lme_toolchain_root/owner;
      deploy_gate.sh --stage rsync with LME_CONTROLLER_LAUNCHER (absolute <bundle>/<bundle.launcher_file>),
      LME_CONTROLLER_ROOT, LME_TRANSFER_INVENTORY, LME_TRANSFER_STATE_DIR and
      LME_SSH_AUTH_MODE (= the inventory's lme_ssh_auth_mode) set
    expect: >-
      resolve_target + transfer rc 0; gate.<label>.transfer.json present; the target's owned.sha256 verifies;
      .lme-transfer/edition.json names the commit, decl/policy revisions and the controller token; the controller
      pending dir and the target's staging/incoming/ops dirs are empty
  - id: I2-real-target-missing-tar
    kind: integration
    run: the I1 flow against a target image without tar (or gzip), and again with a PATH tar that is not os_tools.tar.path
    expect: >-
      TRANSFER-TARGET-TOOL-IDENTITY naming tar (missing), resp. TRANSFER-TARGET-PATH-TOOL (PATH != admitted file);
      REMOTE_DIR not created (no target mutation)
  - id: I3-unreachable-target
    kind: integration
    run: the I1 flow with the inventory address pointed at an unrouted address
    expect: resolve_target fails (UNREACHABLE); TARGET_CONTRACT_REFUSED; no later stage runs
  - id: I4-alias-port-key-proxy-same-endpoint
    kind: integration
    status: OPEN                                   # TR01: open until the joined controls run; a refusal never covers it
    run: the I1 flow twice, once by alias and once by address + port + key + ProxyJump
    expect: the same /etc/machine-id is recorded both times, and wipe/install/health reach it with the same argv
  - id: I5-removed-executable-across-two-transfers
    kind: integration
    run: transfer commit A, then commit B (A minus one 100755 member), to the same REMOTE_DIR
    expect: the member is absent after B; unrelated files survive; owned.sha256 verifies
  - id: I6-edition-unchanged-rerun-real-target
    kind: integration
    run: the I1 flow twice on the same commit to the same REMOTE_DIR, then install.sh, then the I1 flow again
    expect: >-
      second transfer prunes 0 and leaves owned.sha256 identical; after install.sh the out_of_edition paths
      (config/lme-environment.env, inventory, wazuh_manager.conf.backup.*, offline_resources) survive the third
      transfer; wazuh_manager.conf is reset to the edition (install re-applies it)
  - id: I7-concurrent-writer-busy
