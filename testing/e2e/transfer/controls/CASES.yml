      file_has: [{path: '@cd@/state/operations.log', text: 'fail '}, {path: '@cd@/state/operations.log', text: 'complete '}]
      dir_empty: ['@cd@/state/pending', '@cd@/tgt/srv/lme/.lme-transfer/staging', '@cd@/tgt/srv/lme/.lme-transfer/incoming', '@cd@/tgt/srv/lme/.lme-transfer/ops']
      owned_check: '@cd@/tgt/srv/lme'

  - id: L02-controller-interruption
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    setup:
      - {dir: '@cd@/state/pending', mode: '0700'}
      - {file: '@cd@/state/operations.log', content: 'start 20260101T000000Z-aaaaaaaaaaaa @token@', mode: '0600'}
      - {file: '@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.tar.gz', content: 'partial', mode: '0600'}
      - {dir: '@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.d', mode: '0700'}
      - {file: '@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.d/x', content: 'x', mode: '0600'}
      - {file: '@cd@/state/pending/decoy.keep', content: 'not ours to remove', mode: '0600'}
    expect:
      rc: 0
      absent: ['@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.tar.gz', '@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.d']
      present: ['@cd@/state/pending/decoy.keep']
      file_has: [{path: '@cd@/state/operations.log', text: 'abandon 20260101T000000Z-aaaaaaaaaaaa'}]

  # B-CROSS-ROOT-RECOVERY (codex tick165/166): a second controller root (another writer token) shares this state
  # directory and has an unfinished op in flight; a legacy untokened `start` is equally uncertain. Only THIS
  # controller's dead op (@token@) is abandoned and removed; the other writers' artifacts are preserved, never
  # abandoned by this controller, and the run still completes.
  - id: L04-two-roots-sharing-state-uncertain-writers-preserved
    kind: phase
    neighbour: L02-controller-interruption
    setup:
      - {dir: '@cd@/state/pending', mode: '0700'}
      - {dir: '@cd@/state/pending/20260101T000000Z-eeeeeeeeeeee.d', mode: '0700'}
      - file: '@cd@/state/operations.log'
        mode: '0600'
        content: "start 20260101T000000Z-aaaaaaaaaaaa @token@\nstart 20260101T000000Z-eeeeeeeeeeee eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee\nstart 20260101T000000Z-cccccccccccc"
      - {file: '@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.tar.gz', content: 'own dead', mode: '0600'}
      - {file: '@cd@/state/pending/20260101T000000Z-eeeeeeeeeeee.tar.gz', content: 'other root in flight', mode: '0600'}
      - {file: '@cd@/state/pending/20260101T000000Z-eeeeeeeeeeee.d/x', content: 'other root in flight', mode: '0600'}
      - {file: '@cd@/state/pending/20260101T000000Z-cccccccccccc.tar.gz', content: 'legacy writer', mode: '0600'}
    expect:
      rc: 0
      out: ['TRANSFER-STATE-UNCERTAIN-PRESERVED 20260101T000000Z-eeeeeeeeeeee,20260101T000000Z-cccccccccccc']
      absent: ['@cd@/state/pending/20260101T000000Z-aaaaaaaaaaaa.tar.gz']
      present: ['@cd@/state/pending/20260101T000000Z-eeeeeeeeeeee.tar.gz', '@cd@/state/pending/20260101T000000Z-eeeeeeeeeeee.d/x',
                '@cd@/state/pending/20260101T000000Z-cccccccccccc.tar.gz', '@cd@/tgt/srv/lme/install.sh']
      file_has: [{path: '@cd@/state/operations.log', text: 'abandon 20260101T000000Z-aaaaaaaaaaaa'}]
      file_lacks: [{path: '@cd@/state/operations.log', text: 'abandon 20260101T000000Z-eeeeeeeeeeee'},
                   {path: '@cd@/state/operations.log', text: 'abandon 20260101T000000Z-cccccccccccc'}]

  # B-CROSS-ROOT-RECOVERY residual (codex 150646): shared-ledger PRESERVATION under concurrent roots.
  # L05: two controller roots (distinct writer tokens, own labels and remote dirs) run the whole pipeline AT THE
  # SAME TIME against ONE controller state dir; both roots' `start` and `complete` rows must survive (4 rows, one start
  # per token). Honest limit: a lost-update race is timing-dependent, so L05 alone would rarely fail on the old
  # unlocked lineinfile; L06 is the deterministic discriminator.
  - id: L05-two-roots-concurrent-ledger-rows-preserved
    kind: phase
    neighbour: L04-two-roots-sharing-state-uncertain-writers-preserved
    phase:
      concurrent: true
      runs:
        - {ctl_root: ctlroot, label: ctl-a, remote_dir: '@cd@/tgt/srv/lme', rc: 0}
        - {ctl_root: ctlroot-b, label: ctl-b, remote_dir: '@cd@/tgt/srv/lme-b', rc: 0}
    expect:
      rc: 0
      present: ['@cd@/tgt/srv/lme/install.sh', '@cd@/tgt/srv/lme-b/install.sh']
      # op ids by the DECLARED grammar (@op_grammar@ = transfer.decl.yml controller_state.op_regex, anchors stripped;
      # B-L05-OPERATION-GRAMMAR: the former [0-9TZ-]+ excluded the hex suffix)
      line_count: [{path: '@cd@/state/operations.log', regex: '^start @op_grammar@ [0-9a-f]{64}$', n: 2},
                   {path: '@cd@/state/operations.log', regex: '^start @op_grammar@ @token@$', n: 1},
                   {path: '@cd@/state/operations.log', regex: '^complete ', n: 2},
                   {path: '@cd@/state/operations.log', regex: '.', n: 4}]
      dir_empty: ['@cd@/state/pending']
      modes: [{path: '@cd@/state/operations.log', mode: '0600'}, {path: '@cd@/state/.ledger.lock', mode: '0600'}]

  # L06 (deterministic): another root holds the shared ledger lock for the whole run. The ledger writer must wait
  # (ledger_wait_s, narrowed to 1s here) and then refuse with nothing written -- the old unlocked lineinfile would
  # have appended its `start` regardless. No artifact is created before the start row exists.
  - id: L06-shared-ledger-lock-held-by-another-root
    kind: phase
    neighbour: L05-two-roots-concurrent-ledger-rows-preserved
    setup:
      - {file: '@cd@/state/.ledger.lock', content: '', mode: '0600'}
    phase:
      hold_lock: '@cd@/state/.ledger.lock'
      runs: [{hold_lock: true}]
      decl_overrides: {controller_state: {ledger_wait_s: 1}}
    expect:
      rc: fail
      out: [TRANSFER-STATE-LEDGER-BUSY, 'rc=75']
      absent: ['@cd@/state/operations.log', '@cd@/tgt/srv/lme/install.sh']
      dir_empty: ['@cd@/state/pending']

  - id: L03-target-interruption-after-promote
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    setup:
      - {dir: '@cd@/tgt/srv/lme/stale', mode: '0750'}
      - {file: '@cd@/tgt/srv/lme/stale/placed.txt', content: 'half-promoted', mode: '0644'}
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer/ops', mode: '0750'}
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-bbbbbbbbbbbb', mode: '0700'}
      - {dir: '@cd@/tgt/srv/lme/.lme-transfer/incoming', mode: '0750'}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/incoming/20260101T000000Z-bbbbbbbbbbbb.tar.gz', content: 'partial', mode: '0600'}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', mode: '0600',
         content: "start 20260101T000000Z-bbbbbbbbbbbb @token@\npromote 20260101T000000Z-bbbbbbbbbbbb"}
      - {file: '@cd@/tgt/srv/lme/.lme-transfer/ops/20260101T000000Z-bbbbbbbbbbbb.sha256', mode: '0600',
         content: "1111111111111111111111111111111111111111111111111111111111111111  stale/placed.txt"}
    expect:
      rc: 0
      absent: ['@cd@/tgt/srv/lme/stale/placed.txt',
               '@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-bbbbbbbbbbbb',
               '@cd@/tgt/srv/lme/.lme-transfer/incoming/20260101T000000Z-bbbbbbbbbbbb.tar.gz',
               '@cd@/tgt/srv/lme/.lme-transfer/ops/20260101T000000Z-bbbbbbbbbbbb.sha256']
      file_has: [{path: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', text: 'abandon 20260101T000000Z-bbbbbbbbbbbb'}]
      owned_check: '@cd@/tgt/srv/lme'

  # ---------------- R-B3 edition reconcile + M1 staging bounds (route E25-E27 lease/flock model) ----------------
  - id: U01-edition-unchanged-rerun
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    phase: {runs: [{}, {}]}
