      out: ['TRANSFER-READBACK-DIGEST', 'TRANSFER-PLACE-FAILED']
      absent: ['@cd@/tgt/srv/lme/install.sh']
      dir_empty: ['@cd@/state/pending', '@cd@/tgt/srv/lme/.lme-transfer/staging', '@cd@/tgt/srv/lme/.lme-transfer/incoming']

  # ---------------- B2-TEMP-LIFECYCLE ----------------
  - id: L01-failure-then-success
    kind: phase
    neighbour: P01-first-place-preserves-unrelated
    phase: {runs: [{tamper: drop_member, rc: fail}, {}]}
    expect:
