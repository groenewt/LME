      k_vars: {ansible_host: 10.1.2.3, ansible_port: 2222, lme_ssh_auth_mode: explicit_key, lme_privileged_key: '@cd@/id_priv'}
    expect: {rc: 0, out: ['KARGV /usr/bin/ssh -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o IdentityAgent=none -o IdentitiesOnly=yes -o Port=2222 -o IdentityFile=@cd@/id_priv root@10.1.2.3 KCOMMON -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new -o IdentityAgent=none -o IdentitiesOnly=yes -o Port=2222 -o IdentityFile=@cd@/id_priv KHOST 10.1.2.3']}

