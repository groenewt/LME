    expect:
      rc: 0
      out: ['SCOPE-EXPECT-OK t1 2222222222222222222222222222222222222222222222222222222222222222',
            'SCOPE-ADMIT-OK t1 2222222222222222222222222222222222222222222222222222222222222222 1111111111111111111111111111111111111111111111111111111111111111',
            'RECEIPT-OK t1 2222222222222222222222222222222222222222222222222222222222222222']
      file_has:
        - {path: '@cd@/gate.sc.contract.json', text: '"scope_sha256": "2222222222222222222222222222222222222222222222222222222222222222"'}
        - {path: '@cd@/gate.sc.transfer.json', text: '"scopes_sha256": "7777777777777777777777777777777777777777777777777777777777777777"'}
        - {path: '@cd@/gate.sc.transfer.json', text: '"t1": ['}
        - {path: '@cd@/gate.sc.transfer.json', text: '"schema": "lme-deploy-transfer/v2"'}
