      present: ['@cd@/tgt/srv/lme/.lme-transfer/staging/20260101T000000Z-cccccccccccc/x']
      absent: ['@cd@/tgt/srv/lme/install.sh']
      line_count: [{path: '@cd@/tgt/srv/lme/.lme-transfer/operations.log', regex: '.', n: 1}]
      dir_empty: ['@cd@/state/pending']

