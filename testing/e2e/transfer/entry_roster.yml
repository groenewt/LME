---
# testing/e2e/transfer/entry_roster.yml -- the ONE B-owned roster MEMBERSHIP authority (transfer.decl.yml
# generation.roster_rel / roster_key / roster_retire_key; brr-follow BR-02, codex-tick519 DO-1: one authoritative
# roster, no executable roster, no fixed count). Data only: never a render input, never in the template closure,
# never under a structural input path. One row per entry_sets member whose output is entry_forms.outputs.generated
# or (brr-follow-s2 J-RNP-01) entry_forms.outputs.rendered;
# a row REFERENCES that member (member: {dir, file}) and supplies only template metadata. No row states an output
# path or carries a digest (recorded digests live only in the accepted generation record). Its exact committed bytes
# are custody (admitted by commit membership + checkout digest before every operation; nobody normalises them).
entry_roster:
  - id: prereq_observe
    member: {dir: testing/e2e/target_prereq, file: prereq_observe.yml}
    template_rel: testing/e2e/transfer/templates/entry.yml.j2
  - id: owner_key
    member: {dir: testing/e2e/target_prereq, file: owner_key.yml}
    template_rel: testing/e2e/transfer/templates/entry.yml.j2
  - id: target_prereq
    member: {dir: testing/remote_harness, file: target_prereq.yml}
    template_rel: testing/e2e/transfer/templates/entry.yml.j2
  - id: controller_prereq
    member: {dir: testing/remote_harness, file: controller_prereq.yml}
    template_rel: testing/e2e/transfer/templates/entry.yml.j2
  # brr-follow-s2 J-RNP-01 (F05-S4 roster-nonplaybook): the two RENDERED members (entry_sets output rendered); same row
  # shape; template_rel must equal the producer authority's (genesis.entry / .producer template_rel) and lie in the
  # rendered render closure (host_scope.shared_artifacts.genesis_render), else the loader refuses
  - id: genesis-entry
    member: {dir: testing/remote_harness, file: lme-genesis-entry.sh}
    template_rel: testing/remote_harness/templates/lme-genesis-entry.sh.j2
  - id: source-bootstrap
    member: {dir: testing/remote_harness, file: source_bootstrap.yml}
    template_rel: testing/remote_harness/templates/source_bootstrap.yml.j2
# retirement INTENT rows only ({output_rel, reason}); intent never defines ownership. None declared.
retire: []
