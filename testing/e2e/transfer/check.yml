---
# testing/e2e/transfer/check.yml -- STRUCTURAL guard of every DECLARED entry playbook against transfer.decl.yml
# (B2-CONTROL-REACH; codex-tick405 Q1: generalized to the declared entry sets and bound before the preservation-evaluation
# control). Static, local, read-only; the managed runner controller.bootstrap.work_roots.run_local.runners.transfer_check:
#   /usr/bin/ansible-playbook -i localhost, testing/e2e/transfer/check.yml [-e <tr.preservation_selection.input_var>=<case id>]
#   s9: + the launcher bootstrap record rh_source_bootstrap (LAST -e word, from the launcher's admitted bundle binding; the
#   R2 seed contract) -- the runner argv change is C1 / R2's (blocked item C1-S9-EARLY-VIEW-SHAPE (d)), not authored here.
# PLAY 1 begins with this directory's declared entry head (transfer.decl.yml entry_guard + entry_forms.by_dir
# [testing/e2e/transfer]): the route guard, B's family guard, the derived bind of tr_dir / tr and its pin assert -- so tr
# and tr_dir are DERIVED outputs here too, never play vars (the candidate's play vars were caller-overridable before any
# guard). Every name play 1 derives after the head is a reserved_transfer_vars family member (_tr_*), so B's family
# guard (task 2) refuses a pre-supplied one: no extra-var can stand in for a verdict.
# macro `violations` (templates/macros/transfer.j2):
#   entries     (decl `entries`): exact play names in order; play rules (macro play_rules: placement, any_errors_fatal,
#               gather_facts, play keys, derived play vars); the entry head against the RENDERED form of this directory
#               (macro entry_head). Every task is walked THROUGH blocks/rescue/always and B includes: observe plays -> only
#               observe modules, every command changed_when false, no delegation; effect plays -> only declared
#               observe/effect modules, delegation only to localhost. B includes must resolve under tasks/; route includes
#               must be declared and match their sha256; any other include (or include_role) refuses. deploy_gate.sh must
#               name every declared output suffix and build no root@HOST target.
#   entry_sets  (decl `entry_sets`; the target_prereq entries prereq_observe.yml / owner_key.yml /
#               testing/remote_harness/target_prereq.yml / controller_prereq.yml and this file): exact play names in
#               order, the same play rules and the same entry head against the rendered form of each entry's own
#               directory; each declared body of a GENERATED member is read ONCE, its digest matches the declared
#               body_sha256 and that same value parses to a task list (s8 R1S7-BODY-BYTE-BINDING; not proof of earlier
#               admission). NOT walked (s4 record). s8: a GENERATED member's equality with its construction moved to the
#               route-r2 r2h generate_entries.yml VERIFY mode (post-resolve, the same entry template, the admitted refusal
#               grammar and core path_admission.separator; codex-tick435-436). The pure constructor is
#               templates/macros/entry_construct.j2 (imported by macros/transfer.j2 without context).
#   s9 EARLY VERIFIER CONTEXT (codex-tick446 R1S8-EARLY-CONTEXT option c): after the entry head and BEFORE the walk, play
#               1 includes the R2 early-view producer (tr.structural_check.early_view.producer_rel = R2
#               tasks/admit_loader_source.yml: reads the launcher-bound declaration ONCE, refuses bytes that are not the
#               launcher's admitted digest, admits the source members, projects rh_early_view {binding, context} and reads
#               it back -- a context replaced BEFORE that read-back, or a changed source binding, refuses THERE), then
#               refuses here, consumer side, a context that is not typed or not bound to this launch's
#               rh_source_bootstrap. s11 (codex-tick463 X_R1_S10_1; C1-R2K-CARRIER): the task after it compares the COMPLETE
#               early context, type-strict, with the admitted launch-binding carrier rh_source_bootstrap.context (rendered
#               by the one normal loader, operator override LAST; admitted by R2 CARRIER ADMISSION), so a type-preserving
#               replacement of a context VALUE after the producer read-back refuses RH-SOURCE-EARLY-VIEW before the walk.
#               Play 2 repeats it after the selected re-entry. The walk takes rh_early_view.context (path_separator, body_domain); "Refuse any
#               violation" refuses through the ONE shared refusal grammar entry (refusal_grammar.entry_rel, reached by the
#               context path_separator) with transfer.structural_check.refusal code and detail (B r5m X-R1-R5M-1, now
#               COMPLETE; the cause pairs travel as JSON data inside the detail). No check moved later, none narrowed;
#               nothing here resolves the policy. This is an early view of the SAME declarations the loader projects
#               later; R2 generate_entries.yml reconciles the two before any render.
# PLAY 2 is the declared preservation-evaluation control (rh.controller.bootstrap.target_prereq.preservation.evaluation
# .control). It starts only after play 1 passed (any_errors_fatal on the one host localhost: a failed check ends the
# run). Its include paths are sourced from asserted derivations: the policy resolve from tr.initial_contact
# .pre_contact_route (tr bound and asserted in play 1), the control tasks file from tp (bound here from the resolved
# policy; tp is an exact reserved_outputs name, refused by play 1's route guard if pre-supplied). s6: without the
# declared selection input (tr.preservation_selection.input_var) it reports tr.preservation_selection.texts.unselected
# and ends BEFORE any policy resolve; a selected case resolves, binds tp, refuses an absent declared evaluation
# dependency (s7; shared refusal grammar), and runs the real control tasks. s7: tr.preservation_selection.input_var is
# the ONE selector (the policy control.input_var is retired; codex-tick425-426).
- name: transfer -- structural check
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/refuse_reserved_families.yml"

    - name: Derive the transfer declaration and its directory (entry guard; never a play var or an input)
      ansible.builtin.set_fact:
        tr_dir: "{{ playbook_dir }}"
        tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Refuse a pinned transfer declaration or directory (entry guard; before any use)
      ansible.builtin.assert:
        that:
          - tr_dir == playbook_dir
          - tr == (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer
        fail_msg: >-
          TRANSFER-DERIVED-OUTPUT-PINNED: {{ (['tr_dir'] if tr_dir != playbook_dir else [])
          + (['tr'] if tr != (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer else []) }}
          were supplied from outside the entry (extra-var); they are derived here from playbook_dir, never inputs.
        quiet: true

    # s9 (codex-tick446 R1S8-EARLY-CONTEXT option c): the producer is R2's (admitted pre-launch with this playbook's
    # importer closure, P5); it is NOT a policy resolve (resolve_policy.yml is not included in play 1, so the unselected
    # path of play 2 still ends before any resolve). Its output name rh_early_view is a registry reserved_output
    # (C1-S9-EARLY-VIEW-SHAPE), refused pre-supplied by task 1; the producer's read-back refuses a value replaced before
    # that read-back. A selected run reaches the producer AGAIN in play 2 through resolve_policy (re-entry; CTX-05).
    - name: Project the early verifier context from the admitted, launcher-bound declaration (R2 early-view producer)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/{{ tr.structural_check.early_view.producer_rel }}"

    # consumer side, BEFORE any dependent interpretation (the walk is the next task): the context is typed and bound to
    # THIS launch's source record (record keys binding / context and the field names are interface constants of the C1
    # early-view shape, RV-19; the refusal is the unframed declared pair: the grammar it would be framed with is part of
    # what is being refused, RV-22). Context VALUES are compared by the next task (s11, against the admitted carrier).
    - name: Refuse an early verifier context that is not typed or not bound to this launch (consumer side; before the walk)
      ansible.builtin.assert:
        that:
          - rh_source_bootstrap is mapping
          - rh_early_view is mapping
          - rh_early_view.binding is mapping
          - rh_early_view.context is mapping
          - rh_early_view.binding.edition == rh_source_bootstrap.edition
          - rh_early_view.binding.declaration_rel == rh_source_bootstrap.declaration_rel
          - rh_early_view.binding.declaration_sha256 == rh_source_bootstrap.declaration_sha256
          - rh_early_view.context.refusal_grammar is mapping
          - rh_early_view.context.path_separator is string
          - rh_early_view.context.path_separator | length > 0
          - rh_early_view.context.body_domain is mapping
          - rh_early_view.context.body_domain.undecodable_regex is string
          - rh_early_view.context.body_domain.read.lstrip is sameas false
          - rh_early_view.context.body_domain.read.rstrip is sameas false
        fail_msg: "{{ [tr.structural_check.early_view.refusal.code, tr.structural_check.early_view.refusal.detail] | to_json }}"
        quiet: true

    # s11 (codex-tick463 X_R1_S10_1; C1-R2K-CARRIER consumer): IMMEDIATELY before the walk, the COMPLETE early context
    # rh_early_view.context (the SAME key the walk and the s9 assert consume, RV-19) equals the admitted carrier
    # rh_source_bootstrap.context, type-strict (sorted-key JSON text; Python == would equate 1, 1.0 and true). The
    # reference is the carrier (extra-var precedence; authenticated by R2 CARRIER ADMISSION, not by precedence), never a
    # producer working fact. _rh_sa_decl (the admitted source_admission node; registry reserved_output, refused
    # pre-supplied by task 1) supplies only the code and the text (it can change a message, never pass a refusal). Framed by the ONE shared
    # grammar entry with the CARRIER's grammar and separator (the early view is the value under suspicion).
    # brr-follow (f05-s3 SUP01 SUP01-SEAM03 consumers_added; S3-SEAM-03): the carrier context now also holds the LAUNCH
    # fields (rel_path), which the raw early view never projects. Key set first (carrier == context_fields UNION
    # launch_context_fields, the two disjoint), then the equality RESTRICTED to the context_fields keys. The two key maps
    # are read from the admitted _rh_sa_decl node (OD-BRR-05: it now selects compared KEYS as well as code / text).
    - name: Refuse an early context that is not the admitted launch-binding context (consumer side; immediately before the walk)
      ansible.builtin.assert:
        that:
          - _rh_sa_decl.early_view.context_fields is mapping
          - _rh_sa_decl.early_view.launch_context_fields is mapping
          - _rh_sa_decl.early_view.context_fields.keys() | intersect(_rh_sa_decl.early_view.launch_context_fields.keys() | list) | list | length == 0
          - (rh_source_bootstrap.context.keys() | list | sort) == ((_rh_sa_decl.early_view.context_fields.keys() | list) + (_rh_sa_decl.early_view.launch_context_fields.keys() | list)) | sort
          - (rh_early_view.context | to_json(sort_keys=true)) == (rh_source_bootstrap.context | dict2items | selectattr('key', 'in', _rh_sa_decl.early_view.context_fields.keys() | list) | items2dict | to_json(sort_keys=true))
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_repo_root ~ rh_source_bootstrap.context.path_separator ~ rh_source_bootstrap.context.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh_source_bootstrap.context.refusal_grammar,
                                   'rh_rf_code': _rh_sa_decl.early_view.refusal,
                                   'rh_rf_detail': [_rh_sa_decl.early_view.text]}) }}
        quiet: true

    - name: Walk the declared entry playbooks and compute the violations
      ansible.builtin.set_fact:
        _tr_ck: >-
          {{ lookup('ansible.builtin.template', tr_dir ~ '/templates/call.j2',
                    template_vars={'lme_macro': 'violations', 'lme_args': [tr, tr_dir, rh_repo_root, rh_early_view.context]}) | from_json }}

    - name: Refuse any violation
      ansible.builtin.assert:
        that:
          - _tr_ck.violations | length == 0
        # s9 (B r5m X-R1-R5M-1, COMPLETE): code and detail from transfer.structural_check.refusal, framed by the ONE shared
        # refusal grammar entry (C1 r4c refusal_grammar.entry_rel) with the early context's grammar and separator -- the
        # same YAML route play 2 uses after resolve; no grammar composition is restated here.
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_repo_root ~ rh_early_view.context.path_separator ~ rh_early_view.context.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh_early_view.context.refusal_grammar,
                                   'rh_rf_code': tr.structural_check.refusal.code,
                                   'rh_rf_detail': [tr.structural_check.refusal.detail | format(rows=_tr_ck.rows, causes=(_tr_ck.violations | to_json))]}) }}
        quiet: true

    # ---- LOAD-BASE (SOURCE-REF check C): every lookup / include base in B's own files is a declared base, so a
    # phase row can only load project bytes from the candidate tree (the bases are asserted at runtime by
    # controls/load_paths.yml). Policy: tr.controls_source.load_binding (lookup_bases, identity_lookups, static).
    - name: LOAD-BASE -- B's own task, playbook and template files
      ansible.builtin.find:
        paths: "{{ tr_dir }}"
        recurse: true
        patterns: ['*.yml', '*.j2']
      register: _tr_lbf

    - name: LOAD-BASE -- read them
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: >-
        {{ _tr_lbf.files | map(attribute='path') | sort
           | reject('in', tr.controls_source.load_binding.static.scan_exclude | map('regex_replace', '^', tr_dir ~ '/') | list) | list }}
      register: _tr_lbs

    - name: LOAD-BASE -- compute the undeclared bases
      vars:
        _tr_lb: "{{ tr.controls_source.load_binding }}"
        _tr_ids: "{{ _tr_lb.identity_lookups | select('match', '^/') | list }}"
      ansible.builtin.set_fact:
        _tr_lb_viol: >-
          {%- set v = [] -%}
          {%- set n = [] -%}
          {%- for r in _tr_lbs.results -%}
            {%- set t = r.content | b64decode | regex_replace(_tr_lb.static.strip_regexes[0], '') | regex_replace(_tr_lb.static.strip_regexes[1], '') -%}
            {%- for a0 in t | regex_findall(_tr_lb.static.lookup_regex) -%}
              {%- set a = a0 | trim -%}
              {{- n.append('l') or '' -}}
              {%- if not ((a.split(' ') | first) in _tr_lb.lookup_bases
                          or (a | replace("'", '') | replace('"', '')) in _tr_ids) -%}
                {{- v.append((r.source | replace(tr_dir ~ '/', '')) ~ ': lookup base ' ~ a) or '' -}}
              {%- endif -%}
            {%- endfor -%}
            {%- for i0 in t | regex_findall(_tr_lb.static.include_regex) -%}
              {%- set i = i0 | trim | replace('"', '') | replace("'", '') -%}
              {{- n.append('i') or '' -}}
              {%- if not ((i is match(_tr_lb.static.relative_include_regex))
                          or (i.startswith('{' ~ '{ ') and ((i[3:].split(' ') | first) in _tr_lb.lookup_bases))) -%}
                {{- v.append((r.source | replace(tr_dir ~ '/', '')) ~ ': include base ' ~ i) or '' -}}
              {%- endif -%}
            {%- endfor -%}
          {%- endfor -%}
          {{ {'violations': v, 'lookups': n | select('equalto', 'l') | list | length, 'includes': n | select('equalto', 'i') | list | length} | to_json }}

    - name: LOAD-BASE -- parse
      ansible.builtin.set_fact:
        _tr_lb_viol: "{{ _tr_lb_viol if (_tr_lb_viol is mapping) else (_tr_lb_viol | from_json) }}"

    - name: LOAD-BASE -- refuse an undeclared base (TRANSFER-CHECK-LOAD-BASE)
      ansible.builtin.assert:
        that:
          - _tr_lbs.results | length > 0
          - _tr_lb_viol.lookups > 0 and _tr_lb_viol.includes > 0
          - _tr_lb_viol.violations | length == 0
        fail_msg: "TRANSFER-CHECK-LOAD-BASE: {{ _tr_lb_viol | to_nice_json }}"
        quiet: true

    # ---- METHOD-ATTR: a dict-method-named ATTRIBUTE read (not a call) of a data key is the method, never the key;
    # refused in the same comment-stripped files (policy: tr.controls_source.load_binding.static.method_attr_regex).
    - name: METHOD-ATTR -- find dict-method-named attribute reads
      vars:
        _tr_st: "{{ tr.controls_source.load_binding.static }}"
      ansible.builtin.set_fact:
        _tr_ma: >-
          {%- set v = [] -%}
          {%- for r in _tr_lbs.results -%}
            {%- set t = r.content | b64decode | regex_replace(_tr_st.strip_regexes[0], '') | regex_replace(_tr_st.strip_regexes[1], '') -%}
            {%- for m in t | regex_findall(_tr_st.method_attr_regex) -%}
              {{- v.append((r.source | replace(tr_dir ~ '/', '')) ~ ': .' ~ m) or '' -}}
            {%- endfor -%}
          {%- endfor -%}
          {{ v | to_json }}

    - name: METHOD-ATTR -- refuse them (TRANSFER-CHECK-METHOD-ATTR)
      vars:
        _tr_mal: "{{ _tr_ma if (_tr_ma is sequence and _tr_ma is not string) else (_tr_ma | from_json) }}"
      ansible.builtin.assert:
        that:
          - _tr_mal | length == 0
        fail_msg: >-
          TRANSFER-CHECK-METHOD-ATTR: attribute read of a dict-method name (Jinja returns the METHOD, not the data key;
          read the key by subscript): {{ _tr_mal }}
        quiet: true

    # ---- GATE-LAUNCH (codex tick217 R1): deploy_gate.sh starts the seed only through the route's bundle launcher;
    # full-value validation of the normalised gate text (policy: tr.gate_launch).
    - name: GATE-LAUNCH -- validate every seed expansion, bare seed name, env word, launcher expansion and launcher call in deploy_gate.sh
      vars:
        _tr_g: "{{ tr.gate_launch }}"
      ansible.builtin.set_fact:
        _tr_gl: >-
          {%- set v = [] -%}
          {%- set t = lookup('ansible.builtin.file', tr_dir ~ '/' ~ _tr_g.file_rel)
                      | regex_replace(_tr_g.comment_regex, '') | regex_replace(_tr_g.continuation_regex, '') -%}
          {%- for e in _tr_g.never_allowed if e in _tr_g.allowed_expansions -%}{{ v.append('declaration admits ' ~ e) or '' }}{%- endfor -%}
          {%- for e in (t | regex_findall(_tr_g.seed_expansion_regex)) + (t | regex_findall(_tr_g.indirect_expansion_regex)) -%}
            {%- if e in _tr_g.never_allowed or e not in _tr_g.allowed_expansions -%}{{ v.append('expansion ' ~ e) or '' }}{%- endif -%}
          {%- endfor -%}
          {%- for s in t.split('\n') | map('trim') if s is search(_tr_g.bare_name_regex) and s not in _tr_g.allowed_name_statements -%}
            {{- v.append('statement naming ' ~ _tr_g.seed_var ~ ': ' ~ s) or '' -}}
          {%- endfor -%}
          {%- for w in t | regex_findall(_tr_g.env_word_regex) -%}{{ v.append('env word ' ~ w) or '' }}{%- endfor -%}
          {%- for e in t | regex_findall(_tr_g.launcher_expansion_regex) if e not in _tr_g.launcher_allowed_expansions -%}
            {{- v.append('launcher expansion ' ~ e) or '' -}}
          {%- endfor -%}
          {%- for s in t.split('\n') | map('trim') if s is search(_tr_g.launcher_expansion_regex)
                and s not in _tr_g.launcher_allowed_statements and s is not search(_tr_g.launch_call_regex) -%}
            {{- v.append('launcher statement: ' ~ s) or '' -}}
          {%- endfor -%}
          {%- set nc = t | regex_findall(_tr_g.launch_call_regex) | length -%}
          {%- if nc != (_tr_g.launch_call_count | int) -%}
            {{- v.append('launcher calls ' ~ nc ~ ' != ' ~ _tr_g.launch_call_count ~ ' (' ~ _tr_g.launcher_var ~ ' run <root> <ssh auth mode> <args...>)') or '' -}}
          {%- endif -%}
          {{ {'violations': v, 'bytes': t | length} | to_json }}

    - name: GATE-LAUNCH -- refuse (TRANSFER-GATE-LAUNCH)
      vars:
        _tr_glp: "{{ _tr_gl if (_tr_gl is mapping) else (_tr_gl | from_json) }}"
      ansible.builtin.assert:
        that:
          - _tr_glp.bytes | int > 0
          - _tr_glp.violations | length == 0
        fail_msg: >-
          {{ tr.gate_launch.refusal }}: deploy_gate.sh must start the seed only through the declared bundle launcher and
          construct no environment: {{ _tr_glp.violations }}
        quiet: true

    - name: OK
      ansible.builtin.debug:
        msg: >-
          TRANSFER CHECK OK ({{ _tr_ck.rows }} tasks walked; load-base: {{ _tr_lbs.results | length }} files,
          {{ _tr_lb_viol.lookups }} lookups, {{ _tr_lb_viol.includes }} includes)

# the declared PRESERVATION-EVALUATION control (codex-tick405 Q1). A later play of localhost: it never re-includes either
# guard (play 1 derived rh_repo_root, tr_dir and tr on this host; entry_sets checks this play like any other).
- name: preservation-eval control
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    # s6 (codex-tick417 bounded unfreeze): the unselected decision comes FIRST, before any policy resolve, from the
    # declaration play 1 derived and asserted on this host (tr = transfer.decl.yml; tr.preservation_selection is the ONE
    # declaration owner of the selection input and its unselected text). Nothing tp-dependent moves here: tp does not
    # exist yet. The input value itself is not read on this path (only its presence), so no caller input is widened.
    - name: Report an unselected control (no declared case input supplied; decided before any policy resolve)
      ansible.builtin.debug:
        msg: "{{ tr.preservation_selection.texts.unselected }}"
      when: tr.preservation_selection.input_var not in vars

    - name: End this play when no case is selected (no policy resolve, no evaluator)
      ansible.builtin.meta: end_play
      when: tr.preservation_selection.input_var not in vars

    - name: Resolve the harness policy (route pre-contact resolve, the last declared pre_contact_route member; the shared engine)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/{{ tr.initial_contact.pre_contact_route | last }}"

    # s11 (codex-tick463 X_R1_S10_1; C1-R2K-CARRIER consumer): the resolve above re-entered the R2 producer (CTX-05), which
    # re-derived rh_early_view and _rh_sa_decl from fresh reads. Play 2 has no structural walk; its consumption boundary
    # is HERE, before the first context-dependent task of this play. Same comparison, refusal and framing as play 1
    # (brr-follow SUP01: same key-set and restricted-equality clauses).
    - name: Refuse an early context that is not the admitted launch-binding context (play 2, after re-entry; before any use)
      ansible.builtin.assert:
        that:
          - _rh_sa_decl.early_view.context_fields is mapping
          - _rh_sa_decl.early_view.launch_context_fields is mapping
          - _rh_sa_decl.early_view.context_fields.keys() | intersect(_rh_sa_decl.early_view.launch_context_fields.keys() | list) | list | length == 0
          - (rh_source_bootstrap.context.keys() | list | sort) == ((_rh_sa_decl.early_view.context_fields.keys() | list) + (_rh_sa_decl.early_view.launch_context_fields.keys() | list)) | sort
          - (rh_early_view.context | to_json(sort_keys=true)) == (rh_source_bootstrap.context | dict2items | selectattr('key', 'in', _rh_sa_decl.early_view.context_fields.keys() | list) | items2dict | to_json(sort_keys=true))
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_repo_root ~ rh_source_bootstrap.context.path_separator ~ rh_source_bootstrap.context.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh_source_bootstrap.context.refusal_grammar,
                                   'rh_rf_code': _rh_sa_decl.early_view.refusal,
                                   'rh_rf_detail': [_rh_sa_decl.early_view.text]}) }}
        quiet: true

    # tp is an EXACT reserved_outputs entry (global.yml remote_harness_schema.reserved_outputs), so the route guard of
    # play 1 (task 1, this host) already refused any pre-supplied tp before this set_fact; no second check is added.
    - name: Bind the resolved target_prereq policy (derived here, after the guards of play 1)
      ansible.builtin.set_fact:
        tp: "{{ rh.controller.bootstrap.target_prereq }}"

    # s7 (codex-tick425-426 R5H-SELECTION-SCHEMA-RETIREMENT): tr.preservation_selection.input_var is the ONE selector;
    # the policy copy control.input_var is retired (C1, same atomic join) and read nowhere -- the s6 owner-drift assert
    # is removed with it. A selected run refuses BEFORE the evaluator when a declared dependency of the selected path is
    # absent: the control tasks file, the shared evaluation and the case file (each a declared rel joined by the CORE
    # path_admission.separator, not the target_prereq-only tp.reuse.path_separator). Framing: the ONE shared refusal grammar entry (rh exists after the resolve above; reached
    # by the declared path_admission.separator), code and detail from tr.preservation_selection.refusal.
    - name: Refuse a selected run whose declared evaluation dependency is absent (before the evaluator)
      ansible.builtin.assert:
        that:
          - ([tp.preservation.evaluation.control.tasks_rel, tp.reuse.preservation_eval_rel, tp.reuse.preservation_cases_rel]
             | map('regex_replace', '^', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator)
             | reject('file') | list | length) == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': tr.preservation_selection.refusal.code,
                                   'rh_rf_detail': [tr.preservation_selection.refusal.detail,
                                                    lookup('ansible.builtin.vars', tr.preservation_selection.input_var)]}) }}
        quiet: true

    - name: The declared preservation-evaluation control tasks (declared control.tasks_rel)
      ansible.builtin.include_tasks: "{{ rh_repo_root ~ tp.reuse.path_separator ~ tp.preservation.evaluation.control.tasks_rel }}"
