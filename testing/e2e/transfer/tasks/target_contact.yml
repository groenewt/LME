---
# testing/e2e/transfer/tasks/target_contact.yml -- B-INITIAL-CONTACT-CONSUMPTION (codex 152001 / B4df): the route's
# raw-only INITIAL CONTACT (testing/remote_harness/tasks/initial_contact.yml, consumer interface revision 6), consumed
# by EVERY B target play before its first module-backed task (observe-target via bind_target.yml, place-target
# directly). An earlier play's admission is not carried over: place-target re-admits.
# Order (the route's own, target_bootstrap.yml): policy resolved -> PRE-CONTACT declaration check (no contact) ->
# INITIAL CONTACT (raw) -> first module. check.yml refuses a target play in which a module-backed row, or the route's
# verify_toolchain_receipt.yml, precedes this include (transfer.decl.yml initial_contact).
# Requires (no defaults): gather_facts false and nothing module-backed earlier in the play; rh (THIS target's
# resolved policy, resolve_policy.yml) and rh_repo_root on this host; hostvars['localhost'].rh (the controller's);
# the inventory root_var / bundle_var of this target; the play var ansible_remote_tmp (transfer.yml target plays).
# Outputs: the route's _rh_tb_ic_* records (records, not authority).

- name: PRE-CONTACT declaration check (no contact) -- the module temp derives from THIS target's declared work root
  vars:
    _inv: "{{ rh.controller.bootstrap.inventory }}"
    _wr: "{{ rh.controller.bootstrap.work_roots }}"
    _pa: "{{ rh.controller.bootstrap.path_admission }}"
    _troot: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var, default='') }}"
    _tbundle: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.bundle_var, default='') }}"
  ansible.builtin.assert:
    that:
      - _troot is string and _troot is match(_pa.regex) and _troot is not search(_pa.forbidden_segment_regex)
      - _troot is match('^/.+/[^/]+$')
      - _tbundle is string and _tbundle is match(_pa.regex) and _tbundle is not search(_pa.forbidden_segment_regex)
      - ansible_remote_tmp == (_troot | dirname) ~ '/' ~ _wr.sub_roots.tmp ~ '/' ~ _wr.remote_tmp_rel
      - ((_troot | dirname) ~ '/') is not match('(' ~ (_wr.admission.refused_prefixes | map('regex_escape') | join('|')) ~ ')')
    fail_msg: >-
      REFUSED {{ _wr.admission.refusal }} on {{ inventory_hostname }} (B target play, before initial contact): the
      inventory {{ _inv.root_var }} ('{{ _troot }}') and {{ _inv.bundle_var }} ('{{ _tbundle }}') must be admitted
      paths, and the module temp must be <parent of {{ _inv.root_var }}>/{{ _wr.sub_roots.tmp }}/{{ _wr.remote_tmp_rel }}
      (got '{{ ansible_remote_tmp }}'), not under {{ _wr.admission.refused_prefixes }}.
    quiet: true

- name: INITIAL CONTACT (route author; raw only, nothing staged) before this play's first module
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/initial_contact.yml"
