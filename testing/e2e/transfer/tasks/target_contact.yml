---
# testing/e2e/transfer/tasks/target_contact.yml -- B's PRIVILEGED first contact (codex 155203
# B-PRIVILEGED-LEG-VS-OWNER-ONLY-CONTACT; route consumer interface revision 9). B's target plays are ROOT legs
# (contract connection_profile privileged), so they consume the route's raw-only INITIAL CONTACT in its declared
# PRIVILEGED variant (testing/remote_harness/tasks/initial_contact.yml, rh_ic_variant: privileged), never the owner
# variant. Included by EVERY B target play right after refuse_pinned_outputs + resolve_policy and before any module
# (observe-target via bind_target.yml, place-target directly); an earlier play's admission is not carried over.
# The contact admits the privileged principal (uid + account), the system interpreter, the root-only ancestry of the
# dedicated root module temp and of every path this play writes as root (rh_ic_paths), and SETS
# ansible_python_interpreter (admitted system python) and ansible_remote_tmp (declared root module temp) as host
# facts. B therefore passes NEITHER as a play var, extra-var or include parameter (either would refuse), sets no
# become, and includes no owner-only route file (admit_ancestry / decide_private_group / reap_staging /
# verify_toolchain_receipt) after it. Owner trust is preserved: the owner toolchain is never read, verified or executed
# on a root leg; a copy-only transfer has no reason to read it. check.yml (transfer.decl.yml initial_contact) refuses
# drift from all of this.
# Requires: gather_facts false and nothing module-backed earlier in the play; rh + rh_repo_root on this host (route
# refuse_pinned_outputs.yml + resolve_policy.yml); tr; lme_transfer_remote_dir.
# Outputs (route rev 9; records, not authority): _rh_tb_ic_uid, _rh_tb_ic_uname, _rh_tb_ic_fst, _rh_tb_ic_avail,
# _rh_tb_ic_iavail, _rh_tb_ic_anc, _rh_tb_ic_fsat (where storage was measured), _rh_tb_ic_tools (tool -> {path,
# resolved, hops, lx, rs, bad}), _rh_tb_ic_py {path, resolved, version} (version set only after custody admission, by
# PRIVILEGED INITIAL CONTACT 4 and its version check/record), _rh_ic_plan (B reads only .variant / .python);
# host facts ansible_python_interpreter, ansible_remote_tmp.

- name: PRIVILEGED INITIAL CONTACT (route author; raw only, nothing staged) before this play's first module
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/initial_contact.yml"
  vars:
    rh_ic_variant: privileged
    # every path this ROOT play writes: REMOTE_DIR and its owned state (staging / incoming / ops), admitted by the
    # route's root-only rule (existing components; absent ones are reported, never created by the contact)
    rh_ic_paths:
      - "{{ lme_transfer_remote_dir }}"
      - "{{ lme_transfer_remote_dir }}/{{ tr.target.state_dir }}/{{ tr.target.staging_dir }}"
      - "{{ lme_transfer_remote_dir }}/{{ tr.target.state_dir }}/{{ tr.target.incoming_dir }}"
      - "{{ lme_transfer_remote_dir }}/{{ tr.target.state_dir }}/{{ tr.target.ops_dir }}"
