---
# testing/e2e/transfer/tasks/admit_state_dir.yml -- the controller state directory (localhost, observe-only).
# Admitted with the route's ONE path-admission rule (tr_bs.path_admission: regex, forbidden segments; ancestry via
# the route's testing/remote_harness/tasks/admit_ancestry.yml). It must already exist, owned by the gate user, mode
# 0700 (the operator creates it like the toolchain root; no default, never created here). The ledger writer
# (controller_ledger.yml) re-admits the ancestry at the use boundary before each write.
# Inputs: tr, tr_bs, rh_repo_root, lme_transfer_state_dir, lme_transfer_label. Outputs: tr_state, tr_out.

- name: Admit the state directory path and the label (no default)
  ansible.builtin.assert:
    that:
      - lme_transfer_state_dir is defined and lme_transfer_state_dir is string
      - lme_transfer_state_dir is match(tr_bs.path_admission.regex)
      - lme_transfer_state_dir is not search(tr_bs.path_admission.forbidden_segment_regex)
      - lme_transfer_label is defined and lme_transfer_label is string and lme_transfer_label is match(tr.inputs.label_regex)
    fail_msg: >-
      TRANSFER-STATE-INPUT: lme_transfer_state_dir ({{ lme_transfer_state_dir | default('') }}) must be a normalized
      absolute path matching {{ tr_bs.path_admission.regex }}; lme_transfer_label must match {{ tr.inputs.label_regex }}.
    quiet: true

- name: The gate user's uid
  ansible.builtin.command:
    argv: ["{{ tr_bs.os_tools.id.path }}", -u]
  register: _tr_me
  changed_when: false

# The ancestry (links, directories, owners, other-writable, group-writable only under owner_private_group) is the
# route's ONE rule, testing/remote_harness/tasks/admit_ancestry.yml (route revision 5; codex 143342). No local copy.
- name: Admit the state directory's ancestry through the route's ONE rule
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_ancestry.yml"
  vars:
    rh_anc_bs: "{{ tr_bs }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ lme_transfer_state_dir }}"
    rh_anc_refusal: TRANSFER-STATE-DIR

- name: Stat the state directory itself (no link following)
  ansible.builtin.stat:
    path: "{{ lme_transfer_state_dir }}"
    follow: false
    get_checksum: false
  register: _tr_sdir

- name: Refuse a state dir that is absent, or not a directory owned 0700 by the gate user (ancestry admitted above)
  ansible.builtin.assert:
    that:
      - _tr_sdir.stat.exists and _tr_sdir.stat.isdir and not _tr_sdir.stat.islnk
      - _tr_sdir.stat.uid == (_tr_me.stdout | int)
      - _tr_sdir.stat.mode == '0700'
    fail_msg: >-
      TRANSFER-STATE-DIR: {{ lme_transfer_state_dir }} is missing, a link, not a directory, or not owned by uid
      {{ _tr_me.stdout }} with mode 0700. Create it once: install -d -m 0700 <dir>.
    quiet: true

- name: Publish the state layout and the output files deploy_gate reads
  ansible.builtin.set_fact:
    tr_state:
      dir: "{{ lme_transfer_state_dir }}"
      ledger: "{{ lme_transfer_state_dir }}/{{ tr.controller_state.ledger }}"
      pending: "{{ lme_transfer_state_dir }}/{{ tr.controller_state.pending_dir }}"
      uid: "{{ _tr_me.stdout | int }}"
    tr_out: >-
      {{ dict(['contract_json', 'ssh_argv', 'machine_id', 'transfer_receipt']
              | zip(['contract_json', 'ssh_argv', 'machine_id', 'transfer_receipt']
                    | map('extract', tr.outputs)
                    | map('regex_replace', '^', lme_transfer_state_dir ~ '/' ~ tr.outputs.prefix ~ lme_transfer_label))) }}
