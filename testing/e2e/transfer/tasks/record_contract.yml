---
# testing/e2e/transfer/tasks/record_contract.yml -- publish the resolved contract for deploy_gate (localhost,
# effect: three files in the admitted state dir, atomic writes). deploy_gate builds its ssh argv ONLY from
# tr_out.ssh_argv and re-reads the endpoint identity against tr_out.machine_id before every target effect.
# The contract also carries the target's controller-resolved scope (tr_scope_expect: scope ids and digests,
# scopes_sha256, binding); a later stage whose resolution differs refuses TRANSFER-CONTRACT-DRIFT.
# Inputs: tr, tr_contract, tr_ssh_argv, tr_out, tr_scope_expect, hostvars[lme_transfer_target].tr_target,
# lme_transfer_remote_dir.

- name: Write the contract, deploy_gate's ssh argv and the endpoint identity
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    mode: '0600'
  loop:
    - dest: "{{ tr_out.contract_json }}"
      content: >-
        {{ tr_contract | combine({'identity': hostvars[lme_transfer_target].tr_target.identity,
                                  'remote_dir': lme_transfer_remote_dir,
                                  'ssh_argv': tr_ssh_argv,
                                  'scope': tr_scope_expect}) | to_nice_json }}
    - {dest: "{{ tr_out.ssh_argv }}", content: "{{ (tr_ssh_argv | join('\n')) ~ '\n' }}"}
    - {dest: "{{ tr_out.machine_id }}", content: "{{ hostvars[lme_transfer_target].tr_target.identity ~ '\n' }}"}
  loop_control:
    label: "{{ item.dest }}"
