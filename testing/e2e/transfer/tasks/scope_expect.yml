---
# testing/e2e/transfer/tasks/scope_expect.yml -- B-PER-HOST-POLICY-BINDING, controller side (localhost, observe-only).
# C1 field contract (inbox 033500 field_contract; codex 023332): the controller's own resolution publishes
# lme_resolved.remote_harness.{scope, binding, scope_sha256, scopes, scopes_sha256}. The EXPECTED identity of the
# transfer target is the controller-resolved scopes.targets[<target>] entry -- its FULL policy digest and exact
# scope digest -- never the controller's own policy copied onto the target, never a remerge.
# Inputs: tr, tr_scope_target (REQUIRED, set by the caller: bind_controller.yml passes lme_transfer_target; the phase
# driver passes its declared stand-in host), lme_resolved (this host's). Outputs: tr_scope_expect.

- name: Refuse a controller resolution without the complete per-scope identity, or a target that is not a scope member
  vars:
    _c: "{{ lme_resolved.remote_harness }}"
    _hex: '^[0-9a-f]{64}$'
  ansible.builtin.assert:
    that:
      - tr_scope_target is defined
      - tr_scope_target is string
      - tr_scope_target | length > 0
      - _c.schema_version | default(none) == tr.projection_schema_version
      - _c.scope | default(none) is mapping
      - _c.scope.kind | default('') == tr.policy_scope.controller_kind
      - _c.scope.id | default('') == inventory_hostname
      - _c.binding | default(none) is mapping
      - tr.policy_scope.binding_keys | reject('in', _c.binding) | list | length == 0
      - _c.scope_sha256 | default('') is match(_hex)
      - _c.scopes_sha256 | default('') is match(_hex)
      - _c.policy_sha256 | default('') is match(_hex)
      - _c.scopes | default(none) is mapping
      - _c.scopes.controller | default(none) is mapping
      - _c.scopes.controller.scope_sha256 | default('') == _c.scope_sha256
      - _c.scopes.targets | default(none) is mapping
      - tr_scope_target in _c.scopes.targets
      - tr_scope_target in (_c.binding.deployment.targets | default([]))
      - _c.scopes.targets[tr_scope_target].kind | default('') == tr.policy_scope.target_kind
      - _c.scopes.targets[tr_scope_target].id | default('') == tr_scope_target
      - _c.scopes.targets[tr_scope_target].scope_sha256 | default('') is match(_hex)
      - _c.scopes.targets[tr_scope_target].policy_sha256 | default('') is match(_hex)
      # the target's artifact reuse key (exact per-target; never sole reuse permission)
      - _c.scopes.targets[tr_scope_target].shared_artifact_inputs_sha256 | default('') is match(_hex)
      # compatibility digest (ADDITIONAL check only) must be present 64-hex on both scopes; never defaulted to ''
      - _c.scope_invariant_sha256 | default('') is match(_hex)
      - _c.scopes.targets[tr_scope_target].scope_invariant_sha256 | default('') is match(_hex)
    fail_msg: >-
      TRANSFER-POLICY-SCOPE: the controller resolution (schema {{ _c.schema_version | default('?') }}, scope
      {{ _c.scope | default('absent') }}) lacks the complete per-scope identity, or {{ tr_scope_target | default('?') }}
      is not a target member of its deployment ({{ _c.binding.deployment.targets | default('?') }}). Nothing was changed.
    quiet: true

- name: Publish the expected scope identity of the transfer target (controller-resolved; carried by contract and receipt)
  ansible.builtin.set_fact:
    tr_scope_expect:
      scopes_sha256: "{{ lme_resolved.remote_harness.scopes_sha256 }}"
      binding: "{{ lme_resolved.remote_harness.binding }}"
      controller:
        id: "{{ lme_resolved.remote_harness.scope.id }}"
        scope_sha256: "{{ lme_resolved.remote_harness.scope_sha256 }}"
        policy_sha256: "{{ lme_resolved.remote_harness.policy_sha256 }}"
      target:
        id: "{{ tr_scope_target }}"
        scope_sha256: "{{ lme_resolved.remote_harness.scopes.targets[tr_scope_target].scope_sha256 }}"
        policy_sha256: "{{ lme_resolved.remote_harness.scopes.targets[tr_scope_target].policy_sha256 }}"
        scope_invariant_sha256: "{{ lme_resolved.remote_harness.scopes.targets[tr_scope_target].scope_invariant_sha256 }}"
        shared_artifact_inputs_sha256: "{{ lme_resolved.remote_harness.scopes.targets[tr_scope_target].shared_artifact_inputs_sha256 }}"
