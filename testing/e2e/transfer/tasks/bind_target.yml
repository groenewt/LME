---
# testing/e2e/transfer/tasks/bind_target.yml -- the target prelude of BOTH entry playbooks (target host,
# observe-only, as the declared privilege under the ADMITTED system python). The route's PRIVILEGED first contact
# (target_contact.yml) right after the policy is resolved, the admission of this target's OWN controller-resolved
# scope (scope_admit.yml), then everything the target must satisfy before any mutation (target_observe.yml).
# codex 155203 B-PRIVILEGED-LEG-VS-OWNER-ONLY-CONTACT: the owner receipt verification (verify_toolchain_receipt.yml)
# is REMOVED from this root leg -- owner trust (profile owner_trust: privileged_verification forbidden) means a root
# play neither verifies nor executes the owner toolchain, and a copy-only transfer has no reason to read it. Where an
# operation genuinely needs target toolchain readiness it is verified in a separate declared OWNER connection play;
# B's transfer declares none (it copies an archive; it runs nothing from the owner's toolchain).
# Outputs: tr_scope, tr_bs, tr_adapter, tr_target.
# The route's refuse_pinned_outputs.yml is NOT included here: it is the first task of the including observe-target
# play, before the entry guard derives tr / tr_dir (transfer.decl.yml entry_guard); a second include on the same host
# would refuse the rh_repo_root it derived itself.

- name: Resolve the harness policy on this host (route author)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

# Everything above is controller-side (lookups, assert, set_fact). The route's raw PRIVILEGED first contact admits
# the principal, the system interpreter, the root module temp and the root-written paths, and sets the interpreter and
# module temp, before the FIRST module this play stages on the target.
- name: The route's PRIVILEGED INITIAL CONTACT (raw only; first after the policy, before any module)
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_contact.yml"

# B-PER-HOST-POLICY-BINDING (codex 021809/023332; C1 033500): THIS target's own resolved scope must be exactly the
# controller-resolved scopes.targets[this id] (scope + FULL policy digest), same scopes_sha256 and same deployment
# (incl. endpoints), source edition and operation. The source-edition binding carries the profile digest the former
# equality compared.
- name: Admit only the controller-resolved policy of THIS target's scope (before any mutation)
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/scope_admit.yml"

- name: Bind B to the resolved policy on this host
  ansible.builtin.set_fact:
    tr_bs: "{{ rh.controller.bootstrap }}"
    tr_adapter: "{{ rh.transfer.adapters[rh.transfer.adapter] }}"

- name: Everything the target must satisfy before its first mutation
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_observe.yml"
