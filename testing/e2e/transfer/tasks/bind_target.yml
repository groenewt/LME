---
# testing/e2e/transfer/tasks/bind_target.yml -- the target prelude of BOTH entry playbooks (target host,
# observe-only, under the target's system python, as the declared privilege). The route author's ONE consumer
# verification of the target's toolchain receipt, the admission of this target's OWN controller-resolved scope
# (scope_admit.yml), then everything the target must satisfy before any mutation (target_observe.yml).
# Outputs: tr_scope, tr_bs, tr_adapter, tr_target.

- name: Refuse pre-supplied harness outputs (route author; first task on this host too)
  ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

- name: Resolve the harness policy on this host (route author)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

# B-PER-HOST-POLICY-BINDING (codex 021809/023332; C1 033500): THIS target's own resolved scope must be exactly the
# controller-resolved scopes.targets[this id] (scope + FULL policy digest), same scopes_sha256 and same deployment
# (incl. endpoints), source edition and operation. The source-edition binding carries the profile digest the former
# equality compared. It runs BEFORE the receipt verification, so the policy that renders the expected artifact is
# already the admitted one.
- name: Admit only the controller-resolved policy of THIS target's scope (before any mutation)
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/scope_admit.yml"

# The expected rendered artifact bytes: verify_toolchain_receipt.yml derives the expected seed sha256 from a fresh
# render of THIS host's admitted policy and checks every recorded artifact checksum against the installed files; a
# same-reuse-key / different-seed-bytes install refuses there (RH-TOOLCHAIN-RECEIPT). The reuse key admits nothing.
- name: Verify the target's toolchain receipt (route author's ONE consumer verification; read-only)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/verify_toolchain_receipt.yml"
  vars:
    rh_tc_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var, default='') }}"
    rh_tc_owner: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.owner_var, default='') }}"

- name: Bind B to the resolved policy on this host
  ansible.builtin.set_fact:
    tr_bs: "{{ rh.controller.bootstrap }}"
    tr_adapter: "{{ rh.transfer.adapters[rh.transfer.adapter] }}"

- name: Everything the target must satisfy before its first mutation
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_observe.yml"
