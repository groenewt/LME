---
# testing/e2e/transfer/tasks/refuse_reserved_families.yml -- B's reserved-name FAMILY guard (codex-tick333 (2)).
#
# The route's refuse_pinned_outputs.yml compares EXACT names only (manifests/global.yml reserved_outputs /
# resolver_outputs); a registered name FAMILY (remote_harness_schema.reserved_output_patterns, each a
# contract_admission.patterns name) is refused at runtime by its consumer's own guard (global.yml, the comment above
# reserved_output_patterns). This is that guard for B's entries. It is the SECOND task of the first play of every host
# class of each B entry (transfer.yml, resolve_target.yml, phase_driver.yml, target_prereq.yml, reclaim.yml,
# testing/e2e/target_prereq/owner_key.yml -- J-KEY, which also requires reserved_owner_key_vars in its own assert): after
# refuse_pinned_outputs.yml (which refuses a supplied rh_repo_root and then derives it) and BEFORE any value of a
# reserved name can reach an include path, a lookup or a privilege selection.
#
# Every expression is INLINE (a task var or include parameter could itself be outranked by an extra var). It reads
# the registry from the byte-bound global.yml under the just-derived rh_repo_root and applies EVERY registered family
# (the same set the loader's matcher applies to declared names), so a family C1 registers later is enforced here with
# no edit. It refuses, before matching anything:
#   * an absent / empty family list, or a family name without a declared anchored pattern ('^...$');
#   * a registry that does not yet declare the families codex accepted for B's entries (reserved_transfer_vars,
#     reserved_prereq_vars): the ATOMIC join -- until C1's pattern hunk lands every B entry refuses here
#     (RESERVED-FAMILY-REGISTRY), which is the intended ordering, never a silent pass. The reclaim family
#     (reserved_reclaim_vars, PROPOSED, not yet reviewed) is required only by reclaim.yml's own entry assert, so the
#     transfer / prereq entries never wait on it; once registered it is enforced here like every other family.
# Raw registry read: the same byte-bound manifests/global.yml the route's refuse_pinned_outputs.yml reads raw before
# any policy resolution (its SEED-06 raw-read justification, codex-232517 raw_readers); no profile is read.
# Then any variable NAME visible on this host (extra var, inventory host/group var, play var, or a fact an earlier play
# of the same run left) that fully matches a family refuses RESERVED-FAMILY-DERIVED-OUTPUT-PINNED with the list of
# names in Python list form (e.g. ['tr_conn']). Output: none (no set_fact, no register).

- name: Refuse a registry without the reserved-name families (atomic C1 join; before any match)
  ansible.builtin.assert:
    that:
      - >-
        ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
         | default([])) | length > 0
      - >-
        ['reserved_transfer_vars', 'reserved_prereq_vars']
        | difference((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
                     | default([]))
        | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | difference((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns.keys() | list)
        | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
        | map('first') | reject('equalto', '^') | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
        | map('last') | reject('equalto', '$') | list | length == 0
    fail_msg: >-
      REFUSED RESERVED-FAMILY-REGISTRY on {{ inventory_hostname }}: manifests/global.yml
      lme_config_registry.remote_harness_schema.reserved_output_patterns must be non-empty, name only declared anchored
      contract_admission.patterns, and include reserved_transfer_vars and reserved_prereq_vars (C1 pattern hunk; B's
      entries refuse until it lands).
    quiet: true

- name: Refuse pre-supplied names of a reserved family (extra-vars / inventory / earlier facts cannot pin them)
  ansible.builtin.assert:
    that:
      - >-
        vars.keys() | list
        | select('match', '(' ~ ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
                                 | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
                                 | join(')|(')) ~ ')')
        | list | length == 0
    fail_msg: >-
      REFUSED RESERVED-FAMILY-DERIVED-OUTPUT-PINNED on {{ inventory_hostname }}:
      {{ vars.keys() | list
         | select('match', '(' ~ ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
                                  | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
                                  | join(')|(')) ~ ')')
         | sort | list }}
      match a registered reserved-name family (reserved_output_patterns); they are outputs of the harness, never inputs.
    quiet: true
