---
# <entry directory>/tasks/refuse_reserved_families.yml -- B's reserved-name FAMILY guard of ONE entry directory
# (brr-follow BR-05; codex OD-F05-07 "materialize required family guards before qualification"; transfer.decl.yml
# entry_guard.family_rel with relativity entry_dir). The SAME bytes are materialised at
#   testing/e2e/target_prereq/tasks/refuse_reserved_families.yml   (prereq_observe.yml, owner_key.yml)
#   testing/remote_harness/tasks/refuse_reserved_families.yml      (target_prereq.yml, controller_prereq.yml)
#   testing/e2e/transfer/tasks/refuse_reserved_families.yml        (check.yml, transfer.yml, resolve_target.yml)
#
# The route's refuse_pinned_outputs.yml compares EXACT names only; a registered name FAMILY
# (remote_harness_schema.reserved_output_patterns, each a contract_admission.patterns name) is refused here, as the
# SECOND task of the first play of every host class of each entry in this directory: after refuse_pinned_outputs.yml
# (which refuses a supplied rh_repo_root and then derives it from the profile location) and BEFORE any value of a
# reserved name can reach an include path, a lookup or a privilege selection. Every expression is INLINE (a task var or
# include parameter could itself be outranked by an extra var). Output: none (no set_fact, no register).
#
# VOCABULARY (brr-follow OD-BRR-04, codex-tick543): the refusal codes, detail texts and the families the registry must
# carry are B-owned DATA in transfer.decl.yml transfer.entry_guard.family_guard, located through the profile's
# controller.entry_generation.declaration_rel (the same profile location refuse_pinned_outputs.yml derives rh_repo_root
# from) and read BEFORE any family match. Task 1 admits that vocabulary; an absent or malformed node refuses with the
# registry's declared declaration-missing contract (published_views.entry_generation_contract refusal + message). Every
# clause precedes the clauses that read what it proves (Ansible stops at the first false clause).

- name: Refuse an absent or malformed B family-guard declaration (before any vocabulary use)
  ansible.builtin.assert:
    that:
      - >-
        'entry_generation' in (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel
        is string
      - >-
        (rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel)
        is file
      - >-
        'family_guard' in (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.keys()
        | list | sort == ['refusals', 'required_families', 'texts']
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.refusals.keys()
        | list | sort == ['pinned', 'registry']
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.texts.keys()
        | list | sort == ['pinned', 'registry']
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.required_families
        is sequence
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.required_families
        | length > 0
    fail_msg: >-
      REFUSED {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.published_views.entry_generation_contract.refusal }}
      on {{ inventory_hostname }}:
      {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.published_views.entry_generation_contract.message }}
      (transfer.entry_guard.family_guard must carry exactly refusals {pinned, registry}, texts {pinned, registry} and a
      non-empty required_families list)
    quiet: true

- name: Refuse a registry without the reserved-name families (atomic C1 join; before any match)
  ansible.builtin.assert:
    that:
      - >-
        'reserved_output_patterns' in (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        is sequence
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | length > 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.required_families
        | difference((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns)
        | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | difference((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns.keys() | list)
        | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
        | map('first') | reject('equalto', '^') | list | length == 0
      - >-
        (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
        | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
        | map('last') | reject('equalto', '$') | list | length == 0
    fail_msg: >-
      REFUSED {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.refusals.registry }}
      on {{ inventory_hostname }}:
      {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.texts.registry }}
    quiet: true

- name: Refuse pre-supplied names of a reserved family (extra-vars / inventory / earlier facts cannot pin them)
  ansible.builtin.assert:
    that:
      - >-
        vars.keys() | list
        | select('match', '(' ~ ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
                                 | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
                                 | join(')|(')) ~ ')')
        | list | length == 0
    fail_msg: >-
      REFUSED {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.refusals.pinned }}
      on {{ inventory_hostname }}:
      {{ vars.keys() | list
         | select('match', '(' ~ ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.reserved_output_patterns
                                  | map('extract', (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission.patterns)
                                  | join(')|(')) ~ ')')
         | sort | list }}
      {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/profiles/remote-harness.yml') | from_yaml).profile_overlay.lme_global.remote_harness.controller.entry_generation.declaration_rel) | from_yaml).transfer.entry_guard.family_guard.texts.pinned }}
    quiet: true
