---
# testing/e2e/transfer/tasks/scope_admit.yml -- B-PER-HOST-POLICY-BINDING, target side (target host, observe-only).
# Replaces the former exact controller==target policy equality (codex 021809/023332). THIS host resolved its OWN
# policy (resolve_policy.yml on this host); it must be EXACTLY the scope the controller resolved for it:
#   own scope {kind: target, id: this host}; scope_sha256 and policy_sha256 == controller scopes.targets[this id];
#   scopes_sha256 equal (one deployment); binding.deployment (incl. endpoints) / source_edition / operation equal;
#   shared_artifact_inputs_sha256 == the controller-resolved value for this target (exact, never sole permission).
# scope_invariant_sha256 is an ADDITIONAL compatibility check only: equal invariants never admit a different scope
# (a wrong-target policy with the same compatibility digest refuses on scope_sha256/policy_sha256).
# Inputs: tr, lme_resolved (this host's), hostvars.localhost.tr_scope_expect, rh_config_revision. Outputs: tr_scope.

- name: Refuse a target policy that is not the controller-resolved policy of THIS target's scope (before any mutation)
  vars:
    _t: "{{ lme_resolved.remote_harness }}"
    _e: "{{ hostvars['localhost'].tr_scope_expect }}"
    _hex: '^[0-9a-f]{64}$'
  ansible.builtin.assert:
    that:
      - _t.schema_version | default(none) == tr.projection_schema_version
      - _t.scope | default(none) is mapping
      - _t.scope.kind | default('') == tr.policy_scope.target_kind
      - _t.scope.id | default('') == inventory_hostname
      - _e.target.id == inventory_hostname
      - _t.scope_sha256 | default('') is match(_hex)
      - _t.policy_sha256 | default('') is match(_hex)
      - _t.scopes_sha256 | default('') is match(_hex)
      - _t.scope_sha256 == _e.target.scope_sha256
      - _t.policy_sha256 == _e.target.policy_sha256
      - rh_config_revision == _t.policy_sha256
      - _t.scopes_sha256 == _e.scopes_sha256
      - _t.scopes | default(none) is mapping
      - _t.scopes.targets | default(none) is mapping
      - inventory_hostname in _t.scopes.targets
      - _t.scopes.targets[inventory_hostname].scope_sha256 | default('') == _t.scope_sha256
      - _t.binding | default(none) is mapping
      - tr.policy_scope.binding_keys | reject('in', _t.binding) | list | length == 0
      - tr.policy_scope.binding_keys | map('extract', _t.binding) | list == tr.policy_scope.binding_keys | map('extract', _e.binding) | list
      # this target's artifact reuse key equals the controller-resolved one for THIS target (exact; an additional
      # check, never sole reuse permission)
      - _t.shared_artifact_inputs_sha256 | default('') is match(_hex)
      - _t.shared_artifact_inputs_sha256 == _e.target.shared_artifact_inputs_sha256
      # ADDITIONAL compatibility check only (never identity); both sides must be present 64-hex (no vacuous '' == '')
      - _t.scope_invariant_sha256 | default('') is match(_hex)
      - _e.target.scope_invariant_sha256 | default('') is match(_hex)
      - _t.scope_invariant_sha256 == _e.target.scope_invariant_sha256
    fail_msg: >-
      TRANSFER-POLICY-SCOPE: {{ inventory_hostname }} resolved scope {{ _t.scope | default('absent') }}
      scope_sha256={{ _t.scope_sha256 | default('?') }} policy_sha256={{ _t.policy_sha256 | default('?') }}
      scopes_sha256={{ _t.scopes_sha256 | default('?') }}; the controller expects
      {{ _e.target | to_json }} in scopes {{ _e.scopes_sha256 }} with the same deployment, source edition and
      operation. A wrong-target policy, another deployment/edition/operation or an incomplete identity refuses here,
      before any target mutation.
    quiet: true

- name: Publish this target's admitted scope identity (edition record + receipt carry it)
  ansible.builtin.set_fact:
    tr_scope:
      id: "{{ lme_resolved.remote_harness.scope.id }}"
      scope_sha256: "{{ lme_resolved.remote_harness.scope_sha256 }}"
      policy_sha256: "{{ lme_resolved.remote_harness.policy_sha256 }}"
      scopes_sha256: "{{ lme_resolved.remote_harness.scopes_sha256 }}"
