---
# testing/e2e/transfer/tasks/controller_ledger.yml -- the ONE controller-ledger writer (controller, effect).
# B-CROSS-ROOT-RECOVERY residual (codex 150646): several controller roots may share one state directory, so a
# read-modify-write append (lineinfile) can lose another root's `start` or terminal row. Every controller-ledger
# write goes through controller_ledger_write.yml, which appends under the ONE shared lock
# <state_dir>/<controller_state.ledger_lock> with O_APPEND (macro ctl_ledger_append).
# EVERY controller-ledger write includes THIS file: localhost plays (source_stage start/fail, controller_recover
# abandon) and the PRIVILEGED place-target play's terminal write, delegated to the controller with the route's
# controller_delegation pins (an OWNER-CONTROLLER execution boundary, codex 163642
# B-CONTROLLER-LEDGER-ANCESTRY-REFRESH). The state dir's ancestry is re-admitted HERE, at each use boundary, through
# the route's ONE shared rule (admit_ancestry.yml; never duplicated), then the write.
# Inputs: tr, rh_repo_root, _cl_bs (the controller's resolved controller.bootstrap), _cl_state (the controller's
#         tr_state: dir, ledger, uid), _cl_flock (os_tools.flock: path, identity), _cl_lines (the ledger lines, in
#         order). Effects: those lines appended, nothing else.

- name: Re-admit the state directory's ancestry at the use boundary (route's ONE rule)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_ancestry.yml"
  vars:
    rh_anc_bs: "{{ _cl_bs }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ _cl_state.dir }}"
    rh_anc_refusal: TRANSFER-STATE-DIR

- name: Append under the shared ledger lock (the ONE writer)
  ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/controller_ledger_write.yml"
