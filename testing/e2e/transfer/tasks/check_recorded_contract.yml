---
# testing/e2e/transfer/tasks/check_recorded_contract.yml -- the transfer consumes the SAME contract every other
# stage uses (localhost, observe-only): the one recorded by resolve_target.yml must exist and equal a fresh
# resolution (an inventory changed between stages refuses).
# Inputs: tr_contract, tr_ssh_argv, tr_out, tr_scope_expect, lme_transfer_remote_dir. Outputs: tr_recorded.

- name: Stat the recorded contract
  ansible.builtin.stat:
    path: "{{ tr_out.contract_json }}"
    follow: false
  register: _tr_rc

- name: Read the recorded contract
  ansible.builtin.slurp:
    src: "{{ tr_out.contract_json }}"
  register: _tr_rcb
  when: _tr_rc.stat.exists and _tr_rc.stat.isreg

- name: Refuse a missing or different recorded contract
  ansible.builtin.assert:
    that:
      - _tr_rc.stat.exists and _tr_rc.stat.isreg and not _tr_rc.stat.islnk
      - (_tr_rcb.content | b64decode | from_json) | dict2items | rejectattr('key', 'in', ['identity', 'remote_dir', 'ssh_argv', 'scope']) | items2dict == tr_contract
      - (_tr_rcb.content | b64decode | from_json).ssh_argv == tr_ssh_argv
      - (_tr_rcb.content | b64decode | from_json).remote_dir == lme_transfer_remote_dir
      # a contract recorded under another scope resolution (policy, deployment, edition, operation) is stale
      - (_tr_rcb.content | b64decode | from_json).scope | default(none) == tr_scope_expect
    fail_msg: >-
      TRANSFER-CONTRACT-DRIFT: {{ tr_out.contract_json }} is absent or differs from the contract resolved now (including
      the target's controller-resolved scope); run the gate's contract resolution (resolve_target.yml) for this label
      first.
    quiet: true

- name: Publish the recorded contract
  ansible.builtin.set_fact:
    tr_recorded: "{{ _tr_rcb.content | b64decode | from_json }}"
