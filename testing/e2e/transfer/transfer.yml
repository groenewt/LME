---
# testing/e2e/transfer/transfer.yml -- ENTRY: deploy_gate stage `rsync` (adapter managed_archive), B-owned.
# Started only through the route's executor entrypoint, AFTER resolve_target.yml recorded the contract:
#   <bundle>/lme-controller-seed.sh run --root <controller root> -- -i <inventory> testing/e2e/transfer/transfer.yml \
#     -e lme_transfer_target=<alias> -e lme_transfer_ssh_key=<path or ''> -e lme_transfer_state_dir=<abs>
#     -e lme_transfer_label=<label> -e lme_transfer_remote_dir=<abs> -e lme_transfer_src=<repo root>
# Declared plays (transfer.decl.yml entries; check.yml refuses drift):
#   observe-controller (localhost: policy, executor, contract == recorded, state dir, committed source)
#   observe-target     (target: receipt, revision, tools, privilege, identity == recorded, REMOTE_DIR, owned state)
#   stage-controller   (localhost: recover interrupted ops, build + bind the edition archive)
#   place-target       (target: stage, verify, promote, prune, read back; controller archive removed in `always`)
#   record-transfer    (localhost: the receipt deploy_gate requires for PASS)
# Every play is any_errors_fatal: no effect play starts unless every observation passed on every host.
- name: observe-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    tr_dir: "{{ playbook_dir }}"
    tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Controller prelude (policy, executor, contract, state dir)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_controller.yml"

    - name: The transfer consumes the recorded contract every other stage uses
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/check_recorded_contract.yml"

    - name: Admit the committed source edition
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/source_admit.yml"

- name: observe-target
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    tr_dir: "{{ playbook_dir }}"
    tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
  tasks:
    - name: Target prelude (receipt, policy revision, tools, privilege, identity, REMOTE_DIR, owned state)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_target.yml"

    - name: Refuse an endpoint that is not the one every other stage addressed
      ansible.builtin.assert:
        that:
          - tr_target.identity == hostvars['localhost'].tr_recorded.identity
        fail_msg: "TARGET-IDENTITY-MISMATCH: {{ tr.contract.identity_file }} {{ tr_target.identity }} != recorded {{ hostvars['localhost'].tr_recorded.identity }}"
        quiet: true

- name: stage-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    tr_dir: "{{ playbook_dir }}"
    tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
  tasks:
    - name: Recover interrupted operations (exact recorded paths only)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/controller_recover.yml"

    - name: Build and bind the edition archive
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/source_stage.yml"

- name: place-target
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    tr_dir: "{{ playbook_dir }}"
    tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
  tasks:
    - name: Stage, verify, promote, prune, read back
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_place.yml"

- name: record-transfer
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  vars:
    tr_dir: "{{ playbook_dir }}"
    tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
  tasks:
    - name: Record the transfer receipt
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/record_transfer.yml"
