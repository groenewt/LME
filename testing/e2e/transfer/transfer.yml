---
# testing/e2e/transfer/transfer.yml -- ENTRY: deploy_gate stage `rsync` (adapter managed_archive), B-owned.
# Started only through the route's executor entrypoint, AFTER resolve_target.yml recorded the contract:
#   <bundle>/lme-controller-seed.sh run --root <controller root> -- -i <inventory> testing/e2e/transfer/transfer.yml \
#     -e lme_transfer_target=<alias> -e lme_transfer_ssh_key=<path or ''> -e lme_transfer_state_dir=<abs>
#     -e lme_transfer_label=<label> -e lme_transfer_remote_dir=<abs> -e lme_transfer_src=<repo root>
# Declared plays (transfer.decl.yml entries; check.yml refuses drift):
#   observe-controller (localhost: policy, executor, contract == recorded, state dir, committed source)
#   observe-target     (target: PRIVILEGED INITIAL CONTACT, scope, revision, tools, privilege, identity == recorded, REMOTE_DIR, owned state)
#   stage-controller   (localhost: recover interrupted ops, build + bind the edition archive)
#   place-target       (target: PRIVILEGED INITIAL CONTACT again, stage, verify, promote, prune, read back; controller archive removed in `always`)
#   record-transfer    (localhost: the receipt deploy_gate requires for PASS)
# Every play is any_errors_fatal: no effect play starts unless every observation passed on every host.
# ENTRY GUARD (codex tick318-321 item 2; transfer.decl.yml entry_guard; check.yml refuses drift): tr and tr_dir are
# DERIVED outputs, never play vars (an extra-var outranks a play var). On each host's FIRST play the first four tasks
# are: the route's refuse_pinned_outputs.yml (exact names), B's tasks/refuse_reserved_families.yml (the registered
# tr_ / _tr_ / tp_ / ... name FAMILIES; codex-tick333), the set_fact deriving tr_dir / tr from the magic playbook_dir, and the
# equality assert (an extra-var would outrank the set_fact; the assert reads the effective value and refuses
# TRANSFER-DERIVED-OUTPUT-PINNED). Nothing before them uses tr / tr_dir. Later plays reuse the host's facts and never
# re-include the guard (it would refuse rh_repo_root, which it derived itself).
- name: observe-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/refuse_reserved_families.yml"

    - name: Derive the transfer declaration and its directory (entry guard; never a play var or an input)
      ansible.builtin.set_fact:
        tr_dir: "{{ playbook_dir }}"
        tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Refuse a pinned transfer declaration or directory (entry guard; before any use)
      ansible.builtin.assert:
        that:
          - tr_dir == playbook_dir
          - tr == (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer
        fail_msg: >-
          TRANSFER-DERIVED-OUTPUT-PINNED: {{ (['tr_dir'] if tr_dir != playbook_dir else [])
          + (['tr'] if tr != (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer else []) }}
          were supplied from outside the entry (extra-var); they are derived here from playbook_dir, never inputs.
        quiet: true

    - name: Controller prelude (policy, executor, contract, state dir)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_controller.yml"

    - name: The transfer consumes the recorded contract every other stage uses
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/check_recorded_contract.yml"

    - name: Admit the committed source edition
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/source_admit.yml"

- name: observe-target
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
    ansible_ssh_password: "{{ hostvars['localhost'].tr_conn.ansible_ssh_password }}"
    ansible_private_key: "{{ hostvars['localhost'].tr_conn.ansible_private_key }}"
    ansible_ssh_private_key: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key }}"
    ansible_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_private_key_passphrase }}"
    ansible_ssh_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_passphrase }}"
    # no ansible_remote_tmp / ansible_python_interpreter / become here: the PRIVILEGED contact sets the interpreter and
    # the root module temp as host facts and refuses any outranking value (check.yml refuses these play vars)
  tasks:
    - name: Refuse pre-supplied harness outputs (route author; first task on this host)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/refuse_reserved_families.yml"

    - name: Derive the transfer declaration and its directory (entry guard; never a play var or an input)
      ansible.builtin.set_fact:
        tr_dir: "{{ playbook_dir }}"
        tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Refuse a pinned transfer declaration or directory (entry guard; before any use)
      ansible.builtin.assert:
        that:
          - tr_dir == playbook_dir
          - tr == (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer
        fail_msg: >-
          TRANSFER-DERIVED-OUTPUT-PINNED: {{ (['tr_dir'] if tr_dir != playbook_dir else [])
          + (['tr'] if tr != (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer else []) }}
          were supplied from outside the entry (extra-var); they are derived here from playbook_dir, never inputs.
        quiet: true

    - name: Target prelude (privileged contact, scope, policy revision, tools, privilege, identity, REMOTE_DIR, owned state)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/bind_target.yml"

    - name: Refuse an endpoint that is not the one every other stage addressed
      ansible.builtin.assert:
        that:
          - tr_target.identity == hostvars['localhost'].tr_recorded.identity
        fail_msg: "TARGET-IDENTITY-MISMATCH: {{ tr.contract.identity_file }} {{ tr_target.identity }} != recorded {{ hostvars['localhost'].tr_recorded.identity }}"
        quiet: true

- name: stage-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Recover interrupted operations (exact recorded paths only)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/controller_recover.yml"

    - name: Build and bind the edition archive
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/source_stage.yml"

- name: place-target
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
    ansible_ssh_password: "{{ hostvars['localhost'].tr_conn.ansible_ssh_password }}"
    ansible_private_key: "{{ hostvars['localhost'].tr_conn.ansible_private_key }}"
    ansible_ssh_private_key: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key }}"
    ansible_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_private_key_passphrase }}"
    ansible_ssh_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_passphrase }}"
    # no ansible_remote_tmp / ansible_python_interpreter / become here (as observe-target)
  tasks:
    # an earlier play's admission is not carried over (route revision 8): re-admit before this play's first module.
    # rh / rh_repo_root persist on this host from observe-target's refuse_pinned_outputs + resolve_policy.
    - name: The route's PRIVILEGED INITIAL CONTACT (raw only; first, before any module)
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_contact.yml"

    - name: Stage, verify, promote, prune, read back
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/target_place.yml"

- name: record-transfer
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Record the transfer receipt
      ansible.builtin.include_tasks: "{{ tr_dir }}/tasks/record_transfer.yml"
