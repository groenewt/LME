---
# testing/e2e/transfer/resolve_work_root.yml -- the transfer controls' DECLARED work-root rules, from the RESOLVED
# policy (never the raw profile): the route's refuse_pinned_outputs.yml (first task; it locates the repository from
# playbook_dir, at most 3 levels up, which is why this file sits in transfer/ and not in controls/) and
# resolve_policy.yml, then rh.controller.bootstrap.work_roots and path_admission (codex 135012/135500).
# Run by controls/run_controls.yml before its work root exists:
#   <ansible-playbook> -i localhost, testing/e2e/transfer/resolve_work_root.yml
# The payload also carries the resolved controller.bootstrap map, which run_controls.yml hands to the route's ONE
# ancestry rule (testing/remote_harness/tasks/admit_ancestry.yml, rh_anc_bs) for the work root.
# It writes nothing. Its one output line is `TR-WORK-ROOTS <base64 of the JSON payload> TR-WORK-ROOTS-END`
# (base64: the debug output JSON-escapes quotes). No transport, no target, no managed generation.
- name: transfer controls -- resolve the declared work root
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Resolve the harness policy (route author; the resolved `rh`, never the raw profile)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

    - name: The resolved work-root rules are declared
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.work_roots is mapping
          - rh.controller.bootstrap.work_roots.anchor == 'repository_checkout'
          - rh.controller.bootstrap.work_roots.root_rel is string and rh.controller.bootstrap.work_roots.root_rel | length > 0
          - rh.controller.bootstrap.work_roots.sub_roots.run is string
          - rh.controller.bootstrap.work_roots.runners.transfer_controls is string
          - rh.controller.bootstrap.work_roots.admission.refused_prefixes | length > 0
          - rh.controller.bootstrap.path_admission.regex is string
        fail_msg: "CONTROLS-WORK-ROOT: the resolved policy declares no usable controller.bootstrap.work_roots / path_admission"
        quiet: true

    - name: TR-WORK-ROOTS
      ansible.builtin.debug:
        msg: >-
          TR-WORK-ROOTS {{ {'repo_root': rh_repo_root, 'work_roots': rh.controller.bootstrap.work_roots,
                           'path_admission': rh.controller.bootstrap.path_admission,
                           'bootstrap': rh.controller.bootstrap} | to_json | b64encode }} TR-WORK-ROOTS-END
