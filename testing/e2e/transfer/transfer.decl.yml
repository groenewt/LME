---
# testing/e2e/transfer/transfer.decl.yml -- deploy_gate TARGET CONTRACT + TRANSFER (stage `rsync`): DECLARATIONS.
# Owner: B (lifecycle/provenance). Review threads: codex-tick119-WP1-sliceA-review-20260923-221652,
# codex-tick123-B-WP1A-v2-source-review-20260923-230504, codex-tick123-124-decisions-20260923-230204.
#
# Representation (operator EVERY-file rule): this file + the route author's resolved remote_harness policy (`rh`,
# produced by testing/remote_harness/tasks/resolve_policy.yml; never re-read raw by B) -> genuine macros
# (macros/transfer.j2) -> the ENTRY playbooks and their task files (all YAML).
# ENTRY GENERATION AND VERIFICATION CONTRACT (codex-tick417 option B; B r5h; PROPOSED, every element UNRUN; this comment
# states the declared contract -- it is not operator authority and grants no generated-file exemption):
#   * inputs: this file (its `entry_sets`, `entry_guard`, `entry_forms` -- the structural construction data, keyed by
#     each entry's repository-relative identity <dir>/<file>; the generated members are those whose output is
#     entry_forms.outputs.generated, each play naming its owner-held body file -- the body is statically imported at
#     run time (entry_forms.construct.body_task), so its PATH is a construction input and its bytes are not), the resolved policy
#     `rh`, and the reusable entry construction macros (templates/macros/transfer.j2 entry_plays / entry_document,
#     R1-owned); no host inventory, credential or machine-specific value is baked into an entry (runtime Ansible
#     expressions stay runtime expressions);
#   * template/import closure, structural inputs, operation selection and the EXACT output roster: registered by C1 in
#     the existing manifest registry/projection (shared-artifact declaration + its input/import proof; the roster
#     registered from the B-owned roster source generation.roster_rel below, outside every generation input) -- no
#     second loader, merge or defaults engine;
#   * the generation consumer: ONE declared authoring-only operation at testing/remote_harness/package.yml after
#     resolve_policy and admit_builder (R2 proposal, C1 serializes) -- admitted builder, admitted source, owned staged
#     mirror and toolchain admitted BEFORE any write; it contacts no managed target and acquires no unrelated artifact;
#   * committed together: the declared inputs, the templates and the generated entries, under existing scoped ownership;
#     ordinary deployment EXECUTES those admitted checkout bytes and never regenerates its own first guard;
#   * equality gate: the SAME consumer in verify mode renders the declared roster into a staged mirror and compares
#     exact bytes with the committed entries before any dependent invocation; a missing, extra-owned, stale or modified
#     roster output refuses and is never repaired during deployment; expected outputs come from the roster, never from
#     discovering whichever generated files exist;
#   * the generation inputs, template closure and roster are bound to the source evidence; the recorded output digests
#     live only in the accepted generation record (generation.records; r5k), required by verify / package / invocation
#     and never by the first generate;
#     configuration revision stays distinct from deployment identity.
# check.yml COVERAGE (r5j, codex-tick425-426 R5H-STRUCTURAL-COVERAGE-CLAIM; narrowed to what is implemented): for every
# declared entry (`entries` / `entry_sets` below) it checks exact play names / order, host placement, any_errors_fatal,
# gather_facts, play keys, derived play vars and the declared entry head (first tasks: guard / family / bind / assert /
# bare-name refusal, their module keys and arguments); a generated member must also EQUAL, as data, what entry_plays
# constructs. OPEN REQUIREMENT (not implemented, not claimed): module classes of the remaining tasks, blocks below the
# head and nested includes / imports (incl. the bodies' own includes) are NOT walked.
#
# Execution: deploy_gate.sh (pre-existing hand-written bash, residual debt) only starts the entry playbooks through
# the route's generated seed launcher (rh.controller.bootstrap.seed_launcher.caller_argv; ssh_auth.run_argv):
#   "$LME_CONTROLLER_LAUNCHER" run <controller root> <ssh auth mode> -i <inventory> <entry playbook> <args>
# The launcher execs the bundle seed's `run` under env -i with exactly the declared seed_launch environment
# (see gate_launch). resolve_harness.yml then refuses any executor that is not the managed generation of the INVENTORY-declared root.
# Policy: B reads ONLY the resolved policy `rh` (resolve_policy.yml -> lme_resolved.remote_harness.policy, route
# consumer interface revision 10, route 0bef305); no B file reads manifests/profiles/remote-harness.yml.
transfer:
  schema_version: 3
  gate_stage: rsync
  implements_adapter: managed_archive

  # ---- the route author's task files B includes, bound by exact path + sha256 (check.yml refuses drift; any other
  # include is refused). All are observe-only (stat/slurp/assert/set_fact/command-read/raw-read) per their headers.
  route_includes:
    - {rel: testing/remote_harness/entry_bodies/controller_prereq/cpq-controller.yml, sha256: 71527587fe3dafde8903b07f1c4fcb6a4e74250444fa9e8300710d3fd5fc1b6a}
    - {rel: testing/remote_harness/entry_bodies/controller_prereq/cpq-privileged.yml, sha256: 7584ece7c5955da8ec9d93a13461b50a519dacef3d1120b6d5009867c422bb8f}
    - {rel: testing/remote_harness/entry_bodies/controller_prereq/cpq-report.yml, sha256: a31efd2d376f804aab4e64e7a7d529eac051fb1edbb119d8715d5de8beccd7e5}
    - {rel: testing/remote_harness/tasks/admit_ancestry.yml, sha256: 152cca12df101f1de5c02cdcd1d886438942e12e113badb385b7d6c0565234c6}
    - {rel: testing/remote_harness/tasks/admit_binding_receipt.yml, sha256: 851c403a6e2684abf8f336e444cd2d6d16869fc9ed1aabbf9e67a11234f694be}
    - {rel: testing/remote_harness/tasks/decide_private_group.yml, sha256: 54749cf6312ef6b92699195fed1f82ba9f871d815926d9818539cb7e6a7851de}
    - {rel: testing/remote_harness/tasks/initial_contact.yml, sha256: 3f5f44555e9302a8f231fd3b5666b2f32d9309740c97d7052ddcf239e0baae73}
    - {rel: testing/remote_harness/tasks/refuse_pinned_outputs.yml, sha256: d408cfcd24cd3af79c2a4bb9572fde3f6278b8e60ae28b44911d9e170b579a0c}
    - {rel: testing/remote_harness/tasks/resolve_policy.yml, sha256: ff2ce4b02abafe3316de5e396669f673f769e349397ad0a0285bd020e77b1817}
    - {rel: testing/remote_harness/tasks/resolve_harness.yml, sha256: 750c8f221915e94c131ce670efd166946c245975592e174ec741396a7d13567c}
    - {rel: testing/remote_harness/tasks/verify_toolchain_receipt.yml, sha256: bee8af84bc5b1137ab7a781409355796286d4377a6f81b2ad179f6d723bdedb3}
  # route revision 12 (MAIN MR-03, codex-tick606 MR03-INTERFACE-JOIN): ELEVEN files -- + the three authored
  # controller_prereq entry bodies and tasks/admit_binding_receipt.yml; every member at its actual bytes (the
  # generated controller_prereq.yml entry is NOT a member, Codex504 OD-R4-03 c). The text below is the revision-8 note.
  # the route's PINNABLE consumer interface (R-B4) these SEVEN files form (route revision 8, codex 155203:
  # initial_contact.yml carries two declared variants, owner and PRIVILEGED; B's root target plays include only the
  # privileged one; admit_ancestry.yml / decide_private_group.yml are the ONE ancestry admission, used by B only on
  # localhost plays; verify_toolchain_receipt.yml stays pinned as part of the interface set but is NOT included by
  # any B root play -- owner trust). check.yml recomputes interface_sha256 from the files (sha256 of the lines
  # "<sha256>  <path relative to base>\n" sorted by path); bind_controller.yml refuses a resolved policy whose
  # controller.bootstrap.consumer_interface (revision, digest, file set) differs (TRANSFER-ROUTE-INTERFACE).
  route_interface:
    base: testing/remote_harness
    revision: 12                                   # MAIN MR-03: eleven files (see route revision 12 note above); == profile consumer_interface.revision
    interface_sha256: 423e713e3d9348c3d891cffd745b9a2e54dedd53658254f0b98f03d79a195282
  # ENTRY GUARD (codex tick318-321 item 2). tr and tr_dir are DERIVED outputs, never play vars or inputs: the first
  # play of each host class (localhost, target) of both entry playbooks begins with exactly the route guard include
  # (refuse_pinned_outputs.yml, which refuses every C1-reserved name incl. tr / tr_dir / tr_repo_root once the C1 hunk
  # lands), then this set_fact, then this assert (an extra-var outranks set_fact, so the effective value is compared
  # with its derivation before any include or lookup uses it). Later plays of that host never re-include the guard
  # (a second include refuses itself). tr_repo_root is derived in tasks/bind_controller.yml from rh_repo_root and
  # asserted equal; the phase driver's input is drv_repo_root. check.yml (macros/transfer.j2 violations) compares
  # these strings exactly.
  # TRANSFER-FIRST-GUARD-CHECKER (codex-tick333): the effective execution boundary is checked too. The ONE admitted
  # first-include expression of each entry directory is RENDERED from entry_forms (codex-tick405 Q3; rooted at the
  # magic playbook_dir; rh_repo_root is derived INSIDE the
  # guard, so a guard reached through it could be another file while the later route-include hash check still
  # passes); later route includes keep their accepted forms. Each guard task carries exactly task_keys (no when,
  # ignore_errors, failed_when, tags, loop, delegate_to or any other keyword that can skip, suppress or redirect it) and
  # the assert exactly assert_args. Every walked play carries only play_keys: pre_tasks and roles run before tasks,
  # and play-level keywords (ignore_errors, check_mode, tags, ...) reach the guard tasks.
  # r5m (codex-tick440 P5_imports): the in-play first guard is ADDITIONAL verification only (a runtime first task
  # cannot protect static import parsing). Its file (guard_route_rel) and the family guard (family_rel, under each
  # entry directory) are members of the AUTHORED PROTECTED SET (never generated, never a roster row), named here, and C1
  # lists them in that set (C1-R5M-9). Declared importers and their executable closure are admitted at the existing
  # pre-launch boundary (R2). The construction side reads these same names (R1 s8 coordination, X-R1-R5M-2).
  entry_guard:
    refusal: TRANSFER-DERIVED-OUTPUT-PINNED
    protected_set_members: [guard_route_rel, family_rel]
    guard_route_rel: testing/remote_harness/tasks/refuse_pinned_outputs.yml
    # RESERVED FAMILIES (codex-tick333 (2)): the SECOND task is B's family guard <this directory>/family_rel, exactly its
    # rendered entry form (entry_forms); it refuses every registered reserved_output_patterns family (tr_ / _tr_ / tp_ / _tp_ / rcl_ /
    # _rcl_ / the guest and observation families) before the set_fact below. First entry only (a later play of the
    # host carries the facts it derived, e.g. tr_conn). Positions: the entry's declared head over entry_forms.roles.
    family_rel: tasks/refuse_reserved_families.yml
    # RELATIVITY (brr-follow BR-03; F05-PATH-RELATIVITY, S3-SEAM-10): how each protected_set_members value resolves --
    # repository = a repository-relative rel; entry_dir = joined under EACH entry directory (D <separator> value). Exact
    # key set == protected_set_members. With family_rel: entry_dir every entry directory carries its OWN family guard
    # (BR-05 materialised for testing/e2e/target_prereq and testing/remote_harness), the construction renders the
    # family include against the entry directory (templates/macros/entry_construct.j2 dir_forms family_target, record
    # BRR-B-TPL-01) and entry_forms.by_dir family_up is 0 for every directory (OD-BRR-01 states the alternative).
    relativity: {guard_route_rel: repository, family_rel: entry_dir}
    # FAMILY GUARD VOCABULARY (brr-follow OD-BRR-04, codex-tick543): the codes, detail texts and the families the registry
    # must carry, read by every materialised <entry directory>/family_rel from THIS declaration (located by the profile's
    # controller.entry_generation.declaration_rel) before any family match. An absent or malformed node refuses with the
    # registry's published_views.entry_generation_contract code (the declaration-missing contract), never a guard literal.
    family_guard:
      refusals: {registry: RESERVED-FAMILY-REGISTRY, pinned: RESERVED-FAMILY-DERIVED-OUTPUT-PINNED}
      texts:
        registry: 'manifests/global.yml lme_config_registry.remote_harness_schema.reserved_output_patterns must be present, a non-empty list, name only declared anchored contract_admission.patterns, and include every family of transfer.entry_guard.family_guard.required_families (C1 pattern hunk; the entries of this directory refuse until it lands)'
        pinned: 'match a registered reserved-name family (reserved_output_patterns); they are outputs of the harness, never inputs'
      required_families: [reserved_transfer_vars, reserved_prereq_vars]
    task_keys:
      include: [ansible.builtin.include_tasks, name]
      family: [ansible.builtin.include_tasks, name]
      bind: [ansible.builtin.set_fact, name]
      assert: [ansible.builtin.assert, name]
      refuse_bare: [ansible.builtin.assert, name]      # codex-tick414: the bare derived-name refusal (target_prereq task 3)
    assert_args: [fail_msg, quiet, that]
    play_keys: [any_errors_fatal, connection, gather_facts, hosts, name, tasks, vars]
    derived: [tr, tr_dir]
    derived_elsewhere: {tr_repo_root: tasks/bind_controller.yml}
    bind:
      tr_dir: "{{ playbook_dir }}"
      tr: "{{ (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer }}"
    that:
      - tr_dir == playbook_dir
      - tr == (lookup('ansible.builtin.file', playbook_dir ~ '/transfer.decl.yml') | from_yaml).transfer
  # engine projection B consumes on EVERY host (resolve_policy.yml): lme_resolved.remote_harness.schema_version
  projection_schema_version: 3
  # B-PER-HOST-POLICY-BINDING (codex 021809/023332; C1 field contract inbox 033500, projection schema 3). C1 resolves
  # per host: each host's lme_resolved.remote_harness carries its OWN scope {kind, id}, binding, policy_sha256,
  # scope_sha256 = digest({scope, binding, policy_sha256}) and the deployment-wide scopes / scopes_sha256.
  #   * controller (tasks/scope_expect.yml): its own scope is kind controller_kind; the transfer target must be a
  #     member of binding.deployment.targets and of scopes.targets; tr_scope_expect = that target's entry;
  #   * target (tasks/scope_admit.yml): its own scope is kind target_kind with id == inventory_hostname, and its
  #     scope_sha256 and FULL policy_sha256 equal the controller-resolved scopes.targets[its id]; scopes_sha256 and
  #     every binding_keys value equal. Never the controller's policy copied onto a target, never a remerge;
  #   * scope_invariant_sha256 is an ADDITIONAL compatibility check only (both 64-hex, equal); it never admits;
  #   * the contract, the target's edition record and the receipt carry the scope ids and digests.
  policy_scope:
    status: final
    controller_kind: controller
    target_kind: target
    binding_keys:
      - deployment
      - source_edition
      - operation
    # endpoint: tasks/endpoint_bind.yml binds B's contract endpoint to binding.deployment.endpoints[<id>]; its rules
    # are READ from the resolved rh.controller.bootstrap.ssh_auth.composition + inventory.owner_var (no copy here).
  # B task files live here (relative to the entry playbook directory); includes are written "{{ tr_dir }}/tasks/<f>".
  tasks_dir: tasks

  # ---- B-INITIAL-CONTACT-CONSUMPTION + B-PRIVILEGED-LEG-VS-OWNER-ONLY-CONTACT (route revision 8, codex 155203):
  # B's target plays are ROOT legs, so EVERY target play includes the route's raw INITIAL CONTACT in the PRIVILEGED
  # variant before its first module (an earlier play's admission is not carried over). check.yml walks each target
  # play in order and refuses:
  #   * a play whose first include of `route_rel` is missing, or does not pass rh_ic_variant == `variant` (the owner
  #     variant, or none, is refused on a root play);
  #   * before it: any row whose module is not in `contact_free_modules`, or a route include other than
  #     `pre_contact_route` (controller-side policy resolution);
  #   * after it: any include of `owner_only_route` in TARGET context (owner-only; they would refuse, and owner trust
  #     forbids them). The same files stay valid in OWNER-CONTROLLER context (codex 163642/164854): the EFFECTIVE
  #     settings at that row (inherited down blocks, include `apply` and include parameters, every descendant override
  #     recomputing them; include parameters kept as a SEPARATE layer that outranks every block/task var below it,
  #     Ansible's precedence, codex 170810) are delegate_to == `controller_scope.delegate_to`, no other
  #     `tracked_keywords`, every `pin_vars` key's effective value EXACTLY its declared expression (string equality;
  #     nothing evaluated), no `invalidating_vars` in either layer;
  #   * anywhere in the play: an include parameter named in `refused_include_vars` (it would outrank the contact's
  #     admitted interpreter / module temp), a play var in `refused_play_vars`, or the play keyword `become`.
  # There is NO owner connection play in B: a copy-only transfer needs no target toolchain readiness.
  initial_contact:
    route_rel: testing/remote_harness/tasks/initial_contact.yml
    variant: privileged
    pre_contact_route: [testing/remote_harness/tasks/refuse_pinned_outputs.yml, testing/remote_harness/tasks/resolve_policy.yml]
    contact_free_modules: [ansible.builtin.assert, ansible.builtin.set_fact, ansible.builtin.debug, ansible.builtin.include_tasks]
    owner_only_route: [testing/remote_harness/tasks/admit_ancestry.yml, testing/remote_harness/tasks/decide_private_group.yml,
                       testing/remote_harness/tasks/reap_staging.yml, testing/remote_harness/tasks/verify_toolchain_receipt.yml]
    refused_include_vars: [ansible_python_interpreter, ansible_remote_tmp, ansible_become, ansible_become_user]
    refused_play_vars: [ansible_python_interpreter, ansible_remote_tmp, ansible_become, ansible_become_user,
                        ansible_become_method, ansible_become_password]
  # execution scope of a delegated task inside a target play (check.yml macros scope_fold / scope_is_ctl; codex 164854
  # B-CONTROLLER-SCOPE-CHECKER-FALSE-PASS). pin_vars are the EXACT accepted expressions (compared as strings, never
  # evaluated; this file is data, read by lookup): the route's controller_delegation connection and python_var, and
  # the controller's own run temp. Any other value -- even one mentioning those names -- is target context.
  controller_scope:
    delegate_to: localhost
    tracked_keywords: [delegate_to, connection, remote_user, become, become_user, become_method]
    pin_vars:
      ansible_connection: '{{ hostvars[''localhost''].tr_bs.inventory.controller_delegation.connection }}'
      ansible_python_interpreter: '{{ lookup(''ansible.builtin.vars'', hostvars[''localhost''].tr_bs.inventory.controller_delegation.python_var) }}'
      ansible_remote_tmp: '{{ lookup(''ansible.builtin.env'', ''TMPDIR'') or ''~/.ansible/tmp'' }}'
    invalidating_vars: [ansible_host, ansible_port, ansible_user, ansible_ssh_executable, ansible_ssh_common_args,
                        ansible_ssh_extra_args, ansible_become, ansible_become_user, ansible_become_method]

  # ---- declared plays of each entry playbook (check.yml: exact names, order, host placement, module classes) ----
  # hosts: localhost | target  (target == the literal expression below; nothing else is admitted)
  target_hosts_expr: '{{ lme_transfer_target }}'
  entries:
    resolve_target.yml:
      - {id: observe-controller, kind: observe, hosts: localhost}
      - {id: observe-target,     kind: observe, hosts: target}
      - {id: record-contract,    kind: effect,  hosts: localhost}
    transfer.yml:
      - {id: observe-controller, kind: observe, hosts: localhost}
      - {id: observe-target,     kind: observe, hosts: target}
      - {id: stage-controller,   kind: effect,  hosts: localhost}
      - {id: place-target,       kind: effect,  hosts: target}
      - {id: record-transfer,    kind: effect,  hosts: localhost}
  # ENTRY CLOSURE (brr-follow BR-08; codex-tick534 OD-S3-04, codex-tick522 OD-S2-07; S3-SEAM-13 shape): B DECLARES the
  # executable closure of each top-level `entries` playbook beyond its guard pair: every task file it includes
  # (transitively), every template / macro file a lookup('ansible.builtin.template') or a Jinja import reaches, joined
  # under the entry directory (relativity entry_dir; values full-match the registry rel_path grammar after joining).
  # Declared ONCE: no member here is a guard-closure member (entry_guard.protected_set_members), a route_includes rel
  # or a source_admission.members_rel entry -- tasks/bind_controller.yml (executed by BOTH entries) is admitted once
  # as a common member (MAIN-shared profile record BRR-PROF-03, members_rel), and route_includes are joined into every
  # key by the loader (S3-SEAM-13 reuse). Completeness is NOT asserted by this list: it is a declaration verified by
  # the declared controls (D-CLOSURE-B-*; removing tasks/bind_controller.yml or templates/call.j2 must prevent
  # execution). Traced (static include / import / lookup walk of the m1-1 candidate + work overlay, brr-follow
  # verify V-TRACE-B). OD-BRR-03 (codex-tick543): the data-driven refusal grammar entry / macros that resolve_contract.yml
  # and check.yml render are {value_of: <policy path>} items -- REPOSITORY-relative, resolved and validated by the loader
  # (F05 SUP03), never joined to the entry directory. check.yml declares its closure here so runners compose it
  # ({closure_of: <importer key>}, OD-BRR-09) instead of restating it.
  entry_closure:
    relativity: entry_dir
    members:
      # MR03-PREREQUISITE-HELPER-CLOSURE (codex-tick606): the nested helpers of the COMMON member tasks/bind_controller.yml
      # (:60 scope_expect, :82 resolve_contract, :85 endpoint_bind, :88 admit_state_dir), the call.j2 -> macros/transfer.j2 ->
      # macros/entry_construct.j2 chain (resolve_contract.yml :501) and the refusal grammar entry / macros are now
      # source_admission.members_rel members (declared ONCE there; an entry_closure rel restating a common member refuses).
      check.yml: [transfer.decl.yml]
      resolve_target.yml: [tasks/bind_target.yml, tasks/record_contract.yml, tasks/scope_admit.yml, tasks/target_contact.yml,
                           tasks/target_custody.yml, tasks/target_observe.yml]
      transfer.yml: [tasks/bind_target.yml, tasks/check_recorded_contract.yml, tasks/controller_ledger.yml,
                     tasks/controller_ledger_write.yml, tasks/controller_recover.yml, tasks/record_transfer.yml,
                     tasks/scope_admit.yml, tasks/source_admit.yml, tasks/source_stage.yml, tasks/target_contact.yml,
                     tasks/target_custody.yml, tasks/target_observe.yml, tasks/target_place.yml]
  # ENTRY FORMS (codex-tick405 Q3, codex-tick414, codex-tick417 B; B-r1 s6). The depth-specific first-entry include
  # forms of every declared entry directory, the head vocabulary and the CONSTRUCTION values of the generated entries,
  # constructed by the pure templates/macros/entry_construct.j2 (entry_include, form_law, dir_forms, target_vars, head_task,
  # entry_plays, entry_document) and checked by templates/macros/transfer.j2 (play_rules, entry_head, violations; R1 s8).
  # An include renders as expr.open, magic, <up> x path.up_filter, expr.close, the core separator (generation:
  # lme_entry_context.path_separator; check.yml play 1: rh_early_view.context.path_separator -- two projections of the
  # ONE controller.bootstrap.path_admission.separator, reconciled by R2), then the part of the target path below the
  # directory <up> levels reach (the form law refuses an
  # <up> that does not reach it). roles maps construction roles onto the entry_guard.task_keys keys (equal key sets).
  # A head starts with roles.guard then roles.family; roles.bind and roles.assert appear together; roles.bare asserts
  # exactly bare.that_format over bare.pinned_expr. texts are named printf formats (%(name)s) read through the Jinja
  # format filter. A generated document is emit.document_start, the emit.header lines, then per play its metadata and
  # head and its ONE static body import (construct.body_task), all block YAML of the constructed data.
  # J-B5 (r5m; codex-tick435-436 separator_decision; codex-tick446 R1S8-EARLY-CONTEXT option c): the transfer-level
  # path.separator is DELETED. Generation reads the core controller.bootstrap.path_admission.separator through the
  # construction context (lme_entry_context.path_separator); the pre-resolve structural verifier (check.yml play 1)
  # reads it through the early verifier context (rh_early_view.context.path_separator), projected by the R2 producer
  # from the launcher-bound admitted declaration. tp.reuse.path_separator keeps its own owner (target_prereq).
  # B r5p (fold of R1 s9 hunks 0 + 14): the deletion is ATOMIC with C1-S9-EARLY-VIEW-SHAPE, the R2 early-view producer and
  # the R1 s9 consumer move; no legacy exception and no second separator owner is declared here.
  entry_forms:
    magic: playbook_dir
    expr: {open: '{{ ', close: ' }}'}
    path: {up_filter: ' | dirname'}
    roles: {guard: include, family: family, bind: bind, assert: assert, bare: refuse_bare}
    bare:
      pinned_expr: "['tr', 'tp'] | select('in', vars) | list"
      that_format: '%(pinned)s | length == 0'
      host_expr: inventory_hostname
    placement:
      controller_connection: local
      controller: controller
      target: target
      other: 'OTHER:'
      undeclared: UNDECLARED
      # declared REMOTE placements (codex-tick424; R4 r4d S4-1 controller_operation): label -> hosts expression format
      # over the controller host (controller_scope.delegate_to); a remote play takes the target class (head names,
      # contract connection vars). rh_cpq_host is R4's derived output (rh_cpq_* family), emitted as runtime text only.
      remote: {controller_operation: "hostvars['%(host)s'].rh_cpq_host"}
    by_dir:
      testing/e2e/transfer:      {guard_up: 3, family_up: 0}
