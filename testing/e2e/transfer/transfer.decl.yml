  # are derived from that SAME member: output_rel = <dir> ~ core path_admission.separator (rh.controller.bootstrap) ~
  # <file>. A roster row REFERENCES the member (roster_row.member_key = {dir, file}) and supplies ONLY template
  # metadata (roster_row.source_keys; r5k: the recorded digest moved to the accepted record); it never states or
  # overrides output placement. The consumer
  # refuses unless every roster member reference names a marked member and every marked member is referenced exactly
  # once (one identity, no duplicated generated set). lme_entry_struct is built by struct.roles: each entry_forms.select
  # field name -> a declared role (declaration_rel = the ADMITTED declaration's checkout-relative path, as the loader
  # binds it, never a literal; member_dir / member_file = the selected keys). Core separators only: no dependency on a
  # target_prereq declaration (J-B5).
  # BODY CUSTODY: each generated play's static import_tasks path is construction data from entry_sets plays[].body
  # (entry_forms.construct.body_task); body BYTES are no render input, but every body is a member of the admitted
  # executable-source closure (C1 registry) and of the CASES check_copy fixture closure, and its bytes are bound by
  # digest before the generated entry is consumed (bodies.custody below; R2 / C1 joins).
  # The top-level `entries` of this directory are authored (not in the roster).
  # OWNED OUTPUTS (R2H-EXTRA-OWNED-OUTPUTS; r5k R5I-PRIOR-OWNERSHIP-CUSTODY): the PRIOR owned set is NOT in roster_rel
  # (an editable list there let a coherent deletion from both lists hide an old executable). It is the owned member of
  # the ACCEPTED generation record (records.accepted), an R2 operational record of the existing generation lifecycle,
  # immutable once accepted and bound to its source edition and input bindings (records.roles
  # source_edition + inputs; r5m, codex-tick433 R5K-ACYCLIC-RECORD-IDENTITY: the record carries NO digest of itself;
  # its file digest is computed EXTERNALLY and recorded by its successor (predecessor_sha256) and by custody
  # (records.custody)); on acceptance the predecessor is RETAINED (records.retained), never rewritten. roster_rel may carry only retirement
  # INTENT rows (roster_retire_key: {output_rel, reason}); intent never defines ownership. Reconciliation, before
  # acceptance:
  #   * EXPECTED outputs = the current roster only; the accepted record and any observation VALIDATE ownership, never
  #     define or shrink the expected roster;
  #   * obsolete = accepted.owned output_rel NOT in the current roster (= partition (1) `removed` below): each must be
  #     ACCOUNTED -- it carries a retirement intent row (OB-01: no intent refuses) and is then either RETIRED (its path
  #     verified absent by a bounded stat of exactly that path) or OPENED as an obligation (origin = the predecessor;
  #     the path may still be present: OB-06 admits B with y present) -- else ownership.refusals.obsolete. Removing the path from roster_rel (the only editable list)
  #     still leaves it in the immutable accepted.owned, so it is detected. r5p (codex-tick451
  #     R5O-OBSOLETE-CONTRACT-CONSISTENCY): "obsolete" is ONLY this transition's newly removed ownership; carried
  #     obligations (partition (2)) and the historical absence set (records.roles.historical) are checked by their own
  #     laws below and are NEVER re-counted as obsolete or as new removals;
  #   * retirement evidence is CARRIED: the in-progress record (records.in_progress) holds predecessor_sha256 (the
  #     EXTERNAL file digest of the accepted record it started from, never a self-digest) and the pending
  #     {output_rel, reason, state} retirements; a restart resumes from it (never re-derives from the roster); acceptance writes the new accepted record with retired: [{output_rel, reason, predecessor_sha256}]
  #     against the retained predecessor; an interrupted run is never a first generation;
  #   * scope = current roster output_rel UNION accepted.owned output_rel (+ in-progress pending) UNION (r5p) the
  #     predecessor's obligation rows (carried or completing) UNION its historical absence set (records.roles.historical
  #     plus its retired and completed rows): every member is an ATTRIBUTABLE declared path named by a bound record,
  #     each stat'ed exactly once whatever its role (one observation, several laws read it): stat-only, no
  #     directory scan, unrelated files out of scope and preserved;
  #   * extra staged output = a file of the consumer's OWNED staged mirror (bounded listing of that mirror only) not in
  #     the current roster: refused separately (ownership.refusals.extra_staged), never accepted and never copied.
  # R2 implements the operational side (writes, lifecycle); B declares the names, the record locations (r5m, r2i P-1)
  # and the laws here.
  generation:
    roster_rel: testing/e2e/transfer/entry_roster.yml
    roster_key: entry_roster
    identity:
      marker_key: output
      marker_from: entry_forms.outputs.generated   # a reference, not a second literal
      # brr-follow-s2 J-RNP-01: the RENDERED-output marker (a reference); a roster row referencing such a member is a
      # rendered row (the F05 loader's ONE selector _rh_eg_generated); no row discriminator field
      rendered_from: entry_forms.outputs.rendered
      separator_from: controller.bootstrap.path_admission.separator
      output_rel_parts: [member_dir, member_file]
    roster_row:
      member_key: member
      member_keys: [dir, file]
      source_keys: [id, member, template_rel]
      # r5m (r2i CF-2, confirmed): the projected row_keys = source_keys + the C1-DERIVED [output_rel, inputs, bound,
      # checkout_inputs, bound_checkout] (C1 owns those derived names). NO row carries a digest; the r5i sha256 row key
      # is superseded (recorded digests live only in the accepted record).
    roster_retire_key: retire
    retire_row_keys: [output_rel, reason]
    operations:
      # r5p (X-R2J-PRISTINE): may_be_pristine WITHDRAWN; observed record absence is a necessary observation only
      # GEN-ADOPT2 (codex-tick512): record_history_absent = no commit reachable from the admitted HEAD ever touched a record
      # locator (LIN-03 / X-R2J-LINEAGE implemented by the shared git admission's lineage proof; every first generation)
      generate: {evidence: none_recorded, genesis_requires: [records_observed_absent, record_history_absent, independent_genesis_admission], writes: in_progress_then_accepted,
                 # GEN-AUTHORED-TO-GENERATED-ADOPTION (codex-tick506; Codex504 OD-W2-09): the THIRD first-generation path.
                 # GEN-ADOPT2: authored_source_member -> eligibility_admitted (generation.adoption.eligibility) +
                 # source_edition_proven (bounded historical proof) + record_history_absent
                 adoption_requires: [records_observed_absent, record_history_absent, adoption_manifest_admitted, independent_adoption_digest,
                                     present_outputs_accounted, eligibility_admitted, source_edition_proven, retention_verified_before_effect]}
      verify: {evidence: accepted_complete}
      package: {evidence: accepted_complete}
      invoke: {evidence: accepted_complete}
    records:
      accepted: accepted
      in_progress: in_progress
      retained: retained
      # r5m (codex-tick433 R5K-ACYCLIC-RECORD-IDENTITY; R2 r2i P-2): record_sha256 (a full-file self-digest) is REMOVED.
      # A record carries NO digest of itself. Its identity is its EXTERNAL file digest (sha256 of the file bytes as
      # stored), which is held by its successor (predecessor role) and by custody (custody below).
      # ROLE MAPS (R2 r2i P-2): role -> record key. The key set of each record is EXACTLY the values of its role map;
      # there is no second positional key list (one editable declaration). r5o (codex-tick444): removal of the old key
      # lists is ATOMIC with the R2j / R1 s8 / C1 consumer updates (no legacy exception, no parallel declaration); the
      # added roles.completed / completed_roles land in the same R2j join. Role names are the route's consumer names
      # (r2i generate_entries _rh_eg_R.roles).
      roles:
        source_edition: source_edition     # the INDEPENDENT admitted commit generation RAN FROM (never the commit that carries this record)
        revision: revision                 # the config revision of that run
        generation: generation_sha256
        inputs: inputs
        roster: roster_sha256
        outputs: outputs
        owned: owned
        retired: retired
        obligations: obligations           # r5m (codex-tick440): pending retirement obligations carried forward
        completed: completed               # r5o (R5M-OBLIGATION-COMPLETION-PARTITION): carried obligations completed HERE
        # r5p (codex-tick451 R5O-HISTORICAL-ABSENCE-CONTINUITY): the absence expectations of EARLIER revisions (paths an
        # earlier record retired or completed), carried forward so no successor can erase the only enforcement of an
        # old owned path. NOT this transition's accounting: never an input of partitions (1) or (2) below.
        historical: historical_absence
        predecessor: predecessor_sha256
        # GEN-AUTHORED-TO-GENERATED-ADOPTION: ADOPTION PROVENANCE, distinct from predecessor history. The external file
        # digest of the admitted adoption manifest on the FIRST generated record of an adopted lineage (its predecessor is
        # still predecessor_genesis: no accepted predecessor is fabricated); adoption_none otherwise; CARRIED unchanged by
        # every successor (reconciliation.adoption). Excluded from the generation recipe (never a render input).
        adoption: adoption_sha256
      in_progress_roles:
        source_edition: source_edition     # r5m (R2I-INTERRUPTED-OBLIGATIONS): resume binds to the INTENDED inputs /
        revision: revision                 # revision, not predecessor equality alone
        inputs: inputs
        roster: roster_sha256
        predecessor: predecessor_sha256    # the EXTERNAL file digest of the accepted record this run started from
        pending: pending_retire
        obligations: obligations           # inherited from the predecessor, independent of current intents
        staged: staged_outputs
        adoption: adoption_sha256          # GEN-AUTHORED-TO-GENERATED-ADOPTION: bound like the intended inputs; a rebind keeps it
      pending_roles: {output: output_rel, reason: reason, state: state}
      # ADOPTION MANIFEST (GEN-AUTHORED-TO-GENERATED-ADOPTION): a TRACKED, admission-only structured-YAML record at
      # locations.adoption_rel, written and committed by the REVIEWED author commit together with the retention rows (never
      # by generate). Key set = adoption_roles values; each authored row's key set = authored_roles values. Binds the exact
      # authored source commit, the authored path / blob id / sha256 set, the intended generated roster (roster_rel bytes
      # digest) and the retention evidence (one committed copy per authored output under the profile's retention root:
      # reclaim.decl.yml legacy_quarantine record shape -- path, last sha256, last commit, reason; the replacement digest is
      # the first generated record's outputs role, never written here). Its identity is its EXTERNAL file digest, held
      # independently by the adopt transition's digest input, the adopt journal and the accepted adoption role.
      # GEN-ADOPT2 (codex-tick512): roster_blob = the roster authority's blob id AT source_edition (the HISTORICAL roster,
      # proven by the shared historical proof at every operation; equal to the current roster only at admit / repeat).
      # source_edition names an EXISTING commit that already holds the authored bytes and their retention copies
      # (declared procedure: that commit first, the manifest after it -- never a self-referential identity).
      adoption_roles: {source_edition: source_edition, roster: roster_sha256, roster_blob: roster_blob_id, authored: authored, reason: reason}
      authored_roles: {output: output_rel, blob: blob_id, sha256: sha256, retained: retained_rel}
      adoption_none: none
      owned_roles: {output: output_rel, sha256: sha256}
      retired_roles: {output: output_rel, reason: reason, predecessor: predecessor_sha256}
      # obligation row: an output removed from ownership whose retirement is NOT yet completed; origin = the external
      # file digest of the record that last OWNED it (attributable however many acceptances pass).
      obligation_roles: {output: output_rel, reason: reason, origin: origin_sha256, state: state}
      # completed row (r5o): a PREDECESSOR obligation whose path this successor verified ABSENT; origin is copied
      # unchanged from that obligation row (original custody kept), never re-attributed to the predecessor.
      completed_roles: {output: output_rel, reason: reason, origin: origin_sha256}
      # historical absence row (r5p): an output an EARLIER record retired or completed. origin = the external file digest
      # of the record that last OWNED it (a retired row's predecessor role, a completed row's origin, a historical row's
      # origin -- copied, never re-attributed); closed_by = the external file digest of the record that RECORDED its
      # retirement / completion (attributable through the retained-record chain: custody + retention below).
      historical_roles: {output: output_rel, origin: origin_sha256, closed_by: closed_by_sha256}
      # OWNERSHIP RECONCILIATION (codex-tick440 R2I-PREDECESSOR-OWNERSHIP-CLOSURE; r5o codex-tick444
      # R5M-OBLIGATION-COMPLETION-PARTITION; R2j implements): at acceptance and at every verify, against the
      # INDEPENDENTLY bound predecessor P (retained record, custody below) and the successor S, all sets by output_rel.
      # TWO partitions, never one equation over both:
      #   (1) NEWLY REMOVED OWNED OUTPUTS: removed = P.owned MINUS S.owned
      #         removed == S.retired  DISJOINT-UNION  opened(S.obligations)
      #       opened(S.obligations) = the S.obligations rows whose origin == S.predecessor (P last owned them);
      #   (2) CARRIED OBLIGATIONS: P.obligations == carried(S.obligations)  DISJOINT-UNION  S.completed
      #       carried(S.obligations) = the S.obligations rows whose origin != S.predecessor; each carried row and each
      #       completed row keeps the origin (and reason) of the P.obligations row of the same output_rel;
      #   S.obligations == opened DISJOINT-UNION carried (no third kind);
      #   S.owned, S.retired, S.completed, S.obligations are PAIRWISE DISJOINT (a pending obligation path is never
      #   re-owned before it completes: refused, not reconciled).
      # HISTORY IS NEVER NEWLY REMOVED: P.retired and P.completed are NOT inputs of (1) or (2); a completion recorded in
      # an earlier revision is not re-entered, re-retired or re-completed by a successor. Counterexample of codex-tick444
      # (A owns x,y; B owns x, obligation y origin=A; C owns x, completes y): (1) for B->C removed = {} == {} DISJOINT-UNION
      # {}; (2) {y} == {} DISJOINT-UNION {y} -> admitted.
      # A retired or completed row is admitted only after verified actual ABSENCE of its path (bounded stat); verify of
      # the head record re-checks that absence for EVERY S.retired, S.completed and S.historical row each time
      # (repeated verify / reapply), and a reappeared path refuses (refusals.historical_absence for a historical row,
      # refusals.unreconciled_successor otherwise). An obligation's path stays in scope (bounded stat) until it
      # completes. A successor cannot erase the only enforcement of an old owned path.
      # (3) HISTORICAL ABSENCE CONTINUITY (r5p; codex-tick451 R5O-HISTORICAL-ABSENCE-CONTINUITY): a SEPARATE validation,
      #   never part of (1) or (2) and never this transition's new accounting:
      #     H(P) = P.historical  UNION  P.retired  UNION  P.completed            (by output_rel)
      #     S.historical == H(P) MINUS readmitted(S)
      #     readmitted(S) = H(P) INTERSECT S.owned: ONLY by an explicit current-manifest re-admission -- the output is a
      #       current roster row referencing a marked entry_sets member (the normal identity law) AND S.owned carries its
      #       row with the sha256 of the bytes THIS generation produced (new declared ownership, origin = S). It is
      #       validated as new ownership, never as a removal: it is not in removed / retired / completed / obligations,
      #       and it does NOT re-open the history of an earlier revision. A path still in P.obligations is not in H(P),
      #       so re-owning a pending obligation stays refused by `disjoint` (OB-08 unchanged).
      #     each S.historical row: copied unchanged from P.historical, or built from P.retired (origin = that row's
      #       predecessor role, closed_by = S.predecessor) or from P.completed (origin = that row's origin, closed_by =
      #       S.predecessor); an origin / closed_by not equal to the source row is refused (no re-attribution).
      #   The expectation persists while this deployment owns the generated-output namespace (an unbroken bound record
      #   chain: custody below). It ends ONLY by (a) re-admission above or (b) a scoped lifecycle release under its own
      #   declared ownership / retention contract -- NONE is declared in this file, so no release path exists here and
      #   none may be inferred. A configuration / input / source-edition revision alone (a new successor D) never drops
      #   a row: S.historical is derived from P's records, never from configuration. An UNCHANGED apply writes no
      #   successor (the accepted generation identity is preserved; the head's own H-set is what verify re-checks), so
      #   no record is manufactured to exercise history. Only attributable declared paths are inspected: each row's
      #   output_rel (a path named by a bound record), by a bounded stat; never a directory scan.
      reconciliation:
        removed_from: [roles.owned]                # (1) P.owned minus S.owned
        removed_partition: [roles.retired, opened_obligations]
        opened_obligations: {from: roles.obligations, origin_equals: roles.predecessor}
        carried_partition: {from: predecessor.roles.obligations, into: [carried_obligations, roles.completed]}   # (2)
        carried_obligations: {from: roles.obligations, origin_not_equals: roles.predecessor, origin_kept_from: predecessor.roles.obligations}
        completed_origin_kept_from: predecessor.roles.obligations
        obligations_partition: [opened_obligations, carried_obligations]
        disjoint: [roles.owned, roles.retired, roles.completed, roles.obligations, roles.historical]
        not_inputs: [predecessor.roles.retired, predecessor.roles.completed, predecessor.roles.historical]   # history is never newly removed
        completed_requires: verified_absence       # S.retired, S.completed and S.historical rows; re-checked at every verify
        # (3) r5p: the historical absence carry (separate from (1) / (2); R2j implements; controls OB-10..OB-12)
        historical:
          from: [predecessor.roles.historical, predecessor.roles.retired, predecessor.roles.completed]
          into: roles.historical
          minus: readmitted
          readmitted: {intersect: roles.owned, requires: [current_roster_row, owned_sha256_of_this_generation]}
          origin_from: {predecessor.roles.historical: historical_roles.origin, predecessor.roles.retired: retired_roles.predecessor, predecessor.roles.completed: completed_roles.origin}
          closed_by_from: {predecessor.roles.historical: historical_roles.closed_by, predecessor.roles.retired: roles.predecessor, predecessor.roles.completed: roles.predecessor}
          requires: verified_absence               # every row, at acceptance and at every verify of the head
          ends_by: [readmitted, declared_scoped_release]   # declared_scoped_release: none declared in this file
          revision_drops: never
        # GEN-AUTHORED-TO-GENERATED-ADOPTION: adoption provenance is carried, never set, changed or dropped by a successor
        adoption: {carried_from: predecessor.roles.adoption, set_only_when: predecessor_genesis, never_reattributed: true}
      # INTERRUPTED OBLIGATIONS (codex-tick440 R2I-INTERRUPTED-OBLIGATIONS; R2 implements): the in-progress journal
      # carries the predecessor's obligations plus its own pending rows. On resume its obligations reach the successor
      # independently of current intents (removing an intent between attempts does not drop one). A resume whose current
      # source_edition / inputs / revision differ from the journal's takes an EXPLICIT changed-input transition, which
      # keeps every obligation, or it refuses (refusals.changed_input). The journal is cleared only after a VERIFIED
      # successor holds every obligation and the recovery metadata.
      resume:
        bound_to: [in_progress_roles.source_edition, in_progress_roles.inputs, in_progress_roles.revision]
        on_changed_input: explicit_transition_or_refuse
        clear_journal_after: verified_successor
      # RETENTION (codex-tick440 P11_retention): depth is NOT capped at one predecessor by assumption. Every unresolved
      # obligation is carried forward in each successor (above), so pending evidence survives every acceptance. Completed
      # history (each earlier accepted / retained revision) stays recoverable through the existing immutable source path:
      # every accepted and retained revision is a committed tracked file, so its exact bytes come back from the commit
      # that carried it (git object store; no new archive class). Each successor's predecessor role names the previous
      # file digest, so the chain is walkable by digest.
      # r5o (codex-tick444 remaining_join_limits): a predecessor digest alone does NOT establish recoverability. Actual
      # retrieval of retained custody and of completed history (the exact predecessor bytes from the commit that carried
      # them, re-hashed equal to the successor's predecessor role, and a completed row's origin record likewise) is a
      # QUALIFICATION obligation of the R2j join with its own control (controls RET-01); until it runs, recoverability is
      # declared, not established.
      retention:
        pending: carried_forward_in_successor
        historical: carried_forward_in_successor   # r5p: reconciliation.historical; attribution recoverable by RET-01
        completed: committed_source_history
        chain: roles.predecessor
        recoverability: qualification_required    # not implied by chain; RET-01 (UNRUN)
        # GEN-AUTHORED-TO-GENERATED-ADOPTION: authored bytes replaced by the first generated result stay PRESERVED as
        # committed retention rows (verified at every operation while the adoption is carried) and in the commit that
        # carried them; the authored source commit itself is provenance, PROVEN by the shared bounded historical proof at
        # every operation carrying the adoption (GEN-ADOPT2); ADO-RET-01 retrieval qualification is ADDITIONAL (UNRUN)
        adoption: committed_retention_rows
      # DIGEST DOMAINS (codex-tick433: each payload hash has its own named domain; NO canonicalization -- every digest
      # is sha256 over bytes as read or as written in a declared line format, never over a re-serialized structure):
      domains:
        predecessor: 'sha256 of the retained predecessor record FILE bytes as stored'
        roster: 'sha256 of roster_rel file bytes at source_edition'
        # r5o (codex-tick444 digest_decisions.inputs SELECTED): RENDER INPUTS ONLY. No accepted / retained / in-progress
        # record (nor any other admission-only read) is ever a member, so no record enters its own generation inputs.
        inputs: 'mapping render-input checkout-relative path (the admitted render inputs only) -> sha256 of that exact file''s bytes at source_edition'
        outputs: 'mapping output_rel -> sha256 of that generated file''s bytes'
        owned: 'per owned row: sha256 of that output file''s bytes'
        # r5o (codex-tick444 digest_decisions.generation SELECTED, settled): an explicitly named digest of deterministically
        # constructed checksum-line text -- a generation-evidence recipe, not a second manifest loader and not a desired-
        # state canonicalization; no new stored artifact. generation_recipe below is the ONE recipe for production and
        # verification.
        generation: 'sha256 (lowercase hex) of the UTF-8 bytes of the generation_recipe text'
        obligations: 'per obligation row: origin = sha256 of the record FILE bytes that last owned the output'
        completed: 'per completed row: origin copied unchanged from the predecessor obligation row'
        historical: 'per historical row: origin and closed_by copied from the source row (reconciliation.historical); each the external file digest of a record in the bound chain'
      # GENERATION RECIPE (r5o; the same construction in generate and in verify; R2j implements, r2i :818-837 is the
      # producer today): one line per member, line = <exact-file sha256 lowercase hex><line separator><rel><terminator>,
      # concatenated with nothing between lines and nothing after the last terminator; the text is encoded UTF-8 (no BOM)
      # and hashed with entry_generation.digest.algorithm. Members, in this order: (a) every key of roles.inputs, then
      # (b) every key of roles.outputs, each block in ascending Unicode code-point order of rel (Jinja sort with
      # case_sensitive true; Python str order) -- so the record's own components reproduce it whatever the writer's key
      # layout. Every rel is a path ADMITTED by the existing controller.bootstrap.path_admission grammar (no second path
      # grammar). OWNERS (codex-tick444 owner_correction): the line separator is controller.bootstrap.bundle.checksum_format
      # .separator; the terminator is controller.entry_generation.digest.terminator; B declares NO separator or terminator.
      # RETAINED COMPONENT BINDINGS: roles.inputs and roles.outputs of the same record (exact rel -> sha256) are sufficient
      # to reproduce the digest. EXCLUDED: the record file itself, its external digest, roles.generation (its own value),
      # roles.predecessor, every other record and every self-referential field.
      generation_recipe:
        members: [roles.inputs, roles.outputs]       # in this order; keys = rel, values = exact-file sha256
        order_within: codepoint_ascending
        line: [sha256, separator, rel, terminator]
        separator_from: controller.bootstrap.bundle.checksum_format.separator
        terminator_from: controller.entry_generation.digest.terminator
        path_grammar_from: controller.bootstrap.path_admission
        encoding: utf-8
        algorithm_from: controller.entry_generation.digest.algorithm
        excludes: [record_file, record_external_digest, roles.generation, roles.predecessor, roles.adoption, other_records]
      # DIAGNOSTIC DOMAIN (r5o; codex-tick444 source_distinction): r2i's evidence field over admission_rel (:841) is a
      # DIFFERENT, broader field (it may include records). If R2j keeps it, it is named admission_pairs and typed as an
      # ordered LIST of [admission_rel, exact-file sha256] pairs; it is never compared with, nor substituted for,
      # roles.inputs (a mapping over render inputs only).
      diagnostic_domains:
        admission_pairs: 'ordered list of [admission_rel, sha256 of that exact file''s bytes] pairs over the generation admission set; diagnostic evidence only'
      source_edition_regex: '^[0-9a-f]{40}$'   # the source.members commit id form (ls-tree by commit id)
      digest_regex: '[0-9a-f]{64}'
      # PREDECESSOR: the predecessor role holds the declared genesis marker only when no accepted record existed;
      # genesis is admitted ONLY by operations.generate.genesis_requires (observed record absence AND the independent
      # R2j genesis / prior-custody admission; GENESIS above; atomic with R2j; observed absence alone never suffices).
      predecessor_genesis: none
      # LOCATIONS (r5m; codex-tick440 P1_record_placement): B owns the record locators, declared HERE once. C1 projects
      # them for R2 and the derived dispatch view; R2 authors only their operational use (no second placement
      # vocabulary). Inventory / operator overrides keep their established precedence.
      # FRESH-CHECKOUT ADMISSION (codex-tick433; codex-tick440 P10_portable_records RULED): accepted and retained are
      # TRACKED immutable checkout files carried by the existing clone / source and bundle acquisition path (no new
      # artifact class). All retained custody they need is in that artifact closure and is verified before local adoption.
      # They are STRUCTURED YAML (not JSON, not a renamed blob or giant scalar). Exact bytes and schema are preserved, and
      # every digest is over the stored bytes. in_progress is NEVER carried; it lives under the run state root of the
      # controller that started it, and is YAML too (one representation).
      locations:
        accepted_rel: testing/e2e/transfer/generation/accepted.yml
        retained_rel: testing/e2e/transfer/generation/retained.yml
        in_progress: {sub: run, rel: entry-generation/in-progress.yml}
        adoption_rel: testing/e2e/transfer/generation/adoption.yml   # GEN-AUTHORED-TO-GENERATED-ADOPTION (admission-only)
        carry: {accepted: tracked_checkout_file, retained: tracked_checkout_file, in_progress: never, adoption: tracked_checkout_file}
        dir_mode: '0700'
        file_mode: '0600'
        pending_state: pending
        serialise: {format: yaml, structured: true, sort_keys: true}   # writer layout only; never re-serialized for a digest
      # CUSTODY (head record included; no self-digest anywhere): a carried record is admitted ONLY when (a) its path is a
      # member of the committed tree of the admitted source commit, (b) that member's blob id (ls-tree) equals the blob
      # id of the checkout bytes, and (c) its external file sha256 equals the value held OUTSIDE the record: for the
      # retained record, the accepted record's predecessor role; for the newest accepted record (no successor yet), the
      # bundle source.inputs line and the seed dispatch accepted_sha256 that the route computes at admission and carries
      # into the run (r2i P-2 / CF-3). Ownership is never fabricated; a missing carried record is never a fresh deployment.
      custody:
        admitted_by: source.members           # committed_tree membership + blob id, the existing B-COMMIT-INDEX-RACE source
        head_holders: [bundle_source_inputs, seed_dispatch_accepted_sha256]
        retained_holder: roles.predecessor
        blob_id_regex: '^[0-9a-f]{40}$'
      # ADOPTION (aligned to r2i P-16: no separate adoption step). Local adoption = a generate (update or resume) that
      # takes the committed accepted record as its predecessor, ONLY after that record passed custody (a)-(c). An
      # interrupted generate over an adopted record resumes with the SAME predecessor digest, the pending retirements and
      # every carried obligation preserved (r2i RL-10; resume above); it never re-derives any of them from the roster.
      # A deployment with missing prior evidence is loss of custody, never proof of no history (R2I-PRISTINE-
      # CLASSIFICATION; R2 lifecycle).
      # REFUSAL PRECEDENCE (one code per state, so a control can name exactly one in out and the other in out_absent):
      # integrity first -- foreign, then unbound -- then by operation: when the carried accepted record is MISSING and a
      # roster output exists, generate refuses orphan; verify / package / invoke refuse absent.
      precedence:
        integrity: [foreign, unbound]
        missing_record_with_outputs: {generate: orphan, verify: absent, package: absent, invoke: absent}
      refusals:
        absent: TRANSFER-GENERATION-RECORD-ABSENT
        unbound: TRANSFER-GENERATION-RECORD-UNBOUND
        interrupted: TRANSFER-GENERATION-INTERRUPTED
        orphan: TRANSFER-GENERATION-ORPHAN-OUTPUT
        foreign: TRANSFER-GENERATION-RECORD-FOREIGN
        unreconciled_successor: TRANSFER-GENERATION-OWNERSHIP-UNRECONCILED
        changed_input: TRANSFER-GENERATION-RESUME-CHANGED-INPUT
        historical_absence: TRANSFER-GENERATION-HISTORICAL-ABSENCE   # r5p (3): a historical row reappeared or was dropped / re-attributed
        custody_lost: TRANSFER-GENERATION-CUSTODY-LOST   # br-fixed BR-01 (codex F-02 / OD-F05-06; r5u F02-H1 spelling): route generate_entries :764 / :1063-1069 / :1165
        # GEN-AUTHORED-TO-GENERATED-ADOPTION (generic ORPHAN unchanged for every unaccounted present output)
        adoption_unbound: TRANSFER-GENERATION-ADOPTION-UNBOUND
        adoption_prestate: TRANSFER-GENERATION-ADOPTION-PRESTATE
        adoption_retention: TRANSFER-GENERATION-ADOPTION-RETENTION
        adoption_repeat: TRANSFER-GENERATION-ADOPTION-REPEAT
      texts:
        absent: 'verify / package / invocation needs the complete accepted generation record and none is admitted (absent or incomplete); no placeholder is accepted'
        unbound: 'the accepted generation record is unparsable (corrupt), incomplete, not bound to its source revision and input bindings, or carries a digest that is not 64 hex'
        interrupted: 'an in-progress generation record exists: resume its reconciliation (same predecessor digest, pending retirements preserved); the run is not a first generation'
        orphan: 'a roster output exists in the checkout but no accepted or in-progress record owns it (generate); the run is not a first generation and not a fresh deployment'
        foreign: 'a carried generation record is not a member of the admitted committed tree, its blob id differs from the checkout bytes, or its file digest differs from the recorded custody / successor value; ownership is not adopted'
        unreconciled_successor: 'the newly removed owned outputs are not exactly the successor retired rows plus its newly opened obligations, or the predecessor obligations are not exactly its carried obligations plus its completed rows (origin kept), or owned / retired / completed / obligation / historical paths overlap, or a retired / completed path is present (absence not verified); nothing was accepted'
        historical_absence: 'an earlier revision retired or completed this output and no current-manifest re-admission owns it: its path is present, or the successor historical absence set is not exactly the predecessor historical, retired and completed rows minus explicit re-admissions (origin and closed_by kept); nothing was accepted'
        changed_input: 'the in-progress journal was started from a different source edition / inputs / revision and no explicit changed-input transition was requested; every obligation is preserved, nothing was accepted'
        # br-fixed BR-01 (codex tick519 F-02, tick522 ruling 5) BROADENED per codex-tick530 OI-01: the ONE explanation names
        # every actual refusal branch of the consumer (generate_entries.yml e11bf34a :1041-1054 undeclared first generation
        # and genesis over an accepted record; :1355-1363 a record locator tracked in the admitted commit tree; :1386-1389
        # lineage history / shallow repository / failed history query via the shared git admission; :1543-1553 a locator
        # present in the worktree). Code, branches and owner unchanged.
        custody_lost: 'a first generation that is not declared (no accepted record, and no genesis transition, genesis journal or adoption admission), a genesis transition requested over a present accepted record, a record locator tracked in the admitted commit tree or present in the worktree without its accepted record, record history reachable from the admitted commit (records once existed), or a shallow repository or failed history query where the absence of record history cannot be proven: custody of the generated outputs is lost; nothing was generated'
        adoption_unbound: 'an adoption manifest is present without an adoption in progress or recorded, is absent where the lineage records one, is linked, unparsable or not the declared shape, or its file digest is not the supplied, journalled or recorded adoption digest, or its source edition is not a commit reachable from the admitted commit whose tree holds every authored output, every retention copy and the roster at their declared blob ids; nothing was adopted'
        adoption_prestate: 'an adopted output is missing, linked, not a regular file, not its recorded sha256 or committed blob, or the manifest is not exactly the reviewed adoption eligibility (source baseline, authored set, blob ids); at a first adoption or its repeat, an output is not a current roster output, or the manifest does not name the current roster or the roster is not its baseline blob; nothing was adopted'
        adoption_retention: 'an authored output has no preservation row under the declared retention root, or the preserved copy is missing, linked, not committed or not the exact authored bytes, or a preservation row or the manifest lies inside an executable closure; nothing was adopted and nothing may be replaced'
        adoption_repeat: 'a repeated adoption is not the exact recorded transition (first adopted record, same manifest, unchanged apply); an adoption is never a reset'
      causes:   # R5I-CONTROL-CAUSES: the gate and cause each custody control asserts
        # r5m (codex-tick433 CUS-01 correction): the record-integrity failures are a SEPARATE gate, one control per cause
        # (CUS-03 foreign, CUS-04 unbound). CUS-01 is only
        # an ADMITTED fixture whose output hash mismatches, so the run reaches verify_equality.
        CUS-01: {gate: verify_equality, cause: recorded_digest_mismatch}
        CUS-02: {gate: roster_admission, cause: roster_uncommitted_or_absent}
        CUS-03: {gate: record_integrity, cause: record_foreign}     # blob id / external sha256 / committed-tree membership mismatch
        CUS-04: {gate: record_integrity, cause: record_unbound}     # parse or shape failure, custody intact
    # ADOPTION (GEN-AUTHORED-TO-GENERATED-ADOPTION; GEN-ADOPT2 per codex-tick512). B owns this node; C1 projects it as
    # lme_resolved.remote_harness.entry_generation.adoption; R2 consumes it (OD-ADO-04).
    adoption:
      # the derived adoption modes (generate_entries.yml classifies exactly one per run)
      modes: {none: none, admit: admit, repeat: repeat, carried: carried}
      # ELIGIBILITY (codex-tick512 ADO-LOST-RECORD-RELABEL, ADO-HISTORICAL-ROSTER; supersedes the r1 sha256
      # authored_sources set, which byte equality could pass): the independently REVIEWED adoption eligibility --
      # baseline = the reviewed source baseline commit (the manifest's source_edition must equal it); authored = output_rel
      # -> blob id AT that baseline (the manifest's output set and blob ids must equal it). Eligibility is HISTORICAL: it
      # is never validated against the current roster (current-roster membership applies only to a first adoption and
      # its repeat), and its rows persist while any accepted record carries the adoption, so a later legitimate
      # retirement of an adopted output never invalidates carried provenance (removing a row while carried refuses
      # adoption_prestate). Eligibility alone admits nothing: the lineage proof (record_history_absent), the manifest
      # digest, the present bytes, the historical proof and the retention rows still decide.
      # PARAMETERIZED (codex-tick512 OD-ADO-07): MAIN binds baseline / authored in a B-lane declaration commit AFTER E (the
      # reviewed authored revision it selects; never in the manifest commit, never self-referential). This proposal picks NO bytes
      # (neither 934c14ed nor the ddab0893 candidates). Unbound (baseline null, authored empty) is a valid declaration
      # that refuses every adoption (adoption_prestate not_eligible_*); the loader admits it.
      eligibility:
        # BOUND (codex-tick623): E = the reviewed adoption baseline (GEN-ADOPT2 step 2; MAIN receipt e-receipt.yml);
        # authored = output_rel -> its blob id AT E (one row per adopted authored output; data, never a count)
        baseline: 'f0a0c49a9f19caf57058388c8b3c1c7b9259cb6d'
        authored:
          testing/e2e/target_prereq/owner_key.yml: 'd4064e62194cc2ae8766e710d7334ca360947a80'
          testing/e2e/target_prereq/prereq_observe.yml: '529010387f1fc0e2c07bcc77ef04fb8c1a1fcda0'
          testing/remote_harness/target_prereq.yml: '74648719070a677a1d2a7f009f04415a5b8f80d8'
      # EVIDENCE CLOSURE (codex-tick512 ADO-DISPATCHED-EVIDENCE-CLOSURE; replaces the r1 OD-ADO-05 manifest-only carriage):
      # everything the verifier reads to re-prove a carried adoption -- the manifest (locations.adoption_rel), every
      # retention row, and the history from the admitted HEAD back to source_edition -- is present WHEREVER the verifier
      # executes: the packaged checkout the seed is bound to (bundle checkout field + file digest; tracked checkout files
      # and their object store, like the accepted / retained records), packaged as source.inputs digest lines (evidence
      # paths). It is NEVER an executable member (dispatch closure, source-admission members, importers, bodies, render
      # inputs: refused adoption_retention) and NEVER in a target deployment payload (the manifest under `testing`, the
      # retention root under `.quarantine`: both `excludes` here; the route ships the toolchain bundle only).
      evidence_closure:
        members: [manifest, retention_rows, source_edition_history]
        carried_by: packaged_checkout
        executable: never
        deployment: excluded
    struct:
      roles: {transfer_rel: declaration_rel, dir: member_dir, file: member_file}
    bodies:
      from: plays.body
      # brr-follow BR-04 (F05-BODY-PAIR-SHAPE; S3-SEAM-11): the digest leaf of each body pair, read by C1's
      # transitive body-obligation projection (source_admission.importer_obligations, F05-S4) beside `from` (a reference
      # to the play key every generated play carries).
      sha256_from: plays.body_sha256
      custody: [executable_source_closure, check_copy, digest_bound_before_consumption]
    refusals:
      identity: TRANSFER-GENERATION-IDENTITY
    texts:
      identity: 'a roster row references no generated entry_sets member, a marked member is unreferenced or referenced twice, or a row states output placement'
    ownership:
      owned_from: records.accepted.owned          # the immutable accepted record, never roster_rel
      owned_row_from: records.owned_roles         # r5m: one declaration (was the second list owned_row_keys)
      refusals:
        obsolete: TRANSFER-GENERATION-OBSOLETE-OWNED
        extra_staged: TRANSFER-GENERATION-EXTRA-STAGED
        unreconciled: TRANSFER-GENERATION-RETIRED-UNOWNED
      texts:
        # r5p (R5O-OBSOLETE-CONTRACT-CONSISTENCY): obligation-aware -- an obsolete output (partition (1) removed) carries a
        # retirement intent and is then RETIRED (verified absent) or OPENED as an obligation (it may still be present);
        # only an UNACCOUNTED one refuses here. Carried obligations (2) and historical absence rows (3) have their own
        # laws and refusals and are never re-counted as obsolete.
        obsolete: 'an output owned by the predecessor accepted record is no longer in the current roster and is not accounted: it has no retirement intent, or it is neither retired (path verified absent) nor opened as a pending obligation of this successor; nothing was accepted'
        extra_staged: 'the owned staged mirror carries an output that is not a current roster row; nothing was accepted or copied'
        # r5m (R2I-PREDECESSOR-OWNERSHIP-CLOSURE): checked against the INDEPENDENTLY bound predecessor's owned set and
        # its carried obligations, never against the successor alone (a valid intent for a removed output is admitted)
        unreconciled: 'a retirement intent names an output that neither the predecessor record owns nor a carried obligation names, or it is also a current roster row'
  observe_modules: [ansible.builtin.assert, ansible.builtin.set_fact, ansible.builtin.stat, ansible.builtin.slurp, ansible.builtin.find,
                    ansible.builtin.command, ansible.builtin.include_tasks, ansible.builtin.include_role, ansible.builtin.debug]
  # command in an observe play must be changed_when: false (check.yml); read-only by construction of its argv.
  effect_modules: [ansible.builtin.file, ansible.builtin.copy, ansible.builtin.lineinfile, ansible.builtin.unarchive,
                   ansible.builtin.shell, community.general.archive, ansible.builtin.fail]

  # ---- GATE SEED LAUNCH (codex tick213-215 / tick217 R1): deploy_gate.sh starts the seed ONLY through the bundle
  # launcher route renders from controller.bootstrap.seed_launch -- never the seed directly and never its own env
  # vector. check.yml GATE-LAUNCH validates FULL VALUES, not shell lines: the gate text is normalised (full-line
  # comments removed, backslash-newline removed exactly as bash does, so a word split across lines is rejoined), then
  #   * EVERY expansion of `seed_var` ($X, ${X}, ${X<op>...}) and EVERY indirect expansion (${!...}) found is a whole
  #     value that must be one of `allowed_expansions` exactly; `never_allowed` (the seed path itself, i.e. any direct
  #     invocation, alias or pass-through of it) is refused wherever it appears;
  #   * EVERY bare mention of `seed_var` (a name, e.g. a nameref or an input list) must sit in a normalised statement
  #     that equals one of `allowed_name_statements` exactly;
  #   * ANY `env` executable word (env, /any/path/env; quoted or not) is refused: the gate constructs no environment;
  #   * EVERY expansion of `launcher_var` (the gate's ONE launcher input, an absolute path to route's generated
  #     <bundle>/<bundle.launcher_file>; controller.bootstrap.seed_launcher) is a whole value in
  #     `launcher_allowed_expansions` exactly, and the normalised text holds EXACTLY `launch_call_count` statements
  #     matching `launch_call_regex`: the positional caller_argv form `<launcher> run <root> <ssh auth mode> <args...>`
  #     with every word quoted and "$@" passed through (no `--`, no eval, no word splitting); every other normalised
  #     statement expanding `launcher_var` must equal one of `launcher_allowed_statements` exactly.
  # `seed_var` stays the REFUSED name: after the launcher edit (route R1 relay) the gate never names the seed, so it
  # has no allowed name statement and no admitted expansion (allowed_expansions holds only the required-input
  # emptiness test ${!v:-}, an indirect expansion).
  gate_launch:
    file_rel: ../deploy_gate.sh                     # relative to tr_dir
    refusal: TRANSFER-GATE-LAUNCH
    seed_var: LME_CONTROLLER_SEED
    comment_regex: '(?m)^[ \t]*#.*$'
    continuation_regex: '\\\n'
    seed_expansion_regex: '\$(?:\{LME_CONTROLLER_SEED(?:[^A-Za-z0-9_}][^}]*)?\}|LME_CONTROLLER_SEED(?![A-Za-z0-9_]))'
    indirect_expansion_regex: '\$\{![^}]*\}'
    bare_name_regex: '(?<![$A-Za-z0-9_{])LME_CONTROLLER_SEED(?![A-Za-z0-9_])'
    env_word_regex: '(?<![A-Za-z0-9_./-])(?:/[A-Za-z0-9_./-]*/)?env(?![A-Za-z0-9_./-])'
    never_allowed: ['$LME_CONTROLLER_SEED', '${LME_CONTROLLER_SEED}']
    allowed_expansions: ['${!v:-}']                 # the required-input emptiness test only
    allowed_name_statements: []
    launcher_var: LME_CONTROLLER_LAUNCHER
    launcher_expansion_regex: '\$(?:\{LME_CONTROLLER_LAUNCHER(?:[^A-Za-z0-9_}][^}]*)?\}|LME_CONTROLLER_LAUNCHER(?![A-Za-z0-9_]))'
    launcher_allowed_expansions: ['$LME_CONTROLLER_LAUNCHER']   # the absolute-path test and the one call
    launcher_allowed_statements: ['case "$LME_CONTROLLER_LAUNCHER" in']   # + the launch_call_regex statement only
    # B-R1-CONTROL-QUOTING (codex 202245): no argument-body wildcard. After the fixed prefix, every word up to "$@" is
    # EITHER the bare flag `-e` OR one double-quoted token whose body holds only literal characters other than
    # " \ ` $ and plain $NAME expansions (no $(...), ${...}, backquote, backslash, unquoted $): an unquoted word
    # (word splitting / globbing) or a command substitution does not match. Empty "" and spaces inside quotes match.
    launch_call_regex: '(?m)^[ \t]*"\$LME_CONTROLLER_LAUNCHER" run "\$LME_CONTROLLER_ROOT" "\$LME_SSH_AUTH_MODE" -i "\$LME_TRANSFER_INVENTORY" "\$_SELF_DIR/transfer/\$pb"(?:[ \t]+(?:-e|"[^"\\`$]*(?:\$[A-Za-z_][A-Za-z0-9_]*[^"\\`$]*)*"))*[ \t]+"\$@" 2>&1 \| tee -a "\$LOG"$'
    launch_call_count: 1

  # ---- operational inputs (extra-vars from deploy_gate; operational parameters, never desired state) ----
  inputs:
    target: lme_transfer_target          # inventory host name (the alias); never an address
    ssh_key: lme_transfer_ssh_key        # deploy_gate --ssh-key; '' when not given (translated, see contract)
    state_dir: lme_transfer_state_dir    # controller-owned state directory (admitted like the toolchain root)
    label: lme_transfer_label            # deploy_gate LABEL; names the output files
    src: lme_transfer_src                # deploy_gate SRC; must be the repository the harness runs from
    remote_dir: lme_transfer_remote_dir  # deploy_gate REMOTE_DIR; the owned deployment directory on the target
    label_regex: '^[A-Za-z0-9._-]+$'
    host_regex: '^[A-Za-z0-9._-]+$'
  # output files in the state dir, <state_dir>/gate.<label>.<suffix>; deploy_gate.sh reads exactly these
  # (check.yml refuses a deploy_gate.sh that does not name each suffix).
  outputs:
    prefix: gate.
    contract_json: .contract.json
    ssh_argv: .ssh-argv          # one argv word per line (every word is regex-admitted; no newline possible)
    machine_id: .machine-id
    transfer_receipt: .transfer.json
  # v2 (B-PER-HOST-POLICY-BINDING): the receipt adds policy.scope; the contract adds scope (tr_scope_expect)
  receipt_schema: lme-deploy-transfer/v2
  contract_schema: lme-deploy-target-contract/v2

  # ---- B2-TARGET-BINDING: ONE admitted target/connection contract, resolved from the inventory host + the supported
  # explicit override, consumed by EVERY stage (Ansible plays get it as play vars; deploy_gate's ssh argv is
  # rendered from it by the same macro). Anything not admitted here is refused before any effect.
  # R-B2 / M1-TRANSPORT-COMPOSITION: B's legs are the route's `privileged` connection profile
  # (rh.controller.bootstrap.inventory.connection_profiles.privileged: user root, key reference from its key_var).
  # The inventory's own ansible_user / ansible_ssh_private_key_file belong to the owner profile and are NOT read.
  # The SSH auth mode is the route's ONE per-deployment mode (host var ssh_auth.mode_var == the seed-exported
  # ssh_auth.env_mode); the mode's ssh_common_args supply the identity options, exactly as on the route's plays.
  contract:
    ssh_client: /usr/bin/ssh                       # the same client on both paths (ansible_ssh_executable)
    address_var: ansible_host                      # absent -> the inventory host name is the address
    address_regex: '^[A-Za-z0-9._:-]+$'
    connection_profile: privileged                 # rh...inventory.connection_profiles.<this>: user + key_var
    port_var: ansible_port                         # absent -> ssh's own default on both paths (no -p)
    proxy_var: ansible_ssh_common_args             # '' | the mode's ssh_common_args | the exact ProxyJump form below
    proxy_regex: '^-o ProxyJump=([A-Za-z0-9._@:-]+)$'   # == rh...ssh_auth.composition.proxy_jump.form_regex (asserted)
    # auth modes B's legs admit (disposition from the route matrix): explicit_key needs the profile's key reference;
    # tailnet_identity uses none. agent is REFUSED explicitly: the privileged legs never carry the owner's agent.
    auth_modes_admitted: [explicit_key, tailnet_identity]
    auth_modes_refused: {agent: 'privileged legs never carry an agent socket (MAIN-only root boundary)'}
    connection_var: ansible_connection
    connection_admitted: [ssh]                     # absent == ssh
    # connection settings this contract cannot express on the bash path: present -> refused (never ignored)
    refused_vars: [ansible_ssh_extra_args, ansible_ssh_args, ansible_password, ansible_ssh_pass, ansible_ssh_password, ansible_ssh_executable,
                   ansible_become, ansible_become_user, ansible_become_method, ansible_become_password,
                   ansible_ssh_host, ansible_ssh_user, ansible_ssh_port, ansible_private_key_file]
    # B-INHERITED-OWNER-KEY (codex tick165/166): every target play binds EXACTLY these connection vars from the ONE
    # contract (macro ansible_conn; play vars outrank inventory host vars; check.yml refuses a target play that omits
    # one or binds it to anything but hostvars['localhost'].tr_conn.<var>). conn_vars are the transport; the
    # credential selectors are the ssh connection plugin's credential inputs: bind_key ones carry the contract key
    # (or '' when the mode takes none), clear ones are always ''. So an inherited owner-profile
    # ansible_ssh_private_key_file (or a password / PKCS#11 provider) can never be offered on a privileged leg.
    # Selector set = EVERY credential var of the supported plugin (ansible 2.19.11 connection/ssh.py options
    # password, private_key_file, private_key, private_key_passphrase, pkcs11_provider; all var aliases, since a later
    # alias outranks an earlier one). The 2.19 INLINE key (private_key: ansible_private_key / ansible_ssh_private_key)
    # is checked BEFORE private_key_file in _build_command (`if private_key ... elif private_key_file`), so an inherited
    # inline key would supersede the contract key (or refuse under SSH_AGENT none): it is cleared to '' (falsy) with
    # its passphrase. K19/K20 run the real ssh plugin against a recording ssh client and check what it consumed.
    conn_vars: [ansible_connection, ansible_host, ansible_user, ansible_ssh_executable, ansible_ssh_common_args,
                ansible_ssh_extra_args]
    credential_selectors:
      bind_key: [ansible_ssh_private_key_file, ansible_private_key_file]
      clear: [ansible_password, ansible_ssh_pass, ansible_ssh_password, ansible_ssh_pkcs11_provider,
              ansible_private_key, ansible_ssh_private_key, ansible_private_key_passphrase, ansible_ssh_private_key_passphrase]
    # deploy_gate flag -> contract field. Rule: profile key unset -> the flag supplies it; both set and equal -> it;
    # both set and different -> TRANSFER-CONTRACT-CONFLICT before any effect.
    overrides:
      ssh_key: {field: key, flag: --ssh-key}
    # CONTRACT REFUSAL FAMILY (r5u-rf; codex-tick500 R5U-REFUSAL-AND-INVENTORY-CONTRACT, closes R5U-LITERAL-REFUSAL-CODES):
    # tasks/resolve_contract.yml emits EVERY contract refusal as the ONE controller.bootstrap.refusal_grammar line
    # `REFUSED <refusals.<role>>: <texts.<text role>> <observed values>` through the shared grammar entry
    # (refusal_grammar.entry_rel); it restates no code and no text. One code per family member; the sites that share
    # a code carry distinct texts, so a control names exactly one site (K14 auth_mode_absent vs K08/K09
    # auth_mode_unadmitted; K11/K12 field vs composition; K03 flag_conflict vs bound_key_conflict). Each text ends
    # with the names of the observed values that follow it. endpoint_kinds.<kind>.refusal / .admission.refusal stay
    # the kind-scoped codes. TRANSFER-CONTRACT-DRIFT (tasks/check_recorded_contract.yml) is not in this family (open).
    refusals:
      input: TRANSFER-CONTRACT-INPUT
      auth_mode: TRANSFER-CONTRACT-AUTH-MODE
      unsupported: TRANSFER-CONTRACT-UNSUPPORTED
      conflict: TRANSFER-CONTRACT-CONFLICT
      field: TRANSFER-CONTRACT-FIELD
      key: TRANSFER-CONTRACT-KEY
      credential: TRANSFER-CONTRACT-CREDENTIAL
    texts:
      peer_kind: 'tr_peer must be a mapping whose kind is one of the declared endpoint kinds (declared endpoint kinds):'
      peer_input: 'tr_peer must carry exactly its kind''s peer keys and its alias must be an inventory host (not localhost) matching the host grammar; lme_transfer_ssh_key is required and must be empty or a normalized absolute path for a kind with the ssh_key override, and is refused for a kind without it (peer keys, host grammar, kind):'
      auth_mode_absent: 'the peer does not set the declared auth-mode host var (exact-name presence, no default); B''s privileged legs admit only the admitted modes (peer, mode var, admitted modes, refused modes):'
      auth_mode_unadmitted: 'the peer''s auth mode is not a declared route mode, differs from the seed run mode, or is not admitted on B''s privileged legs (peer, mode var, host mode, run-mode env var, run mode, admitted modes, refused modes):'
      unsupported: 'the peer sets a connection var this contract refuses, a connection other than the admitted ones, or a proxy form the admitted endpoint rule does not accept (peer, refused vars set, admitted connections, shared interpreter result):'
      flag_conflict: 'the ssh-key flag value differs from the peer''s set privileged-profile key var, by exact-name presence; [] = not set (flag, flag value, peer, key var, set value):'
      bound_key_conflict: 'the controller-operation peer''s privileged-profile key var differs from its loader-bound key input (peer, key var, binding.deployment inputs_at / alias / key_input):'
      composition: 'the contract address / port vars are not the declared endpoint composition rule (controller.bootstrap.ssh_auth.composition address / port), or the declared address-absence host var is not set (peer, contract address / port vars, composition rule):'
      field: 'a resolved contract field is not admitted: the privileged profile user must be the declared remote user, explicit_key needs the profile key var (or, for a kind with the override, the flag), tailnet_identity takes no key, and every value must match its grammar (peer, kind, resolved contract, remote user, key var, flag):'
      key: 'the credential reference is not a readable regular file; a link is refused and the content is never read (key):'
      credential: 'the rendered connection vars are not exactly the contract conn_vars plus the credential selectors, a key selector is not the contract key, or a cleared selector is set (rendered vars, expected vars):'
    # FAMILY ADMISSION (r5u-rf2; codex-tick510 RF-OD-2): the PARENT diagnostic of the family above, read by the FIRST
    # task of tasks/resolve_contract.yml (its single consumer) before any member is read. members lists member NAMES
    # (the exact key sets of refusals / texts), not codes: it is not a code registry (codex-tick508; declaration_codes
    # untouched). refusal / texts.absent sit OUTSIDE the family so an omitted, null or partial family still refuses
    # typed through the shared grammar. No transfer.contract-scope diagnostic existed before (endpoint_kinds.<kind>.refusal
    # and .admission.refusal are kind-scoped; structural_check.refusal is check.yml's task-walk frame), hence this one
    # owner-scoped code.
    family:
      members:
        refusals: [input, auth_mode, unsupported, conflict, field, key, credential]
        texts: [peer_kind, peer_input, auth_mode_absent, auth_mode_unadmitted, unsupported, flag_conflict, bound_key_conflict,
                composition, field, key, credential]
      refusal: TRANSFER-CONTRACT-FAMILY
      texts:
        absent: 'transfer.contract.refusals / texts is not the declared refusal family (each a mapping of strings whose key set is exactly family.members); nothing was resolved (declared members, observed member keys):'
    # ENDPOINT KINDS (r5f; codex-tick400 R4-PRIVILEGED-CONTRACT): the ONE contract (tasks/resolve_contract.yml ->
    # tr_contract / tr_conn / tr_ssh_argv, tasks/endpoint_bind.yml -> tr_endpoint) resolves ONE declared peer per
    # resolution, named by the derived fact tr_peer = {<peer_keys>} (^_?tr_ family: refused when supplied; set by the
    # consumer's controller play after its family guard). EVERY kind gets the same endpoint, port, connection,
    # refused-var, proxy, auth-mode, key-reference and credential-selector checks and neutralizations; the kinds differ
    # ONLY in where the peer's membership, key reference and bound endpoint are read:
    #   target_scope true   a WORKLOAD TARGET (scope_expect.yml ran for it): key = the alias's profile key_var host var
    #                       (or the admitted flag override), endpoint = tr_scope_expect.binding.deployment.endpoints --
    #                       today's behaviour, byte-identical tr_contract.
    #   target_scope false  a declared CONTROLLER-OPERATION endpoint: the ONLY member of groups[role_groups[role_group]]
    #                       and NEVER a member of the target group (it is not a workload target and is never relabelled
    #                       one); key = the LOADER-BOUND input binding.deployment.<inputs_at>[alias][key_input] (no raw
    #                       host-var key read; key_input's target_inputs var must be the profile's key_var), endpoint =
    #                       binding.deployment.<endpoints_at>[alias] (C1 r5f loader projection); no flag override.
    # key_source is the contract's emitted label of where the key reference came from (data, recorded with the contract).
    endpoint_kinds:
      workload_target:
        target_scope: true
        peer_keys: [alias, kind]
        flag_overrides: [ssh_key]
      controller_operation:
        target_scope: false
        peer_keys: [alias, kind, role_group]
        flag_overrides: []
        inputs_at: controller_endpoint_inputs
        endpoints_at: controller_endpoints
        key_input: privileged_key
        key_source: bound_input
        refusal: TRANSFER-CONTRACT-PEER    # emitted as `REFUSED <refusal>:` (membership / bound-input admission of this kind)
        # r5h (codex-tick419 R5G-CONTROLLER-ENDPOINT-READBACK): the loader-PUBLISHED endpoint roster
        # binding.deployment.<roster_at>.<alias> = {group, required, optional} (C1 projection proposal, PROVISIONAL name);
        # the peer's group and its required key role are read from it and from inventory.controller_endpoint_groups
        roster_at: controller_endpoint_roster
        texts:
          peer_membership: 'the controller-operation peer is not the only member of its declared role group, is a target-group member, lacks the loader-bound key input, carries a key input that is not a required role of its endpoint group, is absent from the published endpoint roster or placed in another group, or its key input var is not the connection profile''s key_var (alias, role group, inputs_at, key_input, roster_at, profile):'
        # r5h (codex-tick419 R5G-RECEIPT-ADMISSION-CONSUMER; codex-tick421 consumer gate): the route's VERIFIED
        # binding-receipt record (testing/remote_harness/tasks/admit_binding_receipt.yml derived outputs) that
        # tasks/resolve_contract.yml requires and re-binds before any use of this kind. PROVISIONAL: the record names are
        # R4's published outputs (r4d 4c7cf4c2 :261-265 + rh_rcpt_receipt_path) and the r4e evidence rh_rcpt_admission
        # (in-progress r4e-admit_binding_receipt.after.yml); R4's r4e-admission-output proposal (via MAIN) settles them,
        # and C1 keeps each an exact registry reserved_outputs name.
        admission:
          inventory_kind: controller_operation_binding   # genesis.launch.inventory_kinds key (B r5f C1-R5F-1b): the ordered selected files
          record_keys: [path, stat, receipt, admission]
          record: {path: rh_rcpt_receipt_path, stat: rh_rcpt_receipt_stat, receipt: rh_rcpt_receipt, admission: rh_rcpt_admission}
          # the evidence roles this consumer binds (keys of R4's binding_admission.result_keys; r4e PROVISIONAL)
          result_roles: [operation, kind, files, receipt, receipt_sha256, compared, inputs, members, scope_sha256]
          refusal: TRANSFER-CONTRACT-ADMISSION
          texts:
            absent: 'no verified binding-receipt record precedes this controller-operation contract (the route admission must run first in this play; peer, declared record, absent names):'
            unbound: 'the binding-receipt record and admission evidence are not bound to the receipt bytes, the selected inventory files, the declared receipt keys, every compared receipt binding of this resolve, the current effective operation inputs or this resolve''s endpoint scope (peer, receipt path, fresh stat, inventory sources, compared fields):'
    # the kind tasks/bind_controller.yml (the prelude of every B workload entry: transfer.yml, resolve_target.yml,
    # reclaim.yml, target_prereq.yml, prereq_observe.yml) resolves for lme_transfer_target
    prelude_peer_kind: workload_target
    # transport options B adds on both paths; the identity options (IdentityAgent / IdentitiesOnly /
    # PubkeyAuthentication) come ONLY from the mode's ssh_common_args (route composition.identity_options).
    options:
      - BatchMode=yes
      - ConnectTimeout=15
      - StrictHostKeyChecking=accept-new
    # privilege: wipe_lme.sh / install.sh run as root on the target (MAIN-only privileged execution). Root is a
    # DECLARED contract field, required from the inventory, never a hostname factory.
    privilege: {remote_user: root, uid: 0}
    identity_file: /etc/machine-id                 # the endpoint identity every stage re-reads before its effect
    identity_regex: '^[0-9a-f]{32}$'

  # ---- B2-OWNED-SOURCE-EDITION: what is shipped ----
  source:
    git: /usr/bin/git                              # controller tool (seam S6: not in controller.bootstrap.os_tools)
    must_equal_repo_root: true                     # src == the repository the harness itself resolved (no substitution)
    clean: tracked_and_untracked                   # no staged/unstaged tracked change AND no untracked not-ignored
                                                   # file; argv = controls_source.status_args (tasks/source_admit.yml)
    # B-COMMIT-INDEX-RACE: membership, modes and blob ids come from the IMMUTABLE tree of the commit HEAD resolved to
    # once (ls-tree by commit id), minus `excludes`; the index is never a source (untracked never shipped either).
    members: committed_tree
    tree_list_args: [ls-tree, -r, --full-tree]     # + <commit id>; output "<mode> <type> <blob>\t<path>"
    refused_modes: ['120000', '160000']            # symlink, gitlink: refused (none exist today)
    admitted_modes: {'100644': '644', '100755': '755'}   # git mode -> the mode every placed member gets
    history: not_transferred
    history_evidence: >-
      no target-side consumer of the transferred tree reads git history: install.sh, scripts/*.sh and ansible/ contain
      no git rev-parse/describe/log/ls-files; the two ansible.builtin.git uses clone OTHER repositories
      (llm_consumer_activate.yml lme-docs, ludus_lme_server). A job that needs history needs a history bundle; this
      edition is a history-independent source archive and says so in its receipt (edition.kind).
    edition_kind: committed_source_archive

  # ---- SOURCE-REF: the phase-control source admission policy (controls/source_ref.yml, controls/load_paths.yml,
  # check.yml). The tasks own no policy of their own; MAIN approval tick160 (codex 050338).
  controls_source:
    git: source.git                                # a REFERENCE to transfer.source.git (the executable), not a copy
    default_commit: HEAD
    commit_regex: '^[0-9a-f]{40}$'
    status_args: [status, --porcelain, --untracked-files=normal]   # tracked edits AND untracked files; ignored excluded
    runner_rule: realpath_equal                    # the controls run from inside the source (realpath equality)
    load_binding:
      config_file: none_or_inside_candidate        # CONFIG_FILE of `ansible-config dump`, run with chdir = candidate
      project_path_keys:                           # a listed path that exists OUTSIDE the candidate and is non-empty
        - DEFAULT_ROLES_PATH                       # refuses CONTROLS-SOURCE-LOAD-PATH
        - DEFAULT_FILTER_PLUGIN_PATH
        - DEFAULT_TEST_PLUGIN_PATH
        - DEFAULT_LOOKUP_PLUGIN_PATH
        - DEFAULT_ACTION_PLUGIN_PATH
        - DEFAULT_MODULE_PATH
        - DEFAULT_MODULE_UTILS_PATH
        - DEFAULT_CALLBACK_PLUGIN_PATH
        - DEFAULT_STRATEGY_PLUGIN_PATH
        - DEFAULT_VARS_PLUGIN_PATH
        - DEFAULT_CONNECTION_PLUGIN_PATH
        - DEFAULT_INVENTORY_PLUGIN_PATH
        - DEFAULT_CACHE_PLUGIN_PATH
        - BECOME_PLUGIN_PATH
        - DOC_FRAGMENT_PLUGIN_PATH
      recorded_keys: [COLLECTIONS_PATHS]           # managed toolchain: recorded, never refused
      lookup_bases: [tr_dir, transfer_dir, playbook_dir, ctl_dir, repo_root, rh_repo_root]
      identity_lookups: ['/etc/machine-id', contract.identity_file]   # host identity, recorded, not project bytes
      # check.yml static scan of B's own *.yml / *.j2 (comments stripped first): every lookup('ansible.builtin.file'
      # | 'ansible.builtin.template', X) has X starting with a lookup_base (or X is a quoted identity literal), and
      # every include/import value starts with "{{ <lookup_base>" or is a bare same-directory *.yml name.
      static:
        scan_exclude: [transfer.decl.yml, controls/CASES.yml]   # data, never loaded as tasks or templates
        strip_regexes: ['(?s)\{#.*?#\}', '(?m)^\s*#.*$']
        lookup_regex: "lookup\\(\\s*'ansible\\.builtin\\.(?:file|template)'\\s*,\\s*([^,)]+)"
        include_regex: '(?m)^[ \t]*-?[ \t]*(?:ansible\.builtin\.)?(?:include_tasks|import_tasks|include_vars|import_playbook|include_role|import_role):[ \t]*(.*)$'
        relative_include_regex: '^[A-Za-z0-9_.-]+[.]yml$'
        # METHOD-ATTR (route audit; the genesis env.clear bug): in Jinja an ATTRIBUTE read whose name is a dict method
        # returns the METHOD, never the data key (`x.clear | bool` is False, iterating it fails). check.yml refuses any
        # such read not followed by `(` in the same comment-stripped files; data keys with these names are read by
        # subscript (x['clear']). `ansible.builtin.copy` (a module name, not a read) is excluded by the lookbehind.
        method_attr_regex: '(?<=[A-Za-z0-9_\]\)])(?<!builtin)\.(clear|copy|get|items|keys|values|pop|popitem|update|setdefault|fromkeys)\b(?!\s*\()'

  # members excluded from the committed set (the consumer's transfer manifest). kinds:
  #   name   -- a path component with this name at any depth (and everything below it)
  #   path   -- this relative path (and everything below it)
  #   suffix -- a basename ending
  excludes:
    - {name: .git}
    - {name: scratchpad}
    - {name: _ocr_wt}
    - {name: .ocr}
    - {name: .cursor}
    - {name: .opencode}
    - {name: .quarantine}
    - {name: .superpowers}
    - {name: node_modules}
    - {name: __pycache__}
    - {suffix: .pyc}
    - {suffix: .qcow2}
    - {suffix: .iso}
    - {suffix: .img}
    - {name: offline_resources}
    - {path: config/lme-environment.env}
    - {name: .lme-transfer}
    - {path: testing}
  # R-B3 item 4 (testing/ export-ignore): `testing` is NOT in the deploy edition, agreeing with .gitattributes
  # `testing export-ignore`. Evidence (repository-scoped): no target-side consumer reads testing/ -- install.sh,
  # scripts/*.sh and ansible/ mention it only in comments/help text (install.sh:50, convert_to_cluster.sh:244,
  # create_cluster_inventory.sh:333, upgrade_lme.yml:344, role comments); deploy_gate.sh and every route/B playbook
  # run on the CONTROLLER from the worktree; the route ships its toolchain bundle only (edition_contents).

  # ---- controller state (B2-TEMP-LIFECYCLE). Admitted with rh path_admission (+ ancestry); owned by the gate user.
  controller_state:
    ledger: operations.log                         # lines: `start <op> <writer token>`, else `<verb> <op>`; verbs below
    # B-CROSS-ROOT-RECOVERY: the state dir may be shared by several controller roots. An unfinished op is abandoned
    # (its two recorded paths removed) ONLY when its start token is THIS controller's (tr_ctl_token = sha256 of
    # machine-id ':' controller root); any other token, or a legacy untokened start, is an UNCERTAIN writer: its
    # artifacts are preserved, never abandoned here, and reported as TRANSFER-STATE-UNCERTAIN-PRESERVED <ops>.
    # Shared-ledger preservation (B-CROSS-ROOT-RECOVERY residual, codex 150646): EVERY controller-ledger write
    # (start, fail, abandon, complete) goes through tasks/controller_ledger.yml -> macro ctl_ledger_append: under
    # `flock -x -w ledger_wait_s -E ledger_busy_rc <state_dir>/<ledger_lock>` (the ONE lock every root sharing this
    # state dir takes; os_tools.flock admitted by identity first) the lines are appended with O_APPEND (`>>`), never a
    # read-modify-write, so no writer's start or terminal row can be lost. Busy -> TRANSFER-STATE-LEDGER-BUSY, nothing
    # written. Files are created 0600 (umask 077 inside the command).
    ledger_lock: .ledger.lock
    ledger_wait_s: 30
    ledger_busy_rc: 75
    pending_dir: pending                           # <op>.tar.gz and <op>.d (extraction for binding) ONLY
    verbs: {start: start, complete: complete, fail: fail, abandon: abandon}
    op_regex: '^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$'     # op id = UTC stamp + 12 random hex; ledger lines are parsed with it
    # retention: success and failure remove this op's exact archive + extraction; an op with `start` and no
    # terminal line (interrupted) is abandoned by the NEXT operation, which removes exactly its two recorded paths.
    # Nothing else in the state dir is ever removed; the temp root is never globbed.
    retain_on_failure: []                          # diagnostics = the gate log + this ledger, never the archive
    archive_max_bytes: 200000000                   # budget: a larger archive is refused before it leaves the controller

  # ---- target placement (B2-OWNED-SOURCE-EDITION): in-place reconciliation against an OWNED manifest ----
  # Why not edition directories + a symlink swap: install.sh writes INTO its own tree (config/lme-environment.env,
  # the wazuh manager conf rewritten with sudo mv) and the 21G offline_resources bundle persists inside REMOTE_DIR,
  # so a fresh edition directory would lose or duplicate persistent state. Promotion is therefore per-member atomic
  # (rename(2) from a verified staging tree on the same filesystem), NOT atomic for the whole tree; the ledger makes
  # an interrupted promotion recoverable (its manifest joins the next prune set).
  # ---- R-B3 deploy edition (codex-000256 R-B3-PUBLISH-MODEL): OWNED IN-PLACE RECONCILE, one resolved config ----
  # binds rh.transfer.adapters.managed_archive.publish_models.deploy_edition (model in_place_reconcile, owner B,
  # out_of_edition declared_by_B, unarchive_path_equality required); bind_controller.yml asserts that binding.
  edition:
    model: in_place_reconcile
    membership: 'source.members: the tree of the commit HEAD resolved to, read by commit id, minus `excludes` (never the index; nothing untracked, nothing excluded)'
    removal_inventory: 'target.owned_manifest of the ACTIVE edition + the manifests of promoted-unfinished ops; ONLY
      regular files listed there are ever removed; a file no edition recorded is never removed'
    # persistent in-tree state that survives every reconcile: never a member, never in a removal inventory (an owned
    # manifest naming one refuses TRANSFER-OWNED-STATE), never written by promotion. kinds as `excludes`, plus prefix.
    out_of_edition:
      - {name: offline_resources, why: 'airgapped bundle built ON the target (install.sh:210/1101); not rebuildable offline'}
      - {path: config/lme-environment.env, why: 'created by install.sh:1388/1411 and roles/base setup_directories.yml:29'}
      - {prefix: config/wazuh_cluster/wazuh_manager.conf.backup., why: 'install.sh:1329 backup copies'}
      - {path: inventory, why: 'operator-supplied install.sh:848 inventory (untracked)'}
      - {path: ansible/inventory/cluster.yml, why: 'generated cluster inventory (install.sh:299; untracked)'}
      - {name: .lme-transfer, why: 'B owned state'}
    # tracked members install rewrites in place: reset to the edition by the next reconcile; install re-applies.
    install_rewrites_members: [config/wazuh_cluster/wazuh_manager.conf]
    # edition record written on completion (<state_dir>/<record>): the revision a retry converges on
    record: edition.json
    record_schema: lme-deploy-edition/v2          # v2 adds scope_id, scope_sha256, scopes_sha256
    record_fields: [schema, op, commit, edition_kind, decl_sha256, policy_sha256, scope_id, scope_sha256, scopes_sha256, owned_sha256_digest, member_count, completed_by]

  target:
    state_dir: .lme-transfer                       # inside REMOTE_DIR; excluded from members above
    owned_manifest: owned.sha256                   # sha256sum format, the ACTIVE owned edition
    modes_manifest: owned.modes                    # "<mode> <path>" of the active owned edition
    ledger: operations.log
    verbs: {start: start, promote: promote, complete: complete, fail: fail, abandon: abandon}
    token_regex: '^[0-9a-f]{64}$'                  # `start <op> <token>`; other verbs `<verb> <op>`
    staging_dir: staging                           # staging/<op>/
    incoming_dir: incoming                         # incoming/<op>.tar.gz
    ops_dir: ops                                   # ops/<op>.sha256 kept until a later op completes
    dir_mode: '0750'
    owner_uids: [0]                                # REMOTE_DIR ancestry: uid 0 only (the declared privilege)
    # Tools B runs on the target, each a NAME in rh.transfer.adapters.managed_archive.target.tools (the route's
    # closure; used_by only) and in THIS host's engine derivation lme_resolved.remote_harness.adapter.tools['target.tools']
    # (path + identity derived by C1 from that host's effective os_tools, r3f; never read from hostvars.localhost, never
    # pinned here). Invoked ONLY by that derived path (macros take the path map; no PATH lookup). Before the first target
    # mutation each must exist, be executable, and hash to the derived identity sha256 (TRANSFER-TARGET-TOOL-IDENTITY).
    # Missing -> refusal naming the ONE bootstrap (rh packages.required), never installed here.
    tools_used: [tar, gzip, find, sha256sum, sort, cmp, chmod, mv, mkdir, rm, rmdir, id, cat, flock]
    # tools a MODULE resolves through PATH (ansible.builtin.unarchive -> tar, and tar -z -> gzip). Proven equal to the
    # declared admitted path (same device + inode after following links) under the module's PATH, before any effect
    # (TRANSFER-TARGET-PATH-TOOL); the controller binding extraction proves the same against os_tools.
    path_resolved: {ansible.builtin.unarchive: [tar, gzip]}
    # staging bounded (M1-STAGING-RECOVERY, aligned with the route's E25-E27 lease/flock model):
    #  * every mutation of staging/incoming/ops and every promotion runs as `flock -x -n -E 75 <state_dir>/<lock>`
    #    (persistent lock file; rc 75 -> TRANSFER-TARGET-BUSY, nothing removed, no new staging);
    #  * the ledger `start` line carries the writer's controller token (sha256 of controller machine-id + ':' + owned
    #    controller root). An unfinished op is DEAD only when its token is THIS controller's: the seed holds the
    #    controller root lock for the whole run, so no other writer with this token can be live. Any other token
    #    (another controller or root) is UNKNOWN: kept, charged to the budget, and it REFUSES a new in-place reconcile
    #    (TRANSFER-TARGET-FOREIGN-UNFINISHED) -- never age-based deletion;
    #  * budget: at most staging_max_unknown unknown unfinished ops are tolerated in the observation; any unknown refuses.
    #  * internal custody (B-TARGET-INTERNAL-CUSTODY): tasks/target_custody.yml admits every EXISTING path of
    #    state_dir, staging_dir, incoming_dir, ops_dir (directories), lock, ledger, owned_manifest, modes_manifest and
    #    the edition record (regular files) -- never a link, the declared kind, not group/other-writable, uid in
    #    owner_uids -- in target_observe and again first in target_place, before any mutation; ops entries must be
    #    regular non-link files (TRANSFER-TARGET-INTERNAL-CUSTODY). The lock is created 0600 explicitly, never by umask.
    lock: .lock
    busy_rc: 75
    publish_wait_s: 30                             # promote/prune: flock -x -w 30 (route E26); claim/reap: flock -x -n
    # the claim is a compare-and-swap: under the lock the ledger must equal (sha256) the one the observe play
    # classified, else TRANSFER-TARGET-LEDGER-MOVED (busy_rc); ledger lines are appended only inside locked bodies.
    staging_max_unknown: 0
    first_adoption: >-
      a REMOTE_DIR without an owned manifest (e.g. left by the retired rsync stage) is adopted with an EMPTY prune set:
      files it holds that no edition ever recorded are not owned and are not removed; the receipt records
      adopted=true.

  results:
    ok: {check: transfer, reason: ''}
    refused: {check: transfer, reason: TRANSFER_REFUSED}
    no_receipt: {check: transfer, reason: TRANSFER_NO_RECEIPT}
    contract_refused: {check: target-contract, reason: TARGET_CONTRACT_REFUSED}
    identity_mismatch: {check: target-identity, reason: TARGET_IDENTITY_MISMATCH}
    input_missing: {check: transfer-input, reason: TRANSFER_INPUT_MISSING}
  remedy: establish it through the ONE declared bootstrap operation (remote-harness controller.bootstrap); deploy_gate never installs anything
