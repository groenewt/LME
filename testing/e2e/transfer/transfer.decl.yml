---
# testing/e2e/transfer/transfer.decl.yml -- deploy_gate TARGET CONTRACT + TRANSFER (stage `rsync`): DECLARATIONS.
# Owner: B (lifecycle/provenance). Review threads: codex-tick119-WP1-sliceA-review-20260923-221652,
# codex-tick123-B-WP1A-v2-source-review-20260923-230504, codex-tick123-124-decisions-20260923-230204.
#
# Representation (operator EVERY-file rule): this file + the route author's resolved remote_harness policy (`rh`,
# produced by testing/remote_harness/tasks/resolve_policy.yml; never re-read raw by B) -> genuine macros
# (macros/transfer.j2) -> two ENTRY playbooks and their task files (all YAML). No generated artifact is committed.
# check.yml walks both entry playbooks (plays, host placement, blocks, includes) against `plays` below.
#
# Execution: deploy_gate.sh (pre-existing hand-written bash, residual debt) only starts the entry playbooks through
# the route's generated seed launcher (rh.controller.bootstrap.seed_launcher.caller_argv; ssh_auth.run_argv):
#   "$LME_CONTROLLER_LAUNCHER" run <controller root> <ssh auth mode> -i <inventory> <entry playbook> <args>
# The launcher execs the bundle seed's `run` under env -i with exactly the declared seed_launch environment
# (see gate_launch). resolve_harness.yml then refuses any executor that is not the managed generation of the INVENTORY-declared root.
# Policy: B reads ONLY the resolved policy `rh` (resolve_policy.yml -> lme_resolved.remote_harness.policy, route
# consumer interface revision 10, route 0bef305); no B file reads manifests/profiles/remote-harness.yml.
transfer:
  schema_version: 3
  gate_stage: rsync
  implements_adapter: managed_archive

  # ---- the route author's task files B includes, bound by exact path + sha256 (check.yml refuses drift; any other
  # include is refused). All are observe-only (stat/slurp/assert/set_fact/command-read/raw-read) per their headers.
  route_includes:
    - {rel: testing/remote_harness/tasks/admit_ancestry.yml, sha256: b3ad800c1fb765d4fe4bd50eab9050600890f82e0a192a80cca426afb062f24b}
    - {rel: testing/remote_harness/tasks/decide_private_group.yml, sha256: eb85ba51478f4a45847a367cc4193606fd1b6cc5d3f3fd76298a670022b04eac}
    - {rel: testing/remote_harness/tasks/initial_contact.yml, sha256: 2d19eb114f9a58d5666e1398a39b5d1560d2024251d2b721d0af548bc46e2e0a}
    - {rel: testing/remote_harness/tasks/refuse_pinned_outputs.yml, sha256: d408cfcd24cd3af79c2a4bb9572fde3f6278b8e60ae28b44911d9e170b579a0c}
    - {rel: testing/remote_harness/tasks/resolve_policy.yml, sha256: 93f2855e512903ac4334323a1e7e47ecf210737d34edd62c68c890fd6dff4a86}
    - {rel: testing/remote_harness/tasks/resolve_harness.yml, sha256: 750c8f221915e94c131ce670efd166946c245975592e174ec741396a7d13567c}
    - {rel: testing/remote_harness/tasks/verify_toolchain_receipt.yml, sha256: 33ee065d47d01aca5780f5482d9b32f23a38625a71b254270b3df4e504cc8689}
  # the route's PINNABLE consumer interface (R-B4) these SEVEN files form (route revision 8, codex 155203:
  # initial_contact.yml carries two declared variants, owner and PRIVILEGED; B's root target plays include only the
  # privileged one; admit_ancestry.yml / decide_private_group.yml are the ONE ancestry admission, used by B only on
  # localhost plays; verify_toolchain_receipt.yml stays pinned as part of the interface set but is NOT included by
  # any B root play -- owner trust). check.yml recomputes interface_sha256 from the files (sha256 of the lines
  # "<sha256>  <path relative to base>\n" sorted by path); bind_controller.yml refuses a resolved policy whose
  # controller.bootstrap.consumer_interface (revision, digest, file set) differs (TRANSFER-ROUTE-INTERFACE).
  route_interface:
    base: testing/remote_harness
    revision: 10                                   # route 0bef305: privileged python probe propagates the interpreter's exit status (same seven files)
    interface_sha256: 09addbb58ff40cb7506a7de8b5020ac1a321582edc9e72680ef3d98a98011471
  # engine projection B consumes on EVERY host (resolve_policy.yml): lme_resolved.remote_harness.schema_version
  projection_schema_version: 3
  # B-PER-HOST-POLICY-BINDING (codex 021809/023332; C1 field contract inbox 033500, projection schema 3). C1 resolves
  # per host: each host's lme_resolved.remote_harness carries its OWN scope {kind, id}, binding, policy_sha256,
  # scope_sha256 = digest({scope, binding, policy_sha256}) and the deployment-wide scopes / scopes_sha256.
  #   * controller (tasks/scope_expect.yml): its own scope is kind controller_kind; the transfer target must be a
  #     member of binding.deployment.targets and of scopes.targets; tr_scope_expect = that target's entry;
  #   * target (tasks/scope_admit.yml): its own scope is kind target_kind with id == inventory_hostname, and its
  #     scope_sha256 and FULL policy_sha256 equal the controller-resolved scopes.targets[its id]; scopes_sha256 and
  #     every binding_keys value equal. Never the controller's policy copied onto a target, never a remerge;
  #   * scope_invariant_sha256 is an ADDITIONAL compatibility check only (both 64-hex, equal); it never admits;
  #   * the contract, the target's edition record and the receipt carry the scope ids and digests.
  policy_scope:
    status: final
    controller_kind: controller
    target_kind: target
    binding_keys:
      - deployment
      - source_edition
      - operation
    # endpoint: tasks/endpoint_bind.yml binds B's contract endpoint to binding.deployment.endpoints[<id>]; its rules
    # are READ from the resolved rh.controller.bootstrap.ssh_auth.composition + inventory.owner_var (no copy here).
  # B task files live here (relative to the entry playbook directory); includes are written "{{ tr_dir }}/tasks/<f>".
  tasks_dir: tasks

  # ---- B-INITIAL-CONTACT-CONSUMPTION + B-PRIVILEGED-LEG-VS-OWNER-ONLY-CONTACT (route revision 8, codex 155203):
  # B's target plays are ROOT legs, so EVERY target play includes the route's raw INITIAL CONTACT in the PRIVILEGED
  # variant before its first module (an earlier play's admission is not carried over). check.yml walks each target
  # play in order and refuses:
  #   * a play whose first include of `route_rel` is missing, or does not pass rh_ic_variant == `variant` (the owner
  #     variant, or none, is refused on a root play);
  #   * before it: any row whose module is not in `contact_free_modules`, or a route include other than
  #     `pre_contact_route` (controller-side policy resolution);
  #   * after it: any include of `owner_only_route` in TARGET context (owner-only; they would refuse, and owner trust
  #     forbids them). The same files stay valid in OWNER-CONTROLLER context (codex 163642/164854): the EFFECTIVE
  #     settings at that row (inherited down blocks, include `apply` and include parameters, every descendant override
  #     recomputing them; include parameters kept as a SEPARATE layer that outranks every block/task var below it,
  #     Ansible's precedence, codex 170810) are delegate_to == `controller_scope.delegate_to`, no other
  #     `tracked_keywords`, every `pin_vars` key's effective value EXACTLY its declared expression (string equality;
  #     nothing evaluated), no `invalidating_vars` in either layer;
  #   * anywhere in the play: an include parameter named in `refused_include_vars` (it would outrank the contact's
  #     admitted interpreter / module temp), a play var in `refused_play_vars`, or the play keyword `become`.
  # There is NO owner connection play in B: a copy-only transfer needs no target toolchain readiness.
  initial_contact:
    route_rel: testing/remote_harness/tasks/initial_contact.yml
    variant: privileged
    pre_contact_route: [testing/remote_harness/tasks/refuse_pinned_outputs.yml, testing/remote_harness/tasks/resolve_policy.yml]
    contact_free_modules: [ansible.builtin.assert, ansible.builtin.set_fact, ansible.builtin.debug, ansible.builtin.include_tasks]
    owner_only_route: [testing/remote_harness/tasks/admit_ancestry.yml, testing/remote_harness/tasks/decide_private_group.yml,
                       testing/remote_harness/tasks/reap_staging.yml, testing/remote_harness/tasks/verify_toolchain_receipt.yml]
    refused_include_vars: [ansible_python_interpreter, ansible_remote_tmp, ansible_become, ansible_become_user]
    refused_play_vars: [ansible_python_interpreter, ansible_remote_tmp, ansible_become, ansible_become_user,
                        ansible_become_method, ansible_become_password]
  # execution scope of a delegated task inside a target play (check.yml macros scope_fold / scope_is_ctl; codex 164854
  # B-CONTROLLER-SCOPE-CHECKER-FALSE-PASS). pin_vars are the EXACT accepted expressions (compared as strings, never
  # evaluated; this file is data, read by lookup): the route's controller_delegation connection and python_var, and
  # the controller's own run temp. Any other value -- even one mentioning those names -- is target context.
  controller_scope:
    delegate_to: localhost
    tracked_keywords: [delegate_to, connection, remote_user, become, become_user, become_method]
    pin_vars:
      ansible_connection: '{{ hostvars[''localhost''].tr_bs.inventory.controller_delegation.connection }}'
      ansible_python_interpreter: '{{ lookup(''ansible.builtin.vars'', hostvars[''localhost''].tr_bs.inventory.controller_delegation.python_var) }}'
      ansible_remote_tmp: '{{ lookup(''ansible.builtin.env'', ''TMPDIR'') or ''~/.ansible/tmp'' }}'
    invalidating_vars: [ansible_host, ansible_port, ansible_user, ansible_ssh_executable, ansible_ssh_common_args,
                        ansible_ssh_extra_args, ansible_become, ansible_become_user, ansible_become_method]

  # ---- declared plays of each entry playbook (check.yml: exact names, order, host placement, module classes) ----
  # hosts: localhost | target  (target == the literal expression below; nothing else is admitted)
  target_hosts_expr: '{{ lme_transfer_target }}'
  entries:
    resolve_target.yml:
      - {id: observe-controller, kind: observe, hosts: localhost}
      - {id: observe-target,     kind: observe, hosts: target}
      - {id: record-contract,    kind: effect,  hosts: localhost}
    transfer.yml:
      - {id: observe-controller, kind: observe, hosts: localhost}
      - {id: observe-target,     kind: observe, hosts: target}
      - {id: stage-controller,   kind: effect,  hosts: localhost}
      - {id: place-target,       kind: effect,  hosts: target}
      - {id: record-transfer,    kind: effect,  hosts: localhost}
  observe_modules: [ansible.builtin.assert, ansible.builtin.set_fact, ansible.builtin.stat, ansible.builtin.slurp, ansible.builtin.find,
                    ansible.builtin.command, ansible.builtin.include_tasks, ansible.builtin.include_role, ansible.builtin.debug]
  # command in an observe play must be changed_when: false (check.yml); read-only by construction of its argv.
  effect_modules: [ansible.builtin.file, ansible.builtin.copy, ansible.builtin.lineinfile, ansible.builtin.unarchive,
                   ansible.builtin.shell, community.general.archive, ansible.builtin.fail]

  # ---- GATE SEED LAUNCH (codex tick213-215 / tick217 R1): deploy_gate.sh starts the seed ONLY through the bundle
  # launcher route renders from controller.bootstrap.seed_launch -- never the seed directly and never its own env
  # vector. check.yml GATE-LAUNCH validates FULL VALUES, not shell lines: the gate text is normalised (full-line
  # comments removed, backslash-newline removed exactly as bash does, so a word split across lines is rejoined), then
  #   * EVERY expansion of `seed_var` ($X, ${X}, ${X<op>...}) and EVERY indirect expansion (${!...}) found is a whole
  #     value that must be one of `allowed_expansions` exactly; `never_allowed` (the seed path itself, i.e. any direct
  #     invocation, alias or pass-through of it) is refused wherever it appears;
  #   * EVERY bare mention of `seed_var` (a name, e.g. a nameref or an input list) must sit in a normalised statement
  #     that equals one of `allowed_name_statements` exactly;
  #   * ANY `env` executable word (env, /any/path/env; quoted or not) is refused: the gate constructs no environment;
  #   * EVERY expansion of `launcher_var` (the gate's ONE launcher input, an absolute path to route's generated
  #     <bundle>/<bundle.launcher_file>; controller.bootstrap.seed_launcher) is a whole value in
  #     `launcher_allowed_expansions` exactly, and the normalised text holds EXACTLY `launch_call_count` statements
  #     matching `launch_call_regex`: the positional caller_argv form `<launcher> run <root> <ssh auth mode> <args...>`
  #     with every word quoted and "$@" passed through (no `--`, no eval, no word splitting); every other normalised
  #     statement expanding `launcher_var` must equal one of `launcher_allowed_statements` exactly.
  # `seed_var` stays the REFUSED name: after the launcher edit (route R1 relay) the gate never names the seed, so it
  # has no allowed name statement and no admitted expansion (allowed_expansions holds only the required-input
  # emptiness test ${!v:-}, an indirect expansion).
  gate_launch:
    file_rel: ../deploy_gate.sh                     # relative to tr_dir
    refusal: TRANSFER-GATE-LAUNCH
    seed_var: LME_CONTROLLER_SEED
    comment_regex: '(?m)^[ \t]*#.*$'
    continuation_regex: '\\\n'
    seed_expansion_regex: '\$(?:\{LME_CONTROLLER_SEED(?:[^A-Za-z0-9_}][^}]*)?\}|LME_CONTROLLER_SEED(?![A-Za-z0-9_]))'
    indirect_expansion_regex: '\$\{![^}]*\}'
    bare_name_regex: '(?<![$A-Za-z0-9_{])LME_CONTROLLER_SEED(?![A-Za-z0-9_])'
    env_word_regex: '(?<![A-Za-z0-9_./-])(?:/[A-Za-z0-9_./-]*/)?env(?![A-Za-z0-9_./-])'
    never_allowed: ['$LME_CONTROLLER_SEED', '${LME_CONTROLLER_SEED}']
    allowed_expansions: ['${!v:-}']                 # the required-input emptiness test only
    allowed_name_statements: []
    launcher_var: LME_CONTROLLER_LAUNCHER
    launcher_expansion_regex: '\$(?:\{LME_CONTROLLER_LAUNCHER(?:[^A-Za-z0-9_}][^}]*)?\}|LME_CONTROLLER_LAUNCHER(?![A-Za-z0-9_]))'
    launcher_allowed_expansions: ['$LME_CONTROLLER_LAUNCHER']   # the absolute-path test and the one call
    launcher_allowed_statements: ['case "$LME_CONTROLLER_LAUNCHER" in']   # + the launch_call_regex statement only
    # B-R1-CONTROL-QUOTING (codex 202245): no argument-body wildcard. After the fixed prefix, every word up to "$@" is
    # EITHER the bare flag `-e` OR one double-quoted token whose body holds only literal characters other than
    # " \ ` $ and plain $NAME expansions (no $(...), ${...}, backquote, backslash, unquoted $): an unquoted word
    # (word splitting / globbing) or a command substitution does not match. Empty "" and spaces inside quotes match.
    launch_call_regex: '(?m)^[ \t]*"\$LME_CONTROLLER_LAUNCHER" run "\$LME_CONTROLLER_ROOT" "\$LME_SSH_AUTH_MODE" -i "\$LME_TRANSFER_INVENTORY" "\$_SELF_DIR/transfer/\$pb"(?:[ \t]+(?:-e|"[^"\\`$]*(?:\$[A-Za-z_][A-Za-z0-9_]*[^"\\`$]*)*"))*[ \t]+"\$@" 2>&1 \| tee -a "\$LOG"$'
    launch_call_count: 1

  # ---- operational inputs (extra-vars from deploy_gate; operational parameters, never desired state) ----
  inputs:
    target: lme_transfer_target          # inventory host name (the alias); never an address
    ssh_key: lme_transfer_ssh_key        # deploy_gate --ssh-key; '' when not given (translated, see contract)
    state_dir: lme_transfer_state_dir    # controller-owned state directory (admitted like the toolchain root)
    label: lme_transfer_label            # deploy_gate LABEL; names the output files
    src: lme_transfer_src                # deploy_gate SRC; must be the repository the harness runs from
    remote_dir: lme_transfer_remote_dir  # deploy_gate REMOTE_DIR; the owned deployment directory on the target
    label_regex: '^[A-Za-z0-9._-]+$'
    host_regex: '^[A-Za-z0-9._-]+$'
  # output files in the state dir, <state_dir>/gate.<label>.<suffix>; deploy_gate.sh reads exactly these
  # (check.yml refuses a deploy_gate.sh that does not name each suffix).
  outputs:
    prefix: gate.
    contract_json: .contract.json
    ssh_argv: .ssh-argv          # one argv word per line (every word is regex-admitted; no newline possible)
    machine_id: .machine-id
    transfer_receipt: .transfer.json
  # v2 (B-PER-HOST-POLICY-BINDING): the receipt adds policy.scope; the contract adds scope (tr_scope_expect)
  receipt_schema: lme-deploy-transfer/v2
  contract_schema: lme-deploy-target-contract/v2

  # ---- B2-TARGET-BINDING: ONE admitted target/connection contract, resolved from the inventory host + the supported
  # explicit override, consumed by EVERY stage (Ansible plays get it as play vars; deploy_gate's ssh argv is
  # rendered from it by the same macro). Anything not admitted here is refused before any effect.
  # R-B2 / M1-TRANSPORT-COMPOSITION: B's legs are the route's `privileged` connection profile
  # (rh.controller.bootstrap.inventory.connection_profiles.privileged: user root, key reference from its key_var).
  # The inventory's own ansible_user / ansible_ssh_private_key_file belong to the owner profile and are NOT read.
  # The SSH auth mode is the route's ONE per-deployment mode (host var ssh_auth.mode_var == the seed-exported
  # ssh_auth.env_mode); the mode's ssh_common_args supply the identity options, exactly as on the route's plays.
  contract:
    ssh_client: /usr/bin/ssh                       # the same client on both paths (ansible_ssh_executable)
    address_var: ansible_host                      # absent -> the inventory host name is the address
    address_regex: '^[A-Za-z0-9._:-]+$'
    connection_profile: privileged                 # rh...inventory.connection_profiles.<this>: user + key_var
    port_var: ansible_port                         # absent -> ssh's own default on both paths (no -p)
    proxy_var: ansible_ssh_common_args             # '' | the mode's ssh_common_args | the exact ProxyJump form below
    proxy_regex: '^-o ProxyJump=([A-Za-z0-9._@:-]+)$'   # == rh...ssh_auth.composition.proxy_jump.form_regex (asserted)
    # auth modes B's legs admit (disposition from the route matrix): explicit_key needs the profile's key reference;
    # tailnet_identity uses none. agent is REFUSED explicitly: the privileged legs never carry the owner's agent.
    auth_modes_admitted: [explicit_key, tailnet_identity]
    auth_modes_refused: {agent: 'privileged legs never carry an agent socket (MAIN-only root boundary)'}
    connection_var: ansible_connection
    connection_admitted: [ssh]                     # absent == ssh
    # connection settings this contract cannot express on the bash path: present -> refused (never ignored)
    refused_vars: [ansible_ssh_extra_args, ansible_ssh_args, ansible_password, ansible_ssh_pass, ansible_ssh_password, ansible_ssh_executable,
                   ansible_become, ansible_become_user, ansible_become_method, ansible_become_password,
                   ansible_ssh_host, ansible_ssh_user, ansible_ssh_port, ansible_private_key_file]
    # B-INHERITED-OWNER-KEY (codex tick165/166): every target play binds EXACTLY these connection vars from the ONE
    # contract (macro ansible_conn; play vars outrank inventory host vars; check.yml refuses a target play that omits
    # one or binds it to anything but hostvars['localhost'].tr_conn.<var>). conn_vars are the transport; the
    # credential selectors are the ssh connection plugin's credential inputs: bind_key ones carry the contract key
    # (or '' when the mode takes none), clear ones are always ''. So an inherited owner-profile
    # ansible_ssh_private_key_file (or a password / PKCS#11 provider) can never be offered on a privileged leg.
    # Selector set = EVERY credential var of the supported plugin (ansible 2.19.11 connection/ssh.py options
    # password, private_key_file, private_key, private_key_passphrase, pkcs11_provider; all var aliases, since a later
    # alias outranks an earlier one). The 2.19 INLINE key (private_key: ansible_private_key / ansible_ssh_private_key)
    # is checked BEFORE private_key_file in _build_command (`if private_key ... elif private_key_file`), so an inherited
    # inline key would supersede the contract key (or refuse under SSH_AGENT none): it is cleared to '' (falsy) with
    # its passphrase. K19/K20 run the real ssh plugin against a recording ssh client and check what it consumed.
    conn_vars: [ansible_connection, ansible_host, ansible_user, ansible_ssh_executable, ansible_ssh_common_args,
                ansible_ssh_extra_args]
    credential_selectors:
      bind_key: [ansible_ssh_private_key_file, ansible_private_key_file]
      clear: [ansible_password, ansible_ssh_pass, ansible_ssh_password, ansible_ssh_pkcs11_provider,
              ansible_private_key, ansible_ssh_private_key, ansible_private_key_passphrase, ansible_ssh_private_key_passphrase]
    # deploy_gate flag -> contract field. Rule: profile key unset -> the flag supplies it; both set and equal -> it;
    # both set and different -> TRANSFER-CONTRACT-CONFLICT before any effect.
    overrides:
      ssh_key: {field: key, flag: --ssh-key}
    # transport options B adds on both paths; the identity options (IdentityAgent / IdentitiesOnly /
    # PubkeyAuthentication) come ONLY from the mode's ssh_common_args (route composition.identity_options).
    options:
      - BatchMode=yes
      - ConnectTimeout=15
      - StrictHostKeyChecking=accept-new
    # privilege: wipe_lme.sh / install.sh run as root on the target (MAIN-only privileged execution). Root is a
    # DECLARED contract field, required from the inventory, never a hostname factory.
    privilege: {remote_user: root, uid: 0}
    identity_file: /etc/machine-id                 # the endpoint identity every stage re-reads before its effect
    identity_regex: '^[0-9a-f]{32}$'

  # ---- B2-OWNED-SOURCE-EDITION: what is shipped ----
  source:
    git: /usr/bin/git                              # controller tool (seam S6: not in controller.bootstrap.os_tools)
    must_equal_repo_root: true                     # src == the repository the harness itself resolved (no substitution)
    clean: tracked                                 # no staged or unstaged change to any tracked path
    # B-COMMIT-INDEX-RACE: membership, modes and blob ids come from the IMMUTABLE tree of the commit HEAD resolved to
    # once (ls-tree by commit id), minus `excludes`; the index is never a source (untracked never shipped either).
    members: committed_tree
    tree_list_args: [ls-tree, -r, --full-tree]     # + <commit id>; output "<mode> <type> <blob>\t<path>"
    refused_modes: ['120000', '160000']            # symlink, gitlink: refused (none exist today)
    admitted_modes: {'100644': '644', '100755': '755'}   # git mode -> the mode every placed member gets
    history: not_transferred
    history_evidence: >-
      no target-side consumer of the transferred tree reads git history: install.sh, scripts/*.sh and ansible/ contain
      no git rev-parse/describe/log/ls-files; the two ansible.builtin.git uses clone OTHER repositories
      (llm_consumer_activate.yml lme-docs, ludus_lme_server). A job that needs history needs a history bundle; this
      edition is a history-independent source archive and says so in its receipt (edition.kind).
    edition_kind: committed_source_archive

  # ---- SOURCE-REF: the phase-control source admission policy (controls/source_ref.yml, controls/load_paths.yml,
  # check.yml). The tasks own no policy of their own; MAIN approval tick160 (codex 050338).
  controls_source:
    git: source.git                                # a REFERENCE to transfer.source.git (the executable), not a copy
    default_commit: HEAD
    commit_regex: '^[0-9a-f]{40}$'
    status_args: [status, --porcelain, --untracked-files=normal]   # tracked edits AND untracked files; ignored excluded
    runner_rule: realpath_equal                    # the controls run from inside the source (realpath equality)
    load_binding:
      config_file: none_or_inside_candidate        # CONFIG_FILE of `ansible-config dump`, run with chdir = candidate
      project_path_keys:                           # a listed path that exists OUTSIDE the candidate and is non-empty
        - DEFAULT_ROLES_PATH                       # refuses CONTROLS-SOURCE-LOAD-PATH
        - DEFAULT_FILTER_PLUGIN_PATH
        - DEFAULT_TEST_PLUGIN_PATH
        - DEFAULT_LOOKUP_PLUGIN_PATH
        - DEFAULT_ACTION_PLUGIN_PATH
        - DEFAULT_MODULE_PATH
        - DEFAULT_MODULE_UTILS_PATH
        - DEFAULT_CALLBACK_PLUGIN_PATH
        - DEFAULT_STRATEGY_PLUGIN_PATH
        - DEFAULT_VARS_PLUGIN_PATH
        - DEFAULT_CONNECTION_PLUGIN_PATH
        - DEFAULT_INVENTORY_PLUGIN_PATH
        - DEFAULT_CACHE_PLUGIN_PATH
        - BECOME_PLUGIN_PATH
        - DOC_FRAGMENT_PLUGIN_PATH
      recorded_keys: [COLLECTIONS_PATHS]           # managed toolchain: recorded, never refused
      lookup_bases: [tr_dir, transfer_dir, playbook_dir, ctl_dir, repo_root, rh_repo_root]
      identity_lookups: ['/etc/machine-id', contract.identity_file]   # host identity, recorded, not project bytes
      # check.yml static scan of B's own *.yml / *.j2 (comments stripped first): every lookup('ansible.builtin.file'
      # | 'ansible.builtin.template', X) has X starting with a lookup_base (or X is a quoted identity literal), and
      # every include/import value starts with "{{ <lookup_base>" or is a bare same-directory *.yml name.
      static:
        scan_exclude: [transfer.decl.yml, controls/CASES.yml]   # data, never loaded as tasks or templates
        strip_regexes: ['(?s)\{#.*?#\}', '(?m)^\s*#.*$']
        lookup_regex: "lookup\\(\\s*'ansible\\.builtin\\.(?:file|template)'\\s*,\\s*([^,)]+)"
        include_regex: '(?m)^[ \t]*-?[ \t]*(?:ansible\.builtin\.)?(?:include_tasks|import_tasks|include_vars|import_playbook|include_role|import_role):[ \t]*(.*)$'
        relative_include_regex: '^[A-Za-z0-9_.-]+[.]yml$'
        # METHOD-ATTR (route audit; the genesis env.clear bug): in Jinja an ATTRIBUTE read whose name is a dict method
        # returns the METHOD, never the data key (`x.clear | bool` is False, iterating it fails). check.yml refuses any
        # such read not followed by `(` in the same comment-stripped files; data keys with these names are read by
        # subscript (x['clear']). `ansible.builtin.copy` (a module name, not a read) is excluded by the lookbehind.
        method_attr_regex: '(?<=[A-Za-z0-9_\]\)])(?<!builtin)\.(clear|copy|get|items|keys|values|pop|popitem|update|setdefault|fromkeys)\b(?!\s*\()'

  # members excluded from the committed set (the consumer's transfer manifest). kinds:
  #   name   -- a path component with this name at any depth (and everything below it)
  #   path   -- this relative path (and everything below it)
  #   suffix -- a basename ending
  excludes:
    - {name: .git}
    - {name: scratchpad}
    - {name: _ocr_wt}
    - {name: .ocr}
    - {name: .cursor}
    - {name: .opencode}
    - {name: .quarantine}
    - {name: .superpowers}
    - {name: node_modules}
    - {name: __pycache__}
    - {suffix: .pyc}
    - {suffix: .qcow2}
    - {suffix: .iso}
    - {suffix: .img}
    - {name: offline_resources}
    - {path: config/lme-environment.env}
    - {name: .lme-transfer}
    - {path: testing}
  # R-B3 item 4 (testing/ export-ignore): `testing` is NOT in the deploy edition, agreeing with .gitattributes
  # `testing export-ignore`. Evidence (repository-scoped): no target-side consumer reads testing/ -- install.sh,
  # scripts/*.sh and ansible/ mention it only in comments/help text (install.sh:50, convert_to_cluster.sh:244,
  # create_cluster_inventory.sh:333, upgrade_lme.yml:344, role comments); deploy_gate.sh and every route/B playbook
  # run on the CONTROLLER from the worktree; the route ships its toolchain bundle only (edition_contents).

  # ---- controller state (B2-TEMP-LIFECYCLE). Admitted with rh path_admission (+ ancestry); owned by the gate user.
  controller_state:
    ledger: operations.log                         # lines: `start <op> <writer token>`, else `<verb> <op>`; verbs below
    # B-CROSS-ROOT-RECOVERY: the state dir may be shared by several controller roots. An unfinished op is abandoned
    # (its two recorded paths removed) ONLY when its start token is THIS controller's (tr_ctl_token = sha256 of
    # machine-id ':' controller root); any other token, or a legacy untokened start, is an UNCERTAIN writer: its
    # artifacts are preserved, never abandoned here, and reported as TRANSFER-STATE-UNCERTAIN-PRESERVED <ops>.
    # Shared-ledger preservation (B-CROSS-ROOT-RECOVERY residual, codex 150646): EVERY controller-ledger write
    # (start, fail, abandon, complete) goes through tasks/controller_ledger.yml -> macro ctl_ledger_append: under
    # `flock -x -w ledger_wait_s -E ledger_busy_rc <state_dir>/<ledger_lock>` (the ONE lock every root sharing this
    # state dir takes; os_tools.flock admitted by identity first) the lines are appended with O_APPEND (`>>`), never a
    # read-modify-write, so no writer's start or terminal row can be lost. Busy -> TRANSFER-STATE-LEDGER-BUSY, nothing
    # written. Files are created 0600 (umask 077 inside the command).
    ledger_lock: .ledger.lock
    ledger_wait_s: 30
    ledger_busy_rc: 75
    pending_dir: pending                           # <op>.tar.gz and <op>.d (extraction for binding) ONLY
    verbs: {start: start, complete: complete, fail: fail, abandon: abandon}
    op_regex: '^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$'     # op id = UTC stamp + 12 random hex; ledger lines are parsed with it
    # retention: success and failure remove this op's exact archive + extraction; an op with `start` and no
    # terminal line (interrupted) is abandoned by the NEXT operation, which removes exactly its two recorded paths.
    # Nothing else in the state dir is ever removed; the temp root is never globbed.
    retain_on_failure: []                          # diagnostics = the gate log + this ledger, never the archive
    archive_max_bytes: 200000000                   # budget: a larger archive is refused before it leaves the controller

  # ---- target placement (B2-OWNED-SOURCE-EDITION): in-place reconciliation against an OWNED manifest ----
  # Why not edition directories + a symlink swap: install.sh writes INTO its own tree (config/lme-environment.env,
  # the wazuh manager conf rewritten with sudo mv) and the 21G offline_resources bundle persists inside REMOTE_DIR,
  # so a fresh edition directory would lose or duplicate persistent state. Promotion is therefore per-member atomic
  # (rename(2) from a verified staging tree on the same filesystem), NOT atomic for the whole tree; the ledger makes
  # an interrupted promotion recoverable (its manifest joins the next prune set).
  # ---- R-B3 deploy edition (codex-000256 R-B3-PUBLISH-MODEL): OWNED IN-PLACE RECONCILE, one resolved config ----
  # binds rh.transfer.adapters.managed_archive.publish_models.deploy_edition (model in_place_reconcile, owner B,
  # out_of_edition declared_by_B, unarchive_path_equality required); bind_controller.yml asserts that binding.
  edition:
    model: in_place_reconcile
    membership: 'source.members: the tree of the commit HEAD resolved to, read by commit id, minus `excludes` (never the index; nothing untracked, nothing excluded)'
    removal_inventory: 'target.owned_manifest of the ACTIVE edition + the manifests of promoted-unfinished ops; ONLY
      regular files listed there are ever removed; a file no edition recorded is never removed'
    # persistent in-tree state that survives every reconcile: never a member, never in a removal inventory (an owned
    # manifest naming one refuses TRANSFER-OWNED-STATE), never written by promotion. kinds as `excludes`, plus prefix.
    out_of_edition:
      - {name: offline_resources, why: 'airgapped bundle built ON the target (install.sh:210/1101); not rebuildable offline'}
      - {path: config/lme-environment.env, why: 'created by install.sh:1388/1411 and roles/base setup_directories.yml:29'}
      - {prefix: config/wazuh_cluster/wazuh_manager.conf.backup., why: 'install.sh:1329 backup copies'}
      - {path: inventory, why: 'operator-supplied install.sh:848 inventory (untracked)'}
      - {path: ansible/inventory/cluster.yml, why: 'generated cluster inventory (install.sh:299; untracked)'}
      - {name: .lme-transfer, why: 'B owned state'}
    # tracked members install rewrites in place: reset to the edition by the next reconcile; install re-applies.
    install_rewrites_members: [config/wazuh_cluster/wazuh_manager.conf]
    # edition record written on completion (<state_dir>/<record>): the revision a retry converges on
    record: edition.json
    record_schema: lme-deploy-edition/v2          # v2 adds scope_id, scope_sha256, scopes_sha256
    record_fields: [schema, op, commit, edition_kind, decl_sha256, policy_sha256, scope_id, scope_sha256, scopes_sha256, owned_sha256_digest, member_count, completed_by]

  target:
    state_dir: .lme-transfer                       # inside REMOTE_DIR; excluded from members above
    owned_manifest: owned.sha256                   # sha256sum format, the ACTIVE owned edition
    modes_manifest: owned.modes                    # "<mode> <path>" of the active owned edition
    ledger: operations.log
    verbs: {start: start, promote: promote, complete: complete, fail: fail, abandon: abandon}
    token_regex: '^[0-9a-f]{64}$'                  # `start <op> <token>`; other verbs `<verb> <op>`
    staging_dir: staging                           # staging/<op>/
    incoming_dir: incoming                         # incoming/<op>.tar.gz
    ops_dir: ops                                   # ops/<op>.sha256 kept until a later op completes
    dir_mode: '0750'
    owner_uids: [0]                                # REMOTE_DIR ancestry: uid 0 only (the declared privilege)
    # Tools B runs on the target, each a NAME in rh.transfer.adapters.managed_archive.target.tools (the route's
    # closure; used_by only) and in THIS host's engine derivation lme_resolved.remote_harness.adapter.tools['target.tools']
    # (path + identity derived by C1 from that host's effective os_tools, r3f; never read from hostvars.localhost, never
    # pinned here). Invoked ONLY by that derived path (macros take the path map; no PATH lookup). Before the first target
    # mutation each must exist, be executable, and hash to the derived identity sha256 (TRANSFER-TARGET-TOOL-IDENTITY).
    # Missing -> refusal naming the ONE bootstrap (rh packages.required), never installed here.
    tools_used: [tar, gzip, find, sha256sum, sort, cmp, chmod, mv, mkdir, rm, rmdir, id, cat, flock]
    # tools a MODULE resolves through PATH (ansible.builtin.unarchive -> tar, and tar -z -> gzip). Proven equal to the
    # declared admitted path (same device + inode after following links) under the module's PATH, before any effect
    # (TRANSFER-TARGET-PATH-TOOL); the controller binding extraction proves the same against os_tools.
    path_resolved: {ansible.builtin.unarchive: [tar, gzip]}
    # staging bounded (M1-STAGING-RECOVERY, aligned with the route's E25-E27 lease/flock model):
    #  * every mutation of staging/incoming/ops and every promotion runs as `flock -x -n -E 75 <state_dir>/<lock>`
    #    (persistent lock file; rc 75 -> TRANSFER-TARGET-BUSY, nothing removed, no new staging);
    #  * the ledger `start` line carries the writer's controller token (sha256 of controller machine-id + ':' + owned
    #    controller root). An unfinished op is DEAD only when its token is THIS controller's: the seed holds the
    #    controller root lock for the whole run, so no other writer with this token can be live. Any other token
    #    (another controller or root) is UNKNOWN: kept, charged to the budget, and it REFUSES a new in-place reconcile
    #    (TRANSFER-TARGET-FOREIGN-UNFINISHED) -- never age-based deletion;
    #  * budget: at most staging_max_unknown unknown unfinished ops are tolerated in the observation; any unknown refuses.
    #  * internal custody (B-TARGET-INTERNAL-CUSTODY): tasks/target_custody.yml admits every EXISTING path of
    #    state_dir, staging_dir, incoming_dir, ops_dir (directories), lock, ledger, owned_manifest, modes_manifest and
    #    the edition record (regular files) -- never a link, the declared kind, not group/other-writable, uid in
    #    owner_uids -- in target_observe and again first in target_place, before any mutation; ops entries must be
    #    regular non-link files (TRANSFER-TARGET-INTERNAL-CUSTODY). The lock is created 0600 explicitly, never by umask.
    lock: .lock
    busy_rc: 75
    publish_wait_s: 30                             # promote/prune: flock -x -w 30 (route E26); claim/reap: flock -x -n
    # the claim is a compare-and-swap: under the lock the ledger must equal (sha256) the one the observe play
    # classified, else TRANSFER-TARGET-LEDGER-MOVED (busy_rc); ledger lines are appended only inside locked bodies.
    staging_max_unknown: 0
    first_adoption: >-
      a REMOTE_DIR without an owned manifest (e.g. left by the retired rsync stage) is adopted with an EMPTY prune set:
      files it holds that no edition ever recorded are not owned and are not removed; the receipt records
      adopted=true.

  results:
    ok: {check: transfer, reason: ''}
    refused: {check: transfer, reason: TRANSFER_REFUSED}
    no_receipt: {check: transfer, reason: TRANSFER_NO_RECEIPT}
    contract_refused: {check: target-contract, reason: TARGET_CONTRACT_REFUSED}
    identity_mismatch: {check: target-identity, reason: TARGET_IDENTITY_MISMATCH}
    input_missing: {check: transfer-input, reason: TRANSFER_INPUT_MISSING}
  remedy: establish it through the ONE declared bootstrap operation (remote-harness controller.bootstrap); deploy_gate never installs anything
