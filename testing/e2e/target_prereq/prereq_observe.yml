---
# testing/e2e/target_prereq/prereq_observe.yml -- ENTRY: the MAIN-only privileged READ-ONLY OBSERVATION of one target
# BEFORE its prerequisite leg (B-owned; codex-tick360 preservation rules 2 and 6). AUTHORED, NEVER EXECUTED; inert until
# C1 registers rh.controller.bootstrap.target_prereq REVISION 4 (testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml).
# WHY: the route's observe.yml runs as the non-root OWNER, which does not exist before target_prereq.yml creates it, so
# it cannot observe a fresh target first. This leg reuses the ONE declared preflight (tasks/prereq_preflight.yml, the
# same tasks target_prereq.yml runs) over B's ONE privileged contract, with the MINIMUM input-only dependencies: it reads
# NO key file (no owner .pub, no owner_key / owner_pubkey role), needs nothing an effect creates, and intends no
# deployment-state mutation on the target (ordinary ADMITTED Ansible module staging still occurs: each module task
# stages and removes its payload under the admitted root module temp, ansible_remote_tmp, set by initial_contact). Its record is the evidence MAIN uses to confirm or revise the lab file's preservation declaration
# (known_set members + expected states, or verified_none) and a later obs_prior_dirs declaration.
# Started only through the seed launcher, by MAIN (the privileged key is MAIN's; subagents never run it):
#   <bundle>/lme-seed-launch.sh run <controller root> explicit_key -i <run inventory dir> \
#     testing/e2e/target_prereq/prereq_observe.yml -e lme_transfer_target=<alias> -e lme_transfer_ssh_key= \
#     -e lme_transfer_state_dir=<abs> -e lme_transfer_label=<label> -e <tp.observe.measure.op_var>=<op>
# OPERATION (codex-r2-r4-r5-bootstrap-decisions-20261006 R5): the REQUIRED extra-var named by tp.observe.measure.op_var
# (no default) selects one of tp.observe.measure.ops before any contact:
#   observe_op  the preservation observation below (shared preflight + obs_paths extras; record observe.record_suffix)
#   measure_op  MEASUREMENT-ONLY (tasks/measure_target_tools.yml): the same privileged initial contact, then a read-only
#               stat/sha256 of the os_tools entries selected by tp.observation labels on THIS target's resolved policy
#               (the measurement step executes no selected tool; only the privileged initial contact's own admitted
#               tools ran, flagged per tool executed_by_contact -- systemctl is not one), publish (record measure.record_suffix) and STOP -- the shared preflight
#               (setup, service_facts, unit probe) and the obs_paths extras are NOT run. Its record carries a CANDIDATE
#               per-host identity override that MAIN reviews; this leg never adopts it, and the record claims neither
#               projection nor adoption (the host-scoped override join, C1 r3f, is required first). Its ONLY inputs are
#               the target binding (roster, tp_ti, split check), the hypervisor allocation check and the privileged
#               initial contact: owner / layout / obs_paths / preservation selectors / observe.required_roles are
#               observe-only and are neither required nor read (codex-tick393 item 3, codex-tick394 R5-OPERATION-DEPENDENCIES).
# Plays:
#   observe-controller (localhost) first-entry guards, the ONE privileged contract (testing/e2e/transfer
#                                  tasks/bind_controller.yml -> tr_conn), policy r4, the minimum bound inputs, tp_ctl
#   observe-preflight  (target)    guards, resolve, tasks/prereq_preflight.yml (contact + read-only preflight incl. the
#                                  declared preservation selection), then the observe-only extras: root-only path
#                                  metadata of each obs_paths entry and its ancestors, and a depth-1 listing of it
#   observe-record     (localhost) ALWAYS writes <state dir>/<tr.outputs.prefix><label><tp.observe.record_suffix> (0600),
#                                  then refuses ONLY when the privileged contact was not admitted. Preflight refusals
#                                  are `findings` (what target_prereq.yml would refuse), never acted on here.
# Never: a deployment-state write on the target (admitted module staging under the root module temp is the only target
# write), a unit start/stop/enable/disable/mask, a read of any private or public key file.
# EXIT CODE (codex-tick370): rc 0 does NOT mean a clean observation. rc 0 can include observation errors (a rescued
# preflight or obs_paths stop, recorded in preflight.refusals / obs_paths_error) and preflight findings (what
# target_prereq.yml would refuse). Consumers read the RECORD, never the rc alone; the record is diagnostic, not
# readiness and not completed retirement. rc != 0 means the contact was not admitted (or an earlier guard refused).
# COVERAGE LIMITS (codex-tick370, codex-tick375-377): DISCOVERY is service_facts, which lists SYSTEM .service units
# only -- no .timer / .socket / .path units and no user-manager units. Every declared expectation and every absence is
# decided from the declared exact-unit PROBE (tp.preservation.probe: LoadState / ActiveState / SubState /
# UnitFileState); UnitFileState `generated` (podman quadlet) is ADMITTED as_expected despite possible autostart and
# stays admitted until exact ownership / lifecycle evidence is joined. A probe error (tool not admitted -- route join
# TP4-PROBE-TOOL --, rc != 0, a missing field, a value outside its enum) is RETAINED per unit (preservation.probe.results)
# and recorded as a probe_unknown FINDING here; it is never enforced by this leg (target_prereq.yml refuses it).
- name: observe-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    - name: Refuse a pre-supplied bare derived name of this leg (first entry; before any use)
      ansible.builtin.assert:
        that:
          - "['tr', 'tp'] | select('in', vars) | list | length == 0"
        fail_msg: >-
          REFUSED RH-TARGET-PREREQ-DERIVED-OUTPUT-PINNED: {{ ['tr', 'tp'] | select('in', vars) | list }} were supplied
          from outside (extra-var / inventory); they are derived by this leg, never inputs.
        quiet: true

    - name: Derive the transfer declaration and its directory (derived here; never a play var or an input)
      ansible.builtin.set_fact:
        tr_dir: "{{ rh_repo_root ~ '/testing/e2e/transfer' }}"
        tr: "{{ (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/e2e/transfer/transfer.decl.yml') | from_yaml).transfer }}"

    - name: Controller prelude (policy, executor, the ONE privileged contract, state dir) -- as target_prereq.yml obtains it
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/e2e/transfer/tasks/bind_controller.yml"

    - name: Refuse an unregistered leg (r4), a moved entry or transfer dir, a foreign contract, or an unregistered tool / group
      vars:
        _tp_r4: "{{ rh.controller.bootstrap.target_prereq | default({}) }}"
        _tools: "{{ rh.controller.bootstrap.os_tools }}"
      ansible.builtin.assert:
        that:
          - _tp_r4 is mapping and _tp_r4.revision | default(0) == 4
          - _tp_r4.runner | default('') == 'MAIN_only'
          - (_tp_r4.observe | default({})).runner | default('') == 'MAIN_only'
          - rh_repo_root ~ '/' ~ ((_tp_r4.observe | default({})).playbook_rel | default('')) == playbook_dir ~ '/prereq_observe.yml'
          - rh_repo_root ~ '/' ~ ((_tp_r4.reuse | default({})).preflight_rel | default('')) == playbook_dir ~ '/tasks/prereq_preflight.yml'
          - tr_dir == rh_repo_root ~ '/' ~ _tp_r4.reuse.transfer_dir_rel
          - tr.contract.connection_profile == _tp_r4.connection_profile
          - _tp_r4.linger.tool in _tools and _tools[_tp_r4.linger.tool].path is match(rh.controller.bootstrap.path_admission.regex)
          - (_tools[_tp_r4.linger.tool].identity.sha256 | default('')) is match('^[0-9a-f]{64}$')
          - (rh.controller.bootstrap.inventory.role_groups.hypervisors | default('')) is match('^[A-Za-z_][A-Za-z0-9_]*$')
        fail_msg: >-
          REFUSED RH-TARGET-PREREQ: rh.controller.bootstrap.target_prereq is not registered at revision 4 with
          observe.{runner MAIN_only, playbook_rel} and reuse.preflight_rel naming THIS entry and its shared preflight (C1
          registers testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml), or its transfer dir / contract
          profile differs from B's, or os_tools.{{ _tp_r4.linger.tool | default('?') }} or inventory.role_groups.hypervisors
          is not registered. Nothing was contacted.
        quiet: true

    - name: Bind the leg policy (resolved rh only)
      ansible.builtin.set_fact:
        tp: "{{ rh.controller.bootstrap.target_prereq }}"

    - name: Refuse a roster other than the registry's (target group membership)
      ansible.builtin.assert:
        that:
          - tp == rh.controller.bootstrap.target_prereq
          - lme_transfer_target in (groups[rh.controller.bootstrap.inventory.target_group] | default([]))
        fail_msg: >-
          REFUSED {{ tp.refusal }}: tp is not the resolved policy, or {{ lme_transfer_target }} is not a member of
          {{ rh.controller.bootstrap.inventory.target_group }}.
        quiet: true

    # OPERATION SELECTION, STAGED (codex-tick396 item 1; no private fallback, no free text). The r4 registration assert
    # above admitted tp.observe as the mandatory parent (runner, playbook_rel), and tp.refusal; a missing or non-mapping
    # measure node is reported THROUGH that parent only (its refusal code, its playbook_rel and its admitted key set; the
    # failing condition itself names the node in the assert result). Once present, every measure field was admitted by
    # the loader contract (C1 TP5-MEASURE: observe keys include measure; observe.measure.* checks), so the later stages
    # consume the node without re-defaulting it.
    - name: Refuse an observe declaration without the operation node (stage 1 -- presence and type, through the parent)
      ansible.builtin.assert:
        that:
          - tp.observe.measure is defined
          - tp.observe.measure is mapping
        fail_msg: "REFUSED {{ tp.refusal }}: {{ tp.observe.playbook_rel }} {{ tp.observe | list | to_json }}"
        quiet: true

    - name: Refuse an absent operation input (stage 2 -- the op_var input is supplied; read only after presence)
      ansible.builtin.assert:
        that:
          - tp.observe.measure.op_var in vars
        fail_msg: >-
          REFUSED {{ tp.observe.measure.refusal }}: {{ tp.observe.measure.texts.op }} ({{ tp.observe.measure.op_var }};
          {{ tp.observe.measure.ops | to_json }}). {{ tp.observe.measure.texts.pre_contact }}
        quiet: true

    - name: Refuse an unknown operation (stage 3 -- the supplied value is one of the declared ops)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.vars', tp.observe.measure.op_var) in tp.observe.measure.ops
        fail_msg: >-
          REFUSED {{ tp.observe.measure.refusal }}: {{ tp.observe.measure.texts.op }} ({{ tp.observe.measure.op_var }}
          {{ lookup('ansible.builtin.vars', tp.observe.measure.op_var) | to_json }}; {{ tp.observe.measure.ops | to_json }}).
          {{ tp.observe.measure.texts.pre_contact }}
        quiet: true

    - name: Bind the admitted operation (derived after the staged asserts above; reserved_prereq_vars family)
      ansible.builtin.set_fact:
        _tp_ms_op: "{{ lookup('ansible.builtin.vars', tp.observe.measure.op_var) }}"

    - name: Bind this target's typed target inputs (ONLY the loader binding; the host vars are never read raw)
      ansible.builtin.set_fact:
        tp_ti: "{{ ((lme_resolved.remote_harness.binding.deployment.target_inputs | default({}))[lme_transfer_target] | default({})) }}"

    # MINIMUM input set (decl r4 observe.required_roles): input-only values; no key role, no bundle, no toolchain root.
    # OBSERVE OPERATION ONLY (codex-tick393 item 3): the measurement operation needs none of these observation inputs
    # (owner / layout / obs_paths / preservation basis and selectors); its dependencies are the target binding above, the
    # target play's split-input and hypervisor-allocation checks, and the privileged initial contact.
    - name: Refuse an absent target input this observation needs (every role is optional in the registry; no default here)
      when: _tp_ms_op == tp.observe.measure.observe_op
      ansible.builtin.assert:
        that:
          - tp.observe.required_roles | reject('in', tp_ti) | list | length == 0
        fail_msg: >-
          REFUSED {{ tp.refusal }}: {{ lme_transfer_target }} has no bound target input(s)
          {{ tp.observe.required_roles | reject('in', tp_ti) | list }} (binding.deployment.target_inputs). Nothing was contacted.
        quiet: true

    - name: Refuse malformed observation inputs or a layout other than the declared one (pre-contact)
      when: _tp_ms_op == tp.observe.measure.observe_op
      vars:
        _rx: "{{ rh.controller.bootstrap.path_admission.regex }}"
        _w: "{{ tp_ti.prereq_work_root }}"
        _tp_refp: "{{ rh.controller.bootstrap.work_roots.admission.refused_prefixes }}"
      ansible.builtin.assert:
        that:
          - tp_ti.owner is string and tp_ti.owner is match('^[a-z_][a-z0-9_-]{0,31}$')
          - tp_ti.prereq_owner_home is match(_rx)
          - _w is match(_rx) and _w is match('^/.+/[^/]+$')
          - (_w ~ '/') is not match('(' ~ (_tp_refp | map('regex_escape') | join('|')) ~ ')')
          - tp_ti.prereq_work_parent_path == (_w | dirname)
          - tp_ti.prereq_work_parent_owner == tp.layout.work_parent_rule.owner
          - tp_ti.prereq_work_parent_mode is string and tp_ti.prereq_work_parent_mode is match(tp.layout.work_parent_rule.mode_regex)
          - tp_ti.prereq_work_parent_group is match('^[a-z_][a-z0-9_-]{0,31}$')
          - tp_ti.obs_paths is sequence and tp_ti.obs_paths is not string and tp_ti.obs_paths | length > 0
          - tp_ti.obs_paths | reject('match', _rx) | list | length == 0
        fail_msg: >-
          REFUSED {{ tp.refusal }}: {{ lme_transfer_target }}'s bound observation inputs must give an account-name owner,
          an admitted home, a work root outside {{ _tp_refp }} whose work parent is {path: dirname(work root), owner: root,
          group, mode matching {{ tp.layout.work_parent_rule.mode_regex }}}, and a non-empty obs_paths list of admitted
          absolute paths. Nothing was contacted.
        quiet: true

    - name: Bind the declared preservation selection (loader binding only; no default; same derivation as target_prereq.yml)
      when: _tp_ms_op == tp.observe.measure.observe_op
      vars:
        _pvd: "{{ tp.preservation }}"
      ansible.builtin.set_fact:
        tp_pv: >-
          {%- set m = namespace(d={}, dup=[]) -%}
          {%- for st in _pvd.expected_states | list | sort if _pvd.expected_states[st].role in tp_ti -%}
          {%- for u in tp_ti[_pvd.expected_states[st].role] -%}
          {%- if u in m.d -%}{%- set m.dup = m.dup + [u] -%}{%- endif -%}
          {%- set m.d = m.d | combine({u: st}) -%}
          {%- endfor -%}{%- endfor -%}
          {%- set vr = _pvd.bases.verified_none.role -%}
          {%- set vn = tp_ti[vr] if vr in tp_ti else none -%}
          {{ {'basis': ('conflicting' if (m.dup | length > 0 or (vn is not none and (vn is not sameas true or m.d | length > 0)))
                        else ('verified_none' if vn is sameas true else ('known_set' if m.d | length > 0 else 'undeclared'))),
              'members': m.d, 'duplicates': m.dup,
              'selectors': tp_ti[_pvd.discovery.selector_role] if (_pvd.discovery.selector_role in tp_ti) else []} }}

    # Observation may run BEFORE the lab file declares a basis (`undeclared`: every selector match is recorded, nothing
    # is evaluated); a DECLARED basis must be well-formed (a conflicting or malformed one refuses, never ignored).
    - name: Refuse a conflicting basis or malformed members / selectors (pre-contact)
      when: _tp_ms_op == tp.observe.measure.observe_op
      vars:
        _pvd: "{{ tp.preservation }}"
      ansible.builtin.assert:
        that:
          - tp_pv.basis in ((_pvd.bases | list) + ['undeclared'])
          - tp_pv.members.keys() | list | reject('match', _pvd.unit_regex) | list | length == 0
          - tp_pv.selectors | reject('match', _pvd.discovery.selector_regex) | list | length == 0
          - tp_pv.basis != 'verified_none' or tp_pv.selectors | length > 0
          - tp_pv.basis != 'undeclared' or tp_pv.selectors | length > 0
        fail_msg: >-
          REFUSED {{ _pvd.refusal }}: {{ lme_transfer_target }} preservation basis {{ tp_pv.basis }} (members
          {{ tp_pv.members | to_json }}, duplicates {{ tp_pv.duplicates | to_json }}, selectors {{ tp_pv.selectors | to_json }})
          is conflicting or malformed, or no discovery selector ({{ _pvd.discovery.selector_role }}) is bound for a
          verified_none / undeclared basis (an observation without a selector would see nothing). Nothing was contacted.
        quiet: true

    - name: Publish the controller-decided observation values (derived output; nothing key-related)
      when: _tp_ms_op == tp.observe.measure.observe_op
      vars:
        _tp_lt: "{{ rh.controller.bootstrap.os_tools[tp.linger.tool] }}"
      ansible.builtin.set_fact:
        tp_ctl:
          owner: "{{ tp_ti.owner }}"
          home: "{{ tp_ti.prereq_owner_home }}"
          work_root: "{{ tp_ti.prereq_work_root }}"
          work_parent:
            path: "{{ tp_ti.prereq_work_parent_path }}"
            owner: "{{ tp_ti.prereq_work_parent_owner }}"
            group: "{{ tp_ti.prereq_work_parent_group }}"
            mode: "{{ tp_ti.prereq_work_parent_mode }}"
          hypervisor: "{{ lme_transfer_target in (groups[rh.controller.bootstrap.inventory.role_groups.hypervisors] | default([])) }}"
          preservation: {basis: "{{ tp_pv.basis }}", members: "{{ tp_pv.members }}", selectors: "{{ tp_pv.selectors }}"}
          linger_tool: {name: "{{ tp.linger.tool }}", path: "{{ _tp_lt.path }}", sha256: "{{ _tp_lt.identity.sha256 }}"}
          obs_paths: "{{ tp_ti.obs_paths }}"
          operation: "{{ _tp_ms_op }}"
          record_path: "{{ lme_transfer_state_dir }}/{{ tr.outputs.prefix }}{{ lme_transfer_label }}{{ tp.observe.record_suffix }}"

    - name: Publish the controller-decided measurement values (derived output; no observation input is read)
      when: _tp_ms_op == tp.observe.measure.measure_op
      ansible.builtin.set_fact:
        tp_ctl:
          # membership read from the target's own inventory groups (no private empty-group fallback)
          hypervisor: "{{ rh.controller.bootstrap.inventory.role_groups.hypervisors in hostvars[lme_transfer_target].group_names }}"
          operation: "{{ _tp_ms_op }}"
          record_path: >-
            {{ lme_transfer_state_dir ~ tp.observe.measure.path_separator ~ tr.outputs.prefix ~ lme_transfer_label
               ~ tp.observe.measure.record_suffix }}

- name: observe-preflight
  hosts: "{{ lme_transfer_target }}"
  gather_facts: false
  any_errors_fatal: true
  vars:
    ansible_connection: "{{ hostvars['localhost'].tr_conn.ansible_connection }}"
    ansible_host: "{{ hostvars['localhost'].tr_conn.ansible_host }}"
    ansible_user: "{{ hostvars['localhost'].tr_conn.ansible_user }}"
    ansible_ssh_executable: "{{ hostvars['localhost'].tr_conn.ansible_ssh_executable }}"
    ansible_ssh_common_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_common_args }}"
    ansible_ssh_extra_args: "{{ hostvars['localhost'].tr_conn.ansible_ssh_extra_args }}"
    ansible_ssh_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_file }}"
    ansible_private_key_file: "{{ hostvars['localhost'].tr_conn.ansible_private_key_file }}"
    ansible_password: "{{ hostvars['localhost'].tr_conn.ansible_password }}"
    ansible_ssh_pass: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pass }}"
    ansible_ssh_pkcs11_provider: "{{ hostvars['localhost'].tr_conn.ansible_ssh_pkcs11_provider }}"
    ansible_ssh_password: "{{ hostvars['localhost'].tr_conn.ansible_ssh_password }}"
    ansible_private_key: "{{ hostvars['localhost'].tr_conn.ansible_private_key }}"
    ansible_ssh_private_key: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key }}"
    ansible_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_private_key_passphrase }}"
    ansible_ssh_private_key_passphrase: "{{ hostvars['localhost'].tr_conn.ansible_ssh_private_key_passphrase }}"
    # no ansible_remote_tmp / ansible_python_interpreter / become: the PRIVILEGED contact sets both as host facts.
  tasks:
    - name: Refuse pre-supplied harness outputs (route author; first task on this host -- never again in this run)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family on this host (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    - name: Refuse a pre-supplied bare derived name on this host (first entry; inventory host vars included)
      ansible.builtin.assert:
        that:
          - "['tr', 'tp'] | select('in', vars) | list | length == 0"
        fail_msg: >-
          REFUSED RH-TARGET-PREREQ-DERIVED-OUTPUT-PINNED on {{ inventory_hostname }}: {{ ['tr', 'tp'] | select('in', vars)
          | list }} were supplied from outside; they are derived by this leg.
        quiet: true

    - name: Resolve the harness policy on this host (its OWN scope)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

    - name: Carry the controller-decided values to this host and bind the policy (controller-side; no target module)
      ansible.builtin.set_fact:
        tp_ctl: "{{ hostvars['localhost'].tp_ctl }}"
        tp: "{{ rh.controller.bootstrap.target_prereq }}"

    - name: Refuse a split policy, split target inputs, or a hypervisor member without a resolved guest policy
      ansible.builtin.assert:
        that:
          - tp == hostvars['localhost'].tp
          - >-
            ((lme_resolved.remote_harness.binding.deployment.target_inputs | default({}))[inventory_hostname] | default({}))
            == hostvars['localhost'].tp_ti
          - not tp_ctl.hypervisor or (rh.guest is defined and rh.guest.allocation is defined and rh.guest.allocation is mapping)
        fail_msg: >-
          REFUSED {{ tp.refusal }} on {{ inventory_hostname }}: the target scope's target_prereq or bound target inputs
          differ from the controller's, or this hypervisor member has no resolved rh.guest.allocation (RS carrier).
        quiet: true

    # MEASUREMENT-ONLY (R5): privileged initial contact, read-only stat/sha256 of the declared selection, publish tp_orec,
    # STOP -- placed BEFORE (and instead of) the shared preflight, so no setup / service_facts / unit probe runs.
    - name: MEASURE (measurement-only operation; the privileged initial contact, then read-only measurement; publish and stop)
      ansible.builtin.include_tasks: "{{ rh_repo_root ~ tp.observe.measure.path_separator ~ tp.observe.measure.task_rel }}"
      when: tp_ctl.operation == tp.observe.measure.measure_op

    - name: PREFLIGHT (read-only; the ONE declared preflight tasks shared with target_prereq.yml)
      ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/prereq_preflight.yml"
      when: tp_ctl.operation == tp.observe.measure.observe_op

    # OBSERVE-ONLY extras (read-only; only after an admitted privileged contact). Evidence for the lab file's later
    # obs_prior_dirs declaration: each obs_paths entry, every ancestor (root-only path metadata) and its depth-1 entries.
    - name: Start the observe-only extras (contact-free)
      ansible.builtin.set_fact:
        tp_obsx: {obs_paths: null, error: null}
      when: tp_ctl.operation == tp.observe.measure.observe_op

    - name: OBSERVE obs_paths (read-only)
      when: tp_ctl.operation == tp.observe.measure.observe_op and tp_pre.contact == 'admitted'
      block:
        - name: Stat every component of every obs_paths entry (the entry and its ancestors; no link followed)
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false            # R5-IMPLICIT-STAT-HELPERS: otherwise the stat module runs `file` found by PATH
            get_attributes: false      # R5-IMPLICIT-STAT-HELPERS: otherwise the stat module runs `lsattr` found by PATH
          loop: >-
            {%- set ns = namespace(p=[]) -%}
            {%- for full in tp_ctl.obs_paths -%}{%- for i in range(1, (full.split('/') | length) + 1) -%}
            {%- set ns.p = ns.p + ['/' ~ (full.split('/')[1:i] | join('/'))] -%}{%- endfor -%}{%- endfor -%}
            {{ ns.p | unique | list }}
          register: _tp_ob_st

        - name: List each obs_paths entry that is a real directory, depth 1 (metadata only; no content read, no link followed)
          ansible.builtin.find:
            paths: "{{ item.item }}"
            file_type: any
            hidden: "{{ tp.observe.listing.hidden }}"
            recurse: false
            follow: "{{ tp.observe.listing.follow }}"
            get_checksum: false
          loop: "{{ _tp_ob_st.results | selectattr('item', 'in', tp_ctl.obs_paths) | list }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.stat.exists and item.stat.isdir and not item.stat.islnk
          register: _tp_ob_ls

        - name: Compose the obs_paths evidence (derived output)
          ansible.builtin.set_fact:
            tp_obsx: >-
              {%- set st = namespace(m={}) -%}
              {%- for r in _tp_ob_st.results -%}
              {%- set s = r.stat -%}
              {%- set st.m = st.m | combine({r.item: {'exists': s.exists,
                    'type': none if not s.exists else ('link' if s.islnk else ('dir' if s.isdir else ('file' if s.isreg else 'other'))),
                    'uid': s.uid | default(none), 'gid': s.gid | default(none), 'owner': s.pw_name | default(none),
                    'group': s.gr_name | default(none), 'mode': s.mode | default(none)}}) -%}
              {%- endfor -%}
              {%- set out = namespace(m={}) -%}
              {%- for e in tp_ctl.obs_paths -%}
              {%- set ch = namespace(m={}) -%}
              {%- for i in range(1, (e.split('/') | length) + 1) -%}
              {%- set p = '/' ~ (e.split('/')[1:i] | join('/')) -%}
              {%- set ch.m = ch.m | combine({p: st.m[p]}) -%}
              {%- endfor -%}
              {%- set fr = _tp_ob_ls.results | selectattr('item.item', 'equalto', e) | list -%}
              {%- set files = (fr | first).files if (fr | length > 0 and (fr | first).files is defined) else none -%}
              {%- set ls = namespace(m={}) -%}
              {%- for f in (files or []) | sort(attribute='path') -%}
              {%- set ls.m = ls.m | combine({f.path: {
                    'type': 'link' if f.islnk | default(false) else ('dir' if f.isdir | default(false) else ('file' if f.isreg | default(false) else 'other')),
                    'uid': f.uid | default(none), 'gid': f.gid | default(none), 'owner': f.pw_name | default(none),
                    'group': f.gr_name | default(none), 'mode': f.mode | default(none)}}) -%}
              {%- endfor -%}
              {%- set out.m = out.m | combine({e: {'chain': ch.m, 'listing': (ls.m if files is not none else none),
                    'listing_depth': tp.observe.listing.depth,
                    'listing_skipped': ((fr | first).skipped_paths | default({})) if fr | length > 0 else 'not a real directory or absent'}}) -%}
              {%- endfor -%}
              {{ {'obs_paths': out.m, 'error': none} }}
      rescue:
        - name: Record the failed obs_paths observation (the record play still writes it)
          ansible.builtin.set_fact:
            tp_obsx:
              obs_paths: null
              error: >-
                {{ 'observation stopped at "' ~ (ansible_failed_task.name | default('?')) ~ '": '
                   ~ (ansible_failed_result.msg | default('') | string)[:2000] }}

    - name: Publish the observation record (derived output; ALSO when the contact or an observation failed)
      when: tp_ctl.operation == tp.observe.measure.observe_op
      ansible.builtin.set_fact:
        tp_orec:
          schema: "{{ tp.observe.record_schema }}"
          target: "{{ inventory_hostname }}"
          label: "{{ lme_transfer_label }}"
          scope: "{{ tp_pre.scope }}"
          contact: "{{ tp_pre.contact }}"
          declared:
            preservation: "{{ tp_ctl.preservation }}"
            obs_paths: "{{ tp_ctl.obs_paths }}"
          preflight: "{{ tp_pre }}"
          preservation: "{{ tp_pre.preservation | default(none) }}"
          obs_paths: "{{ tp_obsx.obs_paths }}"
          obs_paths_error: "{{ tp_obsx.error }}"
          # what target_prereq.yml would refuse (collected; NOT enforced by this leg)
          findings: "{{ tp_pre.refusals }}"
          claim: >-
            read-only privileged observation; no unit was started, stopped, enabled, disabled or masked and no
            deployment-state mutation was intended on the target (ordinary admitted Ansible module staging under the
            root module temp occurred). Observation grants no ownership or retirement authority. This record, not the
            exit code, is the result: rc 0 can include observation errors (preflight.refusals, obs_paths_error) and
            findings. Coverage: discovery sees system .service units only (no timer / socket / path / user units);
            expectations and absence are decided by the exact-unit probe, whose errors are retained as probe_unknown
            findings; UnitFileState generated is admitted despite possible autostart.

- name: observe-record
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Re-admit the state directory ancestry at the write boundary (owner rule; the controller is non-root)
      ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_ancestry.yml"
      vars:
        rh_anc_bs: "{{ rh.controller.bootstrap }}"
        rh_anc_repo_root: "{{ rh_repo_root }}"
        rh_anc_path: "{{ lme_transfer_state_dir }}"
        rh_anc_refusal: "{{ tp.refusal }}"

    - name: Record the observation for MAIN, ALSO when it failed (<state dir>/<prefix><label><observe.record_suffix>)
      ansible.builtin.copy:
        content: "{{ hostvars[lme_transfer_target].tp_orec | to_nice_json }}\n"
        dest: "{{ tp_ctl.record_path }}"
        mode: '0600'
        follow: false

    - name: Refuse ONLY when the privileged contact was not admitted (recorded above; no deployment-state mutation intended)
      when: tp_ctl.operation == tp.observe.measure.observe_op
      ansible.builtin.assert:
        that:
          - hostvars[lme_transfer_target].tp_orec.contact == 'admitted'
        fail_msg: >-
          REFUSED {{ tp.refusal }}-OBSERVE on {{ lme_transfer_target }}: the privileged contact was not admitted
          ({{ hostvars[lme_transfer_target].tp_orec.findings }}; record {{ tp_ctl.record_path }}). No deployment state
          was changed (admitted module staging only, if any module ran).
        quiet: true

    # MEASUREMENT-ONLY rc (codex-tick396 decision): rc 0 = an admitted contact AND a completed DIAGNOSTIC measurement,
    # including missing-digest findings (evidence.required_complete may be false). Neither rc 0 nor required_complete
    # proves trust, complete custody, execution readiness or adoption (tp.observe.measure.texts.complete / .evidence).
    - name: Refuse a measurement whose contact was not admitted or that did not complete (recorded above)
      when: tp_ctl.operation == tp.observe.measure.measure_op
      vars:
        _tp_ms_r: "{{ hostvars[lme_transfer_target].tp_orec }}"
        _tp_ms_f: "{{ tp.observe.measure.record.fields }}"
        _tp_ms_ad: "{{ _tp_ms_r[_tp_ms_f.contact] == tp.observe.measure.record.contact_states.admitted }}"
      ansible.builtin.assert:
        that:
          - _tp_ms_ad | bool
          - _tp_ms_r[_tp_ms_f.complete] is sameas tp.observe.measure.record.completion.done
        fail_msg: >-
          REFUSED {{ tp.observe.measure.refusal }} {{ lme_transfer_target }}:
          {{ tp.observe.measure.texts.incomplete if _tp_ms_ad | bool else tp.observe.measure.texts.contact }}
          {{ {_tp_ms_f.refusals: _tp_ms_r[_tp_ms_f.refusals], _tp_ms_f.error: _tp_ms_r[_tp_ms_f.error]} | to_json }}
          {{ tp_ctl.record_path }}
        quiet: true
