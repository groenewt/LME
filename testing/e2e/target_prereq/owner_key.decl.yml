---
# testing/e2e/target_prereq/owner_key.decl.yml -- J-KEY: the owner_key_generation PRODUCER (codex-graph-critical-path-
# key-and-profile-20260925; B-owned). DATA ONLY. This file is the SOURCE C1 registers as the resolved node
# rh.controller.bootstrap.owner_key (proposal .scratchpad-14bbf94b/B/c1-jkey-proposal.yml). The leg (owner_key.yml)
# reads ONLY the resolved node and refuses JKEY-UNREGISTERED when it is absent or not revision 1: it never reads this
# file as policy (the entry reads it only to prove the resolved node equals it, like target_prereq.decl.yml).
#
# What the leg produces, per (deployment, target, owner):
#   <W>/<work_roots.sub_roots[storage.sub_root]>/<storage.keys_rel>/<deployment>/<target>/<owner>/<storage.key_name>
#   and the same path ~ storage.pub_suffix (rendered ONLY by templates/owner_key_location.j2)
# W = the controller work root (work_roots.anchor repository_checkout: <checkout>/<work_roots.root_rel>), derived TWO
# ways and refused unless equal: rh_repo_root ~ '/' ~ root_rel, and the seed's rule (the prefix of the managed
# toolchain root rh_owned_root through its LAST '/<root_rel>/'). <deployment> = jk_deployment_identity = lme_resolved |
# lme_validated_deployment_identity (the loader's own filter over the same resolved input as load_manifests.yml:568-569;
# unset -> JKEY-INPUT). <target> = lme_transfer_target, a PATH
# COMPONENT only (never a decision). <owner> = the bound target input owner. The bound target inputs owner_key /
# owner_pubkey (target_inputs roles; the target_prereq consumer reads them) MUST equal the derived paths, otherwise
# JKEY-LOCATION: an inventory value that disagrees with the owned location refuses instead of being silently used, and
# a profile override of work_roots / storage moves both the derivation and (through the inventory) the inputs.
owner_key:
  revision: 1
  runner: controller_non_root         # never root, never become, never SSH; localhost, connection local
  refusal: JKEY
  tool_consumer: owner_key_generation # the os_tools required_by label (controller partition); EXACTLY one entry
  key_type: ed25519
  # the ed25519 branch of the consumer's tp.authorized_keys.pubkey_regex (target_prereq.decl.yml:70), never looser;
  # comment_template renders printable ASCII only, so the consumer admits the produced line
  pubkey_regex: '^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( [ -~]*)?$'
  name_regex: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'   # storage.sub_root VALUE, keys_rel, key_name, record_name: one segment
  # DECLARED PROPERTY (MAIN relay 20260925): the automated owner key is UNENCRYPTED. It is generated with -N '' (the
  # controller runs non-interactively) and the pair check reads it with -P '' (ssh-keygen -y). Its protection is
  # custody: the 0700 chain + 0600 file owned by the non-root controller on its own work root. An encrypted key at
  # the owned location fails the pair check (JKEY-PAIR) and is preserved, never re-encrypted or replaced. A passphrase-
  # protected owner key is a different declared mode (a new revision), never an implicit variant of this one.
  passphrase: none
  encryption: unencrypted_by_declaration
  # The argv the declared mode drives (codex-tick350 C3): consumed by tasks/generate.yml (-N) and tasks/readback.yml
  # (-P); the leg never embeds a passphrase literal. Keyed by `encryption` so a new declared mode is a new entry (and a
  # new revision), never an edit of the task argv. Security constraints (uid 0 refusal, custody, no_log) are NOT here:
  # they are fixed in the leg and independent of topology or naming.
  passphrase_argv:
    unencrypted_by_declaration:
      generate: ['-N', '']
      pair_check: ['-P', '']
  comment_template: 'lme-owner:{deployment}:{target}:{owner}:g{generation}'
  generation: 1                       # bump (declared, C1) to demand a generation change: a PENDING obligation, never
                                      # an in-place replacement
  storage:
    sub_root: credentials             # a key of work_roots.sub_roots (C1 proposal adds credentials: credentials)
    keys_rel: owner-keys
    key_name: id_ed25519
    pub_suffix: .pub                  # the public half: <key><pub_suffix>; the ONE naming source (location rule
                                      # templates/owner_key_location.j2, the leg, the run-binding macros)
    next_suffix: .next               # the pending replacement pair: <key>.next / <key>.next.pub
    record_name: owner_key.record.json
    dir_mode: '0700'
    file_mode: '0600'                 # private key and record
    pub_modes: ['0644', '0600']       # ssh-keygen writes the .pub per umask; both are admitted, nothing is chmod'ed
    target_regex: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
    owner_regex: '^[a-z_][a-z0-9_-]{0,31}$'
  # lme_owner_key_op; ensure = fresh or unchanged-reapply; rotate = pending replacement; locate = READ-ONLY: print the
  # owned location (the exact owner_key / owner_pubkey values MAIN declares in the run binding) and stop before any
  # write (the owner_key / owner_pubkey inputs are then not required, only the owner)
  ops: [ensure, rotate, locate]
  record_schema: lme-owner-key-record/1
  record_states: [started, done]
  obligations:
    kinds: [rotation, generation_change]
    steps: [admit_replacement, prove_access, retire_prior]
    # NEVER cleared by this leg: the owner-side rotate leg (target_prereq.decl.yml J-KEY rotate: over the CURRENT key)
    # admits the replacement, proves access with it and retires the prior; only that leg closes an obligation.
    closed_by: owner_rotate_leg
    # OLD RECOVERY MATERIAL (codex-tick341 J-KEY clarification): the CURRENT pair (<key>, <key>.pub) is the recovery
    # material while an obligation is pending. This leg never moves, overwrites, deletes or chmods it; a reapply keeps
    # it and keeps reporting the obligation. RETIREMENT CONDITION (all three, recorded by the owner rotate leg in THIS
    # record's obligation, never inferred): (1) admit_replacement: the .next public line is installed in the target
    # owner's authorized_keys (readback digest recorded); (2) prove_access: a fresh owner-profile connection
    # authenticated ONLY with the .next key succeeded on the target (receipt recorded with its fingerprint);
    # (3) retire_prior: the prior public line is removed from authorized_keys and the removal read back. Only after
    # (3) may the prior pair be removed and the .next pair promoted to the declared name, by that leg.
    retirement_condition: [admit_replacement_readback, prove_access_next_only, retire_prior_readback]
  never_rotated: [privileged_bootstrap_key]
  # readback (every run, also the no-op; codex-tick341): a fingerprint alone does NOT prove the pair. Adoption needs
  # BOTH the declared custody (regular file, not a link, owned by the running uid, declared mode, 0700 parent chain)
  # AND tool-verified pair correspondence: the admitted ssh-keygen may read the private key internally
  # (ssh-keygen -y -f <key>) and the DERIVED public line (type + base64) must equal the .pub line; then the .pub
  # fingerprint (ssh-keygen -l -E sha256 -f <pub>) must equal the record's. Private bytes are never slurped, registered
  # or written to logs / receipts (every tool call touching the private key is no_log; every stat of a private file
  # sets get_checksum / get_mime / get_attributes false).
  readback: {fingerprint_hash: sha256, compare_fields: 2}
  pub_digest: 'sha256 of the TRIMMED one-line public key (the same digest target_prereq tp_ctl.pubkey_sha256 computes)'
  entry_guard:
    derived: [jk, jk_dir]
    family: reserved_owner_key_vars   # '^_?jk_[A-Za-z0-9_]+$' (C1 proposal); the bare name jk is refused inline
  cases_rel: testing/e2e/target_prereq/controls/CASES.yml
  # THE location rule (codex-tick350 GRAPH-BINDING-TEMPLATE-TOPOLOGY): the ONE value-pure template that renders
  # {work_root, chain, keydir, key, pub, next, next_pub, record} from (bootstrap, repo root, deployment, target, owner).
  # The producer (tasks/bind_controller.yml) and the run-binding macros (ansible/inventory/macros/run_binding.j2)
  # both render THIS file (repo-relative) by lookup; neither re-encodes the naming.
  location_rule_rel: testing/e2e/target_prereq/templates/owner_key_location.j2
  # RUN ORDER (codex-tick356 (b); declared, argv in c1-jkey-proposal main_invocation). The producer runs AFTER the
  # controller package/apply (its tool is admitted by the controller receipt; resolve_harness verifies it) and the run
  # binding render (its owner / target inputs and the derived owner_key / owner_pubkey paths come from that binding),
  # and BEFORE every consumer of its output: target_prereq.yml reads the owner .pub in its FIRST play, pre-contact
  # (prereq-controller, before prereq-preflight), and installs it (authorized_key); target_bootstrap.yml connects with
  # the owner key (connection_profiles.owner.key_var). A consumer run before it refuses (absent .pub), never waits.
  run_order:
    after: [controller_package_apply, run_binding_render]
    before: [target_prereq, target_bootstrap]
