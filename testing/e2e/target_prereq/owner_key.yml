---
# testing/e2e/target_prereq/owner_key.yml -- ENTRY: J-KEY, the owner_key_generation PRODUCER (B-owned;
# codex-graph-critical-path-key-and-profile-20260925, codex-tick341 contract clarification). AUTHORED, NEVER EXECUTED;
# inert until C1 registers rh.controller.bootstrap.owner_key (revision 1), the reserved_owner_key_vars family, the
# work_roots credentials sub-root and the os_tools owner_key_generation tool (.scratchpad-14bbf94b/B/c1-jkey-proposal.yml).
# Started by MAIN through the route's seed launcher as the NON-ROOT controller owner, BEFORE target_prereq.yml (whose
# authorized_key op installs the public half this leg produces):
#   <bundle>/lme-seed-launch.sh run <controller root> explicit_key -i <run inventory dir> \
#     testing/e2e/target_prereq/owner_key.yml -e lme_transfer_target=<alias> -e lme_owner_key_op=ensure
# (the launcher's SSH auth mode is unused: this leg contacts no host). ONE play, localhost, connection local, no become,
# no SSH, no target contact. Policy ONLY from the resolved rh.controller.bootstrap.owner_key (owner_key.decl.yml is its
# source); values ONLY from the loader binding (binding.deployment.target_inputs.<target>) and
# jk_deployment_identity (lme_resolved | lme_validated_deployment_identity; tasks/bind_controller.yml). The generator is EXACTLY the os_tools entry whose required_by names
# owner_key_generation, admitted by path + sha256 identity before use; not admitted -> refuse (no install, no fallback).
# Private-key bytes are never slurped, registered, printed or written to the record (no_log on every tool call that
# reads the private key; no checksum/mime/attribute stat of a private file).
# Tasks (in order): entry guard -> tasks/bind_controller.yml (policy, non-root, tool, inputs, owned location) ->
# tasks/admit_location.yml (0700 chain, custody, ancestry) -> tasks/observe_key.yml (custody + record + classify) ->
# tasks/current.yml (fresh / resume / adopt / unchanged + pair readback) -> tasks/pending.yml (rotation /
# generation-change obligation; the current pair is never touched) -> report.
- name: jkey-controller
  hosts: localhost
  connection: local
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Refuse pre-supplied harness outputs and derive the repository root (route author; first task)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname | dirname | dirname }}/testing/remote_harness/tasks/refuse_pinned_outputs.yml"

    - name: Refuse pre-supplied names of a reserved family (B family guard; second task, first entry)
      ansible.builtin.include_tasks: "{{ playbook_dir | dirname }}/transfer/tasks/refuse_reserved_families.yml"

    - name: Derive the leg directory (entry guard; never a play var or an input)
      ansible.builtin.set_fact:
        jk_dir: "{{ playbook_dir }}"

    - name: Refuse a pinned leg directory, a supplied bare derived name, or an unregistered J-KEY family (entry guard)
      ansible.builtin.assert:
        that:
          - jk_dir == playbook_dir
          - "'jk' not in vars"
          - >-
            'reserved_owner_key_vars' in ((lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml)
            .lme_config_registry.remote_harness_schema.reserved_output_patterns | default([]))
        fail_msg: >-
          JKEY-DERIVED-OUTPUT-PINNED (or RESERVED-FAMILY-REGISTRY: reserved_owner_key_vars not registered yet):
          jk_dir or the bare name jk was supplied from outside the entry (extra-var / inventory); they are derived
          here, never inputs.
        quiet: true

    - name: Bind the resolved policy, the non-root controller, the admitted tool, the inputs and the owned location
      ansible.builtin.include_tasks: "{{ jk_dir }}/tasks/bind_controller.yml"

    - name: Report the owned location (every op; locate stops here, before any write)
      ansible.builtin.debug:
        msg: >-
          JKEY-LOCATION target={{ jk_ctl.target }} owner={{ jk_ctl.owner }} deployment={{ jk_ctl.deployment }}
          owner_key={{ jk_ctl.key }} owner_pubkey={{ jk_ctl.pub }} tool={{ jk_tool.name }}:{{ jk_tool.path }}

    - name: Stop the read-only locate op (nothing created, nothing read beyond policy and tool identity)
      ansible.builtin.meta: end_host
      when: lme_owner_key_op == 'locate'

    - name: Admit (and create only where absent) the owned 0700 key directory chain
      ansible.builtin.include_tasks: "{{ jk_dir }}/tasks/admit_location.yml"

    - name: Observe the key files and the record (custody only; no private byte read) and classify
      ansible.builtin.include_tasks: "{{ jk_dir }}/tasks/observe_key.yml"

    - name: The CURRENT pair (fresh generation, journal resume, adoption or unchanged reapply) + pair readback
      ansible.builtin.include_tasks: "{{ jk_dir }}/tasks/current.yml"

    - name: The PENDING replacement (explicit rotation / generation change) -- obligations kept, current pair untouched
      ansible.builtin.include_tasks: "{{ jk_dir }}/tasks/pending.yml"

    - name: Publish the producer outputs (paths + public digests only; derived output)
      ansible.builtin.set_fact:
        jk_out:
          target: "{{ jk_ctl.target }}"
          owner_key: "{{ jk_ctl.key }}"
          owner_pubkey: "{{ jk_ctl.pub }}"
          fingerprint_sha256: "{{ jk_record.fingerprint_sha256 }}"
          pub_sha256: "{{ jk_record.pub_sha256 }}"
          generation: "{{ jk_record.generation }}"
          open_obligations: "{{ jk_record.obligations | rejectattr('state', 'equalto', 'closed') | list }}"
          changed: "{{ jk_changed }}"

    - name: Report (public material only)
      ansible.builtin.debug:
        msg: >-
          JKEY {{ 'CHANGED' if jk_out.changed else 'NOOP' }} target={{ jk_out.target }} owner_key={{ jk_out.owner_key }}
          owner_pubkey={{ jk_out.owner_pubkey }} {{ jk_out.fingerprint_sha256 }} generation={{ jk_out.generation }}
          open_obligations={{ jk_out.open_obligations | map(attribute='kind') | list }}
