---
# testing/e2e/target_prereq/tasks/measure_target_tools.yml -- the MEASUREMENT-ONLY operation of prereq_observe.yml
# (B-owned; codex-r2-r4-r5-bootstrap-decisions-20261006 R5; r5c: codex-tick393 + codex-tick394; r5d: codex-tick396).
# AUTHORED, NEVER EXECUTED; inert until C1 registers rh.controller.bootstrap.target_prereq.observe.measure (B r5d C1
# hunks). Included ONLY by prereq_observe.yml play observe-preflight (by the declared tp.observe.measure.task_rel), when
# tp_ctl.operation == tp.observe.measure.measure_op, AFTER that play's first-entry guards, resolve, policy/target-input
# split check and hypervisor allocation check, and INSTEAD OF the shared preflight (tasks/prereq_preflight.yml is NOT
# included in this operation: no setup facts, no service_facts, no unit probe, no obs_paths extras).
# EVERY record value, key, status word and text is built by the macros of the declared tp.observe.measure.import_rel
# from the declaration tp.observe.measure (record.fields / unset / initial / completion / types / contact_states /
# findings / top / cleared_on_failure, path_separator, texts), rendered through the ONE dispatcher at
# tp.observe.measure.call_rel and selected by a declared tp.observe.measure.macros value; the initial-contact include
# is the declared tp.reuse.contact_rel with tp.reuse.contact_variant and tp.observe.measure.contact_paths. This file
# only orders the steps and passes declared values and module results. Order:
#   1. pre-contact: the selection = the SAME label closure as the selected operation (target_prereq.yml's tool hash):
#      os_tools entries whose required_by meets tp.observation.required_by, plus tp.observation.hypervisor_required_by
#      ONLY when this host's QEMU work is declared (hypervisors role-group member AND a resolved target-scope
#      rh.guest.allocation mapping). A non-hypervisor never selects a guest-only tool; a multi-label tool records only
#      the labels that selected it. Refuse a selection that lost a required tool (tp.preservation.probe.tool,
#      tp.linger.tool). An absent / not-regular / checksum-missing / differing selected tool is a FINDING, never a refusal.
#   2. the PRIVILEGED INITIAL CONTACT (route's shared initial_contact.yml, variant privileged, no caller paths) --
#      unchanged admission. A refusal there is RECORDED (refusals) and never yields a measurement or a candidate:
#      measurement does not establish its own initial trust.
#   3. read-only MEASUREMENT with ansible.builtin.stat only (get_mime / get_attributes false: the stat module would
#      otherwise run `file` / `lsattr` found by PATH; this step executes no selected tool): lstat of each declared path,
#      the sha256 of the resolved regular file, the lstat of every ancestor of the declared and resolved paths. Tools the
#      privileged initial contact itself executed (its admitted, digest-checked initial_contact.privileged.tools) carry
#      executed_by_contact. CUSTODY LIMIT (recorded as texts.custody): declared leaf, final resolved file and the
#      ancestors of those two endpoints -- NOT each intermediate symlink hop; every candidate stays untrusted.
#      The stat flags below are module-invocation SAFETY constants (R5-IMPLICIT-STAT-HELPERS), deliberately not tunable.
#   4. publish tp_orec and STOP (the caller's record play writes it; no further target task runs in this operation).
#      complete = the measurement step ran to the publish (texts.complete); evidence = required-evidence completeness
#      (texts.evidence). Neither rc 0, complete nor evidence.required_complete proves trust, complete custody,
#      execution readiness or adoption; a null sha256 is never a usable measurement.
# Inputs: tp, tp_ctl (operation, hypervisor, record_path), rh (this host's resolve), lme_resolved, lme_transfer_label,
# rh_repo_root. NOT inputs (codex-tick393 item 3): owner / layout / obs_paths / preservation basis or selectors /
# observe.required_roles -- the measurement depends only on the target binding, the hypervisor allocation check and the
# privileged initial contact.
# Output: tp_orec (the measurement record body). Derived names: _tp_ms* (reserved_prereq_vars family); template vars
# tp_ms_import / tp_ms_macro / tp_ms_args (same family).
# Never: execution of a selected tool by this file's measurement step, a write outside the admitted root module temp,
# adoption of an observed digest, or a claim of host projection / adoption (the host-scoped override join, C1 r3f, is
# required before any adoption; this record carries a CANDIDATE only).

- name: MEASUREMENT-ONLY operation (declared values; macros through the one dispatcher)
  vars:
    _tp_ms: "{{ tp.observe.measure }}"
    _tp_ms_f: "{{ tp.observe.measure.record.fields }}"
    _tp_ms_mc: "{{ tp.observe.measure.macros }}"
    _tp_ms_call: "{{ rh_repo_root ~ tp.observe.measure.path_separator ~ tp.observe.measure.call_rel }}"
    _tp_ms_imp: "{{ tp.observe.measure.import_rel }}"
  block:
    - name: Start the measurement record (contact-free; written by the caller's record play even if everything below fails)
      ansible.builtin.set_fact:
        tp_orec: >-
          {{ lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
               'tp_ms_macro': _tp_ms_mc.start,
               'tp_ms_args': [_tp_ms, tp_ctl, inventory_hostname, lme_transfer_label, lme_resolved.remote_harness]}) | from_json }}

    - name: Derive the measurement selection from the resolved target-scope declarations (controller-side; pre-contact)
      ansible.builtin.set_fact:
        _tp_ms_sel: >-
          {{ lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
               'tp_ms_macro': _tp_ms_mc.selection, 'tp_ms_args': [_tp_ms, tp, rh, tp_ctl]}) | from_json }}

    - name: Refuse a selection that lost a required tool or names an unadmitted path (controller-side; nothing contacted)
      vars:
        _tp_ms_t: "{{ _tp_ms_sel[_tp_ms_f.tools] }}"
        _tp_ms_rx: "{{ rh.controller.bootstrap.path_admission.regex }}"
      ansible.builtin.assert:
        that:
          - _tp_ms_t | length > 0
          - tp.preservation.probe.tool in _tp_ms_t
          - tp.linger.tool in _tp_ms_t
          - _tp_ms_t | dict2items | map(attribute='value') | map(attribute=_tp_ms_f.path) | reject('match', _tp_ms_rx) | list | length == 0
          - _tp_ms_t | dict2items | map(attribute='value') | map(attribute=_tp_ms_f.identity) | map(attribute=_tp_ms_f.kind) | reject('string') | list | length == 0
        fail_msg: >-
          REFUSED {{ _tp_ms.refusal }} {{ inventory_hostname }}: {{ _tp_ms.texts.selection }}
          {{ {_tp_ms_f.labels: _tp_ms_sel[_tp_ms_f.labels], _tp_ms_f.selected: _tp_ms_t | list,
              _tp_ms_f.required: [tp.preservation.probe.tool, tp.linger.tool]} | to_json }} {{ _tp_ms.texts.pre_contact }}
        quiet: true

    - name: Record the declared selection and the acceptance expectation (derived before activation)
      ansible.builtin.set_fact:
        tp_orec: >-
          {{ tp_orec | combine(lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
               'tp_ms_macro': _tp_ms_mc.expectation, 'tp_ms_args': [_tp_ms, tp, _tp_ms_sel]}) | from_json) }}

    - name: MEASURE (read-only; publish and stop)
      block:
        - name: PRIVILEGED INITIAL CONTACT (route author; raw only; principal, interpreter, tools) -- no caller paths
          ansible.builtin.include_tasks: "{{ rh_repo_root ~ tp.observe.measure.path_separator ~ tp.reuse.contact_rel }}"
          vars:
            rh_ic_variant: "{{ tp.reuse.contact_variant }}"
            rh_ic_paths: "{{ tp.observe.measure.contact_paths }}"

        - name: Record the admitted contact (principal, interpreter, the contact tools' custody evidence)
          ansible.builtin.set_fact:
            tp_orec: >-
              {{ tp_orec | combine(lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
                   'tp_ms_macro': _tp_ms_mc.admitted,
                   'tp_ms_args': [_tp_ms, _rh_tb_ic_uid, _rh_tb_ic_uname, _rh_tb_ic_py, ansible_remote_tmp, _rh_tb_ic_tools]})
                 | from_json) }}

        - name: LSTAT each selected tool by its declared path (no link followed, no checksum; the tool is not executed)
          ansible.builtin.stat:
            path: "{{ item.value[_tp_ms_f.path] }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: "{{ _tp_ms_sel[_tp_ms_f.tools] | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          register: _tp_ms_lst

        - name: Digest the resolved file of each present tool (content read only; the tool is not executed)
          ansible.builtin.stat:
            path: "{{ item.stat.lnk_source if item.stat.islnk else item.item.value[_tp_ms_f.path] }}"
            follow: false
            get_checksum: true
            checksum_algorithm: "{{ _tp_ms.checksum_algorithm }}"
            get_mime: false
            get_attributes: false
          loop: "{{ _tp_ms_lst.results | selectattr('stat.exists') | list }}"
          loop_control:
            label: "{{ item.item.key }}"
          register: _tp_ms_res

        - name: LSTAT every ancestor of every declared and resolved tool path (custody chain endpoints; no link followed)
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: >-
            {{ lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
                 'tp_ms_macro': _tp_ms_mc.ancestors, 'tp_ms_args': [_tp_ms, _tp_ms_lst.results]}) | from_json }}
          register: _tp_ms_chain

        - name: Compose and publish the measurement record (CANDIDATE override never applied) -- the operation STOPS here
          ansible.builtin.set_fact:
            tp_orec: >-
              {{ tp_orec | combine(lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
                   'tp_ms_macro': _tp_ms_mc.compose,
                   'tp_ms_args': [_tp_ms, tp, rh, _tp_ms_sel, _tp_ms_lst.results, _tp_ms_res.results, _tp_ms_chain.results]})
                 | from_json) }}

      rescue:
        - name: Record the refused contact or the failed measurement (the caller's record play still writes it; no candidate)
          ansible.builtin.set_fact:
            tp_orec: >-
              {{ tp_orec | combine(lookup('ansible.builtin.template', _tp_ms_call, template_vars={'tp_ms_import': _tp_ms_imp,
                   'tp_ms_macro': _tp_ms_mc.failed,
                   'tp_ms_args': [_tp_ms, tp_orec, ansible_failed_task.name, ansible_failed_result]}) | from_json) }}
