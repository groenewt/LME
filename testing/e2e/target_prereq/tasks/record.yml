---
# testing/e2e/target_prereq/tasks/record.yml -- write the producer record (localhost; non-root). The record holds ONLY
# paths, public digests, the journal state and the obligations; never a key byte. Written through the copy module
# (temporary file in the SAME 0700 directory, then rename; the record path was admitted as absent or an owned 0600
# regular non-link file by observe_key.yml), then read back.
# Input (include var, no default): _jk_rec_new (the complete record mapping). Output: jk_record.

- name: Refuse an incomplete record before writing it
  ansible.builtin.assert:
    that:
      - _jk_rec_new is mapping
      - >-
        ['schema', 'revision', 'deployment', 'target', 'owner', 'key_type', 'key_path', 'pub_path', 'generation',
         'origin', 'state', 'fingerprint_sha256', 'pub_sha256', 'obligations'] | reject('in', _jk_rec_new) | list | length == 0
      - _jk_rec_new.state in jk.record_states
      - "'PRIVATE KEY' not in (_jk_rec_new | to_json)"
    fail_msg: "REFUSED JKEY-RECORD: the record to write is incomplete ({{ _jk_rec_new | list }})."
    quiet: true

- name: Write the record (0600; no private material)
  ansible.builtin.copy:
    content: "{{ _jk_rec_new | to_nice_json(sort_keys=true) }}\n"
    dest: "{{ jk_ctl.record }}"
    mode: "{{ jk.storage.file_mode }}"
    follow: false
  register: _jk_rec_w

- name: Read the record back
  ansible.builtin.slurp:
    src: "{{ jk_ctl.record }}"
  register: _jk_rec_rb

- name: Refuse a record that did not read back as written
  ansible.builtin.assert:
    that:
      - (_jk_rec_rb.content | b64decode | from_json) == _jk_rec_new
    fail_msg: "REFUSED JKEY-RECORD: {{ jk_ctl.record }} did not read back as written."
    quiet: true

- name: Publish the record (derived output)
  ansible.builtin.set_fact:
    jk_record: "{{ _jk_rec_new }}"
    jk_changed: "{{ jk_changed or _jk_rec_w.changed }}"
