# testing/e2e/target_prereq/entry_bodies/prereq_observe/observe-record.yml -- the authored BODY of play observe-record
# of the GENERATED entry testing/e2e/target_prereq/prereq_observe.yml (B-owned body; B-r5 r5m extraction, codex-tick417
# option B). A later controller play: its metadata is constructed and it carries no head; this file holds its tasks,
# byte-identical to B-r5/r5f-prereq_observe.after.yml (sha256
# 934c14eda2d32663da9652f740d2c86902143fe61425a2e73e6e66c62da42657) :450-494 de-indented by 4.
#
- name: Re-admit the state directory ancestry at the write boundary (owner rule; the controller is non-root)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/admit_ancestry.yml"
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ lme_transfer_state_dir }}"
    rh_anc_refusal: "{{ tp.refusal }}"

- name: Record the observation for MAIN, ALSO when it failed (<state dir>/<prefix><label><observe.record_suffix>)
  ansible.builtin.copy:
    content: "{{ hostvars[lme_transfer_target].tp_orec | to_nice_json }}\n"
    dest: "{{ tp_ctl.record_path }}"
    mode: '0600'
    follow: false

- name: Refuse ONLY when the privileged contact was not admitted (recorded above; no deployment-state mutation intended)
  when: tp_ctl.operation == tp.observe.measure.observe_op
  ansible.builtin.assert:
    that:
      - hostvars[lme_transfer_target].tp_orec.contact == 'admitted'
    fail_msg: >-
      REFUSED {{ tp.refusal }}-OBSERVE on {{ lme_transfer_target }}: the privileged contact was not admitted
      ({{ hostvars[lme_transfer_target].tp_orec.findings }}; record {{ tp_ctl.record_path }}). No deployment state
      was changed (admitted module staging only, if any module ran).
    quiet: true

# MEASUREMENT-ONLY rc (codex-tick396 decision): rc 0 = an admitted contact AND a completed DIAGNOSTIC measurement,
# including missing-digest findings (evidence.required_complete may be false). Neither rc 0 nor required_complete
# proves trust, complete custody, execution readiness or adoption (tp.observe.measure.texts.complete / .evidence).
- name: Refuse a measurement whose contact was not admitted or that did not complete (recorded above)
  when: tp_ctl.operation == tp.observe.measure.measure_op
  vars:
    _tp_ms_r: "{{ hostvars[lme_transfer_target].tp_orec }}"
    _tp_ms_f: "{{ tp.observe.measure.record.fields }}"
    _tp_ms_ad: "{{ _tp_ms_r[_tp_ms_f.contact] == tp.observe.measure.record.contact_states.admitted }}"
  ansible.builtin.assert:
    that:
      - _tp_ms_ad | bool
      - _tp_ms_r[_tp_ms_f.complete] is sameas tp.observe.measure.record.completion.done
    fail_msg: >-
      REFUSED {{ tp.observe.measure.refusal }} {{ lme_transfer_target }}:
      {{ tp.observe.measure.texts.incomplete if _tp_ms_ad | bool else tp.observe.measure.texts.contact }}
      {{ {_tp_ms_f.refusals: _tp_ms_r[_tp_ms_f.refusals], _tp_ms_f.error: _tp_ms_r[_tp_ms_f.error]} | to_json }}
      {{ tp_ctl.record_path }}
    quiet: true
