# testing/remote_harness/registry_ingress.decl.yml -- the pre-parse registry ingress declaration (codex-tick755
# OPEN-S17-REG-EXPECTED-ID). Read by templates/registry_ingress.j2 BEFORE the registry is parsed. It is not the
# registry and grants nothing by itself: the expected identity is the externally admitted invocation value (CO-V-PRE-02
# admitted-A, bound to the reviewed edition, the registry rel and the retained artifact) carried by exactly one transport
# below. After the parse, admit_loader_source binds these names to the admitted ABI declarations (cold_inputs.required,
# bootstrap_input.var / record_keys, root_input.keys, genesis.launch.cli.args, path_law.separator, digest_algorithm).
# records-c1-framework-27 (codex-tick821 REP-D1): the same post-parse binding covers the companions below (their vars
# to the admitted run_local.pinned_vars).
entry_rel: testing/remote_harness/templates/registry_ingress.j2
macros_rel: testing/remote_harness/templates/macros/registry_ingress.j2
macro: registry_ingress
separator: /
registry_rel: manifests/global.yml
registry_root: [lme_config_registry, remote_harness_schema]
protected_lists: [reserved_outputs, resolver_outputs]
protected_extra: [rh_repo_root]
slice: contract_admission
digest: {algorithm: sha256, regex: '\A[0-9a-f]{64}\Z'}
# capture admission: the registry file is read ONCE as plaintext UTF-8 with both strips off. A captured text holding
# a surrogate escape (the fallback of the file loader for undecodable bytes) is refused before the digest. The regex
# is bound after the parse to the admitted body_domain.undecodable_regex.
capture: {undecodable_regex: '[\udc80-\udcff]'}
# DK03 contract reconciliation (records-dk03-launch-01): the key path, under the registry_root node, of the registry
# document_channel.parse node; after the registry parse the macro refuses unless that node equals the launch-carried
# contract it parsed with.
parse_at: [document_channel, parse]
# records-c1-framework-30 H30-01 (codex-tick824 L11-R11-BOUNDED-CREDIT): the document_channel reader-input NAMES, taken
# from the SAME parse (the node at `at` under registry_root) and returned under output.reader_inputs, so early
# producers write them without a second registry read. roles are the keys of that node which name reader inputs
# (the node also holds fact / members / observed, which are not names of inputs). The macro refuses unless every role
# is present, each value is a string, the values are distinct, each is in the reserved_in list and none is in the
# refused_in list (both are protected_lists, admitted above). The name pattern check is owed to records-33.
# records-c1-framework-30-r2 (codex-tick826 FW30-PUBLICATION-ROLE-COLLISION): disjoint_from is the registry_root key path
# of the ONE declaration of pre-view names; no role value may be any value of any of its entries (the internal binding
# and working facts bound before any view). The other role is excluded by the distinctness check.
reader_inputs: {at: [document_channel, admission], roles: [partial, declaration], reserved_in: reserved_outputs, refused_in: resolver_outputs, disjoint_from: [contract_admission, early_names]}
# transport -> the play variable carrying the identity and the key path inside it ([] = the variable itself).
# Each var is read AMBIENTLY: lookup(ansible.builtin.vars) in the guard render resolves it among the play variables
# visible to that render (the entry template_vars overlay them), so the macro is not argument-pure. Exactly one
# transport var must be among the supplied names. After the parse, admit_loader_source binds the set of vars to
# the admitted ABI: cold_inputs.required, bootstrap_input.var, genesis.initializer.root_input.var; each key path to
# the declared registry-identity construction field.
transports:
  cold: {var: rh_rel_registry_sha256, path: []}
  record: {var: rh_source_bootstrap, path: [registry_sha256]}
  init: {var: rh_init_root, path: [registry_sha256]}
# records-transport-custody-01 (codex-tick773 option A): every entry carries the ONE admitted launch envelope, the var
# of the envelope_transport entry above. The selected transport is NAMED by the envelope at transport_selector (a
# launch record key), never inferred from which vars are present. The selected transport var must be supplied and
# every other transport var except the envelope var must be absent; for a selected cold or init transport the
# envelope identity must equal the identity read from the selected var.
envelope_transport: record
transport_selector: [registry_transport]
cli_arg: registry_sha256
# records-c1-framework-27 (codex-tick821 REP-D1): COMPANION protected bindings of the admitted launch. They are NOT
# transports: no selector, not in the exclusivity rule above. Each var must be supplied, pass its declared test, be
# non-empty and equal (typed) the value at its path inside the launch envelope (the envelope_transport var). The
# launcher derives its caller refusal before pinning from these vars; after the parse admit_loader_source binds
# them to the admitted run_local.pinned_vars. A companion var is never also a protected name.
# depends_on RH-27-01 (records-c1-framework-27): the connection path needs controller_connection in the envelope
# record_keys; this edition lands only atomically with RH-27-01.
companions:
  target: {var: rh_controller_target, path: [controller_delegate], test: string}
  connection: {var: rh_controller_connection, path: [controller_connection], test: string}
# C1-SR918-RECONCILE (codex 918 SR918-CARRIER-SELECTION-ORDER 1d3a2998; records-c1-invocation-context-01
# sr918_reconcile_c1; route records-route-op1e-01 b349ba59 OWED-C1-OP1E-X2-BOUNDARY): THE ONE PROJECTOR CARRIER
# DECLARATION, read by the macro BEFORE any registry capture, parse or resolve. C1 is its single owner; the registry
# node contract_admission.carrier_state.entry_carriers carries the same words (the admitted ABI this declaration is bound
# to after the parse, as for every other name here).
#   words: the carrier words the macro returns under output.carrier.
#   projector.select: HOW THE GUARD LEARNS THE ACTUAL RUNNING ENTRY. Only Ansible MAGIC variables of the running play
#     are read (play_var = the play's name, dir_var = the directory of the playbook file Ansible loaded); Ansible
#     computes them from the loaded playbook and they take precedence over every extra-var / inventory var, so no
#     supplied name sets them, and no supplied var ever selects the carrier. The carrier is projector iff the play name
#     equals play_name AND dir_var below the discovered root equals dirname(entry_rel); otherwise envelope.
#     play_name is a literal (untemplated) play name, the ONLY play of the projector entry, and unique: no other
#     playbook of the admitted member set (source_admission.members_rel / closure) declares a play of that name
#     (rule unique_among: admitted_members; checked by the X2 admitter over the admitted closure and by B's static
#     check of its entries).
#   projector.admission: THE EXTERNAL X2 ADMISSION. var = the ONE mapping MAIN's X2 admitter computes and MAIN supplies
#     in the X2-admitted exec vector (kind executed: the X2 verifier recomputes it); fields role -> key: entry_rel (the
#     projector entry rel MAIN execs), entry_sha256 (the closure digest of those bytes in the X2 record), registry_sha256
#     (the X2 record registry identity), document_parse (the document_channel.parse node of the X2-admitted registry
#     bytes: THE EARLY PARSER SETTINGS of the projector carrier, never from an envelope or from the document being
#     admitted), companions (the companion pair, {<companions[*].var>: value}, computed by the X2 admitter by the
#     run_local pinned rule: target = full-match capture of run_local.inventory by the controller_host_list pattern,
#     connection = run_local.connection; never from an envelope). It is supplied IFF the carrier is projector (an
#     ordinary entry supplied with it refuses; a projector without it refuses); its presence corroborates, never selects.
#   HOW THE EXACT FILE DIGEST IS BOUND (three joins, all owned): (1) pre-parse: the bytes of entry_rel below root (no
#     link, regular, non-Vault, UTF-8 capture once, both strips off) hash (digest.algorithm) to admission entry_sha256,
#     and admission entry_rel == projector.entry_rel; (2) the X2-admitted exec vector names <checkout>/<entry_rel> as the
#     playbook word, so the file Ansible loads IS that rel (the play-name + dir selection cannot see the file name;
#     this join closes it); (3) post-resolve defence in depth: the running entry rel (the protected caller fact) and its
#     bytes equal the admission (admit_record_free_entry).
#   Under projector: the envelope var refuses (mixed), the selected transport is projector.transport, the admission
#   registry_sha256 equals the selected transport identity, document_parse equals the parse settings the render used,
#   the supplied companion vars equal admission.companions. No dependent parse or resolve precedes any of these.
carriers:
  words: {envelope: envelope, projector: projector}
  projector:
    entry_rel: testing/remote_harness/cold_launch_projection.yml
    transport: cold
    select: {play_var: ansible_play_name, dir_var: playbook_dir, play_name: lme-cold-launch-projection}
    admission:
      var: rh_x2_admission
      fields: {entry_rel: entry_rel, entry_sha256: entry_sha256, registry_sha256: registry_sha256, document_parse: document_parse, companions: companions}
  rules: {play_name: {literal: true, plays_in_entry: 1, unique_among: admitted_members}, presence_selects: never, refuse_before: [registry_capture, parse, resolve]}
# C1-SR918-RECONCILE (route OWED-C1-OP1D-CONSUMER-WORDS / op1e atoms; HOLE-SR917-VOCAB-ENGINE-SET): the consumer literals
# of the ingress macro and of every consumer of its output (output.ingress returns this declaration), declared HERE:
# the engine (lme_manifests r16 :4062) pins the registry contract_admission.vocabulary member set, so these words live
# in the pre-parse declaration every entry already admits. atoms: typed constants; fullmatch_wrap: the regex wrapper of
# a full match; canonical_json: the to_json options of every canonical comparison.
# C1-SR919 (route records-route-op1f-01 65a78362: the macro's integer comparisons with 0 stay literal for want of a
# word): + zero, ADDITIVE ONLY (no existing atom renamed, moved or retyped; zero is an int, type-distinct from
# false_value).
atoms: {empty_list: [], empty_map: {}, null_value: null, false_value: false, true_value: true, one: 1, zero: 0}
fullmatch_wrap: {open: '(?:', close: ')\Z'}
canonical_json: {sort_keys: true}
# C1-SR919B (codex 920 known_joins.vocabulary / 921 engine_join: the EXISTING-PATH join, no engine widening): the probe
# texts admit_loader_source uses to validate the three constants above after the parse (their only home stays HERE;
# the registry vocabulary holds no copy). fullmatch_wrap: open ~ alternation ~ close must match every admits text and
# no refuses text under the match test (a trailing LF, a CRLF, a leading LF, a concatenation, the empty text);
# canonical_json: two maps built from the admits texts in opposite insertion order serialize equal. Additive only.
constant_probes:
  fullmatch_wrap: {alternation: 'a|b', admits: [a, b], refuses: [ab, ba, '', "a\n", "\na", "a\r\n"]}
# records-c1-framework-31 (codex-tick824 A7-PROTECTED-NAME-HOME :67-72): the CALLER-PROTECTED top-level names of a
# normal run are DERIVED, never listed: every companions[*].var plus transports[envelope_transport].var (macro
# caller_protected in macros_rel). The launcher supplies them; an operator extra-var naming one refuses at the
# consumer. Envelope-internal paths are not top-level names. They are not reserved_outputs (companion_reserved stands).
# C1-SR918-RECONCILE: + carriers.projector.admission.var (MAIN supplies it in the X2-admitted vector; an operator
# extra-var naming it refuses; NOT a reserved output, since the pinned rule would refuse its legitimate supply).
caller_protected: {joiner: ' '}
# the result words of the macro (identity, the transport key used, this declaration, the protected slice)
# C1-SR918-RECONCILE: + carrier (the carrier word) and entry_identity (under projector only: admission entry_sha256)
output: {identity: identity, transport: transport, ingress: ingress, slice: contract_admission, reader_inputs: reader_inputs, carrier: carrier, entry_identity: entry_identity}
diagnostics:
  joiner: ' '
  transport: 'the launch envelope must select exactly one declared transport whose identity variable is supplied (the CO-V-PRE-02 admitted value), with no other transport variable supplied; [selected, conflicting transports]:'
  envelope_identity: 'the launch envelope registry identity differs from the identity of the selected transport (no transport is relabelled); [selected, transport variable]:'
  companion: 'a companion launch binding is absent, not of its declared type, empty, or differs from the launch envelope value at its declared path (projector carrier: from the external X2 admission companions); [companions]:'
  carrier: 'the projector carrier is not selected by the running play (name and playbook directory) with exactly the external X2 admission (supplied iff projector, never with the launch envelope), or the admission is not exactly its declared fields binding the declared entry rel, the bytes of that entry, the selected registry identity and the parse settings used (nothing was read or parsed); [names or fields]:'
  companion_reserved: 'a companion launch binding variable is also a protected registry name (no receiver exemption); [variables]:'
  expected: 'the admitted registry identity is not a full-match lower-case sha256 hex digest; transport variable:'
  mismatch: 'the registry bytes are not the admitted registry (nothing was parsed); [rel, admitted, actual]:'
  lists: 'a declared protected registry list is absent, not a list, or empty (never an empty guard):'
  pinned: 'REFUSED RH-DERIVED-OUTPUT-PINNED: harness-derived or resolver-derived names were supplied from outside the harness (extra-var or inventory); they are outputs, never inputs:'
  custody: 'the registry path is not a regular file reached without a symbolic link below the discovered root (nothing was read); [rel, linked components]:'
  vault: 'the registry file is a Vault envelope; the ingress admits plaintext only (nothing was read):'
  undecodable: 'the registry bytes are not valid UTF-8 (the capture escaped them; nothing was digested or parsed):'
  parse_contract: 'the launch-carried document parse contract is not the admitted registry document_channel.parse (the registry was parsed with it; nothing is published); key path:'
  readback: 'publication consistency: the bound contract_admission slice is not the one the ingress admission returned (a consistency check of the publication, not an identity proof)'
  reader_inputs: 'the registry reader-input names are absent, not each a string, not distinct, not each in the declared reserved list, in the declared refused list, or a declared pre-view name (an internal binding or working fact), or the pre-view name declaration is malformed (nothing is published); key path:'
