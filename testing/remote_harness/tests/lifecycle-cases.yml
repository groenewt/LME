      - 'supplied-generic-names: the seed admits them, the guard does NOT refuse (unreserved), and every r4 task still PASSES with the runner''s own measurements (the names have no effect: proves the rename closed the substitution, not that the guard grew)'
      - 'a supplied-* variant that is refused by the seed grammar instead is a FAILED control (it would not prove the runner guard; codex-tick348: flat single-key JSON negatives must fail at the runner guard)'
      - 'receipt-replaced-after-measure / receipt-overwritten-in-place-during-measure: see disposable_legs.<leg>.expect'
      - 'every variant: a refusal at "r4 PREFLIGHT FAILED -- RH-LOADER-POLICY-PREFLIGHT (runner policy preflight; never an expected negative)" is a FAILED control, never the expected negative'
    # DISPOSABLE TOCTOU LEGS: same grammar, bindings, inputs order and OPEN items as E90 (disposable_leg_bindings /
    # disposable_leg_inputs_order / disposable_legs_open); the hold path is the DISPOSABLE {R_d}, whose aside lives in its own
