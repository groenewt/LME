  # ---- codex-tick369 / tick372 PREPARATION (acquire.yml phase tasks/prepare.yml; admission tasks/admit_preparation.yml) ----
  # Common to E95-E97: every variant runs the genesis acquire stage (genesis.launch argv, operator_controller_inventory:
  # NO target scope, graph's lab allocation never composed) on a DISPOSABLE checkout {C_d} whose profile carries the C1
  # preparation section (proposal P-1 of the route hand-back) and a DISPOSABLE preparation root {P_d} (owned, 0700),
  # a disposable store {S_d} and receipt {Rc_d}. Network variants (tls-*, redirect-*, cold, reuse, changed-*) need an
  # origin DOUBLE: a declared local HTTPS responder whose CA is a DISPOSABLE ca_file {CA_d} put in the disposable
  # profile's preparation.fetch.ca_file and whose host names are the disposable profile's origin_hosts (G mechanism,
  # open). No run touches the real Debian origins, graph, the live store or a live preparation root.
  - id: E95-preparation-base-image-tls-sha512
    finding: [codex-tick369 GUEST-ACQUISITION-ADMISSION-CYCLE (base image), codex-tick372 DEBIAN-CLOUD-SIGNATURE-ASSUMPTION]
    rule: >-
      tasks/prepare_image.yml (debian_official_tls_sha512 ONLY): every hop admitted by tasks/prepare_fetch.yml BEFORE
      contact (https, host in origin_hosts, port 443, no userinfo/query/fragment, path fully matching the edition + file,
      <= fetch.max_hops), requested with follow_redirects none + validate_certs true + ca_path; ONE dated edition
      (explicit, or listed_newest from the fetched index); the metadata bytes READ bound to their on-disk sha256/sha512,
      EVERY line of the declared grammar, EXACTLY ONE entry for the file; the base REUSED only if the existing
      <bases>/<file> is the owned 0444 regular file with that sha512, else REFUSED and preserved; otherwise fetched into
      the partial, sha512-verified, chmod 0444, admitted by a no-replace hard link. The record states trust_mode, its
      boundary, signature_verified false, dnssec_verified false.
    variants:
      cold: '{P_d} empty; origin double serves the edition dir: SHA512SUMS (one entry) + the image'
      exact-dated-selection: 'edition_select explicit = D1; the double also serves D2 (newer) and a latest/ alias: only D1 paths are requested (hop log) and recorded'
      listed-newest: 'edition_select listed_newest; the index lists D1, D2 and "latest/": D2 is selected and recorded (mode listed_newest, index_sha256); "latest" never matches edition_regex'
      entry-missing: 'SHA512SUMS without a line for the file'
      entry-duplicate: 'SHA512SUMS with two lines naming the file (same or different digests)'
      entry-malformed: 'one line with a binary marker (" *name"), sub-variants: CR line ending, 127-hex digest, tab separator'
      tls-invalid-chain: 'the double serves a certificate NOT issued by {CA_d}'
      tls-hostname-mismatch: 'a {CA_d}-issued certificate for another host name'
      redirect-unapproved-host: 'metadata request 302 -> https://<host not in origin_hosts>/...'
      redirect-http: '302 -> http://<approved host>/...'
      redirect-other-edition: '302 -> https://<approved host>/.../<D2>/SHA512SUMS while D1 is selected'
      redirect-over-bound: 'a chain of max_hops + 1 redirects between the approved hosts'
      redirect-relative: '302 with Location: /images/...'
      changed-image: 'the image bytes differ from the SHA512SUMS entry'
      conflicting-base: '<bases>/<file> pre-exists (0444, owned) with other bytes'
      interrupted-retry: 'first run: the double stalls mid-image and the process is killed (SIGKILL); second run with the double healthy'
      unchanged-reuse: 'run cold, then run again with the same declaration'
      signed-mode-declared: 'the base image declares trust_mode signed_detached'
    expect:
      - 'cold: PREPARED; the record image entry disposition fetched, edition D1, file = the entry name, sha512 = entry, trust_mode debian_official_tls_sha512, signature_verified false, dnssec_verified false; metadata stored at <metadata>/<sha256>-SHA512SUMS; <bases>/<file> 0444; no partial left; the acquisition store and receipt are exactly what acquire.yml alone writes'
      - 'exact-dated-selection: as cold; no request path names D2 or latest'
      - 'listed-newest: as cold with edition D2 and edition_selection.mode listed_newest'
      - 'entry-missing / entry-duplicate: REFUSED RH-PREPARE at "PREPARE IMAGE -- refuse zero or several entries for the file, or a malformed selected entry"; <bases> unchanged; no record'
      - 'entry-malformed: REFUSED RH-PREPARE at "PREPARE IMAGE -- bind the metadata bytes READ to the on-disk digests; every line of the declared grammar"'
      - 'tls-invalid-chain / tls-hostname-mismatch: REFUSED RH-PREPARE at "PREPARE FETCH -- refuse a failed hop (TLS / hostname / connection error, or a status outside 200 + the declared redirects)" on hop 0; no body kept'
      - 'redirect-unapproved-host / redirect-http / redirect-other-edition / redirect-over-bound: REFUSED RH-PREPARE at "PREPARE FETCH -- admit hop 1 before contacting it (https, approved host, port 443, declared path, bounded)" (over-bound: at hop max_hops + 1 or at the redirect bound assert); the double''s log shows NO request to the refused location'
      - 'redirect-relative: REFUSED RH-PREPARE at "PREPARE FETCH -- refuse a relative, absent or over-bound redirect (never guessed)"'
      - 'changed-image: REFUSED RH-PREPARE at "PREPARE IMAGE -- refuse the changed image"; the partial removed; <bases> unchanged'
      - 'conflicting-base: REFUSED RH-PREPARE at "PREPARE IMAGE -- refuse a conflicting existing base (same name, other digest / not an immutable regular file; preserved)"; both preserved; the image never requested'
      - 'interrupted-retry: run 1 killed during the fetch leaves at most <partial>/<file> and no <bases>/<file>; run 2 removes it (PREPARE FETCH -- remove a stale hop body), refetches, PREPARED with disposition fetched. Sub-variant killed after the admission link: <bases>/<file> is the verified 0444 entry and <partial>/<file> a second name of it; run 2 REUSES and releases the partial name (PREPARE IMAGE -- release a stale partial name on the reuse path)'
