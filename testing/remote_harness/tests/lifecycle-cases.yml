  - {id: E81-genesis-act-isolation, finding: [codex-183510 PER-ACT-ISOLATION], rule: 'the genesis stage root is <work root>/<sub_roots.tmp>/<stage_root.rel>/<stage>/<act>: genesis.launch.stage_root.act declares the act identity (extra var act.var from the launch argv, act.regex), prepare creates the act dir EXCLUSIVELY (prepare.exclusive: mkdir without -p; existing refuses, never reused) under only-if-absent 0700 parents, the step record carries act and stage_root and its evidence dir is named by act; tasks/admit_builder.yml derives every stage path from the act (both _sr derivations) and refuses a missing or malformed act before any module', regression: 'every G act and MAIN run of a stage shared <work root>/tmp/genesis/<stage> (TMPDIR, ANSIBLE_LOCAL_TEMP, ANSIBLE_REMOTE_TMP, ANSIBLE_HOME): sequential execution was the only separation', pre: 'the E68 prepared checkout', variants: {positive: 'two launches of the same stage with distinct acts (concurrently)', reuse: 'a launch whose act dir already exists', missing-act: 'the launch argv without -e <act.var>=<act>', null-act: 'JSON -e ''{"<act.var>": null}''', non-string-act: 'JSON -e ''{"<act.var>": 7}'' and ''{"<act.var>": ["a"]}''', empty-act: 'JSON -e ''{"<act.var>": ""}'' under a fixture profile copy whose act.regex is ''^$''', slash-act: 'act x/y under a fixture profile copy whose act.regex is ''^x/y$'' (codex 194825 counterexample: the profile pattern alone admits it)', bad-act: 'act ''../x'' or ''.hidden''', trailing-newline-act: 'an otherwise valid act followed by ONE final newline, supplied as JSON -e ''{"<act.var>": "act1\n"}'' (RH-GENESIS-ACT-STRICT-END: a pattern ending in $ is admitted by Python re.match before a final newline; fullmatch must refuse it)', ordinary-act: 'act1 and a MAIN act such as 20260924T191017Z (positive control)'}, expect: ['positive: each builder''s DEFAULT_LOCAL_TMP, remote tmp and ANSIBLE_HOME lie under its own act dir; neither run reads or writes the other''s', 'reuse: the preparation refuses (mkdir without -p fails) and no builder starts', 'every act refusal below: REFUSED RH-BUILDER-UNSUPPORTED with RH-GENESIS-ACT-REQUIRED / RH-GENESIS-ACT-ISOLATION in the message, at the FIRST admit_builder assert before any module and before any use of the stage root derived from the act; the fail message shows the act JSON-encoded and, in place of the stage root, `(not derived: the act was refused)` (nothing is derived from or stat''ed for a refused act, codex 194825); the declared assert, never a template error. Distinguished by the failed `assertion` of the result:', 'missing-act: the varnames presence assertion (the absent act is bound none explicitly: the 2.19 vars lookup treats default=none as no default; never defaulted to an empty string)', 'null-act: `_act is not none`', 'non-string-act: `_act is string` (the RAW value is checked; never converted to a string first)', 'empty-act: `(_act | length) > 0` (the profile ''^$'' never applies)', 'slash-act, bad-act ''../x'', trailing-newline-act: the REGISTRY component assertion (contract_admission.patterns[required_values.genesis_act.pattern] = rel_segment, match_type fullmatch), before the profile pattern (the JSON act in the message tells x/y, ../x and "act1\n" apart)', 'bad-act ''.hidden'': the registry component assertion (rel_segment''s first character class)', 'ordinary-act: admitted by every act assertion (registry component and profile pattern)'], note: 'exclusivity is enforced by the launcher''s exclusive mkdir (the declared preparation); admit_builder cannot prove after the fact that no other launch shares the act, it binds every temp to the act the launch names; the preparation creates the act dir BEFORE the builder starts, so the preparing caller (G controls, MAIN runner) must apply the same registry component check before its mkdir (admit_builder refuses afterwards, it cannot un-create)', status: 'DECLARED; CONSUMER G (controls preparation must honour prepare.exclusive and pass -e <act.var>