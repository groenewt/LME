  - {id: E82-seed-launcher-membership, finding: [codex-tick217 R1 LAUNCHER-SEQUENCING], rule: 'the seed launcher bundle.launcher_file is a GENERATED bundle member with the seed''s custody (bundle.launcher_custody seed_file): tasks/package_bundle.yml renders it from controller.bootstrap.seed_launcher.template_rel (macro seed_launcher, the same macros file as the seed) with mode bundle.launcher_mode, refuses a staged launcher that is not a fresh render (bundle.refusals.staged), writes its line second in bundle.checksum_file (after the seed) and records launcher_file / launcher_sha256 in bundle.json; tasks/admit_bundle.yml admits it in the exact member set with its mode, byte-identical to a fresh render of the class policy and equal to bundle.json; the target re-renders it under its own policy (own-render guard), transfers, reads back (members, sha256sum --check), publishes and reaps it with the bundle; the seed''s lme_bundle_check lists it in its member and name sets. CUSTODY WORDING: the launcher runs BEFORE the seed''s own checks, so a wrong launcher that a caller executes is NOT guaranteed to be refused by the seed it starts; the boundary is the admitted generated artifact plus bundle custody (admission, check file, readback), and the seed''s bundle check is additional', regression: 'B''s gate launched the seed from its ambient bash (deploy_gate.sh gate_seed_run): the first seed launch precedes any play, so no declared renderer of seed_launch existed there (an ambient Ansible/Jinja render is undeclared and breaks under LC_ALL=POSIX)', pre: 'a prepared checkout (m1-1 carries no genesis.launch), then package', variants: {positive: 'package, admit (controller and target class), target transfer and apply through the launcher', missing: 'tests/bundle_fixtures.yml bundle_cases e82-missing (tasks/fixture_bundle.yml): a published bundle copy with the launcher removed (bundle.sha256 and bundle.json unchanged)', malformed: 'bundle_cases e82-malformed: a copy whose launcher lost its last byte, bundle.sha256 and bundle.json rebound CONSISTENTLY (the copy is self-consistent)', swapped: 'checkout_cases launcher-bytes (tasks/fixture_checkout.yml in G''s Route 3 variant clone: a launcher-only change inside macro seed_launcher; the seed render is unchanged), packaged by package.yml FROM THE CLONE (self-consistent bundle), admitted with the CANONICAL checkout. A profile copy (e.g. another base_env.PATH) is NOT used: it changes the seed too and would refuse at the seed digest instead', mode: 'bundle_cases e82-mode: a copy whose launcher is 0700'}, expect: ['positive: bundle.sha256 = seed line, launcher line, artifact lines; admit_bundle passes; the target publishes the bundle with the launcher and its apply (the launcher, by seed_launcher.caller_argv) reports INSTALLED/UNCHANGED <expected generation>', 'missing / mode: admit_bundle.yml REFUSED RH-TARGET-BOOTSTRAP at "Refuse a bundle that is not exactly the declared one of this class" (member set / launcher mode) on the controller BEFORE any target contact or mutation; the class bundle is preserved', 'malformed / swapped: admit_bundle.yml REFUSED RH-TARGET-BOOTSTRAP at the FRESH-RENDER launcher assertion (the assertion text carries rh.controller.bootstrap.seed_launcher.template_rel) -- every self-consistency assertion (check-file content, bundle.json launcher_sha256 / checksum_file_sha256) holds for these copies, so the provenance refusal is the fresh render; the target own-render guard is the other refusal', 'SEED LAYER (the seed started directly by the seed_launch vector, env -i ...): missing / mode refuse apply RH-SEED-ARTIFACT-MISSING "bundle members/modes are not exactly the declared set" before any mutation. malformed (consistent) and swapped: NO seed-layer claim -- the seed''s lme_bundle_check verifies self-consistency (members, grammar, sha256sum --check, bundle.json binding), which these copies satisfy, never launcher provenance; and a caller executing the launcher runs it BEFORE the se