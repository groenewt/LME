      - 'unchanged-reuse: run 2 PREPARED, disposition reused, same {file, sha512}, the image never requested (double log)'
      - 'signed-mode-declared: REFUSED RH-PREPARE at "PREPARE IMAGE -- admit the descriptor (a declared trust mode this file implements; no fallback)"; nothing fetched (signature cases are NOT reported under the TLS mode)'
    open:
      - 'origin double + disposable CA (G mechanism); a real-origin acquisition is MAIN''s and evidences only the positive path'
      - 'HYPOTHESIS (upstream): URL layout, SHA512SUMS name/grammar, whether cloud.debian.org redirects; a differing layout refuses (hop / grammar asserts), never guessed'
