      accepted. RUN-4: the readback.yml beside A is an immutable regular non-link file, read ONCE in the same task as A; when A
      carries `readback` it is exactly {path, sha256} with path == that record, the read bytes AND the stat of the record hash
      to A.readback.sha256 BEFORE it is parsed, and the parsed record has verdict PASS for exactly the R bytes read. Projection
      (E87) and readback (E88) never read A and run before it exists.
    regression: 'a pinned sha(A) that is never read proves no acceptance link (codex-tick337)'
    pre: >-
      E89 positive entry (production Y catalog); E88 positive readback attempt <brr_label> COMPLETED (readback.yml, verdict PASS);
      MAIN relocates A's published bytes unchanged to <C>/<root_rel>/<sub_roots.run>/<runners[locator.runner_key]>/<brr_label>/<locator.leaf>
      (mode 0400, regular, no link; <leaf> absent before; MAIN NEVER creates the <brr_label> dir -- the readback refuses an
      existing label, so a pre-created dir would block it). The negatives need a G variant clone CHECKOUT (RUN-3 binds
      the anchor to the launching checkout's own .work/run; a clone work root under the live checkout is no longer admissible)
      -- OPEN (UNVERIFIED), as E89 pre. The two TOCTOU legs (disposable_legs below) run ONLY on declared DISPOSABLE copies in
      such a clone (E92 disposable_bindings); the production R, A, readback.yml and catalog are never mutated
      (codex-operator-sitrep-first-graph-execution).
    variants:
      positive: 'A exactly as accepted (with `readback` {path, sha256} of the readback.yml beside it)'
      positive-without-readback: 'A exactly as accepted without the optional `readback` key (RUN-4 correspondence not required; readback.yml must still exist, regular, non-link, immutable)'
      missing-review-artifact: 'A absent at the locator'
      review-via-link: 'A (or its <brr_label> dir) a symlink to the right bytes'
      writable-review-artifact: 'A with a write bit'
      wrong-review-digest: 'A with one byte changed, entry.review.sha256 and -e managed_bootstrap_review_sha256 UNCHANGED (the only A variant that is meant to stop on the digest)'
      readback-missing: 'A in a <brr_label> dir without readback.yml (a clone-checkout attempt dir; never an incomplete live readback)'
      readback-via-link: 'readback.yml a symlink to the right bytes'
      readback-writable: 'readback.yml with a write bit'
      readback-digest-mismatch: 'A.readback.sha256 of other bytes; entry.review.sha256 + input RE-PINNED to that A'
      readback-path-other: 'A.readback.path another file (e.g. R, or a readback.yml of another attempt) with that file''s digest; entry + input re-pinned'
      readback-not-pass: 'the readback.yml beside A is a verdict FAIL record and A.readback binds exactly its bytes; entry + input re-pinned'
      readback-other-receipt: 'the readback.yml beside A is a PASS readback of another R and A.readback binds exactly its bytes; entry + input re-pinned'
      replaced-after-measure: 'DISPOSABLE (disposable_legs.replaced-after-measure): RENAME-REPLACE of the disposable {A_d} through its parent while the first open of {A_d} (the measure checksum) is held'
      overwritten-in-place-during-measure: 'DISPOSABLE (disposable_legs.overwritten-in-place-during-measure): IN-PLACE overwrite of the disposable {A_d}''s inode while the same open is held'
      malformed-not-yaml: 'A = bytes that are not YAML; entry.review.sha256 and -e managed_bootstrap_review_sha256 RE-PINNED to exactly those bytes'
      malformed-not-mapping: 'A = a YAML list; entry + input re-pinned to those bytes'
      malformed-missing-key: 'A without decision; entry + input re-pinned'
      malformed-extra-key: 'A with catalog_sha256 added; entry + input re-pinned'
      malformed-kind-or-schema: 'A with kind other_kind (and separately schema_version 2); entry + input re-pinned'
      malformed-decision-value: 'A with decision: maybe; entry + input re-pinned'
      mismatched-message-id: 'A with another message_id, entry.review.sha256 + input re-pinned to those exact bytes'
      review-names-other-receipt: 'A whose receipt_sha256 is another R digest, entry + input re-pinned to its bytes'
      decision-not-accepted: 'A with decision: rejected, entry + input re-pinned to its bytes'
    expect:
      - 'positive / positive-without-readback: the preflight and all review-artifact tasks pass; consumed-inputs.yml managed_bootstrap_review = {locator, path, sha256 (hash of the bytes READ) == stat_sha256 == entry.review.sha256, readback {path, sha256 (read), stat_sha256}} and runner_policy_preflight {include, policy_sha256, lme_resolved_revision, profile_sha256}'
      - 'missing-review-artifact / review-via-link / writable-review-artifact / wrong-review-digest / readback-missing / readback-via-link / readback-writable: REFUSED at "r4 -- refuse a missing, redirected or mutable review artifact A (MISSING A; WRONG A DIGEST)"'
      - 'readback-digest-mismatch / readback-path-other / readback-not-pass / readback-other-receipt: PASS the A digest tasks (re-pinned) and are REFUSED at "r4 -- A is a well-formed review of exactly the MEASURED receipt, by the accepted message, with an accepted decision" on the RUN-4 assertions (a digest-task refusal is a FAILED control)'
      - 'replaced-after-measure / overwritten-in-place-during-measure: see disposable_legs.<leg>.expect'
      - 'custody note (intended): the admission asserts the parents of A are real directories (not links), NOT that they are non-writable -- the owner-writable <brr_label> dir (0700, the readback''s own) is what makes replace-through-parent possible, and that is exactly the attack the read-bytes binding detects; immutability is asserted on A and readback.yml themselves (no write bits)'
      - 'every malformed-* / mismatched-message-id / review-names-other-receipt / decision-not-accepted variant: PASSES the digest tasks (re-pinned) and is REFUSED at "r4 -- A is a well-formed review of exactly the MEASURED receipt, by the accepted message, with an accepted decision" (malformed-not-yaml: the from_yaml error of that task) -- a variant refusing at a digest task is a FAILED control'
      - 'every variant: the runner-policy preflight PASSES first; a refusal at "r4 PREFLIGHT FAILED -- RH-LOADER-POLICY-PREFLIGHT (runner policy preflight; never an expected negative)" is a FAILED control, never the expected negative'
      - 'every negative: no case directory, no consumed-inputs.yml, no results.yml, LATEST unchanged (the refusal precedes the per-run work dir <work_root>/<run_id>)'
      - 'retained unchanged: E89 unaccepted / duplicate / changed-executable / self-review refusals'
    # DISPOSABLE TOCTOU LEGS (codex-tick343-347: "marking MAIN-only does not establish executable coverage";
    # codex-operator-sitrep-first-graph-execution: the ORIGINAL R / A must NOT be mutated). Each leg is declared as op data
    # in G's EXISTING controls act/step grammar (controls.yml runner.seed.uv-added-files is the pattern: an async seed act
    # with a strace inject hold, a file_regex wait on the strace record, freeze, ops, thaw, join) with the stracep prefix of
    # controls.j2 stracep() and the launcher vector of seed_launcher.caller_argv, over the DECLARED DISPOSABLE copies of
    # E92 disposable_bindings ({C_d}, {root_d}, {gen_d}, {R_d}, {sha_R_d}, {label_d}, {ctl_d}) plus the review bindings
    # below. No production path is opened for write. NOTHING here is a new runner, and nothing has been executed.
    disposable_leg_bindings:
      inherits: 'E92-receipt-parsed-byte-binding-cross-consumer.disposable_bindings'
      '{RUN_d}': '{C_d}/<work_roots.root_rel>/<work_roots.sub_roots.run> = review_contract.locator anchor run_evidence_root of the CLONE (RUN-3)'
      '{bundle_d}': 'the {C_d} clone''s own admitted bundle dir; launcher {bundle_d}/<bundle.launcher_file>'
      '{brr_label_d}': 'a COMPLETED E88-positive readback attempt of {R_d} in {C_d} (readback.yml verdict PASS)'
      '{A_rel_d}': '<work_roots.runners[review_contract.locator.runner_key]>/{brr_label_d}/<review_contract.locator.leaf>'
      '{A_d}': '{RUN_d}/{A_rel_d}: a disposable review A (0400) of {sha_R_d}, with readback {path, sha256} of the readback.yml beside it'
      '{sha_A_d}': 'sha256 of {A_d}'
      '{catalog_d}': 'the {C_d} clone''s OWN committed testing/loader-tests-r4/managed-bootstrap-receipts.yml whose accepted = [{sha256: {sha_R_d}, review: {locator: {anchor: run_evidence_root, rel: {A_rel_d}}, message_id: <{A_d} message_id>, sha256: {sha_A_d}}}] -- the clone commit IS the disposable accepted entry (OPEN (UNVERIFIED): the E89-pre clone-checkout mechanism)'
      '{leg_label}': 'a fresh run_label per leg ([A-Za-z0-9._-]+)'
      '{positive_inputs_d}': 'the cases_file, probe_ansible_playbook (= {R_d}.selected.probe_ansible_playbook), expected_runner_ansible_core, expected_probe_ansible_core, expected_probe_python_executable (= {R_d}.selected.probe_python_executable), expected_probe_python_version, run_mode and source_commit (= the {C_d} clone commit, HEAD, clean) of the positive disposable run in {C_d} -- copied from that run''s seed-launch step record argv, never re-typed'
      '{strace}': 'OPEN: the strace tool path (G: runner_tools.strace)'
    disposable_leg_inputs_order:
      - '1 the resolved run: the {C_d} seed run-local itself (--root {root_d}, runner loader_cases) passes -e work_root=<{RUN_d}/<runners.loader_cases>> and, LAST, lme_resolved_run; the caller passes NEITHER (reserved / work_root_var refusal)'
      - '2 the accepted catalog entry: {catalog_d} at the clone commit, UNMODIFIED during the legs (the runner refuses a dirty tree)'
      - '3 {A_d} under {RUN_d} (0400, digest {sha_A_d}); {R_d} (0400, digest {sha_R_d}); both disposable'
      - '4 the legs run AFTER the positive disposable run in {C_d}, serially; each leg''s undo restores the DISPOSABLE path before the next (unconditional, also after a failed hold or join); a disposable copy whose post-state does not match is discarded and re-created, never repaired in place'
    disposable_legs:
      replaced-after-measure:
        hold: 'the FIRST O_RDONLY openat of {A_d} = the checksum read inside "r4 -- measure the anchor, every component of A''s path below it, A itself and its readback record (not followed)" (stat components before it are directories; the fd is bound to the measured inode when the exit is delayed)'
        launcher_argv: ['{bundle_d}/<bundle.launcher_file>', run-local, '{root_d}', loader_cases,
                        -e, 'repo_root={C_d}', -e, 'cases_file=<{positive_inputs_d}.cases_file>', -e, 'run_label={leg_label}',
                        -e, 'probe_ansible_playbook=<{positive_inputs_d}>', -e, 'expected_runner_ansible_core=<{positive_inputs_d}>',
                        -e, 'expected_probe_ansible_core=<{positive_inputs_d}>', -e, 'expected_probe_python_executable=<{positive_inputs_d}>',
                        -e, 'expected_probe_python_version=<{positive_inputs_d}>', -e, 'run_mode=<{positive_inputs_d}>',
                        -e, 'source_commit=<{positive_inputs_d}>', -e, interpreter_policy=managed_only,
                        -e, 'managed_interpreter_root={gen_d}', -e, 'managed_bootstrap_receipt={R_d}',
                        -e, 'managed_bootstrap_receipt_sha256={sha_R_d}', -e, 'managed_bootstrap_review={A_rel_d}',
                        -e, 'managed_bootstrap_review_sha256={sha_A_d}']
        launcher_argv_note: 'seed_launcher.caller_argv [launcher, mode, root, mode_params (run-local: the runner), args]; the mode_args'' `--` is the LAUNCHER''s word, never the caller''s; required_inputs order of run_local.runners.loader_cases, then the four managed_only inputs (the tick337 X->Y shape)'
        stracep_argv: ['{strace}', -f, --kill-on-exit, -qq, -ttt, -o, /proc/self/fd/5, -e, trace=openat, -e, 'inject=openat:delay_exit=60s', -P, '{A_d}']
        stracep_note: 'controls.j2 stracep(): prefixed to launcher_argv; fd 5 = {ctl_d}/load.strace opened by the record writer; every matching openat of {A_d} is delayed (no occurrence selector), so the later slurp open of {A_d} is delayed too and, after thaw, opens the NEW inode'
        steps:
          - {id: pre-state, state: [{path: '{A_d}', kind: regular, sha256: '{sha_A_d}', mode: '0400'}, {path: '{A_d}.rhc-held-original', exists: false}]}
          - {id: load, act: {kind: seed, bundle: '{bundle_d}', op: run-local, root: '{root_d}', async: true,
                             strace: {inject: {syscalls: [openat], when: exit, hold: 60s}, trace_path: '{A_d}'},
                             args: ['--runner', loader_cases, '--', '<launcher_argv[4:]>']}}
          - {id: held, wait: {file_regex: {file: '{ctl_d}/load.strace', regex: 'O_RDONLY.*DELAYED'}}, timeout_s: 1800}
          - {id: frz, freeze: {step: load}}
          - {id: m-replace, ops: [{move: {from: '{A_d}', to: '{A_d}.rhc-held-original'}}, {write: '{A_d}', content: "rhc replaced review artifact\n", mode: '0400'}]}
          - {id: thw, thaw: {step: load}}
          - {id: join, join: load}
        # the variant undo of G's grammar, on the DISPOSABLE path only (never behind the guard: it runs after a failed hold / join too)
        undo: [{remove: '{A_d}'}, {move: {from: '{A_d}.rhc-held-original', to: '{A_d}'}}]
        after_undo:
          - {id: post-state, state: [{path: '{A_d}', kind: regular, sha256: '{sha_A_d}', mode: '0400'}, {path: '{A_d}.rhc-held-original', exists: false}]}
          - {id: positive-again, note: 'the unwrapped launcher_argv with a fresh {leg_label}: every r4 task PASSES on the disposable set'}
        state_note: 'sha256 / mode state predicates: if G''s state grammar has no such keys this readback is OPEN with the executor join'
        expect:
          - 'join: exit status non-zero (ansible-playbook''s failed-task status, propagated by the seed exit $? and the launcher), exactly as captured'
          - 'the preflight task and "r4 -- measure the anchor, every component of A''s path below it, A itself and its readback record (not followed)" and "r4 -- refuse a missing, redirected or mutable review artifact A (MISSING A; WRONG A DIGEST)" PASS (the measured inode held the accepted bytes)'
          - 'REFUSED at "r4 -- bind the bytes actually READ of A to the accepted digest BEFORE parsing (REPLACED A)" -- no A field parsed or credited'
          - 'FAILED control if: it refuses at WRONG A DIGEST (the mutation was not a new inode / landed before the measure open), at the preflight, or not at all (the freeze landed after the read)'
          - '{ctl_d}/load.strace: an O_RDONLY openat of {A_d} with DELAYED before the freeze, and a second (the slurp) after the thaw'
          - 'results artefacts: the seed-launch step record {RUN_d}/seed-launch/run-local/<attempt>/step.yml (exit_status, result = the refusal as captured); NO new <{RUN_d}/<runners.loader_cases>>/<run_id> dir, no consumed-inputs.yml, no results.yml, LATEST unchanged'
          - 'no production path (the live checkout''s .work, R, A, readback.yml, generation, bundle, catalog) is opened for write'
      overwritten-in-place-during-measure:
        hold: 'as replaced-after-measure'
        launcher_argv: 'as replaced-after-measure (a fresh {leg_label})'
        stracep_argv: 'as replaced-after-measure (-P {A_d})'
        steps:
          - {id: pre-state, state: [{path: '{A_d}', kind: regular, sha256: '{sha_A_d}', mode: '0400'}, {path: '{A_d}.rhc-held-original', exists: false}]}
          - {id: preserve, ops: [{copy: {from: '{A_d}', to: '{A_d}.rhc-held-original', mode: '0400'}}], note: 'BEFORE the act (outside the hold window)'}
          - {id: load, act: 'as replaced-after-measure'}
          - {id: held, wait: {file_regex: {file: '{ctl_d}/load.strace', regex: 'O_RDONLY.*DELAYED'}}, timeout_s: 1800}
          - {id: frz, freeze: {step: load}}
          - {id: m-in-place, ops: [{chmod: '{A_d}', mode: '0600'}, {append: {file: '{A_d}', text: "\n"}}, {chmod: '{A_d}', mode: '0400'}]}
          - {id: thw, thaw: {step: load}}
          - {id: join, join: load}
        undo: [{remove: '{A_d}'}, {move: {from: '{A_d}.rhc-held-original', to: '{A_d}'}}]
        after_undo: 'as replaced-after-measure (post-state digest {sha_A_d} + mode 0400, aside absent; positive-again)'
        expect:
          - 'join: exit status non-zero, exactly as captured'
          - 'REFUSED at "r4 -- refuse a missing, redirected or mutable review artifact A (MISSING A; WRONG A DIGEST)" on the digest assertion (the measure''s checksum read the changed bytes of the SAME inode) -- NOT the REPLACED A task'
          - 'FAILED control if: it refuses at the REPLACED A task (the mutation was not in place), at the preflight, or not at all'
          - 'results artefacts: as replaced-after-measure'
    disposable_legs_open:
      - 'the E89-pre clone-checkout mechanism ({C_d} with its own committed {catalog_d}, bundle, generation and .work) -- G''s; not declared here'
      - 'EXECUTOR: G''s controls runner (act-scope freezer) consuming these bindings under {ctl_d}; not invented here'
      - '{strace}: the tool declaration (G runner_tools.strace)'
      - 'the seed-launch step record (controller.bootstrap.genesis.seed_step_record) has no field for a wrapper prefix (the stracep argv) in front of the caller vector; C1 profile join'
      - 'precondition READ (not executed): the checkout .gitignore ignores /.work/ (the runner refuses a dirty tree; the disposable A, R and aside files live under {C_d}/.work)'
      - 'C1 review-location join: LANDED (profile a63f05bb R1 removed; catalog runner_key / leaf; runner RUN-1..4); only codex review of the joined bytes remains'
    runnable: controller-local
    status: 'DECLARED; CONSUMER G (variant clone checkouts + two disposable TOCTOU legs, OPEN); UNRUN'
  - id: E91-loader-admission-caller-substitution
    finding: [codex-tick339-340 REVIEW-ARTIFACT-CALLER-SUBSTITUTION, codex-tick339-340 REVIEW-ARTIFACT-PARSED-BYTE-BINDING, codex-tick343-347 open_join (rename), codex-tick348 RUN_1]
    rule: >-
      run_loader_tests.yml's FIRST task is the harness guard tasks/refuse_pinned_outputs.yml (SEED-05): every R / A admission
      register and effect-bearing intermediate (C1 G2 reserved_outputs, global.yml 69c4e736: receipt_stat, receipt_raw,
      review_raw, review_path_stat, exec_stat, interp_link, interpreter_resolved, interpreter_declared,
      resolved_run_receipt_stat, managed_bootstrap_catalog_entry, managed_bootstrap_review_path,
