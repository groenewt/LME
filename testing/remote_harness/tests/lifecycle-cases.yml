d-form refusal naming an empty word -- never a split or dropped word', 'relative: REFUSED RH-SEED-USAGE by the launcher at its first check, before realpath or any other tool runs', 'count: REFUSED RH-SEED-USAGE by the launcher; supported boundary = NO SEED EXECUTION AND NO MANAGED MUTATION. It is NOT "nothing executed": realpath (own path) runs before the word-count checks, the <2-word check precedes the HOME derivation, and the mode-specific counts run AFTER launch_home (id, the derive.home tool) -- controller_seed.j2 seed_launcher preamble'], note: 'the launcher does not inspect or clear names it does not pass: shell startup and its own pre-exec tool calls (realpath, id, getent) run in the CALLER''s environment and still inherit loader-affecting variables such as LD_PRELOAD / LD_LIBRARY_PATH; only the final env -i clears them for the seed. No isolation from a hostile process environment is claimed: the launcher''s guarantee is the declared environment and argv handed to the seed, given a non-hostile invoking process', status: 'DECLARED; CONSUMER G'}
