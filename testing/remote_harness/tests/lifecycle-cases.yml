order_first_target: trixie
then: graph
cases:
  - id: T01-fresh-setup
    run: setup.yml --limit trixie
    pre: no harness account, no harness root
    expect: [every component record status complete or typed incomplete (uv / legs while REQUIRED), ownership marker written once, setup receipt on controller, setup lock absent]
  - id: T02-unchanged-reapply
    run: setup.yml --limit trixie (same frozen set)
    expect: [every component gate needed=false, no task changed except read-only observations, new setup receipt]
  - id: T03-affected-only-reapply
    run: setup.yml after changing ONE component declaration (e.g. aggregate_slice.TasksMax) in a re-reviewed frozen set
    expect: [only that component needed=true and re-recorded, all others no-op]
  - id: T04-interrupted-setup-recovery
    pre: setup interrupted after step 6 (lock held, a component in_progress, a toolchain .partial present)
    run: [setup.yml (expect refused at lock), setup.yml -e rh_recover_setup_lock=<setup_id from holder.yml>]
    expect: [first run refused at "setup lock held", second run archives the lock as .recovered-<utc>, in_progress components re-applied, .partial renamed .abandoned-<utc> (never deleted)]
  - id: T05-preexisting-account-refused
    pre: a same-named account exists and no ownership marker (declared by creating it in a throwaway VM or an isolated host only; NEVER create it on a shared host for the test)
    expect: refused at step 5 "without an ownership marker"
  - id: T06-preexisting-root-refused
    pre: harness root exists without marker
    expect: refused at step 5
  - id: T07-probe-failure-stops
    pre: systemd older than probe.min_systemd_major, or a property unsupported (observed, not induced on a shared host)
    expect: refused at step 4 with rh_probe_record; no step 5+ action
  - id: T08-transport-failure-stops
    pre: controller evidence dir not writable (controller-side, reversible)
    expect: refused at step 3 preflight; target tempfile removed
  - id: T09-identity-mismatch-refused
    run: setup.yml with an inventory host whose claim points at the other target's policy entry (inventory copy, not the frozen inventory)
    expect: refused at "Generic admission"; identity projection not written
  - id: T10-alias-and-controller-self-refused
    run: inventory entry resolving to the controller (ansible_host = controller name / 127.0.0.1)
    expect: refused at "Refuse a local or loopback connection" or "resolves to the controller itself"
  - id: T11-unsupported-controller-refused
    run: any playbook under the observed controller pair (core 2.17.14 on Python 3.13.9)
    expect: refused in resolve_harness controller check (RH-CONTROLLER-TOOLCHAIN-UNSUPPORTED)
  - id: T12-storage-required-refused
    pre: a reviewed COPY of the declaration with targets.<key>.storage.harness_root = REQUIRED (the frozen set now carries tick98/codex-2037 values, so this is a negative copy, never an edit of the frozen set)
    expect: setup refused at step 2 storage_ready=false
  - id: T13-incomplete-leg-does-not-block
    pre: core-2.17.14 leg fails its own inventory/smoke comparison (or a reviewed copy holds a REQUIRED value), core-2.19.11 complete
    expect: [2.17.14 recorded incomplete with typed reason, 2.19.11 unaffected, run_job for 2.19.11 admitted, run_job for 2.17.14 refused at toolchain_ready]
  - id: T14-run-id-collision
    run: run_job.yml -e rh_resume_run_id unset, same generated run id reused (clock pinned by re-issuing within one second is NOT relied on; use a pre-created runs/<id>/meta/reservation.yml via a prior run)
    expect: refused "already exists ... pass rh_resume_run_id"
  - id: T15-resume-after-disconnect
    run: [run_job.yml -e rh_wait=false, kill controller session, retrieve.yml -e rh_run_id=<id>]
    expect: [retrieve refuses while unit active, later finishes + writes manifest once + RETRIEVAL-COMPLETE]
  - id: T16-duplicate-completed-refused
    run: run_job.yml with identical job/leg/bundle/inputs/config after T15 completed
    expect: refused at repeat gate unless rh_allow_repeat=<binding_key>
  - id: T17-partial-retrieval-retry
    pre: interrupt retrieve_run mid-fetch
    expect: [RETRIEVAL-ATTEMPT recorded without completion marker, retry lands in the same dir, completes]
  - id: T18-unexpected-local-member-no-marker
    pre: add a stray file under the controller landing dir before retrieval completes
    expect: no_unexpected_local_member false, no RETRIEVAL-COMPLETE, nothing deleted
  - id: T19-symlink-output-nonqualifying
    job: synthetic job whose runner writes a symlink into out/
    expect: [symlink recorded in refused by path sha256, verdict qualifying=false, symlink never fetched]
  - id: T20-teardown-with-unretrieved-run-refused
    run: teardown.yml -e rh_teardown_confirm=<target>:<node>:lme-remote-harness while a run lacks RETRIEVAL-COMPLETE
    expect: refused "unretrieved runs"; nothing removed
  - id: T21-teardown-then-fresh-setup
    run: [teardown.yml (all runs retrieved + named), setup.yml]
    expect: [only owned paths/account removed, teardown record on controller, fresh setup = T01]
  - id: T22-footprint-recorded
    job: any READY sandboxed job
    expect: meta/binding-post.yml footprint_vs_envelope present with observed MemoryPeak/CPUUsageNSec/IO/disk and the per_run envelope; no envelope raised
  # ---- added in the re-freeze superseding aaa962da ----
  - id: T23-uv-partial-interrupt
    pre: setup interrupted inside step 7e after the installer wrote <uv_root>.partial and before the rename
    run: setup.yml (with rh_recover_setup_lock if the lock is held)
    expect: [the earlier <uv_root>.partial is renamed <uv_root>.abandoned-<utc> (never deleted), a fresh .partial is installed, its uv binary sha256 equals the digest DERIVED from the pinned archive member, only then renamed to <uv_root>, component record complete with archive digest and installed digest stated separately]
  - id: T24-uv-installed-digest-mismatch
    pre: a reviewed COPY of the declaration whose fallback_archive names a different pinned archive than the installer version installs
    expect: step 7e refuses at the derived-digest assert; <uv_root> never published; .partial left for abandonment by the next run
  - id: T25-ambient-ansible-hidden
    run: setup.yml probe B (behavioral probes)
    expect: [probe ambient_ansible_hidden: /usr/bin/test -x /usr/bin/ansible-playbook inside the transient unit returns NONZERO (InaccessiblePaths mode-0000 node), the host's /usr/bin/ansible-playbook itself is untouched (stat before == after)]
  - id: T26-offline-precheck-before-effect
    pre: a reviewed COPY of the declaration with targets.<key>.bootstrap_mode = offline and one bootstrap.offline.artifacts file absent (or digest-unequal) under artifact_root
    run: setup.yml --limit <target>
    expect: [refused in play 1 step 0b on the controller (delegate_to localhost) BEFORE any target task, fail_msg names each missing and each digest-unequal artifact id, no target contact after admission-free precheck]
  - id: T27-cpython-member-compare
    run: setup.yml (toolchain_leg provision)
    expect: [installed bin/python3.X sha256 == archive member python/bin/python3.X of the staged, checksum-verified PBS archive, interpreter-provenance.json + installed-inventory.json + smoke.json retained in the leg root, installed inventory name==version set == lock]
  - id: T28-purge-rebuild
    run: jobs/R-bootstrap-rebuild.yml steps 1-6
    expect: [removed set in the teardown record == components re-created, R2 component revisions == R1, third setup all no-op, ambient ansible untouched]
