          - '"r4 -- measure the bootstrap receipt bytes" completes on the ORIGINAL inode; REFUSED at "r4 -- bind the exact receipt bytes, its shape, the managed root and the resolved-run toolchain receipt" on the READ-bytes digest assertion ((receipt_raw.content | b64decode | hash(''sha256'')) == managed_bootstrap_receipt_sha256); the stat checksum assertion before it PASSES'
          - 'FAILED control if: it refuses on the stat checksum assertion (not a new inode / late), at the preflight, or not at all'
          - '{ctl_d}/load.strace: an O_RDONLY openat of {R_d} with DELAYED before the freeze, and a second (the slurp) after the thaw'
          - 'results artefacts: as E90 disposable legs (seed-launch step record under {RUN_d}; no new loader-cases <run_id> dir, no consumed-inputs.yml / results.yml, LATEST unchanged); {A_d} untouched; no production path opened for write'
      receipt-overwritten-in-place-during-measure:
        hold: 'as receipt-replaced-after-measure'
        launcher_argv: 'as receipt-replaced-after-measure (a fresh {leg_label})'
        stracep_argv: 'as receipt-replaced-after-measure (-P {R_d})'
        steps:
          - {id: pre-state, state: [{path: '{R_d}', kind: regular, sha256: '{sha_R_d}', mode: '0400'}, {path: '{R_d}.rhc-held-original', exists: false}]}
          - {id: preserve, ops: [{copy: {from: '{R_d}', to: '{R_d}.rhc-held-original', mode: '0400'}}], note: 'BEFORE the act (outside the hold window)'}
          - {id: load, act: 'as receipt-replaced-after-measure'}
          - {id: held, wait: {file_regex: {file: '{ctl_d}/load.strace', regex: 'O_RDONLY.*DELAYED'}}, timeout_s: 1800}
          - {id: frz, freeze: {step: load}}
          - {id: m-in-place, ops: [{chmod: '{R_d}', mode: '0600'}, {append: {file: '{R_d}', text: "\n"}}, {chmod: '{R_d}', mode: '0400'}]}
          - {id: thw, thaw: {step: load}}
          - {id: join, join: load}
        undo: [{remove: '{R_d}'}, {move: {from: '{R_d}.rhc-held-original', to: '{R_d}'}}]
        after_undo: 'as receipt-replaced-after-measure (post-state digest {sha_R_d} + mode 0400, aside absent; positive-again)'
        expect:
          - 'join: exit status non-zero, exactly as captured'
          - 'REFUSED at "r4 -- bind the exact receipt bytes, its shape, the managed root and the resolved-run toolchain receipt" on the STAT checksum assertion (receipt_stat.stat.checksum == managed_bootstrap_receipt_sha256), before the read-bytes assertion'
          - 'FAILED control if: it refuses on the read-bytes assertion instead (not in place), at the preflight, or not at all'
          - 'results artefacts: as receipt-replaced-after-measure'
    disposable_legs_open: 'E90 disposable_legs_open (clone-checkout mechanism, executor, {strace}, step-record wrapper field)'
    note: 'underscore task vars (_a, _vc, _catalog, _wr, _att, _segs, ...) are unreachable through the launcher grammar (name_first_chars a-z) and are reserved for inventory / non-launcher entry'
    runnable: controller-local
    status: 'DECLARED; CONSUMER G (clone checkout + two disposable TOCTOU legs, OPEN); UNRUN; C1 G2 LANDED (global.yml 69c4e736) and the runner rename landed with this revision'
  - id: E92-receipt-parsed-byte-binding-cross-consumer
    finding: [codex-tick355 BOOTSTRAP-READBACK-PARSED-BYTE-BINDING (high), codex-tick355 pattern action]
    rule: >-
      Every loader-tests-r4 consumer that stats, reads and parses a receipt / review / seal reads it ONCE (slurp) and, in its
      OWN task placed before any parse, binds sha256 of that one decoded payload to the ADMITTED digest through the declared
      check (managed-bootstrap-receipts.yml payload_binding_contract = macros/bootstrap_receipt.j2 op payload_binding; the
      loader's R / A / readback binds are the same rule inline); it parses only that payload and records / prints the
      verified read digest (readback.yml receipt.sha256, remeasured.toolchain_receipt.sha256, R toolchain_receipt.sha256,
      the success messages). A rename-replacement between the stat and the read therefore refuses at the read-bytes bind,
      never at the stat assertion and never as a PASS attributed to the stat's digest.
    regression: 'readback_bootstrap_receipt.yml d2d99e44 stat-hashed R1, parsed and re-measured R2, and emitted PASS / receipt.sha256 attributed to sha256(R1) (codex-tick355)'
    # DISPOSABLE ONLY (codex-tick355: mutation tests use declared disposable copies; original evidence is immutable). No
    # leg below mutates the production R, A, readback.yml, generation or bundle; the E90 / E91 TOCTOU legs are re-specified
    # onto these same bindings (disposable_legs; codex-operator-sitrep-first-graph-execution, tick361 RX-E90-E91).
    disposable_bindings:
      '{C_d}': 'a G variant clone CHECKOUT (committed, clean; its own .work, its own admitted bundle) -- OPEN (UNVERIFIED) exactly as E89 pre; every {..._d} path below lives under {C_d}/.work and is created per leg'
      '{root_d}': '{C_d}/<work_roots.root_rel>/<work_roots.sub_roots.toolchain>'
      '{gen_d}': 'a sealed generation under {root_d}/<layout.generations_dir> built by the E68 path in {C_d} (never the live generation)'
      '{TC_d}': '{gen_d}/<layout.receipts_dir>/toolchain.json'
      '{TREE_d}': '{gen_d}/<layout.receipts_dir>/tree.sha256'
      '{BM_d}': '(dirname of the {gen_d} claims seed_path)/<bundle.manifest_file> = the {C_d} bundle manifest'
      '{R_d}': '{C_d}/.work/<sub_roots.run>/<runners.bootstrap_receipt>/{br_label_d}/managed-bootstrap-receipt.yml from a FRESH E87-positive projection {br_label_d} in {C_d} (readback admission pins R to exactly that dir shape)'
      '{sha_R_d}': 'the digest the {br_label_d} projection printed'
      '{label_d}': 'a fresh attempt label per leg (the readback / projection refuse a reused one)'
      '{ctl_d}': 'the leg''s G control dir (strace record {ctl_d}/load.strace)'
    grammar: 'G controls act / held / frz / ops / thw / join with variant undo (E90 disposable_legs.replaced-after-measure is the shape: async seed act under stracep() -P <path>, file_regex wait on DELAYED, freeze, rename-replace ops, thaw, join); the mutation op of every leg is [{move: {from: <path>, to: <path>.rhc-held-original}}, {write: <path>, content: "rhc replaced <what>\n", mode: <original mode>}] and undo is [{remove: <path>}, {move: {from: <path>.rhc-held-original, to: <path>}}] -- on the DISPOSABLE path only'
    legs:
      readback-R:
        launch: '{C_d} seed run-local {root_d} bootstrap_receipt_readback -e brr_label={label_d} -e brr_receipt={R_d} -e brr_receipt_sha256={sha_R_d}'
        hold: 'the FIRST O_RDONLY openat of {R_d} = the checksum read of "Measure R (not followed)" (no earlier task opens R)'
        expect:
          - 'REFUSED RH-BOOTSTRAP-RECEIPT-READBACK at "Bind the bytes READ of R to the named digest BEFORE parsing (REPLACED R)"; payload_binding reasons == [read-mismatch] (stat_sha256 == {sha_R_d}, read_sha256 != it)'
          - 'post: {C_d}/.work/<sub_roots.run>/<runners.bootstrap_receipt_readback>/{label_d} ABSENT (no readback.yml; nothing parsed)'
          - 'FAILED control if: it refuses at "Refuse R unless it is exactly the named bytes..." or any later task, or PASSES'
      readback-toolchain:
        launch: 'as readback-R (a fresh {label_d}; an unmutated {R_d})'
        hold: 'the openat of {TC_d} by "Re-measure the sealed generation receipt this runner was launched with (not followed)" -- OPEN: the seed / resolver open {TC_d} before the playbook and stracep() delays EVERY matching openat (no occurrence selector); an Nth-open selector is a G grammar join'
        expect:
          - 'REFUSED at "Bind the bytes READ of the sealed generation receipt to the resolved-run digest BEFORE parsing"; reasons == [read-mismatch]'
          - 'post: no readback label dir, no readback.yml (behaviour change: a toolchain.json read mismatch no longer yields a recorded FAIL pair)'
      readback-tree:
        launch: 'as readback-R'
        hold: 'the openat of {TREE_d} by "Re-measure the seals, config, seed and bundle manifest (not followed)" (item 0) -- OPEN selector as readback-toolchain (the seed''s verify_toolchain_receipt opens tree.sha256 first)'
        expect:
          - 'REFUSED at "Bind the bytes READ of tree.sha256 to its measured digest BEFORE testing membership"; reasons == [read-mismatch]'
          - 'post: no readback.yml'
      projection-toolchain:
        launch: '{C_d} seed run-local {root_d} bootstrap_receipt -e br_label={label_d} -e br_source_commit=<HEAD of {C_d}, clean> (codex-tick368)'
        hold: 'the openat of {TC_d} by "Measure the sealed generation receipt (not followed)" -- OPEN selector as readback-toolchain'
        expect:
          - 'REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION at "Bind the bytes READ of the sealed generation receipt to the resolved-run digest BEFORE parsing"; reasons == [read-mismatch]'
          - 'post: {label_d} dir ABSENT (no R written)'
      projection-bundle-manifest:
        launch: 'as projection-toolchain (a fresh {label_d})'
        hold: 'the openat of {BM_d} by "Measure the generation''s ansible-playbook, venv python (link), interpreter, config and seals (not followed)" (item 7) -- OPEN selector (the seed / bundle admission open bundle.json first)'
        expect:
          - 'REFUSED at "Bind the bytes READ of the bundle manifest to its measured digest BEFORE parsing"; reasons == [read-mismatch]'
          - 'post: no R written'
      loader-R / loader-A / loader-readback-record:
        launch: 'the E90 positive loader argv on {C_d} with a disposable accepted entry for {R_d} and a disposable A beside a disposable readback.yml -- OPEN: E89 pre (a committed clone checkout whose own catalog carries the entry; no other disposable-entry mechanism exists)'
        hold: 'loader-R: first openat of {R_d} ("r4 -- measure the bootstrap receipt bytes"); loader-A / loader-readback-record: first openat of the disposable A / readback.yml (the measure loop)'
        expect:
          - 'loader-R: REFUSED at "r4 -- bind the exact receipt bytes, its shape, the managed root and the resolved-run toolchain receipt" on the read-bytes assertion (stat assertion PASSES)'
          - 'loader-A: REFUSED at "r4 -- bind the bytes actually READ of A to the accepted digest BEFORE parsing (REPLACED A)"'
          - 'loader-readback-record: REFUSED at "r4 -- A is a well-formed review of exactly the MEASURED receipt, by the accepted message, with an accepted decision" on (review_raw.results[1].content | b64decode | hash(''sha256'')) == _a.readback.sha256, before the record is parsed'
    positive_controls:
      - 'every leg run once UNMUTATED (same act, the hold released without ops): its bind task PASSES (macro sites readback-R / readback-toolchain / readback-tree / projection-toolchain / projection-bundle-manifest: payload_binding reasons [] and read_sha256 == stat_sha256 == the admitted digest; loader inline sites loader-R / loader-A / loader-readback-record: the named inline read-bytes assertions hold, no payload_binding result exists); readback / projection complete; readback.yml receipt.sha256 and remeasured.toolchain_receipt.sha256 equal the READ digests; R toolchain_receipt.sha256 == the read digest of {TC_d}'
      - 'macro dispatch: the projection renders R through op render byte-identically to the pre-dispatch template for the same inputs (compare with a {C_d} projection at the pre-change commit) -- UNRUN'
    expect_all:
      - 'every negative: join exit non-zero; a refusal at a stat assertion, at a shape / claim task other than the leg''s named bind, or a PASS is a FAILED control'
      - 'MACRO SITES ONLY (readback-R, readback-toolchain, readback-tree, projection-toolchain, projection-bundle-manifest): the refusal carries payload_binding reasons [read-mismatch] (macros/bootstrap_receipt.j2 op payload_binding)'
      - 'LOADER INLINE SITES (loader-R, loader-A, loader-readback-record; RX-LOADER-INLINE, codex-tick361): NO payload_binding result is emitted; the refusal is exactly the named inline read-bytes assertion of the leg''s expect (E92-INLINE-REASON-EXPECTATION)'
      - 'undo runs unconditionally (after a failed hold / join too); post-state: the disposable path has its original digest and mode, the .rhc-held-original aside is absent'
      - 'no production path (the live checkout''s .work, its generation, bundle, R, A, readback.yml, catalog) is opened for write by any leg'
    open:
      - 'the G clone checkout mechanism ({C_d}; E89 pre)'
      - 'an Nth-openat occurrence selector for stracep() (toolchain / tree / bundle-manifest legs; the seed opens those files before the playbook)'
      - 'executor: G''s controls runner consuming these bindings'
      - 'parent write bit: a rename-replace needs write on the parent. {R_d}''s parent is the projection''s own 0700 label dir (writable by the owner); the {gen_d} receipts dir and the {C_d} bundle dir have no declared mode (verify_toolchain_receipt.yml asserts only not group/other-writable and owned) -- if read-only, the ops need a parent chmod u+w before the move and an unconditional undo restoring the measured mode'
    runnable: controller-local
    status: 'DECLARED; UNRUN (route X authored only; no leg executed, no disposable copy created)'
  - id: E93-loader-catalog-read-bound-to-source-blob
    finding: [codex-tick361 RX-CATALOG-READ]
    rule: >-
      run_loader_tests.yml (managed_only) reads managed-bootstrap-receipts.yml ONCE (slurp, register
      managed_bootstrap_catalog_raw) and, in its own task BEFORE any parse ("RX-CATALOG-READ -- bind the catalog bytes READ
      to the blob source_commit records BEFORE parsing"), binds those exact bytes (declared git hash-object --no-filters
      --stdin) to the single regular-file blob (mode 100644/100755, type blob) that ls-tree of the declared source_commit
      records at the same path. The anchor is independent of the catalog (no self-declared digest; no admission cycle).
      Every catalog use (six former lookup('file') re-reads) parses that one read; a hard-coded shape gate follows the
      bind; the published instrument digest must equal sha256 of the read.
    regression: 'run_loader_tests.yml 4f30ee73 parsed the catalog through six lookup(''file'') re-reads (each re-opening the path, trailing whitespace stripped) and hashed it only by a later stat (instrument_stat), so the bytes parsed were never the bytes measured or admitted'
    # DISPOSABLE ONLY: every variant is a {C_d} clone (E92 disposable_bindings); the live checkout, its catalog and its
    # index are never touched. A plain edit / delete of the catalog makes `git status --porcelain` dirty, so the EXISTING
    # refusal "r3 -- refuse a run whose executed checkpoint is not the declared source_commit, or is dirty" fires first and
    # would be credited wrongly: each variant below is constructed so that refusal PASSES.
    disposable_bindings:
      inherits: 'E92-receipt-parsed-byte-binding-cross-consumer.disposable_bindings ({C_d}, {R_d}, {sha_R_d}, {label_d}, {ctl_d})'
      '{CAT_d}': '{C_d}/testing/loader-tests-r4/managed-bootstrap-receipts.yml'
      '{SC_d}': 'the -e source_commit of the leg = HEAD of {C_d} after the variant''s own disposable commit (if any)'
    launch: 'the E90 positive loader argv on {C_d} (E89 pre: a committed clone checkout whose own catalog carries the entry for {R_d}), source_commit={SC_d}, interpreter_policy=managed_only'
    variants:
      mismatch-hidden-edit: '{CAT_d} bytes changed (one comment byte) and hidden from status with `git -C {C_d} update-index --skip-worktree <rel>` on the DISPOSABLE index; {SC_d} = the unmodified commit'
      absent-worktree: '{CAT_d} removed from the worktree, hidden with skip-worktree as above'
      absent-commit: 'a disposable commit removing <rel> ({SC_d}); the original bytes restored at {CAT_d} as an untracked file excluded via {C_d}/.git/info/exclude (porcelain stays empty)'
      link-in-commit: 'a disposable commit replacing <rel> by a symlink (mode 120000) to a copy holding the original bytes'
      malformed-syntax: 'a disposable commit whose catalog is not valid YAML (an unterminated flow mapping)'
      malformed-shape: 'a disposable commit whose catalog is a YAML list; and (sub-variant) one whose catalog lacks review_contract'
      replaced-after-read: 'TOCTOU leg (E92 grammar on {CAT_d}): hold the openat of {CAT_d} by "Hash every instrument file actually used by this run" (OPEN: Nth-openat selector, the slurp opens it first), rename-replace {CAT_d}, thaw'
    expect:
      - 'positive ({C_d} unmodified): the bind and the shape gate PASS; every r4 managed_only task passes as in E89 / E90; the roster cross-check PASSES (instruments[managed-bootstrap-receipts.yml] == sha256 of the read)'
      - 'mismatch-hidden-edit: REFUSED RX-CATALOG-READ at "RX-CATALOG-READ -- bind the catalog bytes READ to the blob source_commit records BEFORE parsing" on managed_bootstrap_catalog_oid.stdout == the ls-tree object id'
      - 'absent-worktree: REFUSED at the same bind task on managed_bootstrap_catalog_raw.content is defined (the slurp is failed_when: false)'
      - 'absent-commit: REFUSED at the same bind task on (_l | length) == 1 (ls-tree of {SC_d} is empty)'
      - 'link-in-commit: REFUSED at the same bind task on the mode / type clause (120000 is not a regular-file blob)'
      - 'malformed-syntax: the task "RX-CATALOG-READ -- the bound catalog is one mapping with every top-level section (criteria hard-coded, not read from it)" FAILS in templating (a from_yaml error carries no fail_msg: match on the task NAME); the bind task before it PASSED'
      - 'malformed-shape: REFUSED RX-CATALOG-READ at the same shape task (is mapping / missing section)'
      - 'replaced-after-read: REFUSED RX-CATALOG-READ at "RX-CATALOG-READ -- the instrument roster''s catalog digest is the digest of the bytes read and parsed"'
    expect_all:
      - 'every negative: join / run exit non-zero, NO case executed; a refusal at "r3 -- refuse a run whose executed checkpoint is not the declared source_commit, or is dirty", at the guard, at "r4 PREFLIGHT FAILED -- RH-LOADER-POLICY-PREFLIGHT (runner policy preflight; never an expected negative)", at any r4 catalog / receipt task, or a PASS is a FAILED control'
      - 'no production path (the live checkout, its index, .work, catalog) is opened for write; skip-worktree / exclude / disposable commits exist only in {C_d}'
    open:
      - 'the G clone checkout mechanism ({C_d}; E89 pre) and git index / commit ops on it (a G grammar join)'
      - 'Nth-openat selector (replaced-after-read)'
      - 'C1 reservation of managed_bootstrap_catalog_rel, managed_bootstrap_catalog_raw, managed_bootstrap_catalog_git, managed_bootstrap_catalog_tree, managed_bootstrap_catalog_oid: until reserved an -e pin of those registers bypasses the bind (land atomically)'
      - 'anchor strength: the object id is git''s (hardened SHA-1 in a sha1-format repository); sha256 enters only through the roster cross-check'
    runnable: controller-local
    status: 'DECLARED; UNRUN (route X authored only; no variant executed, no disposable clone created)'
  - id: E94-projection-readback-catalog-read-bound-to-admitted-revision
    finding: [codex-tick368 RX-CATALOG-READ (projection / readback)]
    rule: >-
      project_bootstrap_receipt.yml and readback_bootstrap_receipt.yml read managed-bootstrap-receipts.yml ONCE (slurp;
      _rh_br_catraw / _rh_brr_catraw) and bind those bytes, in their own task BEFORE any parse, to the regular-file blob an
      ADMITTED revision records at the same path (declared git ls-tree vs hash-object --no-filters --stdin of the read
      bytes); every catalog parse (projection receipt_contract x2; readback receipt_contract, review_contract locator x4)
      uses that one retained payload. Anchors, never the current HEAD: projection = the declared input -e br_source_commit,
      with the checkout asserted clean at exactly it; readback = R's source.commit, R being admitted by -e
      brr_receipt_sha256 (bytes READ bound before parse) and written by a projection that asserted HEAD == br_source_commit.
      The catalog declares no digest of itself (no admission cycle). A hard-coded shape gate follows each bind.
    regression: 'project_bootstrap_receipt.yml 9ce65b27 (:297, :314) and readback_bootstrap_receipt.yml e98fd577 (:108, :368-371) parsed the catalog through lookup(''file'') re-reads bound to nothing'
    # DISPOSABLE ONLY (E92 disposable_bindings / E93 construction): each variant keeps `git status --porcelain` empty in
    # {C_d} (skip-worktree on the DISPOSABLE index, .git/info/exclude, disposable commits), so a refusal is credited to the
    # catalog bind, never to a dirty-checkout clause. The live checkout, its index, .work and catalog are never touched.
    disposable_bindings:
      inherits: 'E93-loader-catalog-read-bound-to-source-blob.disposable_bindings ({C_d}, {CAT_d}, {SC_d}, {label_d}, {ctl_d}, {R_d}, {sha_R_d})'
      '{Rh_d}': 'a HAND-WRITTEN disposable R (0400) under {C_d}/.work/<sub_roots.run>/<runners.bootstrap_receipt>/<fresh label>/managed-bootstrap-receipt.yml, the E87 positive R with only source.* changed as the variant says; {sha_Rh_d} = its sha256 (the readback admits R by the -e digest only)'
    launch:
      projection: '{C_d} seed run-local {root_d} bootstrap_receipt -e br_label={label_d} -e br_source_commit={SC_d}'
      readback: '{C_d} seed run-local {root_d} bootstrap_receipt_readback -e brr_label={label_d} -e brr_receipt={R_d} -e brr_receipt_sha256={sha_R_d} (or {Rh_d} / {sha_Rh_d} where the variant says)'
    variants:
      mismatch-hidden-edit: 'both runners: {CAT_d} bytes changed and hidden with skip-worktree; {SC_d} / R source.commit = the unmodified commit'
      absent-worktree: 'both runners: {CAT_d} removed and hidden with skip-worktree'
      absent-commit: 'projection: {SC_d} = a disposable commit without <rel>, the original bytes restored untracked + excluded; readback: {Rh_d} with source.commit = that commit (a genuine R cannot carry it: the projection refuses first)'
      malformed-syntax: 'projection: {SC_d} = a disposable commit whose catalog is invalid YAML; readback: {Rh_d} with source.commit = that commit'
      malformed-shape: 'as malformed-syntax with a YAML list catalog; sub-variant: review_contract missing'
      projection-anchor-absent: 'projection without -e br_source_commit'
      projection-anchor-not-head: 'projection with br_source_commit = the parent of HEAD of {C_d} (clean checkout)'
      readback-anchor-unadmitted: '{Rh_d} with source.worktree_clean false; sub-variant: source.commit not 40 hex'
      # READBACK-SOURCE-ANCHOR-NATIVE-TYPES (codex-tick371): separate negatives, one per coercion the bind no longer does
      readback-anchor-clean-numeric: '{Rh_d} with source.worktree_clean: 1 (a YAML int; source.commit the genuine clean commit)'
      readback-anchor-clean-string: '{Rh_d} with source.worktree_clean: "true" (a quoted YAML string; source.commit the genuine clean commit)'
      readback-anchor-commit-nonstring: '{Rh_d} with source.commit an UNQUOTED 40-digit decimal scalar with a leading 1-9 digit (a YAML 1.1 int -- a leading 0 with an 8/9 would stay a string; every digit is also hex, so a string coercion would match the 40-hex pattern); worktree_clean true'
      replaced-at-read: 'TOCTOU leg (E92 grammar, both runners): hold the FIRST openat of {CAT_d} by the playbook (the RX-CATALOG-READ slurp), rename-replace {CAT_d} with other bytes, thaw'
    expect:
      - 'positive (E87 / E88 positive on {C_d}): both bind and shape tasks PASS; R and readback.yml are byte-for-byte what they were before this change for the same inputs; strace of the playbook shows exactly ONE openat of {CAT_d} (no re-read after the bound slurp)'
      - 'mismatch-hidden-edit: REFUSED at "RX-CATALOG-READ -- bind the catalog bytes READ to the blob the admitted br_source_commit records BEFORE parsing" (projection) / "RX-CATALOG-READ -- bind the catalog bytes READ to the blob R''s admitted source.commit records BEFORE parsing" (readback), on the object-id equality clause'
      - 'absent-worktree: REFUSED at the same bind task on the content-defined clause'
      - 'absent-commit: REFUSED at the same bind task on (_l | length) == 1'
      - 'malformed-syntax: the task "RX-CATALOG-READ -- the bound catalog is one mapping with every top-level section (criteria hard-coded, not read from it)" FAILS in templating (no fail_msg: match on the task NAME); the bind before it PASSED'
      - 'malformed-shape: REFUSED at that shape task (fail_msg MALFORMED CATALOG)'
      - 'projection-anchor-absent / projection-anchor-not-head: REFUSED RH-BOOTSTRAP-RECEIPT-PROJECTION at the projection bind task on the br_source_commit / HEAD clauses (once C1 declares br_source_commit, the seed''s own required_inputs check may refuse projection-anchor-absent FIRST: then the expected refusal is that seed refusal and the bind clause is not reached -- record which)'
      - 'readback-anchor-unadmitted: REFUSED RH-BOOTSTRAP-RECEIPT-READBACK at the readback bind task on the source clauses'
      - 'readback-anchor-clean-numeric / readback-anchor-clean-string: REFUSED RH-BOOTSTRAP-RECEIPT-READBACK at the readback bind task on the clause `_r.source.worktree_clean is sameas true` (before codex-tick371 the `| bool` conversion PASSED both: that is the regression each discriminates, separately)'
      - 'readback-anchor-commit-nonstring: the ls-tree task is SKIPPED (its when requires a native string) and REFUSED RH-BOOTSTRAP-RECEIPT-READBACK at the readback bind task on `_r.source.commit is string` (before, `| string` coerced the int and the pattern matched)'
      - 'replaced-at-read: REFUSED at the runner''s bind task on the object-id equality clause (the slurp read the replacement); post: no R / no readback label dir written'
    expect_all:
      - 'every negative: exit non-zero, nothing written (no R, no readback label dir); a refusal at an earlier task (admission, label reuse, the toolchain / R / bundle-manifest payload binds), at "Refuse every claim that its independent measurement does not reproduce (nothing is written before this)", or a PASS is a FAILED control'
      - 'undo runs unconditionally; no production path opened for write'
