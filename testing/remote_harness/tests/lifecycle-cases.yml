---
# testing/remote_harness/tests/lifecycle-cases.yml -- setup / reapply / recovery case DECLARATIONS (T01-T28 kept)
# plus the seed controls required by codex-tick119 (S01-S05), codex-tick121 (SEED-01..08 -> C01-C22) and codex-tick127
# (genesis, python_policy, B_route_seams S1-S6 -> D01-D20) and codex-232353/232517 (SEED2-* and SEED-06 tool integrity
# -> E01-E16), codex-000010/000256 + G-0012 (acquisition sources, M1-STAGING-RECOVERY, M1-TRANSPORT-COMPOSITION,
# seed root-staging race -> E20-E24), codex-tick138/139 (writer quiescence, publish fence, cold acquisition -> E25-E30,
# D04a-D04d), C1's SEED-06 projection (file_sha256 executable identity -> E31), and codex-tick144 / codex-014047 /
# codex-tick145 (r3f: canonical tool overrides, publication authority, declared inputs, contended KAT, writer
# containment -> E32-E37; consumer interface revision 4), and codex 023332 (r3g: transport composition remainders ->
# E38-E39; PER-HOST-SCOPE-CONTRACT -> E40-E43 on C1's field contract 033500; coordinator B step 2 per-class
# publication -> E44-E47 and E49; consumer interface revision 5, resolver_outputs -> E48; codex 035141 declared
# endpoint rule -> E39).
#
# Case ids are stable; controls (testing/remote_harness/tests/controls + tests/run_controls.yml, owned by G) map onto them and
# keep no parallel list. `ran_by_author` marks the only ones executed so far (render/syntax level, no install).
#
# Seed interface (G drives it as a black box; MAIN runs every case that installs):
#   acquire: ansible-playbook -i <inv> testing/remote_harness/acquire.yml   (MAIN; declared builder; rh_artifact_source,
#            rh_acquisition_receipt = receipt file OUTSIDE the store)
#   bundle:  ansible-playbook -i <inv> testing/remote_harness/package.yml   (declared builder; rh_artifact_source, rh_bundle_dir)
#   seed:    <bundle>/lme-controller-seed.sh apply|verify --root R | purge --root R --confirm R
#            | run --root R --ssh-auth <explicit_key|agent|tailnet_identity> -- <args>
#   target:  seed run ... -- -i <inv> testing/remote_harness/target_bootstrap.yml (group lme_toolchain_targets)
#   Refusals: stderr 'REFUSED <code> <detail>', exit status = controller.bootstrap.refusals[<code>] (BUSY = 15, AUTH = 16);
#             playbook-level refusals: assert messages 'REFUSED <code>' with <code> from controller.bootstrap.playbook_refusals
#             (RH-ACQUIRE, RH-BUILDER-UNSUPPORTED, RH-PACKAGE-ARTIFACT, RH-PACKAGE-STAGED-MISMATCH, RH-STAGING-BUDGET,
#             RH-STAGING-LEASE, RH-STAGING-BUSY, RH-OS-TOOL-IDENTITY, RH-POLICY-UNRESOLVED, RH-DERIVED-OUTPUT-PINNED,
#             RH-CONTROLLER-TOOLCHAIN-UNSUPPORTED, RH-TRANSPORT-AUTH, RH-TARGET-BOOTSTRAP, RH-STAGING-REVOKED,
#             RH-POLICY-INPUT-CONFLICT, RH-OS-TOOL-MISSING).
#   Policy (SEED-06): every entrypoint resolves through the engine; stdout RH-POLICY policy_sha256=<hex>
#          lme_resolved_revision=<hex> overridden_paths=[<dotted leaves>] (audit, not revision-bound). A BUSY refusal is never counted
#             as executed coverage.
#   Outcomes: INSTALLED|UNCHANGED|VERIFIED <generation-id> <generation-dir>, PURGED|ABSENT <root>,
#             stderr REPLACING-INCOMPLETE <generation-id> <op-id>.
#   State: <R>/.lme-controller-root, <R>/active-generation, <R>/active-toolchain.json, <R>/operations.log,
#          <R>/generations/<id>/{COMPLETE,.operation,ansible.cfg,receipts/{phases.tsv,artifacts.sha256,
#          installed-inventory.txt,ansible-playbook-version.txt,tree.sha256,tree.list,pins.txt,toolchain.json}},
#          <R>/check/{verify.log,<utc>.XXXX/}, <R>/run/<utc>.XXXX/ (newest keep-1 retained per run), <R>/abandoned/.
#   Staging (never under a final name): <parent>/.<root>.creating.<op>, <R>/generations/.creating.<op>,
#          <bundle parent>/.<bundle>.staging.<lease>.<random> (package.yml and target extraction; <lease> =
#          L<machine>-<boot>-<uid>-<pid>-<start> of the reserving controller ansible-playbook process), its lease
#          record <bundle parent>/.<bundle>.lease.<lease> (JSON lme-staging-lease/1: machine, boot, uid, pid, start,
#          pidns, cgroupns, cgroup_b64; mode 0400; written before the reservation, released after publish/release) and
#          the persistent destination lock <bundle parent>/.<bundle>.lock (never reaped). A staging dir is renamed to
#          .<bundle>.reaping.<lease>.<random> and removed by a later attempt ONLY when its writers are PROVABLY
#          QUIESCENT (controller: holder absent/restarted AND run cgroup gone or cgroup.events `populated 0` -- the
#          whole subtree -- in an admitted pid+cgroup namespace view; target: the owner's root-owned user slice holds
#          only session scopes and user@<uid>.service, and every session scope but the reaper's own is `populated 0`)
#          -- every reap mutation and every publish rename under flock on the destination lock (bundle.staging_retention;
#          task names declared there). The flock known answers run on a PRIVATE scratch lock (tempfile, suffix
#          lease.kat_lock_suffix), never on the destination lock. PUBLICATION AUTHORITY (lease.authority): a run may
#          publish only its own token-named staging path, by a no-replace rename (mv -T -n) under the destination lock;
#          a revoker (recovery / teardown / retirement) renames that staging away under the same lock, so a resumed old
#          writer's rename finds no source -> REFUSED RH-STAGING-REVOKED, and a present successor is never replaced.
#          Landed iff rc 0 AND the source is gone (mv -n exit status on skip varies by coreutils version).
#   Stderr (apply): REMOVED-STALE-ROOT-STAGING <path>, PRESERVED-UNKNOWN <path>; package.yml: PUBLISHED | UNCHANGED;
#   stdout (package / target reap): REAPED-STAGING <host> [<reaped dirs>] records [<records>][; PRESERVED-BUSY-STAGING
#          <host> [<entries>] (destination lock busy)], and when anything is preserved: PRESERVED-LIVE-STAGING <host>
#          [<paths>]; PRESERVED-BUSY-STAGING <host> [<paths>] (target writers not provably quiescent);
#          PRESERVED-UNKNOWN-STAGING <host> [<paths>]; recorded owners (machine, uid): [...].
#   stdout (acquire): ACQUIRED store_empty_before=<bool> fetched=<n> reused=<n> cold_qualified=<bool> receipt=<path>;
#          receipt JSON (lme-acquisition-receipt/1): schema, observed_at_utc, store, store_empty_before,
#          store_entries_before, store_foreign_entries, profile_sha256, lock_sha256, builder_uid,
#          rows [{file, url (declared origin), sha256 (declared digest), disposition fetched|reused}], cold_qualified.
#   Generation id: core<core>-py<python>-uv<uv>-<first 12 hex of sha256(seed bytes)>.
#   Throwaway roots: under an OWNED, non-group/other-writable directory (e.g. a $HOME subdirectory); /tmp and other
#   sticky world-writable ancestors are refused (RH-SEED-ROOT-NOT-OWNED) by declaration.
#   Fixture generation for B's local controls: the REAL seed from a real bundle, run by MAIN against a throwaway
#   root (C01); B's inventory then points lme_toolchain_root / lme_toolchain_owner at it. No stub verifier.
schema_version: 3
seed_bindings:
  - {id: T01-fresh-setup, run: 'package.yml -> seed apply --root <absent root, owned admitted parent>', expect: [stdout INSTALLED, '<gen>/COMPLETE names <gen>', operations.log start+complete lines, active-toolchain.json == receipts/toolchain.json, 'startup_files_unchanged unchanged']}
  - {id: T02-unchanged-reapply, run: 'seed apply --root <same> (same bundle)', expect: [stdout UNCHANGED, same generation id, receipts/* and tree unchanged (sealed a-w), operations.log unchanged line]}
  - {id: T04-interrupted-setup-recovery, pre: 'kill apply after any phase before `complete`', run: 'seed apply --root <same>', expect: [stderr REPLACING-INCOMPLETE <gen> <op>, stdout INSTALLED, 'abandoned/ holds nothing this seed recorded', active-toolchain.json never named the incomplete generation]}
  - {id: T06-preexisting-root-refused, pre: 'root exists without marker, marker for another uid, root mode != 700, root is a symlink, parent owned by another uid', expect: 'REFUSED RH-SEED-ROOT-NOT-OWNED (8), nothing created'}
  - {id: T11-unsupported-controller-refused, pre: ['declaration copy with python.major_minor outside core_supported_python', 'non-x86_64 / non-glibc / glibc < 2.28', 'controller.yml under an ambient ansible-playbook'], expect: ['REFUSED RH-SEED-UNSUPPORTED-COMBINATION (4)', 'REFUSED RH-SEED-UNSUPPORTED-PLATFORM (5)', 'refused at "Refuse any executor that is not the declared root''s managed generation" (or earlier at the receipt checks)']}
  - {id: T12-storage-required-refused, pre: 'free bytes < budget.free_required_bytes, or generation > budget.generation_max_bytes', expect: 'REFUSED RH-SEED-STORAGE (9)'}
  - {id: T22-footprint-recorded, expect: ['du bytes checked against generation_max_bytes', 'every mode ran inside a user scope whose memory.max/cpu.max/pids.max equal the budget (else RH-SEED-BUDGET-UNAVAILABLE, 7)']}
  - {id: T23-uv-partial-interrupt, pre: 'kill apply during phase uv-install', expect: same as T04}
  - {id: T24-uv-installed-digest-mismatch, pre: ['installed uv/uvx differs from the pinned archive member', 'installer does not embed the declared archive digest'], expect: ['REFUSED RH-SEED-IDENTITY-MISMATCH (13), no COMPLETE', 'REFUSED RH-SEED-DIGEST-MISMATCH (11) before any generation directory exists']}
  - {id: T25-ambient-ansible-hidden, expect: ['every seed step runs under env -i with the declared PATH and declared absolute executables', 'no ambient uv/python/ansible is invoked', 'ambient /usr/bin/ansible-playbook untouched']}
  - {id: T26-offline-precheck-before-effect, pre: ['one declared artifact absent from rh_artifact_source', 'one with a different sha256'], expect: ['package.yml refuses naming every missing and every differing file before creating the bundle', 'seed: REFUSED RH-SEED-ARTIFACT-MISSING (10) / RH-SEED-DIGEST-MISMATCH (11) with no generation directory', no network use]}
  - {id: T27-cpython-member-compare, expect: ['uv-installed python/<key>/bin/python3.13 cmp-equal to the admitted archive member and the tree equal to an independent unpack except python.uv_patched_rel, else RH-SEED-IDENTITY-MISMATCH (13) (see C-PY)']}
  - {id: T28-purge-rebuild, run: ['seed purge --root R --confirm R', 'seed apply --root R', 'seed apply --root R'], expect: [PURGED R (inside the budget scope, under the lock), INSTALLED with the SAME generation id, UNCHANGED, only R removed]}
  - {id: T05-preexisting-account-refused, applies: target harness only (later slice)}
  # codex-tick119
  - {id: S01-clean-seed-closure, check: static, expect: ['os_tools has no transfer tool', 'transfer.adapter controller end provided_by managed_generation with os_tools []', 'selected adapter target packages in packages.required']}
  - {id: S02-receipt-custody, pre: ['published receipt edited / symlinked / chmod g+w', 'receipt root or owner differs from inventory'], expect: 'verify_toolchain_receipt.yml refuses (custody or identity assert); seed verify refuses GENERATION-DRIFT (14)'}
  - {id: S03-altered-executable, pre: 'in a THROWAWAY root: chmod u+w and alter venv/bin/ansible-playbook, uv or python3.13', run: 'verify_toolchain_receipt.yml as the owner and as root', expect: ['refused at "Refuse a receipt that is not the expected installation"', nothing written under the root]}
  - {id: S04-wrong-collections-path, run: 'controller.yml with ANSIBLE_COLLECTIONS_PATH or ANSIBLE_CONFIG unset/different', expect: refused at the executor binding}
  - {id: S05-undeclared-root-refused, run: 'controller.yml without lme_toolchain_root / lme_toolchain_owner', expect: 'refused at "Admit the declared root and owner"'}
  # codex-tick121
  - {id: C01-cold-bootstrap-fixture, finding: [SEED-01, SEED-08], run: ['package.yml from declared prerequisites', 'seed apply on a throwaway root', 'seed run -- controller.yml'], expect: ['INSTALLED; install smoke proves `config file = <gen>/ansible.cfg`', 'ansible-galaxy collection install ran with that config', 'controller.yml passes under `seed run`', 'no ambient ansible after package.yml (genesis executor recorded in bundle.json)']}
  - {id: C02-config-dev-null-refused, finding: SEED-01, ran_by_author: 'yes (ambient core 2.19.11 --version)', expect: ['ANSIBLE_CONFIG=/dev/null -> "Unsupported configuration file extension"', 'ANSIBLE_CONFIG=<file rendered from ansible_config_content> -> starts, reports that config file']}
  - {id: C03-concurrent-apply-apply, finding: SEED-02, run: two applies on one root at once, expect: 'second REFUSED RH-SEED-BUSY (15); first completes; no generation moved or deleted'}
  - {id: C04-concurrent-apply-purge, finding: SEED-02, run: purge during apply, expect: 'REFUSED RH-SEED-BUSY (15); install unaffected'}
  - {id: C05-run-holds-lock, finding: SEED-02, run: 'apply while `seed run` executes a playbook', expect: 'REFUSED RH-SEED-BUSY (15)'}
  - {id: C06-interrupt-build-and-publication, finding: SEED-02, pre: ['kill during install', 'kill between COMPLETE and publication'], expect: ['next apply: REPLACING-INCOMPLETE (install case) or UNCHANGED + republish (publication case)', 'one generation id, no duplicate', 'verify fails until publication is complete']}
  - {id: C07-unrecorded-incomplete-preserved, finding: SEED-02, pre: 'incomplete generation dir without .operation, or whose op is not in operations.log', expect: 'REFUSED RH-SEED-ROOT-NOT-OWNED (8); the directory and every unrelated abandoned/ entry preserved'}
  - {id: C08-ancestry-refused, finding: SEED-02, pre: ['root under /tmp (sticky world-writable)', 'ancestor group-writable', 'ancestor symlink', 'ancestor owned by another non-root uid'], expect: 'REFUSED RH-SEED-ROOT-NOT-OWNED (8) before any write; verify_toolchain_receipt.yml refuses the same roots'}
  - {id: C09-revision-converges, finding: SEED-03, pre: 'same pins, changed seed input (managed_env, layout name, os_tools path or ansible_config_content)', run: [package.yml, seed apply], expect: ['INSTALLED with a NEW generation id', 'previous generation retained, no longer active', 'controller.yml passes on the new one and refuses the old receipt']}
  - {id: C10-pointer-and-receipt-required, finding: SEED-03, pre: ['delete active-generation', 'write another id into it', 'delete or edit active-toolchain.json'], expect: 'seed verify REFUSED RH-SEED-GENERATION-DRIFT (14) in every case; verify_toolchain_receipt.yml refuses too'}
  - {id: C11-manifest-member-confined, finding: SEED-04, pre: 'tree.sha256 gains a member /etc/shadow, ../x, python/../../x or a device path', expect: 'refused at "Confine every checksum-manifest member" and by the seed before sha256sum reads it'}
  - {id: C12-link-retarget-and-mode, finding: SEED-04, pre: ['retarget venv/bin/python', 'chmod a mode inside a sealed tree'], expect: 'refused at "Refuse changed types, modes, sizes or link targets"'}
  - {id: C13-forged-self-consistent, finding: SEED-04, pre: ['(a) owner rewrites receipt + tree.sha256 + tree.list consistently after altering a DECLARATION-PINNED member (the seed or a bundle artifact, whose sha256 the profile/lock rows fix; which installed members carry a declaration pin is what C13a enumerates)', '(b) the same for owner-mutable content no declaration pins'], expect: ['(a) C13a REFUSED: the expected identity comes from the canonical declarations and a fresh render (seed_sha256, generation id, artifact rows), which are OUTSIDE the rewritten receipt/manifest set; rewriting the receipt cannot redefine the pin', '(b) C13b NOT a PASS and not a closed integrity finding: recorded as the declared trust boundary (owner_trust: the owner account is the code authority; owner-only reading and execution kept, no privileged verification). If a consumer promises independent provenance for such content, the gap stays OPEN until it has an independent expected identity'], note: 'codex-001716 Q-C13; G binds C13a and C13b as two named controls'}
  - {id: C14-changed-canonical-pins, finding: SEED-04, pre: 'declarations change (new pin) without re-running package/apply', expect: 'refused: expected generation (fresh render) != receipt generation'}
  - {id: C15-receipt-replaced-between-reads, finding: SEED-04, pre: 'swap active-toolchain.json between the stat and slurp tasks', expect: 'refused: published bytes != sealed bytes or identity mismatch (single slurp is what is parsed)'}
  - {id: C16-pinned-derived-output, finding: SEED-05, run: 'controller.yml / package.yml / acquire.yml / target_bootstrap.yml with -e <name>=x for EACH name in C1''s registry list (manifests/global.yml lme_config_registry.remote_harness_schema.reserved_outputs) and rh_repo_root; and with a global.yml lacking that list', expect: ['refused at "Refuse pre-supplied harness derived outputs" (REFUSED RH-DERIVED-OUTPUT-PINNED) before any render or execution', 'missing/empty registry list: refused (never an empty guard)', 'a declaration still carrying controller.bootstrap.derived_outputs: refused by the C1 projection (retired path)'], ran_by_author: 'templar (r3e) against C1 seed06 global.yml: nothing pinned passes; _rh_lease_self, rh, rh_repo_root pinned refuse; no registry list refuses; not executed', note: 'r3e adds 21 internal names that C1 must add to reserved_outputs in the joint slice (listed in the r3e announcement); until then those 21 are unguarded'}
  - {id: C17-supported-inputs-compose, finding: SEED-05, run: 'inventory lme_toolchain_root/_owner, rh_artifact_source/rh_bundle_dir', expect: guard passes}
  - {id: C18-resolver-projection, finding: SEED-06, status: 'consumer switched in r3e (interface revision 3); C1 source seed06 94ab131 lands in the same slice; acceptance open', expect: ['every entrypoint: rh = lme_resolved.remote_harness.policy, rh_config_revision = its policy_sha256, rh_engine_revision = lme_resolved_revision (which binds the section)', 'an admitted override (registry tunable path, declared leaf type; a path together with its identity) changes rh, policy_sha256 and lme_resolved_revision and is listed in RH-POLICY overridden_paths', 'a non-tunable or type-changing override, a path override without identity, or a retired path: refused by the projection before any harness task', 'an engine without the section: REFUSED RH-POLICY-UNRESOLVED (no raw-profile fallback)'], ran_by_author: 'r3e profile projected through C1''s lme_project_remote_harness (Python call, seed06 filter): admitted; sha256sum.path override without identity refused; with identity admitted and audited; resolve_policy expressions templar-tested; not executed'}
  - {id: C19-tool-path-drives-invocation, finding: SEED-07, ran_by_author: yes, run: 'render with os_tools.sha256sum.path changed', expect: 'every sha256sum invocation line in the seed changes, not only the presence check'}
  - {id: C20-no-committed-generated-source, finding: SEED-07, ran_by_author: yes, expect: 'no lme-controller-seed.sh (or other non-YAML/Jinja file) under testing/remote_harness'}
  - {id: C21-missing-os-tool-refused, finding: SEED-08, pre: 'a declared os_tools path absent, or base PATH resolving a different file for a uv_installer tool', expect: 'REFUSED RH-SEED-OS-TOOL-MISSING (6) naming it'}
  - {id: C22-purge-then-cold, finding: SEED-08, run: ['seed purge', 'seed apply', 'seed run -- controller.yml'], expect: 'same generation id; no hand-built env; no ambient ansible'}

  # codex-tick127 (genesis, python_policy, B_route_seams)
  - {id: D01-builder-admitted-exactly, finding: genesis, run: 'package.yml / acquire.yml on the declared builder, then with each deviation', pre: ['ANSIBLE_CONFIG set, or ./ansible.cfg | ~/.ansible.cfg present', 'an ANSIBLE_* variable outside env_allow', 'another ansible-playbook (venv/pipx) or python', 'root'], expect: ['declared builder: passes; bundle.json.builder records executable/python digests, core, package dir', 'each deviation: REFUSED RH-BUILDER-UNSUPPORTED before any write (bundle dir absent)']}
  - {id: D02-source-identities-recorded, finding: genesis, expect: ['bundle.json.source.repo_head = git rev-parse HEAD', 'source.inputs digests equal sha256 of profile, lock, template, macros, package.yml, builder tasks, engine filter plugins', 'worktree_dirty reflects git status of the bound paths']}
  - {id: D03-ansible-free-consumer, finding: genesis, run: 'copy the bundle to a host WITHOUT ansible; sha256sum --check bundle.sha256; seed apply', expect: ['check passes', 'seed runs with only os_tools', 'a flipped byte in any artifact or the seed fails the check']}
  - {id: D04-acquire-declared-only, finding: [genesis, codex-000010], pre: ['a lock or profile row without url', 'a lock row whose url does not end in its file name', 'present file with another digest'], expect: ['row without url: ONE REFUSED RH-ACQUIRE naming each, before any fetch, even when the file is present (no manual placement as a source)', 'url/file mismatch: REFUSED RH-ACQUIRE before any fetch', 'present + other digest: REFUSED RH-ACQUIRE before any fetch, never overwritten'], note: 'Q-D04-COLD-START answered by codex-tick138 = (a): D04a-D04d below; lock urls are the tick112 plan rows verbatim; unexecuted by the author (no downloads)'}
  - {id: D04a-acquire-cold-qualification, finding: [genesis, codex-tick138 Q-D04-COLD-START=a], pre: 'a FRESH, EMPTY directory owned by the builder (not group/other-writable) as rh_artifact_source -- G asserts emptiness before the run; rh_acquisition_receipt outside it in an owned dir', run: ['acquire.yml', 'package.yml from that store'], expect: ['stdout ACQUIRED store_empty_before=True fetched=<artifact_count> reused=0 cold_qualified=True receipt=<path>', 'receipt: store_empty_before true, store_entries_before [], store_foreign_entries [], every row disposition fetched with its declared url and sha256, cold_qualified true', 'every row fetched by get_url from its declared url, sha256-pinned; MAIN placed nothing', 'package.yml from that store yields a bundle byte-identical to one built from any other admitted store of the same declarations'], ran_by_author: 'templar (r3e): receipt expressions (cold, warm, mixed, stray temp), post-fetch assert, receipt path admission; not executed (no downloads)'}
  - {id: D04b-acquire-warm-reapply, finding: [genesis, codex-tick138], pre: 'the D04a store, unchanged', run: 'acquire.yml again (no network needed)', expect: ['stdout ACQUIRED store_empty_before=False fetched=0 reused=<artifact_count> cold_qualified=False', 'every row disposition reused; nothing fetched or rewritten: the store snapshot (names, bytes, inode/mtime of every row) is unchanged -- the receipt lives outside the store', 'a store prefilled by hand with digest-correct files gives the same reused receipt and can never produce cold_qualified']}
  - {id: D04c-acquire-mismatch-and-interruption, finding: [genesis, codex-tick138], pre: ['present-other-digest: one declared row present with another digest', 'interrupted-download: kill acquire.yml during a get_url fetch (G: MAIN-only, network)', 'declared url serving other bytes (a copy of the declarations with one wrong sha256)'], expect: ['present-other-digest: REFUSED RH-ACQUIRE before any fetch; the file preserved', 'interrupted-download / served digest mismatch: the declared row name never appears in the store (get_url checks the sha256 BEFORE atomic_move; on mismatch it removes its temp)', 'a killed module skips cleanup: a stray mkstemp temp may remain in the module tmpdir, or a `.ansible_tmp*` file in the store when tmpdir and store are on different filesystems (atomic_move copy path); it is never a declared row name, the next receipt lists it in store_foreign_entries and it disqualifies cold qualification (it is never deleted by acquire)', 'retry: the absent row is fetched and converges; declared rows byte-identical to D04a'], note: 'get_url/atomic_move behaviour is SOURCE-READ ONLY (ansible 2.19.11 modules/get_url.py, module_utils/basic.py atomic_move), not executed'}
  - {id: D04d-offline-packaged-path, finding: [genesis, codex-tick138], expect: ['offline profiles never run acquire.yml: they consume a packaged bundle (package.yml output transferred as a unit); the cold/warm acquisition controls do not apply to them', 'package.yml itself stays offline (T26)']}
  - {id: D05-git-missing-refused, finding: [genesis, S6], pre: 'os_tools.git.path absent', expect: ['package.yml refuses at "Refuse a missing source-binding tool" (RH-BUILDER-UNSUPPORTED) before any write -- NOT RH-OS-TOOL-IDENTITY: the identity check judges PRESENT files only (r3f, G-0205 D05 ordering)', 'any OTHER absent controller tool: REFUSED RH-OS-TOOL-MISSING naming it and its package, after the git check and before the first git run', 'seed apply/verify/run unaffected (git not required_by seed)']}
  - {id: C-PY-uv-managed-interpreter, finding: python_policy, run: 'seed apply (fresh root) with the pinned uv 0.12.18', expect: ['uv python install uses ONLY <gen>/tmp/python-downloads.json (file:// into the bundle, admitted sha256)', 'install dir holds only the declared key + declared bookkeeping names', 'ELF cmp-equal to the archive member; tree differs only in uv_patched_rel', 'python -I reports CPython 3.13.15 with base_prefix = <gen>/python/<key>', 'no bin link, no ambient discovery, no network (run with networking denied)'], qualifies: [python.install_dir_bookkeeping, python.uv_patched_rel, python.minor_link (absent, or a link resolving to installed_rel), downloads-JSON field set]}
  - {id: D06-python-wrong-build-refused, finding: python_policy, pre: ['python_archive replaced by another build with its digest updated in a copy of the declarations', 'downloads JSON digest altered'], expect: 'uv install fails or RH-SEED-IDENTITY-MISMATCH (13); never another interpreter, never online'}
  - {id: D07-target-bootstrap-cold, finding: S1, run: 'seed run --ssh-auth <mode> -- target_bootstrap.yml on trixie then graph (owner account, SSH session)', expect: ['bundle transferred by the managed archive adapter (no rsync)', 'target readback == controller bundle; seed apply INSTALLED', 'target receipt generation == controller bundle expected_generation', 'nothing owned by root created']}
