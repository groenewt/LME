---
# testing/remote_harness/tests/tasks/bind_probe_executor.yml -- the ONE nested-probe executor binding of G's local
# runners (loader_integration, acceptance) and of control executor.nested.resolved-run (RH-NESTED-PROBE-EXECUTOR,
# codex 143844; RH-RUNNER-RESOLVED-WORKROOT, codex 144541). A nested `env -i ... ansible-playbook` probe runs the
# executor the seed resolved for this run, with the resolved environment -- never an ambient /usr/bin/ansible-playbook,
# never a PATH lookup, never a /tmp fallback, never a value re-derived from raw profile bytes.
#
# Input contract (route author; `seed run-local` passes it as its final JSON -e and refuses a caller-supplied one):
#   lme_resolved_run: {runner, work_root, ansible_playbook, python, env: {NAME: value, ...}, receipt: {path, sha256}}
# Caller input (include var): bpe_runner -- the runner key the calling playbook IS (acceptance, loader_integration).
# Outputs: bpe_receipt, bpe_exec, bpe_env_tool, bpe_env_fixed, bpe_work_root, bpe_identity. Per-probe argv: probe_argv.yml.
# The identity act runs in <lme_resolved_run.work_root>/_executor-identity (so a resolved work root is observably consumed).
#
# What is enforced (and nothing stronger):
#   - lme_resolved_run is present and well formed, names THIS runner, and its receipt file has exactly receipt.sha256;
#   - that receipt names lme_resolved_run.ansible_playbook / .python, and the executable's digest equals the receipt's;
#   - THIS play runs that generation (resolve_harness.yml's five conditions: core, interpreter, ANSIBLE_CONFIG,
#     ANSIBLE_COLLECTIONS_PATH, loaded config file -- against the receipt);
#   - THIS play's environment carries every lme_resolved_run.env item unchanged (an ambient TMPDIR, cache or
#     engine-storage value that differs refuses). PATH is NOT a listed item (the producer lists path-valued names only):
#     a record whose env carries PATH is REFUSED at the first task; an AMBIENT PATH is not refused, and cannot select
#     the executor: argv[0] after `env -i` is the absolute lme_resolved_run.ansible_playbook and the nested PATH is
#     fixed (probe_argv.yml);
#   - the nested env is exactly lme_resolved_run.env plus the per-probe PATH / HOME / ANSIBLE_HOME / TMPDIR / TMP / TEMP /
#     ANSIBLE_LOCAL_TEMP / ANSIBLE_REMOTE_TMP (probe_argv.yml); the identity act proves the nested env executes the
#     receipt's executable, config, collections and interpreter.
# Not enforced here: the route's independent fresh-render receipt verification (verify_toolchain_receipt.yml); under
# run-local the seed runs `verify` at launch. The scrub tool is /usr/bin/env (the declared os_tools.env default; the
# contract carries no env-tool field, and this helper reads no raw profile bytes).

- name: Refuse an absent or malformed resolved run, or pre-supplied binding outputs (RH-RUNNER-RESOLVED-WORKROOT)
  vars:
    _bpe_reserved: '^(bpe_receipt|bpe_exec|bpe_env_tool|bpe_env_fixed|bpe_work_root|bpe_identity|bpe_argv|bpe_extra_env|bpe_case_dir|bpe_args)$'
    _r: "{{ lme_resolved_run | default(none) }}"
  ansible.builtin.assert:
    that:
      - query('ansible.builtin.varnames', _bpe_reserved) | length == 0
      - _r is mapping
      # EXACTLY the declared key sets (profile run_local.resolved_run.fields / receipt_fields; the same check as C1 a0e341e)
      - (_r | list | sort) == ['ansible_playbook', 'env', 'python', 'receipt', 'runner', 'work_root']
      - _r.runner is string and _r.runner == bpe_runner
      - _r.work_root is string and _r.work_root is match('^/.*[^/]$') and _r.work_root is not search('(^|/)\.\.?(/|$)')
      - _r.ansible_playbook is string and _r.ansible_playbook is match('^/')
      - _r.python is string and _r.python is match('^/')
      - _r.env is mapping and 'TMPDIR' in _r.env
      # PATH is never a resolved env item (the producer lists path-valued names only; the nested PATH is fixed by
      # probe_argv.yml): a record carrying one is refused here, never silently overwritten (codex 152001 / tick171)
      - "'PATH' not in _r.env"
      - (_r.env | list | reject('match', '^[A-Z_][A-Z0-9_]*$') | list | length) == 0
      # env_value: absolute_path (every listed value is an absolute path; PATH/LC_ALL/flags are never listed)
      - (_r.env.values() | reject('string') | list | length) == 0
      - (_r.env.values() | reject('match', '^/') | list | length) == 0
      - _r.receipt is mapping and (_r.receipt | list | sort) == ['path', 'sha256']
      - _r.receipt.path is string and _r.receipt.path is match('^/')
      - _r.receipt.sha256 is string and _r.receipt.sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      REFUSED RH-RUNNER-RESOLVED-WORKROOT: lme_resolved_run is absent or malformed (needs EXACTLY {runner={{ bpe_runner }},
      absolute normalized work_root, ansible_playbook, python, env map NAME=absolute path incl. TMPDIR and never PATH, receipt EXACTLY {path, sha256}}),
      or a binding output was pre-supplied ({{ query('ansible.builtin.varnames', _bpe_reserved) }}). There is no raw-profile
      fallback: start the runner with `lme-controller-seed.sh run-local --root <checkout>/.work/toolchain --runner {{ bpe_runner }}`.
    quiet: true

- name: Stat the resolved receipt (no link)
  ansible.builtin.stat:
    path: "{{ lme_resolved_run.receipt.path }}"
    checksum_algorithm: sha256
    follow: false
  register: _bpe_rst

- name: Read the resolved receipt
  ansible.builtin.slurp:
    src: "{{ lme_resolved_run.receipt.path }}"
  register: _bpe_rbytes
  when: _bpe_rst.stat.exists and _bpe_rst.stat.isreg and _bpe_rst.stat.checksum == lme_resolved_run.receipt.sha256

- name: Bind the receipt
  ansible.builtin.set_fact:
    bpe_receipt: "{{ (_bpe_rbytes.content | b64decode | from_json) if (_bpe_rbytes.content is defined) else {} }}"
    bpe_work_root: "{{ lme_resolved_run.work_root }}"

- name: Digest the resolved ansible-playbook (the executable every nested probe runs)
  ansible.builtin.stat:
    path: "{{ lme_resolved_run.ansible_playbook }}"
    checksum_algorithm: sha256
    follow: false
  register: _bpe_xst

- name: Bind this play and the nested probe executor to the resolved run (RH-NESTED-PROBE-EXECUTOR)
  vars:
    _r: "{{ lme_resolved_run }}"
    _env_actual: "{{ query('ansible.builtin.env', *(lme_resolved_run.env | list)) }}"
  ansible.builtin.assert:
    that:
      - _bpe_rst.stat.exists and _bpe_rst.stat.isreg
      - _bpe_rst.stat.checksum == _r.receipt.sha256
      - bpe_receipt.ansible_playbook | default('') == _r.ansible_playbook
      - bpe_receipt.python | default('') == _r.python
      - _bpe_xst.stat.exists and _bpe_xst.stat.isreg
      - _bpe_xst.stat.checksum == bpe_receipt.ansible_playbook_sha256 | default('')
      # this play IS that generation (resolve_harness.yml's five conditions, against the receipt)
      - ansible_version.full == bpe_receipt.expect_core | default('')
      - ansible_playbook_python == _r.python
      - lookup('ansible.builtin.env', 'ANSIBLE_CONFIG') == bpe_receipt.ansible_config | default('')
      - lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') == bpe_receipt.collections_path | default('')
      - (ansible_config_file | default('')) == bpe_receipt.ansible_config | default('')
      # this play's environment carries every resolved env item unchanged (no ambient conflict)
      - _env_actual == (_r.env.values() | list)
    fail_msg: >-
      REFUSED RH-NESTED-PROBE-EXECUTOR: this play (core {{ ansible_version.full }} at {{ ansible_playbook_python }},
      ANSIBLE_CONFIG {{ lookup('ansible.builtin.env', 'ANSIBLE_CONFIG') }}, loaded config {{ ansible_config_file | default('none') }},
      ANSIBLE_COLLECTIONS_PATH {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') }}) is not the resolved run
      ({{ _r.ansible_playbook }}, {{ _r.python }}; receipt {{ _r.receipt.path }} digest {{ _bpe_rst.stat.checksum | default('absent') }}
      vs {{ _r.receipt.sha256 }}; executable digest {{ _bpe_xst.stat.checksum | default('absent') }} vs
      {{ bpe_receipt.ansible_playbook_sha256 | default('?') }}), or its environment differs from lme_resolved_run.env
      (resolved {{ _r.env }}; this play {{ dict(_r.env | list | zip(_env_actual)) }}).
    quiet: true

- name: Bind the nested probe executor and its environment (the resolved env; nothing ambient, nothing re-derived)
  ansible.builtin.set_fact:
    bpe_exec: "{{ lme_resolved_run.ansible_playbook }}"
    bpe_env_tool: /usr/bin/env
    bpe_env_fixed: "{{ lme_resolved_run.env }}"

- name: Compose the identity act (the same argv builder every nested probe uses)
  ansible.builtin.include_tasks: probe_argv.yml
  vars:
    bpe_case_dir: "{{ bpe_work_root }}/_executor-identity"
    bpe_args: [--version]
    bpe_extra_env: {}

- name: Run the identity act under the nested probe environment
  ansible.builtin.command:
    argv: "{{ bpe_argv }}"
    chdir: "{{ bpe_work_root }}/_executor-identity"
  register: _bpe_ver
  changed_when: false
  failed_when: false

- name: Parse the nested executor identity
  vars:
    _l: "{{ _bpe_ver.stdout_lines | default([]) | map('trim') | list }}"
  ansible.builtin.set_fact:
    bpe_identity:
      rc: "{{ _bpe_ver.rc }}"
      version_line: "{{ _l | first | default('') }}"
      config_file: "{{ _l | select('match', '^config file = ') | map('regex_replace', '^config file = ', '') | first | default('') }}"
      collection_location: "{{ _l | select('match', '^ansible collection location = ') | map('regex_replace', '^ansible collection location = ', '') | first | default('') }}"
      executable: "{{ _l | select('match', '^executable location = ') | map('regex_replace', '^executable location = ', '') | first | default('') }}"
      # block scalars: Jinja string literals are unicode-escape decoded, so a group reference is written \\1 here
      python: >-
        {{ _l | select('match', '^python version = .*\\([^()]+\\)$')
              | map('regex_replace', '^.*\\(([^()]+)\\)$', '\\1') | first | default('') }}
      python_version: >-
        {{ _l | select('match', '^python version = ')
              | map('regex_replace', '^python version = ([^ ]+).*$', '\\1') | first | default('') }}
      jinja: "{{ _l | select('match', '^jinja version = ') | map('regex_replace', '^jinja version = ', '') | first | default('') }}"
      pyyaml: "{{ _l | select('match', '^pyyaml version = ') | map('regex_replace', '^pyyaml version = ', '') | first | default('') }}"
      stdout: "{{ _bpe_ver.stdout | default('') }}"

- name: Refuse a nested probe environment that does not execute the resolved run's generation (RH-NESTED-PROBE-EXECUTOR)
  ansible.builtin.assert:
    that:
      - bpe_identity.rc | int == 0
      - bpe_identity.version_line == 'ansible-playbook [core ' ~ bpe_receipt.expect_core ~ ']'
      - bpe_identity.executable == lme_resolved_run.ansible_playbook
      - bpe_identity.config_file == bpe_receipt.ansible_config
      - bpe_identity.collection_location == bpe_receipt.collections_path
      - bpe_identity.python == lme_resolved_run.python
    fail_msg: >-
      REFUSED RH-NESTED-PROBE-EXECUTOR: the nested probe environment executed {{ bpe_identity.executable }}
      ({{ bpe_identity.version_line }}, config {{ bpe_identity.config_file }}, collections {{ bpe_identity.collection_location }},
      python {{ bpe_identity.python }}, rc {{ bpe_identity.rc }}), not the resolved {{ lme_resolved_run.ansible_playbook }}
      (core {{ bpe_receipt.expect_core }}, {{ bpe_receipt.ansible_config }}, {{ bpe_receipt.collections_path }}, {{ lme_resolved_run.python }}).
      lme_resolved_run.env must carry the managed ANSIBLE_CONFIG / ANSIBLE_COLLECTIONS_PATH (seed managed_env).
    quiet: true

- name: Print the bound nested executor (control marker)
  ansible.builtin.debug:
    # RHC-NESTED-ANSIBLE-HOME is read from the composed argv (what the nested env WAS given), not observed from the child
    msg: "RHC-NESTED-EXEC={{ bpe_identity.executable }} RHC-NESTED-CONFIG={{ bpe_identity.config_file }} RHC-NESTED-PYTHON={{ bpe_identity.python }} RHC-NESTED-WORK-ROOT={{ bpe_work_root }} RHC-NESTED-ANSIBLE-HOME={{ bpe_argv | select('match', '^ANSIBLE_HOME=') | map('regex_replace', '^ANSIBLE_HOME=', '') | first | default('') }}"
