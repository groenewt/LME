---
# remove ONE earlier run dir (rhc_prune) of this work root -- only when it carries the run marker as a regular file and
# is a real directory owned by the runner. Anything else is preserved and reported.

- name: "Stat {{ rhc_prune }} and its marker"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: ["{{ rhc_prune }}", "{{ rhc_prune }}/{{ rhc_decl.state.run_marker }}"]
  register: _rhc_pr

- name: Prune only a marked, owned, real run dir
  when: >-
    _rhc_pr.results[0].stat.isdir | default(false) and not (_rhc_pr.results[0].stat.islnk | default(true))
    and (_rhc_pr.results[0].stat.uid | string) == _rhc_id.stdout
    and (_rhc_pr.results[1].stat.isreg | default(false))
  block:
    - name: Owner write through the tree (chmod -R does not follow links)
      ansible.builtin.command:
        argv: ["{{ rhc_decl.runner_tools.chmod }}", -R, u+w, --, "{{ rhc_prune }}"]
      changed_when: true

    - name: Remove it
      ansible.builtin.file:
        path: "{{ rhc_prune }}"
        state: absent

- name: An unmarked or foreign run-shaped dir is preserved and reported
  ansible.builtin.debug:
    msg: "PRESERVED {{ rhc_prune }}: not a marked run dir owned by uid {{ _rhc_id.stdout }}"
  when: >-
    not (_rhc_pr.results[0].stat.isdir | default(false) and not (_rhc_pr.results[0].stat.islnk | default(true))
         and (_rhc_pr.results[0].stat.uid | string) == _rhc_id.stdout and (_rhc_pr.results[1].stat.isreg | default(false)))
