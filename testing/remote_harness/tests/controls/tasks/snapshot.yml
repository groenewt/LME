---
# record a listing snapshot (rhc_snap: {name, of, exclude_regex, include_regex}): relative path, type, mode, size,
# owner uid, mtime and link target of every entry (no link following). A missing tree snapshots as ABSENT.

- name: "List {{ rhc_snap.of }}"
  ansible.builtin.command:
    argv: ["{{ rhc_decl.runner_tools.find }}", -P, "{{ rhc_snap.of }}", -printf, "%P %y %m %s %U %T@ %l\\n"]
  register: _rhc_sn
  changed_when: false
  failed_when: false

- name: "Keep snapshot {{ rhc_snap.name }}"
  ansible.builtin.set_fact:
    _rhc_snaps: >-
      {{ _rhc_snaps | combine({rhc_snap.name: {'of': rhc_snap.of, 'exclude_regex': rhc_snap.exclude_regex | default([]),
          'include_regex': rhc_snap.include_regex | default([]),
          'lines': (lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'snapshot_lines',
                     'args': [_rhc_sn.stdout, rhc_snap.exclude_regex | default([]), rhc_snap.include_regex | default([])]}}) | from_json)
                   if _rhc_sn.rc == 0 else ['ABSENT']}}) }}
