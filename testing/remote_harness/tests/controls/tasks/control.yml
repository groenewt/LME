---
# one control (rhc_c): every variant in order, then publish what it satisfies (G)

- name: "Plan {{ rhc_c.id }}"
  ansible.builtin.set_fact:
    _rhc_c_unimpl: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'unimplemented', 'args': [rhc_c, rhc_decl.vocabulary]}}) | from_json }}"

- name: "Run every variant of {{ rhc_c.id }}"
  ansible.builtin.include_tasks: variant.yml
  loop: "{{ rhc_c.variants | default([{'id': 'base'}]) }}"
  loop_control:
    loop_var: rhc_v
    label: "{{ rhc_c.id }}/{{ rhc_v.id }}"

- name: "Publish the dependencies {{ rhc_c.id }} satisfies (every variant PASS) or blocks"
  vars:
    _mine: "{{ rhc_results | selectattr('control', 'equalto', rhc_c.id) | list }}"
    _pass: "{{ _mine | length > 0 and (_mine | rejectattr('status', 'equalto', 'PASS') | list | length == 0) }}"
  ansible.builtin.set_fact:
    rhc_deps: "{{ rhc_deps | combine({item.key: item.value | combine({'met': _pass | bool, 'ran': true})}) }}"
  loop: "{{ rhc_deps | dict2items | selectattr('value.kind', 'equalto', 'control') | selectattr('value.control', 'equalto', rhc_c.id) | list }}"
  loop_control:
    label: "{{ item.key }}"

- name: After the bundle-A fixture passes, bind its generation and the shared root's published receipt
  ansible.builtin.set_fact:
    rhc_base_tokens: >-
      {{ rhc_base_tokens | combine({'gen_id': (lookup('ansible.builtin.file', rhc_base_tokens.bundle_a ~ '/'
           ~ rh.controller.bootstrap.bundle.manifest_file) | from_json).expected_generation}) }}
    rhc_ctx_static: >-
      {{ rhc_ctx_static | combine({'receipt': lookup('ansible.builtin.file', rhc_base_tokens.shared ~ '/'
           ~ rh.controller.bootstrap.toolchain_receipt) | from_json}) }}
  when: rhc_deps.bundle_a.met and rhc_deps.shared_root.met and rhc_c.id == rhc_deps.bundle_a.control
