---
# self-tests of the runner's macro and regex gates (G): controls/selftests.yml. Pure (every case is one macro call on
# declared inputs and a fixture ctx); runs in both modes before any planning. A failing case, or a gate without both an
# accepting and a rejecting case, is a runner defect and fails the play: no control is judged by an untested gate.

- name: Load the gate self-tests
  ansible.builtin.set_fact:
    rhc_selftests: "{{ lookup('ansible.builtin.file', rhc_controls_dir ~ '/selftests.yml') | from_yaml }}"
    rhc_selftest_fail: []

# G-LAUNCH-PARAMS-FROM-USAGE-TEXT (codex 211754): a fixture ctx with `launch_params_from: route_export` gets its
# launch_params from the ROUTE's machine export (seed_launcher.params_rel of THIS checkout, which imports controller_seed.j2
# and returns {mode: launch_params(words)}) rendered with the FIXTURE's own bootstrap (its mode_args / carried_param; the
# candidate's macros_rel / params_rel merged in so the export resolves its import) -- so the rename variation runs
# through the canonical macro, never through a literal. Until the route export lands (params_rel undeclared or its file
# absent), each case marked needs_route_export is BLOCKED (reported, not evaluated, not a PASS); every other case runs.
- name: Is the route's launch-parameter export available in this checkout
  vars:
    _rel: "{{ rh.controller.bootstrap.seed_launcher.params_rel | default('') }}"
  ansible.builtin.set_fact:
    rhc_st_export: "{{ (rh_repo_root ~ '/' ~ _rel) if (_rel | length > 0 and (rh_repo_root ~ '/' ~ _rel) is file) else '' }}"
    rhc_selftest_blocked: []

- name: Record the self-tests blocked on the route export (dependency, never a PASS)
  ansible.builtin.set_fact:
    rhc_selftest_blocked: "{{ rhc_selftests.cases | selectattr('needs_route_export', 'defined') | selectattr('needs_route_export') | map(attribute='id') | list }}"
  when: rhc_st_export | length == 0

- name: Evaluate every gate self-test
  vars:
    _args: >-
      {%- set ns = namespace(a = []) -%}
      {%- for a in item.args -%}
      {%- if a is mapping and (a.launch_params_from | default('')) == 'route_export' -%}
      {%- set bs = a.rh.controller.bootstrap | combine({'macros_rel': rh.controller.bootstrap.macros_rel,
                     'seed_launcher': {'params_rel': rh.controller.bootstrap.seed_launcher.params_rel}}, recursive=true) -%}
      {%- set ns.a = ns.a + [a | combine({'launch_params': lookup('ansible.builtin.template', rhc_st_export,
                                            template_vars={'lme_seed_bs': bs}) | from_json})] -%}
      {%- else -%}{%- set ns.a = ns.a + [a] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.a | to_json }}
    _raw: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': item.fn,
           'args': (_args | from_json) + ([rhc_selftests.ctx] if item.with_ctx | default(false) else [])}}) }}
    _ok: >-
      {{ (item.expect.equals is not defined or (_raw | from_json) == item.expect.equals)
         and (item.expect.search is not defined or (_raw is search(item.expect.search)))
         and (item.expect.not_search is not defined or not (_raw is search(item.expect.not_search))) }}
  ansible.builtin.set_fact:
    rhc_selftest_fail: "{{ rhc_selftest_fail + ([] if _ok | bool else [item.id ~ ' (' ~ item.fn ~ ') returned ' ~ _raw ~ ', expected ' ~ (item.expect | to_json)]) }}"
  loop: "{{ rhc_selftests.cases }}"
  loop_control:
    label: "{{ item.id }}"
  when: item.id not in rhc_selftest_blocked

- name: Report the self-tests BLOCKED on the route launch-parameter export (seed_launcher.params_rel; not evaluated, not a PASS)
  ansible.builtin.debug:
    msg: "RHC-SELFTEST-BLOCKED route export seed_launcher.params_rel absent: {{ rhc_selftest_blocked | to_json }}"
  when: rhc_selftest_blocked | length > 0

- name: Every gate has an accepting and a rejecting case, and every case passed
  vars:
    _neg: "{{ rhc_selftests.cases | selectattr('negative') | map(attribute='gate') | unique | list }}"
    _pos: "{{ rhc_selftests.cases | rejectattr('negative') | map(attribute='gate') | unique | list }}"
  ansible.builtin.assert:
    that:
      - rhc_selftest_fail | length == 0
      - rhc_selftests.gates | reject('in', _neg) | list | length == 0
      - rhc_selftests.gates | reject('in', _pos) | list | length == 0
      - rhc_selftests.cases | map(attribute='gate') | reject('in', rhc_selftests.gates) | list | length == 0
      - rhc_selftests.cases | map(attribute='id') | list | length == rhc_selftests.cases | map(attribute='id') | unique | list | length
    fail_msg: >-
      REFUSED RHC-GATE-SELFTEST: failing {{ rhc_selftest_fail | to_json }}; gates without a rejecting case
      {{ rhc_selftests.gates | reject('in', _neg) | list | to_json }}; without an accepting case
      {{ rhc_selftests.gates | reject('in', _pos) | list | to_json }}
    quiet: true
