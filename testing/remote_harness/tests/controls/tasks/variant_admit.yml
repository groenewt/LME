---
# admit the declaration variant of this control (rhc_c / rhc_v): the SAME candidate declarations with ONE declared
# patch under controller.bootstrap. Route 1 (SEED-06 projection landed; not for a bytes-only variant): the patch rides
# the override channel as an inventory var of the playbook acts. Route 3 (a control with variant_checkout: clone,
# ALWAYS): G's declared variant clone (controls.yml variant_clone; tasks/variant_clone.yml), an exact-commit
# --no-hardlinks clone under this variant's control dir with its own work root, so `seed run` of a bundle packaged from
# it anchors on the clone (codex-root-boundary-ruling-and-controller-handoff-20260924-155203). Route 3 is admitted only
# when the clone's profile == the candidate profile recursively combined with the patch (`profile_bytes_differ`: parsed
# equal, bytes different) AND every other render input recorded in bundle A's manifest (source.inputs) is
# byte-identical -- or, for a declaration with a route checkout_fixture, where and as that fixture's declared mutations
# say (REPAIR 5 input map, codex 223100). Anything else is a FAIL of this variant, never a silent fallback (plan_act would otherwise run the
# candidate for `repo: variant`).
# ROUTE 2 RETIRED from the execution path (codex 220352 / 212700; Codex forbids MAIN-staged manual artifacts): the former
# MAIN-staged read-only repository copy rhc_variants.<id> is NOT an admissible source on this lineage. Evidence produced
# through it earlier is preserved as incomplete, unacceptable history, never current qualification. A supplied
# rhc_variants.<id> is refused below, never used.

- name: The declaration
  vars:
    _id: "{{ rhc_v.declaration | default(rhc_c.declaration) }}"
  ansible.builtin.set_fact:
    _rhc_decl_id: "{{ _id }}"
    _rhc_decl: "{{ rhc_decl.declarations[_id] }}"

# A declaration may name the route catalog (tests/bundle_fixtures.yml, pinned) instead of repeating its data: profile_case
# = a profile_cases entry whose patch_bootstrap / patch {path, value} IS the patch (controls.j2 profile_case_patch; never
# together with `patch`), checkout_fixture = a checkout_cases entry the route producer applies to the Route 3 clone
# (tasks/variant_clone.yml). Both need variant_checkout: clone; a relocate case needs exactly its own profile_case.
- name: Read the route fixture catalog (a declaration naming profile_case or checkout_fixture)
  ansible.builtin.set_fact:
    _rhc_fxcat_text: "{{ lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/tests/bundle_fixtures.yml') }}"
  when: _rhc_decl.profile_case is defined or _rhc_decl.checkout_fixture is defined

- name: Refuse a catalog reference that is not exactly one declared entry of a delimiter-free catalog, or not on the clone route
  vars:
    _cat: "{{ _rhc_fxcat_text | from_yaml }}"
    _pcs: "{{ _cat.profile_cases | default([]) | selectattr('id', 'equalto', _rhc_decl.profile_case | default('')) | list }}"
    _ccs: "{{ _cat.checkout_cases | default([]) | selectattr('id', 'equalto', _rhc_decl.checkout_fixture | default('')) | list }}"
    _pcp: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'profile_case_patch', 'args': [_pcs | first | default({})]}}) | from_json }}"
  ansible.builtin.assert:
    that:
      - _rhc_fxcat_text is not search('[{][{%#]')
      - _cat.schema == 'bundle-fixtures/1'
      - (rhc_c.variant_checkout | default('')) == 'clone'
      - _rhc_decl.profile_case is not defined or (_rhc_decl.patch is not defined and _pcs | length == 1)
      - _rhc_decl.profile_case is not defined or _pcp.why == ''
      - _rhc_decl.checkout_fixture is not defined or _ccs | length == 1
      - _rhc_decl.checkout_fixture is not defined or (_ccs | first).kind != 'relocate' or (_ccs | first).profile_case == (_rhc_decl.profile_case | default(''))
    fail_msg: >-
      declaration {{ _rhc_decl_id }}: profile_case {{ _rhc_decl.profile_case | default('-') }} / checkout_fixture
      {{ _rhc_decl.checkout_fixture | default('-') }} must each name exactly one entry of the delimiter-free bundle-fixtures/1
      catalog, profile_case never together with patch, a relocate fixture exactly with its own profile_case, and the
      control must be variant_checkout: clone
    quiet: true
  when: _rhc_decl.profile_case is defined or _rhc_decl.checkout_fixture is defined

- name: The declaration's expanded patch and its route
  vars:
    _id: "{{ _rhc_decl_id }}"
  ansible.builtin.set_fact:
    _rhc_patch: >-
      {{ ((lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'profile_case_patch',
            'args': [(_rhc_fxcat_text | from_yaml).profile_cases | selectattr('id', 'equalto', _rhc_decl.profile_case) | first]}}) | from_json).patch)
         if _rhc_decl.profile_case is defined
         else (lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'xjson', 'args': [_rhc_decl.patch, _rhc_t]}}) | from_json) }}
    _rhc_route: >-
      {{ 'clone' if (rhc_c.variant_checkout | default('')) == 'clone'
         else ('override' if (rhc_deps.seed06_projection.met and not (rhc_decl.declarations[_id].profile_bytes_differ | default(false)))
         else 'none') }}

- name: Route 1 -- the patch through the override channel
  ansible.builtin.set_fact:
    _rhc_ctx: "{{ _rhc_ctx | combine({'override_inventory': {'lme_global_override': {'remote_harness': {'controller': {'bootstrap': _rhc_patch}}}}}) }}"
  when: _rhc_route == 'override'

- name: Route 3 -- admit the declared variant clone built here
  when: _rhc_route == 'clone'
  block:
    - name: The candidate profile and the profile the variant must carry (candidate + exactly the declared patch)
      vars:
        _cprof_text: "{{ lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ rhc_profile_rel, rstrip=false) }}"
      ansible.builtin.set_fact:
        _rhc_cprof_text: "{{ _cprof_text }}"
        _rhc_want: >-
          {{ (_cprof_text | from_yaml) | combine({'profile_overlay': {'lme_global': {'remote_harness': {'controller': {'bootstrap': _rhc_patch}}}}}, recursive=true) }}

    - name: Route 3 -- build the declared variant clone (exact commit, --no-hardlinks, own work root, patched profile)
      ansible.builtin.include_tasks: variant_clone.yml

    - name: The variant repository of this route
      ansible.builtin.set_fact:
        _rhc_vrepo: "{{ _rhc_t.vclone }}"

    # REPAIR 5 input map (codex 223100; controls.j2 input_map): each render input bundle A recorded is looked up where
    # the declared fixture mutations put it -- a renamed input at its new path with the recorded digest (digest and mode
    # preserved), a modified input (the registry file of a relocation, the edited source of an edit) with the producer's
    # sha256_after after a sha256_before equal to the recorded digest -- and every other input byte-identical in place.
    - name: Read the variant profile, bundle A's recorded render inputs and their declared locations in the clone
      vars:
        _in: >-
          {{ (lookup('ansible.builtin.file', rhc_base_tokens.bundle_a ~ '/' ~ rh.controller.bootstrap.bundle.manifest_file) | from_json).source.inputs
             | map('split', '  ') | list }}
      ansible.builtin.set_fact:
        _rhc_vprof_text: "{{ lookup('ansible.builtin.file', _rhc_vrepo ~ '/' ~ rhc_profile_rel, rstrip=false) }}"
        _rhc_inmap: >-
          {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'input_map',
             'args': [_in, rhc_profile_rel, _rhc_fx_results | map(attribute='mutations') | flatten(levels=1) | list]}}) | from_json }}

    - name: Digest every other render input at its declared location in the variant repository
      ansible.builtin.stat:
        path: "{{ _rhc_vrepo }}/{{ item.at }}"
        follow: false
        checksum_algorithm: sha256
      loop: "{{ _rhc_inmap.checks }}"
      loop_control:
        label: "{{ item.input }} @ {{ item.at }}"
      register: _rhc_vin

    - name: Admit the variant repository (profile == candidate + patch; every other input where and as the declared mutations say)
      ansible.builtin.assert:
        that:
          - (_rhc_vprof_text | from_yaml) == _rhc_want
          - (_rhc_vprof_text != _rhc_cprof_text) if (_rhc_decl.profile_bytes_differ | default(false)) else true
          - _rhc_inmap.failures | length == 0
          - _rhc_inmap.checks | length > 0
          - _rhc_vin.results | rejectattr('stat.exists') | list | length == 0
          - _rhc_vin.results | selectattr('stat.islnk') | list | length == 0
          - _rhc_vin.results | map(attribute='stat.checksum') | list == _rhc_inmap.checks | map(attribute='want') | list
        fail_msg: >-
          variant {{ _rhc_decl_id }} ({{ _rhc_route }}) at {{ _rhc_vrepo }} is not the candidate plus exactly the declared patch and fixture
          (profile equal to candidate+patch: {{ (_rhc_vprof_text | from_yaml) == _rhc_want }}; input map failures {{ _rhc_inmap.failures }};
          inputs differing: {{ _rhc_inmap.checks | map(attribute='at') | zip(_rhc_inmap.checks | map(attribute='want'), _rhc_vin.results | map(attribute='stat.checksum', default='ABSENT'))
             | map('join', ' ') | reject('regex', '^\\S+ (\\S+) \\1$') | list }})
        quiet: true

    - name: Route 3 admitted -- playbook acts of repo `variant` use the variant clone
      ansible.builtin.set_fact:
        _rhc_ctx: "{{ _rhc_ctx | combine({'variant_repo': _rhc_vrepo}) }}"

    - name: A clone control never runs on anything but its own admitted clone (no candidate fallback)
      ansible.builtin.assert:
        that:
          - _rhc_ctx.variant_repo == _rhc_t.vclone and _rhc_t.vclone | length > 0
        fail_msg: "variant {{ _rhc_decl_id }}: variant_checkout clone but variant_repo is {{ _rhc_ctx.variant_repo | default('') }}"
        quiet: true

- name: No route -- a FAIL of this variant (plan_status should have QUEUED it); a supplied rhc_variants copy is never a route (Route 2 retired)
  ansible.builtin.set_fact:
    _rhc_fail: >-
      {{ _rhc_fail + ['declaration variant ' ~ _rhc_decl_id ~ ': no admitted route (SEED-06 projection unless profile_bytes_differ, or variant_checkout: clone)'
                      ~ ('; rhc_variants.' ~ _rhc_decl_id ~ ' supplied but REFUSED: Route 2 (MAIN-staged copy) is retired (codex 220352 / 212700)'
                         if _rhc_decl_id in (rhc_variants | default({})) else '')] }}
  when: _rhc_route == 'none'
