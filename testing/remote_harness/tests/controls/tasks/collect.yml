---
# read the output files of one finished action and judge them (rhc_cid, rhc_cplan, rhc_crc, rhc_cexp)

- name: "Read the result of {{ rhc_cid }}"
  ansible.builtin.set_fact:
    _rhc_res:
      rc: "{{ rhc_crc | int }}"
      stdout: "{{ lookup('ansible.builtin.file', rhc_cplan.out, errors='ignore') | default('', true) }}"
      stderr: "{{ lookup('ansible.builtin.file', rhc_cplan.err, errors='ignore') | default('', true) }}"
      trace: "{{ (lookup('ansible.builtin.file', rhc_cplan.strace, errors='ignore') | default('', true)) if rhc_cplan.strace else '' }}"

- name: "Judge {{ rhc_cid }}"
  ansible.builtin.set_fact:
    _rhc_judged: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'judge', 'args': [rhc_cexp, _rhc_res, _rhc_ctx]}}) | from_json }}"

- name: "Record {{ rhc_cid }}"
  ansible.builtin.set_fact:
    _rhc_results_v: "{{ _rhc_results_v | combine({rhc_cid: _rhc_res}) }}"
    _rhc_fail: "{{ _rhc_fail + (_rhc_judged | map('regex_replace', '^', rhc_cid ~ ': ') | list) }}"
    _rhc_log: >-
      {{ _rhc_log + [{'step': rhc_cid, 'argv': rhc_cplan.argv, 'cwd': rhc_cplan.cwd, 'inventory': rhc_cplan.inventory,
          'rc': _rhc_res.rc, 'stdout': rhc_cplan.out, 'stderr': rhc_cplan.err, 'strace': rhc_cplan.strace,
          'expect': rhc_cexp, 'failures': _rhc_judged}] }}
