---
# Route 3: the declared variant clone of this variant (controls.yml variant_clone; codex-root-boundary-ruling-and-
# controller-handoff-20260924-155203). Included by tasks/variant_admit.yml BEFORE any op or step of the variant, with
# _rhc_want (candidate profile + the declared patch) set. Builds {vclone}: an exact-commit {head} --no-hardlinks clone of
# the run checkout (rh_repo_root), inside this marked run dir under the run's work root (never /tmp, never the authoring
# checkout), 0700, with its own work root {vwork} and root parent {vparent}; its profile is candidate + patch, plus (a
# declaration with checkout_fixture) exactly the route fixture's declared mutations, and nothing else differs from {head}
# (REPAIR 5, codex 223100). Every git call reads no ambient configuration and runs no hook. Writes only below {vclone};
# the run checkout is only read (status without optional locks). Any refusal here fails the variant (variant.yml rescue).

- name: Stat the clone destination
  ansible.builtin.stat:
    path: "{{ _rhc_t.vclone }}"
    follow: false
    get_checksum: false
  register: _rhc_vc_pre

- name: Refuse a clone outside this run dir, a relative segment, an existing destination, a work root not the declared one, or a non-commit head
  vars:
    _vc: "{{ rhc_decl.variant_clone }}"
    _rr: "{{ rh.controller.bootstrap.work_roots.root_rel }}"
  ansible.builtin.assert:
    that:
      - _rhc_t.vclone is match((rhc_run_dir | regex_escape) ~ '/')
      - _rhc_t.vclone is not search('(^|/)\.\.(/|$)')
      # {vctl} = {ctl} or the variant's dedicated fixture control dir {ctl}/<fixture_ctl> (increment 2, codex 231744 (a))
      - _rhc_t.vctl == _rhc_t.ctl or (_rhc_t.vctl | dirname) == _rhc_t.ctl
      - _rhc_t.vclone == _rhc_t.vctl ~ '/vclone'
      - _rhc_t.vwork == _rhc_t.vclone ~ '/' ~ _rr
      - _rhc_t.vparent == _rhc_t.vwork ~ '/p'
      - _rhc_t.vroot == _rhc_t.vparent ~ '/root'
      - not _rhc_vc_pre.stat.exists
      - (_rhc_t.head | string) is match(_vc.head_regex)
      # G-CLONE-DECLARED-PROFILE-PATH: the profile path is the one prepare.yml bound to the engine's effective source
      # (confined, regular, checkout-owned, == _lme_profile_file and rh_profile_sha256); refuse if it was not bound
      - rhc_profile_rel is defined and rhc_profile_rel is string and rhc_profile_rel | length > 0
      - not rhc_profile_rel.startswith('/') and '..' not in rhc_profile_rel.split('/')
    fail_msg: >-
      REFUSED RHC-VARIANT-CLONE: {{ _rhc_t.vclone }} (exists: {{ _rhc_vc_pre.stat.exists }}) must be {{ _rhc_t.vctl }}/vclone inside
      {{ rhc_run_dir }}, absent, with work root {{ _rhc_t.vclone }}/{{ _rr }}; head {{ _rhc_t.head }} must match {{ _vc.head_regex }}
    quiet: true

- name: The run checkout's tracked files are the exact commit (read only; untracked such as its work root excluded)
  ansible.builtin.command:
    argv: "{{ [rhc_decl.runner_tools.git, '-C', rh_repo_root] + rhc_decl.variant_clone.config + rhc_decl.variant_clone.source_status }}"
  environment: "{{ rhc_decl.variant_clone.env }}"
  register: _rhc_vc_src
  changed_when: false

- name: Refuse a modified run checkout (the clone would not be the bytes bundle A was packaged from)
  ansible.builtin.assert:
    that: _rhc_vc_src.stdout | length == 0
    fail_msg: "REFUSED RHC-VARIANT-CLONE: the run checkout {{ rh_repo_root }} has modified tracked files: {{ _rhc_vc_src.stdout_lines[:20] }}"
    quiet: true

- name: Clone the run checkout (--no-hardlinks, no checkout, empty template)
  ansible.builtin.command:
    argv: "{{ [rhc_decl.runner_tools.git] + rhc_decl.variant_clone.config + rhc_decl.variant_clone.clone + ['--', rh_repo_root, _rhc_t.vclone] }}"
  environment: "{{ rhc_decl.variant_clone.env }}"
  changed_when: true

- name: Owner-only clone at once (an umask-0002 clone is group-writable; the seed's ancestry would refuse its work root for that)
  ansible.builtin.file:
    path: "{{ _rhc_t.vclone }}"
    state: directory
    mode: "{{ rhc_decl.variant_clone.mode }}"
    follow: false

- name: Check out exactly {head} (detached)
  ansible.builtin.command:
    argv: "{{ [rhc_decl.runner_tools.git, '-C', _rhc_t.vclone] + rhc_decl.variant_clone.config + rhc_decl.variant_clone.checkout + [_rhc_t.head] }}"
  environment: "{{ rhc_decl.variant_clone.env }}"
  changed_when: true

- name: Read back the clone's HEAD
  ansible.builtin.command:
    argv: "{{ [rhc_decl.runner_tools.git, '-C', _rhc_t.vclone] + rhc_decl.variant_clone.config + ['rev-parse', '--verify', 'HEAD'] }}"
  environment: "{{ rhc_decl.variant_clone.env }}"
  register: _rhc_vc_head
  changed_when: false

- name: Stat the clone's committed profile (its mode is kept)
  ansible.builtin.stat:
    path: "{{ _rhc_t.vclone }}/{{ rhc_profile_rel }}"
    follow: false
    get_checksum: false
  register: _rhc_vc_prof

- name: Refuse a clone whose HEAD is not {head} or whose profile is not a regular file
  ansible.builtin.assert:
    that:
      - _rhc_vc_head.stdout | trim == _rhc_t.head
      - _rhc_vc_prof.stat.exists and _rhc_vc_prof.stat.isreg and not _rhc_vc_prof.stat.islnk
    fail_msg: "REFUSED RHC-VARIANT-CLONE: {{ _rhc_t.vclone }} HEAD {{ _rhc_vc_head.stdout | trim }} != {{ _rhc_t.head }}, or its profile is not a regular file"
    quiet: true

- name: Write the variant profile -- candidate + exactly the declared patch (re-serialized; comments and layout do not survive)
  ansible.builtin.copy:
    dest: "{{ _rhc_t.vclone }}/{{ rhc_profile_rel }}"
    content: "{{ _rhc_want | to_nice_yaml(indent=rhc_decl.variant_clone.serialize.indent, width=rhc_decl.variant_clone.serialize.width, sort_keys=false) }}"
    mode: "{{ _rhc_vc_prof.stat.mode }}"
    follow: false

# The declaration's route checkout fixture (codex 220953 / 211654 / 223100): the ONE producer tasks/fixture_checkout.yml
# (route-owned, pinned) applies catalog case checkout_fixture to THIS clone AFTER the profile patch (a relocation reads
# the patched profile) and BEFORE the status and the clone's own work root exist. G passes the Route 3 record exactly
# {ctl, vclone, head}, copies the producer's rh_fx_result into its own fact at once (the producer's fact names are
# shared with the bundle producer) and binds it to this case, clone and head. One fixture per declaration.
- name: Start this clone's fixture record (G-owned)
  ansible.builtin.set_fact:
    _rhc_fx_results: []

- name: Apply the declaration's route checkout fixture to the clone (route producer; never the canonical checkout)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/fixture_checkout.yml"
  vars:
    rh_fx_clone: "{{ _rhc_t.vclone }}"
    rh_fx_route3: {ctl: "{{ _rhc_t.vctl }}", vclone: "{{ _rhc_t.vclone }}", head: "{{ _rhc_t.head }}"}
    rh_fx_case: "{{ _rhc_decl.checkout_fixture }}"
  when: _rhc_decl.checkout_fixture is defined

- name: Keep the producer's result as G's own record of this clone
  ansible.builtin.set_fact:
    _rhc_fx_results: "{{ [rh_fx_result] }}"
  when: _rhc_decl.checkout_fixture is defined

- name: Refuse a fixture result that is not this case on this clone at this head (a stale result is never reused)
  ansible.builtin.assert:
    that:
      - _rhc_fx_results[0].schema == 'fixture-checkout-result/1'
      - _rhc_fx_results[0].case == _rhc_decl.checkout_fixture
      - _rhc_fx_results[0].clone == _rhc_t.vclone
      - (_rhc_fx_results[0].head | string) == (_rhc_t.head | string)
      - (_rhc_fx_results[0].route3.ctl == _rhc_t.vctl) and (_rhc_fx_results[0].route3.vclone == _rhc_t.vclone)
    fail_msg: >-
      REFUSED RHC-VARIANT-CLONE: the checkout fixture result {{ _rhc_fx_results[0].case | default('absent') }} /
      {{ _rhc_fx_results[0].clone | default('absent') }} / {{ _rhc_fx_results[0].head | default('absent') }} is not case
      {{ _rhc_decl.checkout_fixture }} on {{ _rhc_t.vclone }} at {{ _rhc_t.head }}
    quiet: true
  when: _rhc_decl.checkout_fixture is defined

- name: The clone's status against {head}
  ansible.builtin.command:
    argv: "{{ [rhc_decl.runner_tools.git, '-C', _rhc_t.vclone] + rhc_decl.variant_clone.config + rhc_decl.variant_clone.clone_status }}"
  environment: "{{ rhc_decl.variant_clone.env }}"
  register: _rhc_vc_st
  changed_when: false

# REPAIR 5 (codex 223100): the status is the DECLARED mutation set -- G's own ' M <profile>' line plus every applied
# fixture's expected_status (which must agree with its own mutations and name this head) -- as a SORTED EXACT set
# (controls.j2 clone_status; git prints tracked entries before untracked ones). A rename is a copy then a removal, so it
# shows ' D <from>' plus '?? <path>'; any 'R' entry, any extra or missing line refuses.
- name: Judge the clone's status against the declared mutation set (pure macro)
  ansible.builtin.set_fact:
    _rhc_vc_judge: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'clone_status',
         'args': [_rhc_vc_st.stdout_lines, rhc_profile_rel, _rhc_fx_results, _rhc_t.head]}}) | from_json }}

- name: Refuse a clone that differs from {head} anywhere but its profile and its declared fixture mutations
  ansible.builtin.assert:
    that: _rhc_vc_judge.ok
    fail_msg: "REFUSED RHC-VARIANT-CLONE: {{ _rhc_t.vclone }}: {{ _rhc_vc_judge.failures }}"
    quiet: true

- name: The clone's own work root and root parent (the seed creates {vroot} and its sub-roots there)
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "{{ rhc_decl.variant_clone.mode }}"
  loop: ["{{ _rhc_t.vwork }}", "{{ _rhc_t.vparent }}"]
