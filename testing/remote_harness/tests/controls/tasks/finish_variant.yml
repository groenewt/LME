---
# after every variant that ran (always): stop stray background operations, purge a fresh root through bundle A (the
# seed's own purge; fallback = control-owned removal inside this marked run dir, recorded as a cleanup finding), re-verify
# the shared root (a failure taints it: later shared-root controls are BLOCKED), and drop the variant's bulky scratch
# (bundles, source copies, staging) so the run stays inside its declared storage budget. Evidence files are kept.

- name: Stop any background operation of this variant that is still running
  ansible.builtin.command:
    argv: ["{{ rhc_decl.runner_tools.pkill }}", -KILL, -f, --, "{{ item.value.plan.kill_token | regex_escape }}"]
  loop: "{{ _rhc_jobs | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _rhc_stray
  changed_when: _rhc_stray.rc == 0
  failed_when: false

- name: A stray operation is a cleanup finding
  ansible.builtin.set_fact:
    rhc_cleanup_findings: "{{ rhc_cleanup_findings + [rhc_c.id ~ '/' ~ rhc_v.id ~ ': killed a stray ' ~ item.item.key] }}"
  loop: "{{ _rhc_stray.results | selectattr('rc', 'defined') | selectattr('rc', 'equalto', 0) | list }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Purge the fresh root through bundle A (and the root of a variant token, when one names another path)
  vars:
    _plan: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'plan_act',
           'args': [{'id': 'cleanup-purge', 'act': {'kind': 'seed', 'bundle': 'a', 'op': 'purge', 'root': _rhc_t.root}}, _rhc_ctx]}}) | from_json }}
  ansible.builtin.shell:
    cmd: "exec {{ _plan.argv | map('quote') | join(' ') }} </dev/null >{{ _plan.out | quote }} 2>{{ _plan.err | quote }}"
    chdir: "{{ _rhc_t.ctl }}/cwd"
  register: _rhc_purge
  changed_when: true
  failed_when: false
  when: (rhc_c.root | default('')) == 'fresh' and rhc_deps.bundle_a.met

- name: Is anything left in the fresh root's parent?
  ansible.builtin.find:
    paths: "{{ _rhc_t.parent }}"
    patterns: ['*']
    hidden: true
    file_type: any
    recurse: false
  register: _rhc_left
  failed_when: false

# WORK ROOT (profile controller.bootstrap.work_roots): `seed run`/`verify` admit W = the root's parent and create the
# declared sub-roots of its run_env there (cache, engine-storage). They belong to the work root, never to the root, so
# the seed's purge rightly leaves them; they are not a cleanup finding (the throwaway run dir holds them).
- name: Leave the declared work-root sub-roots out of the leftovers
  vars:
    _wsub: "{{ rh.controller.bootstrap.work_roots.run_env | map(attribute='sub') | unique | map('extract', rh.controller.bootstrap.work_roots.sub_roots) | list }}"
  ansible.builtin.set_fact:
    _rhc_left: "{{ {'files': _rhc_left.files | default([]) | rejectattr('path', 'in', _wsub | map('regex_replace', '^', _rhc_t.parent ~ '/') | list) | list}
                   | combine({'matched': (_rhc_left.files | default([]) | rejectattr('path', 'in', _wsub | map('regex_replace', '^', _rhc_t.parent ~ '/') | list) | list | length)}) }}"

- name: Fallback removal inside this marked run dir (a cleanup finding; the seed's purge left or refused it)
  when: _rhc_left.matched | default(0) > 0
  block:
    - name: The run marker must be present (never remove outside a marked run dir)
      ansible.builtin.stat:
        path: "{{ rhc_run_dir }}/{{ rhc_decl.state.run_marker }}"
        follow: false
        get_checksum: false
      register: _rhc_mk
      failed_when: not (_rhc_mk.stat.exists and _rhc_mk.stat.isreg and _rhc_left.files | map(attribute='path') | reject('match', (rhc_run_dir | regex_escape) ~ '/') | list | length == 0)

    - name: Record the finding
      ansible.builtin.set_fact:
        rhc_cleanup_findings: >-
          {{ rhc_cleanup_findings + [rhc_c.id ~ '/' ~ rhc_v.id ~ ': seed purge rc ' ~ (_rhc_purge.rc | default('not run')) ~ ' left '
             ~ (_rhc_left.files | map(attribute='path') | map('basename') | join(' '))] }}

    - name: Owner write on the leftovers (chmod -R does not follow links)
      ansible.builtin.command:
        argv: ["{{ rhc_decl.runner_tools.chmod }}", -R, u+w, --, "{{ item.path }}"]
      loop: "{{ _rhc_left.files | rejectattr('islnk') | list }}"
      loop_control:
        label: "{{ item.path }}"
      changed_when: true
      failed_when: false

    - name: Remove the leftovers
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _rhc_left.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Re-verify the shared root after a control that used it
  vars:
    _plan: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'plan_act',
           'args': [{'id': 'cleanup-verify', 'act': {'kind': 'seed', 'bundle': 'a', 'op': 'verify', 'root': rhc_base_tokens.shared}}, _rhc_ctx]}}) | from_json }}
  ansible.builtin.shell:
    cmd: "exec {{ _plan.argv | map('quote') | join(' ') }} </dev/null >{{ _plan.out | quote }} 2>{{ _plan.err | quote }}"
    chdir: "{{ _rhc_t.ctl }}/cwd"
  register: _rhc_sv
  changed_when: false
  failed_when: false
  when: (rhc_c.root | default('')) == 'shared' and rhc_deps.shared_root.met

- name: A shared root that no longer verifies taints every later shared-root control
  ansible.builtin.set_fact:
    rhc_shared_tainted: true
    rhc_cleanup_findings: "{{ rhc_cleanup_findings + [rhc_c.id ~ '/' ~ rhc_v.id ~ ': shared root verify rc ' ~ _rhc_sv.rc ~ ' (tainted)'] }}"
  when: _rhc_sv.rc is defined and _rhc_sv.rc != 0

# Route 3 (variant_checkout: clone): the clone's own root {vroot} is purged through bundle A (the seed's own purge; purge
# is exempt from the checkout binding) BEFORE {vclone} leaves with the variant scratch, so a mid-control failure still
# gets the seed's purge. G-VARIANT-PURGE-READBACK (codex-rev8-route-B-G-source-audits-20260924-163642): the root is
# RE-STATTED after the purge; a zero exit alone never authorizes deleting recovery evidence. A root still present (any
# exit), a failed purge, or a root that could not be purged (no bundle A) FAILS the variant, is recorded, and RETAINS the
# clone and the whole variant scratch (nothing below is removed) for recovery.
- name: Is there a variant clone root to purge?
  ansible.builtin.stat:
    path: "{{ _rhc_t.vroot | default('') }}"
    follow: false
    get_checksum: false
  register: _rhc_vr
  when: (rhc_c.variant_checkout | default('')) == 'clone' and (_rhc_t.vroot | default('')) | length > 0

- name: Purge the variant clone root through bundle A
  vars:
    _plan: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'plan_act',
           'args': [{'id': 'cleanup-purge-vroot', 'act': {'kind': 'seed', 'bundle': 'a', 'op': 'purge', 'root': _rhc_t.vroot}}, _rhc_ctx]}}) | from_json }}
  ansible.builtin.shell:
    cmd: "exec {{ _plan.argv | map('quote') | join(' ') }} </dev/null >{{ _plan.out | quote }} 2>{{ _plan.err | quote }}"
    chdir: "{{ _rhc_t.ctl }}/cwd"
  register: _rhc_vpurge
  changed_when: true
  failed_when: false
  when: ((_rhc_vr.stat | default({})).exists | default(false)) and rhc_deps.bundle_a.met

- name: Read the variant clone root back after the purge (never trust the exit status alone)
  ansible.builtin.stat:
    path: "{{ _rhc_t.vroot }}"
    follow: false
    get_checksum: false
  register: _rhc_vr_after
  when: ((_rhc_vr.stat | default({})).exists | default(false))

- name: Decide whether the variant scratch must be RETAINED (root still present, purge failed or not run)
  vars:
    _was: "{{ (_rhc_vr.stat | default({})).exists | default(false) }}"
    _left: "{{ (_rhc_vr_after.stat | default({})).exists | default(false) }}"
    _rc: "{{ _rhc_vpurge.rc | default('not run') }}"
  ansible.builtin.set_fact:
    _rhc_retain: "{{ (_was | bool) and ((_left | bool) or (_rc | string) != '0') }}"
    _rhc_retain_why: >-
      {{ rhc_c.id ~ '/' ~ rhc_v.id ~ ': variant clone root ' ~ _rhc_t.vroot ~ ' purge rc ' ~ (_rc | string)
         ~ ', present after purge: ' ~ (_left | string) ~ '; clone and variant scratch RETAINED for recovery (' ~ _rhc_t.ctl ~ ')' }}

- name: A variant clone root the purge did not remove FAILS the variant and is recorded (scratch retained)
  ansible.builtin.set_fact:
    _rhc_fail: "{{ _rhc_fail + ['G-VARIANT-PURGE-READBACK ' ~ _rhc_retain_why] }}"
    rhc_cleanup_findings: "{{ rhc_cleanup_findings + [_rhc_retain_why] }}"
  when: _rhc_retain | bool

- name: Drop the variant's bulky scratch (declared names only; evidence files stay; never when retained)
  when: not (_rhc_retain | default(false) | bool)
  ansible.builtin.find:
    paths: "{{ _rhc_t.ctl }}"
    patterns: "{{ rhc_decl.state.variant_scratch }}"
    hidden: true
    file_type: any
    recurse: false
  register: _rhc_scratch

- name: Owner write on the scratch
  ansible.builtin.command:
    argv: ["{{ rhc_decl.runner_tools.chmod }}", -R, u+w, --, "{{ item.path }}"]
  loop: "{{ [] if (_rhc_retain | default(false) | bool) else (_rhc_scratch.files | rejectattr('islnk') | selectattr('isdir') | list) }}"
  loop_control:
    label: "{{ item.path }}"
  changed_when: true
  failed_when: false

- name: Remove the scratch
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ [] if (_rhc_retain | default(false) | bool) else _rhc_scratch.files }}"
  loop_control:
    label: "{{ item.path }}"
