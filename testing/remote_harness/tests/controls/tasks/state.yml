---
# filesystem predicates (rhc_preds, labelled rhc_preds_label), evaluated IN ORDER: each predicate is expanded with the
# tokens bound so far, so a `glob` with `bind:` makes its single match available to the predicates after it.

- name: "Predicates of {{ rhc_preds_label }}"
  ansible.builtin.include_tasks: predicate.yml
  loop: "{{ rhc_preds }}"
  loop_control:
    loop_var: rhc_p
    index_var: rhc_pi
    label: "{{ rhc_preds_label }}[{{ rhc_pi }}]"
