---
# plan mode: the independent static checks of ONE control (rhc_c) with its planned status READY or OPEN-REGRESSION (G).
# Static checks need no release: they run no entrypoint and write nothing, so plan mode runs them and reports them.
# A failure is reported (rhc_static_results), and plan mode still fails only on a declaration error.

- name: "Plan-mode static checks of {{ rhc_c.id }} -- reset"
  ansible.builtin.set_fact:
    _rhc_fail: []
    _rhc_sc_out: []
    _rhc_pst: "{{ (rhc_planned | selectattr('control', 'equalto', rhc_c.id) | first).status }}"

- name: "Plan-mode static checks of {{ rhc_c.id }}"
  ansible.builtin.include_tasks: static_check.yml
  loop: "{{ rhc_c.static_checks }}"
  loop_control:
    loop_var: rhc_sc
    label: "{{ (rhc_sc | list)[0] }}"
  when: _rhc_pst in ['READY', 'OPEN-REGRESSION']

- name: "Plan-mode static result of {{ rhc_c.id }} (an OPEN-REGRESSION control stays OPEN-REGRESSION when its checks pass)"
  ansible.builtin.set_fact:
    rhc_static_results: >-
      {{ rhc_static_results | default([]) + [{'control': rhc_c.id, 'planned': _rhc_pst,
          'status': ('FAIL' if _rhc_fail | length > 0 else ('PASS' if _rhc_pst == 'READY' else _rhc_pst)),
          'why': _rhc_fail, 'observations': _rhc_sc_out | selectattr('mutation', 'equalto', {}) | map(attribute='observations') | flatten | unique | list,
          'negative_controls': _rhc_sc_out | rejectattr('mutation', 'equalto', {}) | map(attribute='mutation') | map(attribute='kind') | list}] }}
