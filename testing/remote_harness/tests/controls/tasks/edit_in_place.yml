---
# write bytes into an existing regular file KEEPING its inode (rhc_e = [file, bytes, how]; how: truncate | append |
# first_byte). A read-only file gets owner write for the edit only; its mode is restored after. The declared dd is the
# only writer (the parent directory's mode is never touched).

- name: "Stat {{ rhc_e[0] }}"
  ansible.builtin.stat:
    path: "{{ rhc_e[0] }}"
    follow: false
    get_checksum: false
  register: _rhc_ei

- name: An in-place edit needs an existing regular file (not a link, fifo or dir)
  ansible.builtin.assert:
    that: _rhc_ei.stat.exists and _rhc_ei.stat.isreg
    fail_msg: "in-place edit of {{ rhc_e[0] }}: not an existing regular file"
    quiet: true

- name: Owner write for the edit
  ansible.builtin.file:
    path: "{{ rhc_e[0] }}"
    mode: u+w
    follow: false
  when: not _rhc_ei.stat.wusr

- name: "Edit {{ rhc_e[0] }} ({{ rhc_e[2] }})"
  ansible.builtin.command:
    argv: >-
      {{ [rhc_decl.runner_tools.dd, 'of=' ~ rhc_e[0], 'status=none']
         + {'truncate': [], 'append': ['oflag=append', 'conv=notrunc'], 'first_byte': ['bs=1', 'count=1', 'conv=notrunc']}[rhc_e[2]] }}
    stdin: "{{ rhc_e[1] }}"
    stdin_add_newline: false
  changed_when: true

- name: Restore the mode
  ansible.builtin.file:
    path: "{{ rhc_e[0] }}"
    mode: "{{ _rhc_ei.stat.mode }}"
    follow: false
  when: not _rhc_ei.stat.wusr
