---
# testing/remote_harness/tests/controls/tasks/prepare.yml -- load, validate and plan the declared controls (G).
# Reads only: controls.yml, the owners' case files, the resolved harness policy (rh). Writes nothing.

- name: Load the control declarations and the owners' case rows
  ansible.builtin.set_fact:
    rhc_decl: "{{ lookup('ansible.builtin.file', rhc_controls_dir ~ '/controls.yml') | from_yaml }}"

# G-CLONE-DECLARED-PROFILE-PATH (codex 220352 / 220515): the profile a declaration variant patches (Route 3 clone,
# override route, bundle-input comparison) is bound to the AUTHORITATIVE source relationship, never a path literal: the
# engine's effective lme_manifests_dir / lme_profile (resolve_policy.yml refused any other binding) through the declared
# path form variant_clone.profile_source.form (the engine's own include_vars file, ansible/roles/podman/tasks/resolve.yml).
# The bound path is confined (repository-relative, no '..', a plain profile name), a regular non-link file owned by the
# checkout's owner, and it is proven to be EXACTLY the source the engine resolved: its parsed content equals the engine's
# loaded _lme_profile_file and its bytes digest equals rh_profile_sha256. Any mismatch refuses (RHC-PROFILE-BINDING).
- name: Derive the profile path from the engine's effective binding and the declared form
  vars:
    _ps: "{{ rhc_decl.variant_clone.profile_source }}"
    _md: "{{ lookup('ansible.builtin.vars', _ps.manifests_dir_var, default='') }}"
    _pn: "{{ lookup('ansible.builtin.vars', _ps.profile_var, default='') }}"
  ansible.builtin.set_fact:
    rhc_profile_bind:
      manifests_dir: "{{ _md }}"
      profile: "{{ _pn }}"
      rel: >-
        {{ (_ps.form | replace('{manifests_dir}', (_md[(rh_repo_root | length) + 1:]) if (_md is string and _md.startswith(rh_repo_root ~ '/')) else '/UNCONFINED')
                     | replace('{profile}', _pn)) }}

- name: Stat the bound profile and the checkout (ownership and type; never followed)
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: ["{{ rh_repo_root }}/{{ rhc_profile_bind.rel }}", "{{ rh_repo_root }}"]
  register: _rhc_pb_st

- name: Refuse a profile binding that is unconfined, not a regular owned file, or not exactly the source the engine resolved
  vars:
    _f: "{{ _rhc_pb_st.results[0].stat }}"
    _r: "{{ _rhc_pb_st.results[1].stat }}"
  ansible.builtin.assert:
    that:
      - rhc_profile_bind.profile is match(rhc_decl.variant_clone.profile_source.profile_regex)
      - not rhc_profile_bind.rel.startswith('/')
      - "'..' not in rhc_profile_bind.rel.split('/')"
      - "'{' not in rhc_profile_bind.rel"
      - _f.exists and _f.isreg and not _f.islnk
      - _r.exists and _r.isdir and _f.uid == _r.uid
      - (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ rhc_profile_bind.rel) | from_yaml) == _lme_profile_file
      - (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ rhc_profile_bind.rel) | hash('sha256')) == rh_profile_sha256
    fail_msg: >-
      REFUSED RHC-PROFILE-BINDING: {{ rhc_profile_bind | to_json }} (form {{ rhc_decl.variant_clone.profile_source.form }}) is not a
      confined, regular, checkout-owned file equal to the profile the engine resolved (_lme_profile_file / rh_profile_sha256)
    quiet: true

- name: Publish the bound profile path (the one path every declaration-variant task uses)
  ansible.builtin.set_fact:
    rhc_profile_rel: "{{ rhc_profile_bind.rel }}"

# G-E77-PARTIAL-COVERAGE (ported from m1-1g): besides the ids, each row's own declared `variants` mapping KEYS (the row
# model's components; only rows whose variants is a mapping) -- controls.j2 coverage / coverage_of report a row covered
# by components as PARTIAL until its components cover every declared variant key.
- name: Bind the case sources (ids and the row model's variant keys only; rows are never copied)
  vars:
    _rows: "{{ (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ item.file) | from_yaml)[item.key] }}"
  ansible.builtin.set_fact:
    rhc_sources: >-
      {{ rhc_sources | default([]) + [{'prefix': item.prefix, 'file': item.file,
          'ids': _rows | map(attribute='id') | list,
          'variants': dict(_rows | selectattr('variants', 'defined') | selectattr('variants', 'mapping') | map(attribute='id')
                           | zip(_rows | selectattr('variants', 'defined') | selectattr('variants', 'mapping') | map(attribute='variants') | map('list')))}] }}
  loop: "{{ rhc_decl.cases_refs }}"

# G-EXPORT-AVAILABILITY-ORDER (codex 220515 / 220352): the route export is admitted (declared / confined / present regular
# file) BEFORE it is rendered, and only a correctly shaped rendering becomes ctx.launch_params (export_availability.yml;
# already evaluated by selftest.yml -- evaluated once).
- name: Admit the route launch-parameter export before any render of it
  ansible.builtin.include_tasks: export_availability.yml

- name: Derive the run-independent tokens and the planning context
  vars:
    _bs: "{{ rh.controller.bootstrap }}"
    _work: "{{ rhc_work_root | default('/PLAN/work') }}"
    _run: "{{ rhc_run_dir | default(_work ~ '/run-PLAN') }}"
  ansible.builtin.set_fact:
    rhc_base_tokens:
      work: "{{ _work }}"
      run: "{{ _run }}"
      shared: "{{ _run }}/shared/p/root"
      sparent: "{{ _run }}/shared/p"
      bundle_a: "{{ _run }}/bundles/a"
      # the canonical run checkout (READ-ONLY source of a fixture_ops copy_tree, e.g. the managed replica MR of manifests/)
      repo_root: "{{ rh_repo_root }}"
      # the bound profile's sha256 (RHC-PROFILE-BINDING above): a fresh-evidence field of seed.runlocal.exec-reached
      profile_sha256: "{{ rh_profile_sha256 }}"
      src: "{{ rhc_artifact_source | default('/PLAN/artifacts') }}"
      head: "{{ rhc_head | default('PLAN-HEAD') }}"
      uid: "{{ rhc_uid | default('PLAN-UID') }}"
      user: "{{ lookup('ansible.builtin.env', 'USER') | default('PLAN-USER', true) }}"
      home: "{{ lookup('ansible.builtin.env', 'HOME') }}"
      xdg_runtime_dir: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
      tmpprobe: "/tmp/lme-rhc-absent-{{ _run | basename }}"
      fixtures: "{{ _work }}/fixtures"
      # the seed-run workspace W (route 814cf6a admit_storage): rhc_work_root through its LAST /<root_rel>/ -- the run
      # clone's .work under codex ANCESTRY-RUN-LOCATION; a work root outside any workspace yields a PLAN marker that no
      # predicate can satisfy
      # No backslash constant inside {{ }} (RH-BUNDLE-CHECKSUM-NEWLINES class: ansible-core 2.19 AnsibleLexer doubles it, so the
      # former '\\1' replacement reached re.sub as a literal backslash + 1): split on the LAST /<root_rel>/ instead -- the same
      # value the greedy regex gave in every case (no inner /<root_rel>/ but a trailing /<root_rel>: the work root itself).
      workspace: >-
        {{ (((_work.split('/' ~ _bs.work_roots.root_rel ~ '/'))[:-1] | join('/' ~ _bs.work_roots.root_rel ~ '/')) ~ '/' ~ _bs.work_roots.root_rel)
             if ('/' ~ _bs.work_roots.root_rel ~ '/') in _work
           else (_work if ('/' ~ _bs.work_roots.root_rel ~ '/') in (_work ~ '/') else '/PLAN/work-root-not-under-a-workspace') }}
      canary: "{{ rhc_main_fixtures.root_canary | default('/PLAN/main-input-absent/canary') }}"
      foreign: "{{ rhc_main_fixtures.foreign_parent | default('/PLAN/main-input-absent/foreign') }}"
      # OD-BRR-11 (codex-tick543): the runner's admitted controller-seed generation, never the retired scalar builder
      builder: "{{ lookup('ansible.builtin.vars', _bs.work_roots.run_local.resolved_run.var).ansible_playbook }}"
      builder_python: "{{ lookup('ansible.builtin.vars', _bs.work_roots.run_local.resolved_run.var).python }}"
      sha256sum: "{{ _bs.os_tools.sha256sum.path }}"
      gen_id: "{{ rhc_gen_a | default('PLAN-GENERATION-OF-BUNDLE-A') }}"
      # the shared root's published receipt and its sha256 (bound by control.yml after the bundle-A fixture passes)
      sreceipt: "{{ _run }}/shared/p/root/{{ _bs.toolchain_receipt }}"
      # the published receipt's declared file name (any root: {root}/{receipt_name}); never a literal in the controls
      receipt_name: "{{ _bs.toolchain_receipt }}"
      sreceipt_sha256: PLAN-SHARED-RECEIPT-SHA256
      first_source_file: "{{ (_bs.artifacts | first).file }}"
      envelope_memory_plus_1: "{{ (rh.controller.local_envelope.memory_bytes | int) + 1 }}"
      run_keep: "{{ _bs.run_retention.keep | int }}"
      run_keep_plus_3: "{{ (_bs.run_retention.keep | int) + 3 }}"
      check_keep: "{{ _bs.layout.check_retention.keep | int }}"
      check_keep_plus_2: "{{ (_bs.layout.check_retention.keep | int) + 2 }}"
      staging_max: "{{ _bs.bundle.staging_retention.max_reserved_per_run | int }}"
      staging_repeat: "{{ (_bs.bundle.staging_retention.max_reserved_per_run | int) + (_bs.bundle.staging_retention.keep | int) + 2 }}"
      artifact_count: "{{ _bs.artifacts | length }}"
      # runner.seed.uv-added-files (codex 235616): relative names read from the bound profile's python declaration only
      # (installed_rel, gen_dirs.verify, archive_top, archive_interpreter_rel, uv_added_files, uv_patched_rel) -- never a
      # literal in the controls; an absent declaration yields a PLAN marker no path can hold
      py_rel: "{{ _bs.python.installed_rel }}"
      pbs_rel: "{{ _bs.layout.gen_dirs.verify }}/pbs/{{ _bs.python.archive_top }}"
      pbs_hold_rel: "{{ _bs.layout.gen_dirs.verify }}/pbs/{{ _bs.python.archive_interpreter_rel }}"
      uv_added_rel: "{{ (_bs.python.uv_added_files | default([{'rel': 'PLAN-NO-UV-ADDED-FILES'}]) | first).rel }}"
      # G-UV-ELSEWHERE-FIXTURE-LOCATION (codex tick338): the alternate directory is DECLARATION-derived, never a literal --
      # the first of the admitted interpreter's directory (python.archive_interpreter_rel below archive_top) and each
      # declared uv-patched file's directory (python.uv_patched_rel; the seed diffs both, so each is present on both sides)
      # that is not the first addition's own directory; none -> a PLAN marker no path can hold. The control ADMITS it before
      # its mutation (a real, owned, not group/other-writable directory on the installed side, a directory on the unpack
      # side, the destination absent on BOTH sides: no archive member is ever overwritten).
      uv_added_elsewhere_dir: >-
        {{ (([((_bs.python.archive_interpreter_rel | default(''))[((_bs.python.archive_top | default('')) | length) + 1:] | dirname)
               if (_bs.python.archive_interpreter_rel | default('')).startswith((_bs.python.archive_top | default('PLAN-NO-ARCHIVE-TOP')) ~ '/') else '']
             + (_bs.python.uv_patched_rel | default([]) | map('dirname') | list))
            | reject('equalto', '')
            | reject('equalto', ((_bs.python.uv_added_files | default([{'rel': 'PLAN-NO-UV-ADDED-FILES'}]) | first).rel | dirname))
            | list | first | default('PLAN-NO-ALTERNATE-UV-DIR')) }}
      uv_added_elsewhere_name: "{{ (_bs.python.uv_added_files | default([{'rel': 'PLAN-NO-UV-ADDED-FILES'}]) | first).rel | basename }}"
      uv_added_elsewhere_rel: >-
        {{ (([((_bs.python.archive_interpreter_rel | default(''))[((_bs.python.archive_top | default('')) | length) + 1:] | dirname)
               if (_bs.python.archive_interpreter_rel | default('')).startswith((_bs.python.archive_top | default('PLAN-NO-ARCHIVE-TOP')) ~ '/') else '']
             + (_bs.python.uv_patched_rel | default([]) | map('dirname') | list))
            | reject('equalto', '')
            | reject('equalto', ((_bs.python.uv_added_files | default([{'rel': 'PLAN-NO-UV-ADDED-FILES'}]) | first).rel | dirname))
            | list | first | default('PLAN-NO-ALTERNATE-UV-DIR'))
           ~ '/' ~ ((_bs.python.uv_added_files | default([{'rel': 'PLAN-NO-UV-ADDED-FILES'}]) | first).rel | basename) }}
      uv_added_nested_parent_rel: >-
        {{ ((_bs.python.uv_added_files | default([]) | map(attribute='rel') | select('search', '/') | list)
            | first | default('PLAN-NO-NESTED-UV-ADDED-FILE/x')) | dirname }}
      uv_added_nested_parent_name: >-
        {{ ((_bs.python.uv_added_files | default([]) | map(attribute='rel') | select('search', '/') | list)
            | first | default('PLAN-NO-NESTED-UV-ADDED-FILE/x')) | dirname | basename }}
      uv_patched_first_rel: "{{ _bs.python.uv_patched_rel | default(['PLAN-NO-UV-PATCHED-FILES']) | first }}"
    rhc_ctx_static:
      rh: "{{ rh }}"
      refusals: "{{ _bs.refusals }}"
      vocab: "{{ rhc_decl.vocabulary }}"
      env:
        HOME: "{{ lookup('ansible.builtin.env', 'HOME') }}"
        XDG_RUNTIME_DIR: "{{ lookup('ansible.builtin.env', 'XDG_RUNTIME_DIR') }}"
        DBUS_SESSION_BUS_ADDRESS: "{{ lookup('ansible.builtin.env', 'DBUS_SESSION_BUS_ADDRESS') }}"
        # seed_launch env.carried (run + an agent-carried ssh_auth mode): the runner's own socket, passed ONLY there
        SSH_AUTH_SOCK: "{{ lookup('ansible.builtin.env', 'SSH_AUTH_SOCK') }}"
      # G-PRIVATE-PREPARE-CUSTODY / G-RECORD-OPEN-BEFORE-TIMEOUT (ported from m1-1g): the record writer's refusal and the
      # bounded readback of its admitted records (controls.j2 writer_cmd / writer_admitted / record_readback; collect.yml)
      record_refusal: "{{ rhc_decl.state.record_refusal }}"
      record_readback: "{{ rhc_decl.state.record_readback }}"
      # G-LAUNCHER-CARRIED-PARAM-RENAME (codex 210509) / G-LAUNCH-PARAMS-FROM-USAGE-TEXT (codex 211754; same as m1-1g):
      # every seed_launch mode's positional parameters AS THE ROUTE CLASSIFIES THEM -- the route's machine export
      # seed_launcher.params_rel (a route template next to seed_launcher.template_rel that imports controller_seed.j2 and
      # returns {mode: launch_params(words)} over seed_launch.mode_args), rendered under this checkout's resolved bootstrap.
      # No usage text is parsed. G-EXPORT-AVAILABILITY-ORDER (codex 220515): the value is rhc_export.params, bound by
      # export_availability.yml ONLY for an admitted (declared, confined, present regular file), rendered and correctly
      # shaped export; otherwise null -- controls.j2 launch_values then leaves every seed launch unresolved (RHC-SEED-LAUNCH)
      # and plan_status QUEUES every launcher consumer on route_launch_params_export, while every other control still runs
      # (a declared-but-missing file no longer aborts the whole plan)
      launch_params: "{{ rhc_export.params }}"
      tools: "{{ rhc_decl.runner_tools }}"
      repo: "{{ rh_repo_root }}"
      variant_repo: ''
      receipt: {}
      bundles: {a: "{{ _run }}/bundles/a"}
      entry: "{{ rhc_decl.entrypoints }}"
      rendered_playbooks: "{{ rhc_decl.rendered_playbooks }}"
      seed_run_auth_mode: "{{ rhc_decl.seed_run_auth_mode }}"
      timeouts: "{{ rhc_decl.state.timeouts_s }}"
      phases: "{{ rhc_decl.interruption.phases }}"
      points: "{{ rhc_decl.interruption.points }}"
      hold: "{{ rhc_decl.interruption.hold }}"
      wraps: "{{ rhc_decl.wraps }}"
      act_scope: "{{ rhc_decl.act_scope }}"
      override_inventory: {}
      pin_names: []

- name: The reserved output names N01 pins -- the union of every declared source that is present (never a crash on a moved list)
  ansible.builtin.set_fact:
    _rhc_pin_found: >-
      {{ (_rhc_pin_found | default([])) + [lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'dig',
           'args': [(rh if item.kind == 'profile' else (lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ item.file, errors='ignore') | default('{}', true) | from_yaml)),
                    item.path]}}) | from_json | combine({'source': item})] }}
  loop: "{{ rhc_decl.pin_name_sources }}"
  loop_control:
    label: "{{ item.kind }} {{ item.file | default('') }} {{ item.path }}"

- name: Bind the pinned names (empty when no source is present -> N01 stays QUEUED on pin_names_declared)
  vars:
    _names: "{{ _rhc_pin_found | selectattr('found') | map(attribute='value') | select('iterable') | reject('string') | flatten | unique | list }}"
  ansible.builtin.set_fact:
    rhc_ctx_static: >-
      {{ rhc_ctx_static | combine({'pin_names': ((_names + ['rh_repo_root']
           + (rhc_decl.controls | selectattr('sweep', 'defined') | selectattr('sweep.kind', 'equalto', 'pins') | map(attribute='per_point_expect.must_include') | flatten))
           | unique | list) if _names else []}) }}
    rhc_pin_sources_found: "{{ _rhc_pin_found | selectattr('found') | map(attribute='source') | list }}"

- name: Refuse a non-integer count token (a whole-token value such as {run_keep} must reach the macros as a number)
  ansible.builtin.assert:
    that: "['envelope_memory_plus_1', 'run_keep', 'run_keep_plus_3', 'check_keep', 'check_keep_plus_2', 'staging_max', 'staging_repeat', 'artifact_count'] | map('extract', rhc_base_tokens) | reject('integer') | list | length == 0"
    fail_msg: "count tokens are not integers: {{ rhc_base_tokens }}"
    quiet: true

- name: Evaluate every declared dependency that is not a control (source probes, MAIN inputs, MAIN-only legs)
  vars:
    _d: "{{ item.value }}"
    _probe_text: >-
      {{ lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ _d.probe.file, errors='ignore') | default('', true)
         if (_d.kind == 'source' and _d.probe.file is defined) else '' }}
    _path: "{{ _d.input.split('.') if _d.kind == 'input' else [] }}"
    _top: "{{ lookup('ansible.builtin.vars', _path[0], default='') if _path else '' }}"
    _input_value: "{{ (_top[_path[1]] | default('')) if (_path | length == 2 and _top is mapping) else (_top if _path | length == 1 else '') }}"
    _met: >-
      {{ (_d.kind == 'source' and not (_d.probe.never | default(false))
          and (_d.probe.contains is not defined or _d.probe.contains in _probe_text)
          and (_d.probe.lacks is not defined or (_probe_text | length > 0 and _d.probe.lacks not in _probe_text)))
         or (_d.kind == 'input' and (_input_value | string | length > 0))
         or (_d.kind == 'ruling' and (rhc_decl.rulings[_d.ruling] | default(none)) is not none) }}
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | default({}) | combine({item.key: {'kind': _d.kind, 'control': _d.control | default(''),
          'met': (_met | bool) if _d.kind != 'control' else false,
          'value': (rhc_decl.rulings[_d.ruling] | default(none)) if _d.kind == 'ruling' else none,
          'why': _d.note | default(_d.kind ~ ' ' ~ (_d.input | default(_d.control | default(''))))}}) }}
  loop: "{{ rhc_decl.dependencies | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Digest every bound_bytes_at_authoring path (P04/P06 -- evidence binds to the bytes the controls were authored against)
  ansible.builtin.stat:
    path: "{{ rh_repo_root }}/{{ item.key }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  register: _rhc_bb
  loop: "{{ (rhc_decl.bound_bytes_at_authoring | default({}, true)) | dict2items | selectattr('key', 'search', '/') | list }}"
  loop_control:
    label: "{{ item.key }}"

# codex 023332 G-CURRENT-BINDING: absent or EMPTY required binding metadata is refused like a stale digest (never READY):
# an absent/empty/non-mapping bound_bytes_at_authoring, a path value that is not a 64-hex digest, a binding_required path
# with no bound digest, or a consumer_interface without {revision (int), interface_sha256 (64-hex)}.
- name: Refuse absent, empty or incomplete binding metadata (added to the stale list, which queues every control)
  vars:
    _bb: "{{ rhc_decl.bound_bytes_at_authoring | default(none) }}"
    _paths: "{{ (_bb | dict2items | selectattr('key', 'search', '/') | list) if _bb is mapping else [] }}"
    _ci: "{{ (_bb.consumer_interface | default(none)) if _bb is mapping else none }}"
  ansible.builtin.set_fact:
    _rhc_bb_stale: >-
      {{ (['bound_bytes_at_authoring absent or not a mapping'] if _bb is not mapping else [])
         + (['bound_bytes_at_authoring binds no source path'] if (_paths | length) == 0 else [])
         + (_paths | rejectattr('value', 'match', '^[0-9a-f]{64}$') | map(attribute='key') | map('regex_replace', '$', ' authored value is not a 64-hex digest') | list)
         + ((rhc_decl.binding_required | default([])) | reject('in', _paths | map(attribute='key') | list) | map('regex_replace', '$', ' has no bound digest (binding_required)') | list)
         + ([] if (_ci is mapping and (_ci.revision | default('')) is integer and (_ci.interface_sha256 | default('') | string) is match('^[0-9a-f]{64}$'))
            else ['consumer_interface binding absent or incomplete (revision int + interface_sha256 64-hex)']) }}

- name: Collect every bound path whose digest is absent or differs from the authored one
  ansible.builtin.set_fact:
    _rhc_bb_stale: >-
      {{ (_rhc_bb_stale | default([]))
         + ([item.item.key ~ ' ' ~ (item.stat.checksum | default('MISSING'))[:8] ~ '!=' ~ (item.item.value | string)[:8]]
            if (item.stat.checksum | default('MISSING')) != (item.item.value | string) else []) }}
  loop: "{{ _rhc_bb.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: bound_bytes_current is met only when every bound path carries its authored digest (else every control is QUEUED stale-binding)
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'bound_bytes_current': {'kind': 'binding', 'control': '', 'value': none,
          'met': (_rhc_bb_stale | default([])) | length == 0,
          'why': 'bound bytes changed since authoring or binding incomplete: ' ~ ((_rhc_bb_stale | default([])) | join(', '))}}) }}

- name: pin_names_declared is met when a declared pin-name source is present
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'pin_names_declared': rhc_deps.pin_names_declared | combine({'met': rhc_ctx_static.pin_names | length > 0,
          'why': 'no declared pin-name source is present: ' ~ (rhc_decl.pin_name_sources | map(attribute='path') | join(' | '))}) }) }}

- name: route_launch_params_export is met only by an admitted, rendered, correctly shaped export (codex 212700 / 220515)
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'route_launch_params_export': rhc_deps.route_launch_params_export | combine({
          'met': rhc_export.met | bool, 'state': rhc_export.state,
          'why': rhc_export.state ~ ': ' ~ rhc_export.why}) }) }}

# variant:<id> is met only when a route that declaration may ACTUALLY take is available (tasks/variant_admit.yml): the
# override (SEED-06 projection) never carries a profile_bytes_differ declaration, so those are reachable only by a
# variant_checkout: clone control (Route 3; it requires variant_clone_fixture instead of variant:<id>; controls.j2
# plan_status). Route 2 (a MAIN-staged rhc_variants copy) is RETIRED from the execution path (codex 220352 / 212700): a
# supplied copy never meets a dependency and is named as refused. A met variant:<id> whose route variant_admit.yml then
# cannot take would be a READY control that FAILs. The rule is the pure macro controls.j2 variant_dep (selftested:
# selftests.yml gate variant_dep).
- name: A declaration variant is available through the override route it may take (Route 2 MAIN-staged copies retired)
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'variant:' ~ item.key: lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'variant_dep',
           'args': [item.key, item.value, rhc_deps.seed06_projection.met, (rhc_variants | default({})) | list]}}) | from_json}) }}
  loop: "{{ rhc_decl.declarations | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Is the run checkout a git repository the declared variant clone can be cloned from? (read only)
  ansible.builtin.stat:
    path: "{{ rh_repo_root }}/.git"
    follow: false
    get_checksum: false
  register: _rhc_src_git

- name: variant_clone_fixture is met when the clone is declared, git is a declared runner tool and the run checkout has .git
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'variant_clone_fixture': rhc_deps.variant_clone_fixture | combine({
           'met': (rhc_decl.variant_clone is defined) and ((rhc_decl.runner_tools.git | default('')) | length > 0) and (_rhc_src_git.stat.exists | default(false)),
           'why': 'declared variant clone unavailable: variant_clone ' ~ ('declared' if rhc_decl.variant_clone is defined else 'ABSENT')
                  ~ ', runner_tools.git ' ~ (rhc_decl.runner_tools.git | default('ABSENT')) ~ ', ' ~ rh_repo_root ~ '/.git '
                  ~ ('present' if (_rhc_src_git.stat.exists | default(false)) else 'ABSENT')}) }) }}

# bundle_a_class (increment 2, codex 230249 (b)): a produce step of task bundle / admit binds bundle A's class exactly as
# scope_classes.yml / pack_class.yml do -- key = C1's published lme_resolved.remote_harness.scopes.controller[per_class.key_field]
# (never read from bundle.json), policy = that scope's resolved policy (policy_sha256 == rh_config_revision), lock = the
# policy's lock_file_rel. Met only when this runner's resolve carries that controller scope; otherwise every control that
# requires it is visibly QUEUED (never a smaller matrix, never a PASS).
- name: bundle_a_class is met only when the runner's resolve carries the controller class scope (key, policy, lock)
  vars:
    _s: "{{ lme_resolved.remote_harness.scopes | default(none) }}"
    _pc: "{{ rh.controller.bootstrap.bundle.per_class | default({}) }}"
    _ok: >-
      {{ _s is mapping and (_s.controller | default(none)) is mapping and (_pc.key_field | default('')) | length > 0
         and ((_s.controller[_pc.key_field] | default('')) is match(_pc.key_regex | default('^$')))
         and (_s.controller.policy_sha256 | default('')) == rh_config_revision
         and (_s.controller.policy | default(none)) is mapping
         and ((_s.controller.policy.controller | default({})).lock_file_rel | default('')) | length > 0 }}
  ansible.builtin.set_fact:
    rhc_deps: >-
      {{ rhc_deps | combine({'bundle_a_class': rhc_deps.bundle_a_class | combine({'met': _ok | bool,
          'why': 'the runner resolve does not carry lme_resolved.remote_harness.scopes.controller with a well-formed '
                 ~ (_pc.key_field | default('?')) ~ ', policy_sha256 == rh_config_revision, a policy mapping and its lock_file_rel'
                 ~ ' (scopes ' ~ ('present' if _s is mapping else 'ABSENT') ~ ')'}) }) }}

- name: Case binding -- every named case id exists in its owner's file
  ansible.builtin.set_fact:
    rhc_coverage: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'coverage', 'args': [rhc_decl.controls, rhc_sources]}}) | from_json }}"

- name: Plan every control and variant (compile, expand tokens, check vocabulary and residual tokens)
  vars:
    _ctx: "{{ rhc_ctx_static | combine({'t': rhc_base_tokens}) }}"
    _unimpl: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'unimplemented', 'args': [item, rhc_decl.vocabulary]}}) | from_json }}"
    _compiled: >-
      {{ (lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'compile', 'args': [item, _ctx]}}) | from_json)
         if (item.declared_only is not defined and item.static_checks is not defined) else [] }}
  ansible.builtin.set_fact:
    rhc_plan: >-
      {{ rhc_plan | default([]) + [{'control': item.id, 'cases': item.cases | default([]), 'findings': item.findings | default([]),
          'variants': (item.variants | default([{'id': 'base'}])) | map(attribute='id') | list,
          'unimplemented': _unimpl,
          'compiled': _compiled}] }}
  loop: "{{ rhc_decl.controls }}"
  loop_control:
    label: "{{ item.id }}"

- name: Planned status per control/variant, residual tokens after expansion (bound tokens excepted)
  vars:
    _c: "{{ rhc_decl.controls | selectattr('id', 'equalto', item.0.control) | first }}"
    _v: "{{ (_c.variants | default([{'id': 'base'}])) | selectattr('id', 'equalto', item.1) | first }}"
    _cv: "{{ item.0.compiled | selectattr('variant', 'equalto', item.1) | list }}"
    # the SAME derivation as variant.yml (fixture_ctl -> {vctl} = {ctl}/<fixture_ctl>; default {vctl} = {ctl})
    _pctl: "{{ rhc_base_tokens.run ~ '/controls/' ~ item.0.control ~ '/' ~ item.1 }}"
    _pvctl: "{{ _pctl ~ (('/' ~ _v.fixture_ctl) if _v.fixture_ctl is defined else '') }}"
    _vt: >-
      {{ rhc_base_tokens | combine({'ctl': _pctl,
                                    'parent': _pctl ~ '/p',
                                    'root': _pctl ~ '/p/root',
                                    'rootname': 'root', 'fifo': _pctl ~ '/fifo',
                                    'gen': _pctl ~ '/p/root/generations/' ~ rhc_base_tokens.gen_id,
                                    'sgen': rhc_base_tokens.run ~ '/shared/p/root/generations/' ~ rhc_base_tokens.gen_id,
                                    'staging': 'BOUND-AT-RUN', 'reaping': 'BOUND-AT-RUN', 'sibling': 'BOUND-AT-RUN', 'vowner': rhc_base_tokens.user,
                                    'vctl': _pvctl,
                                    'vclone': _pvctl ~ '/vclone',
                                    'vwork': _pvctl ~ '/vclone/' ~ rh.controller.bootstrap.work_roots.root_rel,
                                    'vparent': _pvctl ~ '/vclone/' ~ rh.controller.bootstrap.work_roots.root_rel ~ '/p',
                                    'vroot': _pvctl ~ '/vclone/' ~ rh.controller.bootstrap.work_roots.root_rel ~ '/p/root'}) }}
    _vt2: "{{ _vt | combine(lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'xjson', 'args': [_v.tokens | default({}), _vt]}}) | from_json) }}"
    _expanded: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'xjson', 'args': [_cv, _vt2]}}) }}"
    _status: "{{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'plan_status', 'args': [_c, _v, rhc_deps, item.0.unimplemented[item.1] | default([])]}}) | from_json }}"
  ansible.builtin.set_fact:
    rhc_planned: >-
      {{ rhc_planned | default([]) + [{'control': item.0.control, 'variant': item.1, 'status': _status.status, 'why': _status.why,
          'residual': lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'residual', 'args': [_expanded]}}) | from_json}] }}
  loop: "{{ rhc_plan | subelements('variants') }}"
  loop_control:
    label: "{{ item.0.control }}/{{ item.1 }}"

- name: Refuse declaration errors (unknown case ids, duplicate ids, undeclared dependencies or declarations, residual tokens)
  vars:
    _ids: "{{ rhc_decl.controls | map(attribute='id') | list }}"
    _reqs: >-
      {{ (rhc_decl.controls | map(attribute='requires', default=[]) | flatten)
         + (rhc_decl.controls | map(attribute='variants', default=[]) | flatten | map(attribute='requires', default=[]) | flatten) }}
    _decls: >-
      {{ ((rhc_decl.controls | map(attribute='declaration', default='') | list)
          + (rhc_decl.controls | map(attribute='variants', default=[]) | flatten | map(attribute='declaration', default='') | list)) | select | list }}
  ansible.builtin.assert:
    that:
      - rhc_coverage.unknown | length == 0
      - _ids | length == _ids | unique | length
      - _reqs | reject('in', rhc_decl.dependencies) | list | length == 0
      - rhc_decl.controls | selectattr('applies_when', 'defined') | map(attribute='applies_when.ruling') | reject('in', rhc_decl.dependencies) | list | length == 0
      - rhc_decl.dependencies | dict2items | selectattr('value.kind', 'equalto', 'ruling') | map(attribute='value.ruling') | reject('in', rhc_decl.rulings) | list | length == 0
      - _decls | reject('in', rhc_decl.declarations) | list | length == 0
      - rhc_planned | selectattr('residual') | list | length == 0
    fail_msg: >-
      DECLARATION ERROR: unknown case ids {{ rhc_coverage.unknown }}; duplicate control ids
      {{ _ids | difference(_ids | unique) }}; undeclared dependencies {{ _reqs | reject('in', rhc_decl.dependencies) | unique | list }};
      undeclared declarations {{ _decls | reject('in', rhc_decl.declarations) | unique | list }};
      residual tokens {{ rhc_planned | selectattr('residual') | map(attribute='control') | zip(rhc_planned | selectattr('residual') | map(attribute='residual')) | list }}
    quiet: true
