---
# report (G). plan: the planned status of every control/variant, the case rows no control names and the requested rows.
# execute: summary.json in the run dir; the play FAILS unless every selected control/variant is PASS (NOT-APPLICABLE
# excepted: an option codex did not pick) and no cleanup finding was recorded. Nothing here claims acceptance: the
# summary is evidence for codex review.

- name: Planned status (plan mode)
  ansible.builtin.debug:
    msg:
      mode: plan
      bound_bytes_at_authoring: "{{ rhc_decl.bound_bytes_at_authoring }}"
      counts: "{{ rhc_planned | groupby('status') | map('first') | zip(rhc_planned | groupby('status') | map('last') | map('length')) | map('join', ' ') | list }}"
      planned: "{{ rhc_planned | map(attribute='control') | zip(rhc_planned | map(attribute='variant'), rhc_planned | map(attribute='status'), rhc_planned | map(attribute='why')) | map('list') | list }}"
      uncovered_case_rows: "{{ rhc_coverage.uncovered }}"
      # G-E77-PARTIAL-COVERAGE: rows the controls name only by some of the row's declared variants (declared, not evidence)
      partial_case_rows: "{{ rhc_coverage.partial }}"
      requested_case_rows: "{{ rhc_decl.requested_cases }}"
      known_case_rows: "{{ rhc_coverage.known_count }}"
      gate_selftests: >-
        {{ ((rhc_selftests.cases | length) - (rhc_selftest_blocked | default([]) | length)) ~ ' of ' ~ (rhc_selftests.cases | length)
           ~ ' cases evaluated over ' ~ (rhc_selftests.gates | length) ~ ' gates, all as declared'
           ~ ((('; BLOCKED (not evaluated, not a PASS) on the route export seed_launcher.params_rel: ' ~ (rhc_selftest_blocked | to_json)))
              if (rhc_selftest_blocked | default([]) | length > 0) else '') }}
      static_checks: "{{ rhc_static_results | default([]) }}"
  when: rhc_mode == 'plan'

# covered = PASS evidence folded through the row model (controls.j2 coverage_of): a row named whole by a PASS result is
# covered; a row named only by case_components is covered once the PASS components span every declared variant of the
# row, otherwise it is reported PARTIAL {covered, missing} -- never counted covered.
- name: Fold the PASS results through the row model (execute mode)
  ansible.builtin.set_fact:
    _rhc_cov_pass: >-
      {{ lookup('ansible.builtin.template', rhc_call_j2, template_vars={'rhc_call': {'fn': 'coverage_of',
           'args': [rhc_results | selectattr('status', 'equalto', 'PASS') | list, rhc_sources]}}) | from_json }}
  when: rhc_mode == 'execute'

- name: Write summary.json (execute mode)
  ansible.builtin.copy:
    dest: "{{ rhc_run_dir }}/summary.json"
    mode: '0600'
    content: >-
      {{ {'release': rhc_release, 'bound': rhc_evidence_bound, 'results': rhc_results, 'cleanup_findings': rhc_cleanup_findings,
          'shared_root_tainted': rhc_shared_tainted, 'uncovered_case_rows': rhc_coverage.uncovered,
          'covered_case_rows': _rhc_cov_pass.whole, 'partial_case_rows': _rhc_cov_pass.partial,
          'acceptance': 'not claimed by the runner; codex reviews this evidence'} | to_nice_json }}
  when: rhc_mode == 'execute'

- name: Execute result table
  ansible.builtin.debug:
    msg: "{{ rhc_results | map(attribute='control') | zip(rhc_results | map(attribute='variant'), rhc_results | map(attribute='status'), rhc_results | map(attribute='why')) | map('list') | list }}"
  when: rhc_mode == 'execute'

- name: Every selected control/variant must PASS (only PASS passes; BUSY, QUEUED, UNIMPLEMENTED, RESIDUAL and OPEN-REGRESSION do not)
  ansible.builtin.assert:
    that:
      - rhc_results | length > 0
      - rhc_results | rejectattr('status', 'in', ['PASS', 'NOT-APPLICABLE']) | list | length == 0
      - rhc_cleanup_findings | length == 0
    fail_msg: >-
      NOT PASS: {{ rhc_results | rejectattr('status', 'in', ['PASS', 'NOT-APPLICABLE']) | map(attribute='control') | zip(rhc_results
      | rejectattr('status', 'in', ['PASS', 'NOT-APPLICABLE']) | map(attribute='variant'), rhc_results | rejectattr('status', 'in', ['PASS', 'NOT-APPLICABLE'])
      | map(attribute='status')) | map('join', '/') | list }}; cleanup findings {{ rhc_cleanup_findings }}; evidence {{ rhc_run_dir }}/summary.json
    quiet: true
  when: rhc_mode == 'execute'
