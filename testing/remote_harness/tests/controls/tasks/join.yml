---
# wait for a background action to end (_rhc_step.join names its step) and judge it with this step's expectation

- name: "Join {{ _rhc_step.join }}"
  ansible.builtin.async_status:
    jid: "{{ _rhc_jobs[_rhc_step.join].jid }}"
  register: _rhc_joined
  until: _rhc_joined.finished | default(false)
  retries: "{{ ((_rhc_jobs[_rhc_step.join].plan.timeout_s | int) // 5) + 30 }}"
  delay: 5
  failed_when: false

- name: "Collect and judge {{ _rhc_step.join }}"
  ansible.builtin.include_tasks: collect.yml
  vars:
    rhc_cid: "{{ _rhc_step.id }}"
    rhc_cplan: "{{ _rhc_jobs[_rhc_step.join].plan }}"
    rhc_crc: "{{ _rhc_joined.rc | default(-1) if (_rhc_joined.finished | default(false)) else 124 }}"
    rhc_cexp: "{{ _rhc_step.expect | default({}) }}"

- name: "Clean up the async record of {{ _rhc_step.join }}"
  ansible.builtin.async_status:
    jid: "{{ _rhc_jobs[_rhc_step.join].jid }}"
    mode: cleanup
  failed_when: false
