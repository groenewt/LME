    steps:
      - {id: tb-xv-lme_resolved, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost,
                                        inventory_extra: {rh_bundle_dir: '{bundle_a}'}, extra_vars: {lme_resolved: rhc-pinned}},
         expect: {rc_nonzero: true, playbook_refusal: RH-DERIVED-OUTPUT-PINNED, refused_at: Refuse pre-supplied harness derived outputs}}
      - {id: tb-inv-_lme_rh_scope, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost,
                                          inventory_extra: {rh_bundle_dir: '{bundle_a}', _lme_rh_scope: rhc-pinned}},
         expect: {rc_nonzero: true, playbook_refusal: RH-DERIVED-OUTPUT-PINNED, refused_at: Refuse pre-supplied harness derived outputs}}
      - {id: tb-inv-lme_global, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost,
                                       inventory_extra: {rh_bundle_dir: '{bundle_a}', lme_global: rhc-pinned}},
         expect: {rc_nonzero: true, playbook_refusal: RH-DERIVED-OUTPUT-PINNED, refused_at: Refuse pre-supplied harness derived outputs}}
      - {id: input-still-composes, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost,
                                          inventory_extra: {rh_bundle_dir: '{bundle_a}', lme_global_override: {}}},
         expect: {stdout_regex: 'TASK \[Bind the effective controller connection', stdout_not_regex: ['REFUSED RH-DERIVED-OUTPUT-PINNED']}}
    note: 'refuse_pinned_outputs.yml reads reserved_outputs AND resolver_outputs inline from manifests/global.yml at every play''s first task'

  # ---- E49: undeclared class siblings ----
  - id: package.classes.undeclared-sibling-preserved
    cases: [E49-undeclared-class-sibling-preserved]
