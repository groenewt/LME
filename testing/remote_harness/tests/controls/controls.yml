  - id: run_local.screen.selectors-and-inputs
    cases: [E56-run-local-selectors-and-inputs]
    findings: [RH-RUNLOCAL-OVERRIDES, RH-RUNNER-RESOLVED-WORKROOT]
    requires: [bundle_a]
    root: fresh
    # route 80aab68 RH-RUNLOCAL-OVERRIDES (codex 152001): the CLOSED caller grammar run_local.caller_vars replaced the regex
    # screen. Every expected stderr below is the committed controller_seed.j2 run_local_args message with rl.mode = run-local
    # and the variant's own name/value substituted; each variant is traced through the seed's case branches in order
    # (JSON shape -> JSON chars | key=value chars -> form -> name chars -> reserved globs -> work_root_var -> duplicate ->
    # required inputs), so the named message is the FIRST refusal that input reaches. Refusal RH-SEED-USAGE = exit 2.
    rows:
      executor: 'E56 -e ansible_connection=ssh -> REFUSED RH-SEED-USAGE (2) reserved selector (glob ansible_*)'
      interpreter: 'E56 -e ansible_python_interpreter=/usr/bin/python3 -> reserved selector'
      privilege: 'E56 -e ansible_become=true -> reserved selector'
      privilege-user: 'E56 -e become_user=root -> reserved selector (glob become*)'
      temp: 'E56 -e ansible_remote_tmp=<path> -> reserved selector'
      json-form: 'E56 -e ''{"ansible_connection":["ssh"]}'' (the supported JSON shape) -> reserved selector'
      json-whitespace: 'E56 -e ''{"ansible_connection": "ssh"}'' -> unsupported JSON extra-var (shape)'
      yaml-single-quoted-key: 'E56 -e "{''ansible_shell_executable'': ''/bin/x''}" -> unsupported extra-var form (no =, not {")'
      yaml-single-quoted-key-with-eq: 'E56 -e "{''ansible_shell_executable'': ''a=b''}" -> key=value branch; its VALUE b''} holds a quote and a brace, which the seed checks before the name (lifecycle says "name holds { and quote": same refusal code, the value message comes first)'
      json-u-escaped-key: 'E56 -e ''{"\u0061nsible_shell_executable":["/bin/x"]}'' -> unsupported extra-var name (backslash)'
      json-multi-key: 'E56 -e ''{"only":["a"],"ansible_become":[true]}'' -> JSON extra-var only holds a character outside value_chars'
      json-nested: 'E56 -e ''{"x":{"y":{"ansible_become":"z"}}}'' -> JSON extra-var x holds a character outside value_chars'
      file-form: 'E56 -e @<file> (the file sets ansible_become and is never read) -> unsupported extra-var form'
      multi-pair: 'E56 -e ''run_label=a ansible_become=true'' -> extra-var run_label value holds a character outside value_chars'
      quoted-value: 'E56 -e ''x="a b"'' -> extra-var x value holds a character outside value_chars'
      braced-value: 'E56 -e ''x=a}b'' (a template brace; an opening {a..} form is a controls token and is not declarable here) -> value chars'
      duplicate: 'E56 -e run_label=a -e run_label=b -> extra-var run_label given twice (ambiguous)'
      work-root-var: 'E56 -e work_root=<path> (acceptance work_root_var) -> the runner work root the seed supplies'
      magic: 'E56 -e playbook_dir=/x -> reserved selector (magic variable)'
      magic-hostvars: 'E56 -e hostvars=x -> reserved selector (magic variable)'
      reserved: 'E56 -e ''{"lme_resolved_run":{}}'' -> reserved selector'
      missing-required: 'E56 run-local --runner loader_cases without its required inputs -> the FIRST declared one (repo_root) named'
      empty-required: 'E56 every loader_cases required input present except -e run_label= (empty) -> run_label named'
      positive-name-eq-value: 'E56 positive -e run_label=r1 (name_eq_value)'
      positive-json-list: 'E56 positive -e ''{"rhc_select":["all"]}'' (json_single_key list; G remote_harness_controls)'
      positive-json-mapping: 'E56 positive -e ''{"source_ref":{"path":"/abs/candidate","commit":"<40-hex>"}}'' (json_single_key flat mapping; B transfer_controls)'
    refute: 'each variant FAILS if the seed does not refuse RH-SEED-USAGE with exactly its traced caller-grammar / required-input message, or creates the named root'
    hostile: 'reserved names in key=value and JSON forms; unsupported JSON shapes, YAML, @file, multi-key / nested JSON, escaped names; value characters; duplicates; the runner work_root_var; magic variables; the reserved resolved-run record; missing and empty required inputs'
    setup:
      - {write: '{ctl}/vars.yml', mode: '0600', content: "ansible_become: true\n"}
    variants:
      - {id: executor, tokens: {sel: 'ansible_connection=ssh', msg: 'run-local: extra-var ansible_connection is a reserved selector (executor/interpreter/privilege/temp, magic variable or lme_resolved_run)'}}
      - {id: interpreter, tokens: {sel: 'ansible_python_interpreter=/usr/bin/python3', msg: 'run-local: extra-var ansible_python_interpreter is a reserved selector'}}
      - {id: privilege, tokens: {sel: 'ansible_become=true', msg: 'run-local: extra-var ansible_become is a reserved selector'}}
      - {id: privilege-user, tokens: {sel: 'become_user=root', msg: 'run-local: extra-var become_user is a reserved selector'}}
      - {id: temp, tokens: {sel: 'ansible_remote_tmp={ctl}/x', msg: 'run-local: extra-var ansible_remote_tmp is a reserved selector'}}
      - {id: json-form, tokens: {sel: '{"ansible_connection":["ssh"]}', msg: 'run-local: extra-var ansible_connection is a reserved selector'}}
      - {id: json-whitespace, tokens: {sel: '{"ansible_connection": "ssh"}', msg: 'run-local: unsupported JSON extra-var (only {"<name>":[...]} or {"<name>":{...}}, one key, no whitespace): {"ansible_connection": "ssh"}'}}
      - {id: yaml-single-quoted-key, tokens: {sel: '{''ansible_shell_executable'': ''/bin/x''}', msg: 'run-local: unsupported extra-var form (<name>=<value> or {"<name>":[...]} / {"<name>":{...}} only; no @file, YAML or multi-key mapping): {''ansible_shell_executable'': ''/bin/x''}'}}
      - {id: yaml-single-quoted-key-with-eq, tokens: {sel: '{''ansible_shell_executable'': ''a=b''}', msg: 'run-local: extra-var {''ansible_shell_executable'': ''a value holds a character outside run_local.caller_vars.value_chars (no whitespace, quote, escape, brace or template)'}}
      - {id: json-u-escaped-key, tokens: {sel: '{"\u0061nsible_shell_executable":["/bin/x"]}', msg: 'run-local: unsupported extra-var name (quoted, escaped, or outside run_local.caller_vars name_first_chars/name_chars): {"\u0061nsible_shell_executable":["/bin/x"]}'}}
      - {id: json-multi-key, tokens: {sel: '{"only":["a"],"ansible_become":[true]}', msg: 'run-local: JSON extra-var only holds a character outside run_local.caller_vars.value_chars and the double quote (no nesting, escape, whitespace or template)'}}
      - {id: json-nested, tokens: {sel: '{"x":{"y":{"ansible_become":"z"}}}', msg: 'run-local: JSON extra-var x holds a character outside run_local.caller_vars.value_chars and the double quote'}}
      - {id: file-form, tokens: {sel: '@{ctl}/vars.yml', msg: 'run-local: unsupported extra-var form (<name>=<value> or {"<name>":[...]} / {"<name>":{...}} only; no @file, YAML or multi-key mapping): @{ctl}/vars.yml'}}
      - {id: multi-pair, tokens: {sel: 'run_label=a ansible_become=true', msg: 'run-local: extra-var run_label value holds a character outside run_local.caller_vars.value_chars'}}
      - {id: quoted-value, tokens: {sel: 'x="a b"', msg: 'run-local: extra-var x value holds a character outside run_local.caller_vars.value_chars'}}
      - {id: braced-value, tokens: {sel: 'x=a}b', msg: 'run-local: extra-var x value holds a character outside run_local.caller_vars.value_chars'}}
      - {id: work-root-var, tokens: {sel: 'work_root={ctl}/elsewhere', msg: 'run-local: extra-var work_root is the runner work root the seed supplies'}}
      - {id: magic, tokens: {sel: 'playbook_dir=/x', msg: 'run-local: extra-var playbook_dir is a reserved selector'}}
      - {id: magic-hostvars, tokens: {sel: 'hostvars=x', msg: 'run-local: extra-var hostvars is a reserved selector'}}
      - {id: reserved, tokens: {sel: '{"lme_resolved_run":{}}', msg: 'run-local: extra-var lme_resolved_run is a reserved selector'}}
      - {id: duplicate}
      - {id: missing-required}
      - {id: empty-required}
      - {id: positive-name-eq-value, requires: [workspace_run_local]}
      - {id: positive-json-list, requires: [workspace_run_local]}
      - {id: positive-json-mapping, requires: [workspace_run_local]}
    steps:
      - {id: screen, skip_variants: [duplicate, missing-required, empty-required, positive-name-eq-value, positive-json-list, positive-json-mapping],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', acceptance, '--', '-e', '{sel}']},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['{msg}']},
         post_state: [{path: '{ctl}/toolchain', exists: false}, {path: '{ctl}/x', exists: false}, {path: '{ctl}/elsewhere', exists: false}]}
      - {id: duplicate, only_variants: [duplicate],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', acceptance, '--', '-e', 'run_label=a', '-e', 'run_label=b']},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['run-local: extra-var run_label given twice (ambiguous)']},
         post_state: [{path: '{ctl}/toolchain', exists: false}]}
      - {id: missing, only_variants: [missing-required],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', loader_cases]},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['runner loader_cases needs -e repo_root=<value> (required input; no default)']},
         post_state: [{path: '{ctl}/toolchain', exists: false}]}
      - {id: empty, only_variants: [empty-required],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain',
               args: ['--runner', loader_cases, '--', '-e', 'repo_root=x', '-e', 'cases_file=x', '-e', 'run_label=', '-e', 'probe_ansible_playbook=x',
                      '-e', 'expected_runner_ansible_core=x', '-e', 'expected_probe_ansible_core=x', '-e', 'expected_probe_python_executable=x',
                      '-e', 'expected_probe_python_version=x', '-e', 'run_mode=x', '-e', 'source_commit=x', '-e', 'interpreter_policy=x',
                      '-e', 'managed_interpreter_root=x']},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['runner loader_cases needs -e run_label=<value> (required input; no default)']},
         post_state: [{path: '{ctl}/toolchain', exists: false}]}
    note: 'The caller grammar runs in the seed''s run_local_args, BEFORE root_check and admit_storage (controller_seed.j2 order), so a throwaway
      root that could never host run-local still reaches it; nothing is created. The three positives need the packaged checkout''s own .work
      (workspace_run_local: the ruled run clone, MAIN''s run-local). No -e value here is a controls token: every {..} in a sel/msg starts with
      a quote, so the residual-token rule \{[a-z][a-z0-9_]*\} never matches it.'

