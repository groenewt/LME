# Route 3 (clone): G's declared clone fixture (variant_clone below), ALWAYS the route of a control with variant_checkout: clone.
# Route 3 is admitted only when the clone's profile == candidate profile recursively combined with the patch
# AND every other package input is byte-identical (tasks/variant_admit.yml).
# `variant:<id>` (the planning dependency of a control without variant_checkout) is met only when a route that
# declaration may take is available: Route 1 (never for profile_bytes_differ). A variant_checkout: clone
# control requires variant_clone_fixture instead. Neither -> QUEUED naming the unmet dependency.
declarations:
  cfg:          {patch: {ansible_config_content: "# LME managed generation config: intentionally empty. ANSIBLE_CONFIG points here so no ambient ansible.cfg is discovered.\n# rhc variant cfg\n"}}
  # C1 path_requires (manifests/global.yml tunable_paths): a path override MUST carry a complete sibling identity in the same
  # override, else C1 refuses it at the engine resolve before any harness task. Every path declaration below therefore
