      empty-list: 'E48 empty-list: a repository copy whose registry resolver_outputs is [] -> MAIN-staged (candidate-clone run)'
      target-host-var: 'E48 an inventory host var on a TARGET (play 2 first task): target.admit.precontact-refused'
    refute: 'a pin of a declared INPUT (lme_global_override, which C1 excludes from resolver_outputs) is not refused -> the input-still-composes step would FAIL if it were'
    hostile: 'resolver outputs pre-supplied to the target bootstrap entrypoint'
