    - {from_os_tool: mv, path: '{fixtures}/tools/mv'}

# ---------------------------------------------------------------------------------------------------------------
# Interruption points. Each is compiled into: fresh root; apply (or package) under strace with a delay injected at the
# point; wait for the point's observable (the effect happened, the tracee is frozen inside the hold); assert `valid`
# (the kill lands strictly between this effect and the next); kill the whole operation (the seed's budget scope via
# systemctl --user kill, then every process naming the root; pgrep must find none); interrupted-state predicates;
# verify while interrupted (publication points); reapply (converges); verify; purge; clear parent staging.
# Points without a stable absolute-path observable (a partial rmtree inside the reaping dir) need trace DISCOVERY,
# declared but NOT implemented (their control stays UNIMPLEMENTED, reported as a gap).
interruption:
  hold: 20s
  points:
    - id: root-parent-lock
      syscalls: [flock]
      when: exit
      wait: {file_regex: {file: '{ctl}/pt-root-parent-lock-apply.strace', regex: 'flock\(8, .*DELAYED'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 0}}, {path: '{root}', exists: false}]
      rerun: {outcome: INSTALLED}
      note: 'r3c: the creator holds flock on the PARENT (fd 8) before stale recovery/mkdir (E20); a kill here leaves nothing'
    - id: root-staging-created
      syscalls: [mkdir, mkdirat]
      when: exit
      wait: {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 0}}, {path: '{root}', exists: false}]
      rerun: {stderr_regex: '^REMOVED-STALE-ROOT-STAGING {parent}/\.{rootname}\.creating\.', outcome: INSTALLED}
    - id: root-staging-marked
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}'
      wait: {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 1}},
              {path: '{staging}/.lme-controller-root', exists: true}, {path: '{root}', exists: false}]
      rerun: {stderr_regex: '^REMOVED-STALE-ROOT-STAGING {parent}/\.{rootname}\.creating\.', outcome: INSTALLED}
    - id: root-locked
      syscalls: [flock]
      when: exit
      wait: {file_regex: {file: '{ctl}/pt-root-locked-apply.strace', regex: 'flock\(9, .*DELAYED'}}
      valid: [{path: '{root}/.lme-controller-root', exists: true}, {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 0}}, {path: '{root}/generations', exists: false}]
      rerun: {outcome: INSTALLED}
      note: 'every flock call is delayed (the parent lock first, then this one); the wait matches the root lock fd'
    - id: gen-staging-created
      syscalls: [mkdir, mkdirat]
      when: exit
      wait: {glob: {dir: '{root}/generations', pattern: '.creating.*'}}
      valid: [{glob: {dir: '{root}/generations', pattern: '.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 0}}, {path: '{gen}', exists: false}]
      rerun: {outcome: INSTALLED}
      after: [{file: '{root}/operations.log', regex: '^removed-staging [0-9TZ-]+ '}]
    - id: gen-staging-operation
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{gen}'
      wait: {glob: {dir: '{root}/generations', pattern: '.creating.*'}}
      valid: [{glob: {dir: '{root}/generations', pattern: '.creating.*', count: 1, bind: staging}}, {path: '{staging}/.operation', exists: true}, {path: '{gen}', exists: false}]
      rerun: {outcome: INSTALLED}
      after: [{file: '{root}/operations.log', regex: '^removed-staging [0-9TZ-]+ '}]
    - id: receipt-before-publication
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}/active-toolchain.json'
      wait: {path_exists: '{gen}/COMPLETE'}
      valid: [{path: '{root}/active-toolchain.json', exists: false}]
      publication: true
      rerun: {outcome: UNCHANGED}
    - id: pointer-before-publication
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}/active-generation'
      wait: {path_exists: '{root}/active-toolchain.json'}
      valid: [{path: '{root}/active-generation', exists: false}]
      publication: true
      rerun: {outcome: UNCHANGED}
  phases: [artifacts-verified, uv-install, uv-verify, python-downloads-json, python-install, python-verify, venv, wheels, ansible-config, collections, smoke, seal, complete]

# ---------------------------------------------------------------------------------------------------------------
# Target fixtures (YAML anchors ONLY; the runner never reads this key). Every address is RFC 5737 TEST-NET-1 (192.0.2.0/24,
# guarded at plan time and before the inventory is written): G never reaches a host. Host vars per target_bootstrap.yml's
# inventory contract (root / owner / bundle dir / mode / ansible_user = owner). Paths are control-owned and never created on
# any host (every leg using them refuses before contact, or runs play 1 only with --limit localhost).
target_fixtures:
