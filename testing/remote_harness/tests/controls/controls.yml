  - id: I04-package-interrupt-and-incomplete-bundle
    cases: [E10-package-interrupted-resume, E07-apply-incomplete-bundle]
    findings: [SEED2-PACKAGE-RESERVATION, SEED2-BUNDLE-COMPLETION, M1-STAGING-RECOVERY]
    requires: [bundle_a]
    root: fresh
    steps:
      - {id: package, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: after-render, wait: {file_regex: {file: '{ctl}/package.stdout', regex: 'TASK \[Digest the staged copies and the rendered seed\]'}}, timeout_s: 600}
      - {id: kill, kill: {step: package}}
      - {id: join, join: package, expect: {killed: true}}
      - {id: left, state: [{path: '{ctl}/bundle', exists: false}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1, bind: staging}},
                           {path: '{staging}/bundle.json', exists: false}]}
