  # ---- RH-G-RUNLOCAL-EXEC-REACHED (route proposal; coordinator-relayed; controller_seed.j2 b8eafe9b run-local newline fix) ----
  # Two legs. STATIC (G-runnable): the RENDERED bundle-A seed carries the run-local override assignments as plain command
  # substitutions -- a line matching ^\s*_pin=\$\(printf and a line matching ^\s*_rr=\$\(printf (controller_seed.j2 :1179 /
  # :1184) -- and NO quoted form "..."_pin=$( / "..."_rr=$( anywhere (the file predicate has no negated regex, so the absence
  # is one positive regex: a \A-anchored negative lookahead over the whole text). RUNTIME (MAIN): after package + apply of the
  # packaged checkout's OWN toolchain root, `run-local` with runner probe_env exits 0 and leaves
  # {workspace}/run/probe-env/env.json regular at 0600 -- it needs workspace_run_local (never met by G's runner), so it stays
  # QUEUED here. Runtime evidence exists on m1-1g 96a3d700 (env.json fffd0c37, coordinator-relayed) but is NOT control
  # credit. The route's optional negative stays OPTIONAL and NOT BUILT. All UNRUN.
  # FRESH-EVIDENCE BOUNDARY (codex tick308-309 G-RUNLOCAL-STALE-PROBE): rc 0 plus a fixed-path env.json can be a PRIOR
  # invocation's artifact when a regressed run-local returns 0 before its exec. The boundary is PRESERVE-AND-REFUSE: the
  # step right before the run-local requires env.json ABSENT; an existing artifact (MAIN's fffd0c37 included) fails that
  # step, the variant stops there (variant.yml: first failed step) and the artifact is left untouched -- nothing is
  # deleted, moved or overwritten; clearing it is MAIN's decision. Absent before + present after = written by THIS
  # invocation. The run-local result must also show the runner COMPLETED (its final acceptance task ran ok and the play
  # recap has failed=0 -- default callback assumed, UNVERIFIED), and the artifact must carry work_root
  # {workspace}/run/probe-env, the current profile_sha256 (token profile_sha256 = rh_profile_sha256, the run checkout's
  # bound profile; the workspace IS the run checkout per codex ANCESTRY-RUN-LOCATION -- UNVERIFIED at runtime) and
  # ssh_auth_sock_present false. The stale-artifact + no-exec negative is built as gate selftests on the SAME expectation
  # shapes (selftests.yml runlocal-*): G cannot run a regressed run-local (no hold point, no workspace_run_local).
  - id: seed.runlocal.exec-reached
    cases: []
    findings: [RH-G-RUNLOCAL-EXEC-REACHED]
    requires: [bundle_a]
    root: shared
    rows:
      static-assignments: 'the rendered seed has ^\s*_pin=\$\(printf and ^\s*_rr=\$\(printf lines and no "[^"]*"_(pin|rr)=\$\( text (static; G-runnable)'
      run-local-reached: 'package + apply {workspace}/toolchain; {workspace}/run/probe-env/env.json ABSENT right before the run-local (preserve-and-refuse: an existing artifact fails the boundary and is left untouched); then run-local --runner probe_env -> rc 0, the runner''s final acceptance task ok and play recap failed=0, and env.json regular, 0600, schema probe-env/1, runner probe_env, work_root {workspace}/run/probe-env, profile_sha256 = the current profile, ssh_auth_sock_present false (runtime; MAIN: workspace_run_local)'
      stale-artifact-no-exec-refused: 'a stale but VALID env.json from a prior invocation and a run-local that returns 0 without exec (no runner output) -> refused twice: the absent-before boundary fails on the stale artifact, and the completion expectation fails on the empty output. BUILT as gate selftests only (selftests.yml runlocal-stale-artifact-refused / runlocal-returned-before-exec-refused, on the same predicate / expectation shapes); a runtime regressed run-local is NOT BUILT'
      optional-negative: 'route''s optional negative -- OPTIONAL, NOT BUILT (not in any variant)'
    refute: 'a seed that renders either override assignment inside a quoted word ("..."_pin=$( ...) fails static-assignments; a
      run-local that never reaches the exec writes no NEW env.json (the boundary made it absent-before) and prints no runner
      completion, so it fails run-local-reached even when a prior artifact existed (that fails the boundary first). Neither
      runtime mutation is demonstrated here; the stale shape is demonstrated only by the gate selftests.'
    hostile: 'the quoted-assignment rendering (static); an exec that is never reached (runtime); a stale valid env.json left by a prior invocation'
    variants:
      - {id: static}
      - {id: run-local, requires: [workspace_run_local, route_probe_env_runner]}
    steps:
      - {id: static-assignments, only_variants: [static],
         state: [{path: '{bundle_a}/lme-controller-seed.sh', kind: regular},
                 {file: '{bundle_a}/lme-controller-seed.sh', regex: '^\s*_pin=\$\(printf '},
                 {file: '{bundle_a}/lme-controller-seed.sh', regex: '^\s*_rr=\$\(printf '},
                 {file: '{bundle_a}/lme-controller-seed.sh', regex: '\A(?![\s\S]*"[^"]*"_(?:pin|rr)=\$\()'}]}
      - {id: apply, only_variants: [run-local],
         act: {kind: seed, bundle: a, op: apply, root: '{workspace}/toolchain'}, expect: {rc: 0, outcome_any: [INSTALLED, UNCHANGED]}}
      # the fresh-evidence boundary: preserve-and-refuse (an existing artifact fails here; the variant stops; nothing is removed)
      - {id: probe-evidence-absent-before, only_variants: [run-local],
         state: [{path: '{workspace}/run/probe-env/env.json', exists: false}]}
      - {id: probe-run-local, only_variants: [run-local],
         act: {kind: seed, bundle: a, op: run-local, root: '{workspace}/toolchain', args: ['--runner', probe_env]},
         expect: {rc: 0,
                  stdout_regex: '^TASK \[Accept only when SSH_AUTH_SOCK is absent from the playbook environment\] \**\nok: \[localhost\][\s\S]*^localhost\s+: ok=[0-9]+\s+changed=[0-9]+\s+unreachable=0\s+failed=0\s'},
         post_state: [{path: '{workspace}/run/probe-env/env.json', kind: regular, mode: '0600'},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: schema, value: probe-env/1}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: runner, value: probe_env}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: work_root, value: '{workspace}/run/probe-env'}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: profile_sha256, value: '{profile_sha256}'}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: ssh_auth_sock_present, value: false}}]}
