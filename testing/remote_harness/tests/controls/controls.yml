  # target_bootstrap.initial_contact.privileged; lists are replaced whole by the recursive combine. Every tool named is in
  # os_tools (the contact plan derives each privileged tool's path BEFORE the declaration assert).
  ic_reserialized:        {patch: {}, profile_bytes_differ: true, note: 'E73 positive: the candidate declarations, re-serialized in the clone (parsed equal)'}
  ic_python_observed:     {patch: {target_bootstrap: {initial_contact: {privileged: {observation_tools: [sh, sha256sum, id, stat, df, sed, realpath, python3], executed_after_custody: []}}}},
                           note: 'E73 python-observed: the interpreter becomes an observation tool (system_python not in executed_after_custody)'}
  ic_not_partition:       {patch: {target_bootstrap: {initial_contact: {privileged: {tools: [sh, sha256sum, id, stat, df, sed, realpath, python3, sort]}}}},
