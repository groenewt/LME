      other-checkout: 'E54 other-checkout-same-work-basename (needs a second packaged checkout)'
      profile-drift: 'E54 profile-drift (needs this checkout''s profile edited after packaging -- a route-owned file)'
    refute: 'each G-run variant FAILS if the seed writes the named root or refuses with another code/message'
    hostile: 'a root without the workspace anchor; a root under .work that is not the toolchain root'
    variants:
      - {id: no-anchor}
      - {id: not-toolchain}
      - {id: other-checkout, requires: [workspace_run_local]}
      - {id: profile-drift, requires: [workspace_run_local]}
    steps:
