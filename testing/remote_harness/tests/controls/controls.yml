  pid_namespace: [/usr/bin/unshare, --user, --map-current-user, --pid, --fork, --mount-proc]

# ---------------------------------------------------------------------------------------------------------------
# Throwaway state, budget and cleanup. The seed refuses /tmp ancestry, so every root lives under rhc_work_root, an
# OWNED, non-group/other-writable directory under $HOME (admitted by the profile's ONE path_admission regex and an
# ancestry stat). Nothing is copied into shared /tmp; {tmpprobe} is an ABSENT /tmp path only ever handed to the seed
# as a root that must be refused before any write.
state:
  run_marker: .lme-rhc-run          # first file of every run dir; cleanup removes only dirs carrying it
  # G-PRIVATE-PREPARE-CUSTODY (ported from m1-1g, codex 200213 point 7): the record writer's refusal (controls.j2
  # writer_cmd) -- exit 86 (outside the seed's refusal statuses 2..16, timeout's 124/125/137) AND stderr
  # `REFUSED RHC-ACT-RECORD: stage=`; judged only by expect record_refused
  # barrier_rc: a declared record barrier (act.record_barrier) that could not be planted (stderr BARRIER-FAILED) -- never 86
  record_refusal: {code: RHC-ACT-RECORD, rc: 86, barrier_rc: 87}
  # G-RECORD-OPEN-BEFORE-TIMEOUT (collect.yml): each admitted record is read by runner_tools.timeout <timeout_s>s +
  # runner_tools.dd iflag=nofollow,nonblock; bound_rcs = the act timeout's own statuses (TERM 124, KILL after
  # --kill-after 137) -- the only exit an unadmitted record meets (expect record_unadmitted)
  record_readback: {timeout_s: 60, bound_rcs: [124, 137]}
  # G-WAIT-TOTAL-DEADLINE (codex 203437 / 210615; tasks/wait.yml header, ansible-core 2.17 + 2.19; ported from m1-1g): a
  # wait step's timeout_s is its TOTAL deadline. One until/retries/delay task per observable; every poll bounded by the
  # FIXED T = min(record_readback.timeout_s, poll_bound_s, timeout_s - kill_after_s - margin_s) (>= 1: GNU `timeout 0s`
  # disables the bound); a further attempt is admitted only while remaining >= delay_s + T + kill_after_s + margin_s
  # (until); every wait fails when its measured elapsed exceeds timeout_s + overshoot_s
  wait_poll: {kill_after_s: 1, margin_s: 1, delay_s: 2, poll_bound_s: 3, overshoot_s: 5}
  keep_runs: 3                     # older marked run dirs are removed at the start of an execute run (oldest first)
  max_live_roots: 2                 # the shared root + one fresh root; a fresh root is purged when its control ends
  variant_scratch: [bundle, bundle-b, src, stash, receipt, vclone, '.bundle.staging.*', '.bundle.reaping.*', '.bundle.lease.*', .bundle.lock]   # removed after each variant (evidence stays; vclone after its root is purged)
  storage:                          # free bytes required on the work root before execute (resolved values, not literals)
    generations_from_budget: 3      # x controller.bootstrap.budget.generation_max_bytes
    plus_free_required: true        # + controller.bootstrap.budget.free_required_bytes (the seed's own check)
    bundle_allowance_bytes: 1500000000
    evidence_allowance_bytes: 500000000
    # ONE declared variant clone is live at a time (dropped with the variant scratch): a full --no-hardlinks copy of the run
    # clone's object store + worktree + its own work root. AUTHORED ESTIMATE, not measured: MAIN re-sizes it to the run clone.
    variant_clone_allowance_bytes: 2000000000
  timeouts_s: {seed_apply: 2400, seed_verify: 600, seed_purge: 300, seed_run: 900, package: 1200, playbook: 900, command: 120, wait_phase: 1800, kill_settle: 30}
  cleanup:
    root: seed purge through bundle A (--confirm R); PURGED or ABSENT expected
    fallback: 'control-owned removal ONLY inside a run dir carrying run_marker, after chmod -R u+w; recorded as a
      cleanup finding (the seed''s purge refused a control-made state)'
  managed_env: 'every act runs under env -i with HOME, XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS of the owner
    session (the valid declared managed environment, codex Q-D12) plus the declared base env; nothing else is inherited'

# ---------------------------------------------------------------------------------------------------------------
# The vocabulary the runner implements. A control using anything else is UNIMPLEMENTED (reported, fails acceptance).
# `implemented` narrows the declared vocabulary to what the runner executes today; the rest is declared-but-UNIMPLEMENTED.
vocabulary:
  control_keys: [id, cases, findings, purpose, requires, root, fixture_for, declaration, variants, setup, steps, undo,
                 sweep, per_point_expect, note, static_checks, declared_only, acceptance_rule, retire_when, evidence, result_class,
                 applies_when, interface, refute, hostile, rows, variant_checkout, case_components]
  # case_components {<case id>: [<row variant key>]} (control or variant; G-E77-PARTIAL-COVERAGE, ported from m1-1g): the
  # control covers only those variants of the row's declared `variants` mapping -- the summary reports the row PARTIAL
  # until they span it.
  # G-E84-PARTIAL-WHOLE-CREDIT (codex 231744): `{<case id>: []}` is the EXPLICIT no-credit form (names the row, credits no
  # component). A control whose variants credit a row by component must state every variant's credit for that row (an
  # omission beside component-crediting siblings is a declaration error, never an implicit whole). A row a control names
  # WHOLE (no entry) is credited whole from execute evidence only when EVERY declared variant of that control that names it
  # whole has PASSED; otherwise the summary reports it PARTIAL with pending_variants {<control>: [<variant>]}.
  # variant_checkout: clone -- the control's declaration variant runs from its OWN declared clone (top-level variant_clone;
  # tasks/variant_clone.yml), never the override channel or a MAIN-staged copy; tokens {vclone} {vwork} {vparent} {vroot}.
  # Its declaration may name a route catalog profile_case (the patch) and a checkout_fixture (tasks/variant_clone.yml;
  # REPAIR 5, codex 223100).
  # legibility (operator gold standard; documentation keys, never executed): `refute` names the mutated input on which the
  # control must FAIL (non-vacuity); `hostile` names its hostile negative; `rows` maps each variant to its lifecycle row(s).
  # New controls are named <operation>.<phase>.<relation>; the older ids stay (other messages cite them).
  # fixture_ctl <name> (increment 2, codex 231744 option (a)): the variant's Route 3 clone lives under {vctl} = {ctl}/<name>
  # (default {vctl} = {ctl}) -- a DEDICATED fixture control dir a fixture_ops step may relocate or link (tasks/fixture_ops.yml)
  # G-STEP-LIVE-FAIL-GUARD (codex tick313): expect_stop_at <step id> + after_stop [predicates] -- the variant must stop at
  # exactly that step with nothing after it run (controls.j2 judge_stop), then after_stop must hold (tasks/variant.yml)
  variant_keys: [id, declaration, requires, ops, undo, tokens, expect, note, case_components, cleanup_purge, expect_stop_at, after_stop, fixture_ctl, after_undo,
                 expect_undo_findings, after_cleanup]
  # after_undo [predicates] (codex tick297 003441 G-STAGING-*): checked after the undo ops and the staging reversal
  # (tasks/variant.yml always section), e.g. an outside tree the variant planted is gone and a partial replica removed
  # G-UNDO-PROTECTION-PROPAGATION (codex tick330): expect_undo_findings [{path, why}] -- the undo findings this variant
  # declares (path EXACT, why a regex; controls.j2 judge_undo_findings): each must occur, and only these are not a FAIL /
  # cleanup finding; their paths stay protected and are reported as `preserved`. after_cleanup [predicates]: checked after
  # the WHOLE undo and cleanup sequence (finish_variant + the fixture control dir removal), the readback of what a refused
  # undo protected and of what the cleanup still removed
  # cleanup_purge (runner.record.cleanup-barrier; a root: fresh control): declared deviations of the fresh-root cleanup
  # purge -- record_barrier / timeout_s go into its act, expect judges it like a step, post_state is checked after it
  cleanup_purge_keys: [record_barrier, timeout_s, expect, post_state]
  step_common: [id, timeout_s, note, post_state, only_variants, skip_variants, expect]
  # produce / tree / fixture_ops (increment 2; codex 230249 (a), 231744 option (a), 234857):
  #   produce {task: bundle, src, dest, case} | {task: checkout, clone, ctl, case} | {task: admit, dir}: ONE in-process call of
  #     the route producer producer_tasks[task] (tasks/produce.yml), judged by controls.j2 judge_produce with the step's expect
  #     (produced: true | produce_refused: CODE + produce_task, produce_msg_has, produce_only_component); a refusal must name
  #     the exact LEAF task and leave the producer's result fact unchanged
  #   tree {name, of}: the DIGEST-bearing tree record (relpath, type, mode, sha256 of every regular file; tasks/tree.yml),
  #     compared by the `trees` predicate
  #   fixture_ops [ops]: the confined declared STAGING of a producer negative (tasks/fixture_ops.yml): closed set mkdir |
  #     copy_tree | move | symlink, every written path strictly under {ctl}/, every pre-state admitted (a move's source a real
  #     directory and its target absent; a symlink's path absent and its target under {ctl}/; a copy_tree's target absent and
  #     its source a real directory, which may be read-only under {repo_root}), {ctl}'s own ancestry admitted first; each
  #     action is RECORDED and undone in reverse by tasks/fixture_undo.yml (always; never following a link; anything not in
  #     the recorded state is a cleanup finding, never forced)
  #     codex tick297 003441: every path an action mutates or links is admitted component by component by the ONE ancestry
  #     rule (a linked intermediate refuses); the intent is recorded before the mutation and reconciled with the identity
  #     observed right after it (done | failed = partial output tracked); undo reverses only the recorded identity
  #     (controls.j2 fixture_undo_decide); a refusal or failure is recorded per action ('<step>[<i>]: ...', later actions
  #     not run) unless the step declares it (expect staging_*)
  steps: [act, wait, kill, freeze, thaw, join, ops, snapshot, state, sample_scope, judge_pair, repeat, produce, tree, fixture_ops]
  # the ONLY route producers a produce step may call (repository-relative under rh_repo_root = the CANONICAL run checkout;
  # route-owned, pinned in bound_bytes_at_authoring; G never edits them)
  producer_tasks:
    bundle: testing/remote_harness/tasks/fixture_bundle.yml
    checkout: testing/remote_harness/tasks/fixture_checkout.yml
    admit: testing/remote_harness/tasks/admit_bundle.yml
  acts: [seed, package, playbook, command]
  # extra_vars_json: ONE structured -e (JSON) after the k=v extra_vars (the lme_resolved_run mapping of the run-local contract)
  act_keys: [kind, op, bundle, root, args, raw_args, argv, async, cwd, dest, env, unset_env, executor, extra_vars, extra_vars_json, inventory_extra,
             inventory_omit_root, inventory_owner, inventory_root, inventory_targets, invoke, limit, no_ssh_auth, playbook, repo, scope,
             source, ssh_auth, strace, timeout_s, trace_exec, trace_network, via, wrap, record_barrier, launcher_path,
             direct_purpose, mode_params]
  # SEED DIRECT LABEL (codex 210509; ported from m1-1g): invoke seed_direct | declared_sh is a LABELLED fault-injection /
  # control path only -- the act must declare direct_purpose (one of direct_purposes) and its step must expect a refusal
  # (act.yml RHC-SEED-DIRECT); ordinary and positive-path launches always use the generated launcher (no fallback). Its
  # result proves only the DIRECT SEED boundary. seed_refusal = a seed refusal the launcher deliberately prevents (I04's
  # launcher-less staged copy); launcher_member = the launcher examined as a bundle member (E82 seed layer).
  # check_file_member (increment 2; PROPOSED under codex 210509, pending codex's ruling via MAIN) = the check file
  # bundle.sha256 examined as a bundle member (the seed layer of the catalog cf-* consumer copies, E77 / E80); same label
  # rules, refusal expected.
  direct_purposes: [seed_refusal, launcher_member, check_file_member]
  # mode_params: the values of a seed act's non-carried positional mode parameters, in the route's order (controls.j2
  # launch_values; default: the run-local runner word). The carried parameter always takes the act's ssh auth mode.
  # SEED LAUNCH (R1 launcher consumption, codex 192321; controls.j2 seed_launch): a seed act (kind seed, via seed_run, cleanup
  # purge / verify) invokes <abs bundle>/<bundle.launcher_file> by seed_launcher.caller_argv; G builds NO environment vector.
  # On that launcher form env / unset_env are the CALLER's ambient environment for the act (`<runner_tools.env> -u N ...
  # N=v ... <launcher>`, E83 / E84), raw_args are words after <root>, no_ssh_auth drops the carried ssh auth mode param (E83
  # count), launcher_path replaces argv[0] verbatim (E83 relative).
  # record_barrier:[{fifo|regular: out|err|strace}] planted by the WRITER ITSELF after its precheck and before its
  # noclobber create (G-RECORD-OPEN-BEFORE-TIMEOUT: the deterministic precheck-to-open barrier; controls.j2 writer_cmd
  # step 2). m1-1 has no plant_record (no private_create.yml): a prior object is planted by an ordinary op before the act.
  # inventory_targets {name: {host vars}} writes the declared target group (controller.bootstrap.inventory.target_group);
  # every ansible_host / ansible_ssh_host there (and an extra-var ansible_host) must match this RFC 5737 TEST-NET-1 regex,
  # checked at plan time (_steps_unimpl -> UNIMPLEMENTED) and again before the inventory is written (act.yml).
  target_address_regex: '^192\.0\.2\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$'
  kill_options: [step, root, token, holder_only, tracer_only, processes_only]
  expect: [rc, rc_nonzero, refusal, refusal_any, outcome, outcome_any, gen, refused_at, refused_at_any, failed_before_task,
           playbook_refusal, stdout_has, stderr_has, stdout_or_stderr_has, stderr_regex, stdout_regex, stdout_not_regex, busy_expected,
           killed, record_only, no_network, exec_seen, no_exec_regex, any_of, record_refused, record_unadmitted,
           produced, produce_refused, produce_task, produce_msg_has, produce_only_component,
           staging_refused, staging_failed, staging_index, staging_task, staging_msg_has, staging_skipped,
           op_failed, op_index, op_msg_has, op_skipped]
  # op_* (codex tick330 item 2 G-OP-PER-ITEM-GUARD; an ops step only; controls.j2 judge_op_outcome / judge_op_skipped, judged
  # in tasks/op.yml): the op at op_index is declared to fail after it was admitted (op_failed true) with every op_msg_has
  # string; the list's later ops are then not run, and op_skipped lists exactly their indexes (each needs its op_skipped record).
  # staging_skipped (codex tick330 G-FIXTURE-ITEM-STOP-CONTROL; controls.j2 judge_staging_skipped, judged in fixture_ops.yml at
  # the list's last action): exactly the indexes after staging_index; each must carry its per-item staging_skipped record.
  # staging_* (codex tick297 003441; a fixture_ops step only; controls.j2 judge_staging): the action at staging_index is
  # declared refused before any mutation (staging_refused CODE) or failed after its mutation began (staging_failed true),
  # at the exact leaf staging_task with every staging_msg_has string; the list's later actions are then not run
  # record_refused: true | precheck | open | identity (the writer's refusal stage); record_unadmitted: true (no record
  # admitted, never read, and the act's own bound ended the writer: rc in state.record_readback.bound_rcs).
  # TRACE IS DIAGNOSTIC (codex 200213 point 6): no_network / exec_seen / no_exec_regex judge the strace record, which the
  # traced entrypoint can still write (fd 5 stays open, writable, at offset 0; controls.j2 writer_cmd) -- they never
  # support a claim of independent trace custody; fd 5 surviving systemd-run / timeout / strace is verified only when
  # the declared runner runs.
  # path predicate options: exists, kind (absent | fifo | regular | link | dir | other; stat, nothing opened), size,
  # mode (the octal permission string stat reports, e.g. '0600'; codex 225207)
  # snapshot equality is METADATA ONLY (codex 234857: path, type, mode, size, uid, mtime, link target -- never bytes): no step
  # judged by `snapshot` alone claims byte preservation. trees [a, b] (equal: true | false) compares two digest-bearing tree
  # records (step `tree`); only it (or same_bytes) supports a byte claim, and an absent / empty / linked tree never meets equality.
  predicates: [path, glob, file, same_bytes, snapshot, implies, trees]
  ops: [mkdir, write, symlink, chmod, remove, remove_glob, stash, stash_copy, unstash, copy, copy_tree, mkfifo, append,
        unseal, reseal, json_rewrite, drop_line, retarget, move, overwrite_first_byte, rehash_into_json, run_shaped_dirs]
  op_options: [mode, content, target]   # sibling keys of a scalar-valued op (mkdir/write/chmod: mode; write: content; symlink: target)
  waits: [phase, file_regex, path_exists, glob, gone]
  # G-WAIT-TOTAL-DEADLINE (tasks/wait.yml header; ported from m1-1g): poll_hold {syscall, hold} -- the dd poll of a phase /
  # file_regex wait runs under strace with a delay injected on enter of <syscall> for the awaited file only (a deliberately
  # slow read); deadline_expected {elapsed_max_s} -- a negative wait that must end at its deadline without the observable,
  # within elapsed_max_s, with (under poll_hold) the last poll ended by its per-poll bound
  wait_options: [poll_hold, deadline_expected]
  sweeps: [phases, declared_points, pins]
  static_checks: [render_tool_path, representation, adapter_closure, transport_disposition]
  # each static check runs as declared AND under every declared negative control (a mutation its judge must reject)
  static_check_mutations:
    render_tool_path: [unchanged, presence_only, stray_line]
    representation: [add_file, empty]
    adapter_closure: [drop_provides, drop_use, add_os_tool, drop_family_mapping]
    transport_disposition: [b_case_expect, drop_b_case, route_form, drop_route_case, claim_coverage]
  not_implemented:   # declared by a control, not executed yet -> that control/variant is UNIMPLEMENTED
    ops: [regenerate_manifests, retarget]
    op_options: [link_members]
    predicates: []
    steps: []
    sweeps: []
    static_checks: []

