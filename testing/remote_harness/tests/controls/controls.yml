      - {id: held, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1, bind: staging}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 1}},
                           {file: '{ctl}/p1.stdout', lacks: 'TASK [Publish by ONE rename onto the absent destination under the destination lock'}]}
      - {id: snap, snapshot: {name: held, of: '{ctl}', include_regex: ['^\.bundle\.(staging|lease)\.']}}
      - {id: p2, act: {kind: package, dest: '{ctl}/bundle'},
         expect: {any_of: [{rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-(UNKNOWN|LIVE)-STAGING \S+ \[[^]]*{staging}', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*{reaping}']},
                           {rc_nonzero: true, playbook_refusal: RH-STAGING-BUDGET, refused_at: Refuse if the reap did not converge or the reservation does not fit, stdout_has: ['{staging}']},
                           {rc_nonzero: true, playbook_refusal: RH-STAGING-LEASE, refused_at: Refuse a run whose holder lease cannot be derived}]}}
      - {id: kept, state: [{snapshot: held, equal: true}, {path: '{staging}', exists: true}]}
      - {id: kill-p1, kill: {step: p1}}
      - {id: j1, join: p1, expect: {record_only: true}}
    note: 'r3e E25: an unreadable, hidden, malformed or incomparable process/cgroup view (another pid or cgroup namespace included) is
      UNKNOWN, never dead; machine + boot + uid do not prove the same pid namespace. p1 is frozen after its record and reservation, before
      the publish fence. Accepted outcomes of p2: publish its own staging while reporting that entry UNKNOWN (or LIVE: the frozen holder''s
      cgroup is populated) and NEVER REAPED-STAGING for it; the capacity refusal naming it; or the own-view refusal RH-STAGING-LEASE (a run
      whose OWN view cannot be admitted, at the lease-derivation refusal ONLY: a RH-STAGING-LEASE from the flock known answers or any other
      task is not this outcome and FAILS, codex-014047 R3E-CONTENDED-KAT). In every outcome the staging and its record stay byte-identical (kept). A refusal from a bare
      worktree without C1 (RH-DERIVED-OUTPUT-PINNED / RH-POLICY-UNRESOLVED) never reaches this control (P01 requires seed06_projection)'

  - id: L02-controller-killed-writers-live
    cases: [E26-controller-killed-writers-live, E30-when-recovery-fires]
    findings: [LEASE-HOLDER-EXIT-IS-NOT-WRITER-QUIESCENCE, M1-STAGING-RECOVERY, E26-INFLIGHT-COMPLETION]
    requires: [bundle_a, interrupt_mechanism, r3e_writer_quiescence, act_scope_mechanism]
    variants:
      - {id: holding-publish-lock, note: 'E26 outcome (ii): the writer is stopped INSIDE flock -x -w (strace hold at its mv -T rename); ownership never revoked',
         expect: {p2: {rc_nonzero: true, playbook_refusal: RH-STAGING-BUSY, busy_expected: true, refused_at: Refuse a publish that could not take the destination lock,
                       stdout_regex: 'PRESERVED-LIVE-STAGING \S+ \[[^]]*{staging}', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*{reaping}']}}}
      - {id: before-publish-lock, note: 'E26 outcome (i): the writer is frozen while copying, before the publish fence',
         expect: {p2: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-LIVE-STAGING \S+ \[[^]]*{staging}', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*{reaping}']}}}
      - {id: target-operation, requires: [main_only], note: 'MAIN on a target: kill the controller while target_bootstrap.yml has a transfer/extract in flight; a second invocation neither reaps the target staging (PRESERVED-BUSY-STAGING: p1''s session scope still has processes, or the lock is held) nor admits a stale publication (requested row transfer:D09c)'}
    steps:
      # outcome (ii): stopped holding the destination lock
      - {id: p1, only_variants: [holding-publish-lock], act: {kind: package, dest: '{ctl}/bundle', async: true,
                       strace: {inject: {syscalls: [rename, renameat, renameat2], when: enter, hold: 3600s}, trace_path: '{ctl}/bundle', detach_on_tracer_kill: true}}}
      - {id: p1-in-fence, only_variants: [holding-publish-lock], wait: {file_regex: {file: '{ctl}/p1.strace', regex: 'rename.*bundle.*DELAYED'}}, timeout_s: 900}
      # outcome (i): frozen before the fence
      - {id: p1f, only_variants: [before-publish-lock], act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: p1f-staging, only_variants: [before-publish-lock], wait: {file_regex: {file: '{ctl}/p1f.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 900}
      - {id: p1f-frz, only_variants: [before-publish-lock], freeze: {step: p1f}}
      - {id: p1f-before-fence, only_variants: [before-publish-lock], state: [{file: '{ctl}/p1f.stdout', lacks: 'TASK [Publish by ONE rename onto the absent destination under the destination lock'}]}
      - {id: kill-holder, only_variants: [holding-publish-lock], kill: {step: p1, holder_only: true}}
      - {id: kill-holder-f, only_variants: [before-publish-lock], kill: {step: p1f, holder_only: true}}
      - {id: orphaned, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1, bind: staging}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 1}}]}
      - {id: p2, act: {kind: package, dest: '{ctl}/bundle'}}
      - {id: not-reaped, state: [{path: '{staging}', exists: true}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 1}}]}
      - {id: snap-dest, snapshot: {name: dest, of: '{ctl}', include_regex: ['^bundle( |/)']}}
      - {id: release-orphan, only_variants: [holding-publish-lock], kill: {step: p1, tracer_only: true}}
      - {id: orphan-done, only_variants: [holding-publish-lock], wait: {gone: p1}, timeout_s: 900}
      - {id: thaw-orphan, only_variants: [before-publish-lock], thaw: {step: p1f}}
      - {id: orphan-done-f, only_variants: [before-publish-lock], wait: {gone: p1f}, timeout_s: 900}
      - {id: completed-verified, only_variants: [holding-publish-lock],
         state: [{path: '{staging}', exists: false}, {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}, {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: no-stale-publish, only_variants: [before-publish-lock], state: [{snapshot: dest, equal: true}]}
      - {id: kill-rest, only_variants: [holding-publish-lock], kill: {step: p1}}
      - {id: kill-rest-f, only_variants: [before-publish-lock], kill: {step: p1f}}
      - {id: read-back, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [UNCHANGED]}}
      - {id: bounded, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}},
                              {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}}, {path: '{ctl}/.bundle.lock', exists: true},
                              {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}]}
    note: 'codex-tick144 E26-INFLIGHT-COMPLETION: completion under still-valid ownership is ADMITTED when the actual publisher continuously
      holds the destination lock through its already-admitted rename and the result is the exact verified bundle, read back by the next
      run; controller death alone revokes nothing. holder_only kills only the controller ansible-playbook MAIN process (the lease holder);
      its worker/flock/mv stay in the act scope, so the recorded run cgroup is POPULATED and p2 must see LIVE (not-reaped: p1''s staging
      and record still exist after p2 -- the no-live-staging-deletion assertion, both variants). (ii) holding-publish-lock: p2 reserves,
      stages, waits publish_wait_seconds on the lock, then REFUSED RH-STAGING-BUSY releasing only its own staging and record (expected here,
      never E09 coverage); the tracer is killed without --kill-on-exit so the orphan completes its rename into the ABSENT destination
      (completed-verified: bundle A''s exact bytes, its staging consumed); read-back UNCHANGED. (i) before-publish-lock: p2 PUBLISHED while
      p1 is frozen; thawed, the orphaned worker finishes at most its in-flight task (Ansible 2.19.11: no further task of p1 starts), so the
      destination is byte-unchanged (no-stale-publish). Publication AFTER revocation or supersession is the separate mandatory negative
      L02b (r3f). codex-tick139: both legs required and independent'

  # E32 is bound HERE (the existing L02b, converted from declared_only to executable; alias package.publish.revoked-writer-refused):
  # L02b now exercises the E32 construction exactly (p1 held BEFORE it holds the lock, i.e. inside flock's open of the destination
  # lock, with its publish argv already prepared; the revoker renames its staging away under flock -x on that lock).
  - id: L02b-revoked-writer-never-publishes
    cases: [E26-controller-killed-writers-live, E32-revoked-writer-never-publishes]
    findings: [E26-INFLIGHT-COMPLETION, LEASE-HOLDER-EXIT-IS-NOT-WRITER-QUIESCENCE, M1-STAGING-RECOVERY]
    requires: [bundle_a, interrupt_mechanism, r3e_writer_quiescence, act_scope_mechanism, r3f_e26_revocation]
    evidence: {bind_source_sha256: [manifests/profiles/remote-harness.yml, testing/remote_harness/tasks/package_bundle.yml, testing/remote_harness/tasks/reap_staging.yml,
                                    testing/remote_harness/tests/lifecycle-cases.yml]}
    rows:
      revoked-then-resumed-publisher: 'E32 revoked-then-resumed-publisher (controller): REFUSED RH-STAGING-REVOKED; reaping dir byte-identical; destination absent'
      successor: 'E32 successor (controller): an admitted successor (another configuration) lands first; p1''s no-replace rename does not replace it; p1 refuses; successor bytes unchanged'
      successor-empty-dir: 'E32 successor, EMPTY destination dir: never replaced; p1 refuses'
      recovery: 'E32 recovery (controller): a live (frozen) writer is never revoked (PRESERVED-LIVE-STAGING); only after it is gone does recovery reap (REAPED-STAGING)'
      teardown: 'E32 teardown: a CONTRACT for the non-route teardown owner (revoker_contract); not in the route -> QUEUED on e32_teardown_owner'
      target: 'E32 every variant on a target (target_bootstrap.yml): MAIN'
    refute: 'drop the revoker step (nothing revoked): p1 publishes rc 0 PUBLISHED -> the RH-STAGING-REVOKED expectation FAILS; a route using mv -T without -n
      replaces the successor-empty-dir -> the empty-dir predicate FAILS'
    hostile: 'a resumed old writer racing a revoker (and a successor) for the destination'
    variants:
      - {id: revoked-then-resumed-publisher,
         expect: {j1: {rc_nonzero: true, playbook_refusal: RH-STAGING-REVOKED, refused_at: Refuse a publish whose authority was revoked, stdout_not_regex: ['PUBLISHED ']}}}
      - {id: successor, declaration: cfg, note: 'p2 runs the variant declarations (another configuration, another bundle)',
         expect: {j1: {rc_nonzero: true, playbook_refusal: RH-BUILDER-UNSUPPORTED, refused_at: Refuse a destination that holds a different bundle, stdout_not_regex: ['PUBLISHED ']}}}
      - {id: successor-empty-dir,
         expect: {j1: {rc_nonzero: true, stdout_not_regex: ['PUBLISHED '],
                       refused_at_any: [Refuse a destination that holds a different bundle, Refuse a missing class bundle, Refuse a bundle that is not exactly the declared one]}}}
      - {id: recovery}
      - {id: teardown, requires: [e32_teardown_owner]}
      - {id: target, requires: [main_only]}
    steps:
      # p1 is held INSIDE flock's open of the destination lock (openat enter, -P the lock path): its publish argv is prepared, it does
      # not hold the lock. A hold that lands earlier (another open of the lock by p1) never shows the publish header -> wait FAILS (closed).
      - {id: p1, skip_variants: [recovery], act: {kind: package, dest: '{ctl}/bundle', async: true,
                       strace: {inject: {syscalls: [openat], when: enter, hold: 3600s}, trace_path: '{ctl}/.bundle.lock', detach_on_tracer_kill: true}}}
      - {id: p1-at-fence, skip_variants: [recovery], wait: {file_regex: {file: '{ctl}/p1.stdout', regex: 'TASK \[Publish by ONE rename onto the absent destination under the destination lock'}}, timeout_s: 900}
      - {id: p1-in-open, skip_variants: [recovery], wait: {file_regex: {file: '{ctl}/p1.strace', regex: 'openat\(.*\.bundle\.lock.*DELAYED'}}, timeout_s: 120}
      - {id: p1-staging, skip_variants: [recovery], state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.L*', count: 1, bind: staging}}, {path: '{ctl}/bundle', exists: false}]}
      # revoked-then-resumed-publisher: the revoker renames p1's staging away under the destination lock (as reap_staging.yml does)
      - {id: revoke, only_variants: [revoked-then-resumed-publisher],
         act: {kind: command, argv: [/usr/bin/flock, -x, -n, '{ctl}/.bundle.lock', /usr/bin/mv, -T, '{staging}', '{reaping}']}, expect: {rc: 0}}
      - {id: revoked, only_variants: [revoked-then-resumed-publisher], state: [{path: '{staging}', exists: false}, {path: '{reaping}', exists: true}]}
      - {id: snap-reaping, only_variants: [revoked-then-resumed-publisher], snapshot: {name: reaping, of: '{reaping}'}}
      # successor: another configuration publishes first (p1 still held outside the lock)
      - {id: p2, only_variants: [successor], act: {kind: package, repo: variant, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-LIVE-STAGING \S+ \[[^]]*{staging}'}}
      - {id: empty-successor, only_variants: [successor-empty-dir], ops: [{mkdir: '{ctl}/bundle', mode: '0700'}]}
      - {id: snap-dest, skip_variants: [recovery], snapshot: {name: dest, of: '{ctl}', include_regex: ['^bundle( |/)']}}
      - {id: resume, skip_variants: [recovery], kill: {step: p1, tracer_only: true}}
      - {id: j1, skip_variants: [recovery], join: p1}
      - {id: dest-kept, skip_variants: [recovery], state: [{snapshot: dest, equal: true}]}
      - {id: reaping-kept, only_variants: [revoked-then-resumed-publisher], state: [{snapshot: reaping, equal: true}, {path: '{ctl}/bundle', exists: false}]}
      # recovery: p1 frozen before the fence, holder killed -> p2 must not revoke; whole kill -> p3 reaps
      - {id: r1, only_variants: [recovery], act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: r1-staging, only_variants: [recovery], wait: {file_regex: {file: '{ctl}/r1.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 900}
      - {id: r1-frz, only_variants: [recovery], freeze: {step: r1}}
      - {id: r1-holder, only_variants: [recovery], kill: {step: r1, holder_only: true}}
      - {id: r1-left, only_variants: [recovery], state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.L*', count: 1, bind: staging}}]}
      - {id: snap-live, only_variants: [recovery], snapshot: {name: live, of: '{ctl}', include_regex: ['^\.bundle\.(staging|lease)\.']}}
      - {id: r2, only_variants: [recovery], act: {kind: package, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-LIVE-STAGING \S+ \[[^]]*{staging}', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*{reaping}']}}
      - {id: not-revoked, only_variants: [recovery], state: [{snapshot: live, equal: true}]}
      - {id: r1-kill, only_variants: [recovery], kill: {step: r1}}
      - {id: r1-gone, only_variants: [recovery], wait: {gone: r1}, timeout_s: 120}
      - {id: r3, only_variants: [recovery], act: {kind: package, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [UNCHANGED], stdout_regex: 'REAPED-STAGING \S+ \[[^]]*{reaping}'}}
      - {id: r-bounded, only_variants: [recovery], state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}},
                                                           {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}}]}
      # convergence (every variant except recovery): the destination is re-read or published by the next run; nothing of p1 left
      - {id: converge, only_variants: [revoked-then-resumed-publisher], act: {kind: package, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'REAPED-STAGING \S+ \[[^]]*{reaping}'}}
      - {id: converged, only_variants: [revoked-then-resumed-publisher],
         state: [{same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}},
                 {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}}]}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}], skip_variants: [teardown, target]}
    note: 'codex-tick144 E26-INFLIGHT-COMPLETION mandatory negative, lifecycle E32 (FINAL declaration r3f). revoked-then-resumed-publisher: the
      revoker is the owner''s own flock -x -n + mv -T on the destination lock, exactly the reaper''s rename (the E32 fixture names MAIN; no
      privilege is involved, the owner renames its own entry); p1''s resumed flock then runs its prepared no-replace mv, which finds its source
      gone -> REFUSED RH-STAGING-REVOKED ("Refuse a publish whose authority was revoked"); the reaping dir is untouched; the next run reaps it
      (p1''s run is gone with its act scope) and publishes. successor: p2 (the cfg declaration) publishes first while p1''s staging is LIVE;
      p1''s no-replace mv leaves the successor untouched and p1 refuses at "Refuse a destination that holds a different bundle"
      (RH-BUILDER-UNSUPPORTED); successor-empty-dir: an empty dir is not replaced either (mv -T WITHOUT -n would replace it: that is the
      refute). recovery: a frozen writer keeps its run cgroup populated, so p2 preserves it LIVE (nothing revoked); after the whole kill, p3
      reaps it. Lease records are not asserted after p1 (the route releases only its own still-present state). The target variants are MAIN'

  - id: L03-competing-reapers-serialized
    cases: [E27-competing-reapers-publishers-serialized]
    findings: [LEASE-HOLDER-EXIT-IS-NOT-WRITER-QUIESCENCE, M1-STAGING-RECOVERY, SEED2-PACKAGE-RESERVATION]
    requires: [bundle_a, r3e_writer_quiescence, act_scope_mechanism]
    steps:
      - {id: leave, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: reserved, wait: {file_regex: {file: '{ctl}/leave.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 600}
      - {id: kill-leave, kill: {step: leave}}
      - {id: join-leave, join: leave, expect: {killed: true}}
      - {id: stale, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1, bind: staging}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 1}}]}
      - {id: r1, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: r2, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: j1, join: r1, expect: {record_only: true}}
      - {id: j2, join: r2, expect: {record_only: true}}
      - {id: pair, judge_pair: {steps: [j1, j2], one_of: {rc: 0, stdout_has: [PUBLISHED], stdout_not_regex: ['REFUSED RH-STAGING-BUDGET']},
                                other_any: [{rc: 0, stdout_has: [UNCHANGED], stdout_not_regex: ['REFUSED RH-STAGING-BUDGET']}]}}
      - {id: bounded, state: [{path: '{staging}', exists: false}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}},
                              {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}},
                              {path: '{ctl}/.bundle.lock', exists: true}, {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}]}
    note: 'r3e E27: the dead run''s scope was killed whole, so its cgroup is empty and its staging is reapable. Each reap mutation is ONE
      flock -x -n command on .bundle.lock: exactly one run renames the staging; the other gets rc 75 (PRESERVED-BUSY-STAGING, tolerated)
      or finds the entry gone (converged, not a failure). The publish renames serialize on the same lock: one PUBLISHED, the other
      UNCHANGED; neither refuses RH-STAGING-BUDGET from the race; afterwards no staging, reaping dir or record of the dead or either live run
      remains and the lock file persists. A RH-STAGING-BUSY of either run is never coverage'

  - id: K09-held-destination-lock-and-contended-admission
    cases: [E26-controller-killed-writers-live, E27-competing-reapers-publishers-serialized, E09-package-concurrent-same-destination, E36-contended-lock-at-admission]
    findings: [R3E-CONTENDED-KAT, M1-STAGING-RECOVERY]
    requires: [bundle_a, r3e_writer_quiescence, act_scope_mechanism, r3f_contended_kat]
    rows: {lock-held-through-run: 'E36 held lock -> KAT passes on the private lock, publish waits publish_wait_seconds (30) -> REFUSED RH-STAGING-BUSY, never RH-STAGING-LEASE',
           lock-released-within-wait: 'E36 lock released during the wait -> lands (PUBLISHED)'}
    refute: 'a route whose known answers take the DESTINATION lock (r3e shape) refuses RH-STAGING-LEASE while the holder runs -> stdout_not_regex FAILS'
    hostile: 'another process holding .bundle.lock (flock -x ... sleep) while the run admits its tools and publishes'
    variants:
      - {id: lock-held-through-run, note: 'the holder keeps .bundle.lock past p2''s publish_wait_seconds',
         expect: {j2: {rc_nonzero: true, playbook_refusal: RH-STAGING-BUSY, busy_expected: true, refused_at: Refuse a publish that could not take the destination lock,
                       stdout_not_regex: ['REFUSED RH-STAGING-LEASE']},
                  after: {rc: 0, stdout_has: [PUBLISHED]}}}
      - {id: lock-released-within-wait, note: 'the holder releases the lock while p2 waits on its publish fence',
         expect: {j2: {rc: 0, stdout_has: [PUBLISHED], stdout_not_regex: ['REFUSED RH-STAGING-LEASE']},
                  after: {rc: 0, stdout_has: [UNCHANGED]}}}
    steps:
      - {id: holder, act: {kind: command, argv: [/usr/bin/flock, -x, '{ctl}/.bundle.lock', /usr/bin/sleep, '3600'], async: true}}
      - {id: held, wait: {path_exists: '{ctl}/.bundle.lock'}, timeout_s: 30}
      - {id: p2, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: at-fence, wait: {file_regex: {file: '{ctl}/p2.stdout', regex: 'TASK \[Publish by ONE rename onto the absent destination under the destination lock'}}, timeout_s: 900}
      - {id: release, only_variants: [lock-released-within-wait], kill: {step: holder}}
      - {id: j2, join: p2}
      - {id: nothing-left, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}}]}
      - {id: stop-holder, only_variants: [lock-held-through-run], kill: {step: holder}}
      - {id: jh, join: holder, expect: {record_only: true}}
      - {id: after, act: {kind: package, dest: '{ctl}/bundle'}}
    note: 'codex-014047 R3E-CONTENDED-KAT: an already-held destination lock (held here by a plain util-linux flock of the runner, the
      shape of E26(ii) and of a concurrent reaper/publisher) must be treated as CONTENTION -- preserve, bounded wait, RH-STAGING-BUSY or
      publish once released -- never as a failed tool identity: RH-STAGING-LEASE is a FAIL here and never counts for E26/E27. The
      contended-admission shape (two admissions racing their known answers) is K05/L03 (both must reach PUBLISHED/UNCHANGED). Bound to
      lifecycle E36 in the final bytes (kat_lock_suffix lme-flock-kat; publish_wait_seconds 30, shorter than the holder''s 3600 s sleep)'

  - id: L05-writer-containment
    cases: [E26-controller-killed-writers-live, E30-when-recovery-fires, E37-writer-containment-subtree]
    findings: [R3E-WRITER-CONTAINMENT, M1-STAGING-RECOVERY, LEASE-UNKNOWN-IS-NOT-DEAD]
    requires: [bundle_a, r3e_writer_quiescence, r3f_writer_containment]
    rows: {base: 'E37 nested-controller-writer: NOT statically controllable by this runner (needs a delegated act scope + a move-into-child op,
             not in the vocabulary -> UNIMPLEMENTED, reported). target-other-session / target-unexpected-child / user-slice-not-root: MAIN on a
             target (candidate-clone run, TR02 phase). Source-read only: cgroup-v2 migration permissions, pam_systemd placement'}
    refute: 'a route reading an empty direct cgroup.procs as dead would REAP the nested writer''s staging -> REAPED-STAGING FAILS it'
    hostile: 'a writer of the killed run hidden in a DESCENDANT cgroup of the recorded one'
    acceptance_rule:
      - 'descendant writer: the lease holder is dead and the RECORDED cgroup''s direct cgroup.procs is empty while a writer of that run lives in a DESCENDANT cgroup (a delegated act scope with the writer moved into a child): the entry is LIVE or UNKNOWN, preserved byte-identical, never REAPED-STAGING'
      - 'target writer sharing the reaper session (MAIN): the reaper''s own session holds a transfer/extract of a dead controller''s run: target entry PRESERVED-BUSY/UNKNOWN, never reaped'
      - 'target writer outside the listed session scopes (MAIN; e.g. a user service or a stale ControlPersist master): preserved, never reaped'
      - 'every unobservable path preserves (UNKNOWN), with the budget refusal as the visible backpressure'
    declared_only: 'codex-014047 R3E-WRITER-CONTAINMENT, bound to the real managed caller and transport (package.yml / controller.yml under
      seed run / target_bootstrap.yml over the admitted ssh transport). The descendant leg needs two runner additions declared here and added
      with r3f: an act option delegate (systemd-run -p Delegate=yes) and an op moving a named process into a child cgroup of its own act
      scope; the target legs are MAIN. Conditional counterexamples, not observed default behaviour (codex: the seed creates a fresh
      ANSIBLE_HOME per run; cross-run ControlPersist reuse not established)'

  - id: L04-recovery-needs-empty-run-cgroup
    cases: [E30-when-recovery-fires, E21-package-staging-bounded-repeated-failure]
    findings: [M1-STAGING-RECOVERY, LEASE-HOLDER-EXIT-IS-NOT-WRITER-QUIESCENCE]
    requires: [bundle_a, r3e_writer_quiescence, act_scope_mechanism]
    steps:
      - {id: p1, act: {kind: package, dest: '{ctl}/bundle', async: true, scope: shared}}
      - {id: p1-staging, wait: {file_regex: {file: '{ctl}/p1.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 600}
      - {id: kill-processes, kill: {step: p1, processes_only: true}}
      - {id: j1, join: p1, expect: {killed: true}}
      - {id: left, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1, bind: staging}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 1}}]}
      - {id: snap, snapshot: {name: left, of: '{ctl}', include_regex: ['^\.bundle\.(staging|lease)\.']}}
      - {id: p2, act: {kind: package, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-LIVE-STAGING \S+ \[[^]]*{staging}', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*{reaping}']}}
      - {id: kept, state: [{snapshot: left, equal: true}]}
    note: 'r3e E30 (declared, not implied): a run launched without its own scope shares the RUNNER''s session scope; every process of p1 is
      killed, the holder is gone, but the recorded run cgroup is still populated (by the runner), so p2 must report the entry LIVE and keep
      it and its record byte-identical -- fail closed. This is the only act with scope: shared; its leftovers are control-owned scratch
      (variant_scratch), never removed by a reaper. Consequence for every other control: acts run in their own scope (act_scope)'

  - id: F01-flock-substitution-refused
    cases: [E28-flock-substitution-refused]
    findings: [M1-STAGING-RECOVERY]
    requires: [bundle_a, r3e_writer_quiescence]
    declaration: flock_true
    steps:
      - {id: snap, snapshot: {name: pre, of: '{ctl}', exclude_regex: ['^[a-z0-9-]+\.(stdout|stderr|strace|inventory\.yml|rc|json) ']}}
      - {id: package, act: {kind: package, repo: variant, dest: '{ctl}/bundle'},
         expect: {rc_nonzero: true, playbook_refusal: RH-STAGING-LEASE, refused_at: Refuse a flock that does not serialize, stdout_not_regex: ['REAPED-STAGING']}}
      - {id: nothing, state: [{snapshot: pre, equal: true}, {path: '{ctl}/bundle', exists: false}]}
    note: 'r3e E28: os_tools.flock.path = /usr/bin/true WITH true''s own file identity (else the identity admission refuses
      RH-OS-TOOL-IDENTITY first -- a FAIL here, never coverage): the known answers (flock --version names util-linux; a nested flock -n on
      the held lock exits busy_rc) refuse RH-STAGING-LEASE before any reap or reservation. Target side (adapter flock) is MAIN (TR02). A
      non-locking wrapper variant needs a root-owned wrapper (MAIN)'

  - id: O01-other-controller-preserved-then-retired
    cases: [E29-other-controller-preserved-and-recovered]
    findings: [M1-STAGING-RECOVERY, unknown_and_other_controller]
    requires: [bundle_a, r3e_writer_quiescence]
    declaration: retire_zero_machine
    setup:
      - {mkdir: '{ctl}/.bundle.staging.L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1.rhcother', mode: '0700'}
      - {write: '{ctl}/.bundle.lease.L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1', mode: '0400',
         content: '{"schema": "lme-staging-lease/1", "token": "L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1", "machine": "00000000000000000000000000000000", "boot": "00000000000000000000000000000000", "uid": "{uid}", "pid": "1", "start": "1", "pidns": "pid:[1]", "cgroupns": "cgroup:[1]", "cgroup_b64": ""}'}
    steps:
      - {id: snap, snapshot: {name: other, of: '{ctl}', include_regex: ['^\.bundle\.(staging|lease)\.L0{32}-']}}
      - {id: first, act: {kind: package, dest: '{ctl}/bundle'},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'PRESERVED-UNKNOWN-STAGING \S+ \[[^]]*\.bundle\.staging\.L0{32}-0{32}-', stdout_not_regex: ['REAPED-STAGING \S+ \[[^]]*\.bundle\.reaping\.L0{32}-']}}
      - {id: preserved, state: [{snapshot: other, equal: true}]}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}]}
      - {id: retired, act: {kind: package, repo: variant, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED], stdout_regex: 'REAPED-STAGING \S+ \[[^]]*\.bundle\.reaping\.L0{32}-0{32}-'}}
      - {id: recovered, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.L0*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.L0*', count: 0}},
                                {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}}]}
    note: 'r3e E29: an entry whose lease record names ANOTHER controller machine stays UNKNOWN (preserved, charged, never removed to meet a
      count); after MAIN declares that machine retired (staging_retention.recovery.retired_controller_machine_ids -- here a declaration
      variant, a reviewed change) its controller-side proof is waived and a controller-staging entry is reaped. The planted record follows
      the announced lme-staging-lease/1 field list; its field types are a G request to the route author. The retired run publishes a
      DIFFERENT bundle (other declarations), so the first bundle is removed first (control-owned)'

  # =====================================================================================================================
  # FINAL-BYTES ROWS E33-E50 (MAIN rebind). Ids: <operation>.<phase>.<relation>. Every leg here is localhost-only (package.yml,
  # or target_bootstrap.yml play 1 with --limit localhost), EXCEPT target.admit.* (target_bootstrap.yml play 2 refusals before
  # contact against TEST-NET-1 targets; Q-G-PRECONTACT-TARGET-PLAY ruled main_only -> MAIN-ONLY) and the MAIN legs (a real target).
  # =====================================================================================================================

  # ---- E35 (package side), E38: declared inputs and the effective controller connection ----
  - id: package.resolve.declared-inputs-validated
    cases: [E35-declared-inputs-validated]
    findings: [DECLARED-INPUTS-VS-DERIVED-OUTPUTS]
    requires: [bundle_a, seed06_projection]
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/resolve_policy.yml, testing/remote_harness/package.yml]}
    rows:
      extra-var-profile: 'E35 extra-var-profile: REFUSED RH-POLICY-INPUT-CONFLICT after the resolve, before any effect'
      extra-var-manifests: 'E35 extra-var-manifests: needs a second checkout path (no runner token names one) -> MAIN (candidate-clone run)'
      inventory-profile: 'E35 inventory-profile: NOT refused (include vars outrank inventory); the bundle is bundle A''s'
      target-legs: 'E35 connection-local / control-path / alias / collapsed-address: target.admit.precontact-refused; proxyjump positive: TR01/TR02 (MAIN)'
    refute: 'inventory-profile expecting a refusal would FAIL (it must publish); extra-var-profile with lme_profile=remote-harness (the admitted value) publishes -> FAIL'
    hostile: 'an extra-var repointing the engine at another profile'
    variants:
      - {id: extra-var-profile}
      - {id: extra-var-manifests, requires: [main_only]}
      - {id: inventory-profile}
      - {id: target-legs, requires: [main_only], note: 'bound elsewhere (see rows); recorded so the row map has no gap'}
    steps:
      - {id: snap, snapshot: {name: ctl, of: '{ctl}', exclude_regex: ['^[a-z0-9.-]+\.(stdout|stderr|strace|inventory\.yml|rc|json) ']}}
      - {id: xv-profile, only_variants: [extra-var-profile], act: {kind: package, dest: '{ctl}/bundle', extra_vars: {lme_profile: default}},
         expect: {rc_nonzero: true, playbook_refusal: RH-POLICY-INPUT-CONFLICT, refused_at: Refuse an engine resolve whose effective checkout or profile is not this helper,
                  failed_before_task: Admit exactly the declared builder before any write},
         post_state: [{snapshot: ctl, equal: true}]}
      - {id: inv-profile, only_variants: [inventory-profile], act: {kind: package, dest: '{ctl}/bundle', inventory_extra: {lme_profile: default}},
         expect: {rc: 0, stdout_has: [PUBLISHED]},
         post_state: [{same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}, {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}]}
      - {id: drop, only_variants: [inventory-profile], ops: [{remove: '{ctl}/bundle'}]}

  - id: controller.admit.connection-bound
    cases: [E38-controller-connection-bound]
    findings: [TRANSPORT-COMPOSITION-REMAINDERS]
    requires: [shared_root, seed06_projection, r3g_admit_controller]
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/admit_controller.yml, testing/remote_harness/package.yml, testing/remote_harness/acquire.yml,
                                    testing/remote_harness/controller.yml, testing/remote_harness/target_bootstrap.yml]}
    rows:
      base: 'E38 extra-var-connection on package / acquire / controller / target_bootstrap play 1; inventory-localhost-ssh; become (extra var and
        host var): REFUSED RH-CONTROLLER-CONNECTION at the second task (admit_controller), no network; plain: admitted (the runner''s declared
        localhost inventory with ansible_connection local -- the no-variable shape is not constructible by this runner: it always writes it)'
    refute: 'the plain leg expecting a refusal FAILS; any leg reaching "Resolve the harness policy" (failed_before_task) FAILS -- the refusal must precede the resolve'
    hostile: 'connection variables that outrank the play keyword (extra var, inventory host var) and privilege escalation'
    steps:
      - {id: pkg-xv-ssh, act: {kind: package, dest: '{ctl}/bundle', extra_vars: {ansible_connection: ssh}, trace_network: true},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy, no_network: true}, post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: acq-xv-ssh, act: {kind: playbook, playbook: acquire, via: builder, source: '{ctl}/src', extra_vars: {ansible_connection: ssh}, trace_network: true},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy, no_network: true}, post_state: [{path: '{ctl}/src', exists: false}]}
      - {id: ctl-xv-ssh, act: {kind: playbook, playbook: controller, via: seed_run, root: '{shared}', bundle: a, extra_vars: {ansible_connection: ssh}, trace_network: true},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy, no_network: true}}
      - {id: tb-xv-ssh, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost,
                              inventory_extra: {rh_bundle_dir: '{bundle_a}'}, extra_vars: {ansible_connection: ssh}, trace_network: true},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy, no_network: true}}
      - {id: pkg-inv-ssh, act: {kind: package, dest: '{ctl}/bundle', inventory_extra: {ansible_connection: ssh}, trace_network: true},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy, no_network: true}, post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: pkg-xv-become, act: {kind: package, dest: '{ctl}/bundle', extra_vars: {ansible_become: 'true'}},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy}, post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: pkg-inv-become-user, act: {kind: package, dest: '{ctl}/bundle', inventory_extra: {ansible_become: true, ansible_become_user: root}},
         expect: {rc_nonzero: true, playbook_refusal: RH-CONTROLLER-CONNECTION, refused_at: Refuse an effective controller connection other than local,
                  failed_before_task: Resolve the harness policy}, post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: plain, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED], stdout_not_regex: ['REFUSED RH-CONTROLLER-CONNECTION']}}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}]}
    note: 'become is never executed: the refusal is an assert on the effective variables before any task that could escalate; the runner
      never runs sudo. acquire is refused before any fetch (no network), so its source dir is never created'

  # ---- E40, E43, E44, E47 (package side, localhost only): classes from C1's per-host scopes ----
  - id: package.classes.per-host-scope-publication
    cases: [E34-per-host-tool-identity, E40-heterogeneous-target-reaches-consumers, E43-same-target-reapply-stable, E44-shared-class-reused, E47-budget-override-own-class]
    findings: [PER-HOST-SCOPE-CONTRACT, C1-ARTIFACT-REUSE-INPUT-COVERAGE]
    requires: [bundle_a, seed06_projection, r3g_per_class, c1_widened_key]
    evidence: {bind_source_sha256: [manifests/global.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, testing/remote_harness/tasks/scope_classes.yml,
                                    testing/remote_harness/tasks/package_bundle.yml, testing/remote_harness/tasks/admit_bundle.yml]}
    rows:
      homogeneous: 'E44 homogeneous: ONE class (the controller''s) at rh_bundle_dir, no sibling; bundle.sha256 byte-identical to bundle A'
      identity-only: 'E40(a)/E44: a per-host tool IDENTITY (not embedded in the seed) -> same key, one class, no sibling'
      adapter-path: 'E40(a)/E44: a per-host adapter-only tool path (xargs; outside the seed inputs'' consumers) -> same key, one class'
      seed-path: 'E40(b): a per-host SEED tool path -> TWO classes: controller''s at rh_bundle_dir, t2''s at <rh_bundle_dir>-class-<64 hex>,
        its seed rendered from t2''s own policy (/bin/sort); E43 package side: rerun UNCHANGED at both; a third target of t2''s class adds nothing'
      budget-own-class: 'E47 positive (C1 widened key, codex 035141): a per-host budget.tasks_max 257 is its OWN class with its own render'
      same-key-other-artifact: 'E47 negative (the key is a hint only, codex 040323): a destination with bundle A''s bundle.json/bundle.sha256
        (same class key) but a changed artifact byte is NEVER reused: refused, preserved'
    refute: 'seed-path with the override removed from t2 -> one class -> the sibling count 1 predicate FAILS; same-key-other-artifact without the
      flipped byte -> UNCHANGED rc 0 -> FAILS'
    hostile: 'a planted bundle whose manifest claims the right class key over different artifact bytes'
    variants:
      - {id: homogeneous}
      - {id: identity-only}
      - {id: adapter-path}
      - {id: seed-path}
      - {id: budget-own-class}
      - {id: same-key-other-artifact,
         ops: [{copy_tree: {from: '{bundle_a}', to: '{ctl}/bundle'}}, {overwrite_first_byte: {dir: '{ctl}/bundle/artifacts', char: X}}]}
    steps:
      - {id: pkg-homogeneous, only_variants: [homogeneous], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1}},
         expect: {rc: 0, stdout_has: [PUBLISHED]},
         post_state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 0}}, {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: pkg-identity, only_variants: [identity-only], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_identity_only}}},
         expect: {rc: 0, stdout_has: [PUBLISHED]},
         post_state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 0}}, {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: pkg-adapter, only_variants: [adapter-path], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_adapter_path}}},
         expect: {rc: 0, stdout_has: [PUBLISHED]},
         post_state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 0}}, {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: pkg-seed, only_variants: [seed-path], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}},
         expect: {rc: 0, stdout_regex: 'PUBLISHED \S+ \S+/bundle-class-[0-9a-f]{64} class [0-9a-f]{64}'}}
      - {id: pkg-budget, only_variants: [budget-own-class], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_budget_257}}},
         expect: {rc: 0, stdout_regex: 'PUBLISHED \S+ \S+/bundle-class-[0-9a-f]{64} class [0-9a-f]{64}'}}
      - {id: two-classes, only_variants: [seed-path, budget-own-class],
         state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 1, bind: sibling}}, {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: own-render-seed, only_variants: [seed-path],
         state: [{file: '{sibling}/lme-controller-seed.sh', regex: "(^|[^/a-z])/bin/sort( |'|$)"}, {file: '{ctl}/bundle/lme-controller-seed.sh', regex: "/usr/bin/sort( |'|$)"}]}
      - {id: own-render-budget, only_variants: [budget-own-class],
         state: [{file: '{sibling}/lme-controller-seed.sh', regex: '(^|[^0-9])257([^0-9]|$)'}, {file: '{ctl}/bundle/lme-controller-seed.sh', regex: '(^|[^0-9])512([^0-9]|$)'}]}
      - {id: snap-classes, only_variants: [seed-path], snapshot: {name: classes, of: '{ctl}', include_regex: ['^bundle( |/|-class-)']}}
      - {id: rerun-seed, only_variants: [seed-path], act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}},
         expect: {rc: 0, stdout_regex: 'UNCHANGED \S+ \S+/bundle-class-[0-9a-f]{64} class ', stdout_not_regex: ['PUBLISHED ']}}
      - {id: third-target, only_variants: [seed-path],
         act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}, t3: {<<: *t3, lme_global_override: *ov_seed_path}}},
         expect: {rc: 0, stdout_not_regex: ['PUBLISHED ']}}
      - {id: nothing-rebuilt, only_variants: [seed-path], state: [{snapshot: classes, equal: true}, {glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 1}}]}
      - {id: snap-planted, only_variants: [same-key-other-artifact], snapshot: {name: planted, of: '{ctl}/bundle'}}
      - {id: pkg-planted, only_variants: [same-key-other-artifact], act: {kind: package, dest: '{ctl}/bundle'},
         expect: {any_of: [{rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, stdout_not_regex: ['UNCHANGED ']},
                           {rc_nonzero: true, playbook_refusal: RH-BUILDER-UNSUPPORTED, refused_at: Refuse a destination that holds a different bundle, stdout_not_regex: ['UNCHANGED ']}]},
         post_state: [{snapshot: planted, equal: true}]}
      - {id: drop, ops: [{remove_glob: {dir: '{ctl}', pattern: 'bundle*'}}]}
    note: 'C1 resolves every inventory host''s own lme_global_override (ansible/roles/podman/tasks/resolve.yml) into
      lme_resolved.remote_harness.scopes; package.yml runs on localhost only, so the TEST-NET targets are inventory data, never contacted
      (no network is read by package; trace_network is not required). The class key is C1''s published shared_artifact_inputs_sha256
      (route never derives it); E47''s positive depends on the WIDENED key (probe c1_widened_key) and on the target''s own-render guard as
      the authority, never on the key alone (codex 040323). E43/E44/E47 TARGET legs (seed apply UNCHANGED, same receipt generation, the
      own-render guard on the target) contact a host: MAIN (candidate-clone run). The E47 equal-key-unequal-render TARGET refusal is not
      constructible with the widened key (C1 proves every declared seed-template input is in it): recorded as MAIN / author evidence only'

  # ---- E40 play-1 positive, E41/E42/E45 controller-play negatives (target_bootstrap.yml play 1 ONLY: --limit localhost) ----
  - id: target.pack.class-selection
    cases: [E40-heterogeneous-target-reaches-consumers, E41-wrong-target-scope-refused, E42-stale-or-incomplete-binding-refused, E45-wrong-class-bundle-refused]
    findings: [PER-HOST-SCOPE-CONTRACT, coordinator-B-step-2]
    requires: [bundle_a, shared_root, seed06_projection, r3g_per_class, c1_widened_key]
    evidence: {bind_source_sha256: [testing/remote_harness/target_bootstrap.yml, testing/remote_harness/tasks/pack_class.yml, testing/remote_harness/tasks/admit_bundle.yml,
                                    testing/remote_harness/tasks/scope_classes.yml]}
    rows:
      seed-class-packed: 'E40(b) controller play: t2 selects ITS class (sibling) and it is admitted and packed; rc 0 (play 2 not run: --limit localhost)'
      controller-bundle-substituted: 'E45 controller-bundle-substituted = E42 missing-class: only the controller bundle exists -> REFUSED RH-SCOPE-BINDING
        (missing class bundle), before any target contact; never a controller-bundle fallback'
      other-class-record: 'E45 other-class-record = E41 other-target-artifact: the sibling holds the controller class''s bundle -> admit_bundle
        REFUSED RH-TARGET-BOOTSTRAP (recorded class_key / fresh render), before any target contact'
      forged-resolve-rows: 'E41 other-target-policy / relabelled-scope; E42 wrong-edition / wrong-operation / other-deployment / incomplete-identity /
        not-declared-target / stale-class-view / class-not-listing-target / malformed-controller-resolve: NOT constructible through the declared
        inputs (they need a forged C1 resolve, and every resolver output is refused when pinned: E48); defence-in-depth branches exercised only by
        a MAIN-staged mutated-resolver copy in the candidate-clone run (MAIN), never by G'
      equal-key-unequal-render: 'E45 equal-key-unequal-render: not constructible with the widened key (see package.classes.per-host-scope-publication)'
    refute: 'controller-bundle-substituted after ALSO packaging t2''s class (sibling present) -> rc 0 -> FAILS; other-class-record without the copy -> rc 0 -> FAILS'
    hostile: 'a class sibling that holds another class''s bundle; a deployment offering only the controller bundle to a target of another class'
    variants:
      - {id: seed-class-packed}
      - {id: controller-bundle-substituted}
      - {id: other-class-record}
      - {id: forged-resolve-rows, requires: [main_only]}
      - {id: equal-key-unequal-render, requires: [main_only]}
    steps:
      - {id: pkg-two, only_variants: [seed-class-packed, other-class-record],
         act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}}, expect: {rc: 0}}
      - {id: pkg-one, only_variants: [controller-bundle-substituted], act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: sib, only_variants: [seed-class-packed, other-class-record], state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 1, bind: sibling}}]}
      - {id: no-sib, only_variants: [controller-bundle-substituted], state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 0}}]}
      - {id: swap, only_variants: [other-class-record], ops: [{remove: '{sibling}'}, {copy_tree: {from: '{ctl}/bundle', to: '{sibling}'}}]}
      - {id: snap, snapshot: {name: dirs, of: '{ctl}', include_regex: ['^bundle( |/|-class-)']}}
      - {id: tb-ok, only_variants: [seed-class-packed],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}},
         expect: {rc: 0, refused_at: null, no_network: true}}
      - {id: tb-missing, only_variants: [controller-bundle-substituted],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t2: {<<: *t2, lme_global_override: *ov_seed_path}}},
         expect: {rc_nonzero: true, playbook_refusal: RH-SCOPE-BINDING, refused_at: Refuse a missing class bundle, no_network: true}}
      - {id: tb-other-class, only_variants: [other-class-record],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}},
         expect: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true}}
      - {id: preserved, state: [{snapshot: dirs, equal: true}]}
      - {id: drop, ops: [{remove_glob: {dir: '{ctl}', pattern: 'bundle*'}}]}
    note: '--limit localhost restricts the PLAYS to localhost; groups[target_group] still lists every declared target, so C1''s scopes, the
      class derivation and pack_class run exactly as in a real deployment, and play 2 (the only contact) never starts. The packed archive
      stays in the seed run''s own TMPDIR (seed run retention). A failure of play 1 ends the playbook before play 2 in every case'

  # ---- E46: two concurrent heterogeneous publications ----
  - id: package.publish.two-classes-concurrent
    cases: [E46-concurrent-two-class-publication]
    findings: [E20-CONCURRENCY, M1-STAGING-RECOVERY, coordinator-B-step-2]
    requires: [bundle_a, seed06_projection, r3g_per_class, c1_widened_key, act_scope_mechanism]
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/package_bundle.yml, testing/remote_harness/tasks/reap_staging.yml, testing/remote_harness/tasks/scope_classes.yml,
                                    manifests/profiles/remote-harness.yml]}
    rows: {base: 'E46: two package.yml runs at once over a two-class deployment: per class one PUBLISHED and one UNCHANGED (never mixed), per-class
             lock/lease/staging names, no cross-class reap; nothing left over'}
    refute: 'a route whose reap glob matched `.bundle.*` for both classes would report the other class''s live staging (PRESERVED-*/REAPED-*) or
      refuse busy -> the no-REFUSED / no-REAPED expectations FAIL'
    hostile: 'a second publisher of the same two classes racing the first'
    steps:
      - {id: r1, act: {kind: package, dest: '{ctl}/bundle', async: true, inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}}}
      - {id: r2, act: {kind: package, dest: '{ctl}/bundle', async: true, inventory_targets: {t1: *t1, t2: {<<: *t2, lme_global_override: *ov_seed_path}}}}
      - {id: j1, join: r1, expect: {rc: 0, stdout_regex: '(PUBLISHED|UNCHANGED) \S+ \S+/bundle-class-[0-9a-f]{64} class ', stdout_not_regex: ['REFUSED ', 'REAPED-STAGING']}}
      - {id: j2, join: r2, expect: {rc: 0, stdout_regex: '(PUBLISHED|UNCHANGED) \S+ \S+/bundle-class-[0-9a-f]{64} class ', stdout_not_regex: ['REFUSED ', 'REAPED-STAGING']}}
      - {id: bounded, state: [{glob: {dir: '{ctl}', pattern: 'bundle-class-*', count: 1, bind: sibling}},
                              {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}},
                              {glob: {dir: '{ctl}', pattern: '.bundle-class-*.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle-class-*.lease.*', count: 0}},
                              {glob: {dir: '{ctl}', pattern: '.*.reaping.*', count: 0}},
                              {path: '{ctl}/.bundle.lock', exists: true}, {glob: {dir: '{ctl}', pattern: '.bundle-class-*.lock', count: 1}},
                              {same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: drop, ops: [{remove_glob: {dir: '{ctl}', pattern: 'bundle*'}}]}
    note: 'the per-run "one PUBLISHED, the other UNCHANGED" of E09 holds PER CLASS; across two classes each run may publish one class and read
      the other back, so the judge is per run (rc 0, no refusal, no reap) plus the final state (exactly one sibling, both locks, no staging /
      lease / reaping of either class, the controller class byte-identical to bundle A). A RH-STAGING-BUSY is a FAIL, never coverage'

  # ---- E48 (localhost entrypoints not covered by N01's sweep, and the empty list) ----
  - id: entry.pin.resolver-output-refused
    cases: [E48-resolver-outputs-pinned-refused]
