      its value and the expectation FAILS'
    variants:
      - {id: explicit-key-set, case_components: {E84-seed-launcher-socket-carry: [explicit-key-set]}}
      # G-E84-PARTIAL-WHOLE-CREDIT (codex 231744): every variant states its E84 credit EXPLICITLY. `[]` = names the row,
      # credits NO component (controls.j2 coverage_of): tailnet-identity-set is G's own auth mode (not a row variant) and
      # run-local-set is one leg of the three-leg other-modes-set component (apply / verify NOT BUILT), so neither PASS can
      # credit any E84 component, let alone the whole row. An omitted entry beside component-crediting siblings is a
      # declaration error (controls.j2 coverage: mixed credit), never an implicit whole.
      - {id: tailnet-identity-set, case_components: {E84-seed-launcher-socket-carry: []}}
      - {id: agent-set, requires: [main_only], case_components: {E84-seed-launcher-socket-carry: [agent-set]}}
      # E84 other-modes-set, run-local leg (codex 225207): the NEW declared run-local runner, resolved through the profile's
      # work_roots.run_local.runners.probe_env (route_probe_env_runner), launched by bundle A's generated launcher as
      # `run-local {workspace}/toolchain probe_env` (controls.j2 launch_values: `--runner probe_env` is the runner word) with the
      # caller's SSH_AUTH_SOCK set. It needs the packaged checkout's OWN .work (workspace_run_local) and MAIN's live socket
      # boundary at the execution handoff (main_only): G never runs it. Explicit no-credit ([]): the row stays PARTIAL
      # (other-modes-set apply / verify NOT BUILT); a PASS here never credits other-modes-set or the whole row.
      - {id: run-local-set, requires: [workspace_run_local, route_probe_env_runner, main_only], case_components: {E84-seed-launcher-socket-carry: []}}
    steps:
      - {id: probe-run-local, only_variants: [run-local-set],
         act: {kind: seed, bundle: a, op: run-local, root: '{workspace}/toolchain', args: ['--runner', probe_env],
               env: {SSH_AUTH_SOCK: '{ctl}/rhc-not-an-agent.sock'}},
         expect: {rc: 0, stdout_not_regex: ['probe_env FAILED']},
         # the runner's 0600 names-only evidence (tests/run_probe_env.yml: schema probe-env/1, env_names, ssh_auth_sock_present).
         # Required names: seed_launch.env.order + managed_env + every path-valued resolved_run.env name (the profile's
         # resolved_run comment + run_env) + remote_tmp_env + XDG_RUNTIME_DIR. Quoted, so "HOME" never matches "ANSIBLE_HOME".
         # Names and booleans only: no variable VALUE is read or asserted.
         post_state: [{path: '{workspace}/run/probe-env/env.json', kind: regular, mode: '0600'},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: schema, value: probe-env/1}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: runner, value: probe_env}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: work_root, value: '{workspace}/run/probe-env'}},
                      {file: '{workspace}/run/probe-env/env.json', json_equal: {path: ssh_auth_sock_present, value: false}},
                      {file: '{workspace}/run/probe-env/env.json', lacks: '"SSH_AUTH_SOCK"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"PATH"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"LC_ALL"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"HOME"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"PYTHONDONTWRITEBYTECODE"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_NOCOLOR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"TMPDIR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_HOME"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_LOCAL_TEMP"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_GALAXY_CACHE_DIR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_COLLECTIONS_PATH"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_CONFIG"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"ANSIBLE_REMOTE_TMP"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"XDG_RUNTIME_DIR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"XDG_CACHE_HOME"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"UV_CACHE_DIR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"PIP_CACHE_DIR"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"XDG_DATA_HOME"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"CONTAINERS_STORAGE_CONF"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"CONTAINERS_CONF"'},
                      # the non-path exports the profile's resolved_run comment names as exported but not listed
                      {file: '{workspace}/run/probe-env/env.json', contains: '"DBUS_SESSION_BUS_ADDRESS"'},
                      {file: '{workspace}/run/probe-env/env.json', contains: '"USER"'}]}
      - {id: probe, only_variants: [explicit-key-set],
         act: {kind: playbook, playbook: probe_env, via: seed_run, root: '{shared}', bundle: a, ssh_auth: explicit_key,
               env: {SSH_AUTH_SOCK: '{ctl}/rhc-not-an-agent.sock'}},
         expect: {rc: 0, stdout_has: ['RHC-SSH-AUTH-SOCK=<unset>'], stdout_not_regex: ['RHC-SSH-AUTH-SOCK=/']}}
      - {id: probe-tailnet, only_variants: [tailnet-identity-set],
         act: {kind: playbook, playbook: probe_env, via: seed_run, root: '{shared}', bundle: a, ssh_auth: tailnet_identity,
               env: {SSH_AUTH_SOCK: '{ctl}/rhc-not-an-agent.sock'}},
         expect: {rc: 0, stdout_has: ['RHC-SSH-AUTH-SOCK=<unset>'], stdout_not_regex: ['RHC-SSH-AUTH-SOCK=/']}}
    note: 'BUILT-UNRUN, controller-local (a localhost probe play under `seed run`; no target). The caller''s SSH_AUTH_SOCK is set as a
