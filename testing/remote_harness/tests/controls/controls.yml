  # clone the negative then stages around (fixture_ops); no checkout_fixture (the producer call IS the step under test)
  fixture_clone_plain: {patch: {}, profile_bytes_differ: true,
                        note: 'checkout-symlink-ancestor: the plain Route 3 clone (profile only re-serialized) in the dedicated fixture ctl'}
  relocate_profile_only: {profile_case: relocate-template-subtree-profile, profile_bytes_differ: true,
                          note: 'relocate-registry-parent-symlink: the Route 3 clone patched with the relocation profile case, the relocation NOT applied
                                 (the produce step applies relocate-template-subtree and must be refused)'}

# The declared variant clone (Route 3; tasks/variant_clone.yml, run by tasks/variant_admit.yml BEFORE any op or step of
# the variant). Per variant of a variant_checkout: clone control:
#   1. refuse unless {vclone} = {ctl}/vclone lies inside this marked run dir (under the run's work root: never /tmp, never
#      the authoring checkout -- under codex ANCESTRY-RUN-LOCATION the run checkout is itself the exact-commit clone under
#      /home/tristan/lme-runs), carries no `..`, does not exist yet, and {head} is a full commit id;
#   2. refuse unless the run checkout's tracked files are unmodified (status, untracked excluded, no optional locks: the
#      source is only read);
#   3. clone <run checkout> -> {vclone} with `clone` args (--no-hardlinks: no inode shared with the source), chmod
#      {vclone} `mode` at once (an umask-0002 clone is group-writable and the seed's ancestry would refuse its work root
#      for the wrong reason), then `checkout` {head}; the clone's HEAD must read back as {head};
#   4. write its profile (rhc_profile_rel: bound in tasks/prepare.yml from the engine's EFFECTIVE lme_manifests_dir /
#      lme_profile through `profile_source.form`, the engine's own include_vars path in ansible/roles/podman/tasks/
#      resolve.yml, confined, a regular checkout-owned file, and proven equal to the engine-loaded _lme_profile_file and
#      rh_profile_sha256; G-CLONE-DECLARED-PROFILE-PATH, codex 220352 -- no path literal) as candidate + the declared patch, serialized with `serialize` (parsed equal to the
#      Route-2 admission's expectation; bytes differ from the commit); a declaration's checkout_fixture is then applied by
#      the route producer (tasks/fixture_checkout.yml), and `git status` must list EXACTLY that profile plus the fixture's
#      expected_status (sorted exact set; controls.j2 clone_status -- REPAIR 5, codex 223100);
#   5. create its own work root {vwork} = {vclone}/<controller.bootstrap.work_roots.root_rel> and {vparent} = {vwork}/p
#      (`mode`); a root of this variant is {vroot} = {vparent}/root, so `seed run` of a bundle packaged from the clone
#      anchors W = {vwork} and its checkout = {vclone} (controller_seed.j2 admit_storage checkout_binding).
# Git reads no ambient configuration and runs no hook (env + config). Cleanup (tasks/finish_variant.yml): {vroot} is
# purged through bundle A, then {vclone} leaves with the variant scratch.
variant_clone:
  mode: '0700'
  profile_source: {manifests_dir_var: lme_manifests_dir, profile_var: lme_profile, form: '{manifests_dir}/profiles/{profile}.yml',
                   profile_regex: '^[A-Za-z0-9][A-Za-z0-9_-]*$', engine_task: ansible/roles/podman/tasks/resolve.yml}
  env: {GIT_CONFIG_NOSYSTEM: '1', GIT_CONFIG_GLOBAL: /dev/null, GIT_TERMINAL_PROMPT: '0', GIT_OPTIONAL_LOCKS: '0'}
  config: [-c, core.hooksPath=/dev/null, -c, advice.detachedHead=false]
  clone: [clone, --no-hardlinks, --no-checkout, --template=, --quiet]
  checkout: [checkout, --quiet, --detach]
  source_status: [status, --porcelain=v1, --untracked-files=no]
  clone_status: [status, --porcelain=v1, --untracked-files=all]
  head_regex: '^[0-9a-f]{40}([0-9a-f]{24})?$'
  serialize: {indent: 2, width: 100000}

fixtures:
  tools:            # owner-owned 0700 copies (owner-writable by construction)
    - {from_os_tool: sort, path: '{fixtures}/tools/sort'}
    - {from_os_tool: mv, path: '{fixtures}/tools/mv'}

# ---------------------------------------------------------------------------------------------------------------
# Interruption points. Each is compiled into: fresh root; apply (or package) under strace with a delay injected at the
# point; wait for the point's observable (the effect happened, the tracee is frozen inside the hold); assert `valid`
# (the kill lands strictly between this effect and the next); kill the whole operation (the seed's budget scope via
# systemctl --user kill, then every process naming the root; pgrep must find none); interrupted-state predicates;
# verify while interrupted (publication points); reapply (converges); verify; purge; clear parent staging.
# Points without a stable absolute-path observable (a partial rmtree inside the reaping dir) need trace DISCOVERY,
# declared but NOT implemented (their control stays UNIMPLEMENTED, reported as a gap).
interruption:
  hold: 20s
  points:
    - id: root-parent-lock
      syscalls: [flock]
      when: exit
      wait: {file_regex: {file: '{ctl}/pt-root-parent-lock-apply.strace', regex: 'flock\(8, .*DELAYED'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 0}}, {path: '{root}', exists: false}]
      rerun: {outcome: INSTALLED}
      note: 'r3c: the creator holds flock on the PARENT (fd 8) before stale recovery/mkdir (E20); a kill here leaves nothing'
    - id: root-staging-created
      syscalls: [mkdir, mkdirat]
      when: exit
      wait: {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 0}}, {path: '{root}', exists: false}]
      rerun: {stderr_regex: '^REMOVED-STALE-ROOT-STAGING {parent}/\.{rootname}\.creating\.', outcome: INSTALLED}
    - id: root-staging-marked
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}'
      wait: {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*'}}
      valid: [{glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 1}},
              {path: '{staging}/.lme-controller-root', exists: true}, {path: '{root}', exists: false}]
      rerun: {stderr_regex: '^REMOVED-STALE-ROOT-STAGING {parent}/\.{rootname}\.creating\.', outcome: INSTALLED}
    - id: root-locked
      syscalls: [flock]
      when: exit
      wait: {file_regex: {file: '{ctl}/pt-root-locked-apply.strace', regex: 'flock\(9, .*DELAYED'}}
      valid: [{path: '{root}/.lme-controller-root', exists: true}, {glob: {dir: '{parent}', pattern: '.{rootname}.creating.*', count: 0}}, {path: '{root}/generations', exists: false}]
      rerun: {outcome: INSTALLED}
      note: 'every flock call is delayed (the parent lock first, then this one); the wait matches the root lock fd'
    - id: gen-staging-created
      syscalls: [mkdir, mkdirat]
      when: exit
      wait: {glob: {dir: '{root}/generations', pattern: '.creating.*'}}
      valid: [{glob: {dir: '{root}/generations', pattern: '.creating.*', count: 1, bind: staging}}, {glob: {dir: '{staging}', pattern: '*', count: 0}}, {path: '{gen}', exists: false}]
      rerun: {outcome: INSTALLED}
      after: [{file: '{root}/operations.log', regex: '^removed-staging [0-9TZ-]+ '}]
    - id: gen-staging-operation
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{gen}'
      wait: {glob: {dir: '{root}/generations', pattern: '.creating.*'}}
      valid: [{glob: {dir: '{root}/generations', pattern: '.creating.*', count: 1, bind: staging}}, {path: '{staging}/.operation', exists: true}, {path: '{gen}', exists: false}]
      rerun: {outcome: INSTALLED}
      after: [{file: '{root}/operations.log', regex: '^removed-staging [0-9TZ-]+ '}]
    - id: receipt-before-publication
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}/{receipt_name}'
      wait: {path_exists: '{gen}/COMPLETE'}
      valid: [{path: '{root}/{receipt_name}', exists: false}]
      publication: true
      rerun: {outcome: UNCHANGED}
    - id: pointer-before-publication
      syscalls: [rename, renameat, renameat2]
      when: enter
      trace_path: '{root}/active-generation'
      wait: {path_exists: '{root}/{receipt_name}'}
      valid: [{path: '{root}/active-generation', exists: false}]
      publication: true
      rerun: {outcome: UNCHANGED}
  phases: [artifacts-verified, uv-install, uv-verify, python-downloads-json, python-install, python-verify, venv, wheels, ansible-config, collections, smoke, seal, complete]

# ---------------------------------------------------------------------------------------------------------------
# Target fixtures (YAML anchors ONLY; the runner never reads this key). Every address is RFC 5737 TEST-NET-1 (192.0.2.0/24,
# guarded at plan time and before the inventory is written): G never reaches a host. Host vars per target_bootstrap.yml's
# inventory contract (root / owner / bundle dir / mode / ansible_user = owner). Paths are control-owned and never created on
# any host (every leg using them refuses before contact, or runs play 1 only with --limit localhost).
target_fixtures:
