  ov_identity_only: &ov_identity_only {remote_harness: {controller: {bootstrap: {os_tools: {rmdir: {identity: {kind: file_sha256, sha256: b381cc8c55ec524b9fa92897f0882e855357468b4a763519cec47e05994d61ff}}}}}}}
  ov_adapter_path: &ov_adapter_path {remote_harness: {controller: {bootstrap: {os_tools: {xargs: {path: /bin/xargs, identity: {kind: file_sha256, sha256: 5f8c5f3f051d73fbeeae248e1d3e819e5feeb1b0265b903385193a2b183ab370}}}}}}}
  ov_budget_257: &ov_budget_257 {remote_harness: {controller: {bootstrap: {budget: {tasks_max: 257}}}}}
  # the four accepted inventory forms (codex 040323; profile ssh_auth.composition.inventory_forms) and the refused ones
  f_mode_args: &f_mode_args '-o IdentityAgent=none -o PubkeyAuthentication=no'

controls:

  # ---- G-STEP-LIVE-FAIL-GUARD sequencing control (codex tick313 stale-probe sequencing; BUILT-UNRUN, controller-local) ----
  # The exact shape of seed.runlocal.exec-reached's fresh-evidence boundary, on a G-owned stand-in: a pre-existing, VALID
  # stale env.json (plus a byte-identical reference copy outside the tree) exists; the boundary step requires it absent and
  # FAILS; the steps after it would overwrite env.json (cp of a different file) and plant a launch marker. The variant
  # declares that it must stop at the boundary (expect_stop_at): it passes only when every recorded failure is the
  # boundary's, every later step is logged as a skip (step.yml / act.yml live guard) and none ran, and after the stop the
  # env.json is still byte-identical to the reference and no launch marker exists. Pre-fix (the guard only on the looped
  # include's `when`) the cp and the marker ran -> same_bytes and the marker predicate FAIL, and judge_stop reports the
  # later steps ran. UNRUN.
  - id: runner.sequencing.stop-preserves-evidence
    cases: []
    findings: [G-STEP-LIVE-FAIL-GUARD, G-RUNLOCAL-STALE-PROBE]
    purpose: 'after a failed step no later step runs: a stale artifact the boundary refused stays byte-identical and the following act never launches'
    refute: 'a runner that evaluates the stop only at include-loop time runs overwrite / mark after the boundary failed: env.json
      differs from the reference, the marker exists, and judge_stop reports "ran after the stop"'
    hostile: 'a stale but valid env.json at the probe path; an act after the failed boundary that would overwrite it'
    setup:
      - {mkdir: '{ctl}/seq/run/probe-env', mode: '0700'}
      - {mkdir: '{ctl}/seq-ref', mode: '0700'}
      - {write: '{ctl}/seq/run/probe-env/env.json', mode: '0600',
         content: "{\"schema\": \"probe-env/1\", \"runner\": \"probe_env\", \"work_root\": \"/stale/run/probe-env\", \"profile_sha256\": \"stale\", \"env_names\": [], \"ssh_auth_sock_present\": false}\n"}
      - {write: '{ctl}/seq-ref/env.json', mode: '0600',
         content: "{\"schema\": \"probe-env/1\", \"runner\": \"probe_env\", \"work_root\": \"/stale/run/probe-env\", \"profile_sha256\": \"stale\", \"env_names\": [], \"ssh_auth_sock_present\": false}\n"}
      - {write: '{ctl}/seq-new.json', mode: '0600', content: "{\"overwritten\": true}\n"}
    variants:
      - {id: stale-env-json, expect_stop_at: boundary,
         after_stop: [{path: '{ctl}/seq/run/probe-env/env.json', kind: regular},
                      {same_bytes: ['{ctl}/seq/run/probe-env/env.json', '{ctl}/seq-ref/env.json']},
                      {path: '{ctl}/seq/launched', exists: false}]}
    steps:
      - {id: boundary, state: [{path: '{ctl}/seq/run/probe-env/env.json', exists: false}]}
      - {id: overwrite, act: {kind: command, argv: [/usr/bin/cp, --, '{ctl}/seq-new.json', '{ctl}/seq/run/probe-env/env.json']}, expect: {rc: 0}}
      - {id: mark, act: {kind: command, argv: [/usr/bin/touch, --, '{ctl}/seq/launched']}, expect: {rc: 0}}
      - {id: later-state, state: [{path: '{ctl}/seq/launched', exists: true}]}

  # ---- mechanism qualification (no seed): must PASS before any strace-injection control ----
  - id: Q00-interrupt-mechanism
    cases: []
    findings: [mechanism]
    purpose: 'strace delay injection, the (DELAYED) trace marker, -P on a not-yet-existing path, observable polling and kill work here (ptrace_scope, --kill-on-exit)'
    setup: [{mkdir: '{ctl}/q00', mode: '0700'}]
    steps:
      - {id: probe, act: {kind: command, argv: [/usr/bin/mkdir, -m, '0700', --, '{ctl}/q00/target'], async: true,
                          strace: {inject: {syscalls: [mkdir, mkdirat], when: exit, hold: 20s}, trace_path: '{ctl}/q00/target'}}}
      - {id: seen, wait: {path_exists: '{ctl}/q00/target'}, timeout_s: 15}
      - {id: frozen, wait: {file_regex: {file: '{ctl}/probe.strace', regex: 'mkdir.*q00/target.*DELAYED'}}, timeout_s: 15}
      - {id: kill, kill: {step: probe}}
      - {id: join, join: probe, expect: {killed: true}}

  # G-WAIT-TOTAL-DEADLINE (codex 203437; ported from m1-1g): the discriminating slow-read control of tasks/wait.yml (BUILT-UNRUN)
  - id: runner.wait.total-deadline
    cases: []
    findings: [mechanism, G-WAIT-TOTAL-DEADLINE]
    purpose: 'a wait''s timeout_s is a TOTAL deadline: a deliberately slow read (strace delay on enter of read, -P the awaited
      file only) under a total SHORTER than one record_readback bound must end by its deadline, report the structured record,
      and never run a poll the remaining time cannot bound'
    setup: [{mkdir: '{ctl}/qw', mode: '0700'}, {write: '{ctl}/qw/record', content: "no marker here\n", mode: '0600'}]
    steps:
      # total 20 < record_readback.timeout_s 60 < hold 40: the pre-fix until/retries wait (every poll bounded by 60s, 11
      # retries, no deadline in until) would read for 40s on its FIRST poll -- elapsed >= 40 > 22 fails deadline_expected
      - {id: slow-read, timeout_s: 20,
         wait: {file_regex: {file: '{ctl}/qw/record', regex: 'RHC-NEVER-WRITTEN'}, poll_hold: {syscall: read, hold: 40s},
                deadline_expected: {elapsed_max_s: 22}}}
      # the same deadline without the hold: fast polls every delay_s, then no attempt admitted in the last admit_s seconds
      - {id: fast-deadline, timeout_s: 12,
         wait: {file_regex: {file: '{ctl}/qw/record', regex: 'RHC-NEVER-WRITTEN'}, deadline_expected: {elapsed_max_s: 14}}}
      # positive: a slowed read inside its bound (hold 2s < T 3s) still matches (reason matched, no RHC-WAIT failure)
      - {id: slow-but-seen, timeout_s: 20,
         wait: {file_regex: {file: '{ctl}/qw/record', regex: 'no marker here'}, poll_hold: {syscall: read, hold: 2s}}}
    note: 'BUILT-UNRUN; for ansible-core 2.17 and 2.19 (until / retries / delay / timeout only -- tasks/wait.yml header has the
      primary-source anchors). Expected (declared, not observed), state.wait_poll {kill_after 1, margin 1, delay 2, poll_bound
      3}: slow-read -- T = min(60, 3, 20 - 1 - 1) = 3s, admit = 2 + 3 + 1 + 1 = 7s; each attempt''s read is held 40s and ended
      by runner_tools.timeout at 3s (rc 124; 137 after --kill-after 1); attempts start at ~0, 5, 10, 15 and none after remaining
      < 7; elapsed ~18s <= 22 with a bound rc -> PASS. fast-deadline -- attempts every ~2s until remaining < 7; elapsed ~6-8s
      <= 14 (the tail is the stated admission cost). slow-but-seen -- matched on attempt 1 after ~2s. The failure record
      (RHC-WAIT <json>: total_s, poll_bound_s, admit_s, elapsed_s, overshoot_s, attempts, last_rc, timed_out, reason matched |
      deadline | poll-timed-out) is shown only when a step fails. Mechanism prerequisite: Q00-interrupt-mechanism (strace delay
      injection and -P) PASSED on the same host. Clock: now(fmt=%s), whole seconds. A run of this control on BOTH the 2.17
      and the 2.19 leg is the first evidence; neither is claimed.'

  - id: Q01-act-scope-mechanism
    cases: []
    findings: [mechanism, E30-when-recovery-fires]
    purpose: 'every act runs in its own transient user scope (act_scope): systemd-run --user --scope works here, the cgroup v2 freezer
      freezes and thaws it (observed in cgroup.events), and a whole kill empties it. Every control that freezes a run or relies on a
      killed run''s cgroup emptying (r3e quiescence) needs this first'
    fixture_for: [act_scope_mechanism]
    steps:
      - {id: sleeper, act: {kind: command, argv: [/usr/bin/sleep, '600'], async: true}}
      - {id: frz, freeze: {step: sleeper}}
      - {id: thw, thaw: {step: sleeper}}
      - {id: kill, kill: {step: sleeper}}
      - {id: join, join: sleeper, expect: {killed: true}}
    note: 'the kill kills the act scope itself: a command act''s processes need not carry the kill token (Q00 had that latent gap: its
      mkdir under strace never named {ctl}/probe.stdout on its command line)'

  # ---- package / bootstrap from declared prerequisites ----
  - id: P01-package-and-cold-bootstrap
    cases: [C01-cold-bootstrap-fixture, T01-fresh-setup, D02-source-identities-recorded, C17-supported-inputs-compose, C-PY-uv-managed-interpreter, T25-ambient-ansible-hidden, S01-clean-seed-closure]
    findings: [SEED-01, SEED-08, genesis, SEED-05, python_policy]
