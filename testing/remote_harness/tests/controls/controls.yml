      - {id: preserved, state: [{snapshot: pre, equal: true}]}
      - {id: drop, ops: [{remove_glob: {dir: '{ctl}', pattern: 'bundle*'}}]}

  # ---- E50 through C1's resolution (package.yml, localhost only): the four accepted forms and the refused ones ----
  - id: package.resolve.endpoint-forms
    cases: [E50-inventory-common-args-accepted-forms, E39-target-endpoint-collision]
    findings: [ACCEPTED-FORMS, C1-EFFECTIVE-ENDPOINT-BINDING, PORT-COMPOSITION-CONSISTENCY]
    requires: [bundle_a, seed06_projection, r3g_accepted_forms]
    evidence: {bind_source_sha256: [manifests/profiles/remote-harness.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, manifests/global.yml]}
    rows:
