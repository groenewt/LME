  # ---- auth-mode usage (seed-only) ----
  - id: A01-auth-mode-usage
    cases: [D14-auth-mode-required, D15-agent-mode-carried-validated, E83-seed-launcher-ambient-env, E84-seed-launcher-socket-carry]
    case_components: {E83-seed-launcher-ambient-env: [count], E84-seed-launcher-socket-carry: [agent-unset]}
    findings: [S3, LAUNCHER-SEQUENCING]
    requires: [shared_root]
    root: shared
    setup: [{write: '{ctl}/not-a-socket', content: '', mode: '0600'}]
    steps:
      # E83 count: run with NO word after <root> (no ssh auth mode, no args) -> the launcher's run count (-ge 1) refuses
      - {id: no-mode, act: {kind: seed, bundle: a, op: run, root: '{shared}', no_ssh_auth: true},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launcher: run takes <root> <ssh_auth_mode> [<args> ...]']}}
      - {id: bogus, act: {kind: seed, bundle: a, op: run, root: '{shared}', ssh_auth: bogus, args: ['--', '--version']}, expect: {refusal: RH-SEED-AUTH}}
      # E83 count: apply with extra words -> the launcher's apply count (-eq 0) refuses
      - {id: apply-with-mode, act: {kind: seed, bundle: a, op: apply, root: '{shared}', raw_args: ['--ssh-auth', x]},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launcher: apply takes <root> and nothing else']}}
      # E84 agent-unset: the caller has no SSH_AUTH_SOCK; the launcher carries SSH_AUTH_SOCK="" and the seed refuses
      - {id: agent-unset, act: {kind: seed, bundle: a, op: run, root: '{shared}', ssh_auth: agent, unset_env: [SSH_AUTH_SOCK], args: ['--', '--version']}, expect: {refusal: RH-SEED-AUTH}}
      - {id: agent-not-socket, act: {kind: seed, bundle: a, op: run, root: '{shared}', ssh_auth: agent, env: {SSH_AUTH_SOCK: '{ctl}/not-a-socket'}, args: ['--', '--version']}, expect: {refusal: RH-SEED-AUTH}}
    note: 'BUILT-UNRUN through the generated launcher (R1 launcher join; ported from m1-1g). seed_launch env.carried: a `run` with the
      agent (carried) mode carries the CALLER''s own SSH_AUTH_SOCK; agent-unset runs the launcher with it removed from the caller
      environment (`<runner_tools.env> -u SSH_AUTH_SOCK`, a declared ambient deviation; the launcher carries "" and the seed
      refuses), agent-not-socket sets it to a regular file. no-mode and apply-with-mode are E83 count: the launcher refuses
      RH-SEED-USAGE by its word count -- supported boundary NO SEED EXECUTION AND NO MANAGED MUTATION, NOT "nothing executed"
      (realpath of $0 runs before every count check, and the per-mode counts run after launch_home: id and the derive.home tool).
      Valid-socket and other-uid socket legs are MAIN (TR02).'

  # ---- codex-tick134 / 001716 M1-STAGING-RECOVERY ----
  - id: S01-package-repeated-failure-bounded
    cases: [E21-package-staging-bounded-repeated-failure, E10-package-interrupted-resume, E30-when-recovery-fires]
    findings: [M1-STAGING-RECOVERY, SEED2-PACKAGE-RESERVATION, R3C-E09-LIVE-STAGING-REAP, LEASE-UNKNOWN-IS-NOT-DEAD]
    requires: [bundle_a, r3e_writer_quiescence, act_scope_mechanism]
    setup:
      - {write: '{ctl}/.bundle.staging.rhcfile', content: "not a staging dir\n", mode: '0600'}
      - {mkdir: '{ctl}/.bundle.staging.rhcforeign', mode: '0700'}
      - {write: '{ctl}/.bundle.staging.rhcforeign/operator-data', content: "keep\n", mode: '0600'}
      - {mkdir: '{ctl}/rhc-sibling', mode: '0700'}
      - {symlink: '{ctl}/.bundle.staging.rhclink', target: '{ctl}/rhc-sibling'}
      - {mkdir: '{ctl}/.bundle.staging.rhcnolease', mode: '0700'}
      - {mkdir: '{ctl}/.bundle.staging.L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1.rhcother', mode: '0700'}
      - {write: '{ctl}/.bundle.lease.L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1', mode: '0400',
         content: '{"schema": "lme-staging-lease/1", "token": "L00000000000000000000000000000000-00000000000000000000000000000000-{uid}-1-1", "machine": "00000000000000000000000000000000", "boot": "00000000000000000000000000000000", "uid": "{uid}", "pid": "1", "start": "1", "pidns": "pid:[1]", "cgroupns": "cgroup:[1]", "cgroup_b64": ""}'}
    steps:
      - {id: foreign-snap, snapshot: {name: foreign, of: '{ctl}', include_regex: ['^\.bundle\.(staging|lease)\.(rhc|L0{32}-)', '^rhc-sibling']}}
      - {id: fail, repeat: {count_token: staging_repeat, steps: [
          {id: p, act: {kind: package, dest: '{ctl}/bundle', async: true}},
          {id: w, wait: {file_regex: {file: '{ctl}/p.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 600},
          {id: k, kill: {step: p}},
          {id: j, join: p, expect: {killed: true}},
          {id: bound, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.L[!0]*', count: '{staging_max}'}}, {glob: {dir: '{ctl}', pattern: '.bundle.lease.L[!0]*', count: '{staging_max}'}},
                              {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}},
                              {file: '{ctl}/p.stdout', contains: PRESERVED-UNKNOWN-STAGING}, {snapshot: foreign, equal: true}]}]}}
      - {id: final, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED, PRESERVED-UNKNOWN-STAGING, REAPED-STAGING]}}
      - {id: same-deployment, state: [{same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}, {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']},
                                      {snapshot: foreign, equal: true}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.L[!0]*', count: 0}},
                                      {glob: {dir: '{ctl}', pattern: '.bundle.lease.L[!0]*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}}]}
    note: 'r3e E21: foreign neighbours = a regular file, a staging-named dir with an off-manifest file, a staging-named symlink, a lease-less
      dir and a dir with ANOTHER machine''s lease record (machine and boot all zeros, this uid; record fields per record_schema
      lme-staging-lease/1 as announced -- G asks the route author to confirm the field types); all preserved byte-identical and reported
      UNKNOWN. Each killed run is launched in its OWN act scope and killed with it, so its run cgroup is EMPTY at the next start (E30) and
      its staging and record are REAPED then: after each kill at most max_reserved_per_run ({staging_max}) owned staging dir and record of
      this machine remain (the one just killed). L[!0]* counts this machine''s entries only. {staging_repeat} = max_reserved_per_run + keep
      + 2. The "killed run whose cgroup is still populated" leg is L04; "while ANOTHER run is live" is K08'

  - id: S02-package-interrupted-cleanup
    cases: [E22-package-interrupted-staging-cleanup]
    findings: [M1-STAGING-RECOVERY, R3C-E09-LIVE-STAGING-REAP]
    requires: [bundle_a, interrupt_mechanism, r3e_writer_quiescence, act_scope_mechanism]
    variants:
      - {id: during-reap-rename, tokens: {hold_syscalls: 'rename,renameat,renameat2', hold_when: enter, hold_path: '{staging}'}}
      - {id: during-reap-remove, tokens: {hold_syscalls: 'openat', hold_when: exit, hold_path: '{reaping}'}}
    steps:
      - {id: leave, act: {kind: package, dest: '{ctl}/bundle', async: true}}
      - {id: reserved, wait: {file_regex: {file: '{ctl}/leave.stdout', regex: 'TASK \[Copy each admitted artifact into the staging dir\]'}}, timeout_s: 600}
      - {id: kill-leave, kill: {step: leave}}
      - {id: join-leave, join: leave, expect: {killed: true}}
      - {id: stale, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.L*', count: 1, bind: staging}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}},
                            {glob: {dir: '{ctl}', pattern: '.bundle.lease.L*', count: 1}}]}
      - {id: snap-stale, snapshot: {name: stale, of: '{staging}'}}
      - {id: reap, act: {kind: package, dest: '{ctl}/bundle', async: true,
                         strace: {inject: {syscalls: '{hold_syscalls}', when: '{hold_when}', hold: 30s}, trace_path: '{hold_path}'}}}
      - {id: held, wait: {file_regex: {file: '{ctl}/reap.strace', regex: 'DELAYED'}}, timeout_s: 600}
      - {id: kill-reap, kill: {step: reap}}
      - {id: join-reap, join: reap, expect: {killed: true}}
      - {id: whole-or-absent, state: [{implies: {if_exists: '{staging}', then_snapshot_equal: stale}}, {path: '{ctl}/bundle', exists: false},
                                      {glob: {dir: '{ctl}', pattern: '.bundle.lease.L*', count: 1}}]}
      - {id: held-before-rename, only_variants: [during-reap-rename],
         state: [{path: '{staging}', exists: true}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 1}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}}]}
      - {id: held-renamed, only_variants: [during-reap-remove],
         state: [{path: '{staging}', exists: false}, {path: '{reaping}', exists: true}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 1}},
                 {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}]}
      - {id: rerun, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED, REAPED-STAGING]}}
      - {id: bounded, state: [{glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}, {glob: {dir: '{ctl}', pattern: '.bundle.reaping.*', count: 0}},
                              {glob: {dir: '{ctl}', pattern: '.bundle.lease.*', count: 0}}, {path: '{ctl}/.bundle.lock', exists: true},
                              {same_bytes: ['{ctl}/bundle/bundle.json', '{bundle_a}/bundle.json']}]}
    note: 'r3e E22: every staging dir is whole (renamed only by ONE mv -T under flock -x -n on the destination lock) or absent; partial removal
      only under the reaping name, which keeps the token; the dead run''s lease record survives until no entry names its token (exactly ONE
      record after the killed reap: the first run''s). The killed reaper leaves no record of its own (it is killed inside its reap, before
      its record task) and no lock state (flock releases with the process; the act scope is killed whole). The rerun removes the leftovers
      under the same quiescence proof, then PUBLISHED. during-reap-remove holds the first openat of {reaping} (the removal under the lock).
      A hold between unlinks (partial rm -rf) needs trace discovery (not implemented -> gap)'

