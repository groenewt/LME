# Declaration variants: the SAME candidate declarations with ONE declared patch under controller.bootstrap.
# Route 1 (seed06_projection met): inventory lme_global_override.remote_harness.controller.bootstrap = patch.
# Route 2 (now): a MAIN-staged read-only repository copy rhc_variants.<id>, admitted only when its profile ==
# candidate profile recursively combined with the patch AND every other package input is byte-identical.
# Neither available -> the control is QUEUED naming `variant:<id>`.
declarations:
  cfg:          {patch: {ansible_config_content: "# LME managed generation config: intentionally empty. ANSIBLE_CONFIG points here so no ambient ansible.cfg is discovered.\n# rhc variant cfg\n"}}
  # C1 path_requires (manifests/global.yml tunable_paths): a path override MUST carry a complete sibling identity in the same
  # override, else C1 refuses it at the engine resolve before any harness task. Every path declaration below therefore
  # carries one (the declared identity of that tool from profile fabb0712 os_tools, unless the row needs a wrong one).
  sort_alt:     {patch: {os_tools: {sort: {path: /bin/sort, identity: {kind: file_sha256, sha256: 4bf4f14424fa481b1f40d28534b0c5c7a7d07affcb82c805b07255cc4c2034be}}}},
                 note: 'root-owned identical file by another path (merged /usr); seed-only tool, so the uv_installer PATH rule does not apply'}
  sha_true:     {patch: {os_tools: {sha256sum: {path: /usr/bin/true, identity: {kind: file_sha256, sha256: 89f8c1d1ba3c76138f3771e1a91e2796ade6180b1c1e4258c04698ff32787c97}}}},
                 note: 'E31/E33 forged-hash-tool: /usr/bin/true at the sha256sum path while declaring sha256sum''s own identity -> the stat digest refuses'}
  sha_forger:   {patch: {os_tools: {sha256sum: {path: /usr/bin/true, identity: {kind: file_sha256, sha256: b381cc8c55ec524b9fa92897f0882e855357468b4a763519cec47e05994d61ff}}}},
                 note: 'E33 declared-forger: the override declares true''s OWN identity, so identity passes; only the seed known answer refuses'}
  sort_wrong_id: {patch: {os_tools: {sort: {path: /bin/sort, identity: {kind: file_sha256, sha256: f7f5511ede2187fbb7646581470c84647d087fb87cb74836c0237b0943d3dbc2}}}},
                  note: 'E33 wrong-identity: a valid alternate path carrying ANOTHER file''s digest (cut''s)'}
  mv_absent:    {patch: {os_tools: {mv: {path: /usr/bin/lme-rhc-absent-mv, identity: {kind: file_sha256, sha256: 7db4661c6397fe5fd5ba6837692aa5adb7dce1efc656369d7b08dfd6ece525a0}}}},
                 note: 'E33 missing-dependency (controller): a declared controller tool absent'}
  sort_owner:   {patch: {os_tools: {sort: {path: '{fixtures}/tools/sort', identity: {kind: file_sha256, sha256: 4bf4f14424fa481b1f40d28534b0c5c7a7d07affcb82c805b07255cc4c2034be}}}}}
  flock_absent: {patch: {os_tools: {flock: {path: /usr/bin/lme-rhc-absent-flock, identity: {kind: file_sha256, sha256: 231d0d5879ff18acd8edcedb791be807cc7507df4dcfd7a17269d54bbeef21e1}}}}}
  cut_bin:      {patch: {os_tools: {cut: {path: /bin/cut, identity: {kind: file_sha256, sha256: f7f5511ede2187fbb7646581470c84647d087fb87cb74836c0237b0943d3dbc2}}}},
                 note: 'uv_installer tool: base PATH /usr/bin:/bin resolves /usr/bin/cut'}
  mv_owner:     {patch: {os_tools: {mv: {path: '{fixtures}/tools/mv', identity: {kind: file_sha256, sha256: 7db4661c6397fe5fd5ba6837692aa5adb7dce1efc656369d7b08dfd6ece525a0}}}}}
  git_absent:   {patch: {os_tools: {git: {path: /usr/bin/lme-rhc-absent-git, identity: {kind: file_sha256, sha256: 356db14e102d68a1a37d8a1ac577dfd678d45d46e92f468bef8b7154e7bfdc60}}}}}
  # copy route only (profile_bytes_differ forces rhc_variants.<id>): C1 refuses both as overrides (not tunable)
  owner_mismatch: {patch: {inventory: {owner: {var: lme_toolchain_other}}}, profile_bytes_differ: true,
                   note: 'owner rule hostile negative: inventory.owner.var != inventory.owner_var; admit_transport.yml task 3 must refuse'}
  forms_three:  {patch: {ssh_auth: {composition: {inventory_forms: {accepted: [{form: absent, test: undefined, proxy_jump: ''}, {form: mode_args, test: equals_mode_args, proxy_jump: ''},
                                                                              {form: proxy_jump, test: match_form_regex, proxy_jump: form_regex_capture_1}]}}}},
                 profile_bytes_differ: true, note: 'E50 rule mutation: the `empty` form dropped (a missing form); the route refuses the changed rule'}
  budget_in:    {patch: {budget: {tasks_max: 256}}}
  budget_over:  {patch: {budget: {memory_max_bytes: '{envelope_memory_plus_1}'}}}
  flock_true:   {patch: {os_tools: {flock: {path: /usr/bin/true, identity: {kind: file_sha256, sha256: b381cc8c55ec524b9fa92897f0882e855357468b4a763519cec47e05994d61ff}}}},
                 note: 'E28: flock -> /usr/bin/true WITH true''s identity (copied from r3e os_tools.true.identity) so the identity admission passes and the flock known answers are reached'}
  retire_zero_machine: {patch: {bundle: {staging_retention: {recovery: {retired_controller_machine_ids: ['00000000000000000000000000000000']}}}}, note: 'E29: MAIN-reviewed retirement of the planted other controller'}
  staging_budget_over: {patch: {bundle: {staging_retention: {budget: {free_bytes_factor_package: 1000000}}}}, note: 'E23 without a small filesystem: the declared factor x bundle bytes exceeds any free space'}
  comment:      {patch: {}, profile_bytes_differ: true, note: 'E17: a profile comment only; parsed policy, seed and artifacts identical, provenance differs'}

