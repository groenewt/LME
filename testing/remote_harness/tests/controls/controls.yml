                           note: 'E73 in-both: python3 in observation_tools AND executed_after_custody'}
  ic_observer_missing:    {patch: {target_bootstrap: {initial_contact: {privileged: {tools: [sh, sha256sum, id, stat, df, sed, python3], observation_tools: [sh, sha256sum, id, stat, df, sed]}}}},
