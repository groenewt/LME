         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['has a malformed line']}}}
      - {id: cf-bad-separator, tokens: {fx_case: cf-bad-separator},
         case_components: {E77-bundle-checksum-grammar: [consumer-copies], E86-admit-checkfile-content: [consumer-copies], E80-checksum-format-contract: [], E82-seed-launcher-membership: []},
         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['has a malformed line']}}}
      - {id: cf-drop-launcher-line, tokens: {fx_case: cf-drop-launcher-line},
         case_components: {E77-bundle-checksum-grammar: [consumer-copies], E86-admit-checkfile-content: [consumer-copies], E80-checksum-format-contract: [], E82-seed-launcher-membership: []},
         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['does not list exactly the declared members']}}}
      - {id: cf-dup-launcher-line, tokens: {fx_case: cf-dup-launcher-line},
         case_components: {E77-bundle-checksum-grammar: [consumer-copies], E86-admit-checkfile-content: [consumer-copies], E80-checksum-format-contract: [], E82-seed-launcher-membership: []},
         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['does not list exactly the declared members']}}}
      - {id: cf-extra-line, tokens: {fx_case: cf-extra-line},
         case_components: {E77-bundle-checksum-grammar: [consumer-copies], E86-admit-checkfile-content: [consumer-copies], E80-checksum-format-contract: [], E82-seed-launcher-membership: []},
         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['does not list exactly the declared members']}}}
      # lifecycle E86 consumer-copies = "as E77 consumer-copies, and E80 negative-unterminated": this leg is part of E86's
      # component (never E77's) and E80's negative-unterminated
      - {id: cf-unterminated-norebind, tokens: {fx_case: cf-unterminated-norebind},
         case_components: {E77-bundle-checksum-grammar: [], E86-admit-checkfile-content: [consumer-copies], E80-checksum-format-contract: [negative-unterminated], E82-seed-launcher-membership: []},
         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "_m.checksum_file_sha256 == _rh_bnd_stat.results[2].stat.checksum"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['is not newline-terminated']}}}
      # producer negative (H1): names every row, credits none (a producer refusal is not a lifecycle leg)
      - {id: bundle-alias-inside-source,
         case_components: {E77-bundle-checksum-grammar: [], E86-admit-checkfile-content: [], E80-checksum-format-contract: [], E82-seed-launcher-membership: []}}
    steps:
      # ---- the 11 bundle_cases: the ONE route producer writes the catalog copy of bundle A into {ctl}/bundle (in process)
      - {id: produce-copy, skip_variants: [bundle-alias-inside-source],
         produce: {task: bundle, src: '{bundle_a}', dest: '{ctl}/bundle', case: '{fx_case}'}, expect: {produced: true}}
      - {id: snap, skip_variants: [bundle-alias-inside-source], snapshot: {name: pre, of: '{ctl}', include_regex: ['^bundle( |/)']}}
      - {id: bundle-tree-pre, skip_variants: [bundle-alias-inside-source], tree: {name: bundle-pre, of: '{ctl}/bundle'}}
      # controller admission (play 1 only: --limit localhost; t1 is the controller's own class, so rh_bundle_dir IS its class dir)
      - {id: admit, skip_variants: [bundle-alias-inside-source],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1}}}
      - {id: bundle-tree-post, skip_variants: [bundle-alias-inside-source], tree: {name: bundle-post, of: '{ctl}/bundle'}}
      - {id: preserved, skip_variants: [bundle-alias-inside-source], state: [{snapshot: pre, equal: true}, {trees: [bundle-pre, bundle-post], equal: true}]}
      # the seed layer, the seed started DIRECTLY on the copy (labelled fault injection, codex 210509; refusal expected)
      - {id: seed-layer-launcher, only_variants: [e82-missing, e82-mode],
         act: {kind: seed, bundle: '{ctl}/bundle', op: apply, root: '{root}', invoke: seed_direct, direct_purpose: launcher_member},
         post_state: [{path: '{root}', exists: false}]}
      - {id: seed-layer-checkfile, only_variants: [cf-unterminated, cf-literal-newline, cf-bad-separator, cf-drop-launcher-line,
                                                  cf-dup-launcher-line, cf-extra-line, cf-unterminated-norebind],
         act: {kind: seed, bundle: '{ctl}/bundle', op: apply, root: '{root}', invoke: seed_direct, direct_purpose: check_file_member},
         post_state: [{path: '{root}', exists: false}]}
      # ---- producer negative bundle-alias-inside-source (catalog producer_negatives; codex 231744 option (a)). STAGING
      # (declared, all under {ctl}; recorded and undone in reverse by fixture_undo.yml): mkdir {ctl}/R; copy_tree bundle A ->
      # {ctl}/R/bundle; symlink {ctl}/A -> {ctl}/R. Every produce expectation is inline.
      - {id: alias-stage-source, only_variants: [bundle-alias-inside-source],
         fixture_ops: [{mkdir: '{ctl}/R'}, {copy_tree: {from: '{bundle_a}', to: '{ctl}/R/bundle'}}]}
      # non-vacuity: the real source R/bundle IS an admitted class bundle before the alias exists
      - {id: alias-source-admitted, only_variants: [bundle-alias-inside-source],
         produce: {task: admit, dir: '{ctl}/R/bundle'}, expect: {produced: true}}
      - {id: r-tree-pre, only_variants: [bundle-alias-inside-source], tree: {name: r-pre, of: '{ctl}/R'}}
      - {id: alias-stage-link, only_variants: [bundle-alias-inside-source],
         fixture_ops: [{symlink: {path: '{ctl}/A', target: '{ctl}/R'}}]}
      # the catalog names the INCLUDE "Admit the source's full ancestry by the ONE resolved rule" (fixture_bundle.yml); the
      # failing task ansible reports is its LEAF in admit_ancestry.yml; src vs dest include told apart by the message path and
      # the single offending component
      - {id: alias-produce, only_variants: [bundle-alias-inside-source],
         produce: {task: bundle, src: '{ctl}/A/bundle', dest: '{ctl}/R/bundle/fixture', case: e82-mode},
         expect: {produce_refused: RH-FIXTURE-UNSUPPORTED,
                  produce_task: 'Refuse linked, non-directory, foreign-owned, other-writable or foreign group-writable components',
                  produce_msg_has: ['{ctl}/A/bundle has a component that is a link'], produce_only_component: '{ctl}/A'}}
      - {id: r-tree-post, only_variants: [bundle-alias-inside-source], tree: {name: r-post, of: '{ctl}/R'}}
      - {id: alias-unchanged, only_variants: [bundle-alias-inside-source],
         state: [{trees: [r-pre, r-post], equal: true}, {path: '{ctl}/R/bundle/fixture', exists: false}, {path: '{ctl}/A', kind: link}]}
      # G-ADMIT-FRESHNESS (codex tick297 003441): alias-source-readmitted is the VALID IDENTICAL RE-ADMISSION of the same dir
      # (rh_bundle already holds R/bundle's identity from alias-source-admitted): produce.yml plants the runner sentinel in
      # rh_bundle first, so produced: true now requires admit_bundle.yml to publish during THIS call. The STALE same-dir
      # admission (the call returns without publishing, the prior same-dir fact left behind) is refused by judge_produce
      # (selftests produce-admit-stale-same-dir / produce-stale-result / produce-no-sentinel); a RUNTIME stale case is NOT
      # BUILT: route's admission always publishes on success, and G adds no producer engine to make it return unpublished.
      - {id: alias-source-readmitted, only_variants: [bundle-alias-inside-source],
         produce: {task: admit, dir: '{ctl}/R/bundle'}, expect: {produced: true}}
      - {id: root-untouched, state: [{path: '{root}', exists: false}]}
    note: 'BUILT-UNRUN, controller-local; no target contact (play 1 only: --limit localhost; trace_network no_network); the fresh
      root is never installed. Expectations are the catalog''s (tests/bundle_fixtures.yml bundle_cases expect.admission /
      expect.seed, pinned 9a6940b8). The copy is produced by the ONE route producer IN PROCESS (produce step; tasks/produce.yml
      includes producer_tasks.bundle with rh_fx_key / rh_fx_policy / rh_fx_lock = the controller class bound by bundle_a_class --
      UNVERIFIED that the runner resolve publishes lme_resolved.remote_harness.scopes: if not, bundle_a_class is unmet and the
      control stays QUEUED, never PASS). The admit refused_at is the task name; the per-variant stdout_has names the admit_bundle.yml
      assertion line that fails first (members :122, launcher mode :126, fresh-render launcher :133-136, checksum_file binding :141,
      check-file bytes :145). The class copy is preserved: metadata by the snapshot (NEVER bytes), BYTES only by the digest-bearing
      trees bundle-pre / bundle-post (codex 234857). Seed "none" cases (e82-malformed, cf-reorder): NO seed step -- NOT ASSERTED
      that the seed admits them (the catalog claims none; a positive seed apply is out of this control). seed-layer-checkfile uses
      direct_purpose check_file_member: PROPOSED under codex 210509, pending codex''s ruling via MAIN -- until ruled, these legs
      are labelled PROPOSED. E77 / E86 consumer-copies is credited only when every one of its legs passed (G-COMPONENT-MULTI-LEG).
      bundle-alias-inside-source: the catalog evidence (R/bundle tree and sha256 before and after equal) is r-pre / r-post (steps
      r-tree-pre / r-tree-post); the fixture destination stays absent; its staging is undone by fixture_undo.yml in reverse
      (unlink {ctl}/A, remove {ctl}/R/bundle, remove {ctl}/R), never following a link.'

  # ==== ROUTE CHECKOUT PRODUCER NEGATIVES (catalog producer_negatives checkout-symlink-ancestor, relocate-registry-parent-
  # symlink; codex 220515 H3, 223517; codex 231744 option (a)): a REAL admitted exact-head Route 3 clone (variant_clone.yml)
  # that a fixture_ops step then stages around, inside this variant's own control dir; the producer is called in process by
  # a `produce` step; every staging action is declared here, admitted before it mutates, recorded and undone in reverse
  # (fixture_undo.yml, never following a link). Catalog ids, not lifecycle rows: cases: [].
  - id: bundle.fixture.checkout-negatives
    cases: []
    findings: [codex-220515-H3-FIXTURE-ANCESTOR-ESCAPE, codex-223517-H3-RELOCATE-REGISTRY-ANCESTOR-ESCAPE]
    requires: [bundle_a, seed06_projection, route_checkout_fixture]
    variant_checkout: clone
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/fixture_checkout.yml, testing/remote_harness/tasks/fixture_checkout_relocate.yml,
                                    testing/remote_harness/tasks/fixture_components.yml, testing/remote_harness/tasks/admit_ancestry.yml,
                                    testing/remote_harness/tests/bundle_fixtures.yml, manifests/global.yml]}
    rows:
      checkout-symlink-ancestor: 'producer negative (H3): the Route 3 clone lives in the dedicated fixture ctl {vctl} = {ctl}/fxctl;
        staging moves {vctl} to {ctl}/fxctl.real and links {vctl} -> {ctl}/fxctl.real, so the clone is reached through a link
        (FC = {ctl}/fxctl.real, the real clone FC/vclone); fixture_checkout.yml with case usage-text is REFUSED
        RH-FIXTURE-UNSUPPORTED at the admit_ancestry leaf inside "Admit the full ancestry through the actual clone by the ONE
        resolved rule", the only offending component {vctl}; evidence: the digest-bearing tree of FC/vclone (including .git/HEAD)
        before and after equal'
      relocate-registry-parent-symlink: 'producer negative (codex 223517): the clone patched with relocate-template-subtree-profile
        (the relocation NOT applied); staging copies the canonical {repo_root}/manifests into the replica MR = {ctl}/manifests-replica,
        moves {vclone}/manifests to {vclone}/manifests.real and links {vclone}/manifests -> MR; fixture_checkout.yml with case
        relocate-template-subtree is REFUSED RH-FIXTURE-UNSUPPORTED at the fixture_components.yml leaf (inside "Admit every declared
        path inside the clone before any read"); evidence: MR and the canonical manifests trees before and after equal (and MR ==
        canonical before), the clone templates tree unchanged, testing/rh-relocated-templates absent'
    refute: 'a fixture_checkout.yml that admitted a clone reached through a link (or checked only the clone''s own path) edits FC''s
      clone -> the produce refusal and fx-pre / fx-post FAIL; a relocation that read or wrote through <clone>/manifests without
      admitting its components writes into MR (the stand-in for the canonical manifests) -> the produce refusal and mr-pre / mr-post
      FAIL, or moves the templates -> tpl-pre / tpl-post and the rh-relocated-templates predicate FAIL'
    hostile: 'a checkout fixture target reached through a linked ancestor; a clone whose manifests directory is a link to another tree'
    variants:
      - {id: checkout-symlink-ancestor, declaration: fixture_clone_plain, fixture_ctl: fxctl}
      - {id: relocate-registry-parent-symlink, declaration: relocate_profile_only}
    steps:
      # ---- checkout-symlink-ancestor. STAGING (declared; under {ctl}): move {vctl} -> {ctl}/fxctl.real; symlink {vctl} -> {ctl}/fxctl.real
      - {id: fx-stage, only_variants: [checkout-symlink-ancestor],
         fixture_ops: [{move: {from: '{vctl}', to: '{ctl}/fxctl.real'}}, {symlink: {path: '{vctl}', target: '{ctl}/fxctl.real'}}]}
      # the full real clone FC/vclone, .git included (costly: every file is stat'ed and digested; the catalog requires it)
      - {id: fx-tree-pre, only_variants: [checkout-symlink-ancestor], tree: {name: fx-pre, of: '{ctl}/fxctl.real/vclone'}}
      # the catalog names the INCLUDE "Admit the full ancestry through the actual clone by the ONE resolved rule"; the failing
      # task ansible reports is its admit_ancestry.yml LEAF
      - {id: fx-produce, only_variants: [checkout-symlink-ancestor],
         produce: {task: checkout, clone: '{vclone}', ctl: '{vctl}', case: usage-text},
         expect: {produce_refused: RH-FIXTURE-UNSUPPORTED,
                  produce_task: 'Refuse linked, non-directory, foreign-owned, other-writable or foreign group-writable components',
                  produce_msg_has: ['{vclone} has a component that is a link'], produce_only_component: '{vctl}'}}
      - {id: fx-tree-post, only_variants: [checkout-symlink-ancestor], tree: {name: fx-post, of: '{ctl}/fxctl.real/vclone'}}
      - {id: fx-unchanged, only_variants: [checkout-symlink-ancestor],
         state: [{trees: [fx-pre, fx-post], equal: true}, {path: '{vctl}', kind: link}]}
      # ---- relocate-registry-parent-symlink. The canonical manifests are only READ (tree + copy source); the link points at
      # the replica MR inside {ctl}, never at the canonical tree
      - {id: canon-tree-pre, only_variants: [relocate-registry-parent-symlink], tree: {name: canon-pre, of: '{repo_root}/manifests'}}
      - {id: mr-stage, only_variants: [relocate-registry-parent-symlink],
         fixture_ops: [{copy_tree: {from: '{repo_root}/manifests', to: '{ctl}/manifests-replica'}},
                       {move: {from: '{vclone}/manifests', to: '{vclone}/manifests.real'}},
                       {symlink: {path: '{vclone}/manifests', target: '{ctl}/manifests-replica'}}]}
      - {id: mr-tree-pre, only_variants: [relocate-registry-parent-symlink], tree: {name: mr-pre, of: '{ctl}/manifests-replica'}}
      - {id: tpl-tree-pre, only_variants: [relocate-registry-parent-symlink], tree: {name: tpl-pre, of: '{vclone}/testing/remote_harness/templates'}}
      - {id: mr-is-canonical, only_variants: [relocate-registry-parent-symlink], state: [{trees: [mr-pre, canon-pre], equal: true}]}
      - {id: mr-produce, only_variants: [relocate-registry-parent-symlink],
         produce: {task: checkout, clone: '{vclone}', ctl: '{vctl}', case: relocate-template-subtree},
         expect: {produce_refused: RH-FIXTURE-UNSUPPORTED,
                  produce_task: 'Refuse a linked or non-directory component, or a leaf that is not in the declared state',
                  produce_msg_has: ['REFUSED RH-FIXTURE-UNSUPPORTED: {vclone}/manifests/', 'is not reached through real directories of the clone only']}}
      - {id: mr-tree-post, only_variants: [relocate-registry-parent-symlink], tree: {name: mr-post, of: '{ctl}/manifests-replica'}}
      - {id: canon-tree-post, only_variants: [relocate-registry-parent-symlink], tree: {name: canon-post, of: '{repo_root}/manifests'}}
      - {id: tpl-tree-post, only_variants: [relocate-registry-parent-symlink], tree: {name: tpl-post, of: '{vclone}/testing/remote_harness/templates'}}
      - {id: mr-unchanged, only_variants: [relocate-registry-parent-symlink],
         state: [{trees: [mr-pre, mr-post], equal: true}, {trees: [canon-pre, canon-post], equal: true}, {trees: [tpl-pre, tpl-post], equal: true},
                 {path: '{vclone}/testing/rh-relocated-templates', exists: false}, {path: '{vclone}/manifests', kind: link}]}
    note: 'BUILT-UNRUN, controller-local (no root, no target, no package). Both variants leave declared_only (codex 231744 option
      (a)): checkout-symlink-ancestor''s FC and link live in the dedicated fixture ctl {ctl}/fxctl (variant key fixture_ctl), never
      under <rh_repo_root>/<root_rel> outside the run dir; relocate-registry-parent-symlink links to the MR replica
      {run}/controls/bundle.fixture.checkout-negatives/relocate-registry-parent-symlink/manifests-replica, never to the canonical
      manifests (rh_repo_root is only read). Every staging action is declared above, admitted before it mutates, recorded, and
      undone in reverse (fixture_undo.yml: unlink, move back, remove the replica), never following a link; {vctl} is then removed
      by variant.yml. A negative passes only on the intended leaf task and message AND the unchanged-target trees. The catalog
      names the INCLUDE task as the refusal point (fixture_checkout.yml "Admit the full ancestry through the actual clone by the
      ONE resolved rule" / fixture_checkout_relocate.yml "Admit every declared path inside the clone before any read"); G asserts
      the LEAF task ansible reports as failed (admit_ancestry.yml / fixture_components.yml) plus the message path. The fx trees
      digest the whole clone including .git (cost stated). BYTES only by the trees (codex 234857); no metadata snapshot here.'

  # ---- G-STAGING-ANCESTRY / G-STAGING-PARTIAL (codex tick297 003441; BUILT-UNRUN, controller-local, G-owned; ported from m1-1g) ----
  # The runner's OWN staging confinement (tasks/fixture_ops.yml + fixture_undo.yml), on G stand-ins; no route producer.
  # nested-link-escape: a staged copy imports a preserved link {ctl}/copied/link -> an OUTSIDE tree; the next action
  # mkdir {ctl}/copied/link/deep/new is lexically under {ctl}/ and its parent stats as a real directory THROUGH the link --
  # it must be REFUSED at the ancestry leaf before any mutation, the outside tree unchanged (trees before / after), the
  # intentional staged link still present, and after the undo the outside tree (removed by the variant's own undo op) and
  # the staged copy (reversed by identity) absent. m1-1's tree record is the older tree_lines form (relpath, type, mode,
  # sha256 of every regular file): the outside tree is compared for bytes, structure and mode only -- uid / gid, root
  # inode / dev and link target text are NOT recorded on this lineage (m1-1g's tree_record is not ported here).
  # The outside tree is the token {outside} (codex tick330 item 3): <ctl>.outside, derived from {ctl} by controls.j2
  # outside_of in tasks/variant.yml -- no control or variant name is spelled anywhere in this declaration, so a renamed
  # control / variant or a relocated run dir moves it with {ctl} (selftests outside-of-*: relocation, rename, not under
  # {ctl}/, inadmissible ctl). It is outside {ctl} and inside the run dir, created by the variant's ops and removed by its undo.
  # partial-copy-replica: a copy_tree into {ctl}/manifests-replica (the same staging name the relocate negative uses) that
  # FAILS part-way (a source member at mode 0000): the failure is the declared outcome at the exact copy_tree task, the
  # partial replica is TRACKED (state failed + the identity observed right after the failure; tree mr-partial records what
  # was created: the readable member, byte-identical, and not the unreadable one), and undo removes it only when EVERY
  # binding of G-UNDO-PARTIAL-BINDING (codex tick330 item 4; controls.j2 fixture_undo_decide) holds: failed_in action (the
  # cp itself failed), the intent (admitted absent, declared from / to), the pre-state parent {ctl} recorded (dev, inode,
  # uid) and owner-private ({ctl} is created 0700), that parent unchanged and still owner-private at undo, the partial
  # replica still the real directory with the post-failure dev / inode and owned by that uid (after_undo: absent). The
  # post-failure identity alone is evidence only; a failed mkdir / symlink / move that left something, a post-check
  # failure or any unmet binding is refused and left in place (selftests undo-partial-copy-*, undo-failed-*-left-*).
  # The canonical {repo_root}/manifests source of the relocate negative cannot be
  # made to fail (read-only); a failure of THAT copy inside bundle.fixture.checkout-negatives is NOT BUILT.
  # Undo identity (G-UNDO-IDENTITY): directory replacement and link re-target before the undo are cleanup FINDINGS by
  # construction (a finding FAILs its variant), so they are judged by the ONE decision macro fixture_undo_decide in the
  # selftests (undo-dir-replaced, undo-link-retargeted, ...); runtime replacement / re-target variants are NOT BUILT.
  - id: runner.fixture-staging.confinement
    cases: []
    findings: [G-STAGING-ANCESTRY, G-STAGING-PARTIAL, G-UNDO-IDENTITY, G-STAGING-PER-ITEM-GUARD, G-FIXTURE-ITEM-STOP-CONTROL,
               G-UNDO-PARTIAL-BINDING]
    purpose: 'a staging action never writes through a linked intermediate, a failed staging action''s partial output is tracked and reversed only by its recorded identity'
    refute: 'a runner that admits a staging write by its lexical {ctl}/ prefix and leaf / parent stats creates
      {outside}/deep/new through the imported link -> judge_staging reports "declared refused but completed", the
      outside trees differ and deep/new exists; a runner that records only completed actions leaves the partial replica
      untracked -> after_undo finds {ctl}/manifests-replica'
    hostile: 'a preserved link inside a staged copy pointing outside {ctl}; a copy_tree whose source has an unreadable member'
    variants:
      - id: nested-link-escape
        ops:
          - {mkdir: '{outside}', mode: '0700'}
          - {mkdir: '{outside}/deep', mode: '0700'}
          - {write: '{outside}/deep/keep', mode: '0600',
             content: "outside the control dir: must stay byte-identical\n"}
          - {mkdir: '{ctl}/src', mode: '0700'}
          - {symlink: '{ctl}/src/link', target: '{outside}'}
        undo:
          - {remove: '{outside}'}
          - {remove: '{ctl}/src'}
        after_undo:
          - {path: '{outside}', exists: false}
          - {path: '{ctl}/copied', exists: false}
      - id: partial-copy-replica
        ops:
          - {mkdir: '{ctl}/mr-src', mode: '0700'}
          - {write: '{ctl}/mr-src/readable', mode: '0600', content: "copied before the failure\n"}
          - {write: '{ctl}/mr-src/unreadable', mode: '0600', content: "never copied\n"}
          - {chmod: '{ctl}/mr-src/unreadable', mode: '0000'}
        undo:
          - {remove: '{ctl}/mr-src'}
        after_undo:
          - {path: '{ctl}/manifests-replica', exists: false}
    steps:
      - {id: outside-tree-pre, only_variants: [nested-link-escape],
         tree: {name: outside-pre, of: '{outside}'}}
      - {id: escape-stage, only_variants: [nested-link-escape],
         fixture_ops: [{copy_tree: {from: '{ctl}/src', to: '{ctl}/copied'}}, {mkdir: '{ctl}/copied/link/deep/new'},
                       {mkdir: '{ctl}/after-refusal-marker'}],
         expect: {staging_refused: RHC-FIXTURE-STAGING, staging_index: 1, staging_skipped: [2],
                  staging_task: 'Refuse linked, non-directory, foreign-owned, other-writable or foreign group-writable components',
                  staging_msg_has: ['{ctl}/copied/link/deep/new has a component that is a link',
                                    "['{ctl}/copied/link', '{ctl}/copied/link', '{ctl}/copied/link'] (path_admission.ancestry)"]}}
      - {id: outside-tree-post, only_variants: [nested-link-escape],
         tree: {name: outside-post, of: '{outside}'}}
      - {id: outside-unchanged, only_variants: [nested-link-escape],
         state: [{trees: [outside-pre, outside-post], equal: true},
                 {path: '{outside}/deep/new', exists: false},
                 {path: '{ctl}/copied/link', kind: link},
                 {path: '{ctl}/after-refusal-marker', exists: false}]}
      - {id: partial-stage, only_variants: [partial-copy-replica],
         fixture_ops: [{copy_tree: {from: '{ctl}/mr-src', to: '{ctl}/manifests-replica'}}, {mkdir: '{ctl}/after-failure-marker'}],
         expect: {staging_failed: true, staging_index: 0, staging_skipped: [1],
                  staging_task: 'copy_tree (cp -a --no-dereference -T into the absent destination; the source is only read)',
                  staging_msg_has: ['non-zero return code', '{ctl}/mr-src/unreadable']}}
      - {id: partial-tree, only_variants: [partial-copy-replica], tree: {name: mr-partial, of: '{ctl}/manifests-replica'}}
      - {id: partial-left, only_variants: [partial-copy-replica],
         state: [{path: '{ctl}/manifests-replica', kind: dir},
                 {same_bytes: ['{ctl}/manifests-replica/readable', '{ctl}/mr-src/readable']},
                 {path: '{ctl}/manifests-replica/unreadable', exists: false},
                 {path: '{ctl}/after-failure-marker', exists: false}]}
    note: 'BUILT-UNRUN, controller-local (no root, no target, no producer). G-FIXTURE-ITEM-STOP-CONTROL (codex tick330): each
      staging list carries a LATER marker action after its declared outcome (escape-stage [2] {ctl}/after-refusal-marker after
      the refusal; partial-stage [1] {ctl}/after-failure-marker after the failure), whose parent {ctl} is admissible, so it
      would be created if the per-item stop did not hold. The step passes only when the marker is ABSENT (state
      outside-unchanged / partial-left) AND the per-item staging_skipped record for that index is present (expect
      staging_skipped, judged by judge_staging_skipped at the list''s last action). This is the fixture_ops per-item stop
      only; op.yml''s ordinary-op per-item guard is the separate control runner.op.per-item-guard. The ancestry message strings are route''s
      admit_ancestry.yml fail_msg (b3ad800c): the link component appears three times (a link lstats as link, not a directory
      and other-writable, mode 0777; it is owned by the running uid, so neither uid clause adds it), and no other component
      offends. The cp message is matched only by the task''s "non-zero return code" and the source path (cp''s quote
      characters vary by locale). The escape proof''s outside tree is the derived token {outside} (see the comment above); on m1-1
      the trees compare bytes, structure and mode only (tree_lines). The partial replica''s removal
      (G-UNDO-PARTIAL-BINDING, codex tick330 item 4) is bound to the recorded pre-state (the destination parent {ctl}: dev,
      inode, uid, owner-private), the intent, the exclusive destination (absent under that owner-private parent), the
      outcome (failed_in action: the cp itself, not the post-state check) and the current identity / ancestry (the replica
      still the real directory with the post-failure dev / inode, owned by that uid; {ctl} unchanged and still
      owner-private) -- the post-failure identity alone is evidence only, and anything else is left in place as a cleanup
      finding. "Exclusive" is owner-private: a process of the same uid is not excluded (residual). Only the bound positive
      path has a runtime variant here; each refusal is proven by the fixture_undo_decide selftests only, and runtime
      parent-replacement / re-owned-output / failed-post-check variants are OPEN (item 5), never PASS.'

  # ---- G-UNDO-PROTECTION-PROPAGATION (codex tick330 preservation findings; BUILT-UNRUN, controller-local, G-owned) ----
  # A recorded staged CHILD replaced before the undo, under a recorded staged PARENT whose own identity still holds, run
  # through the WHOLE undo and cleanup sequence: the staging reversal (reverse order: sibling, child, parent), the declared
  # undo ops, the finding routing, finish_variant's scratch pass (the parent is named `src`, a variant_scratch name) and the
  # fixture control dir step; then after_cleanup reads the replacement back. The replacement is built while the recorded
  # child's inode is still ALIVE (stash moves it into {ctl}/stash), so it can never reuse the recorded dev / inode.
  - id: runner.fixture-undo.protected-child
    cases: []
    findings: [G-UNDO-PROTECTION-PROPAGATION, G-UNDO-IDENTITY]
    purpose: 'a refused undo protects what it left in place: no later ancestor undo, declared undo op, scratch removal or
      mode change reaches it, and it reads back byte-identical after the whole cleanup, while every unprotected staged or
      scratch entry is still removed'
    refute: 'the pre-fix runner records the child mismatch, continues the reversed loop and gives the unchanged recorded
      parent {ctl}/src a chmod -R + recursive remove-dir that deletes the refused replacement (or the declared undo remove,
      or the scratch pass on `src`, deletes it) -> after_cleanup same_bytes / kind dir FAIL; a runner that simply retains
      everything after any finding leaves {ctl}/sib, {ctl}/unrelated or {ctl}/bundle -> their exists: false FAIL'
    hostile: 'a staged child directory replaced (new inode, a marker file inside) before the undo, under a staged parent that
      still has its recorded identity and is a variant_scratch name; a declared undo op removing that parent'
    variants:
      - id: nested-child-replaced
        ops:
          - {write: '{ctl}/replacement-ref', mode: '0600', content: "the replacement a refused undo must preserve\n"}
          - {mkdir: '{ctl}/unrelated', mode: '0700'}
          - {mkdir: '{ctl}/bundle', mode: '0700'}
          - {write: '{ctl}/bundle/unprotected', mode: '0600', content: "an unprotected scratch entry: removed by the cleanup\n"}
        undo:
          - {remove: '{ctl}/src'}
          - {remove: '{ctl}/unrelated'}
        expect_undo_findings:
          - {path: '{ctl}/src/child', why: 'is not the recorded directory \(replaced'}
          - {path: '{ctl}/src', why: ': remove-dir refused: the protected'}
          - {path: '{ctl}/src', why: '^declared undo remove refused: the protected'}
        after_cleanup:
          - {path: '{ctl}/src', kind: dir}
          - {path: '{ctl}/src/child', kind: dir}
          - {same_bytes: ['{ctl}/src/child/replacement', '{ctl}/replacement-ref']}
          - {path: '{ctl}/sib', exists: false}
          - {path: '{ctl}/unrelated', exists: false}
          - {path: '{ctl}/bundle', exists: false}
          - {path: '{ctl}/stash', exists: false}
    steps:
      - {id: stage, fixture_ops: [{mkdir: '{ctl}/src'}, {mkdir: '{ctl}/src/child'}, {mkdir: '{ctl}/sib'}]}
      - {id: staged, state: [{path: '{ctl}/src/child', kind: dir}, {path: '{ctl}/sib', kind: dir}]}
      - {id: replace-child, ops: [{stash: '{ctl}/src/child'}, {mkdir: '{ctl}/src/child', mode: '0700'},
                                  {write: '{ctl}/src/child/replacement', mode: '0600', content: "the replacement a refused undo must preserve\n"}]}
      - {id: replaced, state: [{same_bytes: ['{ctl}/src/child/replacement', '{ctl}/replacement-ref']}]}
    note: 'BUILT-UNRUN, controller-local (no root, no target, no producer, no clone). Expected sequence (declared, not
      observed): reversal of sib -> remove-dir (its identity holds; /sib never overlaps /src/...); child -> finding (replaced:
      the stashed original keeps the recorded inode alive), {ctl}/src/child protected; src -> remove-dir REFUSED (the
      protected child lies below it), {ctl}/src protected; declared undo remove {ctl}/src -> REFUSED (never run), remove
      {ctl}/unrelated -> runs; the three findings are exactly the declared expect_undo_findings (routed as preserved
      evidence, never a cleanup finding); the scratch pass keeps src (overlap) and removes bundle and stash; after_cleanup
      holds. The result record lists preserved [{ctl}/src/child, {ctl}/src]. NOT BUILT here (code built, runtime unexercised):
      the fixture control dir leg ({vctl} kept when it overlaps a protected path; needs a variant_checkout clone control), the
      fresh-root leg (a protected path at / under {root} or {parent}: no purge, no fallback removal) and the clone-root leg (a
      protected path at / under {vroot}: no purge, then RETAINED and FAILED by G-VARIANT-PURGE-READBACK); a failed-undo
      (rescue) protection has no runtime case either (the rescue path protects the record''s paths and always FAILs).'

  # ---- G-UNDO-STASH-PATH-UNBOUND (codex tick334 preservation verdict; BUILT-UNRUN, controller-local, G-owned) ----
  # codex's declared counterexample, exactly: fixture staging moves the runner's {ctl}/stash to {ctl}/old-stash and creates
  # a new {ctl}/stash; ordinary ops move THAT recorded dir to {ctl}/saved-stash, recreate {ctl}/stash, create {ctl}/src
  # with a marker and stash src (into the DERIVED {ctl}/stash/<sha1>). The reverse fixture undo finds the recorded stash
  # replaced and protects {ctl}/stash (and the refused move-back protects {ctl}/old-stash). The declared undo `unstash src`
  # now names its derived source (controls.j2 op_writes) and is REFUSED as touching the protected {ctl}/stash; the scratch
  # pass keeps stash; the displaced evidence reads back after the whole cleanup.
  - id: runner.fixture-undo.stash-path-bound
    cases: []
    findings: [G-UNDO-STASH-PATH-UNBOUND, G-UNDO-PROTECTION-PROPAGATION]
    purpose: 'a declared stash / unstash undo is judged on its FULL mutation set, derived stash entry included, so it never
      moves displaced evidence out of a protected directory into an unprotected name the cleanup then removes'
    refute: 'the pre-fix runner admits `unstash {ctl}/src` by {ctl}/src alone: it moves {ctl}/stash/<sha1> out to {ctl}/src,
      the scratch pass removes the unprotected src (a variant_scratch name) -> after_cleanup {stashed} kind dir and the
      marker same_bytes FAIL; a runner that retains everything leaves saved-stash, unrelated or bundle -> exists: false FAIL'
    hostile: 'fixture staging and ordinary ops displacing and recreating the runner''s own stash directory; a declared unstash
      whose real source lies inside it'
    variants:
      - id: stash-replaced-then-unstash
        ops:
          - {write: '{ctl}/marker-ref', mode: '0600', content: "displaced evidence a refused unstash must preserve\n"}
          - {mkdir: '{ctl}/unrelated', mode: '0700'}
          - {mkdir: '{ctl}/bundle', mode: '0700'}
          - {write: '{ctl}/bundle/unprotected', mode: '0600', content: "an unprotected scratch entry: removed by the cleanup\n"}
        undo:
          - {unstash: '{ctl}/src'}
          - {remove: '{ctl}/saved-stash'}
          - {remove: '{ctl}/unrelated'}
        expect_undo_findings:
          - {path: '{ctl}/stash', why: 'is not the recorded directory \(replaced'}
          - {path: '{ctl}/old-stash', why: 'the source name is occupied'}
          - {path: '{ctl}/src', why: '^declared undo unstash refused: the protected'}
        after_cleanup:
          - {path: '{ctl}/stash', kind: dir}
          - {path: '{stashed}', kind: dir}
          - {path: '{stashed}/marker', kind: regular}
          - {same_bytes: ['{stashed}/marker', '{ctl}/marker-ref']}
          - {glob: {dir: '{ctl}/stash', pattern: '*', count: 1}}
          - {path: '{ctl}/src', exists: false}
          - {path: '{ctl}/old-stash', kind: dir}
          - {path: '{ctl}/saved-stash', exists: false}
          - {path: '{ctl}/unrelated', exists: false}
          - {path: '{ctl}/bundle', exists: false}
    steps:
      - {id: stage, fixture_ops: [{move: {from: '{ctl}/stash', to: '{ctl}/old-stash'}}, {mkdir: '{ctl}/stash'}]}
      - {id: staged, state: [{path: '{ctl}/old-stash', kind: dir}, {path: '{ctl}/stash', kind: dir}]}
      - {id: displace, ops: [{move: {from: '{ctl}/stash', to: '{ctl}/saved-stash'}}, {mkdir: '{ctl}/stash', mode: '0700'},
                             {mkdir: '{ctl}/src', mode: '0700'},
                             {write: '{ctl}/src/marker', mode: '0600', content: "displaced evidence a refused unstash must preserve\n"},
                             {stash: '{ctl}/src'}]}
      - {id: stashed, state: [{glob: {dir: '{ctl}/stash', pattern: '*', count: 1, bind: stashed}}, {path: '{ctl}/src', exists: false}]}
      - {id: stashed-bytes, state: [{same_bytes: ['{stashed}/marker', '{ctl}/marker-ref']}]}
    note: 'BUILT-UNRUN, controller-local (no root, no target, no producer, no clone). Expected sequence (declared, not
      observed): staging reversal in reverse -- mkdir {ctl}/stash: the name holds the ordinary op''s new directory, not the
      recorded inode (which lives at saved-stash) -> finding, {ctl}/stash protected; move old-stash -> stash: the source name
      is occupied -> finding, old-stash and stash protected; declared undo unstash {ctl}/src: op_writes = [{ctl}/src,
      {ctl}/stash/<sha1>], the second lies below the protected {ctl}/stash -> REFUSED (never run), src and the stash entry
      protected; remove saved-stash and remove unrelated run (no overlap). The three findings are exactly the declared
      expect_undo_findings. The scratch pass keeps stash (protected) and removes bundle; src never reappears. {stashed} is the
      glob-bound entry name (bound by the `stashed` state step), so no digest is written into the declaration.
      fixture_ops.yml needed no change: its admitted write set is already the full set (mkdir path; copy_tree to; move from
      and to; symlink path + target), no staging action derives a name.'

  # ---- G-OP-PER-ITEM-GUARD (codex tick330 item 2; BUILT-UNRUN, controller-local, G-owned) ----
  # op.yml's ORDINARY-op per-item stop, distinct from fixture_ops.yml's staging stop (runner.fixture-staging.confinement):
  # a step's ops list whose FIRST op fails after admission (a move of an absent source) and whose SECOND op is an admissible
  # mutation (mkdir of a marker directly under {ctl}). The failure is the step's declared op outcome; the marker must be
  # absent, op 1 must carry its op_skipped record, and the variant's undo (outside the guard) must still run.
  - id: runner.op.per-item-guard
    cases: []
    findings: [G-OP-PER-ITEM-GUARD]
    purpose: 'once an op of a step''s ops list fails, no later op of that list runs, each op not run is recorded as
      op_skipped, the failure counts only where declared, and undo / cleanup still run'
    refute: 'the pre-fix runner (only the looped include''s `when`, evaluated for every op before any runs) runs op 1 after
      op 0 failed -> {ctl}/after-op-failure-marker exists (state ops-stopped FAILS) and op 1 has no op_skipped record
      (judge_op_skipped: "declared skipped ... has no op_skipped record (it ran)"); a runner that also guards undo leaves
      {ctl}/undo-target -> after_undo exists: false FAILS; a runner that counts any failure as the declared one is caught by
      the op_msg_has strings and the refused phase (a declaration-error refusal never meets op_failed)'
    hostile: 'a failing first op followed by an admissible mutation in the same ops list; an undo op after the stop'
    variants:
      - id: failing-first-mutation-second
        ops:
          - {mkdir: '{ctl}/undo-target', mode: '0700'}
        undo:
          - {remove: '{ctl}/undo-target'}
        after_undo:
          - {path: '{ctl}/undo-target', exists: false}
          - {path: '{ctl}/after-op-failure-marker', exists: false}
          - {path: '{ctl}/moved', exists: false}
      - id: completed-first-failing-second
        ops:
          - {mkdir: '{ctl}/undo-target', mode: '0700'}
        undo:
          - {remove: '{ctl}/undo-target'}
          - {remove: '{ctl}/before-op-failure'}
        after_undo:
          - {path: '{ctl}/undo-target', exists: false}
          - {path: '{ctl}/before-op-failure', exists: false}
          - {path: '{ctl}/after-op-failure-marker', exists: false}
          - {path: '{ctl}/moved', exists: false}
    steps:
      - {id: pre, state: [{path: '{ctl}/absent-source', exists: false}, {path: '{ctl}/undo-target', kind: dir},
                          {path: '{ctl}/after-op-failure-marker', exists: false}]}
      - {id: fail-then-mark, only_variants: [failing-first-mutation-second],
         ops: [{move: {from: '{ctl}/absent-source', to: '{ctl}/moved'}}, {mkdir: '{ctl}/after-op-failure-marker', mode: '0700'}],
         expect: {op_failed: true, op_index: 0, op_skipped: [1], op_msg_has: ['non-zero return code', '{ctl}/absent-source']}}
      - {id: done-fail-then-mark, only_variants: [completed-first-failing-second],
         ops: [{mkdir: '{ctl}/before-op-failure', mode: '0700'}, {move: {from: '{ctl}/absent-source', to: '{ctl}/moved'}},
               {mkdir: '{ctl}/after-op-failure-marker', mode: '0700'}],
         expect: {op_failed: true, op_index: 1, op_skipped: [2], op_msg_has: ['non-zero return code', '{ctl}/absent-source']}}
      - {id: ops-stopped,
         state: [{path: '{ctl}/after-op-failure-marker', exists: false}, {path: '{ctl}/moved', exists: false},
                 {path: '{ctl}/undo-target', kind: dir}]}
      - {id: earlier-op-ran, only_variants: [completed-first-failing-second], state: [{path: '{ctl}/before-op-failure', kind: dir}]}
    note: 'BUILT-UNRUN, controller-local (no root, no target, no producer, no clone). Expected sequence (declared, not
      observed): pre holds; fail-then-mark op 0 (move) passes the confinement refusal (admitted), mv exits non-zero ->
      op.yml rescue -> judge_op_outcome at index 0 = declared (the message is the command task''s "non-zero return code" plus
      mv''s stderr naming the source; mv''s quote characters vary by locale, so only the path is matched), _rhc_op_stop set,
      _rhc_fail stays empty; op 1 reads the stop live and is NOT run (its op_skipped record logged); at the last index
      judge_op_skipped compares [1] with the records; ops-stopped then runs (the declared outcome is not a failure) and reads
      the marker and the move destination absent; the variant undo removes {ctl}/undo-target (undo is never behind the
      guard). completed-first-failing-second is the same with a completed op 0 before the failing op 1 (op_index 1,
      op_skipped [2]; earlier-op-ran reads op 0''s directory). An UNDECLARED op failure in any ops list still FAILS the
      variant and stops the list and every later step. NOT BUILT here: an undeclared-failure negative control (its expected
      result is a FAIL, which this runner has no expected-FAIL form for); the discriminating judge and static legs are the
      selftests of judge_op_outcome / judge_op_skipped / unimplemented.'

  # ---- runner.seed.uv-added-files (codex-d649-runtime-refusal-repair-20260924-235616; BUILT-UNRUN, controller-local, G-owned) ----
  # The seed's python-verify admission of the declared python.uv_added_files (route's controller_seed.j2 install_python):
  # each addition absent from the independent unpack, under a real parent chain, a regular non-symlink owned file with the
  # exact declared sha256 -- and only then its exact full-path "Only in" diff line; every other difference and a diff
  # error (exit > 1) refuse RH-SEED-IDENTITY-MISMATCH. MANIFEST-DRIVEN: every path is a token read from the bound profile
  # (prepare.yml py_rel / pbs_rel / pbs_hold_rel / uv_added_* / uv_patched_first_rel); no rel, digest or name is a literal.
  # HOLD POINT: the apply is traced with a delay on openat EXIT restricted to the independent unpack's interpreter member
  # {gen}/{pbs_hold_rel}; its first O_RDONLY open is the ELF cmp, AFTER the unpack and uv's install and BEFORE the
  # per-addition checks and the diff (tar's O_WRONLY creation of the same name never matches the wait regex). The run is
  # frozen there (act scope freezer), mutated, thawed and joined. Fail-closed: a freeze that landed after the checks makes
  # the mutation late -- a missing / changed / relinked addition is then not refused, or refused with another message, and
  # the exact stderr_has FAILS the variant; a late mutation never produces the declared message.
  - id: runner.seed.uv-added-files
    cases: []
    findings: [G-UV-ADDED-FILES, SEED-04]
    requires: [bundle_a, interrupt_mechanism, act_scope_mechanism]
    root: fresh
    purpose: 'the seed admits exactly the declared uv-added files (absent from the unpack, real parents, regular owned file,
      exact digest) and accepts only their exact Only-in diff lines; every other shape, content, location or diff failure refuses'
    refute: 'a seed that excludes the added names by basename, normalizes or deletes them, accepts any Only-in line, or
      treats diff exit 2 as a difference -> the changed / symlink / elsewhere / diff-failure variants join rc 0 INSTALLED and FAIL'
    hostile: 'the declared addition changed, extended, removed, replaced by a same-bytes symlink, a directory or a FIFO; its
      name planted in the unpack; its nested parent swapped for a link; the same basename in another directory; an unrelated
      new file; an unreadable unpack member that makes diff exit 2'
    variants:
      - {id: pinned-held, expect: {join: {rc: 0, outcome: INSTALLED, gen: expected_a}}}
      - {id: pinned-plain}
      - {id: changed-content, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file digest differs from the declaration', '{uv_added_rel}']}}}
      - {id: extra-bytes, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file digest differs from the declaration', '{uv_added_rel}']}}}
      - {id: missing, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file is not a regular, non-symlink, owned file', '{uv_added_rel}']}}}
      - {id: same-bytes-symlink, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file is not a regular, non-symlink, owned file', '{uv_added_rel}']}}}
      - {id: directory, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file is not a regular, non-symlink, owned file', '{uv_added_rel}']}}}
      - {id: fifo, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file is not a regular, non-symlink, owned file', '{uv_added_rel}']}}}
      - {id: present-in-archive, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file is present in the admitted archive: {uv_added_rel}']}}}
      - {id: nested-parent-link, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['declared uv-added file parent is not a real directory', '{uv_added_nested_parent_rel}']}}}
      - {id: same-basename-elsewhere, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['differs from the admitted archive beyond the declared uv-patched and uv-added files', '/{py_rel}/{uv_added_elsewhere_dir}: {uv_added_elsewhere_name}']}}}
      - {id: unrelated-new-file, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['differs from the admitted archive beyond the declared uv-patched and uv-added files', '/{py_rel}: rhc-unrelated']}}}
      - {id: diff-failure, expect: {join: {refusal: RH-SEED-IDENTITY-MISMATCH, stderr_has: ['installed-tree diff against the admitted archive failed (exit 2)']}}}
    steps:
      - {id: apply, skip_variants: [pinned-plain],
         act: {kind: seed, bundle: a, op: apply, root: '{root}', async: true,
               strace: {inject: {syscalls: [openat], when: exit, hold: 60s}, trace_path: '{gen}/{pbs_hold_rel}'}}}
      - {id: held, skip_variants: [pinned-plain], wait: {file_regex: {file: '{ctl}/apply.strace', regex: 'O_RDONLY.*DELAYED'}}, timeout_s: 1800}
      - {id: frz, skip_variants: [pinned-plain], freeze: {step: apply}}
      - {id: in-python-verify, skip_variants: [pinned-plain],
         state: [{file: '{ctl}/apply.stderr', contains: 'lme-controller-seed: python-verify'}, {file: '{ctl}/apply.stderr', lacks: 'lme-controller-seed: venv'},
                 {file: '{ctl}/apply.stderr', lacks: REFUSED}, {path: '{gen}/{py_rel}/{uv_added_rel}', kind: regular}]}
      - {id: m-changed, only_variants: [changed-content],
         ops: [{remove: '{gen}/{py_rel}/{uv_added_rel}'}, {write: '{gen}/{py_rel}/{uv_added_rel}', content: "rhc changed content\n", mode: '0644'}]}
      - {id: m-extra, only_variants: [extra-bytes], ops: [{append: {file: '{gen}/{py_rel}/{uv_added_rel}', text: "\n"}}]}
      - {id: m-missing, only_variants: [missing], ops: [{remove: '{gen}/{py_rel}/{uv_added_rel}'}]}
      - {id: m-symlink, only_variants: [same-bytes-symlink],
         ops: [{copy: {from: '{gen}/{py_rel}/{uv_added_rel}', to: '{ctl}/same-bytes', mode: '0600'}}, {remove: '{gen}/{py_rel}/{uv_added_rel}'},
               {symlink: '{gen}/{py_rel}/{uv_added_rel}', target: '{ctl}/same-bytes'}]}
      - {id: m-directory, only_variants: [directory], ops: [{remove: '{gen}/{py_rel}/{uv_added_rel}'}, {mkdir: '{gen}/{py_rel}/{uv_added_rel}', mode: '0700'}]}
      - {id: m-fifo, only_variants: [fifo], ops: [{remove: '{gen}/{py_rel}/{uv_added_rel}'}, {mkfifo: '{gen}/{py_rel}/{uv_added_rel}'}]}
      - {id: m-in-archive, only_variants: [present-in-archive], ops: [{write: '{gen}/{pbs_rel}/{uv_added_rel}', content: "rhc planted in the unpack\n", mode: '0644'}]}
      - {id: m-parent-link, only_variants: [nested-parent-link],
         ops: [{move: {from: '{gen}/{py_rel}/{uv_added_nested_parent_rel}', to: '{gen}/{py_rel}/{uv_added_nested_parent_rel}.rhc-real'}},
               {symlink: '{gen}/{py_rel}/{uv_added_nested_parent_rel}', target: '{uv_added_nested_parent_name}.rhc-real'}]}
      - {id: m-elsewhere-admit, only_variants: [same-basename-elsewhere],
         state: [{path: '{gen}/{py_rel}', kind: dir, uid: '{uid}'},
                 {path: '{gen}/{py_rel}/{uv_added_elsewhere_dir}', kind: dir, uid: '{uid}', private_write: true},
                 {path: '{gen}/{pbs_rel}/{uv_added_elsewhere_dir}', kind: dir},
                 {path: '{gen}/{py_rel}/{uv_added_elsewhere_rel}', exists: false},
                 {path: '{gen}/{pbs_rel}/{uv_added_elsewhere_rel}', exists: false}]}
      - {id: m-elsewhere, only_variants: [same-basename-elsewhere], ops: [{write: '{gen}/{py_rel}/{uv_added_elsewhere_rel}', content: "rhc same basename\n", mode: '0644'}]}
      - {id: m-unrelated, only_variants: [unrelated-new-file], ops: [{write: '{gen}/{py_rel}/rhc-unrelated', content: "rhc unrelated\n", mode: '0644'}]}
      - {id: m-diff-error, only_variants: [diff-failure], ops: [{chmod: '{gen}/{pbs_rel}/{uv_patched_first_rel}', mode: '0000'}]}
      - {id: thw, skip_variants: [pinned-plain], thaw: {step: apply}}
      - {id: join, skip_variants: [pinned-plain], join: apply}
      - {id: plain, only_variants: [pinned-plain], act: {kind: seed, bundle: a, op: apply, root: '{root}'}, expect: {rc: 0, outcome: INSTALLED, gen: expected_a}}
      - {id: verify, only_variants: [pinned-held, pinned-plain], act: {kind: seed, bundle: a, op: verify, root: '{root}'}, expect: {rc: 0, outcome: VERIFIED}}
    note: 'BUILT-UNRUN (nothing executed). Positive: pinned-held (the traced, frozen and thawed apply with NO mutation) and
      pinned-plain (the normal untraced pinned apply through the same seed act every other seed control uses) both INSTALLED
      and VERIFIED. ENTRY-TO-SEED CHAIN (codex tick338; no new launcher, no extracted execution): the G runner''s seed act
      (tasks/act.yml -> controls.j2 plan_act, kind seed, no invoke deviation) -> controls.j2 seed_launch -> argv
      [<bundle A dir>/<bundle.launcher_file>, apply, {root}, <the route-classified mode params>] -- the bundle''s GENERATED
      launcher, per the route''s seed_launcher.caller_argv (pinned-held under the stracep prefix) -> the launcher execs the
      seed per controller.bootstrap.seed_launch -> the seed''s install_python python-verify block. It PROVES only that bounded
      behaviour: the seed''s admission of the declared uv additions on bundle A applied to a fresh controller-local root,
      launched through its generated launcher. It is NOT live deployment or E2E evidence (no target, no ssh, no controller
      bootstrap beyond bundle_a). G-UV-ELSEWHERE-NEEDLE / -FIXTURE-LOCATION (codex tick338): the alternate location
      {uv_added_elsewhere_dir} is declaration-derived (prepare.yml: the admitted interpreter''s directory or a declared
      uv-patched file''s directory, never the addition''s own), admitted by m-elsewhere-admit BEFORE the mutation (installed
      side: a directory owned by {uid} and not group/other-writable; unpack side: kind dir ONLY -- its uid and write bits are
      NOT checked (codex tick346 wording correction); the destination absent on both sides, so no archive member is
      overwritten), and the expected needle is diff''s native line shape "Only in
      <G>/{py_rel}/{uv_added_elsewhere_dir}: {uv_added_elsewhere_name}" (matched from "/{py_rel}/": the <G> prefix is the
      seed''s own). The
      mutations use the FIRST declared addition ({uv_added_rel}) and, for the parent-link leg, the first NESTED one
      ({uv_added_nested_parent_rel}); the checks run per addition in declared order, so an earlier addition always passes
      first. diff-failure makes one unpack member present on both sides ({uv_patched_first_rel}) unreadable, so diff -r
      exits 2 (a content compare needs both files). OPEN / NOT HERE: duplicate, ancestor-overlapping, traversing or
      patched/interpreter-overlapping declarations are schema admission -- C1''s loader cases (testing/loader-tests-r4/
      cases-c1-contract-admission.yml), not a runtime seed control (the seed macro''s own normalized-path refusal has no G
      case: it needs a patched declaration, NOT BUILT). The m1-1 tree custody is the older tree_lines form; no tree is used
      here.'

  # ---- G-RECORD-OPEN-BEFORE-TIMEOUT record-writer race controls (ported from m1-1g, codex 200213 points 5 / 7) ----
  - id: runner.record.appearance-refused
    findings: [G-PRIVATE-PREPARE-CUSTODY, G-RECORD-OPEN-BEFORE-TIMEOUT]
    purpose: 'the record writer never truncates, follows or writes an object that appears before it created the record --
      at its precheck (prior-record, link) AND at the precheck-to-open boundary (fifo-open, regular-open) -- a legitimate
      prior record survives, a raced FIFO cannot block the runner beyond the act''s own bound, and no unadmitted record is
      ever read back'
    refute: 'a writer that opens with `>` (O_TRUNC, following links) empties prior.stdout / writes through the link into
      plant-target: the file predicates FAIL; a writer that skips silently runs the entrypoint: record_refused FAILS; a
      writer whose create is not O_EXCL opens the planted regular-race.stderr: record_refused open FAILS (stage); a writer
      opened OUTSIDE the act''s bound hangs the FIFO step (the task-level timeout fires: runner error, FAIL); a collector
      that reopens the record by pathname (lookup file) hangs on the FIFO the same way'
    variants:
      - {id: none}
      # m1-1 has no plant_record / private_create.yml: the prior object is planted by the variant's own ops (setup, before
      # every step), so it reaches only the writer's PRECHECK -- the same boundary as m1-1g's plant_record
      - {id: prior-record, ops: [{write: '{ctl}/prior.stdout', content: 'LEGITIMATE PRIOR RECORD', mode: '0600'}]}
      - {id: link, ops: [{write: '{ctl}/plant-target', content: 'TARGET', mode: '0600'}, {symlink: '{ctl}/linked.stderr', target: '{ctl}/plant-target'}]}
      - {id: fifo-open}
      - {id: regular-open}
    steps:
      # non-vacuity: nothing planted -- the writer admits both records and collect.yml reads them back through the admitted
      # identity (stdout_has is judged on that readback; an unadmitted record would fail the judge first)
      - {id: plain, act: {kind: command, argv: ['{sha256sum}', --version]}, only_variants: [none], expect: {rc: 0, stdout_has: [sha256sum]},
         post_state: [{file: '{ctl}/plain.stdout', contains: sha256sum}]}
      - {id: prior, act: {kind: command, argv: ['{sha256sum}', --version]},
         only_variants: [prior-record], expect: {record_refused: precheck},
         post_state: [{file: '{ctl}/prior.stdout', regex: '\ALEGITIMATE PRIOR RECORD\Z'}, {path: '{ctl}/prior.stderr', exists: false}]}
      - {id: linked, act: {kind: command, argv: ['{sha256sum}', --version]},
         only_variants: [link], expect: {record_refused: precheck},
         post_state: [{file: '{ctl}/plant-target', regex: '\ATARGET\Z'}, {path: '{ctl}/linked.stdout', exists: false}]}
      # precheck-to-open barrier (the writer plants it AFTER its precheck passed): a reader-less FIFO at the stdout record.
      # The noclobber open of a non-regular object is a plain O_WRONLY open -> it blocks INSIDE the act's own timeout (10 s),
      # which ends the writer (rc 124 / 137); nothing is admitted, so nothing is read; the stderr record is never created
      # (its redirection comes after the blocked one); the FIFO stays a FIFO. Completing this step at all shows neither the
      # writer nor the readback blocked the runner past the bound.
      - {id: fifo-race, act: {kind: command, argv: ['{sha256sum}', --version], timeout_s: 10, record_barrier: [{fifo: out}]},
         only_variants: [fifo-open], expect: {record_unadmitted: true},
         post_state: [{path: '{ctl}/fifo-race.stdout', kind: fifo}, {path: '{ctl}/fifo-race.stderr', exists: false}]}
      # precheck-to-open barrier: an EMPTY regular file at the stderr record. The stdout record is created by O_EXCL (empty,
      # the writer's own); the stderr create meets the existing regular file -> EEXIST, never opened -> refused at stage
      # open (not precheck: the barrier came after it). Both stay empty regular files; nothing ran.
      - {id: regular-race, act: {kind: command, argv: ['{sha256sum}', --version], record_barrier: [{regular: err}]},
         only_variants: [regular-open], expect: {record_refused: open},
         post_state: [{path: '{ctl}/regular-race.stderr', kind: regular, size: 0}, {path: '{ctl}/regular-race.stdout', kind: regular, size: 0}]}
    note: 'runner self-control, no case credit; ALL VARIANTS UNRUN. m1-1: the prior object is planted by variant ops (no
      private_create.yml, no plant_record), so it reaches only the writer''s PRECHECK (prior-record, link: refused stage
      precheck, exit 86; collect.yml reads NO record). record_barrier is planted by the writer itself between its precheck
      and its noclobber create (controls.j2 writer_cmd step 2) -- the deterministic precheck-to-open race (fifo-open,
      regular-open). What this establishes, and what it does NOT (stated): (1) a raced FIFO IS opened by the noclobber open
      (O_WRONLY, no O_EXCL: dash / bash noclobber semantics for an existing non-regular name, read from the shell sources,
      NOT verified here) -- it blocks inside the act''s own scope + timeout, never before it; a raced device or a FIFO with
      a reader would be opened and then refused at stage identity, never written; (2) a raced regular file is never opened
      (EEXIST) -- the refused-at-open expectation depends on the shell continuing to the `||` refusal after a redirection
      error on the brace group (dash behaviour, NOT verified here; if it exits instead, regular-race FAILS); (3) the stdout
      record is admitted only when its descriptor came from the O_EXCL branch, but another process of this uid can still
      rename / reopen / write the admitted inode afterwards (same-uid limit, stated in writer_cmd).'

  # G-RECORD-OPEN-BEFORE-TIMEOUT cleanup race control (codex 195110 / 200213 point 5): the fresh-root CLEANUP purge
  # (tasks/finish_variant.yml) runs through the same writer inside its own scope + timeout; each variant plants the
  # declared barrier at the purge's records after the writer's precheck. The root is never installed (the purge of an
  # absent root is `ABSENT`), so an expected refusal leaves nothing behind.
  - id: runner.record.cleanup-barrier
    findings: [G-RECORD-OPEN-BEFORE-TIMEOUT]
    requires: [bundle_a]
    root: fresh
    purpose: 'the cleanup writer has the act writer''s contract: bounded by its own scope + timeout and an independent
      task-level timeout, refuses a raced regular record at its create, never admits (never reads) a raced FIFO, and an
      unperturbed cleanup purge is admitted and read back'
    refute: 'a cleanup writer outside its bound hangs on the FIFO (the task-level timeout fires: runner error, FAIL); a
      cleanup writer without O_EXCL opens the planted stderr: record_refused open FAILS; a collector reading the cleanup
      records by pathname hangs on the FIFO'
    variants:
      - {id: none, cleanup_purge: {expect: {rc: 0, outcome: ABSENT}}}
      - {id: fifo-open, cleanup_purge: {record_barrier: [{fifo: out}], timeout_s: 15, expect: {record_unadmitted: true},
                                        post_state: [{path: '{ctl}/cleanup-purge.stdout', kind: fifo}, {path: '{ctl}/cleanup-purge.stderr', exists: false}]}}
      - {id: regular-open, cleanup_purge: {record_barrier: [{regular: err}], expect: {record_refused: open},
                                           post_state: [{path: '{ctl}/cleanup-purge.stderr', kind: regular, size: 0},
                                                        {path: '{ctl}/cleanup-purge.stdout', kind: regular, size: 0}]}}
    steps:
      - {id: untouched, state: [{path: '{root}', exists: false}]}
    note: 'runner self-control, no case credit; UNRUN. The only step asserts the fresh root was never created; the judged
      action is the variant''s cleanup purge (finish_variant.yml: cleanup_purge.expect through collect.yml, post_state after
      it). The none variant is the non-vacuity leg (the purge''s ABSENT outcome is read back through the admitted identity).
      Same stated limits as runner.record.appearance-refused (noclobber semantics and the dash redirection-error path read
      from source, not verified; same-uid limit). The task-level timeout bounds the controller''s wait only; the plan''s own
      timeout is what ends the writer.'

  # ---- SEED-INSTALLED-SET-VERSION-MANGLING regression (codex 004700 priority slice; route controller_seed.j2 fix 337697d9, committed within b8eafe9b) ----
  # The interpreter-repair rerun (m1-1g d39b160e; m1-1 20e0c19d) refused at the seed's wheels installed-set check: the
  # installed side's normalization (per route's fix description) also rewrote
  # '.' in VERSIONS ('2.19.11' -> '2-19-11'), so a correct install never equalled the lock. Route's fix (install_venv,
  # :831-843): a whole-line freeze gate (grep -v -x -E '<name>==<version>'; exit 1 = every line well-formed, 0 or 2+
  # refuses), name-only normalization (lower-case, '_' / '.' -> '-'), versions verbatim. This control runs route's ONE
  # implementation (codex tick313 R1 + R2(a), G1-G3): the rendered playbook seed_installed_set (G) RENDERS route's export
  # template (resolved controller.bootstrap.seed_fragments.installed_set_gate_rel -> refusal_fn + installed_set_gate(bs,
  # lock) of macros/controller_seed.j2) through lookup('template') -- no slurp, no regex extraction, no text substitution.
  # G2: the fixture bs is the resolved bootstrap; a grep-failure case overrides ONLY bs.os_tools.grep.path with a G stub,
  # so route's macro emits the stub. G3: the export rendered with the REAL bs must occur verbatim, exactly once per part
  # (refusal_fn, gate), in the shipped bundle-A seed, or nothing is written (RHC-ISG-FRAGMENT-NOT-IN-SEED). Each case's
  # only G input is the freeze listing, G1 isg_listing over the LOCK the profile names (rh.controller.lock_file_rel),
  # never the seed's pins literal; lock-pins is G1 isg_lock_pins (independent of the seed). Each case runs as its own
  # command act; a refusal is judged by the seed's own code AND declared status. The fragment KEY is C1's (proposed
  # controller.bootstrap.seed_fragments.installed_set_gate_rel, NOT YET REGISTERED) and the resolved profile is its SOLE
  # authority (codex-tick318-321-decisions: no pending fallback): until C1 registers it, the render step refuses before
  # rendering (REFUSED RHC-ISG-FRAGMENT-KEY-UNRESOLVED, rc != 0), so this control FAILs at render -- BLOCKED on C1, never
  # a PASS; the case vectors and fixture data stay valid inputs. The render's byte-identity to the production seed render is MAIN's
  # managed package render proof (not G's); G3 checks the shipped bytes only.
  # SCOPE: block-level (the rendered gate in isolation). The whole-seed paths are: the positive = every bundle-A /
  # shared-root install (P01; the rerun that refused); a real uv listing carrying an editable / URL / hostile dist and a
  # real grep failure inside `seed apply` are NOT BUILT (no hold point declared for them). Selftests: G1 isg_listing /
  # isg_lock_pins (selftests.yml). All cases UNRUN.
  - id: seed.wheels.installed-set-gate
    cases: []
    findings: [SEED-INSTALLED-SET-VERSION-MANGLING]
    requires: [shared_root, bundle_a]
    root: shared
    rows:
      dotted-version-admits: 'the lock''s rows with DOTTED versions verbatim (2.19.11, 3.0, 26.3 ...) under mixed name spellings (ANSIBLE_CORE, Jinja2, markupsafe ...) -> admitted; the normalized set written by the seed block equals the lock-side pins G computes from the lock (same_bytes), so a normalization that touched a version fails it'
      dotted-name-spelling-admits: 'every ''-'' in a name spelled ''.'' (ansible.core) -> admitted (name-only normalization maps ''.'' -> ''-'')'
      version-mismatch-refused: 'row 0''s version + ''.1'' (a well-formed, real mismatch) -> RH-SEED-IDENTITY-MISMATCH installed set != lock'
      mangled-version-refused: 'row 0''s version with ''.'' -> ''-'' (the defect''s own mangled form; well-formed) -> RH-SEED-IDENTITY-MISMATCH installed set != lock'
      missing-package-refused: 'the last lock row omitted -> RH-SEED-IDENTITY-MISMATCH installed set != lock'
      malformed-editable-refused: 'row 0 as an editable line (-e git+...) -> RH-SEED-IDENTITY-MISMATCH at the freeze gate (grep exit 0)'
      malformed-at-url-refused: 'row 0 as a direct-URL line (<name> @ https://...) -> refused at the freeze gate (grep exit 0)'
      malformed-empty-version-refused: 'row 0 as <name>== (empty version) -> refused at the freeze gate (grep exit 0)'
      malformed-blank-line-refused: 'a blank line between rows 0 and 1 -> refused at the freeze gate (grep exit 0); never dropped'
      malformed-triple-equals-refused: 'row 0 as <name>===<version> (arbitrary equality) -> refused at the freeze gate (grep exit 0)'
      empty-inventory-refused: 'an empty freeze listing -> refused at the freeze gate (one blank line; grep exit 0)'
      grep-failure-refused: 'the well-formed positive listing with the gate''s grep replaced by a stub exiting 2 -> refused at the freeze gate (grep exit 2); a gate error is never admission'
      grep-exit1-backstop-refused: 'a direct-URL row 0 with the gate''s grep replaced by a stub exiting 1 (the gate''s "ok" status, no output) -> the gate is bypassed by construction and the whole-set equality still refuses (installed set != lock); documents that exit 1 alone is indistinguishable from ok'
    refute: 'dotted-version-admits fails if the gate''s normalization touches a version (its .norm must equal the lock-side pins byte
      for byte). NOT DEMONSTRATED on the pre-fix seed: the pre-fix macros have no installed_set_gate export, and a seed whose
      gate differs from the export rendered with the real bs refuses at G3 (RHC-ISG-FRAGMENT-NOT-IN-SEED) before any case is
      written -- the pre-fix mangling is argued from route''s fix description only. Each refusal case differs from it in exactly one input (one row''s version, one row''s line, one inserted / dropped row, the listing, or the gate''s grep path)'
    hostile: 'editable, direct-URL, empty-version, blank, arbitrary-equality and empty freeze output; a version mismatch; the mangled version form; a missing package; a failing grep; a grep that reports ok without reading'
    steps:
      - {id: render, act: {kind: playbook, playbook: seed_installed_set, via: generation,
                           extra_vars_json: {rhc_ctl: '{ctl}', rhc_seed: '{bundle_a}/lme-controller-seed.sh',
                             rhc_isg_cases: [
                             {id: dotted-version-admits, spell: mixed},
                             {id: dotted-name-spelling-admits, spell: dots},
                             {id: version-mismatch-refused, spell: mixed, version: {at: 0, suffix: '.1'}},
                             {id: mangled-version-refused, spell: locked, version: {at: 0, form: mangled}},
                             {id: missing-package-refused, spell: locked, drop: -1},
                             {id: malformed-editable-refused, spell: locked, replace: {at: 0, form: '-e git+https://example.invalid/%N.git#egg=%N'}},
                             {id: malformed-at-url-refused, spell: locked, replace: {at: 0, form: '%N @ https://example.invalid/%N-%V-py3-none-any.whl'}},
                             {id: malformed-empty-version-refused, spell: locked, replace: {at: 0, form: '%N=='}},
                             {id: malformed-blank-line-refused, spell: locked, insert: [{at: 1, line: ''}]},
                             {id: malformed-triple-equals-refused, spell: locked, replace: {at: 0, form: '%N===%V'}},
                             {id: empty-inventory-refused, empty: true},
                             {id: grep-failure-refused, spell: mixed, grep_exit: 2},
                             {id: grep-exit1-backstop-refused, spell: locked, replace: {at: 0, form: '%N @ https://example.invalid/%N-%V-py3-none-any.whl'}, grep_exit: 1}]}},
         expect: {rc: 0, stdout_has: ['RHC-ISG-RENDERED cases=13 ', 'RHC-ISG-FRAGMENT-IN-SEED '], stdout_not_regex: ['RHC-ISG-FRAGMENT-NOT-IN-SEED', 'RHC-ISG-FRAGMENT-KEY-UNRESOLVED']}}
      - {id: fragment-recorded, state: [{path: '{ctl}/freeze/fragment-real', kind: regular}, {path: '{ctl}/freeze/lock-pins', kind: regular}]}
