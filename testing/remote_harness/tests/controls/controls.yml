  acquire: testing/remote_harness/acquire.yml
  controller: testing/remote_harness/controller.yml
  target_bootstrap: testing/remote_harness/target_bootstrap.yml   # G runs it only under `seed run` (play 1 asserts the seed run TMPDIR),
                                                                  # with --limit localhost (play 1 only) or against TEST-NET-1 targets
                                                                  # for pre-contact refusals (Q-G-PRECONTACT-TARGET-PLAY = main_only: MAIN runs those)
  # G's local runners: controls run them ONLY on refusal paths that stop at their first task (a full run writes the
  # committed acceptance receipt into the checkout); the positive nested-executor path runs through probe_nested
  acceptance: testing/acceptance/run_acceptance.yml
  loader_integration: testing/tests/loader_integration/run_integration.yml
rendered_playbooks: [probe_config, hold_lock, probe_nested]     # rendered per control from templates/playbooks/<name>.yml.j2
seed_run_auth_mode: tailnet_identity              # a localhost-only play still names a mode (controller.bootstrap.ssh_auth)
# absolute tools the RUNNER uses to observe and interrupt (never PATH; the entrypoints bring their own)
runner_tools: {env: /usr/bin/env, timeout: /usr/bin/timeout, strace: /usr/bin/strace, pgrep: /usr/bin/pgrep, pkill: /usr/bin/pkill,
               systemctl: /usr/bin/systemctl, find: /usr/bin/find, mkfifo: /usr/bin/mkfifo, dd: /usr/bin/dd, git: /usr/bin/git,
               sha256sum: /usr/bin/sha256sum, df: /usr/bin/df, cp: /usr/bin/cp, mv: /usr/bin/mv, id: /usr/bin/id,
               chmod: /usr/bin/chmod, kill: /usr/bin/kill, systemd_run: /usr/bin/systemd-run}
# every act runs in its OWN transient user scope (systemd-run --user --scope --collect --unit=<prefix><sha1(act base)[:20]>.scope):
# r3e E30 -- a killed run is provably quiescent only once its recorded run cgroup is EMPTY, so an act sharing the runner's session
# scope would stay PRESERVED-LIVE-STAGING forever. A whole kill kills that scope (never the runner's own cgroup); freeze/thaw steps
# use its cgroup v2 freezer. act.scope: shared opts out (only L04, which demonstrates exactly that E30 consequence).
act_scope: {default: own, unit_prefix: rhc-act-}
# act wrappers (`act.wrap` names one): argv inserted between the tracer and the entrypoint
wraps:
  none: []
  pid_namespace: [/usr/bin/unshare, --user, --map-current-user, --pid, --fork, --mount-proc]

# ---------------------------------------------------------------------------------------------------------------
# Throwaway state, budget and cleanup. The seed refuses /tmp ancestry, so every root lives under rhc_work_root, an
# OWNED, non-group/other-writable directory under $HOME (admitted by the profile's ONE path_admission regex and an
# ancestry stat). Nothing is copied into shared /tmp; {tmpprobe} is an ABSENT /tmp path only ever handed to the seed
# as a root that must be refused before any write.
state:
  run_marker: .lme-rhc-run          # first file of every run dir; cleanup removes only dirs carrying it
  keep_runs: 3                      # older marked run dirs are removed at the start of an execute run (oldest first)
  max_live_roots: 2                 # the shared root + one fresh root; a fresh root is purged when its control ends
  variant_scratch: [bundle, bundle-b, src, stash, receipt, '.bundle.staging.*', '.bundle.reaping.*', '.bundle.lease.*', .bundle.lock]   # removed after each variant (evidence stays)
  storage:                          # free bytes required on the work root before execute (resolved values, not literals)
    generations_from_budget: 3      # x controller.bootstrap.budget.generation_max_bytes
    plus_free_required: true        # + controller.bootstrap.budget.free_required_bytes (the seed's own check)
    bundle_allowance_bytes: 1500000000
    evidence_allowance_bytes: 500000000
  timeouts_s: {seed_apply: 2400, seed_verify: 600, seed_purge: 300, seed_run: 900, package: 1200, playbook: 900, command: 120, wait_phase: 1800, kill_settle: 30}
  cleanup:
    root: seed purge through bundle A (--confirm R); PURGED or ABSENT expected
    fallback: 'control-owned removal ONLY inside a run dir carrying run_marker, after chmod -R u+w; recorded as a
      cleanup finding (the seed''s purge refused a control-made state)'
  managed_env: 'every act runs under env -i with HOME, XDG_RUNTIME_DIR and DBUS_SESSION_BUS_ADDRESS of the owner
    session (the valid declared managed environment, codex Q-D12) plus the declared base env; nothing else is inherited'

# ---------------------------------------------------------------------------------------------------------------
# The vocabulary the runner implements. A control using anything else is UNIMPLEMENTED (reported, fails acceptance).
# `implemented` narrows the declared vocabulary to what the runner executes today; the rest is declared-but-UNIMPLEMENTED.
vocabulary:
  control_keys: [id, cases, findings, purpose, requires, root, fixture_for, declaration, variants, setup, steps, undo,
                 sweep, per_point_expect, note, static_checks, declared_only, acceptance_rule, retire_when, evidence, result_class,
                 applies_when, interface, refute, hostile, rows]
  # legibility (operator gold standard; documentation keys, never executed): `refute` names the mutated input on which the
  # control must FAIL (non-vacuity); `hostile` names its hostile negative; `rows` maps each variant to its lifecycle row(s).
  # New controls are named <operation>.<phase>.<relation>; the older ids stay (other messages cite them).
  variant_keys: [id, declaration, requires, ops, undo, tokens, expect, note]
  step_common: [id, timeout_s, note, post_state, only_variants, skip_variants, expect]
  steps: [act, wait, kill, freeze, thaw, join, ops, snapshot, state, sample_scope, judge_pair, repeat]
  acts: [seed, package, playbook, command]
  # extra_vars_json: ONE structured -e (JSON) after the k=v extra_vars (the lme_resolved_run mapping of the run-local contract)
  act_keys: [kind, op, bundle, root, args, raw_args, argv, async, cwd, dest, env, unset_env, executor, extra_vars, extra_vars_json, inventory_extra,
             inventory_omit_root, inventory_owner, inventory_root, inventory_targets, invoke, limit, no_ssh_auth, playbook, repo, scope,
             source, ssh_auth, strace, timeout_s, trace_exec, trace_network, via, wrap]
  # inventory_targets {name: {host vars}} writes the declared target group (controller.bootstrap.inventory.target_group);
  # every ansible_host / ansible_ssh_host there (and an extra-var ansible_host) must match this RFC 5737 TEST-NET-1 regex,
  # checked at plan time (_steps_unimpl -> UNIMPLEMENTED) and again before the inventory is written (act.yml).
  target_address_regex: '^192\.0\.2\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$'
  kill_options: [step, root, token, holder_only, tracer_only, processes_only]
  expect: [rc, rc_nonzero, refusal, refusal_any, outcome, outcome_any, gen, refused_at, refused_at_any, failed_before_task,
           playbook_refusal, stdout_has, stderr_has, stdout_or_stderr_has, stderr_regex, stdout_regex, stdout_not_regex, busy_expected,
           killed, record_only, no_network, exec_seen, no_exec_regex, any_of]
  predicates: [path, glob, file, same_bytes, snapshot, implies]
  ops: [mkdir, write, symlink, chmod, remove, remove_glob, stash, stash_copy, unstash, copy, copy_tree, mkfifo, append,
        unseal, reseal, json_rewrite, drop_line, retarget, move, overwrite_first_byte, rehash_into_json, run_shaped_dirs]
  op_options: [mode, content, target]   # sibling keys of a scalar-valued op (mkdir/write/chmod: mode; write: content; symlink: target)
  waits: [phase, file_regex, path_exists, glob, gone]
  sweeps: [phases, declared_points, pins]
  static_checks: [render_tool_path, representation, adapter_closure, transport_disposition]
  # each static check runs as declared AND under every declared negative control (a mutation its judge must reject)
  static_check_mutations:
    render_tool_path: [unchanged, presence_only, stray_line]
    representation: [add_file, empty]
    adapter_closure: [drop_provides, drop_use, add_os_tool, drop_family_mapping]
    transport_disposition: [b_case_expect, drop_b_case, route_form, drop_route_case, claim_coverage]
  not_implemented:   # declared by a control, not executed yet -> that control/variant is UNIMPLEMENTED
    ops: [regenerate_manifests, retarget]
    op_options: [link_members]
    predicates: []
    steps: []
    sweeps: []
    static_checks: []

# The reserved output names N01 pins (SEED-05): r3e DELETED the profile's derived_outputs; the ONE source is C1's registry
# list in manifests/global.yml (C16 row). Read only when present in this repository: with it absent N01 is QUEUED
# (pin_names_declared), never a runner crash. The 21 r3e internal facts (for_C1_reserved_outputs_additions; codex-tick144
# DECLARED-INPUTS-VS-DERIVED-OUTPUTS) are pinned once C1 adds them to that list; until then they are an open C16 gap.
pin_name_sources:
  - {kind: file, file: manifests/global.yml, path: lme_config_registry.remote_harness_schema.reserved_outputs}
  # E48 (consumer interface "revision 5" per refuse_pinned_outputs.yml's header): C1's 16 resolver_outputs are refused too
  - {kind: file, file: manifests/global.yml, path: lme_config_registry.remote_harness_schema.resolver_outputs}

# ---------------------------------------------------------------------------------------------------------------
# Codex rulings a control's applicability depends on (`applies_when`). null = open: the control is QUEUED. When codex
# rules, G records the chosen option and the ruling's message id here; controls declaring another option become
# NOT-APPLICABLE (recorded, never coverage).
rulings:
  Q-D04-COLD-START: a           # codex-tick138-lease-and-cold-acquisition-decisions-20260924-004749: cold qualification on a fresh empty owned store
  Q-LEASE-AS-LIVENESS: not-sufficient   # same message: the controller-main-process lease does not authorize a reap; E09 and staging recovery stay OPEN
  # RULED main_only (codex 135012, relayed by MAIN): a G-run control does NOT execute target_bootstrap.yml play 2 against
  # TEST-NET-1 targets. The target.admit.* controls therefore require main_only (status MAIN-ONLY: MAIN's run population,
  # neither QUEUED nor NOT-APPLICABLE) and carry no applies_when; MAIN runs the same declarations.
  Q-G-PRECONTACT-TARGET-PLAY: main_only   # codex 135012

