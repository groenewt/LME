                  note: 'E33 wrong-identity: a valid alternate path carrying ANOTHER file''s digest (cut''s)'}
  mv_absent:    {patch: {os_tools: {mv: {path: /usr/bin/lme-rhc-absent-mv, identity: {kind: file_sha256, sha256: 7db4661c6397fe5fd5ba6837692aa5adb7dce1efc656369d7b08dfd6ece525a0}}}},
