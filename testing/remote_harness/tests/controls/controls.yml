           basename-is-sibling: 'E49: an rh_bundle_dir whose basename matches the sibling rule -> REFUSED RH-SCOPE-BINDING before any write'}
    refute: 'plant the sibling as `bundle-klass-<64 hex>` (not the rule) -> no marker -> stdout_has FAILS; a route that reaps it -> snapshot FAILS'
    hostile: 'a stale class sibling of an earlier deployment next to the destination; a destination named like a sibling'
