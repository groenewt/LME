  # ==== SEED LAUNCH + R1 LAUNCHER JOIN (ported from m1-1g; codex 183510 E78, codex 192321 / codex-tick217 E82-E85, codex 211754 /
  # 212700 integration): the same controller-local controls as m1-1g; m1-1 carries no genesis.launch, and none of these needs it
  - id: seed.launch.declared-vector
    cases: [E78-seed-launch-contract]
    findings: [SEED-LAUNCH-CONTRACT, RH-SEED-LAUNCH]
    requires: [shared_root]
    root: shared
    rows:
      negative-locale: 'E78 LC_ALL replaced by another value'
      negative-path: 'E78 PATH replaced by another value'
      negative-home: 'E78 HOME = another owned dir'
      negative-xdg: 'E78 XDG_RUNTIME_DIR = a different owned dir'
      negative-bus: 'E78 DBUS_SESSION_BUS_ADDRESS = unix:path=<elsewhere>'
    refute: 'a seed without launch_base_check / launch_derive verifies (rc 0) and the refusal expectation FAILS'
    variants:
      - {id: negative-locale, case_components: {E78-seed-launch-contract: [negative-locale]}}
      - {id: negative-path, case_components: {E78-seed-launch-contract: [negative-path]}}
      - {id: negative-home, case_components: {E78-seed-launch-contract: [negative-home]}}
      - {id: negative-xdg, case_components: {E78-seed-launch-contract: [negative-xdg]}}
      - {id: negative-bus, case_components: {E78-seed-launch-contract: [negative-bus]}}
    steps:
      - {id: lc, act: {kind: seed, bundle: a, op: verify, root: '{shared}', invoke: seed_direct, direct_purpose: seed_refusal, env: {LC_ALL: POSIX}}, only_variants: [negative-locale],
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launch: LC_ALL must be exactly']}}
      - {id: path, act: {kind: seed, bundle: a, op: verify, root: '{shared}', invoke: seed_direct, direct_purpose: seed_refusal, env: {PATH: '/nonexistent-rhc-path'}}, only_variants: [negative-path],
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launch: PATH must be exactly']}}
      - {id: home, act: {kind: seed, bundle: a, op: verify, root: '{shared}', invoke: seed_direct, direct_purpose: seed_refusal, env: {HOME: '{ctl}/cwd'}}, only_variants: [negative-home],
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launch: HOME=']}}
      - {id: xdg, act: {kind: seed, bundle: a, op: verify, root: '{shared}', invoke: seed_direct, direct_purpose: seed_refusal, env: {XDG_RUNTIME_DIR: '{ctl}/cwd'}}, only_variants: [negative-xdg],
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launch: caller XDG_RUNTIME_DIR=']}}
      - {id: bus, act: {kind: seed, bundle: a, op: verify, root: '{shared}', invoke: seed_direct, direct_purpose: seed_refusal, env: {DBUS_SESSION_BUS_ADDRESS: 'unix:path={ctl}/cwd/bus'}}, only_variants: [negative-bus],
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launch: caller DBUS_SESSION_BUS_ADDRESS=']}}
    note: 'BUILT-UNRUN against the CURRENT seed_launch contract (controller-local verify of the shared root; read-only). RE-BOUND
      AT THE LAUNCHER JOIN (codex 192321): these steps test the SEED''s own refusals, which the generated launcher can never reach
      (it clears the ambient environment -- E83), so each step declares act.invoke seed_direct: the seed started directly by the
      declared seed_launch vector (controls.j2 seed_direct: env -i PATH LC_ALL HOME=<passwd home>) with ONE declared deviation:
      act.env replaces a declared pair in place (locale / path / home) or appends a name the vector never carries (xdg / bus).
      That direct vector is a LABELLED fault-injection path (codex 210509), never a default: every other G seed launch is the
      launcher. NOT BUILT: positive (the in-scope /proc/self/environ probe) and no-user-manager (operator account). E78 stays
      PARTIAL.'

  # codex 211754 G-LAUNCH-PARAMS-FROM-USAGE-TEXT: parameter metadata and admission are independent of the launcher's
  # PRESENTATION (its usage header). REQUIRED; fixture route-owned (codex 211654 split).
  # BUILT on the route checkout fixtures (codex 212700 / 223100; ported from m1-1g): Route 3 clone + catalog usage-text / usage-header.
  - id: seed.launcher.params-presentation-independent
    findings: [G-LAUNCH-PARAMS-FROM-USAGE-TEXT]
    requires: [route_launch_params_export, route_header_variant_fixture, route_checkout_fixture, bundle_a, seed06_projection]
    variant_checkout: clone
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/fixture_checkout.yml, testing/remote_harness/tasks/fixture_checkout_edit.yml,
                                    testing/remote_harness/tests/bundle_fixtures.yml, testing/remote_harness/templates/macros/controller_seed.j2,
                                    testing/remote_harness/templates/lme-seed-launch-params.json.j2, testing/remote_harness/tasks/admit_bundle.yml]}
    rows:
      usage-text: 'a variant clone differing from the run checkout ONLY in the usage refusal string of controller_seed.j2 seed_launcher
        (catalog usage-text) plus G''s re-serialized profile'
      usage-header: 'the same for the usage HEADER comment lines a text parser would read (catalog usage-header)'
    refute: 'a G that parsed the usage header (the removed launch_params_of) would read other parameter names from the variant and
      plan other launch words (apply through the variant launcher FAILS); a route whose admission compared the header text as parameter
      metadata would refuse the variant (package FAILS); a producer that did not apply the edit leaves the launcher without the
      fixture text (presented FAILS); a clone differing anywhere else is refused by the clone admission (clone_status / input_map)'
    hostile: 'a launcher whose presentation (usage text and header) changed while its parameters did not'
    variants:
      - {id: usage-text, declaration: usage_text}
      - {id: usage-header, declaration: usage_header}
    steps:
      # (2) package FROM THE CLONE: package_bundle.yml's own admission (admit_bundle.yml) re-renders the launcher from the same
      # (variant) checkout and admits it -- the header text never acts as metadata
      - {id: package, act: {kind: package, repo: variant, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: bound, state: [{file: '{ctl}/bundle/bundle.json', json_equal: {path: source.checkout, value: '{vclone}'}}]}
      - {id: presented-text, only_variants: [usage-text],
         state: [{file: '{ctl}/bundle/lme-seed-launch.sh', contains: 'seed launcher: usage (fixture usage-text): <mode> <root>'}]}
      - {id: presented-header, only_variants: [usage-header], state: [{file: '{ctl}/bundle/lme-seed-launch.sh', contains: '#   usage: <bundle>/'}]}
      # (3) G's seed launch plan (plan_act: parameters from the route export of the RUN checkout, never from any header) drives
      # the VARIANT launcher: apply / verify / purge on the clone's own root
      - {id: apply, act: {kind: seed, bundle: '{ctl}/bundle', op: apply, root: '{vroot}'}, expect: {rc: 0, outcome: INSTALLED}}
      - {id: verify, act: {kind: seed, bundle: '{ctl}/bundle', op: verify, root: '{vroot}'}, expect: {rc: 0, outcome: VERIFIED}}
      - {id: purge, act: {kind: seed, bundle: '{ctl}/bundle', op: purge, root: '{vroot}'}, expect: {rc: 0, outcome: PURGED}}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}]}
    note: 'BUILT-UNRUN (was declared_only; codex 211754 contract). (2) and (3) are executed as above; (1) -- the route export
      seed_launcher.params_rel rendered from the variant clone BYTE-EQUAL to the run checkout''s -- is NOT BUILT: G renders the
      export only from the run checkout (tasks/export_availability.yml) and has no declared act rendering it from a clone; a
      PASS here therefore never claims (1). {vroot} is purged again by finish_variant.yml (read-back) if a step fails.'

  - id: seed.launcher.bundle-membership
