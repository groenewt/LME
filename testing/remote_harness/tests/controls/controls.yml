  sort_owner:   {patch: {os_tools: {sort: {path: '{fixtures}/tools/sort', identity: {kind: file_sha256, sha256: 4bf4f14424fa481b1f40d28534b0c5c7a7d07affcb82c805b07255cc4c2034be}}}}}
  flock_absent: {patch: {os_tools: {flock: {path: /usr/bin/lme-rhc-absent-flock, identity: {kind: file_sha256, sha256: 231d0d5879ff18acd8edcedb791be807cc7507df4dcfd7a17269d54bbeef21e1}}}}}
  cut_bin:      {patch: {os_tools: {cut: {path: /bin/cut, identity: {kind: file_sha256, sha256: f7f5511ede2187fbb7646581470c84647d087fb87cb74836c0237b0943d3dbc2}}}},
                 note: 'uv_installer tool: base PATH /usr/bin:/bin resolves /usr/bin/cut'}
  mv_owner:     {patch: {os_tools: {mv: {path: '{fixtures}/tools/mv', identity: {kind: file_sha256, sha256: 7db4661c6397fe5fd5ba6837692aa5adb7dce1efc656369d7b08dfd6ece525a0}}}}}
  git_absent:   {patch: {os_tools: {git: {path: /usr/bin/lme-rhc-absent-git, identity: {kind: file_sha256, sha256: 356db14e102d68a1a37d8a1ac577dfd678d45d46e92f468bef8b7154e7bfdc60}}}}}
  # copy or clone route only (profile_bytes_differ never takes the override): C1 refuses both as overrides (not tunable)
  owner_mismatch: {patch: {inventory: {owner: {var: lme_toolchain_other}}}, profile_bytes_differ: true,
                   note: 'owner rule hostile negative: inventory.owner.var != inventory.owner_var; admit_transport.yml task 3 must refuse'}
  forms_three:  {patch: {ssh_auth: {composition: {inventory_forms: {accepted: [{form: absent, test: undefined, proxy_jump: ''}, {form: mode_args, test: equals_mode_args, proxy_jump: ''},
                                                                              {form: proxy_jump, test: match_form_regex, proxy_jump: form_regex_capture_1}]}}}},
                 profile_bytes_differ: true, note: 'E50 rule mutation: the `empty` form dropped (a missing form); the route refuses the changed rule'}
