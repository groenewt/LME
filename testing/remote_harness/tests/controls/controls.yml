      interrupted_state: [{implies: {if_exists: '{root}', then_exists: '{root}/.lme-controller-root'}}]
      rerun: {rc: 0, outcome: INSTALLED, stderr_regex: '^REPLACING-INCOMPLETE {gen_id} [0-9TZ-]+$'}
      rerun_late: {rc: 0, outcome_any: [INSTALLED, UNCHANGED]}
      state: [{glob: {dir: '{root}/abandoned', pattern: '*', count: 0}}, {file: '{root}/active-generation', contains: '{gen_id}'},
              {glob: {dir: '{root}/generations', pattern: '*', count: 1}}]
      reset: {outcome: PURGED}
    note: 'the complete phase line precedes COMPLETE + publication, so a kill there converges either way (REPLACING-INCOMPLETE or UNCHANGED + republish); one generation id, no duplicate'

