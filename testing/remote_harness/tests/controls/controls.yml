# testing/remote_harness/tests/controls/controls.yml -- lifecycle CONTROL DECLARATIONS for the managed controller seed
# (owner: G_acceptance_coordinator). Executed only by the generic runner testing/remote_harness/tests/run_controls.yml.
#
# Binding: every control names the case ids it exercises (`cases`). The case rows are NOT repeated here: the runner
# reads the owners' files (cases_refs), refuses a control naming an id that is not there, and reports every row no
# control names. `findings` names codex review findings (tick121 SEED-0x, tick127 genesis/S*, 232353 SEED2-*,
# 232517 SEED-06, tick134 M1-*/R-B3) and G's posted seams (G-*).
#
# Black box: every action goes through a real entrypoint (the rendered seed of a package.yml bundle, package.yml,
# acquire.yml, controller.yml under `seed run` or under the generation's own executor). Expectations are the declared
# refusal vocabulary (stderr `REFUSED <code>` AND the exit status controller.bootstrap.refusals maps it to; for
# playbooks the fail_msg `REFUSED <code>` of controller.bootstrap.playbook_refusals AND the failing task name -- a
# generic Ansible failure never matches a named refusal), the declared outcomes, and filesystem predicates.
#
# Status per control (per variant): PASS | FAIL | QUEUED (a declared dependency is unmet: source not landed, MAIN
# input absent) | MAIN-ONLY (requires main_only: MAIN's run population -- root, another uid, a real target, or a codex
# ruling that assigned it to MAIN; never run by G, never coverage here) | BLOCKED (during execute: a prerequisite CONTROL
# dependency, e.g. bundle_a = P01, is not PASS -- failed, or not run/selected -- or the shared root is tainted; the plan
# lists it as 'after <control>', never QUEUED: controls.j2 plan_status, tasks/variant.yml _rhc_blockers) |
# UNIMPLEMENTED (vocabulary the runner does not implement) | RESIDUAL (a declared trust-boundary record: never PASS,
# never coverage) | OPEN-REGRESSION (a previously supported case not yet composed: never coverage) | NOT-APPLICABLE (the
# option of an open ruling that codex did not pick: recorded, never coverage, not counted against the run). Only PASS passes.
# A BUSY refusal of a step that did not expect it is a FAIL, never coverage; BUDGET-UNAVAILABLE never stands in for BUSY.
# The same holds for the r3e publish fence (RH-STAGING-BUSY); a refusal from another task than the one a control names
# (e.g. RH-STAGING-LEASE from a contended flock known answer, codex-014047) is a FAIL, never the intended outcome.
#
# Evidence contract (codex-015024 GraphAtlas P04/P06): DECLARED coverage (plan mode: which rows a control names),
# EXECUTED checks (static checks, gate self-tests, executed steps) and QUALIFIED behaviour (PASS of an executed control
# on the bytes it recorded) are separate dimensions and reported separately; only the last is acceptance evidence, and
# only for the recorded bytes, declarations and profile. A result on other/stale bytes, another revision or another
# profile never promotes the current source (ENFORCED: prepare.yml digests every bound_bytes_at_authoring path into dependency
# bound_bytes_current; any absent or changed digest makes plan_status QUEUE every control "stale-binding" before any other
# rule, in plan and run mode alike); an environment refusal (e.g. RH-DERIVED-OUTPUT-PINNED from a worktree
# without C1's registry) is neither PASS nor FAIL of any control. GraphAtlas P05/P08 (owner/resource/generation,
# stale-successor, failed publication) are bound to the existing lifecycle controls: owner/resource = S01, O01, L01
# (other machine/uid/namespace -> UNKNOWN); generation = L01 boot leg (MAIN) and the lease token; stale successor =
# L02b (r3f); failed publication keeps its evidence and releases only its own state = K06, K09, L02 (RH-STAGING-BUSY).
#
# Tokens: single braces, expanded by the runner (never Jinja). Any token left after expansion is a declaration error.
#   {work} rhc_work_root  {run} this run dir  {ctl} this control's dir  {parent} {ctl}/p (owned 0700; fresh roots)
#   {root} {parent}/root  {rootname} root  {gen_id} bundle A generation  {gen} {root}/generations/{gen_id}
#   {shared} {run}/shared/p/root  {sparent} {run}/shared/p  {sgen} {shared}/generations/{gen_id}  {bundle_a} {run}/bundles/a
#   {src} rhc_artifact_source  {head} candidate HEAD  {uid} {user} {home} {xdg_runtime_dir}
#   {tmpprobe} /tmp/lme-rhc-absent-<run id> (never created)  {fifo} {ctl}/fifo  {fixtures} {work}/fixtures
#   {canary} {foreign} MAIN-staged inputs  {builder} the declared builder executable  {sha256sum} os_tools.sha256sum.path
#   {workspace} the seed-run work root W: {work} through its last /.work/ (the run clone's .work; route 814cf6a)
#   {sreceipt} {sreceipt_sha256} the shared root's published receipt and its digest (bound after the bundle-A fixture)
#   {receipt_name} controller.bootstrap.toolchain_receipt (the published receipt's file name under any root). Mutation
#   paths use {sreceipt} / {root}/{receipt_name}, never the literal name, so a declared override is preserved (codex 153333)
#   {first_source_file} the first declared artifact file name
#   {envelope_memory_plus_1} controller.local_envelope.memory_bytes + 1 (an int)
#   {run_keep} {run_keep_plus_3} {check_keep} {check_keep_plus_2} {staging_max} {staging_repeat} from the resolved profile
#   {artifact_count} number of controller.bootstrap.artifacts rows
#   {staging} is bound by a `glob` predicate with `bind: staging`; binding it also binds {reaping}, the same name with
#   the profile's staging_infix replaced by reaping_infix (reap_staging.yml keeps the lease suffix); variant `tokens` add their own.
