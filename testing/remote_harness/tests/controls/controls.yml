# every act runs in its OWN transient user scope (systemd-run --user --scope --collect --unit=<prefix><sha1(act base)[:20]>.scope):
# r3e E30 -- a killed run is provably quiescent only once its recorded run cgroup is EMPTY, so an act sharing the runner's session
# scope would stay PRESERVED-LIVE-STAGING forever. A whole kill kills that scope (never the runner's own cgroup); freeze/thaw steps
# use its cgroup v2 freezer. act.scope: shared opts out (only L04, which demonstrates exactly that E30 consequence).
act_scope: {default: own, unit_prefix: rhc-act-}
# act wrappers (`act.wrap` names one): argv inserted between the tracer and the entrypoint
wraps:
