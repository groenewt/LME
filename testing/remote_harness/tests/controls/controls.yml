               inventory_targets: {t1: {<<: *t1, lme_global: rhc-pinned}}},
         expect: {rc_nonzero: true, playbook_refusal: RH-DERIVED-OUTPUT-PINNED, refused_at: Refuse pre-supplied harness derived outputs, no_network: true}}
    note: 'EVERY leg is a refusal BEFORE the first target contact, under strace trace_network (a connect() FAILS the leg: the non-vacuity
      refute of "before contact"). Play 1 runs on localhost against bundle A (the targets'' class key equals the controller''s: no
      per-host override here) and packs into the seed run''s TMPDIR; play 2''s resolve (C1 engine include) is evaluated for the target
      host WITHOUT connecting -- UNVERIFIED by G (static reading only): if any resolve/admission task of play 2 contacts the host before
      admit_transport, no_network FAILS the leg and that is reported, never tolerated. Q-G-PRECONTACT-TARGET-PLAY ruled main_only
      (codex 135012): MAIN-ONLY -- MAIN runs these same declarations; G never runs play 2'

  # ---- owner rule (r3h) and E50 rule mutation: route refuses a CHANGED declared rule (copy route: MAIN-staged profile copies) ----
  - id: target.admit.rule-mutation-refused
    cases: [E50-inventory-common-args-accepted-forms]
    findings: [OWNER-ABSENT-RULE-r3h, ACCEPTED-FORMS]
    requires: [main_only, bundle_a, seed06_projection, r3h_owner_rule, r3g_accepted_forms]   # Q-G-PRECONTACT-TARGET-PLAY = main_only (codex 135012)
    root: fresh
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/admit_transport.yml, manifests/profiles/remote-harness.yml,
                                    ansible/roles/podman/filter_plugins/lme_manifests.py, manifests/global.yml]}
    rows:
      owner-var-mismatch: 'r3h owner rule inventory.owner {var, absent: ''''}: owner.var (lme_toolchain_other) != owner_var (lme_toolchain_owner).
        FINDING G-C1-FIRST (C1 at HEAD 5de3e12, _rh_endpoint_vars owner_rule_path): C1 now refuses this declaration at the ENGINE
        resolve of package.yml ("... must equal ... (one owner rule, one place)"), before any bundle exists; admit_transport task 3''s
        owner.var == owner_var assert is DEFENCE IN DEPTH, unreachable through a C1-resolved policy. The hostile negative is therefore
        judged at its first refusal (C1); task 3 is proven only by source read'
      forms-rule-changed: 'E50 rule mutation (a missing form): admit_transport task 1 REFUSED RH-TRANSPORT-AUTH, never half-applied'
    refute: 'owner-var-mismatch run on the CANDIDATE (unchanged rule) -> task 3 passes -> play 2 reaches contact -> no_network and the refusal FAIL;
      the same mismatch through lme_global_override is refused by C1 (not tunable) at the engine resolve -> refused_at FAILS (never counted)'
    hostile: 'a declared rule whose owner-absent variable names another variable than the admitted owner'
    variants:
      - {id: owner-var-mismatch, declaration: owner_mismatch, requires: [owner_rule_variant],
         expect: {package: {rc_nonzero: true, stdout_regex: 'must equal .*one owner rule, one place', failed_before_task: Admit exactly the declared builder before any write}}}
      - {id: forms-rule-changed, declaration: forms_three, requires: [forms_rule_variant],
         expect: {tb: {rc_nonzero: true, playbook_refusal: RH-TRANSPORT-AUTH, refused_at: 'Refuse an undeclared, mismatched or overridden SSH authentication mode', no_network: true}}}
    steps:
      - {id: package, act: {kind: package, repo: variant, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: no-bundle, only_variants: [owner-var-mismatch], state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: apply, skip_variants: [owner-var-mismatch], act: {kind: seed, bundle: '{ctl}/bundle', op: apply, root: '{root}'}, expect: {rc: 0, outcome: INSTALLED}}
      - {id: tb, skip_variants: [owner-var-mismatch],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{root}', bundle: '{ctl}/bundle', repo: variant, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1}}}
      - {id: purge, skip_variants: [owner-var-mismatch], act: {kind: seed, bundle: '{ctl}/bundle', op: purge, root: '{root}'}, expect: {rc: 0, outcome: PURGED}}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}]}
    note: 'the changed rule is part of controller.bootstrap, so it changes C1''s class key and the controller receipt: the control packages the
      variant, installs it on its own fresh root and runs the variant''s target_bootstrap.yml under THAT generation (as R01 does for a
      changed revision). The override route cannot carry either change (inventory.* and ssh_auth.* are not C1 tunable_paths): only a
      MAIN-staged repository copy (rhc_variants.owner_mismatch / forms_three) reaches the route task; a C1 refusal is never this pass'

  # ---- codex-004749 Q-D04-COLD-START = (a); r3e receipt lme-acquisition-receipt/1 (host var rh_acquisition_receipt, outside the store) ----
  - id: D04a-acquire-cold-qualification
    cases: [D04a-acquire-cold-qualification, D04-acquire-declared-only]
    findings: [genesis, codex-000010, Q-D04-COLD-START]
    requires: [bundle_a, r3e_acquisition_receipt]
    applies_when: {ruling: d04_cold_start_ruling, options: [a]}
    setup: [{mkdir: '{ctl}/src', mode: '0700'}, {mkdir: '{ctl}/receipt', mode: '0700'}]
    steps:
      - {id: empty, state: [{glob: {dir: '{ctl}/src', pattern: '*', count: 0}}]}
      - {id: acquire, act: {kind: playbook, playbook: acquire, via: builder, source: '{ctl}/src', inventory_extra: {rh_acquisition_receipt: '{ctl}/receipt/acq.json'}},
         expect: {rc: 0, stdout_regex: 'ACQUIRED store_empty_before=True fetched={artifact_count} reused=0 cold_qualified=True receipt={ctl}/receipt/acq\.json'}}
      - {id: receipt, state: [{file: '{ctl}/receipt/acq.json', json_equal: {path: schema, value: lme-acquisition-receipt/1}},
                              {file: '{ctl}/receipt/acq.json', json_equal: {path: store_empty_before, value: true}},
                              {file: '{ctl}/receipt/acq.json', json_equal: {path: store_entries_before, value: []}},
                              {file: '{ctl}/receipt/acq.json', json_equal: {path: store_foreign_entries, value: []}},
                              {file: '{ctl}/receipt/acq.json', json_equal: {path: cold_qualified, value: true}},
                              {file: '{ctl}/receipt/acq.json', json_all: {path: rows, key: disposition, value: fetched}},
                              {glob: {dir: '{ctl}/src', pattern: 'acq.json', count: 0}}]}
      - {id: every-row-fetched, act: {kind: package, dest: '{ctl}/bundle', source: '{ctl}/src'}, expect: {rc: 0, stdout_has: [PUBLISHED]},
         post_state: [{same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
    note: 'r3e D04a: the store is created empty by this control (asserted before the run); the receipt lies OUTSIDE it.
      cold_qualified = store_empty_before AND every row fetched; a bundle byte-identical to bundle A proves every declared row arrived with
      its declared digest, no MAIN prefill. The per-row url/sha256 are compared to the declarations by the route''s own receipt assert;
      G checks disposition and qualification. The harness''s only network effect'

  - id: D04b-acquire-warm-reapply
    cases: [D04b-acquire-warm-reapply]
    findings: [genesis, Q-D04-COLD-START]
    requires: [bundle_a, r3e_acquisition_receipt]
    applies_when: {ruling: d04_cold_start_ruling, options: [a]}
    setup: [{copy_tree: {from: '{src}', to: '{ctl}/src'}}, {mkdir: '{ctl}/receipt', mode: '0700'}]
    steps:
      - {id: snap, snapshot: {name: warm, of: '{ctl}/src'}}
      - {id: reapply, act: {kind: playbook, playbook: acquire, via: builder, source: '{ctl}/src', trace_network: true, inventory_extra: {rh_acquisition_receipt: '{ctl}/receipt/acq.json'}},
         expect: {rc: 0, no_network: true, stdout_regex: 'ACQUIRED store_empty_before=False fetched=0 reused={artifact_count} cold_qualified=False'}}
      - {id: not-replaced, state: [{snapshot: warm, equal: true}, {file: '{ctl}/receipt/acq.json', json_all: {path: rows, key: disposition, value: reused}},
                                   {file: '{ctl}/receipt/acq.json', json_equal: {path: cold_qualified, value: false}}]}
    note: 'r3e D04b: a store prefilled with digest-correct files (here a copy of the MAIN-staged source) gives every row reused, nothing
      fetched or rewritten (snapshot: names, bytes, mode, owner, mtime unchanged -- the receipt lives outside the store) and can never be
      cold_qualified. The D04a-store-reapplied form is the same predicate over a store D04a filled'

  - id: D04c-acquire-mismatch-and-interrupted-download
    cases: [D04c-acquire-mismatch-and-interruption, D04-acquire-declared-only]
    findings: [genesis, codex-000010, Q-D04-COLD-START]
    requires: [bundle_a, r3e_acquisition_receipt]
    applies_when: {ruling: d04_cold_start_ruling, options: [a]}
    variants:
      - {id: present-other-digest, ops: [{copy_tree: {from: '{src}', to: '{ctl}/src'}}, {remove: '{ctl}/src/{first_source_file}'},
                                         {write: '{ctl}/src/{first_source_file}', content: "rhc other digest\n", mode: '0600'}, {mkdir: '{ctl}/receipt', mode: '0700'}]}
      - {id: interrupted-download, requires: [main_only], note: 'G: MAIN-only (network kill mid get_url); the declared row name never appears, a stray .ansible_tmp* is listed in store_foreign_entries and disqualifies cold qualification'}
      - {id: served-digest-mismatch, requires: [main_only], note: 'a declaration copy with one wrong sha256 (declared url serving other bytes): MAIN-staged variant + network; the row name never appears'}
    steps:
      - {id: snap, snapshot: {name: pre, of: '{ctl}/src'}, only_variants: [present-other-digest]}
      - {id: mismatch, act: {kind: playbook, playbook: acquire, via: builder, source: '{ctl}/src', trace_network: true, inventory_extra: {rh_acquisition_receipt: '{ctl}/receipt/acq.json'}},
         expect: {rc_nonzero: true, playbook_refusal: RH-ACQUIRE, failed_before_task: Fetch each absent row from its declared source, no_network: true},
         only_variants: [present-other-digest]}
      - {id: never-overwritten, state: [{snapshot: pre, equal: true}], only_variants: [present-other-digest]}
    note: 'r3e D04c: present + other digest: REFUSED RH-ACQUIRE before any fetch, the file preserved. The interruption and served-digest legs
      are MAIN-only (network); get_url/atomic_move behaviour is source-read only by the author'

  - id: D04d-offline-packaged-path
    cases: [D04d-offline-packaged-path]
    findings: [genesis, codex-tick138]
    requires: [main_only]
    declared_only: 'offline profiles never run acquire.yml: they consume a packaged bundle transferred as a unit; package.yml stays offline
      (T26 / B01 / M01 trace no connect). The offline-profile transfer leg is MAIN on a real target (TR02)'

  # ---- nested-probe executor + resolved run (RH-NESTED-PROBE-EXECUTOR codex 143844; RH-RUNNER-RESOLVED-WORKROOT codex 144541) ----
  # The shared binding testing/remote_harness/tests/tasks/bind_probe_executor.yml (+ probe_argv.yml) is what G's local
  # runners (acceptance, loader_integration) run FIRST. The positive path runs it through the rendered probe_nested
  # playbook under the shared root's generation (via: generation -- receipt consistency; no seed verify ran here) with a
  # control-built lme_resolved_run shaped as the producer's (exact key set; env = absolute path values only, no PATH)
  # whose work_root is a non-default control dir, while the act's own (ambient) PATH puts a decoy ansible-playbook
  # FIRST; the real runners are exercised only on their first-task refusals.
  - id: executor.nested.resolved-run
    cases: []
    findings: [RH-NESTED-PROBE-EXECUTOR, RH-RUNNER-RESOLVED-WORKROOT]
    requires: [shared_root, bundle_a]
    root: shared
    evidence: {bind_source_sha256: [testing/remote_harness/tests/tasks/bind_probe_executor.yml, testing/remote_harness/tests/tasks/probe_argv.yml,
                                    testing/acceptance/run_acceptance.yml, testing/acceptance/one_case_acceptance.yml,
                                    testing/tests/loader_integration/run_integration.yml, testing/tests/loader_integration/one_case.yml]}
    rows:
      resolved-decoy-on-path: 'ambient PATH ansible-playbook (a decoy FIRST on the act PATH) + resolved override consumed: work_root {ctl}/wr (not the profile default) receives the identity act (tmp, tmp/ansible-local, tmp/ansible-remote); the nested probe executes {sgen}/venv/bin/ansible-playbook with the receipt config/collections/python and the decoy never runs'
      resolved-malformed: 'lme_resolved_run with one field beyond the declared key set -> refused at the first binding task (exact key set)'
      ambient-executor: 'conflicting ambient executor: /usr/bin/ansible-playbook runs the binding -> refused'
      ambient-tmpdir-conflict: 'conflicting ambient TMPDIR ({ctl}/foreign-tmp, not lme_resolved_run.env.TMPDIR) -> refused'
      resolved-absent: 'lme_resolved_run absent at the binding -> refused (RH-RUNNER-RESOLVED-WORKROOT)'
      runner-acceptance-direct: 'run_acceptance.yml invoked directly (no extra vars at all) -> refused at its first task'
      runner-acceptance-absent: 'run_acceptance.yml with -e work_root and NO lme_resolved_run -> refused at its first task; the raw-profile fallback does not exist'
      runner-loader-absent: 'run_integration.yml with -e work_root and NO lme_resolved_run -> refused at its first task'
      runner-work-root-differs: 'run_acceptance.yml with lme_resolved_run and a DIFFERENT -e work_root -> refused at its first task'
    refute: 'resolved-decoy-on-path would FAIL if the nested probe resolved ansible-playbook through PATH (decoy marker / decoy-ran) or ignored lme_resolved_run.work_root (identity dirs absent); each hostile variant differs from it in exactly one input'
    hostile: 'ambient executor, ambient PATH with a decoy ansible-playbook, ambient TMPDIR, malformed or absent lme_resolved_run, direct runner invocation, differing -e work_root'
    setup:
      - {mkdir: '{ctl}/wr', mode: '0700'}
      - {mkdir: '{ctl}/tmp', mode: '0700'}
      - {mkdir: '{ctl}/tmp/ansible-local', mode: '0700'}
      - {mkdir: '{ctl}/foreign-tmp', mode: '0700'}
      - {mkdir: '{ctl}/decoy', mode: '0700'}
      - {write: '{ctl}/decoy/ansible-playbook', mode: '0700', content: "#!/bin/sh\necho RHC-DECOY-EXECUTED\n: > '{ctl}/decoy-ran'\nexit 0\n"}
    variants:
      - {id: resolved-decoy-on-path}
      - {id: resolved-malformed}
      - {id: ambient-executor}
      - {id: ambient-tmpdir-conflict}
      - {id: resolved-absent}
      - {id: runner-acceptance-direct}
      - {id: runner-acceptance-absent}
      - {id: runner-loader-absent}
      - {id: runner-work-root-differs}
    steps:
      - {id: nested-resolved, only_variants: [resolved-decoy-on-path],
         # rhc_resolved_env = the record's env: absolute path values only (profile resolved_run.env_value), no PATH.
         # rhc_act_env = that env as the act's process env, plus the ambient PATH with the decoy FIRST.
         act: {kind: playbook, playbook: probe_nested, via: generation,
               env: &rhc_act_env {<<: &rhc_resolved_env {ANSIBLE_CONFIG: '{sgen}/ansible.cfg', ANSIBLE_COLLECTIONS_PATH: '{sgen}/collections',
                                                        TMPDIR: '{ctl}/tmp', ANSIBLE_LOCAL_TEMP: '{ctl}/tmp/ansible-local', XDG_CACHE_HOME: '{ctl}/wr/cache'},
                                  PATH: '{ctl}/decoy:/usr/bin:/bin'},
               extra_vars_json: &rhc_resolved_run {lme_resolved_run: {runner: acceptance, work_root: '{ctl}/wr', ansible_playbook: '{sgen}/venv/bin/ansible-playbook',
                                                                      python: '{sgen}/venv/bin/python', env: *rhc_resolved_env,
                                                                      receipt: {path: '{sreceipt}', sha256: '{sreceipt_sha256}'}}}},
         expect: {rc: 0, stdout_regex: 'RHC-NESTED-EXEC={sgen}/venv/bin/ansible-playbook RHC-NESTED-CONFIG={sgen}/ansible\.cfg RHC-NESTED-PYTHON={sgen}/venv/bin/python RHC-NESTED-WORK-ROOT={ctl}/wr',
                  stdout_not_regex: ['RHC-DECOY-EXECUTED']},
         post_state: [{path: '{ctl}/decoy-ran', exists: false}, {path: '{ctl}/wr/_executor-identity/tmp/ansible-local', exists: true},
                      {path: '{ctl}/wr/_executor-identity/tmp/ansible-remote', exists: true}]}
      - {id: nested-resolved-malformed, only_variants: [resolved-malformed],
         act: {kind: playbook, playbook: probe_nested, via: generation, env: *rhc_act_env,
               extra_vars_json: {lme_resolved_run: {runner: acceptance, work_root: '{ctl}/wr', ansible_playbook: '{sgen}/venv/bin/ansible-playbook',
                                                    python: '{sgen}/venv/bin/python', env: *rhc_resolved_env,
                                                    receipt: {path: '{sreceipt}', sha256: '{sreceipt_sha256}'}, executor_path: '{ctl}/decoy'}}},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Refuse an absent or malformed resolved run, or pre-supplied binding outputs (RH-RUNNER-RESOLVED-WORKROOT)'},
         post_state: [{path: '{ctl}/decoy-ran', exists: false}, {path: '{ctl}/wr/_executor-identity', exists: false}]}
      - {id: nested-ambient-executor, only_variants: [ambient-executor],
         act: {kind: playbook, playbook: probe_nested, via: builder_ambient, env: *rhc_act_env, extra_vars_json: *rhc_resolved_run},
         expect: {rc_nonzero: true, playbook_refusal: RH-NESTED-PROBE-EXECUTOR, refused_at: Bind this play and the nested probe executor to the resolved run (RH-NESTED-PROBE-EXECUTOR)},
         post_state: [{path: '{ctl}/decoy-ran', exists: false}, {path: '{ctl}/wr/_executor-identity', exists: false}]}
      - {id: nested-ambient-tmpdir, only_variants: [ambient-tmpdir-conflict],
         act: {kind: playbook, playbook: probe_nested, via: generation, env: {<<: *rhc_act_env, TMPDIR: '{ctl}/foreign-tmp'},
               extra_vars_json: *rhc_resolved_run},
         expect: {rc_nonzero: true, playbook_refusal: RH-NESTED-PROBE-EXECUTOR, refused_at: Bind this play and the nested probe executor to the resolved run (RH-NESTED-PROBE-EXECUTOR)},
         post_state: [{path: '{ctl}/wr/_executor-identity', exists: false}]}
      - {id: nested-resolved-absent, only_variants: [resolved-absent],
         act: {kind: playbook, playbook: probe_nested, via: generation, env: *rhc_act_env},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Refuse an absent or malformed resolved run, or pre-supplied binding outputs (RH-RUNNER-RESOLVED-WORKROOT)'},
         post_state: [{path: '{ctl}/wr/_executor-identity', exists: false}]}
      - {id: acceptance-direct, only_variants: [runner-acceptance-direct],
         act: {kind: playbook, playbook: acceptance, via: generation, env: *rhc_act_env},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Require the resolved run and bind work_root to it (RH-RUNNER-RESOLVED-WORKROOT; no raw-profile fallback)'},
         post_state: [{path: '{ctl}/decoy-ran', exists: false}, {path: '{ctl}/wr/_executor-identity', exists: false}]}
      - {id: acceptance-resolved-absent, only_variants: [runner-acceptance-absent],
         act: {kind: playbook, playbook: acceptance, via: generation, env: *rhc_act_env, extra_vars: {work_root: '{ctl}/raw'}},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Require the resolved run and bind work_root to it (RH-RUNNER-RESOLVED-WORKROOT; no raw-profile fallback)'},
         post_state: [{path: '{ctl}/raw', exists: false}]}
      - {id: loader-resolved-absent, only_variants: [runner-loader-absent],
         act: {kind: playbook, playbook: loader_integration, via: generation, env: *rhc_act_env, extra_vars: {work_root: '{ctl}/raw'}},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Require the resolved run and bind work_root to it (RH-RUNNER-RESOLVED-WORKROOT; no raw-profile fallback)'},
         post_state: [{path: '{ctl}/raw', exists: false}]}
      - {id: acceptance-work-root-differs, only_variants: [runner-work-root-differs],
         act: {kind: playbook, playbook: acceptance, via: generation, env: *rhc_act_env, extra_vars: {work_root: '{ctl}/raw'}, extra_vars_json: *rhc_resolved_run},
         expect: {rc_nonzero: true, playbook_refusal: RH-RUNNER-RESOLVED-WORKROOT, refused_at: 'Require the resolved run and bind work_root to it (RH-RUNNER-RESOLVED-WORKROOT; no raw-profile fallback)'},
         post_state: [{path: '{ctl}/raw', exists: false}, {path: '{ctl}/wr/_executor-identity', exists: false}]}
    note: 'Not a full-runner positive run: a real acceptance/loader run writes the committed receipt and runs every case; that leg is MAIN''s `seed run-local` execution against the route author''s lme_resolved_run producer. The positive binding path here is receipt consistency under via: generation (no seed verify ran). The scrub tool is /usr/bin/env (the contract carries no env-tool field).'
