         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "_rh_bnd_stat.results[3].stat.mode == rh.controller.bootstrap.bundle.launcher_mode"']},
                  seed-layer-launcher: {refusal: RH-SEED-ARTIFACT-MISSING, stderr_has: ['bundle members/modes are not exactly the declared set']}}}
      - {id: cf-reorder, tokens: {fx_case: cf-reorder},
