      variant; no credit). agent-unset / agent-not-socket are A01 (the launcher carries SSH_AUTH_SOCK="" / the ambient value and the
      seed refuses RH-SEED-AUTH). run-local-set (codex 225207) is the run-local leg of other-modes-set: BUILT-UNRUN, QUEUED on
