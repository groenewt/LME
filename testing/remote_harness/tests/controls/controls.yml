  - id: Y03-early-full-parity-and-neutrality
    cases: [C18-resolver-projection]
    findings: [SEED-06, SEED2-PROJECTION-AND-CONSUMERS]
    requires: [seed06_projection, c1_consumer_entrypoints, baseline_repo]
    interface:   # C1 claude-C1-SEED-06-projection-source-ready-20260924-0117 (Q-C1-NEUTRALITY); declared, not bound to C1 clone bytes
      early_resolve: {include_role: podman, tasks_from: resolve}
      full_load: {include_role: podman, tasks_from: load_manifests}
      compared_facts: [lme_resolved, lme_resolved_revision, lme_services, lme_global, lme_enable_flags, lme_host_rendered_services,
                       lme_service_kinds, lme_runtime_inventory, _lme_declared_service_ids, lme_host_services]
