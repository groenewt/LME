         expect: {refusal: RH-SEED-USAGE, stderr_has: ['run-local needs a root under <checkout>/.work/: {home}/lme-rhc-no-work-anchor']},
         post_state: [{path: '{home}/lme-rhc-no-work-anchor', exists: false}]}
      - {id: not-toolchain, only_variants: [not-toolchain],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', acceptance]},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['run-local needs --root exactly <checkout>/.work/toolchain, not {ctl}/toolchain']},
