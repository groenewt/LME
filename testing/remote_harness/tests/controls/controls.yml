  - id: seed.launcher.ambient-env
    cases: [E83-seed-launcher-ambient-env]
    findings: [LAUNCHER-SEQUENCING]
    requires: [bundle_a, shared_root]
    root: shared
    evidence: {bind_source_sha256: [testing/remote_harness/templates/lme-seed-launcher.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2]}
    rows:
      ambient: 'E83 verify through the launcher with PATH=<shadow dir>:..., LC_ALL=POSIX, LANG unset, XDG_RUNTIME_DIR=/nonexistent,
        DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent, USER=nobody, HOME=/'
      clean: 'E83 the same verify with the runner''s ordinary environment'
      args-space: 'E83 run-local <toolchain root> acceptance -e ''x=a b'' (one word with a space)'
      args-empty: 'E83 run-local <toolchain root> acceptance -e '''' (an empty word)'
      relative: 'E83 the launcher invoked by a relative path'
      count: 'E83 apply with an extra word; run without the ssh auth mode -- BUILT in A01-auth-mode-usage (apply-with-mode, no-mode)'
    refute: 'a launcher that inherits the ambient PATH / locale / HOME makes the seed refuse RH-SEED-USAGE (ambient FAILS) or runs a
      shadow tool (the marker appears); one that word-splits or evals "$@" refuses naming x (value a) differently or drops the empty
      word (args FAIL); one that resolves a relative $0 reaches realpath / the seed (relative FAILS: other refusal or execve seen)'
    hostile: 'a hostile invoking environment (shadow tools first on PATH, POSIX locale, foreign XDG / DBUS / USER / HOME) and words that
      a shell would split or drop'
    setup: [{mkdir: '{ctl}/shadow', mode: '0700'},
            {write: '{ctl}/shadow/id', content: "#!/bin/sh\n: > '{ctl}/shadow-ran'\nexit 97\n", mode: '0700'},
            {write: '{ctl}/shadow/env', content: "#!/bin/sh\n: > '{ctl}/shadow-ran'\nexit 97\n", mode: '0700'},
            {write: '{ctl}/shadow/getent', content: "#!/bin/sh\n: > '{ctl}/shadow-ran'\nexit 97\n", mode: '0700'},
            {write: '{ctl}/shadow/realpath', content: "#!/bin/sh\n: > '{ctl}/shadow-ran'\nexit 97\n", mode: '0700'}]
    variants:
      - {id: ambient, case_components: {E83-seed-launcher-ambient-env: [ambient]}}
      - {id: clean, case_components: {E83-seed-launcher-ambient-env: [clean]}}
      - {id: args-space, case_components: {E83-seed-launcher-ambient-env: [args]}}
      - {id: args-empty, case_components: {E83-seed-launcher-ambient-env: [args]}}
      - {id: relative, case_components: {E83-seed-launcher-ambient-env: [relative]}, ops: [{copy_tree: {from: '{bundle_a}', to: '{ctl}/bundle'}}]}
    steps:
      - {id: ambient, only_variants: [ambient],
         act: {kind: seed, bundle: a, op: verify, root: '{shared}', trace_exec: true, unset_env: [LANG],
               env: {PATH: '{ctl}/shadow:/usr/bin:/bin', LC_ALL: POSIX, XDG_RUNTIME_DIR: /nonexistent, DBUS_SESSION_BUS_ADDRESS: 'unix:path=/nonexistent',
                     USER: nobody, HOME: /}},
         expect: {rc: 0, outcome: VERIFIED, gen: expected_a, no_exec_regex: ['[^"]*/shadow/']},
         post_state: [{path: '{ctl}/shadow-ran', exists: false}]}
      - {id: clean, only_variants: [clean], act: {kind: seed, bundle: a, op: verify, root: '{shared}'},
         expect: {rc: 0, outcome: VERIFIED, gen: expected_a}}
      - {id: args-space, only_variants: [args-space],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', acceptance, '--', '-e', 'x=a b']},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['run-local: extra-var x value holds a character outside run_local.caller_vars.value_chars']},
         post_state: [{path: '{ctl}/toolchain', exists: false}]}
      - {id: args-empty, only_variants: [args-empty],
         act: {kind: seed, bundle: a, op: run-local, root: '{ctl}/toolchain', args: ['--runner', acceptance, '--', '-e', '']},
         expect: {refusal: RH-SEED-USAGE, stderr_regex: 'run-local: unsupported extra-var form \(<name>=<value> or \{"<name>":\[\.\.\.\]\} / \{"<name>":\{\.\.\.\}\} only; no @file, YAML or multi-key mapping\): $'},
         post_state: [{path: '{ctl}/toolchain', exists: false}]}
      - {id: relative, only_variants: [relative],
         act: {kind: seed, bundle: '{ctl}/bundle', op: verify, root: '{shared}', launcher_path: '../bundle/lme-seed-launch.sh', trace_exec: true},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['seed launcher: invoke it by its absolute path (its directory is the bundle)'],
                  no_exec_regex: ['[^"]*/realpath"', '[^"]*/id"', '[^"]*/getent"', '[^"]*lme-controller-seed\.sh"']}}
    note: 'BUILT-UNRUN, controller-local, read-only verify of the shared root (run-local refuses in its caller screen before any write).
      ambient / clean: the SAME declared expectation (rc 0, VERIFIED, the expected generation) -- identical seed outcome; the shadow
      id / env / getent / realpath first on the ambient PATH are never executed (marker absent; execve trace DIAGNOSTIC only). The
      ambient values are a declared act deviation (controls.j2 seed_launch: <runner_tools.env> -u LANG NAME=value ... <launcher>, no
      -i), after the act''s own scope + timeout, so the user manager call is unaffected. args: the value check of the seed''s
      run_local.caller_vars screen names the NAME (x), not the value; a split word would leave x=a (admitted) and a stray b, so the
      refusal naming x proves the space stayed inside one word; the empty word reaches the unsupported-form branch, whose message
      ends with the word itself (empty: the line ends after ": "). relative: `../bundle/<launcher>` from the act cwd {ctl}/cwd (a
      path WITH a slash: no PATH lookup) -- the launcher''s FIRST check refuses before realpath (no realpath / id / getent / seed
      execve). count (apply + extra word; run without the ssh auth mode) is A01-auth-mode-usage. Stated limit (lifecycle E83
      note): the launcher''s own pre-exec tool calls and shell startup run in the caller environment (LD_PRELOAD /
      LD_LIBRARY_PATH / shell startup variables still reach them); only the final env -i clears them for the seed -- no isolation
      from a hostile process environment is claimed. E83 stays PARTIAL until run. JOIN WITH B (testing/e2e/transfer/controls/CASES.yml,
      owner B; not duplicated): C26 / C28-C34 are B''s static refusals of the GATE script''s seed / launcher call shapes (direct seed
      call, env -i literal, nameref alias, split call, relative launcher, extra statement, call shape, unquoted argument) and C27a /
      C27b / C35 B''s argv / environment construction proof of the gate caller with a recording stand-in seed (hostile ambient with and
      without the carried agent; wrong HOME caught by the passwd oracle). G judges the launcher itself from G''s runner against the
      real seed (E83 here, E84 socket-carry); no G control credits a C case and no B case credits an E row.'

  - id: seed.launcher.socket-carry
    cases: [E84-seed-launcher-socket-carry]
    findings: [LAUNCHER-SEQUENCING]
    requires: [bundle_a, shared_root]
    root: shared
    evidence: {bind_source_sha256: [testing/remote_harness/templates/lme-seed-launcher.sh.j2, testing/remote_harness/templates/macros/controller_seed.j2,
                                    testing/remote_harness/tests/run_probe_env.yml, manifests/profiles/remote-harness.yml]}
    setup: [{write: '{ctl}/rhc-not-an-agent.sock', content: '', mode: '0600'}]
    rows:
      agent-set: 'E84 run <root> agent with SSH_AUTH_SOCK = an owned agent socket -- MAIN (a live owned agent socket; TR02)'
      agent-unset: 'E84 run <root> agent with SSH_AUTH_SOCK unset -- BUILT in A01-auth-mode-usage (agent-unset)'
      explicit-key-set: 'E84 run <root> explicit_key with SSH_AUTH_SOCK set: absent from the playbook environment'
      other-modes-set: 'E84 apply / verify / run-local with SSH_AUTH_SOCK set. run-local: BUILT-UNRUN (variant run-local-set, codex
        225207: the declared route runner run_local.runners.probe_env through `seed run-local`; names-only env.json). apply / verify:
        NOT BUILT (they exec no playbook; their evidence is the static rendered launcher, which no G check reads yet)'
