                          stdout_has: ['"assertion": "_rh_bnd_stat.results[3].stat.mode == rh.controller.bootstrap.bundle.launcher_mode"']},
                  seed-layer: {refusal: RH-SEED-ARTIFACT-MISSING, stderr_has: ['bundle members/modes are not exactly the declared set: {ctl}/bundle']}}}
      # kept QUEUED on the retired Route 2 input (history); E82 swapped is now BUILT in seed.launcher.clone-launcher-change
      # (Route 3 clone + catalog launcher-bytes), which carries the same case component
      - {id: swapped, requires: [e82_swapped_profile_copy], case_components: {E82-seed-launcher-membership: [swapped]}}
    setup: [{copy_tree: {from: '{bundle_a}', to: '{ctl}/bundle'}}]
    steps:
      - {id: snap, snapshot: {name: pre, of: '{ctl}', include_regex: ['^bundle( |/)']}}
      # codex 234857 content readback: the digest-bearing tree of the class copy before and after the admission
      - {id: bundle-tree-pre, tree: {name: bundle-pre, of: '{ctl}/bundle'}}
      # controller admission (play 1 only: --limit localhost; t1 is the controller's own class, so rh_bundle_dir IS its class dir)
      - {id: admit, act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
                          inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1}}}
      - {id: bundle-tree-post, tree: {name: bundle-post, of: '{ctl}/bundle'}}
      - {id: preserved, state: [{snapshot: pre, equal: true}, {trees: [bundle-pre, bundle-post], equal: true}]}
      # the additional seed layer: the seed started DIRECTLY by the seed_launch vector (E82 expect: "(env -i ...)"), a declared deviation
      - {id: seed-layer, act: {kind: seed, bundle: '{ctl}/bundle', op: apply, root: '{root}', invoke: seed_direct, direct_purpose: launcher_member},
         post_state: [{path: '{root}', exists: false}]}
    note: 'BUILT-UNRUN, controller-local; no target contact (play 2 never starts: --limit localhost; trace_network no_network). The
      launcher is admitted by admit_bundle.yml "Refuse a bundle that is not exactly the declared one of this class" (members, the
      launcher mode, the fresh-render digest, bundle.json launcher_sha256) BEFORE any target contact, and the class copy is
      preserved: metadata by the snapshot (never bytes), BYTES only by the digest-bearing trees bundle-pre / bundle-post (steps
      bundle-tree-pre / bundle-tree-post; codex 234857; BUILT-UNRUN). The seed layer is judged with the seed started directly (the launcher is the object under test, so it
      is not the entry). CUSTODY WORDING (lifecycle E82): the launcher runs BEFORE the seed''s own checks; a wrong launcher a
      caller executes is NOT claimed to be refused by the seed it starts -- the boundary is admission plus bundle custody.
      malformed is the appended-bytes form with the check file and bundle.json UNCHANGED: the lifecycle row''s "rewritten
      consistently" form needs a check-file line rewritten to a runtime digest, which the op vocabulary cannot express (drop_line
      + append take declared text only) -- NOT BUILT; the admission refusal is then still the fresh-render digest line. swapped
      needs the route-authored bundle fixture (codex 211654; e82_swapped_profile_copy is never met: QUEUED). positive (package,
      admit, transfer, apply through the launcher) is exercised by P01 (apply through the launcher) and the class-selection
      admission control but NOT credited here (no target transfer / apply). E82 stays PARTIAL.
      swapped is BUILT in seed.launcher.clone-launcher-change (Route 3 clone, catalog launcher-bytes).'

  # ==== ROUTE CHECKOUT FIXTURES on G's Route 3 clone (codex 211654 / 212700 / 220953 / 223100; ported from m1-1g): E82 swapped,
  # E85 launcher-change, E85 template-edit. The clone = candidate + (re-serialized) profile + the catalog edit; clone_status /
  # input_map admit it.
  - id: seed.launcher.clone-launcher-change
    cases: [E82-seed-launcher-membership, E85-seed-launcher-unchanged-reuse]
    case_components: {E82-seed-launcher-membership: [swapped], E85-seed-launcher-unchanged-reuse: [launcher-change, template-edit]}
    findings: [LAUNCHER-SEQUENCING, codex-211654-ROUTE-FIXTURES]
    requires: [bundle_a, shared_root, seed06_projection, r3g_per_class, route_checkout_fixture]
    variant_checkout: clone
    evidence: {bind_source_sha256: [testing/remote_harness/tasks/fixture_checkout.yml, testing/remote_harness/tasks/fixture_checkout_edit.yml,
                                    testing/remote_harness/tests/bundle_fixtures.yml, testing/remote_harness/tasks/admit_bundle.yml,
                                    testing/remote_harness/tasks/package_bundle.yml, testing/remote_harness/templates/lme-seed-launcher.sh.j2,
                                    testing/remote_harness/templates/macros/controller_seed.j2]}
    rows:
      launcher-bytes: 'E82 swapped + E85 launcher-change: catalog launcher-bytes (a comment line of the RENDERED launcher inside macro
        seed_launcher of controller_seed.j2); package FROM THE CLONE publishes a self-consistent bundle; the CANONICAL checkout''s
        admission refuses it at the fresh-render launcher assertion; packaged into a destination holding the canonical bundle it is
        refused and the old bytes are kept'
      launcher-template-comment: 'E85 template-edit: catalog launcher-template-comment (a Jinja-comment edit of
        templates/lme-seed-launcher.sh.j2: the rendered launcher is byte-identical, the manifest differs); packaged FROM THE CLONE into
        the destination holding the canonical bundle it is refused and the old bytes are kept'
    refute: 'a producer that did not change the launcher render (launcher-bytes) leaves the canonical admission admitting the clone
      bundle -> the admit refusal FAILS; a package_bundle.yml that overwrote a different bundle at its destination publishes -> the
      destination refusal and the snapshot FAIL; a clone differing anywhere else is refused by the clone admission (clone_status /
      input_map) before any step'
    hostile: 'a launcher produced from another checkout offered to the canonical admission; a different bundle packaged over a published one'
    variants:
      - {id: launcher-bytes, declaration: launcher_bytes, case_components: {E82-seed-launcher-membership: [swapped], E85-seed-launcher-unchanged-reuse: [launcher-change]}}
      # G-E84-PARTIAL-WHOLE-CREDIT audit: a variant's case_components REPLACES the control's, so without the explicit
      # E82 [] this variant's PASS named E82 (in cases) with no entry = WHOLE E82 credit; it credits no E82 component
      - {id: launcher-template-comment, declaration: launcher_template_comment, case_components: {E82-seed-launcher-membership: [], E85-seed-launcher-unchanged-reuse: [template-edit]}}
    setup: [{copy_tree: {from: '{bundle_a}', to: '{ctl}/canon'}}]
    steps:
      # E82 swapped (catalog expect E82-swapped): the clone's own package admits its own fresh render and publishes
      - {id: package, act: {kind: package, repo: variant, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: bound, state: [{file: '{ctl}/bundle/bundle.json', json_equal: {path: source.checkout, value: '{vclone}'}}]}
      - {id: changed-render, only_variants: [launcher-bytes], state: [{file: '{ctl}/bundle/lme-seed-launch.sh', contains: '(fixture launcher-bytes: a launcher-only change)'}]}
      - {id: same-render, only_variants: [launcher-template-comment], state: [{same_bytes: ['{ctl}/bundle/lme-seed-launch.sh', '{bundle_a}/lme-seed-launch.sh']}]}
      # ... and the CANONICAL checkout's controller admission (play 1 only, --limit localhost; no target contact) refuses it
      - {id: admit, only_variants: [launcher-bytes],
         act: {kind: playbook, playbook: target_bootstrap, via: seed_run, root: '{shared}', bundle: a, limit: localhost, trace_network: true,
               inventory_extra: {rh_bundle_dir: '{ctl}/bundle'}, inventory_targets: {t1: *t1}},
         expect: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                  stdout_has: ['rh.controller.bootstrap.seed_launcher.template_rel']}}
      # E85 launcher-change / template-edit: package FROM THE CLONE into the destination holding the canonical bundle
      - {id: snap, snapshot: {name: canon, of: '{ctl}', include_regex: ['^canon( |/)']}}
      # codex 234857 content readback: the DIGEST-bearing tree of the canonical copy before and after the refused overwrite
      # (relpath, type, mode, sha256 of every regular file; tasks/tree.yml). The metadata snapshot alone never proves bytes.
      - {id: canon-tree-pre, tree: {name: canon-pre, of: '{ctl}/canon'}}
      - {id: over-canonical, act: {kind: package, repo: variant, dest: '{ctl}/canon'},
         expect: {rc_nonzero: true, playbook_refusal: RH-BUILDER-UNSUPPORTED, refused_at: Refuse a destination that holds a different bundle}}
      - {id: canon-tree-post, tree: {name: canon-post, of: '{ctl}/canon'}}
      - {id: canon-preserved, state: [{snapshot: canon, equal: true}, {trees: [canon-pre, canon-post], equal: true}]}
      - {id: drop, ops: [{remove: '{ctl}/bundle'}]}
    note: 'BUILT-UNRUN, controller-local (no root is installed; no target contact: --limit localhost, trace_network no_network).
      Expectations are the catalog''s (tests/bundle_fixtures.yml checkout_cases launcher-bytes E82-swapped / E85-launcher-change,
      launcher-template-comment E85-template-edit). The seed-layer claim of E82 swapped is none (the launcher runs before the seed).
      E85 same stays with P02 (E17 / E85 same). The template-comment render equality is asserted (same_bytes against bundle A''s
      launcher); for launcher-bytes the seed bytes are expected unchanged (the edit lies in macro seed_launcher, which the seed
      template never calls) -- NOT ASSERTED (no G predicate compares bundle.json seed_sha256; UNRUN, no retained observation).
      OLD-BYTE PRESERVATION (codex 234857; rows "the old bytes are kept"): canon-preserved compares the metadata snapshot (path,
      type, mode, size, uid, mtime, link -- NEVER bytes) AND the digest-bearing trees canon-pre / canon-post (steps canon-tree-pre /
      canon-tree-post; sha256 of every regular file, both variants): only the trees claim byte preservation, and an absent or empty
      tree never meets equality. BUILT-UNRUN: no run has observed either tree.'

