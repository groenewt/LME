      - {id: preserved, state: [{snapshot: pre, equal: true}]}
      - {id: drop, ops: [{remove_glob: {dir: '{ctl}', pattern: 'bundle*'}}]}

  # ---- E50 through C1's resolution (package.yml, localhost only): the four accepted forms and the refused ones ----
  - id: package.resolve.endpoint-forms
    cases: [E50-inventory-common-args-accepted-forms, E39-target-endpoint-collision]
    findings: [ACCEPTED-FORMS, C1-EFFECTIVE-ENDPOINT-BINDING, PORT-COMPOSITION-CONSISTENCY]
    requires: [bundle_a, seed06_projection, r3g_accepted_forms]
    evidence: {bind_source_sha256: [manifests/profiles/remote-harness.yml, ansible/roles/podman/filter_plugins/lme_manifests.py, manifests/global.yml]}
    rows:
      accepted-forms: 'E50 positives through C1: absent, empty, the host mode''s args exactly, -o ProxyJump=<jump> -> resolved, PUBLISHED'
      proxycommand: 'E50 negative (C1): ProxyCommand'
      other-option: 'E50 negative (C1): any other -o option'
      other-mode-args: 'E50 negative (C1): another mode''s args'
      mode-plus-jump: 'E50 negative (C1): the mode args plus a ProxyJump clause'
      jump-plus-option: 'E50 negative (C1): ProxyJump plus another option'
      jump-space: 'E50 negative (C1): a ProxyJump value with a space'
      trailing-space: 'E50 negative (C1): trailing whitespace'
      lone-space: 'E50 negative (C1): lone whitespace'
      invalid-port: 'E39 invalid-port through C1: an ansible_port outside explicit_regex / explicit_max'
    refute: 'accepted-forms with t4''s ProxyJump value containing a space -> C1 refuses -> rc != 0 -> FAILS; any negative given the exact mode args -> PUBLISHED -> FAILS'
    hostile: 'inventory ssh_common_args smuggling ProxyCommand / extra options past the declared forms'
    variants:
      - {id: accepted-forms}
      - {id: proxycommand, tokens: {form: '-o ProxyCommand=/usr/bin/nc 192.0.2.99 22'}}
      - {id: other-option, tokens: {form: '-o StrictHostKeyChecking=no'}}
      - {id: other-mode-args, tokens: {form: '-o IdentityAgent=none -o IdentitiesOnly=yes'}}
      - {id: mode-plus-jump, tokens: {form: '-o IdentityAgent=none -o PubkeyAuthentication=no -o ProxyJump=jump.example'}}
      - {id: jump-plus-option, tokens: {form: '-o ProxyJump=jump.example -o Port=2222'}}
      - {id: jump-space, tokens: {form: '-o ProxyJump=jump example'}}
      - {id: trailing-space, tokens: {form: '-o ProxyJump=jump.example '}}
      - {id: lone-space, tokens: {form: ' '}}
      - {id: invalid-port}
    steps:
      - {id: accepted, only_variants: [accepted-forms],
         act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: *t1, t2: {<<: *t2, ansible_ssh_common_args: ''}, t3: {<<: *t3, ansible_ssh_common_args: *f_mode_args},
                                                                         t4: {<<: *t4, ansible_ssh_common_args: '-o ProxyJump=jump.example'}}},
         expect: {rc: 0, stdout_has: [PUBLISHED], stdout_not_regex: ['none of the declared accepted inventory forms']},
         post_state: [{same_bytes: ['{ctl}/bundle/bundle.sha256', '{bundle_a}/bundle.sha256']}]}
      - {id: refused-form, skip_variants: [accepted-forms, invalid-port],
         act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: {<<: *t1, ansible_ssh_common_args: '{form}'}}},
         expect: {rc_nonzero: true, stdout_regex: 'none of the declared accepted inventory forms', failed_before_task: Admit exactly the declared builder before any write},
         post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: refused-port, only_variants: [invalid-port],
         act: {kind: package, dest: '{ctl}/bundle', inventory_targets: {t1: {<<: *t1, ansible_port: 70000}}},
         expect: {rc_nonzero: true, stdout_regex: 'is not an explicit port by the declared rule', failed_before_task: Admit exactly the declared builder before any write},
         post_state: [{path: '{ctl}/bundle', exists: false}]}
      - {id: drop, only_variants: [accepted-forms], ops: [{remove: '{ctl}/bundle'}]}
    note: 'C1 binds binding.deployment.endpoints from the ONE declared rule (lme_manifests.py _rh_endpoint): the first accepted form whose test
      holds, else ValueError "none of the declared accepted inventory forms" at the ENGINE resolve (not a route refusal code; judged by rc,
      that message and no later task header). ROUTE consumer legs (target_bootstrap.yml rh_conn + admit_transport.yml task 1) are
      target.admit.precontact-refused; B consumer legs are B''s (b_consumer_forms) and TR01''s static form equality'

