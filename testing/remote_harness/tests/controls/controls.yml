                             {file: '{shared}/active-generation', contains: '{gen_id}'}]}
      - {id: controller, act: {kind: playbook, playbook: controller, via: seed_run, root: '{shared}', bundle: a}, expect: {rc: 0, refused_at: null}}
      - {id: verify, act: {kind: seed, bundle: a, op: verify, root: '{shared}'}, expect: {rc: 0, outcome: VERIFIED, gen: expected_a}}

  - id: P02-unchanged-reapply
    cases: [T02-unchanged-reapply]
    findings: [SEED-03]
    requires: [shared_root]
    root: shared
    steps:
      - {id: before, snapshot: {name: s0, of: '{shared}', exclude_regex: ['^operations\.log ', '^check/', '^check ', '^run/', '^run ']}}
      - {id: apply, act: {kind: seed, bundle: a, op: apply, root: '{shared}'}, expect: {rc: 0, outcome: UNCHANGED, gen: expected_a}}
      - {id: after, state: [{snapshot: s0, equal: true}, {file: '{shared}/operations.log', regex: '^unchanged [0-9TZ-]+ {gen_id}$'}]}

  - id: P03-purge-then-cold-rebuild
    cases: [T28-purge-rebuild, C22-purge-then-cold, E01-purge-complete-owned, E02-purge-repeat]
    findings: [SEED-08, SEED2-PURGE-OWNERSHIP]
    requires: [bundle_a]
    root: fresh
    steps:
      - {id: install, act: {kind: seed, bundle: a, op: apply, root: '{root}'}, expect: {rc: 0, outcome: INSTALLED, gen: expected_a}}
      - {id: a-run, act: {kind: playbook, playbook: controller, via: seed_run, root: '{root}', bundle: a}, expect: {rc: 0}}
      - {id: a-verify, act: {kind: seed, bundle: a, op: verify, root: '{root}'}, expect: {rc: 0, outcome: VERIFIED}}
      # WORK ROOT (route 814cf6a admit_storage): apply/verify admit W = the root's parent ({parent}) and create nothing there;
      # `seed run` anchors W at <checkout>/.work (through the LAST /.work/ of the root, checkout bound to bundle.json) and
      # creates the declared sub-roots THERE ({workspace}: the run clone's .work under the run-location ruling, never the
      # authoring checkout). Purge removes the root only, so {parent} is left empty and the workspace sub-roots persist.
      - {id: purge, act: {kind: seed, bundle: a, op: purge, root: '{root}'}, expect: {rc: 0, outcome: PURGED},
         post_state: [{path: '{root}', exists: false}, {glob: {dir: '{parent}', pattern: '*', count: 0}},
                      {path: '{workspace}/cache', exists: true}, {path: '{workspace}/engine-storage', exists: true}]}
      - {id: purge-again, act: {kind: seed, bundle: a, op: purge, root: '{root}'}, expect: {rc: 0, outcome: ABSENT}}
      - {id: cold, act: {kind: seed, bundle: a, op: apply, root: '{root}'}, expect: {rc: 0, outcome: INSTALLED, gen: expected_a}}
      - {id: again, act: {kind: seed, bundle: a, op: apply, root: '{root}'}, expect: {rc: 0, outcome: UNCHANGED, gen: expected_a}}
      - {id: cold-run, act: {kind: playbook, playbook: controller, via: seed_run, root: '{root}', bundle: a}, expect: {rc: 0}}
    note: 'E01 with an abandoned incomplete generation in the purged root: every I01 phase point purges such a root after its rerun (reset step expects PURGED)'

  - id: P04-package-unchanged-needs-provenance
    cases: [E17-package-unchanged-needs-same-provenance, E85-seed-launcher-unchanged-reuse]
    # R1 LAUNCHER JOIN (ported from m1-1g): E85 `same` only (the launcher is inside the bundle identity: UNCHANGED keeps
    # bundle.sha256 -- which lists the launcher digest -- and bundle.json byte-identical); template-edit / launcher-change NOT BUILT
    case_components: {E85-seed-launcher-unchanged-reuse: [same]}
    findings: [SEED2-PACKAGE-RESERVATION, LAUNCHER-SEQUENCING]
    requires: [bundle_a]
    declaration: comment
    variant_checkout: clone   # profile_bytes_differ: never the override; the declared clone carries the re-serialized profile
    steps:
      - {id: build, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: snap, snapshot: {name: pre, of: '{ctl}/bundle'}}
      - {id: other-provenance, act: {kind: package, repo: variant, dest: '{ctl}/bundle'},
         expect: {rc_nonzero: true, playbook_refusal: RH-BUILDER-UNSUPPORTED, refused_at: Refuse a destination that holds a different bundle}}
      - {id: preserved, state: [{snapshot: pre, equal: true}, {glob: {dir: '{ctl}', pattern: '.bundle.staging.*', count: 0}}]}
      - {id: same-inputs, act: {kind: package, dest: '{ctl}/bundle'}, expect: {rc: 0, stdout_has: [UNCHANGED]}}
      - {id: same-launcher, state: [{snapshot: pre, equal: true}, {file: '{ctl}/bundle/bundle.json', json_equal: {path: launcher_file, value: lme-seed-launch.sh}},
                                    {same_bytes: ['{ctl}/bundle/lme-seed-launch.sh', '{bundle_a}/lme-seed-launch.sh']}]}
    note: 'E85 same (R1 launcher join, BUILT-UNRUN; ported from m1-1g): the unchanged re-package leaves the destination
      byte-identical (snapshot pre: type, mode, size, mtime of every member, the launcher included), bundle.json names the launcher,
      and the launcher equals bundle A''s (same declarations). The declaration `comment` variant (Route 3 clone) is E17''s other
      provenance (the destination rule, E26: REFUSED and preserved). NOT BUILT: E85 template-edit (a comment-only edit of
      templates/lme-seed-launcher.sh.j2 -- a route template; the variant route patches the PROFILE only) and launcher-change (a
      fixture profile copy changing only a non-apply mode''s mode_args order -- route-authored variant checkout per codex 211654;
      MAIN-staged copies are not a source, codex 212700); the `same` target half (target publish skipped, apply UNCHANGED
      <generation>) is not asserted here (controller package only). E85 stays PARTIAL.'

  # ---- changed seed / config / layout -> new revision ----
  - id: R01-changed-input-new-revision
    cases: [C09-revision-converges, C14-changed-canonical-pins]
    findings: [SEED-03, SEED-04]
    requires: [shared_root]
    root: shared
    variant_checkout: clone
    variants:
      - {id: cfg, declaration: cfg}
      - {id: sort-alt, declaration: sort_alt}
      - {id: budget-in, declaration: budget_in}
    steps:
      # bundle A (packaged from the run checkout) on the shared root (in the run checkout's work root): binding holds; only the
      # controller playbook is the variant clone's
      - {id: stale-controller, act: {kind: playbook, playbook: controller, via: seed_run, root: '{shared}', bundle: a, repo: variant},
         expect: {rc_nonzero: true, playbook_refusal: RH-TOOLCHAIN-RECEIPT, refused_at: Refuse a receipt that is not the expected installation of the declared root}}
      - {id: package-b, act: {kind: package, repo: variant, dest: '{ctl}/bundle-b'}, expect: {rc: 0, stdout_has: [PUBLISHED]}}
      - {id: bound-b, state: [{file: '{ctl}/bundle-b/bundle.json', contains: '"checkout": "{vclone}"'}]}
      # hostile (non-vacuity of the move): bundle B seed-run on a root in ANOTHER checkout's work root is refused before any write
      - {id: wrong-checkout, act: {kind: playbook, playbook: controller, via: seed_run, root: '{shared}', bundle: '{ctl}/bundle-b', repo: variant},
         expect: {refusal: RH-SEED-USAGE, stderr_has: ['is not the checkout this bundle was packaged from']}}
      # the revision leg runs on the clone's own root {vroot} (W = {vwork}, checkout = {vclone}): A first, then B, both retained
      - {id: apply-a-v, act: {kind: seed, bundle: a, op: apply, root: '{vroot}'}, expect: {rc: 0, outcome: INSTALLED, gen: expected_a}}
      - {id: apply-b, act: {kind: seed, bundle: '{ctl}/bundle-b', op: apply, root: '{vroot}'}, expect: {rc: 0, outcome: INSTALLED, gen: new}}
      - {id: retained, state: [{path: '{vroot}/generations/{gen_id}/COMPLETE', exists: true}, {file: '{vroot}/active-generation', lacks: '{gen_id}'}]}
      - {id: new-controller, act: {kind: playbook, playbook: controller, via: seed_run, root: '{vroot}', bundle: '{ctl}/bundle-b', repo: variant}, expect: {rc: 0}}
      - {id: old-controller, act: {kind: playbook, playbook: controller, via: seed_run, root: '{vroot}', bundle: '{ctl}/bundle-b', repo: candidate},
         expect: {rc_nonzero: true, playbook_refusal: RH-TOOLCHAIN-RECEIPT, refused_at: Refuse a receipt that is not the expected installation of the declared root}}
      - {id: back-to-a, act: {kind: seed, bundle: a, op: apply, root: '{vroot}'}, expect: {rc: 0, outcome_any: [UNCHANGED, INSTALLED], gen: expected_a}}
      - {id: purge-v, act: {kind: seed, bundle: a, op: purge, root: '{vroot}'}, expect: {rc: 0, outcome: PURGED}}
    undo: [{remove: '{ctl}/bundle-b'}]
    note: 'codex-root-boundary-ruling-and-controller-handoff-20260924-155203: seed run of bundle B (packaged from the variant clone) is admitted
      only on a root under the clone''s own work root, so the revision leg (A -> B -> back to A, every revision retained) runs on {vroot}
      instead of the shared root; wrong-checkout proves the binding refuses B on the shared root. old-controller runs the RUN checkout''s
      controller.yml under bundle B''s seed on {vroot}. purge-v uses the seed''s own purge; finish_variant.yml purges {vroot} again
      (ABSENT) before {vclone} leaves with the variant scratch'

  # ---- interruption at every boundary, then convergent reapply ----
  - id: I01-phase-kill-sweep
    cases: [T04-interrupted-setup-recovery, T23-uv-partial-interrupt, C06-interrupt-build-and-publication, E01-purge-complete-owned]
    findings: [SEED-02, SEED2-EARLY-INTERRUPTION]
