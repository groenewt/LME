      intended_diff: [lme_resolved_revision]
      predicate: 'per profile, the compared facts from the real loader on baseline and candidate trees that differ ONLY by the change
        under test: NEUTRAL-EXCEPT-INTENDED (every differing path inside intended_diff) or NOT-REACHED-PARITY (both refuse before
        resolution with the same refusal; consumer/multinode need their declared inventory); anything else is DIFFERENT (never neutral)'
      early_full_parity: 'on the candidate, early resolve and full load give the same lme_resolved.remote_harness and lme_resolved_revision'
      judge: 'macro neutrality (+ diff_paths), gate-self-tested in selftests.yml'
    declared_only: 'early resolve vs full load parity with no override, legitimate tool/path/owner/budget overrides (revision changes, value reflected), immutable override refused before mutation, registry pins (lme_global, lme_resolved, lme_resolved_revision) refused, effective declared policy and revision equal under all six existing deployment profiles vs baseline -- through C1''s actual consumer entrypoints; no host roster, no test-only resolver (codex Q-C1-NEUTRALITY). The judge (neutrality) is implemented and self-tested; the loader-dump act (a rendered playbook including the two entrypoints per profile on the baseline and candidate trees) is added when MAIN lands the C1 source and its per-profile inventory interface is in this repository'

