         expect: {admit: {rc_nonzero: true, playbook_refusal: RH-TARGET-BOOTSTRAP, refused_at: Refuse a bundle that is not exactly the declared one, no_network: true,
                          stdout_has: ['"assertion": "(_rh_bnd_sum.content | default('''') | b64decode) == _want"']},
                  seed-layer-checkfile: {refusal: RH-SEED-DIGEST-MISMATCH, stderr_has: ['bundle.sha256 is not newline-terminated']}}}
      - {id: cf-literal-newline, tokens: {fx_case: cf-literal-newline},
