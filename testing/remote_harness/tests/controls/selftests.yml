  - {id: plan-act-seed-run-explicit-key-not-carried, gate: plan_act, fn: plan_act, negative: true,
     args: [{id: s3, act: {kind: seed, bundle: a, op: run, root: /R, ssh_auth: explicit_key, args: ['--', pb.yml]}}, *act_ctx_seed], needs_route_export: true,
     expect: {search: '"run", "/R", "explicit_key", "pb\.yml"\].*"carried": ""', not_search: 'SSH_AUTH_SOCK='}}
  - {id: plan-act-seed-ambient-deviation-before-launcher, gate: plan_act, fn: plan_act, negative: false,
     args: [{id: s6, act: {kind: seed, bundle: a, op: run, root: /R, ssh_auth: agent, unset_env: [SSH_AUTH_SOCK], env: {USER: nobody}, args: ['--', pb.yml]}}, *act_ctx_seed], needs_route_export: true,
     expect: {search: '"900s", "/usr/bin/env", "-u", "SSH_AUTH_SOCK", "USER=nobody", "/b/a/lme-seed-launch\.sh", "run", "/R", "agent", "pb\.yml"\]', not_search: '"-i"'}}
  - {id: plan-act-seed-count-and-relative-deviations, gate: plan_act, fn: plan_act, negative: true,
