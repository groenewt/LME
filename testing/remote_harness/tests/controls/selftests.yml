---
# testing/remote_harness/tests/controls/selftests.yml -- self-tests of the runner's macro and regex GATES (owner: G).
# Every judgement the runner makes goes through a pure macro in templates/macros/controls.j2; these declared inputs pin
# what each gate must accept (negative: false) and, above all, what it must REJECT (negative: true). tasks/selftest.yml
# evaluates them before any planning in BOTH modes; a failing self-test is a runner defect and fails the play. Each
# gate named in `gates` needs at least one accepting and one rejecting case. The ctx below is a FIXTURE (not the
# profile): the gates are tested for their logic, independent of the candidate's declared values.
#
# expect: equals <value> (parsed result) | search <regex over the JSON text> | not_search <regex>; several may combine.
schema_version: 1
kind: lme-remote-harness-control-selftests
gates: [judge, judge_pair, failed_task, outcome, refusal, residual, xjson, network_lines, plan_status, coverage, diff_paths, neutrality, dig, plan_act, judge_state, unimplemented, variant_dep,
        writer_cmd, writer_admitted, record_readback, launcher_consumers, export_availability, export_shape,
        profile_case_patch, fixture_status_lines, clone_status, input_map]
ctx:
  rh: {controller: {bootstrap: {lock: {busy: RH-SEED-BUSY}, bundle: {staging_retention: {lease: {busy_refusal: RH-STAGING-BUSY}}}}}}
  record_refusal: {code: RHC-ACT-RECORD, rc: 86, barrier_rc: 87}
  record_readback: {timeout_s: 60, bound_rcs: [124, 137]}
  refusals: {RH-SEED-USAGE: 2, RH-SEED-BUDGET-UNAVAILABLE: 7, RH-SEED-BUSY: 15}
  t: {gen_id: G1, ctl: /h/c, staging_repeat: 3}
fixtures:
  busy: &busy {rc: 15, stdout: '', stderr: "lme-controller-seed: lock\nREFUSED RH-SEED-BUSY root held\n"}
  busy_wrong_exit: &busy_wrong_exit {rc: 1, stdout: '', stderr: "REFUSED RH-SEED-BUSY root held\n"}
  budget: &budget {rc: 7, stdout: '', stderr: "REFUSED RH-SEED-BUDGET-UNAVAILABLE no memory.max\n"}
  installed: &installed {rc: 0, stdout: "lme-controller-seed: x\nINSTALLED core219-py313 /r/generations/g\n", stderr: ''}
  pb_named: &pb_named {rc: 2, stderr: '', stdout: "TASK [Refuse missing or mismatched artifacts (offline admission; before any write)] ***\nfatal: [localhost]: FAILED! => {\"msg\": \"REFUSED RH-PACKAGE-ARTIFACT x\"}\n"}
  pb_generic: &pb_generic {rc: 2, stderr: '', stdout: "TASK [Refuse missing or mismatched artifacts (offline admission; before any write)] ***\nfatal: [localhost]: FAILED! => {\"msg\": \"boom\"}\n"}
  pb_reached_fetch: &pb_reached_fetch {rc: 2, stderr: '', stdout: "TASK [Fetch each absent row from its declared source] ***\nfatal: [localhost]: FAILED! => {\"msg\": \"REFUSED RH-ACQUIRE x\"}\n"}
  killed: &killed {rc: 137, stdout: '', stderr: ''}
  pb_staging_busy: &pb_staging_busy {rc: 2, stderr: '', stdout: "TASK [Refuse a publish that could not take the destination lock (publish fence busy; own staging and record released)] ***\nfatal: [localhost]: FAILED! => {\"msg\": \"REFUSED RH-STAGING-BUSY x\"}\n"}
  pkg_reaped: &pkg_reaped {rc: 0, stderr: '', stdout: "REAPED-STAGING localhost ['/h/c/.bundle.staging.Labc.x1'] records []\nPUBLISHED /h/c/bundle\n"}
  pkg_preserved: &pkg_preserved {rc: 0, stderr: '', stdout: "PRESERVED-UNKNOWN-STAGING localhost /h/c/.bundle.staging.Labc.x1\nREAPED-STAGING localhost [] records []\nPUBLISHED /h/c/bundle\n"}
  # minimal vocabulary for the `unimplemented` gate (the TEST-NET-1 target guard; G never reaches a real host)
  vocab_min: &vocab_min
    control_keys: [id, steps, variants]
    variant_keys: [id]
    step_common: [id, expect]
    steps: [act]
    acts: [playbook]
    act_keys: [kind, playbook, inventory_targets, extra_vars, limit]
    expect: [rc]
    predicates: []
    ops: []
    op_options: []
    waits: []
    kill_options: []
    target_address_regex: '^192\.0\.2\.([0-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-5])$'
  act_ctx: &act_ctx
    rh: {controller: {bootstrap: {base_env: {PATH: /usr/bin:/bin}}}}
    env: {HOME: /h, XDG_RUNTIME_DIR: /run/user/1, DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/1/bus'}
    tools: {env: /usr/bin/env, timeout: /usr/bin/timeout, strace: /usr/bin/strace, systemd_run: /usr/bin/systemd-run}
    t: {ctl: /h/c}
    timeouts: {command: 120, playbook: 900}
    wraps: {none: []}
    act_scope: {default: own, unit_prefix: rhc-act-}
  act_ctx_pb: &act_ctx_pb
    rh: {controller: {bootstrap: {base_env: {PATH: /usr/bin:/bin}, inventory: {},
                                  genesis: {builder: {python: /usr/bin/python3, executable: /usr/bin/ansible-playbook}}}}}
    env: {HOME: /h, XDG_RUNTIME_DIR: /run/user/1, DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/1/bus'}
    tools: {env: /usr/bin/env, timeout: /usr/bin/timeout, strace: /usr/bin/strace, systemd_run: /usr/bin/systemd-run}
    t: {ctl: /h/c}
    repo: /r
    variant_repo: ''
    rendered_playbooks: []
    entry: {acceptance: testing/acceptance/run_acceptance.yml}
    timeouts: {command: 120, playbook: 900}
    wraps: {none: []}
    act_scope: {default: own, unit_prefix: rhc-act-}
  # seed_launch + seed_launcher fixture (ported from m1-1g; RH-SEED-LAUNCH / E78 direct form; R1 launcher form E82-E85):
  # the declared shapes, fixture values only (bundle.launcher_file / launcher_mode / launcher_custody as the profile declares them)
  act_ctx_seed: &act_ctx_seed
    rh: {controller: {bootstrap: {base_env: {PATH: /usr/bin:/bin, LC_ALL: C.UTF-8}, os_tools: {env: {path: /usr/bin/env}, sh: {path: /bin/sh}},
                                  bundle: {seed_file: lme-controller-seed.sh, launcher_file: lme-seed-launch.sh, launcher_mode: '0500', launcher_custody: seed_file},
                                  seed_launcher: {template_rel: testing/remote_harness/templates/lme-seed-launcher.sh.j2, member: bundle.launcher_file,
                                                  caller_argv: ['{bundle_dir}/{bundle.launcher_file}', '{mode}', '{root}', '{mode_params}', '{args}'],
                                                  mode_params: mode_args_placeholders, carried_param: ssh_auth_mode, self_path: absolute_realpath_dirname},
                                  ssh_auth: {modes: {agent: {agent: carried, socket_env: SSH_AUTH_SOCK}, explicit_key: {agent: disabled}}},
                                  seed_launch: {argv: ['{os_tools.env.path}', '-i', '{env_pairs}', '{bundle_dir}/{bundle.seed_file}', '{mode}', '--root', '{root}', '{mode_args}'],
                                                mode_args: {apply: [], verify: [], purge: ['--confirm', '{root}'], run: ['--ssh-auth', '{ssh_auth_mode}', '--', '{args}'],
                                                            run-local: ['--runner', '{runner}', '--', '{args}']},
                                                env: {clear: true, order: [PATH, LC_ALL, HOME], base: base_env, inherited: {HOME: invoker_passwd_home},
                                                      carried: {when: {mode: run, ssh_auth_agent: carried}, name_from: ssh_auth.modes.<mode>.socket_env}}}}}}
    env: {HOME: /runner-home, XDG_RUNTIME_DIR: /run/user/1, DBUS_SESSION_BUS_ADDRESS: 'unix:path=/run/user/1/bus', SSH_AUTH_SOCK: /run/user/1/agent.sock}
    passwd_home: /home/u
    seed_run_auth_mode: agent
    bundles: {a: /b/a}
    tools: {env: /usr/bin/env, timeout: /usr/bin/timeout, strace: /usr/bin/strace, systemd_run: /usr/bin/systemd-run}
    t: {ctl: /h/c}
    timeouts: {command: 120, playbook: 900, seed_apply: 600, seed_run: 900}
    wraps: {none: []}
    act_scope: {default: shared, unit_prefix: rhc-act-}
    # launch_params: the ROUTE's export (seed_launcher.params_rel -> controller_seed.j2 launch_params) rendered with
    # THIS fixture's bootstrap by tasks/selftest.yml (codex 211754); never a literal here
    launch_params_from: route_export
    vocab: {direct_purposes: [seed_refusal, launcher_member]}
  # the same fixture with NO route export (launch_params absent): the absence case
  act_ctx_seed_noexport: &act_ctx_seed_noexport
    <<: *act_ctx_seed
    launch_params_from: none
  # G-LAUNCHER-CARRIED-PARAM-RENAME (codex 210509): C1's admitted consistent rename (cases-c1-contract-admission.yml
  # "variation: a renamed carried parameter, consistent in mode_args.run and carried_param, is admitted": mode_args.run
  # ['--ssh-auth', '{auth_mode}', '--', '{args}'] + seed_launcher.carried_param auth_mode) -- same fixture otherwise
  act_ctx_seed_renamed: &act_ctx_seed_renamed
    <<: *act_ctx_seed
    rh: {controller: {bootstrap: {base_env: {PATH: /usr/bin:/bin, LC_ALL: C.UTF-8}, os_tools: {env: {path: /usr/bin/env}, sh: {path: /bin/sh}},
                                  bundle: {seed_file: lme-controller-seed.sh, launcher_file: lme-seed-launch.sh, launcher_mode: '0500', launcher_custody: seed_file},
                                  seed_launcher: {template_rel: testing/remote_harness/templates/lme-seed-launcher.sh.j2, member: bundle.launcher_file,
                                                  caller_argv: ['{bundle_dir}/{bundle.launcher_file}', '{mode}', '{root}', '{mode_params}', '{args}'],
                                                  mode_params: mode_args_placeholders, carried_param: auth_mode, self_path: absolute_realpath_dirname},
                                  ssh_auth: {modes: {agent: {agent: carried, socket_env: SSH_AUTH_SOCK}, explicit_key: {agent: disabled}}},
                                  seed_launch: {argv: ['{os_tools.env.path}', '-i', '{env_pairs}', '{bundle_dir}/{bundle.seed_file}', '{mode}', '--root', '{root}', '{mode_args}'],
                                                mode_args: {apply: [], verify: [], purge: ['--confirm', '{root}'], run: ['--ssh-auth', '{auth_mode}', '--', '{args}'],
                                                            run-local: ['--runner', '{runner}', '--', '{args}']},
                                                env: {clear: true, order: [PATH, LC_ALL, HOME], base: base_env, inherited: {HOME: invoker_passwd_home},
                                                      carried: {when: {mode: run, ssh_auth_agent: carried}, name_from: ssh_auth.modes.<mode>.socket_env}}}}}}
    # launch_params_from: route_export (inherited): the rename reaches the canonical launch_params(words) through the export
  # record writer fixture (G-RECORD-OPEN-BEFORE-TIMEOUT; ported from m1-1g): fixture tool paths and records only
  writer_ctx: &writer_ctx
    rh: {controller: {bootstrap: {os_tools: {stat: {path: /usr/bin/stat}, sh: {path: /bin/sh}}}}}
    record_refusal: {code: RHC-ACT-RECORD, rc: 86, barrier_rc: 87}
    tools: {mkfifo: /usr/bin/mkfifo, dd: /usr/bin/dd}
    t: {uid: '1000'}
  writer_plan: &writer_plan {bound: [/usr/bin/timeout, --kill-after=10, 120s], inner: [/usr/bin/true], out: /h/c/p.stdout, err: /h/c/p.stderr, strace: '', record_barrier: []}
  writer_plan_fifo: &writer_plan_fifo {bound: [/usr/bin/timeout, --kill-after=10, 120s], inner: [/usr/bin/true], out: /h/c/p.stdout, err: /h/c/p.stderr, strace: '', record_barrier: [{fifo: out}]}
  adm_out: &adm_out {records: [{role: out, path: /h/c/p.stdout, dev: 1, ino: 2, uid: 1000}], missing: [err], stage: ''}
  st_out: &st_out {stat: {exists: true, isreg: true, islnk: false, nlink: 1, dev: 1, inode: 2, uid: 1000, size: 3, mtime: 5, ctime: 5}}
  st_out_swapped: &st_out_swapped {stat: {exists: true, isreg: true, islnk: false, nlink: 1, dev: 1, inode: 9, uid: 1000, size: 3, mtime: 5, ctime: 5}}
  deps: &deps
    d04_cold_start_ruling: {met: true, kind: ruling, value: a, why: w}
    r3e_acquisition_receipt: {met: false, kind: source, why: r3e}
    bundle_a: {met: false, kind: control, control: P01, why: c}
    main_only: {met: false, kind: main_only, why: MAIN}
    retired_dep: {met: true, kind: source, why: landed}
    bound_bytes_current: {met: true, kind: binding, why: current}   # G-CURRENT-BINDING: absent means QUEUED (no fallback)
    variant_clone_fixture: {met: false, kind: derived, why: no-clone}
    'variant:cfg': {met: true, kind: variant, why: override}
cases:
  # G-PRIVATE-PREPARE-CUSTODY (ported from m1-1g): a writer refusal meets ONLY a declared record_refused (never an rc / refusal expectation)
  - {id: judge-record-refused-expected, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{record_refused: true}, {rc: 86, record_refused: true, stdout: '', stderr: ''}], expect: {equals: []}}
  - {id: judge-record-refused-is-not-a-refusal, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc: 86}, {rc: 86, record_refused: true, stdout: '', stderr: ''}], expect: {search: 'the entrypoint never ran'}}
  - {id: judge-record-refused-not-observed, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{record_refused: true}, {rc: 86, record_refused: false, stdout: '', stderr: ''}], expect: {search: 'expected the writer to refuse'}}
  # G-RECORD-OPEN-BEFORE-TIMEOUT: a refusal stage is judged; an unadmitted record meets ONLY record_unadmitted with the bound's rc
  - {id: judge-record-refused-wrong-stage, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{record_refused: open}, {rc: 86, record_refused: true, record_refused_stage: precheck, stdout: '', stderr: ''}], expect: {search: 'expected stage open'}}
  - {id: judge-record-refused-right-stage, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{record_refused: open}, {rc: 86, record_refused: true, record_refused_stage: open, stdout: '', stderr: ''}], expect: {equals: []}}
  - {id: judge-unadmitted-bounded, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{record_unadmitted: true}, {rc: 124, record_unadmitted: ['out: never admitted'], stdout: '', stderr: ''}], expect: {equals: []}}
  - {id: judge-unadmitted-is-not-killed, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{killed: true}, {rc: 137, record_unadmitted: ['out: never admitted'], stdout: '', stderr: ''}], expect: {search: 'never read, never evidence'}}
  - {id: judge-unadmitted-needs-the-bound, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{record_unadmitted: true}, {rc: 1, record_unadmitted: ['out: never admitted'], stdout: '', stderr: ''}], expect: {search: 'is not the bound'}}
  # ---- writer_cmd: the bound wraps the writer; a barrier only when declared, after the precheck, before the create ----
  - {id: writer-cmd-bound-wraps-writer, gate: writer_cmd, fn: writer_cmd, negative: false,
     args: [*writer_plan, *writer_ctx],
     expect: {search: '^exec /usr/bin/timeout --kill-after=10 120s /bin/sh -c .*set -C.*ADMITTED RHC-ACT-RECORD out .* rhc-writer /usr/bin/true$', not_search: 'mkfifo|BARRIER-FAILED'}}
  - {id: writer-cmd-barrier-after-precheck, gate: writer_cmd, fn: writer_cmd, negative: true,
     args: [*writer_plan_fifo, *writer_ctx],
     expect: {search: 'stage=precheck err .*/usr/bin/mkfifo -m 0600 -- /h/c/p\.stdout .*BARRIER-FAILED.*_m=\$\(umask\); umask 0177; set -C'}}
  # ---- writer_admitted: the FIRST admitted line per role; a later forged line and a missing role never admit ----
  - {id: writer-admitted-both, gate: writer_admitted, fn: writer_admitted, with_ctx: true, negative: false,
     args: ["ADMITTED RHC-ACT-RECORD out 1:2:1000:1:0:regular empty file\nADMITTED RHC-ACT-RECORD err 1:3:1000:1:0:regular empty file\n", *writer_plan],
     expect: {equals: {records: [{role: out, path: /h/c/p.stdout, dev: 1, ino: 2, uid: 1000}, {role: err, path: /h/c/p.stderr, dev: 1, ino: 3, uid: 1000}], missing: [], stage: ''}}}
  - {id: writer-admitted-forged-second-line, gate: writer_admitted, fn: writer_admitted, with_ctx: true, negative: true,
     args: ["ADMITTED RHC-ACT-RECORD out 1:2:1000:1:0:regular empty file\nADMITTED RHC-ACT-RECORD out 9:9:0:1:0:regular empty file\nREFUSED RHC-ACT-RECORD: stage=open a record\n", *writer_plan],
     expect: {equals: {records: [{role: out, path: /h/c/p.stdout, dev: 1, ino: 2, uid: 1000}], missing: [err], stage: open}}}
  # ---- record_readback: read only the admitted object, unchanged across the read ----
  - {id: readback-admitted-unchanged, gate: record_readback, fn: record_readback, negative: false,
     args: [*adm_out, [*st_out], [{rc: 0, stdout: abc}], [*st_out]], expect: {equals: {text: {out: abc}, rejected: []}}}
  - {id: readback-replaced-during-read, gate: record_readback, fn: record_readback, negative: true,
     args: [*adm_out, [*st_out], [{rc: 0, stdout: abc}], [*st_out_swapped]], expect: {search: 'changed or replaced during the read', not_search: 'abc'}}
  - {id: readback-pre-stat-not-admitted, gate: record_readback, fn: record_readback, negative: true,
     args: [*adm_out, [*st_out_swapped], null, null], expect: {equals: []}}
  # ---- judge: named refusals, BUSY, kills, any_of ----
  - {id: judge-busy-expected, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{refusal: RH-SEED-BUSY, busy_expected: true}, *busy], expect: {equals: []}}
  - {id: judge-busy-unexpected-is-not-coverage, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc: 0, outcome: UNCHANGED}, *busy], expect: {search: 'BUSY-not-coverage'}}
  - {id: judge-budget-unavailable-never-busy, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{refusal: RH-SEED-BUSY, busy_expected: true}, *budget], expect: {search: 'refusal RH-SEED-BUDGET-UNAVAILABLE != RH-SEED-BUSY'}}
  - {id: judge-named-refusal-needs-declared-exit, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{refusal: RH-SEED-BUSY, busy_expected: true}, *busy_wrong_exit], expect: {search: 'exit 1 != declared RH-SEED-BUSY'}}
  - {id: judge-named-playbook-refusal, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{rc_nonzero: true, playbook_refusal: RH-PACKAGE-ARTIFACT, refused_at: Refuse missing or mismatched artifacts}, *pb_named], expect: {equals: []}}
  - {id: judge-generic-fatal-is-not-a-named-refusal, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc_nonzero: true, playbook_refusal: RH-PACKAGE-ARTIFACT, refused_at: Refuse missing or mismatched artifacts}, *pb_generic],
     expect: {search: 'no \\"REFUSED RH-PACKAGE-ARTIFACT\\"'}}
  - {id: judge-failed-before-task-reached, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc_nonzero: true, playbook_refusal: RH-ACQUIRE, failed_before_task: Fetch each absent row from its declared source}, *pb_reached_fetch],
     expect: {search: 'reached \\"Fetch each absent row'}}
  - {id: judge-kill-unexpected, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc_nonzero: true}, *killed], expect: {search: 'timed out or killed'}}
  - {id: judge-outcome-and-new-generation, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{rc: 0, outcome: INSTALLED, gen: new}, *installed], expect: {equals: []}}
  - {id: judge-generation-must-change, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc: 0, outcome: INSTALLED, gen: expected_a}, *installed], expect: {search: 'generation core219-py313 != bundle A G1'}}
  - {id: judge-any-of-met, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{any_of: [{rc: 0}, {refusal: RH-SEED-BUSY, busy_expected: true}]}, *busy], expect: {equals: []}}
  - {id: judge-any-of-none-met, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{any_of: [{rc: 0}, {playbook_refusal: RH-STAGING-BUDGET}]}, *pb_named], expect: {search: 'none of 2 alternatives met'}}
  - {id: judge-stdout-regex-miss, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{stdout_regex: '^PUBLISHED '}, *installed], expect: {search: 'stdout does not match'}}
  - {id: judge-staging-busy-unexpected-is-not-coverage, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc_nonzero: true, playbook_refusal: RH-STAGING-BUSY}, *pb_staging_busy], expect: {search: 'BUSY-not-coverage: the playbook refused RH-STAGING-BUSY'}}
  - {id: judge-staging-busy-expected, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{rc_nonzero: true, playbook_refusal: RH-STAGING-BUSY, busy_expected: true}, *pb_staging_busy], expect: {equals: []}}
  - {id: judge-stdout-not-regex-reaped-named-entry, gate: judge, fn: judge, with_ctx: true, negative: true,
     args: [{rc: 0, stdout_not_regex: ['^REAPED-STAGING .*/h/c/\.bundle\.staging\.Labc\.x1']}, *pkg_reaped], expect: {search: 'stdout matches forbidden'}}
  - {id: judge-stdout-not-regex-preserved-ok, gate: judge, fn: judge, with_ctx: true, negative: false,
     args: [{rc: 0, stdout_regex: '^PRESERVED-UNKNOWN-STAGING .*/h/c/\.bundle\.staging\.Labc\.x1', stdout_not_regex: ['^REAPED-STAGING .*/h/c/\.bundle\.staging\.Labc\.x1']}, *pkg_preserved],
     expect: {equals: []}}
  # ---- judge_pair ----
  - {id: pair-one-published-other-unchanged, gate: judge_pair, fn: judge_pair, with_ctx: true, negative: false,
     args: [{steps: [a, b], one_of: {rc: 0, outcome: INSTALLED}, other_any: [{refusal: RH-SEED-BUSY}]}, {a: *installed, b: *busy}], expect: {equals: []}}
  - {id: pair-both-met-is-not-serialized, gate: judge_pair, fn: judge_pair, with_ctx: true, negative: true,
     args: [{steps: [a, b], one_of: {rc: 0, outcome: INSTALLED}, other_any: [{refusal: RH-SEED-BUSY}]}, {a: *installed, b: *installed}], expect: {search: 'both did'}}
  # ---- parsers ----
  - {id: failed-task-last-header-before-fatal, gate: failed_task, fn: failed_task, negative: false,
     args: ["TASK [A] ***\nok: [localhost]\nTASK [Refuse B (x)] ****\nfatal: [localhost]: FAILED!\n"], expect: {equals: 'Refuse B (x)'}}
  - {id: failed-task-none-without-fatal, gate: failed_task, fn: failed_task, negative: true,
     args: ["TASK [A] ***\nok: [localhost]\nTASK [B] ***\nok: [localhost]\n"], expect: {equals: ''}}
  - {id: outcome-line, gate: outcome, fn: outcome, negative: false,
     args: ["x\nUNCHANGED core219-py313 /r/g\n"], expect: {equals: {word: UNCHANGED, arg: core219-py313}}}
  - {id: outcome-embedded-word-is-not-an-outcome, gate: outcome, fn: outcome, negative: true,
     args: ["seed: INSTALLED core219-py313 /r/g\nnot VERIFIED here\n"], expect: {equals: null}}
  - {id: refusal-first-line, gate: refusal, fn: refusal, negative: false,
     args: ["x\nREFUSED RH-SEED-USAGE a\nREFUSED RH-SEED-BUSY b\n"], expect: {equals: RH-SEED-USAGE}}
  - {id: refusal-not-at-line-start, gate: refusal, fn: refusal, negative: true,
     args: ["x NOT REFUSED RH-SEED-BUSY\n  REFUSED RH-SEED-BUSY\n"], expect: {equals: null}}
