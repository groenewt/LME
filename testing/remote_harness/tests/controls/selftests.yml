     expect: {equals: {whole: [E77], partial: {}}}}
  # declaration: an omitted entry beside component-crediting siblings is refused; the explicit [] form is admitted
  - {id: coverage-mixed-credit-refused, gate: coverage, fn: coverage, negative: true,
