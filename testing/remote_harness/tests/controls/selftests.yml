                                                  pending_variants: {S: [apply-set, verify-set]}}}}}}
  # legitimate whole credit is kept: every declared variant of the whole-naming control PASSED
  - {id: coverage-of-whole-naming-every-variant-passed, gate: coverage, fn: coverage_of, negative: false,
     args: [[{control: W, variant: g, cases: [E25]}, {control: W, variant: m, cases: [E25]}],
            [{prefix: '', ids: [E25], variants: {E25: [a, b]}}],
            [{id: W, cases: [E25], variants: [{id: g}, {id: m}]}]],
     expect: {equals: {whole: [E25], partial: {}}}}
  # G-COMPONENT-MULTI-LEG (increment 2): a component two catalog copies credit (E77 consumer-copies = seven cf-* legs) is
  # NOT credited by one passing leg; it is credited once every leg crediting it has passed
  - {id: coverage-of-component-needs-every-leg, gate: coverage, fn: coverage_of, negative: true,
     args: [[{control: C, variant: cf-reorder, cases: [E77], case_components: {E77: [consumer-copies]}}],
            [{prefix: '', ids: [E77], variants: {E77: [positive, consumer-copies]}}],
