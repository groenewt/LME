     expect: {search: '"/b/a/lme-controller-seed\.sh", "run", "--root", "/R", "--", "pb\.yml"\]', not_search: '--ssh-auth|"agent"'}}
  # ---- codex 211754: no route export -> every seed mode unresolved (an ABSENT key, never read as zero parameters);
