  # ---- plan_act seed launches (ported from m1-1g; R1 launcher consumption, codex 192321): the bundle's generated
  # launcher by seed_launcher.caller_argv, positional, no `--` of G's, NO environment vector (no env -i, no NAME=value) ----
  - {id: plan-act-seed-apply-launcher, gate: plan_act, fn: plan_act, negative: false,
     args: [{id: s1, act: {kind: seed, bundle: a, op: apply, root: /R}}, *act_ctx_seed], needs_route_export: true,
     expect: {search: '"argv": \["/usr/bin/timeout", "--kill-after=10", "600s", "/b/a/lme-seed-launch\.sh", "apply", "/R"\]',
