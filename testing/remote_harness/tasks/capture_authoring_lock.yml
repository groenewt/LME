- name: Require source observations without caller-selected lock authority
  ansible.builtin.assert:
    that:
    - rh_ar_preseal is not defined
    - rh_ar_source_observations is mapping
    - rh_ar_source_observations | list | sort == rh_ar_contract.preseal_observation_fields | sort
    quiet: true
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.lock }}'
- name: Capture actual acquiring PID exported by the source-owned no-fork launch
  ansible.builtin.set_fact:
    _rh_ar_launch_pid: '{{ lookup(rh_ar_contract.lock.env_lookup, rh_ar_contract.lock.pid_environment) }}'
- name: Confine the process observation before any proc filesystem read
  ansible.builtin.assert:
    that:
    - _rh_ar_launch_pid is match(rh_ar_contract.lock_pid_pattern)
    quiet: true
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.lock }}'
- name: Observe independently selected root and actual inherited holder descriptor
  ansible.builtin.stat:
    path: '{{ item.path }}'
    follow: '{{ item.follow }}'
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop:
  - path: '{{ rh_ar_subject.root }}'
    follow: false
  - path: '{{ [rh_ar_contract.proc_root, _rh_ar_launch_pid, rh_ar_contract.proc_fd, rh_ar_contract.lock.fd | string] | join(rh_ar_contract.separator) }}'
    follow: true
  register: _rh_ar_entry_roots
- name: Bind real descriptor to the actual root directory before reading holder evidence
  ansible.builtin.assert:
    that:
    - (_rh_ar_entry_roots.results | first).stat.exists and (_rh_ar_entry_roots.results | first).stat.isdir and not (_rh_ar_entry_roots.results | first).stat.islnk
    - (_rh_ar_entry_roots.results | last).stat.exists and (_rh_ar_entry_roots.results | last).stat.isdir
    - (_rh_ar_entry_roots.results | first).stat.mode == rh_ar_contract.root_mode
    - (_rh_ar_entry_roots.results | first).stat.dev == (_rh_ar_entry_roots.results | last).stat.dev
    - (_rh_ar_entry_roots.results | first).stat.inode == (_rh_ar_entry_roots.results | last).stat.inode
    - (_rh_ar_entry_roots.results | first).stat.uid == (_rh_ar_entry_roots.results | last).stat.uid
    quiet: true
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.lock }}'
- name: Capture actual same-PID start and kernel flock evidence
  ansible.builtin.slurp:
    src: '{{ item }}'
  loop:
  - '{{ [rh_ar_contract.proc_root, _rh_ar_launch_pid, rh_ar_contract.proc_stat] | join(rh_ar_contract.separator) }}'
  - '{{ [rh_ar_contract.proc_root, _rh_ar_launch_pid, rh_ar_contract.proc_fdinfo, rh_ar_contract.lock.fd | string] | join(rh_ar_contract.separator) }}'
  register: _rh_ar_entry_proc
- name: Select the declared exclusive flock grammar from actual kernel bytes
  ansible.builtin.set_fact:
    _rh_ar_entry_lock_lines: '{{ ((_rh_ar_entry_proc.results | last).content | b64decode).splitlines() | select(rh_ar_contract.lock.match_test, rh_ar_contract.lock_line_pattern) | list }}'
- name: Refuse absent or ambiguous live lock ownership
  ansible.builtin.assert:
    that:
    - _rh_ar_entry_lock_lines | length == rh_ar_contract.one
    - (_rh_ar_entry_lock_lines | first).split()[rh_ar_contract.lock_word_indices.pid] == _rh_ar_launch_pid
    - (_rh_ar_entry_lock_lines | first).split()[rh_ar_contract.lock_word_indices.device_inode].rsplit(rh_ar_contract.lock_inode_separator,rh_ar_contract.one)[rh_ar_contract.one] == ((_rh_ar_entry_roots.results | last).stat.inode | string)
    quiet: true
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.lock }}'
- name: Bind observed kernel identity without a caller lock flag
  ansible.builtin.set_fact:
    _rh_ar_acquired_lock:
      kind: '{{ rh_ar_contract.lock.proof_kind }}'
      pid: '{{ _rh_ar_launch_pid }}'
      start: '{{ ((_rh_ar_entry_proc.results | first).content | b64decode).rsplit(rh_ar_contract.proc_stat_close,rh_ar_contract.one)[rh_ar_contract.one].split()[rh_ar_contract.proc_start_index] }}'
      fd: '{{ rh_ar_contract.lock.fd }}'
      device: '{{ (_rh_ar_entry_roots.results | last).stat.dev }}'
      inode: '{{ (_rh_ar_entry_roots.results | last).stat.inode }}'
      fdinfo_line: '{{ _rh_ar_entry_lock_lines | first }}'
- name: Extend the actual source observation record with acquired lock evidence only
  ansible.builtin.set_fact:
    rh_ar_preseal: '{{ rh_ar_source_observations | combine(dict([[rh_ar_contract.lock.source_field, _rh_ar_acquired_lock]])) }}'
