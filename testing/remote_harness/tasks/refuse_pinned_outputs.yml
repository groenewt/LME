---
# testing/remote_harness/tasks/refuse_pinned_outputs.yml -- FIRST task of every harness entrypoint (SEED-05).
#
# Extra-vars outrank set_fact and register, so any harness-derived name supplied from outside (-e, inventory)
# would supersede the value the harness derives. This guard refuses that at play entry: the name list is
# C1's REGISTRY list (manifests/global.yml lme_config_registry.remote_harness_schema.reserved_outputs; the profile's
# former controller.bootstrap.derived_outputs is retired and refused by the projection), read INLINE from the
# repository located INLINE from the magic variable playbook_dir (magic variables outrank extra-vars), so no
# variable can pin the list or its location. After this guard passes, every later set_fact/register of those names
# is authoritative for the play (only an extra-var could outrank it, and none is present).
#
# SEED-06 raw-read justification (codex-232517 raw_readers): the list is read from the RAW global.yml BEFORE any
# resolve because the guard must run first. That equals the resolved value because the registry is not part of
# lme_global: no lme_global_override can reach it, and global.yml is byte-bound by the engine (_lme_global_file).
# A new internal name is added to reserved_outputs by C1 in the same joint slice, never to the profile.
# An unreadable or empty list refuses (never an empty guard).
#
# Interface revision 5 (r3g; C1 field contract 033500): the guard also refuses C1's registry resolver_outputs
# (lme_resolved, lme_global, _lme_rh_scope, ... -- the engine resolve's own set_fact/include_vars/register names),
# which C1 says to refuse only at a host's FIRST entry. Every harness include of this guard IS a first entry: each
# entrypoint (controller.yml, package.yml, acquire.yml, target_bootstrap.yml) has exactly ONE play per host (the
# controller play on localhost; the target play on lme_toolchain_targets, which C1's projection keeps disjoint from
# the controller), and this guard is that play's first task, before any resolve. A caller that re-enters a host in
# a later play after resolving must not include this guard there (B's CASES re-entry is restructured accordingly).
#
# Supported inputs (inventory host vars lme_toolchain_root / lme_toolchain_owner, package inputs
# rh_artifact_source / rh_bundle_dir / rh_acquisition_receipt) are NOT reserved outputs and still compose.

# records-registry-ingress-01 (codex-tick755 OPEN-S17-REG-EXPECTED-ID): the ONLY registry read of this entry, made by the
# admitted ingress macro (templates/registry_ingress.j2 -> templates/macros/registry_ingress.j2; every atom in
# registry_ingress.decl.yml). Exactly one declared transport carries the externally admitted identity (CO-V-PRE-02
# admitted-A); the registry bytes are captured once and their digest is compared with it BEFORE any parse; the same
# bytes are parsed once; every reserved / resolver output name (and the declared extra names) supplied from outside the
# harness refuses, from that parse; the protected contract_admission slice is returned, and (records-c1-framework-30
# H30-05) the declared document_channel reader-input names under output.reader_inputs. _rh_sa_regadm and the three
# template bindings are reserved outputs, so a pre-supplied value refuses in this same render and the binding is
# authoritative once it renders. No task var and no earlier fact feeds it. The repository root is the base discovery
# rule (magic playbook_dir; unchanged); the two rels are the root atoms (OPEN-S20-ROOT-ATOMS).
- name: Admit the registry bytes against the admitted identity, then refuse pre-supplied derived outputs (one capture, one parse)
  ansible.builtin.set_fact:
    _rh_sa_regadm: >-
      {{ lookup('ansible.builtin.template',
                (([playbook_dir, playbook_dir | dirname, playbook_dir | dirname | dirname, playbook_dir | dirname | dirname | dirname]
                  | map('regex_replace', '$', '/manifests/profiles/remote-harness.yml') | select('file') | first)
                 | dirname | dirname | dirname) ~ '/testing/remote_harness/templates/registry_ingress.j2',
                template_vars={'rh_ri_root': ([playbook_dir, playbook_dir | dirname, playbook_dir | dirname | dirname, playbook_dir | dirname | dirname | dirname]
                                              | map('regex_replace', '$', '/manifests/profiles/remote-harness.yml') | select('file') | first)
                                             | dirname | dirname | dirname,
                               'rh_ri_decl': (([playbook_dir, playbook_dir | dirname, playbook_dir | dirname | dirname, playbook_dir | dirname | dirname | dirname]
                                               | map('regex_replace', '$', '/manifests/profiles/remote-harness.yml') | select('file') | first)
                                              | dirname | dirname | dirname) ~ '/testing/remote_harness/registry_ingress.decl.yml',
                               'rh_ri_supplied': vars.keys() | list}) | from_json }}

- name: Bind the protected contract_admission slice of the admitted registry (no second read, no parse)
  ansible.builtin.set_fact:
    _rh_sa_reg: "{{ _rh_sa_regadm[_rh_sa_regadm.ingress.output.slice] }}"

# Publication consistency, not identity proof: the identity of _rh_sa_reg rests on the admitted digest, the one capture
# compared with it and the parse of those bytes inside the ingress render. This task only shows that the published
# fact is a mapping and is the slice the render returned; the pinned-name refusal in the render protects the aliases.
- name: Publication consistency -- the bound slice is a mapping and is the slice the ingress admission returned
  ansible.builtin.assert:
    that:
      - _rh_sa_reg is mapping
      - (_rh_sa_reg | to_json(sort_keys=true)) == (_rh_sa_regadm[_rh_sa_regadm.ingress.output.slice] | to_json(sort_keys=true))
    fail_msg: >-
      {{ _rh_sa_regadm.ingress.diagnostics.readback }}
    quiet: true

- name: Derive the repository root from the declared profile location (inline; not an input)
  ansible.builtin.set_fact:
    rh_repo_root: >-
      {{ ([playbook_dir, playbook_dir | dirname, playbook_dir | dirname | dirname, playbook_dir | dirname | dirname | dirname]
          | map('regex_replace', '$', '/manifests/profiles/remote-harness.yml') | select('file') | first)
         | dirname | dirname | dirname }}

# MR03 S12E6 (codex-tick660 / 662 RC-1 / 664 binding order): the ONE canonical bootstrap-input refusal VALUE, bound
# here -- the existing first-entry registry guard every harness entry includes first -- so it precedes the earliest
# consumer on every declared entry path (cold N9 cold-input rows; managed admit_loader_source.yml; N2). Raw read of
# the registry literal contract_admission.bootstrap_input_refusal (the guard's justification above: not part of
# lme_global; global.yml bytes are admitted before invocation by the outer CO-V-PRE-02 admission). Protected fact
# _rh_sa_rref (genesis GL-02W): a pre-supplied value was refused by the guard above. A malformed value stops the play
# here, before any effect, with NO code (none exists before it does; no default, no literal).
- name: Bind the canonical bootstrap-input refusal mapping from the registry (raw; protected; once per entry)
  ansible.builtin.set_fact:
    _rh_sa_rref: "{{ _rh_sa_reg.bootstrap_input_refusal }}"

- name: Stop on a registry refusal mapping that is not exactly {input, bytes} of non-empty strings (no code)
  ansible.builtin.assert:
    that:
      - _rh_sa_rref is mapping
      - (_rh_sa_rref.keys() | list | sort) == ['bytes', 'input']
      - _rh_sa_rref.values() | reject('string') | list | length == 0
      - _rh_sa_rref.values() | select('equalto', '') | list | length == 0
    fail_msg: >-
      the registry contract_admission.bootstrap_input_refusal (manifests/global.yml) is not a mapping of exactly
      {input, bytes} to non-empty strings; no refusal code exists before it does (the outer CO-V-PRE-02 admission
      classifies the bytes) {{ _rh_sa_rref | to_json }}
    quiet: true

# MR03 S14 (codex-tick675 OD-ALS02-INCLUDE-REL-01): the declaration identity task rel (the N2 include target), bound
# here by the same raw registry read and justification as _rh_sa_rref above. Protected fact _rh_sa_idt (a pre-supplied
# value was refused by the guard). A malformed value stops the play here, with NO code.
- name: Bind the declaration identity task rel from the registry (raw; protected; once per entry)
  ansible.builtin.set_fact:
    _rh_sa_idt: "{{ _rh_sa_reg.bootstrap_identity_task }}"

- name: Stop on a registry identity task that is not exactly {rel} of a non-empty string (no code)
  ansible.builtin.assert:
    that:
      - _rh_sa_idt is mapping
      - (_rh_sa_idt.keys() | list) == ['rel']
      - _rh_sa_idt.rel is string and _rh_sa_idt.rel | length > 0
    fail_msg: >-
      the registry contract_admission.bootstrap_identity_task (manifests/global.yml) is not exactly {rel} of a non-empty
      string; the source admission cannot include its identity phase {{ _rh_sa_idt | to_json }}
    quiet: true
