---
# testing/remote_harness/tasks/bind_source_inputs.yml -- the ONE shared SOURCE-INPUT BINDER (new path N12, MAIN
# new-paths-recorded-04.yml; codex-tick637 N12). NEW FILE. AUTHORED, NEVER EXECUTED (UNRUN).
# The admitted-invocation git edition / status binding and the no-follow digest of the caller's declared source inputs,
# taken from package.yml (frozen base, mr03-gen-bases/package.yml) :205-264 and :275-303 WITH ITS CALLER-SPECIFIC LISTS
# LIFTED OUT: NOT a literal move. Each caller binds ITS OWN declared closure through the include parameters:
#   package.yml               the package closure INCLUDING its generated evidence (rh_eg_evidence paths, dispatch
#                             closure, document rels, importer obligations) and rh_eg_edition while the entry-generation
#                             contract is active (records-tasks.yml MR03-FB-PK-01 / -02);
#   initializer_release.yml   the release closure (N9: its own bytes, N2, the declaration, the N7 template N8 + macros N11,
#                             N10 / N12 / N13 and the loader members admitted by resolve_policy.yml) and the admitted
#                             cold-input edition. No fabricated empty evidence; generation is never disabled here.
# Requires: rh (resolve_policy.yml), rh_repo_root (refuse_pinned_outputs.yml), rh_src_admission (admit_loader_source.yml
# through resolve_policy.yml; the admitted git / env tools and git invocation policy -- R2J-PACKAGING-GIT-CLOSURE).
# Include parameters (registry reserved_outputs; never an -e / inventory value):
#   rh_bsi_status_rel   repository-relative pathspec of the porcelain status (exact paths; after git.end_of_options)
#   rh_bsi_inputs       absolute paths of every source input to digest, in the caller's declared order
#   rh_bsi_editions     the further admitted editions the head must ALSO equal (package: [rh_eg_edition] while
#                       active; release: [the N2-admitted cold edition]); the admitted intended commit is always checked
# Outputs (registers; the SAME names package.yml / package_bundle.yml already read, so package_bundle.yml's manifest is
# byte-unchanged): _rh_src_git (results[0] head, results[1] porcelain status), _rh_src_inputs (stat results, in order).

- name: "SOURCE INPUTS -- refuse a missing or malformed binder parameter (no default)"
  ansible.builtin.assert:
    that:
      - rh_bsi_status_rel is sequence and rh_bsi_status_rel is not string
      - rh_bsi_status_rel | length > 0
      - rh_bsi_status_rel | reject('string') | list | length == 0
      - rh_bsi_inputs is sequence and rh_bsi_inputs is not string
      - rh_bsi_inputs | length > 0
      - rh_bsi_inputs | reject('string') | list | length == 0
      - rh_bsi_inputs | reject('match', rh.controller.bootstrap.path_admission.regex) | list | length == 0
      - rh_bsi_editions is sequence and rh_bsi_editions is not string
      - rh_bsi_editions | reject('string') | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}:
      {{ rh.controller.bootstrap.genesis.builder.messages.source_git }}
      {{ [rh_bsi_status_rel | default(none), rh_bsi_editions | default(none)] | to_json }}
    quiet: true

# package.yml :205-241 with the pathspec lifted into rh_bsi_status_rel (r2k R2J-PACKAGING-GIT-CLOSURE: the SAME admitted
# invocation policy as tasks/admit_git_paths.yml -- `<env> -i <git.env_pairs...> <git> <git.global...> <repo>`).
- name: "SOURCE INPUTS -- bind the source edition and status (read-only git, admitted invocation)"
  vars:
    _rh_bsi_sa: "{{ lme_resolved.remote_harness.source_admission }}"
    _rh_bsi_git: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] }}"
    _rh_bsi_x: >-
      {{ [rh_src_admission[_rh_bsi_sa.record_fields.tool].env[_rh_bsi_sa.tool_fields.path], _rh_bsi_git.env_clear] + _rh_bsi_git.env_pairs
         + [rh_src_admission[_rh_bsi_sa.record_fields.tool].git[_rh_bsi_sa.tool_fields.path]] + _rh_bsi_git.global + [rh_repo_root] }}
  ansible.builtin.command:
    argv: "{{ _rh_bsi_x + item }}"
  loop: >-
    {{ [rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].head,
        rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].package_status
        + [rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].end_of_options]
        + rh_bsi_status_rel] }}
  register: _rh_src_git
  changed_when: false
  failed_when: false

# package.yml :243-251 (unchanged).
- name: "SOURCE INPUTS -- refuse a git tool failure while binding the source (tool cause; nothing continues)"
  ansible.builtin.assert:
    that:
      - _rh_src_git.results | map(attribute='rc') | reject('equalto', 0) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}:
      {{ rh.controller.bootstrap.genesis.builder.messages.source_git }}
      {{ _rh_src_git.results | map(attribute='rc') | zip(_rh_src_git.results | map(attribute='stderr')) | list | to_json }}
    quiet: true

# package.yml :253-264 with the generation edition lifted into rh_bsi_editions.
- name: "SOURCE INPUTS -- refuse a source edition that is not the admitted intended commit (and every caller-admitted edition)"
  ansible.builtin.assert:
    that:
      - _rh_src_git.results[0].rc == 0
      - _rh_src_git.results[0].stdout == rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition]
      - rh_bsi_editions | reject('equalto', _rh_src_git.results[0].stdout) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the source edition
      {{ _rh_src_git.results[0].stdout }} is not the admitted intended commit
      {{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition] }} and every caller-admitted
      edition {{ rh_bsi_editions | to_json }}.
    quiet: true

# package.yml :275-303 with the input list lifted into rh_bsi_inputs (no link followed; the caller's declared order).
- name: "SOURCE INPUTS -- digest every declared source input (no link followed)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: "{{ rh_bsi_inputs }}"
  register: _rh_src_inputs

- name: "SOURCE INPUTS -- refuse a source input that is absent, a link or not a regular file"
  ansible.builtin.assert:
    that:
      - _rh_src_inputs.results | rejectattr('stat.exists') | list | length == 0
      - _rh_src_inputs.results | selectattr('stat.islnk') | list | length == 0
      - _rh_src_inputs.results | rejectattr('stat.isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}:
      {{ rh.controller.bootstrap.genesis.builder.messages.source_git }}
      {{ _rh_src_inputs.results | rejectattr('stat.isreg', 'defined') | map(attribute='item') | list
         + (_rh_src_inputs.results | selectattr('stat.isreg', 'defined') | rejectattr('stat.isreg') | map(attribute='item') | list) | to_json }}
    quiet: true
# FROZEN, no further writes
