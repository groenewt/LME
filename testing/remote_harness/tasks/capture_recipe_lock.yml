- name: Admit the caller-supplied engine role binding before lock capture
  ansible.builtin.assert:
    that:
    - rh_capture_role is string
    - rh_capture_binding is mapping
    - rh_capture_binding.role == rh_capture_role
    - rh_capture_binding.lock_rel is string
    - rh_capture_binding.lock_sha256 is string
    fail_msg: '{{ lookup(rh.controller.bootstrap.refusal_grammar.plugin, rh_repo_root ~ rh.controller.bootstrap.path_admission.separator
      ~ rh.controller.bootstrap.refusal_grammar.entry_rel, template_vars={''rh_rf_grammar'': rh.controller.bootstrap.refusal_grammar,
      ''rh_rf_code'': rh.controller.bootstrap.lock_capture.refusal, ''rh_rf_detail'': [rh_capture_role]}) }}'
    quiet: true
- name: Bind the role lock path from the existing generation binding
  ansible.builtin.set_fact:
    _rh_recipe_lock_rel: '{{ rh_capture_binding.lock_rel }}'
- name: Reuse the already admitted executing-controller lock when the role names the same source
  ansible.builtin.set_fact:
    _rh_recipe_lock_cap: '{{ rh_seed_lock }}'
  when: _rh_recipe_lock_rel == _rh_lock_rel
- name: Capture a distinct selected role lock through the existing guarded capture sequence
  block:
  - name: NP-01 B-CTL-3 refuse unless lock_capture.digest_algorithm is source_admission.digest_algorithm (once; before any
      digest comparison)
    ansible.builtin.assert:
      that:
      - lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.digest_algorithm == lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.digest_algorithm
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.refusals.member,\n                    \
        \     'rh_rf_detail': [_rh_recipe_lock_rel,\n                                          lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.digest_algorithm,\n\
        \                                          lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.digest_algorithm]})\
        \ }}"
      quiet: true
  - name: NP-01 B-CTL-1 refuse a controller lock rel that is not an admitted source member (before the stat and the one read)
    ansible.builtin.assert:
      that:
      - _rh_recipe_lock_rel in rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members]
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.refusals.member,\n                    \
        \     'rh_rf_detail': [_rh_recipe_lock_rel]}) }}"
      quiet: true
  - name: NP-01 stat the executing controller lock before its one read (lock_capture.verify; no link followed)
    ansible.builtin.stat:
      path: '{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ _rh_recipe_lock_rel
        }}'
      follow: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.follow }}'
      get_checksum: true
      checksum_algorithm: '{{ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.digest_algorithm }}'
      get_mime: false
      get_attributes: false
    delegate_to: '{{ lme_resolved.remote_harness.source_admission.controller_delegate }}'
    register: _rh_recipe_lock_st
  - name: NP-01 refuse a lock that fails a lock_capture.verify require field before its one read (typed; no read)
    ansible.builtin.assert:
      that:
      - "(lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require | select('in', _rh_recipe_lock_st.stat)\n\
        \ | map('extract', _rh_recipe_lock_st.stat) | select('sameas', true) | list | length)\n== (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require\
        \ | length)"
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,\n                         'rh_rf_detail':\
        \ [_rh_recipe_lock_rel,\n                                          lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require\
        \ | to_json,\n                                          _rh_recipe_lock_st.stat | to_json]}) }}"
      quiet: true
  - name: NP-01 read the executing controller lock ONCE (exact bytes; the capture source)
    ansible.builtin.slurp:
      src: '{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ _rh_recipe_lock_rel
        }}'
    delegate_to: '{{ lme_resolved.remote_harness.source_admission.controller_delegate }}'
    register: _rh_recipe_lock_raw
  - name: 'NP-01 capture the lock text (lock_capture text: the decoded bytes of the one read, no strip)'
    ansible.builtin.set_fact:
      _rh_recipe_lock_cap:
        text: '{{ _rh_recipe_lock_raw.content | b64decode }}'
  - name: NP-01 digest the captured text (lock_capture sha256 by lock_capture.digest_algorithm; after the text)
    ansible.builtin.set_fact:
      _rh_recipe_lock_cap: '{{ _rh_recipe_lock_cap | combine({''sha256'': _rh_recipe_lock_cap.text | hash(lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.digest_algorithm)})
        }}'
  - name: NP-01 refuse unless the captured bytes are the regular file stat'ed in this flow (lock_capture.verify; before any
      row is used)
    ansible.builtin.assert:
      that:
      - "(lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require | select('in', _rh_recipe_lock_st.stat)\n\
        \ | map('extract', _rh_recipe_lock_st.stat) | select('sameas', true) | list | length)\n== (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require\
        \ | length)"
      - lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.digest_field in _rh_recipe_lock_st.stat
        and _rh_recipe_lock_st.stat[lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.digest_field]
        == _rh_recipe_lock_cap.sha256
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,\n                         'rh_rf_detail':\
        \ [_rh_recipe_lock_rel, _rh_recipe_lock_cap.sha256, _rh_recipe_lock_st.stat | to_json]}) }}"
      quiet: true
  - name: NP-01 B-CTL-2 refuse a capture whose digest is not the admitted member's observed digest (after the verify; before
      the parse and publish)
    ansible.builtin.assert:
      that:
      - _rh_recipe_lock_cap.sha256 == rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members][_rh_recipe_lock_rel][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.member_fields.observed]
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.refusals.member,\n                    \
        \     'rh_rf_detail': [_rh_recipe_lock_rel, _rh_recipe_lock_cap.sha256,\n                                        \
        \  rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members][_rh_recipe_lock_rel][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.member_fields.observed]]})\
        \ }}"
      quiet: true
  - name: NP-01 parse the verified capture ONCE (engine strict construction; lock_capture packages / collections mandatory)
    ansible.builtin.set_fact:
      _rh_recipe_lock_cap: "{%- set y = _rh_recipe_lock_cap.text | lme_manifest_strict(_rh_recipe_lock_rel, _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse)\
        \ -%} {%- set m = lookup('ansible.builtin.template',\n                   rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n                   template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                                  'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,\n                                \
        \  'rh_rf_detail': [_rh_recipe_lock_rel, lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields\
        \ | to_json]}) -%}\n{{ _rh_recipe_lock_cap | combine({'packages': y.packages | mandatory(m), 'collections': y.collections\
        \ | mandatory(m)}) }}"
  - name: NP-01 refuse a lock capture that is not exactly the declared capture (keys == lock_capture.fields; rows are lists)
    ansible.builtin.assert:
      that:
      - (_rh_recipe_lock_cap | list | sort) == (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields
        | sort)
      - (_rh_recipe_lock_cap | list | length) == (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields
        | length)
      - _rh_recipe_lock_cap.packages is sequence and _rh_recipe_lock_cap.packages is not string and _rh_recipe_lock_cap.packages
        is not mapping
      - _rh_recipe_lock_cap.collections is sequence and _rh_recipe_lock_cap.collections is not string and _rh_recipe_lock_cap.collections
        is not mapping
      fail_msg: "{{ lookup('ansible.builtin.template',\n          rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator\
        \ ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,\n          template_vars={'rh_rf_grammar':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,\n                         'rh_rf_code':\
        \ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,\n                         'rh_rf_detail':\
        \ [_rh_recipe_lock_rel, _rh_recipe_lock_cap | list | sort | to_json, lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields\
        \ | to_json]}) }}"
      quiet: true
  when: _rh_recipe_lock_rel != _rh_lock_rel
- name: Require captured lock identity to equal the engine role binding
  ansible.builtin.assert:
    that:
    - _rh_recipe_lock_cap.sha256 == rh_capture_binding.lock_sha256
    fail_msg: '{{ lookup(rh.controller.bootstrap.refusal_grammar.plugin, rh_repo_root ~ rh.controller.bootstrap.path_admission.separator
      ~ rh.controller.bootstrap.refusal_grammar.entry_rel, template_vars={''rh_rf_grammar'': rh.controller.bootstrap.refusal_grammar,
      ''rh_rf_code'': rh.controller.bootstrap.lock_capture.refusal, ''rh_rf_detail'': [rh_capture_role, _rh_recipe_lock_rel]})
      }}'
    quiet: true
- name: Publish the admitted role lock capture
  ansible.builtin.set_fact:
    rh_recipe_lock: '{{ _rh_recipe_lock_cap }}'
