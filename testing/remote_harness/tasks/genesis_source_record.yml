---
# testing/remote_harness/tasks/genesis_source_record.yml -- GENESIS SOURCE RECORD, phase A, SUCCESSOR 02 (codex-tick542
# GEN-OVERRIDE-COMPATIBILITY / GEN-EARLY-PATH-AND-VALUE-SOURCING / OD-GEN-03 / OD-GEN-05; codex-tick543 OD-S3-07).
# NEW FILE. AUTHORED, NEVER EXECUTED (every control UNRUN). Supersedes the frozen v1 (e08e1ae8), not modified.
#
# Included ONLY by the generated producer playbook (genesis.entry.producer.generated_rel), after its interface guard,
# refuse_pinned_outputs.yml and admit_controller.yml, and BEFORE resolve_policy.yml. EVERY name / value below comes from
# the rendered, guarded play interface _rh_gsr_iface (OD-GEN-04: no interface constant, no literal code or text).
#
# v1 -> 02:
#   - NO declaration or registry read here (v1 read both before their grammar was known: GEN-EARLY-PATH). The anchor IS
#     the provisional record, built by the entry from the RESOLVED declaration; the ONE loader (admit_loader_source.yml
#     inside resolve_policy.yml) performs the complete source admission of every member and document, the git / env
#     tool binding and the effective-context / operator-override admission (override LAST, existing semantics); the
#     emit then rebuilds the record from the resolved projection and refuses any difference.
#   - NO override-presence ban (OD-GEN-03 rejected): a same-value or empty operator override layer passes through the
#     existing admission exactly as on a seed launch.
#   - NO producer closure walk: the complete closure of this stage was admitted by the entry BEFORE Ansible started
#     (GEN-PREEXEC-CLOSURE), and the loader re-admits its members at use.
#   - Builder: the ONE stable generation of the shared recipe (GEN-STABLE-GENERATION), never an act-keyed G.
#
# NO MODULE BEFORE THE INTERPRETER BINDING (admit_builder.yml :104-129 precedent): every task up to the bind is assert /
# set_fact with lookups and magic variables only. Requires: rh_repo_root, _rh_gsr_iface, the anchor stage input.
# Outputs: <record var> (the provisional record; a declared INPUT of admit_loader_source.yml), _rh_gsr_* (task facts;
# registry reserved_outputs -- F05 dependency F05-GEN2-05).

- name: "GENESIS SOURCE RECORD -- refuse a pre-supplied launch record (the anchor input is its only source here)"
  ansible.builtin.assert:
    that:
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.record_var ~ '$') | length == 0
    fail_msg: "{{ _rh_gsr_iface.refusals.forged }}: {{ _rh_gsr_iface.texts.forged }}"
    quiet: true

- name: "GENESIS SOURCE RECORD -- bind the anchor input (derived; absent refuses below)"
  ansible.builtin.set_fact:
    _rh_gsr_a: "{{ lookup('ansible.builtin.vars', _rh_gsr_iface.anchor_var) if (q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.anchor_var ~ '$') | length) == 1 else none }}"

# Shape only (values are proven after the resolve): exactly the declared record keys; the construction map's policy
# fields equal the rendered interface where the interface carries them; the runtime roles fullmatch their grammars.
- name: "GENESIS SOURCE RECORD -- refuse an absent or malformed anchor record"
  vars:
    _rh_gsr_cm: "{{ _rh_gsr_iface.construction }}"
    _rh_gsr_ed: "{{ _rh_gsr_cm.fields | dict2items | selectattr('value.source', 'equalto', _rh_gsr_cm.sources.edition) | map(attribute='key') | list }}"
    _rh_gsr_dg: "{{ _rh_gsr_cm.fields | dict2items | selectattr('value.source', 'equalto', _rh_gsr_cm.sources.digest) | map(attribute='key') | list }}"
    _rh_gsr_cx: "{{ _rh_gsr_cm.fields | dict2items | selectattr('value.source', 'equalto', _rh_gsr_cm.sources.context) | map(attribute='key') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_gsr_a is mapping
      - (_rh_gsr_a.keys() | list | sort) == _rh_gsr_iface.record_keys
      - (_rh_gsr_cm.fields.keys() | list | sort) == _rh_gsr_iface.record_keys
      - _rh_gsr_ed | length == 1 and _rh_gsr_dg | length == 1 and _rh_gsr_cx | length == 1
      - _rh_gsr_a[_rh_gsr_ed | first] is string and _rh_gsr_a[_rh_gsr_ed | first] is match('(?:' ~ _rh_gsr_iface.edition_regex ~ ')\Z')
      - _rh_gsr_a[_rh_gsr_dg | first] is string and _rh_gsr_a[_rh_gsr_dg | first] is match('(?:' ~ _rh_gsr_iface.digest_regex ~ ')\Z')
      - _rh_gsr_a[_rh_gsr_cx | first] is mapping
      - (_rh_gsr_a[_rh_gsr_cx | first].keys() | list | sort)
        == ((_rh_gsr_iface.context_fields.keys() | list) + (_rh_gsr_iface.launch_context_fields.keys() | list)) | sort
      - _rh_gsr_a.values() | list | length == _rh_gsr_iface.record_keys | length
    fail_msg: "{{ _rh_gsr_iface.refusals.input }}: {{ _rh_gsr_iface.texts.input }} {{ [_rh_gsr_iface.anchor_var, (_rh_gsr_a.keys() | list | sort) if _rh_gsr_a is mapping else none] | to_json }}"
    quiet: true

# Every POLICY-sourced anchor value (declaration rel / path, delegate, packaged tools) is exactly the value the
# interface rendered from the same resolved declaration (policy_values); the declaration rel / path / delegate the
# loader binds are those (bootstrap_input). Context values are proven against the RESOLVED projection in the emit.
- name: "GENESIS SOURCE RECORD -- refuse an anchor naming another declaration, delegate or tool selection than the interface"
  vars:
    _rh_gsr_pk: "{{ _rh_gsr_iface.policy_values.keys() | list | sort }}"
  ansible.builtin.assert:
    that:
      - _rh_gsr_pk | length > 0
      - (_rh_gsr_pk | map('extract', _rh_gsr_a) | map('to_json', sort_keys=true) | list)
        == (_rh_gsr_pk | map('extract', _rh_gsr_iface.policy_values) | map('to_json', sort_keys=true) | list)
      - _rh_gsr_iface.policy_values.values() | map('to_json', sort_keys=true) | select('equalto', _rh_gsr_iface.declaration_rel | to_json) | list | length == 1
      - _rh_gsr_iface.policy_values.values() | map('to_json', sort_keys=true) | select('equalto', _rh_gsr_iface.declaration_path | to_json(sort_keys=true)) | list | length == 1
      - _rh_gsr_iface.policy_values.values() | map('to_json', sort_keys=true) | select('equalto', _rh_gsr_iface.controller_delegate | to_json) | list | length == 1
    fail_msg: "{{ _rh_gsr_iface.refusals.input }}: {{ _rh_gsr_iface.texts.input }} {{ [_rh_gsr_iface.declaration_rel, _rh_gsr_iface.controller_delegate] | to_json }}"
    quiet: true

# BUILDER IDENTITY BEFORE ANY MODULE (lookups / magic variables only). GEN-STABLE-GENERATION: the builder is the ONE
# stable generation of the shared recipe, R = <checkout>/<builder.root_rel>, G = R/<generations_dir>/<GEN_ID>; the
# running interpreter must BE <G>/<python_rel> for exactly one G directly below R/<generations_dir>, the executable's
# first line '#!' + that interpreter, the core the declared one, and any pre-supplied interpreter equal. The GEN_ID of
# that G is proven against the fresh seed render by verify_toolchain_receipt.yml in the emit (and by admit_builder).
- name: "GENESIS SOURCE RECORD -- refuse an undeclared builder core, interpreter or executable before any module"
  vars:
    _rh_gsr_gr: "{{ [rh_repo_root, _rh_gsr_iface.builder.root_rel, _rh_gsr_iface.builder.generations_dir] | join(_rh_gsr_iface.separator) }}"
    _rh_gsr_suf: "{{ _rh_gsr_iface.separator ~ _rh_gsr_iface.builder.python_rel }}"
    _rh_gsr_g: "{{ ansible_playbook_python[: (ansible_playbook_python | length) - (_rh_gsr_suf | length)] }}"
    _rh_gsr_bx: "{{ [_rh_gsr_g, _rh_gsr_iface.builder.executable_rel] | join(_rh_gsr_iface.separator) }}"
  ansible.builtin.assert:
    that:
      - ansible_version.full == _rh_gsr_iface.builder.core
      - ansible_playbook_python.endswith(_rh_gsr_suf)
      - (_rh_gsr_g | dirname) == _rh_gsr_gr
      - (_rh_gsr_g | basename) | length > 0
      - (lookup('ansible.builtin.file', _rh_gsr_bx, lstrip=false, rstrip=false).split('\n') | first) == '#!' ~ ansible_playbook_python
      - (q('ansible.builtin.varnames', '^ansible_python_interpreter$') | length == 0) or ansible_python_interpreter == ansible_playbook_python
    fail_msg: "{{ _rh_gsr_iface.refusals.builder }}: {{ _rh_gsr_iface.texts.builder }} {{ [ansible_version.full, ansible_playbook_python, _rh_gsr_iface.builder.core, _rh_gsr_gr] | to_json }}"
    quiet: true

- name: "GENESIS SOURCE RECORD -- bind the module interpreter to the running managed builder python (before the first module)"
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    _rh_gsr_gen: "{{ ansible_playbook_python[: (ansible_playbook_python | length) - ((_rh_gsr_iface.separator ~ _rh_gsr_iface.builder.python_rel) | length)] }}"

# The provisional record under the declared record var (bootstrap_input.var; codex-tick543 OD-S3-07), exactly the
# anchor bytes' value: admit_loader_source.yml consumes it as it consumes a seed-rendered record. Its canonical text is
# kept for the emit comparison (OD-GEN-02: provisional and resolved stay DISTINCT; their equality is the check).
- name: "GENESIS SOURCE RECORD -- bind the provisional launch record under the declared record var (derived)"
  ansible.builtin.set_fact:
    "{{ _rh_gsr_iface.record_var }}": "{{ _rh_gsr_a }}"
    _rh_gsr_p: "{{ _rh_gsr_a | to_json(sort_keys=true) }}"
