---
# testing/remote_harness/tasks/admit_cold_launch.yml -- SHARED COLD LAUNCH ADMISSION (records-c1-framework-20 FW20-COLD,
# d2eef9f6; codex-tick815 item 1 :25-39; J-FW20-COLD-ROUTE). NEW FILE (recorded path). AUTHORED, NEVER EXECUTED (UNRUN).
# Body: genesis_generate.successor-06 (a074a2ba) :162-256, de-indented four spaces (verbatim-move draft b1b2cbac), then
# the fw20 changes ONLY:
#   - the first two tasks are the includes of tasks/refuse_pinned_outputs.yml and tasks/admit_controller.yml (FW20-COLD
#     admit_cold_launch.steps 1-2; G01 s06 :156-160 moved here), so the include of THIS file is the includer's FIRST
#     task and refuse_pinned_outputs stays the first task of the entry (first-entry guard preserved);
#   - reserved outputs renamed to the fw20 names: carrier _rh_ggen_in -> _rh_rf_in, override state _rh_ggen_ovs ->
#     _rh_rf_ovs; the task-local vars _rh_ggen_cibad / _rh_ggen_ovp -> _rh_rf_cibad / _rh_rf_ovp (local, not facts);
#   - the s06 :206 "no anchor" row (an inherited presence test on a literal name) leaves this pre-resolve file: the
#     anchor var is declared only in the profile (genesis.source_record.anchor.var), so admit_record_free_entry refuses it
#     after the resolve by that declared name.
# op1d (records-route-op1d-01 OP1D-ACL-01; codex 916): the envelope rows are guarded by the ingress-selected CARRIER
# word; the projector carrier admits no envelope and the admitted entry identity instead (OWED-C1-OP1D-INGRESS-CARRIERS).
# Task parameters: NONE (FW20-COLD). It reads only _rh_sa_reg / _rh_sa_regadm / _rh_sa_rref (bound by the guard) and the
# declared public cold inputs.

- name: Refuse pre-supplied derived outputs, derive the repository root and bind the canonical refusal value
  ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

- name: Bind the effective controller connection before any effect (the pinned controller target and connection, no become)
  ansible.builtin.include_tasks: tasks/admit_controller.yml

# s05 (codex-tick751 trust_join; C1-RI-RPO-01): the registry contract admission is the protected retained value
# _rh_sa_reg the first-entry guard above bound from its one digest-before-parse capture (expected identity first).
# This entry no longer reads manifests/global.yml and binds no copy; it requires the guard's value (consumer check).
- name: Refuse a run without the guard-bound registry contract admission (consumer check; no lookup, no binding)
  ansible.builtin.assert:
    that:
      - _rh_sa_reg is mapping
      - _rh_sa_reg.cold_inputs is mapping
      - _rh_sa_reg.carrier_state is mapping
      - _rh_sa_reg.vocabulary is mapping
      - _rh_sa_regadm is mapping
      - _rh_sa_regadm.ingress is mapping
    fail_msg: >-
      REFUSED {{ _rh_sa_rref.input }}: the registry contract admission bound by the first-entry guard
      (tasks/refuse_pinned_outputs.yml, C1-RI-RPO-01) is unadmitted in this run; nothing is read.
    quiet: true

- name: Refuse an unadmitted launch envelope, an absent / untyped / empty cold input, or half the override pair (raw; grammar_at / equals_at apply post-resolve)
  vars:
    # op1g (C1 s15 decl atoms incl. zero, fullmatch_wrap; records-route-op1g-01 OP1G-ACL-01): the accumulator start, the
    # zero counts and the full-match wrapper are the ingress declaration words (output.ingress), no literal
    # op1i CPL-SR922-ACL-PATTERN (C1 sr922_c1 item_3; HOLE-OP1G-ACL-PATTERN-KEY closed): the two branches keyed on a
    # spec key named pattern are REMOVED -- engine r17 :4208 admits a cold_inputs spec only as {type, grammar_at} or
    # {type, equals_at}, so they could never fire. This RAW step (before any declaration is readable) keeps presence and
    # non-empty string; the declared grammar_at / equals_at leaves are applied after the resolve, in
    # admit_record_free_entry (op1i cold-input row), by walking the dotted policy path.
    _rh_rf_cibad: >-
      {%- set iw = _rh_sa_regadm.ingress -%}
      {%- set ns = namespace(bad=iw.atoms.empty_list) -%}
      {%- for v, s in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither)).items() if v in vars -%}
      {%- set x = lookup('ansible.builtin.vars', v) -%}
      {%- if x is not string or (x | length) == iw.atoms.zero -%}{%- set ns.bad = ns.bad + [v] -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.bad }}
  ansible.builtin.assert:
    that:
      # s06 (fw14 FW14-CE-01 / J-FW14-G01-S06; Codex 773 option A): the pre-record entry takes NO genesis source record
      # and no anchor, but it takes the ONE admitted launch envelope (the ingress envelope_transport var): present, a
      # mapping, selecting the COLD transport (its var a declared cold input), carrying the cold registry identity. The
      # first-entry guard macro already refused a mis-selected or conflicting transport and an envelope identity other
      # than the selected one, before the parse; these rows bind that admission to this entry before any module. The
      # transport word and the context key set are profile values: admitted after the resolve (admit_record_free_entry).
      # op1d (records-route-op1d-01 OP1D-ACL-01; codex 916 Q-OP1C-PROJECTOR-ENVELOPE): the CARRIER the ingress selected
      # (its declared output word; OWED-C1-OP1D-INGRESS-CARRIERS) is one declared carrier word. Under the ENVELOPE
      # carrier the base rows hold unchanged (envelope var supplied, a mapping, carrying the cold registry identity);
      # under the PROJECTOR carrier the envelope var is ABSENT (a supplied envelope refuses: alone it is the envelope
      # carrier, which the projector row refuses after the resolve; mixed, the ingress refused it) and the entry
      # identity var is supplied and is the identity the ingress measured. Exactly one branch holds: the envelope var
      # is supplied iff the carrier is the envelope word. Both carriers select the COLD transport identity below.
      # op1e (records-route-op1e-01 OP1E-ACL-01; codex 918): the ingress now selects the carrier by the ACTUAL executing
      # entry before any registry read; these rows are DEFENSE IN DEPTH. The op1d identity var is replaced by the
      # external X2 admission (carriers.projector.admission {var, fields}): supplied iff the projector carrier, not a cold
      # input, its entry_sha256 field the identity the ingress measured and its registry_sha256 field the cold identity.
      - _rh_sa_regadm.ingress.carriers is mapping
      - _rh_sa_regadm.ingress.output.carrier is string
      - _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] in (_rh_sa_regadm.ingress.carriers.words.values() | list)
      - >-
        (_rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var in vars)
        == (_rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] == _rh_sa_regadm.ingress.carriers.words.envelope)
      - >-
        _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] != _rh_sa_regadm.ingress.carriers.words.envelope
        or lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var) is mapping
      - _rh_sa_regadm.ingress.transports[_rh_sa_regadm.transport].var in _rh_sa_reg.cold_inputs.required
      - >-
        _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] != _rh_sa_regadm.ingress.carriers.words.envelope
        or lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var)[_rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].path | last] == rh_rel_registry_sha256
      - >-
        _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] != _rh_sa_regadm.ingress.carriers.words.projector
        or (_rh_sa_regadm.ingress.carriers.projector.admission.var in vars
            and _rh_sa_regadm.ingress.carriers.projector.admission.var not in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither))
            and _rh_sa_regadm.ingress.output.entry_identity in _rh_sa_regadm
            and lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.carriers.projector.admission.var)[_rh_sa_regadm.ingress.carriers.projector.admission.fields.entry_sha256] == _rh_sa_regadm[_rh_sa_regadm.ingress.output.entry_identity]
            and lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.carriers.projector.admission.var)[_rh_sa_regadm.ingress.carriers.projector.admission.fields.registry_sha256] == rh_rel_registry_sha256)
      - >-
        _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] != _rh_sa_regadm.ingress.carriers.words.envelope
        or _rh_sa_regadm.ingress.carriers.projector.admission.var not in vars
      - rh_rel_registry_sha256 == _rh_sa_regadm.identity
      # s06 (fw14 FW14-RS-01 / OPEN-LRH-GGEN-ROW-REGISTRY, Codex 811 :29-32): every required cold input (rh_rel_registry_sha256
      # among them, C1-RI-GL-01) and the override pair both or neither; the envelope var is NOT a cold input and is
      # admitted only by the rows above
      - _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var not in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither))
      - (_rh_sa_reg.cold_inputs.required.keys() | reject('in', vars) | list | length) == _rh_sa_regadm.ingress.atoms.zero
      - >-
        (_rh_sa_reg.cold_inputs.both_or_neither.keys() | select('in', vars) | list | length)
        in [_rh_sa_regadm.ingress.atoms.zero, (_rh_sa_reg.cold_inputs.both_or_neither | length)]
      - (_rh_rf_cibad | length) == _rh_sa_regadm.ingress.atoms.zero
      # before the FIRST module the running controller python is the admitted A interpreter (as N9 s06 :185)
      - ansible_playbook_python == rh_rel_interpreter
    fail_msg: >-
      REFUSED {{ _rh_sa_rref.input }}: the pre-record generation entry takes no genesis source record and no anchor, only
      the ONE admitted launch envelope selecting the cold transport with the cold registry identity, and exactly the public
      cold inputs contract_admission.cold_inputs declares (every required one, the override pair both or neither), each a
      non-empty string of its declared grammar, and runs under the admitted interpreter {{ _rh_rf_cibad | to_json }}
    quiet: true

# s05 (codex-tick751 producer_semantics; C1-CS-GL-01): this carrier has NO context (codex-tick740). The public
# optional pair was admitted both-or-neither above; its ONE matching declared state is selected here (supplied-input
# detection of the declared public inputs, not a fallback) and emitted as an explicit word, then the carrier carries
# exactly that state's fields. The s04 conditional empty-map combine is removed. Operator / attribute words are the
# registry vocabulary (_rh_sa_reg.vocabulary); the state accessors .absent / .present are the carried N2 idiom.
- name: Select the ONE declared override state of the cold carrier from the supplied public inputs (reserved fact)
  ansible.builtin.set_fact:
    _rh_rf_ovs: >-
      {{ _rh_sa_reg.carrier_state.node.words.present
         if (_rh_sa_reg.carrier_state.public_inputs.values() | select(_rh_sa_reg.vocabulary.tests.in, vars) | list | length) > 0
         else _rh_sa_reg.carrier_state.node.words.absent }}

- name: Admit the cold carrier ONCE from the declared scalar inputs and the selected state (reserved fact; never regenerated)
  vars:
    # the declared public inputs of the selected state's fields (an empty selection for a state with no fields)
    _rh_rf_ovp: >-
      {{ _rh_sa_reg.carrier_state.public_inputs | dict2items
         | selectattr(_rh_sa_reg.vocabulary.attributes.item_key, _rh_sa_reg.vocabulary.tests.in,
                      _rh_sa_reg.carrier_state.node.fields.present
                      if _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present
                      else _rh_sa_reg.carrier_state.node.fields.absent)
         | list }}
  ansible.builtin.set_fact:
    _rh_rf_in: >-
      {{ {'edition': rh_rel_edition,
          'declaration_rel': rh_rel_declaration_rel,
          'declaration_sha256': rh_rel_declaration_sha256,
          'declaration_path': rh_rel_declaration_node.split(_rh_sa_reg.path_law.separator),
          'interpreter': rh_rel_interpreter,
          (_rh_sa_regadm.ingress.transports.record.path | last): rh_rel_registry_sha256,
          _rh_sa_reg.carrier_state.node.key: _rh_rf_ovs}
         | combine(dict(_rh_rf_ovp | map(attribute=_rh_sa_reg.vocabulary.attributes.item_key)
                        | zip(query('ansible.builtin.vars',
                                    *(_rh_rf_ovp | map(attribute=_rh_sa_reg.vocabulary.attributes.item_value) | list))))) }}
