---
# testing/remote_harness/tasks/decide_private_group.yml -- the owner-private-group DECISION for one directory, on the
# controller, with the ONE generated program (path_admission.ancestry.owner_private_group; the seed embeds the same
# text). No gathering here: the caller supplies the private-group-facts/1 stream it gathered with the declared tools
# of the host that owns the directory (the TARGET's os_tools on a target; the controller's on the controller).
# RH-ANCESTRY-CONTROLLER-TOOL (codex 152001): the decision runs on the controller (delegate_to rh_controller_target), so
# its executable is the CONTROLLER's admitted tool -- hostvars[rh_controller_target].rh.controller.bootstrap.os_tools[<decision_tool>]
# (the delegate's own resolved policy, set by its resolve_policy.yml), stat-hashed against that entry's declared
# identity before it runs -- NEVER rh_pg_bs.os_tools (on a target play that is the target's selection, which stays
# legitimate for the target-side fact gathering and for the seed the target runs itself). The rule
# (owner_private_group, not a tunable path) must be identical in both policies; the program is rendered from the
# controller's.
# Inputs (no defaults):
#   rh_pg_bs         the resolved remote_harness.controller.bootstrap map of the host that owns the directory
#   rh_pg_repo_root  the checkout that holds program_template_rel (absolute)
#   rh_pg_facts      the facts stream (text, `<tag>TAB<value>` lines)
#   rh_pg_refusal    the caller's refusal code (its own vocabulary; the verdict text is the program's)
# Output: _rh_pg_decision (command result; stdout `ADMIT <dir>` on admission; cmd[0] = the controller tool that ran).
# A refusal fails the play.
# op1l (codex 924 CALLER_COMPOSITION_AND_342_FALLBACKS; no-exemption): every input is tested by MEMBERSHIP before any
# dependent access. rh_pg_refusal is the refusal's own input: it is admitted first with the native assertion report
# (no authored text; the admit_ancestry.yml stage 1a precedent, codex-tick409), never replaced by an invented code.
# The controller host and connection are the run_local pinned bindings rh_controller_target / rh_controller_connection
# (s39 :4834-4836 records-c1-framework-20 FW20-HOSTS: controller_delegation host and connection are WITHDRAWN as
# authored values; python_var stays), so the controller policy is hostvars[rh_controller_target].rh and every delegated
# task is delegated to rh_controller_target.
- name: Admit the decision include contract (stage 1a; the refusal's own input; native assertion report, no authored text)
  ansible.builtin.assert:
    that:
      - "'rh_pg_refusal' in vars and rh_pg_refusal is string and rh_pg_refusal | length > 0"

# route op1p (CPL-SR922D-ROUTE-ANC-APPLICABILITY; s43 owner_private_group.applicability key :4232, comment :4197-4231):
# this file is included by admit_ancestry.yml AND directly by tasks/initial_contact.yml, so it DERIVES the same launch
# context itself (first_match over `order`, admitted facts only, no include parameter) and runs only in a context whose
# exception is `decided`; the bindings it reads are that context's declared `bindings`, and its delegated tasks bind
# ansible_remote_tmp per that context's `remote_tmp` word (s43 work_roots.remote_tmp_authority.delegated_controller
# :3647-3652): run_local_leased -> the pin (an extra var: it outranks the task var below) required and equal to the
# controller TMPDIR (op1m rule, unchanged); seed_run -> the TASK var below = the controller env TMPDIR, required
# non-empty (no literal substitute), outranking a target play var.
- name: Admit the private-group applicability declaration (stage 1b0; the shape this file implements; the caller's code)
  ansible.builtin.assert:
    that:
      - "'rh_pg_bs' in vars and rh_pg_bs is mapping"
      - "'path_admission' in rh_pg_bs and rh_pg_bs.path_admission is mapping"
      - "'ancestry' in rh_pg_bs.path_admission and rh_pg_bs.path_admission.ancestry is mapping"
      - "'owner_private_group' in rh_pg_bs.path_admission.ancestry and rh_pg_bs.path_admission.ancestry.owner_private_group is mapping"
      - "'applicability' in rh_pg_bs.path_admission.ancestry.owner_private_group and rh_pg_bs.path_admission.ancestry.owner_private_group.applicability is mapping"
      - "['derive', 'order', 'caller_fact_from', 'contexts', 'otherwise'] | reject('in', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability) | list | length == 0"
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.derive == 'first_match'
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order is sequence and rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order is not string
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.caller_fact_from is sequence and rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.caller_fact_from is not string
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts is mapping
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | reject('in', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts) | list | length == 0
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('mapping') | list | length == 0
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('contains', 'when') | list | length == 0
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('contains', 'exception') | list | length == 0
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts) | map(attribute='when') | reject('mapping') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | map(attribute='when') | map('dict2items') | map('map', attribute='key') | map('sort') | map('list')
        | reject('in', [['caller_field', 'caller_in'], ['equals_from', 'var'], ['bindings_present', 'var_absent']]) | list | length == 0
      # a decided context declares its bindings and its remote_tmp word (one of the two rules this file implements)
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | reject('contains', 'bindings') | list | length == 0
      # the binding form (`var_absent`) is derived from the context's bindings_from / bindings: both present, a sequence each
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | reject('contains', 'bindings_from') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | reject('contains', 'bindings') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | map(attribute='bindings_from') | reject('sequence') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | rejectattr('bindings', 'sequence') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | reject('contains', 'remote_tmp') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp')
        | reject('in', ['pinned_required_equal_controller_tmpdir', 'task_var_controller_env']) | list | length == 0
      # route op1q (CPL-SR922G-ROUTE-RTMP-WORD; s64 :4569, :4576-4581, :4587; r51 :4887-4904; route op2c retarget): a decided context names
      # its work_roots.remote_tmp_authority key by remote_tmp_launch and its remote_tmp IS
      # delegated_controller[remote_tmp_launch]; the two rule words above are the rules this file implements (any other
      # refuses). CPL-OP1P-DPG-CONTROLLER-ENV-WORD (s64 :3942): the controller env name is delegated_controller
      # .controller_env, read below, never a literal.
      - "'work_roots' in rh_pg_bs and 'remote_tmp_authority' in rh_pg_bs.work_roots and rh_pg_bs.work_roots.remote_tmp_authority is mapping"
      - "'delegated_controller' in rh_pg_bs.work_roots.remote_tmp_authority and rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller is mapping"
      - "'controller_env' in rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller and rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env is string"
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | reject('contains', 'remote_tmp_launch') | list | length == 0
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp_launch')
        | reject('in', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller) | list | length == 0
      - >-
        (rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
         | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp') | list)
        == (rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
         | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp_launch')
         | map('extract', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller) | list)
      - >-
        rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.order | map('extract', rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts)
        | rejectattr('exception', 'equalto', 'decided') | reject('contains', 'text') | list | length == 0
      - rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.otherwise is mapping and 'text' in rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.otherwise
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }}: decide_private_group.yml needs rh_pg_bs with path_admission.ancestry.owner_private_group
      .applicability {derive first_match, order, caller_fact_from, contexts (each a when of a derived form and an
      exception; a decided one with bindings and remote_tmp), otherwise.text}; the failed `assertion` names the first
      absent or unimplemented part (no value is rendered here).
    quiet: true

- name: Derive the launch context (first_match over the declared order; admitted facts only; read-only)
  vars:
    _app: "{{ rh_pg_bs.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.set_fact:
    _rh_pg_app: >-
      {%- set r = namespace(missing=[], holds=[]) -%}
      {%- set cf = namespace(n=rh_pg_bs, ok=true) -%}
      {%- for k in _app.caller_fact_from -%}{%- if cf.ok and cf.n is mapping and k in cf.n -%}{%- set cf.n = cf.n[k] -%}{%- else -%}{%- set cf.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if not (cf.ok and cf.n is string) -%}{%- set r.missing = r.missing + ['caller_fact_from'] -%}{%- endif -%}
      {%- for name in _app.order -%}
        {%- set c = _app.contexts[name] -%}{%- set w = c.when -%}
        {%- if 'caller_in' in w -%}
          {%- set p = namespace(n=rh_pg_bs, ok=true) -%}
          {%- for k in w.caller_in -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif cf.ok and cf.n is string and cf.n in vars
                   and lookup('ansible.builtin.vars', cf.n) in (p.n.values() | select('mapping') | select('contains', w.caller_field) | map(attribute=w.caller_field) | list) -%}
            {%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- elif 'equals_from' in w -%}
          {%- set p = namespace(n=rh_pg_bs, ok=true) -%}
          {%- for k in w.equals_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is string) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var in vars and lookup('ansible.builtin.vars', w.var) == p.n -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- else -%}
          {%- set p = namespace(n=rh_pg_bs, ok=true) -%}
          {%- for k in c.bindings_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping and c.bindings | reject('in', p.n) | list | length == 0 and w.bindings_present is sameas true) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var_absent not in vars and c.bindings | reject('in', vars) | list | length == 0 -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'missing': r.missing, 'holds': r.holds} }}

- name: Refuse outside a decided launch context (genesis_launch, otherwise, an unresolved declared path; the caller's code)
  vars:
    _app: "{{ rh_pg_bs.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.assert:
    that:
      - _rh_pg_app.missing | length == 0
      - _rh_pg_app.holds | length > 0
      - _app.contexts[_rh_pg_app.holds | first].exception == 'decided'
    # route op1q (codex 931 ROUTE_ASSERTION_DIAGNOSTICS): the assert action templates fail_msg BEFORE it evaluates
    # `that`, so every part is valid for every admitted context, a decided one (no `text` field) included: the held
    # context's text is printed only under its membership conditional, otherwise.text only when nothing holds
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }}:
      {% if _rh_pg_app.missing | length > 0 %}decide_private_group.yml cannot resolve the declared applicability words {{ _rh_pg_app.missing | to_json }}
      {%- elif _rh_pg_app.holds | length == 0 %}{{ _app.otherwise.text }}
      {%- elif 'text' in _app.contexts[_rh_pg_app.holds | first] %}{{ _app.contexts[_rh_pg_app.holds | first].text }}{% endif %}
      (held {{ _rh_pg_app.holds | to_json }})
    quiet: true

- name: Refuse an absent controller binding or controller policy before any dependent read (stage 1b; the caller's code)
  vars:
    _ctx: "{{ rh_pg_bs.path_admission.ancestry.owner_private_group.applicability.contexts[_rh_pg_app.holds | first] }}"
  ansible.builtin.assert:
    that:
      # the decided context's declared bindings, every one present (run_local_leased: the run-local pins incl.
      # ansible_remote_tmp; seed_run: the run_pinned_vars pair)
      - _ctx.bindings | reject('in', vars) | list | length == 0
      - "'rh_controller_target' in _ctx.bindings and 'rh_controller_connection' in _ctx.bindings"
      - rh_controller_target is string
      - rh_controller_connection is string
      - rh_controller_target in hostvars
      - "'rh' in hostvars[rh_controller_target] and hostvars[rh_controller_target].rh is mapping"
      - "'controller' in hostvars[rh_controller_target].rh and 'bootstrap' in hostvars[rh_controller_target].rh.controller"
      - "'inventory' in hostvars[rh_controller_target].rh.controller.bootstrap"
      - "'controller_delegation' in hostvars[rh_controller_target].rh.controller.bootstrap.inventory"
      - "'python_var' in hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation"
      - hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var in vars
      - "'rh_pg_bs' in vars and 'rh_pg_repo_root' in vars and 'rh_pg_facts' in vars"
      # op1m (run_local_leased, remote_tmp required_equal_controller_tmpdir; unchanged): the controller remote temp is the
      # run-local pinned ansible_remote_tmp (an extra var, it outranks the task var below), present by membership; its
      # value is admitted in the stage-2 assert below.
      # route op1p (seed_run, remote_tmp task_var_controller_env; s43 :3694-3699): no pin; the delegated tasks carry the
      # task var ansible_remote_tmp = the controller env TMPDIR, which must be non-empty (an unset TMPDIR reads '' from
      # the env lookup: refused, never a literal substitute)
      - >-
        (rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller[_ctx.remote_tmp_launch] == 'pinned_required_equal_controller_tmpdir'
         and 'ansible_remote_tmp' in vars and ansible_remote_tmp is string and ansible_remote_tmp | length > 0)
        or (rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller[_ctx.remote_tmp_launch] == 'task_var_controller_env'
            and lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) | length > 0)
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }} (RH-CONTROLLER-DELEGATION): decide_private_group.yml in launch context
      {{ _rh_pg_app.holds | first }} needs that context's declared bindings {{ _ctx.bindings | to_json }}, the controller's
      resolved policy at hostvars[rh_controller_target].rh with inventory.controller_delegation.python_var naming a
      present var, the remote temp its rule {{ _ctx.remote_tmp }} names (the run-local pin, or a non-empty controller
      {{ rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env }}), and rh_pg_bs, rh_pg_repo_root, rh_pg_facts (present:
      {{ (_ctx.bindings + ['rh_pg_bs', 'rh_pg_repo_root', 'rh_pg_facts']) | select('in', vars) | list | to_json }}).
    quiet: true

- name: Refuse an absent decision-rule or controller-tool key before any dependent read (stage 1c; the caller's code)
  # op1m (codex 924; seat op1m item 2): every nested key the stage-2 assert, the delegated tasks, the program template
  # call and the fail messages read is tested by MEMBERSHIP, parent before child (asserts stop at the first false)
  vars:
    _cb: "{{ hostvars[rh_controller_target].rh.controller.bootstrap }}"
  ansible.builtin.assert:
    that:
      - rh_pg_bs is mapping
      - "'path_admission' in rh_pg_bs and rh_pg_bs.path_admission is mapping"
      - "'regex' in rh_pg_bs.path_admission and rh_pg_bs.path_admission.regex is string"
      - "'ancestry' in rh_pg_bs.path_admission and rh_pg_bs.path_admission.ancestry is mapping"
      - "'owner_private_group' in rh_pg_bs.path_admission.ancestry and rh_pg_bs.path_admission.ancestry.owner_private_group is mapping"
      - "'enabled' in rh_pg_bs.path_admission.ancestry.owner_private_group"
      # route op1q (HOLE-SEAT-COERCION-FILTER-SWEEP): enabled admitted as a BOOLEAN (route op1r: r51 :4871-4873 type-exact boolean enum; s64 :4497), read by sameas
      - rh_pg_bs.path_admission.ancestry.owner_private_group.enabled is boolean
      - "'facts_schema' in rh_pg_bs.path_admission.ancestry.owner_private_group"
      - _cb is mapping
      - "'path_admission' in _cb and _cb.path_admission is mapping"
      - "'ancestry' in _cb.path_admission and _cb.path_admission.ancestry is mapping"
      - "'owner_private_group' in _cb.path_admission.ancestry and _cb.path_admission.ancestry.owner_private_group is mapping"
      - "'decision_tool' in _cb.path_admission.ancestry.owner_private_group and _cb.path_admission.ancestry.owner_private_group.decision_tool is string"
      - "'program_template_rel' in _cb.path_admission.ancestry.owner_private_group and _cb.path_admission.ancestry.owner_private_group.program_template_rel is string"
      - "'os_tools' in _cb and _cb.os_tools is mapping"
      - _cb.path_admission.ancestry.owner_private_group.decision_tool in _cb.os_tools
      - _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool] is mapping
      - "'path' in _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool]"
      - "'identity' in _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool]"
      - _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].identity is mapping
      - "'kind' in _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].identity"
      - "'sha256' in _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].identity"
      # op1n (CPL-OP1M-DPG-TEMPLATE-KEYS): the keys the program part reads (private_group_program.j2 rh_pg_part
      # 'program' -> macros/controller_seed.j2 private_group_program(bs) :373-385, bs = _cb as passed below):
      # owner_private_group.identity_provider {allowed_sources (a list of word lists, each joined), databases}
      - "'identity_provider' in _cb.path_admission.ancestry.owner_private_group and _cb.path_admission.ancestry.owner_private_group.identity_provider is mapping"
      - "'allowed_sources' in _cb.path_admission.ancestry.owner_private_group.identity_provider and _cb.path_admission.ancestry.owner_private_group.identity_provider.allowed_sources is sequence and _cb.path_admission.ancestry.owner_private_group.identity_provider.allowed_sources is not string"
      - _cb.path_admission.ancestry.owner_private_group.identity_provider.allowed_sources | reject('sequence') | list | length == 0
      - _cb.path_admission.ancestry.owner_private_group.identity_provider.allowed_sources | select('string') | list | length == 0
      - "'databases' in _cb.path_admission.ancestry.owner_private_group.identity_provider and _cb.path_admission.ancestry.owner_private_group.identity_provider.databases is sequence and _cb.path_admission.ancestry.owner_private_group.identity_provider.databases is not string"
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }} (RH-ANCESTRY-CONTROLLER-TOOL): decide_private_group.yml needs, in rh_pg_bs,
      path_admission {regex, ancestry.owner_private_group {enabled, facts_schema}} and, in the controller's resolved
      policy hostvars[rh_controller_target].rh.controller.bootstrap, path_admission.ancestry.owner_private_group
      {decision_tool, program_template_rel, identity_provider {allowed_sources (word lists), databases}} and
      os_tools[decision_tool] {path, identity {kind, sha256}}; the failed
      `assertion` names the first absent key (no value is rendered here).
    quiet: true

- name: Admit the decision inputs and the controller's resolved policy (no fallback)
  vars:
    _cb: "{{ hostvars[rh_controller_target].rh.controller.bootstrap }}"
    # the SAME task-var pin the delegated tasks carry: if anything outranks it (an extra-var), the effective value
    # read here differs and the decision refuses before any delegated task runs
    ansible_connection: "{{ rh_controller_connection }}"
    # codex 155203 delegation residual: the SAME interpreter pin; an extra-var / include parameter outranking it refuses
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    # route op1p: the SAME remote-temp task var the delegated tasks carry (s43 remote_tmp_authority.delegated_controller
    # run task_var_controller_env, controller_env TMPDIR :3651); under run_local_leased the extra-var pin outranks it
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.assert:
    that:
      - ansible_connection in ['local', 'ansible.builtin.local']
      - ansible_python_interpreter == ansible_playbook_python
      - rh_pg_bs is mapping and rh_pg_bs.path_admission.ancestry.owner_private_group is mapping
      - rh_pg_bs.path_admission.ancestry.owner_private_group.enabled is sameas true
      - rh_pg_repo_root is string and rh_pg_repo_root is match(rh_pg_bs.path_admission.regex)
      - rh_pg_facts is string and rh_pg_facts | length > 0
      - _cb is mapping and _cb.path_admission.ancestry.owner_private_group is mapping
      - _cb.path_admission.ancestry.owner_private_group == rh_pg_bs.path_admission.ancestry.owner_private_group
      - _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool] is mapping
      - _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].identity.kind == 'file_sha256'
      # RH-CONTROLLER-DELEGATION: the delegated tasks below pin the pinned controller connection as TASK vars
      # (FW20-HOSTS: the withdrawn controller_delegation host / connection words are not read)
      - rh_controller_connection in ['local', 'ansible.builtin.local']
      # op1m (seat op1m item 1; the retired TMPDIR-or-literal task var): the delegated tasks set NO remote temp of their
      # own. The declared rule (s39 controller.bootstrap work_roots note :3445-3446): each controller `seed run` dir's
      # tmp/ is TMPDIR, ANSIBLE_LOCAL_TEMP's parent and the local remote_tmp; the run-local launch pins
      # ansible_remote_tmp = {run_tmp} (s39 :3665) and exports remote_tmp_env = that pin (s39 :3687, :3706). So the
      # effective value (present by membership in stage 1b) must equal the controller's TMPDIR; an unset TMPDIR reads ''
      # (env lookup without the default keyword) and never equals the non-empty pin: refused, never substituted. A
      # target-derived ansible_remote_tmp (a target play var, s39 :3450) refuses here instead of reaching the controller.
      # route op1p: under seed_run the task var above outranks a target play var, so the effective value is the
      # controller TMPDIR, required non-empty (stage 1b); under run_local_leased the pin must equal it (op1m rule)
      - lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) | length > 0
      - ansible_remote_tmp == lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env)
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }}: decide_private_group.yml needs rh_pg_bs (with
      path_admission.ancestry.owner_private_group enabled), rh_pg_repo_root, rh_pg_facts and rh_pg_refusal (required),
      and the controller's resolved policy (hostvars[rh_controller_target].rh, set by resolve_policy.yml on the controller play host) with the
      SAME owner_private_group rule and a file_sha256-admitted decision tool (RH-ANCESTRY-CONTROLLER-TOOL); the delegated
      decision runs over the declared local connection with the controller's own interpreter (RH-CONTROLLER-DELEGATION;
      effective '{{ ansible_connection }}' / '{{ ansible_python_interpreter }}', controller '{{ ansible_playbook_python }}';
      remote temp '{{ ansible_remote_tmp }}' must equal the controller {{ rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env }} '{{ lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}').
    quiet: true

- name: Hash the controller's decision tool before it runs (controller; stat sha256, links followed; read-only)
  vars:
    _cb: "{{ hostvars[rh_controller_target].rh.controller.bootstrap }}"
    # the pinned controller connection as TASK vars (outrank a target play's connection/host/user play vars)
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    # route op1p (supersedes op1m's "no task-level remote temp"): the controller env TMPDIR as the task var; the
    # run-local extra-var pin outranks it and was admitted equal to it above; under seed_run it is the governing value
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.stat:
    path: "{{ _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].path }}"
    follow: true
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  delegate_to: "{{ rh_controller_target }}"
  register: _rh_pg_tool

- name: Refuse a controller decision tool that is not its declared identity
  vars:
    _t: "{{ hostvars[rh_controller_target].rh.controller.bootstrap.os_tools[hostvars[rh_controller_target].rh.controller.bootstrap.path_admission.ancestry.owner_private_group.decision_tool] }}"
  ansible.builtin.assert:
    that:
      - _rh_pg_tool.stat.exists and _rh_pg_tool.stat.isreg and _rh_pg_tool.stat.executable
      # op1l: membership before the read (a stat of an absent / non-regular path carries no checksum)
      - "'checksum' in _rh_pg_tool.stat and _rh_pg_tool.stat.checksum == _t.identity.sha256"
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }} (RH-ANCESTRY-CONTROLLER-TOOL): the controller decision tool {{ _t.path }} is absent,
      not executable or not its declared identity (checksum present {{ ('checksum' in _rh_pg_tool.stat) | to_json }}{% if 'checksum' in _rh_pg_tool.stat %}: {{ _rh_pg_tool.stat.checksum }}{% endif %} vs {{ _t.identity.sha256 }}).
    quiet: true

- name: Decide the owner-private-group admission with the ONE generated program (controller's admitted tool; read-only)
  vars:
    _cb: "{{ hostvars[rh_controller_target].rh.controller.bootstrap }}"
    _pg: "{{ _cb.path_admission.ancestry.owner_private_group }}"
    # delegated to the controller: the controller's own run temp is the pinned ansible_remote_tmp, admitted equal to the
    # controller's TMPDIR in the stage-2 assert (op1m; never a target-derived play value, never a substituted literal);
    # the pinned controller connection and the declared interpreter as TASK vars
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    # route op1p: the controller env TMPDIR task var (as the stat above)
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh_pg_bs.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv:
      - "{{ _cb.os_tools[_pg.decision_tool].path }}"
      - >-
        {{ lookup('ansible.builtin.template', rh_pg_repo_root ~ '/' ~ _pg.program_template_rel,
                  template_vars={'rh_pg_bs': _cb, 'rh_pg_part': 'program'}) }}
    stdin: "{{ rh_pg_facts | replace('\r', '') }}"
    stdin_add_newline: true
  delegate_to: "{{ rh_controller_target }}"
  register: _rh_pg_decision
  changed_when: false
  failed_when: false

- name: Refuse a group-writable directory that is not an admitted owner-private group
  vars:
    _cb: "{{ hostvars[rh_controller_target].rh.controller.bootstrap }}"
  ansible.builtin.assert:
    that:
      # op1l: the result keys are tested by membership before they are read (an unrun command carries none)
      - "'cmd' in _rh_pg_decision and _rh_pg_decision.cmd is sequence and (_rh_pg_decision.cmd | length) > 0"
      - _rh_pg_decision.cmd | first == _cb.os_tools[_cb.path_admission.ancestry.owner_private_group.decision_tool].path
      - "'rc' in _rh_pg_decision and _rh_pg_decision.rc == 0"
      - "'stdout' in _rh_pg_decision and _rh_pg_decision.stdout is match('^ADMIT /')"
    fail_msg: >-
      REFUSED {{ rh_pg_refusal }}:{% if 'stdout' in _rh_pg_decision %} {{ _rh_pg_decision.stdout }}{% endif %}{% if 'stderr' in _rh_pg_decision %} {{ _rh_pg_decision.stderr }}{% endif %}
      (path_admission.ancestry.owner_private_group; facts schema {{ rh_pg_bs.path_admission.ancestry.owner_private_group.facts_schema }};
      decided by{% if 'cmd' in _rh_pg_decision and _rh_pg_decision.cmd is sequence and (_rh_pg_decision.cmd | length) > 0 %} {{ _rh_pg_decision.cmd | first }}{% endif %}; result keys present
      {{ ['cmd', 'rc', 'stdout', 'stderr'] | select('in', _rh_pg_decision) | list | to_json }})
    quiet: true
