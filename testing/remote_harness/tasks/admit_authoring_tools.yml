- name: Select tool roles from the sole existing bootstrap tool authority
  ansible.builtin.set_fact:
    rh_ar_tools: '{{ dict(rh_ar_contract.tool_roles | list | zip(rh_ar_contract.tool_roles.values() | map(''extract'', rh_ar_bootstrap.os_tools)))
      }}'
- name: Verify declared tool identities before invoking reconciliation mechanisms
  ansible.builtin.stat:
    path: '{{ item.value.path }}'
    follow: true
    get_checksum: true
    checksum_algorithm: '{{ rh_ar_contract.digest }}'
    get_mime: false
    get_attributes: false
  loop: '{{ rh_ar_tools | dict2items }}'
  register: _rh_ar_tool_stats
- name: Refuse mismatched declared tool binaries
  ansible.builtin.assert:
    that:
    - item.stat.exists and item.stat.isreg
    - item.stat.checksum == item.item.value.identity.sha256
    - not item.stat.wgrp and not item.stat.woth
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.identity }} {{ item.item.key }}'
    quiet: true
  loop: '{{ _rh_ar_tool_stats.results }}'
