---
# testing/remote_harness/tasks/admit_git_paths.yml -- the ONE commit-membership and byte admission of an exact path list
# against an intended immutable commit (route r2k, superseding r2j 694c8493 per codex-tick454 R2J-GIT-CONFIG-AND-
# ATTRIBUTE-SEMANTICS; r2j superseded r2i 90365424; codex-tick424 R2H-COMMITTED-MEMBERSHIP +
# R2H-GIT-ERROR-CLASSIFICATION; codex-tick427-428 loader source admission; codex-tick440 R2I-GIT-OBJECT-AND-CONFIG-TRUST
# + P16). NEW FILE. AUTHORED, NEVER EXECUTED (every control UNRUN).
# r2l (codex-tick473): R2K-ATTRIBUTE-STATE-CLAIM -- any printed conversion attribute refuses (no state classification);
# R2K-RENDERER-IDENTITY related exactness -- path uniqueness is case-sensitive.
#
# DECLARED GIT INVOCATION POLICY (r2j; all values in the ONE bootstrap declaration's git node, C1-R2J-2):
#   environment  every git process starts from `<env> -i <git.env_pairs...>` (the admitted env tool, os_tools.env): NO
#                ambient variable survives (GIT_DIR / GIT_WORK_TREE / GIT_INDEX_FILE / GIT_OBJECT_DIRECTORY /
#                GIT_ALTERNATE_OBJECT_DIRECTORIES / GIT_CONFIG_* / HOME cannot steer it); env_pairs declare
#                GIT_CONFIG_NOSYSTEM=1, GIT_CONFIG_GLOBAL=/dev/null, GIT_ATTR_NOSYSTEM=1, GIT_NO_REPLACE_OBJECTS=1,
#                GIT_OPTIONAL_LOCKS=0, GIT_TERMINAL_PROMPT=0 and the base PATH / LC_ALL.
#   objects      --no-replace-objects (git.global) + GIT_NO_REPLACE_OBJECTS: refs/replace cannot substitute a commit
#                or tree under the unchanged edition name; the repository object format must be git.object_format
#                (sha1; edition_regex is its 40-hex form) -- any other format refuses (object_format) before any read.
#   config       repository-controlled execution refused BEFORE any command that could run it: (r2k) `config --list
#                --name-only --no-includes -z` with NO scope flag (git.config; inspection prefix without the -c
#                overrides) lists the KEYS of the EFFECTIVE configuration the admitted invocation reads -- repository
#                config and, under extensions.worktreeConfig, config.worktree (r2j's --local omitted it) -- with no
#                value printed (multiline values cannot shift a key boundary; no value regex). Any key matching
#                git.config_refused_regex (fsmonitor, hooksPath, filter.*, diff.*.textconv/command, include/includeIf,
#                sshCommand, askPass, pager, editor, alternateRefsCommand, autocrlf/eol/safecrlf) or not of the
#                declared key form refuses (config). git.global also forces -c core.fsmonitor=false (defence in depth).
#   conversion   P16 checkout-conversion policy NONE: `check-attr -z --all` of the admitted paths; (r2l, codex-tick473
#                R2K-ATTRIBUTE-STATE-CLAIM) the printed info token cannot tell the unset STATE from a VALUE spelled
#                `unset` (nor set from `set`), so NO state is classified: ANY printed record of a conversion attribute
#                (git.conversion_attrs) refuses (conversion). Property bound: no conversion attribute is specified --
#                set, unset or valued -- for any admitted path (only the never-printed unspecified state is admitted).
#                The r2k attr_states / conversion_permitted_states state claim is WITHDRAWN. hash-object runs
#                --no-filters: a mismatch is NEVER made to pass by running a clean filter.
#   order        HEAD -> object format -> config -> attributes -> tree / index / worktree -> (GEN-ADOPT2, only when
#                requested) bounded historical proof -> status (the only command that could execute repository code runs
#                last, after every refusal above).
# Consumers: tasks/admit_loader_source.yml (before resolution: loader + manifest members) and
# tasks/generate_entries.yml (entry admission inputs + outputs). Read-only: git runs with the declared global argv
# (no optional locks: no index refresh write; literal pathspecs); nothing is staged, hashed into the object store or
# repaired.
#
# Three object ids per path, from commands that exit 0 in normal use (never --quiet / --exit-code / --error-unmatch,
# whose exit 1 means "difference" and would collide with the tool-failure cause):
#   tree      ls-tree of the intended commit     absent = untracked OR IGNORED (status cannot show it) -> untracked
#                                                type/mode not a declared blob (link 120000, gitlink 160000) -> untracked
#   index     ls-files -s                        absent / unmerged / other oid or mode than the tree -> staged
#   worktree  hash-object --no-filters           other oid than the tree (wrong-commit or uncommitted bytes) -> bytes
# then porcelain status of the same paths as the residual catch-all -> uncommitted.
# Every command: failed_when false; ANY nonzero rc refuses with the DISTINCT tool cause, every rc and stderr preserved,
# and nothing continues. HEAD must equal the intended commit (the bytes used are the worktree's).
# Callers stat-admit the paths first (exists, regular, not a link): hash-object of a missing path would otherwise be a
# tool failure, not the missing cause.
#
# Inputs (include parameters; EXACT reserved outputs, so an extra-var pin refuses at refuse_pinned_outputs.yml):
#   rh_gp_tool      the admitted git executable path (identity admitted by the caller before this include)
#   rh_gp_env       the admitted env executable path (os_tools.env; identity admitted by the caller)
#   rh_gp_git       the declared git grammar (bootstrap declaration source_admission.git)
#   rh_gp_repo      the checkout root (absolute)
#   rh_gp_paths     the exact checkout-relative paths to admit (non-empty, unique)
#   rh_gp_absent    paths that must be ABSENT from the intended commit tree (may be empty; e.g. retired outputs)
#   rh_gp_probe     paths only CLASSIFIED (tracked or not by the intended commit; may be empty; no refusal)
#   rh_gp_edition   the intended commit (full object id), or none: HEAD as read here is the intended commit
#   rh_gp_codes     refusal codes, keys == git.cause_keys {tool, edition, object_format, config, conversion, untracked,
#                   staged_change, commit_bytes, uncommitted, absent}
#   rh_gp_texts     the same keys: declared diagnostic texts
#   rh_gp_history   none, or the BOUNDED HISTORICAL PROOF (GEN-ADOPT2, codex-tick512 ADO-SOURCE-EDITION-PROOF +
#                   ADO-LOST-RECORD-RELABEL): a mapping whose key set == the values of git.history.input_roles, read only
#                   through those roles (below by role name) --
#                     edition  none, or a historical commit (edition_regex) that must be an object of type commit,
#                              REACHABLE from the admitted HEAD (an ancestor or HEAD itself)
#                     blobs    {path: blob oid}: each path is a declared blob of `edition`'s tree with exactly that oid
#                              (empty iff edition is none)
#                     lineage  paths that must have NO history in HEAD's ancestry (no commit reachable from HEAD ever
#                              touched them, merges included: --full-history); a shallow repository refuses (absence
#                              of history is unprovable there)
#                     codes / texts  key set == the values of git.history.cause_roles {history, lineage}: the CALLER's
#                              family codes and texts (no new registry; the include owns no code of its own)
#                   Every caller passes it explicitly (none = no historical proof). Only exit-0-in-normal-use commands
#                   (object listing on stdin, rev-list, ls-tree); no object is fetched (partial-clone / promisor config
#                   refuses at the config step), written or repaired. It runs before status (still last).
# Outputs: rh_gp_head (the admitted commit), rh_gp_oids ({path: blob oid at that commit}), rh_gp_tracked (the probe paths
# the intended commit tracks). Registers/task vars: the reserved family _rh_gp_* (GEN-ADOPT2 adds _rh_gp_hed, _rh_gp_hbl,
# _rh_gp_hli, _rh_gp_hco, _rh_gp_hte, _rh_gp_hshal, _rh_gp_hobj, _rh_gp_hreach, _rh_gp_hlin: registry hunk H2-MAIN-GLO-01).

- name: "GIT ADMISSION -- refuse malformed inputs (no default)"
  vars:
    _rh_gp_HI: "{{ rh_gp_git.history.input_roles }}"
  ansible.builtin.assert:
    that:
      - rh_gp_tool is string and rh_gp_tool is match(rh_gp_git.tool_path_regex)
      - rh_gp_env is string and rh_gp_env is match(rh_gp_git.tool_path_regex)
      - rh_gp_git is mapping
      - rh_gp_repo is string and rh_gp_repo is match(rh_gp_git.tool_path_regex)
      - rh_gp_paths is sequence and rh_gp_paths is not string and rh_gp_paths | length > 0
      - rh_gp_paths | unique(case_sensitive=true) | list | length == rh_gp_paths | length
      - rh_gp_absent is sequence and rh_gp_absent is not string
      - rh_gp_absent | intersect(rh_gp_paths) | length == 0
      - rh_gp_probe is sequence and rh_gp_probe is not string
      - rh_gp_probe | intersect(rh_gp_paths + rh_gp_absent) | length == 0
      - rh_gp_edition is none or rh_gp_edition is match(rh_gp_git.edition_regex)
      - rh_gp_codes is mapping and (rh_gp_codes.keys() | list | sort) == (rh_gp_git.cause_keys | sort)
      - rh_gp_texts is mapping and (rh_gp_texts.keys() | list | sort) == (rh_gp_git.cause_keys | sort)
      # GEN-ADOPT2 bounded historical proof (none, or exactly the declared shape; every key read through its role)
      - rh_gp_history is none or (rh_gp_history is mapping
          and (rh_gp_history.keys() | list | sort) == (_rh_gp_HI.values() | list | sort)
          and (rh_gp_history[_rh_gp_HI.edition] is none or rh_gp_history[_rh_gp_HI.edition] is match(rh_gp_git.edition_regex))
          and rh_gp_history[_rh_gp_HI.blobs] is mapping
          and ((rh_gp_history[_rh_gp_HI.blobs] | length == 0) == (rh_gp_history[_rh_gp_HI.edition] is none))
          and (rh_gp_history[_rh_gp_HI.blobs].values() | reject('match', rh_gp_git.edition_regex) | list | length == 0)
          and rh_gp_history[_rh_gp_HI.lineage] is sequence and rh_gp_history[_rh_gp_HI.lineage] is not string
          and (rh_gp_history[_rh_gp_HI.lineage] | unique(case_sensitive=true) | list | length == rh_gp_history[_rh_gp_HI.lineage] | length)
          and (rh_gp_history[_rh_gp_HI.edition] is not none or rh_gp_history[_rh_gp_HI.lineage] | length > 0)
          and rh_gp_history[_rh_gp_HI.codes] is mapping
          and (rh_gp_history[_rh_gp_HI.codes].keys() | list | sort) == (rh_gp_git.history.cause_roles.values() | list | sort)
          and rh_gp_history[_rh_gp_HI.texts] is mapping
          and (rh_gp_history[_rh_gp_HI.texts].keys() | list | sort) == (rh_gp_git.history.cause_roles.values() | list | sort))
    fail_msg: >-
      REFUSED {{ rh_gp_git.input_refusal }}: {{ rh_gp_git.input_text }}
      {{ [rh_gp_tool, rh_gp_env, rh_gp_repo, rh_gp_paths, rh_gp_absent, rh_gp_probe, rh_gp_edition, rh_gp_history] | to_json }}
    quiet: true

# ONE argv prefix (one implementation of the shared mechanics; every command below appends to it): the cleared
# environment with exactly the declared pairs, the admitted git, its declared global options, the repository.
# _rh_gp_ix is the INSPECTION prefix of the config listing: the same, with git.inspect_global (no -c overrides).
- name: "GIT ADMISSION -- bind the declared invocation prefixes (derived)"
  ansible.builtin.set_fact:
    _rh_gp_x: "{{ [rh_gp_env, rh_gp_git.env_clear] + rh_gp_git.env_pairs + [rh_gp_tool] + rh_gp_git.global + [rh_gp_repo] }}"
    _rh_gp_ix: "{{ [rh_gp_env, rh_gp_git.env_clear] + rh_gp_git.env_pairs + [rh_gp_tool] + rh_gp_git.inspect_global + [rh_gp_repo] }}"

- name: "GIT ADMISSION -- read HEAD (classified)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.head }}"
  register: _rh_gp_head
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- refuse a git tool failure reading HEAD (tool cause)"
  ansible.builtin.assert:
    that:
      - _rh_gp_head.rc == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool }}: {{ rh_gp_texts.tool }}
      {{ [rh_gp_git.head, _rh_gp_head.rc, _rh_gp_head.stderr] | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse a malformed HEAD or a HEAD that is not the intended commit (edition)"
  ansible.builtin.assert:
    that:
      - _rh_gp_head.stdout is match(rh_gp_git.edition_regex)
      - rh_gp_edition is none or _rh_gp_head.stdout == rh_gp_edition
    fail_msg: >-
      REFUSED {{ rh_gp_codes.edition }}: {{ rh_gp_texts.edition }}
      {{ [_rh_gp_head.stdout, rh_gp_edition] | to_json }}
    quiet: true

# ---- REPOSITORY POLICY (P16 + R2I-GIT-OBJECT-AND-CONFIG-TRUST), before any path is read ------------------------------
- name: "GIT ADMISSION -- read the object format, the repository config keys and the admitted paths' attributes (classified)"
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - "{{ _rh_gp_x + rh_gp_git.object_format_argv }}"
    - "{{ _rh_gp_ix + rh_gp_git.config }}"
    - "{{ _rh_gp_x + rh_gp_git.attributes + [rh_gp_git.end_of_options] + rh_gp_paths }}"
  register: _rh_gp_pol
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- refuse a git tool failure reading the repository policy (tool cause)"
  ansible.builtin.assert:
    that:
      - _rh_gp_pol.results | map(attribute='rc') | reject('equalto', 0) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool }}: {{ rh_gp_texts.tool }}
      {{ [rh_gp_git.object_format_argv, rh_gp_git.config, rh_gp_git.attributes]
         | zip(_rh_gp_pol.results | map(attribute='rc'), _rh_gp_pol.results | map(attribute='stderr')) | list | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse an unsupported object format (P16; no SHA-256 repository is claimed)"
  ansible.builtin.assert:
    that:
      - _rh_gp_pol.results[0].stdout == rh_gp_git.object_format
    fail_msg: >-
      REFUSED {{ rh_gp_codes.object_format }}: {{ rh_gp_texts.object_format }}
      {{ [_rh_gp_pol.results[0].stdout, rh_gp_git.object_format] | to_json }}
    quiet: true

# r2k R2J-GIT-CONFIG-AND-ATTRIBUTE-SEMANTICS (config). git.config is the KEY-ONLY listing of the EFFECTIVE configuration
# (`config --list --name-only --no-includes -z`, NO scope flag; C1-R2K-GIT): records are <key><config_record.terminator>
# -- no value is printed, so a multiline value can never shift a key boundary and no value-stripping regex exists (the
# r2j value_regex `\n.*$` is WITHDRAWN). Run through the admitted invocation (_rh_gp_ix: env -i + the declared pairs,
# GIT_CONFIG_NOSYSTEM / GIT_CONFIG_GLOBAL=/dev/null, no -c), the effective view is exactly what every later git command
# of this include reads: the repository config AND, when extensions.worktreeConfig is on, config.worktree (which
# `--local` omitted -- tick454). Every record must be a well-formed key (git.config_key_regex: section[.subsection].name,
# no NUL / newline) or the listing itself refuses (config).
- name: "GIT ADMISSION -- refuse repository configuration that can execute code or convert bytes (config)"
  vars:
    _rh_gp_cfg: "{{ _rh_gp_pol.results[1].stdout }}"
    _rh_gp_keys: "{{ _rh_gp_cfg.split(rh_gp_git.config_record.terminator)[:-1] if _rh_gp_cfg | length > 0 else [] }}"
    _rh_gp_form: "{{ _rh_gp_keys | reject('match', rh_gp_git.config_key_regex) | list }}"
    _rh_gp_bad: "{{ _rh_gp_keys | select('match', rh_gp_git.config_refused_regex, ignorecase=true) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_gp_cfg | length == 0 or _rh_gp_cfg.endswith(rh_gp_git.config_record.terminator)
      - _rh_gp_form | length == 0
      - _rh_gp_bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.config }}: {{ rh_gp_texts.config }}
      {{ [_rh_gp_form, _rh_gp_bad] | to_json }}
    quiet: true

# r2k R2J-GIT-CONFIG-AND-ATTRIBUTE-SEMANTICS (attributes). check-attr -z --all records: <path>NUL<attribute>NUL<info>NUL.
# r2l R2K-ATTRIBUTE-STATE-CLAIM (codex-tick473): check-attr prints assigned values verbatim, so the info token `unset`
# is either the unset STATE (-text) or an assigned VALUE spelled unset (filter=unset) -- the observed format cannot
# discriminate them, and harmless effective semantics of every ambiguous spelling are not independently established
# here. NO state is classified: with --all a genuinely unspecified attribute is never printed, and ANY printed record
# whose attribute is a conversion attribute refuses (conversion), whatever its info. The no-active-conversion and
# raw-identity guarantees are kept (hash-object --no-filters; config_refused_regex still refuses filter.* / diff.*).
# The record count must be an exact multiple of the field count (no trailing partial record). Checked candidate
# .gitattributes (m1-1): `testing export-ignore` only -- no conversion attribute, so the current checkout is admitted.
- name: "GIT ADMISSION -- refuse a checkout-conversion attribute on an admitted path (P16 conversion policy: none)"
  vars:
    _rh_gp_a: "{{ _rh_gp_pol.results[2].stdout }}"
    _rh_gp_f: "{{ _rh_gp_a.split(rh_gp_git.record.terminator)[:-1] if _rh_gp_a | length > 0 else [] }}"
    _rh_gp_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for i in range(0, _rh_gp_f | length, rh_gp_git.attr_record_fields) -%}
      {%- if _rh_gp_f[i + 1] in rh_gp_git.conversion_attrs -%}
      {%- set ns.o = ns.o + [[_rh_gp_f[i], _rh_gp_f[i + 1], _rh_gp_f[i + 2]]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_gp_a | length == 0 or _rh_gp_a.endswith(rh_gp_git.record.terminator)
      - (_rh_gp_f | length) % rh_gp_git.attr_record_fields == 0
      - _rh_gp_bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.conversion }}: {{ rh_gp_texts.conversion }}
      {{ _rh_gp_bad | to_json }}
    quiet: true

- name: "GIT ADMISSION -- tree entries of the intended commit for exactly the admitted, must-be-absent and probe paths (classified)"
  ansible.builtin.command:
    argv: >-
      {{ _rh_gp_x + rh_gp_git.tree + [_rh_gp_head.stdout, rh_gp_git.end_of_options] + rh_gp_paths + rh_gp_absent + rh_gp_probe }}
  register: _rh_gp_tree
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- index entries of exactly the admitted paths (classified)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.index + [rh_gp_git.end_of_options] + rh_gp_paths }}"
  register: _rh_gp_index
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- object ids of the worktree bytes of exactly the admitted paths (no write, no filters; classified)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.worktree + [rh_gp_git.end_of_options] + rh_gp_paths }}"
  register: _rh_gp_work
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- refuse any git tool failure reading tree, index or worktree ids (tool cause; nothing continues)"
  vars:
    _rh_gp_runs: "{{ [_rh_gp_tree, _rh_gp_index, _rh_gp_work] }}"
  ansible.builtin.assert:
    that:
      - _rh_gp_runs | map(attribute='rc') | reject('equalto', 0) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool }}: {{ rh_gp_texts.tool }}
      {{ [rh_gp_git.tree, rh_gp_git.index, rh_gp_git.worktree]
         | zip(_rh_gp_runs | map(attribute='rc'), _rh_gp_runs | map(attribute='stderr')) | list | to_json }}
    quiet: true

# Parsed BY PATH with the declared record grammar: tree "<mode> <type> <oid>\t<path>", index "<mode> <oid> <stage>\t<path>",
# each terminated by record.terminator (-z); field names declared (record.tree_fields / record.index_fields).
- name: "GIT ADMISSION -- bind the three object-id views by path"
  ansible.builtin.set_fact:
    _rh_gp_tree_map: >-
      {%- set ns = namespace(m={}) -%}
      {%- for rec in _rh_gp_tree.stdout.split(rh_gp_git.record.terminator) if rec | length > 0 -%}
      {%- set hp = rec.split(rh_gp_git.record.path, 1) -%}
      {%- set ns.m = ns.m | combine({hp[1]: dict(rh_gp_git.record.tree_fields | zip(hp[0].split(rh_gp_git.record.field)))}) -%}
      {%- endfor -%}{{ ns.m }}
    _rh_gp_index_map: >-
      {%- set ns = namespace(m={}) -%}
      {%- for rec in _rh_gp_index.stdout.split(rh_gp_git.record.terminator) if rec | length > 0 -%}
      {%- set hp = rec.split(rh_gp_git.record.path, 1) -%}
      {%- set ns.m = ns.m | combine({hp[1]: dict(rh_gp_git.record.index_fields | zip(hp[0].split(rh_gp_git.record.field)))}) -%}
      {%- endfor -%}{{ ns.m }}
    # hash-object prints exactly one object id per path argument, in argument order (its documented contract); the
    # count is asserted below before any comparison
    _rh_gp_work_map: "{{ dict(rh_gp_paths | zip(_rh_gp_work.stdout_lines)) }}"

- name: "GIT ADMISSION -- refuse a path that is not a tracked blob of the intended commit (untracked / ignored / link / gitlink)"
  vars:
    _rh_gp_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for p in rh_gp_paths -%}
      {%- if p not in _rh_gp_tree_map or _rh_gp_tree_map[p][rh_gp_git.record.type_field] != rh_gp_git.blob.type
             or _rh_gp_tree_map[p][rh_gp_git.record.mode_field] not in rh_gp_git.blob.modes -%}{%- set ns.o = ns.o + [p] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_gp_work.stdout_lines | length == rh_gp_paths | length
      - _rh_gp_bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.untracked }}: {{ rh_gp_texts.untracked }}
      {{ [_rh_gp_head.stdout, _rh_gp_bad] | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse a must-be-absent path that the intended commit still tracks"
  ansible.builtin.assert:
    that:
      - rh_gp_absent | select('in', _rh_gp_tree_map) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.absent }}: {{ rh_gp_texts.absent }}
      {{ [_rh_gp_head.stdout, rh_gp_absent | select('in', _rh_gp_tree_map) | list] | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse a staged change (index entry absent, unmerged, or not the intended commit's blob/mode)"
  vars:
    _rh_gp_r: "{{ rh_gp_git.record }}"
    _rh_gp_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for p in rh_gp_paths -%}
      {%- if p not in _rh_gp_index_map or _rh_gp_index_map[p][_rh_gp_r.stage_field] != rh_gp_git.index_merged_stage
             or _rh_gp_index_map[p][_rh_gp_r.oid_field] != _rh_gp_tree_map[p][_rh_gp_r.oid_field]
             or _rh_gp_index_map[p][_rh_gp_r.mode_field] != _rh_gp_tree_map[p][_rh_gp_r.mode_field] -%}{%- set ns.o = ns.o + [p] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_gp_bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.staged_change }}: {{ rh_gp_texts.staged_change }}
      {{ [_rh_gp_head.stdout, _rh_gp_bad] | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse worktree bytes that are not the intended commit's blob (wrong-commit / uncommitted bytes)"
  vars:
    _rh_gp_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for p in rh_gp_paths -%}
      {%- if _rh_gp_work_map[p] != _rh_gp_tree_map[p][rh_gp_git.record.oid_field] -%}{%- set ns.o = ns.o + [p] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_gp_bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.commit_bytes }}: {{ rh_gp_texts.commit_bytes }}
      {{ [_rh_gp_head.stdout, _rh_gp_bad] | to_json }}
    quiet: true

# ---- BOUNDED HISTORICAL PROOF (GEN-ADOPT2; only when rh_gp_history is a mapping) --------------------------------------
# After the repository policy refusals (no promisor / partial-clone key survived, so no read below can fetch) and the
# current-edition byte admission, before status. Each command exits 0 in normal use; ANY nonzero rc is the tool cause.
#   lineage  shallow   rev-parse --is-shallow-repository == git.history.unshallow, else lineage (absence unprovable)
#   edition  object    cat-file --batch-check (the edition on stdin) prints "<oid> <type> <size>" (or "<oid> missing"):
#                      oid == edition and type == git.history.commit_type, else history
#            reach     rev-list --max-count=1 <edition> <git.history.exclude_marker> <head> --: EMPTY iff the edition is
#                      reachable from HEAD, else history (an unrelated well-formed commit refuses here, before any write)
#            blobs     ls-tree of the EDITION (the same tree grammar): every declared path a declared blob mode / type
#                      with exactly the declared oid, else history
#   lineage  history   rev-list --full-history --max-count=1 <head> -- <lineage>: EMPTY iff no commit reachable from HEAD
#                      (side branches through merges included) ever touched a lineage path, else lineage
- name: "GIT ADMISSION -- historical proof: bind the requested proof by role (derived; nothing requested when rh_gp_history is none)"
  vars:
    _rh_gp_HI: "{{ rh_gp_git.history.input_roles }}"
  ansible.builtin.set_fact:
    _rh_gp_hed: "{{ rh_gp_history[_rh_gp_HI.edition] if rh_gp_history is not none else none }}"
    _rh_gp_hbl: "{{ rh_gp_history[_rh_gp_HI.blobs] if rh_gp_history is not none else {} }}"
    _rh_gp_hli: "{{ rh_gp_history[_rh_gp_HI.lineage] if rh_gp_history is not none else [] }}"
    _rh_gp_hco: "{{ rh_gp_history[_rh_gp_HI.codes] if rh_gp_history is not none else {} }}"
    _rh_gp_hte: "{{ rh_gp_history[_rh_gp_HI.texts] if rh_gp_history is not none else {} }}"

- name: "GIT ADMISSION -- historical proof: is the repository shallow (classified; lineage only)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.history.shallow }}"
  register: _rh_gp_hshal
  changed_when: false
  failed_when: false
  when: _rh_gp_hli | length > 0

- name: "GIT ADMISSION -- historical proof: refuse a tool failure or a shallow repository (lineage unprovable)"
  vars:
    _rh_gp_HC: "{{ rh_gp_git.history.cause_roles }}"
  ansible.builtin.assert:
    that:
      - _rh_gp_hshal.rc == 0
      - _rh_gp_hshal.stdout == rh_gp_git.history.unshallow
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool if _rh_gp_hshal.rc != 0 else _rh_gp_hco[_rh_gp_HC.lineage] }}:
      {{ rh_gp_texts.tool if _rh_gp_hshal.rc != 0 else _rh_gp_hte[_rh_gp_HC.lineage] }}
      {{ [rh_gp_git.history.shallow, _rh_gp_hshal.rc, _rh_gp_hshal.stdout, _rh_gp_hshal.stderr] | to_json }}
    quiet: true
  when: _rh_gp_hli | length > 0

- name: "GIT ADMISSION -- historical proof: the named edition's object type (classified; read on stdin, no fetch)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.history.object_check }}"
    stdin: "{{ _rh_gp_hed }}"
  register: _rh_gp_hobj
  changed_when: false
  failed_when: false
  when: _rh_gp_hed is not none

- name: "GIT ADMISSION -- historical proof: refuse a tool failure, or an edition that is not a commit object here (history)"
  vars:
    _rh_gp_HC: "{{ rh_gp_git.history.cause_roles }}"
    _rh_gp_of: "{{ _rh_gp_hobj.stdout.split(rh_gp_git.record.field) }}"
    _rh_gp_om: "{{ dict(rh_gp_git.history.object_fields | zip(_rh_gp_of)) }}"
  ansible.builtin.assert:
    that:
      - _rh_gp_hobj.rc == 0
      - _rh_gp_of | length == rh_gp_git.history.object_fields | length
      - _rh_gp_om[rh_gp_git.record.oid_field] == _rh_gp_hed
      - _rh_gp_om[rh_gp_git.record.type_field] == rh_gp_git.history.commit_type
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool if _rh_gp_hobj.rc != 0 else _rh_gp_hco[_rh_gp_HC.history] }}:
      {{ rh_gp_texts.tool if _rh_gp_hobj.rc != 0 else _rh_gp_hte[_rh_gp_HC.history] }}
      {{ [rh_gp_git.history.object_check, _rh_gp_hed, _rh_gp_hobj.rc, _rh_gp_hobj.stdout, _rh_gp_hobj.stderr] | to_json }}
    quiet: true
  when: _rh_gp_hed is not none

- name: "GIT ADMISSION -- historical proof: reachability of the edition from HEAD and its tree entries (classified)"
  ansible.builtin.command:
    argv: "{{ item }}"
  loop:
    - "{{ _rh_gp_x + rh_gp_git.history.reach + [_rh_gp_hed, rh_gp_git.history.exclude_marker, _rh_gp_head.stdout, rh_gp_git.end_of_options] }}"
    - "{{ _rh_gp_x + rh_gp_git.tree + [_rh_gp_hed, rh_gp_git.end_of_options] + (_rh_gp_hbl.keys() | list | sort) }}"
  register: _rh_gp_hreach
  changed_when: false
  failed_when: false
  when: _rh_gp_hed is not none

- name: "GIT ADMISSION -- historical proof: refuse a tool failure, an unreachable edition or a blob that is not the declared one (history)"
  vars:
    _rh_gp_HC: "{{ rh_gp_git.history.cause_roles }}"
    _rh_gp_hrc: "{{ _rh_gp_hreach.results | map(attribute='rc') | reject('equalto', 0) | list }}"
    _rh_gp_ht: >-
      {%- set ns = namespace(m={}) -%}
      {%- for rec in _rh_gp_hreach.results[1].stdout.split(rh_gp_git.record.terminator) if rec | length > 0 -%}
      {%- set hp = rec.split(rh_gp_git.record.path, 1) -%}
      {%- set ns.m = ns.m | combine({hp[1]: dict(rh_gp_git.record.tree_fields | zip(hp[0].split(rh_gp_git.record.field)))}) -%}
      {%- endfor -%}{{ ns.m }}
    _rh_gp_hbad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for p, oid in _rh_gp_hbl | dictsort -%}
      {%- if p not in _rh_gp_ht or _rh_gp_ht[p][rh_gp_git.record.type_field] != rh_gp_git.blob.type
             or _rh_gp_ht[p][rh_gp_git.record.mode_field] not in rh_gp_git.blob.modes
             or _rh_gp_ht[p][rh_gp_git.record.oid_field] != oid -%}{%- set ns.o = ns.o + [p] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_gp_hrc | length == 0
      - _rh_gp_hreach.results[0].stdout | length == 0
      - _rh_gp_hbad | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool if _rh_gp_hrc | length > 0 else _rh_gp_hco[_rh_gp_HC.history] }}:
      {{ rh_gp_texts.tool if _rh_gp_hrc | length > 0 else _rh_gp_hte[_rh_gp_HC.history] }}
      {{ [_rh_gp_hed, _rh_gp_head.stdout, _rh_gp_hreach.results[0].stdout, _rh_gp_hbad,
          _rh_gp_hreach.results | map(attribute='rc') | list, _rh_gp_hreach.results | map(attribute='stderr') | list] | to_json }}
    quiet: true
  when: _rh_gp_hed is not none

- name: "GIT ADMISSION -- historical proof: any commit reachable from HEAD that touched a lineage path (classified)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.history.lineage + [_rh_gp_head.stdout, rh_gp_git.end_of_options] + _rh_gp_hli }}"
  register: _rh_gp_hlin
  changed_when: false
  failed_when: false
  when: _rh_gp_hli | length > 0

- name: "GIT ADMISSION -- historical proof: refuse a tool failure or any recorded lineage history (lineage: never a first generation)"
  vars:
    _rh_gp_HC: "{{ rh_gp_git.history.cause_roles }}"
  ansible.builtin.assert:
    that:
      - _rh_gp_hlin.rc == 0
      - _rh_gp_hlin.stdout | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool if _rh_gp_hlin.rc != 0 else _rh_gp_hco[_rh_gp_HC.lineage] }}:
      {{ rh_gp_texts.tool if _rh_gp_hlin.rc != 0 else _rh_gp_hte[_rh_gp_HC.lineage] }}
      {{ [_rh_gp_head.stdout, _rh_gp_hli, _rh_gp_hlin.stdout, _rh_gp_hlin.rc, _rh_gp_hlin.stderr] | to_json }}
    quiet: true
  when: _rh_gp_hli | length > 0

# status LAST: the one command that could execute repository-controlled code (fsmonitor; a clean filter on a stat-dirty
# entry) runs only after the config and conversion refusals above, with -c core.fsmonitor=false in git.global.
- name: "GIT ADMISSION -- porcelain status of exactly the admitted paths (residual catch-all; classified)"
  ansible.builtin.command:
    argv: "{{ _rh_gp_x + rh_gp_git.status + [rh_gp_git.end_of_options] + rh_gp_paths }}"
  register: _rh_gp_status
  changed_when: false
  failed_when: false

- name: "GIT ADMISSION -- refuse a git tool failure reading status (tool cause)"
  ansible.builtin.assert:
    that:
      - _rh_gp_status.rc == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.tool }}: {{ rh_gp_texts.tool }}
      {{ [rh_gp_git.status, _rh_gp_status.rc, _rh_gp_status.stderr] | to_json }}
    quiet: true

- name: "GIT ADMISSION -- refuse any residual porcelain change of the admitted paths (uncommitted)"
  ansible.builtin.assert:
    that:
      - _rh_gp_status.stdout | length == 0
    fail_msg: >-
      REFUSED {{ rh_gp_codes.uncommitted }}: {{ rh_gp_texts.uncommitted }}
      {{ _rh_gp_status.stdout.split(rh_gp_git.record.terminator) | to_json }}
    quiet: true

- name: "GIT ADMISSION -- bind the admitted commit and the trusted object ids (derived outputs)"
  ansible.builtin.set_fact:
    rh_gp_head: "{{ _rh_gp_head.stdout }}"
    rh_gp_tracked: "{{ rh_gp_probe | select('in', _rh_gp_tree_map) | list }}"
    rh_gp_oids: >-
      {%- set ns = namespace(m={}) -%}
      {%- for p in rh_gp_paths -%}{%- set ns.m = ns.m | combine({p: _rh_gp_tree_map[p][rh_gp_git.record.oid_field]}) -%}{%- endfor -%}{{ ns.m }}
