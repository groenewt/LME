- name: Stat the independently named active authoring admission
  ansible.builtin.stat:
    path: '{{ rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.active_rel }}'
    follow: false
    get_checksum: true
    checksum_algorithm: '{{ rh_ar_contract.digest }}'
    get_mime: false
    get_attributes: false
  register: _rh_ar_active
- name: Admit active receipt custody before reading
  ansible.builtin.assert:
    that:
    - _rh_ar_active.stat.exists and _rh_ar_active.stat.isreg and not _rh_ar_active.stat.islnk
    - _rh_ar_active.stat.uid == (_rh_ar_uid.stdout | int)
    - _rh_ar_active.stat.mode == rh_ar_contract.active_mode
    - _rh_ar_active.stat.size <= rh_ar_contract.publication_max_bytes
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.publication }}'
    quiet: true
- name: Capture the admitted active YAML once
  ansible.builtin.slurp:
    src: '{{ rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.active_rel }}'
  register: _rh_ar_active_bytes
- name: Bind captured active bytes before canonical parse
  ansible.builtin.assert:
    that:
    - (_rh_ar_active_bytes.content | b64decode | hash(rh_ar_contract.digest)) == _rh_ar_active.stat.checksum
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.changed_read }}'
    quiet: true
- name: Canonically admit the distinct authoring record with the existing engine
  ansible.builtin.set_fact:
    rh_authoring_admission: '{{ _rh_ar_active_bytes.content | b64decode | lme_admit_record(rh_ar_record_schemas, rh_ar_serialization, rh_ar_yaml_tags,
      rh_ar_contract.receipt_record) }}'
- name: Refuse false historical or current source provenance and receipt-selected paths
  ansible.builtin.assert:
    that:
    - rh_authoring_admission.historical_origin.installation | lme_type_aware_equal(_rh_ar_origin)
    - rh_authoring_admission.current_admission | lme_type_aware_equal(_rh_ar_current)
    - rh_authoring_admission.historical_origin.legacy_receipt_sha256 == rh_ar_subject.legacy_sha256
    - 'rh_authoring_admission.historical_origin | lme_type_aware_equal(rh_ar_subject.historical_origin | combine({''installation'': _rh_ar_origin,
      ''legacy_receipt_sha256'': rh_ar_subject.legacy_sha256}))'
    - rh_authoring_admission.observed_content | lme_type_aware_equal(dict(rh_ar_contract.critical_fields | zip(rh_ar_contract.critical_fields
      | map('extract', _rh_ar_origin))))
    - rh_authoring_admission.custody.root == rh_ar_subject.root
    - rh_authoring_admission.custody.generation == rh_ar_subject.generation
    - rh_authoring_admission.custody.owner_uid == (_rh_ar_uid.stdout | int)
    - rh_authoring_admission.custody.owner_name == rh_ar_subject.owner
    - rh_authoring_admission.custody.active_receipt == rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.active_rel
    - rh_authoring_admission.custody.sealed_receipt == rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.sealed_prefix ~ (_rh_ar_current
      | lme_render_record(rh_ar_record_schemas, rh_ar_serialization, rh_ar_yaml_tags, rh_ar_contract.current_admission_record) | hash(rh_ar_contract.digest))
      ~ rh_ar_contract.sealed_suffix
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.publication }}'
    quiet: true
- name: Stat the independently derived immutable sealed receipt
  ansible.builtin.stat:
    path: '{{ rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.sealed_prefix ~ (_rh_ar_current | lme_render_record(rh_ar_record_schemas,
      rh_ar_serialization, rh_ar_yaml_tags, rh_ar_contract.current_admission_record) | hash(rh_ar_contract.digest)) ~ rh_ar_contract.sealed_suffix
      }}'
    follow: false
    get_checksum: true
    checksum_algorithm: '{{ rh_ar_contract.digest }}'
    get_mime: false
    get_attributes: false
  register: _rh_ar_sealed
- name: Require matching sealed bytes and exact immutable metadata
  ansible.builtin.assert:
    that:
    - _rh_ar_sealed.stat.exists and _rh_ar_sealed.stat.isreg and not _rh_ar_sealed.stat.islnk
    - _rh_ar_sealed.stat.uid == (_rh_ar_uid.stdout | int)
    - _rh_ar_sealed.stat.mode == rh_ar_contract.sealed_mode
    - _rh_ar_sealed.stat.checksum == _rh_ar_active.stat.checksum
    - _rh_ar_sealed.stat.dev == _rh_ar_active.stat.dev
    - _rh_ar_sealed.stat.inode == _rh_ar_active.stat.inode
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.publication }}'
    quiet: true
