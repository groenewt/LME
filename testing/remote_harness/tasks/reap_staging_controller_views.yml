---
# testing/remote_harness/tasks/reap_staging_controller_views.yml -- route op1x NEW FILE (C1 SR922m / SR922n / SR922o
# registry_applicability, now s64 :7978-8248 with comments :7913-7977, pinned whole r51 :6991-7061, route op2c retarget;
# codex 939 / 940;
# records-route-op1x-01). AUTHORED, NEVER RENDERED OR EXECUTED (UNRUN). A git-admitted member with reap_staging.yml
# (C1 SR922q, s64 members_rel :6985, comment :6981-6984; closes CPL-OP1X-REAP-VIEWS-MEMBER).
# The OWNER side of the storage-view evaluation of reap_staging.yml: placement.owner is the run controller
# (n13_publishing_host), so in a decided launch context the owner views (views.owner: every outstanding accountable
# record's destination and every one of its paths, per every_outstanding_record) and the owner kernel identity are
# observed on the declared controller binding rh_controller_target over the declared connection, interpreter and remote
# temp (TASK vars), never on the reap destination host. The codex 931 ROUTE_DELEGATION_BEFORE_SKIP rule holds:
# ansible-core 2.19.11 templates delegate_to before `when`, so reap_staging.yml includes THIS file only under
# `when: _rh_reap_app.kind == 'delegated'`; nothing here is templated in the genesis context.
# Tools: the controller's os_tools.stat and os_tools.findmnt rows (s64 :3431, :3489), each ADMITTED before use by its
# declared identity (identity.kind file_sha256: the controller file's sha256 equals identity.sha256; the
# os_tools_identity_before_use rule, s64 :8474). An unadmitted tool runs nothing: its probes register no rc and the views
# are UNKNOWN in reap_staging.yml's decision, which names the tool. route op1z (C1 SR922s): the type probe runs the
# os_tools row NAMED by locations.fs_type_probe_tool (stat, s64 :7900; r51 :6986; pinned by value in reap_staging.yml's
# admission), not a route-chosen key. route op1y (C1 SR922p): + the os_tools.readlink row
# (s64 :3488), the observation_boundary.namespace_probe tool, admitted the same way; the namespace is now its readlink
# output, not the op1x stat link text. C1 SR922q: the three rows' required_by name staging_reap (this file, the
# controller) and staging_reap_subject (reap_staging.yml's subject views), pinned by value in reap_staging.yml's
# admission (closes CPL-OP1X-C1-OS-TOOLS-REQUIRED-BY).
# Every probe runs under environment LC_ALL = base_env.LC_ALL with strip_empty_ends false (stdout exact) and
# failed_when false: a failed or missing observation is UNKNOWN in the decision (unobservable: unknown), never a refusal
# and never a substituted value. The owner probes take NO lock: the owner registry lock is the recover program's, and
# the destination lock lives on the subject (NOTE-SEAT-SR922O-MOUNT-TIME-OF-CHECK in reap_staging.yml). The mount
# listing is taken BEFORE and AFTER the per-view probes; a changed listing is a changed observation (unknown, retained).
# Reads (set by reap_staging.yml before the include): _rh_reap_vw, rh, rh_controller_target, rh_controller_connection.
# Writes: the registers _rh_reap_otid_d, _rh_reap_oid_d, _rh_reap_omns_d, _rh_reap_ols_d, _rh_reap_ov_d, _rh_reap_oty_d,
# _rh_reap_omt_d, _rh_reap_ols2_d and the fact _rh_reap_otok, each a reserved output (C1 SR922q, r51 :7827-7839,
# comment :7785-7796; closes CPL-OP1X-DERIVED-NAME-PROTECTION).
- name: Admit the controller's stat and findmnt by their declared identity (delegated; sha256; no link followed; read-only)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  # route op1y: + readlink (observation_boundary.namespace_probe, s64 :8240; os_tools.readlink s64 :3488)
  loop: [stat, findmnt, readlink]
  register: _rh_reap_otid_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: Bind the controller tools admitted by identity (derived; a tool not listed runs nothing below)
  ansible.builtin.set_fact:
    _rh_reap_otok: >-
      {%- set ns = namespace(ok=[]) -%}
      {%- for r in _rh_reap_otid_d.results -%}
        {%- set row = rh.controller.bootstrap.os_tools[r.item] -%}
        {%- if 'stat' in r and not ('failed' in r and r.failed) and r.stat.exists and r.stat.isreg and not r.stat.islnk
               and 'checksum' in r.stat and row.identity is mapping and 'kind' in row.identity and 'sha256' in row.identity
               and row.identity.kind == 'file_sha256' and r.stat.checksum == row.identity.sha256 -%}
          {%- set ns.ok = ns.ok + [r.item] -%}
        {%- endif -%}
      {%- endfor -%}{{ ns.ok }}

- name: Read the owner's kernel boot id and machine id on the controller (identity.kernel_from / machine_from; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ rh.controller.bootstrap.bundle.staging_retention.lease.boot_id_path }}"
    - "{{ rh.controller.bootstrap.bundle.staging_retention.lease.machine_id_path }}"
  register: _rh_reap_oid_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

# codex 940 (mount observation boundary) / route op1y (C1 SR922p observation_boundary.namespace_probe, s64 :8240): the
# mount namespace the owner views are observed in is recorded as evidence, by the declared readlink tool (admitted
# above) of lease.proc_root joined with namespace_probe.of_segments by proc_paths.join (route op2b; route op1z, C1 SR922s of_segments
# [self, ns, mnt], s64 :8240, comment :8237; r51 :7057; closes HOLE-OP1Y-C1-NS-PROBE-PATH); an unobserved namespace is
# unqualified evidence, so the owner views are unknown. route op2b (C1 SR922u namespace_probe.join_from, s64 :8240,
# comment :8213-8214; NOTE-SEAT-OP2A-NAMESPACE-PROBE-JOIN): the root and the segments are joined with the word
# join_from names (lease.proc_paths.join; reap_staging.yml's pin task walks join_from to that word), no literal '/'.
- name: Observe the owner's mount namespace on the controller (namespace_probe readlink; admitted readlink; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.readlink.path, rh.controller.bootstrap.bundle.staging_retention.lease.proc_root ~ rh.controller.bootstrap.bundle.staging_retention.lease.proc_paths.join ~ (rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.observation_boundary.namespace_probe.of_segments | join(rh.controller.bootstrap.bundle.staging_retention.lease.proc_paths.join))] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  register: _rh_reap_omns_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: "'readlink' in _rh_reap_otok"

- name: List every mount on the controller before the view probes (views.nested_mounts.listing; admitted findmnt; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.findmnt.path] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.views.nested_mounts.listing.args }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  register: _rh_reap_ols_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: "'findmnt' in _rh_reap_otok"

- name: Observe each owner view path on the controller (existing_leaf_else_parent; delegated; no link followed)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_reap_vw.owner }}"
  register: _rh_reap_ov_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

# storage.measure_at existing_leaf_else_parent: the view's own path when it exists and is not a link, else its parent
# when the view is absent (the probe itself then observes the parent; an absent parent fails the probe: unknown). A link
# leaf or an unobserved stat yields no probe item: that view is unknown in the decision.
# route op1z (C1 SR922s): the tool is the os_tools row named by locations.fs_type_probe_tool (pinned 'stat' at
# admission, so it is the stat row admitted above by identity).
- name: Probe each owner view's filesystem type on the controller (locations.fs_type_probe_tool / fs_type_probe_args; admitted; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_tool].path] + rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args + [item.at] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  loop: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for r in _rh_reap_ov_d.results -%}
      {%- if 'stat' in r and not ('failed' in r and r.failed) -%}
        {%- if r.stat.exists and not r.stat.islnk -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item}] -%}
        {%- elif not r.stat.exists -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item | dirname}] -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}{{ ns.l }}
  loop_control:
    label: "{{ item.view }}"
  register: _rh_reap_oty_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: "'stat' in _rh_reap_otok"

- name: Probe the mount containing each owner view on the controller (one_kernel.same_filesystem.mount_probe; admitted findmnt; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.findmnt.path] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.one_kernel.same_filesystem.mount_probe.args + [item.at] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  loop: >-
    {%- set ns = namespace(l=[]) -%}
    {%- for r in _rh_reap_ov_d.results -%}
      {%- if 'stat' in r and not ('failed' in r and r.failed) -%}
        {%- if r.stat.exists and not r.stat.islnk -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item}] -%}
        {%- elif not r.stat.exists -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item | dirname}] -%}
        {%- endif -%}
      {%- endif -%}
    {%- endfor -%}{{ ns.l }}
  loop_control:
    label: "{{ item.view }}"
  register: _rh_reap_omt_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: "'findmnt' in _rh_reap_otok"

- name: List every mount on the controller after the view probes (unchanged from the first listing, else unknown; delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.findmnt.path] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.views.nested_mounts.listing.args }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  register: _rh_reap_ols2_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: "'findmnt' in _rh_reap_otok"
