---
# testing/remote_harness/tasks/measure_controller_tools.yml -- the CONTROLLER MEASUREMENT-ONLY phase (codex-r2-r4-r5-
# bootstrap-decisions-20261006 R4; route-r4e over r4d 189672b8; profile controller.bootstrap.preparation_measurement
# REVISION 5 (r4e-c1-hunks E-A-MEAS), C1 proposal r4d-c1-hunks.yml + r4e-c1-hunks.yml). AUTHORED, NEVER EXECUTED. Included ONLY by acquire.yml through the
# declared acquire-stage operation selector (genesis.launch.stages.acquire.selectors / .operations), right after
# builder admission and the selector gate, BEFORE the artifact-source admission, any fetch and preparation.
#
# SCOPE (R4-CONTROLLER-ONLY-SCOPE): the FIRST admission after the name guard is the resolved controller-only scope
# invariant of tasks/prepare.yml :47-59 (no target scope in the resolve, no member in the target group), extended to
# every declared role group and to the inventory itself (every inventory host is the declared controller delegation
# host) -- derived from the resolved inventory declaration, never a host count, admitted in two stages (presence, then
# values; no default for an absent group or scope: an absent group is selected as no group). It runs before any stat.
#
# WHAT IT DOES: for each selected resource (preparation_measurement.resources.<kind>; kinds.<kind> declares where the
# resource is declared, whether links are resolved, the disposition checks drawn from the declared condition
# vocabulary preparation_measurement.conditions) it records existence, the link view (no link followed), the resolved
# view where the kind resolves, the digest (or the declared unset value when no checksum was observed), a disposition,
# the CUSTODY CHAIN (R4-ADOPTABLE-CUSTODY; missing evidence is a declared incomplete reason, never a fabricated stat)
# and the DECLARED package association. candidate_adoptable is true only for a present resource with a COMPLETE
# custody chain. Absent / link / non-regular / non-executable / unreadable resources are RECORDED, never refused.
#
# EFFECTS (source analysis, not observed execution; codex-tick400 R4-SHARED-STAT-EFFECTS; r4d: the receipt join moved
# to the ONE shared admission, codex-tick409 R4C-SHARED-RECEIPT-ADMISSION):
#   - the shared binding admission tasks/admit_binding_receipt.yml (controller.bootstrap.binding_admission): a stat of
#     every inventory source and of B's binding receipt <dirname(binding)><run_binding.receipt_suffix>; ONE slurp of the
#     receipt and ONE of the binding (each read's bytes checked against its stat digest). Reads only the resolve's
#     rh / rh_repo_root / lme_resolved, the records run_binding.receipt_bindings names, groups / hostvars and the magic
#     ansible_inventory_sources: no installer-only name (r4e).
#   - ansible.builtin.stat module runs (Python, module process) on: every resource (link view; resolved view where
#     declared), every traversed custody component, the record root, the written record -- every one with get_mime
#     false and get_attributes false (no `file`, no `lsattr`), follow / get_checksum as stated.
#   - the reused publication admission tasks/admit_ancestry.yml (r4d): the declared os_tools id (-u) always;
#     its per-component stat (get_mime / get_attributes false since r4c); ONLY for an owner-owned group-writable
#     record-root component, the declared sh running the generated facts program and tasks/decide_private_group.yml
#     (its controller decision tool, and its own stat of that tool, which at eb85ba51 :60-64 leaves get_mime /
#     get_attributes at the module defaults -- assigned by codex-tick409 to the R2 route writer as a separate leaf; the
#     effect stays in this record until that leaf lands).
#   - ONE ansible.builtin.copy (create-only, force false) under the record root.
#   No measured resource is executed; no keyring byte is read beyond the stat digest; no network; no fetch.
#
# REPRESENTATION (codex-tick394 / codex-tick400 R4-NEW-VALUE-CONSTRUCTION; r4c- + r4d-value-ledger.yml): the resource
# list, custody components and the WHOLE record (attribution included) are rendered by the macros of
# templates/macros/measurement.j2, dispatched by templates/measurement_record.j2 from the bindings in rh_meas_call
# (import = preparation_measurement.macros_rel relative to dirname(record_template_rel); selectors =
# preparation_measurement.macros; path grammar = path_admission.separator). The report is a mapping keyed by the
# declared controller.bootstrap.report_frame and record_fields (r4d; no literal framing); r4e (codex-tick421
# R4D-REPORT-FRAME-PRE-EFFECT): the frame and the report's record fields are admitted BEFORE any effect (the report
# task below stays after the write). Every refusal is formatted by
# the common grammar controller.bootstrap.refusal_grammar (REFUSED <code>: <detail>) through its entry template.
# No default(.
#
# ATTRIBUTION (codex R4_extra_scope; tick393-r4 answer "the launch record's inventory path and hash, plus act";
# codex-tick400 Q3; codex-tick409 narrow claim): the launch passes the inventory as explicitly ORDERED FILES of the
# stage operation's declared inventory kind (controller_operation_binding: -i <lab_copy> -i <run_binding>; B r5f
# genesis.launch), never a directory. The shared admission admits every source as an existing regular non-link file,
# the receipt as vouching for exactly the given binding and lab copy (path and sha256) with every COMPARED receipt
# binding (run_binding.receipt_bindings: policy, source edition, interface) equal to this resolve's record (r4e,
# codex-tick421 J-B8), and the effective mode / root inputs as the vouched binding's values -- all BEFORE any
# measurement stat. The mode and root inputs reach this task ONLY as host vars of the receipt-vouched PRODUCED binding
# (genesis.entry.selection.plans.measurement: no -e selector; genesis.launch.stages.acquire.extra_vars []): no
# extra-var supplies either (codex-tick611 G06).
# The record carries the sources in launch order with their digests, the receipt path / digest / attributed fields
# (binding_admission.attributed), the admission evidence (rh_rcpt_admission: compared bindings, the PRODUCER's and this
# CONSUMER's attributed resolved-state revisions kept separately, the effective inputs, scope), act and stage, the
# profile / configuration / engine revisions, the admitted builder,
# and the deployment identity as the validated-identity helper returns it (null when the inventory declares none:
# diagnostic attribution only, never proof). The launch step record (lme-genesis-step/3: inventory_kind, ordered
# {role, path, sha256}, binding_receipt) is joined by act and by these digests. CLAIM (narrow): the files measured
# under are the ones B's receipt names under this resolve's compared bindings; NOT that the run data or identity were
# re-verified, NOT that the producer's and this consumer's resolved-state revisions agree (attribution only), NOT the
# loader's bytes (r4e OPEN-LOADER-BYTES).
#
# FAMILY (codex-tick400 Q8): preparation_measurement.family names the DECLARED package-association family
# (packages.by_os_family); controller_families declares the controller families the measurement/prerequisite pair
# supports. This measurement gathers no facts and does NOT observe the controller OS: a controller of another family is
# not refused at resolve nor here -- its record states Debian associations, which are declarations, not observations.
# The privileged prerequisite observes the family before any install and refuses one outside controller_families.
#
# PUBLICATION (R4-RECORD-ANCESTRY): at the USE boundary, right before the one write, the record root's whole ancestry
# is admitted by the ONE resolved rule through tasks/admit_ancestry.yml (path_admission.ancestry), then the root itself
# (owned real directory, root_mode). The record is content-addressed, written once (force false) and re-read.
#
# TRUST: the record is never self-authorizing (preparation_measurement.record_values). A digest pins BYTES, never
# trust: no fingerprint is observed and no field states upstream key trust. Custody state and candidate_adoptable are
# CANDIDATE claims (preparation_measurement.claims) with a separate source disposition; package names are declared
# associations (preparation_measurement.package_basis), not verified provenance.
#
# NAMES: every name derived here is in the declared family preparation_measurement.name_family (== registry
# contract_admission.patterns.reserved_meas_vars, C1 proposal), refused as an input by the first task (which defines
# no task var). Inputs (mode_var, root_var) are outside the family; the include parameters rh_anc_* / rh_rcpt_* and the
# refusal-entry template_vars rh_rf_* are registry-reserved; the shared admission's own _rh_rcpt_* names are refused by
# its own alias-free first task (r4d-derived-names.yml).

- name: "MEASURE -- refuse pre-supplied measurement names (the declared name family)"
  ansible.builtin.assert:
    that:
      - (vars | list) | select('match', rh.controller.bootstrap.preparation_measurement.name_family) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.preparation_measurement.refusal,
                               'rh_rf_detail': [rh.controller.bootstrap.preparation_measurement.diagnostics.names,
                                                (vars | list) | select('match', rh.controller.bootstrap.preparation_measurement.name_family) | list | to_json]}) }}
    quiet: true

- name: "MEASURE -- bind the refusal entry, the record entry and the macro dispatch (derived from declarations only)"
  ansible.builtin.set_fact:
    rh_meas_rf_tpl: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    rh_meas_tpl: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.preparation_measurement.record_template_rel }}"
    rh_meas_call:
      rh_meas_import: "{{ rh.controller.bootstrap.preparation_measurement.macros_rel | relpath(rh.controller.bootstrap.preparation_measurement.record_template_rel | dirname) }}"
      rh_meas_rf_import: "{{ rh.controller.bootstrap.refusal_grammar.macros_rel | relpath(rh.controller.bootstrap.preparation_measurement.record_template_rel | dirname) }}"
      rh_meas_rg: "{{ rh.controller.bootstrap.refusal_grammar }}"
      rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"

- name: "MEASURE -- controller-only scope, stage 1: the resolve publishes a target scope map (presence; before any stat)"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.scopes is defined
      - lme_resolved.remote_harness.scopes.targets is defined
      - lme_resolved.remote_harness.scopes.targets is mapping
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.scope, rh_meas_call.rh_meas_m.diagnostics.scope_map]}) }}
    quiet: true

- name: "MEASURE -- controller-only scope, stage 2: no target, no target- or role-group member, no other host (before any stat)"
  vars:
    _rh_meas_iv: "{{ rh.controller.bootstrap.inventory }}"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.scopes.targets | length == 0
      - groups | dict2items | selectattr('key', 'equalto', _rh_meas_iv.target_group) | map(attribute='value') | flatten | list | length == 0
      - groups | dict2items | selectattr('key', 'in', _rh_meas_iv.role_groups.values() | list) | map(attribute='value') | flatten | list | length == 0
      - groups['all'] | reject('equalto', _rh_meas_iv.controller_delegation.host) | list | length == 0
      - inventory_hostname == _rh_meas_iv.controller_delegation.host
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.scope,
                                                lme_resolved.remote_harness.scopes.targets | list | to_json,
                                                groups | dict2items | selectattr('key', 'in', [_rh_meas_iv.target_group] + (_rh_meas_iv.role_groups.values() | list)) | items2dict | to_json,
                                                groups['all'] | to_json,
                                                rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- admission, stage 1: the operation binding, the mode and root inputs are present, no acquisition input"
  vars:
    _rh_meas_m: "{{ rh_meas_call.rh_meas_m }}"
    _rh_meas_ops: "{{ rh.controller.bootstrap.genesis.launch.stages[rh_gen_stage].operations }}"
  ansible.builtin.assert:
    that:
      - rh_gen_stage == _rh_meas_m.stage
      - _rh_meas_m.stage_operation in _rh_meas_ops
      # the implemented interface revision: the node and the stage operation agree; C1 pins both (contract enum)
      - _rh_meas_m.revision == _rh_meas_ops[_rh_meas_m.stage_operation].revision
      - _rh_meas_m.mode_var == _rh_meas_ops[_rh_meas_m.stage_operation].mode_selector
      - _rh_meas_m.mode_var in vars
      - _rh_meas_m.root_var in vars
      - _rh_meas_m.refused_inputs | select('in', vars) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': _rh_meas_m.refusal,
                               'rh_rf_detail': [_rh_meas_m.diagnostics.inputs, _rh_meas_m.mode_var, _rh_meas_m.root_var,
                                                (_rh_meas_m.refused_inputs | select('in', vars) | list | to_json),
                                                _rh_meas_m.diagnostics.stop]}) }}
    quiet: true

# REPORT FRAME BEFORE EFFECTS (codex-tick421 R4D-REPORT-FRAME-PRE-EFFECT): the report below reads report_frame {text,
# stop}, record_fields.record / record_sha256, the node's report word and report_fields (each a record_fields key). All
# are admitted HERE, before any stat, the record render or the write; the declaration dependency is C1's contract
# (r4e-c1-hunks E-N-G5: the frame is checked whenever this consuming node is declared). Presence first (this task),
# so the fail_msg names only declared texts.
- name: "MEASURE -- the report frame and the report's record fields are declared (before any effect)"
  vars:
    _rh_meas_m: "{{ rh_meas_call.rh_meas_m }}"
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.report_frame is defined
      - rh.controller.bootstrap.report_frame is mapping
      - rh.controller.bootstrap.report_frame.text is defined and rh.controller.bootstrap.report_frame.text is string
      - rh.controller.bootstrap.report_frame.stop is defined and rh.controller.bootstrap.report_frame.stop is string
      - _rh_meas_m.report is defined and _rh_meas_m.report is string
      - _rh_meas_m.record_fields.record is defined and _rh_meas_m.record_fields.record_sha256 is defined
      - _rh_meas_m.report_fields is defined
      - _rh_meas_m.report_fields is sequence and _rh_meas_m.report_fields is not string
      - _rh_meas_m.report_fields | reject('in', _rh_meas_m.record_fields) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': _rh_meas_m.refusal,
                               'rh_rf_detail': [_rh_meas_m.diagnostics.report, _rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- admission, stage 2: mode value, record root path, declaration consistency, package association"
  vars:
    _rh_meas_m: "{{ rh_meas_call.rh_meas_m }}"
    _rh_meas_root: "{{ lookup('ansible.builtin.vars', rh_meas_call.rh_meas_m.root_var) }}"
    _rh_meas_mode: "{{ lookup('ansible.builtin.vars', rh_meas_call.rh_meas_m.mode_var) }}"
  ansible.builtin.assert:
    that:
      - _rh_meas_mode == _rh_meas_m.mode_value
      - _rh_meas_root is string
      - _rh_meas_root is match(rh.controller.bootstrap.path_admission.regex)
      - _rh_meas_root is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - _rh_meas_m.custody.rule in rh.controller.bootstrap.path_admission.ancestry
      - (_rh_meas_m.kinds | list | sort) == (_rh_meas_m.resources | list | sort)
      # the declared condition vocabulary: every check is a condition word AND a disposition word
      - _rh_meas_m.kinds | dict2items | map(attribute='value.checks') | flatten | reject('in', _rh_meas_m.conditions.values() | list) | list | length == 0
      - _rh_meas_m.kinds | dict2items | map(attribute='value.checks') | flatten | reject('in', _rh_meas_m.dispositions) | list | length == 0
      - _rh_meas_m.kinds | dict2items | map(attribute='value.otherwise') | reject('in', _rh_meas_m.dispositions) | list | length == 0
      - _rh_meas_m.resources.tool | list | reject('in', rh.controller.bootstrap.preparation.tools) | list | length == 0
      - _rh_meas_m.resources.keyring | list | reject('in', rh.controller.bootstrap.preparation) | list | length == 0
      - _rh_meas_m.family in rh.packages.by_os_family
      - _rh_meas_m.family in _rh_meas_m.controller_families
      - _rh_meas_m.resources | dict2items | map(attribute='value') | map('dict2items') | flatten | map(attribute='value.package') | reject('in', rh.packages.by_os_family[_rh_meas_m.family]) | list | length == 0
      - _rh_meas_m.resources.tool | dict2items | map(attribute='value.package') | reject('in', rh.packages.provides) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': _rh_meas_m.refusal,
                               'rh_rf_detail': [_rh_meas_m.diagnostics.inputs, _rh_meas_m.mode_var, _rh_meas_mode | to_json,
                                                _rh_meas_m.root_var, _rh_meas_root | to_json, _rh_meas_m.resources | to_json,
                                                _rh_meas_m.family, _rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- refuse a tool whose declared logical package does not provide it (declared association)"
  ansible.builtin.assert:
    that:
      - item.key in rh.packages.provides[item.value.package]
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.provides, item.key, item.value.package,
                                                rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true
  loop: "{{ rh.controller.bootstrap.preparation_measurement.resources.tool | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# ---- R4-BOOTSTRAP-CYCLE route join (B r5f-interface): the measurement runs ONLY on the inventory kind its stage
# operation declares (controller_operation_binding, rendered by the genesis render_binding stage; no applied
# generation). The kind's files, receipt and the effective inputs are admitted by the ONE shared binding admission.
- name: "MEASURE -- launch kind, stage 1: the stage operation names a stage inventory kind and a controller operation (presence)"
  vars:
    _rh_meas_lk: "{{ rh.controller.bootstrap.genesis.launch }}"
    _rh_meas_ok: "{{ rh.controller.bootstrap.genesis.launch.stages[rh_gen_stage].operations[rh_meas_call.rh_meas_m.stage_operation] }}"
  ansible.builtin.assert:
    that:
      - _rh_meas_ok.inventory_kind is defined
      - _rh_meas_ok.controller_operation is defined
      - _rh_meas_ok.inventory_kind in _rh_meas_lk.stages[rh_gen_stage].inventory
      - _rh_meas_ok.controller_operation in rh.controller.bootstrap.inventory.controller_operations
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.launch_kind, _rh_meas_ok | to_json,
                                                _rh_meas_lk.stages[rh_gen_stage].inventory | to_json,
                                                rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- launch kind, stage 2: the controller operation is zero-target, identity-nullable, and its inputs are this node's inputs"
  vars:
    _rh_meas_co: "{{ rh.controller.bootstrap.inventory.controller_operations[rh.controller.bootstrap.genesis.launch.stages[rh_gen_stage].operations[rh_meas_call.rh_meas_m.stage_operation].controller_operation] }}"
    _rh_meas_m: "{{ rh_meas_call.rh_meas_m }}"
  ansible.builtin.assert:
    that:
      - _rh_meas_co.inputs_in_run_data
      - not _rh_meas_co.run_hosts
      - _rh_meas_co.identity_nullable
      - (_rh_meas_co.inputs | dict2items | map(attribute='value.var') | sort) == ([_rh_meas_m.mode_var, _rh_meas_m.root_var] | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': _rh_meas_m.refusal,
                               'rh_rf_detail': [_rh_meas_m.diagnostics.launch_kind, _rh_meas_co | to_json,
                                                _rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- admit the launch's files, B's binding receipt and the effective inputs (the ONE shared admission; before any measurement stat)"
  ansible.builtin.include_tasks: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.binding_admission.tasks_rel }}"
  vars:
    rh_rcpt_kind: "{{ rh.controller.bootstrap.genesis.launch.stages[rh_gen_stage].operations[rh.controller.bootstrap.preparation_measurement.stage_operation].inventory_kind }}"
    rh_rcpt_operation: "{{ rh.controller.bootstrap.genesis.launch.stages[rh_gen_stage].operations[rh.controller.bootstrap.preparation_measurement.stage_operation].controller_operation }}"
    rh_rcpt_refusal: "{{ rh.controller.bootstrap.preparation_measurement.refusal }}"

- name: "MEASURE -- publish the admitted record root and the selected resources (derived outputs; macros)"
  ansible.builtin.set_fact:
    rh_meas_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.preparation_measurement.root_var) }}"
    rh_meas_resources: >-
      {{ lookup('ansible.builtin.template', rh_meas_tpl,
                template_vars=rh_meas_call | combine({'rh_meas_macro': rh_meas_call.rh_meas_m.macros.resources,
                                                      'rh_meas_args': [rh_meas_call.rh_meas_m, rh.controller.bootstrap]})) | from_json }}

- name: "MEASURE -- link view of every selected resource (the declared path, no link followed; nothing runs)"
  ansible.builtin.stat:
    path: "{{ item[rh.controller.bootstrap.preparation_measurement.intermediate.path] }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  loop: "{{ rh_meas_resources }}"
  loop_control:
    label: "{{ item[rh.controller.bootstrap.preparation_measurement.intermediate.kind] }} {{ item[rh.controller.bootstrap.preparation_measurement.intermediate.name] }}"
  register: _rh_meas_ls

- name: "MEASURE -- resolved view where the kind declares resolve (links followed; the content admit_prep_tools.yml compares)"
  ansible.builtin.stat:
    path: "{{ item[rh.controller.bootstrap.preparation_measurement.intermediate.path] }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  loop: "{{ rh_meas_resources }}"
  loop_control:
    label: "{{ item[rh.controller.bootstrap.preparation_measurement.intermediate.kind] }} {{ item[rh.controller.bootstrap.preparation_measurement.intermediate.name] }}"
  when: rh.controller.bootstrap.preparation_measurement.kinds[item[rh.controller.bootstrap.preparation_measurement.intermediate.kind]].resolve
  register: _rh_meas_rs

- name: "MEASURE -- the traversed directory components of every declared path and link resolution (macros)"
  ansible.builtin.set_fact:
    rh_meas_components: >-
      {{ lookup('ansible.builtin.template', rh_meas_tpl,
                template_vars=rh_meas_call | combine({'rh_meas_macro': rh_meas_call.rh_meas_m.macros.custody_paths,
                                                      'rh_meas_args': [rh_meas_call.rh_meas_m, rh.controller.bootstrap.path_admission.separator,
                                                                       rh_meas_resources, _rh_meas_ls.results]})) | from_json }}

- name: "MEASURE -- stat every traversed component (no link followed; no content read)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_attributes: false
    get_mime: false
  loop: "{{ rh_meas_components }}"
  register: _rh_meas_st

- name: "MEASURE -- render the WHOLE candidate record (macros, attribution included; one value, digested before it is written)"
  ansible.builtin.set_fact:
    rh_meas_record: >-
      {{ lookup('ansible.builtin.template', rh_meas_tpl,
                template_vars=rh_meas_call | combine({'rh_meas_macro': rh_meas_call.rh_meas_m.macros.record,
                  'rh_meas_args': [rh_meas_call.rh_meas_rg, rh_meas_call.rh_meas_m, rh.controller.bootstrap.path_admission.separator,
                                   rh.packages, rh.controller.bootstrap.path_admission.ancestry[rh_meas_call.rh_meas_m.custody.rule],
                                   rh_meas_resources, _rh_meas_ls.results, _rh_meas_rs.results, _rh_meas_st.results,
                                   rh_rcpt_inventory,
                                   [rh.controller.bootstrap.binding_admission, rh_rcpt_receipt_path, rh_rcpt_receipt_stat, rh_rcpt_receipt, rh_rcpt_admission],
                                   [now(utc=true).strftime(rh_meas_call.rh_meas_m.time_format),
                                    lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
                                    rh_gen_stage, lme_resolved | lme_validated_deployment_identity, rh_profile_sha256,
                                    rh_config_revision, rh_engine_revision, rh_builder]]})) | from_json }}

- name: "MEASURE -- serialize the record and name it (the exact bytes that are named, written and re-read)"
  ansible.builtin.set_fact:
    rh_meas_record_text: "{{ rh_meas_record | to_nice_json }}"
    rh_meas_record_path: >-
      {{ rh_meas_root ~ rh.controller.bootstrap.path_admission.separator
         ~ (rh_meas_record | to_nice_json | hash(rh.controller.bootstrap.preparation_measurement.digest))
         ~ rh.controller.bootstrap.preparation_measurement.record_suffix }}

# ---- USE BOUNDARY: the one write ----
- name: "MEASURE -- admit the record root's whole ancestry by the ONE resolved rule (path_admission.ancestry; read-only)"
  ansible.builtin.include_tasks: admit_ancestry.yml
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_meas_root }}"
    rh_anc_refusal: "{{ rh.controller.bootstrap.preparation_measurement.refusal }}"

- name: "MEASURE -- stat the record root (read-only; never created or re-moded here)"
  ansible.builtin.stat:
    path: "{{ rh_meas_root }}"
    follow: false
    get_checksum: false
    get_attributes: false
    get_mime: false
  register: _rh_meas_rootst

- name: "MEASURE -- refuse a record root that is absent, a link or not a directory (stage 1)"
  ansible.builtin.assert:
    that:
      - _rh_meas_rootst.stat.exists
      - not _rh_meas_rootst.stat.islnk
      - _rh_meas_rootst.stat.isdir
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.root, rh_meas_root, rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- refuse a record root not owned by the builder or not of root_mode (stage 2)"
  ansible.builtin.assert:
    that:
      - _rh_meas_rootst.stat.uid == rh_builder.uid | int
      - _rh_meas_rootst.stat.mode == rh_meas_call.rh_meas_m.root_mode
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.root, rh_meas_root,
                                                _rh_meas_rootst.stat.uid | string, rh_builder.uid | string,
                                                _rh_meas_rootst.stat.mode, rh_meas_call.rh_meas_m.root_mode,
                                                rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true

- name: "MEASURE -- write the candidate record content-addressed (no overwrite: an existing name IS these bytes)"
  ansible.builtin.copy:
    dest: "{{ rh_meas_record_path }}"
    content: "{{ rh_meas_record_text }}"
    mode: "{{ rh.controller.bootstrap.preparation_measurement.record_mode }}"
    force: false

- name: "MEASURE -- re-read the written record (links not followed)"
  ansible.builtin.stat:
    path: "{{ rh_meas_record_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  register: _rh_meas_recst

- name: "MEASURE -- refuse unless the record on disk is exactly the rendered bytes"
  ansible.builtin.assert:
    that:
      - _rh_meas_recst.stat.exists
      - _rh_meas_recst.stat.isreg and not _rh_meas_recst.stat.islnk
      - _rh_meas_recst.stat.checksum == (rh_meas_record_text | hash(rh_meas_call.rh_meas_m.digest))
      - _rh_meas_recst.stat.mode == rh_meas_call.rh_meas_m.record_mode
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_meas_rf_tpl,
                template_vars={'rh_rf_grammar': rh_meas_call.rh_meas_rg, 'rh_rf_code': rh_meas_call.rh_meas_m.refusal,
                               'rh_rf_detail': [rh_meas_call.rh_meas_m.diagnostics.record, rh_meas_record_path,
                                                rh_meas_call.rh_meas_m.diagnostics.stop]}) }}
    quiet: true

# REPORT (codex-tick409 R4C-REMAINING-VALUE-SOURCING :506-511): ONE mapping, every key declared -- the frame keys
# controller.bootstrap.report_frame {text, stop}, the record name keys record_fields.record / record_sha256, and the
# record fields named by preparation_measurement.report_fields (selected from the rendered record, values verbatim).
- name: "MEASURE -- report the candidate (a request for MAIN review; never self-authorizing)"
  vars:
    _rh_meas_f: "{{ rh.controller.bootstrap.preparation_measurement.record_fields }}"
    _rh_meas_rp: "{{ rh.controller.bootstrap.report_frame }}"
  ansible.builtin.debug:
    msg: >-
      {{ {_rh_meas_rp.text: rh_meas_call.rh_meas_m.report,
          _rh_meas_f.record: rh_meas_record_path,
          _rh_meas_f.record_sha256: _rh_meas_recst.stat.checksum}
         | combine(rh_meas_record | dict2items
                   | selectattr('key', 'in', rh_meas_call.rh_meas_m.report_fields | map('extract', _rh_meas_f) | list)
                   | items2dict)
         | combine({_rh_meas_rp.stop: rh_meas_call.rh_meas_m.diagnostics.stop}) }}

- name: "MEASURE -- END: measurement only (no artifact-source admission, no fetch, no preparation)"
  ansible.builtin.meta: end_host
