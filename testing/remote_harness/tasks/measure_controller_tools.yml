---
# testing/remote_harness/tasks/measure_controller_tools.yml -- the CONTROLLER MEASUREMENT-ONLY phase (codex-r2-r4-r5-
# bootstrap-decisions-20261006 R4; route-r4). AUTHORED, NEVER EXECUTED. Included ONLY by acquire.yml, right after
# builder admission (tasks/admit_builder.yml) and BEFORE the artifact-source admission, any fetch and preparation, and
# only when the resolved policy declares controller.bootstrap.preparation_measurement (C1 proposal) AND the localhost
# host var it names (mode_var) is supplied. Without both, acquire.yml is unchanged.
#
# WHAT IT DOES: for each selected resource (preparation_measurement.resources: os_tools names, and preparation.<key>
# keyring nodes) it records existence, the link view (no link followed: custody of the declared path), the resolved
# view (links followed: the content admit_prep_tools.yml will later compare) with its declared digest, a disposition
# from the declared vocabulary, a custody judgement against the declared custody rule and the logical / family package
# of the resource. ONLY native stat / slurp of the declared attribution source: no measured tool is executed, no
# keyring byte is read or parsed (the stat digest only; get_attributes / get_mime off, so neither lsattr nor file
# runs). Absent / link / non-regular / non-executable / unreadable resources are RECORDED, never refused: a run that
# merely fails is not a measurement producer. It refuses only malformed inputs, a bad record root, or a record name
# whose bytes differ. It writes ONE content-addressed CANDIDATE record under the localhost host var root_var (mode
# record_mode, never overwritten), reports it, and ENDS the play: no fetch, no preparation.
#
# TRUST: the record is never self-authorizing (candidate true, self_authorizing false). A keyring digest pins BYTES,
# never trust: no fingerprint is observed here; preparation.<key>.keyring.fingerprints is declared by MAIN from an
# independently reviewed authority and checked later by the ADMITTED gpgv (prepare_tools.yml). Adoption = MAIN review,
# then C1 lands the next declared configuration revision (preparation_measurement.adoption); the existing strict
# preparation path (admit_prep_tools.yml / prepare_tools.yml) then runs unchanged.
#
# NAMES: every name derived here is in the declared family preparation_measurement.name_family (== registry
# contract_admission.patterns.reserved_meas_vars, C1 proposal), refused as an INPUT by the first task (the prepare.yml
# :34-41 idiom). Inputs (mode_var, root_var) are outside the family.

- name: "MEASURE -- refuse pre-supplied measurement names (the declared name family)"
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.preparation_measurement.name_family is string
      - (vars | list) | select('match', rh.controller.bootstrap.preparation_measurement.name_family) | list | length == 0
    fail_msg: >-
      {{ rh.controller.bootstrap.preparation_measurement.diagnostics.refused }}
      {{ rh.controller.bootstrap.preparation_measurement.refusal }}:
      {{ rh.controller.bootstrap.preparation_measurement.diagnostics.names }}
      {{ (vars | list) | select('match', rh.controller.bootstrap.preparation_measurement.name_family | default('^$')) | list }}
    quiet: true

- name: "MEASURE -- admit the declaration, the mode, the absence of acquisition inputs and the record root input (no defaults)"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
    _rh_meas_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.preparation_measurement.root_var, default='') }}"
  ansible.builtin.assert:
    that:
      # the interface revision THIS consumer implements (the prepare.yml :69 precedent); the contract pins it too
      - _rh_meas_m.revision | default(none) == 1
      - _rh_meas_m.stage == rh_gen_stage
      - rh_gen_stage in rh.controller.bootstrap.genesis.launch.stages
      - lookup('ansible.builtin.vars', _rh_meas_m.mode_var, default='') == _rh_meas_m.mode_value
      - _rh_meas_m.refused_inputs | select('in', vars) | list | length == 0
      - _rh_meas_root is string and _rh_meas_root != ''
      - _rh_meas_root is match(rh.controller.bootstrap.path_admission.regex)
      - _rh_meas_root is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - _rh_meas_m.resources.tools | length > 0
      - _rh_meas_m.resources.tools | reject('in', rh.controller.bootstrap.preparation.tools) | list | length == 0
      - _rh_meas_m.resources.keyrings | list | reject('in', rh.controller.bootstrap.preparation) | list | length == 0
      - _rh_meas_m.family in rh.packages.by_os_family
      - >-
        _rh_meas_m.resources.keyrings | dict2items | map(attribute='value.package')
        | reject('in', rh.packages.by_os_family[_rh_meas_m.family]) | list | length == 0
    fail_msg: >-
      {{ _rh_meas_m.diagnostics.refused }} {{ _rh_meas_m.refusal }}: {{ _rh_meas_m.diagnostics.inputs }}
      {{ _rh_meas_m.mode_var }}={{ lookup('ansible.builtin.vars', _rh_meas_m.mode_var, default='') }}
      (want {{ _rh_meas_m.mode_value }}); supplied acquisition inputs {{ _rh_meas_m.refused_inputs | select('in', vars) | list }};
      {{ _rh_meas_m.root_var }}={{ _rh_meas_root }}; tools {{ _rh_meas_m.resources.tools }}; keyrings
      {{ _rh_meas_m.resources.keyrings | list }}; family {{ _rh_meas_m.family }}. {{ _rh_meas_m.diagnostics.stop }}
    quiet: true

- name: "MEASURE -- publish the admitted record root (derived output)"
  ansible.builtin.set_fact:
    rh_meas_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.preparation_measurement.root_var) }}"

- name: "MEASURE -- stat the record root (read-only; never created or re-moded here)"
  ansible.builtin.stat:
    path: "{{ rh_meas_root }}"
    follow: false
    get_checksum: false
    get_attributes: false
    get_mime: false
  register: _rh_meas_rootst

- name: "MEASURE -- refuse a record root that is not an existing owned private real directory"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
    _rh_meas_d: "{{ _rh_meas_rootst.stat }}"
  ansible.builtin.assert:
    that:
      - _rh_meas_d.exists and _rh_meas_d.isdir and not _rh_meas_d.islnk
      - _rh_meas_d.uid == rh_builder.uid | int
      - _rh_meas_d.mode == _rh_meas_m.root_mode
    fail_msg: >-
      {{ _rh_meas_m.diagnostics.refused }} {{ _rh_meas_m.refusal }}: {{ _rh_meas_m.diagnostics.root }}
      ({{ rh_meas_root }}: uid {{ _rh_meas_d.uid | default('?') }} want {{ rh_builder.uid }}, mode
      {{ _rh_meas_d.mode | default('?') }} want {{ _rh_meas_m.root_mode }}). {{ _rh_meas_m.diagnostics.stop }}
    quiet: true

- name: "MEASURE -- link view of every selected tool (the declared path, no link followed; nothing runs)"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: false
    get_checksum: false
    get_attributes: false
    get_mime: false
  loop: "{{ rh.controller.bootstrap.preparation_measurement.resources.tools }}"
  register: _rh_meas_tl

- name: "MEASURE -- resolved view of every selected tool (links followed; the content admit_prep_tools.yml compares)"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  loop: "{{ rh.controller.bootstrap.preparation_measurement.resources.tools }}"
  register: _rh_meas_tr

- name: "MEASURE -- every selected keyring (no link followed: a link is recorded, never hashed through; bytes never read)"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.preparation[item.key].keyring.path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  loop: "{{ rh.controller.bootstrap.preparation_measurement.resources.keyrings | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: _rh_meas_kr

- name: "MEASURE -- read the declared attribution source (the controller's host name; native read)"
  ansible.builtin.slurp:
    src: "{{ rh.controller.bootstrap.preparation_measurement.attribution.host_name_source }}"
  register: _rh_meas_host

- name: "MEASURE -- the tool observations (declared vocabulary, field names and custody rule)"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
  ansible.builtin.set_fact:
    rh_meas_tools: >-
      {%- set m = _rh_meas_m -%}{%- set f = m.record_fields -%}{%- set d = m.dispositions -%}{%- set c = m.custody -%}
      {%- set ns = namespace(o={}) -%}
      {%- for name in m.resources.tools -%}
      {%- set l = _rh_meas_tl.results[loop.index0].stat -%}
      {%- set r = _rh_meas_tr.results[loop.index0].stat -%}
      {%- set disp = d.absent if not r.exists else (d.not_regular if not r.isreg else (d.not_executable if not r.executable
            else (d.unreadable if r.checksum is not defined else d.present))) -%}
      {%- set cus = (r.exists and r.uid == c.owner_uid and (not r.wgrp) and (not r.woth)
            and ((not l.islnk) or l.uid == c.owner_uid)) | bool -%}
      {%- set lpk = rh.packages.provides | dict2items | selectattr('value', 'contains', name) | map(attribute='key') | list -%}
      {%- set ns.o = ns.o | combine({name: {
            f.declared: rh.controller.bootstrap.os_tools[name],
            f.link_view: l | dict2items | selectattr('key', 'in', m.observed_fields) | items2dict,
            f.resolved_view: r | dict2items | selectattr('key', 'in', m.observed_fields) | items2dict,
            f.digest_algorithm: m.digest,
            f.digest: r.checksum | default(none),
            f.disposition: disp,
            f.custody_ok: cus,
            f.logical_package: lpk,
            f.package: lpk | select('in', rh.packages.by_os_family[m.family]) | map('extract', rh.packages.by_os_family[m.family]) | list,
            f.adoptable: disp == d.present and cus}}) -%}
      {%- endfor -%}{{ ns.o }}

- name: "MEASURE -- the keyring observations (bytes pinned only; no fingerprint observed)"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
  ansible.builtin.set_fact:
    rh_meas_keyrings: >-
      {%- set m = _rh_meas_m -%}{%- set f = m.record_fields -%}{%- set d = m.dispositions -%}{%- set c = m.custody -%}
      {%- set ns = namespace(o={}) -%}
      {%- for kv in m.resources.keyrings | dict2items -%}
      {%- set k = _rh_meas_kr.results[loop.index0].stat -%}
      {%- set disp = d.absent if not k.exists else (d.link if k.islnk else (d.not_regular if not k.isreg
            else (d.unreadable if k.checksum is not defined else d.present))) -%}
      {%- set cus = (k.exists and (not k.islnk) and k.uid == c.owner_uid and (not k.wgrp) and (not k.woth)) | bool -%}
      {%- set ns.o = ns.o | combine({kv.key: {
            f.declared: rh.controller.bootstrap.preparation[kv.key].keyring,
            f.link_view: k | dict2items | selectattr('key', 'in', m.observed_fields) | items2dict,
            f.digest_algorithm: m.digest,
            f.digest: k.checksum | default(none),
            f.disposition: disp,
            f.custody_ok: cus,
            f.logical_package: [kv.value.package],
            f.package: [rh.packages.by_os_family[m.family][kv.value.package]],
            f.adoptable: disp == d.present and cus}}) -%}
      {%- endfor -%}{{ ns.o }}

- name: "MEASURE -- render the candidate record (one value, digested before it is written)"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
    _rh_meas_f: "{{ rh.controller.bootstrap.preparation_measurement.record_fields }}"
    _rh_meas_all: "{{ (rh_meas_tools | dict2items) + (rh_meas_keyrings | dict2items) }}"
  ansible.builtin.set_fact:
    rh_meas_record_text: >-
      {{ {_rh_meas_f.schema: _rh_meas_m.record_schema,
          _rh_meas_f.candidate: true,
          _rh_meas_f.self_authorizing: false,
          _rh_meas_f.operation: _rh_meas_m.operation,
          _rh_meas_f.measured_at_utc: now(utc=true).strftime(_rh_meas_m.time_format),
          _rh_meas_f.act: lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
          _rh_meas_f.stage: rh_gen_stage,
          _rh_meas_f.host_name: _rh_meas_host.content | b64decode | trim,
          _rh_meas_f.profile_sha256: rh_profile_sha256,
          _rh_meas_f.config_revision: rh_config_revision,
          _rh_meas_f.engine_revision: rh_engine_revision,
          _rh_meas_f.builder: rh_builder,
          _rh_meas_f.declaration: _rh_meas_m,
          _rh_meas_f.tools: rh_meas_tools,
          _rh_meas_f.keyrings: rh_meas_keyrings,
          _rh_meas_f.missing_packages: _rh_meas_all | map(attribute='value') | selectattr(_rh_meas_f.disposition, 'equalto', _rh_meas_m.dispositions.absent)
                                       | map(attribute=_rh_meas_f.package) | flatten | unique | sort,
          _rh_meas_f.complete: _rh_meas_all | map(attribute='value') | rejectattr(_rh_meas_f.adoptable) | list | length == 0} | to_nice_json }}

- name: "MEASURE -- write the candidate record content-addressed (no overwrite: an existing name IS these bytes)"
  ansible.builtin.copy:
    dest: >-
      {{ rh_meas_root ~ '/' ~ (rh_meas_record_text | hash(rh.controller.bootstrap.preparation_measurement.digest))
         ~ rh.controller.bootstrap.preparation_measurement.record_suffix }}
    content: "{{ rh_meas_record_text }}"
    mode: "{{ rh.controller.bootstrap.preparation_measurement.record_mode }}"
    force: false

- name: "MEASURE -- re-read the written record (links not followed)"
  ansible.builtin.stat:
    path: >-
      {{ rh_meas_root ~ '/' ~ (rh_meas_record_text | hash(rh.controller.bootstrap.preparation_measurement.digest))
         ~ rh.controller.bootstrap.preparation_measurement.record_suffix }}
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.preparation_measurement.digest }}"
    get_attributes: false
    get_mime: false
  register: _rh_meas_recst

- name: "MEASURE -- refuse unless the record on disk is exactly the rendered bytes"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
  ansible.builtin.assert:
    that:
      - _rh_meas_recst.stat.exists and _rh_meas_recst.stat.isreg and not _rh_meas_recst.stat.islnk
      - _rh_meas_recst.stat.checksum == (rh_meas_record_text | hash(_rh_meas_m.digest))
      - _rh_meas_recst.stat.mode == _rh_meas_m.record_mode
    fail_msg: >-
      {{ _rh_meas_m.diagnostics.refused }} {{ _rh_meas_m.refusal }}: {{ _rh_meas_m.diagnostics.record }}
      ({{ _rh_meas_recst.stat.path | default('?') }}). {{ _rh_meas_m.diagnostics.stop }}
    quiet: true

- name: "MEASURE -- report the candidate (a request for MAIN review; never self-authorizing)"
  vars:
    _rh_meas_m: "{{ rh.controller.bootstrap.preparation_measurement }}"
    _rh_meas_f: "{{ rh.controller.bootstrap.preparation_measurement.record_fields }}"
    _rh_meas_r: "{{ rh_meas_record_text | from_json }}"
  ansible.builtin.debug:
    msg: >-
      {{ _rh_meas_m.report }} {{ _rh_meas_f.record }}={{ _rh_meas_recst.stat.path }}
      {{ _rh_meas_f.record_sha256 }}={{ _rh_meas_recst.stat.checksum }}
      {{ _rh_meas_f.complete }}={{ _rh_meas_r[_rh_meas_f.complete] }}
      {{ _rh_meas_f.missing_packages }}={{ _rh_meas_r[_rh_meas_f.missing_packages] }}
      {{ _rh_meas_f.candidate }}=true {{ _rh_meas_f.self_authorizing }}=false. {{ _rh_meas_m.diagnostics.stop }}

- name: "MEASURE -- END: measurement only (no artifact-source admission, no fetch, no preparation)"
  ansible.builtin.meta: end_host
