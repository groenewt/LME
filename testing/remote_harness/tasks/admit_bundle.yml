---
# testing/remote_harness/tasks/admit_bundle.yml -- CONTROLLER-side admission of ONE class bundle published by
# package.yml (S1; r3g per-class). Requires resolve_policy.yml (rh: the controller's own policy for path admission
# and the bundle layout names; rh_repo_root) earlier in the play. Read-only. Inputs (include params; all
# registry-reserved, never inputs from inventory or extra-vars):
#   rh_admit_dir     the class destination (controller class: rh_bundle_dir; others: bundle.per_class sibling rule)
#   rh_admit_key     the class key (C1's published per_class.key_field value) the bundle must record as class_key
#   rh_admit_policy  the class scope's own resolved policy (what the seed was rendered from)
#   rh_admit_lock    that policy's lock
#
# Admitted only when the bundle holds EXACTLY: the seed (0500), bundle.json and bundle.sha256 (0400), and
# artifacts/ (0700) with exactly the class's declared files (0400), no links, no other entry; every artifact has its
# declared sha256; the seed is byte-identical to a FRESH render of the class policy; bundle.json names that seed
# digest, the declared artifact rows and THIS class key (a bundle of another class, or a stale one, refuses: never a
# fallback to the controller bundle).

- name: Admit the class bundle inputs (the ONE path-admission rule; no default)
  ansible.builtin.assert:
    that:
      - rh_admit_dir is defined and rh_admit_dir is string
      - rh_admit_dir is match(rh.controller.bootstrap.path_admission.regex)
      - rh_admit_dir is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - rh_admit_key is defined and rh_admit_key is string
      - rh_admit_key is match(rh.controller.bootstrap.bundle.per_class.key_regex)
      - rh_admit_policy is defined and rh_admit_policy is mapping
      - rh_admit_lock is defined and rh_admit_lock is mapping
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP the class bundle dir {{ rh_admit_dir | default('absent') }} must be a normalized
      absolute path and its class key {{ rh_admit_key | default('absent') }} a declared key (bundle.per_class.key_regex),
      with the class policy and lock bound.
    quiet: true

- name: Stat the class bundle dir (a missing class bundle refuses; never the controller bundle instead)
  ansible.builtin.stat:
    path: "{{ rh_admit_dir }}"
    follow: false
    get_checksum: false
  register: _rh_bnd_dir

- name: Refuse a missing class bundle (RH-SCOPE-BINDING; package.yml publishes every class of the deployment)
  ansible.builtin.assert:
    that:
      - _rh_bnd_dir.stat.exists and _rh_bnd_dir.stat.isdir and not _rh_bnd_dir.stat.islnk
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.bundle.per_class.refusal }}: the bundle of class {{ rh_admit_key }} is not
      published at {{ rh_admit_dir }} (a real directory); run package.yml with this deployment's inventory. No other
      class's bundle is substituted.
    quiet: true

- name: List the bundle (no links followed)
  ansible.builtin.find:
    paths: "{{ rh_admit_dir }}"
    recurse: true
    file_type: any
    hidden: true
    follow: false
  register: _rh_bnd_list

- name: Digest the seed, the manifests and every declared artifact in the bundle
  ansible.builtin.stat:
    path: "{{ rh_admit_dir }}/{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: >-
    {{ [rh.controller.bootstrap.bundle.seed_file, rh.controller.bootstrap.bundle.manifest_file, rh.controller.bootstrap.bundle.checksum_file]
       + ((rh_admit_policy.controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections)
          | map(attribute='file') | map('regex_replace', '^', rh.controller.bootstrap.bundle.artifacts_dir ~ '/') | list) }}
  register: _rh_bnd_stat

- name: Read the bundle manifest
  ansible.builtin.slurp:
    src: "{{ rh_admit_dir }}/{{ rh.controller.bootstrap.bundle.manifest_file }}"
  register: _rh_bnd_manifest

- name: Refuse a bundle that is not exactly the declared one of this class
  vars:
    _rows: "{{ rh_admit_policy.controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections }}"
    _expect_members: >-
      {{ ([rh.controller.bootstrap.bundle.seed_file, rh.controller.bootstrap.bundle.manifest_file,
           rh.controller.bootstrap.bundle.checksum_file, rh.controller.bootstrap.bundle.artifacts_dir]
          + (_rows | map(attribute='file') | map('regex_replace', '^', rh.controller.bootstrap.bundle.artifacts_dir ~ '/') | list))
         | sort }}
    _fresh_seed_sha256: >-
      {{ lookup('ansible.builtin.template', rh_repo_root ~ '/' ~ rh.controller.bootstrap.template_rel,
                template_vars={'lme_seed_bs': rh_admit_policy.controller.bootstrap, 'lme_seed_ctl': rh_admit_policy.controller,
                               'lme_seed_lock': rh_admit_lock}) | hash('sha256') }}
    _m: "{{ _rh_bnd_manifest.content | b64decode | from_json }}"
  ansible.builtin.assert:
    that:
      - (_rh_bnd_list.files | map(attribute='path') | map('regex_replace', '^' ~ (rh_admit_dir | regex_escape) ~ '/', '') | sort) == _expect_members
      - _rh_bnd_list.files | selectattr('islnk') | list | length == 0
      - _rh_bnd_stat.results | rejectattr('stat.isreg') | list | length == 0
      - _rh_bnd_stat.results[0].stat.mode == '0500'
      - _rh_bnd_stat.results[1:] | map(attribute='stat.mode') | unique | list == ['0400']
      - _rh_bnd_list.files | selectattr('isdir') | map(attribute='mode') | list == ['0700']
      - _rh_bnd_stat.results[3:] | map(attribute='stat.checksum') | list == _rows | map(attribute='sha256') | list
      - _rh_bnd_stat.results[0].stat.checksum == _fresh_seed_sha256
      - _m.schema == rh.controller.bootstrap.bundle.schema
      - _m.seed_sha256 == _fresh_seed_sha256
      - _m.checksum_file_sha256 == _rh_bnd_stat.results[2].stat.checksum
      - _m.artifacts == (_rows | map(attribute='file') | zip(_rows | map(attribute='sha256')) | map('join', '  ') | list)
      - _m.class_key | default('') == rh_admit_key
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP: {{ rh_admit_dir }} is not exactly a package.yml bundle of class {{ rh_admit_key }}
      (members, modes, links, artifact digests, fresh-render seed digest, bundle.json, or its recorded class_key
      {{ _m.class_key | default('absent') }}: a stale or other-class bundle). Rebuild it with package.yml.
    quiet: true

- name: Publish the admitted bundle identity (derived output)
  ansible.builtin.set_fact:
    rh_bundle:
      dir: "{{ rh_admit_dir }}"
      class_key: "{{ rh_admit_key }}"
      seed_sha256: "{{ _rh_bnd_stat.results[0].stat.checksum }}"
      checksum_file_sha256: "{{ _rh_bnd_stat.results[2].stat.checksum }}"
      manifest_sha256: "{{ _rh_bnd_stat.results[1].stat.checksum }}"
      bytes: "{{ _rh_bnd_stat.results | map(attribute='stat.size') | sum }}"
      expected_generation: >-
        {{ 'core' ~ rh_admit_policy.controller.expect_core ~ '-py' ~ rh_admit_policy.controller.bootstrap.python.version ~ '-uv'
           ~ rh_admit_policy.controller.bootstrap.uv.version ~ '-' ~ _rh_bnd_stat.results[0].stat.checksum[:12] }}
      members: >-
        {{ (['d 700 ' ~ rh.controller.bootstrap.bundle.artifacts_dir,
             'f 500 ' ~ rh.controller.bootstrap.bundle.seed_file,
             'f 400 ' ~ rh.controller.bootstrap.bundle.manifest_file,
             'f 400 ' ~ rh.controller.bootstrap.bundle.checksum_file]
            + ((rh_admit_policy.controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections) | map(attribute='file')
               | map('regex_replace', '^', 'f 400 ' ~ rh.controller.bootstrap.bundle.artifacts_dir ~ '/') | list)) | sort }}
