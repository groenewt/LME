---
# testing/remote_harness/tasks/admit_bundle.yml -- CONTROLLER-side admission of ONE class bundle published by
# package.yml (S1; r3g per-class). Requires resolve_policy.yml (rh: the controller's own policy for path admission
# and the bundle layout names; rh_repo_root) earlier in the play. Read-only. Inputs (include params; all
# registry-reserved, never inputs from inventory or extra-vars):
#   rh_admit_dir     the class destination (controller class: rh_bundle_dir; others: bundle.per_class sibling rule)
#   rh_admit_key     the class key (C1's published per_class.key_field value) the bundle must record as class_key
#   rh_admit_policy  the class scope's own resolved policy (what the seed was rendered from)
#   rh_admit_lock    that policy's lock
#
# Admitted only when the bundle holds EXACTLY: the seed (0500), the seed launcher (bundle.launcher_file,
# bundle.launcher_mode = the seed's custody; byte-identical to a fresh render and recorded in bundle.json), bundle.json and bundle.sha256 (0400), and
# artifacts/ (0700) with exactly the class's declared files (0400), no links, no other entry; every artifact has its
# declared sha256; bundle.sha256 holds EXACTLY the canonical N+2 lines (seed, launcher, then the declared rows, each
# '<digest><separator><name>', every line terminated; re-derived from bundle.checksum_format and the admitted digests);
# the seed is byte-identical to a FRESH render of the class policy; bundle.json names that seed
# digest, the declared artifact rows and THIS class key (a bundle of another class, or a stale one, refuses: never a
# fallback to the controller bundle).
# MR03 PKG-CALLER optb-after-01 (successor of e1eebded; codex714 same-boundary debt, codex711 option B, codex716,
# codex717 POLICY-SCOPE (a); design pkg-optb-02 / -02a / -02b; AUTHORED, NEVER EXECUTED, UNRUN): (a) rh_admit_lock is
# package.yml's preflight capture of the class lock {text, sha256, packages, collections} (only packages / collections
# are read here); (b) every join is path_admission.separator (base :64, :72, :77, :85, :116, :119, :140, :144, :157,
# :196); (c) no default( reads: :31-32 and :173 diagnostics name only bound values (dir, key, manifest digest); the
# byte binding (:99-102) first admits both reads (regular files, check-file content present), so an absent check file
# refuses THERE; :159 / :160 / :167 / :169 read after a key-set admission of bundle.json at all three levels
# (manifest_record fields / source_fields / genesis_fields), field values then read by the pinned field words;
# (d) member modes from bundle.member_modes (C1-REQ-PKG-02; base :147, :149 split by role, :150), the launcher keeps
# launcher_mode; (e) the record artifact rows and check lines are built per row (row_separator, no zip); (f) member forms
# from bundle.member_form (fields order, separator, types, mode_prefix removed after an asserted prefix); (g) the
# expected generation walks layout.generation_id in THIS class's controller (rh_admit_policy; codex717: class content)
# with the seed digest = the admitted seed stat. The layout names, schema and modes stay rh.controller = the EXECUTING
# CONTROLLER PUBLICATION POLICY (codex717 (a)). BLOCKED-ON-GENESIS-GL: _rh_bnd_walk (GL-REQ-PKG-07), _rh_bnd_keys and
# _rlines (GL-REQ-PKG-08). BLOCKED-ON-C1-PKG: the policy-path segment separator (C1PKG-REQ-PATH-SEP).
# Change record: proposals/mr03-pkg-caller/optb-admit_bundle-01.change.yml.
# MR03 PKG-CALLER optb-after-02 (successor of optb-after-01 8471c0f2; records-pkg-optb-04 5148502e policy_segment_separator;
# UNRUN): the two generation-id policy walks (_rh_bnd_walk, expected_generation) split on rh.controller.bootstrap.
# source_admission.early_view.override.audit_join (the executing controller's declared policy-segment join, pinned by
# C1-OPTB4-GL-02), never on a literal and never on path_admission.separator. The C1PKG-REQ-PATH-SEP block on :33 is
# answered by optb-04. Atomic unit: lands with C1-OPTB4-GL-02 and the OWED-OPTB4-SEED-RULE / -DERIVE-RULE update.
# Change record: proposals/mr03-pkg-caller/optb-admit_bundle-02v.change.yml.

- name: Admit the class bundle inputs (the ONE path-admission rule; no default)
  ansible.builtin.assert:
    that:
      - rh_admit_dir is defined and rh_admit_dir is string
      - rh_admit_dir is match(rh.controller.bootstrap.path_admission.regex)
      - rh_admit_dir is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - rh_admit_key is defined and rh_admit_key is string
      - rh_admit_key is match(rh.controller.bootstrap.bundle.per_class.key_regex)
      - rh_admit_policy is defined and rh_admit_policy is mapping
      - rh_admit_controller is defined and rh_admit_controller is mapping
      - rh_admit_binding is defined and rh_admit_binding is mapping
      - rh_admit_binding.class_key == rh_admit_key
      - rh_admit_binding.lock_sha256 == rh_admit_lock.sha256
      - rh_admit_lock is defined and rh_admit_lock is mapping
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP the include parameters rh_admit_dir (a normalized absolute path), rh_admit_key (a
      declared key, bundle.per_class.key_regex), rh_admit_policy and rh_admit_lock (mappings) must all be bound.
    quiet: true

- name: Stat the class bundle dir (a missing class bundle refuses; never the controller bundle instead)
  ansible.builtin.stat:
    path: "{{ rh_admit_dir }}"
    follow: false
    get_checksum: false
  register: _rh_bnd_dir

- name: Refuse a missing class bundle (RH-SCOPE-BINDING; package.yml publishes every class of the deployment)
  ansible.builtin.assert:
    that:
      - _rh_bnd_dir.stat.exists and _rh_bnd_dir.stat.isdir and not _rh_bnd_dir.stat.islnk
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.bundle.per_class.refusal }}: the bundle of class {{ rh_admit_key }} is not
      published at {{ rh_admit_dir }} (a real directory); run package.yml with this deployment's inventory. No other
      class's bundle is substituted.
    quiet: true

- name: List the bundle (no links followed)
  ansible.builtin.find:
    paths: "{{ rh_admit_dir }}"
    recurse: true
    file_type: any
    hidden: true
    follow: false
  register: _rh_bnd_list

- name: Digest the seed, the manifests and every declared artifact in the bundle
  ansible.builtin.stat:
    path: "{{ rh_admit_dir ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
  loop: >-
    {{ [rh.controller.bootstrap.bundle.seed_file, rh.controller.bootstrap.bundle.manifest_file, rh.controller.bootstrap.bundle.checksum_file,
        rh.controller.bootstrap.bundle.launcher_file]
       + ((rh_admit_controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections)
          | map(attribute='file') | map('regex_replace', '^', rh.controller.bootstrap.bundle.artifacts_dir ~ rh.controller.bootstrap.path_admission.separator) | list) }}
  register: _rh_bnd_stat

- name: Read the bundle manifest
  ansible.builtin.slurp:
    src: "{{ rh_admit_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.bundle.manifest_file }}"
  register: _rh_bnd_manifest

# ROUTE-ADMIT-CHECKFILE-CONTENT-UNBOUND (codex 212700 / 212758, route F-A): the check file's BYTES are admitted here, not
# only its digest's self-consistency with bundle.json. Read without failing on absence: optb-after-01, an absent check
# file refuses at the byte binding below (its first conditions), never as a module error and never through a default.
- name: Read the consumer check file (its bytes are compared with the re-derived canonical lines below)
  ansible.builtin.slurp:
    src: "{{ rh_admit_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.bundle.checksum_file }}"
  register: _rh_bnd_sum
  failed_when: false

# PARSED-BYTE BINDING (codex-tick355 / tick361 RX-SCOPE row 1): the digests PUBLISHED below (rh_bundle.manifest_sha256,
# checksum_file_sha256) are the stats above, while bundle.json is PARSED and the check file's content COMPARED from the
# two reads above. Each read's decoded bytes must hash to its own stat BEFORE any parse / comparison, so a
# rename-replacement between the stat and the read refuses here instead of publishing sha(M1) for the parsed M2. Only a
# replacement between the stat and the read reaches this task: a copy whose bytes differ consistently (the E77 / E82 / E86
# fixtures) passes it and refuses at the assertions of the next task, unchanged. optb-after-01 (codex714 :99 / :102
# debt): bundle.json and the check file are first admitted as present regular files and the check file's read as
# present, so each digest compare reads bound values only (no default); an absent check file refuses HERE.
- name: Bind the bytes READ of bundle.json and of the check file to their measured digests BEFORE parsing
  ansible.builtin.assert:
    that:
      - _rh_bnd_stat.results[1].stat.exists and _rh_bnd_stat.results[1].stat.isreg
      - _rh_bnd_stat.results[2].stat.exists and _rh_bnd_stat.results[2].stat.isreg
      - _rh_bnd_sum.content is defined
      - (_rh_bnd_manifest.content | b64decode | hash('sha256')) == _rh_bnd_stat.results[1].stat.checksum
      - (_rh_bnd_sum.content | b64decode | hash('sha256')) == _rh_bnd_stat.results[2].stat.checksum
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP: {{ rh_admit_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.bundle.manifest_file }}
      and {{ rh_admit_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.bundle.checksum_file }} must be
      present regular files whose bytes read are the bytes measured just before (absent, or replaced between the digest
      and the read). Nothing was parsed or published.
    quiet: true

# optb-after-01 (codex714 REC-01; records-pkg-optb-02 manifest_record): bundle.json's key set is admitted at all three
# levels BEFORE any field value is read: the top keys == manifest_record.fields, and each nested field's mapping keys ==
# the field list of its roles node (source_roles -> source_fields, genesis_roles -> genesis_fields: by the two declared
# names, C1PKG-REQ-NESTED-LINK). Equal sets with equal length. BLOCKED-ON-GENESIS-GL _rh_bnd_keys (GL-REQ-PKG-08).
- name: Refuse a bundle.json whose keys are not the declared record fields (three levels; before any value read)
  vars:
    _m: "{{ _rh_bnd_manifest.content | b64decode | from_json }}"
    _rh_bnd_keys: >-
      {%- set mr = rh.controller.bootstrap.bundle.manifest_record -%}
      {%- set links = {'source_roles': mr.source_fields, 'genesis_roles': mr.genesis_fields} -%}
      {%- set ns = namespace(l=[]) -%}
      {%- if _m is not mapping -%}{%- set ns.l = ns.l + [[mr.fields | to_json]] -%}
      {%- else -%}
      {%- if (_m | list | sort) != (mr.fields | sort) or (_m | length) != (mr.fields | length) -%}{%- set ns.l = ns.l + [[_m | list | sort | to_json]] -%}{%- endif -%}
      {%- for f in mr.fields if 'nested' in mr.roles[f] -%}
      {%- set fl = links[mr.roles[f].nested] -%}
      {%- if f not in _m or _m[f] is not mapping or (_m[f] | list | sort) != (fl | sort) or (_m[f] | length) != (fl | length) -%}{%- set ns.l = ns.l + [[f, fl | to_json]] -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}{{ ns.l }}
  ansible.builtin.assert:
    that:
      - _rh_bnd_keys | length == 0
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP: {{ rh_admit_dir }} (class {{ rh_admit_key }}, bundle.json sha256
      {{ _rh_bnd_stat.results[1].stat.checksum }}) does not record exactly the declared bundle.json fields
      {{ _rh_bnd_keys | to_json }}. Rebuild it with package.yml.
    quiet: true

- name: Refuse a bundle that is not exactly the declared one of this class
  vars:
    _rows: "{{ rh_admit_controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections }}"
    _expect_members: >-
      {{ ([rh.controller.bootstrap.bundle.seed_file, rh.controller.bootstrap.bundle.manifest_file,
           rh.controller.bootstrap.bundle.checksum_file, rh.controller.bootstrap.bundle.launcher_file,
           rh.controller.bootstrap.bundle.artifacts_dir]
          + (_rows | map(attribute='file') | map('regex_replace', '^', rh.controller.bootstrap.bundle.artifacts_dir ~ rh.controller.bootstrap.path_admission.separator) | list))
         | sort }}
    _fresh_seed_sha256: >-
      {{ lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.template_rel,
                template_vars={'lme_seed_bs': rh_admit_controller.bootstrap, 'lme_seed_ctl': rh_admit_controller,
                               'lme_seed_lock': rh_admit_lock}
                              | combine({'lme_seed_dispatch': rh_admit_controller.entry_generation.dispatch}
                                        if rh_admit_controller.bootstrap.source_admission.dispatch_admission.mode == rh_admit_controller.bootstrap.source_admission.dispatch_modes.generation else {})) | hash('sha256') }}
    _m: "{{ _rh_bnd_manifest.content | b64decode | from_json }}"
    # The canonical N+2 check-file TEXT, re-derived independently of the file: bundle.checksum_format (separator,
    # terminator), the declared order (seed, launcher, then every artifact / lock package / lock collection row) and the
    # member digests admitted above (seed = results[0], launcher = results[3], both fresh-render-bound below; rows =
    # the declared sha256). The terminator is bound in a {% set %} STATEMENT whose string constant holds a REAL line
    # feed: this value is a YAML DOUBLE-QUOTED scalar, so the loader turns the escape into U+000A before Jinja sees it
    # (PyYAML scanner.py ESCAPE_REPLACEMENTS 'n' -> '\x0A', :1164, the loader of 2.17.14 and 2.19.11 alike). Jinja
    # admits a raw line feed in a string constant (jinja2/lexer.py string_re, :29-31, re.S; 3.1.6), and the template
    # therefore holds NO backslash: the 2.19 AnsibleLexer doubling (_jinja_bits.py; _engine.py TemplateOptions
    # escape_backslashes, :75) and the 2.17 _escape_backslashes (template/__init__.py :112, :924-926) have nothing to
    # act on. Trailing line feeds of the result are kept (2.17 do_template :979-992 and 2.19 _post_render_mutation
    # :389-405 only ever ADD newlines). No vars lookup; the ONE grammar stays package_bundle.yml's / the seed's.
    # optb-after-01: each row line from that row's own sha256 and file (no zip); joins on path_admission.separator; the
    # line breaks of this double-quoted scalar fall only INSIDE Jinja tags (folding never adds output text).
    _want: "{% set cf = rh.controller.bootstrap.bundle.checksum_format %}{% set nl = {'newline': '\n'}[cf.terminator] %}{%
      set ns = namespace(l=[_rh_bnd_stat.results[0].stat.checksum ~ cf.separator ~ rh.controller.bootstrap.bundle.seed_file,
                            _rh_bnd_stat.results[3].stat.checksum ~ cf.separator ~ rh.controller.bootstrap.bundle.launcher_file]) %}{%
      for a in _rows %}{% set ns.l = ns.l + [a.sha256 ~ cf.separator ~ rh.controller.bootstrap.bundle.artifacts_dir
                                               ~ rh.controller.bootstrap.path_admission.separator ~ a.file] %}{%
      endfor %}{{ ns.l | join(nl) ~ nl }}"
    # optb-after-01: the recorded artifact rows, re-derived per row with manifest_record.row_separator (no zip, no
    # literal). BLOCKED-ON-GENESIS-GL _rlines (GL-REQ-PKG-08).
    _rlines: >-
      {%- set ns = namespace(l=[]) -%}
      {%- for a in _rows -%}{%- set ns.l = ns.l + [a.file ~ rh.controller.bootstrap.bundle.manifest_record.row_separator ~ a.sha256] -%}{%- endfor -%}
      {{ ns.l }}
    # optb-after-01 (records-pkg-optb-01 layout.generation_id): every order role has a prefix and a source; a policy source
    # resolves segment by segment in THIS class's controller (codex717: expected generation is class content); a digest
    # source is the one digest word this consumer implements (seed_sha256 = the admitted seed stat). Checked FIRST below,
    # before the identity set_fact walks it. BLOCKED-ON-GENESIS-GL _rh_bnd_walk (GL-REQ-PKG-07).
    _rh_bnd_walk: >-
      {%- set gi = rh.controller.bootstrap.layout.generation_id -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for o in gi.order -%}
      {%- if o not in gi.prefixes or o not in gi.sources or gi.sources[o] is not mapping or (gi.sources[o] | length) != 1 -%}{%- set ns.l = ns.l + [o] -%}
      {%- elif 'digest' in gi.sources[o] -%}
      {%- if gi.sources[o].digest not in ['seed_sha256'] -%}{%- set ns.l = ns.l + [o] -%}{%- endif -%}
      {%- elif 'policy' in gi.sources[o] -%}
      {#- optb-after-02: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
      {%- set w = namespace(n=rh_admit_controller, ok=true) -%}
      {%- for s in gi.sources[o].policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}
      {%- if w.ok and w.n is mapping and s in w.n -%}{%- set w.n = w.n[s] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
      {%- endfor -%}
      {%- if not w.ok -%}{%- set ns.l = ns.l + [o] -%}{%- endif -%}
      {%- else -%}{%- set ns.l = ns.l + [o] -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.l }}
  ansible.builtin.assert:
    that:
      - _rh_bnd_walk | length == 0
      # optb-after-01 (member_form): every declared member mode starts with member_form.mode_prefix before any form strips it
      - >-
        [rh.controller.bootstrap.bundle.member_modes.artifacts_dir, rh.controller.bootstrap.bundle.member_modes.seed_file,
         rh.controller.bootstrap.bundle.launcher_mode | string, rh.controller.bootstrap.bundle.member_modes.manifest_file,
         rh.controller.bootstrap.bundle.member_modes.checksum_file, rh.controller.bootstrap.bundle.member_modes.artifact]
        | reject('match', rh.controller.bootstrap.bundle.member_form.mode_prefix | regex_escape) | list | length == 0
      - >-
        (_rh_bnd_list.files | map(attribute='path')
         | map('regex_replace', '^' ~ (rh_admit_dir | regex_escape) ~ (rh.controller.bootstrap.path_admission.separator | regex_escape), '')
         | sort) == _expect_members
      - _rh_bnd_list.files | selectattr('islnk') | list | length == 0
      - _rh_bnd_stat.results | rejectattr('stat.isreg') | list | length == 0
      - _rh_bnd_stat.results[0].stat.mode == rh.controller.bootstrap.bundle.member_modes.seed_file
      - _rh_bnd_stat.results[3].stat.mode == rh.controller.bootstrap.bundle.launcher_mode
      - _rh_bnd_stat.results[1].stat.mode == rh.controller.bootstrap.bundle.member_modes.manifest_file
      - _rh_bnd_stat.results[2].stat.mode == rh.controller.bootstrap.bundle.member_modes.checksum_file
      - _rh_bnd_stat.results[4:] | map(attribute='stat.mode') | reject('equalto', rh.controller.bootstrap.bundle.member_modes.artifact) | list | length == 0
      - _rh_bnd_list.files | selectattr('isdir') | map(attribute='mode') | list == [rh.controller.bootstrap.bundle.member_modes.artifacts_dir]
      - _rh_bnd_stat.results[4:] | map(attribute='stat.checksum') | list == _rows | map(attribute='sha256') | list
      - _rh_bnd_stat.results[0].stat.checksum == _fresh_seed_sha256
      # the launcher (seed_launcher) is admitted as a generated artifact: byte-identical to a FRESH render of the class
      # policy and recorded in bundle.json; it runs before the seed, so this admission (not the seed) is its boundary
      - >-
        _rh_bnd_stat.results[3].stat.checksum
        == lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.seed_launcher.template_rel,
                  template_vars={'lme_seed_bs': rh_admit_controller.bootstrap}) | hash('sha256')
      # optb-after-01: bundle.json keys were admitted at all three levels in the task above, so each field below is read
      # by its pinned field word with no default
      - _m.launcher_file == rh.controller.bootstrap.bundle.launcher_file
      - _m.launcher_sha256 == _rh_bnd_stat.results[3].stat.checksum
      - _m.schema == rh.controller.bootstrap.bundle.schema
      - _m.seed_sha256 == _fresh_seed_sha256
      - _m.checksum_file_sha256 == _rh_bnd_stat.results[2].stat.checksum
      # the check file's BYTES: exactly the canonical N+2 terminated lines in the declared order (a reordered,
      # duplicated, missing, extra, malformed or unterminated line refuses HERE, before pack_class.yml packs or
      # publishes a transfer identity; a reorder is refused ONLY here -- the seed's name check is order-insensitive)
      - (_rh_bnd_sum.content | b64decode) == _want
      - _m.artifacts == _rlines
      - _m.class_key == rh_admit_key
      - >-
        {%- set bn = rh.controller.bootstrap.bundle -%}
        {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
        {%- set expected = namespace(rows={}) -%}
        {%- for artifact in _rows -%}
        {%- set expected.rows = expected.rows | combine({bn.artifacts_dir ~ sep ~ artifact.file: artifact.max_bytes}) -%}
        {%- endfor -%}
        {%- for role, cap in rh_admit_controller.bootstrap.bundle.member_max_bytes | dictsort -%}
        {%- set expected.rows = expected.rows | combine({bn[role]: cap}) -%}
        {%- endfor -%}
        {{ _m.allocation | lme_type_aware_equal({'rows': expected.rows, 'total': expected.rows.values() | sum}) }}
      - >-
        {%- set gb = _lme_global_file.lme_config_registry.remote_harness_schema.generation_binding -%}
        {%- set expected = namespace(v={}) -%}
        {%- for field, role in gb.provenance_fields | dictsort -%}
        {%- set expected.v = expected.v | combine({field: rh_admit_binding[gb.fields[role]]}) -%}
        {%- endfor -%}
        {{ _m[gb.provenance_block] == expected.v }}
    fail_msg: >-
      REFUSED RH-TARGET-BOOTSTRAP: {{ rh_admit_dir }} (bundle.json sha256 {{ _rh_bnd_stat.results[1].stat.checksum }}) is
      not exactly a package.yml bundle of class {{ rh_admit_key }} (generation-id sources, member modes, members, links,
      artifact digests, fresh-render seed digest, check-file content, bundle.json fields or recorded class key: a stale or
      other-class bundle). Rebuild it with package.yml.
    quiet: true

- name: Publish the admitted bundle identity (derived output)
  ansible.builtin.set_fact:
    rh_bundle:
      dir: "{{ rh_admit_dir }}"
      class_key: "{{ rh_admit_key }}"
      seed_sha256: "{{ _rh_bnd_stat.results[0].stat.checksum }}"
      launcher_sha256: "{{ _rh_bnd_stat.results[3].stat.checksum }}"
      checksum_file_sha256: "{{ _rh_bnd_stat.results[2].stat.checksum }}"
      manifest_sha256: "{{ _rh_bnd_stat.results[1].stat.checksum }}"
      bytes: "{{ _rh_bnd_stat.results | map(attribute='stat.size') | sum }}"
      # optb-after-01: layout.generation_id order / prefixes / sources walked in THIS class's controller (admitted above,
      # _rh_bnd_walk); the digest source is the admitted seed stat, its first seed_digest_chars characters
      expected_generation: >-
        {%- set gi = rh.controller.bootstrap.layout.generation_id -%}
        {%- set g = namespace(s='') -%}
        {%- for o in gi.order -%}
        {%- if 'digest' in gi.sources[o] -%}
        {%- set g.s = g.s ~ gi.prefixes[o] ~ {'seed_sha256': _rh_bnd_stat.results[0].stat.checksum}[gi.sources[o].digest][:gi.seed_digest_chars] -%}
        {%- else -%}
        {#- optb-after-02: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
        {%- set w = namespace(n=rh_admit_controller) -%}
        {%- for s in gi.sources[o].policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.n = w.n[s] -%}{%- endfor -%}
        {%- set g.s = g.s ~ gi.prefixes[o] ~ w.n -%}
        {%- endif -%}
        {%- endfor -%}{{ g.s }}
      # optb-after-01 (records-pkg-optb-02 bundle.member_form): one form per member, its member_form.fields joined by
      # member_form.separator from {type: member_form.types.dir | .file, mode: the member mode with member_form.mode_prefix
      # removed (prefix asserted above), rel}; the launcher reads launcher_mode (its own word), every other member its
      # member_modes role. The keys type / mode / rel are the pinned member_form field words (contract bundle_member_form).
      members: >-
        {%- set bn = rh.controller.bootstrap.bundle -%}
        {%- set mf = bn.member_form -%}
        {%- set mm = bn.member_modes -%}
        {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
        {%- set ent = namespace(l=[{'type': mf.types.dir, 'mode': mm.artifacts_dir, 'rel': bn.artifacts_dir},
                                   {'type': mf.types.file, 'mode': mm.seed_file, 'rel': bn.seed_file},
                                   {'type': mf.types.file, 'mode': bn.launcher_mode | string, 'rel': bn.launcher_file},
                                   {'type': mf.types.file, 'mode': mm.manifest_file, 'rel': bn.manifest_file},
                                   {'type': mf.types.file, 'mode': mm.checksum_file, 'rel': bn.checksum_file}]) -%}
        {%- for a in rh_admit_controller.bootstrap.artifacts + rh_admit_lock.packages + rh_admit_lock.collections -%}
        {%- set ent.l = ent.l + [{'type': mf.types.file, 'mode': mm.artifact, 'rel': bn.artifacts_dir ~ sep ~ a.file}] -%}
        {%- endfor -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for e in ent.l -%}
        {%- set v = e | combine({'mode': e.mode | regex_replace('^' ~ (mf.mode_prefix | regex_escape), '')}) -%}
        {%- set ns.l = ns.l + [mf.fields | map('extract', v) | join(mf.separator)] -%}
        {%- endfor -%}{{ ns.l | sort }}
