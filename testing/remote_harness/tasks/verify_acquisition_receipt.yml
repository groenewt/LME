---
# The same schema and identity checks protect old receipt reuse and new publication.
# Store contents are independently verified by acquire.yml before any success.
- name: Admit exact receipt fields and complete current-act identity
  vars:
    _e: "{{ rh.controller.bootstrap.genesis.acquisition.execution }}"
  ansible.builtin.assert:
    that:
      - _rh_acq_receipt is mapping
      - _rh_acq_receipt | list | sort == _e.receipt_fields | sort
      - (_rh_acq_receipt | dict2items | selectattr('key', 'in', _e.identity_fields) | items2dict) == _rh_acq_identity
      - _rh_acq_receipt.revision is integer and _rh_acq_receipt.revision is not boolean
      - _rh_acq_receipt.builder_uid is integer and _rh_acq_receipt.builder_uid is not boolean
      - _rh_acq_receipt.store_empty_before is boolean and _rh_acq_receipt.cold_qualified is boolean
      - _rh_acq_receipt.observed_at_utc is string and _rh_acq_receipt.observed_at_utc | length > 0
      - _rh_acq_receipt.rows is sequence and _rh_acq_receipt.rows is not string and _rh_acq_receipt.rows is not mapping
      - _rh_acq_receipt.rows | length == _rh_acq_rows | length
      - _rh_acq_receipt.store_entries_before is sequence and _rh_acq_receipt.store_entries_before is not string and _rh_acq_receipt.store_entries_before is not mapping
      - _rh_acq_receipt.store_foreign_entries is sequence and _rh_acq_receipt.store_foreign_entries is not string and _rh_acq_receipt.store_foreign_entries is not mapping
      - _rh_acq_receipt.store_empty_before == (_rh_acq_receipt.store_entries_before | length == 0)
      - _rh_acq_receipt.store_foreign_entries == (_rh_acq_receipt.store_entries_before | reject('in', _rh_acq_rows | map(attribute='file')) | sort)
      - _rh_acq_receipt.cold_qualified == (_rh_acq_receipt.store_empty_before and (_rh_acq_receipt.rows | map(attribute='disposition') | unique | list == [rh.controller.bootstrap.genesis.acquisition.dispositions[0]]))
    fail_msg: "{{ rh.controller.bootstrap.genesis.acquisition.refusal }}"
    quiet: true

- name: Require every receipt row to retain exactly its declared object and all role-class references
  vars:
    _e: "{{ rh.controller.bootstrap.genesis.acquisition.execution }}"
    _f: "{{ _e.fields }}"
  ansible.builtin.assert:
    that:
      - item.0 is mapping
      - item.0 | list | sort == _e.row_fields | sort
      - (item.0 | dict2items | rejectattr('key', 'equalto', _f.disposition) | items2dict) == item.1
      - item.0.max_bytes is integer and item.0.max_bytes is not boolean
      - item.0.disposition in rh.controller.bootstrap.genesis.acquisition.dispositions
      - (item.0.disposition == rh.controller.bootstrap.genesis.acquisition.dispositions[1]) == (item.0.file in _rh_acq_receipt.store_entries_before)
    fail_msg: "{{ rh.controller.bootstrap.genesis.acquisition.refusal }}"
    quiet: true
  loop: "{{ _rh_acq_receipt.rows | zip(_rh_acq_rows) | list }}"
  loop_control:
    label: "{{ item.1.file }}"
