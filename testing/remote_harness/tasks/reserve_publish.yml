      its sealed digest is not that text's; nothing was published (staging {{ _rh_rsv_stage }} and its lease record are
      left; the next run reaps them under bundle.staging_retention).
    quiet: true
  loop: "{{ rh_rsv_prepublish['rows'] | dict2items }}"
  loop_control:
