    _rh_rsv_ppx: >-
      {%- set ns = namespace(t='') -%}{%- for g in item.value['covers'] -%}{%- if g == 'renders' -%}{%- for r in rh_rsv_renders -%}{%- set ns.t = ns.t ~ _rh_ra_rendered[r['name']]['sha256'] ~ _rh_rsv_ppg['separator'] ~ r['rel'] ~ _rh_rsv_ppt -%}{%- endfor -%}{%- elif g == 'copies' -%}{%- for c in rh_rsv_copies -%}{%- set ns.t = ns.t ~ _rh_rsv_copied[c['rel']] ~ _rh_rsv_ppg['separator'] ~ c['rel'] ~ _rh_rsv_ppt -%}{%- endfor -%}{%- endif -%}{%- endfor -%}{{- ns.t -}}
