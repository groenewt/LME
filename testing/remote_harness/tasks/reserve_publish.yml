# run's reap (M1-STAGING-RECOVERY); the destination is not created. fail_msg names only the rel and the declared form.
- name: "SEAL -- refuse a check file that is not exactly the text rebuilt from this run's admitted outputs (pre-publication)"
  vars:
    _rh_rsv_ppg: "{{ rh_rsv_prepublish[item.value['form']] }}"
    _rh_rsv_ppt: "{{ rh_rsv_prepublish['terminators'][item.value['terminator']] }}"
    _rh_rsv_ppc: "{{ rh_rsv_checks | selectattr('rel', 'equalto', item.key) | map(attribute='name') | list }}"
    _rh_rsv_ppn: >-
      {{ (rh_rsv_renders | length if 'renders' in item.value['covers'] else 0)
