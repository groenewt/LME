    _rh_rsv_b64: "{{ item.content | b64encode(encoding=_rh_rsv_enc) }}"
  ansible.builtin.assert:
    that:
      - _rh_rsv_b64 is match(_rh_rsv_law.part_regex)
      - ((_rh_rsv_b64 | length) // _rh_rsv_law.group * _rh_rsv_law.bytes - _rh_rsv_b64.count(_rh_rsv_law.pad)) <= rh_rsv_max_bytes.rows[item.rel]
    fail_msg: >-
      REFUSED {{ rh_rsv_staged }}: the check file {{ item.rel }} ({{ item.name }}) exceeds its admitted byte cap
      {{ rh_rsv_max_bytes.rows[item.rel] }}; nothing was written for it (staging {{ _rh_rsv_stage }} is left for inspection).
