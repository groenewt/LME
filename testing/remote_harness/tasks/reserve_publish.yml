# SEAL (package_bundle.yml :241-325 generalized; RH-BUNDLE-CHECKSUM-NEWLINES and PARSED-BYTE BINDING kept): each check
# row's content is the caller's (its newline bound in a {% set %} statement, never a '\n' constant inside {{ }}); it is
