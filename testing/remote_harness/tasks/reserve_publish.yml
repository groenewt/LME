# SUCCESSOR-13 N13_LOCKED_ADMISSION (transaction s55 :8066-8154; commands.lock / program :8038, :8045): the FIRST
# admission lands this run's record (landing first_admission = noreplace_landing); every later admission (aliased
# *rh_rsv_otx before each later write group: lifetime admit before_each_write) re-runs the same program with landing
# later_admissions (none): it re-scans the peers under the lock and reads its own landed record back. The landing word
# is the fact _rh_rsv_oa (set first here, switched after the first admitted decision).
