# SUCCESSOR-14 release_proof.after_remove observe_record_absent (s55 :8212-8218; codex 935; C1 ruling D): rc 0 of rm is
# NOT the proof. After commands.remove, a no-link stat of the EXACT record path must succeed and report no entry, and
# (custody: the registry dir admitted before the first write, destination_custody) the registry dir itself must still be
# observed a real directory, so an absence is not read through a vanished or replaced parent. A failed stat, a present
# record or a missing / linked registry dir is unknown: the record stays charged and the lease record is NOT released
# (release_order s55 :8334). Register _rh_rsv_orec: an r42-reserved name (r42 :7606) otherwise unused since successor-13.
- name: "RELEASE -- observe this run's record path and its registry dir after the removal (after_remove observe_record_absent; no link followed)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: "{{ [_rh_rsv_rg.record, _rh_rsv_rg.dir] }}"
  when: _rh_rsv_orm is not skipped
  failed_when: false
  register: _rh_rsv_orec

# SUCCESSOR-23 C1-SR922W absence_observation needs_listing release_proof_after_remove (s64 :8610-8617; comment
# :8600-8602): the stat above cannot alone decide the record absent (a failing stat reads as no entry). After it, the
# registry dir (its IMMEDIATE parent proof is that same stat, results[1]; its ancestors rest on the SUCCESSOR-24
# registry ancestry include, not on this stat) is listed by the declared leaf_listing
# (listing_from; LC_ALL = base_env.LC_ALL); "released" also requires an integer rc 0 and the record's basename not a
# record of the stdout split on LF only (sr922x_c1). Register _rh_rsv_or: r51-reserved (r51 :7788), unused before.
- name: "RELEASE -- list the registry dir after the removal (after_remove observe_record_absent; declared leaf_listing, read-only)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_rh_rsv_wb.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path, _rh_rsv_rg.dir] + _rh_rsv_wb.lifetime.dead_holder.relock.absence_proof.leaf_listing.args }}"
    strip_empty_ends: false
  when: _rh_rsv_orm is not skipped
  changed_when: false
  failed_when: false
  register: _rh_rsv_or

# SUCCESSOR-15 NOTE-SEAT-OP1M-RELEASED-TYPE: a boolean BY CONSTRUCTION -- ONE expression (no text around it) whose every
# operand is a comparison, a test (`is ...`, `in`) or a `not`, joined only by `and`, so its value is True or False
# (Python `and` returns an operand, and every operand is a bool); ansible-core 2.19 keeps a single-expression template's
# native type. The next task ASSERTS `is boolean` before the lease release reads it (the positive control's type proof).
# SUCCESSOR-24 (codex 949 B-OP1V-UNTERMINATED-X-FRAMING): the listing framing operand is now ((stdout == '') or
# (stdout[-1:] == LF)), the route op2c :1590 form, replacing the op1v ('x' ~ stdout) suffix marker that admitted an
# unterminated text ending in x. It is ONE parenthesized operand whose two sides are comparisons, so its value is a
# bool (Python `or` returns an operand, and both are bools); the by-construction reading above still holds for the
# whole expression, and the `is boolean` assert below still guards it.
- name: "RELEASE -- bind whether this run's obligation record was released (derived output; released ONLY on the observed absence)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.set_fact:
    _rh_rsv_oreleased: >-
      {{ (_rh_rsv_orm is not skipped) and (_rh_rsv_orm.rc == rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.holder_program.output.success_rc)
         and (_rh_rsv_orm.stdout == rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.holder_program.output.success)
         and ('results' in _rh_rsv_orec) and ((_rh_rsv_orec.results | length) == 2)
         and ((_rh_rsv_orec.results | select('failed') | list | length) == 0)
         and ('stat' in _rh_rsv_orec.results[0]) and ('stat' in _rh_rsv_orec.results[1])
         and (_rh_rsv_orec.results[0].stat.exists is sameas false)
         and (_rh_rsv_orec.results[1].stat.exists is sameas true) and (_rh_rsv_orec.results[1].stat.isdir is sameas true)
         and (_rh_rsv_orec.results[1].stat.islnk is sameas false)
         and (_rh_rsv_or is not skipped) and ('rc' in _rh_rsv_or) and (_rh_rsv_or.rc is integer) and (_rh_rsv_or.rc is not boolean)
         and (_rh_rsv_or.rc == 0) and ('stdout' in _rh_rsv_or) and (_rh_rsv_or.stdout is string)
         and ((_rh_rsv_or.stdout == '') or (_rh_rsv_or.stdout[-1:] == '\n')) and ('\n\n' not in _rh_rsv_or.stdout) and (_rh_rsv_or.stdout[:1] != '\n')
         and ((_rh_rsv_rg.record | basename) not in _rh_rsv_or.stdout.split('\n')[:-1]) }}

- name: "RELEASE -- refuse a released binding that is not a boolean (typed; the lease record stays for the reaper)"
  ansible.builtin.assert:
    that:
      - _rh_rsv_oreleased is boolean
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the released binding of this run's obligation record is not a boolean (it is never
      read as text); the lease record is not released and stays for the reaper (release_order).
    quiet: true

# codex 932 (2) / SR922i release_order: the lease record is released ONLY under the same proof and ONLY after the
# obligation record's removal was OBSERVED (after_remove; never on rc 0 alone); otherwise both stay for the reaper.
- name: "PUBLISH -- refuse a publish that could not take the destination lock (publish fence busy; own staging and record released)"
  ansible.builtin.assert:
    that:
      - _rh_rsv_publish is skipped or _rh_rsv_publish.rc != rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.bundle.staging_retention.lease.busy_refusal }}: the destination lock of
      {{ rh_rsv_dir }} stayed held for {{ rh.controller.bootstrap.bundle.staging_retention.lease.publish_wait_seconds }}s
      (a reaper or another publisher); nothing was published, this run's staging is released; its lease record and
      obligation record are released only if the release proof held (codex 932), else both stay for the reaper. Rerun.
    quiet: true

# SUCCESSOR-03 (codex686 N13-SKIPPED-PUBLISH-DIAGNOSTIC): Ansible 2.19 templates an assert's fail_msg BEFORE it evaluates
# `that`, so a fail_msg naming _rh_rsv_publish.rc must never be reached when the rename was skipped (existing
# destination: no rc). This assertion now runs ONLY on an actual publish attempt (when, evaluated before the args); an
# existing destination is still validated by the exact comparison below, which runs on every path.
- name: "PUBLISH -- refuse a publish whose authority was revoked (its staging was moved away under the destination lock)"
  when: _rh_rsv_publish is not skipped
  ansible.builtin.assert:
    that:
      - _rh_rsv_publish.rc == 0 or _rh_rsv_left.stat.exists
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.bundle.staging_retention.lease.authority.revoked_refusal }}: the publish rename
      of {{ _rh_rsv_stage }} failed (rc {{ _rh_rsv_publish.rc }}) and its source is gone: this run's
      publication authority was revoked (recovery, teardown or retirement renamed its staging away under the lock).
      Nothing was published by this run and the revoker's staging is not touched.
    quiet: true

# package_bundle.yml :444-466 generalized: EVERY sealed file (not only two) must be byte-identical; the present record's
# digest is reported (the package-specific class_key readback is the caller's final admission).
- name: "PUBLISH -- refuse a destination that holds anything but exactly this run's sealed files (preserved, never overwritten)"
  ansible.builtin.assert:
    that:
      - _rh_rsv_dsum.results | map(attribute='stat') | selectattr('exists') | selectattr('isreg') | rejectattr('islnk') | list | length == _rh_rsv_sealed | length
      - _rh_rsv_dsum.results | map(attribute='stat.checksum') | list == _rh_rsv_sealed.values() | map('last') | list
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: {{ rh_rsv_dir }} exists and is not exactly this run's publication: present
      {{ _rh_rsv_dsum.results | map(attribute='item.key') | zip(_rh_rsv_dsum.results | map(attribute='stat.exists')) | list }} (present flags)
      vs this run's {{ _rh_rsv_sealed | dict2items | map(attribute='key') | zip(_rh_rsv_sealed.values() | map('last')) | list }};
      it is preserved.
    quiet: true

- name: "PUBLISH -- bind the publication outcome (derived output; the caller's final admission follows)"
  ansible.builtin.set_fact:
    _rh_rsv_published: "{{ _rh_rsv_publish is not skipped and _rh_rsv_publish.rc == 0 and not _rh_rsv_left.stat.exists }}"
    _rh_rsv_outcome: "{{ 'published' if (_rh_rsv_publish is not skipped and _rh_rsv_publish.rc == 0 and not _rh_rsv_left.stat.exists) else 'unchanged' }}"
# FROZEN, no further writes
