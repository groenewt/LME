# SUCCESSOR-13 N13_RECOVERY_METADATA_RELEASE_ORDER (codex 932; seat-verified at s12 :1862-1865): the staging lease
# record is NO LONGER removed here, unconditionally, before the release observation. It is the reaper's recovery
# metadata (its lease namespace / cgroup identity, route op2a reap_staging :493-495; op2c 52cedb7e :621-623) for this run's still-charged
# obligation, so it is released LAST, by the task after the obligation record's removal, under the same release proof
# and only when that removal completed (see the RELEASE group below). Whenever the obligation record stays charged
# (failed / unknown cleanup, a refusal anywhere earlier, a busy registry lock), the lease record stays too.
# SUCCESSOR-14 (SR922i; codex 933 / 935): the recovery inputs are persisted in the first record (destination, paths,
# lease; see the _rh_rsv_reg bind and HOLE-B-OP1M-STAGING-PATH-ORDER); a dead holder's record is recovered by the
# route reaper (dead_holder removers [recovery]) running the template's recover mode under commands.recovery_lock --
# route's file, not this one. This holder releases holder-only, and "released" now also requires the record path
# observed absent (after_remove, below).

# SUCCESSOR-13 N13_RELEASE_PROOF (lifetime.release_proof s55 :8205-8218; supersedes the successor-10 act_end reading,
# CPL-OP1I-B-ACT-END retired, and the successor-12 temp-root ABSENCE test): the RELEASE group. The proof holds only when
#   observe_absent staging: this run's staging dir observed absent (a successful stat, exists false);
#   observe_absent registry_temp: no registry entry named <temp_name.lead><token>... remains (a successful listing);
#   observe_subset: each temp root (observe_subset.roots, located by _rh_rsv_locs) listed again by listing_tool +
#     listing_args succeeds, as did its baseline taken before the first write, and every entry of the new listing is
#     an entry of the baseline (an entry made during the call and still present -- own or foreign -- keeps the record).
# then remove_record_under_lock (commands.lock + commands.remove); failed_or_unknown retained: any failed or unknown
# observation, an unparsable listing or a busy lock keeps the record AND the lease charged. The listing entries are the
# records of the declared -printf format, each terminated by its trailing octal escape (read as the same escape in
# Python regex syntax: DEV-B-OP1L-LISTING-TERMINATOR); a listing that is not wholly such records is unknown.
# OPEN-B-OP1L-LISTING-SELF-ENTRY: if the listing command's own module run leaves an entry in a listed root (no
# pipelining), the subset fails and the record is retained (fail closed; not measured, UNRUN).
# SUCCESSOR-23 (C1-SR922W lifetime.absence_observation, s64 :8610-8617): observe_absent staging / registry_temp and
# after_remove each ALSO require the declared listing (relock.absence_proof.leaf_listing via listing_from) of the
# proven parent with status 0 and the name not listed; the stat and the find module stay as additional conditions and
# never decide alone (glob_decides never; listed_but_unstatable observe -> present). See the tasks below.
- name: "RELEASE -- observe this run's staging after release (observe_absent staging; no link followed)"
  ansible.builtin.stat:
    path: "{{ _rh_rsv_stage }}"
    follow: false
    get_checksum: false
  register: _rh_rsv_ogone

- name: "RELEASE -- observe this run's own registry temp entries (observe_absent registry_temp; temp_name lead + token)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.find:
    paths: ["{{ _rh_rsv_rg.dir }}"]
    hidden: true
    file_type: any
    recurse: false
    follow: false
    get_checksum: false
    use_regex: true
    patterns: ["{{ '^' ~ (_rh_rsv_rg.own_temp_lead | regex_escape) }}"]
  failed_when: false
  register: _rh_rsv_ofind

# SUCCESSOR-23 C1-SR922W lifetime.absence_observation (s64 :8610-8617, comment :8585-8609; needs_listing
# release_proof_observe_absent): the stat above and the find module above can each report an absence they did not
# observe (a stat failing with EIO / ENOMEM reads as no entry; a scandir error is not a listing), so neither DECIDES.
# The staging dir is absent only when ALSO not listed, and no registry_temp member is present only when ALSO none is
# listed, by the declared listing (listing_from -> relock.absence_proof.leaf_listing: os_tools[tool] on the proven
# parent, then args, under LC_ALL = base_env.LC_ALL; status 0; exact name records). The parent is proven first by a
# no-link stat (a real directory, not a link: a find start that is a link lists nothing). Registers _rh_rsv_otmp and
# _rh_rsv_ofs are r51-reserved names (r51 :7787-7789) unused before this successor (census in the op1v record).
# SUCCESSOR-24 (s66 parent_proof.release_proof_sites; codex 949): this stat proves the IMMEDIATE parent only (exists,
# isdir, not islnk, same context as the listing). It does NOT prove each ancestor. The ancestors rest on
# path_admission.ancestry in this same call before its first write: the staging parent through the :802-808 include
# (rh_rsv_dir, every existing component through it), the registry dir through the :1223-1232 include (before the
# reap at :1248, the call's first write), its bound value asserted equal at :2340 (SUCCESSOR-24; s68 parent_proof
# :8648-8661, these cites measured in this file). An absent registry dir at admission is created by the mkdir below
# its admitted parent and proven here by this stat. Without those the result would be
# unknown (ancestry_unadmitted). The observation form is the ansible one (leaf_absent.ansible_consumer: not_found only,
# a failed stat fails or is unknown) plus the listing; no shell release observation exists here
# (shell_observation unknown).
- name: "RELEASE -- prove the staging parent and the registry dir before listing them (absence_observation; no link followed)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: "{{ [_rh_rsv_stage | dirname, _rh_rsv_rg.dir] }}"
  failed_when: false
  register: _rh_rsv_otmp

- name: "RELEASE -- list the staging parent and the registry dir (absence_observation; declared leaf_listing, read-only)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_rh_rsv_wb.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path, item] + _rh_rsv_wb.lifetime.dead_holder.relock.absence_proof.leaf_listing.args }}"
    strip_empty_ends: false
  loop: "{{ [_rh_rsv_stage | dirname, _rh_rsv_rg.dir] }}"
  changed_when: false
  failed_when: false
  register: _rh_rsv_ofs

- name: "RELEASE -- list each temp root again (observe_subset; declared find + listing_args; read-only)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_rh_rsv_wb.lifetime.release_proof.listing_tool].path, (_rh_rsv_locs | from_json)[item]] + _rh_rsv_wb.lifetime.release_proof.listing_args }}"
  loop: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.release_proof.observe_subset.roots }}"
  changed_when: false
  failed_when: false
  register: _rh_rsv_oslp

- name: "RELEASE -- bind the release proof (derived; false on any failed, unknown or non-subset observation)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.set_fact:
    _rh_rsv_oprb: >-
      {%- set esc = _rh_rsv_wb.lifetime.release_proof.listing_args | last | regex_search('\\\\[0-7]+$') -%}
      {%- set rec = '(?s)(.*?)' ~ esc -%}
      {%- set pf = namespace(ok=(not _rh_rsv_ogone.stat.exists)
                             and (_rh_rsv_ofind is not failed) and ('files' in _rh_rsv_ofind) and ('skipped_paths' in _rh_rsv_ofind)
                             and ((_rh_rsv_ofind.files | length) == 0) and ((_rh_rsv_ofind.skipped_paths | length) == 0)
                             and ((_rh_rsv_olst.results | length) == (_rh_rsv_wb.lifetime.release_proof.observe_subset.roots | length))
                             and ((_rh_rsv_oslp.results | length) == (_rh_rsv_olst.results | length))) -%}
      {%- if pf.ok -%}
      {%- for b in _rh_rsv_olst.results -%}
      {%- set a = _rh_rsv_oslp.results[loop.index0] -%}
      {%- if not ((b.rc == 0) and (a.rc == 0) and (a.item == b.item)
                  and ((b.stdout | regex_replace(rec, '')) == '') and ((a.stdout | regex_replace(rec, '')) == '')
                  and ((a.stdout | regex_findall(rec)) | reject('in', b.stdout | regex_findall(rec)) | list | length) == 0) -%}
      {%- set pf.ok = false -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {#- SUCCESSOR-23 absence_observation (s64 :8610-8617): both parents proven real directories (no link), both listings
          carry an integer rc 0 (result_without_int_rc unknown, nonzero_listing unknown), each listing's stdout is split
          on LF ONLY (never stdout_lines; no re-encoding before the compare: C1 record sr922x_c1; strip_empty_ends
          false keeps every byte, so the text is empty or ends in LF, and the records are the parts before that last
          LF) and an empty record (a leading LF or LF LF) or an unterminated last record is unknown; the staging basename is
          not a record (exact_text), and no record is a registry_temp_member (temp_name.lead + this run's token, then
          the temp_name shape: each template_char of temp_name.trail is any one character, every other trail character
          itself, whole name). A failed, unknown or listed observation keeps pf.ok false: retained.
          SUCCESSOR-24 (codex 949 B-OP1V-UNTERMINATED-X-FRAMING, HIGH): the op1v framing test ('x' ~ stdout)[-1:] in
          ['x', LF] admitted a NON-EMPTY unterminated text ending in x ('stagingx' -> records []; 'present' LF
          'recordx' -> records [present]). Replaced, with no suffix marker, by the route op2c :1590 form: the text is
          genuinely empty (stdout == '') OR its last character is LF; only then is it split. Any other text is
          unknown: pf.ok false, the record and its recovery metadata (lease record) stay. -#}
      {%- set tn = _rh_rsv_wb.obligations.transaction.temp_name -%}
      {%- set tgw = _rh_rsv_wb.obligations.transaction.temp_glob -%}
      {%- set ol = _rh_rsv_rg.own_temp_lead -%}
      {%- if pf.ok and not (('results' in _rh_rsv_otmp) and ((_rh_rsv_otmp.results | length) == 2)
                            and ('results' in _rh_rsv_ofs) and ((_rh_rsv_ofs.results | length) == 2)) -%}
      {%- set pf.ok = false -%}
      {%- endif -%}
      {%- if pf.ok -%}
      {%- for p in _rh_rsv_otmp.results -%}
      {%- if not ((p is not failed) and ('stat' in p) and (p.stat.exists is sameas true) and (p.stat.isdir is sameas true)
                  and (p.stat.islnk is sameas false) and (p.item == (_rh_rsv_ofs.results[loop.index0].item))) -%}
      {%- set pf.ok = false -%}
      {%- endif -%}
      {%- endfor -%}
      {%- for a in _rh_rsv_ofs.results -%}
      {%- if not (('rc' in a) and (a.rc is integer) and (a.rc is not boolean) and (a.rc == 0) and ('stdout' in a) and (a.stdout is string)
                  and ((a.stdout == '') or (a.stdout[-1:] == '\n')) and ('\n\n' not in a.stdout) and (a.stdout[:1] != '\n')) -%}
      {%- set pf.ok = false -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- if pf.ok -%}
      {%- if (_rh_rsv_ofs.results[0].item != (_rh_rsv_stage | dirname)) or (_rh_rsv_ofs.results[1].item != _rh_rsv_rg.dir)
             or ((_rh_rsv_stage | basename) in _rh_rsv_ofs.results[0].stdout.split('\n')[:-1]) -%}
      {%- set pf.ok = false -%}
      {%- endif -%}
      {%- for r in _rh_rsv_ofs.results[1].stdout.split('\n')[:-1] -%}
      {%- if (r[:(ol | length)] == ol) and ((r | length) == ((ol | length) + (tn.trail | length))) -%}
      {%- set mm = namespace(m=true) -%}
      {%- for c in tn.trail | list -%}
      {%- if (c != tgw.template_char) and (r[(ol | length) + loop.index0] != c) -%}{%- set mm.m = false -%}{%- endif -%}
      {%- endfor -%}
      {%- if mm.m -%}{%- set pf.ok = false -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ {'ok': pf.ok} | to_json }}

# SUCCESSOR-13 HOLE-OP1J-LITERAL-TOOL-FLAGS CLOSED (s55 commands.lock / remove :8038-8042): <flock> exclusive_arg wait_arg
# <wait> conflict_exit_arg <busy_rc> <registry lock> <rm> end_of_options <record>; only when the release proof holds.
- name: "RELEASE -- bind the same-invocation cleanup devices and immutable release inputs"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.set_fact:
    _rh_n13_release_plan: >-
      {%- set rows = namespace(devices={}, valid=true) -%}
      {%- for row in (_rh_rsv_store | from_json).roles -%}
      {%- if row.key in _rh_rsv_wb.lifetime.release_proof.observe_subset.roots -%}
      {%- set path = _rh_rsv_rg.rpaths[row.key] -%}
      {%- if path in rows.devices and rows.devices[path] != row.dev -%}{%- set rows.valid = false -%}{%- endif -%}
      {%- set rows.devices = rows.devices | combine({path: row.dev}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set additions = [{'path': _rh_rsv_stage | dirname, 'dev': (_rh_n13_envelope | from_json).destination_device},
                           {'path': _rh_rsv_rg.dir, 'dev': _rh_rsv_orb.results[0].stat.dev | string}] -%}
      {%- for row in additions -%}
      {%- if row.path in rows.devices and rows.devices[row.path] != row.dev -%}{%- set rows.valid = false -%}{%- endif -%}
      {%- set rows.devices = rows.devices | combine({row.path: row.dev}) -%}
      {%- endfor -%}
      {%- set devices = namespace(rows=[]) -%}
      {%- for path, dev in rows.devices.items() -%}{%- set devices.rows = devices.rows + [{'path': path, 'dev': dev}] -%}{%- endfor -%}
      {{ {'registry_dir': _rh_rsv_rg.dir, 'lock_name': _rh_rsv_rg.lock_name, 'token': _rh_rsv_rg.token,
          'record_text': _rh_rsv_rg.text, 'record_sha256': _rh_rsv_rg.sha,
          'staging': _rh_rsv_stage, 'lease_path': (_rh_n13_plan | from_json).lease,
          'local_temp': _rh_rsv_rg.rpaths.local_temp, 'remote_temp': _rh_rsv_rg.rpaths.remote_temp,
          'cleanup_devices': devices.rows | to_json(**_rh_sa_regadm.ingress.canonical_json), 'valid': rows.valid} | to_json }}

- name: "RELEASE -- remove and durably synchronize this holder's lease only after cleanup barriers"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_ob: "{{ _rh_rsv_wb.obligations }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_n13_pg: "{{ _rh_rsv_wb.lifetime.release_durability.lease_program }}"
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  ansible.builtin.command:
    argv: >-
      {{ [rh.controller.bootstrap.os_tools[_rh_rsv_ob.commands.lock.tool].path, _rh_rsv_ob.commands.lock.exclusive_arg,
          _rh_rsv_ob.commands.lock.wait_arg, _rh_rsv_rg.wait, _rh_rsv_ob.commands.lock.conflict_exit_arg, _rh_rsv_rg.busy_rc,
          (_rh_n13_plan | from_json).lock,
          rh.controller.bootstrap.os_tools[_rh_rsv_ob.commands.program.shell_tool].path, _rh_rsv_ob.commands.program.inline_arg,
          lookup('ansible.builtin.template',
                 rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_rsv_ob.transaction.program_template_rel,
                 template_vars={'rh_ot_bs': rh.controller.bootstrap, 'rh_ot_wb': _rh_rsv_wb, 'rh_ot_program': _rh_n13_pg}),
          _rh_rsv_ob.commands.program.arg0]
         + (_rh_n13_pg.params | map('extract', _rh_n13_release_plan | from_json) | list) }}
  when:
    - (_rh_rsv_oprb | from_json).ok is sameas true
    - (_rh_n13_release_plan | from_json).valid is sameas true
  register: _rh_n13_lease_release
  changed_when: _rh_n13_lease_release.rc == _rh_n13_pg.output.success_rc
  failed_when: false

- name: "RELEASE -- durably remove this holder's obligation under the registry lock after the lease barrier"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_ob: "{{ _rh_rsv_wb.obligations }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_n13_pg: "{{ _rh_rsv_wb.lifetime.release_durability.holder_program }}"
    _rh_n13_lp: "{{ _rh_rsv_wb.lifetime.release_durability.lease_program }}"
  environment:
