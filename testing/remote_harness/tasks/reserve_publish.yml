- name: "RESERVE -- refuse a missing or malformed publication parameter (no default)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.assert:
    that:
      # SUCCESSOR-07 (write_bound.callers): every declared caller parameter is bound at this include site (absent refuses)
      - (_rh_rsv_wb.callers.params | reject('in', vars) | list | length) == 0
      - rh_rsv_dir is string and rh_rsv_dir is match(rh.controller.bootstrap.path_admission.regex)
      - rh_rsv_dir is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - rh_rsv_dir.split(rh.controller.bootstrap.path_admission.separator) | length > 2
      - rh_rsv_refusal is string and rh_rsv_staged is string
      # SUCCESSOR-06: the render scope is a declared engine scope word of the admitted core (no default)
      - rh_rsv_render_scope in rh.controller.entry_generation.render.engine.by_core[rh.controller.expect_core].scopes
      # SUCCESSOR-08: and a declared N10 scope named by at least one declared caller site (callers.sites[<site>].render_scope)
      - rh_rsv_render_scope in rh.controller.entry_generation.render.n10.scopes.values()
      - >-
        (_rh_rsv_wb.callers.sites.values() | map(attribute='render_scope') | map('extract', rh.controller.entry_generation.render.n10.scopes)
         | select('equalto', rh_rsv_render_scope) | list | length) > 0
      # SUCCESSOR-06: the owner uid of every reaped / staged entry is the caller's admitted uid (decimal string form)
      - rh_rsv_uid is string and rh_rsv_uid is match(rh.controller.entry_generation.uid_regex)
      - rh_rsv_members is sequence and rh_rsv_members is not string and rh_rsv_members | length > 0
      - rh_rsv_dirs is sequence and rh_rsv_dirs is not string and rh_rsv_dirs is not mapping
      - rh_rsv_copies is sequence and rh_rsv_copies is not string
      - rh_rsv_copies | map('list') | map('sort') | reject('equalto', ['mode', 'rel', 'sha256', 'src']) | list | length == 0
      - rh_rsv_renders is sequence and rh_rsv_renders is not string and rh_rsv_renders | length > 0
      - rh_rsv_renders | map('list') | map('sort') | reject('equalto', ['mode', 'name', 'rel', 'src', 'vars']) | list | length == 0
      - rh_rsv_checks is sequence and rh_rsv_checks is not string
      - rh_rsv_checks | map('list') | map('sort') | reject('equalto', ['content', 'line_regex', 'mode', 'name', 'rel', 'terminator']) | list | length == 0
      # SUCCESSOR-06 (N13-S06-RECORD-RENDER): the record is EITHER caller content {content, mode, name, rel} (unchanged
      # form) OR an N10 render row {mode, name, rel, src, vars} rendered LAST in the declared render scope; the key set
      # selects the form (both shapes are explicit; no default)
      - >-
        rh_rsv_record is mapping and ((rh_rsv_record.keys() | list | sort) == ['content', 'mode', 'name', 'rel']
                                      or (rh_rsv_record.keys() | list | sort) == ['mode', 'name', 'rel', 'src', 'vars'])
      # every staged rel is a declared member of the owned manifest (the reaper's scope and the publisher's agree)
      - (rh_rsv_dirs + (rh_rsv_copies | map(attribute='rel') | list) + (rh_rsv_renders | map(attribute='rel') | list)
         + (rh_rsv_checks | map(attribute='rel') | list) + [rh_rsv_record.rel]) | reject('in', rh_rsv_members) | list | length == 0
      - ((rh_rsv_renders | map(attribute='name') | list) + (rh_rsv_checks | map(attribute='name') | list) + [rh_rsv_record.name])
        | unique(case_sensitive=true) | list | length == (rh_rsv_renders | length) + (rh_rsv_checks | length) + 1
      # SUCCESSOR-02 (codex-tick682 OD-REL-BUDGET-ENFORCE): the admitted payload allocation -- one positive byte cap per
      # staged FILE rel (copies, renders, checks, record; dirs carry none) and a positive total -- and a reservation that
      # covers it (every cap + the largest cap once: the one atomic-move temp a sequential staged write may hold)
      # SUCCESSOR-03 (codex686 N13-AGGREGATE-BEFORE-WRITES, option (a)): the total must COVER the summed row caps, so the
      # per-row caps enforced before each write bound the cumulative staged bytes by the total before any write; the old
      # total <= sum admitted an allocation the staged payload could exceed before the post-SEAL check.
      - rh_rsv_max_bytes is mapping and (rh_rsv_max_bytes.keys() | list | sort) == ['rows', 'total']
      - rh_rsv_max_bytes.rows is mapping
      - >-
        (rh_rsv_max_bytes.rows.keys() | list | sort)
        == (((rh_rsv_copies | map(attribute='rel') | list) + (rh_rsv_renders | map(attribute='rel') | list)
             + (rh_rsv_checks | map(attribute='rel') | list) + [rh_rsv_record.rel]) | sort)
      - rh_rsv_max_bytes.rows.values() | reject('integer') | list | length == 0
      - rh_rsv_max_bytes.rows.values() | select('le', 0) | list | length == 0
      - rh_rsv_max_bytes.total is integer
      - rh_rsv_max_bytes.total >= (rh_rsv_max_bytes.rows.values() | sum)
      # SUCCESSOR-12 (HOLE-SEAT-COERCION-FILTER-SWEEP): rh_rsv_need is ADMITTED as a non-boolean integer before it is
      # compared (the assert stops at its first false condition), never coerced: a malformed need refuses here typed
      - rh_rsv_need is integer and rh_rsv_need is not boolean
      - rh_rsv_need >= rh_rsv_max_bytes.total + (rh_rsv_max_bytes.rows.values() | max)
      # SUCCESSOR-12 (HOLE-SEAT-COERCION-FILTER-SWEEP): the publish-fence / registry-lock conflict exit code
      # bundle.staging_retention.lease.busy_rc (s44 :445) is compared with command rcs below (the obligation-record
      # rename refusal and the publish fence) and passed to flock -E: it is ADMITTED here, before any write, as a
      # non-boolean integer that is not the success rc 0 (the rc N13 already compares with), and is then read without
      # coercion. No range is declared for this word (r31 :2543 pins the GUEST lease.busy_rc only; not borrowed):
      # HOLE-B-OP1K-STAGING-BUSY-RC-RANGE.
      - rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc is integer
      - rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc is not boolean
      - rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc > 0
      # SUCCESSOR-22 (C1 SR922u / SR922v; r50 :4347 int_range {min: 3, max: 125}, comment :4345-4346; closes
      # NOTE-B-OP1T-BUSY-RC-RANGE and HOLE-B-OP1K-STAGING-BUSY-RC-RANGE): the registry range is now declared for THIS word,
      # pinned here by value, so busy_rc is distinct from removed 0, retained 1 and malformed_invocation 2.
      - rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc >= 3
      - rh.controller.bootstrap.bundle.staging_retention.lease.busy_rc <= 125
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: a reserve / publish parameter is absent or not its
      declared shape (rh_rsv_need a non-boolean integer), or a staged rel is outside the owned manifest, or the payload
      allocation does not cap every staged file and the total within the reservation, or the declared lease busy_rc is
      not a non-boolean integer above the success rc (the parameters are not echoed).
    quiet: true

# SUCCESSOR-04 N13-PREPUBLISH: the pre-publication check parameter, admitted before any write. Exact cover: its rows are
# exactly the check rows (none filtered, none extra). The two shapes are the declared ones (no check rows -> rows only).
- name: "RESERVE -- refuse a missing or malformed pre-publication check parameter (no default)"
  ansible.builtin.assert:
    that:
      - rh_rsv_prepublish is mapping
      - "'rows' in rh_rsv_prepublish"
      - rh_rsv_prepublish['rows'] is mapping
      - >-
        (rh_rsv_prepublish.keys() | list | sort)
        == (['rows'] if rh_rsv_prepublish['rows'] | length == 0 else ['digest_lines', 'rows', 'terminators'])
      - (rh_rsv_prepublish['rows'].keys() | list | sort) == (rh_rsv_checks | map(attribute='rel') | list | sort)
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the pre-publication check parameter is absent or not
      its declared shape, or its rows are not exactly the check rows (the parameter is not echoed).
    quiet: true

# Each row: its form is a form N13 implements (digest_lines: one line per covered staged file, digest + separator + rel);
# its terminator is a declared word whose DATA string is non-empty and equal to the grammar's own terminator word; covers
# names N13's own staged groups (renders, copies), each once, in the order the lines are expected.
- name: "RESERVE -- refuse a pre-publication row that is not its declared shape (before any write)"
  ansible.builtin.assert:
    that:
      - item.value is mapping
      - (item.value.keys() | list | sort) == ['covers', 'form', 'terminator']
      - item.value['form'] in ['digest_lines']
      - rh_rsv_prepublish['digest_lines'] is mapping
      - (rh_rsv_prepublish['digest_lines'].keys() | list | sort) == ['digest', 'name', 'separator', 'terminator']
      - rh_rsv_prepublish['digest_lines'].values() | reject('string') | list | length == 0
      - rh_rsv_prepublish['terminators'] is mapping
      - item.value['terminator'] is string
      - item.value['terminator'] in rh_rsv_prepublish['terminators']
      - rh_rsv_prepublish['terminators'][item.value['terminator']] is string
      - rh_rsv_prepublish['terminators'][item.value['terminator']] | length > 0
      - item.value['terminator'] == rh_rsv_prepublish[item.value['form']]['terminator']
      # SUCCESSOR-05 N13-COVERS-MAPPING (codex709): a mapping is also a sequence, and the expected-text rebuild iterates
      # covers (its keys for a mapping) -- a mapping covers is refused here, by shape, before any write
      - item.value['covers'] is sequence and item.value['covers'] is not string and item.value['covers'] is not mapping and item.value['covers'] | length > 0
      - item.value['covers'] | unique(case_sensitive=true) | list | length == item.value['covers'] | length
      - item.value['covers'] | reject('in', ['renders', 'copies']) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the pre-publication row of {{ item.key }} is not
      {form, covers, terminator} with an implemented form, a declared non-empty terminator equal to its grammar's, and
      covered groups among renders / copies named once. Nothing was written.
    quiet: true
  loop: "{{ rh_rsv_prepublish['rows'] | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# SUCCESSOR-09 N13-S09-IDENTITY: the site keys whose declared render set equals this call's render src set. The record's
# src joins the set only in the render form (its key set selects the form). A renders_from path absent from the resolved
# declaration is an undefined render error (fail closed, before any write).
- name: "RESERVE -- classify the caller site by its render set (consistency only; before any write)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_srcs: "{{ (rh_rsv_renders | map(attribute='src') | list) + (rh_rsv_record | dict2items | selectattr('key', 'equalto', 'src') | map(attribute='value') | list) }}"
  ansible.builtin.set_fact:
    _rh_rsv_site_keys: >-
      {%- set ns = namespace(k=[]) -%}
      {%- for s in _rh_rsv_wb.callers.sites | dict2items -%}
      {%- set rs = namespace(r=[]) -%}
      {%- for p in s.value.renders_from -%}
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
      {%- set rs.r = rs.r + [w.v] -%}
      {%- endfor -%}
      {%- if (rs.r | unique(case_sensitive=true) | sort(case_sensitive=true)) == (_rh_rsv_srcs | unique(case_sensitive=true) | sort(case_sensitive=true)) -%}{%- set ns.k = ns.k + [s.key] -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.k | to_json }}

- name: "RESERVE -- refuse a call whose render set names no site or several sites (before any write)"
  ansible.builtin.assert:
    that:
      - (_rh_rsv_site_keys | from_json | length) == 1
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the render set of this call is the declared render set of
      {{ _rh_rsv_site_keys | from_json | length }} caller sites (exactly one is required: write_bound.identity
      site_from {{ rh.controller.entry_generation.render.n10.write_bound.identity.site_from }}). Nothing was written.
    quiet: true

- name: "RESERVE -- bind the classified site key (derived; passed to N10 as the identity site_param)"
  ansible.builtin.set_fact:
    _rh_rsv_site: "{{ _rh_rsv_site_keys | from_json | first }}"

# The typed uid path (s40 identity uid_path): the first word must be bound at the include (membership over vars, so an
# absent var refuses typed instead of failing a lookup); each later word must be a key present in the mapping reached.
# The regex is walked from rh by the dotted identity.uid_regex_at word.
- name: "RESERVE -- walk the site's typed uid path (membership at every step; no default)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.set_fact:
    _rh_rsv_uidw: >-
      {%- set u = _rh_rsv_wb.callers.sites[_rh_rsv_site].uid -%}
      {%- set w = namespace(v=u, ok=((u | first) in vars)) -%}
      {%- if w.ok -%}{%- set w.v = lookup('ansible.builtin.vars', u | first) -%}{%- endif -%}
      {%- for k in u[1:] -%}
      {%- if w.ok and (w.v is mapping) and (k in w.v) -%}{%- set w.v = w.v[k] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
      {%- endfor -%}
      {%- set rx = namespace(v=rh) -%}
      {%- for k in _rh_rsv_wb.identity.uid_regex_at.split('.') -%}{%- set rx.v = rx.v[k] -%}{%- endfor -%}
      {{ {'ok': w.ok, 'leaf': w.v, 'regex': rx.v} | to_json }}

- name: "RESERVE -- refuse a passed scope or uid that is not the classified site's (consistency cross-check; before any write)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_uw: "{{ _rh_rsv_uidw | from_json }}"
  ansible.builtin.assert:
    that:
      - rh_rsv_render_scope == rh.controller.entry_generation.render.n10.scopes[_rh_rsv_wb.callers.sites[_rh_rsv_site].render_scope]
      - _rh_rsv_uw.ok
      - >-
        (_rh_rsv_uw.leaf is integer and _rh_rsv_uw.leaf is not boolean and _rh_rsv_uw.leaf >= 0)
        or (_rh_rsv_uw.leaf is string and _rh_rsv_uw.leaf is match(_rh_rsv_uw.regex))
      - rh_rsv_uid == (_rh_rsv_uw.leaf | string)
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the passed render scope or uid is not the declared one of the classified caller site
      {{ _rh_rsv_site }} (the scope word, or the typed uid path {{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site].uid }}
      bound with every key present, its leaf a non-boolean integer >= 0 or a uid-regex string equal to the passed uid);
      the values are not echoed. Nothing was written.
    quiet: true

# SUCCESSOR-10 N13-S10-AUTHORITY (C1 sr922d; s44 write_bound.authority :7764-7771, per-site rows :7792-7826; codex 926
# CALLER_AUTHORITY_JOIN): the AUTHORITY to request the classified site is the independently admitted caller fact (the
# var named at authority.caller_fact_from, set by N2 from the resolve_phases.callers row; never a caller-supplied word)
# joined to the site's declared authority rows. The renders-derived site stays a consistency check (identity.role).
# Refuses unless: the caller fact is bound and a resolve_phases.callers key; it is in site.authority.callers; the include
# parameter rh_rsv_include_rel (bound LITERALLY at the caller's include line, never derived here) equals the LAST entry
# of site.authority.include_chain[caller]; every chain entry is the caller itself (chain_members.caller_itself), a
# members_rel member, or a member of the caller's own authored dispatch closure (dispatch_admission.authored[caller];
# a {value_of: <dotted path>} member is walked from rh); and the classified site is among the sites the caller may
# request with that include rel (site_must_equal identity). All before any write.
- name: "RESERVE -- join the classified site to the admitted caller fact and its declared include chain (authority; before any write)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_auth: >-
      {%- set au = _rh_rsv_wb.authority -%}
      {%- set bs = rh.controller.bootstrap -%}
      {%- set cw = namespace(v=bs) -%}{%- for k in au.caller_fact_from -%}{%- set cw.v = cw.v[k] -%}{%- endfor -%}
      {%- set cl = namespace(v=bs) -%}{%- for k in au.callers_from -%}{%- set cl.v = cl.v[k] -%}{%- endfor -%}
      {%- set mr = namespace(v=bs) -%}{%- for k in au.chain_members.members_from -%}{%- set mr.v = mr.v[k] -%}{%- endfor -%}
      {%- set dc = namespace(v=bs) -%}{%- for k in au.chain_members.caller_closure_from -%}{%- set dc.v = dc.v[k] -%}{%- endfor -%}
      {%- set bound = cw.v in vars -%}
      {%- set c = namespace(v=cw.v) -%}{%- if bound -%}{%- set c.v = lookup('ansible.builtin.vars', cw.v) -%}{%- endif -%}
      {%- set clos = namespace(m=[]) -%}
      {%- if bound and (c.v is string) and (c.v in dc.v) -%}
      {%- for m in dc.v[c.v] -%}
      {%- if m is mapping -%}
      {%- set w = namespace(v=rh) -%}{%- for k in m.value_of.split('.') -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{%- set clos.m = clos.m + [w.v] -%}
      {%- else -%}{%- set clos.m = clos.m + [m] -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- set ok = namespace(sites=[], bad=[]) -%}
      {%- if bound and (c.v is string) -%}
      {%- for s in _rh_rsv_wb.callers.sites | dict2items -%}
      {%- if ('authority' in s.value) and (c.v in s.value.authority.callers) and (c.v in s.value.authority.include_chain)
             and (s.value.authority.include_chain[c.v] | length) > 0 and (s.value.authority.include_chain[c.v] | last) == rh_rsv_include_rel -%}
      {%- set ok.sites = ok.sites + [s.key] -%}
      {%- for x in s.value.authority.include_chain[c.v] -%}
      {%- if not ((au.chain_members.caller_itself and x == c.v) or (x in mr.v) or (x in clos.m)) -%}{%- set ok.bad = ok.bad + [[s.key, x]] -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {{ {'bound': bound, 'caller': (c.v | string), 'admitted': bound and (c.v is string) and (c.v in cl.v), 'sites': ok.sites, 'bad': ok.bad} | to_json }}
    _rh_rsv_aw: "{{ _rh_rsv_auth | from_json }}"
  ansible.builtin.assert:
    that:
      - rh_rsv_include_rel is string
      - _rh_rsv_wb.authority.include_param in _rh_rsv_wb.callers.params
      - _rh_rsv_aw.bound
      - _rh_rsv_aw.admitted
      - _rh_rsv_site in _rh_rsv_aw.sites
      - _rh_rsv_aw.bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: caller {{ _rh_rsv_aw.caller }} (the admitted caller fact) has no declared authority to
      request site {{ _rh_rsv_site }} through the include carried by {{ rh_rsv_include_rel }} (authority callers /
      include_chain last entry / chain members; sites it may request with that include: {{ _rh_rsv_aw.sites }}; chain
      entries outside the admitted closure: {{ _rh_rsv_aw.bad }}). Nothing was written.
    quiet: true

# package_bundle.yml :38-93 (rh_pub_dir -> rh_rsv_dir; the refusal code is the caller's).
- name: "RESERVE -- stat every ancestor of the destination and the destination itself (no links followed)"
  ansible.builtin.stat:
    path: "{{ '/' ~ (rh_rsv_dir.split('/')[1:item] | join('/')) }}"
    follow: false
    get_checksum: false
  loop: "{{ range(1, (rh_rsv_dir.split('/') | length) + 1) | list }}"
  register: _rh_rsv_anc

- name: "RESERVE -- stat the declared publish, reap, lock, mkdir and free-space tools (identity admitted before use)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: true
    get_checksum: false
  loop:
    - "{{ rh.controller.bootstrap.os_tools.mv.path }}"
    - "{{ rh.controller.bootstrap.os_tools.df.path }}"
    - "{{ rh.controller.bootstrap.os_tools.rm.path }}"
    - "{{ rh.controller.bootstrap.os_tools.flock.path }}"
    - "{{ rh.controller.bootstrap.os_tools.mkdir.path }}"
    - "{{ rh.controller.bootstrap.os_tools.sh.path }}"
    # SUCCESSOR-09 N13-S09-COPIES: the device probe tool (write_bound.locations.device_probe_args are its arguments)
    - "{{ rh.controller.bootstrap.os_tools.stat.path }}"
  register: _rh_rsv_tools

- name: "RESERVE -- admit the destination's ancestry by the ONE resolved rule (path_admission.ancestry incl. owner_private_group)"
  ansible.builtin.include_tasks: admit_ancestry.yml
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_rsv_dir }}"
    rh_anc_refusal: "{{ rh_rsv_refusal }}"

- name: "RESERVE -- refuse unsafe destination custody before any write (SEED2-PACKAGE-RESERVATION)"
  vars:
    _anc: "{{ _rh_rsv_anc.results[:-1] | map(attribute='stat') | list }}"
    _dst: "{{ _rh_rsv_anc.results[-1].stat }}"
  ansible.builtin.assert:
    that:
      - _anc | selectattr('exists') | list | length == _anc | length
      - _anc | selectattr('islnk') | list | length == 0
      - _anc | rejectattr('isdir') | list | length == 0
      - _anc | map(attribute='uid') | reject('in', [0, rh_rsv_uid | int]) | list | length == 0
      - _anc | selectattr('wgrp') | map(attribute='path') | reject('in', rh_anc_admitted_private_groups) | list | length == 0
      - _anc | selectattr('woth') | list | length == 0
      - _anc[-1].uid == rh_rsv_uid | int
      - not _dst.exists or (_dst.isdir and not _dst.islnk and _dst.uid == rh_rsv_uid | int)
      - _rh_rsv_tools.results | map(attribute='stat') | selectattr('exists') | selectattr('isreg') | selectattr('executable') | list | length == _rh_rsv_tools.results | length
      - _rh_rsv_tools.results | map(attribute='stat') | rejectattr('uid', 'equalto', rh.controller.bootstrap.os_tool_identity.owner_uid) | list | length == 0
      - _rh_rsv_tools.results | map(attribute='stat') | selectattr('wgrp') | list | length == 0
      - _rh_rsv_tools.results | map(attribute='stat') | selectattr('woth') | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: every ancestor of {{ rh_rsv_dir }} must be a real directory owned by 0 or uid
      {{ rh_rsv_uid }} and not group/other-writable (sticky not excepted), the parent owned by uid {{ rh_rsv_uid }};
      an existing destination must be an owned real directory; the declared mv, df, rm, flock, mkdir, sh and stat
      ({{ _rh_rsv_tools.results | map(attribute='item') | list }}) must be root-owned, non-writable regular files.
      Nothing was written.
    quiet: true

# SUCCESSOR-13 N13_LOCKED_ADMISSION (transaction.admission tools os_tools_identity_before_use, template
# source_admission_member; s55 :8114): every os_tools entry the transaction, the registry commands and the release
# listing execute, by the declared role words (never a tool literal), is hashed (links followed) and must be its declared
# file_sha256 identity; the program template must be a source_admission.members_rel member (s55 :6846-6850).
# SUCCESSOR-14: + commands.recovery_lock.tool (s55 :8051), the lock the recover mode of the same template runs under.
# SUCCESSOR-15: + program_tools.decode (s55 :8074, base64: os_tools.base64 :3334), reached through program_tools.values().
# SUCCESSOR-18 (C1 SR922p, s58 relock.absence_proof :8480, process_visibility :8487): + the absence-proof type probe
# tool (os_tools.stat, s58 :3323) and the proc-visibility probe tool (os_tools.findmnt, s58 :3380) the recover mode runs.
# The SR922q namespace roles link (readlink, s58 :3379) and mount (findmnt) are program_tools values (s58 :8219), so
# the program_tools.values() term above already hashes them.
# These two identities are also the ones passed to the reap include as rh_reap_stat / rh_reap_findmnt (route op1x),
# and this task runs before that include, so both are hash-admitted before any use.
# SUCCESSOR-19 (C1 SR922s): + write_bound.locations.fs_type_probe_tool (s60 :7780, comment :7777-7779; the key the
# reap include's rh_reap_stat now comes from) and registry_applicability.observation_boundary.namespace_probe.tool (s60
# :8076, readlink; the key rh_reap_readlink comes from, CPL-OP1Y-B-REAP-READLINK-INPUT), each hash-admitted here
# before the reap include uses it.
# SUCCESSOR-22 (C1 SR922v): + relock.absence_proof.leaf_listing.tool (s63 :8714, find; os_tools.find :3438-3439 now
# required_by staging_reap), the tool the recover program's ot_ll runs.
# Before any write.
- name: "TRANSACTION -- hash every transaction, registry-command and listing tool (identity before use; read-only)"
  vars:
    _rh_rsv_ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: true
    get_checksum: true
    checksum_algorithm: sha256
  loop: >-
    {{ ([_rh_rsv_ob.transaction.program_tool] + (_rh_rsv_ob.transaction.program_tools.values() | list)
        + [_rh_rsv_ob.commands.lock.tool, _rh_rsv_ob.commands.recovery_lock.tool, _rh_rsv_ob.commands.rename.tool, _rh_rsv_ob.commands.remove.tool,
           _rh_rsv_ob.commands.mkdir.tool, _rh_rsv_ob.commands.lock_create.shell_tool, _rh_rsv_ob.commands.program.shell_tool,
           rh.controller.entry_generation.render.n10.write_bound.lifetime.release_proof.listing_tool,
           rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.each_ancestor.type_probe.tool,
           rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.process_visibility.proc_mount_unrestricted.tool,
           _rh_rsv_ob.registry_applicability.views.nested_mounts.listing.tool,
           rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_tool,
           _rh_rsv_ob.registry_applicability.observation_boundary.namespace_probe.tool,
           rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool])
        | unique(case_sensitive=true) | list }}
  register: _rh_rsv_odp

- name: "TRANSACTION -- refuse an unadmitted transaction tool or an unadmitted program template member (before any write)"
  vars:
    _rh_rsv_ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
    _rh_rsv_ow: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- for r in _rh_rsv_odp.results -%}
      {%- set t = rh.controller.bootstrap.os_tools[r.item] -%}
      {%- if not (r.stat.exists and r.stat.isreg and r.stat.executable and ('checksum' in r.stat) and (t.identity is mapping)
                  and t.identity.kind == 'file_sha256' and r.stat.checksum == t.identity.sha256) -%}
      {%- set ns.bad = ns.bad + [r.item] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.bad }}
  ansible.builtin.assert:
    that:
      - _rh_rsv_ow | length == 0
      - _rh_rsv_ob.transaction.program_template_rel in rh.controller.bootstrap.source_admission.members_rel
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the transaction / registry-command / listing tools {{ _rh_rsv_ow }} are not regular
      executables of their declared file_sha256 identity, or the program template
      {{ _rh_rsv_ob.transaction.program_template_rel }} is not a source_admission.members_rel member
      (CPL-SR922G2-PROGRAM-MEMBER). Nothing was written.
    quiet: true

# SUCCESSOR-09 N13-S09-COPIES (CPL-SR922C-B-COPIES; s40 write_bound copies_roots / copies_leaf / locations / aggregation):
# every copy role of the classified site gets its allocation from ITS declared paths: the root is copies_roots[
# site.copies_root] (the declaration word -> controller.bootstrap; the call word -> the include parameter it names, this
# call's admitted rh_rsv_max_bytes); each path is walked with a membership test at every step; the leaf is an integer
# (> 0, not boolean) -> itself, or a non-empty mapping of such integers -> its largest value; anything else is a typed
# refusal. The role allocation is the SUM over its paths (reuse none: nothing is shared across roles or writes; the
# copy-lifetime reuse rule is HELD by codex 926 and this sum is the conservative reading).
- name: "RESERVE -- derive each copy role's allocation from the classified site (declared root and leaf rule; no constant)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_sw: "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site] }}"
  ansible.builtin.set_fact:
    _rh_rsv_alloc: >-
      {%- set rw = _rh_rsv_wb.copies_roots[_rh_rsv_sw.copies_root] -%}
      {%- set r0 = namespace(v=rh.controller.bootstrap) -%}
      {%- if rw == _rh_rsv_wb.copies_roots.call -%}{%- set r0.v = lookup('ansible.builtin.vars', rw) -%}{%- endif -%}
      {%- set ns = namespace(a={}, bad=[]) -%}
      {%- for role in _rh_rsv_sw.copies -%}
      {%- set rs = namespace(s=[]) -%}
      {%- for p in _rh_rsv_sw.copies[role] -%}
      {%- set w = namespace(v=r0.v, ok=true) -%}
      {%- for k in p -%}{%- if w.ok and (w.v is mapping) and (k in w.v) -%}{%- set w.v = w.v[k] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if w.ok and (w.v is integer) and (w.v is not boolean) and (w.v > 0) -%}
      {%- set rs.s = rs.s + [w.v] -%}
      {%- elif w.ok and (w.v is mapping) and ((w.v | length) > 0) and ((w.v.values() | reject('integer') | list | length) == 0)
              and ((w.v.values() | select('boolean') | list | length) == 0) and ((w.v.values() | min) > 0) -%}
      {%- set rs.s = rs.s + [w.v.values() | max] -%}
      {%- else -%}
      {%- set ns.bad = ns.bad + [[role] + p] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set ns.a = ns.a | combine({role: rs.s | sum}) -%}
      {%- endfor -%}
      {{ {'alloc': ns.a, 'bad': ns.bad} | to_json }}

- name: "RESERVE -- refuse a copy allocation that is not its declared root / leaf shape, or a copy role with no location"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_sw: "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site] }}"
  ansible.builtin.assert:
    that:
      - _rh_rsv_sw.copies is mapping and (_rh_rsv_sw.copies | length) > 0
      - _rh_rsv_sw.copies_root in _rh_rsv_wb.copies_roots
      - _rh_rsv_wb.copies_roots[_rh_rsv_sw.copies_root] in _rh_rsv_wb.copies_roots.values()
      - (_rh_rsv_alloc | from_json).bad | length == 0
      - (_rh_rsv_alloc | from_json).alloc.values() | select('le', 0) | list | length == 0
      - _rh_rsv_sw.copies.keys() | reject('in', _rh_rsv_wb.locations) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: a copy allocation of caller site {{ _rh_rsv_site }} is not a declared positive integer
      or mapping-of-integers leaf under its declared root (paths {{ (_rh_rsv_alloc | from_json).bad }}), or a copy role
      has no declared location. Nothing was written.
    quiet: true

# locations: env -> the running process's environment variable (unset or empty refuses through the path grammar
# below); param -> the include parameter it names. Each location must be an admitted absolute path.
- name: "RESERVE -- bind each copy role's location (declared env or include parameter; no default)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_sw: "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site] }}"
  ansible.builtin.set_fact:
    _rh_rsv_locs: >-
      {%- set ns = namespace(m={}) -%}
      {%- for role in _rh_rsv_sw.copies -%}
      {%- set lc = _rh_rsv_wb.locations[role] -%}
      {%- if 'env' in lc -%}{%- set ns.m = ns.m | combine({role: lookup('ansible.builtin.env', lc.env)}) -%}
      {%- elif 'param' in lc -%}{%- set ns.m = ns.m | combine({role: lookup('ansible.builtin.vars', lc.param)}) -%}{%- endif -%}
      {%- endfor -%}
      {{ ns.m | to_json }}

- name: "RESERVE -- refuse an unset, relative or forbidden copy location (before any write)"
  vars:
    _rh_rsv_lm: "{{ _rh_rsv_locs | from_json }}"
  ansible.builtin.assert:
    that:
      - (_rh_rsv_lm.keys() | list | sort) == (rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site].copies.keys() | list | sort)
      - _rh_rsv_lm.values() | reject('string') | list | length == 0
      - _rh_rsv_lm.values() | reject('match', rh.controller.bootstrap.path_admission.regex) | list | length == 0
      - _rh_rsv_lm.values() | select('search', rh.controller.bootstrap.path_admission.forbidden_segment_regex) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: a copy location of caller site {{ _rh_rsv_site }} ({{ _rh_rsv_lm.keys() | list }}) is
      unset, empty, relative or not an admitted path (write_bound.locations). Nothing was written.
    quiet: true

# storage.measure_at existing_leaf_else_parent: the location itself when it exists, else its parent (which must exist).
- name: "RESERVE -- stat each copy location (no link followed)"
  ansible.builtin.stat:
    path: "{{ item.value }}"
    follow: false
    get_checksum: false
  loop: "{{ _rh_rsv_locs | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  register: _rh_rsv_lst

- name: "RESERVE -- stat the parent of each copy location (no link followed)"
  ansible.builtin.stat:
    path: "{{ item.value | dirname }}"
    follow: false
    get_checksum: false
  loop: "{{ _rh_rsv_locs | from_json | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value | dirname }}"
  register: _rh_rsv_lpst

- name: "RESERVE -- bind each copy role's measured directory (existing leaf, else parent)"
  ansible.builtin.set_fact:
    _rh_rsv_meas: >-
      {%- set ns = namespace(m={}, bad=[]) -%}
      {%- for r in _rh_rsv_lst.results -%}
      {%- set pr = _rh_rsv_lpst.results[loop.index0] -%}
      {%- if (r.item.key == pr.item.key) and r.stat.exists and r.stat.isdir and not r.stat.islnk -%}
      {%- set ns.m = ns.m | combine({r.item.key: r.item.value}) -%}
      {%- elif (r.item.key == pr.item.key) and (not r.stat.exists) and pr.stat.exists and pr.stat.isdir and not pr.stat.islnk -%}
      {%- set ns.m = ns.m | combine({r.item.key: r.item.value | dirname}) -%}
      {%- else -%}
      {%- set ns.bad = ns.bad + [r.item.key] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'at': ns.m, 'bad': ns.bad} | to_json }}

- name: "RESERVE -- refuse a copy location whose leaf is not a real directory and whose parent cannot stand in for it"
  ansible.builtin.assert:
    that:
      - (_rh_rsv_meas | from_json).bad | length == 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the copy location(s) {{ (_rh_rsv_meas | from_json).bad }} of caller site {{ _rh_rsv_site }}
      are neither an existing real directory nor absent under an existing real parent directory (storage.measure_at
      {{ rh.controller.entry_generation.render.n10.write_bound.locations.storage.measure_at }}). Nothing was written.
    quiet: true

# The device number of each measured directory: os_tools.stat + device_probe_args + the path (s44 locations). The
# filesystem TYPE: os_tools.stat + fs_type_probe_args (s44 :7703; the ONE type source of work_roots.admission). The free
# inodes and free bytes: os_tools.df + df_probe_args (s44 :7701), whose output is exactly ONE header row and ONE data row
# of df_columns (s44 :7702) in that order. SUCCESSOR-10 (CPL-SR922E-B-DF-WORDS; closes CPL-OP1I-B-DF-ARGS-WORD and
# DEV-B-OP1H-DF-ARGS): no df argument literal remains and df carries no type column. Read-only probes.
- name: "RESERVE -- probe the device of each measured copy directory (declared device_probe_args)"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.stat.path] + rh.controller.entry_generation.render.n10.write_bound.locations.device_probe_args + [item.value] }}"
  loop: "{{ (_rh_rsv_meas | from_json).at | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  changed_when: false
  register: _rh_rsv_dprobe

- name: "RESERVE -- probe the filesystem type of each measured copy directory (declared fs_type_probe_args)"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.stat.path] + rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args + [item.value] }}"
  loop: "{{ (_rh_rsv_meas | from_json).at | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  changed_when: false
  register: _rh_rsv_fsprobe

- name: "RESERVE -- probe the free inodes and free bytes of each measured copy directory (declared df_probe_args)"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.df.path] + rh.controller.entry_generation.render.n10.write_bound.locations.df_probe_args + [item.value] }}"
  loop: "{{ (_rh_rsv_meas | from_json).at | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value }}"
  changed_when: false
  register: _rh_rsv_dfree

# Each probe output is admitted as decimal text by an integer round trip ((x | int | string) == x), never by a borrowed
# regex. The df output must be exactly two lines (header, data), each with exactly len(df_columns) cells; the data cells
# are named by df_columns in order (iavail, avail: C1's column words). Any other shape refuses (s44 :7694-7696). The
# storage admission node is walked from controller.bootstrap by the dotted locations.storage.admission word; the
# protected reserve and the inode floor by aggregation.protected_reserve_from / inodes_from.
- name: "RESERVE -- bind each copy role's measured device, fs type and free space, and the walked storage words (derived)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.set_fact:
    _rh_rsv_store: >-
      {%- set aw = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in _rh_rsv_wb.locations.storage.admission.split('.') -%}{%- set aw.v = aw.v[k] -%}{%- endfor -%}
      {%- set pw = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in _rh_rsv_wb.aggregation.protected_reserve_from -%}{%- set pw.v = pw.v[k] -%}{%- endfor -%}
      {%- set iw = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in _rh_rsv_wb.aggregation.inodes_from -%}{%- set iw.v = iw.v[k] -%}{%- endfor -%}
      {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
      {%- set dc = _rh_rsv_wb.locations.df_columns -%}
      {#- SUCCESSOR-13 (codex 931 range; s55 locations.device_domain :7741-7743, r42 :6877): after the canonical-decimal
          round trip the device number must lie inside device_domain (min read from the word, typed first, no literal)
          BEFORE it keys any per-device sum (the aggregation below and the obligation record's device maps). -#}
      {%- set dd = _rh_rsv_wb.locations.device_domain.min -%}
      {%- set ns = namespace(r=[]) -%}
      {%- for d in _rh_rsv_dprobe.results -%}
      {%- set f = _rh_rsv_dfree.results[loop.index0] -%}
      {%- set t = _rh_rsv_fsprobe.results[loop.index0] -%}
      {%- set fl = f.stdout_lines | map('split') | list -%}
      {%- set pf = namespace(n=[]) -%}
      {%- for p in aw.v.refused_prefixes -%}{%- if (d.item.value ~ sep)[:(p | length)] == p -%}{%- set pf.n = pf.n + [p] -%}{%- endif -%}{%- endfor -%}
      {%- set ok = (d.rc == 0) and (f.rc == 0) and (t.rc == 0) and (d.item.key == f.item.key) and (d.item.key == t.item.key)
                   and ((d.stdout | int | string) == d.stdout)
                   and (dd is integer) and (dd is not boolean) and ((d.stdout | int) >= dd)
                   and ((t.stdout_lines | length) == 1)
                   and ((fl | length) == 2) and ((fl | first | length) == (dc | length)) and ((fl | last | length) == (dc | length))
                   and ((fl | last | map('int') | map('string') | list) == (fl | last))
                   and ((fl | last | map('int') | select('lt', 0) | list | length) == 0) -%}
      {%- if ok -%}
      {%- set cv = dict(dc | zip(fl | last | map('int'))) -%}
      {%- set ns.r = ns.r + [{'key': d.item.key, 'path': d.item.value, 'ok': ok, 'dev': d.stdout,
                              'fs_type': t.stdout, 'fs_refused': (t.stdout in aw.v.refused_fs_types), 'iavail': cv.iavail,
                              'avail': cv.avail, 'prefixed': pf.n}] -%}
      {%- else -%}
      {%- set ns.r = ns.r + [{'key': d.item.key, 'path': d.item.value, 'ok': ok}] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ {'roles': ns.r, 'reserve': pw.v, 'inodes': iw.v} | to_json }}

- name: "RESERVE -- refuse a copy directory whose probe failed, or on a refused fs type or under a refused prefix (storage admission)"
  vars:
    _rh_rsv_st: "{{ _rh_rsv_store | from_json }}"
  ansible.builtin.assert:
    that:
      - (_rh_rsv_st.roles | map(attribute='key') | list | sort) == ((_rh_rsv_meas | from_json).at.keys() | list | sort)
      - _rh_rsv_st.roles | rejectattr('ok') | list | length == 0
      - _rh_rsv_st.roles | selectattr('fs_refused') | list | length == 0
      - _rh_rsv_st.roles | map(attribute='prefixed') | select | list | length == 0
      - _rh_rsv_st.reserve is integer and _rh_rsv_st.reserve is not boolean and _rh_rsv_st.reserve >= 0
      - _rh_rsv_st.inodes is integer and _rh_rsv_st.inodes is not boolean and _rh_rsv_st.inodes >= 0
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: a copy directory of caller site {{ _rh_rsv_site }}
      ({{ _rh_rsv_st.roles | map(attribute='key') | list }}) could not be probed (device, fs type, free inodes, free
      bytes), lies on a refused fs type or under a refused prefix of
      {{ rh.controller.entry_generation.render.n10.write_bound.locations.storage.admission }}, or the protected reserve /
      inode floor is not a non-negative integer. Nothing was written.
    quiet: true

# aggregation by device: on one device the allocations of every role located there are SUMMED; each device admits
# free bytes >= its sum + the protected reserve (protected_reserve_from) and free inodes >= inodes_from. This is the
# PER-COPY check (copies_leaf: each copy within its listed allocation; s44 :7631-7632). SUCCESSOR-10: the cumulative
# charge, the charged obligations of other publishers (the registry term) and the record's own copies are admitted by
# the OBLIGATIONS group below (after the reap, before the first staging write, and again before each write).
- name: "RESERVE -- refuse a device whose free bytes or inodes cannot hold its summed copy allocations and the protected reserve"
  vars:
    _rh_rsv_st: "{{ _rh_rsv_store | from_json }}"
    _rh_rsv_on: "{{ _rh_rsv_st.roles | selectattr('dev', 'equalto', item) | list }}"
    _rh_rsv_sum: "{{ _rh_rsv_on | map(attribute='key') | map('extract', (_rh_rsv_alloc | from_json).alloc) | sum }}"
  ansible.builtin.assert:
    that:
      - (_rh_rsv_on | map(attribute='avail') | min) >= (_rh_rsv_sum | int) + _rh_rsv_st.reserve
      - (_rh_rsv_on | map(attribute='iavail') | min) >= _rh_rsv_st.inodes
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: device {{ item }} (copy roles {{ _rh_rsv_on | map(attribute='key') | list }}) has
      {{ _rh_rsv_on | map(attribute='avail') | min }} free bytes and {{ _rh_rsv_on | map(attribute='iavail') | min }} free
      inodes; it must hold the summed allocations {{ _rh_rsv_sum }} plus the protected reserve {{ _rh_rsv_st.reserve }} and
      {{ _rh_rsv_st.inodes }} free inodes (aggregation by {{ rh.controller.entry_generation.render.n10.write_bound.aggregation.by }}).
      Nothing was written.
    quiet: true
  loop: "{{ (_rh_rsv_store | from_json).roles | map(attribute='dev') | unique | list }}"

