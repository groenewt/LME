      - _rh_n13_inputs.empty_lock_logical_bytes.value is integer and _rh_n13_inputs.empty_lock_logical_bytes.value is not boolean
      - _rh_n13_inputs.empty_lock_logical_bytes.value >= _rh_n13_inputs.empty_lock_logical_bytes.range_min
      - _rh_n13_inputs.empty_staging_directory_logical_bytes.value is integer and _rh_n13_inputs.empty_staging_directory_logical_bytes.value is not boolean
      - _rh_n13_inputs.empty_staging_directory_logical_bytes.value >= _rh_n13_inputs.empty_staging_directory_logical_bytes.range_min
      - _rh_n13_inputs.empty_inner_directory_logical_bytes.value is integer and _rh_n13_inputs.empty_inner_directory_logical_bytes.value is not boolean
      - _rh_n13_inputs.empty_inner_directory_logical_bytes.value >= _rh_n13_inputs.empty_inner_directory_logical_bytes.range_min
      - _rh_n13_inputs.integer_decimal_max_digits.value is integer and _rh_n13_inputs.integer_decimal_max_digits.value is not boolean
      - _rh_n13_inputs.integer_decimal_max_digits.value >= _rh_n13_inputs.integer_decimal_max_digits.range_min
      - _rh_rsv_ob.destination_lease_serialization_budget.inode_width_placeholder is string
      - _rh_rsv_ob.destination_lease_serialization_budget.inode_width_placeholder | length == _rh_n13_inputs.integer_decimal_max_digits.value
      - _rh_rsv_ob.destination_lease_serialization_budget.inode_width_placeholder is match('(' ~ _rh_rsv_ob.transaction.grammar.decimal_ere ~ ')\\Z')
      - _rh_lease_rec is mapping
      - _rh_lease_rec.keys() | sort == rh.controller.bootstrap.bundle.staging_retention.lease.record_fields.keys() | sort
    fail_msg: "REFUSED {{ rh_rsv_refusal }}: prospective paths collide, directory grammar is invalid, or declared effect envelope inputs are missing/invalid. Existing objects were preserved and no covered effect occurred."
    quiet: true

- name: "RESERVE -- construct cumulative peer-visible destination envelopes from declared values"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_ob: "{{ _rh_rsv_wb.obligations }}"
    _rh_rsv_law: "{{ rh.controller.bootstrap.source_admission.encodings.base64 }}"
    _rh_rsv_enc: >-
      {%- set w = namespace(v=rh) -%}
      {%- for k in _rh_rsv_wb.encoding_at.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
  ansible.builtin.set_fact:
    _rh_n13_envelope: >-
      {%- set inputs = _rh_rsv_ob.n13_first_effect_envelope_inputs -%}
      {%- set budget = _rh_rsv_ob.destination_lease_serialization_budget -%}
      {%- set destination_device = _rh_n13_plan_stats.results[3].stat.dev | string -%}
      {%- set known = {'dev': destination_device, 'inode': budget.inode_width_placeholder,
                      'uid': _rh_lease_rec.uid, 'perms': budget.staging_perms,
                      'type': _rh_rsv_ob.destination_lease_file.staging_type_equals, 'path': _rh_rsv_stage} -%}
      {%- set witness = namespace(v={}) -%}
      {%- for field, source in budget.witness_fields.items() -%}{%- set witness.v = witness.v | combine({field: known[source]}) -%}{%- endfor -%}
      {%- set serialized = (_rh_lease_rec | combine(witness.v)) | to_json(**_rh_sa_regadm.ingress.canonical_json) -%}
      {%- set b64 = serialized | b64encode(encoding=_rh_rsv_enc) -%}
      {%- set encoded_bytes = (b64 | length) // _rh_rsv_law.group * _rh_rsv_law.bytes - b64.count(_rh_rsv_law.pad) -%}
      {%- set effects = _rh_rsv_ob.covered_effect_charges.destination_metadata_inodes -%}
      {%- set objects = dict(effects.objects | map(attribute='id') | zip(effects.objects)) -%}
      {%- set lock_count = objects.destination_lock.inodes * (not _rh_n13_plan_stats.results[2].stat.exists) -%}
      {%- set inode_count = lock_count + objects.staging_directory.inodes + (rh_rsv_dirs | length) * effects.unit + objects.own_lease_file.inodes -%}
      {%- set byte_count = lock_count * inputs.empty_lock_logical_bytes.value + inputs.empty_staging_directory_logical_bytes.value
                          + (rh_rsv_dirs | length) * inputs.empty_inner_directory_logical_bytes.value -%}
      {{ {'destination_metadata_inodes': {destination_device: inode_count},
          'destination_metadata_bytes': {destination_device: byte_count},
          'destination_lease_encoded_bytes': {destination_device: encoded_bytes * budget.lease_copies},
          'destination_device': destination_device, 'lease_bytes': encoded_bytes} | to_json }}

# SUCCESSOR-13 (C1 SR922g part 2 / SR922h, s47): the successor-10..12 notes below are SUPERSEDED where they conflict --
#   record text: {token, device_bytes, metadata_copies} + SUCCESSOR-14 {destination, paths, lease} (s55 :7928);
#   lifetime: removal_proof observed, release release_proof, dead_holder, release_order, composition (s55 :8197-8354); "under registry_lock: NOT SATISFIED" -> the scan / admission / landing are
#   ONE locked command (&rh_rsv_otx); "admit before_each_write: &rh_rsv_obligadm" -> *rh_rsv_otx (landing none);
#   "charged ... DEV-B-OP1I-ADJACENT-ENTRIES" and "N13_PEER_METADATA_CHARGE OPEN" -> peer_charge inside the program;
#   "unaccountable" grammar -> the program's awk classification (same seven when words); "release act_end" -> the
#   release proof at the end of this file (lease record released with the obligation record, codex 932). The text
#   below is kept as history, not as the current reading.
# SUCCESSOR-10 N13-S10-OBLIGATIONS (C1 sr922d / sr922e; s44 write_bound.obligations :7710-7735, lifetime :7736-7743,
# comments :7406-7448). ONE registry per publishing host: <work root>/<sub_roots[registry.sub]>/<registry.rel>, custody
# destination_custody (custody_from), a lock <registry>/<walk(lock_from)> under the lease lock_file rules
# (lock_custody_from), ONE record per holder <registry>/<rh_staging_lease> (token_from: the token must match
# token_regex) whose text is the canonical JSON (the ingress canonical_json word) of exactly record_fields:
# {token: this run's token, device_bytes: {<device number>: this call's CUMULATIVE charge on that device}}, mode
# record_mode, written temp + rename under the lock (noreplace).
#   lifetime (removal_proof none, charge cumulative, in_flight_proves_removal false, concurrent_roles sum):
#     SUCCESSOR-12 (codex tick930 N13_CUMULATIVE_COPY_CHARGE): a TEMP role's charge is the sum, over this call's actual
#     copy events (each write; plus each module-scope N10 fresh verification), of the admitted row bytes of that event
#     (see the derivation in the bind below); a staged role keeps the sum of its listed leaves
#     (CPL-OP1K-B-STAGED-PATH-SEMANTICS). Roles on one device SUM. The whole act's charge is admitted at EVERY
#     admission (DEV-B-OP1I-CUMULATIVE-BOUND: >= every earlier copy plus this write's copies). The successor-10 /
#     -11 "conservative" claim is WITHDRAWN: it summed each allocation leaf once (one copy per role), which under-charges
#     a call with several rows and N10's verification copies.
#   record_admission (point before_record_write, payload measured_canonical_json, unit encoded_bytes, inodes per_copy):
#     the record text is measured by the base64 length law; each device admits free bytes >= this call's cumulative
#     charge there + one measured record per record copy located there (registry_temp, registry_record -> the registry
#     dir; writer_local_temp -> locations.local_temp; writer_remote_temp -> locations.remote_temp:
#     CPL-OP1I-B-RECORD-COPY-LOCATIONS) + every charged obligation of another holder on it + the protected reserve; free
#     inodes >= one per record copy there + inodes_from (+ the tempfile placeholder, the registry dir and the lock while
#     absent, on the registry device: CPL-OP1I-B-REGISTRY-BOOTSTRAP-INODES). held_while record_exists: the same record
#     copies stay charged at every later admission.
#   charged (live, unknown, failed_retained; charge full): every present well-formed record of another token is charged
#     IN FULL (its device_bytes on each device plus its own lstat size on its device): liveness is not observed here
#     (DEV-B-OP1I-LIVENESS-NOT-PROBED: each of the three charged classes is charged full, so no observation can lower a
#     charge). A dot-named entry beside the records (an adjacent temp) is preserved and charged at its lstat size
#     (DEV-B-OP1I-ADJACENT-ENTRIES).
#     SUCCESSOR-12 (codex tick930 N13_PEER_METADATA_CHARGE): OPEN. A peer is charged its device_bytes plus its registry
#     file size, but its writer_local_temp / writer_remote_temp metadata copies (and the registry_temp while it exists)
#     are on devices its record does not name: record_fields {token, device_bytes} has no field for held metadata-copy
#     obligations per device, and folding them into device_bytes needs a no-double-count rule against the lstat term
#     and a fixed point (the record's bytes depend on its own text). C1 owns the record schema:
#     CPL-OP1K-B-RECORD-METADATA-FIELD (PENDING-C1-WORD; no field invented here).
#   unaccountable: a present record (any entry that is neither the lock nor dot-named) that is unreadable or not a
#     regular file, not one JSON object, not exactly the record_fields keys, whose device_bytes is not decimal device
#     -> non-negative integer, whose token is not token_regex or not its file name REFUSES every new write with the code
#     at refusal_from and the detail rel / lstat (type flags, size, mode, uid, inode, device) / sha256 or read error.
#     Nothing is removed, rewritten or charged as zero. The canonical form is checked by a pre-parse grammar built from
#     the sorted record_fields and the canonical separators, then by the round trip parse -> canonical JSON == text
#     (DEV-B-OP1I-CANONICAL-RECORD-GRAMMAR: only the canonical spelling is accountable; any other spelling refuses).
#   under registry_lock: NOT SATISFIED (codex tick930 N13_LOCKED_ADMISSION). An flock cannot be held across Ansible
#     tasks; here the scan and admission run WITHOUT the lock and only the record rename and the holder removal run under
#     flock -x. The successor-10 / -11 claim that write-then-reread linearizes two publishers is WITHDRAWN: publishers A
#     and B can both scan, both admit against a registry holding neither record, and both land, and the re-admission
#     after landing is a reread, not the declared before_record_write admission under the lock (s44 :7720-7728).
#     DEV-B-OP1I-LOCK-SPAN and REAP-BEFORE-REGISTRY (the reap runs before any registry admission) are UNSATISFIED
#     JOINS, not amendments. The declared form needs ONE locked command (flock on the registry lock wrapping one
#     declared program tool running one rendered admission-and-reserve program: scan, measure, admit, temp write and
#     noreplace rename inside the lock); its template, template rel and program tool are not declared:
#     CPL-OP1K-B-LOCKED-ADMISSION-PROGRAM (PENDING-C1-WORD). Until then the N13-S12 PENDING refusal before the reap
#     (the first write) keeps every publication refusing; the groups below are source progress only, unreachable.
#   admit before_each_write: the anchored group &rh_rsv_obligadm runs again (*rh_rsv_obligadm) before every write group
#     of this call: mkdtemp, mkdir, copies, N10 renders, check rows, the content record, the N10 record render, publish.
#   release act_end / failed_or_unknown_cleanup charged: the holder removes its record (flock + rm) only after the
#     staging release, and only when its staging is observed gone; any refusal before that leaves the record charged
#     (failed_retained) for the reaper (CPL-OP1I-B-REGISTRY-REAPER: reap_staging does not yet know the registry).
#     SUCCESSOR-12 (codex tick930 N13_RELEASE_PROOF; s44 :7617-7631): staging absence alone is no longer enough. The
#     release also requires an OBSERVED removal of every charged copy path of this call: the record temp (already
#     read back absent after the rename), and the measured directory of every TEMP copy role (the act's own temp roots
#     that hold its writer and verification temp copies). A temp root still present, or a failed / unknown
#     observation, keeps the record and its recovery metadata (failed_or_unknown_cleanup charged); act-end release by
#     the act's owner stays CPL-OP1I-B-ACT-END.
- name: "OBLIGATIONS -- bind the registry, its lock, this run's token, record text and cumulative per-device charge (derived; nothing written)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_sw: "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site] }}"
    _rh_rsv_law: "{{ rh.controller.bootstrap.source_admission.encodings.base64 }}"
    _rh_rsv_enc: >-
      {%- set w = namespace(v=rh) -%}
      {%- for k in _rh_rsv_wb.encoding_at.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
  ansible.builtin.set_fact:
    _rh_rsv_reg: >-
      {%- set ob = _rh_rsv_wb.obligations -%}
      {%- set bs = rh.controller.bootstrap -%}
      {%- set sep = bs.path_admission.separator -%}
      {%- set lk = namespace(v=bs) -%}{%- for k in ob.lock_from -%}{%- set lk.v = lk.v[k] -%}{%- endfor -%}
      {%- set lc = namespace(v=bs) -%}{%- for k in ob.lock_custody_from -%}{%- set lc.v = lc.v[k] -%}{%- endfor -%}
      {%- set tk = namespace(v=bs) -%}{%- for k in ob.token_from -%}{%- set tk.v = tk.v[k] -%}{%- endfor -%}
      {%- set cu = namespace(v=bs) -%}{%- for k in ob.registry.custody_from -%}{%- set cu.v = cu.v[k] -%}{%- endfor -%}
      {%- set uf = namespace(v=bs) -%}{%- for k in ob.unaccountable.refusal_from -%}{%- set uf.v = uf.v[k] -%}{%- endfor -%}
      {%- set lz = bs.bundle.staging_retention.lease -%}
      {%- set wr = [rh_repo_root, bs.work_roots.root_rel] | join(sep) -%}
      {%- set rd = [wr, bs.work_roots.sub_roots[ob.registry.sub], ob.registry.rel] | join(sep) -%}
      {#- SUCCESSOR-13 N13_CUMULATIVE_COPY_CHARGE (lifetime.composition s55 :8335-8354, consumed; the successor-12 event
          reading is retired): every copy this call makes is composed from the declared words --
            each N10 call (every render row; the record when it is the render form) at this call's scope key s runs
            n10_call_ops[<the op key of the passed rh_ra_op>], and each op o makes op_copies[s][o];
            each N13 copy-module write (copied member, check row, content record) makes copy_write;
          each role named is ONE copy (copies_per_role_per_event 1, CONFIRMED s55 :8353 and its comment) charged per_copy_charge
          write_row_bytes = the admitted row cap of ITS write, on the device of its role's location; the role that has
          its own composition entry (staged: {files: per_write_row_bytes, move_temp: once_per_call_largest_row}) adds its
          move temp ONCE at the largest row of the call (its files are the per-write rows already counted). Record
          copies are excluded (record_copies; charged by record_admission / peer_charge). device_charge
          cumulative_sum_by_location_device: the WHOLE call's composition per device is this record's device_bytes and
          is admitted at every admission (>= every copy so far plus the next write's: DEV-B-OP1I-CUMULATIVE-BOUND). -#}
      {%- set n10 = rh.controller.entry_generation.render.n10 -%}
      {%- set comp = _rh_rsv_wb.lifetime.composition -%}
      {%- set sk = n10.scopes | dict2items | selectattr('value', 'equalto', rh_rsv_render_scope) | map(attribute='key') | first -%}
      {%- set opk = n10.ops | dict2items | selectattr('value', 'equalto', n10.ops.render) | map(attribute='key') | first -%}
      {%- set nr = namespace(r=[]) -%}
      {%- for o in comp.n10_call_ops[opk] -%}{%- set nr.r = nr.r + comp.op_copies[sk][o] -%}{%- endfor -%}
      {%- set ev = namespace(e=[]) -%}
      {%- for r in rh_rsv_renders -%}{%- set ev.e = ev.e + [[r.rel, nr.r]] -%}{%- endfor -%}
      {%- if 'src' in rh_rsv_record -%}{%- set ev.e = ev.e + [[rh_rsv_record.rel, nr.r]] -%}{%- endif -%}
      {%- for c in rh_rsv_copies -%}{%- set ev.e = ev.e + [[c.rel, comp.copy_write]] -%}{%- endfor -%}
      {%- for k in rh_rsv_checks -%}{%- set ev.e = ev.e + [[k.rel, comp.copy_write]] -%}{%- endfor -%}
      {%- if 'content' in rh_rsv_record -%}{%- set ev.e = ev.e + [[rh_rsv_record.rel, comp.copy_write]] -%}{%- endif -%}
      {%- set cr = namespace(r=[]) -%}{%- for e in ev.e -%}{%- set cr.r = cr.r + e[1] -%}{%- endfor -%}
      {%- set cm = namespace(m={}) -%}
      {%- for role in _rh_rsv_sw.copies -%}
      {%- set rs = namespace(s=0) -%}
      {%- for e in ev.e -%}
      {%- set rs.s = rs.s + (e[1] | select('equalto', role) | list | length) * comp.copies_per_role_per_event * rh_rsv_max_bytes.rows[e[0]] -%}
      {%- endfor -%}
      {%- if (role in comp) and (comp[role] is mapping) -%}{%- set rs.s = rs.s + (rh_rsv_max_bytes.rows.values() | max) -%}{%- endif -%}
      {%- set cm.m = cm.m | combine({role: rs.s}) -%}
      {%- endfor -%}
      {#- per device: the sum of the cumulative charges of every role measured there (concurrent_roles sum) -#}
      {%- set st = (_rh_rsv_store | from_json).roles -%}
      {%- set dm = namespace(p=[]) -%}
      {%- for d in st | map(attribute='dev') | unique -%}
      {%- set dm.p = dm.p + [[d, st | selectattr('dev', 'equalto', d) | map(attribute='key') | map('extract', cm.m) | sum]] -%}
      {%- endfor -%}
      {#- SUCCESSOR-13 N13_PEER_METADATA_CHARGE (record_fields metadata_copies s55 :7928; peer_charge :7984-8009;
          copy_locations :7918): per measured device, the COUNT of this holder's own WRITER copies of its record text --
          the record_admission copies whose copy_locations value is a declared location (writer_local_temp ->
          local_temp, writer_remote_temp -> remote_temp), on the device measured for that location. The registry copies
          (copy_locations value registry, not a location) are not writer copies: peers charge them by observed lstat. -#}
      {%- set dv = dict(st | map(attribute='key') | zip(st | map(attribute='dev'))) -%}
      {%- set wl = ob.record_admission.copies | map('extract', ob.copy_locations) | select('in', _rh_rsv_wb.locations) | map('extract', dv) | list -%}
      {%- set mc = namespace(p=[]) -%}
      {%- for d in st | map(attribute='dev') | unique -%}{%- set mc.p = mc.p + [[d, wl | select('equalto', d) | list | length]] -%}{%- endfor -%}
      {%- set rf = ob.record_fields -%}
      {#- SUCCESSOR-14 N13_PERSISTED_RECOVERY_INPUTS (codex 933; SR922i record_fields s55 :7928, recovery_path_roles :7929,
          record_grammar :7861-7874; supersedes the successor-13 PENDING-C1-WORD SR922i marker here). The ONE first
          record text (landing first_admission) carries, before any charged write:
            destination  rh_rsv_dir (the destination this call fills; the reaper selects destination == rh_reap_dest);
            paths        recovery_path_roles -> the call's absolute path: local_temp / remote_temp = the bound
                         _rh_rsv_locs values (locations local_temp.env / remote_temp.env); SUCCESSOR-15 (SR922l
                         recovery_inputs_order s55 :7941; HOLE-B-OP1M-STAGING-PATH-ORDER CLOSED): the staging role (the
                         last word of record_grammar.staging_name.in) = _rh_rsv_stage, reserved BEFORE this bind (RESERVE
                         group after the reap admission), so every recovery_path_roles key is in the first record;
            lease        route's lease record value _rh_lease_rec, taken WHOLE (route op2a c24be88a declared output :33-34,
                         set_fact :479, _rh_lease_rec :485-495; SUCCESSOR-23: route op2c 52cedb7e output :33-34,
                         set_fact :607, _rh_lease_rec :613-623), exactly the ten lease.record_fields keys, string values, token == this record's
                         token (asserted below); absent -> undefined variable, the task fails before any record byte
                         (CPL-B-OP1M-ROUTE-LEASE-REC-OUTPUT CLOSED).
          The text is measured in memory (record_admission measured_canonical_json); no field states a size. -#}
      {%- set srole = ob.record_grammar.staging_name['in'] | regex_findall('[a-z0-9_]+') | last -%}
      {%- set lm = (_rh_rsv_locs | from_json) | combine({srole: _rh_rsv_stage}) -%}
      {%- set pm = namespace(m={}) -%}
      {%- for r in ob.recovery_path_roles -%}{%- if r in lm -%}{%- set pm.m = pm.m | combine({r: lm[r]}) -%}{%- endif -%}{%- endfor -%}
      {%- set rtext = {rf.token: rh_staging_lease, rf.device_bytes: dict(dm.p), rf.metadata_copies: dict(mc.p),
                       rf.destination: rh_rsv_dir, rf.paths: pm.m, rf.lease: _rh_lease_rec,
                       rf.destination_metadata_inodes: (_rh_n13_envelope | from_json).destination_metadata_inodes,
                       rf.destination_metadata_bytes: (_rh_n13_envelope | from_json).destination_metadata_bytes,
                       rf.destination_lease_encoded_bytes: (_rh_n13_envelope | from_json).destination_lease_encoded_bytes}
                      | to_json(**_rh_sa_regadm.ingress.canonical_json) -%}
      {%- set rb64 = rtext | b64encode(encoding=_rh_rsv_enc) -%}
      {#- SUCCESSOR-13 N13_LOCKED_ADMISSION: each transaction text's refusal code (text_codes -> codes): a *_from path is
          walked from controller.bootstrap; the one string code word (call_refusal) is the include parameter named by
          call_refusal_param (s55 :8121). The record grammar checks moved into the program (templates/obligation_transaction.j2);
          HOLE-OP1J-SORT-CASE is carried there unchanged. -#}
      {%- set tx = ob.transaction -%}
      {%- set cd = namespace(m={}) -%}
      {%- for tk in tx.text_codes -%}
      {%- set cv = tx.codes[tx.text_codes[tk]] -%}
      {%- if cv is string -%}{%- set cd.m = cd.m | combine({tk: lookup('ansible.builtin.vars', tx.call_refusal_param)}) -%}
      {%- else -%}{%- set w = namespace(v=bs) -%}{%- for k in cv -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{%- set cd.m = cd.m | combine({tk: w.v}) -%}{%- endif -%}
      {%- endfor -%}
      {{ {'dir': rd, 'parent': rd | dirname, 'work_root': wr, 'lock_name': lk.v, 'lock': rd ~ sep ~ lk.v,
          'lock_file': lc.v, 'custody': cu.v, 'token': rh_staging_lease, 'token_re': tk.v,
          'record': rd ~ sep ~ rh_staging_lease, 'text': rtext, 'sha': rtext | hash('sha256'), 'b64': rb64,
          'bytes': (rb64 | length) // _rh_rsv_law.group * _rh_rsv_law.bytes - rb64.count(_rh_rsv_law.pad),
          'cum': cm.m, 'devmap': dict(dm.p), 'mcmap': dict(mc.p), 'fk': rf, 'unacc_refusal': uf.v, 'enc': _rh_rsv_enc,
          'rpaths': pm.m, 'effect_maps': _rh_n13_envelope | from_json,
          'busy_refusal': lz.busy_refusal, 'wait': lz.publish_wait_seconds | string, 'busy_rc': lz.busy_rc | string,
          'noreplace': lz.authority.noreplace_arg, 'codes': cd.m, 'comp_roles': cr.r | unique(case_sensitive=true) | list,
          'own_temp_lead': tx.temp_name.lead ~ rh_staging_lease} | to_json }}

# The words this implementation reads are exactly C1's (a changed word refuses here instead of being half-honoured);
# the token is this run's lease token and matches token_regex; the record copy words map onto declared locations.
- name: "OBLIGATIONS -- refuse undeclared obligation / lifetime words, a malformed token or an unmeasurable record (before the registry is touched)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
    _rh_rsv_law: "{{ rh.controller.bootstrap.source_admission.encodings.base64 }}"
    _rh_rsv_sw: "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_rsv_site] }}"
  ansible.builtin.assert:
    that:
