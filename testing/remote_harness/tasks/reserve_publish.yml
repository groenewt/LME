#     closed; SR922j representation, HOLE-B-OP1M-RAW-MODE-TYPE closed: no rh_ot_st_type input exists any more). The
#     command runs with environment LC_ALL = controller.bootstrap.base_env.LC_ALL (SUCCESSOR-14 LOCALE).
#   params (HOLE-B-OP1L-PARAM-ENCODING, B's reading): structured params are the canonical JSON text (ingress
#     canonical_json); probe_dirs = the registry dir and the measured directory of every copy role.
#   decision (rc_zero_and_one_admitted_line): rc 0 AND exactly one stdout line equal to <admitted><separator><token>
#     admits; rc == busy_rc with no line refuses busy (busy_from, texts.busy); a non-zero rc with exactly one line in
#     the refusal grammar carrying a resolved code is that refusal verbatim; anything else refuses with texts.output
#     (text_codes.output). The record and its temp are never removed here (charged until the release proof).
