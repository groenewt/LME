  # SUCCESSOR-07 N13-S07-UNIT: encoded bytes in write_bound.encoding_at by the declared base64 length law
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_law: "{{ rh.controller.bootstrap.source_admission.encodings.base64 }}"
