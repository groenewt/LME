# SUCCESSOR-13 N13_LOCKED_ADMISSION: the successor-10..12 anchored scan / classify / charge group (&rh_rsv_obligadm,
# Ansible tasks OUTSIDE the lock) is REMOVED; scan, unaccountable, measure, charge and admit run inside the ONE locked
# program (&rh_rsv_otx below). What stays outside the lock is only the registry BOOTSTRAP, because the lock cannot be
# held before the lock file exists (DEV-B-OP1L-BOOTSTRAP-BEFORE-LOCK): registry_bootstrap (s55 :8020-8024) charges
# inode_count per bootstrap inode while absent (registry_dir, lock: when_absent), admitted here against the free
# inodes of the registry's measured directory (the dir, else its parent) plus inodes_from, before the mkdir / lock
# create; a racing peer can only make them present (mkdir of a present dir fails and refuses; the lock is append-open).
- name: "OBLIGATIONS -- stat the registry dir, its parent and the work root (no link followed)"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: ["{{ _rh_rsv_rg.dir }}", "{{ _rh_rsv_rg.parent }}", "{{ _rh_rsv_rg.work_root }}", "{{ _rh_rsv_rg.lock }}"]
  register: _rh_rsv_ods

- name: "OBLIGATIONS -- refuse a registry dir outside destination_custody, or a registry with no measurable directory"
  vars:
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_od: "{{ _rh_rsv_ods.results[0].stat }}"
    _rh_rsv_op: "{{ _rh_rsv_ods.results[1].stat }}"
    _rh_rsv_ow: "{{ _rh_rsv_ods.results[2].stat }}"
  ansible.builtin.assert:
    that:
      - _rh_rsv_ow.exists and _rh_rsv_ow.isdir and not _rh_rsv_ow.islnk
      - >-
        (_rh_rsv_od.exists and _rh_rsv_od.isdir and not _rh_rsv_od.islnk and _rh_rsv_od.uid == rh_rsv_uid | int
         and not _rh_rsv_od.wgrp and not _rh_rsv_od.woth and _rh_rsv_od.dev == _rh_rsv_ow.dev)
        or ((not _rh_rsv_od.exists) and _rh_rsv_op.exists and _rh_rsv_op.isdir and not _rh_rsv_op.islnk
            and _rh_rsv_op.dev == _rh_rsv_ow.dev)
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the obligation registry {{ _rh_rsv_rg.dir }} is not a real directory owned by uid
      {{ rh_rsv_uid }}, not group/other-writable, on the work root's device (destination_custody), nor absent under
      a real parent on that device. It is preserved. Nothing was written.
    quiet: true

- name: "OBLIGATIONS -- probe the filesystem type and the free inodes / bytes of the registry's measured directory (declared probe args)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_od: "{{ _rh_rsv_rg.dir if _rh_rsv_ods.results[0].stat.exists else _rh_rsv_rg.parent }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[item[0]].path] + item[1] + [_rh_rsv_od] }}"
  loop:
    - ["stat", "{{ rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args }}"]
    - ["df", "{{ rh.controller.entry_generation.render.n10.write_bound.locations.df_probe_args }}"]
  loop_control:
    label: "{{ item[0] }}"
  changed_when: false
  register: _rh_rsv_odf

# The registry's measured directory: on a refused fs type or under a refused prefix it refuses (storage admission); the
# df rows are exactly one header and one data row of df_columns, each cell a canonical decimal >= 0; the free inodes
# must hold inode_count per absent bootstrap inode plus inodes_from (no byte word is declared for a bootstrap inode).
- name: "OBLIGATIONS -- refuse a registry bootstrap the registry's device cannot hold (registry_bootstrap; before the mkdir / lock create)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
    _rh_rsv_rg: "{{ _rh_rsv_reg | from_json }}"
    _rh_rsv_st: "{{ _rh_rsv_store | from_json }}"
    _rh_rsv_pr: >-
      {%- set aw = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in _rh_rsv_wb.locations.storage.admission.split('.') -%}{%- set aw.v = aw.v[k] -%}{%- endfor -%}
      {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
      {%- set od = _rh_rsv_rg.dir if _rh_rsv_ods.results[0].stat.exists else _rh_rsv_rg.parent -%}
      {%- set t = _rh_rsv_odf.results[0] -%}
      {%- set f = _rh_rsv_odf.results[1] -%}
      {%- set dc = _rh_rsv_wb.locations.df_columns -%}
      {%- set fl = f.stdout_lines | map('split') | list -%}
      {%- set ok = (t.rc == 0) and (f.rc == 0) and ((t.stdout_lines | length) == 1)
                   and ((fl | length) == 2) and ((fl | first | length) == (dc | length)) and ((fl | last | length) == (dc | length))
                   and ((fl | last | map('int') | map('string') | list) == (fl | last))
                   and ((fl | last | map('int') | select('lt', 0) | list | length) == 0) -%}
      {%- set pf = namespace(n=[]) -%}
      {%- for p in aw.v.refused_prefixes -%}{%- if (od ~ sep)[:(p | length)] == p -%}{%- set pf.n = pf.n + [p] -%}{%- endif -%}{%- endfor -%}
      {%- set rb = _rh_rsv_wb.obligations.registry_bootstrap -%}
      {%- set ab = {'registry_dir': not _rh_rsv_ods.results[0].stat.exists, 'lock': not _rh_rsv_ods.results[3].stat.exists} -%}
      {{ {'ok': ok, 'fs_refused': ok and (t.stdout in aw.v.refused_fs_types), 'prefixed': pf.n,
          'iavail': (dict(dc | zip(fl | last | map('int'))).iavail if ok else none),
          'absent': rb.bootstrap_inodes.keys() | map('extract', ab) | select | list | length,
          'inode_count': rb.inode_count} | to_json }}
    _rh_rsv_oa: "{{ _rh_rsv_pr | from_json }}"
  ansible.builtin.assert:
    that:
      - _rh_rsv_oa.ok
      - not _rh_rsv_oa.fs_refused
      - _rh_rsv_oa.prefixed | length == 0
      - >-
        _rh_rsv_oa.iavail >= (_rh_rsv_oa.inode_count * _rh_rsv_oa.absent) + _rh_rsv_st.inodes
    fail_msg: >-
      REFUSED {{ rh_rsv_refusal }}: the obligation registry's measured directory could not be probed (fs type, df rows of
      {{ _rh_rsv_wb.locations.df_columns }}), lies on a refused fs type or under a refused prefix, or its free inodes
      cannot hold the absent bootstrap inodes (registry_bootstrap inode_count each) plus {{ _rh_rsv_st.inodes }}.
      Nothing was written.
    quiet: true

# SUCCESSOR-24 (C1-SR922Y/Z s66 lifetime.absence_observation.parent_proof.release_proof_sites, :8644-8657, comment
# :8630-8643; codex 949 OPEN-B-OP1V-RELEASE-PARENT-CHAIN): a release_proof site's one no-follow parent stat is a parent
# proof ONLY when path_admission.ancestry admitted that parent's ancestry at the use boundary of the SAME call, before its
# first write (ancestors_by; ancestry_unadmitted unknown). Staging parent (rh_rsv_dir | dirname): admitted by the
# include at :775-780 (rh_anc_path rh_rsv_dir; every existing component from / through rh_rsv_dir, so through its
# parent), before the first write of this call (reap_staging :1203, the staging tempfile :1296). Registry dir: no
# ancestry admission ran in this call before successor-24 (the :2130 stat and :2140 assert cover the dir, its parent
# and the work root only).
# SUCCESSOR-24 CORRECTION (same round, before hand-back; supersedes the cites above, which are op1v successor-23
# lines): measured in THIS file, the staging include is at :802-808 (rh_anc_path rh_rsv_dir), the call's first write is
# the reap at :1248 and the staging tempfile at :1341. The registry dir's admission is the include at :1223-1232,
# BEFORE the reap (the first write), not here: here, at the registry dir's use boundary, the bound registry dir must
# EQUAL the path that include admitted (same words, same join); any difference refuses before any registry byte.
- name: "OBLIGATIONS -- refuse a registry dir other than the one whose ancestry was admitted before the first write (path_admission.ancestry)"
  vars:
    _rh_rsv_wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
  ansible.builtin.assert:
    that:
      - >-
        (_rh_rsv_reg | from_json).dir == ([rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
        rh.controller.bootstrap.work_roots.sub_roots[_rh_rsv_wb.obligations.registry.sub], _rh_rsv_wb.obligations.registry.rel]
