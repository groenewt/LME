# SUCCESSOR-04 N13-PREPUBLISH (codex696 OPEN-PKG-03 (a); GEN-REQ-N13-S04-01; base package_bundle 8bf12517 :263-288 /
# :303-325 restored INSIDE the one publisher): per declared row, the EXPECTED text is rebuilt from N13's OWN admitted
# outputs -- for each covered group in order: renders -> _rh_ra_rendered[<name>].sha256 + separator + rel per render row;
# copies -> _rh_rsv_copied[<rel>] + separator + rel per copy row -- each line ended by the declared terminator DATA string
# (rh_rsv_prepublish.terminators[<word>], a YAML double-quoted scalar: the byte is produced by the YAML loader, never by a
# template constant, so a caller content template whose newline rendered as backslash + n cannot pass). Then: the line
# count is the covered group sizes; every line FULL-matches the declared grammar (regex test, match_type fullmatch: no
# trailing-newline laxity); the staged file, read ONCE unstripped, IS that text; and the digest SEAL recorded for that
