---
# testing/remote_harness/tasks/pack_class.yml -- target_bootstrap.yml's controller play, ONCE PER ARTIFACT CLASS that
# has at least one target (r3g). Input (loop var, registry-reserved): _rh_class, an entry of rh_classes
# (tasks/scope_classes.yml). Admits that class's published bundle exactly (tasks/admit_bundle.yml: a missing bundle,
# another class's bundle or a stale one refuses -- never the controller bundle instead), packs it with the managed
# generation's archive module into this run's TMPDIR under a class-keyed name, and adds the class's transfer identity
# to rh_transfer.classes[<key>] (derived output; pre-supply refused at entry, so the accumulation starts empty).

- name: Admit this class's published bundle (exact members, modes, digests, fresh-render seed, recorded class key)
  ansible.builtin.include_tasks: admit_bundle.yml
  vars:
    rh_admit_dir: "{{ _rh_class.dir }}"
    rh_admit_key: "{{ _rh_class.key }}"
    rh_admit_policy: "{{ _rh_class.policy }}"
    rh_admit_lock: "{{ lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ _rh_class.policy.controller.lock_file_rel) | from_yaml }}"

- name: Pack the admitted class bundle with the managed generation's archive module (declared adapter, no rsync)
  community.general.archive:
    path: "{{ rh_bundle.dir }}"
    dest: "{{ lookup('ansible.builtin.env', 'TMPDIR') }}/{{ rh.controller.bootstrap.bundle.seed_file | regex_replace('\\.sh$', '') }}-bundle-{{ _rh_class.key }}.tar.gz"
    format: "{{ rh.transfer.adapters.managed_archive.controller.format }}"
    mode: '0400'

- name: Digest the class transfer archive
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.env', 'TMPDIR') }}/{{ rh.controller.bootstrap.bundle.seed_file | regex_replace('\\.sh$', '') }}-bundle-{{ _rh_class.key }}.tar.gz"
    get_checksum: true
    checksum_algorithm: sha256
  register: _rh_tb_archive

- name: Add this class's transfer identity (derived output, keyed by the class key)
  ansible.builtin.set_fact:
    rh_transfer: >-
      {{ (rh_transfer | default({'classes': {}})) | combine({'classes': {_rh_class.key: {
           'archive': _rh_tb_archive.stat.path, 'archive_sha256': _rh_tb_archive.stat.checksum,
           'bundle': rh_bundle, 'targets': _rh_class.targets}}}, recursive=true) }}
