- name: Bind the actual invoking occurrence contract and protected seed carrier
  ansible.builtin.set_fact:
    rh_fw_occurrence_contract: '{{ rh_fw_transport.invoking_occurrence }}'
    rh_fw_occurrence_bootstrap: '{{ rh.controller.bootstrap }}'
    rh_fw_occurrence_source_root: '{{ fw_source_root }}'
    rh_fw_occurrence_carrier: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_transport.invoking_occurrence.source_carrier) }}'

- name: Require the occurrence publication to use distinct declared stage members
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.preparation }}'
    that:
      - rh_fw_occurrence_contract.reference_fields | sort == fw_contract.occurrence.fields | sort
      - rh_fw_occurrence_contract.artifacts.mode == rh_fw.output.finalized_mode
      - rh_fw_occurrence_contract.artifacts.basename not in [rh_fw_transport.seed.runtime.request_basename, rh_fw_stage.output.precontext_basename, rh_fw_stage.output.prepared_basename, rh_fw_stage.output.locator_basename, rh_fw_stage.output.mode_basename, rh_fw_transport.paths.protected_context_basename]

- name: Bind the admitted allocation and source-protected actual supervisor identity
  vars:
    rh_fw_occurrence_o: '{{ rh_fw_occurrence_contract }}'
  ansible.builtin.set_fact:
    rh_fw_occurrence_active: '{{ rh_fw_occurrence_carrier[rh_fw_occurrence_o.carrier.f.active] }}'
    rh_fw_occurrence_expected: '{{ {rh_fw_occurrence_o.expected.binding: fw_allocation, rh_fw_occurrence_o.expected.program: rh_fw_occurrence_carrier[rh_fw_occurrence_o.carrier.f.program], rh_fw_occurrence_o.expected.generation: rh_fw_occurrence_carrier[rh_fw_occurrence_o.carrier.f.generation], rh_fw_occurrence_o.expected.uid: rh_fw_occurrence_carrier[rh_fw_occurrence_o.carrier.f.uid], rh_fw_occurrence_o.expected.directory: rh_fw_stage_directory} }}'

- name: Prepare a fresh snapshot only from the independently admitted allocation and actual lifecycle
  when:
    - fw_intent_json is not none
    - fw_allocation_mode == fw_contract.allocation.modes.fresh
  block:
  - name: Independently observe this managed child beneath the live supervisor
    ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_occurrence_contract.task_prepare] | path_join }}'

  - name: Retain the occurrence owner's exact in-memory artifact
    ansible.builtin.set_fact:
      rh_fw_occurrence_artifact: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_occurrence_contract.content_fact) }}'

  - name: Revalidate held stage custody before the occurrence publication effect
    when: rh_fw_current_phase == rh_fw_stage.phases.prepare
    ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
    vars:
      rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.holder_var) }}'
      rh_fw_locator: '{{ rh_fw_stage_directory }}'

  - name: Publish the exact occurrence bytes under the held charged stage
    when: rh_fw_current_phase == rh_fw_stage.phases.prepare
    ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.paths.publication_task_from_repository] | path_join }}'
    vars:
      rh_fw_mode: '{{ fw_contract.allocation.modes.fresh }}'
      rh_fw_publish_path: '{{ [rh_fw_io_root, rh_fw_occurrence_artifact[rh_fw_occurrence_contract.artifacts.f.basename]] | path_join }}'
      rh_fw_publish_bytes: '{{ rh_fw_occurrence_artifact[rh_fw_occurrence_contract.artifacts.f.content] }}'

  - name: Construct a complete request from the admitted allocation and actual immutable artifact
    vars:
      rh_fw_occurrence_ref: '{{ {rh_fw_occurrence_contract.reference.path: [rh_fw_stage_directory, rh_fw_occurrence_artifact[rh_fw_occurrence_contract.artifacts.f.basename]] | path_join, rh_fw_occurrence_contract.reference.sha256: rh_fw_occurrence_artifact[rh_fw_occurrence_contract.artifacts.f.sha256]} }}'
    ansible.builtin.set_fact:
      rh_fw_proposed_context: '{{ fw_allocation | combine({fw_contract.f.occurrence: rh_fw_occurrence_ref}) }}'

- name: Reuse the exact durable occurrence on an intent resume without manufacturing a replacement
  when:
    - fw_intent_json is not none
    - fw_allocation_mode == fw_contract.allocation.modes.resume
  ansible.builtin.set_fact:
    rh_fw_proposed_context: '{{ fw_allocation_state[fw_contract.ingress.r.recorded] }}'

- name: Independently re-admit the supplied or source-produced occurrence for this managed child
  when: rh_fw_proposed_context[fw_contract.f.occurrence] is not none
  block:
  - name: Bind only the exact occurrence reference to the owner's reader
    ansible.builtin.set_fact:
      rh_fw_occurrence_reference: '{{ rh_fw_proposed_context[fw_contract.f.occurrence] }}'
  - name: Verify finalized bytes and the live process relationship again
    ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_occurrence_contract.task_admit] | path_join }}'
  - name: Publish supervision only from the actual occurrence admission output
    ansible.builtin.set_fact:
      fw_supervised: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_occurrence_contract.output_fact)[rh_fw_occurrence_contract.output.supervised] }}'

- name: Require observed supervision for the selected application acceptance
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ fw_contract.validation.diagnostics.occurrence }}'
    that:
      - not fw_required or fw_supervised

- name: Construct the canonical ingress only for an admitted distinct producer intent
  when: fw_intent_json is not none
  ansible.builtin.set_fact:
    rh_fw_request_json: '{{ {fw_contract.ingress.r.mode: fw_allocation_mode, fw_contract.ingress.r.context: rh_fw_proposed_context} }}'
    fw_ingress_json: '{{ {fw_contract.ingress.r.mode: fw_allocation_mode, fw_contract.ingress.r.context: rh_fw_proposed_context} | to_json }}'
