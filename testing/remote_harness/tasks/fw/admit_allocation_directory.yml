- name: Revalidate the producer-held allocator before reading one recorded invocation
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_transport.workroot.input_var)[rh_fw_transport.workroot.f.holder] }}'
    rh_fw_locator: '{{ rh_fw_allocator_root }}'

- name: Require the same allocator identity recorded by workspace admission
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_transport.diagnostics.allocator }}'
    that:
      - rh_fw_open_directory_stat.stat.dev == rh_fw_workspace[rh_fw_transport.workroot.output.custody][rh_fw_transport.workroot.custody.output.device]
      - rh_fw_open_directory_stat.stat.inode == rh_fw_workspace[rh_fw_transport.workroot.output.custody][rh_fw_transport.workroot.custody.output.inode]

- name: Admit the exact enumerated parent path through the existing ancestry rule
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.task | dirname, rh_fw_transport.workroot.task_prerequisites.ancestry] | path_join }}'
  vars:
    rh_anc_bs: '{{ rh.controller.bootstrap }}'
    rh_anc_repo_root: '{{ fw_source_root }}'
    rh_anc_path: '{{ rh_fw_allocation_directory.path }}'
    rh_anc_refusal: '{{ rh_fw_transport.diagnostics.allocator }}'

- name: Reobserve the enumerated invocation directory without following a replacement link
  ansible.builtin.stat:
    path: '{{ rh_fw_allocation_directory.path }}'
    follow: '{{ rh_fw_transport.structural.refused }}'
    get_checksum: '{{ rh_fw_transport.structural.refused }}'
  register: rh_fw_allocation_parent_stat

- name: Resolve the enumerated invocation parent through the admitted runtime tool
  ansible.builtin.command:
    argv: '{{ [rh_fw_realpath_tool] + rh_fw_transport.tools.realpath_flags + [rh_fw_allocation_directory.path] }}'
  changed_when: rh_fw_transport.structural.refused
  register: rh_fw_allocation_parent_realpath

- name: Refuse replaced linked relocated or noncanonical invocation parents
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_transport.diagnostics.allocator }}'
    that:
      - rh_fw_allocation_directory.path | dirname == rh_fw_allocator_root
      - rh_fw_allocation_directory.path | basename is regex(rh_fw_transport.allocation_record.dirname_pattern, match_type=fw_contract.validation.regex_match_type)
      - rh_fw_allocation_directory.path | basename not in rh_fw_transport.allocation_record.refused_names
      - rh_fw_allocation_parent_realpath.stdout == rh_fw_allocation_directory.path
      - rh_fw_allocation_parent_stat.stat.exists
      - rh_fw_allocation_parent_stat.stat.isdir and not rh_fw_allocation_parent_stat.stat.islnk
      - rh_fw_allocation_parent_stat.stat.dev == rh_fw_allocation_directory.dev
      - rh_fw_allocation_parent_stat.stat.inode == rh_fw_allocation_directory.inode
      - rh_fw_allocation_parent_stat.stat.uid == rh_fw_producer_uid
      - rh_fw_allocation_parent_stat.stat.mode == rh_fw.output.directory_mode
