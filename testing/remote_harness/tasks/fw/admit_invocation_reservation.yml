- name: Bind the protected exclusive reservation made by this seed after preparation
  ansible.builtin.set_fact:
    rh_fw_reserved_invocation: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.reservation_var) }}'

- name: Require the exact current reservation identity
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.reservation }}'
    that:
      - rh_fw_reserved_invocation is mapping
      - rh_fw_reserved_invocation.keys() | list | sort == rh_fw_stage.output.reservation_fields | sort
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.path] == rh_fw_proposed_context[fw_contract.f.locator]
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.path] | dirname == rh_fw_allocator_root
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.owner] is integer
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.owner] is not boolean
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.owner] == rh_fw_producer_uid
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.device] is integer
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.device] is not boolean
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.inode] is integer
      - rh_fw_reserved_invocation[rh_fw_stage.output.reservation.inode] is not boolean

- name: Verify the actual invocation lock remains held by the same producer
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.invocation_holder_var) }}'
    rh_fw_locator: '{{ rh_fw_proposed_context[fw_contract.f.locator] }}'

- name: Bind the actual held directory to the protected successful creation witness
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.reservation }}'
    that:
      - rh_fw_open_directory_stat.stat.dev == rh_fw_reserved_invocation[rh_fw_stage.output.reservation.device]
      - rh_fw_open_directory_stat.stat.inode == rh_fw_reserved_invocation[rh_fw_stage.output.reservation.inode]
      - rh_fw_open_directory_stat.stat.uid == rh_fw_reserved_invocation[rh_fw_stage.output.reservation.owner]

- name: Inspect all entries of the just-reserved invocation including hidden state
  ansible.builtin.find:
    paths: '{{ [rh_fw_proposed_context[fw_contract.f.locator]] }}'
    file_type: '{{ rh_fw_transport.find.file_type }}'
    recurse: '{{ rh_fw_transport.find.recurse }}'
    hidden: '{{ rh_fw_transport.find.hidden }}'
    follow: '{{ rh_fw_transport.find.follow }}'
  register: rh_fw_reservation_contents

- name: Refuse prior partial or finalized state in a claimed fresh reservation
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.reservation }}'
    that:
      - rh_fw_reservation_contents.files | length == rh_fw_transport.structural.zero
      - rh_fw_reservation_contents.skipped_paths | length == rh_fw_transport.structural.zero

- name: Recheck held reservation identity after the empty-directory observation
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.invocation_holder_var) }}'
    rh_fw_locator: '{{ rh_fw_proposed_context[fw_contract.f.locator] }}'
