- name: Select the declared immutable expectation phase and output
  ansible.builtin.set_fact:
    '{{ rh_fw_stage.pipeline.inputs.operation }}': '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).projection.entry.operations.snapshot }}'
    '{{ rh_fw_stage.pipeline.inputs.admission_operation }}': '{{ rh_fw_projection_phase }}'
    '{{ rh_fw_stage.pipeline.inputs.output }}': '{{ [rh_fw_stage_directory, rh_fw_stage.output.precontext_basename] | path_join if rh_fw_projection_phase == lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).admission.operations.precontext else [rh_fw_context[fw_contract.f.locator], rh_fw_stage.output.complete_basename] | path_join }}'

- name: Bind the complete projection to the independently finalized precontext artifact
  when: rh_fw_projection_phase == lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).admission.operations.complete
  ansible.builtin.set_fact:
    '{{ rh_fw_stage.pipeline.inputs.precontext }}': '{{ rh_fw_precontext_reference[rh_fw_stage.output.reference.path] }}'
    '{{ rh_fw_stage.pipeline.inputs.precontext_sha256 }}': '{{ rh_fw_precontext_reference[rh_fw_stage.output.reference.sha256] }}'

- name: Project the same selected source and finalized configuration through G
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.selection_task] | path_join }}'

- name: Read the actual finalized expectation artifact after G publication
  ansible.builtin.slurp:
    src: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.inputs.output) }}'
  register: rh_fw_expectation_capture

- name: Retain the exact produced expectation reference
  ansible.builtin.set_fact:
    rh_fw_expectation_reference: '{{ {rh_fw_stage.output.reference.path: lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.inputs.output), rh_fw_stage.output.reference.sha256: rh_fw_expectation_capture.content | b64decode | hash(lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).hash_algorithm)} }}'

- name: Preserve the original expectation reference for the complete projection
  when: rh_fw_projection_phase == lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).admission.operations.precontext
  ansible.builtin.set_fact:
    rh_fw_precontext_reference: '{{ rh_fw_expectation_reference }}'

- name: Bind the cell consumer to the produced artifact and the actual source case roster
  ansible.builtin.set_fact:
    '{{ rh_fw_stage.pipeline.launch.expected }}': '{{ rh_fw_expectation_reference[rh_fw_stage.output.reference.path] }}'
    '{{ rh_fw_stage.pipeline.launch.expected_sha256 }}': '{{ rh_fw_expectation_reference[rh_fw_stage.output.reference.sha256] }}'

- name: Independently admit source configuration cell lineage and observed dimensions through G
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.binding_task] | path_join }}'
  vars:
    _ar_admission_operation: '{{ rh_fw_projection_phase }}'
    repo_root: '{{ fw_source_root }}'
    work_root: '{{ rh_fw_workspace[rh_fw_transport.workroot.output.work_root] }}'
    cases: '{{ _mx_cases }}'
    case_files: '{{ _mx_case_files }}'
