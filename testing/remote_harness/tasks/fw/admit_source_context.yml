- name: Admit the actual producer workspace before source selection or publication
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.task] | path_join }}'

- name: Retain the verified workspace and record publication contract
  ansible.builtin.set_fact:
    rh_fw_workspace: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_transport.workroot.output_fact) }}'
    rh_fw_record_publication: '{{ rh.controller.bootstrap.resolved_config_record.publication }}'

- name: Require this stage under the genuine admitted work root
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.workspace }}'
    that:
      - rh_fw_stage_directory is string
      - rh_fw_stage_directory != rh_fw_workspace[rh_fw_transport.workroot.output.work_root]
      - rh_fw_stage_directory.startswith(rh_fw_workspace[rh_fw_transport.workroot.output.work_root] ~ rh_fw_transport.structural.separator)
      - rh_fw_stage_directory | realpath == rh_fw_stage_directory

- name: Read the source-admitted acceptance declaration as data
  ansible.builtin.slurp:
    src: '{{ [fw_source_root, rh_fw_stage.source.binding_declaration] | path_join }}'
  register: rh_fw_binding_capture

- name: Bind the original acceptance declaration without a second desired configuration merge
  ansible.builtin.set_fact:
    '{{ rh_fw_stage.pipeline.declaration_document }}': '{{ rh_fw_binding_capture.content | b64decode | from_yaml }}'

- name: Read the source tree through the actual declared G command
  ansible.builtin.command:
    argv: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).source_identity.tree_argv }}'
    chdir: '{{ fw_source_root }}'
  changed_when: rh_fw_transport.structural.refused
  register: rh_fw_selected_tree

- name: Supply only the requested cell and the separately admitted checkout identity
  ansible.builtin.set_fact:
    '{{ rh_fw_stage.pipeline.inputs.checkout }}': '{{ fw_source_root }}'
    '{{ rh_fw_stage.pipeline.inputs.source_commit }}': '{{ rh_fw_workspace[rh_fw_transport.workroot.output.source_commit] }}'
    '{{ rh_fw_stage.pipeline.inputs.source_tree }}': '{{ rh_fw_selected_tree.stdout }}'
    '{{ rh_fw_stage.pipeline.inputs.scope }}': '{{ [rh_fw_proposed_context[fw_contract.f.cell]] }}'
    '{{ rh_fw_stage.pipeline.inputs.operation }}': '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).projection.entry.operations.selection }}'

- name: Select and source-verify the actual matrix row before producing its configuration
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.selection_task] | path_join }}'

- name: Resolve the complete selected configuration through the existing sole loader
  ansible.builtin.include_role:
    name: '{{ rh_fw_stage.source.role }}'
    tasks_from: '{{ rh_fw_stage.source.complete_loader }}'
    public: '{{ rh_fw_transport.structural.accepted }}'

- name: Publish the actual loader artifact through the declared configuration publisher
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_record_publication.include_rel] | path_join }}'

- name: Retain the publisher reference and the independently admitted matrix selection
  ansible.builtin.set_fact:
    rh_fw_configuration_publication: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_record_publication.output_fact) }}'
    rh_fw_selected_cell: '{{ lookup(rh_fw_transport.jinja.vars, lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).projection.entry.output_var) }}'

- name: Bind precontext projection exclusively to the finalized configuration reference
  ansible.builtin.set_fact:
    rh_fw_projection_phase: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).admission.operations.precontext }}'
    '{{ rh_fw_stage.pipeline.inputs.records_dir }}': '{{ rh_fw_workspace[rh_fw_transport.workroot.output.records_dir] }}'
    '{{ rh_fw_stage.pipeline.inputs.digests }}': '{{ {rh_fw_proposed_context[fw_contract.f.cell]: rh_fw_configuration_publication[rh_fw_record_publication.references.record][rh_fw_record_publication.references.sha256]} }}'
    '{{ rh_fw_stage.pipeline.launch.cell }}': '{{ rh_fw_proposed_context[fw_contract.f.cell] }}'
    '{{ rh_fw_stage.pipeline.launch.configuration }}': '{{ rh_fw_configuration_publication[rh_fw_record_publication.references.record][rh_fw_record_publication.references.path] }}'
    '{{ rh_fw_stage.pipeline.launch.configuration_sha256 }}': '{{ rh_fw_configuration_publication[rh_fw_record_publication.references.record][rh_fw_record_publication.references.sha256] }}'

- name: Freeze and independently admit the source and configuration expectations before context admission
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.expectation_tasks] | path_join }}'
