- name: Require the exact protected preparation reference
  ansible.builtin.set_fact:
    rh_fw_prepared_reference: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.prepared_ref_var) }}'

- name: Admit the declared preparation path and digest shape
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.preparation }}'
    that:
      - rh_fw_prepared_reference is mapping
      - rh_fw_prepared_reference.keys() | list | sort == rh_fw_stage.output.reference.values() | list | sort
      - rh_fw_prepared_reference[rh_fw_stage.output.reference.path] == [rh_fw_stage_directory, rh_fw_stage.output.prepared_basename] | path_join
      - rh_fw_prepared_reference[rh_fw_stage.output.reference.sha256] is string

- name: Inspect the exact preparation without following a replacement link
  ansible.builtin.stat:
    path: '{{ rh_fw_prepared_reference[rh_fw_stage.output.reference.path] }}'
    follow: '{{ rh_fw_transport.structural.refused }}'
    get_checksum: '{{ rh_fw_transport.structural.accepted }}'
    checksum_algorithm: '{{ rh_fw.output.digest_algorithm }}'
  register: rh_fw_prepared_before

- name: Require finalized preparation bytes owned by the current producer
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.preparation }}'
    that:
      - rh_fw_prepared_before.stat.exists
      - rh_fw_prepared_before.stat.isreg and not rh_fw_prepared_before.stat.islnk
      - rh_fw_prepared_before.stat.uid == rh_fw_producer_uid
      - rh_fw_prepared_before.stat.mode == rh_fw.output.finalized_mode
      - rh_fw_prepared_before.stat.nlink == rh_fw_transport.structural.one
      - rh_fw_prepared_before.stat.checksum == rh_fw_prepared_reference[rh_fw_stage.output.reference.sha256]

- name: Retain the original preparation without interpreting it in shell
  ansible.builtin.slurp:
    src: '{{ rh_fw_prepared_reference[rh_fw_stage.output.reference.path] }}'
  register: rh_fw_prepared_capture

- name: Bind the preparation document with the existing strict parser
  ansible.builtin.set_fact:
    rh_fw_prepared_document: '{{ rh_fw_prepared_capture.content | b64decode | lme_manifest_strict(rh_fw_stage.diagnostics.preparation, fw_parse_contract) }}'

- name: Reobserve the preparation identity after retaining its exact bytes
  ansible.builtin.stat:
    path: '{{ rh_fw_prepared_reference[rh_fw_stage.output.reference.path] }}'
    follow: '{{ rh_fw_transport.structural.refused }}'
    get_checksum: '{{ rh_fw_transport.structural.accepted }}'
    checksum_algorithm: '{{ rh_fw.output.digest_algorithm }}'
  register: rh_fw_prepared_after

- name: Refuse changed preparation identity mode owner or contents
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.preparation }}'
    that:
      - rh_fw_prepared_after.stat.isreg and not rh_fw_prepared_after.stat.islnk
      - rh_fw_prepared_after.stat.uid == rh_fw_producer_uid
      - rh_fw_prepared_after.stat.mode == rh_fw.output.finalized_mode
      - rh_fw_prepared_after.stat.nlink == rh_fw_transport.structural.one
      - rh_fw_prepared_after.stat.dev == rh_fw_prepared_before.stat.dev
      - rh_fw_prepared_after.stat.inode == rh_fw_prepared_before.stat.inode
      - rh_fw_prepared_after.stat.checksum == rh_fw_prepared_before.stat.checksum

- name: Refuse any changed source configuration context workspace or expectation since preparation
  vars:
    rh_fw_prepared_fields: '{{ rh_fw_stage.output.f }}'
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_stage.diagnostics.source_drift }}'
    that:
      - rh_fw_prepared_capture.content | b64decode | hash(rh_fw.output.digest_algorithm) == rh_fw_prepared_reference[rh_fw_stage.output.reference.sha256]
      - rh_fw_prepared_document is mapping
      - rh_fw_prepared_document.keys() | list | sort == rh_fw_stage.output.fields | sort
      - rh_fw_prepared_document[rh_fw_prepared_fields.schema] == rh_fw_stage.output.schema
      - rh_fw_prepared_document[rh_fw_prepared_fields.request_sha256] == rh_fw_request_sha256
      - rh_fw_prepared_document[rh_fw_prepared_fields.ingress_selector] == rh_fw_ingress_selector
      - rh_fw_prepared_document[rh_fw_prepared_fields.allocation] | lme_type_aware_equal(rh_fw_allocation_document)
      - rh_fw_prepared_document[rh_fw_prepared_fields.workspace] | lme_type_aware_equal(rh_fw_workspace)
      - rh_fw_prepared_document[rh_fw_prepared_fields.expected_sha256] == rh_fw_precontext_reference[rh_fw_stage.output.reference.sha256]
      - rh_fw_prepared_document[rh_fw_prepared_fields.configuration_sha256] == fw_admitted_record_sha256

- name: Admit the actual seed-held invocation directory before allocation publication
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.invocation_holder_var) }}'
    rh_fw_locator: '{{ rh_fw_context[fw_contract.f.locator] }}'

- name: Publish or verify the exact durable allocation without replacing prior evidence
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.paths.publication_task_from_repository] | path_join }}'
  vars:
    rh_fw_publish_path: '{{ [rh_fw_io_root, rh_fw_transport.paths.context_record_basename] | path_join }}'
    rh_fw_publish_bytes: '{{ (rh_fw_allocation_document | to_nice_json(indent=rh_fw.output.json_indent, sort_keys=rh_fw.output.json_sort_keys)) ~ rh_fw.output.newline }}'

- name: Expose the admitted context only to the complete same-engine expectation phase
  ansible.builtin.set_fact:
    '{{ fw_contract.var }}': '{{ rh_fw_context }}'
    rh_fw_projection_phase: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.pipeline.declaration_document).admission.operations.complete }}'

- name: Complete and re-admit the immutable expected model using the same source and configuration
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.expectation_tasks] | path_join }}'

- name: Restore invocation custody after independent G workspace checks
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.invocation_holder_var) }}'
    rh_fw_locator: '{{ rh_fw_context[fw_contract.f.locator] }}'

- name: Construct only the verified launch references
  ansible.builtin.set_fact:
    rh_fw_launch_references: '{{ dict(rh_fw_stage.pipeline.launch.values() | zip(rh_fw_stage.pipeline.launch.values() | map(rh_fw_transport.jinja.extract, vars))) }}'

- name: Publish the completed launch references and canonical serialization under invocation custody
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.paths.publication_task_from_repository] | path_join }}'
  vars:
    rh_fw_publish_path: '{{ [rh_fw_io_root, item[rh_fw_stage.control_file.basename]] | path_join }}'
    rh_fw_publish_bytes: '{{ item[rh_fw_stage.control_file.content] }}'
  loop:
    - '{{ {rh_fw_stage.control_file.basename: rh_fw_stage.output.launch_basename, rh_fw_stage.control_file.content: rh_fw_launch_references | to_json} }}'
    - '{{ {rh_fw_stage.control_file.basename: rh_fw_transport.paths.protected_context_basename, rh_fw_stage.control_file.content: lookup(rh_fw_transport.jinja.vars, fw_contract.validation.serialized_output_fact)} }}'

- name: Recheck custody before allowing the dependent launcher to consume finalized arguments
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.invocation_holder_var) }}'
    rh_fw_locator: '{{ rh_fw_context[fw_contract.f.locator] }}'
