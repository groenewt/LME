- name: Bind the allocator directory from the actual admitted work root
  ansible.builtin.set_fact:
    rh_fw_allocator_root: "{{ [rh_fw_workspace[rh_fw_transport.workroot.output.work_root], rh_fw_transport.paths.allocator_root_basename] | path_join }}"
    rh_fw_allocation_records: "{{ rh_fw_transport.structural.empty_list }}"

- name: Inspect the allocator directory without following links
  ansible.builtin.stat:
    path: "{{ rh_fw_allocator_root }}"
    follow: "{{ rh_fw_transport.structural.refused }}"
    get_checksum: "{{ rh_fw_transport.structural.refused }}"
  register: rh_fw_allocator_stat

- name: Require the real seed-owned allocator directory
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_transport.diagnostics.allocator }}"
    that:
      - rh_fw_allocator_stat.stat.dev == rh_fw_workspace[rh_fw_transport.workroot.output.custody][rh_fw_transport.workroot.custody.output.device]
      - rh_fw_allocator_stat.stat.inode == rh_fw_workspace[rh_fw_transport.workroot.output.custody][rh_fw_transport.workroot.custody.output.inode]
      - rh_fw_allocator_stat.stat.exists
      - rh_fw_allocator_stat.stat.isdir
      - not rh_fw_allocator_stat.stat.islnk
      - rh_fw_allocator_stat.stat.uid == rh_fw_producer_uid
      - rh_fw_allocator_stat.stat.mode == rh_fw.output.directory_mode

- name: Resolve allocator ancestry using the admitted runtime tool
  ansible.builtin.command:
    argv: "{{ [rh_fw_realpath_tool] + rh_fw_transport.tools.realpath_flags + [rh_fw_allocator_root] }}"
  changed_when: rh_fw_transport.structural.refused
  register: rh_fw_allocator_realpath

- name: Refuse linked or noncanonical allocator ancestry
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_transport.diagnostics.allocator }}"
    that:
      - rh_fw_allocator_realpath.stdout == rh_fw_allocator_root

- name: Inspect every allocator child without shrinking incomplete state
  ansible.builtin.find:
    paths: "{{ [rh_fw_allocator_root] }}"
    file_type: "{{ rh_fw_transport.find.file_type }}"
    recurse: "{{ rh_fw_transport.find.recurse }}"
    hidden: "{{ rh_fw_transport.find.hidden }}"
    follow: "{{ rh_fw_transport.find.follow }}"
  register: rh_fw_allocator_children

- name: Require a complete directory observation
  ansible.builtin.assert:
    quiet: true
    fail_msg: '{{ rh_fw_transport.diagnostics.allocator }}'
    that:
      - rh_fw_allocator_children.skipped_paths | length == rh_fw_transport.structural.zero

- name: Admit the seed's actual fresh reservation before any scanner exception
  when:
    - rh_fw_current_phase == rh_fw_stage.phases.commit
    - rh_fw_mode == fw_contract.allocation.modes.fresh
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_stage.source.reservation_task] | path_join }}'

- name: Require owned invocation directories for all allocator entries
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_transport.diagnostics.allocator }}"
    that:
      - item.isdir
      - not item.islnk
      - item.uid == rh_fw_producer_uid
      - item.mode == rh_fw.output.directory_mode
      - item.path | dirname == rh_fw_allocator_root
      - item.path | basename is regex(rh_fw_transport.allocation_record.dirname_pattern, match_type=fw_contract.validation.regex_match_type)
      - item.path | basename not in rh_fw_transport.allocation_record.refused_names
  loop: "{{ rh_fw_allocator_children.files }}"

- name: Verify every durable allocation record before selecting resume state
  ansible.builtin.include_tasks: "{{ rh_fw_transport.paths.allocation_record_task }}"
  loop: "{{ rh_fw_allocator_children.files }}"
  loop_control:
    loop_var: rh_fw_allocation_directory
  when: not (rh_fw_current_phase == rh_fw_stage.phases.commit and rh_fw_mode == fw_contract.allocation.modes.fresh and rh_fw_allocation_directory.path == rh_fw_reserved_invocation[rh_fw_stage.output.reservation.path])

- name: Locate recorded state by the caller's proposed invocation locator
  ansible.builtin.set_fact:
    rh_fw_recorded_matches: "{{ rh_fw_allocation_records | selectattr(rh_fw_transport.allocation_record.f.context ~ rh_fw_transport.structural.separator_dot ~ fw_contract.f.locator, rh_fw_transport.jinja.equal, rh_fw_proposed_context[fw_contract.f.locator]) | list }}"

- name: Refuse more than one record for an invocation locator
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_transport.diagnostics.record }}"
    that:
      - rh_fw_recorded_matches | length <= rh_fw_transport.structural.one

- name: Publish allocator state only from verified durable records
  vars:
    rh_fw_state_keys: "{{ rh_fw_transport.allocation_record.state_fields }}"
    rh_fw_record_fields: "{{ rh_fw_transport.allocation_record.f }}"
  ansible.builtin.set_fact:
    "{{ rh_fw_transport.names.allocation_state }}": "{{ {rh_fw_state_keys.recorded: rh_fw_recorded_matches[rh_fw_transport.structural.zero][rh_fw_record_fields.context] if rh_fw_recorded_matches | length == rh_fw_transport.structural.one else rh_fw_transport.structural.absent, rh_fw_state_keys.recorded_binding: rh_fw_recorded_matches[rh_fw_transport.structural.zero][rh_fw_record_fields.binding] if rh_fw_recorded_matches | length == rh_fw_transport.structural.one else rh_fw_transport.structural.absent, rh_fw_state_keys.used_identities: rh_fw_allocation_records | map(attribute=rh_fw_record_fields.context) | list} }}"
