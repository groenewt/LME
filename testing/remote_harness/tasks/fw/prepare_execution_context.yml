- name: Revalidate the seed-held stage directory before preparation writes
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.holder_var) }}'
    rh_fw_locator: '{{ rh_fw_stage_directory }}'

- name: Construct the exact preparation identity from admitted producer outputs
  vars:
    rh_fw_prepared_fields: '{{ rh_fw_stage.output.f }}'
  ansible.builtin.set_fact:
    rh_fw_prepared_document: '{{ {rh_fw_prepared_fields.schema: rh_fw_stage.output.schema, rh_fw_prepared_fields.request_sha256: rh_fw_request_sha256, rh_fw_prepared_fields.ingress_selector: rh_fw_ingress_selector, rh_fw_prepared_fields.allocation: rh_fw_allocation_document, rh_fw_prepared_fields.workspace: rh_fw_workspace, rh_fw_prepared_fields.expected_sha256: rh_fw_precontext_reference[rh_fw_stage.output.reference.sha256], rh_fw_prepared_fields.configuration_sha256: fw_admitted_record_sha256} }}'

- name: Publish the validated locator and mode for the seed without a shell JSON evaluator
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.paths.publication_task_from_repository] | path_join }}'
  vars:
    rh_fw_mode: '{{ fw_contract.allocation.modes.fresh }}'
    rh_fw_publish_path: '{{ [rh_fw_io_root, item[rh_fw_stage.control_file.basename]] | path_join }}'
    rh_fw_publish_bytes: '{{ item[rh_fw_stage.control_file.content] }}'
  loop:
    - '{{ {rh_fw_stage.control_file.basename: rh_fw_stage.output.locator_basename, rh_fw_stage.control_file.content: rh_fw_context[fw_contract.f.locator]} }}'
    - '{{ {rh_fw_stage.control_file.basename: rh_fw_stage.output.mode_basename, rh_fw_stage.control_file.content: rh_fw_request_json[fw_contract.ingress.r.mode]} }}'
    - '{{ {rh_fw_stage.control_file.basename: rh_fw_transport.paths.protected_context_basename, rh_fw_stage.control_file.content: lookup(rh_fw_transport.jinja.vars, fw_contract.validation.serialized_output_fact)} }}'

- name: Publish the preparation identity only after every control is finalized
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.paths.publication_task_from_repository] | path_join }}'
  vars:
    rh_fw_mode: '{{ fw_contract.allocation.modes.fresh }}'
    rh_fw_publish_path: '{{ [rh_fw_io_root, rh_fw_stage.output.prepared_basename] | path_join }}'
    rh_fw_publish_bytes: '{{ (rh_fw_prepared_document | to_nice_json(indent=rh_fw.output.json_indent, sort_keys=rh_fw.output.json_sort_keys)) ~ rh_fw.output.newline }}'

- name: Recheck stage custody after the preparation commit
  ansible.builtin.include_tasks: '{{ [fw_source_root, rh_fw_transport.workroot.custody.task] | path_join }}'
  vars:
    rh_fw_custody: '{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.holder_var) }}'
    rh_fw_locator: '{{ rh_fw_stage_directory }}'
