- name: Admit selected bootstrap tool binaries before consuming authoring receipts
  ansible.builtin.include_tasks: admit_authoring_tools.yml
- name: Require source-bound consumer inputs rather than receipt-derived expectations
  ansible.builtin.assert:
    that:
    - rh_ar_subject_capture is mapping
    - (rh_ar_subject_capture | list | sort) == (rh_ar_contract.subject_capture_fields | sort)
    - rh_ar_subject_capture.sha256 is match(rh_ar_contract.digest_pattern)
    - rh_ar_current_admission is mapping
    - (rh_ar_current_admission | list | sort) == (rh_ar_contract.current_fields | sort)
    - rh_ar_current_admission.compatibility | lme_type_aware_equal(rh_ar_context.dependencies)
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.source }}'
    quiet: true
- name: Read the subject captured by the admitted source producer
  ansible.builtin.slurp:
    src: '{{ rh_ar_subject_capture.path }}'
  register: _rh_ar_consumer_subject
- name: Bind the source-owned subject before interpreting it
  ansible.builtin.assert:
    that:
    - (_rh_ar_consumer_subject.content | b64decode | hash(rh_ar_contract.digest)) == rh_ar_subject_capture.sha256
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.changed_read }}'
    quiet: true
- name: Require equality with the independent subject declaration
  ansible.builtin.assert:
    that:
    - rh_ar_subject | lme_type_aware_equal(_rh_ar_consumer_subject.content | b64decode | lme_manifest_strict(rh_ar_subject_capture.path, rh_ar_contract.parse))
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.subject }}'
    quiet: true
- name: Reobserve the installed historical toolchain without cleanup or retention
  ansible.builtin.include_tasks: observe_authoring_installation.yml
- name: Verify the actual historical source and current dependency identity
  ansible.builtin.include_tasks: verify_authoring_origin.yml
- name: Bind independently supplied current admission for the shared verifier
  ansible.builtin.set_fact:
    _rh_ar_current: '{{ rh_ar_current_admission }}'
- name: Admit the current canonical authoring receipt through the existing engine
  ansible.builtin.include_tasks: verify_authoring_admission.yml
- name: Publish historical installation identity only after current admission succeeds
  ansible.builtin.set_fact:
    rh_toolchain: '{{ rh_authoring_admission.historical_origin.installation }}'
