---
# testing/remote_harness/tasks/reap_staging_controller_ns.yml -- route op1q NEW FILE (codex 931
# ROUTE_DELEGATION_BEFORE_SKIP; records-route-op1q-01 delegation_before_skip). AUTHORED, NEVER RENDERED OR EXECUTED.
# The DELEGATED variant of reap_staging.yml's namespace observation, moved here VERBATIM from the op1q
# reap_staging successor (op1p :256-276 plus the op1q controller_env word; its `when` dropped). ansible-core 2.19.11 task_executor._execute_internal templates delegate_to
# (_calculate_delegate_to, :458) BEFORE it evaluates the task's `when` (:497), so a delegated task whose `when` is false
# still fails when its delegation target is not bound. reap_staging.yml therefore includes THIS file only under its
# decided launch context (include_tasks under `when: _rh_reap_app.kind == 'delegated'`, after the stage-1b asserts
# admitted rh_controller_target, rh_controller_connection and the controller policy): nothing here is templated in
# the genesis context, which has no controller-target binding and gets none invented.
# Reads (set by reap_staging.yml before the include): _rh_lease_self, _rh_reap_app; rh; rh_controller_target,
# rh_controller_connection. Writes: the register _rh_lease_ns_d, merged by reap_staging.yml.
- name: Read the holder's and this reaper's namespace identities and the cgroup v2 marker on the controller (delegated; read-only)
  vars:
    # RH-CONTROLLER-DELEGATION: the declared controller binding, connection, interpreter and remote temp as TASK vars
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  # route op2a (C1 SR922t proc_paths.namespace_paths, s64 :474-478, route op2c retarget): the four paths reap_staging.yml's derivation built
  # from the word (holder pid proven against pid_placeholder.ere before this include), then the cgroup v2 marker
  loop: "{{ _rh_lease_self.ns_paths + [_lz.cgroup_v2_marker] }}"
  register: _rh_lease_ns_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false
