- name: Admit exact execution-context field names, types and declared grammars
  ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.fields }}"
  vars:
    fw_field_value: "{{ fw_payload }}"
    fw_field_names: "{{ fw_contract.fields }}"
    fw_field_kinds: "{{ fw_contract.field_kinds }}"
    fw_field_patterns: "{{ fw_contract.field_patterns }}"

- name: Admit a real supervised occurrence or the declared unsupervised null
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.validation.diagnostics.occurrence }}"
    that:
      - (fw_payload[fw_contract.f.occurrence] is not none) == fw_supervised

- name: Admit the non-null occurrence path and digest
  when: fw_payload[fw_contract.f.occurrence] is not none
  ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.fields }}"
  vars:
    fw_field_value: "{{ fw_payload[fw_contract.f.occurrence] }}"
    fw_field_names: "{{ fw_contract.occurrence.fields }}"
    fw_field_kinds: "{{ fw_contract.occurrence.field_kinds }}"
    fw_field_patterns: "{{ fw_contract.occurrence.field_patterns }}"
