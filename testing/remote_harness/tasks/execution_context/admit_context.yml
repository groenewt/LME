- name: Clear prior public outputs before private context validation
  ansible.builtin.set_fact:
    "{{ fw_contract.validation.output_fact }}": "{{ fw_contract.validation.no_context_output }}"
    "{{ fw_contract.validation.serialized_output_fact }}": "{{ fw_contract.validation.no_context_output }}"

- name: Require an explicit caller decision about context applicability
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.validation.diagnostics.request }}"
    that:
      - fw_required is boolean
      - fw_supervised is boolean
      - fw_request is none or fw_request is mapping
      - fw_request is not none or not fw_required

- name: Admit a present typed caller request before any producer effect
  when: fw_request is not none
  block:
    - name: Admit request shape and kinds from the resolved contract
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.fields }}"
      vars:
        fw_field_value: "{{ fw_request }}"
        fw_field_names: "{{ fw_contract.ingress.request_fields }}"
        fw_field_kinds: "{{ fw_contract.ingress.request_kinds }}"
        fw_field_patterns: "{{ fw_contract.validation.structural.empty_map }}"

    - name: Admit the declared allocation mode
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.request }}"
        that:
          - fw_request[fw_contract.ingress.r.mode] in fw_contract.allocation.modes.values()

    - name: Require the separate admitted allocator state
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.fields }}"
      vars:
        fw_field_value: "{{ fw_allocation_state }}"
        fw_field_names: "{{ fw_contract.allocation.state.fields }}"
        fw_field_kinds: "{{ fw_contract.allocation.state.kinds }}"
        fw_field_patterns: "{{ fw_contract.validation.structural.empty_map }}"

    - name: Admit the transported five-key payload
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.payload }}"
      vars:
        fw_payload: "{{ fw_request[fw_contract.ingress.r.context] }}"

    - name: Admit each previously allocated identity without reducing collision scope
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.payload }}"
      vars:
        fw_payload: "{{ fw_prior }}"
        fw_supervised: "{{ fw_prior[fw_contract.f.occurrence] is not none }}"
      loop: "{{ fw_allocation_state[fw_contract.ingress.r.used_identities] }}"
      loop_control:
        loop_var: fw_prior

    - name: Refuse a fresh invocation carrying prior recorded context
      when: fw_request[fw_contract.ingress.r.mode] == fw_contract.allocation.modes.fresh
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.allocation }}"
        that:
          - fw_allocation_state[fw_contract.ingress.r.recorded] is none
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding] is none

    - name: Refuse identity-field reuse for a fresh allocation
      when: fw_request[fw_contract.ingress.r.mode] == fw_contract.allocation.modes.fresh
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.allocation }}"
        that:
          - fw_request[fw_contract.ingress.r.context][fw_identity_field] not in (fw_allocation_state[fw_contract.ingress.r.used_identities] | map(attribute=fw_identity_field) | list)
      loop: "{{ fw_contract.allocation.identity_fields }}"
      loop_control:
        loop_var: fw_identity_field

    - name: Admit complete recorded context on resume
      when: fw_request[fw_contract.ingress.r.mode] == fw_contract.allocation.modes.resume
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.payload }}"
      vars:
        fw_payload: "{{ fw_allocation_state[fw_contract.ingress.r.recorded] }}"

    - name: Refuse a resume that changes a recorded field
      when: fw_request[fw_contract.ingress.r.mode] == fw_contract.allocation.modes.resume
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.allocation }}"
        that:
          - fw_request[fw_contract.ingress.r.context][fw_identity_field] | lme_type_aware_equal(fw_allocation_state[fw_contract.ingress.r.recorded][fw_identity_field])
      loop: "{{ fw_contract.allocation.resume.compare_fields }}"
      loop_control:
        loop_var: fw_identity_field

    - name: Compare existing G and C1 source/configuration/cell identities
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.binding }}"
        that:
          - fw_request[fw_contract.ingress.r.context][fw_contract.f.cell] | lme_type_aware_equal(fw_expected_cell[fw_contract.binding.cell_keys.id])
          - fw_request[fw_contract.ingress.r.context][fw_contract.f.cell] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.cell])
          - fw_expected_cell[fw_contract.binding.cell_keys.identity][fw_contract.binding.cell_keys.dimensions] | lme_type_aware_equal(fw_observed_dimensions)
          - fw_expected_cell[fw_contract.binding.cell_keys.configuration_sha256] | lme_type_aware_equal(fw_admitted_record_sha256)
          - fw_expected_cell[fw_contract.binding.cell_keys.configuration_revision] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.configuration_revision])
          - fw_expected_lineage[fw_contract.binding.lineage_keys.source_commit] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.source_commit])
          - fw_expected_lineage[fw_contract.binding.lineage_keys.source_tree] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.source_tree])

    - name: Require the complete previously admitted binding on resume
      when: fw_request[fw_contract.ingress.r.mode] == fw_contract.allocation.modes.resume
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.validation.diagnostics.binding }}"
        that:
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding] is mapping
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding] | list | sort == fw_contract.allocation.state.binding_fields | sort
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_record_fields.cell] | lme_type_aware_equal(fw_request[fw_contract.ingress.r.context][fw_contract.f.cell])
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_contract.binding.cell_keys.dimensions] | lme_type_aware_equal(fw_observed_dimensions)
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_contract.binding.cell_keys.configuration_sha256] | lme_type_aware_equal(fw_admitted_record_sha256)
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_record_fields.configuration_revision] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.configuration_revision])
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_record_fields.source_commit] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.source_commit])
          - fw_allocation_state[fw_contract.ingress.r.recorded_binding][fw_record_fields.source_tree] | lme_type_aware_equal(fw_admitted_record[fw_record_fields.source_tree])

