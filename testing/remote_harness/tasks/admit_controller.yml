---
# testing/remote_harness/tasks/admit_controller.yml -- SECOND task of every controller play (r3g, codex 023332
# TRANSPORT-COMPOSITION-REMAINDERS): right after refuse_pinned_outputs.yml (SEED-05 keeps that the FIRST task; it is
# assert + set_fact with controller-side lookups only, no module run, no connection) and before any controller-side
# effect. Since records-c1-framework-20 FW20-COLD it is reached through tasks/admit_cold_launch.yml on the record-free
# cold entries (its second included task).
#
# SUCCESSOR (records-c1-framework-20 FW20-HOSTS, d2eef9f6; codex-tick815 :40-55 OD-CONTROLLER-HOSTS; J-FW20-HOSTS-USE).
# Base: testing/remote_harness/tasks/admit_controller.yml d7b7faa2 (29 lines; mr03-gen-bases/first-runner and the
# reconcile-dev-a worktree carry the same bytes). AUTHORED, NEVER EXECUTED (UNRUN).
#   ONE AUTHORITY   the controller target host and connection are controller.bootstrap.work_roots.run_local
#                   {inventory, connection}, carried by the seed's final pinned JSON -e as rh_controller_target and
#                   rh_controller_connection. records-c1-framework-27 (codex-tick821 REP-D1): both are COMPANION
#                   protected bindings of the registry ingress (registry_ingress.decl companions), no longer reserved
#                   outputs; a caller -e of either refuses in the seed before pinning (route records-route-life-08 A4)
#                   and the ingress refuses a value that differs from the launch envelope. The play selects hosts /
#                   connection from those two vars; this file compares the EFFECTIVE values with them. The quoted host
#                   and connection words of base :20-21 are removed.
#   PRESENCE FIRST  the two pinned vars are refused absent or empty before they are compared (no fallback value).
#   NO BECOME       base :22 is now "ansible_become is boolean" then "not ansible_become" (seat ruling on SLIP-ROUTE-S40
#                   follow-up): FW20-HOSTS pins ansible_become false in run_local.pinned_vars (lineage-rh profile :2032),
#                   so its absence is itself a refusal. base :23 (become_user) is REMOVED (seat ruling): the pinned
#                   ansible_become false arrives as the seed's FINAL extra var, which outranks every play, task and
#                   inventory become keyword or var, and :46-47 assert it boolean and false before any effect; with
#                   become off, become_user has no effect, so the row guarded nothing beyond :46-47.
#   REFUSAL CODE    the literal RH-CONTROLLER-CONNECTION is carried (base :12-13: the policy is not resolved yet).
# Everything is INLINE (no task vars): an extra-var can outrank a task var. Connection variables outrank the play
# keyword, so the effective ansible_connection is compared (FW20-HOSTS also pins ansible_connection to the same word).

- name: Refuse a run without the pinned controller target and connection (presence first; no fallback)
  ansible.builtin.assert:
    that:
      - rh_controller_target is string
      - rh_controller_target | length > 0
      - rh_controller_connection is string
      - rh_controller_connection | length > 0
      - ansible_connection is string
    fail_msg: >-
      REFUSED RH-CONTROLLER-CONNECTION on {{ inventory_hostname }}: the pinned controller target and connection
      (work_roots.run_local, carried by the seed's final pinned -e) and the effective connection must be present
      non-empty words before any effect.
    quiet: true

- name: Refuse a play host or effective connection other than the pinned controller target and connection, or privilege escalation
  ansible.builtin.assert:
    that:
      - inventory_hostname == rh_controller_target
      - ansible_connection == rh_controller_connection
      - ansible_become is boolean
      - not ansible_become
    fail_msg: >-
      REFUSED RH-CONTROLLER-CONNECTION on {{ inventory_hostname }}: a controller play runs only on the pinned controller
      target {{ rh_controller_target }} with the pinned connection {{ rh_controller_connection }} (effective
      {{ ansible_connection }}) and without become. An extra-var or inventory host or connection override is refused
      before any effect.
    quiet: true
