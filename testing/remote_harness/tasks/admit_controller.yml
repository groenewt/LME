---
# testing/remote_harness/tasks/admit_controller.yml -- SECOND task of every controller play (r3g, codex 023332
# TRANSPORT-COMPOSITION-REMAINDERS): right after refuse_pinned_outputs.yml (SEED-05 keeps that the FIRST task; it is
# assert + set_fact with controller-side lookups only, no module run, no connection) and before any controller-side
# effect.
#
# A controller play states `hosts: localhost`, `connection: local` and `become: false`. Connection variables
# outrank the play keyword: an extra-var `-e ansible_connection=ssh`, or an inventory `localhost` entry with
# ansible_connection ssh, would run every "controller" task elsewhere. The same holds for a host or extra-var
# ansible_become. This file binds the EFFECTIVE values. An undefined ansible_connection means the play keyword
# governs, so `| default('local')` is correct whether or not the keyword populates the variable.
# Everything is INLINE (no task vars): an extra-var can outrank a task var. The refusal code is a literal
# because the policy is not resolved yet. The evaluator binds it to the profile's playbook_refusals catalogue.
# This is NOT a revision-4 consumer-interface file. B may include it right after refuse_pinned_outputs.yml in its own
# localhost plays (optional).

- name: Refuse an effective controller connection other than local, a non-localhost play host, or privilege escalation
  ansible.builtin.assert:
    that:
      - inventory_hostname == 'localhost'
      - (ansible_connection | default('local')) in ['local', 'ansible.builtin.local']
      - not (ansible_become | default(false) | bool)
      - (ansible_become_user | default('')) | length == 0
    fail_msg: >-
      REFUSED RH-CONTROLLER-CONNECTION on {{ inventory_hostname }}: a controller play runs only on localhost with
      the local connection plugin and without become. The effective ansible_connection is
      '{{ ansible_connection | default('local') }}' and ansible_become is '{{ ansible_become | default(false) }}'.
      An extra-var or inventory connection override is refused before any effect.
    quiet: true
