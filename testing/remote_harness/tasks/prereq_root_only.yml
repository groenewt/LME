---
# testing/remote_harness/tasks/prereq_root_only.yml -- the privileged leg's FRESH use-boundary check
# (initial_contact.yml: "a later write re-admits its path at its own use boundary ... privileged: this file again, or
# the caller's own fresh check at the use boundary"). The owner-only admit_ancestry.yml is never included on a root
# leg (it refuses uid 0 by design). Rule = path_admission.ancestry.root_only, re-read immediately before a root write:
# every EXISTING component of tp_ro_path, from / down to tp_ro_path itself, is a real directory (a link refuses) owned
# by uid 0 and never group- or other-writable. Absent components are allowed (the caller creates them next).
# Read-only. Inputs (no defaults): tp_ro_path (absolute, path_admission.regex), tp_ro_refusal.
- name: Admit the use-boundary inputs (no default)
  ansible.builtin.assert:
    that:
      - tp_ro_path is string and tp_ro_path is match(rh.controller.bootstrap.path_admission.regex)
      - tp_ro_path is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - tp_ro_refusal is string and tp_ro_refusal | length > 0
    fail_msg: "REFUSED {{ tp_ro_refusal | default('RH-TARGET-PREREQ') }}: prereq_root_only.yml needs tp_ro_path and tp_ro_refusal (got '{{ tp_ro_path | default('') }}')."
    quiet: true

- name: Stat every component of the path (no link followed; read-only)
  ansible.builtin.stat:
    path: "{{ '/' ~ (tp_ro_path.split('/')[1:item] | join('/')) }}"
    follow: false
    get_checksum: false
  loop: "{{ range(1, (tp_ro_path.split('/') | length) + 1) | list }}"
  register: _tp_ro_st

- name: Refuse a linked, non-directory, non-root-owned, group- or other-writable existing component
  vars:
    _ex: "{{ _tp_ro_st.results | map(attribute='stat') | selectattr('exists') | list }}"
  ansible.builtin.assert:
    that:
      - _ex | selectattr('islnk') | list | length == 0
      - _ex | rejectattr('isdir') | list | length == 0
      - _ex | rejectattr('uid', 'equalto', 0) | list | length == 0
      - _ex | selectattr('wgrp') | list | length == 0
      - _ex | selectattr('woth') | list | length == 0
    fail_msg: >-
      REFUSED {{ tp_ro_refusal }} on {{ inventory_hostname }}: {{ tp_ro_path }} has an existing component that is a
      link, not a directory, not owned by uid 0, or group/other-writable (root_only rule, fresh at the use boundary):
      {{ (_ex | selectattr('islnk') | map(attribute='path') | list) + (_ex | rejectattr('isdir') | map(attribute='path') | list)
         + (_ex | rejectattr('uid', 'equalto', 0) | map(attribute='path') | list)
         + (_ex | selectattr('wgrp') | map(attribute='path') | list) + (_ex | selectattr('woth') | map(attribute='path') | list) }}
    quiet: true
