---
# Capture exactly one new source-admitted lock. Callers iterate unique rels and seed
# the cache with resolve_policy's already captured builder lock before this helper.
- name: Require an uncaptured source member with the same declared digest algorithm
  ansible.builtin.assert:
    that:
      - _rh_acq_lock_rel not in _rh_acq_locks
      - _rh_acq_lock_rel in rh_src_admission[rh.controller.bootstrap.source_admission.record_fields.members]
      - rh.controller.bootstrap.lock_capture.digest_algorithm == rh.controller.bootstrap.source_admission.digest_algorithm
    fail_msg: "{{ rh.controller.bootstrap.lock_capture.refusal }}"
    quiet: true

- name: Stat the new lock without following links before its sole capture
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_acq_lock_rel }}"
    follow: "{{ rh.controller.bootstrap.lock_capture.verify.follow }}"
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.lock_capture.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  register: _rh_acq_lstat

- name: Admit the lock shape and byte ceiling before its sole read
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.lock_capture.verify.require | select('in', _rh_acq_lstat.stat) | map('extract', _rh_acq_lstat.stat) | select('sameas', true) | length == rh.controller.bootstrap.lock_capture.verify.require | length
      - not _rh_acq_lstat.stat.islnk
      - _rh_acq_lstat.stat.size <= rh.controller.bootstrap.genesis.acquisition.execution.lock_max_bytes
    fail_msg: "{{ rh.controller.bootstrap.lock_capture.refusal }}"
    quiet: true

- name: Read the admitted regular lock once as exact bytes
  ansible.builtin.slurp:
    src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_acq_lock_rel }}"
  register: _rh_acq_lraw

- name: Capture text without stripping and digest the captured bytes once
  ansible.builtin.set_fact:
    _rh_acq_lcap: >-
      {%- set f = rh.controller.bootstrap.genesis.acquisition.execution.fields -%}
      {{ {f.text: _rh_acq_lraw.content | b64decode,
          f.sha256: _rh_acq_lraw.content | b64decode | hash(rh.controller.bootstrap.lock_capture.digest_algorithm)} }}

- name: Require captured bytes to match both this stat and the admitted source member
  ansible.builtin.assert:
    that:
      - _rh_acq_lcap.sha256 == _rh_acq_lstat.stat[rh.controller.bootstrap.lock_capture.verify.digest_field]
      - _rh_acq_lcap.sha256 == rh_src_admission[rh.controller.bootstrap.source_admission.record_fields.members][_rh_acq_lock_rel][rh.controller.bootstrap.source_admission.member_fields.observed]
    fail_msg: "{{ rh.controller.bootstrap.lock_capture.refusal }}"
    quiet: true

- name: Strictly construct the lock rows from the verified capture once
  ansible.builtin.set_fact:
    _rh_acq_lcap: >-
      {%- set f = rh.controller.bootstrap.genesis.acquisition.execution.fields -%}
      {%- set parsed = _rh_acq_lcap.text | lme_manifest_strict(_rh_acq_lock_rel, _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse) -%}
      {{ _rh_acq_lcap | combine({f.packages: parsed.packages | mandatory(rh.controller.bootstrap.lock_capture.refusal),
                                f.collections: parsed.collections | mandatory(rh.controller.bootstrap.lock_capture.refusal)}) }}

- name: Require the declared capture fields and sequence-shaped artifact sets
  ansible.builtin.assert:
    that:
      - _rh_acq_lcap | list | sort == rh.controller.bootstrap.lock_capture.fields | sort
      - _rh_acq_lcap.packages is sequence and _rh_acq_lcap.packages is not string and _rh_acq_lcap.packages is not mapping
      - _rh_acq_lcap.collections is sequence and _rh_acq_lcap.collections is not string and _rh_acq_lcap.collections is not mapping
    fail_msg: "{{ rh.controller.bootstrap.lock_capture.refusal }}"
    quiet: true

- name: Retain the admitted capture for every role and class referencing this lock
  ansible.builtin.set_fact:
    _rh_acq_locks: "{{ _rh_acq_locks | combine({_rh_acq_lock_rel: _rh_acq_lcap}) }}"
