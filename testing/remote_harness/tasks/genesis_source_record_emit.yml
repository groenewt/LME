---
# testing/remote_harness/tasks/genesis_source_record_emit.yml -- GENESIS SOURCE RECORD, phase B, SUCCESSOR 02 (codex-
# tick542 OD-GEN-02 / OD-GEN-09 / GEN-STABLE-GENERATION; codex-tick543 OD-S3-07 / OD-S3-08). NEW FILE. AUTHORED, NEVER
# EXECUTED (every control UNRUN). Supersedes the frozen v1 (73b93e78), not modified.
# SUCCESSOR FINAL-02 (Codex587 finding 2): the acquisition-var list equality is ONE single-quoted scalar (a plain
# scalar starting '[' is a YAML flow sequence and the file did not parse); the expression text is unchanged. Otherwise
# byte-identical to genesis_source_record_emit.after-final.yml (76a40d53; FROZEN, not modified).
# SUCCESSOR 04 (genesis handoff-04; J-GEN3-01 ATOMIC, F05-GEN3-01): the interface grammar equality reads the ONE
# contract source_admission.rel_path_grammar {pattern, refused_components}; rel_path_regex is RETIRED (the only change
# vs after-02 a87cd299).
# SUCCESSOR FINAL (genesis final rebind; on after-04 f8ed14b8, FROZEN, not modified; FS3-Q1 / FS3-Q3): the interface
# equality also covers the selection input name, the flow word -> acquisition_inputs map and the acquisition var list
# (+ acquisition.bundle_var); step 3 branches on the selected flow (the producer's operator stage input, the selection
# input): acquisition_inputs false -> EVERY acquisition var is absent from every inventory / extra var the producer
# sees (operator inventory + lab copy in run_binding_sources); true -> all present, the source var names the entry
# store and the receipt lies outside it (04 behaviour + the bundle var). Both refuse refusals.inventory.
#
# Included ONLY by the generated producer playbook after resolve_policy.yml (the ONE loader; admit_loader_source.yml
# admitted every member and consumed the provisional record under the record var, override LAST) and admit_builder.yml.
#   1. INTERFACE == RESOLVED: every rendered interface value equals the same pointer over the RESOLVED declaration (the
#      rendered copy is the entry render's; this proves it was rendered from THIS declaration).
#   2. GENERATION: the ONE stable generation of the shared recipe (verify_toolchain_receipt.yml, rh_tc_root = R, the
#      inventory owner) is the running builder (interpreter, executable, core, sealed config).
#   3. STORE (OD-GEN-09): the operator inventory's artifact-source host var names the entry's store; its receipt path
#      lies outside the store (the acquire stage reconciles that store warm; separate cold / warm evidence).
#   4. RECORD: rebuilt from the RESOLVED projection through the ONE declared construction map (OD-GEN-02) -- context =
#      the early view the loader projected UNION the launch_context_fields walk; policy fields walked over the resolved
#      node; edition / digest from rh_src_admission through record_fields / bootstrap_fields -- and refused unless it is
#      the provisional record (canonical JSON). Written once {<record var>: record} at the declared mode; read back.
# Requires: rh, rh_src_admission, rh_early_view, rh_builder, _rh_gsr_iface, _rh_gsr_p, _rh_gsr_gen, rh_gen_stage.
# Outputs: the record file and its marker line; rh_toolchain / rh_tc_expected (verify_toolchain_receipt.yml);
# _rh_gsr_* task facts (registry reserved_outputs, F05-GEN2-05).

- name: "GENESIS SOURCE RECORD -- refuse a rendered interface that is not the resolved declaration"
  vars:
    _rh_gsr_rb: "{{ rh.controller.bootstrap }}"
    _rh_gsr_rs: "{{ rh.controller.bootstrap.source_admission }}"
    _rh_gsr_rl: "{{ rh.controller.bootstrap.genesis.launch }}"
    _rh_gsr_rw: "{{ rh.controller.bootstrap.work_roots }}"
    _rh_gsr_i: "{{ _rh_gsr_iface }}"
    _rh_gsr_s: "{{ _rh_gsr_iface.separator }}"
    # the RESOLVED flow word -> acquisition_inputs map (the same walk the producer template rendered)
    _rh_gsr_abf: >-
      {%- set ns = namespace(p=[]) -%}
      {%- for pk, p in rh.controller.bootstrap.genesis.entry.selection.plans | dictsort -%}
      {%- set ns.p = ns.p + [[rh.controller.bootstrap.genesis.entry.selection.flows[pk], p.acquisition_inputs]] -%}
      {%- endfor -%}{{ dict(ns.p) }}
  ansible.builtin.assert:
    that:
      - rh_builder is mapping
      - rh_src_admission is mapping
      - rh_early_view is mapping
      - rh_gen_stage == _rh_gsr_i.stage
      - _rh_gsr_rb.path_admission.separator == _rh_gsr_s
      - _rh_gsr_rb.genesis.source_record.stage == _rh_gsr_i.stage
      - _rh_gsr_rb.genesis.source_record.anchor.var == _rh_gsr_i.anchor_var
      - _rh_gsr_rb.genesis.source_record.output == _rh_gsr_i.output
      - _rh_gsr_rb.genesis.source_record.refusals == _rh_gsr_i.refusals
      - _rh_gsr_rb.genesis.source_record.texts == _rh_gsr_i.texts
      - _rh_gsr_rs.bootstrap_input.var == _rh_gsr_i.record_var
      - _rh_gsr_rl.envelope.record == _rh_gsr_i.record_var
      - (_rh_gsr_rs.bootstrap_input.record_keys | sort) == _rh_gsr_i.record_keys
      - _rh_gsr_rs.bootstrap_input.construction == _rh_gsr_i.construction
      - _rh_gsr_rs.early_view.context_fields == _rh_gsr_i.context_fields
      - _rh_gsr_rs.early_view.launch_context_fields == _rh_gsr_i.launch_context_fields
      - _rh_gsr_rs.early_view.override.var == _rh_gsr_i.override_var
      - _rh_gsr_rs.bootstrap_input.declaration_rel == _rh_gsr_i.declaration_rel
      - _rh_gsr_rs.bootstrap_input.declaration_path == _rh_gsr_i.declaration_path
      - _rh_gsr_rs.controller_delegate == _rh_gsr_i.controller_delegate
      - _rh_gsr_rs.git.edition_regex == _rh_gsr_i.edition_regex
      - _rh_gsr_rb.genesis.entry.digest_regex == _rh_gsr_i.digest_regex
      - _rh_gsr_rs.rel_path_grammar == _rh_gsr_i.rel_path_grammar
      - _rh_gsr_rl.stage_root.act.var == _rh_gsr_i.act_var
      - ([_rh_gsr_rw.root_rel, _rh_gsr_rw.sub_roots[_rh_gsr_rl.stage_root.sub], _rh_gsr_rl.stage_root.rel, _rh_gsr_i.stage] | join(_rh_gsr_s)) == _rh_gsr_i.stage_root
      - _rh_gsr_rb.genesis.builder.core == _rh_gsr_i.builder.core
      - ([_rh_gsr_rw.root_rel, _rh_gsr_rw.sub_roots[_rh_gsr_rb.genesis.builder.root.sub]] | join(_rh_gsr_s)) == _rh_gsr_i.builder.root_rel
      - _rh_gsr_rb.layout.generations_dir == _rh_gsr_i.builder.generations_dir
      - ([_rh_gsr_rb.layout.gen_dirs[_rh_gsr_rb.genesis.builder.python.gen_dir], _rh_gsr_rb.genesis.builder.python.rel] | join(_rh_gsr_s)) == _rh_gsr_i.builder.python_rel
      - ([_rh_gsr_rb.layout.gen_dirs[_rh_gsr_rb.genesis.builder.executable.gen_dir], _rh_gsr_rb.genesis.builder.executable.rel] | join(_rh_gsr_s)) == _rh_gsr_i.builder.executable_rel
      - _rh_gsr_rb.layout.config_file == _rh_gsr_i.builder.config_rel
      - ([_rh_gsr_rw.root_rel, _rh_gsr_rw.sub_roots[_rh_gsr_rb.genesis.entry.store.sub], _rh_gsr_rb.genesis.entry.store.rel] | join(_rh_gsr_s)) == _rh_gsr_i.store_rel
      - _rh_gsr_rb.genesis.acquisition.source_var == _rh_gsr_i.source_var
      - _rh_gsr_rb.genesis.acquisition.receipt_var == _rh_gsr_i.receipt_var
      - _rh_gsr_rb.genesis.entry.selection.input == _rh_gsr_i.flow_input
      - _rh_gsr_rb.genesis.acquisition.bundle_var == _rh_gsr_i.bundle_var
      - '[_rh_gsr_i.source_var, _rh_gsr_i.receipt_var, _rh_gsr_i.bundle_var] == _rh_gsr_i.acquisition_vars'
      - (_rh_gsr_abf | to_json(sort_keys=true)) == (_rh_gsr_i.acquisition_by_flow | to_json(sort_keys=true))
    fail_msg: "{{ _rh_gsr_iface.refusals.interface }}: {{ _rh_gsr_iface.texts.interface }}"
    quiet: true

# GEN-STABLE-GENERATION: the running builder is the verified generation of the shared recipe at R (the seed's own
# recipe, re-derived from a fresh seed render by the existing consumer). The inventory names R and the owner (no default).
- name: "GENESIS SOURCE RECORD -- refuse an inventory toolchain root other than the entry's recipe root R"
  vars:
    _rh_gsr_inv: "{{ rh.controller.bootstrap.inventory }}"
  ansible.builtin.assert:
    that:
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_inv.root_var ~ '$') | length == 1
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_inv.owner_var ~ '$') | length == 1
      - lookup('ansible.builtin.vars', _rh_gsr_inv.root_var) == [rh_repo_root, _rh_gsr_iface.builder.root_rel] | join(_rh_gsr_iface.separator)
      - (_rh_gsr_gen | dirname | dirname) == lookup('ansible.builtin.vars', _rh_gsr_inv.root_var)
    fail_msg: "{{ _rh_gsr_iface.refusals.builder }}: {{ _rh_gsr_iface.texts.builder }} {{ [_rh_gsr_inv.root_var, _rh_gsr_gen] | to_json }}"
    quiet: true

- name: "GENESIS SOURCE RECORD -- verify the stable generation receipt (shared recipe; existing consumer)"
  ansible.builtin.include_tasks: verify_toolchain_receipt.yml
  vars:
    rh_tc_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var) }}"
    rh_tc_owner: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.owner_var) }}"

- name: "GENESIS SOURCE RECORD -- refuse a running builder that is not the verified generation"
  ansible.builtin.assert:
    that:
      - rh_toolchain.generation_dir == _rh_gsr_gen
      - rh_toolchain.generation == (_rh_gsr_gen | basename)
      - rh_toolchain.python == ansible_playbook_python
      - rh_toolchain.ansible_playbook == [_rh_gsr_gen, _rh_gsr_iface.builder.executable_rel] | join(_rh_gsr_iface.separator)
      - rh_toolchain.ansible_config == [_rh_gsr_gen, _rh_gsr_iface.builder.config_rel] | join(_rh_gsr_iface.separator)
      - rh_toolchain.expect_core == ansible_version.full
    fail_msg: "{{ _rh_gsr_iface.refusals.builder }}: {{ _rh_gsr_iface.texts.builder }} {{ [rh_toolchain.generation_dir, _rh_gsr_gen] | to_json }}"
    quiet: true

# FS3-Q1 / FS3-Q3: the selected flow is the producer's operator stage input (selection input; the entry passed exactly
# one typed {name: word}); its word picks acquisition_inputs from the rendered (and above proven) interface.
- name: "GENESIS SOURCE RECORD -- refuse an absent or undeclared flow word"
  ansible.builtin.assert:
    that:
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.flow_input ~ '$') | length == 1
      - lookup('ansible.builtin.vars', _rh_gsr_iface.flow_input) is string
      - lookup('ansible.builtin.vars', _rh_gsr_iface.flow_input) in _rh_gsr_iface.acquisition_by_flow
    fail_msg: "{{ _rh_gsr_iface.refusals.input }}: {{ _rh_gsr_iface.texts.input }} {{ _rh_gsr_iface.flow_input | to_json }}"
    quiet: true

# acquisition_inputs false (measurement): NONE of the acquisition vars is visible to the producer -- not in the
# operator inventory, the lab copy, nor any extra var (FS3-Q3; the run binding never carries one: B join).
- name: "GENESIS SOURCE RECORD -- refuse acquisition inputs in a flow that declares them absent"
  when: not _rh_gsr_iface.acquisition_by_flow[lookup('ansible.builtin.vars', _rh_gsr_iface.flow_input)]
  ansible.builtin.assert:
    that:
      - _rh_gsr_iface.acquisition_vars | select('in', q('ansible.builtin.varnames', '.+')) | list | length == 0
    fail_msg: "{{ _rh_gsr_iface.refusals.inventory }}: {{ _rh_gsr_iface.texts.inventory }} {{ _rh_gsr_iface.acquisition_vars | to_json }}"
    quiet: true

# OD-GEN-09 (acquisition_inputs true): the store is bound through the NORMAL declared inventory producer (the operator
# controller inventory's host vars), never placed by hand: the artifact-source var names the entry's store; the receipt
# path is not inside it; the bundle var is present.
- name: "GENESIS SOURCE RECORD -- refuse an inventory whose artifact source is not the entry store, or whose receipt lies in it"
  when: _rh_gsr_iface.acquisition_by_flow[lookup('ansible.builtin.vars', _rh_gsr_iface.flow_input)]
  vars:
    _rh_gsr_store: "{{ [rh_repo_root, _rh_gsr_iface.store_rel] | join(_rh_gsr_iface.separator) }}"
  ansible.builtin.assert:
    that:
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.bundle_var ~ '$') | length == 1
      - lookup('ansible.builtin.vars', _rh_gsr_iface.bundle_var) is string
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.source_var ~ '$') | length == 1
      - q('ansible.builtin.varnames', '^' ~ _rh_gsr_iface.receipt_var ~ '$') | length == 1
      - lookup('ansible.builtin.vars', _rh_gsr_iface.source_var) == _rh_gsr_store
      - lookup('ansible.builtin.vars', _rh_gsr_iface.receipt_var) is string
      - not (lookup('ansible.builtin.vars', _rh_gsr_iface.receipt_var) ~ _rh_gsr_iface.separator).startswith(_rh_gsr_store ~ _rh_gsr_iface.separator)
    fail_msg: "{{ _rh_gsr_iface.refusals.inventory }}: {{ _rh_gsr_iface.texts.inventory }} {{ [_rh_gsr_iface.source_var, _rh_gsr_store] | to_json }}"
    quiet: true

# THE RESOLVED RECORD through the ONE construction map (the entry's record_format walks the same map at render).
- name: "GENESIS SOURCE RECORD -- build the record from the RESOLVED projection (derived)"
  vars:
    _rh_gsr_rb: "{{ rh.controller.bootstrap }}"
    _rh_gsr_rs: "{{ rh.controller.bootstrap.source_admission }}"
    _rh_gsr_cm: "{{ rh.controller.bootstrap.source_admission.bootstrap_input.construction }}"
  ansible.builtin.set_fact:
    _rh_gsr_r: >-
      {%- set ev = _rh_gsr_rs.early_view -%}
      {%- set cx = namespace(m=rh_early_view[ev.roles.context]) -%}
      {%- for f, kp in ev.launch_context_fields | dictsort -%}
      {%- set w = namespace(n=_rh_gsr_rb) -%}{%- for k in kp -%}{%- set w.n = w.n[k] -%}{%- endfor -%}
      {%- set cx.m = cx.m | combine({f: w.n}) -%}
      {%- endfor -%}
      {%- set ns = namespace(m={}) -%}
      {%- for k, c in _rh_gsr_cm.fields | dictsort -%}
      {%- if c.source == _rh_gsr_cm.sources.context -%}{%- set ns.m = ns.m | combine({k: cx.m}) -%}
      {%- elif c.source == _rh_gsr_cm.sources.policy -%}
      {%- set w = namespace(n=_rh_gsr_rb) -%}{%- for p in c.path -%}{%- set w.n = w.n[p] -%}{%- endfor -%}
      {%- set ns.m = ns.m | combine({k: w.n}) -%}
      {%- elif c.source == _rh_gsr_cm.sources.edition -%}{%- set ns.m = ns.m | combine({k: rh_src_admission[_rh_gsr_rs.record_fields.edition]}) -%}
      {%- elif c.source == _rh_gsr_cm.sources.digest -%}{%- set ns.m = ns.m | combine({k: rh_src_admission[_rh_gsr_rs.record_fields.bootstrap][_rh_gsr_rs.bootstrap_fields.sha256]}) -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.m }}

- name: "GENESIS SOURCE RECORD -- refuse a resolved record that is not the provisional record"
  vars:
    _rh_gsr_ev: "{{ rh.controller.bootstrap.source_admission.early_view }}"
  ansible.builtin.assert:
    that:
      - _rh_gsr_ev.context_fields.keys() | select('in', _rh_gsr_ev.launch_context_fields.keys() | list) | list | length == 0
      - (_rh_gsr_r.keys() | list | sort) == _rh_gsr_iface.record_keys
      - (_rh_gsr_r | to_json(sort_keys=true)) == _rh_gsr_p
      - (lookup('ansible.builtin.vars', _rh_gsr_iface.record_var) | to_json(sort_keys=true)) == _rh_gsr_p
    fail_msg: >-
      {{ _rh_gsr_iface.refusals.projection }}: {{ _rh_gsr_iface.texts.projection }}
      {{ [_rh_gsr_r | to_json(sort_keys=true) | hash('sha256'), _rh_gsr_p | hash('sha256')] | to_json }}
    quiet: true

# OUTPUT: <checkout>/<stage_root>/<act>/<output.record_rel> (the entry created the act dir exclusively; admit_builder
# admitted it). Absent before (never reused, never overwritten), written once at the declared mode, read back.
- name: "GENESIS SOURCE RECORD -- bind the record word and its output path (derived)"
  ansible.builtin.set_fact:
    _rh_gsr_word: "{{ {_rh_gsr_iface.record_var: _rh_gsr_r} | to_json(sort_keys=true) }}"
    _rh_gsr_out: >-
      {{ [rh_repo_root, _rh_gsr_iface.stage_root, lookup('ansible.builtin.vars', _rh_gsr_iface.act_var),
          _rh_gsr_iface.output.record_rel] | join(_rh_gsr_iface.separator) }}

- name: "GENESIS SOURCE RECORD -- observe the output path (no link followed)"
  ansible.builtin.stat:
    path: "{{ _rh_gsr_out }}"
    follow: false
    get_checksum: false
  register: _rh_gsr_pre

- name: "GENESIS SOURCE RECORD -- refuse an existing output (never reused, never overwritten)"
  ansible.builtin.assert:
    that:
      - not _rh_gsr_pre.stat.exists
    fail_msg: "{{ _rh_gsr_iface.refusals.output }}: {{ _rh_gsr_iface.texts.output }} {{ _rh_gsr_out | to_json }}"
    quiet: true

- name: "GENESIS SOURCE RECORD -- write the record word once (declared mode)"
  block:
    - name: "GENESIS SOURCE RECORD -- write"
      ansible.builtin.copy:
        content: "{{ _rh_gsr_word }}"
        dest: "{{ _rh_gsr_out }}"
        mode: "{{ _rh_gsr_iface.output.mode }}"
        force: false
  rescue:
    - name: "GENESIS SOURCE RECORD -- refuse a failed write"
      ansible.builtin.fail:
        msg: "{{ _rh_gsr_iface.refusals.output }}: {{ _rh_gsr_iface.texts.output }} {{ [_rh_gsr_out, ansible_failed_result.msg] | to_json }}"

- name: "GENESIS SOURCE RECORD -- read the written record back (one read)"
  ansible.builtin.slurp:
    src: "{{ _rh_gsr_out }}"
  register: _rh_gsr_back

- name: "GENESIS SOURCE RECORD -- observe the written record (mode, owner, digest; no link followed)"
  ansible.builtin.stat:
    path: "{{ _rh_gsr_out }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.source_admission.digest_algorithm }}"
  register: _rh_gsr_post

- name: "GENESIS SOURCE RECORD -- refuse a record file that is not exactly the written word"
  ansible.builtin.assert:
    that:
      - (_rh_gsr_back.content | b64decode) == _rh_gsr_word
      - _rh_gsr_post.stat.isreg and not _rh_gsr_post.stat.islnk
      - _rh_gsr_post.stat.mode == _rh_gsr_iface.output.mode
      - _rh_gsr_post.stat.uid == rh_builder.uid | int
      - _rh_gsr_post.stat.checksum == (_rh_gsr_word | hash(rh.controller.bootstrap.source_admission.digest_algorithm))
    fail_msg: "{{ _rh_gsr_iface.refusals.output }}: {{ _rh_gsr_iface.texts.output }} {{ _rh_gsr_out | to_json }}"
    quiet: true

- name: "GENESIS SOURCE RECORD -- report the emitted record (marker; the genesis entry reads the file, not this line)"
  ansible.builtin.debug:
    msg: "{{ _rh_gsr_iface.output.marker }} {{ _rh_gsr_post.stat.checksum }} {{ _rh_gsr_out }}"
