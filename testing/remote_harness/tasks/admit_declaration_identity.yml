---
# testing/remote_harness/tasks/admit_declaration_identity.yml -- the ONE record-free EARLY phase of the bound declaration
# (codex-tick628 FR-EARLY-RECORD-PRODUCER; codex-tick630 OD-FR1-08 b "one shared early phase"; new path N2, MAIN
# new-paths-recorded.yml). NEW FILE. AUTHORED, NEVER EXECUTED (UNRUN). SUCCESSOR-03 of the successor-02 after (genesis,
# codex-tick647 cold-entry redirect; change record successor-03/records-n2.yml).
# FACTORED VERBATIM (one algorithm, two callers) from admit_loader_source.yml (frozen base 81b80f2c), ranges recorded by
# MAIN 2026-10-07T08:18Z: :90-152 (read once / digest before parse / parse + select / interface constants / bind
# _rh_sa_decl), the IDENTITY rows of :158-231 (the record rows :162, :166-167, :177-189 and the record key set :70-88 stay
# in admit_loader_source.yml and are C1's: OD-CON-03 :77 / :162), :255-334 (override walk / admission / effective node),
# :345-360 (the effective git / env selection _rh_sa_sel and its equality with the INPUT's tool contract) and :761-766
# (the early context projection _rh_sa_ctx). Only the input name changes: rh_source_bootstrap -> rh_di_input.
# Callers (each passes rh_rp_phase, C1 S6-P-01 resolve_phases; the phase is a declared WORD, compared after the parse):
#   admit_loader_source.yml     rh_di_input = the launch record rh_source_bootstrap (phase full; unchanged semantics);
#   initializer_release.yml     rh_di_input = the cold carrier N9 builds from its declared scalar inputs (phase
#                               record_free; codex-tick647 direct cold entry under admitted A): {edition, declaration_rel,
#                               declaration_sha256, declaration_path} -- NO tools key;
#   initialize.yml              rh_di_input = the initializer root input (genesis.initializer.root_input.var) the released
#                               N7 constructs (phase record_free) -- the same four keys, NO tools key.
# PROVISIONAL (OD-COLD-TOOLS, routed to Codex by MAIN tick683): under record_free the git / env contract is NOT an input;
# it is the selection _rh_sa_sel of the digest-bound declaration itself. The full-phase equality below (input tools ==
# selection) is therefore NOT run under record_free: on that path it would hold by construction (a SELF-CHECK, never an
# independent tool binding). What binds the tools under record_free is (1) the declaration digest, bound OUTSIDE this run
# by MAIN before A parses any project YAML, and (2) the record-free executable stat / hash of admit_loader_source.yml
# against that selection. Until Codex rules, this branch is PROVISIONAL.
# RECORD-FREE: nothing here reads a context, a delegate or the record key set. The tool / member stat and git admission
# (admit_loader_source.yml :362-700) and the carrier / read-back checks (:776-855) stay there; their record-free first pass
# is C1's resolve phase (source_admission.resolve_phases, PROVISIONAL-ON-C1).
# INTERFACE CONSTANTS (inherited verbatim from admit_loader_source.yml :62-63 / :77-83 / :98 / :143-144 / :161 / :165 /
# :190 / :196-197 / :203-204 / :211 / :215 / :221; ledgered there, restated by the declaration and compared after the
# read; NOT new): the input field names, the '/' join before the declaration is readable (ledger: admit_loader_source.yml
# :62-63 + :91-93 + :98), the undecodable class, the two pre-declaration refusal codes and the early_view key sets.
# admit_loader_source.yml :165 (the refusal-code compare) is DELETED there by genesis (OD_ALS_165, records-als.yml): the
# compare below is the ONE home, run on every admit_loader_source.yml entry through this include.
# Input (include parameter; registry reserved_outputs): rh_di_input {edition, declaration_rel, declaration_sha256,
# declaration_path[, tools under full]} and rh_rp_phase. Outputs (facts; registry reserved_outputs): _rh_sa_dst,
# _rh_sa_slurp, _rh_sa_text, _rh_sa_bs, _rh_sa_decl, _rh_sa_ovw, _rh_sa_ov, _rh_sa_eff, _rh_sa_sel, _rh_sa_ctx.
# RE-ENTRANT: every value re-derived on every inclusion.

- name: "SOURCE IDENTITY -- refuse a missing or malformed identity input or phase (no default)"
  ansible.builtin.assert:
    that:
      # op1l (codex 924; no-exemption): every REQUIRED include parameter and identity field is tested by membership
      # (vars / the input mapping) before it is read; the field names are the documented input field names (header :34-35)
      - "'rh_di_input' in vars"
      - rh_di_input is mapping
      - "'declaration_rel' in rh_di_input and rh_di_input.declaration_rel is string"
      - "'declaration_sha256' in rh_di_input and rh_di_input.declaration_sha256 is string"
      - "'declaration_path' in rh_di_input and rh_di_input.declaration_path is sequence and rh_di_input.declaration_path is not string"
      - "'edition' in rh_di_input and rh_di_input.edition is string"
      - "'rh_rp_phase' in vars and rh_rp_phase is string"
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-INPUT: no admitted declaration identity (edition, declaration_rel, declaration_sha256,
      declaration_path) or resolve phase reached this phase; a launch supplies it from its admitted record, the cold
      release entry from its declared scalar inputs, the initializer from the released N7 -- never a default.
    quiet: true

# codex-tick647 cold entry: the declaration is admitted as a REAL REGULAR FILE (no link followed) before its one read
# (slurp follows links). The '/' join is the ledgered interface constant (admit_loader_source.yml :62-63 / :98).
- name: "SOURCE IDENTITY -- stat the bound declaration without following a link (before the one read)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ '/' ~ rh_di_input.declaration_rel }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _rh_sa_dst

- name: "SOURCE IDENTITY -- refuse a bound declaration that is absent, a link or not a regular file"
  ansible.builtin.assert:
    that:
      - _rh_sa_dst.stat.exists
      - not _rh_sa_dst.stat.islnk
      - _rh_sa_dst.stat.isreg
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_di_input.declaration_rel }} is not a regular file
      at its admitted path (absent, a symbolic link or another file type); nothing is read.
    quiet: true

- name: "SOURCE IDENTITY -- read the bound declaration ONCE (read/decode failure refuses)"
  block:
    - name: "SOURCE IDENTITY -- read the bound declaration file (one read)"
      ansible.builtin.slurp:
        src: "{{ rh_repo_root ~ '/' ~ rh_di_input.declaration_rel }}"
      register: _rh_sa_slurp

    - name: "SOURCE IDENTITY -- decode exactly the bytes read (derived; parsed only after the digest binding)"
      ansible.builtin.set_fact:
        _rh_sa_text: "{{ _rh_sa_slurp.content | b64decode }}"
  rescue:
    - name: "SOURCE IDENTITY -- refuse an unreadable or undecodable bound declaration"
      ansible.builtin.fail:
        msg: >-
          REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_di_input.declaration_rel }} could not be
          read or decoded: {{ ansible_failed_result.msg }}

- name: "SOURCE IDENTITY -- refuse declaration bytes that are not the ones the admitted input recorded"
  ansible.builtin.assert:
    that:
      - (_rh_sa_text | hash('sha256')) == rh_di_input.declaration_sha256
      - (_rh_sa_text | b64encode) == _rh_sa_slurp.content
      - _rh_sa_text is not search('[\\udc80-\\udcff]')
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_di_input.declaration_rel }} is not the
      plaintext UTF-8 bytes the input admitted ({{ rh_di_input.declaration_sha256 }}); nothing it declares is consumed.
    quiet: true

- name: "SOURCE IDENTITY -- parse THAT retained value and select the declaration node (parse failure refuses)"
  block:
    - name: "SOURCE IDENTITY -- parse and select (derived)"
      ansible.builtin.set_fact:
        _rh_sa_bs: >-
          {%- set ns = namespace(n=(_rh_sa_text | from_yaml)) -%}
          {%- for k in rh_di_input.declaration_path -%}{%- set ns.n = ns.n[k] -%}{%- endfor -%}{{ ns.n }}
  rescue:
    - name: "SOURCE IDENTITY -- refuse an unparsable bound declaration or an absent declaration node"
      ansible.builtin.fail:
        msg: >-
          REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_di_input.declaration_rel }} did not parse
          to a node at {{ rh_di_input.declaration_path | to_json }}: {{ ansible_failed_result.msg }}

- name: "SOURCE IDENTITY -- refuse a bound node without its declarations (before any is consumed)"
  ansible.builtin.assert:
    that:
      - _rh_sa_bs is mapping
      - _rh_sa_bs.source_admission is mapping
      - _rh_sa_bs.path_admission.separator == '/'
      - _rh_sa_bs.body_domain.undecodable_regex == '[\\udc80-\\udcff]'
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_di_input.declaration_rel }} does not declare
      the source admission, path separator and body domain the bootstrap interface constants restate.
    quiet: true

- name: "SOURCE IDENTITY -- bind the source-admission node of the bound declaration (derived)"
  ansible.builtin.set_fact:
    _rh_sa_decl: "{{ _rh_sa_bs.source_admission }}"

# The resolve phase is a DECLARED word (C1 S6-P-01 source_admission.resolve_phases.words), compared only now that the
# bound declaration is readable. full: the input carries the tool contract; record_free: it never does (OD-COLD-TOOLS,
# PROVISIONAL). Selected by the declared word, never by the presence or absence of a key.
- name: "SOURCE IDENTITY -- refuse an undeclared resolve phase or an input shape that is not that phase's"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.resolve_phases is mapping
      - (_rh_sa_decl.resolve_phases.words.keys() | list | sort) == ['full', 'record_free']
      - rh_rp_phase in (_rh_sa_decl.resolve_phases.words.values() | list)
      - rh_rp_phase != _rh_sa_decl.resolve_phases.words.full or ('tools' in rh_di_input and rh_di_input.tools is mapping)
      - rh_rp_phase != _rh_sa_decl.resolve_phases.words.record_free or 'tools' not in rh_di_input
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [rh_rp_phase, rh_di_input.keys() | list | sort] | to_json }}
    quiet: true

# The IDENTITY rows of admit_loader_source.yml :158-231 (verbatim; rh_source_bootstrap -> rh_di_input). The record rows
# (:162 record key set, :166 delegate, :167 edition grammar of the record, :177-189 the record's context grammar) stay in
# admit_loader_source.yml (C1). :167's edition grammar is an identity fact too and is kept here as well (same expression).
# The input tool-contract rows (:141-144 of the successor-02 after) moved to the full-phase task below.
- name: "SOURCE IDENTITY -- refuse an identity input or interface the bound declaration does not declare"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.digest_algorithm == 'sha256'
      - _rh_sa_decl.bootstrap_input.declaration_rel == rh_di_input.declaration_rel
      - _rh_sa_decl.bootstrap_input.declaration_path == rh_di_input.declaration_path
      - _rh_sa_decl.bootstrap_input.refusals == ['RH-SOURCE-BOOTSTRAP-INPUT', 'RH-SOURCE-BOOTSTRAP-BYTES']
      - rh_di_input.edition is match(_rh_sa_decl.git.edition_regex)
      - _rh_sa_decl.members_rel is sequence and _rh_sa_decl.members_rel | length > 0
      - _rh_sa_decl.loader_rel in _rh_sa_decl.members_rel
      - rh_di_input.declaration_rel in _rh_sa_decl.members_rel
      - (_rh_sa_decl.tool_roles.keys() | list | sort) == ['env', 'git']
      - _rh_sa_decl.tool_roles.values() | reject('in', _rh_sa_bs.os_tools) | list | length == 0
      - _rh_sa_bs.refusal_grammar is mapping
      - _rh_sa_bs.path_admission.separator is string
      - _rh_sa_bs.body_domain is mapping
      - (_rh_sa_decl.early_view.roles.keys() | list | sort) == ['binding', 'context']
      - (_rh_sa_decl.early_view.context_fields.keys() | list | sort) == ['body_domain', 'path_separator', 'refusal_grammar']
      - _rh_sa_decl.early_view.context_fields.values() | reject('sequence') | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | select('string') | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | map('length') | select('equalto', 0) | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | flatten | reject('string') | list | length == 0
      - (_rh_sa_decl.early_view.binding_fields | sort)
        == (['declaration_rel', 'declaration_sha256', 'edition', 'override_paths'] | sort)
      - _rh_sa_decl.early_view.override is mapping
      - (_rh_sa_decl.early_view.override.keys() | list | sort) == ['audit_join', 'audit_root', 'combine', 'layer_root', 'text', 'tunable', 'var']
      - _rh_sa_decl.early_view.override.var is string
      - _rh_sa_decl.early_view.override.audit_root is string
      - _rh_sa_decl.early_view.override.audit_join is string
      - (_rh_sa_decl.early_view.override.combine.keys() | list | sort) == ['list_merge', 'recursive']
      - _rh_sa_decl.early_view.override.layer_root is sequence and _rh_sa_decl.early_view.override.layer_root is not string
      - _rh_sa_decl.early_view.override.layer_root | length > 0
      - _rh_sa_decl.early_view.override.layer_root | reject('string') | list | length == 0
      - (rh_di_input.declaration_path | length) > (_rh_sa_decl.early_view.override.layer_root | length)
      - rh_di_input.declaration_path[:(_rh_sa_decl.early_view.override.layer_root | length)] == _rh_sa_decl.early_view.override.layer_root
      - (rh_di_input.declaration_path[(_rh_sa_decl.early_view.override.layer_root | length):] + ['os_tools'])
        == _rh_sa_bs.target_prereq.observation.override_path
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [rh_di_input.declaration_rel, rh_di_input.edition] | to_json }}
    quiet: true

- name: "SOURCE IDENTITY -- refuse an input tool contract whose shape is not the declared roles (full phase only)"
  ansible.builtin.assert:
    that:
      - (rh_di_input.tools.keys() | list | sort) == (_rh_sa_decl.tool_roles.keys() | list | sort)
      - rh_di_input.tools.values() | reject('mapping') | list | length == 0
      - rh_di_input.tools.values() | map('list') | map('sort') | unique(case_sensitive=true) | list
        == [[_rh_sa_decl.tool_fields.path, _rh_sa_decl.tool_fields.sha256] | sort]
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [rh_di_input.declaration_rel, rh_di_input.edition] | to_json }}
    quiet: true
  when: rh_rp_phase == _rh_sa_decl.resolve_phases.words.full

# admit_loader_source.yml :255-334 VERBATIM (r2k / r2l override layer at its own root; rh_source_bootstrap -> rh_di_input).
- name: "SOURCE IDENTITY -- walk the override layer at its own root (derived; shape recorded, nothing consumed yet)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
    _rh_sa_has: "{{ (q('ansible.builtin.varnames', '^' ~ _rh_sa_decl.early_view.override.var ~ '$') | length) > 0 }}"
    _rh_sa_ovr: "{{ lookup('ansible.builtin.vars', _rh_sa_decl.early_view.override.var) if _rh_sa_has else {} }}"
  ansible.builtin.set_fact:
    _rh_sa_ovw: >-
      {%- set rel = rh_di_input.declaration_path[(_rh_sa_ovd.layer_root | length):] -%}
      {%- set ns = namespace(n=_rh_sa_ovr, present=true, bad=false) -%}
      {%- for k in rel -%}
      {%- if ns.present -%}
      {%- if ns.n is mapping -%}
      {%- if k in ns.n -%}{%- set ns.n = ns.n[k] -%}{%- else -%}{%- set ns.present = false -%}{%- endif -%}
      {%- else -%}{%- set ns.bad = true -%}{%- set ns.present = false -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if ns.present and ns.n is not mapping -%}{%- set ns.bad = true -%}{%- endif -%}
      {{ {'layer_mapping': _rh_sa_ovr is mapping,
          'nested': (_rh_sa_ovr is mapping and (_rh_sa_ovd.layer_root | first) in _rh_sa_ovr),
          'bad': ns.bad,
          'rel': rel,
          'sub': (ns.n if (ns.present and not ns.bad) else {})} }}

- name: "SOURCE IDENTITY -- refuse an override layer that is malformed or reaches an undeclared early path (before any tool use)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
    _rh_sa_sub: "{{ _rh_sa_ovw.sub }}"
    _rh_sa_leaves: >-
      {%- macro walk(n, p) -%}{%- if n is mapping and n | length > 0 -%}{%- for k, v in n.items() -%}{{ walk(v, p + [k]) }}{%- endfor -%}
      {%- else -%}{{ p | to_json }}{{ '\n' }}{%- endif -%}{%- endmacro -%}
      {{ (walk(_rh_sa_sub, []) if _rh_sa_sub | length > 0 else '').split('\n') | reject('equalto', '') | map('from_json') | list }}
    _rh_sa_off: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for l in _rh_sa_leaves -%}{%- set hit = namespace(v=false) -%}
      {%- for t in _rh_sa_ovd.tunable -%}{%- if l[:(t | length)] == t -%}{%- set hit.v = true -%}{%- endif -%}{%- endfor -%}
      {%- if not hit.v -%}{%- set ns.o = ns.o + [l] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_sa_ovd.tunable is sequence and _rh_sa_ovd.tunable is not string
      - _rh_sa_ovd.tunable | reject('sequence') | list | length == 0
      - _rh_sa_ovd.tunable | select('string') | list | length == 0
      - _rh_sa_ovd.tunable | map('length') | select('equalto', 0) | list | length == 0
      - _rh_sa_ovd.tunable | map('first') | select('equalto', 'source_admission') | list | length == 0
      - _rh_sa_ovw is mapping
      - _rh_sa_ovw.rel == rh_di_input.declaration_path[(_rh_sa_ovd.layer_root | length):]
      - _rh_sa_ovw.layer_mapping
      - not _rh_sa_ovw.nested
      - not _rh_sa_ovw.bad
      - _rh_sa_sub is mapping
      - _rh_sa_off | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.early_view.refusal }}: {{ _rh_sa_decl.early_view.override.text }}
      {{ [_rh_sa_ovw.rel, _rh_sa_ovw.layer_mapping, _rh_sa_ovw.nested, _rh_sa_ovw.bad, _rh_sa_off] | to_json }}
    quiet: true

- name: "SOURCE IDENTITY -- bind the EFFECTIVE bound node (profile node + admitted override layer at its own root; derived, re-derived on every entry)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
  ansible.builtin.set_fact:
    _rh_sa_ov: "{{ _rh_sa_ovw.sub }}"
    _rh_sa_eff: >-
      {{ _rh_sa_bs | combine(_rh_sa_ovw.sub, recursive=_rh_sa_ovd.combine.recursive, list_merge=_rh_sa_ovd.combine.list_merge) }}

- name: "SOURCE IDENTITY -- refuse an effective node without the selected declarations (after composition)"
  ansible.builtin.assert:
    that:
      - _rh_sa_eff.source_admission == _rh_sa_decl
      - _rh_sa_decl.tool_roles.values() | reject('in', _rh_sa_eff.os_tools) | list | length == 0
      - _rh_sa_eff.refusal_grammar is mapping
      - _rh_sa_eff.path_admission.separator is string
      - _rh_sa_eff.body_domain is mapping
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.early_view.refusal }}: {{ _rh_sa_decl.early_view.override.text }}
      {{ [rh_di_input.declaration_rel, _rh_sa_ov] | to_json }}
    quiet: true

# admit_loader_source.yml :345-360 (the selection is now a FACT: admit_loader_source.yml, initialize.yml and
# initializer_release.yml read it). Under record_free it IS the tool contract (OD-COLD-TOOLS, PROVISIONAL).
- name: "SOURCE IDENTITY -- bind the EFFECTIVE git / env selection (derived)"
  ansible.builtin.set_fact:
    _rh_sa_sel: >-
      {%- set ns = namespace(m={}) -%}
      {%- for role, key in _rh_sa_decl.tool_roles.items() -%}
      {%- set ns.m = ns.m | combine({role: {_rh_sa_decl.tool_fields.path: _rh_sa_eff.os_tools[key].path,
                                            _rh_sa_decl.tool_fields.sha256: _rh_sa_eff.os_tools[key].identity.sha256}}) -%}
      {%- endfor -%}{{ ns.m }}

# Full phase only: the launch record's tool contract is an INPUT and must equal the selection. Not run under record_free,
# where it would be a self-check (OD-COLD-TOOLS, PROVISIONAL; never presented as an independent tool binding).
- name: "SOURCE IDENTITY -- refuse a selected git / env contract that is not the admitted input's (before first use; full phase)"
  ansible.builtin.assert:
    that:
      - (_rh_sa_sel | to_json(sort_keys=true)) == (rh_di_input.tools | to_json(sort_keys=true))
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.tool }}: {{ _rh_sa_decl.texts.tool }}
      {{ [_rh_sa_sel, rh_di_input.tools] | to_json }}
    quiet: true
  when: rh_rp_phase == _rh_sa_decl.resolve_phases.words.full

# admit_loader_source.yml :761-766 (the early verifier context, projected from the EFFECTIVE node; now a fact).
- name: "SOURCE IDENTITY -- project the early verifier context from the effective declaration (derived)"
  ansible.builtin.set_fact:
    _rh_sa_ctx: >-
      {%- set ns = namespace(m={}) -%}
      {%- for f, kp in _rh_sa_decl.early_view.context_fields.items() -%}
      {%- set nn = namespace(n=_rh_sa_eff) -%}{%- for k in kp -%}{%- set nn.n = nn.n[k] -%}{%- endfor -%}
      {%- set ns.m = ns.m | combine({f: nn.n}) -%}
      {%- endfor -%}{{ ns.m }}
# FROZEN, no further writes
