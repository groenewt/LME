- name: Admit the complete declared observation subject before filesystem reads
  ansible.builtin.assert:
    that:
    - rh_ar_subject is mapping
    - (rh_ar_subject | list | sort) == (rh_ar_contract.subject_fields | sort)
    - rh_ar_subject.root is string
    - rh_ar_subject.root is match(rh_ar_contract.root_regex)
    - rh_ar_subject.root is not search(rh_ar_contract.forbidden_segments)
    - rh_ar_subject.owner is match(rh_ar_contract.root_owner_regex)
    - rh_ar_subject.generation_dir == ([rh_ar_subject.root, rh_ar_contract.generations_rel, rh_ar_subject.generation] | join(rh_ar_contract.separator))
    - rh_ar_subject.legacy_sha256 is match(rh_ar_contract.digest_pattern)
    - rh_ar_subject.seed_sha256 is match(rh_ar_contract.digest_pattern)
    - rh_ar_subject.expected_paths is mapping
    - (rh_ar_subject.expected_paths | list | sort) == (rh_ar_contract.path_fields | sort)
    - rh_ar_subject.critical_files is mapping
    - (rh_ar_subject.critical_files | list | sort) == (rh_ar_contract.critical_fields | sort)
    - rh_ar_subject.sealed_members | length > rh_ar_contract.zero
    - rh_ar_subject.observation_files[rh_ar_contract.observation_roles.tree_manifest].path == rh_ar_subject.generation_dir ~ rh_ar_contract.separator
      ~ rh_ar_contract.tree_manifest_rel
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.subject }}'
    quiet: true
- name: Observe current nonroot uid with the admitted tool
  ansible.builtin.command:
    argv: '{{ [rh_ar_tools.id.path] + rh_ar_contract.id_args }}'
  register: _rh_ar_uid
  changed_when: false
- name: Admit the exact root ancestry through the existing shared ancestry task
  ansible.builtin.include_tasks: '{{ rh_ar_context.source.checkout ~ rh_ar_contract.separator ~ rh_ar_contract.ancestry_task_rel }}'
  vars:
    rh_anc_bs: '{{ rh_ar_bootstrap }}'
    rh_anc_repo_root: '{{ rh_ar_context.source.checkout }}'
    rh_anc_path: '{{ rh_ar_subject.root }}'
    rh_anc_refusal: '{{ rh_ar_contract.refusal }}'
- name: Stat the installation root and declared traversed directories before reading
  ansible.builtin.stat:
    path: '{{ item }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ [rh_ar_subject.root, rh_ar_subject.root ~ rh_ar_contract.separator ~ rh_ar_contract.generations_rel, rh_ar_subject.generation_dir,
    rh_ar_subject.generation_dir ~ rh_ar_contract.separator ~ rh_ar_contract.receipts_rel] }}'
  register: _rh_ar_dirs
- name: Refuse foreign linked or writable installation directories
  ansible.builtin.assert:
    that:
    - (_rh_ar_uid.stdout | int) >= rh_ar_contract.uid_minimum
    - _rh_ar_dirs.results | map(attribute='stat') | selectattr('exists') | selectattr('isdir') | list | length == _rh_ar_dirs.results | length
    - _rh_ar_dirs.results | map(attribute='stat') | selectattr('islnk') | list | length == rh_ar_contract.zero
    - _rh_ar_dirs.results | map(attribute='stat') | map(attribute='uid') | unique | list == [_rh_ar_uid.stdout | int]
    - _rh_ar_dirs.results | map(attribute='stat') | map(attribute='pw_name') | unique | list == [rh_ar_subject.owner]
    - _rh_ar_dirs.results | map(attribute='stat') | selectattr('wgrp') | list | length == rh_ar_contract.zero
    - _rh_ar_dirs.results | map(attribute='stat') | selectattr('woth') | list | length == rh_ar_contract.zero
    - (_rh_ar_dirs.results | first).stat.mode == rh_ar_contract.root_mode
    - (_rh_ar_dirs.results | last).stat.mode == rh_ar_contract.directory_mode
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.custody }}'
    quiet: true
- name: Stat every source-bound legacy observation and critical installed file
  ansible.builtin.stat:
    path: '{{ item.value.path }}'
    follow: false
    get_checksum: true
    checksum_algorithm: '{{ rh_ar_contract.digest }}'
    get_mime: false
    get_attributes: false
  loop: '{{ (rh_ar_subject.observation_files | combine(rh_ar_subject.critical_files)) | dict2items }}'
  register: _rh_ar_files
- name: Bind exact observed custody and independently supplied source pins
  ansible.builtin.assert:
    that:
    - item.stat.exists
    - item.stat.isreg
    - not item.stat.islnk
    - item.stat.uid == (_rh_ar_uid.stdout | int)
    - not item.stat.wgrp
    - not item.stat.woth
    - item.stat.checksum == item.item.value.sha256
    - item.stat.mode == item.item.value.mode
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.identity }} {{ item.item.key }}'
    quiet: true
  loop: '{{ _rh_ar_files.results }}'
- name: Capture admitted legacy receipt and manifest bytes once
  ansible.builtin.slurp:
    src: '{{ item.value.path }}'
  loop: '{{ rh_ar_subject.observation_files | dict2items }}'
  register: _rh_ar_reads
- name: Check captured bytes against the exact observations before parsing
  ansible.builtin.assert:
    that:
    - (item.content | b64decode | hash(rh_ar_contract.digest)) == item.item.value.sha256
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.changed_read }} {{ item.item.key }}'
    quiet: true
  loop: '{{ _rh_ar_reads.results }}'
- name: Bind retained observation texts without rereading their paths
  ansible.builtin.set_fact:
    _rh_ar_texts: '{{ dict((_rh_ar_reads.results | map(attribute=''item.key'') | list) | zip(_rh_ar_reads.results | map(attribute=''content'')
      | map(''b64decode'') | list)) }}'
- name: Strict parse the exact pinned legacy receipt using the existing parser
  ansible.builtin.set_fact:
    _rh_ar_origin: '{{ _rh_ar_texts[rh_ar_contract.observation_roles.active] | lme_manifest_strict(rh_ar_subject.observation_files[rh_ar_contract.observation_roles.active].path,
      rh_ar_contract.parse) }}'
- name: Validate legacy shape and independent installation expectations
  ansible.builtin.assert:
    that:
    - (_rh_ar_origin | lme_render_record(rh_ar_record_schemas, rh_ar_serialization, rh_ar_yaml_tags, rh_ar_contract.legacy_record)) is string
    - _rh_ar_texts[rh_ar_contract.observation_roles.active] == _rh_ar_texts[rh_ar_contract.observation_roles.sealed]
    - (_rh_ar_texts[rh_ar_contract.observation_roles.active] | hash(rh_ar_contract.digest)) == rh_ar_subject.legacy_sha256
    - _rh_ar_origin.schema == rh_ar_contract.legacy_schema
    - _rh_ar_origin.root == rh_ar_subject.root
    - _rh_ar_origin.generation == rh_ar_subject.generation
    - _rh_ar_origin.generation_dir == rh_ar_subject.generation_dir
    - _rh_ar_origin.owner_uid == (_rh_ar_uid.stdout | int)
    - _rh_ar_origin.owner_name == rh_ar_subject.owner
    - _rh_ar_origin.seed_sha256 == rh_ar_subject.seed_sha256
    - _rh_ar_texts[rh_ar_contract.observation_roles.pointer].splitlines() == [rh_ar_subject.generation]
    - _rh_ar_texts[rh_ar_contract.observation_roles.complete].splitlines() == [rh_ar_subject.generation]
    - _rh_ar_origin.expect_core == rh_ar_context.dependencies.expect_core
    - _rh_ar_origin.python_version == rh_ar_context.dependencies.python_version
    - _rh_ar_origin.python_install_mode == rh_ar_context.dependencies.python_install_mode
    - _rh_ar_origin.uv_version == rh_ar_context.dependencies.uv_version
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.legacy }}'
    quiet: true
- name: Compare each expected path independently of receipt supplied locations
  ansible.builtin.assert:
    that:
    - _rh_ar_origin[item.key] == item.value
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.path }} {{ item.key }}'
    quiet: true
  loop: '{{ rh_ar_subject.expected_paths | dict2items }}'
- name: Compare each sealed content digest with its observed file
  ansible.builtin.assert:
    that:
    - _rh_ar_origin[item.key] == item.value.sha256
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.identity }} {{ item.key }}'
    quiet: true
  loop: '{{ rh_ar_subject.critical_files | dict2items }}'
- name: Confine every manifest member before checksum traversal
  ansible.builtin.assert:
    that:
    - _rh_ar_texts[rh_ar_contract.observation_roles.tree_manifest].splitlines() | reject('match', rh_ar_contract.manifest_member_pattern.replace(rh_ar_contract.manifest_roots_placeholder,
      (rh_ar_subject.sealed_members | map('regex_escape') | join(rh_ar_contract.pattern_alternative)))) | list | length == rh_ar_contract.zero
    - _rh_ar_texts[rh_ar_contract.observation_roles.tree_manifest].splitlines() | map('regex_replace', rh_ar_contract.digest_prefix_pattern, rh_ar_contract.empty_text)
      | select('search', rh_ar_contract.forbidden_segments) | list | length == rh_ar_contract.zero
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.manifest }}'
    quiet: true
- name: Reenumerate the actual sealed tree through the existing declared tool
  ansible.builtin.command:
    argv: '{{ [rh_ar_tools.find.path] + rh_ar_contract.find_args + rh_ar_subject.sealed_members + rh_ar_contract.find_format }}'
    chdir: '{{ rh_ar_subject.generation_dir }}'
  environment: '{{ rh_ar_contract.environment }}'
  register: _rh_ar_tree_now
  changed_when: false
- name: Compare complete type mode size and link roster and exact regular file membership
  ansible.builtin.assert:
    that:
    - (_rh_ar_tree_now.stdout_lines | sort) == _rh_ar_texts[rh_ar_contract.observation_roles.tree_list].splitlines()
    - (_rh_ar_texts[rh_ar_contract.observation_roles.tree_manifest].splitlines() | map('regex_replace', rh_ar_contract.digest_prefix_pattern,
      rh_ar_contract.empty_text) | sort) == (_rh_ar_tree_now.stdout_lines | select('match', rh_ar_contract.tree_regular_pattern) | map('regex_replace',
      rh_ar_contract.tree_regular_extract, rh_ar_contract.tree_regular_replacement) | sort)
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.tree }}'
    quiet: true
- name: Rehash every sealed regular file against the captured confined manifest
  ansible.builtin.command:
    argv: '{{ [rh_ar_tools.sha256sum.path] + rh_ar_contract.sha_check_args }}'
    chdir: '{{ rh_ar_subject.generation_dir }}'
    stdin: '{{ _rh_ar_texts[rh_ar_contract.observation_roles.tree_manifest] }}'
    stdin_add_newline: false
  environment: '{{ rh_ar_contract.environment }}'
  changed_when: false
