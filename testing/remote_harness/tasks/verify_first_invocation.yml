---
# testing/remote_harness/tasks/verify_first_invocation.yml -- the EXECUTED-BIND VERIFIER of the projector's first
# invocation (codex 916 (3) D916-EXECUTION-BINDING; 917 SR917-SEED-RUN-BASE-CASE / SR917-OVERRIDE-CARRIAGE; 822
# B-E2-FIRST-OCCURRENCE-CLOSURE). NEW FILE (B op1d). AUTHORED, NEVER EXECUTED (UNRUN).
# Change record: b/op1d-projector/records-b-op1d-projector-01.yml.
# op1f (C1 s37 first_invocation.verifier_rel :1233 / executed_bind :1234; CPL-SR919B-B-SINGLE-INCLUDE; route op1g
# CPL-OP1G-B-VERIFIER-READS / -PENDING-CLEAR; route op1h 5fe4d50b line numbers): reached ONLY at its declared
# verifier_rel, included ONCE by route's admit_record_free_entry (ARFE op1h :712-713) as the executed_bind consumer,
# after admit_builder (ARFE op1h :652); ARFE refuses a still-pending field at :715-724 and only then sets the completed
# row marker (row.admission, _rh_clp_adm) at :726-736. CPL-OP1H-B-NO-MARKER-READ: this file never reads that marker
# (its measured admission is the task var _rh_vfi_adm). The projector entry no longer includes it (op1e :97 removed).
# (The op1g line numbers below -- :34 / :355 / :405 / :419 / :549 -- are unchanged in op1h.)
# It reads only facts ARFE bound (directly or through the steps it includes: resolve_policy ARFE :34 -> _rh_sa_decl /
# _rh_sa_reg / _rh_sa_regadm / _rh_sa_caller; _rh_x2_doc ARFE :355; _rh_x2_pending ARFE :549; admit_builder -> _rh_bld_a)
# plus the override state _rh_rf_ovs ARFE reads at :405 / :419 (bound by admit_cold_launch op1g :126), the run's own
# observations (ansible_* magic vars, the process environment, the launch -e values) and rh / rh_repo_root. It includes
# nothing. Its LAST task clears the verified field from _rh_x2_pending, only after every assertion passed.
# op1f change record: b/op1f-projector/records-b-op1f-projector-01.yml (cp -n of op1e d332fabc, then Edit).
# op1g (B; cp -n of op1f 32f23efd, then Edit; change record b/op1g-projector/records-b-op1g-projector-01.yml; route op1i
# ARFE 19f61c14, CPL-OP1I-B-ANCHOR-SHIFT): the op1h anchors above shifted by +42 and nothing was renamed -- the ONE
# include is ARFE op1i :754-755, after admit_builder :694; the still-pending refusal is :757-766; the completed marker
# is set at :768-778 (still never read here, CPL-OP1H-B-NO-MARKER-READ); the pending set is held at :547-555; the
# resolve_policy include :33-34 / _rh_x2_doc :355 / override reads :405 / :419 are unchanged. CPL-OP1G-B-VERIFIER-READS
# (reworded): this file reads only facts the admission chain (admit_cold_launch + admit_record_free_entry) bound --
# _rh_rf_ovs is bound by admit_cold_launch (op1i ACL :125-130; reserved at r25 :6985), the rest as listed above.
# The env -i pair separator is genesis.launch.env_pair_separator (C1 sr922b; HOLE-B-OP1F-ENV-PAIR-SEP closed).
# (op1d/op1e text, superseded for the include site:) Included by cold_launch_projection.yml right after the route join
# admitted the X2 record (admit_record_free_entry: _rh_x2_doc, _rh_sa_regadm, builder A _rh_bld_a), before ANY output.
# WHAT IT PROVES: the vector the X2 writer recorded in the record field whose bind kind is `executed` (C1 s34
# provenance.binds.invocation [{kind: executed, ref: first_invocation}]) is EXACTLY the vector this process runs as,
# rebuilt here word by word from the declared form (first_invocation.exec_form_from = genesis.launch.argv) and what the
# run OBSERVES -- never from a projector output and never copied from the record:
#   env_pairs        <name>=<observed env value> per genesis.launch.env.order (admit_builder admits each value against
#                    its declared class; here the recorded words must be the environment this process received)
#   builder          A's executable (_rh_bld_a.executable: <A root>/<generations_dir>/<receipt generation>/<gen_dir>/
#                    <rel>, receipt-bound by verify_toolchain_receipt) and this process runs A's python
#   inventory_args   inventory_flag + each observed inventory source (exactly the stage's ONE kind, admitted earlier)
#   act pair         the act var and its value
#   stage_extra_vars extra_vars_flag (a work_roots.run_local.arg_flags member) + <name>=<value> per stage extra var, then
#                    the override carriage tail in state present (pair in pair_from order, then the layer flag +
#                    layer.prefix + <path>: composed LAST by resolve.yml, override_carriage.layer.composition)
#   stage_inputs     the stage row (none)
#   playbook         <checkout>/<entry_rel> (op1e: the declared projector entry rel, NOT the include caller literal;
#                    codex 919 / s13 join (2): the playbook word of the X2-admitted vector names exactly that file)
#   source_record    op1e: the PROJECTOR CARRIER (C1 s35 lists.carrier, FINAL): per carrier.order [admission,
#                    companions], extra_vars_flag + ONE typed JSON: {<admission var>: {entry_rel, entry_sha256,
#                    registry_sha256, document_parse, companions}} then the flat companion map; var names only through
#                    the s35 carrier.roles paths inside output.ingress; every admission field MEASURED here
# op1e change record: b/op1e-projector/records-b-op1e-projector-01.yml (cp -n of op1d cf330ca7, then Edit). The
# executable binding BEFORE launch (codex 919 SR918_ACTUAL_EXECUTION_BINDING) is the X2 writer step
# tasks/x2_bind_exec_vector.yml; this file is its in-process recheck (after the resolve, before any output).
# CAPTURES: each captured_inputs role {path, sha256} recorded before the exec (PROPOSED record field, C1-SR917-W-CAPTURED)
# equals the bytes this run measures now (a changed file refuses). OVERRIDE (state present): the captured layer digest
# equals the admitted sha256 input and the layer's RESOLVED effect is present: the layer var is bound and equals the
# layer document's value of that var (absent: the layer var is not bound). Diagnostics: code, locator, field names only.

- name: Stat the captured first-invocation inputs this run reads (A executable, inventory, override layer; no link followed)
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
  # s34 captured_inputs: a_receipt (the X1 A receipt, route _rh_x2_arp form), executable, inventory, override_layer
  loop: >-
    {{ [lme_resolved[_lme_global_file.lme_config_registry.remote_harness_schema.policy_key][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.to][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.fields.receipt]]
       + [_rh_bld_a.executable] + ansible_inventory_sources
       + ([lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[rh.controller.bootstrap.genesis.initializer.custody.external_invocation.override_carriage.capture.role])]
          if _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present
          else rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) }}
  register: _rh_vfi_st

# SR918: the RUNNING entry and the registry this run parsed, measured (no link followed) -- each must be the X2-admitted
# closure row the carrier's admission member carries (route enforces the same pre-parse; this is defense in depth).
- name: Stat the running entry and the admitted registry (measured identities; no link followed)
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
  loop:
    - "{{ _rh_sa_regadm.ingress.carriers.projector.entry_rel }}"
    - "{{ _rh_sa_regadm.ingress.registry_rel }}"
  register: _rh_vfi_id

- name: Refuse a first invocation that is not exactly the recorded, captured, executed vector (before any output)
  vars:
    xi: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation }}"
    fi: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.first_invocation }}"
    oc: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.override_carriage }}"
    l: "{{ rh.controller.bootstrap.genesis.launch }}"
    rows: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows }}"
    _rh_vfi_present: "{{ _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present }}"
    # the record field whose binds carry the executed kind (C1 s34 binds.invocation)
    _rh_vfi_field: >-
      {%- set ns = namespace(f=rows) -%}
      {%- for f, bl in xi.envelope_projection.provenance.binds | dictsort -%}
      {%- if (bl | selectattr(xi.envelope_projection.provenance.bind_fields.kind, 'equalto', xi.bind_kinds.executed) | list) != rows -%}{%- set ns.f = ns.f + [f] -%}{%- endif -%}
      {%- endfor -%}{{ ns.f }}
    # the provenance refusal code walked at refusal_from (metadata-only diagnostics, 916 (4))
    _rh_vfi_code: >-
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in xi.envelope_projection.provenance.refusal_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    # the walked first-invocation form (must be the declared launch argv form)
    _rh_vfi_form: >-
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in fi.exec_form_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_vfi_stage: "{{ l.stages[xi.envelope_projection.stage] }}"
    _rh_vfi_flag: "{{ l.extra_vars_flag }}"
    # op1e (C1 s35 FINAL carrier, sr918_reconcile_c1; codex 919): the projector CARRIER (s35 first_invocation.lists
    # .carrier, source_record: carrier) -- the FINAL extra_vars_flag pairs, ONE typed JSON each, in carrier.order
    # [admission, companions]. NO var name is written here: each var is the walk of its carrier.roles path inside the
    # ingress declaration route returns as output.ingress (_rh_sa_regadm.ingress). Every admission field is MEASURED
    # here, never copied from the record or the supplied var:
    #   entry_rel        the declared projector entry (carrier.admission.entry_from), == the running caller rel
    #   entry_sha256     the measured bytes of <checkout>/<entry_rel> (also the X2 closure row of that rel)
    #   registry_sha256  the measured bytes of the declaration registry_rel (also the X2 record registry field and the
    #                    X2 closure row and the cold registry input)
    #   document_parse   the parse_at node of the registry bytes captured ONCE here, strictly parsed (lme_manifest_strict)
    #   companions       the run_local rule (target = full-match capture of run_local.inventory by the registry pattern
    #                    named by run_local.pattern_roles.target; connection = run_local.connection), keyed by the
    #                    target / connection role vars; the supplied companion vars must equal it
    _rh_vfi_cr: "{{ fi.lists[fi.lists.source_record] }}"
    # the X2 record closure field (the admission entry_sha256 source word) and its row shape [rel, sha256]
    _rh_vfi_clf: "{{ fi.lists[fi.lists.source_record].admission.sources.entry_sha256 }}"
    _rh_vfi_cls: "{{ xi.source_admission.record.field_shapes[_rh_vfi_clf] }}"
    # role -> var, walked inside output.ingress (s35 carrier.roles)
    _rh_vfi_rv: >-
      {%- set ns = namespace(p=rows) -%}
      {%- for r, path in fi.lists[fi.lists.source_record].roles | dictsort -%}
      {%- set w = namespace(v=_rh_sa_regadm.ingress) -%}{%- for k in path -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
      {%- set ns.p = ns.p + [[r, w.v]] -%}{%- endfor -%}{{ dict(ns.p) }}
    _rh_vfi_entry_rel: >-
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in fi.lists[fi.lists.source_record].admission.entry_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    # the registry bytes captured ONCE (no strip), digested and strictly parsed from that same text
    _rh_vfi_rtext: "{{ lookup('ansible.builtin.file', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_sa_regadm.ingress.registry_rel, rstrip=false) }}"
    _rh_vfi_dp: >-
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in rh.controller.bootstrap.source_admission.early_view.launch_context_fields.document_parse -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_vfi_rparse: >-
      {%- set w = namespace(v=(_rh_vfi_rtext | lme_manifest_strict(_rh_sa_regadm.ingress.registry_rel, _rh_vfi_dp))) -%}
      {%- for k in _rh_sa_regadm.ingress.registry_root + _rh_sa_regadm.ingress.parse_at -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    # companions by the run_local rule (s35 carrier.companions), in companion_roles order
    _rh_vfi_comp: >-
      {%- set cc = fi.lists[fi.lists.source_record].companions -%}
      {%- set bs = rh.controller.bootstrap -%}
      {%- set w = namespace(roles=bs) -%}
      {%- for k in cc.roles_from -%}{%- set w.roles = w.roles[k] -%}{%- endfor -%}
      {%- set ns = namespace(p=rows) -%}
      {%- for role in w.roles -%}
      {%- set v = namespace(v=bs, pr=bs) -%}{%- for k in cc[role].from -%}{%- set v.v = v.v[k] -%}{%- endfor -%}
      {#- a role with a pattern role: the full-match capture of the walked value by that registry pattern; the group is
          the declared s37 run_local.pattern_groups[<pattern role subject>] (op1f; R-OP1E-CAPTURE-GROUP closed). The
          group list is [whole match] + the captured groups, so the declared group number indexes it directly (group 0
          is the whole match, as in the regex engine); no group literal. -#}
      {%- if 'pattern_role_from' in cc[role] -%}
      {%- for k in cc[role].pattern_role_from -%}{%- set v.pr = v.pr[k] -%}{%- endfor -%}
      {%- set pat = _rh_sa_regadm.ingress.fullmatch_wrap.open ~ _rh_sa_reg.patterns[v.pr] ~ _rh_sa_regadm.ingress.fullmatch_wrap.close -%}
      {%- set g = namespace(l=[v.v | regex_search(pat)]) -%}
      {%- for x in v.v | regex_findall(pat) -%}{%- if x is string -%}{%- set g.l = g.l + [x] -%}{%- else -%}{%- set g.l = g.l + (x | list) -%}{%- endif -%}{%- endfor -%}
      {%- set v.v = g.l[bs.work_roots.run_local.pattern_groups[cc[role].pattern_role_from | last]] -%}
      {%- endif -%}
      {%- set ns.p = ns.p + [[_rh_vfi_rv[role], v.v]] -%}{%- endfor -%}{{ dict(ns.p) }}
    # the admission as MEASURED here, keyed by the declared admission fields (role -> key)
    _rh_vfi_adm: >-
      {%- set af = _rh_sa_regadm.ingress.carriers.projector.admission.fields -%}
      {{ {af.entry_rel: _rh_vfi_entry_rel,
          af.entry_sha256: _rh_vfi_id.results[0].stat.checksum,
          af.registry_sha256: _rh_vfi_id.results[1].stat.checksum,
          af.document_parse: _rh_vfi_rparse,
          af.companions: _rh_vfi_comp} }}
    # the carrier words in carrier.order: a member that is a role -> {<role var>: measured admission}; a member that is
    # a companion node (roles_from) -> the flat companion map
    _rh_vfi_carrier: >-
      {%- set cr = fi.lists[fi.lists.source_record] -%}
      {%- set ns = namespace(w=rows) -%}
      {%- for m in cr.order -%}
      {%- if m in cr.roles -%}{%- set ns.w = ns.w + [_rh_vfi_flag, {_rh_vfi_rv[m]: _rh_vfi_adm} | to_json] -%}
      {%- else -%}{%- set ns.w = ns.w + [_rh_vfi_flag, _rh_vfi_comp | to_json] -%}{%- endif -%}
      {%- endfor -%}{{ ns.w }}
    # the expected vector, rebuilt from the declared form and the OBSERVED run (see header); never from the record
    _rh_vfi_expect: >-
      {%- set ns = namespace(w=rows) -%}
      {#- op1f (codex 920 SR920_OPAQUE_ARGUMENT_VALUES): ONE left-to-right pass per template word split at the open
          delimiter; each value is concatenated and never scanned again (the template words are validated BEFORE this, by
          _rh_vfi_tbad below; the retired replace() loop rescanned substituted values) -#}
      {%- set d = l.placeholder.delimiters -%}
      {%- for w in l.argv -%}
      {%- if w in _rh_vfi_lists -%}{%- set ns.w = ns.w + _rh_vfi_lists[w] -%}
      {%- else -%}
      {%- set parts = w.split(d | first) -%}
      {%- set t = namespace(s=parts | first) -%}
      {%- for p in parts -%}{%- if not loop.first -%}
      {%- set q = p.split(d | last) -%}
      {%- set t.s = t.s ~ _rh_vfi_scal[(d | first) ~ (q | first) ~ (d | last)] ~ (q | last) -%}
      {%- endif -%}{%- endfor -%}
      {%- set ns.w = ns.w + [t.s] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.w }}
    # op1f: the slot values keyed by their declared placeholder text (list slots -> word lists; scalar slots -> one string)
    _rh_vfi_lists: >-
      {%- set rt = namespace(env=rows, inv=rows, ev=rows) -%}
      {#- env pairs: <name><env_pair_separator><value>; op1g: the separator is the declared genesis.launch.env_pair_separator
          (C1 sr922b, s39 :2444-2448; HOLE-B-OP1F-ENV-PAIR-SEP CLOSED, CPL-SR922B-B-ENV-SEP) -#}
      {%- for n in l.env.order -%}{%- set rt.env = rt.env + [n ~ l.env_pair_separator ~ lookup('ansible.builtin.env', n)] -%}{%- endfor -%}
      {%- for f in ansible_inventory_sources -%}{%- set rt.inv = rt.inv + [rh.controller.bootstrap.ssh_auth.run_grammar.inventory_flag, f] -%}{%- endfor -%}
      {%- for n in _rh_vfi_stage.extra_vars -%}{%- set rt.ev = rt.ev + [_rh_vfi_flag, n ~ _rh_vfi_nev ~ lookup('ansible.builtin.vars', n)] -%}{%- endfor -%}
      {%- if _rh_vfi_present -%}
      {%- for n in rh.controller.bootstrap.genesis.initializer.custody.override_inputs -%}{%- set rt.ev = rt.ev + [_rh_vfi_flag, n ~ _rh_vfi_nev ~ lookup('ansible.builtin.vars', n)] -%}{%- endfor -%}
      {%- set rt.ev = rt.ev + [_rh_vfi_flag, oc.layer.prefix ~ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.layer.role])] -%}
      {%- endif -%}
      {{ {l.slots.env_pairs: rt.env, l.slots.inventory_args: rt.inv, l.slots.stage_extra_vars: rt.ev,
          l.slots.stage_inputs: _rh_vfi_stage.stage_inputs, l.slots.source_record: _rh_vfi_carrier} }}
    _rh_vfi_scal: >-
      {{ {l.scalar_slots.env_path: rh.controller.bootstrap.os_tools.env.path, l.scalar_slots.builder: _rh_bld_a.executable,
          l.scalar_slots.act_var: l.stage_root.act.var, l.scalar_slots.act: lookup('ansible.builtin.vars', l.stage_root.act.var),
          l.scalar_slots.checkout: rh_repo_root, l.scalar_slots.playbook: _rh_vfi_entry_rel} }}
    # op1f (s37 run_local.caller_vars.form_separators.name_eq_value, R-OP1E-PAIR-SEP closed): the -e name=value separator
    _rh_vfi_nev: "{{ rh.controller.bootstrap.work_roots.run_local.caller_vars.form_separators.name_eq_value }}"
    # op1f (SR920_OPAQUE_ARGUMENT_VALUES): the TEMPLATE words of the declared form that break the placeholder grammar or
    # expansion completeness, checked BEFORE substitution: a delimiter outside a placeholder, a list-slot placeholder
    # inside a longer word, an undeclared placeholder, or a declared one with no value. Values are never scanned.
    _rh_vfi_tbad: >-
      {%- set d = l.placeholder.delimiters -%}
      {%- set ns = namespace(b=rows) -%}
      {%- for w in l.argv -%}
      {%- set ph = w | regex_findall(l.placeholder.regex) -%}
      {%- if w in l.slots.values() -%}
      {%- if w not in _rh_vfi_lists -%}{%- set ns.b = ns.b + [w] -%}{%- endif -%}
      {%- elif (w.count(d | first) != (ph | length)) or (w.count(d | last) != (ph | length))
              or (ph | reject('in', l.scalar_slots.values()) | list) != rows
              or (ph | reject('in', _rh_vfi_scal) | list) != rows -%}
      {%- set ns.b = ns.b + [w] -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.b }}
    _rh_vfi_cap: "{{ dict(_rh_vfi_st.results | map(attribute='item') | zip(_rh_vfi_st.results | map(attribute='stat.checksum'))) }}"
    _rh_vfi_invocation_fields: "{{ _rh_vfi_field | difference([xi.source_admission.record.captured_field]) }}"
    _rh_vfi_capture_shape: "{{ xi.source_admission.record.captured_shape }}"
  ansible.builtin.assert:
    that:
      # the declared first-invocation form is the direct-A form over genesis.launch, no seed, no bundle read
      - _rh_vfi_form == l.argv
      - _rh_vfi_flag in rh.controller.bootstrap.work_roots.run_local.arg_flags
      - (_rh_vfi_invocation_fields | length) == _rh_sa_regadm.ingress.atoms.one
      - xi.source_admission.record.captured_field in _rh_vfi_field
      - (_rh_vfi_field | sort) == ((_rh_vfi_invocation_fields + [xi.source_admission.record.captured_field]) | sort)
      # op1f (route op1g CPL-OP1G-B-PENDING-CLEAR): the field this verifier verifies is exactly the field set route's
      # ARFE holds pending (ARFE :544-556, the s37 executed_bind admission arm); none other is cleared below
      - _rh_x2_pending is sequence and _rh_x2_pending is not string and _rh_x2_pending is not mapping
      - (_rh_x2_pending | sort) == (_rh_vfi_field | sort)
      # op1f (SR920_OPAQUE_ARGUMENT_VALUES): the declared TEMPLATE words pass the placeholder grammar and expansion
      # completeness BEFORE substitution; the substituted vector is never scanned (injected values are opaque)
      - _rh_vfi_tbad == rows
      # this process runs A (observed) and the recorded vector is exactly the rebuilt one (word for word, type-exact)
      - ansible_playbook_python == _rh_bld_a.python
      - _rh_x2_doc[_rh_vfi_invocation_fields | first] is sequence and _rh_x2_doc[_rh_vfi_invocation_fields | first] is not string
      - (_rh_x2_doc[_rh_vfi_invocation_fields | first] | to_json) == (_rh_vfi_expect | to_json)
      # op1e s35 carrier (sr918_reconcile_c1): order [admission, companions]; the admission member is a role; its
      # declared sources cover exactly the declared admission fields
      - (_rh_vfi_cr.order | unique | list | length) == (_rh_vfi_cr.order | length)
      - (_rh_vfi_cr.order | select('in', _rh_vfi_cr.roles) | list | length) == 1
      - (_rh_vfi_cr.admission.sources.keys() | list | sort) == (_rh_sa_regadm.ingress.carriers.projector.admission.fields.keys() | list | sort)
      # codex 919 SR918_ACTUAL_EXECUTION_BINDING (in-process recheck; the binding BEFORE launch is the X2 writer step
      # tasks/x2_bind_exec_vector.yml): the running caller is the declared entry, the recorded vector's playbook word is
      # <checkout>/<entry_rel> (rebuilt above; equality with the record below) and those bytes, measured now, are the
      # admission entry_sha256; the registry bytes measured now are its registry_sha256
      - _rh_sa_caller == _rh_vfi_entry_rel
      - _rh_vfi_entry_rel == _rh_sa_regadm.ingress.carriers.projector.entry_rel
      - _rh_vfi_id.results | map(attribute='stat') | rejectattr('exists') | list == rows
      - _rh_vfi_id.results | map(attribute='stat') | rejectattr('isreg') | list == rows
      - _rh_vfi_id.results | map(attribute='stat') | selectattr('islnk') | list == rows
      - (_rh_vfi_rtext | hash(_rh_sa_regadm.ingress.digest.algorithm)) == _rh_vfi_id.results[1].stat.checksum
      # the SUPPLIED admission (read through its role var) is exactly the measured one (every field, type-exact)
      - _rh_vfi_rv[(_rh_vfi_cr.order | select('in', _rh_vfi_cr.roles) | first)] in vars
      - >-
        (lookup('ansible.builtin.vars', _rh_vfi_rv[(_rh_vfi_cr.order | select('in', _rh_vfi_cr.roles) | first)]) | to_json(sort_keys=true))
        == (_rh_vfi_adm | to_json(sort_keys=true))
      # the X2 record agrees: closure rows of the entry and the registry, and the record registry field / cold input
      - (_rh_x2_doc[_rh_vfi_clf] | selectattr(_rh_vfi_cls[0], 'equalto', _rh_vfi_entry_rel) | map(attribute=_rh_vfi_cls[1]) | list) == [_rh_vfi_id.results[0].stat.checksum]
      - (_rh_x2_doc[_rh_vfi_clf] | selectattr(_rh_vfi_cls[0], 'equalto', _rh_sa_regadm.ingress.registry_rel) | map(attribute=_rh_vfi_cls[1]) | list) == [_rh_vfi_id.results[1].stat.checksum]
      - _rh_x2_doc[xi.envelope_projection.identity.record_field] == _rh_vfi_id.results[1].stat.checksum
      - lookup('ansible.builtin.vars', xi.envelope_projection.identity.input) == _rh_vfi_id.results[1].stat.checksum
      # document_parse: the registry's own parse node is the resolved parse contract this run used
      - (_rh_vfi_rparse | to_json(sort_keys=true)) == (_rh_vfi_dp | to_json(sort_keys=true))
      # companions: the supplied companion vars equal the run_local-rule values (never an envelope)
      - (_rh_vfi_comp | to_json(sort_keys=true)) == (dict(_rh_vfi_comp.keys() | zip(query('ansible.builtin.vars', *(_rh_vfi_comp.keys() | list)))) | to_json(sort_keys=true))
      - (_rh_vfi_comp.keys() | list | sort) == (xi.cold_launch_release.companions | sort)
      # supplementary consistency only (919): the running play is the declared literal projector play in its dir
      - ansible_play_name == _rh_sa_regadm.ingress.carriers.projector.select.play_name
      - playbook_dir == (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ (_rh_vfi_entry_rel | dirname))
      # every captured input equals the bytes measured now (inventory, A executable, override layer when present)
      - _rh_vfi_st.results | map(attribute='stat') | rejectattr('exists') | list == rows
      - _rh_vfi_st.results | map(attribute='stat') | selectattr('islnk') | list == rows
      # PROPOSED record field (C1-SR917-W-CAPTURED): absolute path -> sha256 of every captured input, written by the X2
      # writer before the exec
      - _rh_x2_doc[xi.source_admission.record.captured_field] is mapping
      - _rh_vfi_capture_shape.type == _rh_sa_reg.vocabulary.tests.mapping
      - _rh_vfi_capture_shape.nonempty is sameas _rh_sa_regadm.ingress.atoms.true_value
      - (_rh_x2_doc[xi.source_admission.record.captured_field] | length) > _rh_sa_regadm.ingress.atoms.zero
      - >-
        (_rh_x2_doc[xi.source_admission.record.captured_field].keys() | reject(_rh_sa_reg.vocabulary.tests.string) | list | length)
        == _rh_sa_regadm.ingress.atoms.zero
      - >-
        (_rh_x2_doc[xi.source_admission.record.captured_field].values() | reject(_rh_sa_reg.vocabulary.tests.string) | list | length)
        == _rh_sa_regadm.ingress.atoms.zero
      - >-
        (_rh_x2_doc[xi.source_admission.record.captured_field].keys()
         | reject(_rh_sa_reg.vocabulary.tests.fullmatch, _rh_sa_regadm.ingress.fullmatch_wrap.open ~ _rh_vfi_capture_shape.key_pattern ~ _rh_sa_regadm.ingress.fullmatch_wrap.close)
         | list | length) == _rh_sa_regadm.ingress.atoms.zero
      - >-
        (_rh_x2_doc[xi.source_admission.record.captured_field].values()
         | reject(_rh_sa_reg.vocabulary.tests.fullmatch, _rh_sa_regadm.ingress.fullmatch_wrap.open ~ _rh_vfi_capture_shape.value_pattern ~ _rh_sa_regadm.ingress.fullmatch_wrap.close)
         | list | length) == _rh_sa_regadm.ingress.atoms.zero
      - _rh_x2_doc[xi.source_admission.record.captured_field] | lme_type_aware_equal(_rh_vfi_cap)
      # override carriage: both or neither (admitted upstream), captured digest == the admitted digest input, and the
      # layer's RESOLVED effect is bound (present) or the layer var is unbound (absent)
      - >-
        (not _rh_vfi_present)
        or (_rh_vfi_cap[lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.capture.role])]
            == lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.capture.digest_role]))
      - >-
        (_rh_vfi_present and rh.controller.bootstrap.source_admission.early_view.override.var in vars
         and ((lookup('ansible.builtin.file', vars[rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.layer.role]], rstrip=false)
               | lme_capture_text_bound(vars[rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.capture.digest_role]],
                                        _rh_sa_decl.digest_algorithm, rh.controller.bootstrap.body_domain.encoding, _rh_vfi_code)
               | lme_manifest_strict(vars[rh.controller.bootstrap.genesis.initializer.custody.override_input_roles[oc.layer.role]], _rh_vfi_dp))
              [rh.controller.bootstrap.source_admission.early_view.override.var]
              | lme_type_aware_equal(vars[rh.controller.bootstrap.source_admission.early_view.override.var])))
        or ((not _rh_vfi_present) and rh.controller.bootstrap.source_admission.early_view.override.var not in vars)
    fail_msg: >-
      REFUSED {{ _rh_vfi_code }}: {{ [_rh_sa_caller, _rh_vfi_field, _rh_vfi_st.results | map(attribute='item') | list] | to_json }}
    quiet: true

# op1f (route CPL-OP1G-B-PENDING-CLEAR; ARFE op1h :544-556 holds, :712-713 includes this file once, :715-724 refuses a
# field still pending): the LAST task. Reached only when every assertion above passed (a failed assert ends the host's
# run here), it removes exactly the verified executed-kind field(s) from route's pending set -- the same field
# expression as above, recomputed, never a copy from the record; nothing else is changed.
- name: Clear the verified executed-kind field from the admission's pending set (last step; after every check passed)
  vars:
    xi: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation }}"
    rows: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows }}"
    _rh_vfi_field: >-
      {%- set ns = namespace(f=rows) -%}
      {%- for f, bl in xi.envelope_projection.provenance.binds | dictsort -%}
      {%- if (bl | selectattr(xi.envelope_projection.provenance.bind_fields.kind, 'equalto', xi.bind_kinds.executed) | list) != rows -%}{%- set ns.f = ns.f + [f] -%}{%- endif -%}
      {%- endfor -%}{{ ns.f }}
  ansible.builtin.set_fact:
    _rh_x2_pending: "{{ _rh_x2_pending | reject('in', _rh_vfi_field) | list }}"
