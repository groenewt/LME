---
- name: Require explicit operation applicability and an independently admitted execution
    root
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_transport.diagnostics.stage }}"
    that:
    - fw_required is boolean
    - fw_supervised is boolean
    - fw_ingress_json is none or fw_ingress_json is string
    - rh_fw_producer_uid is integer
    - rh_fw_producer_uid is not boolean
    - rh_fw_producer_uid > rh_fw_transport.structural.zero
    - fw_intent_json is none or fw_intent_json is string
- name: Admit the separate intent selector through the canonical owner before any
    occurrence effect
  ansible.builtin.include_tasks: "{{ [fw_source_root, fw_contract.producer_intent.validation.task]
    | path_join }}"
- name: Admit absence through the canonical validator without creating matrix state
  when: fw_ingress_json is none and fw_intent_json is none
  ansible.builtin.include_tasks: "{{ fw_source_root ~ rh_fw_transport.structural.separator
    ~ fw_contract.validation.runtime_task }}"
- name: Admit and record a present context before any dependent operation
  when: fw_ingress_json is not none or fw_intent_json is not none
  block:
  - name: Retain JSON and strict-parser views of the same public request
    ansible.builtin.set_fact:
      rh_fw_request_json: "{{ fw_ingress_json | from_json }}"
      rh_fw_request_strict: "{{ fw_ingress_json | lme_manifest_strict(rh_fw_transport.diagnostics.stage,
        fw_parse_contract) }}"
    when: fw_ingress_json is not none
  - name: Require the exact typed public ingress
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ fw_contract.validation.diagnostics.request }}"
      that:
      - rh_fw_request_json is mapping
      - rh_fw_request_json.keys() | list | sort == fw_contract.ingress.request_fields
        | sort
      - rh_fw_request_json | lme_type_aware_equal(rh_fw_request_strict)
      - rh_fw_request_json[fw_contract.ingress.r.mode] in fw_contract.allocation.modes.values()
      - rh_fw_request_json[fw_contract.ingress.r.context] is mapping
    when: fw_ingress_json is not none
  - name: Bind the proposed context without granting it source or cell authority
    ansible.builtin.set_fact:
      rh_fw_proposed_context: "{{ rh_fw_request_json[fw_contract.ingress.r.context]
        }}"
      rh_fw_mode: "{{ rh_fw_request_json[fw_contract.ingress.r.mode] }}"
    when: fw_ingress_json is not none
  - name: Admit canonical field shape without treating occurrence presence as supervision
    when: fw_ingress_json is not none
    ansible.builtin.include_tasks: "{{ [fw_source_root, fw_contract.validation.tasks.fields]
      | path_join }}"
    vars:
      fw_field_value: "{{ rh_fw_proposed_context }}"
      fw_field_names: "{{ fw_contract.fields }}"
      fw_field_kinds: "{{ fw_contract.field_kinds }}"
      fw_field_patterns: "{{ fw_contract.field_patterns }}"
  - name: Retain the source-admitted intent allocation without inventing an occurrence
    when: fw_intent_json is not none
    ansible.builtin.set_fact:
      rh_fw_proposed_context: "{{ lookup(rh_fw_transport.jinja.vars, fw_contract.producer_intent.validation.output_fact)[fw_contract.producer_intent.allocation_role]
        }}"
      rh_fw_mode: "{{ lookup(rh_fw_transport.jinja.vars, fw_contract.producer_intent.validation.output_fact)[fw_contract.ingress.r.mode]
        }}"
  - name: Derive actual source configuration and cell authority through the existing
      pipeline
    ansible.builtin.include_tasks: "{{ [fw_source_root, rh_fw_stage.source.context_tasks]
      | path_join }}"
  - name: Read actual durable allocator custody under the seed-held allocator lock
    ansible.builtin.include_tasks: "{{ rh_fw_transport.paths.allocation_read_task
      }}"
  - name: Require one direct invocation child of the admitted allocator directory
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ rh_fw_transport.diagnostics.locator }}"
      that:
      - rh_fw_proposed_context[fw_contract.f.locator] | dirname == rh_fw_allocator_root
      - rh_fw_proposed_context[fw_contract.f.locator] | basename is regex(rh_fw_transport.allocation_record.dirname_pattern,
        match_type=fw_contract.validation.regex_match_type)
      - rh_fw_proposed_context[fw_contract.f.locator] | basename not in rh_fw_transport.allocation_record.refused_names
  - name: Bind the four allocation fields to the shared canonical admission API
    ansible.builtin.set_fact:
      fw_allocation: "{{ dict((fw_contract.producer_intent.allocation_roles | map(fw_contract.validation.jinja.extract,
        fw_contract.f) | list) | zip(fw_contract.producer_intent.allocation_roles
        | map(fw_contract.validation.jinja.extract, fw_contract.f) | map(fw_contract.validation.jinja.extract,
        rh_fw_proposed_context) | list)) }}"
      fw_allocation_mode: "{{ rh_fw_mode }}"
  - name: Admit actual allocation and source configuration before occurrence publication
    ansible.builtin.include_tasks: "{{ [fw_source_root, fw_contract.validation.tasks.allocation]
      | path_join }}"
  - name: Bind only actual invoking occurrence proof before canonical admission
    ansible.builtin.include_tasks: "{{ [fw_source_root, rh_fw_stage.source.occurrence_task]
      | path_join }}"
  - name: Invoke canonical source, configuration, cell, occurrence and resume admission
    ansible.builtin.include_tasks: "{{ fw_source_root ~ rh_fw_transport.structural.separator
      ~ fw_contract.validation.runtime_task }}"
  - name: Bind the exact source and configuration facts produced by G and C1
    vars:
      rh_fw_binding_fields: "{{ rh_fw_transport.allocation_record.b }}"
    ansible.builtin.set_fact:
      rh_fw_recorded_binding: "{{ {rh_fw_binding_fields.cell: fw_expected_cell[fw_contract.binding.cell_keys.id],
        rh_fw_binding_fields.dimensions: fw_observed_dimensions, rh_fw_binding_fields.configuration_sha256:
        fw_admitted_record_sha256, rh_fw_binding_fields.configuration_revision: fw_admitted_record[fw_record_fields.configuration_revision],
        rh_fw_binding_fields.source_commit: fw_expected_lineage[fw_contract.binding.lineage_keys.source_commit],
        rh_fw_binding_fields.source_tree: fw_expected_lineage[fw_contract.binding.lineage_keys.source_tree]}
        }}"
      rh_fw_context: "{{ lookup(rh_fw_transport.jinja.vars, fw_contract.validation.output_fact)
        }}"
  - name: Construct the durable context and source/configuration record
    vars:
      rh_fw_record_fields: "{{ rh_fw_transport.allocation_record.f }}"
    ansible.builtin.set_fact:
      rh_fw_allocation_document: "{{ {rh_fw_record_fields.schema: rh_fw_transport.allocation_record.schema,
        rh_fw_record_fields.context: rh_fw_context, rh_fw_record_fields.binding: rh_fw_recorded_binding}
        }}"
  - name: Prepare immutable context controls before the seed reserves its invocation
      directory
    when: rh_fw_current_phase == rh_fw_stage.phases.prepare
    ansible.builtin.include_tasks: "{{ [fw_source_root, rh_fw_stage.source.prepare_task]
      | path_join }}"
  - name: Commit only under the seed-held invocation and the exact preparation identity
    when: rh_fw_current_phase == rh_fw_stage.phases.commit
    ansible.builtin.include_tasks: "{{ [fw_source_root, rh_fw_stage.source.commit_task]
      | path_join }}"
