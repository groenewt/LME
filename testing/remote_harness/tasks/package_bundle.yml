---
# testing/remote_harness/tasks/package_bundle.yml -- ONE bundle publication destination of package.yml, included once
# PER ARTIFACT CLASS (r3g: step 1 moved package.yml's per-destination body here unchanged; step 2 parameterized it by
# class). Included by package.yml after the builder, executable identity, source edition, render-input digests and
# the class set (tasks/scope_classes.yml) are bound. Two views, never mixed:
#   EXECUTION (this controller): rh (the controller's own policy: path admission, os_tools, staging/lease policy,
#     bundle layout names), rh_builder, rh_staging_lease, rh_profile_sha256, _rh_src_git, _rh_src_inputs,
#     the artifact store: the localhost host var NAMED by controller.bootstrap.genesis.acquisition.source_var
#   CONTENT (the class, include params from package.yml's class loop; all registry-reserved):
#     rh_pub_dir     the class destination (controller class: rh_bundle_dir; others: the declared sibling rule)
#     rh_pub_key     the class key (C1's published per_class.key_field value; recorded as bundle.json class_key)
#     rh_pub_policy  the class scope's own resolved policy (what the seed renders from; artifacts, versions, lock path)
#     (optb-after-01: rh_pub_lock is RETIRED; the class lock is package.yml's preflight capture _rh_pkg_lock[rh_pub_key]
#      {text, sha256, packages, collections} and the class allocation is _rh_pkg_alloc[rh_pub_key] {rows, total})
# Every class destination is a FULL publication destination: its own ancestry/custody admission, its own reap scope
# (`.<class basename>.<infix>.*`), lease record, lock `.<class basename>.<lock_suffix>`, publish fence and E26/E32
# semantics. Semantics are package.yml's header (SEED2-PACKAGE-RESERVATION, M1-STAGING-RECOVERY, PUBLISH FENCE,
# PUBLICATION AUTHORITY).
# MR03 PKG-CALLER after-01 (successor of base 8bf12517; MAIN route-A bytes; AUTHORED, NEVER EXECUTED, UNRUN): this file
# no longer reserves, stages, seals or publishes inline. Base :38-93 (ancestry / custody / tool admission), :122-239
# (reap, reserve, copy, render, readback), :241-325 (seal) and :327-466 (record, publish, compare) are the ONE publisher
# tasks/reserve_publish.yml (N13 s03 3858f1cd) with tasks/render_artifact.yml (N10 s02 5291aafb), included ONCE below
# with this class's content as include parameters. Kept here: the input admission, the artifact source admission (both
# before any write; now ahead of the destination custody admission, which runs first inside N13), the INDEPENDENT final
# admission tasks/admit_bundle.yml right after the include (OD-N13-01: never N13's own readback) and the report.
# Allocation: the class policy's controller.bootstrap.package_publish.max_bytes (C1 erratum-02 PKG-01 / PKG-02); the
# reservation need is total + max(row), replacing the measured-size x free_bytes_factor_package product.
# Change record: proposals/mr03-pkg-caller/pkg-caller-01.change.yml.
# MR03 PKG-CALLER after-02 (successor of after-01 02443581; codex696; AUTHORED, NEVER EXECUTED, UNRUN): (a) the report's
# inherited default filter (after-01 :196, base :481) is replaced by an explicit presence / type admission of _rh_reap_rm whose
# diagnostic is declared words only; (b) rh_rsv_prepublish is bound exactly as req-n13-01.yml GEN-REQ-N13-S04-01
# package_binder (PENDING C1-REQ-PKG-04, GEN-REQ-N13-S04-01, GL-REQ-PKG-01); (c) the C1-REQ-PKG-01..03 consumption
# points are marked PENDING. Change record: proposals/mr03-pkg-caller/pkg-caller-02.change.yml.
# MR03 PKG-CALLER after-03 (successor of after-02 f97c243b; codex-tick702 package; AUTHORED, NEVER EXECUTED, UNRUN):
# (a) OPEN-PKG-01-GAP-A: the artifact store root and every component of its path are admitted at the packaging read /
# copy boundary by the ONE ancestry rule (tasks/admit_ancestry.yml), the store root itself is an owned real directory,
# every declared artifact is a flat name directly under it and a no-follow regular file, all before any write;
# (b) the after-02 post-publication reap assert is REMOVED: the reap result is admitted inside the ONE publisher where
# reap_staging.yml returns, before the reservation (proposals/mr03-pkg-caller/n13-reap-01.change.yml, PENDING the N13
# owner), and the report reads only that admitted _rh_rsv_reaped; (c) the pre_publish binder is stated as an ATOMIC join
# (C1-REQ-PKG-04 + N13 s04 + this caller), never a check by itself. Change record: pkg-caller-03.change.yml.
# MR03 PKG-CALLER optb-after-01 (successor of after-03 f8687996; codex711 option B, codex714 LOCK-01 / REC-01, codex716
# ROWCAP (a), codex717 POLICY-SCOPE (a); design pkg-optb-02 / -02a / -02b; AUTHORED, NEVER EXECUTED, UNRUN):
# (a) LOCK-01: every lock read here is the ONE preflight capture _rh_pkg_lock[rh_pub_key] (no parse, no re-read; the
# recorded lock_sha256 is the capture's RAW-byte digest: MIGRATION-PKG-LOCKSHA-01); (b) option B binder: rh_rsv_max_bytes
# is the preflight allocation _rh_pkg_alloc[rh_pub_key] (caps admitted for EVERY class before any publication, package.yml
# P7-P9), the universal package_publish.max_bytes map is retired (C1-OPTB-P-04); (c) member modes from
# bundle.member_modes, record rows joined by bundle.manifest_record.row_separator (C1-REQ-PKG-02 / -03 consumed);
# (d) REC-01 R1: bundle.json is built field by field from manifest_record roles / source_roles / genesis_roles (never a
# positional zip); policy roles walk rh.controller = the EXECUTING CONTROLLER PUBLICATION POLICY (codex717 (a), six roles
# only); class content (artifacts, lock, seed inputs, expected generation) stays rh_pub_policy / the class capture; the
# built key set is checked equal to the declared field list at every level inside the render (refusal before SEAL).
# BLOCKED-ON-GENESIS-GL: _rh_pkg_lock, _rh_pkg_alloc (GL-REQ-PKG-03 / -04). BLOCKED-ON-C1-PKG: the policy-path segment
# separator (C1PKG-REQ-PATH-SEP). Change record: proposals/mr03-pkg-caller/optb-package_bundle-01.change.yml.
# MR03 PKG-CALLER optb-after-02 (successor of optb-after-01 584c55e7; records-pkg-optb-03 9340f4dd, codex717 (a); UNRUN):
# the six policy roles walk from the declared manifest_record.policy_scope root (lookup of the declared fact name, then
# the declared path), not the literal rh.controller; at construction the {policy} roles of every roles node must equal
# that node's policy_scope members (a node without an entry has none) or the render refuses with the key-set check.
# Class content stays rh_pub_policy. C-OPTB3-POS (UNRUN): bundle.json bytes identical to after-03 f8687996 except the
# two declared migrations (source.inputs, lock_sha256). Change record: optb-package_bundle-02.change.yml.
# (That C-OPTB3-POS wording is superseded by optb-package_bundle-02s.yml: after-02 vs optb-after-01, byte-identical.)
# MR03 PKG-CALLER optb-after-03 (successor of optb-after-02 c92dc159; codex721 PREFLIGHT-ARTIFACTS; UNRUN): the store /
# artifact admissions of base :81-174 moved to package.yml preflight P11-P16 (every class, before the first publication
# mutation); N13 keeps the immediate copy-source and staged-digest checks. bundle.json bytes are unchanged
# (C-OPTB4-BUNDLE-SAME). Change record: proposals/mr03-pkg-caller/optb-package_bundle-03v.change.yml.
# (Erratum to the two optb-after-03 lines above, recorded in optb-package_bundle-03v: the preflight is P11-P17.)
# MR03 PKG-CALLER optb-after-04 (successor of optb-after-03 fd1590ef; records-pkg-optb-04 5148502e policy_segment_separator;
# UNRUN): the three policy-node walks split on rh.controller.bootstrap.source_admission.early_view.override.audit_join
# (the executing controller's declared policy-segment join, pinned by C1-OPTB4-GL-02), never on a literal and never on
# the filesystem separator path_admission.separator. The C1PKG-REQ-PATH-SEP block on :53-54 is answered by optb-04.
# Atomic unit: lands with C1-OPTB4-GL-02 and the OWED-OPTB4-SEED-RULE / -DERIVE-RULE update. bundle.json bytes unchanged
# while audit_join is '.' (C-OPTB4-POLSEP-SAME). Change record: proposals/mr03-pkg-caller/optb-package_bundle-04v.change.yml.
# MR03 PKG-CALLER optb-after-05 (successor of optb-after-04 a4d46488; C1-PKG records-pubrcpt-01 2183f0fa REQ-PUBRCPT-01 / -03,
# consumers_owed row 1; codex726 OPEN_N6_PUB_READBACK; UNRUN): after admit_bundle admits this class, its publication
# receipt entry {bundle, lock_sha256, outcome} is added to _rh_pkg_rcpt (keys exactly package_publish.receipt.class_fields,
# bundle keys exactly receipt.bundle_fields, outcome within receipt.outcomes; a class already present refuses), every word
# read from the EXECUTING controller policy rh, never rh_pub_policy. Refusal receipt.refusal (RH-PACKAGE-RECEIPT).
# ATOMIC with package.optb-after-07 (initializes _rh_pkg_rcpt before the class loop; checks coverage, writes the receipt).
# Change record: proposals/mr03-pkg-caller/optb-package_bundle-05v.change.yml.
# MR03 PKG-CALLER optb-after-06 (successor of optb-after-05 28167c92; C1-PKG records-pubrcpt-02 89c8ade7 consumers_owed row 1,
# rulings class_fields / outcomes / class_records; records-lock-trust-01 B-CLS-4; codex729 729-RECOVERY-RECEIPT-REUSE; UNRUN):
# after admit_bundle admits this class, its CLASS RECORD <act dir>/<class_records.dir_rel>/<class_records.name for this key>
# is written exclusively (absent: ONE write, force false, at class_records.mode) or RE-ADMITTED (present: never rewritten),
# BEFORE the next class. The entry is {bundle, lock_sha256, outcome, trusted_oid} (keys exactly class_fields); trusted_oid
# = rh_src_admission[members][this class's lock_file_rel][member_fields.trusted]; outcome = N13's word, or
# observed_on_resume when this run resumed (package.yml _rh_pkg_rcpt_resumed) and N13 reports unchanged for a class
# without a record. A present record is admitted only when this run resumed, N13 reports unchanged and its bytes equal
# this run's entry with SOME declared outcome (its historical outcome kept: lock_sha256, trusted_oid and bundle byte-equal);
# the receipt entry is then the RECORD value. One read of the record either way. Refusal receipt.refusal.
# BLOCKED-ON-GENESIS-GL: _rh_pkg_rcpt_crec_out, _rh_pkg_rcpt_crec_pre, _rh_pkg_rcpt_crec_back, _rh_pkg_rcpt_crec_word,
# _rh_pkg_rcpt_crec_post, _rh_pkg_rcpt_trusted (C1-PKG pubrcpt-02 names; GL-REQ-PKG-10). ATOMIC with package.optb-after-08
# (class-records dir, resumed, receipt) and records-pubrcpt-02. Change record: optb-package_bundle-06v.change.yml.
# MR03 PKG-CALLER optb-after-07 (successor of optb-after-06 cdeb9f0a; cp -n, sha measured equal, then Edit; codex 923
# N13_CALLER_AND_DECLARATION_JOIN; C1 sr922b_c1 item_8_callers / CPL-SR922B-CALLER-SUCCESSORS; UNRUN): the N13 include passes
# rh_rsv_render_scope and rh_rsv_uid (REQUIRED by N13 s07 00d55fe5 N13-S07-CALLER-PARAMS), each walked from this caller's
# declared site row controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle (S-S39 76c1de8b :7081;
# r26 ede8f4a6 :6619): render scope = n10.scopes[row.render_scope]; uid = the decimal text of the fact at row.uid (first
# word the fact var, the rest keys). A refusal task right before the include admits the row. rh_rsv_max_bytes /
# rh_rsv_need are UNCHANGED (_rh_pkg_alloc): a lookup site has no row_from and copies {} (S-S39 :7048-7050;
# HOLE-SR922B-LOOKUP-SITE-COPIES stays C1's). The inherited rh_pub_dir defined test of the input admission is replaced by
# a membership test over vars (no exemption). The present-record owner check still reads rh_builder.uid (the same fact
# the row names; not re-routed). Change record: proposals/mr03-pkg-caller/records-n13-callers-sr922b-01.yml.
# MR03 PKG-CALLER optb-after-08 (successor of optb-after-07 421b3acc; cp -n, sha measured equal, then Edit; codex 926
# CALLER_AUTHORITY_JOIN; C1 SR922d S-S41 77b659db n10.write_bound.authority :7424-7430, site row :7475-7477; r28 dfa502ae
# reserved_outputs :7228; UNRUN): the N13 include passes rh_rsv_include_rel, bound literally at the include line (S-S41
# :7345-7347), = testing/remote_harness/tasks/package_bundle.yml, the last entry of
# include_chain[testing/remote_harness/package.yml]. No other change. Change record:
# proposals/mr03-pkg-caller/records-n13-callers-sr922d-01.yml.

- name: Admit the package inputs (the ONE path-admission rule; no default)
  ansible.builtin.assert:
    that:
      # genesis OPEN-C / OD-GEN-09 (codex-tick542): the artifact store host var is DECLARED once
      # (controller.bootstrap.genesis.acquisition.source_var); no literal name is read here
      - rh.controller.bootstrap.genesis.acquisition.source_var is string and rh.controller.bootstrap.genesis.acquisition.source_var in vars
      - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is string
      - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is match(rh.controller.bootstrap.path_admission.regex)
      - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      # optb-after-07: the inherited presence test is a membership test over vars (no defined test; no exemption)
      - "'rh_pub_dir' in vars and rh_pub_dir is string"
      - rh_pub_dir is match(rh.controller.bootstrap.path_admission.regex)
      - rh_pub_dir is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - rh_pub_dir.split(rh.controller.bootstrap.path_admission.separator) | length > 2
    fail_msg: >-
      REFUSED RH-BUILDER-UNSUPPORTED the artifact store host var {{ rh.controller.bootstrap.genesis.acquisition.source_var }} and the class destination rh_pub_dir
      (rh_bundle_dir or its declared class sibling) must be normalized absolute paths (host vars of localhost; no
      default; the bundle is not a top-level dir).
    quiet: true

# optb-after-03 (codex721 PREFLIGHT-ARTIFACTS = yes): the artifact store custody and the selected artifact inputs of
# EVERY class (store ancestry, store root, flat names, no-follow regular files, presence, declared digests) are admitted
# in package.yml preflight P11-P16, before the first bundle publication mutation; the per-class copies of base :94-174
# (optb-after-02) are REMOVED here, not repeated. The immediate checks stay at the consumption boundary inside N13: each
# artifact is a no-follow regular file at the N13 copy source (no link followed, size cap) and its STAGED copy is
# digest-bound to the declared sha256 before publication. This is preflight discipline, not a transactional
# multi-bundle claim: a store change after preflight is caught only by N13's copy-source and staged-digest refusals,
# possibly after an earlier class published. The custody qualification (separate lstat observations, no openat chain,
# modulo uid 0 and the builder account) moved with the checks (package.yml preflight comment).

# optb-after-06 PRESENT CLASS RECORD (C1-PKG records-pubrcpt-02 rulings.class_records.readmit; codex729 :122-123): BEFORE
# the class runs the normal path, this class's record path is observed (no link followed). A present record is read ONCE
# here, its bytes kept in _rh_pkg_rcpt_crec_word, and pre-admitted before N13 can act: this run resumed; keys exactly
# class_fields; bundle keys exactly bundle_fields; outcome within outcomes; lock_sha256 equal to this run's capture;
# trusted_oid equal to this run's admitted trusted oid of the class rel. After admit_bundle the record must equal this
# run's entry byte for byte (with its own outcome) and N13 must report unchanged. A present record that is not JSON
# fails untyped at from_json (OPEN-PKG06-PRESENT-JSON). Refusal receipt.refusal; nothing is removed or rewritten.
- name: Bind this class's record path and its admitted trusted lock oid (BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_out / _rh_pkg_rcpt_trusted)
  ansible.builtin.set_fact:
    _rh_pkg_rcpt_crec_out: >-
      {{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
          rh.controller.bootstrap.work_roots.sub_roots[rh.controller.bootstrap.genesis.launch.stage_root.sub],
          rh.controller.bootstrap.genesis.launch.stage_root.rel,
          rh.controller.bootstrap.genesis.initializer.dispatch.evidence.publication.stage,
          lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
          rh.controller.bootstrap.package_publish.receipt.class_records.dir_rel,
          rh.controller.bootstrap.package_publish.receipt.class_records.name | replace('{class_key}', rh_pub_key)] | join(rh.controller.bootstrap.path_admission.separator) }}
    # B-CLS-4 (records-lock-trust-01; pubrcpt-02 rulings.class_fields): the committed blob oid of THIS class's own lock rel
    # in the ONE admitted source record (package.yml preflight P1a admitted the rel as a member key).
    _rh_pkg_rcpt_trusted: >-
      {{ rh_src_admission[rh.controller.bootstrap.source_admission.record_fields.members][rh_pub_controller.lock_file_rel][rh.controller.bootstrap.source_admission.member_fields.trusted] }}

- name: Observe this class's record path before N13 (no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_pre)
  ansible.builtin.stat:
    path: "{{ _rh_pkg_rcpt_crec_out }}"
    follow: false
    get_checksum: false
  register: _rh_pkg_rcpt_crec_pre

- name: Read a present class record once (BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_back)
  when: _rh_pkg_rcpt_crec_pre.stat.exists
  ansible.builtin.slurp:
    src: "{{ _rh_pkg_rcpt_crec_out }}"
  register: _rh_pkg_rcpt_crec_back

- name: Keep the present class record's bytes (the one read; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_word)
  when: _rh_pkg_rcpt_crec_pre.stat.exists
  ansible.builtin.set_fact:
    _rh_pkg_rcpt_crec_word: "{{ _rh_pkg_rcpt_crec_back.content | b64decode }}"

- name: Refuse a present class record of another run, lock or trusted oid before N13 (resumed; keys; lock_sha256; trusted_oid)
  when: _rh_pkg_rcpt_crec_pre.stat.exists
  vars:
    _rh_pkg_bad: >-
      {%- set rc = rh.controller.bootstrap.package_publish.receipt -%}
      {%- set r = _rh_pkg_rcpt_crec_word | from_json -%}
      {%- set ns = namespace(l=[]) -%}
      {%- if not _rh_pkg_rcpt_resumed or r is not mapping
             or (r | list | sort) != (rc.class_fields | sort) or (r | length) != (rc.class_fields | length) -%}
      {%- set ns.l = ns.l + [[_rh_pkg_rcpt_crec_out, _rh_pkg_rcpt_resumed]] -%}
      {%- elif r.bundle is not mapping or (r.bundle | list | sort) != (rc.bundle_fields | sort) or (r.bundle | length) != (rc.bundle_fields | length)
               or r.outcome not in rc.outcomes
               or r.lock_sha256 != _rh_pkg_lock[rh_pub_key].sha256
               or r.trusted_oid != _rh_pkg_rcpt_trusted -%}
      {%- set ns.l = ns.l + [[_rh_pkg_rcpt_crec_out, r.lock_sha256, r.trusted_oid]] -%}
      {%- endif -%}{{ ns.l }}
  ansible.builtin.assert:
    that:
      - _rh_pkg_bad | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                               'rh_rf_detail': [rh_pub_key, _rh_pkg_bad | to_json]}) }}
    quiet: true

# optb-after-07 (codex 923 N13_CALLER_AND_DECLARATION_JOIN; C1 sr922b_c1 item_8_callers / CPL-SR922B-CALLER-SUCCESSORS): THIS
# caller's declared N13 site row (S-S39 render.n10.write_bound.callers.sites; r26 entry_generation_render_engine
# n10.write_bound enum) is present and walkable BEFORE the include passes its render scope and uid. No default; an absent
# row, an undeclared scope word or an unbound uid fact var refuses here, before any N13 write, with the code N13 is given
# as rh_rsv_refusal (genesis.builder.refusal) in the declared refusal grammar.
- name: Refuse an N13 caller site row of this caller that is absent or not walkable (declared scope word; uid fact path)
  ansible.builtin.assert:
    that:
      - "'package_bundle' in rh.controller.entry_generation.render.n10.write_bound.callers.sites"
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle is mapping
      - (['render_scope', 'uid'] | reject('in', rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle) | list | length) == 0
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.render_scope is string
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.render_scope in rh.controller.entry_generation.render.n10.scopes
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid is sequence
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid is not string
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid | length > 0
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid | reject('string') | list | length == 0
      - rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid[0] in vars
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.genesis.builder.refusal,
                               'rh_rf_detail': [rh_pub_key, rh.controller.entry_generation.render.n10.write_bound.callers.sites | list | to_json]}) }}
    quiet: true

# THE ONE PUBLISHER (N13 s03 -> N10 s02). Each parameter is the class's CONTENT view (rh_pub_policy, the class capture) or this
# controller's EXECUTION view (rh: layout names, refusal codes, path grammar), exactly as the base used them; nothing is
# defaulted. Row names are the declared bundle file names (no new words). N13 order: destination ancestry / custody and
# publish-tool admission, lease / reap / reservation, copies, renders (N10, fresh readback), seal, ONE locked no-replace
# rename, exact comparison of every sealed file. Outputs used below: _rh_rsv_outcome, _rh_rsv_bytes.
- name: Reserve, stage, render, seal and publish this class's bundle (tasks/reserve_publish.yml N13 -> tasks/render_artifact.yml N10; ONE publisher)
  ansible.builtin.include_tasks: reserve_publish.yml
  vars:
    rh_rsv_dir: "{{ rh_pub_dir }}"
    rh_rsv_refusal: "{{ rh.controller.bootstrap.genesis.builder.refusal }}"
    rh_rsv_staged: "{{ rh.controller.bootstrap.bundle.refusals.staged }}"
    # optb-after-07 (codex 923 N13_CALLER_AND_DECLARATION_JOIN; N13 s07 N13-S07-CALLER-PARAMS; C1 sr922b_c1 item_8_callers
    # rule): the render scope and the owner uid, each walked from THIS caller's declared site row
    # controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle (admitted by the task above), in the
    # EXECUTING controller policy rh (never rh_pub_policy: the publisher's execution view). render scope =
    # n10.scopes[row.render_scope]; uid = the decimal text of the fact at row.uid (first word the fact var, the rest keys).
    # No scope word and no fact name is written here.
    rh_rsv_render_scope: "{{ rh.controller.entry_generation.render.n10.scopes[rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.render_scope] }}"
    rh_rsv_uid: >-
      {%- set w = rh.controller.entry_generation.render.n10.write_bound.callers.sites.package_bundle.uid -%}
      {%- set ns = namespace(v=lookup('ansible.builtin.vars', w[0])) -%}
      {%- for k in w[1:] -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
      {{- ns.v | string -}}
    # optb-after-08 (codex 926 CALLER_AUTHORITY_JOIN; C1 SR922d; S-S41 n10.write_bound.authority.include_param): the authored
    # file that carries THIS N13 include (the nested helper; its caller is package.yml). Bound LITERALLY at the include line,
    # as the declaration requires (S-S41 :7345-7347; r28 :7225-7227): it is the include line's own attestation, which N13
    # compares with the LAST entry of sites.package_bundle.authority.include_chain[_rh_sa_caller] (S-S41 :7477). Walking
    # that chain here would make the comparison self-certifying, so it is not walked.
    rh_rsv_include_rel: testing/remote_harness/tasks/package_bundle.yml
    # C1 erratum-02 MR03-CON-S14E2-PKG-01 binder_interface_for_MAIN, verbatim: the class policy's DECLARED allocation (one
    # cap per staged file rel + a declared total == their sum). The reservation need is total + the largest row cap (the
    # one in-flight temp of a sequential staged write); it REPLACES base :134-136 (measured source sizes x
    # bundle.staging_retention.budget.free_bytes_factor_package).
    # optb-after-01 (codex711 option B; codex716 (a)): C1-REQ-PKG-01 is CONSUMED. The rows are bound row by row from THIS
    # class's own artifacts rows, its captured lock rows and its fixed member caps (records-pkg-optb-01), and every value was
    # admitted (present, integer and not boolean, > 0, distinct names, exact coverage of the staged rels) for EVERY class
    # in package.yml's preflight P7-P9 before any class publication. Nothing here re-reads or re-validates a cap; N13 s03
    # keeps its own final admission (rows keys == staged rels, total >= sum, need >= total + max). Caps are ceilings.
    # BLOCKED-ON-GENESIS-GL _rh_pkg_alloc (GL-REQ-PKG-03).
    rh_rsv_max_bytes: "{{ _rh_pkg_alloc[rh_pub_key] }}"
    rh_rsv_need: "{{ _rh_pkg_alloc[rh_pub_key].total + (_rh_pkg_alloc[rh_pub_key].rows.values() | max) }}"
    # base :137-141: the owned manifest of a staging dir of this destination (the reaper's scope)
    rh_rsv_members: >-
      {{ [rh.controller.bootstrap.bundle.seed_file, rh.controller.bootstrap.bundle.launcher_file, rh.controller.bootstrap.bundle.manifest_file,
          rh.controller.bootstrap.bundle.checksum_file, rh.controller.bootstrap.bundle.artifacts_dir]
         + ((rh_pub_controller.bootstrap.artifacts + _rh_pkg_lock[rh_pub_key].packages + _rh_pkg_lock[rh_pub_key].collections) | map(attribute='file')
            | map('regex_replace', '^', rh.controller.bootstrap.bundle.artifacts_dir ~ rh.controller.bootstrap.path_admission.separator) | list) }}
    # base :150-152: the staged artifact directory (declared mkdir, no -p, 0700 inside N13)
    rh_rsv_dirs:
      - "{{ rh.controller.bootstrap.bundle.artifacts_dir }}"
    # base :154-162: every admitted artifact, in declared order, under bundle.artifacts_dir. optb-after-01: C1-REQ-PKG-02
    # consumed, the mode is bundle.member_modes.artifact (records-pkg-02; the one node admit_bundle also reads).
    rh_rsv_copies: >-
      {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
      {%- set ns = namespace(l=[]) -%}
      {%- for a in rh_pub_controller.bootstrap.artifacts + _rh_pkg_lock[rh_pub_key].packages + _rh_pkg_lock[rh_pub_key].collections -%}
      {%- set ns.l = ns.l + [{'src': lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) ~ sep ~ a.file,
                              'rel': rh.controller.bootstrap.bundle.artifacts_dir ~ sep ~ a.file,
                              'sha256': a.sha256, 'mode': rh.controller.bootstrap.bundle.member_modes.artifact}] -%}
      {%- endfor -%}
      {{ ns.l }}
    # base :164-207 and the seed half of :209-239: the seed, then the launcher. N10 renders and re-renders ONE vars mapping;
    # the seed's is base :228-234's readback mapping (lme_seed_dispatch only when the class's dispatch_admission mode is
    # the generation mode; the seed template reads it only then, lme-controller-seed.sh.j2 :24-27).
    # optb-after-01: the seed's mode is bundle.member_modes.seed_file (C1-REQ-PKG-02 consumed; the launcher keeps
    # launcher_mode). lme_seed_lock is the class capture: the seed macro reads only its packages / collections
    # (controller_seed.j2 :35, :38, :705, :711, :835-868, :970), the same parsed rows as before, from the verified bytes.
    rh_rsv_renders:
      - name: "{{ rh.controller.bootstrap.bundle.seed_file }}"
        src: "{{ rh.controller.bootstrap.template_rel }}"
        rel: "{{ rh.controller.bootstrap.bundle.seed_file }}"
        mode: "{{ rh.controller.bootstrap.bundle.member_modes.seed_file }}"
        vars: >-
          {{ {'lme_seed_bs': rh_pub_controller.bootstrap, 'lme_seed_ctl': rh_pub_controller,
              'lme_seed_lock': _rh_pkg_lock[rh_pub_key]}
             | combine({'lme_seed_dispatch': rh_pub_controller.entry_generation.dispatch}
                       if rh_pub_controller.bootstrap.source_admission.dispatch_admission.mode == rh_pub_controller.bootstrap.source_admission.dispatch_modes.generation else {}) }}
      - name: "{{ rh.controller.bootstrap.bundle.launcher_file }}"
        src: "{{ rh.controller.bootstrap.seed_launcher.template_rel }}"
        rel: "{{ rh.controller.bootstrap.bundle.launcher_file }}"
        mode: "{{ rh.controller.bootstrap.bundle.launcher_mode }}"
        vars:
          lme_seed_bs: "{{ rh_pub_controller.bootstrap }}"
    # base :241-325 (RH-BUNDLE-CHECKSUM-NEWLINES kept): the Ansible-free consumer check in the ONE checksum_format grammar,
    # seed + launcher (their N10-admitted staged digests) + every artifact; content and terminator bind the line separator
    # in a {% set %} STATEMENT (string constants there are not backslash-escaped), never as a '\n' constant inside {{ }}.
    # optb-after-01: mode is bundle.member_modes.checksum_file (C1-REQ-PKG-02 consumed); each row line is built from that
    # row's own sha256 and file (no zip). The {'newline': ...} map in the two {% set %} lines is the carried base :254
    # literal (unchanged; C1-REQ-PKG-04 pre_publish.terminators stays bound to N13 only, ATOMIC JOIN below).
    rh_rsv_checks:
      - name: "{{ rh.controller.bootstrap.bundle.checksum_file }}"
        rel: "{{ rh.controller.bootstrap.bundle.checksum_file }}"
        mode: "{{ rh.controller.bootstrap.bundle.member_modes.checksum_file }}"
        line_regex: "{{ '^' ~ rh.controller.bootstrap.bundle.checksum_format.digest ~ rh.controller.bootstrap.bundle.checksum_format.separator ~ rh.controller.bootstrap.bundle.checksum_format.name ~ '$' }}"
        terminator: >-
          {% set cf = rh.controller.bootstrap.bundle.checksum_format -%}
          {% set nl = {'newline': '\n'}[cf.terminator] -%}
          {{ nl }}
        content: >-
          {% set cf = rh.controller.bootstrap.bundle.checksum_format -%}
          {% set nl = {'newline': '\n'}[cf.terminator] -%}
          {% set ns = namespace(l=[_rh_ra_rendered[rh.controller.bootstrap.bundle.seed_file].sha256 ~ cf.separator ~ rh.controller.bootstrap.bundle.seed_file,
                                    _rh_ra_rendered[rh.controller.bootstrap.bundle.launcher_file].sha256 ~ cf.separator ~ rh.controller.bootstrap.bundle.launcher_file]) -%}
          {% for a in rh_pub_controller.bootstrap.artifacts + _rh_pkg_lock[rh_pub_key].packages + _rh_pkg_lock[rh_pub_key].collections -%}
          {% set ns.l = ns.l + [a.sha256 ~ cf.separator ~ rh.controller.bootstrap.bundle.artifacts_dir ~ rh.controller.bootstrap.path_admission.separator ~ a.file] -%}
          {% endfor -%}
          {{ ns.l | join(nl) ~ nl }}
    # codex696 OPEN-PKG-03 (a): the INDEPENDENT declared pre-publication check of the checksum member (base :282
    # RH-BUNDLE-CHECKSUM-NEWLINES: lines, grammar, final terminator), run by N13 s04 before its ONE publish rename; it is
    # a validation contract inside the one publisher, not a second publisher, and admit_bundle below stays. Interface:
    # req-n13-01.yml GEN-REQ-N13-S04-01 package_binder, verbatim. PENDING C1-REQ-PKG-04 (the pre_publish node),
    # GEN-REQ-N13-S04-01 (N13 s04 consumes it) and GL-REQ-PKG-01 (the name). ATOMIC JOIN (codex-tick702): this binder is
    # NOT a pre-publication check; under N13 s03 it is ignored and no check runs. The C1 pre_publish declaration, the N13
    # s04 consumer and this caller compose together or not at all; until then the debt stays named (PENDING above).
    rh_rsv_prepublish:
      rows: "{{ rh_pub_controller.bootstrap.package_publish.pre_publish.rows }}"
      terminators: "{{ rh_pub_controller.bootstrap.package_publish.pre_publish.terminators }}"
      digest_lines: "{{ rh.controller.bootstrap.bundle.checksum_format }}"
    # base :327-354: bundle.json, written LAST (N13 record). Its staged digests are N13's admitted outputs: the seed and
    # launcher from _rh_ra_rendered (N10), the check file from _rh_rsv_checked (N13 SEAL, bound to the validated text).
    # optb-after-01 REC-01 (R1; records-pkg-optb-02 manifest_record roles): mode bundle.member_modes.manifest_file. The
    # record is built FIELD BY FIELD: for each declared field f of a construction, value(roles[f]) where policy = walk
    # rh.controller (codex717 (a): the EXECUTING CONTROLLER PUBLICATION POLICY; the six declared policy roles only),
    # derived = the producer's value for that derived word (map _rd below), nested = the sub-record built the same way
    # from the named roles node. No positional zip of fields. Class content stays class-bound: artifact_rows from this
    # class's rows and capture, class_lock_sha256 = the capture's raw-byte digest (MIGRATION-PKG-LOCKSHA-01),
    # generation_id walks THIS class's controller (rh_pub_policy) by layout.generation_id order / prefixes / sources with
    # the seed digest = this render's seed sha256 (C-OPTB2-GENID-SAME). Controller-side genesis build metadata stays in the
    # nested genesis / source records and never enters expected_generation. Before publication (inside N13's render, before
    # SEAL and the publish rename) the built key set must equal the declared field list, with equal length, at the top
    # level and in every nested record; otherwise undef() | mandatory refuses. The pre-N13 role admission ran in
    # package.yml preflight P10 for every class. The _rd keys duplicate P10's implemented list _rh_pkg_impl: the visible
    # residual of VS-PKG-REC-ORDER (OPEN-REQUIRED); any drift refuses here (a missing derived word builds no key).
    # MIGRATION-PKG-SRCINPUTS-01: source.inputs follows package.yml's hand-list removal (different bytes; N13's exact
    # comparison refuses a destination published earlier; never overwritten, never UNCHANGED credit).
    # C1PKG-REQ-NESTED-LINK (non-blocking): the nested roles node -> field list pairing is by the two declared names.
    rh_rsv_record:
      name: "{{ rh.controller.bootstrap.bundle.manifest_file }}"
      rel: "{{ rh.controller.bootstrap.bundle.manifest_file }}"
      mode: "{{ rh.controller.bootstrap.bundle.member_modes.manifest_file }}"
      content: >-
        {%- set bn = rh.controller.bootstrap.bundle -%}
        {%- set mr = bn.manifest_record -%}
        {%- set gi = rh.controller.bootstrap.layout.generation_id -%}
        {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
        {%- set lk = _rh_pkg_lock[rh_pub_key] -%}
        {%- set seed_sha = _rh_ra_rendered[bn.seed_file].sha256 -%}
        {%- set g = namespace(s='') -%}
        {%- for o in gi.order -%}
        {%- if 'digest' in gi.sources[o] -%}
        {%- set g.s = g.s ~ gi.prefixes[o] ~ {'seed_sha256': seed_sha}[gi.sources[o].digest][:gi.seed_digest_chars] -%}
        {%- else -%}
        {#- optb-after-04: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
        {%- set w = namespace(n=rh_pub_controller) -%}
        {%- for s in gi.sources[o].policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.n = w.n[s] -%}{%- endfor -%}
        {%- set g.s = g.s ~ gi.prefixes[o] ~ w.n -%}
        {%- endif -%}
        {%- endfor -%}
        {%- set ar = namespace(l=[]) -%}
        {%- for a in rh_pub_controller.bootstrap.artifacts + lk.packages + lk.collections -%}
        {%- set ar.l = ar.l + [a.file ~ mr.row_separator ~ a.sha256] -%}
        {%- endfor -%}
        {%- set si = namespace(l=[]) -%}
        {%- for r in _rh_src_inputs.results -%}
        {%- set si.l = si.l + [(r.stat.path | regex_replace('^' ~ (rh_repo_root | regex_escape) ~ (sep | regex_escape), '')) ~ mr.row_separator ~ r.stat.checksum] -%}
        {%- endfor -%}
        {%- set gb = _lme_global_file.lme_config_registry.remote_harness_schema.generation_binding -%}
        {%- set provenance = namespace(v={}) -%}
        {%- for field, role in gb.provenance_fields | dictsort -%}
        {%- set provenance.v = provenance.v | combine({field: rh_pub_binding[gb.fields[role]]}) -%}
        {%- endfor -%}
        {%- set _rd = {'class_allocation': _rh_pkg_alloc[rh_pub_key], 'recipe_provenance': provenance.v, 'seed_render_sha256': seed_sha,
                       'launcher_render_sha256': _rh_ra_rendered[bn.launcher_file].sha256,
                       'generation_id': g.s,
                       'profile_sha256': rh_profile_sha256,
                       'class_lock_sha256': lk.sha256,
                       'class_key': rh_pub_key,
                       'artifact_rows': ar.l,
                       'checksum_file_sha256': _rh_rsv_checked[bn.checksum_file],
                       'builder': rh_builder,
                       'repo_root': rh_repo_root,
                       'repo_head': _rh_src_git.results[0].stdout,
                       'worktree_status_sha256': _rh_src_git.results[1].stdout | hash('sha256'),
                       'worktree_dirty': _rh_src_git.results[1].stdout | length > 0,
                       'source_input_rows': si.l} -%}
        {%- set links = {'source_roles': mr.source_fields, 'genesis_roles': mr.genesis_fields} -%}
        {#- optb-after-02 (records-pkg-optb-03): policy roles walk from the declared scope root (policy_scope fact + path),
            and every roles node's {policy} roles must be EXACTLY its policy_scope members (none for a node without one) -#}
        {%- set ps = mr.policy_scope -%}
        {%- set root = namespace(n=lookup('ansible.builtin.vars', ps.fact)) -%}
        {%- for s in ps.path -%}{%- set root.n = root.n[s] -%}{%- endfor -%}
        {%- set pok = namespace(ok=true) -%}
        {%- for nn in ['roles'] + (links | list) -%}
        {%- set pf = mr[nn] | dict2items | selectattr('value.policy', 'defined') | map(attribute='key') | list -%}
        {%- if nn in ps.members -%}
        {%- if (pf | sort) != (ps.members[nn] | sort) or (pf | length) != (ps.members[nn] | length) -%}{%- set pok.ok = false -%}{%- endif -%}
        {%- elif pf | length > 0 -%}{%- set pok.ok = false -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if ps.members | list | reject('in', ['roles'] + (links | list)) | list | length > 0 -%}{%- set pok.ok = false -%}{%- endif -%}
        {%- set sub = namespace(m={}, ok=true) -%}
        {%- for f in mr.fields if 'nested' in mr.roles[f] -%}
        {%- set rn = mr[mr.roles[f].nested] -%}
        {%- set fl = links[mr.roles[f].nested] -%}
        {%- set b = namespace(m={}) -%}
        {%- for nf in fl -%}
        {%- set r = rn[nf] -%}
        {%- if 'derived' in r and r.derived in _rd -%}{%- set b.m = b.m | combine({nf: _rd[r.derived]}) -%}
        {%- elif 'policy' in r -%}
        {#- optb-after-04: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
        {%- set w = namespace(n=root.n) -%}
        {%- for s in r.policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.n = w.n[s] -%}{%- endfor -%}
        {%- set b.m = b.m | combine({nf: w.n}) -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if (b.m | list | sort) != (fl | sort) or (b.m | length) != (fl | length) -%}{%- set sub.ok = false -%}{%- endif -%}
        {%- set sub.m = sub.m | combine({f: b.m}) -%}
        {%- endfor -%}
        {%- set top = namespace(m={}) -%}
        {%- for f in mr.fields -%}
        {%- set r = mr.roles[f] -%}
        {%- if 'nested' in r -%}{%- set top.m = top.m | combine({f: sub.m[f]}) -%}
        {%- elif 'derived' in r and r.derived in _rd -%}{%- set top.m = top.m | combine({f: _rd[r.derived]}) -%}
        {%- elif 'policy' in r -%}
        {#- optb-after-04: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
        {%- set w = namespace(n=root.n) -%}
        {%- for s in r.policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}{%- set w.n = w.n[s] -%}{%- endfor -%}
        {%- set top.m = top.m | combine({f: w.n}) -%}
        {%- endif -%}
        {%- endfor -%}
        {%- if pok.ok and sub.ok and (top.m | list | sort) == (mr.fields | sort) and (top.m | length) == (mr.fields | length) -%}
        {{ top.m | to_nice_json }}
        {%- else -%}
        {{ undef() | mandatory(lookup('ansible.builtin.template',
                                      rh_repo_root ~ sep ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                                      template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                                     'rh_rf_code': rh.controller.bootstrap.genesis.builder.refusal,
                                                     'rh_rf_detail': [rh_pub_key, mr.fields | to_json, top.m | list | sort | to_json]})) }}
        {%- endif -%}

- name: Admit the published bundle exactly (members, modes, digests, fresh-render seed, manifest, class key)
  ansible.builtin.include_tasks: admit_bundle.yml
  vars:
    rh_admit_dir: "{{ rh_pub_dir }}"
    rh_admit_key: "{{ rh_pub_key }}"
    rh_admit_policy: "{{ rh_pub_policy }}"
    rh_admit_controller: "{{ rh_pub_controller }}"
    rh_admit_binding: "{{ rh_pub_binding }}"
    rh_admit_lock: "{{ _rh_pkg_lock[rh_pub_key] }}"

# optb-after-05 (C1-PKG records-pubrcpt-01 REQ-PUBRCPT-01 / -03; consumers_owed row 1): this class's receipt entry, built
# from the admitted rh_bundle (admit_bundle, the bundle as published), the class capture's raw-byte digest and the N13
# outcome word. The entry's key set is checked against the declared receipt.class_fields (a later field extension refuses
# here, never silently omitted); _rh_pkg_rcpt is initialized by package.yml before the class loop (no fallback here).
# optb-after-06 (C1-PKG records-pubrcpt-02 rulings.class_fields / outcomes / class_records.write / readmit; B-CLS-4): the
# entry gains trusted_oid and becomes a CLASS RECORD written once after this admit_bundle (before the next class), or a
# present record (observed and pre-admitted BEFORE N13, above) re-admitted; the receipt entry is then the record value.
# Absent: bind this run's entry word (outcome = observed_on_resume when resumed and N13 reports unchanged, else N13's
# word) -> ONE write (force false) at class_records.mode -> ONE readback. Either case: stat -> admit -> accumulate.
# OPEN-PKG06-OUTCOME-ROLES: N13 reports its own words published / unchanged (reserve_publish :537); receipt.outcomes is
# [published, unchanged, observed_on_resume], and the unchanged / observed_on_resume roles are read POSITIONALLY
# (outcomes[1], outcomes[2]) until declared role words exist. Skipped-register note: _rh_pkg_rcpt_crec_back is re-registered
# (skipped) by the absent-only readback on the present path, so after the include the present bytes are read only from
# _rh_pkg_rcpt_crec_word (bound from that one read before N13; a skipped set_fact leaves it untouched).
- name: Bind this class's entry word when no record is present (keys exactly class_fields; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_word)
  when: not _rh_pkg_rcpt_crec_pre.stat.exists
  ansible.builtin.set_fact:
    _rh_pkg_rcpt_crec_word: >-
      {%- set rc = rh.controller.bootstrap.package_publish.receipt -%}
      {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
      {%- if _rh_pkg_rcpt_resumed and _rh_rsv_outcome == rc.outcomes[1] -%}{%- set o = rc.outcomes[2] -%}{%- else -%}{%- set o = _rh_rsv_outcome -%}{%- endif -%}
      {%- set e = {'bundle': rh_bundle, 'lock_sha256': _rh_pkg_lock[rh_pub_key].sha256, 'outcome': o, 'trusted_oid': _rh_pkg_rcpt_trusted} -%}
      {%- if (rh_bundle | list | sort) == (rc.bundle_fields | sort) and (rh_bundle | length) == (rc.bundle_fields | length)
              and _rh_rsv_outcome in rc.outcomes and o in rc.outcomes
              and (e | list | sort) == (rc.class_fields | sort) and (e | length) == (rc.class_fields | length)
              and rh_pub_key not in _rh_pkg_rcpt -%}
      {{ {'json': e | to_json(sort_keys=true)}[rc.class_records.format] }}
      {%- else -%}
      {{ undef() | mandatory(lookup('ansible.builtin.template',
                                    rh_repo_root ~ sep ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                                   'rh_rf_code': rc.refusal,
                                                   'rh_rf_detail': [rh_pub_key, rc.class_fields | to_json, e | list | sort | to_json,
                                                                    rh_bundle | list | sort | to_json, _rh_rsv_outcome]})) }}
      {%- endif -%}

- name: Write this class's record once when absent (class_records.mode; force false; a present record is re-admitted below, never rewritten)
  when: not _rh_pkg_rcpt_crec_pre.stat.exists
  block:
    - name: Write this class's record
      ansible.builtin.copy:
        content: "{{ _rh_pkg_rcpt_crec_word }}"
        dest: "{{ _rh_pkg_rcpt_crec_out }}"
        mode: "{{ rh.controller.bootstrap.package_publish.receipt.class_records.mode }}"
        force: false
  rescue:
    - name: Refuse a failed class record write
      ansible.builtin.fail:
        msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                   'rh_rf_detail': [_rh_pkg_rcpt_crec_out, ansible_failed_result.msg]}) }}

- name: Read the written class record back once (absent case only; the present record was read before N13; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_back)
  when: not _rh_pkg_rcpt_crec_pre.stat.exists
  ansible.builtin.slurp:
    src: "{{ _rh_pkg_rcpt_crec_out }}"
  register: _rh_pkg_rcpt_crec_back

- name: Observe this class's record (mode, owner, digest; no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_crec_post)
  ansible.builtin.stat:
    path: "{{ _rh_pkg_rcpt_crec_out }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.source_admission.digest_algorithm }}"
  register: _rh_pkg_rcpt_crec_post

# written -> the readback bytes equal this run's word. present -> this run resumed, N13 reports unchanged (a publish or
# refusal on a record-present class refuses after the effect, nothing is deleted: the destination must already hold it),
# rh_bundle keys exactly bundle_fields, the class not yet accumulated, and the bytes kept before N13 equal this run's entry
# {rh_bundle, capture lock_sha256, one declared outcome, trusted oid} (the record's historical outcome; byte-equal).
# _rh_pkg_rcpt_crec_back is read only on the absent branch. Then regular file (no link), class_records.mode, the builder,
# and the digest of the bytes admitted.
- name: Refuse a class record that is not exactly the written or re-admitted word (bytes, regular file, mode, owner, digest)
  vars:
    _rh_pkg_bad: >-
      {%- set rc = rh.controller.bootstrap.package_publish.receipt -%}
      {%- set st = _rh_pkg_rcpt_crec_post.stat -%}
      {%- set ns = namespace(l=[], c=[]) -%}
      {%- if _rh_pkg_rcpt_crec_pre.stat.exists -%}
      {%- set by = _rh_pkg_rcpt_crec_word -%}
      {%- for o in rc.outcomes -%}{%- set ns.c = ns.c + [{'json': {'bundle': rh_bundle, 'lock_sha256': _rh_pkg_lock[rh_pub_key].sha256, 'outcome': o, 'trusted_oid': _rh_pkg_rcpt_trusted} | to_json(sort_keys=true)}[rc.class_records.format]] -%}{%- endfor -%}
      {%- if by not in ns.c or not _rh_pkg_rcpt_resumed or _rh_rsv_outcome != rc.outcomes[1]
             or (rh_bundle | list | sort) != (rc.bundle_fields | sort) or (rh_bundle | length) != (rc.bundle_fields | length)
             or rh_pub_key in _rh_pkg_rcpt -%}{%- set ns.l = ns.l + [[_rh_pkg_rcpt_crec_out, _rh_pkg_rcpt_resumed, _rh_rsv_outcome]] -%}{%- endif -%}
      {%- else -%}
      {%- set by = _rh_pkg_rcpt_crec_back.content | b64decode -%}
      {%- if by != _rh_pkg_rcpt_crec_word -%}{%- set ns.l = ns.l + [[_rh_pkg_rcpt_crec_out]] -%}{%- endif -%}
      {%- endif -%}
      {%- if not st.exists or not st.isreg or st.islnk or st.mode != rc.class_records.mode or st.uid != rh_builder.uid | int
             or st.checksum != (by | hash(rh.controller.bootstrap.source_admission.digest_algorithm)) -%}
      {%- set ns.l = ns.l + [[_rh_pkg_rcpt_crec_out, st.exists]] -%}{%- endif -%}
      {{ ns.l }}
  ansible.builtin.assert:
    that:
      - _rh_pkg_bad | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                               'rh_rf_detail': [rh_pub_key, _rh_pkg_bad | to_json]}) }}
    quiet: true

- name: Accumulate this class's publication receipt entry (the admitted record value; keys exactly class_fields)
  ansible.builtin.set_fact:
    _rh_pkg_rcpt: "{{ _rh_pkg_rcpt | combine({rh_pub_key: _rh_pkg_rcpt_crec_word | from_json}) }}"

# codex-tick702 reap_register: the after-02 post-publication reap assert is removed (a refusal there was a report failure
# after publication, never proof the artifact was withheld). The reap result is admitted INSIDE the one publisher where
# reap_staging.yml returns, before the reservation (n13-reap-01.change.yml; PENDING the N13 owner, GL-REQ-PKG-02), and
# this report reads only that admitted _rh_rsv_reaped. A later report failure leaves the committed bundle and its
# publication evidence in place; a rerun resumes by verified state (N13 finds the destination present, compares every
# sealed file, UNCHANGED; admit_bundle re-admits): nothing is deleted and nothing is published twice.
- name: Report the package result
  ansible.builtin.debug:
    msg: >-
      {{ _rh_rsv_outcome | upper }}
      {{ rh_bundle.expected_generation }} {{ rh_pub_dir }} class {{ rh_pub_key }}; stale staging reaped before reservation:
      {{ _rh_rsv_reaped }}
      payload_bytes {{ _rh_rsv_bytes | to_json(sort_keys=true) }} of total {{ _rh_pkg_alloc[rh_pub_key].total }}
