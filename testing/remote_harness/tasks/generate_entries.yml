---
# testing/remote_harness/tasks/generate_entries.yml -- the ENTRY GENERATION consumer (codex-tick417 option B; route r2k,
# superseding r2j a2ce6e5f per codex-tick454; binds B r5p transfer.decl.after.yml
# b93e2c060cbdb58a10bf5e81540f925c7f6005e8d7cb0ab913b4a4cf64d1a12a, which REPLACES r5o 5c65d292 -- earlier ":line"
# citations below name r5o lines whose nodes r5p keeps unchanged (cross-owner-proposals a9948be1 unchanged_meaning);
# dependencies named in coordinator-proposals R2K-DEP-*; R1 s8 C1-S8-EG-R2H). AUTHORED, NEVER EXECUTED (UNRUN).
#
# DECLARATIONS. Route operation/render/dispatch policy: rh.controller.entry_generation (C1 node BESIDE
# controller.bootstrap). Everything about entries AND records is the C1 projection P = lme_resolved.remote_harness
# .entry_generation, read ONCE by C1 from transfer.decl generation (B r5m): membership-only roster rows, retire intents,
# the record ROLE MAPS (every record / journal / row key set is DERIVED here from its role map's values -- B r5m
# X-R2-R5M-2: no positional key list), the record LOCATORS (P.records.locations; codex-tick440 P1: B owns them, R2 places
# nothing), refusals, closure, bodies, never-generated set, interface entries.
#
# RECORDS (B r5m; codex-tick433 acyclic identity): accepted.yml + retained.yml are TRACKED checkout files (structured
# YAML, P10); in-progress.yml (the JOURNAL) lives under the controller's run sub-root and is never carried. A record
# NEVER contains its own digest; its identity is its EXTERNAL exact-file sha256, held by its successor (predecessor role),
# by the bundle source.inputs line and by the seed dispatch measurement.
# BYTE BINDING (R2I-RECORD-BYTE-BINDING): each present record is READ ONCE (slurp); that one value is hashed (sha256 =
# the observed and the externally held digest), its git blob id is computed from the SAME bytes and compared with the
# admitted commit's tree id, and that same value is parsed (block/rescue: a failed decode/parse refuses with the declared
# unbound cause, CUS-04). Nothing is re-read for content after admission.
# REFUSAL PRECEDENCE (B r5m precedence): integrity first -- foreign (tree membership, blob id, external digest), then
# unbound (decode, parse, shape) -- then, for a MISSING accepted record: generate with a roster output present ORPHAN,
# verify / package / invoke ABSENT.
# FIRST GENERATION (R2I-PRISTINE-CLASSIFICATION; B r5p operations.generate.genesis_requires [records_observed_absent,
# independent_genesis_admission] -- X-R2-R5P-GENESIS accepted; the old pristine-by-absence is withdrawn by B): never
# inferred from absence. independent_genesis_admission = the DECLARED genesis transition input (or the resume of a
# journal that recorded one); records_observed_absent = the locators below. It needs both,
# no journal of another lineage, no roster output present, and the record locators ABSENT from the admitted commit tree
# as well as the worktree (worktree-only loss refuses: custody lost). Committed deletion of every record needs lifecycle
# state outside the deletable set -- GEN-ADOPT2 (codex-tick512 ADO-LOST-RECORD-RELABEL; X-R2J-LINEAGE / LIN-03, until now
# an OPEN issue with no implementation) IMPLEMENTS it: that state is the commit graph reachable from the admitted HEAD,
# which no later commit can delete. Every FIRST generation (genesis, adopt admit, and the resume of either journal)
# passes the record locators as the shared include's `lineage`: any commit reachable from HEAD (merges included) that
# ever touched them refuses custody_lost (a lost record history is never a fresh first generation), and a shallow
# repository refuses the same way (absence of history unprovable). Residual (disclosed): rewriting HEAD's ancestry
# itself (a history rewrite that drops the record commits) is outside this admission.
# AUTHORED-TO-GENERATED ADOPTION (codex-tick506 GEN-AUTHORED-TO-GENERATED-ADOPTION; Codex504 OD-W2-09): the THIRD declared
# transition kind (transition.kinds.adopt) admits a FIRST generation over PRESENT authored roster outputs, never by absence
# and never by relabelling. It needs ALL of: the adopt transition + the reviewed manifest digest input
# (transition.adoption_var, the independent holder); the TRACKED, admission-only adoption manifest at B's locator
# (records.locations.adoption_rel) whose exact-file sha256 equals that input; the record locators absent (as genesis);
# every PRESENT roster output named by the manifest (an unnamed one stays generic ORPHAN) with its exact sha256 and blob id
# (worktree stat + the shared git admission); GEN-ADOPT2: the manifest is EXACTLY B's independently reviewed
# eligibility (generation.adoption.eligibility: the source baseline commit + output_rel -> blob id; a lost record's
# outputs are never in it, and the lineage gate above refuses once records ever existed); the named source edition PROVEN
# by the shared include's bounded historical proof (a commit reachable from HEAD whose tree holds every authored path,
# every retention copy and the roster at their declared blob ids -- historical roster binding, codex-tick512
# ADO-HISTORICAL-ROSTER: current-roster membership only at admit and at the repeat boundary); and every authored output's
# exact bytes PRESERVED at a committed retention row
# under the declared retention root (controller.entry_generation.adoption.retention_root_rel), outside every admission /
# render / closure / output path and outside every EXECUTABLE closure (dispatch.closure_rel, source-admission members,
# importers and bodies) -- all validated BEFORE the journal write. EVIDENCE CLOSURE (codex-tick512
# ADO-DISPATCHED-EVIDENCE-CLOSURE): the manifest, every retention row and the history reaching the source edition are
# re-proven by EVERY operation that carries the adoption, wherever this verifier executes (seed: the packaged checkout
# bound by the bundle checkout field; no controller-only copy). The first generated record has predecessor =
# the genesis marker (no fabricated predecessor) and roles.adoption = the manifest digest (adoption provenance, distinct
# from predecessor history); successors carry it unchanged. A repeated adopt over that record verifies the exact
# transition (unchanged apply) or refuses: never a reset. The manifest is never a render input (generation digest unmoved).
# OWNERSHIP (r2k R2J-RECORD-SCHEMA-JOIN = B r5o 5c65d292 roles.completed :590 + reconciliation :610-641; supersedes the
# r2j cumulative retired carry and the (2b) re-admission branch): against the independently bound predecessor P
# (retained, custody-admitted), the successor S is partitioned:
#   (1) P.owned - S.owned == S.retired (predecessor == P digest) DISJOINT-UNION opened (S.obligations, origin == P digest)
#   (2) P.obligations == carried (S.obligations, origin != P digest, identical rows) DISJOINT-UNION S.completed
#       (origin and reason kept from the P obligation)
#   (3) r5p reconciliation.historical: S.historical == H(P) - readmitted(S), H(P) = P.historical + P.retired +
#       P.completed; P.historical rows copied, P.retired {origin: predecessor, closed_by: P digest}, P.completed
#       {origin, closed_by: P digest}; readmitted = an S.owned output (roster row + owned sha256 of this generation)
#   S.owned, S.retired, S.completed, S.obligations, S.historical pairwise disjoint; a pending path is never re-owned.
#   P.retired / P.completed / P.historical are NOT inputs to (1)/(2) (history is never newly removed).
# HISTORICAL ABSENCE (HIST-01; NOT RET-01 retention) is a SEPARATE check on the HEAD: every H(A) path not re-admitted by
# the current roster must be ABSENT (one worktree stat + the commit probe) at EVERY operation, before any write
# (carried historical -> historical_absence; the head's retired / completed -> unreconciled_successor). Obligation paths
# stay IN SCOPE (stat + probe) and are admitted while present (B OB-06); an obligation becomes a COMPLETED row only at a
# later generate that OBSERVES its absence (completed_requires verified_absence). An UNCHANGED apply writes no
# successor (R2K-UNCHANGED-APPLY). Incompatible record / journal shapes refuse BEFORE any journal or mirror write.
# JOURNAL (R2I-INTERRUPTED-OBLIGATIONS): written before any staged write; carries the predecessor digest, the intended
# source_edition / inputs / revision, the pending rows and the predecessor's obligations. A resume with other intended
# inputs needs the declared rebind transition (obligations kept) or refuses changed_input. Generate clears only the
# journal it wrote in the SAME run of an UNCHANGED apply (R2K-UNCHANGED-APPLY; genesis context); otherwise it is
# cleared only where a committed accepted record SATISFIES it (successor of the journal's predecessor, same intended
# inputs, every pending / inherited obligation held as an obligation or a verified completion): genesis verify / package
# (after every gate) or the next generate. The seed context never mutates it and refuses an unsatisfied one.
#
# Contexts (contexts.var: an include parameter, EXACT reserved output, pinned values refused by refuse_pinned_outputs.yml):
#   genesis  package.yml under the admitted genesis builder; operation = operation.var or the declared absent mode;
#            mirror parent = this act's genesis stage root; intended commit = rh_src_admission edition (launcher input).
#   seed     verify_entries.yml, started only by the seed's entry dispatch; operation FIXED to verify; mirror parent = the
#            seed-created dispatch tmp; intended commit = the dispatched edition.
# GENERATE (authoring; the checkout is NEVER written): stages outputs + the proposed accepted record + the retained
# predecessor in the owned mirror; acceptance = the author's reviewed commit of the mirror bytes (and the deletion of
# completed-retirement paths). VERIFY / PACKAGE / (seed) INVOKE: every gate, no repair; VERIFY re-renders through the SAME
# render task, so generated-member equality and drift (R1 s8 GEN-03 drift part) are checked here.
# Nothing here executes, imports or syntax-checks a generated entry; no entry is run to admit itself.
# Inputs: rh, rh_repo_root, rh_config_revision, lme_resolved, lme_remote_harness_overridden_paths, rh_src_admission
# (tasks/admit_loader_source.yml), the context include parameter, operation.var / transition.var (genesis) or
# dispatch.input_var (seed). Outputs (registry family reserved_entry_gen_vars): rh_eg_ctx, rh_eg_op, rh_eg_tr, rh_eg_plan,
# rh_eg_uid, rh_eg_rec, rh_eg_mirror_parent, rh_eg_edition, rh_eg_evidence, rh_eg_succ, rh_eg_unchanged (r2k r5p;
# registry hunk C1-R2K-RESERVED-UNCHANGED), rh_eg_adopt (GEN-AUTHORED-TO-GENERATED-ADOPTION; registry hunk H-MAIN-GLO-ADO-01).
# Adoption input: transition.adoption_var (with the adopt transition only; a resume consumes the journal-bound identity and
# never a replacement -- codex-tick512 OD-ADO-06). Mode vocabulary: B generation.adoption.modes, projected by C1 at
# lme_resolved.remote_harness.entry_generation.adoption.modes (codex-tick512 OD-ADO-04).

- name: "ENTRY GENERATION -- refuse an active generation contract whose node or projection is missing (typed; codex-tick424 missing_declaration)"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.entry_generation_contract is mapping
      - lme_resolved.remote_harness.entry_generation_contract.active is sameas true
      - rh.controller.entry_generation is defined
      - rh.controller.entry_generation is mapping
      - lme_resolved.remote_harness.entry_generation is defined
      - lme_resolved.remote_harness.entry_generation is mapping
    fail_msg: >-
      REFUSED {{ lme_resolved.remote_harness.entry_generation_contract.refusal }}:
      {{ lme_resolved.remote_harness.entry_generation_contract.message }}
      {{ [lme_resolved.remote_harness.entry_generation_contract.active, rh.controller.entry_generation is defined,
          lme_resolved.remote_harness.entry_generation is defined] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- refuse pre-supplied generation names (registry family; an extra-var outranks set_fact)"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.entry_generation.names_family is string
      - (vars | list) | select('match', lme_resolved.remote_harness.entry_generation.names_family) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.pinned }}:
      {{ rh.controller.entry_generation.messages.pinned }}
      {{ (vars | list) | select('match', lme_resolved.remote_harness.entry_generation.names_family) | list | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- refuse an undeclared or absent context (include parameter; no default)"
  vars:
    _rh_eg_c: "{{ rh.controller.entry_generation.contexts }}"
  ansible.builtin.assert:
    that:
      - (q('ansible.builtin.varnames', '^' ~ _rh_eg_c.var ~ '$') | length) == 1
      - lookup('ansible.builtin.vars', _rh_eg_c.var) is string
      - lookup('ansible.builtin.vars', _rh_eg_c.var) in _rh_eg_c.kinds
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.context }}:
      {{ rh.controller.entry_generation.messages.context }}
      {{ [_rh_eg_c.var, _rh_eg_c.kinds | list] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- bind the context and the operation (seed: fixed by the declaration; genesis: input or the declared absent mode)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_k: "{{ lookup('ansible.builtin.vars', rh.controller.entry_generation.contexts.var) }}"
    _rh_eg_has_op: "{{ (q('ansible.builtin.varnames', '^' ~ rh.controller.entry_generation.operation.var ~ '$') | length) > 0 }}"
  ansible.builtin.set_fact:
    rh_eg_ctx: "{{ _rh_eg_d.contexts.kinds[_rh_eg_k] | combine({_rh_eg_d.contexts.name_field: _rh_eg_k}) }}"
    rh_eg_op: >-
      {{ _rh_eg_d.operation.modes[_rh_eg_d.contexts.kinds[_rh_eg_k][_rh_eg_d.contexts.fixed_operation_field]]
         if _rh_eg_d.contexts.fixed_operation_field in _rh_eg_d.contexts.kinds[_rh_eg_k]
         else (lookup('ansible.builtin.vars', _rh_eg_d.operation.var) if _rh_eg_has_op
               else _rh_eg_d.operation.modes[_rh_eg_d.operation.absent]) }}

- name: "ENTRY GENERATION -- refuse an undeclared operation, or an operation input in a fixed-operation context (before any read)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_has_op: "{{ (q('ansible.builtin.varnames', '^' ~ rh.controller.entry_generation.operation.var ~ '$') | length) > 0 }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_d.operation.modes is mapping
      - _rh_eg_d.operation.absent in _rh_eg_d.operation.modes
      - rh_eg_op is string
      - rh_eg_op in (_rh_eg_d.operation.modes.values() | list)
      - not (_rh_eg_d.contexts.fixed_operation_field in rh_eg_ctx and _rh_eg_has_op)
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.operation }}:
      {{ _rh_eg_d.messages.operation }}
      {{ [_rh_eg_d.operation.var, rh_eg_op, _rh_eg_d.operation.modes, rh_eg_ctx[_rh_eg_d.contexts.name_field], _rh_eg_has_op] | to_json }}
    quiet: true

# TRANSITION (r2j): the ONE declared lifecycle transition input (transition.var; absent = none, never a default value).
# genesis = the declared first generation (R2I-PRISTINE-CLASSIFICATION); rebind = resume a journal under changed intended
# inputs (R2I-INTERRUPTED-OBLIGATIONS); adopt = the declared first generation over present AUTHORED roster outputs
# (GEN-AUTHORED-TO-GENERATED-ADOPTION; header). Generate only; any other operation or context refuses a supplied transition.
- name: "ENTRY GENERATION -- bind the declared transition input (absent = none)"
  vars:
    _rh_eg_has_tr: "{{ (q('ansible.builtin.varnames', '^' ~ rh.controller.entry_generation.transition.var ~ '$') | length) > 0 }}"
  ansible.builtin.set_fact:
    rh_eg_tr: "{{ lookup('ansible.builtin.vars', rh.controller.entry_generation.transition.var) if _rh_eg_has_tr else none }}"

- name: "ENTRY GENERATION -- refuse an undeclared transition, or a transition outside generate"
  vars:
    _rh_eg_T: "{{ rh.controller.entry_generation.transition }}"
  ansible.builtin.assert:
    that:
      - rh_eg_tr is none or (rh_eg_tr is string and rh_eg_tr in (_rh_eg_T.kinds.values() | list))
      - rh_eg_tr is none or rh_eg_op == rh.controller.entry_generation.operation.modes.generate
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.operation }}:
      {{ rh.controller.entry_generation.messages.transition }}
      {{ [_rh_eg_T.var, rh_eg_tr, _rh_eg_T.kinds, rh_eg_op] | to_json }}
    quiet: true

# ADOPTION INPUT (GEN-AUTHORED-TO-GENERATED-ADOPTION): the reviewed adoption manifest's exact-file sha256, supplied beside
# the adopt transition (transition.adoption_var; absent = none, never a default) -- the manifest identity's INDEPENDENT
# holder (as the bundle / seed values hold the accepted record's). Required with adopt, refused with any other transition.
- name: "ENTRY GENERATION -- refuse an adoption digest input without the adopt transition, or an adopt transition without it"
  vars:
    _rh_eg_T: "{{ rh.controller.entry_generation.transition }}"
    _rh_eg_n: "{{ q('ansible.builtin.varnames', '^' ~ rh.controller.entry_generation.transition.adoption_var ~ '$') | length }}"
    _rh_eg_digest: "{{ '^' ~ lme_resolved.remote_harness.entry_generation.records.digest_regex ~ '$' }}"
  ansible.builtin.assert:
    that:
      - (_rh_eg_n | int) == (1 if rh_eg_tr == _rh_eg_T.kinds.adopt else 0)
      - rh_eg_tr != _rh_eg_T.kinds.adopt or lookup('ansible.builtin.vars', _rh_eg_T.adoption_var) is string
      - rh_eg_tr != _rh_eg_T.kinds.adopt or lookup('ansible.builtin.vars', _rh_eg_T.adoption_var) is match(_rh_eg_digest)
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.operation }}:
      {{ rh.controller.entry_generation.messages.adoption_input }}
      {{ [_rh_eg_T.var, rh_eg_tr, _rh_eg_T.adoption_var, _rh_eg_n] | to_json }}
    quiet: true

# SEED CONTEXT INPUT: the seed's closed dispatch argv carries ONE JSON extra-var (dispatch.input_var) with exactly the
# declared keys: the bundle's recorded source edition, the roster digest and the invoked entries' digests the seed
# measured. Required in the seed context, refused in genesis.
- name: "ENTRY GENERATION -- refuse a missing, extra or malformed dispatch input (seed context only; refused in genesis)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_n: "{{ q('ansible.builtin.varnames', '^' ~ rh.controller.entry_generation.dispatch.input_var ~ '$') | length }}"
    _rh_eg_seed: "{{ rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx }}"
    _rh_eg_in: "{{ lookup('ansible.builtin.vars', rh.controller.entry_generation.dispatch.input_var) if (_rh_eg_n | int) == 1 else none }}"
    _rh_eg_digest: "{{ '^' ~ lme_resolved.remote_harness.entry_generation.records.digest_regex ~ '$' }}"
  ansible.builtin.assert:
    that:
      - (_rh_eg_n | int) == (1 if _rh_eg_seed else 0)
      - not _rh_eg_seed or _rh_eg_in is mapping
      - not _rh_eg_seed or (_rh_eg_in.keys() | list | sort) == (_rh_eg_d.dispatch.input_keys.values() | list | sort)
      - not _rh_eg_seed or _rh_eg_in[_rh_eg_d.dispatch.input_keys.edition] is match(rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].edition_regex)
      - not _rh_eg_seed or _rh_eg_in[_rh_eg_d.dispatch.input_keys.roster] is match(_rh_eg_digest)
      - not _rh_eg_seed or _rh_eg_in[_rh_eg_d.dispatch.input_keys.outputs] is mapping
      - not _rh_eg_seed or (_rh_eg_in[_rh_eg_d.dispatch.input_keys.outputs] | length) > 0
      - not _rh_eg_seed or (_rh_eg_in[_rh_eg_d.dispatch.input_keys.outputs].values() | reject('match', _rh_eg_digest) | list | length) == 0
      - not _rh_eg_seed or _rh_eg_in[_rh_eg_d.dispatch.input_keys.accepted] is match(_rh_eg_digest)
      - not _rh_eg_seed or _rh_eg_in[_rh_eg_d.dispatch.input_keys.edition] == rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition]
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.dispatch }}:
      {{ _rh_eg_d.messages.dispatch_input }}
      {{ [rh_eg_ctx[_rh_eg_d.contexts.name_field], _rh_eg_d.dispatch.input_var, _rh_eg_n, _rh_eg_d.dispatch.input_keys] | to_json }}
    quiet: true

# PLAN. Render inputs (the generation identity; never a record) are SEPARATE from admission inputs (custody, commit
# membership, bytes, provenance): admission = render inputs + the roster authority + the never-generated bootstrap files
# (generator, first guard, verifier) + the static body files the entries import (tick425-426 body_custody) + the
# dispatch closure + the EXISTING committed records (added after observation). Every list is projected or declared.
- name: "ENTRY GENERATION -- the declared plan (outputs, render inputs, admission inputs, record locations, structural paths)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    _rh_eg_wr: "{{ rh.controller.bootstrap.work_roots }}"
    _rh_eg_decls: "{{ _rh_eg_p.roster | map(attribute='bound_checkout') | map(attribute=rh.controller.entry_generation.template_vars.decl) | unique(case_sensitive=true) | sort }}"
  ansible.builtin.set_fact:
    rh_eg_plan:
      outputs_rel: "{{ _rh_eg_p.roster | map(attribute='output_rel') | list }}"
      # brr-follow-s2 J-RNP-03 (F05-S4 roster-nonplaybook view_additions): the RENDERED rows' render closure
      # (view.rendered_closure = host_scope.shared_artifacts.genesis_render templates; [] while inactive) is a render input
      # and an admission input exactly like the entry closure (digest-admitted before and after the render)
      render_inputs_rel: "{{ [_rh_eg_d.task_rel] + _rh_eg_p.closure + _rh_eg_p.rendered_closure + _rh_eg_decls }}"
      base_admission_rel: >-
        {{ ([_rh_eg_d.task_rel] + _rh_eg_p.closure + _rh_eg_p.rendered_closure + _rh_eg_decls + [_rh_eg_p.roster_source_rel]
            + _rh_eg_p.never_generated_rel + _rh_eg_p.body_rel + _rh_eg_d.dispatch.closure_rel) | unique(case_sensitive=true) | list }}
      # record LOCATORS: B-declared once (transfer.decl generation.records.locations), C1-projected (codex-tick440 P1)
      accepted_rel: "{{ _rh_eg_p.records.locations.accepted_rel }}"
      retained_rel: "{{ _rh_eg_p.records.locations.retained_rel }}"
      # GEN-AUTHORED-TO-GENERATED-ADOPTION: the tracked, admission-only adoption manifest (B locator) and the declared
      # retention root its preservation rows live under (controller.entry_generation.adoption; MAIN-owned location)
      adoption_rel: "{{ _rh_eg_p.records.locations.adoption_rel }}"
      retention_root_rel: "{{ _rh_eg_d.adoption.retention_root_rel }}"
      in_progress_abs: >-
        {{ [rh_repo_root, _rh_eg_wr.root_rel, _rh_eg_wr.sub_roots[_rh_eg_p.records.locations.in_progress.sub],
            _rh_eg_p.records.locations.in_progress.rel] | join(_rh_eg_sep) }}
      struct_paths: "{{ _rh_eg_p.struct_policy_paths | unique(case_sensitive=true) | sort }}"

- name: "ENTRY GENERATION -- refuse a malformed roster, an input/output overlap, a broken interface join or an overridden structural input"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_keys: "{{ _rh_eg_p.roster | map('dict2items') | map('map', attribute='key') | map('list') | map('sort') | unique(case_sensitive=true) | list }}"
    _rh_eg_abs: "{{ rh_eg_plan.outputs_rel | map('regex_replace', '^', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | list }}"
    _rh_eg_recs: "{{ [rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel, rh_eg_plan.adoption_rel] }}"
    _rh_eg_rroot: "{{ '^' ~ ((rh_eg_plan.retention_root_rel ~ rh.controller.bootstrap.path_admission.separator) | regex_escape) }}"
    _rh_eg_hit: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for o in lme_remote_harness_overridden_paths -%}{%- for s in rh_eg_plan.struct_paths -%}
      {%- if o == s or o.startswith(s ~ _rh_eg_p.policy_path_separator) or s.startswith(o ~ _rh_eg_p.policy_path_separator) -%}{%- set ns.o = ns.o + [[o, s]] -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}{{ ns.o }}
    _rh_eg_self: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for o in _rh_eg_p.excluded_paths -%}{%- for s in rh_eg_plan.struct_paths -%}
      {%- if o == s or o.startswith(s ~ _rh_eg_p.policy_path_separator) or s.startswith(o ~ _rh_eg_p.policy_path_separator) -%}{%- set ns.o = ns.o + [[o, s]] -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}{{ ns.o }}
    _rh_eg_iface_out: "{{ rh_eg_plan.outputs_rel | select('in', _rh_eg_p.interface_rel) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_p.schema_version == _rh_eg_d.projection_schema
      - _rh_eg_p.roster is sequence and _rh_eg_p.roster | length > 0
      # projected row keys = B's membership-only source keys + C1's derived keys; no recorded digest in a row
      - _rh_eg_p.source_keys | reject('in', _rh_eg_p.row_keys) | list | length == 0
      - _rh_eg_keys == [_rh_eg_p.row_keys | sort]
      - _rh_eg_p.roster | map(attribute='id') | unique(case_sensitive=true) | list | length == _rh_eg_p.roster | length
      - rh_eg_plan.outputs_rel | unique(case_sensitive=true) | list | length == rh_eg_plan.outputs_rel | length
      - _rh_eg_abs | reject('match', rh.controller.bootstrap.path_admission.regex) | list | length == 0
      - _rh_eg_abs | select('search', rh.controller.bootstrap.path_admission.forbidden_segment_regex) | list | length == 0
      # brr-follow-s2 J-RNP-03: the ONE partition is the view's rendered_rel (F05; no second list): an entry row's template
      # is in the entry closure, a rendered row's in the rendered closure; rendered_rel names roster outputs only
      - _rh_eg_p.rendered_rel is sequence and _rh_eg_p.rendered_rel is not string
      - _rh_eg_p.rendered_closure is sequence and _rh_eg_p.rendered_closure is not string
      - _rh_eg_p.rendered_rel | reject('in', rh_eg_plan.outputs_rel) | list | length == 0
      - _rh_eg_p.roster | rejectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='template_rel') | reject('in', _rh_eg_p.closure) | list | length == 0
      - _rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='template_rel') | reject('in', _rh_eg_p.rendered_closure) | list | length == 0
      # no output is an admission input or a record location (no global input/output overlap)
      - rh_eg_plan.outputs_rel | intersect(rh_eg_plan.base_admission_rel + _rh_eg_recs) | length == 0
      - _rh_eg_recs | intersect(rh_eg_plan.render_inputs_rel) | length == 0
      # (adoption) the three record locators are distinct; the manifest is admission-only (never a render input: above)
      - _rh_eg_recs | unique(case_sensitive=true) | list | length == _rh_eg_recs | length
      # (adoption) the retention root is an admitted relative path OUTSIDE the selected execution path: no admission
      # input, render input, closure / body / never-generated member, output or record locator lies under it
      - rh_eg_plan.retention_root_rel is string
      - (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.retention_root_rel) is match(rh.controller.bootstrap.path_admission.regex)
      - (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.retention_root_rel) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - (rh_eg_plan.base_admission_rel + rh_eg_plan.outputs_rel + _rh_eg_recs) | select('match', _rh_eg_rroot) | list | length == 0
      # INTERFACE JOIN (R2H-GUARDED-OUTPUT-JOIN): an output that is a consumer-interface member must be a DECLARED
      # interface entry; every declared interface entry is an output; no never-generated file is an interface entry
      - _rh_eg_iface_out | reject('in', _rh_eg_p.interface_entries_rel) | list | length == 0
      - _rh_eg_p.interface_entries_rel | reject('in', rh_eg_plan.outputs_rel) | list | length == 0
      - _rh_eg_p.interface_entries_rel | intersect(_rh_eg_p.never_generated_rel) | length == 0
      - _rh_eg_d.task_rel in _rh_eg_p.never_generated_rel
      - _rh_eg_d.verifier_rel in _rh_eg_p.never_generated_rel
      # render signature (R1 s8 C1-S8-EG-R2H): the three declared template variables -- lme_entry_context {refusal_grammar,
      # path_separator} and the typed struct are projected bindings, the decl is the raw checkout read; the context is
      # NEVER merged into the decl
      - (_rh_eg_d.template_vars.values() | list | sort) == (_rh_eg_d.template_vars_expected | sort)
      - _rh_eg_p.roster | map(attribute='inputs') | map('list') | map('sort') | unique(case_sensitive=true) | list == [[_rh_eg_d.template_vars.context, _rh_eg_d.template_vars.struct] | sort]
      - _rh_eg_p.roster | map(attribute='bound') | map('list') | map('sort') | unique(case_sensitive=true) | list == [[_rh_eg_d.template_vars.context, _rh_eg_d.template_vars.struct] | sort]
      - _rh_eg_d.template_vars.context not in (_rh_eg_p.roster | map(attribute='checkout_inputs') | map('list') | flatten | list)
      # EARLY-VIEW RECONCILIATION (codex-tick446 R1S8-EARLY-CONTEXT option c): the loader-projected context of EVERY
      # row is exactly the early verifier context admit_loader_source.yml produced from the launcher-bound declaration
      # (rh_early_view's context role); a divergence means generator and verifier read different grammar/separator.
      # brr-follow-s2 successor-06 (render-interface-01 70c993c4 section 2, decision (a) NESTED): this equality binds
      # ENTRY rows only; a RENDERED row's context is that same early context plus ONE key K whose value is the render
      # struct_roles (next three checks; vacuous while no rendered row is active). K and the roles are read from the
      # loader's PUBLISHED view (F05 render-context, MAIN-verified J-RC-02: rendered_context_binding.key and
      # rendered_struct_roles, both {} while inactive; the published struct_roles stays the ENTRY struct-key list)
      - _rh_eg_p.roster | rejectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.context) | unique(case_sensitive=true) | list
        == [rh_early_view[lme_resolved.remote_harness.source_admission.early_view.roles.context]]
      - >-
        _rh_eg_p.rendered_rel | length == 0
        or (_rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.context)
            | map('dict2items') | map('rejectattr', 'key', 'equalto', _rh_eg_p.rendered_context_binding.key)
            | map('list') | map('items2dict') | unique(case_sensitive=true) | list
            == [rh_early_view[lme_resolved.remote_harness.source_admission.early_view.roles.context]])
      - >-
        _rh_eg_p.rendered_rel | length == 0
        or (_rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.context)
            | rejectattr(_rh_eg_p.rendered_context_binding.key, 'defined') | list | length == 0)
      - >-
        _rh_eg_p.rendered_rel | length == 0
        or (_rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.context)
            | map(attribute=_rh_eg_p.rendered_context_binding.key) | unique(case_sensitive=true) | list
            == [_rh_eg_p.rendered_struct_roles])
      # brr-follow-s2 J-RNP-03: the entry struct roles bind ENTRY rows only; a rendered row's bound struct is the genesis
      # render's role -> source mapping (struct_sources; successor-06), bound to runtime values at render
      - _rh_eg_p.roster | rejectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.struct) | map('list') | map('sort') | unique(case_sensitive=true) | list == [_rh_eg_p.struct_roles | sort]
      - _rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.struct) | reject('mapping') | list | length == 0
      # brr-follow-s2 successor-06 (render-interface-01 section 2 :349): a rendered row's bound struct is
      # genesis.entry.render.struct_sources -- its keys EQUAL its own context[K] keys (the role set; no role literal), and
      # every value's key set is EXACTLY the admitted, declaration-owned entry key set the loader publishes (successor-07:
      # rendered_source_entry_keys -- PLACEHOLDER name pending the F05 join; render-interface-02 entry {fact, path, kind}; no literal)
      - >-
        _rh_eg_p.rendered_rel | length == 0
        or (_rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.struct)
            | map('list') | map('sort') | list
            == _rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.context)
               | map(attribute=_rh_eg_p.rendered_context_binding.key) | map('list') | map('sort') | list)
      - >-
        _rh_eg_p.rendered_rel | length == 0
        or (_rh_eg_p.roster | selectattr('output_rel', 'in', _rh_eg_p.rendered_rel) | map(attribute='bound') | map(attribute=_rh_eg_d.template_vars.struct)
            | map('dict2items') | flatten | map(attribute='value') | map('list') | map('sort') | unique(case_sensitive=true) | list
            == [_rh_eg_p.rendered_source_entry_keys | sort])
      - _rh_eg_p.roster | map(attribute='checkout_inputs') | map('list') | map('sort') | unique(case_sensitive=true) | list == [[_rh_eg_d.template_vars.decl]]
      - _rh_eg_p.roster | map(attribute='bound_checkout') | map('list') | map('sort') | unique(case_sensitive=true) | list == [[_rh_eg_d.template_vars.decl]]
      # ROSTER AUTHORITY (R2H-ROSTER-AUTHORITY-CUSTODY): admission-only, never a render input or closure member
      - _rh_eg_p.roster_source_rel is string
      - _rh_eg_p.roster_source_rel not in rh_eg_plan.render_inputs_rel
      - _rh_eg_self | length == 0
      - _rh_eg_hit | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.roster if _rh_eg_hit | length == 0 else _rh_eg_d.refusals.tunable }}:
      {{ _rh_eg_d.messages.roster if _rh_eg_hit | length == 0 else _rh_eg_d.messages.tunable }}
      {{ [_rh_eg_keys, rh_eg_plan.outputs_rel, _rh_eg_iface_out, _rh_eg_p.interface_entries_rel, _rh_eg_p.never_generated_rel,
          _rh_eg_p.roster_source_rel, _rh_eg_recs, _rh_eg_self, _rh_eg_hit] | to_json }}
    quiet: true

# TOOLS: the generation's own non-git tools (entry_generation.tools: id) are admitted here by declared identity in both
# contexts; git was admitted once, before resolution, by tasks/admit_loader_source.yml (rh_src_admission).
- name: "ENTRY GENERATION -- hash the declared generation tools (links followed; read-only)"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh.controller.entry_generation.tools }}"
  register: _rh_eg_tools

- name: "ENTRY GENERATION -- refuse a generation tool that is missing, undeclared for this consumer or not its declared identity"
  vars:
    _rh_eg_ot: "{{ rh.controller.bootstrap.os_tools }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_tools.results | rejectattr('stat.exists') | list | length == 0
      - _rh_eg_tools.results | map(attribute='stat') | rejectattr('executable') | list | length == 0
      - rh.controller.entry_generation.tools | map('extract', _rh_eg_ot) | map(attribute='required_by') | reject('contains', rh.controller.entry_generation.tool_consumer) | list | length == 0
      - rh.controller.entry_generation.tool_consumer in rh.controller.bootstrap.os_tool_consumers.controller
      - _rh_eg_tools.results | map(attribute='stat') | map(attribute='checksum') | list
        == rh.controller.entry_generation.tools | map('extract', _rh_eg_ot) | map(attribute='identity') | map(attribute='sha256') | list
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.tool }}:
      {{ rh.controller.entry_generation.messages.tool }}
      {{ rh.controller.entry_generation.tools | zip(_rh_eg_tools.results | map(attribute='stat') | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- read the running uid with the admitted id tool (owner principal of every admitted input)"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools.id.path] + rh.controller.entry_generation.uid_argv }}"
  register: _rh_eg_idout
  changed_when: false
  failed_when: false

- name: "ENTRY GENERATION -- refuse a failed uid read (tool cause; rc and stderr preserved)"
  ansible.builtin.assert:
    that:
      - _rh_eg_idout.rc == 0
      - _rh_eg_idout.stdout is match(rh.controller.entry_generation.uid_regex)
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.tool }}:
      {{ rh.controller.entry_generation.messages.tool_run }}
      {{ [rh.controller.bootstrap.os_tools.id.path, _rh_eg_idout.rc, _rh_eg_idout.stdout, _rh_eg_idout.stderr] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- bind the running uid"
  ansible.builtin.set_fact:
    rh_eg_uid: "{{ _rh_eg_idout.stdout | int }}"

# ---- RECORD OBSERVATION: stat of EXACTLY the three record locations and the roster outputs (no scan) ----------------
- name: "ENTRY GENERATION -- observe the record locations and the roster outputs (no link followed; read-only)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: >-
    {{ [rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.accepted_rel,
        rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.retained_rel,
        rh_eg_plan.in_progress_abs]
       + (rh_eg_plan.outputs_rel | map('regex_replace', '^', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | list) }}
  register: _rh_eg_obs

# ---- RECORD INTEGRITY (B r5m precedence: foreign, then unbound) ------------------------------------------------------
# CARRIED records = accepted + retained (tracked); the JOURNAL (index 2) is operational and never git-admitted.
- name: "ENTRY GENERATION -- bind the present carried records (derived; regular files only are read)"
  vars:
    _rh_eg_o: "{{ _rh_eg_obs.results | map(attribute='stat') | list }}"
  ansible.builtin.set_fact:
    _rh_eg_carried: >-
      {{ [rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel] | zip(_rh_eg_o[:2] | map(attribute='exists')) | selectattr(1) | map(attribute=0) | list }}

- name: "ENTRY GENERATION -- refuse a present carried record that is a link or not a regular file (FOREIGN)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_o: "{{ _rh_eg_obs.results | map(attribute='stat') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_o[:2] | selectattr('exists') | selectattr('islnk') | list | length == 0
      - _rh_eg_o[:2] | selectattr('exists') | rejectattr('isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.foreign }}:
      {{ _rh_eg_R.texts.foreign }}
      {{ _rh_eg_carried | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- refuse a linked or non-regular journal (INTERRUPTED; never read)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_j: "{{ _rh_eg_obs.results[2].stat }}"
  ansible.builtin.assert:
    that:
      - not _rh_eg_j.exists or (_rh_eg_j.isreg and not _rh_eg_j.islnk)
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.interrupted }}:
      {{ _rh_eg_R.texts.interrupted }}
      {{ [rh_eg_plan.in_progress_abs] | to_json }}
    quiet: true

# CUSTODY (a)+(b) of every present carried record, through the ONE shared git admission, every non-tool cause mapped to
# FOREIGN (B custody: committed-tree membership + index + blob id of the checkout bytes). Its trusted blob ids are kept
# apart (_rh_eg_rec_oids) before the main admission below rebinds rh_gp_*.
- name: "ENTRY GENERATION -- admit the present carried records against the intended commit (FOREIGN causes)"
  ansible.builtin.include_tasks: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].include_rel | basename }}"
  vars:
    # r2k: per-ROLE tool record (rh_src_admission[record_fields.tool][<tool_roles key>]); r2j read a non-existent record_fields.env
    rh_gp_tool: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.tool].git[lme_resolved.remote_harness.source_admission.tool_fields.path] }}"
    rh_gp_env: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.tool].env[lme_resolved.remote_harness.source_admission.tool_fields.path] }}"
    rh_gp_git: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] }}"
    rh_gp_repo: "{{ rh_repo_root }}"
    rh_gp_paths: "{{ _rh_eg_carried }}"
    rh_gp_absent: []
    rh_gp_probe: []
    rh_gp_edition: >-
      {{ lookup('ansible.builtin.vars', rh.controller.entry_generation.dispatch.input_var)[rh.controller.entry_generation.dispatch.input_keys.edition]
         if rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx else rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition] }}
    rh_gp_codes: >-
      {%- set g = rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] -%}
      {%- set ns = namespace(m={}) -%}
      {%- for k in g.cause_keys -%}
      {%- set ns.m = ns.m | combine({k: (rh.controller.entry_generation.refusals.git[k] if k == g.tool_cause
                                          else lme_resolved.remote_harness.entry_generation.records.refusals.foreign)}) -%}
      {%- endfor -%}{{ ns.m }}
    rh_gp_texts: >-
      {%- set g = rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] -%}
      {%- set ns = namespace(m={}) -%}
      {%- for k in g.cause_keys -%}
      {%- set ns.m = ns.m | combine({k: (rh.controller.entry_generation.messages.git[k] if k == g.tool_cause
                                          else lme_resolved.remote_harness.entry_generation.records.texts.foreign)}) -%}
      {%- endfor -%}{{ ns.m }}
    # GEN-ADOPT2: the record pre-admission requests no historical proof (explicit null; the main admission carries it)
    rh_gp_history: null
  when: _rh_eg_carried | length > 0

- name: "ENTRY GENERATION -- keep the carried records' trusted blob ids (derived; before the main admission rebinds them)"
  ansible.builtin.set_fact:
    _rh_eg_rec_oids: "{{ rh_gp_oids if _rh_eg_carried | length > 0 else {} }}"

# READ ONCE (R2I-RECORD-BYTE-BINDING; codex-tick446 R1S8-PLAINTEXT-BODY-BYTES): ONE slurp per present record; this
# block holds ONLY read -> decode. The digest / blob-id / measurement binding and the declared plaintext UTF-8 body
# domain are checked on THAT retained value below, and only then is the same value parsed (second block). The
# decode alone is not a strict UTF-8 admission (installed Ansible decodes with surrogateescape -- Codex's installed-source
# observation, cited, not re-read here): the body-domain assert refuses any escaped byte.
- name: "ENTRY GENERATION -- read each present carried record ONCE (read/decode failure: UNBOUND)"
  block:
    - name: "ENTRY GENERATION -- read the present carried records' bytes (one read each)"
      ansible.builtin.slurp:
        src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
      loop: "{{ _rh_eg_carried }}"
      register: _rh_eg_slurp

    - name: "ENTRY GENERATION -- decode exactly the bytes read (derived; parsed only after the byte binding)"
      ansible.builtin.set_fact:
        _rh_eg_bytes: >-
          {%- set ns = namespace(m={}) -%}
          {%- for r in _rh_eg_slurp.results -%}
          {%- set ns.m = ns.m | combine({r.item: {'b64': r.content, 'text': r.content | b64decode}}) -%}
          {%- endfor -%}{{ ns.m }}
  rescue:
    - name: "ENTRY GENERATION -- refuse an undecodable or unparsable carried record (UNBOUND; the parse cause preserved)"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ lme_resolved.remote_harness.entry_generation.records.refusals.unbound }}:
          {{ lme_resolved.remote_harness.entry_generation.records.texts.unbound }}
          {{ [_rh_eg_carried, ansible_failed_task.name, ansible_failed_result.msg] | to_json }}

- name: "ENTRY GENERATION -- read the journal ONCE and parse that same value (decode/parse failure: INTERRUPTED)"
  block:
    - name: "ENTRY GENERATION -- read the journal bytes (one read)"
      ansible.builtin.slurp:
        src: "{{ rh_eg_plan.in_progress_abs }}"
      register: _rh_eg_jslurp
      when: _rh_eg_obs.results[2].stat.exists

    - name: "ENTRY GENERATION -- decode and parse exactly the journal bytes read (derived)"
      ansible.builtin.set_fact:
        _rh_eg_jdoc: "{{ (_rh_eg_jslurp.content | b64decode | from_yaml) if _rh_eg_obs.results[2].stat.exists else none }}"
  rescue:
    - name: "ENTRY GENERATION -- refuse an undecodable or unparsable journal (INTERRUPTED; the parse cause preserved)"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ lme_resolved.remote_harness.entry_generation.records.refusals.interrupted }}:
          {{ lme_resolved.remote_harness.entry_generation.records.texts.interrupted }}
          {{ [rh_eg_plan.in_progress_abs, ansible_failed_task.name, ansible_failed_result.msg] | to_json }}

# CUSTODY (c) on the SAME bytes: sha256 of the bytes read == the observed digest; the git blob id computed from those
# bytes (declared object header grammar: <type><sp><byte count><NUL><bytes>; byte count from the base64 length, never a
# character count) == the admitted commit's tree id; seed: the accepted file digest == the seed's measurement.
- name: "ENTRY GENERATION -- refuse carried-record bytes that are not the admitted, observed and measured identity (FOREIGN)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_g: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] }}"
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_seed: "{{ rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx }}"
    _rh_eg_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- set H = _rh_eg_g.object_header -%}{%- set B = _rh_eg_g.base64 -%}
      {%- for p in _rh_eg_carried -%}
      {%- set c = _rh_eg_bytes[p].b64 -%}
      {%- set n = ((c | length) // B.group) * B.bytes - (2 if c.endswith(B.pad ~ B.pad) else (1 if c.endswith(B.pad) else 0)) -%}
      {%- set oid = (H.blob ~ H.space ~ n ~ H.terminator ~ _rh_eg_bytes[p].text) | hash(_rh_eg_g.object_hash) -%}
      {%- set sha = _rh_eg_bytes[p].text | hash(_rh_eg_d.digest.algorithm) -%}
      {%- set obs = _rh_eg_obs.results[[rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel].index(p)].stat.checksum -%}
      {%- if oid != _rh_eg_rec_oids[p] or sha != obs -%}{%- set ns.o = ns.o + [[p, sha, obs, oid, _rh_eg_rec_oids[p]]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_eg_bad | length == 0
      - not _rh_eg_seed or rh_eg_plan.accepted_rel not in _rh_eg_carried
        or _rh_eg_obs.results[0].stat.checksum == lookup('ansible.builtin.vars', _rh_eg_d.dispatch.input_var)[_rh_eg_d.dispatch.input_keys.accepted]
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.foreign }}:
      {{ _rh_eg_R.texts.foreign }}
      {{ _rh_eg_bad | to_json }}
    quiet: true

# BODY DOMAIN (codex-tick446): declared plaintext UTF-8 (controller.bootstrap.body_domain, C1-R2J-12): no escaped
# undecodable byte and an exact re-encoding; encrypted / binary inputs are outside the domain and refuse here.
- name: "ENTRY GENERATION -- refuse a carried record outside the declared plaintext UTF-8 body domain (UNBOUND)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_carried | reject('in', _rh_eg_bytes) | list | length == 0
      - _rh_eg_carried | map('extract', _rh_eg_bytes) | map(attribute='text')
        | select('search', rh.controller.bootstrap.body_domain.undecodable_regex) | list | length == 0
      - _rh_eg_carried | map('extract', _rh_eg_bytes) | map(attribute='text') | map('b64encode') | list
        == _rh_eg_carried | map('extract', _rh_eg_bytes) | map(attribute='b64') | list
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ _rh_eg_carried | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- parse the SAME retained, bound value of each carried record (parse failure: UNBOUND)"
  block:
    - name: "ENTRY GENERATION -- parse the retained text (derived)"
      ansible.builtin.set_fact:
        _rh_eg_bytes: >-
          {%- set ns = namespace(m={}) -%}
          {%- for p in _rh_eg_carried -%}
          {%- set ns.m = ns.m | combine({p: _rh_eg_bytes[p] | combine({'doc': _rh_eg_bytes[p].text | from_yaml})}) -%}
          {%- endfor -%}{{ ns.m }}
  rescue:
    - name: "ENTRY GENERATION -- refuse an unparsable carried record (UNBOUND; the parse cause preserved)"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ lme_resolved.remote_harness.entry_generation.records.refusals.unbound }}:
          {{ lme_resolved.remote_harness.entry_generation.records.texts.unbound }}
          {{ [_rh_eg_carried, ansible_failed_task.name, ansible_failed_result.msg] | to_json }}

- name: "ENTRY GENERATION -- bind the parsed records (index-aligned with the three locations; none when absent)"
  ansible.builtin.set_fact:
    _rh_eg_raw: >-
      {{ [_rh_eg_bytes[rh_eg_plan.accepted_rel].doc if rh_eg_plan.accepted_rel in _rh_eg_carried else none,
          _rh_eg_bytes[rh_eg_plan.retained_rel].doc if rh_eg_plan.retained_rel in _rh_eg_carried else none,
          _rh_eg_jdoc] }}

# SHAPE (UNBOUND). Every key set is DERIVED from its B role map's values (B r5m X-R2-R5M-2; no positional list):
# accepted = roles.values(); owned / retired / obligation rows = owned_roles / retired_roles / obligation_roles values.
- name: "ENTRY GENERATION -- classify the record state (validity per carried record; role-map-derived key sets)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_o: "{{ _rh_eg_obs.results | map(attribute='stat') | list }}"
    _rh_eg_digest: "{{ '^' ~ lme_resolved.remote_harness.entry_generation.records.digest_regex ~ '$' }}"
    _rh_eg_ok: >-
      {%- set ns = namespace(v=[]) -%}
      {%- set K = _rh_eg_R.roles -%}
      {%- for r in _rh_eg_raw[:2] -%}
      {%- set ok = namespace(v=(r is mapping and (r.keys() | list | sort) == (K.values() | list | sort))) -%}
      {%- if ok.v -%}
      {%- set ok.v = r[K.outputs] is mapping and (r[K.outputs].values() | reject('match', _rh_eg_digest) | list | length) == 0
                   and r[K.inputs] is mapping and (r[K.inputs].values() | reject('match', _rh_eg_digest) | list | length) == 0
                   and r[K.roster] is match(_rh_eg_digest) and r[K.generation] is match(_rh_eg_digest)
                   and r[K.source_edition] is string and r[K.source_edition] is match(_rh_eg_R.source_edition_regex)
                   and r[K.revision] is string
                   and (r[K.predecessor] == _rh_eg_R.predecessor_genesis or (r[K.predecessor] is string and r[K.predecessor] is match(_rh_eg_digest)))
                   and (r[K.adoption] == _rh_eg_R.adoption_none or (r[K.adoption] is string and r[K.adoption] is match(_rh_eg_digest)))
                   and r[K.owned] is sequence and r[K.owned] is not string
                   and r[K.retired] is sequence and r[K.retired] is not string
                   and r[K.obligations] is sequence and r[K.obligations] is not string
                   and r[K.completed] is sequence and r[K.completed] is not string
                   and r[K.historical] is sequence and r[K.historical] is not string -%}
      {%- endif -%}
      {%- if ok.v -%}
      {%- for row in r[K.owned] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (_rh_eg_R.owned_roles.values() | list | sort)
             and row[_rh_eg_R.owned_roles.sha256] is match(_rh_eg_digest)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {%- for row in r[K.retired] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (_rh_eg_R.retired_roles.values() | list | sort)
             and row[_rh_eg_R.retired_roles.predecessor] is match(_rh_eg_digest)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {%- for row in r[K.obligations] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (_rh_eg_R.obligation_roles.values() | list | sort)
             and row[_rh_eg_R.obligation_roles.origin] is match(_rh_eg_digest)
             and row[_rh_eg_R.obligation_roles.state] == _rh_eg_R.locations.pending_state) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {#- r2k R2J-RECORD-SCHEMA-JOIN: the declared completed role (B r5o :590, completed_roles :609), unaltered -#}
      {%- for row in r[K.completed] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (_rh_eg_R.completed_roles.values() | list | sort)
             and row[_rh_eg_R.completed_roles.origin] is match(_rh_eg_digest)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {#- r2k r5p (b93e2c06 records.roles.historical / historical_roles {output, origin, closed_by}): unaltered -#}
      {%- for row in r[K.historical] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (_rh_eg_R.historical_roles.values() | list | sort)
             and row[_rh_eg_R.historical_roles.origin] is match(_rh_eg_digest)
             and row[_rh_eg_R.historical_roles.closed_by] is match(_rh_eg_digest)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {%- endif -%}
      {%- set ns.v = ns.v + [ok.v] -%}
      {%- endfor -%}{{ ns.v }}
  ansible.builtin.set_fact:
    rh_eg_rec:
      accepted_present: "{{ _rh_eg_o[0].exists }}"
      accepted_valid: "{{ _rh_eg_ok[0] }}"
      accepted: "{{ _rh_eg_raw[0] }}"
      # the EXTERNAL file digest of the bytes READ ONCE above (== the observed digest, foreign-checked); never inside it
      accepted_file_sha256: "{{ _rh_eg_obs.results[0].stat.checksum if _rh_eg_o[0].exists else none }}"
      retained_present: "{{ _rh_eg_o[1].exists }}"
      retained_valid: "{{ _rh_eg_ok[1] }}"
      retained: "{{ _rh_eg_raw[1] }}"
      retained_file_sha256: "{{ _rh_eg_obs.results[1].stat.checksum if _rh_eg_o[1].exists else none }}"
      in_progress_present: "{{ _rh_eg_o[2].exists }}"
      in_progress: "{{ _rh_eg_raw[2] }}"
      outputs_present: "{{ rh_eg_plan.outputs_rel | zip(_rh_eg_o[3:] | map(attribute='exists')) | selectattr(1) | map(attribute=0) | list }}"

- name: "ENTRY GENERATION -- refuse an unbound accepted record or retained predecessor (RECORD-UNBOUND; every operation)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    # paths of the five disjoint roles (B r5p b93e2c06 reconciliation.disjoint [owned, retired, completed, obligations,
    # historical]), per present record; a repeat = overlap
    _rh_eg_overlap: >-
      {%- set R = _rh_eg_R -%}{%- set ns = namespace(o=[]) -%}
      {%- for pr in [[rh_eg_rec.accepted_present, rh_eg_rec.accepted], [rh_eg_rec.retained_present, rh_eg_rec.retained]] -%}
      {%- if pr[0] -%}
      {%- set p = (pr[1][R.roles.owned] | map(attribute=R.owned_roles.output) | list)
                + (pr[1][R.roles.retired] | map(attribute=R.retired_roles.output) | list)
                + (pr[1][R.roles.completed] | map(attribute=R.completed_roles.output) | list)
                + (pr[1][R.roles.obligations] | map(attribute=R.obligation_roles.output) | list)
                + (pr[1][R.roles.historical] | map(attribute=R.historical_roles.output) | list) -%}
      {%- if (p | unique(case_sensitive=true) | list | length) != (p | length) -%}{%- set ns.o = ns.o + [p] -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - not rh_eg_rec.accepted_present or rh_eg_rec.accepted_valid
      - not rh_eg_rec.retained_present or rh_eg_rec.retained_valid
      - rh_eg_rec.accepted_present or not rh_eg_rec.retained_present
      # a retained file exists exactly when the accepted record names a (non-genesis) predecessor
      - not rh_eg_rec.accepted_present
        or (rh_eg_rec.accepted[_rh_eg_R.roles.predecessor] == _rh_eg_R.predecessor_genesis) == (not rh_eg_rec.retained_present)
      # an accepted record owns exactly its outputs (owned rows == outputs map, same digests)
      - not rh_eg_rec.accepted_present
        or dict(rh_eg_rec.accepted[_rh_eg_R.roles.owned] | map(attribute=_rh_eg_R.owned_roles.output)
                | zip(rh_eg_rec.accepted[_rh_eg_R.roles.owned] | map(attribute=_rh_eg_R.owned_roles.sha256)))
           == rh_eg_rec.accepted[_rh_eg_R.roles.outputs]
      # r2k (B r5o reconciliation.disjoint :639; r2j's cumulative-retired relaxation WITHDRAWN): owned / retired /
      # completed / obligation output paths are each unique and PAIRWISE DISJOINT in every admitted record
      - _rh_eg_overlap | length == 0
      # a genesis record has no history
      - not rh_eg_rec.accepted_present or rh_eg_rec.retained_present
        or ((rh_eg_rec.accepted[_rh_eg_R.roles.retired] | length) == 0 and (rh_eg_rec.accepted[_rh_eg_R.roles.obligations] | length) == 0
            and (rh_eg_rec.accepted[_rh_eg_R.roles.completed] | length) == 0
            and (rh_eg_rec.accepted[_rh_eg_R.roles.historical] | length) == 0)
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ [rh_eg_plan.accepted_rel, rh_eg_rec.accepted_present, rh_eg_rec.accepted_valid, rh_eg_plan.retained_rel,
          rh_eg_rec.retained_present, rh_eg_rec.retained_valid] | to_json }}
    quiet: true

# CUSTODY (c) of the retained record: its external file digest IS the accepted record's predecessor role (FOREIGN).
- name: "ENTRY GENERATION -- refuse a retained record that is not the accepted record's predecessor (FOREIGN)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - not rh_eg_rec.retained_present or rh_eg_rec.accepted[_rh_eg_R.roles.predecessor] == rh_eg_rec.retained_file_sha256
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.foreign }}:
      {{ _rh_eg_R.texts.foreign }}
      {{ [rh_eg_plan.retained_rel, rh_eg_rec.retained_file_sha256] | to_json }}
    quiet: true

# OWNERSHIP RECONCILIATION -- r2k: the ACTUAL B r5o law (transfer.decl.after.yml 5c65d292 :610-641,
# records.reconciliation), accepted S against the independently bound retained P (pd = P's external file digest ==
# S.predecessor, foreign-checked above). TWO partitions, never one equation; all sets by output path:
#   (1) NEWLY REMOVED: removed = P.owned - S.owned == S.retired (each predecessor == pd) DISJOINT-UNION opened, where
#       opened = S.obligations rows with origin == pd;
#   (2) CARRIED: P.obligations == carried DISJOINT-UNION S.completed, where carried = S.obligations rows with
#       origin != pd; each carried row and each completed row keeps the origin AND reason of the P.obligations row of the
#       same output (completed_origin_kept_from);
#   S.obligations == opened DISJOINT-UNION carried (follows from the definitions); the four roles are pairwise disjoint
#   (shape task above) -- so a PENDING obligation path re-added as owned is REFUSED here (it is neither carried nor
#   completed), its obligation never silently dropped (R2J-PENDING-READMISSION; B :621-622, OB-08);
#   HISTORY IS NEVER NEWLY REMOVED (not_inputs: P.retired, P.completed, P.historical): it never re-enters (1)/(2);
#   (3) r2k r5p (B b93e2c06 reconciliation.historical, X-R2-R5P-HIST): S.historical == H(P) - readmitted(S), rows
#   carried with origin / closed_by per the r5p rule, never dropped on revision; its ABSENCE is checked separately
#   (HISTORICAL ABSENCE below). r2j's cumulative-retired carry and its (2b) re-admission branch stay WITHDRAWN.
# Counterexample (codex-tick444, OB-07): A{x,y} -> B{x; opened y, origin A} -> C{x; completed y, origin A}: B->C
# removed {} == {} + {}; P.obligations {y} == carried {} + completed {y} -> admitted.
- name: "ENTRY GENERATION -- refuse a successor that does not reconcile its predecessor's ownership (OWNERSHIP-UNRECONCILED)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_bad: >-
      {%- set R = _rh_eg_R -%}{%- set S = rh_eg_rec.accepted -%}{%- set P = rh_eg_rec.retained -%}{%- set pd = rh_eg_rec.retained_file_sha256 -%}
      {%- set ns = namespace(o=[]) -%}
      {%- set s_owned = S[R.roles.owned] | map(attribute=R.owned_roles.output) | list -%}
      {%- set removed = P[R.roles.owned] | map(attribute=R.owned_roles.output) | reject('in', s_owned) | list -%}
      {%- set opened = S[R.roles.obligations] | selectattr(R.obligation_roles.origin, 'equalto', pd) | list -%}
      {%- set carried = S[R.roles.obligations] | rejectattr(R.obligation_roles.origin, 'equalto', pd) | list -%}
      {#- (1) newly removed -#}
      {%- for row in S[R.roles.retired] -%}{%- if row[R.retired_roles.predecessor] != pd -%}
      {%- set ns.o = ns.o + [['retired_not_from_predecessor', row]] -%}{%- endif -%}{%- endfor -%}
      {%- set part1 = (S[R.roles.retired] | map(attribute=R.retired_roles.output) | list) + (opened | map(attribute=R.obligation_roles.output) | list) -%}
      {%- if (part1 | sort) != (removed | sort) -%}{%- set ns.o = ns.o + [['removed_partition', removed, part1]] -%}{%- endif -%}
      {#- (2) carried obligations, origin and reason kept -#}
      {%- set p_obl = P[R.roles.obligations] | map(attribute=R.obligation_roles.output) | list -%}
      {%- set part2 = (carried | map(attribute=R.obligation_roles.output) | list) + (S[R.roles.completed] | map(attribute=R.completed_roles.output) | list) -%}
      {%- if (part2 | sort) != (p_obl | sort) -%}{%- set ns.o = ns.o + [['carried_partition', p_obl, part2]] -%}{%- endif -%}
      {%- for ob in P[R.roles.obligations] -%}
      {%- set o = ob[R.obligation_roles.output] -%}
      {%- for row in carried | selectattr(R.obligation_roles.output, 'equalto', o) -%}
      {%- if row != ob -%}{%- set ns.o = ns.o + [['carried_changed', ob, row]] -%}{%- endif -%}{%- endfor -%}
      {%- for row in S[R.roles.completed] | selectattr(R.completed_roles.output, 'equalto', o) -%}
      {%- if row[R.completed_roles.origin] != ob[R.obligation_roles.origin] or row[R.completed_roles.reason] != ob[R.obligation_roles.reason] -%}
      {%- set ns.o = ns.o + [['completed_origin_changed', ob, row]] -%}{%- endif -%}{%- endfor -%}
      {%- if o in s_owned -%}{%- set ns.o = ns.o + [['pending_readded_as_owned', ob]] -%}{%- endif -%}
      {%- endfor -%}
      {#- (3) r5p b93e2c06 reconciliation.historical: H(P) = P.historical + P.retired + P.completed (by output);
          readmitted = H(P) rows whose output is S.owned (an owned row of THIS generation: S.owned sha256 == S.outputs,
          asserted above; a roster row is S.roster's own output by the stale gate); S.historical == H(P) - readmitted,
          each row's origin / closed_by: P.historical copied; P.retired {origin: row.predecessor, closed_by: pd};
          P.completed {origin: row.origin, closed_by: pd}. revision_drops: never -- a missing row refuses. -#}
      {%- set HO = R.historical_roles -%}
      {%- set hp = namespace(v=P[R.roles.historical] | list) -%}
      {%- for row in P[R.roles.retired] -%}{%- set hp.v = hp.v + [{HO.output: row[R.retired_roles.output], HO.origin: row[R.retired_roles.predecessor], HO.closed_by: pd}] -%}{%- endfor -%}
      {%- for row in P[R.roles.completed] -%}{%- set hp.v = hp.v + [{HO.output: row[R.completed_roles.output], HO.origin: row[R.completed_roles.origin], HO.closed_by: pd}] -%}{%- endfor -%}
      {%- set expect_hist = hp.v | rejectattr(HO.output, 'in', s_owned) | sort(attribute=HO.output) | list -%}
      {%- set got_hist = S[R.roles.historical] | sort(attribute=HO.output) | list -%}
      {%- if expect_hist != got_hist -%}{%- set ns.o = ns.o + [['historical_carry', expect_hist, got_hist]] -%}{%- endif -%}
      {#- GEN-AUTHORED-TO-GENERATED-ADOPTION (B records.reconciliation.adoption): adoption provenance is CARRIED unchanged
          from P (never set, changed or dropped by a successor; never re-attributed to a predecessor) -#}
      {%- if S[R.roles.adoption] != P[R.roles.adoption] -%}{%- set ns.o = ns.o + [['adoption_not_carried', P[R.roles.adoption], S[R.roles.adoption]]] -%}{%- endif -%}
      {{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_eg_bad | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unreconciled_successor }}:
      {{ _rh_eg_R.texts.unreconciled_successor }}
      {{ _rh_eg_bad | to_json }}
    quiet: true
  when: rh_eg_rec.accepted_present and rh_eg_rec.retained_present

# ---- ADOPTION MANIFEST (GEN-AUTHORED-TO-GENERATED-ADOPTION) ----------------------------------------------------------
# ONE exact stat of B's locator (no scan; no link followed); when present it is read ONCE, the sha256 of the bytes read
# must be the observed digest, the declared plaintext UTF-8 body domain holds, and only then is that SAME value parsed.
# The manifest is TRACKED and admission-only: it joins admission_rel (custody, commit membership, digests before / after)
# and is never a render input (roster task above), so the generation digest never moves with it.
- name: "ENTRY GENERATION -- observe the adoption manifest locator (no link followed; read-only)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.adoption_rel }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  register: _rh_eg_aobs

- name: "ENTRY GENERATION -- read the adoption manifest ONCE and parse that same value (any failure: ADOPTION-UNBOUND)"
  block:
    - name: "ENTRY GENERATION -- refuse a linked or non-regular adoption manifest (never read)"
      ansible.builtin.assert:
        that:
          - not _rh_eg_aobs.stat.exists or (_rh_eg_aobs.stat.isreg and not _rh_eg_aobs.stat.islnk)
        quiet: true

    - name: "ENTRY GENERATION -- read the adoption manifest bytes (one read)"
      ansible.builtin.slurp:
        src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.adoption_rel }}"
      register: _rh_eg_aslurp
      when: _rh_eg_aobs.stat.exists

    - name: "ENTRY GENERATION -- bind the manifest identity from exactly the bytes read (derived)"
      ansible.builtin.set_fact:
        rh_eg_adopt:
          present: "{{ _rh_eg_aobs.stat.exists }}"
          sha256: "{{ _rh_eg_aobs.stat.checksum if _rh_eg_aobs.stat.exists else none }}"
          b64: "{{ _rh_eg_aslurp.content if _rh_eg_aobs.stat.exists else none }}"
          text: "{{ (_rh_eg_aslurp.content | b64decode) if _rh_eg_aobs.stat.exists else none }}"

    - name: "ENTRY GENERATION -- refuse manifest bytes that are not the observed identity or not plaintext UTF-8 (byte binding)"
      ansible.builtin.assert:
        that:
          - not rh_eg_adopt.present or (rh_eg_adopt.text | hash(rh.controller.entry_generation.digest.algorithm)) == rh_eg_adopt.sha256
          - not rh_eg_adopt.present or rh_eg_adopt.text is not search(rh.controller.bootstrap.body_domain.undecodable_regex)
          - not rh_eg_adopt.present or (rh_eg_adopt.text | b64encode) == rh_eg_adopt.b64
        quiet: true

    - name: "ENTRY GENERATION -- parse the SAME retained manifest text (derived)"
      ansible.builtin.set_fact:
        rh_eg_adopt: "{{ rh_eg_adopt | combine({'doc': (rh_eg_adopt.text | from_yaml) if rh_eg_adopt.present else none}) }}"
  rescue:
    - name: "ENTRY GENERATION -- refuse an unreadable, unbound or unparsable adoption manifest (ADOPTION-UNBOUND; cause preserved)"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ lme_resolved.remote_harness.entry_generation.records.refusals.adoption_unbound }}:
          {{ lme_resolved.remote_harness.entry_generation.records.texts.adoption_unbound }}
          {{ [rh_eg_plan.adoption_rel, ansible_failed_task.name, ansible_failed_result.msg] | to_json }}

# ADOPTION MODE (one derived value from the declared adoption.modes): admit = adopt transition, or the resume / rebind of an
# ADOPT journal (genesis predecessor, adoption role set), with NO accepted record; repeat = the adopt transition over an
# accepted record (verify-or-refuse, never a reset); carried = an accepted record whose adoption role names a manifest;
# none = otherwise. Shape validity: key sets DERIVED from B's adoption_roles / authored_roles values (no positional list).
- name: "ENTRY GENERATION -- classify the adoption mode and the manifest shape (derived; no write)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_T: "{{ rh.controller.entry_generation.transition.kinds }}"
    _rh_eg_M: "{{ lme_resolved.remote_harness.entry_generation.adoption.modes }}"
    _rh_eg_digest: "{{ '^' ~ lme_resolved.remote_harness.entry_generation.records.digest_regex ~ '$' }}"
    _rh_eg_J: "{{ rh_eg_rec.in_progress if rh_eg_rec.in_progress is mapping else {} }}"
    _rh_eg_jadopt: >-
      {{ _rh_eg_J.get(_rh_eg_R.in_progress_roles.predecessor) == _rh_eg_R.predecessor_genesis
         and _rh_eg_R.in_progress_roles.adoption in _rh_eg_J
         and _rh_eg_J[_rh_eg_R.in_progress_roles.adoption] != _rh_eg_R.adoption_none }}
    _rh_eg_acc_ad: >-
      {{ rh_eg_rec.accepted_present and rh_eg_rec.accepted[_rh_eg_R.roles.adoption] != _rh_eg_R.adoption_none }}
    _rh_eg_gen: "{{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate }}"
    _rh_eg_mode: >-
      {%- if rh_eg_rec.accepted_present -%}
      {{ _rh_eg_M.repeat if (_rh_eg_gen and rh_eg_tr == _rh_eg_T.adopt) else (_rh_eg_M.carried if _rh_eg_acc_ad | bool else _rh_eg_M.none) }}
      {%- elif _rh_eg_gen and (rh_eg_tr == _rh_eg_T.adopt or (_rh_eg_jadopt | bool and rh_eg_tr in [none, _rh_eg_T.rebind])) -%}
      {{ _rh_eg_M.admit }}
      {%- else -%}{{ _rh_eg_M.none }}{%- endif -%}
    _rh_eg_valid: >-
      {%- set R = _rh_eg_R -%}{%- set A = R.adoption_roles -%}{%- set W = R.authored_roles -%}{%- set d = rh_eg_adopt.doc -%}
      {%- set ok = namespace(v=(d is mapping and (d.keys() | list | sort) == (A.values() | list | sort))) -%}
      {%- if ok.v -%}
      {%- set ok.v = d[A.source_edition] is string and d[A.source_edition] is match(R.source_edition_regex)
                   and d[A.roster] is string and d[A.roster] is match(_rh_eg_digest)
                   and d[A.roster_blob] is string and d[A.roster_blob] is match(R.custody.blob_id_regex)
                   and d[A.reason] is string and (d[A.reason] | length) > 0
                   and d[A.authored] is sequence and d[A.authored] is not string and (d[A.authored] | length) > 0 -%}
      {%- endif -%}
      {%- if ok.v -%}
      {%- for row in d[A.authored] -%}{%- if not (row is mapping and (row.keys() | list | sort) == (W.values() | list | sort)
             and row[W.output] is string and row[W.retained] is string
             and row[W.sha256] is string and row[W.sha256] is match(_rh_eg_digest)
             and row[W.blob] is string and row[W.blob] is match(R.custody.blob_id_regex)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {%- endif -%}{{ ok.v }}
  ansible.builtin.set_fact:
    rh_eg_adopt: "{{ rh_eg_adopt | combine({'mode': _rh_eg_mode | trim, 'valid': _rh_eg_valid | bool, 'journal_adopt': _rh_eg_jadopt | bool}) }}"

# ADOPTION IDENTITY (ADOPTION-UNBOUND): a manifest exists EXACTLY when a mode other than none holds (a stray manifest
# refuses; a carried / repeated adoption whose manifest is gone is lost provenance); its exact-file digest equals its
# independent holder: the supplied input (adopt), the adopt journal (resume / rebind: original provenance kept), the
# accepted record's adoption role (carried / repeat). Admit needs no journal or THIS manifest's adopt journal (a genesis
# journal of another lineage refuses); repeat needs the FIRST adopted record (genesis predecessor) and no journal.
- name: "ENTRY GENERATION -- refuse a stray, missing, malformed or unbound adoption manifest (ADOPTION-UNBOUND)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_T: "{{ rh.controller.entry_generation.transition }}"
    _rh_eg_M: "{{ lme_resolved.remote_harness.entry_generation.adoption.modes }}"
    _rh_eg_J: "{{ rh_eg_rec.in_progress if rh_eg_rec.in_progress is mapping else {} }}"
    _rh_eg_in: "{{ lookup('ansible.builtin.vars', rh.controller.entry_generation.transition.adoption_var) if rh_eg_tr == rh.controller.entry_generation.transition.kinds.adopt else none }}"
  ansible.builtin.assert:
    that:
      - rh_eg_adopt.present == (rh_eg_adopt.mode != _rh_eg_M.none)
      - rh_eg_adopt.mode == _rh_eg_M.none or rh_eg_adopt.valid
      - rh_eg_tr != _rh_eg_T.kinds.adopt or _rh_eg_in == rh_eg_adopt.sha256
      - rh_eg_adopt.mode != _rh_eg_M.admit or not rh_eg_rec.in_progress_present
        or _rh_eg_J.get(_rh_eg_R.in_progress_roles.adoption) == rh_eg_adopt.sha256
      - rh_eg_adopt.mode != _rh_eg_M.repeat
        or (not rh_eg_rec.in_progress_present
            and rh_eg_rec.accepted[_rh_eg_R.roles.adoption] == rh_eg_adopt.sha256
            and rh_eg_rec.accepted[_rh_eg_R.roles.predecessor] == _rh_eg_R.predecessor_genesis)
      - rh_eg_adopt.mode != _rh_eg_M.carried or rh_eg_rec.accepted[_rh_eg_R.roles.adoption] == rh_eg_adopt.sha256
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.adoption_unbound }}:
      {{ _rh_eg_R.texts.adoption_unbound }}
      {{ [rh_eg_plan.adoption_rel, rh_eg_adopt.mode, rh_eg_adopt.present, rh_eg_adopt.valid, rh_eg_adopt.sha256, rh_eg_tr,
          rh_eg_rec.accepted_present, rh_eg_rec.in_progress_present] | to_json }}
    quiet: true
  # B precedence kept: verify / package / invoke WITHOUT an accepted record refuse ABSENT below (a staged adoption is not
  # accepted history), never this code
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate or rh_eg_rec.accepted_present

- name: "ENTRY GENERATION -- bind the adoption rows, the record / journal adoption value and the adoption admission set (derived)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_M: "{{ lme_resolved.remote_harness.entry_generation.adoption.modes }}"
    _rh_eg_rows: "{{ rh_eg_adopt.doc[_rh_eg_R.adoption_roles.authored] if rh_eg_adopt.mode != _rh_eg_M.none else [] }}"
  ansible.builtin.set_fact:
    rh_eg_adopt: >-
      {{ rh_eg_adopt | combine({
           'rows': _rh_eg_rows,
           'outputs_rel': _rh_eg_rows | map(attribute=_rh_eg_R.authored_roles.output) | list,
           'retained_rel': _rh_eg_rows | map(attribute=_rh_eg_R.authored_roles.retained) | list,
           'prestate_rel': (_rh_eg_rows | map(attribute=_rh_eg_R.authored_roles.output) | list) if rh_eg_adopt.mode == _rh_eg_M.admit else [],
           'record_value': (rh_eg_adopt.sha256 if rh_eg_adopt.mode == _rh_eg_M.admit
                            else (rh_eg_rec.accepted[_rh_eg_R.roles.adoption] if rh_eg_rec.accepted_present else _rh_eg_R.adoption_none)),
           'admission_rel': ([rh_eg_plan.adoption_rel] + (_rh_eg_rows | map(attribute=_rh_eg_R.authored_roles.retained) | list))
                            if rh_eg_adopt.present else []}) }}

# ADOPTION SETS (pre-git; every mode but none): rows unique by output and by retention path. GEN-ADOPT2 ELIGIBILITY
# (codex-tick512 ADO-LOST-RECORD-RELABEL; replaces the r1 sha256 source-set membership, which byte equality could pass):
# the manifest is EXACTLY B's independently reviewed eligibility -- source_edition == eligibility.baseline (an unset
# baseline refuses: MAIN binds it, OD-ADO-07), the manifest's output set == the eligibility key set, every row blob id ==
# the eligible blob id. Eligibility is HISTORICAL (ADO-HISTORICAL-ROSTER): it holds while any record carries the adoption,
# so a later legitimate retirement of an adopted output never invalidates carried provenance. Every retention row lies
# under the declared retention root and outside every admission / render / output / record path AND, with the manifest,
# outside every EXECUTABLE closure (ADO-DISPATCHED-EVIDENCE-CLOSURE: evidence, never code). admit / repeat ONLY (the
# current-roster boundary): the manifest names the CURRENT roster (intended generated roster) and only current roster
# outputs; carried mode binds the HISTORICAL roster instead (roster blob proven at the source edition in the git
# admission below). admit: every manifest output is PRESENT (missing prestate refuses); a present output the manifest
# does not name stays ORPHAN.
- name: "ENTRY GENERATION -- refuse an unaccounted or ineligible adoption prestate (ADOPTION-PRESTATE) or a retention row outside the declared root or inside an executable closure (ADOPTION-RETENTION)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_W: "{{ lme_resolved.remote_harness.entry_generation.records.authored_roles }}"
    _rh_eg_M: "{{ lme_resolved.remote_harness.entry_generation.adoption.modes }}"
    _rh_eg_E: "{{ lme_resolved.remote_harness.entry_generation.adoption.eligibility }}"
    _rh_eg_cur: "{{ rh_eg_adopt.mode in [_rh_eg_M.admit, _rh_eg_M.repeat] }}"
    _rh_eg_rroot: "{{ '^' ~ ((rh_eg_plan.retention_root_rel ~ rh.controller.bootstrap.path_admission.separator) | regex_escape) }}"
    _rh_eg_exec: >-
      {{ (rh.controller.entry_generation.dispatch.closure_rel + rh.controller.bootstrap.source_admission.members_rel
          + (rh.controller.bootstrap.source_admission.importers | dict2items | map(attribute='key') | list)
          + (rh.controller.bootstrap.source_admission.importers.values() | flatten | list)
          + (rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | map('first') | list)
          + rh_eg_plan.render_inputs_rel) | unique(case_sensitive=true) | list }}
    _rh_eg_pbad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- if (rh_eg_adopt.outputs_rel | unique(case_sensitive=true) | list | length) != (rh_eg_adopt.outputs_rel | length) -%}{%- set ns.o = ns.o + [['duplicate_output', rh_eg_adopt.outputs_rel]] -%}{%- endif -%}
      {%- if _rh_eg_E.baseline is none or rh_eg_adopt.doc[_rh_eg_R.adoption_roles.source_edition] != _rh_eg_E.baseline -%}{%- set ns.o = ns.o + [['not_eligible_baseline', rh_eg_adopt.doc[_rh_eg_R.adoption_roles.source_edition], _rh_eg_E.baseline]] -%}{%- endif -%}
      {%- if (rh_eg_adopt.outputs_rel | sort) != (_rh_eg_E.authored.keys() | list | sort) -%}{%- set ns.o = ns.o + [['not_eligible_set', rh_eg_adopt.outputs_rel | sort, _rh_eg_E.authored.keys() | list | sort]] -%}{%- endif -%}
      {%- for row in rh_eg_adopt.rows -%}
      {%- if row[_rh_eg_W.output] not in _rh_eg_E.authored or _rh_eg_E.authored[row[_rh_eg_W.output]] != row[_rh_eg_W.blob] -%}{%- set ns.o = ns.o + [['not_eligible_blob', row[_rh_eg_W.output], row[_rh_eg_W.blob]]] -%}{%- endif -%}
      {%- if _rh_eg_cur | bool and row[_rh_eg_W.output] not in rh_eg_plan.outputs_rel -%}{%- set ns.o = ns.o + [['not_roster_output', row[_rh_eg_W.output]]] -%}{%- endif -%}
      {%- if rh_eg_adopt.mode == _rh_eg_M.admit and row[_rh_eg_W.output] not in rh_eg_rec.outputs_present -%}{%- set ns.o = ns.o + [['prestate_missing', row[_rh_eg_W.output]]] -%}{%- endif -%}
      {%- endfor -%}
      {%- if _rh_eg_cur | bool and rh_eg_adopt.doc[_rh_eg_R.adoption_roles.roster] != lme_resolved.remote_harness.entry_generation.roster_source_sha256 -%}{%- set ns.o = ns.o + [['roster_not_intended', rh_eg_adopt.doc[_rh_eg_R.adoption_roles.roster]]] -%}{%- endif -%}
      {{ ns.o }}
    _rh_eg_rbad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- if (rh_eg_adopt.retained_rel | unique(case_sensitive=true) | list | length) != (rh_eg_adopt.retained_rel | length) -%}{%- set ns.o = ns.o + [['duplicate_retention', rh_eg_adopt.retained_rel]] -%}{%- endif -%}
      {%- for r in rh_eg_adopt.retained_rel -%}
      {%- if r is not match(_rh_eg_rroot)
             or (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ r) is not match(rh.controller.bootstrap.path_admission.regex)
             or (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ r) is search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
             or r in (rh_eg_plan.base_admission_rel + rh_eg_plan.outputs_rel + [rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel, rh_eg_plan.adoption_rel]) -%}
      {%- set ns.o = ns.o + [['retention_outside_root', r]] -%}{%- endif -%}
      {%- endfor -%}
      {%- for r in rh_eg_adopt.retained_rel + [rh_eg_plan.adoption_rel] -%}
      {%- if r in _rh_eg_exec -%}{%- set ns.o = ns.o + [['evidence_in_executable_closure', r]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_eg_pbad | length == 0
      - _rh_eg_rbad | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.adoption_prestate if _rh_eg_pbad | length > 0 else _rh_eg_R.refusals.adoption_retention }}:
      {{ _rh_eg_R.texts.adoption_prestate if _rh_eg_pbad | length > 0 else _rh_eg_R.texts.adoption_retention }}
      {{ [rh_eg_adopt.mode, _rh_eg_pbad, _rh_eg_rbad] | to_json }}
    quiet: true
  when: rh_eg_adopt.mode != lme_resolved.remote_harness.entry_generation.adoption.modes.none

# MISSING ACCEPTED RECORD (B r5m precedence, per operation): a roster output present -> generate ORPHAN, verify / package /
# invoke ABSENT; verify / package / invoke ABSENT also without outputs. Generate with no output present qualifies as FIRST
# GENERATION only by the declared genesis transition (or the resume of a genesis journal) -- never by absence alone
# (R2I-PRISTINE-CLASSIFICATION); otherwise CUSTODY-LOST. The record locators' absence from the admitted commit tree is
# enforced by the main git admission below (rh_gp_absent, custody-lost cause); GEN-ADOPT2: so is the absence of ANY record
# history reachable from HEAD (rh_gp_history lineage, custody-lost cause) -- for genesis and adopt alike (LIN-03).
- name: "ENTRY GENERATION -- refuse a missing accepted record (ORPHAN in generate with outputs; ABSENT otherwise)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_gen: "{{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate }}"
  ansible.builtin.assert:
    that:
      # GEN-AUTHORED-TO-GENERATED-ADOPTION: the ONE exemption -- an ADMIT-mode adoption (identity, sets and prestate
      # admitted above) whose manifest names EVERY present roster output; any unnamed present output stays generic ORPHAN
      - rh_eg_rec.accepted_present
        or (_rh_eg_gen and ((rh_eg_rec.outputs_present | length) == 0
                            or (rh_eg_adopt.mode == lme_resolved.remote_harness.entry_generation.adoption.modes.admit
                                and (rh_eg_rec.outputs_present | reject('in', rh_eg_adopt.outputs_rel) | list | length) == 0)))
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals[_rh_eg_R.precedence.missing_record_with_outputs[rh_eg_op]] if (rh_eg_rec.outputs_present | length) > 0 else _rh_eg_R.refusals.absent }}:
      {{ _rh_eg_R.texts[_rh_eg_R.precedence.missing_record_with_outputs[rh_eg_op]] if (rh_eg_rec.outputs_present | length) > 0 else _rh_eg_R.texts.absent }}
      {{ [rh_eg_op, rh_eg_plan.accepted_rel, rh_eg_rec.outputs_present] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- refuse a first generation that is not declared (CUSTODY-LOST), or a genesis transition over an accepted record"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_T: "{{ rh.controller.entry_generation.transition.kinds }}"
    _rh_eg_jgen: >-
      {{ rh_eg_rec.in_progress is mapping
         and rh_eg_rec.in_progress.get(lme_resolved.remote_harness.entry_generation.records.in_progress_roles.predecessor) == lme_resolved.remote_harness.entry_generation.records.predecessor_genesis }}
  ansible.builtin.assert:
    that:
      - rh_eg_rec.accepted_present or rh_eg_tr == _rh_eg_T.genesis or _rh_eg_jgen
        or rh_eg_adopt.mode == lme_resolved.remote_harness.entry_generation.adoption.modes.admit
      - not rh_eg_rec.accepted_present or rh_eg_tr != _rh_eg_T.genesis
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.custody_lost }}:
      {{ _rh_eg_R.texts.custody_lost }}
      {{ [rh_eg_op, rh_eg_tr, rh_eg_rec.accepted_present, rh_eg_rec.in_progress_present] | to_json }}
    quiet: true
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

- name: "ENTRY GENERATION -- refuse verify, package or invoke whose accepted record is not the current roster (RECORD-ABSENT)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - (rh_eg_rec.accepted[_rh_eg_R.roles.outputs].keys() | list | sort) == (rh_eg_plan.outputs_rel | sort)
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.absent }}:
      {{ _rh_eg_R.texts.absent }}
      {{ [rh_eg_op, rh_eg_plan.accepted_rel, rh_eg_rec.accepted[_rh_eg_R.roles.outputs].keys() | list | sort, rh_eg_plan.outputs_rel | sort] | to_json }}
    quiet: true
  when: rh_eg_op != rh.controller.entry_generation.operation.modes.generate

# JOURNAL STATE (R2I-INTERRUPTED-OBLIGATIONS). Shape: key set = in_progress_roles values. Relation to the accepted record:
#   resume     its predecessor IS the accepted file digest (or the genesis marker with no accepted record): generate only
#   satisfied  a committed accepted record is its VERIFIED successor: accepted.predecessor == journal.predecessor, same
#              intended source_edition / inputs / revision, staged == accepted outputs, every journal pending row and
#              inherited obligation held as an accepted obligation (pending: origin == journal predecessor; inherited: the
#              identical row) or settled (pending: a retired row, predecessor == journal predecessor; inherited: a
#              COMPLETED row with origin and reason kept -- r2k, B r5o completed_roles)
#   otherwise  INTERRUPTED (every operation)
- name: "ENTRY GENERATION -- classify the journal (none / resume / satisfied)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_state: >-
      {%- set R = _rh_eg_R -%}{%- set J = rh_eg_rec.in_progress -%}{%- set IR = R.in_progress_roles -%}
      {%- if not rh_eg_rec.in_progress_present -%}none
      {%- elif not (J is mapping and (J.keys() | list | sort) == (IR.values() | list | sort)) -%}malformed
      {%- elif J[IR.predecessor] == (rh_eg_rec.accepted_file_sha256 if rh_eg_rec.accepted_present else R.predecessor_genesis) -%}resume
      {%- elif rh_eg_rec.accepted_present -%}
      {%- set S = rh_eg_rec.accepted -%}
      {%- set ns = namespace(ok=(S[R.roles.predecessor] == J[IR.predecessor] and S[R.roles.source_edition] == J[IR.source_edition]
                                 and S[R.roles.inputs] == J[IR.inputs] and S[R.roles.revision] == J[IR.revision]
                                 and S[R.roles.roster] == J[IR.roster]
                                 and S[R.roles.adoption] == J[IR.adoption]
                                 and (S[R.roles.outputs].keys() | list | sort) == (J[IR.staged] | sort))) -%}
      {%- for p in J[IR.pending] -%}
      {%- set o = {R.obligation_roles.output: p[R.pending_roles.output], R.obligation_roles.reason: p[R.pending_roles.reason],
                   R.obligation_roles.origin: J[IR.predecessor], R.obligation_roles.state: p[R.pending_roles.state]} -%}
      {%- set d = {R.retired_roles.output: p[R.pending_roles.output], R.retired_roles.reason: p[R.pending_roles.reason],
                   R.retired_roles.predecessor: J[IR.predecessor]} -%}
      {%- if o not in S[R.roles.obligations] and d not in S[R.roles.retired] -%}{%- set ns.ok = false -%}{%- endif -%}
      {%- endfor -%}
      {%- for ob in J[IR.obligations] -%}
      {#- r2k (B r5o completed_roles): an inherited obligation is held carried (identical) or COMPLETED (origin + reason kept) -#}
      {%- set d = {R.completed_roles.output: ob[R.obligation_roles.output], R.completed_roles.reason: ob[R.obligation_roles.reason],
                   R.completed_roles.origin: ob[R.obligation_roles.origin]} -%}
      {%- if ob not in S[R.roles.obligations] and d not in S[R.roles.completed] -%}{%- set ns.ok = false -%}{%- endif -%}
      {%- endfor -%}{{ 'satisfied' if ns.ok else 'interrupted' }}
      {%- else -%}interrupted{%- endif -%}
  ansible.builtin.set_fact:
    rh_eg_rec: "{{ rh_eg_rec | combine({'journal': _rh_eg_state | trim}) }}"

- name: "ENTRY GENERATION -- refuse a malformed or unsatisfied journal, or a resumable journal outside generate (INTERRUPTED)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - rh_eg_rec.journal in ['none', 'resume', 'satisfied']
      - rh_eg_rec.journal != 'resume' or rh_eg_op == rh.controller.entry_generation.operation.modes.generate
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.interrupted }}:
      {{ _rh_eg_R.texts.interrupted }}
      {{ [rh_eg_op, rh_eg_plan.in_progress_abs, rh_eg_rec.journal, rh_eg_rec.accepted_file_sha256] | to_json }}
    quiet: true

# OWNERSHIP PLAN. owned / retired / completed / obligation outputs come ONLY from the admitted records (never the roster);
# obsolete = accepted owned - current roster outputs (generate: becomes a retired row or an OPENED obligation of the
# successor). R5O-OBSOLETE-CONTRACT-CONSISTENCY: carried obligations are never obsolete, need no fresh reason and are
# not re-counted; the observation scope (probe_rel / absent_rel) covers them.
# r2k R2J-RECORD-SCHEMA-JOIN + r5p (B b93e2c06 records.roles.historical, reconciliation.historical) -- DISTINCT sets:
#   obligation_rel  pending removals of the accepted record (carried or opened there): IN SCOPE (bounded stat + commit
#                   probe) at EVERY operation until a later generate completes it; a still-present obligation is admitted
#                   (B OB-06), never refused -- r2j's verify-time absence of obligations is WITHDRAWN
#   retired_rel / completed_rel   the accepted record's own transition rows (accounting; never newly removed)
#   historical_rel  HIST (not RET-01): H(A) = A.historical + A.retired + A.completed minus a path the CURRENT roster
#                   re-admits; verified ABSENT (worktree stat once + commit probe) at EVERY operation, before any write:
#                   hist_carried_rel (A.historical) -> refusals.historical_absence; hist_closed_rel (A.retired /
#                   A.completed) -> refusals.unreconciled_successor (B r5p verify-of-head classification)
# r2k R2J-PENDING-READMISSION: readmitted_rel = H(A) paths the current roster declares again -- a new identity, owned by
# this generation (roster row + owned sha256 written below), dropped from the successor's historical set (law (3));
# pending_readded_rel = an accepted OBLIGATION path the roster declares again -- refused below, the obligation kept.
# With no accepted record, absent_rel = the record locators themselves (worktree-only loss is custody lost, never a
# first generation by absence alone).
- name: "ENTRY GENERATION -- bind the ownership plan and the admission list (records included when present)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_gen: "{{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate }}"
    _rh_eg_A: "{{ rh_eg_rec.accepted if rh_eg_rec.accepted_present else {} }}"
    _rh_eg_owned: "{{ (_rh_eg_A[_rh_eg_R.roles.owned] | map(attribute=_rh_eg_R.owned_roles.output) | list) if rh_eg_rec.accepted_present else [] }}"
    _rh_eg_ret: "{{ (_rh_eg_A[_rh_eg_R.roles.retired] | map(attribute=_rh_eg_R.retired_roles.output) | list) if rh_eg_rec.accepted_present else [] }}"
    _rh_eg_cmp: "{{ (_rh_eg_A[_rh_eg_R.roles.completed] | map(attribute=_rh_eg_R.completed_roles.output) | list) if rh_eg_rec.accepted_present else [] }}"
    _rh_eg_obl: "{{ (_rh_eg_A[_rh_eg_R.roles.obligations] | map(attribute=_rh_eg_R.obligation_roles.output) | list) if rh_eg_rec.accepted_present else [] }}"
    _rh_eg_ahist: "{{ (_rh_eg_A[_rh_eg_R.roles.historical] | map(attribute=_rh_eg_R.historical_roles.output) | list) if rh_eg_rec.accepted_present else [] }}"
    # r5p law (3) on the HEAD alone: H(A) = A.historical + A.retired + A.completed. A.historical already carries
    # H(P) - readmitted (reconciled above), so the whole chain's history is the head's own rows -- no retained read.
    _rh_eg_hist: "{{ (_rh_eg_ahist + _rh_eg_ret + _rh_eg_cmp) | unique(case_sensitive=true) | list }}"
  ansible.builtin.set_fact:
    rh_eg_plan: >-
      {{ rh_eg_plan | combine({
           'owned_rel': _rh_eg_owned,
           'retired_rel': _rh_eg_ret,
           'completed_rel': _rh_eg_cmp,
           'obligation_rel': _rh_eg_obl,
           'historical_rel': _rh_eg_hist | reject('in', rh_eg_plan.outputs_rel) | list,
           'hist_carried_rel': _rh_eg_ahist | reject('in', rh_eg_plan.outputs_rel) | list,
           'hist_closed_rel': (_rh_eg_ret + _rh_eg_cmp) | reject('in', rh_eg_plan.outputs_rel) | list,
           'obsolete_rel': _rh_eg_owned | reject('in', rh_eg_plan.outputs_rel) | list,
           'readmitted_rel': _rh_eg_hist | select('in', rh_eg_plan.outputs_rel) | list,
           'pending_readded_rel': _rh_eg_obl | select('in', rh_eg_plan.outputs_rel) | list,
           'absent_rel': [] if rh_eg_rec.accepted_present else [rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel],
           'probe_rel': ((_rh_eg_hist | reject('in', rh_eg_plan.outputs_rel) | list) + _rh_eg_obl
                         + ((_rh_eg_owned | reject('in', rh_eg_plan.outputs_rel) | list) if _rh_eg_gen else [])) | unique(case_sensitive=true) | list,
           'admission_rel': rh_eg_plan.base_admission_rel + _rh_eg_carried + rh_eg_adopt.admission_rel}) }}

# r2k R2J-PENDING-READMISSION (B r5o :622 "a pending path cannot be re-owned"): an accepted obligation path back in the
# roster refuses at EVERY operation; the obligation is kept (nothing here or later drops it).
- name: "ENTRY GENERATION -- refuse a pending (obligation) path re-admitted by the roster (UNRECONCILED; obligation kept)"
  vars:
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
  ansible.builtin.assert:
    that:
      - rh_eg_plan.pending_readded_rel | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_p.ownership.refusals.unreconciled }}:
      {{ _rh_eg_p.ownership.texts.unreconciled }}
      {{ [rh_eg_plan.pending_readded_rel, rh_eg_plan.obligation_rel] | to_json }}
    quiet: true

# RETIRE INTENTS (roster `retire` rows, admission only; intent never defines ownership): each names an output of the bound
# predecessor chain -- owned, carried obligation, retired or completed (a lingering valid intent for a completed retirement
# is admitted at every reapply; B's narrower unreconciled text is filed as a conflict) -- and never a current roster row.
# r2l R2K-HISTORICAL-INTENT-CONTINUITY (codex-tick473): intent lifetime follows historical continuity. When a successor
# C moves a retired / completed path y of its predecessor B into C.historical (r5p law (3)), the SAME retire declaration
# must still verify against C: the admitted set therefore also includes the accepted record's carried HISTORICAL rows
# (hist_carried_rel = A.historical minus a current-roster readmission) -- recorded historical ownership whose absence
# is verified at every operation (HISTORICAL ABSENCE). Nothing outside the recorded chain is admitted (no expansion into
# unrelated paths), a historical intent never becomes a removal reason (obsolete_rel = owned - outputs only), and every
# outstanding obligation is kept. Semantic delta vs B b93e2c06 :883 (unreconciled text names only owned / carried
# obligations): X-R2L-INTENT-LIFETIME (B to widen the text; B bytes untouched here).
- name: "ENTRY GENERATION -- refuse a retire intent outside the recorded chain or naming a current output (RETIRED-UNOWNED)"
  vars:
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_ret: "{{ lme_resolved.remote_harness.entry_generation.retire | map(attribute=lme_resolved.remote_harness.entry_generation.retire_roles.output) | list }}"
    _rh_eg_chain: >-
      {{ rh_eg_plan.owned_rel + rh_eg_plan.obligation_rel + rh_eg_plan.retired_rel + rh_eg_plan.completed_rel
         + rh_eg_plan.hist_carried_rel }}
  ansible.builtin.assert:
    that:
      - _rh_eg_ret | unique(case_sensitive=true) | list | length == _rh_eg_ret | length
      - _rh_eg_ret | reject('in', _rh_eg_chain) | list | length == 0
      - _rh_eg_ret | intersect(rh_eg_plan.outputs_rel) | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_p.ownership.refusals.unreconciled }}:
      {{ _rh_eg_p.ownership.texts.unreconciled }}
      {{ [_rh_eg_ret, rh_eg_plan.owned_rel, rh_eg_plan.obligation_rel, rh_eg_plan.retired_rel, rh_eg_plan.completed_rel, rh_eg_plan.hist_carried_rel, rh_eg_plan.outputs_rel] | to_json }}
    quiet: true

# GENERATE: every newly obsolete output needs a REASON -- the resumed journal's pending row (kept even when the current
# intent was removed between attempts) or a current intent; a resumed pending output back in the roster, or a resumed
# journal whose inherited obligations are not the accepted record's, cannot reach a successor.
- name: "ENTRY GENERATION -- refuse an obsolete owned output without a reason (OBSOLETE-OWNED) or a resumed journal that cannot reach a successor"
  vars:
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_res: "{{ rh_eg_rec.journal == 'resume' }}"
    _rh_eg_jpend: >-
      {{ (rh_eg_rec.in_progress[_rh_eg_R.in_progress_roles.pending] | map(attribute=_rh_eg_R.pending_roles.output) | list) if _rh_eg_res else [] }}
    _rh_eg_ret: "{{ _rh_eg_p.retire | map(attribute=_rh_eg_p.retire_roles.output) | list }}"
    _rh_eg_noreason: "{{ rh_eg_plan.obsolete_rel | reject('in', _rh_eg_jpend + _rh_eg_ret) | list }}"
    _rh_eg_back: "{{ _rh_eg_jpend | reject('in', rh_eg_plan.obsolete_rel) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_noreason | length == 0
      - _rh_eg_back | length == 0
      - not _rh_eg_res or not rh_eg_rec.accepted_present
        or rh_eg_rec.in_progress[_rh_eg_R.in_progress_roles.obligations] == rh_eg_rec.accepted[_rh_eg_R.roles.obligations]
    fail_msg: >-
      REFUSED {{ _rh_eg_p.ownership.refusals.obsolete if _rh_eg_noreason | length > 0 else _rh_eg_R.refusals.unreconciled_successor }}:
      {{ _rh_eg_p.ownership.texts.obsolete if _rh_eg_noreason | length > 0 else _rh_eg_R.texts.unreconciled_successor }}
      {{ [_rh_eg_noreason, _rh_eg_back] | to_json }}
    quiet: true
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

# ---- SOURCE CUSTODY before any write: every admission input is a regular non-linked checkout file owned by 0 or the
# running uid, not other-writable; the same digests are taken again AFTER the render.
- name: "ENTRY GENERATION -- digest every admission input before any write (no link followed; read-only)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_plan.admission_rel }}"
  register: _rh_eg_src

- name: "ENTRY GENERATION -- refuse a missing, linked, foreign-owned or writable admission input"
  vars:
    _rh_eg_st: "{{ _rh_eg_src.results | map(attribute='stat') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_st | selectattr('exists') | list | length == _rh_eg_st | length
      - _rh_eg_st | selectattr('islnk') | list | length == 0
      - _rh_eg_st | rejectattr('isreg') | list | length == 0
      - _rh_eg_st | map(attribute='uid') | reject('in', [0, rh_eg_uid | int]) | list | length == 0
      - _rh_eg_st | selectattr('woth') | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.source }}:
      {{ rh.controller.entry_generation.messages.source }}
      {% set ns = namespace(o=[]) %}{% for s in _rh_eg_st %}{% set ns.o = ns.o + [[rh_eg_plan.admission_rel[loop.index0], s.exists, (s.mode if s.exists else none)]] %}{% endfor %}{{ ns.o | to_json }}
    quiet: true

# ROSTER AUTHORITY BYTES: the roster file's checkout digest == the digest of the bytes the ONE resolver read (C1 projects
# roster_source_sha256; no second loader) == (accepted record) its roster_sha256 for verify / package / invoke ==
# (seed) the digest the seed measured. Its commit membership is admitted by the git admission below in EVERY operation.
- name: "ENTRY GENERATION -- refuse a roster authority whose bytes are not the ones resolved, recorded or measured"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_have: "{{ _rh_eg_src.results[rh_eg_plan.admission_rel.index(lme_resolved.remote_harness.entry_generation.roster_source_rel)].stat.checksum }}"
    _rh_eg_seed: "{{ rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx }}"
    _rh_eg_gen: "{{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_have == _rh_eg_p.roster_source_sha256
      - _rh_eg_gen or _rh_eg_have == rh_eg_rec.accepted[_rh_eg_R.roles.roster]
      - not _rh_eg_seed or _rh_eg_have == lookup('ansible.builtin.vars', _rh_eg_d.dispatch.input_var)[_rh_eg_d.dispatch.input_keys.roster]
      # the accepted record's custody reference outside its bytes: the seed's measurement of the record file
      - not _rh_eg_seed or rh_eg_rec.accepted_file_sha256 == lookup('ansible.builtin.vars', _rh_eg_d.dispatch.input_var)[_rh_eg_d.dispatch.input_keys.accepted]
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.roster_authority }}:
      {{ _rh_eg_d.messages.roster_authority }}
      {{ [_rh_eg_p.roster_source_rel, _rh_eg_have, _rh_eg_p.roster_source_sha256] | to_json }}
    quiet: true

# RESUME BINDING (R2I-INTERRUPTED-OBLIGATIONS; B resume.bound_to): a resumed journal was started for EXACTLY these
# intended inputs -- source_edition, render-input mapping (domains.inputs: render-input rel -> sha256 of the bytes) and
# config revision. Otherwise only the declared rebind transition continues (obligations and pending rows are carried
# unchanged into the rewritten journal); without it CHANGED-INPUT. A rebind with nothing changed, or with no journal to
# resume, is an inapplicable transition and refuses.
- name: "ENTRY GENERATION -- refuse a resume under changed intended inputs without the declared rebind transition (RESUME-CHANGED-INPUT)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_IR: "{{ lme_resolved.remote_harness.entry_generation.records.in_progress_roles }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_now: >-
      {{ {_rh_eg_IR.source_edition: rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition],
          _rh_eg_IR.inputs: dict(rh_eg_plan.render_inputs_rel | zip(rh_eg_plan.render_inputs_rel | map('extract', _rh_eg_rsum))),
          _rh_eg_IR.revision: rh_config_revision,
          _rh_eg_IR.adoption: rh_eg_adopt.record_value} }}
    _rh_eg_was: >-
      {{ dict(_rh_eg_now.keys() | list | zip(_rh_eg_now.keys() | list | map('extract', rh_eg_rec.in_progress)))
         if rh_eg_rec.journal == 'resume' else _rh_eg_now }}
    _rh_eg_rebind: "{{ rh_eg_tr == rh.controller.entry_generation.transition.kinds.rebind }}"
  ansible.builtin.assert:
    that:
      # GEN-AUTHORED-TO-GENERATED-ADOPTION: the adoption identity is bound like the intended inputs, but a rebind NEVER
      # rewrites it (rebind retains the original provenance; a changed or dropped adoption identity refuses)
      - _rh_eg_was == _rh_eg_now or (_rh_eg_rebind and _rh_eg_was[_rh_eg_IR.adoption] == _rh_eg_now[_rh_eg_IR.adoption])
      - not _rh_eg_rebind or (rh_eg_rec.journal == 'resume' and _rh_eg_was != _rh_eg_now)
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.changed_input }}:
      {{ _rh_eg_R.texts.changed_input }}
      {{ [rh_eg_rec.journal, rh_eg_tr, _rh_eg_was, _rh_eg_now] | to_json }}
    quiet: true
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

# ---- GIT ADMISSION (R2H-COMMITTED-MEMBERSHIP + R2H-GIT-ERROR-CLASSIFICATION) through the ONE shared include --------
# generate: every admission input incl. the roster authority and the present records (only the outputs being authored
# are exempt; the mirror carries NO admission credit). verify / package / invoke: + every roster output. absent_rel
# (r2k r5p: ONLY the record locators when no accepted record exists) must be ABSENT from the intended commit; every
# operation PROBES the historical set and the obligation paths (+ generate: the obsolete paths) -- classified here,
# refused per role by the HISTORICAL ABSENCE task below (historical present -> historical_absence).
# Causes: tool / edition / object format / config / conversion / untracked-or-ignored / staged / wrong-commit bytes /
# residual porcelain / still-tracked absent -- distinct; nothing continues after any.
- name: "ENTRY GENERATION -- admit commit membership and bytes (shared git admission)"
  ansible.builtin.include_tasks: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].include_rel | basename }}"
  vars:
    # r2k: per-ROLE tool record (rh_src_admission[record_fields.tool][<tool_roles key>]); r2j read a non-existent record_fields.env
    rh_gp_tool: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.tool].git[lme_resolved.remote_harness.source_admission.tool_fields.path] }}"
    rh_gp_env: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.tool].env[lme_resolved.remote_harness.source_admission.tool_fields.path] }}"
    rh_gp_git: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] }}"
    rh_gp_repo: "{{ rh_repo_root }}"
    # GEN-AUTHORED-TO-GENERATED-ADOPTION: an ADMIT-mode generate also admits the authored outputs it adopts (prestate_rel:
    # tracked, unstaged, committed bytes) through this SAME include, exactly as verify admits every output
    rh_gp_paths: >-
      {{ rh_eg_plan.admission_rel + rh_eg_adopt.prestate_rel
         if rh_eg_op == rh.controller.entry_generation.operation.modes.generate
         else rh_eg_plan.admission_rel + rh_eg_plan.outputs_rel }}
    rh_gp_absent: "{{ rh_eg_plan.absent_rel }}"
    rh_gp_probe: "{{ rh_eg_plan.probe_rel }}"
    rh_gp_edition: >-
      {{ lookup('ansible.builtin.vars', rh.controller.entry_generation.dispatch.input_var)[rh.controller.entry_generation.dispatch.input_keys.edition]
         if rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx else rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition] }}
    # r2k r5p: absent_rel is non-empty ONLY without an accepted record (the record locators -> custody lost); history
    # and obligations ride rh_gp_probe and are classified per role AFTER the include (HISTORICAL ABSENCE below)
    rh_gp_codes: >-
      {{ rh.controller.entry_generation.refusals.git
         | combine({rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].absent_cause:
                    lme_resolved.remote_harness.entry_generation.records.refusals.custody_lost}) }}
    rh_gp_texts: >-
      {{ rh.controller.entry_generation.messages.git
         | combine({rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].absent_cause:
                    lme_resolved.remote_harness.entry_generation.records.texts.custody_lost}) }}
    # GEN-ADOPT2 BOUNDED HISTORICAL PROOF through the SAME shared include (no second git admitter; codex-tick512):
    #   adoption (every mode but none: admit, repeat AND carried -- so a seed verify re-proves it in the dispatched
    #     checkout and fails closed on a checkout whose history does not reach the source edition): the manifest's
    #     source_edition is a commit reachable from the admitted HEAD whose tree holds every authored output AND every
    #     retention copy at the row's blob id and the roster authority at the manifest's roster_blob (historical roster)
    #     -> else B adoption_unbound (ADO-SOURCE-EDITION-PROOF / ADO-HISTORICAL-ROSTER)
    #   lineage (every FIRST generation: no accepted record -- genesis, adopt admit, either journal's resume): the
    #     record locators (absent_rel) have NO history reachable from HEAD -> else B custody_lost (LIN-03 /
    #     ADO-LOST-RECORD-RELABEL: committed deletion of the records never re-opens a first generation)
    # Codes / texts are B's existing families (OD-ADO-08); key names come from the declared history roles.
    rh_gp_history: >-
      {%- set R = lme_resolved.remote_harness.entry_generation.records -%}
      {%- set W = R.authored_roles -%}
      {%- set H = rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git].history -%}
      {%- set ad = rh_eg_adopt.mode != lme_resolved.remote_harness.entry_generation.adoption.modes.none -%}
      {%- set first = not rh_eg_rec.accepted_present -%}
      {%- set ns = namespace(b={}) -%}
      {%- if ad -%}
      {%- for row in rh_eg_adopt.rows -%}{%- set ns.b = ns.b | combine({row[W.output]: row[W.blob], row[W.retained]: row[W.blob]}) -%}{%- endfor -%}
      {%- set ns.b = ns.b | combine({lme_resolved.remote_harness.entry_generation.roster_source_rel: rh_eg_adopt.doc[R.adoption_roles.roster_blob]}) -%}
      {%- endif -%}
      {%- set out = ({H.input_roles.edition: (rh_eg_adopt.doc[R.adoption_roles.source_edition] if ad else none),
                      H.input_roles.blobs: ns.b,
                      H.input_roles.lineage: (rh_eg_plan.absent_rel if first else []),
                      H.input_roles.codes: {H.cause_roles.history: R.refusals.adoption_unbound, H.cause_roles.lineage: R.refusals.custody_lost},
                      H.input_roles.texts: {H.cause_roles.history: R.texts.adoption_unbound, H.cause_roles.lineage: R.texts.custody_lost}}
                     if (ad or first) else none) -%}{{ out }}

- name: "ENTRY GENERATION -- bind the admitted commit (derived output)"
  ansible.builtin.set_fact:
    rh_eg_edition: "{{ rh_gp_head }}"

- name: "ENTRY GENERATION -- refuse a carried record admitted at another commit than the main admission (FOREIGN)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_carried | reject('in', rh_gp_oids) | list | length == 0
      - _rh_eg_carried | map('extract', rh_gp_oids) | list == _rh_eg_carried | map('extract', _rh_eg_rec_oids) | list
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.foreign }}:
      {{ _rh_eg_R.texts.foreign }}
      {{ [_rh_eg_carried, rh_gp_head] | to_json }}
    quiet: true

# ---- ADOPTION PRESERVATION + PRESTATE (GEN-AUTHORED-TO-GENERATED-ADOPTION; every operation with a manifest, before ANY
# write): the manifest and every retention row were admitted above as admission inputs (tracked, unstaged, committed bytes,
# digested before / after). Here each retention row is a regular non-linked file whose blob id is the authored blob and
# whose sha256 is the authored sha256 -- the exact authored bytes PRESERVED at the admitted commit, outside the execution
# path -- and (admit) each adopted output is the exact present authored identity (worktree stat + admitted blob id). The
# journal write, the mirror and the reviewed commit that replaces the authored bytes are all AFTER this gate.
# GEN-ADOPT2: the include above ALSO proved (every mode but none) that the SAME blob ids are those of the named source
# edition, reachable from HEAD (bytes == the reviewed historical commit, not merely == the dispatched commit), and
# (first generation) that no record history exists. ADO-RET-01 retrieval qualification stays ADDITIONAL (UNRUN).
- name: "ENTRY GENERATION -- stat every retention row of the adoption manifest (no link followed; read-only)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_adopt.retained_rel }}"
  register: _rh_eg_robs

- name: "ENTRY GENERATION -- refuse missing / changed preservation (ADOPTION-RETENTION) or a changed / linked adopted prestate (ADOPTION-PRESTATE)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_W: "{{ lme_resolved.remote_harness.entry_generation.records.authored_roles }}"
    _rh_eg_M: "{{ lme_resolved.remote_harness.entry_generation.adoption.modes }}"
    _rh_eg_ost: "{{ dict(rh_eg_plan.outputs_rel | zip(_rh_eg_obs.results[3:] | map(attribute='stat'))) }}"
    _rh_eg_rbad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for row in rh_eg_adopt.rows -%}
      {%- set s = _rh_eg_robs.results[loop.index0].stat -%}
      {%- set r = row[_rh_eg_W.retained] -%}
      {%- if not s.exists or s.islnk or not s.isreg or s.checksum != row[_rh_eg_W.sha256]
             or r not in rh_gp_oids or rh_gp_oids[r] != row[_rh_eg_W.blob] -%}
      {%- set ns.o = ns.o + [[r, row[_rh_eg_W.output], s.exists]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
    _rh_eg_pbad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- if rh_eg_adopt.mode == _rh_eg_M.admit -%}
      {%- for row in rh_eg_adopt.rows -%}
      {%- set o = row[_rh_eg_W.output] -%}{%- set s = _rh_eg_ost[o] -%}
      {%- if not s.exists or s.islnk or not s.isreg or s.checksum != row[_rh_eg_W.sha256]
             or o not in rh_gp_oids or rh_gp_oids[o] != row[_rh_eg_W.blob] -%}
      {%- set ns.o = ns.o + [[o, s.exists]] -%}{%- endif -%}
      {%- endfor -%}
      {%- endif -%}
      {#- GEN-ADOPT2 (ADO-HISTORICAL-ROSTER): at the CURRENT-roster boundary (admit / repeat) the admitted roster authority
          is the historical roster the manifest names (its blob at the source edition was proven by the include) -#}
      {%- set rr = lme_resolved.remote_harness.entry_generation.roster_source_rel -%}
      {%- if rh_eg_adopt.mode in [_rh_eg_M.admit, _rh_eg_M.repeat]
             and (rr not in rh_gp_oids or rh_gp_oids[rr] != rh_eg_adopt.doc[_rh_eg_R.adoption_roles.roster_blob]) -%}
      {%- set ns.o = ns.o + [[rr, 'roster_not_baseline']] -%}{%- endif -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - rh_eg_plan.adoption_rel in rh_gp_oids
      - _rh_eg_robs.results | map(attribute='item') | list == rh_eg_adopt.retained_rel
      - _rh_eg_rbad | length == 0
      - _rh_eg_pbad | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.adoption_prestate if _rh_eg_pbad | length > 0 else _rh_eg_R.refusals.adoption_retention }}:
      {{ _rh_eg_R.texts.adoption_prestate if _rh_eg_pbad | length > 0 else _rh_eg_R.texts.adoption_retention }}
      {{ [rh_eg_adopt.mode, rh_eg_plan.adoption_rel, _rh_eg_rbad, _rh_eg_pbad] | to_json }}
    quiet: true
  when: rh_eg_adopt.mode != lme_resolved.remote_harness.entry_generation.adoption.modes.none

# ---- COMMITTED OUTPUTS (verify / package / invoke): missing -> modified (CUS-01 verify_equality /
# recorded_digest_mismatch) -> dispatch joins. Recorded digests come ONLY from the admitted accepted record.
- name: "ENTRY GENERATION -- refuse a missing, linked or non-regular committed entry (gate)"
  vars:
    _rh_eg_st: "{{ _rh_eg_obs.results[3:] | map(attribute='stat') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_st | selectattr('exists') | list | length == _rh_eg_st | length
      - _rh_eg_st | selectattr('islnk') | list | length == 0
      - _rh_eg_st | rejectattr('isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.missing }}:
      {{ rh.controller.entry_generation.messages.missing }}
      {% set ns = namespace(o=[]) %}{% for s in _rh_eg_st %}{% set ns.o = ns.o + [[rh_eg_plan.outputs_rel[loop.index0], s.exists, (s.mode if s.exists else none)]] %}{% endfor %}{{ ns.o | to_json }}
    quiet: true
  when: rh_eg_op != rh.controller.entry_generation.operation.modes.generate

- name: "ENTRY GENERATION -- refuse a committed entry whose bytes are not its accepted recorded digest (gate: modified)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_have: "{{ _rh_eg_obs.results[3:] | map(attribute='stat') | map(attribute='checksum') | list }}"
    _rh_eg_want: "{{ rh_eg_plan.outputs_rel | map('extract', rh_eg_rec.accepted[lme_resolved.remote_harness.entry_generation.records.roles.outputs]) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_have == _rh_eg_want
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.modified }}:
      {{ rh.controller.entry_generation.messages.modified }}
      {{ rh_eg_plan.outputs_rel | zip(_rh_eg_have, _rh_eg_want) | list | to_json }}
    quiet: true
  when: rh_eg_op != rh.controller.entry_generation.operation.modes.generate

# DISPATCH JOINS (seed context; B X-R2-4): every entry the seed is about to start is a roster output, and the digest the
# seed measured == the accepted recorded digest == the committed bytes observed here.
- name: "ENTRY GENERATION -- refuse a dispatched entry outside the roster or of other bytes (seed context)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_out: "{{ lookup('ansible.builtin.vars', rh.controller.entry_generation.dispatch.input_var)[rh.controller.entry_generation.dispatch.input_keys.outputs] }}"
    _rh_eg_rows: "{{ rh_eg_rec.accepted[lme_resolved.remote_harness.entry_generation.records.roles.outputs] }}"
    _rh_eg_cmt: "{{ dict(rh_eg_plan.outputs_rel | zip(_rh_eg_obs.results[3:] | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for k, v in _rh_eg_out.items() -%}
      {%- if k not in _rh_eg_cmt or k not in _rh_eg_rows or v != _rh_eg_rows[k] or v != _rh_eg_cmt[k] -%}{%- set ns.o = ns.o + [k] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_eg_bad | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.dispatch }}:
      {{ _rh_eg_d.messages.dispatch_entry }}
      {{ _rh_eg_bad | to_json }}
    quiet: true
  when: rh.controller.entry_generation.contexts.dispatch_field in rh_eg_ctx

# OBSERVATION SCOPE (B r5p: roster outputs + accepted.owned + pending + predecessor obligation rows + the historical
# set; attributable record-named paths only): ONE exact stat per path the plan names (no scan; no link followed), at
# EVERY operation, before any write. The historical set (H(A) minus readmission) must be absent from BOTH the worktree
# (this stat) and the intended commit (rh_gp_tracked from the probe); obligations are classified, never refused.
- name: "ENTRY GENERATION -- stat exactly the historical, obligation and obsolete paths of the plan (no scan; no link followed)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ (rh_eg_plan.absent_rel + rh_eg_plan.probe_rel) | unique(case_sensitive=true) | list }}"
  register: _rh_eg_obsl

- name: "ENTRY GENERATION -- refuse a missing-record locator still present in the worktree (CUSTODY-LOST)"
  vars:
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_bad: "{{ _rh_eg_obsl.results | selectattr('item', 'in', rh_eg_plan.absent_rel) | selectattr('stat.exists') | map(attribute='item') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_bad | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_p.records.refusals.custody_lost }}:
      {{ _rh_eg_p.records.texts.custody_lost }}
      {{ _rh_eg_bad | to_json }}
    quiet: true

# HISTORICAL ABSENCE (r2k r5p X-R2-R5P-HIST; B reconciliation.historical requires verified_absence at acceptance and at
# every verify): a historical path present in the worktree or tracked by the intended commit without readmission
# refuses BEFORE ANY WRITE -- carried historical rows (A.historical) with refusals.historical_absence; the head's own
# retired / completed rows with refusals.unreconciled_successor (B verify-of-head classification). Every operation.
- name: "ENTRY GENERATION -- refuse a historical path present without readmission (HISTORICAL-ABSENCE / UNRECONCILED-SUCCESSOR)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_seen: >-
      {{ (_rh_eg_obsl.results | selectattr('stat.exists') | map(attribute='item') | list) + rh_gp_tracked }}
    _rh_eg_hc: "{{ rh_eg_plan.hist_carried_rel | select('in', _rh_eg_seen) | unique(case_sensitive=true) | list }}"
    _rh_eg_hx: "{{ rh_eg_plan.hist_closed_rel | select('in', _rh_eg_seen) | unique(case_sensitive=true) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_hc | length == 0
      - _rh_eg_hx | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.historical_absence if _rh_eg_hc | length > 0 else _rh_eg_R.refusals.unreconciled_successor }}:
      {{ _rh_eg_R.texts.historical_absence if _rh_eg_hc | length > 0 else _rh_eg_R.texts.unreconciled_successor }}
      {{ [_rh_eg_hc, _rh_eg_hx, rh_eg_plan.readmitted_rel] | to_json }}
    quiet: true

# SUCCESSOR OWNERSHIP (generate; r2k R2J-RECORD-SCHEMA-JOIN = B r5o :610-641, superseding r2j's cumulative retired carry
# and its (2b) re-admission branch). A path is COMPLETED only on verified absence: not in the worktree (stat) AND not
# tracked by the intended commit (rh_gp_tracked from the probe). With ad = the accepted (= successor's predecessor) digest:
#   retired'     = NEW retirements only: newly obsolete outputs verified absent -> {output, reason, predecessor: ad}
#   obligations' = carried: still-present inherited obligations, IDENTICAL rows (origin != ad)
#                + opened : still-present newly obsolete -> {output, reason, origin: ad, state: pending}
#   completed'   = inherited obligations verified absent -> {output, reason, origin} (origin and reason KEPT)
#   pending      = the newly obsolete outputs with their reasons (the journal's resumable obligation set)
#   historical'  = r5p law (3): H(A) - readmitted (A.historical copied; A.retired / A.completed closed by ad); a row
#                  is NEVER dropped on revision -- only a readmission (current roster row, owned this generation) ends it
# History is NEVER re-emitted as a new removal (B not_inputs). An inherited obligation can never be re-admitted
# (refused at the plan: obligation kept).
# reasons: the resumed journal's pending row first (an intent removed between attempts never drops it), else the intent.
- name: "ENTRY GENERATION -- derive the successor's retired, obligation, completed and pending rows (generate)"
  vars:
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_gone: "{{ _rh_eg_obsl.results | rejectattr('stat.exists') | map(attribute='item') | reject('in', rh_gp_tracked) | list }}"
    _rh_eg_succ: >-
      {%- set R = _rh_eg_R -%}{%- set ad = rh_eg_rec.accepted_file_sha256 -%}
      {%- set jp = (rh_eg_rec.in_progress[R.in_progress_roles.pending] if rh_eg_rec.journal == 'resume' else []) -%}
      {%- set ns = namespace(ret=[], obl=[], cmp=[], pend=[]) -%}
      {%- for ob in (rh_eg_rec.accepted[R.roles.obligations] if rh_eg_rec.accepted_present else []) -%}
      {%- if ob[R.obligation_roles.output] in _rh_eg_gone -%}
      {%- set ns.cmp = ns.cmp + [{R.completed_roles.output: ob[R.obligation_roles.output], R.completed_roles.reason: ob[R.obligation_roles.reason],
                                  R.completed_roles.origin: ob[R.obligation_roles.origin]}] -%}
      {%- else -%}{%- set ns.obl = ns.obl + [ob] -%}{%- endif -%}
      {%- endfor -%}
      {%- for o in rh_eg_plan.obsolete_rel -%}
      {%- set jr = jp | selectattr(R.pending_roles.output, 'equalto', o) | map(attribute=R.pending_roles.reason) | list -%}
      {%- set ir = _rh_eg_p.retire | selectattr(_rh_eg_p.retire_roles.output, 'equalto', o) | map(attribute=_rh_eg_p.retire_roles.reason) | list -%}
      {%- set why = (jr + ir) | first -%}
      {%- set ns.pend = ns.pend + [{R.pending_roles.output: o, R.pending_roles.reason: why, R.pending_roles.state: R.locations.pending_state}] -%}
      {%- if o in _rh_eg_gone -%}
      {%- set ns.ret = ns.ret + [{R.retired_roles.output: o, R.retired_roles.reason: why, R.retired_roles.predecessor: ad}] -%}
      {%- else -%}
      {%- set ns.obl = ns.obl + [{R.obligation_roles.output: o, R.obligation_roles.reason: why, R.obligation_roles.origin: ad,
                                  R.obligation_roles.state: R.locations.pending_state}] -%}
      {%- endif -%}
      {%- endfor -%}
      {#- r5p law (3): historical' = H(A) - readmitted; A.historical copied; A.retired {origin: row.predecessor,
          closed_by: ad}; A.completed {origin: row.origin, closed_by: ad}; readmitted = output in the current roster -#}
      {%- set HO = R.historical_roles -%}
      {%- set hs = namespace(v=[]) -%}
      {%- if rh_eg_rec.accepted_present -%}
      {%- set A = rh_eg_rec.accepted -%}
      {%- set hs.v = A[R.roles.historical] | list -%}
      {%- for row in A[R.roles.retired] -%}{%- set hs.v = hs.v + [{HO.output: row[R.retired_roles.output], HO.origin: row[R.retired_roles.predecessor], HO.closed_by: ad}] -%}{%- endfor -%}
      {%- for row in A[R.roles.completed] -%}{%- set hs.v = hs.v + [{HO.output: row[R.completed_roles.output], HO.origin: row[R.completed_roles.origin], HO.closed_by: ad}] -%}{%- endfor -%}
      {%- endif -%}
      {{ {'retired': ns.ret, 'obligations': ns.obl, 'completed': ns.cmp, 'pending': ns.pend,
          'historical': hs.v | rejectattr(HO.output, 'in', rh_eg_plan.outputs_rel) | list} }}
  ansible.builtin.set_fact:
    rh_eg_succ: "{{ _rh_eg_succ }}"
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

# r2k R2J-RECORD-SCHEMA-JOIN -- SHAPE PREFLIGHT BEFORE ANY JOURNAL OR MIRROR WRITE. The journal document and the record
# PRE-IMAGE (every role known before the render) are bound HERE and are the exact values written later (journal: as is;
# record: pre-image combined with the post-render roles generation / outputs / owned and nothing else). An incompatible
# shape -- a key set other than in_progress_roles / roles values, a row other than its row-role key set, or partitions
# that are not pairwise disjoint (B r5o :622) -- refuses UNBOUND before the journal or any staged byte exists.
- name: "ENTRY GENERATION -- bind the journal document and the proposed record pre-image (generate; no write)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_IR: "{{ lme_resolved.remote_harness.entry_generation.records.in_progress_roles }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_inputs: "{{ dict(rh_eg_plan.render_inputs_rel | zip(rh_eg_plan.render_inputs_rel | map('extract', _rh_eg_rsum))) }}"
    _rh_eg_pred: >-
      {{ rh_eg_rec.accepted_file_sha256 if rh_eg_rec.accepted_present else lme_resolved.remote_harness.entry_generation.records.predecessor_genesis }}
  ansible.builtin.set_fact:
    rh_eg_succ: >-
      {{ rh_eg_succ | combine({
           'journal_doc': {_rh_eg_IR.source_edition: rh_eg_edition,
                           _rh_eg_IR.revision: rh_config_revision,
                           _rh_eg_IR.inputs: _rh_eg_inputs,
                           _rh_eg_IR.roster: lme_resolved.remote_harness.entry_generation.roster_source_sha256,
                           _rh_eg_IR.predecessor: _rh_eg_pred,
                           _rh_eg_IR.pending: rh_eg_succ.pending,
                           _rh_eg_IR.obligations: rh_eg_rec.accepted[_rh_eg_R.roles.obligations] if rh_eg_rec.accepted_present else [],
                           _rh_eg_IR.staged: rh_eg_plan.outputs_rel,
                           _rh_eg_IR.adoption: rh_eg_adopt.record_value},
           'record_pre': {_rh_eg_R.roles.source_edition: rh_eg_edition,
                          _rh_eg_R.roles.revision: rh_config_revision,
                          _rh_eg_R.roles.inputs: _rh_eg_inputs,
                          _rh_eg_R.roles.roster: lme_resolved.remote_harness.entry_generation.roster_source_sha256,
                          _rh_eg_R.roles.retired: rh_eg_succ.retired,
                          _rh_eg_R.roles.obligations: rh_eg_succ.obligations,
                          _rh_eg_R.roles.completed: rh_eg_succ.completed,
                          _rh_eg_R.roles.historical: rh_eg_succ.historical,
                          _rh_eg_R.roles.predecessor: _rh_eg_pred,
                          _rh_eg_R.roles.adoption: rh_eg_adopt.record_value},
           'record_post_roles': [_rh_eg_R.roles.generation, _rh_eg_R.roles.outputs, _rh_eg_R.roles.owned]}) }}
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

- name: "ENTRY GENERATION -- refuse an incompatible journal or record shape BEFORE any journal / mirror write (UNBOUND)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_pre: "{{ rh_eg_succ.record_pre }}"
    _rh_eg_rows_ok: >-
      {%- set R = _rh_eg_R -%}{%- set ok = namespace(v=true) -%}
      {%- for rows, role in [[rh_eg_succ.retired, R.retired_roles], [rh_eg_succ.obligations, R.obligation_roles],
                              [rh_eg_succ.completed, R.completed_roles], [rh_eg_succ.pending, R.pending_roles],
                              [rh_eg_succ.historical, R.historical_roles]] -%}
      {%- for row in rows -%}{%- if not (row is mapping and (row.keys() | list | sort) == (role.values() | list | sort)) -%}{%- set ok.v = false -%}{%- endif -%}{%- endfor -%}
      {%- endfor -%}{{ ok.v }}
    _rh_eg_paths: >-
      {{ rh_eg_plan.outputs_rel
         + (rh_eg_succ.retired | map(attribute=_rh_eg_R.retired_roles.output) | list)
         + (rh_eg_succ.obligations | map(attribute=_rh_eg_R.obligation_roles.output) | list)
         + (rh_eg_succ.completed | map(attribute=_rh_eg_R.completed_roles.output) | list)
         + (rh_eg_succ.historical | map(attribute=_rh_eg_R.historical_roles.output) | list) }}
  ansible.builtin.assert:
    that:
      - (rh_eg_succ.journal_doc.keys() | list | sort) == (_rh_eg_R.in_progress_roles.values() | list | sort)
      - rh_eg_succ.record_post_roles | intersect(_rh_eg_pre.keys() | list) | length == 0
      - ((_rh_eg_pre.keys() | list) + rh_eg_succ.record_post_roles) | sort == (_rh_eg_R.roles.values() | list | sort)
      - _rh_eg_rows_ok | bool
      - _rh_eg_paths | unique(case_sensitive=true) | list | length == _rh_eg_paths | length
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ [rh_eg_succ.journal_doc.keys() | list | sort, _rh_eg_pre.keys() | list | sort, rh_eg_succ.record_post_roles,
          _rh_eg_R.roles.values() | list | sort, _rh_eg_paths] | to_json }}
    quiet: true
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

# ---- IN-PROGRESS RECORD (generate only): written BEFORE any staged write, at the declared work-root location; a
# resumed record keeps its pending retirements (union with the current intents). Parent admitted at the use boundary.
- name: "ENTRY GENERATION -- admit the in-progress record's sub-root by the ONE ancestry rule (generate)"
  ansible.builtin.include_tasks: "{{ rh.controller.entry_generation.ancestry_include }}"
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_eg_plan.in_progress_abs | dirname | dirname }}"
    rh_anc_refusal: "{{ rh.controller.entry_generation.refusals.records_write }}"
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

- name: "ENTRY GENERATION -- create the in-progress record's directory (declared mode; generate)"
  ansible.builtin.file:
    path: "{{ rh_eg_plan.in_progress_abs | dirname }}"
    state: directory
    mode: "{{ lme_resolved.remote_harness.entry_generation.records.locations.dir_mode }}"
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

- name: "ENTRY GENERATION -- admit the in-progress record's directory (use boundary; generate)"
  ansible.builtin.include_tasks: "{{ rh.controller.entry_generation.ancestry_include }}"
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_eg_plan.in_progress_abs | dirname }}"
    rh_anc_refusal: "{{ rh.controller.entry_generation.refusals.records_write }}"
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate

# The journal (structured YAML, B locations.serialise; keys = in_progress_roles values): the predecessor it starts from
# (accepted file digest, or the genesis marker), the INTENDED inputs (source_edition, render-input mapping, revision), the
# roster digest, the pending rows of this transition and the predecessor's obligations (independent of current intents),
# and the staged output set. A resumed journal's pending rows are carried by rh_eg_succ.pending (journal reason first);
# under rebind the intended inputs are rewritten, never the obligations. Overwriting a SATISFIED journal is its clearing.
- name: "ENTRY GENERATION -- write the journal BEFORE any staged write (generate; obligations carried)"
  vars:
    _rh_eg_L: "{{ lme_resolved.remote_harness.entry_generation.records.locations }}"
  ansible.builtin.copy:
    dest: "{{ rh_eg_plan.in_progress_abs }}"
    mode: "{{ _rh_eg_L.file_mode }}"
    follow: false
    force: true
    backup: false
    content: >-
      {{ rh_eg_succ.journal_doc
         | to_nice_yaml(indent=rh.controller.entry_generation.records_write.indent, sort_keys=_rh_eg_L.serialise.sort_keys,
                        width=rh.controller.entry_generation.records_write.width) }}
  # GEN-AUTHORED-TO-GENERATED-ADOPTION: a REPEATED adoption stages no successor (verify-or-refuse), so it writes no journal
  when:
    - rh_eg_op == rh.controller.entry_generation.operation.modes.generate
    - rh_eg_adopt.mode != lme_resolved.remote_harness.entry_generation.adoption.modes.repeat

# ---- MIRROR (first staged write) -----------------------------------------------------------------------------------
- name: "ENTRY GENERATION -- derive the mirror parent (genesis stage root, or the seed dispatch tmp)"
  vars:
    _rh_eg_l: "{{ rh.controller.bootstrap.genesis.launch }}"
    _rh_eg_wr: "{{ rh.controller.bootstrap.work_roots }}"
    _rh_eg_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    _rh_eg_stage: >-
      {{ _rh_eg_l.stages | dict2items | selectattr('value.playbook_rel', 'equalto', rh.controller.bootstrap.package_playbook_rel)
         | map(attribute='key') | list }}
  ansible.builtin.set_fact:
    rh_eg_mirror_parent: >-
      {{ lookup('ansible.builtin.env', rh_eg_ctx[rh.controller.entry_generation.contexts.mirror_env_field])
         if rh.controller.entry_generation.contexts.mirror_env_field in rh_eg_ctx
         else ([rh_repo_root, _rh_eg_wr.root_rel, _rh_eg_wr.sub_roots[_rh_eg_l.stage_root.sub], _rh_eg_l.stage_root.rel,
                (_rh_eg_stage | first), lookup('ansible.builtin.vars', _rh_eg_l.stage_root.act.var)] | join(_rh_eg_sep)) }}
  when: rh.controller.entry_generation.contexts.mirror_env_field in rh_eg_ctx or _rh_eg_stage | length == 1

- name: "ENTRY GENERATION -- refuse an underived or malformed mirror parent"
  ansible.builtin.assert:
    that:
      - rh_eg_mirror_parent is defined
      - rh_eg_mirror_parent is string
      - rh_eg_mirror_parent is match(rh.controller.bootstrap.path_admission.regex)
      - rh_eg_mirror_parent is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.staging }}:
      {{ rh.controller.entry_generation.messages.staging }}
      {{ [rh_eg_ctx[rh.controller.entry_generation.contexts.name_field], rh.controller.bootstrap.genesis.launch.stages] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- admit the mirror's parent by the ONE resolved ancestry rule (at the use boundary)"
  ansible.builtin.include_tasks: "{{ rh.controller.entry_generation.ancestry_include }}"
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_eg_mirror_parent }}"
    rh_anc_refusal: "{{ rh.controller.entry_generation.refusals.staging }}"

- name: "ENTRY GENERATION -- reserve the owned staged mirror (mkdtemp 0700 under the admitted parent)"
  ansible.builtin.tempfile:
    state: directory
    path: "{{ rh_eg_mirror_parent }}"
    prefix: "{{ rh.controller.entry_generation.staging.prefix }}"
  register: _rh_eg_mirror

# r2l R2K-UNCHANGED-MIRROR-DIRS (codex-tick473): only the OUTPUTS' directories are created here. The record staging
# directories (accepted_rel / retained_rel parents) are created ONLY when a successor record is staged -- after the
# unchanged classification, by the task right before the record writes -- so an unchanged apply's mirror holds exactly
# the outputs and their parents and the exact mirror check stays exact (no allowance for unused directories).
- name: "ENTRY GENERATION -- create each output's directory inside the mirror (declared mode)"
  ansible.builtin.file:
    path: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    state: directory
    mode: "{{ rh.controller.entry_generation.staging.dir_mode }}"
  loop: >-
    {{ rh_eg_plan.outputs_rel | map('dirname') | reject('equalto', '') | unique(case_sensitive=true) | sort(case_sensitive=true) }}

# ---- SHARED-MEMBER INCLUDE RESOLUTION (r2k; codex-tick458 critical_join C1-S9-SHARED-MACRO-REACH option (i)) --------
# The file the renderer OPENS for `import <name>` (name = lme_entry_context.refusal_grammar.macros_rel) must be the exact
# admitted shared member. Read from the INSTALLED sources of the admitted core (2.19.11, /usr/lib/python3/dist-packages;
# not executed), the jinja FileSystemLoader search list is BUILT, not configured:
#   template action (action/template.py:105-115, :138): ansible_search_path + [loader basedir, dirname(src)], each entry
#     expanded to [entry/templates, entry]; ansible_search_path = task.get_search_path() (+ basedir) set by
#     task_executor.py:184-188 AFTER extra vars (not pinnable). The extend at :107 mutates the SHARED job-var list
#     (task_executor.py:588 vars_copy is shallow), so inside one looped task item i also searches the [basedir, src_dir]
#     pairs of items 0..i-1 BEFORE its own src dir -- the construction below models that accumulation exactly.
#   template lookup (lookup/template.py:143-154): [dirname(lookupfile)] + ansible_search_path expanded the same way.
# The first existing candidate wins (jinja FileSystemLoader; it follows links). Admission therefore requires, per row
# and per declared lookup consumer: the name is an admitted relative path; EVERY earlier candidate is ABSENT; the first
# existing candidate is the admitted member path itself (realpath-equal, regular, not a link), the member is a render
# input (git-admitted, digested before and after the render, inside the generation digest) and its bytes are the
# admitted digest. A core without a declared construction refuses (no ambient fallback). The candidates are stat'ed
# again after the render (a candidate appearing mid-render refuses).
# r2l R2K-RENDERER-IDENTITY (codex-tick473): by_core is keyed by the EXACT core version whose installed sources were
# read ('2.19.11', C1-R2L-INCLUDE-RESOLUTION), the same exact value as rh.controller.expect_core, so the membership
# test below keeps exact version qualification (r2k's '2.19' key refused the supported 2.19.11 leg). 2.17 stays
# unqualified and absent (R2K-DEP-TOOLCHAIN-217): no substitution. Every unique over names / candidate paths here (and
# in this file) is case_sensitive=true -- Ansible's unique passes bool(None) == False to Jinja's do_unique, which
# folds case by default (installed mathstuff.py :48-59, jinja2 3.1.6 sync_do_unique): case folding never establishes
# a shared import identity, and a case-variant candidate is never dropped from the stat loop.
- name: "ENTRY GENERATION -- refuse a core without a declared include-resolution construction, or an undeclared shared member (no fallback)"
  vars:
    _rh_eg_ir: "{{ rh.controller.entry_generation.render.include_resolution }}"
    # brr-follow-s2 J-RNP-03: the ENTRY rows' one import name (the rendered rows' import names are derived from their
    # declared closure and shadow-checked with the same rule below: successor-06 OD-S2-RENDERED-INCLUDE)
    _rh_eg_names: "{{ lme_resolved.remote_harness.entry_generation.roster | rejectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel)
                      | map(attribute='bound') | map(attribute=rh.controller.entry_generation.template_vars.context)
                      | map(attribute=_rh_eg_ir.name_from[0]) | map(attribute=_rh_eg_ir.name_from[1]) | unique(case_sensitive=true) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_ir is mapping
      - _rh_eg_ir.by_core is mapping
      - rh.controller.expect_core in _rh_eg_ir.by_core
      - _rh_eg_names | length == 1
      - _rh_eg_names[0] is string and _rh_eg_names[0] is match(rh.controller.bootstrap.path_admission.regex)
      - _rh_eg_names[0] is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - _rh_eg_ir.member_rel in rh_eg_plan.render_inputs_rel
      - _rh_eg_ir.lookup_consumers is sequence and _rh_eg_ir.lookup_consumers is not string
      - _rh_eg_ir.lookup_consumers | reject('in', rh_eg_plan.render_inputs_rel) | list | length == 0
      - ansible_search_path is sequence and ansible_search_path is not string and ansible_search_path | length > 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.include_resolution }}:
      {{ rh.controller.entry_generation.messages.include_resolution }}
      {{ [rh.controller.expect_core, _rh_eg_names, _rh_eg_ir.member_rel] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- bind the include candidates of every render row and every lookup consumer (installed construction)"
  vars:
    _rh_eg_ir: "{{ rh.controller.entry_generation.render.include_resolution }}"
    _rh_eg_c: "{{ rh.controller.entry_generation.render.include_resolution.by_core[rh.controller.expect_core] }}"
    _rh_eg_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    _rh_eg_name: >-
      {{ (lme_resolved.remote_harness.entry_generation.roster | rejectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel)
          | first).bound[rh.controller.entry_generation.template_vars.context][_rh_eg_ir.name_from[0]][_rh_eg_ir.name_from[1]] }}
  ansible.builtin.set_fact:
    rh_eg_plan: >-
      {%- set S = _rh_eg_sep -%}{%- set N = S ~ _rh_eg_name -%}
      {%- set ns = namespace(acc=[], rows=[]) -%}
      {#- brr-follow-s2 J-RNP-03: the ENTRY rows (the template module's per-loop search-path accumulation is reproduced
          for the entry render loop, which iterates exactly these rows) -#}
      {%- for row in lme_resolved.remote_harness.entry_generation.roster | rejectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) -%}
      {#- action/template.py:106-107 (accumulating per loop item) then :111-115 -#}
      {%- set ns.acc = ns.acc + [playbook_dir, (rh_repo_root ~ S ~ row.template_rel) | dirname] -%}
      {%- set d = namespace(l=[]) -%}
      {%- for p in ansible_search_path + ns.acc -%}{%- set d.l = d.l + [p ~ S ~ _rh_eg_c.subdir ~ N, p ~ N] -%}{%- endfor -%}
      {%- set ns.rows = ns.rows + [{'consumer': row.template_rel, 'member_rel': _rh_eg_ir.member_rel, 'candidates': d.l}] -%}
      {%- endfor -%}
      {%- for lc in _rh_eg_ir.lookup_consumers -%}
      {#- lookup/template.py:144-154: dirname(lookupfile) FIRST, then the expanded search path -#}
      {%- set d = namespace(l=[((rh_repo_root ~ S ~ lc) | dirname) ~ N]) -%}
      {%- for p in ansible_search_path -%}{%- set d.l = d.l + [p ~ S ~ _rh_eg_c.subdir ~ N, p ~ N] -%}{%- endfor -%}
      {%- set ns.rows = ns.rows + [{'consumer': lc, 'member_rel': _rh_eg_ir.member_rel, 'candidates': d.l}] -%}
      {%- endfor -%}
      {#- brr-follow-s2 successor-06 OD-S2-RENDERED-INCLUDE: the RENDERED rows, through the SAME construction (their own
          render loop, so their own per-item accumulation). The import names are DERIVED from the declared rendered
          closure (view rendered_closure): every closure member that is not itself a rendered row's template, named
          relative to the rendered template's directory (the loader entry dirname(src) the template action adds); its
          first existing candidate must be that closure member (checked below with the entry rows' rule). No name is
          written here and no second resolver exists. -#}
      {%- set RR = lme_resolved.remote_harness.entry_generation.roster | selectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | list -%}
      {%- set RT = RR | map(attribute='template_rel') | list -%}
      {%- set rs = namespace(acc=[]) -%}
      {%- for row in RR -%}
      {%- set rs.acc = rs.acc + [playbook_dir, (rh_repo_root ~ S ~ row.template_rel) | dirname] -%}
      {%- set P = (row.template_rel | dirname) ~ S -%}
      {%- for m in lme_resolved.remote_harness.entry_generation.rendered_closure | reject('in', RT) | select('match', P | regex_escape) -%}
      {%- set RN = S ~ m[(P | length):] -%}
      {%- set d = namespace(l=[]) -%}
      {%- for p in ansible_search_path + rs.acc -%}{%- set d.l = d.l + [p ~ S ~ _rh_eg_c.subdir ~ RN, p ~ RN] -%}{%- endfor -%}
      {%- set ns.rows = ns.rows + [{'consumer': row.template_rel, 'member_rel': m, 'candidates': d.l}] -%}
      {%- endfor -%}
      {%- endfor -%}
      {{ rh_eg_plan | combine({'include_rows': ns.rows,
                               'include_member_abs': rh_repo_root ~ _rh_eg_sep ~ _rh_eg_ir.member_rel}) }}

- name: "ENTRY GENERATION -- stat every include candidate before the render (no link followed)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_plan.include_rows | map(attribute='candidates') | flatten | unique(case_sensitive=true) | list }}"
  register: _rh_eg_inc_pre

- name: "ENTRY GENERATION -- refuse a shadowed, missing, linked or other-bytes shared member (INCLUDE-RESOLUTION)"
  vars:
    _rh_eg_ir: "{{ rh.controller.entry_generation.render.include_resolution }}"
    _rh_eg_ex: "{{ dict(_rh_eg_inc_pre.results | map(attribute='item') | zip(_rh_eg_inc_pre.results | map(attribute='stat'))) }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_bad: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for r in rh_eg_plan.include_rows -%}
      {%- set hit = r.candidates | select('in', _rh_eg_ex | dict2items | selectattr('value.exists') | map(attribute='key') | list) | list -%}
      {#- successor-06: each row names its own admitted member (entry rows and lookup consumers: include_resolution
          member_rel, unchanged; rendered rows: their rendered-closure member) -#}
      {%- if hit | length == 0 or hit[0] != (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ r.member_rel)
             or (hit[0] | realpath) != hit[0]
             or _rh_eg_ex[hit[0]].islnk or not _rh_eg_ex[hit[0]].isreg
             or _rh_eg_ex[hit[0]].checksum != _rh_eg_rsum[r.member_rel] -%}
      {%- set ns.o = ns.o + [[r.consumer, r.member_rel, hit[:1]]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
    # successor-06 OD-S2-RENDERED-INCLUDE: every rendered-closure member that is not a rendered template must be
    # importable by name from some rendered row (named in an include row); a member outside every rendered template's
    # directory is an undeclared-shape dependency and refuses here, before any publication
    _rh_eg_uncov: >-
      {{ lme_resolved.remote_harness.entry_generation.rendered_closure
         | reject('in', lme_resolved.remote_harness.entry_generation.roster | selectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | map(attribute='template_rel') | list)
         | reject('in', rh_eg_plan.include_rows | map(attribute='member_rel') | list) | list }}
  ansible.builtin.assert:
    that:
      - _rh_eg_bad | length == 0
      - _rh_eg_uncov | length == 0
      - rh_eg_plan.include_rows | map(attribute='member_rel') | reject('in', rh_eg_plan.render_inputs_rel) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.include_resolution }}:
      {{ rh.controller.entry_generation.messages.include_resolution }}
      {{ [rh_eg_plan.include_member_abs, _rh_eg_bad, _rh_eg_uncov] | to_json }}
    quiet: true

# RENDER: the ordinary template module, the admitted toolchain, the declared render parameters, exactly the two declared
# template variables bound from the loader's VALIDATED projection. No record value (recorded digests, owned, retired)
# and no roster-authority value is a template input.
- name: "ENTRY GENERATION -- render each roster row into the mirror (the ONLY way an entry comes to exist)"
  ansible.builtin.template:
    src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.template_rel }}"
    dest: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.output_rel }}"
    mode: "{{ rh.controller.entry_generation.staging.file_mode }}"
    follow: false
    force: true
    backup: false
    trim_blocks: "{{ rh.controller.entry_generation.render.trim_blocks }}"
    lstrip_blocks: "{{ rh.controller.entry_generation.render.lstrip_blocks }}"
    newline_sequence: "{{ rh.controller.entry_generation.render.newline_sequence }}"
    output_encoding: "{{ rh.controller.entry_generation.render.output_encoding }}"
    block_start_string: "{{ rh.controller.entry_generation.render.block_start_string }}"
    block_end_string: "{{ rh.controller.entry_generation.render.block_end_string }}"
    variable_start_string: "{{ rh.controller.entry_generation.render.variable_start_string }}"
    variable_end_string: "{{ rh.controller.entry_generation.render.variable_end_string }}"
    comment_start_string: "{{ rh.controller.entry_generation.render.comment_start_string }}"
    comment_end_string: "{{ rh.controller.entry_generation.render.comment_end_string }}"
  vars:
    lme_entry_struct: "{{ _rh_eg_row.bound[rh.controller.entry_generation.template_vars.struct] }}"
    # R1 s8 C1-S8-EG-R2H: the projected context {refusal_grammar, path_separator}, BESIDE the raw decl (never merged)
    lme_entry_context: "{{ _rh_eg_row.bound[rh.controller.entry_generation.template_vars.context] }}"
    lme_entry_decl: >-
      {{ lookup('ansible.builtin.file',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.bound_checkout[rh.controller.entry_generation.template_vars.decl],
                rstrip=rh.controller.entry_generation.render.decl_rstrip) | from_yaml }}
  # brr-follow-s2 J-RNP-03: ENTRY rows here; the rendered rows are rendered by the next two tasks
  loop: "{{ lme_resolved.remote_harness.entry_generation.roster | rejectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | list }}"
  loop_control:
    loop_var: _rh_eg_row
    label: "{{ _rh_eg_row.id }}"

# brr-follow-s2 successor-08 (Codex580 J-S07-KIND-ADMISSION): the kind-definition map is checked BEFORE any use and
# before the render (rendered rows only): present and a mapping; every definition a mapping whose test is a string
# and whose excludes is a list of strings; every kind a rendered struct source declares is a defined word (an unknown
# kind refuses -- never reflected from a runtime type name). The admitted word set and test names are the registry's
# (F05 join J-S07-KIND-RANGE); conditions are evaluated in order, so a later one never reads an undefined map.
- name: "ENTRY GENERATION -- refuse a missing, unknown or malformed struct kind definition (rendered rows; before the render)"
  vars:
    _rh_eg_rr: "{{ lme_resolved.remote_harness.entry_generation.roster | selectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | list }}"
    _rh_eg_kt: "{{ rh.controller.entry_generation.struct_kind_tests }}"
    _rh_eg_kd: "{{ _rh_eg_rr | map(attribute='bound') | map(attribute=rh.controller.entry_generation.template_vars.struct) | map('dict2items') | flatten | map(attribute='value') | map(attribute='kind') | unique(case_sensitive=true) | list }}"
  ansible.builtin.assert:
    that:
      - rh.controller.entry_generation.struct_kind_tests is defined and rh.controller.entry_generation.struct_kind_tests is mapping
      - _rh_eg_kt | length > 0
      - _rh_eg_kt | dict2items | map(attribute='value') | reject('mapping') | list | length == 0
      - _rh_eg_kt | dict2items | map(attribute='value') | map(attribute='test') | reject('string') | list | length == 0
      - _rh_eg_kt | dict2items | map(attribute='value') | map(attribute='excludes') | reject('sequence') | list | length == 0
      - _rh_eg_kt | dict2items | map(attribute='value') | map(attribute='excludes') | select('string') | list | length == 0
      - _rh_eg_kt | dict2items | map(attribute='value') | map(attribute='excludes') | flatten | reject('string') | list | length == 0
      - _rh_eg_kd | reject('in', _rh_eg_kt | list) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.roster }}:
      {{ rh.controller.entry_generation.messages.struct_kind_definition }}
      {{ _rh_eg_kd | to_json }}
    quiet: true
  when: lme_resolved.remote_harness.entry_generation.rendered_rel | length > 0

# RENDERED ROWS (brr-follow-s2 J-RNP-03; F05-S4 roster-nonplaybook; codex-tick564 (2) "bind ACTUAL genesis runtime struct
# values, not role names"; successor-06 per render-interface-01 70c993c4 section 2): a rendered row's bound context
# carries K (the published view's rendered_context_binding.key; F05 J-RC-02) whose value R = genesis.entry.render.struct_roles (role -> struct
# key), and its bound struct S = genesis.entry.render.struct_sources (role -> {fact, path}; loader-admitted: keys == R
# keys, fact an exact registry reserved_outputs member). lme_entry_struct is built GENERICALLY: for every role,
# R[role] -> the value reached by walking lookup('vars', S[role].fact) along S[role].path. No role name, no manifest
# reload, no second runtime map (retires the disclosed role-literal binding, OD-S2-RNP03-STRUCT-SOURCE). Every source
# that does not resolve refuses BEFORE the render with the declared roster code and the declared struct_source text
# (successor-06 Codex576 J-RC-02 (1); nothing is defaulted): (a) the fact is not a play var at render time, (b) a path
# step does not resolve (the value reached so far is not a mapping holding the step), (c) the value reached is not of its declared kind.
# PROVENANCE: the loader admits the fact as an EXACT registry reserved_outputs member (F05 RC), and the play that
# includes this file (package.yml: its first task :63 is refuse_pinned_outputs.yml, this include :92) refuses any
# reserved_outputs name supplied from outside the play (extra-var or inventory) -- so a present fact was produced inside
# the play (a new includer must keep that guard first: seams.yml SC-S06-STRUCT-PROVENANCE). EXPECTED KIND (successor-07,
# Codex578; render-interface-02 s1): every struct source declares kind, a word of the loader's closed _rh_kind range
# (F05-admitted); (c) the walked value's kind, read through the ONE profile map entry_generation.struct_kind_tests,
# must equal it (a null value passes only a declared null kind) -- the same typed refusal, no per-role branch.
- name: "ENTRY GENERATION -- refuse a rendered row whose runtime struct source does not resolve (before the render)"
  vars:
    _rh_eg_rr: "{{ lme_resolved.remote_harness.entry_generation.roster | selectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | list }}"
    # [row id, role, fact, steps resolved (none = the fact is not a play var), declared path, declared kind, matching kind
    # words] of every struct source that is absent, does not walk its whole path, or whose walked value is not accepted by
    # EXACTLY ONE definition of the ONE map entry_generation.struct_kind_tests (a definition accepts a value when its test
    # does and none of its excluded tests do), that one being the declared kind. All definitions are evaluated and the
    # matches COUNTED (successor-08, Codex580): zero matches (an unsupported value) or more than one (ambiguous definitions)
    # refuses -- never a first match. A declared kind outside the map is refused earlier (S08-GE-01). No per-role branch.
    _rh_eg_unres: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- for r in _rh_eg_rr -%}{%- for s in r.bound[rh.controller.entry_generation.template_vars.struct] | dict2items -%}
      {%- set w = namespace(ok=(s.value.fact in vars), v=none, n=0, hits=[]) -%}
      {%- if w.ok -%}{%- set w.v = lookup('ansible.builtin.vars', s.value.fact) -%}{%- endif -%}
      {%- for k in s.value.path -%}{%- if w.ok and w.v is mapping and k in w.v -%}{%- set w.v = w.v[k] -%}{%- set w.n = w.n + 1 -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if w.ok -%}{%- for t in rh.controller.entry_generation.struct_kind_tests | dict2items -%}
      {%- set m = namespace(hit=([w.v] | select(t.value.test) | list | length == 1)) -%}
      {%- for x in t.value.excludes -%}{%- if [w.v] | select(x) | list | length > 0 -%}{%- set m.hit = false -%}{%- endif -%}{%- endfor -%}
      {%- if m.hit -%}{%- set w.hits = w.hits + [t.key] -%}{%- endif -%}
      {%- endfor -%}{%- endif -%}
      {%- if not w.ok or w.hits != [s.value.kind] -%}{%- set ns.bad = ns.bad + [[r.id, s.key, s.value.fact, (w.n if (s.value.fact in vars) else none), s.value.path, s.value.kind, w.hits]] -%}{%- endif -%}
      {%- endfor -%}{%- endfor -%}{{ ns.bad }}
  ansible.builtin.assert:
    that:
      - _rh_eg_unres | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.roster }}:
      {{ rh.controller.entry_generation.messages.struct_source }}
      {{ _rh_eg_unres | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- render each RENDERED row into the mirror with its runtime struct (genesis render; same render parameters)"
  ansible.builtin.template:
    src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.template_rel }}"
    dest: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.output_rel }}"
    mode: "{{ rh.controller.entry_generation.staging.file_mode }}"
    follow: false
    force: true
    backup: false
    trim_blocks: "{{ rh.controller.entry_generation.render.trim_blocks }}"
    lstrip_blocks: "{{ rh.controller.entry_generation.render.lstrip_blocks }}"
    newline_sequence: "{{ rh.controller.entry_generation.render.newline_sequence }}"
    output_encoding: "{{ rh.controller.entry_generation.render.output_encoding }}"
    block_start_string: "{{ rh.controller.entry_generation.render.block_start_string }}"
    block_end_string: "{{ rh.controller.entry_generation.render.block_end_string }}"
    variable_start_string: "{{ rh.controller.entry_generation.render.variable_start_string }}"
    variable_end_string: "{{ rh.controller.entry_generation.render.variable_end_string }}"
    comment_start_string: "{{ rh.controller.entry_generation.render.comment_start_string }}"
    comment_end_string: "{{ rh.controller.entry_generation.render.comment_end_string }}"
  vars:
    # successor-06 (render-interface-01 :2016-2018): {R[role]: walk(lookup('vars', S[role].fact), S[role].path)} for
    # every role of the row's own binding (R = bound context[K], S = bound struct); resolvability refused above
    lme_entry_struct: >-
      {%- set ns = namespace(m={}) -%}
      {%- for s in _rh_eg_row.bound[rh.controller.entry_generation.template_vars.struct] | dict2items -%}
      {%- set w = namespace(v=lookup('ansible.builtin.vars', s.value.fact)) -%}
      {%- for k in s.value.path -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
      {%- set ns.m = ns.m | combine({_rh_eg_row.bound[rh.controller.entry_generation.template_vars.context][lme_resolved.remote_harness.entry_generation.rendered_context_binding.key][s.key]: w.v}) -%}
      {%- endfor -%}{{ ns.m }}
    # the bound context, unchanged (never merged with the struct): the early context + K (render-interface-01 :2021);
    # the genesis templates read lme_entry_context[lme_entry_binding.key] (render-interface-02 s2)
    lme_entry_context: "{{ _rh_eg_row.bound[rh.controller.entry_generation.template_vars.context] }}"
    # brr-follow-s2 successor-07 J-FIN-PARENT-01 (render-interface-02 s2): the loader's PUBLISHED binding {key, value}, so
    # the templates read lme_entry_context[lme_entry_binding.key], never spell the key and never read lme_resolved (the
    # templates' free-variable proof); the rendered render task only (entry rows are unchanged)
    lme_entry_binding: "{{ lme_resolved.remote_harness.entry_generation.rendered_context_binding }}"
    lme_entry_decl: >-
      {{ lookup('ansible.builtin.file',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _rh_eg_row.bound_checkout[rh.controller.entry_generation.template_vars.decl],
                rstrip=rh.controller.entry_generation.render.decl_rstrip) | from_yaml }}
  loop: "{{ lme_resolved.remote_harness.entry_generation.roster | selectattr('output_rel', 'in', lme_resolved.remote_harness.entry_generation.rendered_rel) | list }}"
  loop_control:
    loop_var: _rh_eg_row
    label: "{{ _rh_eg_row.id }}"

- name: "ENTRY GENERATION -- stat every include candidate again after the render (no link followed)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_plan.include_rows | map(attribute='candidates') | flatten | unique(case_sensitive=true) | list }}"
  register: _rh_eg_inc_post

- name: "ENTRY GENERATION -- refuse an include candidate that changed during the render (INCLUDE-RESOLUTION)"
  ansible.builtin.assert:
    that:
      - _rh_eg_inc_post.results | map(attribute='item') | list == _rh_eg_inc_pre.results | map(attribute='item') | list
      - _rh_eg_inc_post.results | map(attribute='stat') | map(attribute='exists') | list
        == _rh_eg_inc_pre.results | map(attribute='stat') | map(attribute='exists') | list
      - _rh_eg_inc_post.results | map(attribute='stat') | selectattr('exists') | map(attribute='checksum') | list
        == _rh_eg_inc_pre.results | map(attribute='stat') | selectattr('exists') | map(attribute='checksum') | list
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.include_resolution }}:
      {{ rh.controller.entry_generation.messages.include_resolution }}
      {{ _rh_eg_inc_post.results | map(attribute='item') | zip(_rh_eg_inc_post.results | map(attribute='stat') | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- digest the staged outputs (no link followed)"
  ansible.builtin.stat:
    path: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_plan.outputs_rel }}"
  register: _rh_eg_staged

- name: "ENTRY GENERATION -- digest every admission input again after the render"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_eg_plan.admission_rel }}"
  register: _rh_eg_src_after

- name: "ENTRY GENERATION -- refuse an admission input that changed during the operation"
  vars:
    _rh_eg_changed: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for s in _rh_eg_src_after.results | map(attribute='stat') -%}
      {%- set b = _rh_eg_src.results[loop.index0].stat.checksum -%}
      {%- if not s.exists or s.islnk or not s.isreg or s.checksum != b -%}{%- set ns.o = ns.o + [[rh_eg_plan.admission_rel[loop.index0], b]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_eg_changed | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.source }}:
      {{ rh.controller.entry_generation.messages.source_changed }}
      {{ _rh_eg_changed | to_json }}
    quiet: true

# GENERATION DIGEST (r2k R2J-DIGEST-RECIPE-JOIN; B r5o generation_recipe :685-706, consumed as the C1 projection
# P.records.generation_recipe -- dependency R2K-DEP-RECIPE-PROJECTION): ONE construction (this single looped task) is
# applied to every subject -- [0] the FRESH render (render-input bindings + staged outputs; the producer in generate, the
# verifier's recomputation elsewhere) and [1] the ACCEPTED record's own roles.inputs / roles.outputs when present (the
# record reproduces its own digest). Members in the declared order (recipe.members -> role names); each block sorted by
# rel in ascending code-point order (recipe.order_within, joined to the route's declared order table -> Jinja sort
# case_sensitive true); line parts in recipe.line order through the route's part table; separator / terminator /
# algorithm read from the owners the recipe NAMES (joined below: a recipe naming another owner refuses); the text is a
# Python str hashed as UTF-8 by the hash filter (recipe.encoding joined to digest.encoding). Excluded by construction:
# the record file, its external digest, roles.generation, roles.predecessor, every other record.
- name: "ENTRY GENERATION -- refuse a generation recipe the route cannot join (owners / order / parts / encoding; UNBOUND)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_gr: "{{ lme_resolved.remote_harness.entry_generation.records.generation_recipe }}"
    _rh_eg_dg: "{{ rh.controller.entry_generation.digest }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_gr is mapping
      - _rh_eg_gr.members | map('regex_replace', '^' ~ (_rh_eg_dg.recipe.member_prefix | regex_escape), '') | reject('in', _rh_eg_R.roles) | list | length == 0
      - _rh_eg_gr.members | reject('match', '^' ~ (_rh_eg_dg.recipe.member_prefix | regex_escape)) | list | length == 0
      - _rh_eg_gr.order_within in _rh_eg_dg.recipe.orders
      - (_rh_eg_gr.line | sort) == (_rh_eg_dg.recipe.parts.keys() | list | sort)
      - _rh_eg_gr.separator_from == _rh_eg_dg.recipe.owners.separator
      - _rh_eg_gr.terminator_from == _rh_eg_dg.recipe.owners.terminator
      - _rh_eg_gr.algorithm_from == _rh_eg_dg.recipe.owners.algorithm
      - _rh_eg_gr.encoding == _rh_eg_dg.encoding
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ [_rh_eg_gr, _rh_eg_dg.recipe] | to_json }}
    quiet: true

- name: "ENTRY GENERATION -- compute the generation digest by the ONE recipe (fresh render; accepted record when present)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_gr: "{{ lme_resolved.remote_harness.entry_generation.records.generation_recipe }}"
    _rh_eg_dg: "{{ rh.controller.entry_generation.digest }}"
    _rh_eg_cf: "{{ rh.controller.bootstrap.bundle.checksum_format }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_fresh: >-
      {{ {_rh_eg_R.roles.inputs: dict(rh_eg_plan.render_inputs_rel | zip(rh_eg_plan.render_inputs_rel | map('extract', _rh_eg_rsum))),
          _rh_eg_R.roles.outputs: dict(rh_eg_plan.outputs_rel | zip(_rh_eg_staged.results | map(attribute='stat') | map(attribute='checksum')))} }}
  ansible.builtin.set_fact:
    _rh_eg_gd: >-
      {%- set P = _rh_eg_dg.recipe.parts -%}{%- set ns = namespace(l='') -%}
      {%- for m in _rh_eg_gr.members -%}
      {%- set block = item[m | regex_replace('^' ~ (_rh_eg_dg.recipe.member_prefix | regex_escape), '') | extract(_rh_eg_R.roles)] -%}
      {%- for rel in block.keys() | list | sort(case_sensitive=_rh_eg_dg.recipe.orders[_rh_eg_gr.order_within].case_sensitive) -%}
      {%- set v = {P.sha256: block[rel], P.separator: _rh_eg_cf.separator, P.rel: rel, P.terminator: _rh_eg_dg.terminator} -%}
      {%- for part in _rh_eg_gr.line -%}{%- set ns.l = ns.l ~ v[P[part]] -%}{%- endfor -%}
      {%- endfor -%}
      {%- endfor -%}{{ ns.l | hash(_rh_eg_dg.algorithm) }}
  loop: "{{ [_rh_eg_fresh] + ([rh_eg_rec.accepted] if rh_eg_rec.accepted_present else []) }}"
  loop_control:
    index_var: _rh_eg_gi
    label: "{{ _rh_eg_gi }}"
  register: _rh_eg_gdr

# r2k: the accepted record must REPRODUCE its own generation digest from its own roles.inputs / roles.outputs by the
# same recipe (subject [1]); every operation, whenever an accepted record is present.
- name: "ENTRY GENERATION -- refuse an accepted record whose generation role is not its own recipe digest (UNBOUND)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_gdr.results | length == 2
      - _rh_eg_gdr.results[1].ansible_facts._rh_eg_gd == rh_eg_rec.accepted[_rh_eg_R.roles.generation]
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ [_rh_eg_gdr.results[1].ansible_facts._rh_eg_gd, rh_eg_rec.accepted[_rh_eg_R.roles.generation]] | to_json }}
    quiet: true
  when: rh_eg_rec.accepted_present

# EVIDENCE: field names are the declared evidence.fields (ordered); generation = subject [0] of the recipe task.
# DOMAINS (r2k R2J-DIGEST-RECIPE-JOIN; B r5o diagnostic_domains :707-712): the record / journal `inputs` role is the
# MAPPING render-input rel -> sha256 (render inputs only). The evidence field admission_pairs (renamed from r2j
# admission_inputs; C1-R2K-EVIDENCE-PAIRS) is B's ordered LIST of [admission_rel, sha256] pairs in admission order --
# diagnostic only, never compared with nor substituted for roles.inputs. The stale gate reads the render-input
# bindings from the admission digests directly, not from the diagnostic.
- name: "ENTRY GENERATION -- record the generation evidence (derived output)"
  vars:
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    _rh_eg_pairs: "{{ rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum')) | map('list') | list }}"
  ansible.builtin.set_fact:
    rh_eg_evidence: >-
      {{ dict(_rh_eg_d.evidence.fields | zip([
           rh_eg_op,
           rh_eg_ctx[_rh_eg_d.contexts.name_field],
           rh_config_revision,
           lme_resolved.remote_harness.entry_generation.structural_inputs_sha256,
           _rh_eg_gdr.results[0].ansible_facts._rh_eg_gd,
           rh_eg_edition,
           lme_resolved.remote_harness.entry_generation.roster_source_rel,
           _rh_eg_rsum[lme_resolved.remote_harness.entry_generation.roster_source_rel],
           _rh_eg_pairs,
           dict(rh_eg_plan.outputs_rel | zip(_rh_eg_staged.results | map(attribute='stat') | map(attribute='checksum'))),
           (dict(rh_eg_plan.outputs_rel | zip(_rh_eg_obs.results[3:] | map(attribute='stat') | map(attribute='checksum')))
            if rh_eg_op != _rh_eg_d.operation.modes.generate else {}),
           rh_eg_rec.accepted_file_sha256,
           rh_eg_plan.admission_rel + rh_eg_plan.outputs_rel])) }}

- name: "ENTRY GENERATION -- refuse an evidence record that is not exactly the declared field set"
  ansible.builtin.assert:
    that:
      - (rh_eg_evidence.keys() | list | length) == (rh.controller.entry_generation.evidence.fields | length)
    fail_msg: >-
      REFUSED {{ rh.controller.entry_generation.refusals.roster }}:
      {{ rh.controller.entry_generation.messages.evidence }}
      {{ rh.controller.entry_generation.evidence.fields | to_json }}
    quiet: true

# UNCHANGED APPLY (r2k r5p X-R2-R5P-HIST "an unchanged apply writes no successor"; R2K-UNCHANGED-APPLY): generate over
# an accepted record A is UNCHANGED exactly when the fresh generation digest, revision, roster and render-input
# mapping equal A's AND the transition opens, retires, completes and readmits nothing (successor
# obligations == A.obligations, retired' == completed' == [], readmitted_rel == []). Then NO record is staged (neither
# the proposed accepted nor the retained predecessor), the mirror holds the roster outputs only, and generate clears
# the journal IT wrote this run (predecessor == A, no pending row, obligations == A's: nothing it carries is lost).
# A's own retired / completed rows stay in A and stay absence-checked at every operation (HISTORICAL ABSENCE above).
# source_edition is deliberately NOT compared: accepting A means committing the mirror, which moves HEAD past
# A.source_edition, so an edition-sensitive predicate would manufacture a successor on every later generate (B r5p
# :686-687 "the accepted generation identity is preserved"; the stale gate does not compare it either). Filed to B as
# R2K-UNCHANGED-APPLY (edition-only change = unchanged).
- name: "ENTRY GENERATION -- classify an unchanged apply (generate; no manufactured generation)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_pre: "{{ rh_eg_succ.record_pre if rh_eg_op == rh.controller.entry_generation.operation.modes.generate else {} }}"
  ansible.builtin.set_fact:
    rh_eg_unchanged: >-
      {{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate and rh_eg_rec.accepted_present
         and _rh_eg_gdr.results[0].ansible_facts._rh_eg_gd == rh_eg_rec.accepted[_rh_eg_R.roles.generation]
         and _rh_eg_pre[_rh_eg_R.roles.revision] == rh_eg_rec.accepted[_rh_eg_R.roles.revision]
         and _rh_eg_pre[_rh_eg_R.roles.roster] == rh_eg_rec.accepted[_rh_eg_R.roles.roster]
         and _rh_eg_pre[_rh_eg_R.roles.inputs] == rh_eg_rec.accepted[_rh_eg_R.roles.inputs]
         and rh_eg_succ.obligations == rh_eg_rec.accepted[_rh_eg_R.roles.obligations]
         and (rh_eg_succ.retired | length) == 0 and (rh_eg_succ.completed | length) == 0
         and (rh_eg_plan.readmitted_rel | length) == 0 }}

# GEN-AUTHORED-TO-GENERATED-ADOPTION: a REPEATED adoption (adopt over the first adopted record; identity checked before any
# write) passes ONLY as an unchanged apply of that exact transition -- it never stages a record, so it can never reset the
# lineage or manufacture a new first generation.
- name: "ENTRY GENERATION -- refuse a repeated adoption that is not the exact unchanged transition (ADOPTION-REPEAT)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
  ansible.builtin.assert:
    that:
      - rh_eg_unchanged | bool
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.adoption_repeat }}:
      {{ _rh_eg_R.texts.adoption_repeat }}
      {{ [rh_eg_adopt.sha256, rh_eg_rec.accepted_file_sha256, rh_eg_unchanged] | to_json }}
    quiet: true
  when: rh_eg_adopt.mode == lme_resolved.remote_harness.entry_generation.adoption.modes.repeat

# r2l R2K-UNCHANGED-MIRROR-DIRS: the record staging directories exist only for a STAGED successor (generate, not
# unchanged): the proposed accepted record's parent, and the retained predecessor's parent when a predecessor exists --
# exactly the record paths the mirror check then expects.
- name: "ENTRY GENERATION -- create the record staging directories (generate; only when a successor record is staged)"
  ansible.builtin.file:
    path: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    state: directory
    mode: "{{ rh.controller.entry_generation.staging.dir_mode }}"
  loop: >-
    {{ ([rh_eg_plan.accepted_rel] + ([rh_eg_plan.retained_rel] if rh_eg_rec.accepted_present else []))
       | map('dirname') | reject('equalto', '') | unique(case_sensitive=true) | sort(case_sensitive=true) }}
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate and not rh_eg_unchanged

# PROPOSED RECORDS (generate): the new accepted record INTO THE MIRROR at accepted_rel (structured YAML; keys = roles
# values), and the current accepted record (if any) INTO THE MIRROR at retained_rel. Body = the preflight-checked
# pre-image rh_eg_succ.record_pre (retired / obligations / completed from the partition above; predecessor = the accepted
# file digest or the declared genesis marker) + exactly the post-render roles.
- name: "ENTRY GENERATION -- write the proposed accepted record into the mirror (generate; never the checkout)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_L: "{{ lme_resolved.remote_harness.entry_generation.records.locations }}"
    _rh_eg_staged_map: "{{ dict(rh_eg_plan.outputs_rel | zip(_rh_eg_staged.results | map(attribute='stat') | map(attribute='checksum'))) }}"
    # owned rows: keys = owned_roles values (B r5m owned_row_from)
    _rh_eg_owned_rows: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for o in rh_eg_plan.outputs_rel -%}
      {%- set ns.o = ns.o + [{_rh_eg_R.owned_roles.output: o, _rh_eg_R.owned_roles.sha256: _rh_eg_staged_map[o]}] -%}
      {%- endfor -%}{{ ns.o }}
    # r2k: the preflight-checked pre-image + EXACTLY the post-render roles (rh_eg_succ.record_post_roles), nothing else
    _rh_eg_body: >-
      {{ rh_eg_succ.record_pre | combine(dict(rh_eg_succ.record_post_roles | zip([
           rh_eg_evidence[rh.controller.entry_generation.evidence.generation_field],
           _rh_eg_staged_map,
           _rh_eg_owned_rows]))) }}
  ansible.builtin.copy:
    dest: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.accepted_rel }}"
    mode: "{{ rh.controller.entry_generation.staging.file_mode }}"
    follow: false
    force: true
    backup: false
    content: >-
      {{ _rh_eg_body | to_nice_yaml(indent=rh.controller.entry_generation.records_write.indent, sort_keys=_rh_eg_L.serialise.sort_keys,
                                    width=rh.controller.entry_generation.records_write.width) }}
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate and not rh_eg_unchanged

# The CURRENT accepted record (bytes as committed, already admitted by commit membership above) becomes the proposed
# retained predecessor: the only witness of the owned set is carried forward, never erased; the committed copy stays
# untouched until the author's reviewed commit promotes the mirror.
- name: "ENTRY GENERATION -- carry the admitted accepted record into the mirror as the retained predecessor (generate)"
  ansible.builtin.copy:
    src: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.accepted_rel }}"
    dest: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ rh_eg_plan.retained_rel }}"
    remote_src: true
    mode: "{{ rh.controller.entry_generation.staging.file_mode }}"
    follow: false
    force: true
    backup: false
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate and rh_eg_rec.accepted_present and not rh_eg_unchanged

- name: "ENTRY GENERATION -- digest the staged retained predecessor and the proposed accepted record (no link followed)"
  ansible.builtin.stat:
    path: "{{ _rh_eg_mirror.path ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.entry_generation.digest.algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ [rh_eg_plan.accepted_rel] + ([rh_eg_plan.retained_rel] if rh_eg_rec.accepted_present else []) }}"
  register: _rh_eg_recstaged
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate and not rh_eg_unchanged

# the staged retained bytes ARE the admitted accepted bytes, and the proposal names exactly that file digest as its
# predecessor: the witness chain is carried, never re-derived or erased
- name: "ENTRY GENERATION -- refuse a staged predecessor that is not the admitted accepted record (generate)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_st: "{{ _rh_eg_recstaged.results | map(attribute='stat') | list }}"
    _rh_eg_new: "{{ lookup('ansible.builtin.file', _rh_eg_recstaged.results[0].stat.path) | from_yaml }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_st | selectattr('exists') | list | length == _rh_eg_st | length
      - _rh_eg_st | selectattr('islnk') | list | length == 0
      - (_rh_eg_new.keys() | list | sort) == (_rh_eg_R.roles.values() | list | sort)
      - _rh_eg_new[_rh_eg_R.roles.predecessor]
        == (rh_eg_rec.accepted_file_sha256 if rh_eg_rec.accepted_present else _rh_eg_R.predecessor_genesis)
      - not rh_eg_rec.accepted_present or _rh_eg_st[1].checksum == rh_eg_rec.accepted_file_sha256
    fail_msg: >-
      REFUSED {{ _rh_eg_R.refusals.unbound }}:
      {{ _rh_eg_R.texts.unbound }}
      {{ [rh_eg_plan.accepted_rel, rh_eg_plan.retained_rel, rh_eg_rec.accepted_file_sha256] | to_json }}
    quiet: true
  when: rh_eg_op == rh.controller.entry_generation.operation.modes.generate and not rh_eg_unchanged

# MIRROR EXACTNESS: the mirror holds exactly the roster outputs (+ in generate the proposed accepted record and, when a
# predecessor exists, the retained record); anything else is an EXTRA staged output (B TRANSFER-GENERATION-EXTRA-STAGED).
- name: "ENTRY GENERATION -- list the mirror (files and directories; no link followed)"
  ansible.builtin.find:
    paths: "{{ _rh_eg_mirror.path }}"
    recurse: true
    file_type: any
    hidden: true
    follow: false
  register: _rh_eg_list

- name: "ENTRY GENERATION -- refuse an extra staged file (EXTRA-STAGED) or a mirror that is not exactly the plan"
  vars:
    _rh_eg_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    _rh_eg_p: "{{ lme_resolved.remote_harness.entry_generation }}"
    # r2k r5p: an UNCHANGED apply stages no record (outputs only)
    _rh_eg_gen: "{{ rh_eg_op == rh.controller.entry_generation.operation.modes.generate and not rh_eg_unchanged }}"
    _rh_eg_want: >-
      {{ (rh_eg_plan.outputs_rel
          + ([rh_eg_plan.accepted_rel] if _rh_eg_gen else [])
          + ([rh_eg_plan.retained_rel] if (_rh_eg_gen and rh_eg_rec.accepted_present) else [])) | sort(case_sensitive=true) }}
    _rh_eg_rel: >-
      {{ _rh_eg_list.files | rejectattr('isdir') | map(attribute='path')
         | map('regex_replace', '^' ~ ((_rh_eg_mirror.path ~ _rh_eg_sep) | regex_escape), '') | sort(case_sensitive=true) }}
    _rh_eg_dirs: >-
      {{ _rh_eg_list.files | selectattr('isdir') | map(attribute='path')
         | map('regex_replace', '^' ~ ((_rh_eg_mirror.path ~ _rh_eg_sep) | regex_escape), '') | list }}
    _rh_eg_want_dirs: >-
      {%- set ns = namespace(d=[]) -%}
      {%- for o in _rh_eg_want -%}{%- set parts = o.split(_rh_eg_sep)[:-1] -%}
      {%- for i in range(1, (parts | length) + 1) -%}{%- set ns.d = ns.d + [parts[:i] | join(_rh_eg_sep)] -%}{%- endfor -%}
      {%- endfor -%}{{ ns.d | unique(case_sensitive=true) | list }}
    _rh_eg_extra: "{{ _rh_eg_rel | reject('in', _rh_eg_want) | list + (_rh_eg_dirs | reject('in', _rh_eg_want_dirs) | list) }}"
  ansible.builtin.assert:
    that:
      - _rh_eg_extra | length == 0
      - _rh_eg_rel == _rh_eg_want
      - _rh_eg_list.files | selectattr('islnk') | list | length == 0
      - _rh_eg_staged.results | map(attribute='stat') | map(attribute='mode') | reject('equalto', rh.controller.entry_generation.staging.file_mode) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_eg_p.ownership.refusals.extra_staged if _rh_eg_extra | length > 0 else rh.controller.entry_generation.refusals.staged }}:
      {{ _rh_eg_p.ownership.texts.extra_staged if _rh_eg_extra | length > 0 else rh.controller.entry_generation.messages.staged }}
      {{ [_rh_eg_mirror.path, _rh_eg_extra, _rh_eg_rel, _rh_eg_want] | to_json }}
    quiet: true

# STALE (verify / package / invoke): the fresh render of the admitted inputs must be the accepted record's outputs and
# its generation identity the accepted revision (no repair; mirror kept for inspection).
- name: "ENTRY GENERATION -- refuse a fresh render that is not the accepted record (gate: stale)"
  vars:
    _rh_eg_R: "{{ lme_resolved.remote_harness.entry_generation.records }}"
    _rh_eg_d: "{{ rh.controller.entry_generation }}"
    _rh_eg_rsum: "{{ dict(rh_eg_plan.admission_rel | zip(_rh_eg_src.results | map(attribute='stat') | map(attribute='checksum'))) }}"
  ansible.builtin.assert:
    that:
      - rh_eg_evidence[_rh_eg_d.evidence.staged_field] == rh_eg_rec.accepted[_rh_eg_R.roles.outputs]
      - rh_eg_evidence[_rh_eg_d.evidence.generation_field] == rh_eg_rec.accepted[_rh_eg_R.roles.generation]
      # changed generation input: the render-input bindings the accepted record names are today's admitted bytes
      # (r2k: read from the admission digests themselves, never from the admission_pairs diagnostic)
      - rh_eg_rec.accepted[_rh_eg_R.roles.inputs]
        == dict(rh_eg_plan.render_inputs_rel | zip(rh_eg_plan.render_inputs_rel | map('extract', _rh_eg_rsum)))
    fail_msg: >-
      REFUSED {{ _rh_eg_d.refusals.stale }}:
      {{ _rh_eg_d.messages.stale }}
      {{ [rh_eg_evidence[_rh_eg_d.evidence.generation_field], rh_eg_rec.accepted[_rh_eg_R.roles.generation]] | to_json }}
    quiet: true
  when: rh_eg_op != rh.controller.entry_generation.operation.modes.generate

# JOURNAL CLEARING (R2I-INTERRUPTED-OBLIGATIONS; B resume.clear_journal_after: verified_successor). Generate never
# removes a journal for a staged proposal (r2i's removal after staging is withdrawn): a staged proposal is not a
# successor -- the ONE generate-side exception is the unchanged-apply clear of its own same-run journal (next task).
# Otherwise it is removed ONLY here, in the genesis context, by verify / package, after EVERY gate above passed on the committed accepted record that
# SATISFIES it (journal == 'satisfied': successor of its predecessor, same intended inputs, every pending row and
# inherited obligation held as an obligation or a verified completion). The seed context never mutates it.
- name: "ENTRY GENERATION -- clear the journal its verified committed successor satisfies (genesis verify / package only)"
  ansible.builtin.file:
    path: "{{ rh_eg_plan.in_progress_abs }}"
    state: absent
  when:
    - rh_eg_op != rh.controller.entry_generation.operation.modes.generate
    - rh.controller.entry_generation.contexts.dispatch_field not in rh_eg_ctx
    - rh_eg_rec.journal == 'satisfied'

# r2k r5p R2K-UNCHANGED-APPLY: the ONLY generate-side journal removal -- the journal THIS run wrote (rh_eg_succ.journal_doc:
# predecessor == the accepted digest, no pending row, obligations == A's) after every gate above passed on an UNCHANGED
# apply; nothing it carries is lost because A already holds it. Genesis context only (the seed never mutates it).
- name: "ENTRY GENERATION -- clear this run's own journal after an unchanged apply (generate; genesis context only)"
  ansible.builtin.file:
    path: "{{ rh_eg_plan.in_progress_abs }}"
    state: absent
  when:
    - rh_eg_op == rh.controller.entry_generation.operation.modes.generate
    - rh.controller.entry_generation.contexts.dispatch_field not in rh_eg_ctx
    - rh_eg_unchanged
    - rh_eg_succ.journal_doc[lme_resolved.remote_harness.entry_generation.records.in_progress_roles.pending] | length == 0

- name: "ENTRY GENERATION -- report the evidence and the staged mirror"
  ansible.builtin.debug:
    msg: "{{ {rh.controller.entry_generation.evidence.report_key: rh_eg_evidence, rh.controller.entry_generation.staging.report_key: _rh_eg_mirror.path} }}"
