- name: Require already admitted private scratch directories for managed binary probes
  ansible.builtin.assert:
    that:
    - rh_ar_scratch is mapping
    - (rh_ar_scratch | list | sort) == (rh_ar_contract.scratch_fields | sort)
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.custody }}'
    quiet: true
- name: Observe probe scratch without creating or cleaning it
  ansible.builtin.stat:
    path: '{{ item.value }}'
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: '{{ rh_ar_scratch | dict2items }}'
  register: _rh_ar_scratch_stats
- name: Refuse missing foreign or linked probe scratch
  ansible.builtin.assert:
    that:
    - item.stat.exists and item.stat.isdir and not item.stat.islnk
    - item.stat.uid == (_rh_ar_uid.stdout | int)
    - item.stat.mode == rh_ar_contract.scratch_mode
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.custody }}'
    quiet: true
  loop: '{{ _rh_ar_scratch_stats.results }}'
- name: Bind cleared managed probe environment from explicit scratch and installed paths
  ansible.builtin.set_fact:
    _rh_ar_smoke_env: '{{ rh_ar_contract.smoke_environment | combine({"HOME": rh_ar_scratch.home, "ANSIBLE_HOME": rh_ar_scratch.home, "ANSIBLE_LOCAL_TEMP":
      rh_ar_scratch.local, "ANSIBLE_REMOTE_TMP": rh_ar_scratch.remote, "TMPDIR": rh_ar_scratch.tmp, "ANSIBLE_CONFIG": rh_ar_subject.expected_paths.ansible_config})
      }}'
- name: Run the observed python binary in the cleared declared environment
  ansible.builtin.command:
    argv: '{% set ns = namespace(args=[rh_ar_tools.env.path] + rh_ar_contract.env_clear_args) %}{% for key, value in _rh_ar_smoke_env.items()
      %}{% set ns.args = ns.args + [rh_ar_contract.env_pair_format.format(key=key, value=value)] %}{% endfor %}{{ ns.args + [rh_ar_subject.expected_paths.interpreter]
      + rh_ar_contract.smoke.python_args }}'
  register: _rh_ar_smoke_python
  changed_when: false
- name: Require independently declared python identity
  ansible.builtin.assert:
    that:
    - _rh_ar_smoke_python.stdout == rh_ar_contract.smoke.python_prefix ~ rh_ar_context.dependencies.python_version
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.smoke }}'
    quiet: true
- name: Run the observed ansible binary in the cleared declared environment
  ansible.builtin.command:
    argv: '{% set ns = namespace(args=[rh_ar_tools.env.path] + rh_ar_contract.env_clear_args) %}{% for key, value in _rh_ar_smoke_env.items()
      %}{% set ns.args = ns.args + [rh_ar_contract.env_pair_format.format(key=key, value=value)] %}{% endfor %}{{ ns.args + [rh_ar_subject.expected_paths.ansible_playbook]
      + rh_ar_contract.smoke.ansible_args }}'
  register: _rh_ar_smoke_ansible
  changed_when: false
- name: Require independently declared ansible identity
  ansible.builtin.assert:
    that:
    - (_rh_ar_smoke_ansible.stdout_lines | first) == rh_ar_contract.smoke.ansible_prefix ~ rh_ar_context.dependencies.expect_core ~ rh_ar_contract.smoke.ansible_suffix
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.smoke }}'
    quiet: true
- name: Run the observed uv binary in the cleared declared environment
  ansible.builtin.command:
    argv: '{% set ns = namespace(args=[rh_ar_tools.env.path] + rh_ar_contract.env_clear_args) %}{% for key, value in _rh_ar_smoke_env.items()
      %}{% set ns.args = ns.args + [rh_ar_contract.env_pair_format.format(key=key, value=value)] %}{% endfor %}{{ ns.args + [rh_ar_subject.expected_paths.uv]
      + rh_ar_contract.smoke.uv_args }}'
  register: _rh_ar_smoke_uv
  changed_when: false
- name: Require independently declared uv identity
  ansible.builtin.assert:
    that:
    - _rh_ar_smoke_uv.stdout.startswith(rh_ar_contract.smoke.uv_prefix ~ rh_ar_context.dependencies.uv_version ~ rh_ar_contract.smoke.uv_boundary)
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.smoke }}'
    quiet: true
- name: Run the observed uname binary in the cleared declared environment
  ansible.builtin.command:
    argv: '{% set ns = namespace(args=[rh_ar_tools.env.path] + rh_ar_contract.env_clear_args) %}{% for key, value in _rh_ar_smoke_env.items()
      %}{% set ns.args = ns.args + [rh_ar_contract.env_pair_format.format(key=key, value=value)] %}{% endfor %}{{ ns.args + [rh_ar_tools.uname.path]
      + rh_ar_contract.smoke.uname_args }}'
  register: _rh_ar_smoke_uname
  changed_when: false
- name: Require independently declared uname identity
  ansible.builtin.assert:
    that:
    - _rh_ar_smoke_uname.stdout == rh_ar_context.dependencies.architecture
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.smoke }}'
    quiet: true
