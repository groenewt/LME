---
# Native successor: explicitly separated read-only inspection, existing-obligation recovery,
# and charged staging creation. Historical frozen source remains unchanged.
- name: Admit the declared reaper operation before any read or effect
  vars:
    _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
    _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
  ansible.builtin.assert:
    that:
      - "'rh_reap_operation' in vars and rh_reap_operation is string"
      - rh_reap_operation in _ob.reaper_operations.values()
      - not rh_reap_reserve
    fail_msg: "{{ _sc.refusal }}: explicit operation required; legacy lease-before-reservation is retired"
    quiet: true

- name: Clear previous invocation creation status before deriving this invocation identity
  vars:
    _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
  ansible.builtin.set_fact:
    _rh_n13_create: "{{ _sc.empty_creation_result }}"

- name: Admit the types of the caller inputs and of lease.busy_rc (typed refusal before any read; nothing reaped)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.assert:
    that:
      - "['rh_reap_uid', 'rh_reap_need', 'rh_reap_remote', 'rh_reap_reserve'] | reject('in', vars) | list | length == 0"
      - rh_reap_uid is integer and rh_reap_uid is not boolean
      - rh_reap_need is integer and rh_reap_need is not boolean
      - rh_reap_remote is boolean
      - rh_reap_reserve is boolean
      # route op1x: the two view-tool inputs follow the declared absence policy above; a PRESENT one is admitted by type
      # and path grammar here (a malformed value refuses, it never reads as absent)
      - "'rh_reap_stat' not in vars or (rh_reap_stat is string and rh_reap_stat is match(rh.controller.bootstrap.path_admission.regex))"
      - "'rh_reap_findmnt' not in vars or (rh_reap_findmnt is string and rh_reap_findmnt is match(rh.controller.bootstrap.path_admission.regex))"
      - "'rh_reap_readlink' not in vars or (rh_reap_readlink is string and rh_reap_readlink is match(rh.controller.bootstrap.path_admission.regex))"
      - "'busy_rc' in _lz and _lz.busy_rc is integer and _lz.busy_rc is not boolean"
      # route op2a (codex 942): the gated lease-removal program's statuses are 0 removed, 1 retained, 2
      # malformed_invocation; busy_rc must differ from all three or a busy lock would read as one of them
      - _lz.busy_rc not in [0, 1, 2]
      # route op1r: the reaper's destination-lock flock words (s64 :560; r51 :4359 pins the mapping whole at load)
      - "'reap_lock' in _lz and _lz.reap_lock is mapping"
      - "['exclusive_arg', 'nonblocking_arg', 'conflict_exit_arg'] | reject('in', _lz.reap_lock) | list | length == 0"
    fail_msg: >-
      REFUSED {{ _lz.refusal }} on {{ inventory_hostname }}: reap_staging.yml needs rh_reap_uid and rh_reap_need as
      integers, rh_reap_remote and rh_reap_reserve as booleans, staging_retention.lease.busy_rc as an integer (no
      coercion) and lease.reap_lock {exclusive_arg, nonblocking_arg, conflict_exit_arg}; the failed `assertion` names the first one. Nothing was reaped or reserved.
    quiet: true

# route op2a / op2b (C1 SR922t, SR922u, SR922v lease.proc_paths, s64 :428-518, comments :411-427, :432-442, :447-456,
# :482-486, :488-495, :499; seat ruling "no literal path segments"): EVERY /proc path the lease derivation and the reaper's
# pre-lock reads use is built from this word: <proc_root> + join + of_segments joined by join, with the segment
# pid_placeholder.segment replaced by ONE pid text taken from the source the path's pid_from names. r51 pins the
# word whole at load (r51 :4362-4390, comment :4360-4361; closes NOTE-SEAT-SR922T-PROC-PATHS-UNPINNED); route still
# pins it HERE by value against the resolved rh (codex 943: values, not a hash), with dead_holder.relock.namespace
# whole; the pinned root_from [bundle, staging_retention, lease, proc_root] reaches exactly lease.proc_root.
- name: Admit the lease proc_paths word this file builds every /proc path from (by value; nothing read, nothing reaped)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.assert:
    that:
      - "'proc_paths' in _lz and 'proc_root' in _lz"
      - _lz.proc_root is string and _lz.proc_root is match(rh.controller.bootstrap.path_admission.regex)
      - "_lz.proc_paths == {'root_from': ['bundle', 'staging_retention', 'lease', 'proc_root'], 'join': '/', 'pid_placeholder': {'segment': '<pid>', 'ere': '^[1-9][0-9]*$', 'derivation_mismatch': 'refused', 'reaper_read_mismatch': 'unknown'}, 'pid_match': {'whole_text': 'required', 'control_bytes': 'mismatch', 'ere_change': 'none', 'consumers': {'python_re': {'form': 'p is string and p is match(ere) and (p | regex_search(ere)) == p'}, 'awk_ere': {'before': 'no_control_bytes', 'records': 1, 'form': 'NR == 1 && $0 ~ ere'}, 'shell_case': {'refuse': ['', '0*', '*[!0-9]*']}}}, 'derivation_reads': {'applies_to': ['self_stat', 'self_cmdline', 'parent_cmdline', 'holder_stat', 'holder_parent_cmdline', 'self_status', 'holder_cgroup', 'holder_pidns', 'holder_cgroupns', 'self_pidns', 'self_cgroupns'], 'failed': 'refused', 'empty': 'refused', 'failed_is_absence': false, 'outcomes': {'parent_cmdline': {'read_equal': 'holder_is_parent', 'read_differs': 'holder_is_self', 'failed_or_empty': 'refused'}, 'holder_parent_cmdline': {'read_differs': 'top_true', 'read_equal': 'top_false', 'failed_or_empty': 'refused'}, 'compared_with': 'self_cmdline'}}, 'derivation': {'self_stat': {'of_segments': ['self', 'stat']}, 'self_cmdline': {'of_segments': ['self', 'cmdline']}, 'parent_cmdline': {'of_segments': ['<pid>', 'cmdline'], 'pid_from': 'self_stat_field_4'}, 'holder_stat': {'of_segments': ['<pid>', 'stat'], 'pid_from': 'holder_pid'}, 'holder_parent_cmdline': {'of_segments': ['<pid>', 'cmdline'], 'pid_from': 'holder_stat_field_4'}, 'self_status': {'of_segments': ['self', 'status']}, 'holder_cgroup': {'of_segments': ['<pid>', 'cgroup'], 'pid_from': 'holder_pid', 'lines': 1, 'prefix': '0::', 'path': 'rest_after_prefix', 'path_starts': '/', 'other': 'refused'}}, 'namespace_paths': {'holder_pidns': {'of_segments': ['<pid>', 'ns', 'pid'], 'pid_from': 'holder_pid'}, 'holder_cgroupns': {'of_segments': ['<pid>', 'ns', 'cgroup'], 'pid_from': 'holder_pid'}, 'self_pidns': {'of_segments': ['self', 'ns', 'pid']}, 'self_cgroupns': {'of_segments': ['self', 'ns', 'cgroup']}}, 'reaper_reads': {'record_holder_stat': {'of_segments': ['<pid>', 'stat'], 'pid_from': 'record_lease_pid'}, 'self_cgroup': {'of_segments': ['self', 'cgroup']}, 'record_holder_presence': {'of_segments': ['<pid>'], 'pid_from': 'record_lease_pid', 'follow': false, 'absent_when': 'not_found', 'other_failure': 'unknown', 'absent_also_requires': ['entry_generation', 'render', 'n10', 'write_bound', 'lifetime', 'dead_holder', 'relock', 'absence_proof', 'leaf_listing']}}, 'consumer_reads': {'consumer': 'controller_seed_custody_consumption', 'pid_check': ['pid_match', 'consumers', 'shell_case'], 'consumption_presence': {'of_segments': ['<pid>'], 'pid_from_one_of': ['consumer_shell_pid', 'consumption_record_pid'], 'absent_when': 'not_found', 'absent_also_requires': ['entry_generation', 'render', 'n10', 'write_bound', 'lifetime', 'dead_holder', 'relock', 'absence_proof', 'leaf_listing'], 'visibility_from': ['entry_generation', 'render', 'n10', 'write_bound', 'lifetime', 'dead_holder', 'relock', 'process_visibility'], 'visibility_unproven': 'unknown'}, 'consumption_stat': {'of_segments': ['<pid>', 'stat'], 'pid_from_one_of': ['consumer_shell_pid', 'consumption_record_pid'], 'start_field': 22, 'comm_close': 'last_paren'}, 'consumer_pidns': {'of_segments': ['<pid>', 'ns', 'pid'], 'pid_from': 'consumer_shell_pid', 'last_segment_equals': ['source_admission', 'custody_lease', 'supervision', 'namespaces', 'pid']}, 'consumer_cgroupns': {'of_segments': ['<pid>', 'ns', 'cgroup'], 'pid_from': 'consumer_shell_pid', 'last_segment_equals': ['source_admission', 'custody_lease', 'supervision', 'namespaces', 'cgroup']}}, 'consistent_with': ['entry_generation', 'render', 'n10', 'write_bound', 'lifetime', 'dead_holder', 'relock', 'namespace']}"
      # route op2a addendum 3 (codex 943): the resolved values, not a source hash. root_from walked from
      # controller.bootstrap reaches the very proc_root this file reads; the self namespace segments equal the
      # consistent_with word's relock.namespace of_segments (s64 :8918, :8920), whose root_from is the same root.
      - _lz.proc_paths.root_from | length == 4
      - rh.controller.bootstrap[_lz.proc_paths.root_from[0]][_lz.proc_paths.root_from[1]][_lz.proc_paths.root_from[2]][_lz.proc_paths.root_from[3]] == _lz.proc_root
      - "'namespace' in rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock"
      - "'pid' in rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace and 'cgroup' in rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace"
      - _lz.proc_paths.namespace_paths.self_pidns.of_segments == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.of_segments
      - _lz.proc_paths.namespace_paths.self_cgroupns.of_segments == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.cgroup.of_segments
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.root_from == _lz.proc_paths.root_from
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.cgroup.root_from == _lz.proc_paths.root_from
      # route op2b (C1 SR922u): dead_holder.relock.namespace pinned by value as s64 :8916-8923 states it (join_from on
      # pid, proc_view and cgroup; proc_view gains root_from; comment :8913-8915); r51 pins it at :7181-7183.
      - "rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace == {'consulted_on': 'same_boot', 'pid': {'role': 'link', 'args': ['--'], 'of': ['proc_root', 'self_ns_pid'], 'of_segments': ['self', 'ns', 'pid'], 'root_from': ['bundle', 'staging_retention', 'lease', 'proc_root'], 'ere_from': ['bundle', 'staging_retention', 'lease', 'ns_regex'], 'equals': 'record_lease_pidns', 'join_from': ['bundle', 'staging_retention', 'lease', 'proc_paths', 'join']}, 'proc_view': {'file': ['proc_root', 'self_status'], 'of_segments': ['self', 'status'], 'line_prefix': 'NSpid:', 'lines': 1, 'fields_after_prefix': 1, 'field_grammar_from': ['transaction', 'grammar', 'decimal_ere'], 'proves': 'procfs_of_reader_pid_namespace', 'root_from': ['bundle', 'staging_retention', 'lease', 'proc_root'], 'join_from': ['bundle', 'staging_retention', 'lease', 'proc_paths', 'join']}, 'cgroup': {'role': 'link', 'args': ['--'], 'of': ['proc_root', 'self_ns_cgroup'], 'of_segments': ['self', 'ns', 'cgroup'], 'root_from': ['bundle', 'staging_retention', 'lease', 'proc_root'], 'ere_from': ['bundle', 'staging_retention', 'lease', 'ns_regex'], 'equals': 'record_lease_cgroupns', 'join_from': ['bundle', 'staging_retention', 'lease', 'proc_paths', 'join']}, 'cgroup_view': {'role': 'mount', 'args': ['--noheadings', '--raw', '--output', 'TARGET,FSTYPE,FSROOT', '--target'], 'target_from': ['bundle', 'staging_retention', 'lease', 'cgroup_root'], 'rows': 1, 'fields': ['target', 'fstype', 'fsroot'], 'separator': ' ', 'unknown_when': ['escaped_field', 'field_count_not_3', 'empty_field'], 'escaped_field': 'contains_backslash', 'target_equals': 'cgroup_root', 'fstype': 'cgroup2', 'fsroot': '/', 'proves': 'cgroup_mount_rooted_at_reader_cgroup_namespace'}, 'all_required': true, 'other': 'unknown'}"
      # route op2b: every join_from (relock.namespace pid / proc_view / cgroup, observation_boundary.namespace_probe)
      # walked from controller.bootstrap reaches the very proc_paths.join this file joins with.
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from | length == 5
      - rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from[1]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from[2]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from[3]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from[4]] == _lz.proc_paths.join
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.proc_view.join_from == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.cgroup.join_from == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from
      - rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.observation_boundary.namespace_probe.join_from == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.namespace.pid.join_from
      # route op2b addendum 2 (C1 SR922v relock.absence_proof.leaf_listing, s64 :8778-8789, comment :8744-8777; r51
      # :7165-7172): pinned by value. A failed leaf lookup alone never proves a pid or cgroup leaf absent; absence also
      # needs this complete listing of the proven parent to exit 0 with no record equal to the leaf name. Both
      # absent_also_requires words (record_holder_presence s64 :487, consumption_presence :514, comment :500-513; r51 :4384, :4386) walked
      # from controller reach exactly this listing word.
      - "'absence_proof' in rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock and 'leaf_listing' in rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof"
      - >-
        rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing == {'tool': 'find',
        'start': 'proven_leaf_parent', 'args': ['-mindepth', '1', '-maxdepth', '1', '-printf', '%f\\n'], 'env_from': ['base_env', 'LC_ALL'],
        'record_separator': 'LF', 'compare': 'exact_string_equal_leaf_name', 'listed': 'present',
        'not_listed': {'status': 0, 'absent_requires': ['leaf_absent', 'not_listed']}, 'nonzero_status': 'unknown', 'stderr': 'not_parsed',
        'applies_to': ['proc_pid_leaf', 'cgroup_leaf', 'cgroup_first_absent_segment']}
      - _lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires | length == 9
      - rh.controller[_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[0]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[1]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[2]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[3]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[4]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[5]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[6]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[7]][_lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires[8]] == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing
      - _lz.proc_paths.consumer_reads.consumption_presence.absent_also_requires == _lz.proc_paths.reaper_reads.record_holder_presence.absent_also_requires
      # the listing tool and its locale: os_tools.find is the listing's tool, required by staging_reap and
      # staging_reap_subject (s64 :3453, comment :3452); its locale is base_env.LC_ALL (env_from).
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool in rh.controller.bootstrap.os_tools
      - rh.controller.bootstrap.os_tools.find.required_by == ['seed', 'staging_reap', 'staging_reap_subject']
      - rh.controller.bootstrap.os_tools.find.path is string and rh.controller.bootstrap.os_tools.find.path is match(rh.controller.bootstrap.path_admission.regex)
      - "'identity' in rh.controller.bootstrap.os_tools.find"
      - rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[1]] is string
      # route op2b addendum 2 (C1 SR922v relock.proc_stat, s64 :8717, comment :8712-8716; r51 :7159): pinned by value;
      # its path_from reaches exactly reaper_reads.record_holder_stat (the one path this file reads a holder's stat
      # from), presence_from reaches record_holder_presence, and both agree words hold (root_from equals
      # proc_paths.root_from; file equals the last of_segments entry of record_holder_stat).
      - "rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat == {'root_from': ['bundle', 'staging_retention', 'lease', 'proc_root'], 'file': 'stat', 'comm': {'open': 'first_paren', 'close': 'last_paren'}, 'separator': ' ', 'after_comm_first': 3, 'start_field': 22, 'grammar_from': ['transaction', 'grammar', 'decimal_ere'], 'path_from': ['bundle', 'staging_retention', 'lease', 'proc_paths', 'reaper_reads', 'record_holder_stat'], 'presence_from': ['bundle', 'staging_retention', 'lease', 'proc_paths', 'reaper_reads', 'record_holder_presence'], 'agree': {'root_from': 'proc_paths_root_from', 'file': 'last_of_segments'}}"
      - rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[1]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[2]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[3]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[4]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.path_from[5]] == _lz.proc_paths.reaper_reads.record_holder_stat
      - rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[1]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[2]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[3]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[4]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.presence_from[5]] == _lz.proc_paths.reaper_reads.record_holder_presence
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.root_from == _lz.proc_paths.root_from
      - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.file == _lz.proc_paths.reaper_reads.record_holder_stat.of_segments | last
      # route op2c (seat NOTE-SEAT-OP2B-PRELOCK-VISIBILITY, from route CPL-OP2B-ROUTE-ABSENCE-ANCESTORS-VISIBILITY; C1
      # SR922p / SR922r / SR922s / SR922v / SR922w relock.absence_proof s64 :8739-8843 with leaf_listing_names
      # :8809-8813, comments :8720-8738, :8744-8777, :8790-8808; process_visibility s64 :8868-8875, comment :8844-8867;
      # dead_rule :8924; r51 :7162-7176, :7177-7179, :7186): pinned by value. The pre-lock decision below reads pid
      # `gone` from a failed lookup only with this visibility basis (proc_mount_unrestricted on the bound proc view)
      # and every ancestor proven, and the cgroup leaf only with every ancestor from cgroup_root proven.
      - >-
        rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof == {'roots': {'proc': ['bundle', 'staging_retention', 'lease', 'proc_root'],
        'cgroup': ['bundle', 'staging_retention', 'lease', 'cgroup_root']}, 'ancestors': 'from_root_through_leaf_parent',
        'each_ancestor': {'type_probe': {'tool': 'stat', 'args': ['-c', '%F', '--'], 'equals': 'directory', 'follows_links': false}, 'searchable': {'test': '-x',
        'ansible_consumer': {'module': 'ansible.builtin.stat', 'follow_from': ['type_probe', 'follows_links'], 'same_path_as': 'type_probe',
        'proven_when': ['exists', 'isdir', 'not_islnk', 'executable'], 'executable_basis': 'access_x_ok_real_ids', 'over_report_bounded_by': ['leaf_absent', 'leaf_listing'], 'other': 'unknown'}}},
        'leaf_absent': {'not_exists': {'test': '-e'}, 'not_link': {'test': '-L'}, 'ansible_consumer': {'module': 'ansible.builtin.stat', 'follow': false,
        'absent_when': 'exists_false', 'exists_false_only_on': 'not_found', 'failed_or_missing': 'unknown'}},
        'leaf_listing': {'tool': 'find', 'start': 'proven_leaf_parent', 'args': ['-mindepth', '1', '-maxdepth', '1', '-printf', '%f\\n'], 'env_from': ['base_env', 'LC_ALL'],
        'record_separator': 'LF', 'compare': 'exact_string_equal_leaf_name', 'listed': 'present',
        'not_listed': {'status': 0, 'absent_requires': ['leaf_absent', 'not_listed']}, 'nonzero_status': 'unknown', 'stderr': 'not_parsed',
        'applies_to': ['proc_pid_leaf', 'cgroup_leaf', 'cgroup_first_absent_segment']},
        'leaf_listing_names': {'kernel_admits': 'any_byte_except_slash_nul_lf', 'shell_consumer': {'compare': 'byte_exact',
        'read': {'form': 'IFS= read -r', 'status': 'retired', 'superseded_by': ['split', 'admitted_forms'], 'reason': 'no_admitted_input_route_in_declared_sh'}, 'decode': 'none',
        'split': {'separator': 'LF', 'admitted_forms': ['parameter_expansion'], 'retired_forms': ['ifs_empty_read_r'],
        'forms_refused': ['pipe_subshell', 'here_document', 'here_string', 'file_redirect'], 'record_processing': 'none'},
        'capture': {'trailing_lf': 'kept_by_sentinel', 'text': 'empty_or_lf_terminated', 'otherwise': 'unknown'}, 'empty_record': 'unknown'},
        'ansible_consumer': {'stdout_decode': 'utf8_surrogateescape', 'controller_strict_utf8': 'required_true', 'leaf_name_not_utf8': 'unknown',
        'result_without_int_rc': 'unknown', 'compare': 'exact_text'}, 'replacement_characters': 'never_compared'},
        'ancestor_unproven': 'unknown', 'other': 'unknown',
        'cgroup_first_absent_segment': {'applies_on': 'namespace_bound_cgroup2_view', 'parent': {'proven_by': 'each_ancestor', 'from': 'cgroup_root'},
