# route op2a: the derivation reads, in this order, derivation.self_stat, self_cmdline, parent_cmdline (pid_from
# self_stat_field_4: field 4 of self/stat, after the last ')'), holder_stat (pid_from holder_pid: the parent when its
# cmdline equals this process's, else this process), holder_parent_cmdline (pid_from holder_stat_field_4), self_status
# and holder_cgroup (pid_from holder_pid), and builds namespace_paths holder_pidns, holder_cgroupns, self_pidns,
# self_cgroupns (pid_from holder_pid) for the namespace reads below. Each pid text must FULLY match
# pid_placeholder.ere, read from the word and never restated. Parser semantics (route op2a addendum 3, codex 943):
# the ansible `match` test and `regex_search` filter run Python `re` (re.match / re.search, no flags), where `$` also
# matches before ONE trailing newline, so `match` alone admits '12' + LF. The full-text check is therefore
#   p is string and p is match(ere) and (p | regex_search(ere)) == p
# : the leftmost match must BE the whole text, which a trailing LF (outside the match) fails; a CR, space, sign,
# slash, leading zero, '0' or the empty text fails the ere itself. The anchoring is derived from the word's own ^ and
# $ plus that equality; C1 SR922u now states this form as pid_match.consumers.python_re (s64 :443-446, comment
# :432-442; closes CPL-OP2A-C1-PID-ERE-FLAVOUR) and the pin above holds it by value. A pid_from with no source text
# or a mismatch is recorded in `refused` and no
# later path is read (derivation_mismatch: refused, by the next task). holder_cgroup: exactly `lines` lines, the line
# starts with `prefix`, the path is the rest after it (path: rest_after_prefix) and starts with `path_starts`; any other
# shape is recorded in `refused` (other: refused). No path segment is literal text here.
# route op2b (C1 SR922u derivation_reads, s64 :457-465, comment :447-456; NOTE-SEAT-OP2A-DERIVATION-FAILED-LOOKUP):
# EVERY derivation read is query('ansible.builtin.file', path, errors='ignore'). ansible-core 2.19.11
# _jinja_plugins._invoke_lookup returns [] for a failed lookup under errors='ignore' with wantlist (query), and the
# file lookup returns a one-element list [text] for a read (rstrip applied). So a FAILED read is a result of length 0
# (derivation_reads.failed: refused), an EMPTY read is [''] (empty: refused), and only a one-element non-empty
# result is READ text; the two cannot be confused, and no ignored error decides anything. parent_cmdline: read and
# equal to compared_with (self_cmdline) -> holder is the parent pid; read and different -> holder is this process
# (field 1 of self/stat); failed or empty -> refused. holder_parent_cmdline: read and different -> top true; read and
# equal -> top false (the lease assert below then refuses); failed or empty -> refused. The namespace_paths stats are
# the stat tasks below: a failed stat, a missing stat or a missing link target refuses there.
- name: Derive this run's staging holder lease (controller ansible-playbook main process; read-only /proc; paths from lease.proc_paths)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.set_fact:
    _rh_lease_self: >-
      {%- set pr = _lz.proc_root -%}{%- set pw = _lz.proc_paths -%}{%- set ph = pw.pid_placeholder -%}{%- set dv = pw.derivation -%}{%- set dr = pw.derivation_reads -%}
      {%- set sp = '^' ~ (ph.segment | regex_escape) ~ '$' -%}
      {%- set q = namespace(bad=[], src={}, t={}, sid='', h='', hf=[], top=false, cg='', nsp=[]) -%}
      {%- for k in ['self_stat', 'self_cmdline', 'parent_cmdline', 'holder_stat', 'holder_parent_cmdline', 'self_status', 'holder_cgroup'] -%}
        {%- set w = dv[k] -%}
        {%- set p = (q.src[w.pid_from] if w.pid_from in q.src else '') if 'pid_from' in w else '' -%}
        {%- if q.bad | length == 0 and 'pid_from' in w and not (p is string and p is match(ph.ere) and (p | regex_search(ph.ere)) == p) -%}
          {%- set q.bad = q.bad + [k ~ ': ' ~ w.pid_from ~ ' ' ~ (p | to_json) ~ ' (' ~ ph.derivation_mismatch ~ ')'] -%}
        {%- endif -%}
        {%- if q.bad | length == 0 -%}
          {%- set r = query('ansible.builtin.file', pr ~ pw.join ~ (w.of_segments | map('regex_replace', sp, p) | join(pw.join)), errors='ignore') -%}
          {%- if r | length != 1 -%}{%- set q.bad = q.bad + [k ~ ': read failed (' ~ dr.failed ~ ')'] -%}
          {%- elif r[0] | length == 0 -%}{%- set q.bad = q.bad + [k ~ ': read empty (' ~ dr.empty ~ ')'] -%}
          {%- else -%}{%- set q.t = q.t | combine({k: r[0]}) -%}
          {%- endif -%}
        {%- endif -%}
        {%- if q.bad | length == 0 and k == 'self_stat' -%}
          {%- set sf = (q.t.self_stat.split(')') | last).split() -%}
          {%- set q.sid = q.t.self_stat.split(' ')[0] -%}
          {%- if sf | length > 1 -%}{%- set q.src = q.src | combine({'self_stat_field_4': sf[1]}) -%}{%- endif -%}
        {%- elif q.bad | length == 0 and k == 'parent_cmdline' -%}
          {%- set q.h = p if q.t.parent_cmdline == q.t[dr.outcomes.compared_with] else q.sid -%}
          {%- set q.src = q.src | combine({'holder_pid': q.h}) -%}
        {%- elif q.bad | length == 0 and k == 'holder_stat' -%}
          {%- set q.hf = (q.t.holder_stat.split(')') | last).split() -%}
          {%- if q.hf | length > 1 -%}{%- set q.src = q.src | combine({'holder_stat_field_4': q.hf[1]}) -%}{%- endif -%}
        {%- elif q.bad | length == 0 and k == 'holder_parent_cmdline' -%}
          {%- set q.top = q.t.holder_parent_cmdline != q.t[dr.outcomes.compared_with] -%}
        {%- elif q.bad | length == 0 and k == 'holder_cgroup' -%}
          {%- set cgl = q.t.holder_cgroup.splitlines() -%}
          {%- if cgl | length == w.lines and cgl[0].startswith(w.prefix) and cgl[0][w.prefix | length:].startswith(w.path_starts) -%}{%- set q.cg = cgl[0][w.prefix | length:] -%}
          {%- else -%}{%- set q.bad = q.bad + ['holder_cgroup: ' ~ (cgl | to_json) ~ ' is not ' ~ w.lines ~ ' line of ' ~ w.prefix ~ ' and a path starting ' ~ w.path_starts ~ ' (' ~ w.other ~ ')'] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set ul = (q.t.self_status.splitlines() if 'self_status' in q.t else []) | select('match', 'Uid:') | list -%}
      {%- for k in ['holder_pidns', 'holder_cgroupns', 'self_pidns', 'self_cgroupns'] -%}
        {%- set w = pw.namespace_paths[k] -%}
        {%- set p = (q.src[w.pid_from] if w.pid_from in q.src else '') if 'pid_from' in w else '' -%}
        {%- if 'pid_from' in w and q.bad | length == 0 and not (p is string and p is match(ph.ere) and (p | regex_search(ph.ere)) == p) -%}{%- set q.bad = q.bad + [k ~ ': ' ~ w.pid_from ~ ' ' ~ (p | to_json)] -%}{%- endif -%}
        {%- set q.nsp = q.nsp + [pr ~ pw.join ~ (w.of_segments | map('regex_replace', sp, p) | join(pw.join))] -%}
      {%- endfor -%}
      {{ {'machine': lookup('ansible.builtin.file', _lz.machine_id_path) | trim,
          'boot': lookup('ansible.builtin.file', _lz.boot_id_path) | trim | replace('-', ''),
          'uid': (ul | first).split()[1] if ul | length == 1 else '',
          'pid': q.h, 'start': q.hf[19] if q.hf | length > 19 else '',
          'cgroup': q.cg, 'ns_paths': q.nsp, 'refused': q.bad,
          'argv_ok': (q.t.self_cmdline is search(_lz.holder_argv_regex)) if 'self_cmdline' in q.t else false, 'top': q.top} }}

# route op2a (C1 SR922t pid_placeholder.derivation_mismatch: refused; holder_cgroup other: refused): a derivation whose
# pid text or cgroup line is not proven refuses HERE, before any namespace read with an unproven pid; no lease is
# written and nothing is reserved.
- name: Refuse a holder lease whose /proc reads are not proven by lease.proc_paths (nothing written, nothing reserved)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.assert:
    that:
      - "'refused' in _rh_lease_self and 'ns_paths' in _rh_lease_self"
      - _rh_lease_self.refused | length == 0
      - _rh_lease_self.ns_paths | length == 4
    fail_msg: >-
      REFUSED {{ _lz.refusal }} on {{ inventory_hostname }}: the staging holder lease is not proven by
      lease.proc_paths (a pid text that does not fully match pid_placeholder.ere, a pid_from with no source text, or a
      holder cgroup that is not one prefixed line with a path, or a derivation read that failed or was empty): {{ (_rh_lease_self.refused | to_json) if 'refused' in _rh_lease_self else (_rh_lease_self | list | to_json) }}. No lease was written and nothing was reserved.
    quiet: true

# route op1p (CPL-SR922D-ROUTE-REAP; C1 SR922d/SR922e; s43 work_roots.remote_tmp_authority :3687-3699 with its comment
# :3665-3686, reap_staging.yml contexts :3684-3686; run_pinned_vars :3707-3709; owner_private_group.applicability :4232):
# WHERE the controller observations run and WHICH remote temp they use is DERIVED from the launch context (the same
# first_match derivation admit_ancestry.yml / decide_private_group.yml run; admitted facts only, no include parameter):
#   genesis_launch (package_bundle.yml :123, the package stage): the play host IS the controller; the controller
#     observations run on it with NO delegation and NO task var; the stage env (remote_tmp_authority.by_launch
#     .genesis_launch.env) governs and ansible_remote_tmp is unset or equal to it (delegated_controller.genesis_launch
#     unset_or_equal); no target writer exists (rh_reap_remote false).
#   a decided context (seed_run: target_bootstrap.yml :540, a `seed run` target play; run_local_leased): the controller
#     observations are delegated to the declared binding rh_controller_target (run_pinned_vars / run_local.pinned_vars;
#     FW20 withdrew the authored controller_delegation host / connection words, which are not read) over
#     rh_controller_connection with the controller's interpreter (controller_delegation.python_var) as TASK vars, and
#     the TASK var ansible_remote_tmp = the controller env TMPDIR (delegated_controller.controller_env), required
#     non-empty (literal_substitute refuse); under run_local_leased the extra-var pin outranks it and must equal it.
#   anything else (otherwise, an unresolved declared word): REFUSED before any observation; nothing reaped or reserved.
# Two variants of each controller observation carry distinct registers (a skipped task still overwrites its register)
# and are merged by context after the last of them.
- name: Admit the launch-context words this file reads (membership, parent before child; the delegation code)
  vars:
    _b: "{{ rh.controller.bootstrap }}"
  ansible.builtin.assert:
    that:
      - "'path_admission' in _b and 'ancestry' in _b.path_admission and 'owner_private_group' in _b.path_admission.ancestry"
      - "'applicability' in _b.path_admission.ancestry.owner_private_group and _b.path_admission.ancestry.owner_private_group.applicability is mapping"
      - "['derive', 'order', 'caller_fact_from', 'contexts', 'otherwise'] | reject('in', _b.path_admission.ancestry.owner_private_group.applicability) | list | length == 0"
      - _b.path_admission.ancestry.owner_private_group.applicability.derive == 'first_match'
      - _b.path_admission.ancestry.owner_private_group.applicability.order is sequence and _b.path_admission.ancestry.owner_private_group.applicability.order is not string
      - _b.path_admission.ancestry.owner_private_group.applicability.caller_fact_from is sequence and _b.path_admission.ancestry.owner_private_group.applicability.caller_fact_from is not string
      - _b.path_admission.ancestry.owner_private_group.applicability.contexts is mapping
      - _b.path_admission.ancestry.owner_private_group.applicability.order | reject('in', _b.path_admission.ancestry.owner_private_group.applicability.contexts) | list | length == 0
      - _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('mapping') | list | length == 0
      - _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('contains', 'when') | list | length == 0
      - _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts) | reject('contains', 'exception') | list | length == 0
      - _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts) | map(attribute='when') | reject('mapping') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | map(attribute='when') | map('dict2items') | map('map', attribute='key') | map('sort') | map('list')
        | reject('in', [['caller_field', 'caller_in'], ['equals_from', 'var'], ['bindings_present', 'var_absent']]) | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | reject('contains', 'bindings_from') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | map(attribute='bindings_from') | reject('sequence') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | reject('contains', 'bindings') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('when', 'contains', 'var_absent') | reject('contains', 'bindings') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | rejectattr('bindings', 'sequence') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | reject('contains', 'remote_tmp') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp')
        | reject('in', ['pinned_required_equal_controller_tmpdir', 'task_var_controller_env']) | list | length == 0
      - _b.path_admission.ancestry.owner_private_group.applicability.otherwise is mapping and 'text' in _b.path_admission.ancestry.owner_private_group.applicability.otherwise
      - "'work_roots' in _b and 'remote_tmp_authority' in _b.work_roots and _b.work_roots.remote_tmp_authority is mapping"
      - "'by_launch' in _b.work_roots.remote_tmp_authority and 'delegated_controller' in _b.work_roots.remote_tmp_authority"
      - "'controller_env' in _b.work_roots.remote_tmp_authority.delegated_controller and _b.work_roots.remote_tmp_authority.delegated_controller.controller_env is string"
      # route op1q (CPL-SR922G-ROUTE-RTMP-WORD; s64 :4569, :4576-4581, :4587; r51 :4887-4904; route op2c retarget): every context names its
      # remote_tmp_authority key by remote_tmp_launch (a by_launch AND delegated_controller key); a decided context's
      # remote_tmp IS delegated_controller[remote_tmp_launch]. The two rule words above are the rules this file
      # implements (any other refuses); the context-to-key map is read, never a context name used as a key.
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | reject('contains', 'remote_tmp_launch') | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | map(attribute='remote_tmp_launch') | reject('in', _b.work_roots.remote_tmp_authority.by_launch) | list | length == 0
      - >-
        _b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
        | map(attribute='remote_tmp_launch') | reject('in', _b.work_roots.remote_tmp_authority.delegated_controller) | list | length == 0
      - >-
        (_b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
         | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp') | list)
        == (_b.path_admission.ancestry.owner_private_group.applicability.order | map('extract', _b.path_admission.ancestry.owner_private_group.applicability.contexts)
         | selectattr('exception', 'equalto', 'decided') | map(attribute='remote_tmp_launch') | map('extract', _b.work_roots.remote_tmp_authority.delegated_controller) | list)
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.target_bootstrap.refusal }} (RH-CONTROLLER-DELEGATION) on {{ inventory_hostname }}:
      reap_staging.yml needs path_admission.ancestry.owner_private_group.applicability {derive first_match, order,
      caller_fact_from, contexts (each a when of a derived form and an exception; a decided one with bindings and
      remote_tmp; a binding form with bindings_from), otherwise.text} and work_roots.remote_tmp_authority {by_launch,
      delegated_controller.controller_env}; the failed `assertion` names the first absent part. Nothing was reaped.
    quiet: true

- name: Derive the launch context (first_match over the declared order; admitted facts only; read-only)
  vars:
    _b: "{{ rh.controller.bootstrap }}"
    _app: "{{ rh.controller.bootstrap.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.set_fact:
    _rh_reap_app: >-
      {%- set r = namespace(missing=[], holds=[]) -%}
      {%- set cf = namespace(n=_b, ok=true) -%}
      {%- for k in _app.caller_fact_from -%}{%- if cf.ok and cf.n is mapping and k in cf.n -%}{%- set cf.n = cf.n[k] -%}{%- else -%}{%- set cf.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if not (cf.ok and cf.n is string) -%}{%- set r.missing = r.missing + ['caller_fact_from'] -%}{%- endif -%}
      {%- for name in _app.order -%}
        {%- set c = _app.contexts[name] -%}{%- set w = c.when -%}
        {%- if 'caller_in' in w -%}
          {%- set p = namespace(n=_b, ok=true) -%}
          {%- for k in w.caller_in -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif cf.ok and cf.n is string and cf.n in vars
                   and lookup('ansible.builtin.vars', cf.n) in (p.n.values() | select('mapping') | select('contains', w.caller_field) | map(attribute=w.caller_field) | list) -%}
            {%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- elif 'equals_from' in w -%}
          {%- set p = namespace(n=_b, ok=true) -%}
          {%- for k in w.equals_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is string) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var in vars and lookup('ansible.builtin.vars', w.var) == p.n -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- else -%}
          {%- set p = namespace(n=_b, ok=true) -%}
          {%- for k in c.bindings_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping and c.bindings | reject('in', p.n) | list | length == 0 and w.bindings_present is sameas true) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var_absent not in vars and c.bindings | reject('in', vars) | list | length == 0 -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {%- set k = namespace(kind='') -%}
      {%- if r.missing | length == 0 and r.holds | length > 0 -%}
        {%- set h = r.holds | first -%}{%- set dc = _b.work_roots.remote_tmp_authority.delegated_controller -%}{%- set bl = _b.work_roots.remote_tmp_authority.by_launch -%}{%- set rk = _app.contexts[h].remote_tmp_launch -%}
        {%- if _app.contexts[h].exception == 'decided' -%}{%- set k.kind = 'delegated' -%}
        {%- elif dc[rk] == 'unset_or_equal' and bl[rk] is mapping and 'governs' in bl[rk] and bl[rk].governs == 'env' and 'env' in bl[rk] and bl[rk].env is string -%}{%- set k.kind = 'local' -%}
        {%- endif -%}
      {%- endif -%}
      {{ {'missing': r.missing, 'holds': r.holds, 'kind': k.kind} }}

- name: Refuse a launch context in which this file has no declared controller (otherwise, unresolved; nothing reaped)
  vars:
    _app: "{{ rh.controller.bootstrap.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.assert:
    that:
      - _rh_reap_app.missing | length == 0
      - _rh_reap_app.kind in ['delegated', 'local']
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.target_bootstrap.refusal }} (RH-CONTROLLER-DELEGATION) on {{ inventory_hostname }}:
      {% if _rh_reap_app.missing | length > 0 %}reap_staging.yml cannot resolve the declared applicability words {{ _rh_reap_app.missing | to_json }}
      {%- else %}{{ _app.otherwise.text }} (held {{ _rh_reap_app.holds | to_json }}){% endif %}; nothing was reaped or reserved.
    quiet: true

- name: Refuse a genesis-stage reap whose remote temp is not the stage env or that names a target (local controller; no task var)
  vars:
    # route op1q (CPL-SR922G-ROUTE-RTMP-WORD): the by_launch key is the context's remote_tmp_launch word (s64 :4569)
    _bl: "{{ rh.controller.bootstrap.work_roots.remote_tmp_authority.by_launch[rh.controller.bootstrap.path_admission.ancestry.owner_private_group.applicability.contexts[_rh_reap_app.holds | first].remote_tmp_launch] }}"
  ansible.builtin.assert:
    that:
      - not rh_reap_remote
      - lookup('ansible.builtin.env', _bl.env) | length > 0
      - "'ansible_remote_tmp' not in vars or ansible_remote_tmp == lookup('ansible.builtin.env', _bl.env)"
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.target_bootstrap.refusal }} (RH-CONTROLLER-DELEGATION) on {{ inventory_hostname }}:
      in launch context {{ _rh_reap_app.holds | first }} the controller observations run on this play host with the stage
      env {{ _bl.env }} governing (non-empty; ansible_remote_tmp unset or equal to it) and no target staging
      (rh_reap_remote {{ rh_reap_remote | to_json }}; {{ _bl.env }} '{{ lookup('ansible.builtin.env', _bl.env) }}';
      ansible_remote_tmp in vars {{ ('ansible_remote_tmp' in vars) | to_json }}); nothing was reaped.
    quiet: true
  when: _rh_reap_app.kind == 'local'

- name: Refuse an absent controller binding or controller policy before any delegated read (decided context)
  vars:
    _ctx: "{{ rh.controller.bootstrap.path_admission.ancestry.owner_private_group.applicability.contexts[_rh_reap_app.holds | first] }}"
  ansible.builtin.assert:
    that:
      - _ctx.bindings | reject('in', vars) | list | length == 0
      - "'rh_controller_target' in _ctx.bindings and 'rh_controller_connection' in _ctx.bindings"
      - rh_controller_target is string and rh_controller_connection is string
      - rh_controller_target in hostvars
      - "'rh' in hostvars[rh_controller_target] and hostvars[rh_controller_target].rh is mapping"
      - "'controller' in hostvars[rh_controller_target].rh and 'bootstrap' in hostvars[rh_controller_target].rh.controller"
      - "'inventory' in hostvars[rh_controller_target].rh.controller.bootstrap"
      - "'controller_delegation' in hostvars[rh_controller_target].rh.controller.bootstrap.inventory"
      - "'python_var' in hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation"
      - hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var in vars
      - lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) | length > 0
      - >-
        (rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller[_ctx.remote_tmp_launch] == 'pinned_required_equal_controller_tmpdir'
         and 'ansible_remote_tmp' in vars and ansible_remote_tmp is string)
        or rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller[_ctx.remote_tmp_launch] == 'task_var_controller_env'
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.target_bootstrap.refusal }} (RH-CONTROLLER-DELEGATION) on {{ inventory_hostname }}:
      in launch context {{ _rh_reap_app.holds | first }} reap_staging.yml needs that context's declared bindings
      {{ _ctx.bindings | to_json }}, the controller's resolved policy at hostvars[rh_controller_target].rh with
      inventory.controller_delegation.python_var naming a present var, a non-empty controller
      {{ rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env }} and the remote
      temp its rule {{ _ctx.remote_tmp }} names (present: {{ _ctx.bindings | select('in', vars) | list | to_json }}); nothing was reaped.
    quiet: true
  when: _rh_reap_app.kind == 'delegated'

# RH-CONTROLLER-DELEGATION: the delegated observations pin the controller connection, the controller's interpreter and
# the controller remote temp as TASK vars; this assert carries the SAME pins and refuses when something outranks them
# (an extra-var connection or interpreter; a run-local pin unequal to the controller TMPDIR), before any delegated task.
- name: Refuse a controller delegation whose effective connection, interpreter or remote temp is not the declared one
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.assert:
    that:
      - ansible_connection in ['local', 'ansible.builtin.local']
      - ansible_python_interpreter == ansible_playbook_python
      - ansible_remote_tmp == lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env)
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.target_bootstrap.refusal }} (RH-CONTROLLER-DELEGATION) on {{ inventory_hostname }}:
      controller-delegated reap observations must run over the declared local connection on {{ rh_controller_target }}
      with the controller's own interpreter and the controller remote temp (effective '{{ ansible_connection }}',
      interpreter '{{ ansible_python_interpreter }}', controller '{{ ansible_playbook_python }}', remote temp
      '{{ ansible_remote_tmp }}' vs controller {{ rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env }}
      '{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}'); nothing was reaped.
    quiet: true
  when: _rh_reap_app.kind == 'delegated'

# route op1q (codex 931 ROUTE_DELEGATION_BEFORE_SKIP): ansible-core 2.19.11 templates a task's delegate_to
# (task_executor :458) BEFORE its `when` (:497), so a delegated task skipped by `when` still fails on an unbound
# rh_controller_target (genesis_launch binds none, and none is invented). The delegated variant is therefore a task set
# of its own, included only under the decided context; the include's `when` is evaluated on the include, so no
# delegated task is templated outside that context. The genesis variant below stays an ordinary local task.
- name: Read the namespace identities on the controller (delegated task set; decided context only)
  ansible.builtin.include_tasks: reap_staging_controller_ns.yml
  when: _rh_reap_app.kind == 'delegated'

- name: Read the holder's and this reaper's namespace identities and the cgroup v2 marker on the controller (genesis play host; read-only)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  # route op2a (C1 SR922t proc_paths.namespace_paths): holder_pidns, holder_cgroupns, self_pidns, self_cgroupns as the
  # derivation built them (pid proven above), then the cgroup v2 marker; no literal path segment
  loop: "{{ _rh_lease_self.ns_paths + [_lz.cgroup_v2_marker] }}"
  register: _rh_lease_ns_g
  failed_when: false
  when: _rh_reap_app.kind == 'local'

- name: Bind the namespace observations of the context's variant
  ansible.builtin.set_fact:
    _rh_lease_ns: "{{ _rh_lease_ns_d if _rh_reap_app.kind == 'delegated' else _rh_lease_ns_g }}"

- name: Refuse a run whose holder lease cannot be derived (nothing reaped, nothing reserved)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    # route op1p: read only after the membership lines below admitted every result's `stat` (an assert stops at the
    # first false; a task var is templated when read)
    _ns: "{{ _rh_lease_ns.results | map(attribute='stat') | list }}"
    _tok: "{{ 'L' ~ _rh_lease_self.machine ~ '-' ~ _rh_lease_self.boot ~ '-' ~ _rh_lease_self.uid ~ '-' ~ _rh_lease_self.pid ~ '-' ~ _rh_lease_self.start }}"
  ansible.builtin.assert:
    that:
      - _rh_lease_self.argv_ok
      - _rh_lease_self.top
      - _rh_lease_self.uid is match('^[0-9]+$')
      - _rh_lease_self.cgroup is string and _rh_lease_self.cgroup.startswith(_lz.proc_paths.derivation.holder_cgroup.path_starts)
      - _tok is match(_lz.token_regex)
      - "'results' in _rh_lease_ns and _rh_lease_ns.results | length == 5"
      - _rh_lease_ns.results | select('contains', 'failed') | selectattr('failed') | list | length == 0
      - _rh_lease_ns.results | reject('contains', 'stat') | list | length == 0
      - _ns[:4] | reject('contains', 'lnk_target') | list | length == 0
      - _ns[:4] | map(attribute='lnk_target') | select('match', _lz.ns_regex) | list | length == 4
      - _ns[0].lnk_target == _ns[2].lnk_target
      - _ns[1].lnk_target == _ns[3].lnk_target
      - _ns[4].exists
    fail_msg: >-
      REFUSED {{ _lz.refusal }} on {{ inventory_hostname }}: this run's staging holder (the controller ansible-playbook
      main process, its pid/cgroup namespaces and cgroup v2 path) could not be proven, or this reaper does not observe
      the holder's namespaces ({{ _rh_lease_self }};{% if 'results' in _rh_lease_ns %} observed
      {{ _rh_lease_ns.results | select('contains', 'stat') | map(attribute='stat') | list | to_json }}; unobserved
      {{ _rh_lease_ns.results | reject('contains', 'stat') | map(attribute='item') | list | to_json }}{% else %} result keys
      {{ _rh_lease_ns | list | to_json }}{% endif %}); no staging was reaped or reserved.
    quiet: true

- name: Publish this run's lease token and record (derived outputs)
  vars:
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    _ns: "{{ _rh_lease_ns.results | map(attribute='stat') | list }}"
  ansible.builtin.set_fact:
    rh_staging_lease: "{{ 'L' ~ _rh_lease_self.machine ~ '-' ~ _rh_lease_self.boot ~ '-' ~ _rh_lease_self.uid ~ '-' ~ _rh_lease_self.pid ~ '-' ~ _rh_lease_self.start }}"
    _rh_lease_rec:
      schema: "{{ _lz.record_schema }}"
      token: "{{ 'L' ~ _rh_lease_self.machine ~ '-' ~ _rh_lease_self.boot ~ '-' ~ _rh_lease_self.uid ~ '-' ~ _rh_lease_self.pid ~ '-' ~ _rh_lease_self.start }}"
      machine: "{{ _rh_lease_self.machine }}"
      boot: "{{ _rh_lease_self.boot }}"
      uid: "{{ _rh_lease_self.uid }}"
      pid: "{{ _rh_lease_self.pid }}"
      start: "{{ _rh_lease_self.start }}"
      pidns: "{{ _ns[0].lnk_target }}"
      cgroupns: "{{ _ns[1].lnk_target }}"
      cgroup_b64: "{{ _rh_lease_self.cgroup | b64encode }}"

- name: Publish the read-only phase after the complete current holder identity is admitted
  when: rh_reap_operation == rh.controller.entry_generation.render.n10.write_bound.obligations.reaper_operations.inspect
  ansible.builtin.set_fact:
    _rh_n13_phase: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.phase_output }}"

- name: Admit all declared effect tools and caller command bindings before any mutation
  when: rh_reap_operation != rh.controller.entry_generation.render.n10.write_bound.obligations.reaper_operations.inspect
  vars:
    _bs: "{{ rh.controller.bootstrap }}"
    _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
  block:
    - name: Admit typed tool identities and exact shell and flock bindings
      ansible.builtin.assert:
        that:
          - item in _bs.os_tools
          - _bs.os_tools[item].path is string and _bs.os_tools[item].path is match(_bs.path_admission.regex)
          - _bs.os_tools[item].identity.kind == _sc.tool_identity_kind
          - _bs.os_tools[item].identity.sha256 is string and _bs.os_tools[item].identity.sha256 is match(_sc.digest_pattern)
          - rh_reap_sh == _bs.os_tools.sh.path and rh_reap_flock == _bs.os_tools.flock.path
        fail_msg: "{{ _sc.refusal }}: effect tool declaration or calling path differs"
        quiet: true
      loop: "{{ _sc.tool_roles }}"
    - name: Observe actual effect tool checksums
      ansible.builtin.stat:
        path: "{{ _bs.os_tools[item].path }}"
        follow: "{{ _sc.true }}"
        get_checksum: "{{ _sc.true }}"
        checksum_algorithm: "{{ _sc.checksum_algorithm }}"
        get_mime: "{{ _sc.false }}"
        get_attributes: "{{ _sc.false }}"
      loop: "{{ _sc.tool_roles }}"
      register: _rh_n13_tool_identity
    - name: Require every actual effect tool to match its admitted file identity
      ansible.builtin.assert:
        that:
          - item.stat.exists and item.stat.isreg
          - item.stat.checksum == _bs.os_tools[item.item].identity.sha256
        fail_msg: "{{ _sc.refusal }}: actual effect tool hash mismatch"
        quiet: true
      loop: "{{ _rh_n13_tool_identity.results }}"

- name: Recover previous obligations without creating any new uncharged object
  when: rh_reap_operation == rh.controller.entry_generation.render.n10.write_bound.obligations.reaper_operations.recover
  vars:
    _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
  block:
    - name: Stat the destination lock (no link followed; read-only)
      vars:
        _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
      ansible.builtin.stat:
        path: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
        follow: false
        get_checksum: false
      register: _rh_reap_lock

    - name: Observe owned-scope entries when no destination lock exists
      ansible.builtin.find:
        paths: "{{ rh_reap_dest | dirname }}"
        patterns:
          - ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}.*"
          - ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}.*"
          - ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}.*"
        file_type: "{{ _sc.scope_types }}"
        hidden: "{{ _sc.true }}"
        recurse: "{{ _sc.false }}"
        follow: "{{ _sc.false }}"
      register: _rh_reap_unlocked_entries
      when: not _rh_reap_lock.stat.exists

    - name: Refuse recovery without an existing lock if any owned-scope object or unread path remains
      ansible.builtin.assert:
        that:
          - _rh_reap_unlocked_entries.files | length == _sc.zero
          - _rh_reap_unlocked_entries.skipped_paths | length == _sc.zero
        fail_msg: "{{ _sc.refusal }}: recovery cannot create an uncharged destination lock; preserve all observed objects and obligations"
        quiet: true
      when: not _rh_reap_lock.stat.exists

    - name: Bind proven empty recovery results only after the absent-lock scope is observed empty
      ansible.builtin.set_fact:
        _rh_reap_mv: "{{ _sc.empty_loop_result }}"
        _rh_reap_rm: "{{ _sc.empty_loop_result }}"
        _rh_reap_rmrec: "{{ _sc.empty_loop_result }}"
      when: not _rh_reap_lock.stat.exists

    - name: Apply the preserved holder and view proofs under the existing destination lock
      when: _rh_reap_lock.stat.exists or _rh_reap_app.kind == 'local'
      block:
        - name: Read the destination lock back (no link followed; read-only)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.stat:
            path: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
            follow: false
            get_checksum: false
          register: _rh_reap_lock_rb

        - name: Refuse a destination lock outside the declared custody (RH-STAGING-LOCK-CUSTODY; preserved, never chmod-ed)
          vars:
            _lf: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.lock_file }}"
            _s: "{{ _rh_reap_lock_rb.stat }}"
          ansible.builtin.assert:
            that:
              - _lf.owner == 'acting_uid' and _lf.existing.owner == 'acting_uid'
              - _s.exists
              - _s.isreg and not _s.islnk
              - _s.uid == rh_reap_uid
              - not _s.wgrp and not _s.woth
              - _rh_reap_lock.stat.exists or _s.mode == _lf.mode
            fail_msg: >-
              REFUSED {{ _lf.refusal }} (RH-STAGING-LOCK-CUSTODY) on {{ inventory_hostname }}: the destination lock
              {{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ rh.controller.bootstrap.bundle.staging_retention.lease.lock_suffix }}
              must be a regular file (not a link) owned by uid {{ rh_reap_uid }}, not group/other-writable, and mode {{ _lf.mode }}
              when created by this run (found {{ _s | dict2items | selectattr('key', 'in', ['exists', 'isreg', 'islnk', 'uid', 'mode']) | items2dict | to_json }};
              pre-existing={{ _rh_reap_lock.stat.exists }}). It is preserved (never recreated or chmod-ed); nothing was reaped or reserved.
            quiet: true

          when: _rh_reap_lock.stat.exists

        - name: List this destination's staging, reaping and lease entries (any type; no links followed)
          vars:
            _bn: "{{ rh.controller.bootstrap.bundle }}"
          ansible.builtin.find:
            paths: "{{ rh_reap_dest | dirname }}"
            patterns:
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.reaping_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_retention.lease.lease_infix }}.*"
            file_type: any
            hidden: true
            recurse: false
            follow: false
          register: _rh_reap_top

        - name: List every descendant of each candidate directory (no links followed)
          ansible.builtin.find:
            paths: "{{ _rh_reap_top.files | selectattr('isdir') | rejectattr('islnk') | map(attribute='path') | list }}"
            file_type: any
            hidden: true
            recurse: true
            follow: false
          register: _rh_reap_desc
          when: _rh_reap_top.files | selectattr('isdir') | rejectattr('islnk') | list | length > 0

        - name: Read every owned lease record in scope (regular, this uid, not group/other-writable; read-only)
          vars:
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop: >-
            {{ _rh_reap_top.files | selectattr('isreg') | rejectattr('islnk') | selectattr('uid', 'equalto', rh_reap_uid)
               | rejectattr('wgrp') | rejectattr('woth') | map(attribute='path') | select('search', '/' ~ (_lp | regex_escape) ~ '[^/]+$') | sort }}
          register: _rh_reap_recs
          failed_when: false

        - name: Parse the lease records (strict shape before JSON; a malformed record is no record)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
            _shape: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.lease_shape }}"
            _keys: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.record_fields | list | sort }}"
          ansible.builtin.set_fact:
            _rh_reap_lease_rows: >-
              {%- set ns = namespace(m={}) -%}
              {#- route op1p: a looped task always registers `results` (an empty loop registers []); an unread record (no
                  `content`) is no record: membership, never a substituted empty text -#}
              {%- for r in _rh_reap_recs.results -%}
                {%- set t = (r.item | basename)[(_lp | length):] -%}
                {%- if 'content' in r and not ('failed' in r and r.failed) and (r.content | b64decode) is match(_shape) -%}{%- set d = r.content | b64decode | from_json -%}
                  {%- if ((d.keys() | sort | list) == _keys or (d.keys() | sort | list) == ((_keys + (rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.witness_fields | list)) | sort)) and d.token == t and d.schema == _lz.record_schema and t is match(_lz.token_regex)
                         and d.pid is match('^[1-9][0-9]*$') and d.start is match('^[0-9]+$') and d.uid is match('^[0-9]+$')
                         and d.machine is match('^[0-9a-f]{32}$') and d.boot is match('^[0-9a-f]{32}$')
                         and d.pidns is match(_lz.ns_regex) and d.pidns is match('^pid:') and d.cgroupns is match(_lz.ns_regex) and d.cgroupns is match('^cgroup:')
                         and t == 'L' ~ d.machine ~ '-' ~ d.boot ~ '-' ~ d.uid ~ '-' ~ d.pid ~ '-' ~ d.start
                         and d.cgroup_b64 is match('^(?:[A-Za-z0-9+/]{4})+(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$|^[A-Za-z0-9+/]{2}==$|^[A-Za-z0-9+/]{3}=$')
                         and (d.cgroup_b64 | b64decode) is match('^/') -%}
                    {%- set ns.m = ns.m | combine({t: d}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}{{ ns.m }}

        - name: Project complete lease identities separately from durable creation witnesses
          vars:
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
          ansible.builtin.set_fact:
            _rh_reap_recmap: >-
              {%- set ns = namespace(rows=_sc.empty_mapping) -%}
              {%- for token, lease in _rh_reap_lease_rows.items() -%}
                {%- set row = namespace(value=_sc.empty_mapping) -%}
                {%- for field in _sc.identity_fields -%}{%- set row.value = row.value | combine({field: lease[field]}) -%}{%- endfor -%}
                {%- set ns.rows = ns.rows | combine({token: row.value}) -%}
              {%- endfor -%}{{ ns.rows }}
            _rh_reap_witnessmap: >-
              {%- set ns = namespace(rows=_sc.empty_mapping) -%}
              {%- for token, lease in _rh_reap_lease_rows.items() -%}
                {%- if (_sc.witness_fields.keys() | reject('in', lease) | list | length) == _sc.zero -%}
                  {%- if lease.staging_dev is match(_sc.decimal_ere) and lease.staging_inode is match(_sc.decimal_ere)
                      and lease.staging_uid == lease.uid and lease.staging_perms == _sc.staging_mode_perms
                      and lease.staging_type == _sc.directory_type and lease.staging_path is match(rh.controller.bootstrap.path_admission.regex) -%}
                    {%- set row = namespace(value=_sc.empty_mapping) -%}
                    {%- for field in _sc.witness_fields -%}{%- set row.value = row.value | combine({field: lease[field]}) -%}{%- endfor -%}
                    {%- set ns.rows = ns.rows | combine({token: row.value}) -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}{{ ns.rows }}

        # route op1s (C1 SR922i; codex 933 / 935: THIS file is the single dead-holder remover, the lease revoker `recovery`):
        # the obligation registry of this host is READ here (dead_holder.select, s64 :8639-8640, :8672; r51 :7144-7190) so
        # that (a) no lease record of a token that still has an obligation record, or whose registry state is not known, is
        # released (release_order [obligation_record, lease_record], s64 :8941-8945, r51 :7191), and (b) a dead holder's
        # record is recovered by the declared recover program (task below the reaping removal). The words are read through
        # rh.controller.entry_generation.render.n10.write_bound (pinned whole at load, r51 :6990-7191); a changed word refuses
        # here instead of being half-honoured (the B N13 pattern). Nothing is written by these tasks.
        - name: Admit the dead-holder recovery words this file implements (membership, parent before child; nothing reaped)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.assert:
            that:
              - "'entry_generation' in rh.controller and 'render' in rh.controller.entry_generation and 'n10' in rh.controller.entry_generation.render"
              - "'write_bound' in rh.controller.entry_generation.render.n10 and rh.controller.entry_generation.render.n10.write_bound is mapping"
              - "['obligations', 'lifetime'] | reject('in', rh.controller.entry_generation.render.n10.write_bound) | list | length == 0"
              - "['registry', 'registry_applicability', 'lock_from', 'record_fields', 'recovery_path_roles', 'commands', 'transaction', 'unaccountable'] | reject('in', rh.controller.entry_generation.render.n10.write_bound.obligations) | list | length == 0"
              # route op1w (C1 SR922l, codex 938 / 939): registry_hosts (s50 :7764-7772) is WITHDRAWN and not read.
              # route op1x (C1 SR922m / SR922n / SR922o; replaces the op1w PENDING-C1-SR922M-STORAGE-VIEW reading): the registry
              # applicability word (op1x: s55 :7834-7896, comments :7769-7833; r42 pinned it whole, :6884-6909) is read WHOLE as this file
              # implements it: placement, identity, views (nested_mounts, local_fs_types, owner / subject / per / other_type),
              # not_applicable_requires, known_empty, one_kernel, cross_kernel, owner_destinations, effects and unobservable.
              # Every value is pinned to the reading implemented below; another value refuses here, never half-honoured.
              # route op1y / op1z (C1 SR922p, then SR922q / SR922q2 / SR922r / SR922s / SR922t: s64 :7978-8248 with comments :7913-7977 /
              # :7990-8019 / :8024-8027 / :8032-8039 / :8060-8080 / :8106-8113 / :8121-8129 / :8130-8175; r51 pins it whole,
              # :6991-7061; route op2c retarget): views now carry type_vocabulary + local_fs_domain (replacing local_fs_types), subject
              # [reap_destination, affected_parent_entries], admission_only [reap_destination_parent], affected_parent_entries and
              # nested_mounts.select_subject; one_kernel compares the new subject and keys filesystem_identity by domain value;
              # + observation_boundary. Each is pinned BY VALUE below. route op1z (C1 SR922r, s64 nested_mounts.admit :8028,
              # comment :8024-8027, r51 :6998; one_kernel.pairs s64 :8081-8092, comment :8060-8080, r51 :7013-7020): admit only
              # qualifies a nested mount as a nested_view; the overlap test is one_kernel.pairs, the complete subject-side x
              # owner-side pair set the decision below builds (closes PENDING-C1-SR922R-PAIR-SET).
              - "rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability is mapping"
              - "['owner', 'states', 'placement', 'identity', 'views', 'not_applicable_requires', 'known_empty', 'one_kernel', 'cross_kernel', 'owner_destinations', 'effects', 'unobservable', 'observation_boundary'] | reject('in', rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability) | list | length == 0"
              - rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.owner == 'n13_publishing_host'
