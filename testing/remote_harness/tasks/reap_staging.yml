              - rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.recovery_prepare_program.output.success_rc == rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.statuses.success
              - rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.recovery_prepare_program.record_must_remain == rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.true
              - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.program.template_from == ['obligations', 'transaction', 'program_template_rel']
              - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.program.mode == 'recover'
              - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.program.params == ['registry_dir', 'lock_name', 'token', 'record_sha256', 'staging', 'reaping', 'local_temp', 'remote_temp', 'verdict']
              - (rh.controller.entry_generation.render.n10.write_bound.obligations.recovery_path_roles | sort) == ['local_temp', 'remote_temp', 'staging']
              # the recovery lock runs the SAME declared flock as reap_lock (rh_reap_flock), the program the SAME declared sh as
              # lock_create (rh_reap_sh): the caller's identity-admitted paths of those tools
              - rh.controller.entry_generation.render.n10.write_bound.obligations.commands.recovery_lock.tool == _lz.reap_lock.tool
              - rh.controller.entry_generation.render.n10.write_bound.obligations.commands.program.shell_tool == rh.controller.entry_generation.render.n10.write_bound.obligations.commands.lock_create.shell_tool
              # the registry root (the B N13 derivation, successor-13 :1027-1028): <rh_repo_root>/<root_rel>/<sub_roots[sub]>/<rel>
              - "'rh_repo_root' in vars and rh_repo_root is string and rh_repo_root is match(rh.controller.bootstrap.path_admission.regex)"
              - "'root_rel' in rh.controller.bootstrap.work_roots and 'sub_roots' in rh.controller.bootstrap.work_roots"
              - rh.controller.entry_generation.render.n10.write_bound.obligations.registry.sub in rh.controller.bootstrap.work_roots.sub_roots
            fail_msg: >-
              REFUSED {{ _lz.refusal }} on {{ inventory_hostname }}: reap_staging.yml implements the dead-holder recovery words
              write_bound.obligations (registry, registry_applicability, lock_from, record_fields, recovery_path_roles, commands recovery_lock / program /
              busy_rc_from, transaction program_template_rel / lstat / temp_name / grammar / record_parse, unaccountable),
              registry_applicability (whole: owner, states, placement, identity, views, not_applicable_requires, known_empty,
              one_kernel, cross_kernel, owner_destinations, effects, unobservable, observation_boundary; views with
              type_vocabulary / local_fs_domain / affected_parent_entries), obligations.refused_before_record,
              write_bound.locations fs_type_probe_args / fs_type_probe_tool / storage.measure_at, lease boot_id_path / machine_id_path,
              relock.boot_id, record_grammar staging_name / staging_placeholders <random>, os_tools stat / findmnt / readlink with their required_by
              labels (staging_reap, staging_reap_subject), one_kernel canonical_re and pairs, nested_mounts.admit, observation_boundary
              reobserve_then_mutate_one_command with local_context and namespace_probe.of_segments, write_bound.lifetime (dead_holder with
              relock.verdict and output, release_order) and base_env.LC_ALL exactly as declared, and needs rh_repo_root; the failed `assertion` names the first word that differs. Nothing was reaped or reserved.
            quiet: true

        - name: Bind this host's obligation registry (derived; nothing read or written)
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
          ansible.builtin.set_fact:
            _rh_reap_rg: >-
              {%- set sep = _bs.path_admission.separator -%}
              {%- set lk = namespace(v=_bs) -%}{%- for k in _ob.lock_from -%}{%- set lk.v = lk.v[k] -%}{%- endfor -%}
              {%- set rd = [rh_repo_root, _bs.work_roots.root_rel, _bs.work_roots.sub_roots[_ob.registry.sub], _ob.registry.rel] | join(sep) -%}
              {{ {'dir': rd, 'lock_name': lk.v, 'lock': rd ~ sep ~ lk.v} }}

        # route op1w (C1 SR922l registry_applicability, now s64 :7913-8248, pinned whole r51 :6991-7061, route op2c retarget;
        # codex 938 C1-TARGET-NONE-APPLICABILITY; replaces the op1v PENDING-C1-REGISTRY-APPLICABILITY branch): ONE registry owner, the
        # N13 publishing host = the run controller (placement.owner run_controller). The owner registry is READ ON THE OWNER in
        # every launch context, never on the reap destination host:
        #   local (genesis_launch; the play host IS the controller by the derived launch context): the reads below, on the
        #     play host, with the acting uid rh_reap_uid (the op1s reading, unchanged);
        #   delegated (a decided context): reap_staging_controller_registry.yml, the same three reads delegated to the
        #     declared controller binding rh_controller_target with the declared TASK vars (the codex 931 include pattern),
        #     compared with the controller run's own uid (_rh_lease_rec.uid, read on the controller at lease derivation).
        # The two variants carry distinct registers and are merged by context; the decision below runs ONE classifier.
        # rh_reap_remote, host names, inventory aliases and the call role select nothing here (placement.names_are_identity
        # false, call_role_is_identity false). Whether the owner registry APPLIES to this destination is decided after the
        # controller observations (the applicability task before the recovery); this file never reads it as known-none from a
        # role. No physical separation, fixed host name or profile ban is required. route op1x (C1 SR922m-o; replaces the op1w
        # codex 939 observation-only reading): in a decided context the delegated owner reading is CONSULTED exactly when the
        # storage-view evaluation (the applicability task before the recovery) decides this destination applicable, and maps
        # to registry state none when it decides not_applicable; otherwise it stays unknown (reported, retained).
        - name: Read the owner's obligation registry on the controller (delegated task set; decided context only)
          ansible.builtin.include_tasks: reap_staging_controller_registry.yml
          when: _rh_reap_app.kind == 'delegated'

        - name: Stat the obligation registry (genesis play host = the owner; no link followed; read-only)
          ansible.builtin.stat:
            path: "{{ _rh_reap_rg.dir }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          register: _rh_reap_regst_g
          when: _rh_reap_app.kind == 'local'
          failed_when: false

        - name: List every entry of the obligation registry (genesis play host; hidden included; no link followed; read-only)
          ansible.builtin.find:
            paths: "{{ _rh_reap_rg.dir }}"
            file_type: any
            hidden: true
            recurse: false
            follow: false
          register: _rh_reap_regls_g
          when:
            - _rh_reap_app.kind == 'local'
            - "'stat' in _rh_reap_regst_g"
            - _rh_reap_regst_g.stat.exists
            - _rh_reap_regst_g.stat.isdir
            - not _rh_reap_regst_g.stat.islnk
          failed_when: false

        - name: Read every registry record named by a token (genesis play host; regular, this uid; read-only; a failed read is unknown)
          ansible.builtin.slurp:
            src: "{{ item }}"
          # membership: a registry that was not listed yields no read (its state is decided unknown or absent below, never
          # from this list); a listed entry is read when its name is a token
          loop: >-
            {%- set ns = namespace(p=[]) -%}
            {%- if 'files' in _rh_reap_regls_g -%}
              {%- for e in _rh_reap_regls_g.files -%}
                {%- if e.isreg and not e.islnk and e.uid == rh_reap_uid and (e.path | basename) is match(rh.controller.bootstrap.bundle.staging_retention.lease.token_regex) -%}
                  {%- set ns.p = ns.p + [e.path] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}{{ ns.p | sort }}
          register: _rh_reap_regrd_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        # route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING; C1 lifetime.absence_observation, s67 :8610-8658, comment :8585-8609,
        # :8616-8624, :8630-8643; needs_listing admission_scan, observe_record_absent; nonzero_listing unknown; glob_decides
        # never): the listing tool is absence_observation.listing_from's leaf_listing.tool (os_tools.find, required_by seed,
        # staging_reap, staging_reap_subject, s67 :3453), ADMITTED on the play host by its declared identity before use (the
        # same identity rule as _rh_reap_fid_g): _rh_reap_hfid / _rh_reap_hfok. It serves every play-host listing this file
        # reads as a release or readback: the owner registry here (genesis), the recovered records' re-observation and the
        # scope re-list after the reap. An unadmitted tool lists nothing: each such absence is unknown (retained / refused).
        # On a delegated (subject) run the play host is the reap target; the declared identity is the one os_tools row (open
        # item CPL-OP2D-FIND-IDENTITY-PER-HOST: a target whose find differs from the declared sha256 is refused fail-closed at
        # the re-list readback, never read as absent).
        - name: Admit the declared listing tool by identity on this play host (absence_observation listing_from leaf_listing.tool; read-only)
          ansible.builtin.stat:
            path: "{{ rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
            get_mime: false
            get_attributes: false
          register: _rh_reap_hfid
          failed_when: false

        - name: Bind whether the listing tool is admitted on this play host (derived)
          vars:
            _fr: "{{ rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool] }}"
          ansible.builtin.set_fact:
            _rh_reap_hfok: >-
              {{ 'stat' in _rh_reap_hfid and not ('failed' in _rh_reap_hfid and _rh_reap_hfid.failed) and _rh_reap_hfid.stat.exists
                 and _rh_reap_hfid.stat.isreg and not _rh_reap_hfid.stat.islnk and 'checksum' in _rh_reap_hfid.stat
                 and _fr.identity is mapping and 'kind' in _fr.identity and 'sha256' in _fr.identity
                 and _fr.identity.kind == 'file_sha256' and _rh_reap_hfid.stat.checksum == _fr.identity.sha256 }}

        # route op2d: the owner registry's COMPLETE listing (genesis play host = the owner), with the leaf_listing argv, locale
        # and stdout rule: the registry itself when its stat shows a real directory, its parent when the stat shows it absent
        # (not_found only). The decision below reads the registry state known only with this listing: an absent registry is
        # absent only when its parent's listing (status 0, plain names) does not list its name; a present registry is known only
        # when every listed name was also returned by the ansible.builtin.find reading (a name listed but not stat-ed is
        # unaccountable: listed_but_unstatable admission_scan), since that module skips entries whose lstat fails.
        - name: List the obligation registry completely (genesis play host; the registry, or its parent when observed absent; admitted find)
          vars:
            _ll: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_ll.tool].path, (_rh_reap_rg.dir if _rh_reap_regst_g.stat.exists else (_rh_reap_rg.dir | dirname))] + _ll.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap[_ll.env_from[0]][_ll.env_from[1]] }}"
          register: _rh_reap_regcl_g
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - _rh_reap_hfok
            - "'stat' in _rh_reap_regst_g and not ('failed' in _rh_reap_regst_g and _rh_reap_regst_g.failed)"
            - (not _rh_reap_regst_g.stat.exists) or (_rh_reap_regst_g.stat.isdir and not _rh_reap_regst_g.stat.islnk)

        - name: Bind the owner registry observations of the context's variant (and the owner uid they are compared with)
          ansible.builtin.set_fact:
            _rh_reap_regst: "{{ _rh_reap_regst_d if _rh_reap_app.kind == 'delegated' else _rh_reap_regst_g }}"
            _rh_reap_regls: "{{ _rh_reap_regls_d if _rh_reap_app.kind == 'delegated' else _rh_reap_regls_g }}"
            _rh_reap_regrd: "{{ _rh_reap_regrd_d if _rh_reap_app.kind == 'delegated' else _rh_reap_regrd_g }}"
            _rh_reap_regcl: "{{ _rh_reap_regcl_d if _rh_reap_app.kind == 'delegated' else _rh_reap_regcl_g }}"
            _rh_reap_ouid: "{{ _rh_lease_rec.uid if _rh_reap_app.kind == 'delegated' else (rh_reap_uid | string) }}"

        - name: Refuse an owner registry read set that is not one registered result per task (a looped task registers `results`)
          ansible.builtin.assert:
            that:
              - "'results' in _rh_reap_regrd"
              - _rh_reap_ouid is string and _rh_reap_ouid is match('^[0-9]+$')
            fail_msg: >-
              REFUSED {{ rh.controller.bootstrap.bundle.staging_retention.lease.refusal }} on {{ inventory_hostname }}: the owner
              registry record reads registered no `results` (keys {{ _rh_reap_regrd | list | to_json }}) or the owner uid
              '{{ _rh_reap_ouid }}' is not decimal; nothing was reaped or reserved.
            quiet: true

        # The registry state (s64 dead_holder.select, unaccountable.when :8531-8534, record_grammar :8301-8329; failed_or_unknown
        # retained): `known` only on the controller destination when the registry is observed ABSENT, or a real directory of
        # this uid (not group / other-writable) whose listing succeeded with nothing skipped and every entry attributable (the
        # lock, a record named by a token, a registry temp `<lead><token><trail>`); any other entry makes it unknown. `held`:
        # every token with a record or a registry temp (its obligation is still charged). `recs`: the ACCOUNTABLE records whose
        # destination is rh_reap_dest; an unaccountable one stays held and is never recovered. `lock_ok`: the registry lock is
        # present as a regular file of this uid (recovery never creates it). route op1w: "this uid" is the OWNER uid
        # (_rh_reap_ouid, bound above) and the reading is the OWNER registry's in every context. This reading is not yet the
        # state of this destination: the applicability task (before the recovery) maps it through registry_applicability.effects.
        # route op1u (CPL-OP1S-RECORD-PARSE-JOIN; s64 transaction.record_parse :8504-8509, unaccountable.when :8533-8534,
        # grammar.decimal_ere :8472): every record runs the declared checks in check_order; the FIRST failing check is its
        # reason (`unaccountable`: token -> check), and an unaccountable record is held (retained). not_one_json_object is the
        # read rule (no line terminator, the read byte count equal to the listed lstat size), the strict canonical-JSON shape,
        # every key counted once (a duplicate key collapses on parse, so the key count of the text must equal the parsed
        # count) and the device-map keys strictly ascending as text. Device keys fully match decimal_ere; values are JSON
        # non-negative integers. staging_not_token_staging_name reads the record's own destination and (route op1x, C1 SR922o
        # addendum 2, s64 :8326) requires the suffix after `.<dest>.<staging_infix>.<token>.` to FULLY match the declared
        # <random> ere (eight of [a-z0-9_]; the op1w prefix-and-length test admitted any suffix). The select
        # (destination == rh_reap_dest) is applied after, to accountable records only.
        - name: Decide the obligation registry state of this destination (dead_holder.select; unknown retains)
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
            _sp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}."
            # canonical JSON (separators ', ' and ': '): a top-level object of string / non-negative integer / one-level object
            # values whose strings hold no quote, backslash or control character -- so from_json cannot fail on a shaped text
            _jshape: '^[{]"[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*|[{](?:"[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*)(?:, "[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*))*)?[}])(?:, "[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*|[{](?:"[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*)(?:, "[^"\\\x00-\x1f]*": (?:"[^"\\\x00-\x1f]*"|0|[1-9][0-9]*))*)?[}]))*[}]$'
            _dec: "^({{ rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.grammar.decimal_ere }})$"
          ansible.builtin.set_fact:
            _rh_reap_reg: >-
              {%- set ns = namespace(known=false, lock_ok=false, held=[], recs={}, all={}, why={}, sz={}) -%}
              {%- set tn = _ob.transaction.temp_name -%}{%- set rf = _ob.record_fields -%}{%- set rp = _ob.transaction.record_parse -%}
              {#- route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING; absence_observation s67 :8610-8658): the complete listing of the
                  registry (or of its parent, for an absent registry). cl.ok: an integer status 0, stdout empty or LF-ended, every
                  record a plain name (non-empty, no path_admission.separator); nonzero_listing and every other shape: unknown.
                  A non-UTF-8 name makes the module response refused (no integer rc): unknown. -#}
              {%- set cl = namespace(ok=false, names=[]) -%}
              {%- if 'rc' in _rh_reap_regcl and _rh_reap_regcl.rc is integer and _rh_reap_regcl.rc is not boolean and _rh_reap_regcl.rc == 0
                     and not ('skipped' in _rh_reap_regcl and _rh_reap_regcl.skipped) and 'stdout' in _rh_reap_regcl and _rh_reap_regcl.stdout is string
                     and (_rh_reap_regcl.stdout == '' or _rh_reap_regcl.stdout[-1:] == '\n') -%}
                {%- set cl.names = _rh_reap_regcl.stdout.split('\n')[:-1] if _rh_reap_regcl.stdout != '' else [] -%}
                {%- set cl.ok = cl.names | select('equalto', '') | list | length == 0
                                and cl.names | select('search', _bs.path_admission.separator | regex_escape) | list | length == 0 -%}
              {%- endif -%}
              {%- if 'stat' in _rh_reap_regst and not ('failed' in _rh_reap_regst and _rh_reap_regst.failed) -%}
                {%- set s = _rh_reap_regst.stat -%}
                {#- route op2d: an absent registry (not_found only) is known absent only when the complete listing of its parent
                    does not list its name (observe: a listed name is present, never absent) -#}
                {%- if not s.exists -%}{%- set ns.known = cl.ok and (_rh_reap_rg.dir | basename) not in cl.names -%}
                {#- route op2d: a present registry is known only when its complete listing names exactly the entries the
                    ansible.builtin.find reading returned (each once): a name listed but not returned (listed_but_unstatable
                    admission_scan: unaccountable) or listed twice (record_seen_twice: unaccountable) leaves it unknown.
                    route recovery (ROUTE-OP2D-CASEFOLDED-REGISTRY-UNIQUENESS; C1 path_admission.case_sensitive s68 :4463,
                    comment :4460-4462; r55 path_admission_grammar :3643 enum [true]; temp_name s68 :8457): Ansible unique
                    defaults to case-insensitive, so two valid temp names sharing a token with suffixes aB3dE5fG and
                    Ab3dE5fG collapsed. uniqueness reads unique(case_sensitive=<path_admission.case_sensitive>) after the
                    typed boolean-truth admission of that declared word; exact duplicates still collapse.
                    sort(case_sensitive=true) on the next line is inherited private-true debt, unchanged. -#}
                {%- elif s.isdir and not s.islnk and (s.uid | string) == _rh_reap_ouid and not s.wgrp and not s.woth
                       and 'files' in _rh_reap_regls and not ('failed' in _rh_reap_regls and _rh_reap_regls.failed)
                       and 'skipped_paths' in _rh_reap_regls and _rh_reap_regls.skipped_paths | length == 0
                       and cl.ok and cl.names | unique(case_sensitive=_bs.path_admission.case_sensitive) | list | length == cl.names | length
                       and (cl.names | sort(case_sensitive=true) | list) == (_rh_reap_regls.files | map(attribute='path') | map('basename') | sort(case_sensitive=true) | list) -%}
                  {%- set ns.known = true -%}
                  {%- for e in _rh_reap_regls.files -%}
                    {%- set n = e.path | basename -%}
                    {%- set tt = n[(tn.lead | length):((n | length) - (tn.trail | length))] -%}
                    {%- if n == _rh_reap_rg.lock_name -%}
                      {%- if e.isreg and not e.islnk and (e.uid | string) == _rh_reap_ouid -%}{%- set ns.lock_ok = true -%}{%- endif -%}
                    {%- elif n is match(_lz.token_regex) -%}{%- set ns.held = ns.held + [n] -%}{%- set ns.sz = ns.sz | combine({n: e.size}) -%}
                    {%- elif n.startswith(tn.lead) and (n | length) > ((tn.lead | length) + (tn.trail | length))
                             and n[((n | length) - (tn.trail | length))] == tn.trail[0] and tt is match(_lz.token_regex) -%}{%- set ns.held = ns.held + [tt] -%}
                    {%- else -%}{%- set ns.known = false -%}
                    {%- endif -%}
                  {%- endfor -%}
                {%- endif -%}
              {%- endif -%}
              {%- if ns.known -%}
                {%- for r in _rh_reap_regrd.results -%}
                  {%- set t = r.item | basename -%}
                  {%- set c = namespace(why='', ok=true, x='', d={}) -%}
                  {%- for chk in rp.check_order -%}
                    {%- if c.why == '' -%}
                      {%- if chk == 'unreadable' -%}
                        {%- set c.ok = 'content' in r and not ('failed' in r and r.failed) and t in ns.sz -%}
                        {%- if c.ok -%}{%- set c.x = r.content | b64decode -%}{%- endif -%}
                      {%- elif chk == 'not_one_json_object' -%}
                        {%- set pad = (r.content[-2:] | regex_findall('=') | length) -%}
                        {%- set c.ok = ('\n' not in c.x) and (((r.content | length) // 4) * 3 - pad) == ns.sz[t] and c.x is match(_jshape) -%}
                        {%- if c.ok -%}
                          {%- set c.d = c.x | from_json -%}
                          {%- set kc = namespace(n=(c.d | length), order=true) -%}
                          {%- for k, v in c.d.items() -%}
                            {%- if v is mapping -%}
                              {%- set kc.n = kc.n + (v | length) -%}
                              {%- if k in [rf.device_bytes, rf.metadata_copies, rf.destination_metadata_inodes, rf.destination_metadata_bytes, rf.destination_lease_encoded_bytes] and (v.keys() | list) != (v.keys() | sort(case_sensitive=true) | list) -%}{%- set kc.order = false -%}{%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set c.ok = kc.order and ((c.x.split('": ') | length) - 1) == kc.n -%}
                        {%- endif -%}
                      {%- elif chk in ['keys_not_record_fields', 'keys_not_admitted_record_family'] -%}
                        {%- set c.ok = (c.d.keys() | sort | list) in [(_ob.record_families.v1_six_fields['keys'] | sort), (_ob.record_families.v2_enveloped['keys'] | sort)] -%}
                      {%- elif chk == 'device_bytes_not_device_to_nonneg_integer' -%}
                        {%- set m = c.d[rf.device_bytes] -%}
                        {%- set c.ok = m is mapping and m.keys() | reject('match', _dec) | list | length == 0
                                       and m.values() | reject('integer') | list | length == 0 and m.values() | select('boolean') | list | length == 0 -%}
                      {%- elif chk == 'metadata_copies_not_device_to_nonneg_integer' -%}
                        {%- set m = c.d[rf.metadata_copies] -%}
                        {%- set c.ok = m is mapping and m.keys() | reject('match', _dec) | list | length == 0
                                       and m.values() | reject('integer') | list | length == 0 and m.values() | select('boolean') | list | length == 0 -%}
                      {%- elif chk in ['destination_metadata_inodes_not_device_to_nonneg_integer', 'destination_metadata_bytes_not_device_to_nonneg_integer', 'destination_lease_encoded_bytes_not_device_to_nonneg_integer'] -%}
                        {%- set field = chk.split('_not_')[0] -%}
                        {%- if field in c.d -%}
                          {%- set m = c.d[field] -%}
                          {%- set c.ok = m is mapping and m.keys() | reject('match', _dec) | list | length == 0 and m.values() | reject('integer') | list | length == 0 and m.values() | select('boolean') | list | length == 0 and m.values() | select('lt', 0) | list | length == 0 -%}
                        {%- else -%}
                          {%- set c.ok = (c.d.keys() | sort | list) == (_ob.record_families.v1_six_fields['keys'] | sort) -%}
                        {%- endif -%}
                      {%- elif chk == 'token_not_token_regex' -%}
                        {%- set c.ok = c.d[rf.token] is string and c.d[rf.token] is match(_lz.token_regex) -%}
                      {%- elif chk == 'token_not_file_name' -%}
                        {%- set c.ok = c.d[rf.token] == t -%}
                      {%- elif chk == 'destination_not_admitted_path' -%}
                        {%- set c.ok = c.d[rf.destination] is string and c.d[rf.destination] is match(_bs.path_admission.regex) -%}
                      {%- elif chk == 'paths_not_role_to_admitted_path' -%}
                        {%- set c.ok = c.d[rf.paths] is mapping and (c.d[rf.paths].keys() | sort | list) == (_ob.recovery_path_roles | sort | list)
                                       and c.d[rf.paths].values() | reject('string') | list | length == 0
                                       and c.d[rf.paths].values() | reject('match', _bs.path_admission.regex) | list | length == 0 -%}
                      {%- elif chk == 'staging_not_token_staging_name' -%}
                        {%- set sg = c.d[rf.paths].staging -%}
                        {%- set fam = _ob.record_families.v1_six_fields if (c.d.keys() | sort | list) == (_ob.record_families.v1_six_fields['keys'] | sort) else _ob.record_families.v2_enveloped -%}
                        {%- set final_placeholder = fam.staging_name.form.split('.')[-1] -%}
                        {%- set sp = '.' ~ (c.d[rf.destination] | basename) ~ '.' ~ _bs.bundle.staging_infix ~ '.' ~ t ~ '.' -%}
                        {#- route op1x (C1 SR922o addendum 2): the text after the prefix is EXACTLY the declared <random> (its ere,
                            fully matched; the form ends with <random>, so nothing follows it) -#}
                        {%- set c.ok = (sg | dirname) == (c.d[rf.destination] | dirname) and (sg | basename).startswith(sp)
                                       and ((sg | basename)[(sp | length):]) is match('^' ~ fam.staging_placeholders[final_placeholder].ere ~ '$') -%}
                      {%- elif chk == 'lease_not_lease_record_fields' -%}
                        {%- set c.ok = c.d[rf.lease] is mapping and (c.d[rf.lease].keys() | sort | list) == (_lz.record_fields | list | sort)
                                       and c.d[rf.lease].values() | reject('string') | list | length == 0 -%}
                      {%- elif chk == 'lease_token_not_record_token' -%}
                        {%- set c.ok = c.d[rf.lease].token == t -%}
                      {%- else -%}{%- set c.ok = false -%}
                      {%- endif -%}
                      {%- if not c.ok -%}{%- set c.why = chk -%}{%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if c.why != '' -%}{%- set ns.why = ns.why | combine({t: c.why}) -%}
                  {%- else -%}
                    {#- route op1x (views.owner / per every_outstanding_record): EVERY accountable record's destination and paths,
                        whatever its destination, are the owner views of the applicability evaluation -#}
                    {%- set ns.all = ns.all | combine({t: {'destination': c.d[rf.destination], 'paths': c.d[rf.paths]}}) -%}
                    {%- if c.d[rf.destination] == rh_reap_dest -%}
                      {%- set ns.recs = ns.recs | combine({t: {'sha': c.x | hash('sha256'), 'paths': c.d[rf.paths], 'lease': c.d[rf.lease]}}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {{ {'known': ns.known, 'lock_ok': ns.lock_ok, 'held': ns.held | unique | list, 'recs': ns.recs, 'all': ns.all, 'unaccountable': ns.why} }}

        - name: Read the complete destination-parent listing for record-only lease absence
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _ll: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing }}"
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
          ansible.builtin.command:
            argv: "{{ [_bs.os_tools[_ll.tool].path, rh_reap_dest | dirname] + _ll.args }}"
            strip_empty_ends: "{{ _sc.false }}"
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_record_only_listing
          changed_when: "{{ _sc.false }}"
          failed_when: "{{ _sc.false }}"
          when: _rh_reap_hfok

        - name: Observe each missing-lease candidate without following symlinks
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
          ansible.builtin.stat:
            path: "{{ (rh_reap_dest | dirname) ~ _bs.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ _lz.lease_infix ~ _sc.lease_name_separator ~ item }}"
            follow: "{{ _sc.false }}"
            get_checksum: "{{ _sc.false }}"
            get_mime: "{{ _sc.false }}"
            get_attributes: "{{ _sc.false }}"
          loop: "{{ _rh_reap_reg.recs.keys() | reject('in', _rh_reap_recmap) | list }}"
          register: _rh_reap_record_only_stat
          failed_when: "{{ _sc.false }}"

        - name: Admit record-only identities only with complete observed lease absence
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
            _lp: "{{ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ _lz.lease_infix ~ _sc.lease_name_separator }}"
            _r: "{{ _rh_reap_record_only_listing }}"
          ansible.builtin.set_fact:
            _rh_reap_record_only: >-
              {%- set ns = namespace(m=_sc.empty_mapping, names=[], complete=_sc.false) -%}
              {%- if _rh_reap_reg.known and _rh_reap_reg.lock_ok and _rh_reap_hfok
                  and 'rc' in _r and _r.rc is integer and _r.rc is not boolean and _r.rc == _sc.statuses.success
                  and 'stdout' in _r and _r.stdout is string and (_r.stdout == '' or _r.stdout[-1:] == '\n') -%}
                {%- set ns.names = _r.stdout.split('\n')[:-1] if _r.stdout != '' else [] -%}
                {%- set ns.complete = ns.names | select('equalto', '') | list | length == _sc.zero
                    and ns.names | select('search', _bs.path_admission.separator | regex_escape) | list | length == _sc.zero
                    and ns.names | unique(case_sensitive=_bs.path_admission.case_sensitive) | list | length == ns.names | length -%}
              {%- endif -%}
              {%- if ns.complete -%}
                {%- for row in _rh_reap_record_only_stat.results -%}
                  {%- if 'stat' in row and 'exists' in row.stat and row.stat.exists is boolean and not row.stat.exists
                        and not ('failed' in row and row.failed) and (_lp ~ row.item) not in ns.names -%}
                    {%- set d = _rh_reap_reg.recs[row.item].lease -%}
                    {%- if (d.keys() | sort | list) == (_sc.identity_fields | sort) and d.values() | reject('string') | list | length == _sc.zero
                        and d.token == row.item and d.schema == _lz.record_schema and d.token is match(_lz.token_regex)
                        and d.pid is match(_lz.proc_paths.pid_placeholder.ere) and (d.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == d.pid
                        and d.start is match(_sc.decimal_ere) and d.uid is match(_sc.decimal_ere)
                        and d.machine is match('^[0-9a-f]{32}$') and d.boot is match('^[0-9a-f]{32}$')
                        and d.pidns is match(_lz.ns_regex) and d.pidns is match('^pid:') and d.cgroupns is match(_lz.ns_regex) and d.cgroupns is match('^cgroup:')
                        and d.token == 'L' ~ d.machine ~ '-' ~ d.boot ~ '-' ~ d.uid ~ '-' ~ d.pid ~ '-' ~ d.start
                        and d.cgroup_b64 is match('^(?:[A-Za-z0-9+/]{4})+(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$|^[A-Za-z0-9+/]{2}==$|^[A-Za-z0-9+/]{3}=$')
                        and (d.cgroup_b64 | b64decode) is match('^/') -%}
                      {%- set ns.m = ns.m | combine({row.item: d}) -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}{{ ns.m }}

        - name: Extend holder observations with proven record-only identities while retaining original lease observations
          ansible.builtin.set_fact:
            _rh_reap_recmap: "{{ _rh_reap_record_only | combine(_rh_reap_recmap) }}"

        - name: Select the records whose controller writers can be observed from here (same machine, uid and boot)
          ansible.builtin.set_fact:
            _rh_reap_probe: >-
              {{ _rh_reap_recmap.values() | selectattr('machine', 'equalto', _rh_lease_rec.machine)
                 | selectattr('uid', 'equalto', _rh_lease_rec.uid) | selectattr('boot', 'equalto', _rh_lease_rec.boot)
                 | selectattr('pidns', 'equalto', _rh_lease_rec.pidns) | selectattr('cgroupns', 'equalto', _rh_lease_rec.cgroupns)
                 | sort(attribute='token') | list }}

        # route op2c (seat NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 2; C1 relock.absence_proof ancestors from_root_through_leaf_parent,
        # each_ancestor, roots, s64 :8739-8743, comment :8720-8728; ancestor_unproven unknown :8814): per observed holder, the
        # chain of EVERY ancestor of each leaf, from the declared root itself down to the leaf's parent, in path order:
        #   pid: the record_holder_presence leaf <proc_root> + join + of_segments (pid placeholder replaced). Its chain is
        #     <proc_root> plus each proper prefix of of_segments; for the declared ['<pid>'] it is [<proc_root>] alone: the
        #     parent is proc_root itself, and the word exempts nothing, so proc_root is proven like any ancestor. A pid that
        #     does not fully match pid_placeholder.ere has NO chain (unknown, retained; nothing is read with it).
        #   cgroup: the leaf <cgroup_root><decoded>. The decoded path splits on path_admission.separator into '' and non-empty
        #     segments; its chain is <cgroup_root> plus <cgroup_root> joined with each proper prefix of the segments, so the last
        #     entry is the leaf's parent. A decoded path that is not that shape, or route op2c addendum (C1 SR922w
        #     leaf_listing_names.ansible_consumer leaf_name_not_utf8 unknown, s64 :8812, comment :8790-8808) that is not valid
        #     UTF-8, has NO chain: the cgroup leaf is unknown BEFORE any listing (its listing item is skipped). ansible-core
        #     2.19.11 b64decode (plugins/filter/core.py 88cbcaeb :513-517) decodes with to_text utf-8 surrogate_or_strict, i.e.
        #     surrogateescape on Python 3: each byte of an invalid sequence becomes ONE lone surrogate U+DC80..U+DCFF, and a
        #     valid UTF-8 text never decodes to a lone surrogate; so "not valid UTF-8" is exactly "holds a char in that range".
        # The chains are taken HERE, once, before either context's observations, so both variants probe the same paths and
        # the decision compares each result with the chain it was taken for.
        - name: Bind each observed holder's ancestor chains (relock.absence_proof.each_ancestor; derived; nothing read)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.set_fact:
            _rh_reap_anc: >-
              {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
              {%- set sp = '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$' -%}
              {%- set sg = _lz.proc_paths.reaper_reads.record_holder_presence.of_segments -%}
              {%- set ns = namespace(paths={}, probes=[]) -%}
              {%- for p in _rh_reap_probe -%}
                {%- set ch = namespace(pid=[], cgroup=[]) -%}
                {%- if p.pid is string and p.pid is match(_lz.proc_paths.pid_placeholder.ere) and (p.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == p.pid -%}
                  {%- set ch.pid = [_lz.proc_root] -%}
                  {%- for j in range(1, sg | length) -%}
                    {%- set ch.pid = ch.pid + [_lz.proc_root ~ _lz.proc_paths.join ~ (sg[:j] | map('regex_replace', sp, p.pid) | join(_lz.proc_paths.join))] -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set dc = p.cgroup_b64 | b64decode -%}
                {%- set parts = dc.split(sep) -%}
                {%- if dc is not search('[\\udc80-\\udcff]') and parts | length > 1 and parts[0] == '' and parts[1:] | select('equalto', '') | list | length == 0 -%}
                  {%- set ch.cgroup = [_lz.cgroup_root] -%}
                  {%- for j in range(2, parts | length) -%}
                    {%- set ch.cgroup = ch.cgroup + [_lz.cgroup_root ~ (parts[:j] | join(sep))] -%}
                  {%- endfor -%}
                {%- endif -%}
                {%- set ns.paths = ns.paths | combine({p.token: {'pid': ch.pid, 'cgroup': ch.cgroup}}) -%}
                {%- for k, l in [['pid', ch.pid], ['cgroup', ch.cgroup]] -%}
                  {%- for a in l -%}{%- set ns.probes = ns.probes + [{'t': p.token, 'k': k, 'p': a}] -%}{%- endfor -%}
                {%- endfor -%}
              {%- endfor -%}{{ {'paths': ns.paths, 'probes': ns.probes} }}

        # route op1p: each controller observation in its two context variants (delegated: the binding and TASK vars of the
        # decided context; local: the genesis play host itself, no delegation, no task var); distinct registers, merged below.
        # route op1q (codex 931 ROUTE_DELEGATION_BEFORE_SKIP): the four delegated holder observations are ONE task set,
        # included only under the decided context (see the namespace include above); the genesis variants stay below.
        - name: Observe the recorded holders on the controller (delegated task set; decided context only)
          ansible.builtin.include_tasks: reap_staging_controller_holders.yml
          when: _rh_reap_app.kind == 'delegated'

        # route op2a (C1 SR922t proc_paths.reaper_reads.record_holder_stat, s64 :480; pid_placeholder :431; route op2b
        # retarget): the record's lease
        # pid (pid_from record_lease_pid) must FULLY match pid_placeholder.ere before it is put in any path; a mismatch skips
        # the item (reaper_read_mismatch: unknown -- a skipped result has neither `stat` nor `content`, so the decision keeps
        # the token unknown and retains it). The stat read is built from of_segments. route op2b (C1 SR922u
        # reaper_reads.record_holder_presence, s64 :487, comment :482-486; closes CPL-OP2A-C1-PROC-PID-PRESENCE-PATH): the
        # presence probe is built from that word's of_segments with its follow word. ansible.builtin.stat (2.19.11
        # modules/stat.py :453-462) returns stat.exists false ONLY on FileNotFoundError and fails (no `stat` key) on any other
        # OSError; that is only the leaf_absent half (absent_when: not_found), and a failed, skipped or stat-less result stays
        # unknown (other_failure: unknown, retained). route op2b addendum 2 (C1 SR922v absent_also_requires, s64 :487; ruling
        # relock.absence_proof.leaf_listing s64 :8778-8789, comment :8744-8777): stat.exists false is NOT absence by itself (the
        # kernel answers ENOENT for a LIVE pid whose inode allocation fails, s64 :8747-8755). The decision below reads `gone`
        # only when that leaf_absent half holds AND the leaf_listing task below listed the proven parent completely (status
        # 0) with no record equal to the leaf name.
        - name: Observe each recorded holder process on the controller (genesis play host; stat; pid proven against pid_placeholder.ere)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.stat:
            path: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_presence.of_segments | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.pid) | join(_lz.proc_paths.join)) }}"
            follow: "{{ _lz.proc_paths.reaper_reads.record_holder_presence.follow }}"
            get_checksum: false
          loop: "{{ _rh_reap_probe }}"
          loop_control:
            label: "{{ item.token }}"
          register: _rh_reap_pid_g
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - item.pid is string and item.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.pid

        - name: Read each present holder's /proc stat on the controller (genesis play host; reaper_reads.record_holder_stat; a failed or unproven read is UNKNOWN)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.slurp:
            src: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_stat.of_segments | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.pid) | join(_lz.proc_paths.join)) }}"
          loop: "{{ _rh_reap_probe }}"
          loop_control:
            label: "{{ item.token }}"
          register: _rh_reap_pstat_g
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - item.pid is string and item.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.pid

        # route op2d (C1 SR922y relock.absence_proof.leaf_absent.ansible_consumer, s67 :8812, comment :8776-8803): the cgroup
        # leaf's absence observation is this no-follow stat, its follow read from the word (follow false); the decision reads
        # it absent only on absent_when exists_false (not_found only), failed or missing: unknown.
        - name: Observe each recorded cgroup and its parent on the controller (genesis play host)
          vars:
            _cr: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}"
          ansible.builtin.stat:
            path: "{{ _cr ~ (item.0.cgroup_b64 | b64decode) if item.1 == 'self' else (_cr ~ (item.0.cgroup_b64 | b64decode)) | dirname }}"
            follow: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_absent.ansible_consumer.follow }}"
            get_checksum: false
          loop: "{{ _rh_reap_probe | product(['self', 'parent']) | list }}"
          loop_control:
            label: "{{ item.0.token }} {{ item.1 }}"
          register: _rh_reap_cg_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        # r3f R3E-WRITER-CONTAINMENT (codex-014047): the subtree proof is cgroup.events `populated` (cgroup v2: covers the
        # cgroup AND every descendant), never an empty direct cgroup.procs.
        - name: Read each present recorded cgroup's populated state on the controller (genesis play host; a failed read is UNKNOWN)
          ansible.builtin.slurp:
            src: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root ~ (item.cgroup_b64 | b64decode) }}/{{ rh.controller.bootstrap.bundle.staging_retention.lease.events_file }}"
          loop: "{{ _rh_reap_probe }}"
          loop_control:
            label: "{{ item.token }}"
          register: _rh_reap_cgev_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        # route op2b addendum 2 (C1 SR922v relock.absence_proof.leaf_listing, s64 :8778-8789, comment :8744-8777; r51
        # :7165-7172): the listing tool is the os_tools row the word names (tool find; os_tools.find required_by now names
        # staging_reap, s64 :3453), ADMITTED before use by its declared identity (os_tools_identity_before_use: the controller
        # file's sha256 equals identity.sha256), exactly as the stat / findmnt / readlink rows are admitted on the delegated
        # side. An unadmitted tool lists nothing: every listing item is skipped, registers no rc, and the leaf stays unknown.
        # ansible.builtin.find is NOT admitted for this (it skips walk errors and failed lstats), so the listing runs the
        # declared tool through ansible.builtin.command.
        # route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY): the same admission now covers the three tools the holder decision
        # runs, in this order: leaf_listing.tool (find), process_visibility.proc_mount_unrestricted.tool (findmnt) and
        # absence_proof.each_ancestor.type_probe.tool (stat); _rh_reap_ftok binds the names admitted, and each consumer task
        # runs only when its tool is in it (an unadmitted tool runs nothing: its items skip and its observation is unknown).
        - name: Admit the declared leaf-listing, visibility and ancestor-type tools by identity on the controller (genesis play host)
          vars:
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.stat:
            path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
            get_mime: false
            get_attributes: false
          loop:
            - "{{ _dh.relock.absence_proof.leaf_listing.tool }}"
            - "{{ _dh.relock.process_visibility.proc_mount_unrestricted.tool }}"
            - "{{ _dh.relock.absence_proof.each_ancestor.type_probe.tool }}"
          register: _rh_reap_fid_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        - name: Bind the controller tools admitted by identity for the holder observations (genesis play host; derived)
          ansible.builtin.set_fact:
            _rh_reap_ftok: >-
              {%- set ns = namespace(ok=[]) -%}
              {%- for r in _rh_reap_fid_g.results -%}
                {%- set row = rh.controller.bootstrap.os_tools[r.item] -%}
                {%- if 'stat' in r and not ('failed' in r and r.failed) and r.stat.exists and r.stat.isreg and not r.stat.islnk
                       and 'checksum' in r.stat and row.identity is mapping and 'kind' in row.identity and 'sha256' in row.identity
                       and row.identity.kind == 'file_sha256' and r.stat.checksum == row.identity.sha256 -%}
                  {%- set ns.ok = ns.ok + [r.item] -%}
                {%- endif -%}
              {%- endfor -%}{{ ns.ok }}
          when: _rh_reap_app.kind == 'local'

        # route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 1; C1 relock.process_visibility s64 :8868-8875, comment
        # :8844-8867, and relock.namespace.proc_view s64 :8919, comment :8883-8889): the visibility basis of a pid absence,
        # read in the SAME context (play host, user, connection) as the presence stat and the leaf listing:
        #   proc_view: <proc_root> + join + namespace.proc_view.of_segments ([self, status]) read by the module process itself;
        #     exactly `lines` lines start with line_prefix (NSpid:), each holding `fields_after_prefix` fields that fully match
        #     the field_grammar_from grammar (decimal_ere). One field proves <proc_root> is the procfs of the READER's own pid
        #     namespace (an ancestor namespace's procfs prints two or more). The pid half of the binding (readlink of
        #     <proc_root>/self/ns/pid equal to the record's pidns) is the existing comparison: _rh_lease_rec.pidns is the
        #     self_pidns link read in this same context (refused above unless equal to the holder's), and the decision below
        #     reads a holder only when its record pidns equals it.
        #   proc_mount_unrestricted: [os_tools[tool].path] + args + [<proc_root>] (target_from walks to lease.proc_root, pinned
        #     above), LC_ALL from base_env, stdout kept whole: exactly `rows` rows, the one OPTIONS field non-empty and holding
        #     no backslash, split on `split`, and every hidepid entry (an option named as an entry of hidepid_allowed, with or
        #     without a value) one of hidepid_allowed; no entry is allowed (hidepid_absent). Anything else is not this basis.
        - name: Read this observer's proc view status on the controller (genesis play host; relock.namespace.proc_view; read-only)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.slurp:
            src: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_dh.relock.namespace.proc_view.of_segments | join(_lz.proc_paths.join)) }}"
          register: _rh_reap_pvs_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        - name: Read the proc mount OPTIONS row on the controller (genesis play host; process_visibility.proc_mount_unrestricted; admitted findmnt)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.process_visibility.proc_mount_unrestricted.tool].path] + _dh.relock.process_visibility.proc_mount_unrestricted.args + [_lz.proc_root] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_pmo_g
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - _dh.relock.process_visibility.proc_mount_unrestricted.tool in _rh_reap_ftok

        # route op2d (NOTE-OP2C-PRELOCK-CGROUP-VIEW-BINDING; C1 relock.namespace.cgroup_view s67 :9113, all_required :9114,
        # dead_rule same_boot namespace_bound :9116): the cgroup half of the namespace binding, read in the SAME context as the
        # cgroup observations. argv [os_tools[program_tools[cgroup_view.role]].path] + cgroup_view.args + [<cgroup_root>]
        # (target_from walks to lease.cgroup_root, pinned above; the role's tool is the identity-admitted findmnt), LC_ALL from
        # base_env, stdout kept whole. The decision reads it bound (vb.cgv) only on an integer status 0 and exactly `rows`
        # LF-terminated rows, the row holding no backslash (escaped_field), split on `separator` into exactly len(fields)
        # non-empty fields (field_count_not_3, empty_field), with target equal to <cgroup_root> (target_equals cgroup_root),
        # fstype equal to cgroup_view.fstype and fsroot equal to cgroup_view.fsroot. Unbound, EVERY cgroup reading of this run
        # (absence and populated) is unknown, so no token is dead on the same boot: the owned / records classification, the mv
        # -T and rm -rf of an owned staging or reaping dir, the lease-record release and the recover program's verdict all need
        # it. The record's cgroupns equal to this reader's (the existing comparison) is the link half of the binding.
        - name: Read the cgroup mount TARGET, FSTYPE and FSROOT row on the controller (genesis play host; relock.namespace.cgroup_view; admitted findmnt)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.program_tools[_dh.relock.namespace.cgroup_view.role]].path] + _dh.relock.namespace.cgroup_view.args + [_lz.cgroup_root] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_cgv_g
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.program_tools[_dh.relock.namespace.cgroup_view.role] in _rh_reap_ftok

        # route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 2; C1 absence_proof.each_ancestor, s64 :8742): every ancestor of
        # _rh_reap_anc, in chain order, observed twice and never through a link:
        #   type_probe: [os_tools[tool].path] + args + [<ancestor>] (stat -c '%F' --, lstat: follows_links false), LC_ALL from
        #     base_env, stdout kept whole; proven only on status 0 with stdout exactly `equals` (directory) plus one LF.
        #   searchable: ansible.builtin.stat with follow = type_probe.follows_links; proven only when it exists, is a directory,
        #     is not a link and `executable` is true. ansible-core 2.19.11 modules/stat.py (b2a23204) :468-469 sets executable
        #     from os.access(path, X_OK), the access(2) X_OK check that `test -x` makes; route runs no shell on the controller
        #     (os_tools.sh is required_by seed only), so this is route's consumer form of searchable {test: -x} (open item
        #     CPL-OP2C-C1-SEARCHABLE-CONSUMER-FORM; access(2) uses the real uid, test -x the effective one, equal for a
        #     module process that is not set-id).
        # An item that skipped, failed or is missing leaves its leaf's chain unproven: unknown (ancestor_unproven), retained.
        - name: Probe each ancestor's type on the controller (genesis play host; absence_proof.each_ancestor.type_probe; admitted stat)
          vars:
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.absence_proof.each_ancestor.type_probe.tool].path] + _dh.relock.absence_proof.each_ancestor.type_probe.args + [item.p] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          loop: "{{ _rh_reap_anc.probes }}"
          loop_control:
            label: "{{ item.t }} {{ item.k }} {{ item.p }}"
          register: _rh_reap_aty_g
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - _dh.relock.absence_proof.each_ancestor.type_probe.tool in _rh_reap_ftok

        - name: Observe each ancestor's searchability on the controller (genesis play host; absence_proof.each_ancestor.searchable; no link followed)
          vars:
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.stat:
            path: "{{ item.p }}"
            # route op2d (C1 SR922y each_ancestor.searchable.ansible_consumer, s67 :8806-8808): follow read through follow_from
            # ([type_probe, follows_links] under each_ancestor), on the same path as the type probe (same_path_as)
            follow: "{{ _dh.relock.absence_proof.each_ancestor[_dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.follow_from[0]][_dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.follow_from[1]] }}"
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: "{{ _rh_reap_anc.probes }}"
          loop_control:
            label: "{{ item.t }} {{ item.k }} {{ item.p }}"
          register: _rh_reap_asr_g
          failed_when: false
          when: _rh_reap_app.kind == 'local'

        # route op2b addendum 2 (C1 SR922v leaf_listing, s64 :8778-8789): ONE complete listing of each leaf's proven parent,
        # per recorded holder, in the order [pid, cgroup] (applies_to proc_pid_leaf, cgroup_leaf):
        #   - pid: the parent of the record_holder_presence leaf, <proc_root> plus every of_segments entry but the last (none
        #     for the declared ['<pid>']: the parent is proc_root itself); the leaf name is the last of_segments entry with the
        #     placeholder replaced by the record pid, proven against pid_placeholder.ere first (an unproven pid lists nothing:
        #     unknown, retained);
        #   - cgroup: the parent directory of <cgroup_root><decoded>; the leaf name is its last path component.
        # argv is [<os_tools[tool].path>, <parent>] + leaf_listing.args (start proven_leaf_parent, no literal flag here), env
        # LC_ALL from leaf_listing.env_from (base_env.LC_ALL), strip_empty_ends false so the LF record separators stay. The
        # decision reads the status and stdout only (stderr: not_parsed): status 0 and no record equal to the leaf name is
        # not_listed; a record equal to it is listed (present: the stat read then decides); any other status, a skipped item
        # or a record that is not a plain name (empty, or containing proc_paths.join) is unknown and retains.
        - name: List each recorded holder leaf's proven parent on the controller (genesis play host; absence_proof.leaf_listing)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _cr: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}"
          ansible.builtin.command:
            argv: >-
              {{ [rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path,
                  (_lz.proc_root ~ ((_lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_presence.of_segments[:-1] | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.0.pid) | join(_lz.proc_paths.join)))
                                       if _lz.proc_paths.reaper_reads.record_holder_presence.of_segments | length > 1 else ''))
                  if item.1 == 'pid' else ((_cr ~ (item.0.cgroup_b64 | b64decode)) | dirname)]
                 + rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.args }}
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[1]] }}"
          loop: "{{ _rh_reap_probe | product(['pid', 'cgroup']) | list }}"
          loop_control:
            label: "{{ item.0.token }} {{ item.1 }}"
          register: _rh_reap_lls_g
          changed_when: false
          failed_when: false
          # route op2c: the tool identity is read from _rh_reap_ftok (the looped admission above, same identity rule as op2b);
          # a leaf with no ancestor chain (an unproven pid, or a recorded cgroup path that is not valid UTF-8 or not the
          # declared shape: C1 SR922w leaf_name_not_utf8 unknown) is listed by nobody: unknown before any listing.
          when:
            - _rh_reap_app.kind == 'local'
            - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool in _rh_reap_ftok
            - item.1 == 'cgroup' or (item.0.pid is string and item.0.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.0.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.0.pid)
            - _rh_reap_anc.paths[item.0.token][item.1] | length > 0

        # route op2d (CPL-OP2B-CGROUP-FIRST-ABSENT-SEGMENT; C1 SR923a relock.absence_proof.cgroup_first_absent_segment s67
        # :8935-9035, consumer :8961-9031 not_listed_by start candidate_k_minus_1, comment :8966-9012; leaf_listing :8847-8858
        # applies_to cgroup_first_absent_segment): ONE complete listing of EVERY entry of
        # each recorded cgroup's ancestor chain (_rh_reap_anc, k cgroup: <cgroup_root> down to the leaf's parent), in chain
        # order, with the same tool, argv shape, locale and stdout rule as the leaf listing above. The decision reads only the
        # listing of the entry just above the FIRST absent segment (that segment's proven parent); the leaf's own parent keeps
        # the leaf listing above. An entry that does not exist lists nothing useful (non-zero status: unknown) and is never
        # read, since only a parent proven a searchable real directory is consulted.
        - name: List each recorded cgroup's ancestor chain entries on the controller (genesis play host; absence_proof.leaf_listing for cgroup_first_absent_segment)
          vars:
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.absence_proof.leaf_listing.tool].path, item.p] + _dh.relock.absence_proof.leaf_listing.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[1]] }}"
          loop: "{{ _rh_reap_anc.probes | selectattr('k', 'equalto', 'cgroup') | list }}"
          loop_control:
            label: "{{ item.t }} {{ item.p }}"
          register: _rh_reap_als_g
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'local'
            - _dh.relock.absence_proof.leaf_listing.tool in _rh_reap_ftok

        - name: Bind the controller observations of the context's variant
          ansible.builtin.set_fact:
            _rh_reap_pid: "{{ _rh_reap_pid_d if _rh_reap_app.kind == 'delegated' else _rh_reap_pid_g }}"
            _rh_reap_pstat: "{{ _rh_reap_pstat_d if _rh_reap_app.kind == 'delegated' else _rh_reap_pstat_g }}"
            _rh_reap_cg: "{{ _rh_reap_cg_d if _rh_reap_app.kind == 'delegated' else _rh_reap_cg_g }}"
            _rh_reap_cgev: "{{ _rh_reap_cgev_d if _rh_reap_app.kind == 'delegated' else _rh_reap_cgev_g }}"

        - name: Refuse a controller observation set that is not one result per probe (a looped task registers `results`)
          ansible.builtin.assert:
            that:
              - "'results' in _rh_reap_pid and _rh_reap_pid.results | length == _rh_reap_probe | length"
              - "'results' in _rh_reap_pstat and _rh_reap_pstat.results | length == _rh_reap_probe | length"
              - "'results' in _rh_reap_cg and _rh_reap_cg.results | length == 2 * (_rh_reap_probe | length)"
              - "'results' in _rh_reap_cgev and _rh_reap_cgev.results | length == _rh_reap_probe | length"
              # route op2b addendum 2: the leaf listings of the context's variant, two per recorded holder [pid, cgroup]
              - "'results' in (_rh_reap_lls_d if _rh_reap_app.kind == 'delegated' else _rh_reap_lls_g) and (_rh_reap_lls_d if _rh_reap_app.kind == 'delegated' else _rh_reap_lls_g).results | length == 2 * (_rh_reap_probe | length)"
              # route op2c: the two ancestor observations of the context's variant, one result per chain entry
              - "'results' in (_rh_reap_aty_d if _rh_reap_app.kind == 'delegated' else _rh_reap_aty_g) and (_rh_reap_aty_d if _rh_reap_app.kind == 'delegated' else _rh_reap_aty_g).results | length == _rh_reap_anc.probes | length"
              - "'results' in (_rh_reap_asr_d if _rh_reap_app.kind == 'delegated' else _rh_reap_asr_g) and (_rh_reap_asr_d if _rh_reap_app.kind == 'delegated' else _rh_reap_asr_g).results | length == _rh_reap_anc.probes | length"
              # route op2d: the cgroup chain listings of the context's variant, one result per cgroup chain entry
              - "'results' in (_rh_reap_als_d if _rh_reap_app.kind == 'delegated' else _rh_reap_als_g) and (_rh_reap_als_d if _rh_reap_app.kind == 'delegated' else _rh_reap_als_g).results | length == _rh_reap_anc.probes | selectattr('k', 'equalto', 'cgroup') | list | length"
            fail_msg: >-
              REFUSED {{ rh.controller.bootstrap.bundle.staging_retention.lease.refusal }} on {{ inventory_hostname }}: the
              controller observations of {{ _rh_reap_probe | length }} recorded holders are incomplete (result keys
              {{ [_rh_reap_pid, _rh_reap_pstat, _rh_reap_cg, _rh_reap_cgev, (_rh_reap_lls_d if _rh_reap_app.kind == 'delegated' else _rh_reap_lls_g)] | map('list') | list | to_json }}); nothing was reaped or reserved.
            quiet: true

        # route op1x (MOVED from here; the op1w placement-only decision and its PENDING-C1-SR922M-STORAGE-VIEW branch are
        # replaced): the registry applicability of this destination (_rh_reap_appl) and its effect mapping (_rh_reap_regx) are
        # decided AFTER the controller and target writer quiescence and the reaping removals, immediately before the dead-holder
        # recovery (the storage-view block above that task), so the storage views are observed under the quiescence this file
        # already established and, on the subject, under the destination lock (NOTE-SEAT-SR922O-MOUNT-TIME-OF-CHECK there).
        # Nothing between here and there reads either fact.
        # route op2c (seat NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 1, measured in this file): this verdict is NOT only a
        # candidate selector for B's relock proof. A token `dead` here, with target quiescence, lets this file itself:
        #   - take an owned staging dir of that token out of the publish path and remove it (the classification task puts it in
        #     `owned` only when its verdict is dead and _rh_reap_quiet; the mv -T and rm -rf tasks then act under the
        #     destination lock, with no further liveness proof);
        #   - name that token's lease record as a release candidate (`records`), which the lease-record removal task removes
        #     when the registry state is known and holds no record of that token;
        #   - pass verdict dead to the recover program, where B's relock decides again under the registry lock (only this use
        #     is re-decided by B).
        # So a live holder read as dead here loses its staging. pid `gone` is therefore unclaimable without the visibility
        # basis (below), and both leaves need their ancestor chains.
        - name: Decide each token's controller writer state (dead only on positive, admitted observations)
          vars:
            _rec: "{{ rh.controller.bootstrap.bundle.staging_retention.recovery }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
          ansible.builtin.set_fact:
            _rh_reap_tok: >-
              {%- set me = _rh_lease_rec -%}{%- set ns = namespace(m={}) -%}
              {#- route op2c (item 1; C1 relock.namespace.proc_view s64 :8919 and process_visibility.proc_mount_unrestricted
                  s64 :8872): ONE visibility reading per run, of the context's variant. vb.view: the proc view status read
                  holds exactly proc_view.lines lines starting with line_prefix, each with fields_after_prefix fields that fully
                  match field_grammar_from (the decimal grammar, anchored whole text). vb.vis: the OPTIONS probe exited 0 with
                  an integer rc, its stdout is exactly `rows` LF-terminated rows, the one field is non-empty (empty_field) and
                  holds no backslash (escaped_field: contains_backslash), and every option of it named as an entry of
                  hidepid_allowed (the name before '=') is one of hidepid_allowed; none present is allowed (hidepid_absent).
                  A gid= option is not read: it only adds a group exempt from hidepid, so it never hides a process. -#}
              {%- set pvv = _dh.relock.namespace.proc_view -%}{%- set pmu = _dh.relock.process_visibility.proc_mount_unrestricted -%}
              {%- set dre = '^(' ~ rh.controller.entry_generation.render.n10.write_bound.obligations[pvv.field_grammar_from[0]][pvv.field_grammar_from[1]][pvv.field_grammar_from[2]] ~ ')$' -%}
              {%- set pvs = _rh_reap_pvs_d if _rh_reap_app.kind == 'delegated' else _rh_reap_pvs_g -%}
              {%- set pmo = _rh_reap_pmo_d if _rh_reap_app.kind == 'delegated' else _rh_reap_pmo_g -%}
              {%- set vb = namespace(view=false, vis=false, cgv=false) -%}
              {%- if 'content' in pvs and not ('failed' in pvs and pvs.failed) and not ('skipped' in pvs and pvs.skipped) -%}
                {%- set nl = (pvs.content | b64decode).split('\n') | select('match', pvv.line_prefix | regex_escape) | list -%}
                {%- set vf = namespace(ok=(nl | length == pvv.lines)) -%}
                {%- for l in nl -%}
                  {%- set fs = l[pvv.line_prefix | length:].split() -%}
                  {%- if not (fs | length == pvv.fields_after_prefix and fs | reject('match', dre) | list | length == 0) -%}{%- set vf.ok = false -%}{%- endif -%}
                {%- endfor -%}
                {%- set vb.view = vf.ok -%}
              {%- endif -%}
              {%- if 'rc' in pmo and pmo.rc is integer and pmo.rc is not boolean and pmo.rc == 0 and not ('skipped' in pmo and pmo.skipped)
                     and 'stdout' in pmo and pmo.stdout is string and pmo.stdout[-1:] == '\n' -%}
                {%- set rows = pmo.stdout[:-1].split('\n') -%}
                {%- if rows | length == pmu.rows and pmu.fields | length == 1 and rows[0] != '' and '\\' not in rows[0] -%}
                  {%- set hk = pmu.hidepid_allowed | map('regex_replace', '=.*$', '') | unique | list -%}
                  {%- set hp = rows[0].split(pmu.split) | select('match', '^(' ~ (hk | map('regex_escape') | join('|')) ~ ')(=|$)') | list -%}
                  {%- set vb.vis = hp | reject('in', pmu.hidepid_allowed) | list | length == 0 -%}
                {%- endif -%}
              {%- endif -%}
              {#- route op2d (NOTE-OP2C-PRELOCK-CGROUP-VIEW-BINDING; C1 relock.namespace.cgroup_view s67 :9113): vb.cgv, the
                  cgroup view bound to <cgroup_root>. An integer status 0, stdout exactly `rows` LF-terminated rows, the row with
                  no backslash, split on `separator` into exactly len(fields) fields none empty, and the fields named target /
                  fstype / fsroot equal to <cgroup_root>, cgroup_view.fstype and cgroup_view.fsroot. Anything else is unbound. -#}
              {%- set cgw = _dh.relock.namespace.cgroup_view -%}
              {%- set cvo = _rh_reap_cgv_d if _rh_reap_app.kind == 'delegated' else _rh_reap_cgv_g -%}
              {%- if 'rc' in cvo and cvo.rc is integer and cvo.rc is not boolean and cvo.rc == 0 and not ('skipped' in cvo and cvo.skipped)
                     and 'stdout' in cvo and cvo.stdout is string and cvo.stdout[-1:] == '\n' -%}
                {%- set crows = cvo.stdout[:-1].split('\n') -%}
                {%- if crows | length == cgw.rows and crows | select('search', '[\\\\]') | list | length == 0 -%}
                  {%- set cfs = crows[0].split(cgw.separator) -%}
                  {%- if cfs | length == cgw.fields | length and cfs | select('equalto', '') | list | length == 0 -%}
                    {%- set vb.cgv = cfs[cgw.fields.index('target')] == _lz.cgroup_root and cfs[cgw.fields.index('fstype')] == cgw.fstype
                                     and cfs[cgw.fields.index('fsroot')] == cgw.fsroot -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endif -%}
              {%- for t, d in _rh_reap_recmap.items() -%}
                {%- if d.machine in _rec.retired_controller_machine_ids -%}{%- set v = 'dead' -%}
                {%- elif d.machine != me.machine or d.uid != me.uid -%}{%- set v = 'unknown' -%}
                {%- elif d.boot != me.boot -%}{%- set v = 'dead' -%}
                {%- elif d.pidns != me.pidns or d.cgroupns != me.cgroupns -%}{%- set v = 'unknown' -%}
                {%- else -%}
                  {%- set i = (_rh_reap_probe | map(attribute='token') | list).index(t) -%}
                  {%- set ps = _rh_reap_pid.results[i] -%}{%- set pr = _rh_reap_pstat.results[i] -%}
                  {%- set cs = _rh_reap_cg.results[2 * i] -%}{%- set cp = _rh_reap_cg.results[2 * i + 1] -%}{%- set cq = _rh_reap_cgev.results[i] -%}
                  {#- route op1p: an observation is read only when its key is present (membership); an absent one leaves the
                      state `unknown` (never dead), never a substituted empty value -#}
                  {#- route op2b addendum 2 (C1 SR922v relock.absence_proof.leaf_listing, s64 :8778-8789): each leaf's listing
                      verdict, read from status and stdout only (stderr: not_parsed). not_listed only on status 0 with every
                      record a plain name (non-empty, no proc_paths.join) and none equal to the leaf name (exact string, never a
                      pattern); listed when a record equals it; anything else (a skipped item, no rc, another status, an
                      unterminated last record, a record that is not a plain name) is unknown.
                      route recovery (ROUTE-OP2D-LISTED-LEAF-PRESENCE-DROPPED; s68 leaf_listing.listed present :8861): when a
                      complete listing names the leaf, the parser stores that declared present word (not a private listed
                      classifier). The cgroup outcome is consumed as leaf present below; a missing, skipped, failed or
                      incomplete listing stays unknown and invents neither presence nor absence. -#}
                  {%- set ll = (_rh_reap_lls_d if _rh_reap_app.kind == 'delegated' else _rh_reap_lls_g).results -%}
                  {%- set lv = namespace(v={}) -%}
                  {%- for k, lr in [['pid', ll[2 * i]], ['cgroup', ll[2 * i + 1]]] -%}
                    {#- route op2c addendum (C1 SR922w leaf_listing_names result_without_int_rc unknown, s64 :8812): the rc must
                        be an integer; a result refused by the strict UTF-8 response check carries none -#}
                    {%- if 'rc' in lr and lr.rc is integer and lr.rc is not boolean and 'stdout' in lr and lr.stdout is string and not ('skipped' in lr and lr.skipped) and lr.rc == 0
                           and (lr.stdout == '' or lr.stdout[-1:] == '\n') -%}
                      {#- an item that ran had its pid proven against pid_placeholder.ere by the listing task's `when` -#}
                      {%- set leaf = (_lz.proc_paths.reaper_reads.record_holder_presence.of_segments[-1] | regex_replace('^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', d.pid))
                                     if k == 'pid' else ((_lz.cgroup_root ~ (d.cgroup_b64 | b64decode)) | basename) -%}
                      {%- set recs = lr.stdout.split('\n')[:-1] if lr.stdout != '' else [] -%}
                      {%- if leaf in recs -%}{%- set lv.v = lv.v | combine({k: _dh.relock.absence_proof.leaf_listing.listed}) -%}
                      {%- elif recs | select('equalto', '') | list | length == 0 and recs | select('search', _lz.proc_paths.join | regex_escape) | list | length == 0 -%}
                        {%- set lv.v = lv.v | combine({k: 'not_listed'}) -%}
                      {%- else -%}{%- set lv.v = lv.v | combine({k: 'unknown'}) -%}
                      {%- endif -%}
                    {%- else -%}{%- set lv.v = lv.v | combine({k: 'unknown'}) -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {#- route op2b addendum 2: the start field index after the last ')' is relock.proc_stat.start_field minus
                      after_comm_first (s64 :8717: 22 - 3 = 19), read from the word, not a literal. -#}
                  {%- set sfi = rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.start_field - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.proc_stat.after_comm_first -%}
                  {#- route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 2; C1 absence_proof.each_ancestor, ancestor_unproven
                      unknown): per leaf, every entry of its _rh_reap_anc chain proven, in order, by BOTH observations of that
                      same path: the type probe exited 0 printing exactly type_probe.equals and one LF, and the no-follow stat
                      exists, is a directory, is not a link and is executable (searchable). An empty chain, a missing,
                      skipped, failed or reordered result, or any other value leaves the chain unproven. -#}
                  {%- set an = namespace(v={}) -%}
                  {%- for k in ['pid', 'cgroup'] -%}
                    {%- set ex = _rh_reap_anc.paths[t][k] -%}
                    {%- set ty = (_rh_reap_aty_d if _rh_reap_app.kind == 'delegated' else _rh_reap_aty_g).results | selectattr('item.t', 'equalto', t) | selectattr('item.k', 'equalto', k) | list -%}
                    {%- set sr = (_rh_reap_asr_d if _rh_reap_app.kind == 'delegated' else _rh_reap_asr_g).results | selectattr('item.t', 'equalto', t) | selectattr('item.k', 'equalto', k) | list -%}
                    {%- set ok = namespace(v=(ex | length > 0 and ty | length == ex | length and sr | length == ex | length
                                              and ty | map(attribute='item.p') | list == ex and sr | map(attribute='item.p') | list == ex)) -%}
                    {%- for r in ty -%}
                      {%- if not ('rc' in r and r.rc is integer and r.rc is not boolean and r.rc == 0 and not ('skipped' in r and r.skipped)
                                  and 'stdout' in r and r.stdout == _dh.relock.absence_proof.each_ancestor.type_probe.equals ~ '\n') -%}{%- set ok.v = false -%}{%- endif -%}
                    {%- endfor -%}
                    {#- route op2d (C1 SR922y each_ancestor.searchable.ansible_consumer, s67 :8806-8808, comment :8776-8803): searchable
                        is read through the word: the stat result ran, did not fail, and each proven_when entry holds (an entry
                        not_<key> requires stat.<key> false, any other entry requires stat.<key> true; a missing key fails) -#}
                    {%- for s in sr -%}
                      {%- if not ('stat' in s and not ('failed' in s and s.failed) and not ('skipped' in s and s.skipped)) -%}{%- set ok.v = false -%}
                      {%- else -%}
                        {%- for w in _dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.proven_when -%}
                          {%- set wk = w[4:] if w.startswith('not_') else w -%}
                          {%- if not (wk in s.stat and s.stat[wk] is sameas (not w.startswith('not_'))) -%}{%- set ok.v = false -%}{%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set an.v = an.v | combine({k: ok.v}) -%}
                  {%- endfor -%}
                  {#- route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY item 1; C1 process_visibility gates [stat_absent], unproven
                      unknown; dead_rule same_boot stat_proven_absent_with_visibility_or_start_differs, namespace_bound): pid
                      `gone` from a failed lookup needs, besides leaf_absent and not_listed, the bound proc view (vb.view), the
                      visibility basis (vb.vis) and the pid leaf's ancestor chain (proc_root itself). Without them it is
                      unknown. A present stat whose start differs is observed directly and needs no visibility basis, but it
                      is read through <proc_root>, so it is `gone` only on the bound proc view (an ancestor namespace's procfs
                      numbers pids differently); unbound it is unknown. A start that is equal is live either way (retains). -#}
                  {%- set pid = 'unknown' -%}
                  {%- if not ('failed' in ps and ps.failed) and 'stat' in ps and not ps.stat.exists and lv.v.pid == 'not_listed' -%}{%- set pid = 'gone' if (vb.view and vb.vis and an.v.pid) else 'unknown' -%}
                  {%- elif 'content' in pr and not ('failed' in pr and pr.failed) -%}
                    {%- set pf = ((pr.content | b64decode).split(')') | last).split() -%}
                    {%- if pf | length > sfi -%}{%- set pid = ('gone' if vb.view else 'unknown') if pf[sfi] != d.start else 'live' -%}{%- endif -%}
                  {%- endif -%}
                  {#- route op2d (CPL-OP2B-CGROUP-FIRST-ABSENT-SEGMENT, implemented; retargeted to C1 SR922z and SR923a
                      relock.absence_proof.cgroup_first_absent_segment.consumer, s67 :8961-9031, comment :8966-9012; supersedes
                      the op2c "NOT used" note this block carried). Only on the namespace-bound cgroup2 view (applies_on
                      namespace_bound_cgroup2_view: vb.cgv here, with the record cgroupns equal to this reader's, compared
                      above); unbound, the whole cgroup arm is unknown. Segments: the decoded recorded path split on
                      path_admission.separator, with a leading separator, no empty segment and valid UTF-8 (segment_admission;
                      _rh_reap_anc gives such a path a chain and every other path none). n = segment count = the chain length.
                      Candidate 0 is <cgroup_root>; candidate k is <cgroup_root> joined with the first k segments; candidates
                      0..n-1 are the _rh_reap_anc chain and candidate n is the leaf. Exactly (consumer k_range, candidate_zero,
                      candidate_zero_unproven, arm_decides, leaf_candidate, leaf_searchability, no_unproven_candidate_below_n,
                      leaf_observed_present, first_absent, gone_requires, not_listed_by, candidate_k_other, later_candidates):
                        - candidate 0 must be proven by each_ancestor before any k is examined; unproven: the arm is unknown.
                          No candidate -1 is ever formed.
                        - the arm decides only k in 1..n-1: the lowest such k not proven by each_ancestor (type probe
                          `directory` and searchable through its ansible_consumer, both on that same path). At it, gone requires
                          candidate k segment_absent (ansible_consumer_from walks to leaf_absent.ansible_consumer: no-follow
                          stat, exists false, not_found only) AND ONE complete leaf_listing of candidate k-1 (integer status 0,
                          empty or LF-ended stdout, plain-name records, none equal to segment k). Any other state of candidate k
                          is unknown; candidates after k are not consulted.
                        - no unproven candidate in 1..n-1: the arm is none (for n = 1, none when candidate 0 is proven).
                        - the leaf (k = n, leaf_k_to cgroup_leaf_rule) gives the leaf result present / gone / unknown; its
                          searchability is not read.
                        - C1 SR923a (s67 :9013-9026; supersedes the SR922z "leaf rule decides" reading): the verdict is the
                          pinned combination[arm][leaf]; an arm unknown at any k < n (candidate 0 unproven included) is
                          unknown whatever the leaf says; arm gone with a present or gone leaf is unknown.
                      kernel_basis: cgroup2 has no rename, and rmdir is refused while a cgroup is populated or has an online
                      child, so an absent segment means no cgroup exists through it. still_required pid_arm: the verdict below is
                      dead only with pid `gone` too, and both only on the bound views. -#}
                  {%- set cg = 'unknown' -%}
                  {%- set ex = _rh_reap_anc.paths[t].cgroup -%}
                  {%- set la = _dh.relock.absence_proof.leaf_absent.ansible_consumer -%}
                  {%- set fp = _dh.relock.absence_proof.cgroup_first_absent_segment.segment_absent.ansible_consumer_from -%}
                  {%- set sa = _dh.relock.absence_proof[fp[0]][fp[1]] -%}
                  {%- if vb.cgv -%}
                    {%- set ty = (_rh_reap_aty_d if _rh_reap_app.kind == 'delegated' else _rh_reap_aty_g).results | selectattr('item.t', 'equalto', t) | selectattr('item.k', 'equalto', 'cgroup') | list -%}
                    {%- set sr = (_rh_reap_asr_d if _rh_reap_app.kind == 'delegated' else _rh_reap_asr_g).results | selectattr('item.t', 'equalto', t) | selectattr('item.k', 'equalto', 'cgroup') | list -%}
                    {#- per candidate 0..n-1 (the ancestors), proven by each_ancestor: type probe `directory` + searchable read
                        through its ansible_consumer proven_when, both on that same path; a reordered or short result set proves
                        nothing (the chain lists stay aligned with ex or no candidate is proven) -#}
                    {%- set pc = namespace(v=[]) -%}
                    {%- if ex | length > 0 and ty | map(attribute='item.p') | list == ex and sr | map(attribute='item.p') | list == ex -%}
                      {%- for e in ex -%}
                        {%- set r = ty[loop.index0] -%}{%- set s = sr[loop.index0] -%}
                        {%- set pv = namespace(ok=('rc' in r and r.rc is integer and r.rc is not boolean and r.rc == 0 and not ('skipped' in r and r.skipped)
                                                   and 'stdout' in r and r.stdout == _dh.relock.absence_proof.each_ancestor.type_probe.equals ~ '\n'
                                                   and 'stat' in s and not ('failed' in s and s.failed) and not ('skipped' in s and s.skipped))) -%}
                        {%- if pv.ok -%}
                          {%- for w in _dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.proven_when -%}
                            {%- set wk = w[4:] if w.startswith('not_') else w -%}
                            {%- if not (wk in s.stat and s.stat[wk] is sameas (not w.startswith('not_'))) -%}{%- set pv.ok = false -%}{%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                        {%- set pc.v = pc.v + [pv.ok] -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {#- the arm (C1 SR923a k_range {from 1, to n_minus_1, leaf_k n, leaf_k_to cgroup_leaf_rule}, s67 :9013;
                        arm_results :9021; n = segment count = len(ex); arm_decides k_below_n): 'none', 'gone' or 'unknown'.
                        Candidate 0 unproven, or no aligned chain (an empty chain included): unknown (candidate_zero_unproven,
                        any_other_case), no k examined. first_absent: the lowest k in 1..n-1 whose candidate is not proven;
                        none (every candidate 0..n-1 proven; for n = 1 the range is empty and the arm is none). At that k:
                        segment_absent through ansible_consumer_from (exists false on a result that ran and did not fail) AND
                        the one complete listing of candidate k-1 not naming segment k: gone; any other state of candidate k:
                        unknown; later candidates not consulted. -#}
                    {%- set fa = namespace(arm='unknown', k=-1) -%}
                    {%- if pc.v | length == ex | length and pc.v | length > 0 and pc.v[0] -%}
                      {%- set fa.arm = 'none' -%}
                      {%- for j in range(1, ex | length) -%}
                        {%- if fa.k < 0 and not pc.v[j] -%}{%- set fa.k = j -%}{%- endif -%}
                      {%- endfor -%}
                      {%- if fa.k >= 1 -%}
                        {%- set fa.arm = 'unknown' -%}
                        {%- set ko = sr[fa.k] -%}
                        {%- set kabs = sa.absent_when == 'exists_false' and 'stat' in ko and not ('failed' in ko and ko.failed) and not ('skipped' in ko and ko.skipped)
                                       and 'exists' in ko.stat and ko.stat.exists is sameas false -%}
                        {%- set al = (_rh_reap_als_d if _rh_reap_app.kind == 'delegated' else _rh_reap_als_g).results | selectattr('item.t', 'equalto', t) | selectattr('item.p', 'equalto', ex[fa.k - 1]) | list -%}
                        {%- if kabs and al | length == 1 -%}
                          {%- set lr = al[0] -%}
                          {%- if 'rc' in lr and lr.rc is integer and lr.rc is not boolean and 'stdout' in lr and lr.stdout is string and not ('skipped' in lr and lr.skipped) and lr.rc == 0
                                 and (lr.stdout == '' or lr.stdout[-1:] == '\n') -%}
                            {%- set recs = lr.stdout.split('\n')[:-1] if lr.stdout != '' else [] -%}
                            {%- if (ex[fa.k] | basename) not in recs and recs | select('equalto', '') | list | length == 0
                                   and recs | select('search', rh.controller.bootstrap.path_admission.separator | regex_escape) | list | length == 0 -%}{%- set fa.arm = 'gone' -%}{%- endif -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                    {#- route op2d (C1 SR923a consumer leaf_results, s67 :9022): the leaf result of cgroup_leaf_rule (k = n;
                        leaf_searchability not_read: the chain holds no searchable stat of the leaf), one of present / gone /
                        unknown:
                          gone: absence_proof_with_chain (leaf_absent through its ansible_consumer AND the leaf listing of the
                            leaf's parent not_listed AND every candidate 0..n-1 proven, the parent stat a directory), or
                            events_unpopulated (the events read holds exactly one populated line, `populated 0`);
                          present: events_populated (that line is another value), or leaf_exists_events_not_read_unpopulated (the
                            leaf's no-follow stat exists, OR the complete parent listing names the leaf -- leaf_listing.listed
                            present, s68 :8861 -- and the events did not read unpopulated);
                          unknown: any other case. -#}
                    {%- set lf = namespace(v='unknown', pop1=false, route='') -%}
                    {%- set ev = namespace(v='') -%}
                    {%- if 'content' in cq and not ('failed' in cq and cq.failed) -%}
                      {%- set pop = (cq.content | b64decode).splitlines() | select('match', _lz.populated_regex) | list -%}
                      {%- if pop | length == 1 -%}{%- set ev.v = 'unpopulated' if pop[0] | trim == 'populated 0' else 'populated' -%}{%- endif -%}
                    {%- endif -%}
                    {#- route op2d addendum 4 (C1 SR923b): lf.route records WHICH leaf gone it is, `absent` (absence proof with
                        chain) or `unpopulated` (events populated 0), for dead_rule.cgroup_input's route cells below -#}
                    {%- if la.absent_when == 'exists_false' and 'stat' in cs and not ('failed' in cs and cs.failed) and not ('skipped' in cs and cs.skipped)
                           and 'exists' in cs.stat and cs.stat.exists is sameas false
                           and not ('failed' in cp and cp.failed) and 'stat' in cp and cp.stat.exists and cp.stat.isdir and lv.v.cgroup == 'not_listed'
                           and pc.v | length == ex | length and pc.v | length > 0 and pc.v | reject | list | length == 0 -%}
                      {%- set lf.v = 'gone' -%}{%- set lf.route = 'absent' -%}
                    {%- elif ev.v == 'unpopulated' -%}{%- set lf.v = 'gone' -%}{%- set lf.route = 'unpopulated' -%}
                    {%- elif ev.v == 'populated' -%}{%- set lf.v = 'present' -%}{%- set lf.pop1 = true -%}
                    {%- elif 'stat' in cs and not ('failed' in cs and cs.failed) and not ('skipped' in cs and cs.skipped) and 'exists' in cs.stat and cs.stat.exists is sameas true -%}
                      {%- set lf.v = 'present' -%}
                    {%- elif lv.v.cgroup == _dh.relock.absence_proof.leaf_listing.listed -%}
                      {#- route recovery (ROUTE-OP2D-LISTED-LEAF-PRESENCE-DROPPED; s68 leaf_listing.listed present :8861,
                          leaf_observed_present :9029, combination.gone.present unknown :9034): producer stored the declared
                          present word when the complete parent listing named the leaf; this branch compares to that same
                          word and assigns lf.v from it (no private listed literal). Arm gone + listed presence is unknown
                          (retained), never gone/unknown dead. Events unpopulated above still yields gone so the proven-chain
                          recovery stays. Incomplete/failed listings stay unknown and cannot invent presence or absence. -#}
                      {%- set lf.v = _dh.relock.absence_proof.leaf_listing.listed -%}
                    {%- endif -%}
                    {#- route op2d (C1 SR923a consumer combination, s67 :9023-9026, leaf_observed_present decides combination
                        :9020): the cgroup verdict is the pinned cell combination[arm][leaf], read from the word:
                          arm none: present -> present, gone -> gone, unknown -> unknown;
                          arm gone: present -> unknown, gone -> unknown, unknown -> gone;
                          arm unknown: every leaf result -> unknown (an unproven candidate 0 included).
                        The cell `present` is this file's `live` when the leaf's events read populated (as op2c read a
                        populated cgroup), and `unknown` when only the stat saw the leaf (op2c's reading too); both retain, and
                        only `gone` lets the pid arm make the token dead. -#}
                    {#- route op2d addendum 4 (C1 SR923b relock.dead_rule.cgroup_input, s68 :9136-9138, comment :9125-9135;
                        replaces the op2c :1648-1651 reading that set the cgroup gone on a `populated 0` read without the
                        chain): the cgroup term (cgroup_proven_absent_or_unpopulated) comes ONLY from cgroup_input, reached
                        through dead_holder.proof.holder_quiescent_cgroup_from (s68 :8722, the pre-lock lease_quiescence_proof
                        cgroup half). Its `from` walks under relock to the combination table; the term holds only when the cell
                        equals holds_on AND the pair [arm, leaf] is in a declared route: absent_route_cells ([none, gone] with
                        the leaf's absence proof, [gone, unknown] with the arm's) or unpopulated_route_cells ([none, gone] with
                        the leaf events populated 0). leaf_alone never: the leaf result never decides without the arm. Every
                        other cell retains (other_cells). -#}
                    {%- set qf = _dh.proof.holder_quiescent_cgroup_from -%}
                    {%- set cin = _dh[qf[0]][qf[1]][qf[2]] -%}
                    {%- set cell = _dh.relock[cin.from[0]][cin.from[1]][cin.from[2]][cin.from[3]][fa.arm][lf.v] -%}
                    {%- set pair = [fa.arm, lf.v] -%}
                    {%- set holds = cell == cin.holds_on
                                    and ((pair in cin.absent_route_cells and (fa.arm == 'gone' or lf.route == 'absent'))
                                         or (pair in cin.unpopulated_route_cells and lf.route == 'unpopulated')) -%}
                    {%- if holds -%}{%- set cg = 'gone' -%}
                    {%- elif cell == 'present' and lf.pop1 -%}{%- set cg = 'live' -%}
                    {%- else -%}{%- set cg = 'unknown' -%}
                    {%- endif -%}
                  {%- endif -%}
                  {%- set v = 'live' if (pid == 'live' or cg == 'live') else ('dead' if (pid == 'gone' and cg == 'gone') else 'unknown') -%}
                {%- endif -%}
                {%- set ns.m = ns.m | combine({t: v}) -%}
              {%- endfor -%}{{ ns.m }}

        # route op2a (C1 SR922t proc_paths.reaper_reads.self_cgroup, s64 :481): built from the word, no literal segment.
        - name: Read this reaper's own session cgroup on the target (target writer quiescence; read-only; reaper_reads.self_cgroup)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.slurp:
            src: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.self_cgroup.of_segments | join(_lz.proc_paths.join)) }}"
          register: _rh_reap_own
          failed_when: false
          when: rh_reap_remote

        # TARGET CONTAINMENT (r3f R3E-WRITER-CONTAINMENT; declared in target_quiescence): every target staging writer is a
        # module/command of some run, executed over that run's SSH connection, so pam_systemd places it in a logind session
        # scope `user-<uid>.slice/session-*.scope`. That scope is a ROOT-owned, non-delegated cgroup: a cgroup-v2 migration
        # needs write access to the common ancestor's cgroup.procs (user-<uid>.slice, admitted here as root-owned and not
        # owner-writable), so no owner process can leave it or enter another; the only other owner cgroup is the user manager
        # `user@<uid>.service`, where no staging-writing operation spawns anything (the seed's own systemd-run scope never
        # writes staging). ANY other child of the user slice, an unreadable events file, or an unproven own session is
        # UNKNOWN -> not quiescent (preserve). Session separation for THIS reaper: its own scope was opened by this run's own
        # ControlMaster connection (control path under the seed's fresh per-run ANSIBLE_HOME; ssh args pinned by
        # admit_transport), so every process in it descends from this run -- a stale writer of another run cannot be in it.
        - name: Admit the owner's user slice on the target (root-owned, not owner/group/other-writable; the containment premise)
          ansible.builtin.stat:
            path: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}/{{ rh.controller.bootstrap.bundle.staging_retention.target_quiescence.user_slice | replace('{uid}', rh_reap_uid | string) }}"
            follow: false
            get_checksum: false
          register: _rh_reap_uslice
          failed_when: false
          when: rh_reap_remote

        - name: List EVERY child cgroup of the owner's user slice on the target (session scopes and the user manager; any other is unknown)
          ansible.builtin.find:
            paths: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}/{{ rh.controller.bootstrap.bundle.staging_retention.target_quiescence.user_slice | replace('{uid}', rh_reap_uid | string) }}"
            file_type: directory
            recurse: false
            follow: false
            hidden: true
          register: _rh_reap_sessions
          failed_when: false
          when: rh_reap_remote

        - name: Read every owner session scope's populated state on the target (cgroup.events covers descendants; a failed read is not quiescent)
          vars:
            _tq: "{{ rh.controller.bootstrap.bundle.staging_retention.target_quiescence }}"
          ansible.builtin.slurp:
            src: "{{ item }}/{{ rh.controller.bootstrap.bundle.staging_retention.lease.events_file }}"
          # route op1p: no substituted empty list. `when` is evaluated before an undefined loop expression is raised (an
          # Ansible task-executor behavior, UNRUN here), so on the controller (rh_reap_remote false) and after a find that
          # registered no `files` the task is SKIPPED and registers no `results`; the decision below then reads membership
          # (absent results -> not quiescent on a target).
          loop: "{{ _rh_reap_sessions.files | map(attribute='path') | select('search', _tq.session_path_regex) | sort }}"
          register: _rh_reap_sev
          failed_when: false
          when:
            - rh_reap_remote
            - "'files' in _rh_reap_sessions"

        - name: Decide target writer quiescence (every session scope but this run's own unpopulated; nothing else in the slice)
          vars:
            _tq: "{{ rh.controller.bootstrap.bundle.staging_retention.target_quiescence }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _cr: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}"
          ansible.builtin.set_fact:
            # route op1p: every observation is read only after its key is present (membership); an absent one makes the
            # verdict false (not quiescent -> preserved), never a substituted empty value
            _rh_reap_quiet: >-
              {%- if not rh_reap_remote -%}{{ true }}{%- else -%}
              {%- set q = namespace(ok=('content' in _rh_reap_own and not ('failed' in _rh_reap_own and _rh_reap_own.failed)), own='') -%}
              {%- if q.ok -%}
                {%- set ownl = (_rh_reap_own.content | b64decode).splitlines() -%}
                {%- set q.ok = ownl | length == 1 and ownl[0] is match(_tq.own_cgroup_regex | replace('{uid}', rh_reap_uid | string)) -%}
                {%- if q.ok -%}{%- set q.own = _cr ~ ownl[0][3:] -%}{%- endif -%}
              {%- endif -%}
              {%- set q.ok = q.ok and 'stat' in _rh_reap_uslice and 'files' in _rh_reap_sessions and 'results' in _rh_reap_sev
                             and not ('failed' in _rh_reap_sessions and _rh_reap_sessions.failed) -%}
              {%- if q.ok -%}
                {%- set sl = _cr ~ '/' ~ (_tq.user_slice | replace('{uid}', rh_reap_uid | string)) -%}
                {%- set kids = _rh_reap_sessions.files | map(attribute='path') | list -%}
                {%- set sess = _rh_reap_sev.results | map(attribute='item') | list -%}
                {%- set others = _rh_reap_sev.results | rejectattr('item', 'equalto', q.own) | list -%}
                {%- set q.ok = _rh_reap_uslice.stat.exists and _rh_reap_uslice.stat.isdir
                               and _rh_reap_uslice.stat.uid == 0 and not _rh_reap_uslice.stat.wgrp and not _rh_reap_uslice.stat.woth
                               and q.own in sess
                               and kids | reject('in', sess) | reject('equalto', sl ~ '/' ~ (_tq.manager_unit | replace('{uid}', rh_reap_uid | string))) | list | length == 0
                               and others | select('contains', 'failed') | selectattr('failed') | list | length == 0
                               and others | reject('contains', 'content') | list | length == 0 -%}
                {%- if q.ok -%}
                  {%- set q.ok = others | map(attribute='content') | map('b64decode') | reject('search', _lz.unpopulated_regex) | list | length == 0 -%}
                {%- endif -%}
              {%- endif -%}
              {{ q.ok }}
              {%- endif -%}

        # route op1s (C1 SR922i; replaces the op1r PENDING-C1-WORD marker): the lease-record branch of THIS task (`ns.rec`)
        # still names a dead holder's lease record as a CANDIDATE on writer death plus target quiescence; it is no longer a
        # release decision. The lease-to-obligation association is the token (record name = lease token, s64 :8301-8329
        # lease.token equals_record_token): the release task below excludes every token the registry still holds
        # (_rh_reap_keep, release_order s64 :8941-8945) and every token when the registry state is not known. The staging and
        # reaping directory classification stays as it is; unknown and unrelated entries stay preserved.
        # route op1y (C1 SR922p refused_before_record, s64 :8299, pinned at admission: CONFIRMED, no new code): a first admission
        # refused before its record is written leaves an empty staging dir and its lease record in place
        # (left_to_next_owned_reap, immediate_release false). The next owned pass recovers them as pre_n13_record_less by this
        # task: the staging dir's token is judged by its lease verdict (_rh_reap_tok) and writer quiescence only, the registry is
        # not consulted for staging, and an empty dir has no descendant to fail the owned manifest. Its lease record is a
        # candidate on a dead holder plus quiescence, and the release task frees it when the registry state is known and holds
        # no record or temp of that token (release_order: after its staging is gone). In a decided context that release
        # additionally needs a known registry state of this destination (applicable, or not_applicable; a view-derived
        # not_applicable releases it only through the re-observe-then-mutate lease removal, observation_boundary s64 :8184).
        - name: Classify each candidate (owned manifest, lease record, controller and target quiescence)
          vars:
            _ret: "{{ rh.controller.bootstrap.bundle.staging_retention }}"
            _sp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}."
            _rp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}."
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
          ansible.builtin.set_fact:
            _rh_reap_sel: >-
              {%- set ns = namespace(o=[], l=[], b=[], u=[], rec=[], blk=[]) -%}
              {%- for c in _rh_reap_top.files | sort(attribute='path') -%}
                {%- set bn = c.path | basename -%}
                {%- if bn.startswith(_lp) -%}
                  {%- set t = bn[(_lp | length):] -%}
                  {%- if t in _rh_reap_recmap and c.isreg and not c.islnk and c.uid == rh_reap_uid and not c.wgrp and not c.woth -%}
                    {%- if _rh_reap_tok[t] == 'dead' and _rh_reap_quiet -%}{%- set ns.rec = ns.rec + [c.path] -%}{%- endif -%}
                  {%- else -%}{%- set ns.u = ns.u + [c.path] -%}{%- endif -%}
                {%- else -%}
                  {#- route op1p: a candidate directory exists only when the descendant listing ran, so its `files` and
                      `skipped_paths` are read by membership; an absent one leaves the candidate unproven (unknown, preserved) -#}
                  {%- set k = namespace(ok=(c.isdir and not c.islnk and c.uid == rh_reap_uid and not c.wgrp and not c.woth
                                            and 'files' in _rh_reap_desc and 'skipped_paths' in _rh_reap_desc)) -%}
                  {%- if k.ok -%}
                    {%- for d in _rh_reap_desc.files -%}{%- if d.path.startswith(c.path ~ '/') -%}{%- set rel = d.path[(c.path | length) + 1:] -%}
                      {%- if d.uid != rh_reap_uid or d.islnk or not (d.isdir or d.isreg)
                            or not (rel in rh_reap_members or rel is search(_ret.transient_member_regex)) -%}{%- set k.ok = false -%}{%- endif -%}
                    {%- endif -%}{%- endfor -%}
                    {%- for p in _rh_reap_desc.skipped_paths -%}{%- if (p ~ '/').startswith(c.path ~ '/') -%}{%- set k.ok = false -%}{%- endif -%}{%- endfor -%}
                  {%- endif -%}
                  {%- set rest = bn[(_sp | length):] if bn.startswith(_sp) else (bn[(_rp | length):] if bn.startswith(_rp) else '') -%}
                  {%- set t = rest.split('.')[0] if rest.split('.') | length == 2 else '' -%}
                  {%- set v = _rh_reap_tok[t] if t in _rh_reap_tok else 'unknown' -%}
                  {%- set witness = _rh_reap_witnessmap[t] if t in _rh_reap_witnessmap else rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.empty_mapping -%}
                  {%- set witness_path = c.path if bn.startswith(_sp) else (c.path | dirname) ~ '/' ~ _sp ~ rest -%}
                  {%- set witnessed = t in _rh_reap_witnessmap and witness.staging_path == witness_path
                        and (c.dev | string) == witness.staging_dev and (c.inode | string) == witness.staging_inode
                        and (c.uid | string) == witness.staging_uid and c.mode == rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.staging_mode -%}
                  {%- if not k.ok or not witnessed or v == 'unknown' -%}{%- set ns.u = ns.u + [c.path] -%}{%- set ns.blk = ns.blk + [t] -%}
                  {%- elif v == 'live' -%}{%- set ns.l = ns.l + [c.path] -%}{%- set ns.blk = ns.blk + [t] -%}
                  {%- elif not _rh_reap_quiet -%}{%- set ns.b = ns.b + [c.path] -%}{%- set ns.blk = ns.blk + [t] -%}
                  {%- else -%}{%- set ns.o = ns.o + [c.path] -%}{%- endif -%}
                {%- endif -%}
              {%- endfor -%}
              {{ {'owned': ns.o, 'live': ns.l, 'busy': ns.b, 'unknown': ns.u, 'records': ns.rec, 'blocked_tokens': ns.blk | unique | list} }}

        - name: Report every live, busy or unknown entry (preserved untouched, bytes charged)
          vars:
            _ret: "{{ rh.controller.bootstrap.bundle.staging_retention }}"
          ansible.builtin.debug:
            msg: >-
              {{ _ret.live_report }} {{ inventory_hostname }} {{ _rh_reap_sel.live }};
              {{ _ret.busy_report }} {{ inventory_hostname }} {{ _rh_reap_sel.busy }} (target writers not provably quiescent);
              {{ _ret.unknown_report }} {{ inventory_hostname }} {{ _rh_reap_sel.unknown }};
              recorded owners (machine, uid): {{ _rh_reap_recmap.values() | map(attribute='machine') | zip(_rh_reap_recmap.values() | map(attribute='uid')) | unique | list }}
          when: (_rh_reap_sel.live + _rh_reap_sel.busy + _rh_reap_sel.unknown) | length > 0

        - name: Take each reapable staging dir out of the publish path (flock -x -n on the destination lock; mv -T)
          vars:
            _bs: '{{ rh.controller.bootstrap }}'
            _wb: '{{ rh.controller.entry_generation.render.n10.write_bound }}'
            _sc: '{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}'
            _lz: '{{ rh.controller.bootstrap.bundle.staging_retention.lease }}'
            _sp: .{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}.
            _rp: .{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}.
            _lock: '{{ (rh_reap_dest | dirname) ~ _bs.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator
              ~ _lz.lock_suffix }}'
            _token: '{{ ((item | basename)[(_sp | length):] if (item | basename).startswith(_sp) else (item | basename)[(_rp | length):]).split(_sc.lease_name_separator)[_sc.zero]
              }}'
            _target: '{{ (item | dirname) ~ _bs.path_admission.separator ~ _rp ~ (item | basename)[(_sp | length):] }}'
            _text: '{{ lookup(''ansible.builtin.template'', rh_repo_root ~ _bs.path_admission.separator ~ _sc.template_rel, template_vars={''rh_sc_bs'':
              _bs, ''rh_sc_wb'': _wb, ''rh_sc_effect'': _sc.empty_mapping, ''rh_sc_operation'': _sc.operations.relocate, ''rh_sc_witness'': _rh_reap_witnessmap[_token],
              ''rh_sc_source_path'': item, ''rh_sc_target_path'': _target}) }}'
          ansible.builtin.command:
            argv: '{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string,
              _lock, rh_reap_sh, _wb.obligations.commands.program.inline_arg, _text, _wb.obligations.commands.program.arg0, item, _target] }}'
            strip_empty_ends: '{{ _sc.false }}'
          environment:
            LC_ALL: '{{ rh.controller.bootstrap.base_env.LC_ALL }}'
          loop: '{{ _rh_reap_sel.owned | select(''search'', ''/'' ~ (_sp | regex_escape) ~ ''[^/]+$'') | list }}'
          register: _rh_reap_mv
          changed_when: _rh_reap_mv.rc == _sc.statuses.success
          failed_when: '{{ _sc.false }}'

        - name: Remove every reapable reaping dir (flock -x -n on the destination lock; rm -rf)
          vars:
            _bs: '{{ rh.controller.bootstrap }}'
            _wb: '{{ rh.controller.entry_generation.render.n10.write_bound }}'
            _sc: '{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}'
            _lz: '{{ rh.controller.bootstrap.bundle.staging_retention.lease }}'
            _sp: .{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}.
            _rp: .{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}.
            _lock: '{{ (rh_reap_dest | dirname) ~ _bs.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator
              ~ _lz.lock_suffix }}'
            _token: '{{ ((item | basename)[(_sp | length):] if (item | basename).startswith(_sp) else (item | basename)[(_rp | length):]).split(_sc.lease_name_separator)[_sc.zero]
              }}'
            _target: '{{ _sc.empty_text }}'
            _text: '{{ lookup(''ansible.builtin.template'', rh_repo_root ~ _bs.path_admission.separator ~ _sc.template_rel, template_vars={''rh_sc_bs'':
              _bs, ''rh_sc_wb'': _wb, ''rh_sc_effect'': _sc.empty_mapping, ''rh_sc_operation'': _sc.operations.remove, ''rh_sc_witness'': _rh_reap_witnessmap[_token],
              ''rh_sc_source_path'': item, ''rh_sc_target_path'': _target}) }}'
          ansible.builtin.command:
            argv: '{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string,
              _lock, rh_reap_sh, _wb.obligations.commands.program.inline_arg, _text, _wb.obligations.commands.program.arg0, item, _target] }}'
            strip_empty_ends: '{{ _sc.false }}'
          environment:
            LC_ALL: '{{ rh.controller.bootstrap.base_env.LC_ALL }}'
          loop: '{{ (_rh_reap_sel.owned | select(''search'', ''/'' ~ (_rp | regex_escape) ~ ''[^/]+$'') | list + (_rh_reap_mv.results | select(''contains'',
            ''rc'') | selectattr(''rc'', ''equalto'', _sc.statuses.success) | map(attribute=''cmd'') | map(''last'') | list)) | unique(case_sensitive=_bs.path_admission.case_sensitive)
            | list }}'
          register: _rh_reap_rm
          changed_when: _rh_reap_rm.rc == _sc.statuses.success
          failed_when: '{{ _sc.false }}'

        - name: Bind the tokens still named by an owned entry that was NOT removed (a busy lock or a failed command)
          vars:
            _sp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}."
            _rp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}."
          ansible.builtin.set_fact:
            _rh_reap_left: >-
              {{ (_rh_reap_mv.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list
                  + (_rh_reap_rm.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list))
                 | map('basename') | map('regex_replace', '^(' ~ (_sp | regex_escape) ~ '|' ~ (_rp | regex_escape) ~ ')', '')
                 | map('regex_replace', '[.][^.]*$', '') | list }}

        # route op1x (C1 SR922m / SR922n / SR922o registry_applicability, now s64 :7978-8248 with comments :7913-7977, pinned whole
        # r51 :6991-7061, route op2c retarget; codex 939 C1-REGISTRY-STORAGE-VIEW-PROOF; replaces PENDING-C1-SR922M-STORAGE-VIEW): ONE state for this
        # reap destination D, from OBSERVED evidence only (placement.names_are_identity false, call_role_is_identity false;
        # rh_reap_remote, host names, inventory aliases and the call role decide nothing):
        #   owner destination (owner_destinations: applicable): the genesis context, whose play host IS the run controller.
        #   decided context, in this order (any gap is UNKNOWN; unknown dominates every other outcome):
        #     1. not_applicable_requires: the owner registry known (_rh_reap_reg.known) and every held token backed by an
        #        accountable record (a registry temp or an unaccountable record is not accountable: unknown).
        #     2. known_empty: a known registry holding no record (and no temp) is not_applicable, no view sampled.
        #     3. identity: the kernel boot id (lease.boot_id_path, form and dash removal of relock.boot_id) read on the OWNER
        #        (reap_staging_controller_views.yml, delegated) and on the SUBJECT (this host). The machine ids are read and
        #        reported only (machine_role supporting_evidence_only).
        #     4. views (route op1y, C1 SR922p s64 :7987-8054; closes PENDING-C1-SR922P-PARENT-SCOPE and
        #        PENDING-C1-SR922P-TYPE-VOCAB): owner = every accountable record's destination and every path (views.owner, per
        #        every_outstanding_record); PROBED subject views = D and D's parent. Each probed view is measured at
        #        existing_leaf_else_parent:
        #          - type: <stat> fs_type_probe_args (stat %T) mapped by type_vocabulary.producers.stat_f_T.map, and the
        #            containing mount's FSTYPE mapped by producers.findmnt_fstype.map; either unmapped = unknown
        #            (fstype_unmapped), the two domain values different = unknown (crosscheck_differs); the domain value must be
        #            in local_fs_domain. No private normalization: only the two declared maps translate.
        #          - containing mount: <findmnt> mount_probe (exactly one line of the five declared fields, no escaped (\x) field,
        #            TARGET and FSROOT non-empty and canonical, TARGET a prefix of the measured path); no second listing entry at
        #            the same TARGET (stacked_at_view unknown).
        #          - filesystem path: FSROOT joined with the measured path below TARGET, then joined with the view's own text
        #            below the measured path (an absent leaf measured at its parent keeps its own name: a sibling is never its
        #            parent).
        #        COMPARED subject (views.subject [reap_destination, affected_parent_entries]): D, and every AFFECTED PARENT ENTRY
        #        (the parent entries the reaper's own scope globs select: `.<D>.<staging_infix>.*`, `.<D>.<reaping_infix>.*`,
        #        `.<D>.<lease_infix>.*`, from the scope listing at the start AND a re-listing here; the destination lock is
        #        excluded), each compared as its own subtree with filesystem path = the parent's filesystem path + '/' + name
        #        and the parent's filesystem identity. D's parent is admission_only (custody and type: local mapped type,
        #        crosscheck, mount probe); it is never compared as a whole subtree, so a disjoint same-filesystem sibling record
        #        (record /srv/a, D /srv/b) is not_applicable.
        #        nested_mounts: for an owner view and for D, every listing entry strictly below the view's own path
        #        (views.nested_mounts.select); for an affected entry, every entry at or below it (select_subject). Each needs
        #        no escaped or empty TARGET / FSROOT / FSTYPE, an FSTYPE mapped by findmnt_fstype into local_fs_domain, and a
        #        canonical FSROOT; it then BECOMES a nested_view (route op1z, C1 SR922r nested_mounts.admit s64 :8028, comment
        #        :8024-8027; r51 :6998: admit only qualifies, its overlap test moved to one_kernel.pairs).
        #     5. one_kernel (equal boot ids): per CROSS pair (route op1y, codex 941 ROUTE-OP1X-NESTED-PAIR-COVERAGE; route op1z,
        #        C1 SR922r one_kernel.pairs s64 :8081-8092, comment :8060-8080; r51 :7013-7020): every subject-side view
        #        (subject_base_views and subject_nested_views) against every owner-side view (owner_base_views and
        #        owner_nested_views), kinds base_base / base_nested / nested_base / nested_nested; an overlap of a base_base
        #        pair is APPLICABLE, a nested_involved one is UNKNOWN, an unqualified member is UNKNOWN; verdict any unknown,
        #        then any overlap, then not_applicable (every pair proven disjoint). Filesystem identity by filesystem_identity
        #        keyed by the DOMAIN value (ext and xfs: the containing mount's MAJ:MIN; btrfs: the mount UUID, same unless
        #        both observed and differ, unobserved unknown; a domain pair that differs: different). Different: disjoint.
        #        Same: the two filesystem paths compared as canonical text; equal, inside or above = overlap = APPLICABLE.
        #     6. cross_kernel (different boot ids): all views local = separate storage = not_applicable.
        #     7. BOUNDARY GATE (route op1y, observation_boundary s64 :8176-8248, comments :8130-8175; C1 SR922q / SR922q2):
        #        admitted_form reobserve_then_mutate_one_command, gates [remove_lease_record] (s64 :8184). A not_applicable
        #        decided from VIEWS (one_kernel disjoint or cross_kernel) carries gate `reobserve_then_mutate_one_command` and the
        #        recorded subject evidence (`reobserve`: the observer mount namespace link, the whole mount listing the nested
        #        rows used were taken from, and per probed subject view its measured path, stat %T stdout and mount_probe
        #        stdout). Its lease-record removal runs as ONE program under `flock -x -n` on the destination lock that re-reads
        #        all of it and removes only when every value is equal; otherwise it removes nothing (no_mutation_retained) and
        #        the next owned pass retries. known_empty (no view sampled) and applicable (consult_owner_registry: the release
        #        follows the known owner registry, not a view snapshot) carry no evidence to re-read and no gate. The staging
        #        rename and removal above are not_gated (lease_quiescence_proof, before_applicability_decision, s64 :8185).
        #        local_context (route op1z, C1 SR922s, s64 :8188, withdrawn [local_context_also, local_context_gate] :8189,
        #        comment :8167-8175; r51 :7040-7041; rules NOTE-OP1Y-LOCAL-CONTEXT-NO-VIEWS): this file's local context is the
        #        placement genesis_owner_destination, verdict_from owner_destinations_applicable, views none, reobserve none; it
        #        observes no view and its lease removal carries no gate.
        # Canonical text: one_kernel.same_filesystem.canonical_re (s64 :8114; Python re, ansible `match`, anchored at the start
        # and by \Z), read from the word into task var _canon and pinned by value at admission.
        # NOTE-SEAT-SR922O-MOUNT-TIME-OF-CHECK (codex 940 mount observation boundary): the views are observed HERE, after the
        # controller writer verdicts, the target writer quiescence and the reaping removals, before the recovery and the lease
        # release. Each SUBJECT probe (fs type, containing mount, both listings) runs as ONE command under `flock -x -n` on the
        # destination lock (the reap_lock words; busy = probe failed = unknown, no retry is declared), so no reaper or publisher
        # of D moves a staging, reaping or lease entry while that probe runs. The OWNER probes run without a lock (delegated; the
        # registry lock is the recover program's). Both sides list every mount BEFORE and AFTER the per-view probes and record
        # their mount namespace (route op1y: observation_boundary.namespace_probe, the declared readlink of
        # lease.proc_root joined with of_segments [self, ns, mnt] by proc_paths.join (route op2b) -- route op1z, C1 SR922s s64 :8240, closes
        # HOLE-OP1Y-C1-NS-PROBE-PATH;
        # on the controller the identity-admitted os_tools.readlink, on the subject the caller input rh_reap_readlink under the
        # destination lock); a changed listing or an unobserved namespace is unknown (unqualified: retain). The decision records
        # (observation_boundary.record) per view its mount_probe row, the nested rows used, the type values (raw and domain)
        # and the observer's mount namespace. What stays OUTSIDE this snapshot proof, stated plainly: mount(2) / umount(2) take
        # no flock, so an uncoordinated external mount change between two probes that leaves both listings equal, or one made
        # after the re-observation inside the lease-removal command and before its rm, is NOT seen
        # (external_uncoordinated_mount_change: outside_snapshot_proof); the destination lock serializes only reapers and
        # publishers and is held per command (observe per_command_destination_lock, decision outside_any_lock); no race safety
        # is claimed from the lock (lock_alone_race_safety: not_claimed).
        # route op1y (C1 SR922q / SR922q2, s64 :8176-8248): the re-observation runs INSIDE the lease-removal command itself
        # (gate 7 above), so a subject mount change between the decision and that command is seen there and retains; owner
        # views are not re-read in the subject's command (owner_view_change_after_observation: outside_snapshot_proof,
        # cross_host_atomicity: not_claimed).
        - name: Bind the storage views of this destination (registry_applicability.views owner / subject; derived; nothing read)
          ansible.builtin.set_fact:
            _rh_reap_vw: >-
              {%- set ns = namespace(o=[]) -%}
              {%- for t in _rh_reap_reg.all | sort -%}
                {%- set ns.o = ns.o + [_rh_reap_reg.all[t].destination] + (_rh_reap_reg.all[t].paths | dict2items | sort(attribute='key') | map(attribute='value') | list) -%}
              {%- endfor -%}
              {{ {'owner': ns.o | unique | sort, 'subject': [rh_reap_dest, rh_reap_dest | dirname],
                  'smissing': ['rh_reap_stat', 'rh_reap_findmnt', 'rh_reap_readlink'] | reject('in', vars) | list} }}

        # route op1y (C1 SR922p affected_parent_entries, listing: parent): the parent is listed again here with the reaper's own
        # scope globs (the same three patterns as the scope listing at the start); the compared entries are the union of both
        # listings, so an entry removed by this pass is still compared by its name (conservative), and one created since the
        # first listing is seen. The destination lock is never matched by these globs and is excluded again in the decision.
        # Its register _rh_reap_sae is a reserved output since C1 SR922s (r51 reserved_outputs :7827-7839, comment :7831-7832;
        # closes CPL-OP1Y-DERIVED-NAME-PROTECTION).
        - name: Re-list this destination's affected parent entries (scope globs; no links followed; decided context)
          vars:
            _bn: "{{ rh.controller.bootstrap.bundle }}"
          ansible.builtin.find:
            paths: "{{ rh_reap_dest | dirname }}"
            patterns:
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.reaping_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_retention.lease.lease_infix }}.*"
            file_type: any
            hidden: true
            recurse: false
            follow: false
          register: _rh_reap_sae
          failed_when: false
          when: _rh_reap_app.kind == 'delegated'

        - name: Observe the owner views and the owner kernel on the controller (delegated task set; decided context only)
          ansible.builtin.include_tasks: reap_staging_controller_views.yml
          when: _rh_reap_app.kind == 'delegated'

        - name: Read the subject's kernel boot id and machine id (identity.observed_on subject; decided context; read-only)
          ansible.builtin.slurp:
            src: "{{ item }}"
          loop:
            - "{{ rh.controller.bootstrap.bundle.staging_retention.lease.boot_id_path }}"
            - "{{ rh.controller.bootstrap.bundle.staging_retention.lease.machine_id_path }}"
          register: _rh_reap_sid
          failed_when: false
          when: _rh_reap_app.kind == 'delegated'

        # route op1y (observation_boundary.namespace_probe, s64 :8240): the declared readlink, replacing the op1x stat link
        # text, run under the destination lock like every subject probe; absent input rh_reap_readlink = unobserved = unknown.
        # route op1z (C1 SR922s, closes HOLE-OP1Y-C1-NS-PROBE-PATH): the path is root_from (lease.proc_root) joined with
        # namespace_probe.of_segments [self, ns, mnt] (s64 :8240, comment :8237; r51 :7057), pinned by value at
        # admission; no literal path text. route op2b (C1 SR922u namespace_probe.join_from, s64 :8240, comment :8238-8239):
        # root and segments are joined with lease.proc_paths.join, the word join_from names (walked at the pin task).
        - name: Observe the subject's mount namespace (namespace_probe readlink; flock -x -n on the destination lock; evidence)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
            _nsp: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.observation_boundary.namespace_probe }}"
          ansible.builtin.command:
            argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_readlink, _lz.proc_root ~ _lz.proc_paths.join ~ (_nsp.of_segments | join(_lz.proc_paths.join))] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_smns
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'delegated'
            - "'rh_reap_readlink' in vars"

        - name: List every mount on the subject before the view probes (nested_mounts.listing; flock -x -n on the destination lock)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
          ansible.builtin.command:
            argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_findmnt] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.views.nested_mounts.listing.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_sls
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'delegated'
            - "'rh_reap_findmnt' in vars"

        - name: Observe each subject view path (existing_leaf_else_parent; no link followed; decided context)
          ansible.builtin.stat:
            path: "{{ item }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: "{{ _rh_reap_vw.subject }}"
          register: _rh_reap_sv
          failed_when: false
          when: _rh_reap_app.kind == 'delegated'

        - name: Probe each subject view's filesystem type (fs_type_probe_args; flock -x -n on the destination lock)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
          ansible.builtin.command:
            argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_stat] + rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args + [item.at] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          # route op1p: `when` is evaluated before the loop is used per item; in the genesis context the stat task above is
          # skipped and registers no `results`, so this loop expression is read only in the decided context (membership)
          loop: >-
            {%- set ns = namespace(l=[]) -%}
            {%- if 'results' in _rh_reap_sv -%}
              {%- for r in _rh_reap_sv.results -%}
                {%- if 'stat' in r and not ('failed' in r and r.failed) -%}
                  {%- if r.stat.exists and not r.stat.islnk -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item}] -%}
                  {%- elif not r.stat.exists -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item | dirname}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}{{ ns.l }}
          loop_control:
            label: "{{ item.view }}"
          register: _rh_reap_sty
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'delegated'
            - "'rh_reap_stat' in vars"

        - name: Probe the mount containing each subject view (one_kernel.same_filesystem.mount_probe; flock -x -n on the destination lock)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
          ansible.builtin.command:
            argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_findmnt] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.one_kernel.same_filesystem.mount_probe.args + [item.at] }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          loop: >-
            {%- set ns = namespace(l=[]) -%}
            {%- if 'results' in _rh_reap_sv -%}
              {%- for r in _rh_reap_sv.results -%}
                {%- if 'stat' in r and not ('failed' in r and r.failed) -%}
                  {%- if r.stat.exists and not r.stat.islnk -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item}] -%}
                  {%- elif not r.stat.exists -%}{%- set ns.l = ns.l + [{'view': r.item, 'at': r.item | dirname}] -%}
                  {%- endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endif -%}{{ ns.l }}
          loop_control:
            label: "{{ item.view }}"
          register: _rh_reap_smt
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'delegated'
            - "'rh_reap_findmnt' in vars"

        - name: List every mount on the subject after the view probes (unchanged from the first listing, else unknown; flock -x -n)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
          ansible.builtin.command:
            argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_findmnt] + rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.views.nested_mounts.listing.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          register: _rh_reap_sls2
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_app.kind == 'delegated'
            - "'rh_reap_findmnt' in vars"

        # The decision reads every observation by membership (a skipped or failed probe has no `rc` 0 / `stdout` /
        # `content`): an absent observation is UNKNOWN with its reason named in `unknown`, never a substituted value. The five
        # listing and probe fields are read by position in the pinned field order [target, fsroot, fstype, majmin, uuid]
        # (views.nested_mounts.listing.fields and mount_probe.fields, pinned above).
        - name: Decide the registry applicability of this destination (owner destination, else the observed storage views)
          vars:
            _ra: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability }}"
            _wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _canon: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability.one_kernel.same_filesystem.canonical_re.re }}"
          ansible.builtin.set_fact:
            _rh_reap_appl: >-
              {%- if _rh_reap_app.kind == 'local' -%}
                {{ {'state': 'applicable', 'why': 'owner_destination (genesis play host is the run controller)', 'pending': [],
                    'unknown': [], 'overlap': [], 'kernel': '', 'gate': '', 'reobserve': {'mnt_ns': '', 'listing': '', 'views': []}, 'evidence': {}} }}
              {%- else -%}
                {%- set reg = _rh_reap_reg -%}
                {%- set g = namespace(unk=[], ovl=[], pend=[], empty=false, kernel='', views=[], nested=[], ev={}, boot={}, rrns='', rrls='', rrv=[]) -%}
                {%- if not reg.known -%}{%- set g.unk = g.unk + ['owner registry not known (owner_registry_known)'] -%}
                {%- else -%}
                  {%- set na = reg.held | reject('in', reg.all) | list | sort -%}
                  {%- if na | length > 0 -%}{%- set g.unk = g.unk + ['held token without an accountable record: ' ~ (na | join(' ')) ~ ' (every_record_accountable)'] -%}
                  {%- elif reg.all | length == 0 -%}{%- set g.empty = true -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if g.unk | length == 0 and not g.empty -%}
                  {%- set fx = _ra.one_kernel.filesystem_identity -%}
                  {#- route op1y (C1 SR922p type_vocabulary): the ONLY translations are the two declared producer maps -#}
                  {%- set loc = _ra.views.local_fs_domain -%}
                  {%- set smap = _ra.views.type_vocabulary.producers.stat_f_T.map -%}
                  {%- set fmap = _ra.views.type_vocabulary.producers.findmnt_fstype.map -%}
                  {%- set dpar = rh_reap_dest | dirname -%}
                  {%- set nf = _ra.views.nested_mounts.listing.fields | length -%}
                  {%- set sides = {'owner': {'missing': ['stat', 'findmnt', 'readlink'] | reject('in', _rh_reap_otok) | list, 'label': 'controller os_tools identity not admitted:',
                                             'id': _rh_reap_oid_d, 'ns': _rh_reap_omns_d, 'ls': _rh_reap_ols_d, 'ls2': _rh_reap_ols2_d,
                                             'sv': _rh_reap_ov_d, 'ty': _rh_reap_oty_d, 'mt': _rh_reap_omt_d, 'views': _rh_reap_vw.owner},
                                   'subject': {'missing': _rh_reap_vw.smissing, 'label': 'missing caller input',
                                               'id': _rh_reap_sid, 'ns': _rh_reap_smns, 'ls': _rh_reap_sls, 'ls2': _rh_reap_sls2,
                                               'sv': _rh_reap_sv, 'ty': _rh_reap_sty, 'mt': _rh_reap_smt, 'views': _rh_reap_vw.subject}} -%}
                  {%- for sn in ['owner', 'subject'] -%}
                    {%- set sd = sides[sn] -%}
                    {%- for m in sd.missing -%}{%- set g.unk = g.unk + [sn ~ ': ' ~ sd.label ~ ' ' ~ m] -%}{%- endfor -%}
                    {%- if sn == 'subject' and sd.missing | length > 0 -%}{%- set g.pend = g.pend + ['CPL-OP1X-B-REAP-VIEW-TOOL-INPUTS'] -%}{%- endif -%}
                    {%- set bt = namespace(v='') -%}
                    {%- if 'results' in sd.id -%}
                      {%- for r in sd.id.results -%}
                        {%- if 'content' in r and not ('failed' in r and r.failed) -%}
                          {%- set first = (r.content | b64decode).split('\n') | first -%}
                          {%- if r.item == _lz.boot_id_path and first is match(_wb.lifetime.dead_holder.relock.boot_id.form_ere) -%}{%- set bt.v = first | replace('-', '') -%}
                          {%- elif r.item == _lz.machine_id_path -%}{%- set g.ev = g.ev | combine({sn ~ '_machine': first}) -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {%- if bt.v == '' -%}{%- set g.unk = g.unk + [sn ~ ': kernel boot id unobserved or not of the declared form'] -%}{%- endif -%}
                    {%- set g.boot = g.boot | combine({sn: bt.v}) -%}
                    {#- route op1y: observation_boundary.namespace_probe is the readlink output, exactly one non-empty line -#}
                    {%- set nsl = namespace(v='') -%}
                    {%- if 'rc' in sd.ns and sd.ns.rc == 0 and 'stdout' in sd.ns -%}
                      {%- set nl = sd.ns.stdout.split('\n') -%}
                      {%- if nl | length == 2 and nl[1] == '' -%}{%- set nsl.v = nl[0] -%}{%- endif -%}
                    {%- endif -%}
                    {%- if nsl.v != '' -%}{%- set g.ev = g.ev | combine({sn ~ '_mnt_ns': nsl.v}) -%}
                      {%- if sn == 'subject' -%}{%- set g.rrns = sd.ns.stdout -%}{%- endif -%}
                    {%- else -%}{%- set g.unk = g.unk + [sn ~ ': mount namespace unobserved (namespace_probe; unqualified: retain)'] -%}
                    {%- endif -%}
                    {%- set ls = namespace(ok=false, e=[]) -%}
                    {%- if 'rc' in sd.ls and sd.ls.rc == 0 and 'stdout' in sd.ls and 'rc' in sd.ls2 and sd.ls2.rc == 0 and 'stdout' in sd.ls2 -%}
                      {%- if sd.ls.stdout != sd.ls2.stdout -%}{%- set g.unk = g.unk + [sn ~ ': mount listing changed during the observation'] -%}
                      {%- else -%}
                        {%- set lines = sd.ls.stdout.split('\n') -%}
                        {%- set ls.ok = (lines | length) > 1 and (lines | last) == '' -%}
                        {%- for ln in lines[:-1] -%}
                          {%- set f = ln.split(_ra.views.nested_mounts.listing.separator) -%}
                          {%- if f | length == nf -%}{%- set ls.e = ls.e + [{'target': f[0], 'fsroot': f[1], 'fstype': f[2], 'majmin': f[3], 'uuid': f[4]}] -%}
                          {%- else -%}{%- set ls.ok = false -%}
                          {%- endif -%}
                        {%- endfor -%}
                        {%- if not ls.ok -%}{%- set g.unk = g.unk + [sn ~ ': mount listing not of the declared fields'] -%}
                        {%- elif sn == 'subject' -%}{%- set g.rrls = sd.ls.stdout -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- else -%}{%- set g.unk = g.unk + [sn ~ ': mount listing probe failed'] -%}
                    {%- endif -%}
                    {%- if ls.ok -%}
                      {%- for v in sd.views -%}
                        {#- route op1y: D's parent is admission_only (custody and type), never a compared subtree -#}
                        {%- set role = 'admission_only' if (sn == 'subject' and v == dpar) else 'compared' -%}
                        {%- set o = namespace(at='', ok=true, t='', d='', f=[], esc=false, fsp='') -%}
                        {%- if 'results' in sd.sv -%}
                          {%- for r in sd.sv.results -%}
                            {%- if r.item == v and 'stat' in r and not ('failed' in r and r.failed) -%}
                              {%- if r.stat.exists and not r.stat.islnk -%}{%- set o.at = v -%}
                              {%- elif not r.stat.exists -%}{%- set o.at = v | dirname -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                        {%- if o.at == '' -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': path unobservable or a link'] -%}{%- endif -%}
                        {%- if o.ok and 'results' in sd.ty -%}
                          {%- for r in sd.ty.results -%}
                            {%- if 'item' in r and r.item is mapping and r.item.view == v and 'rc' in r and r.rc == 0 and 'stdout' in r -%}
                              {%- set tl = r.stdout.split('\n') -%}
                              {%- if tl | length == 2 and tl[1] == '' -%}{%- set o.t = tl[0] -%}{%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                        {%- if o.ok and o.t == '' -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': fs type probe failed'] -%}
                        {%- elif o.ok and o.t not in smap -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': stat %T ' ~ o.t ~ ' unmapped by type_vocabulary stat_f_T (fstype_unmapped)'] -%}
                        {%- elif o.ok and smap[o.t] not in loc -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': domain ' ~ smap[o.t] ~ ' not in local_fs_domain (other_type unknown)'] -%}
                        {%- elif o.ok -%}{%- set o.d = smap[o.t] -%}
                        {%- endif -%}
                        {%- if o.ok and 'results' in sd.mt -%}
                          {%- for r in sd.mt.results -%}
                            {%- if 'item' in r and r.item is mapping and r.item.view == v and 'rc' in r and r.rc == 0 and 'stdout' in r -%}
                              {%- set ml = r.stdout.split('\n') -%}
                              {%- if ml | length == 2 and ml[1] == '' -%}{%- set o.f = ml[0].split(_ra.one_kernel.same_filesystem.mount_probe.separator) -%}{%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                        {%- if o.ok and o.f | length != nf -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': mount probe failed'] -%}{%- endif -%}
                        {%- if o.ok -%}
                          {%- set mt = {'target': o.f[0], 'fsroot': o.f[1], 'fstype': o.f[2], 'majmin': o.f[3], 'uuid': o.f[4]} -%}
                          {%- for x in o.f -%}{%- if '\\x' in x -%}{%- set o.esc = true -%}{%- endif -%}{%- endfor -%}
                          {%- set below = '' if o.at == mt.target else (o.at if mt.target == '/' else o.at[(mt.target | length):]) -%}
                          {%- set atfsp = mt.fsroot if below == '' else (below if mt.fsroot == '/' else mt.fsroot ~ below) -%}
                          {#- route op1y: an absent leaf measured at its parent keeps its own name in its filesystem path -#}
                          {%- set tail = '' if v == o.at else (v if o.at == '/' else v[(o.at | length):]) -%}
                          {%- set o.fsp = atfsp if tail == '' else (tail if atfsp == '/' else atfsp ~ tail) -%}
                          {%- if o.esc -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': escaped mount field'] -%}
                          {%- elif mt.fstype not in fmap -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': mount FSTYPE ' ~ mt.fstype ~ ' unmapped by type_vocabulary findmnt_fstype (fstype_unmapped)'] -%}
                          {%- elif fmap[mt.fstype] != o.d -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': stat %T ' ~ o.t ~ ' (' ~ o.d ~ ') and mount FSTYPE ' ~ mt.fstype ~ ' (' ~ fmap[mt.fstype] ~ ') differ (crosscheck_differs)'] -%}
                          {%- elif mt.target == '' or mt.fsroot == '' -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': empty TARGET or FSROOT'] -%}
                          {%- elif not (mt.target is match(_canon) and mt.fsroot is match(_canon) and o.at is match(_canon)) -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': non-canonical path'] -%}
                          {%- elif not (mt.target == '/' or o.at == mt.target or o.at.startswith(mt.target ~ '/')) -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': TARGET ' ~ mt.target ~ ' not a prefix of ' ~ o.at] -%}
                          {%- elif o.fsp is not match(_canon) -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': non-canonical filesystem path'] -%}
                          {%- elif ls.e | selectattr('target', 'equalto', mt.target) | list | length > 1 -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': stacked mount at ' ~ mt.target] -%}
                          {%- endif -%}
                          {#- nested_mounts.select (owner views and D): every listing entry STRICTLY below the view's own path;
                              the admission_only parent is not examined as a whole (C1 SR922p) -#}
                          {%- if o.ok and role == 'compared' -%}
                            {%- for n in ls.e -%}
                              {%- if n.target != v and (v == '/' or n.target.startswith(v ~ '/')) -%}
                                {%- if '\\x' in n.target or '\\x' in n.fsroot or '\\x' in n.fstype -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': nested mount with an escaped field'] -%}
                                {%- elif n.target == '' or n.fsroot == '' or n.fstype == '' -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': nested mount with an empty field'] -%}
                                {%- elif n.fstype not in fmap -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': nested mount ' ~ n.target ~ ' FSTYPE ' ~ n.fstype ~ ' unmapped (fstype_unmapped)'] -%}
                                {%- elif fmap[n.fstype] not in loc -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': nested mount ' ~ n.target ~ ' domain ' ~ fmap[n.fstype] ~ ' not in local_fs_domain'] -%}
                                {%- elif n.fsroot is not match(_canon) -%}{%- set o.ok = false -%}{%- set g.unk = g.unk + [sn ~ ' ' ~ v ~ ': nested mount ' ~ n.target ~ ' non-canonical FSROOT'] -%}
                                {%- else -%}{%- set g.nested = g.nested + [{'side': sn, 'label': sn ~ ' nested ' ~ n.target ~ ' under ' ~ v, 'type': fmap[n.fstype], 'majmin': n.majmin, 'uuid': n.uuid, 'fsp': n.fsroot, 'mount': n}] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- if o.ok -%}
                            {%- set g.views = g.views + [{'side': sn, 'role': role, 'label': sn ~ ' ' ~ v, 'path': v, 'at': o.at, 'type': o.d, 'type_values': {'stat_f_T': o.t, 'findmnt_fstype': mt.fstype, 'domain': o.d},
                                                          'majmin': mt.majmin, 'uuid': mt.uuid, 'fsp': o.fsp, 'mount': mt}] -%}
                            {#- route op1y (observation_boundary.record / reobserve): the subject view's measured path and the
                                exact stdout of its two probes (each validated above as one line plus its terminator) -#}
                            {%- if sn == 'subject' -%}{%- set g.rrv = g.rrv + [[o.at, o.t ~ '\n', (o.f | join(_ra.one_kernel.same_filesystem.mount_probe.separator)) ~ '\n']] -%}{%- endif -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {#- route op1y (C1 SR922p affected_parent_entries): each entry the reaper's scope globs select in D's parent
                          (union of the scope listing at the start and the re-listing above; the destination lock excluded) is a
                          COMPARED subject subtree with the parent's filesystem identity and filesystem path parent + '/' + name;
                          nested_mounts.select_subject: every listing entry AT or below the entry -#}
                      {%- if sn == 'subject' -%}
                        {%- set pv = g.views | selectattr('side', 'equalto', 'subject') | selectattr('role', 'equalto', 'admission_only') | list -%}
                        {%- if pv | length != 1 -%}{%- set g.unk = g.unk + ['subject ' ~ dpar ~ ': parent view not admitted, affected entries not comparable'] -%}
                        {%- elif 'files' not in _rh_reap_top or 'files' not in _rh_reap_sae or ('failed' in _rh_reap_sae and _rh_reap_sae.failed) -%}
                          {%- set g.unk = g.unk + ['subject ' ~ dpar ~ ': affected parent entries not listed'] -%}
                        {%- else -%}
                          {%- set p0 = pv | first -%}
                          {%- set lkn = '.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix -%}
                          {%- set names = ((_rh_reap_top.files + _rh_reap_sae.files) | map(attribute='path') | map('basename') | reject('equalto', lkn) | unique | sort) -%}
                          {%- for nm in names -%}
                            {%- set ep = (dpar ~ '/' ~ nm) if dpar != '/' else ('/' ~ nm) -%}
                            {%- set efs = ('/' ~ nm) if p0.fsp == '/' else (p0.fsp ~ '/' ~ nm) -%}
                            {%- set eo = namespace(ok=(efs is match(_canon))) -%}
                            {%- if not eo.ok -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': non-canonical filesystem path'] -%}{%- endif -%}
                            {%- for n in ls.e -%}
                              {%- if eo.ok and (n.target == ep or n.target.startswith(ep ~ '/')) -%}
                                {%- if '\\x' in n.target or '\\x' in n.fsroot or '\\x' in n.fstype -%}{%- set eo.ok = false -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': mount with an escaped field'] -%}
                                {%- elif n.target == '' or n.fsroot == '' or n.fstype == '' -%}{%- set eo.ok = false -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': mount with an empty field'] -%}
                                {%- elif n.fstype not in fmap -%}{%- set eo.ok = false -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': mount ' ~ n.target ~ ' FSTYPE ' ~ n.fstype ~ ' unmapped (fstype_unmapped)'] -%}
                                {%- elif fmap[n.fstype] not in loc -%}{%- set eo.ok = false -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': mount ' ~ n.target ~ ' domain ' ~ fmap[n.fstype] ~ ' not in local_fs_domain'] -%}
                                {%- elif n.fsroot is not match(_canon) -%}{%- set eo.ok = false -%}{%- set g.unk = g.unk + ['subject entry ' ~ nm ~ ': mount ' ~ n.target ~ ' non-canonical FSROOT'] -%}
                                {%- else -%}{%- set g.nested = g.nested + [{'side': 'subject', 'label': 'subject nested ' ~ n.target ~ ' at or under entry ' ~ nm, 'type': fmap[n.fstype], 'majmin': n.majmin, 'uuid': n.uuid, 'fsp': n.fsroot, 'mount': n}] -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                            {%- if eo.ok -%}
                              {%- set g.views = g.views + [{'side': 'subject', 'role': 'compared', 'label': 'subject entry ' ~ ep, 'path': ep, 'at': p0.at, 'type': p0.type, 'type_values': p0.type_values,
                                                            'majmin': p0.majmin, 'uuid': p0.uuid, 'fsp': efs, 'mount': p0.mount}] -%}
                            {%- endif -%}
                          {%- endfor -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if g.unk | length == 0 -%}
                    {%- if g.boot.owner == g.boot.subject -%}
                      {%- set g.kernel = 'one_kernel' -%}
                      {#- route op1y (codex 941 ROUTE-OP1X-NESTED-PAIR-COVERAGE, HIGH); route op1z: C1 SR922r one_kernel.pairs
                          (s64 :8081-8092, comment :8060-8080; r51 :7013-7020), pinned by value at admission. subject_side
                          [subject_base_views (compared D and affected entries), subject_nested_views (admitted nested views at or
                          below them)] x owner_side [owner_base_views (record views), owner_nested_views (admitted nested views
                          below them)]: set every_subject_side_view_x_every_owner_side_view, kinds base_base / base_nested /
                          nested_base / nested_nested. A nested view's identity is its listing row's (MAJ:MIN, btrfs UUID) and its
                          filesystem path its FSROOT (covers the subtree); a base view's path is FSROOT joined with the path below
                          TARGET. pair_rule: different filesystem disjoint; same filesystem disjoint only when never equal,
                          inside or above, else overlap. overlap base_base applicable, nested_involved unknown; an unproven
                          identity (unqualified member) unknown. Verdict below: any unknown -> unknown, else any overlap ->
                          applicable, else not_applicable (known_none_requires every_pair_proven_disjoint). -#}
                      {%- set pr = namespace(l=[]) -%}
                      {%- set cv = g.views | selectattr('role', 'equalto', 'compared') | list -%}
                      {%- set sx = (cv | selectattr('side', 'equalto', 'subject') | map('combine', {'kind': 'base'}) | list)
                                   + (g.nested | selectattr('side', 'equalto', 'subject') | map('combine', {'kind': 'nested'}) | list) -%}
                      {%- set ox = (cv | selectattr('side', 'equalto', 'owner') | map('combine', {'kind': 'base'}) | list)
                                   + (g.nested | selectattr('side', 'equalto', 'owner') | map('combine', {'kind': 'nested'}) | list) -%}
                      {%- for a in sx -%}
                        {%- for b in ox -%}{%- set pr.l = pr.l + [{'a': a, 'b': b, 'mode': a.kind ~ '_' ~ b.kind}] -%}{%- endfor -%}
                      {%- endfor -%}
                      {%- set g.ev = g.ev | combine({'pairs_compared': pr.l | length,
                                                     'pair_kinds': {'base_base': pr.l | selectattr('mode', 'equalto', 'base_base') | list | length,
                                                                    'base_nested': pr.l | selectattr('mode', 'equalto', 'base_nested') | list | length,
                                                                    'nested_base': pr.l | selectattr('mode', 'equalto', 'nested_base') | list | length,
                                                                    'nested_nested': pr.l | selectattr('mode', 'equalto', 'nested_nested') | list | length}}) -%}
                      {%- for p in pr.l -%}
                        {%- set idn = namespace(v='different') -%}
                        {%- if p.a.type == p.b.type and p.a.type in fx and p.a.type != 'other_type_pair' -%}
                          {%- if fx[p.a.type].by == 'mount_majmin' -%}
                            {%- if p.a.majmin == '' or p.b.majmin == '' -%}{%- set idn.v = 'unknown' -%}{%- elif p.a.majmin == p.b.majmin -%}{%- set idn.v = 'same' -%}{%- endif -%}
                          {%- elif fx[p.a.type].by == 'mount_uuid' -%}
                            {%- if p.a.uuid == '' or p.b.uuid == '' -%}{%- set idn.v = 'unknown' -%}{%- elif p.a.uuid == p.b.uuid -%}{%- set idn.v = 'same' -%}{%- endif -%}
                          {%- else -%}{%- set idn.v = 'unknown' -%}
                          {%- endif -%}
                        {%- endif -%}
                        {%- if idn.v == 'unknown' -%}{%- set g.unk = g.unk + [p.a.label ~ ' vs ' ~ p.b.label ~ ': filesystem identity unobserved (MAJ:MIN or btrfs UUID)'] -%}
                        {%- elif idn.v == 'same' -%}
                          {%- set x = p.a.fsp -%}{%- set y = p.b.fsp -%}
                          {%- if x == y or x == '/' or y == '/' or x.startswith(y ~ '/') or y.startswith(x ~ '/') -%}
                            {%- if p.mode == 'base_base' -%}{%- set g.ovl = g.ovl + [p.a.label ~ ' (' ~ x ~ ') overlaps ' ~ p.b.label ~ ' (' ~ y ~ ')'] -%}
                            {%- else -%}{%- set g.unk = g.unk + [p.a.label ~ ' (FSROOT ' ~ x ~ ') overlaps ' ~ p.b.label ~ ' (' ~ y ~ ')'] -%}
                            {%- endif -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- else -%}{%- set g.kernel = 'cross_kernel' -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endif -%}
                {%- if g.unk | length > 0 -%}{%- set st = ['unknown', 'unobservable or unqualified evidence (unobservable: unknown)'] -%}
                {%- elif g.empty -%}{%- set st = ['not_applicable', 'known_empty (a known owner registry holding no record)'] -%}
                {%- elif g.ovl | length > 0 -%}{%- set st = ['applicable', 'one_kernel: a subject view overlaps a record view (overlap: applicable)'] -%}
                {%- elif g.kernel == 'cross_kernel' -%}{%- set st = ['not_applicable', 'cross_kernel: every view local (separate storage)'] -%}
                {%- else -%}{%- set st = ['not_applicable', 'one_kernel: every compared subject / record view pair is disjoint'] -%}
                {%- endif -%}
                {#- route op1y boundary gate (observation_boundary.admitted_form, s64 :8180; gates [remove_lease_record] :8184): a
                    VIEW-derived not_applicable releases the lease records only through the re-observe-then-mutate command, which
                    is given `reobserve` (the recorded subject evidence) as params -#}
                {%- set gate = _ra.observation_boundary.admitted_form if (st[0] == 'not_applicable' and not g.empty) else '' -%}
                {{ {'state': st[0], 'why': st[1], 'pending': g.pend | unique | list, 'unknown': g.unk, 'overlap': g.ovl, 'kernel': g.kernel, 'gate': gate,
                    'reobserve': {'mnt_ns': g.rrns, 'listing': g.rrls, 'views': g.rrv},
                    'evidence': g.ev | combine({'boot': g.boot, 'views': g.views, 'nested_rows_used': g.nested})} }}
              {%- endif -%}

        # Effects (registry_applicability.effects): applicable -> consult_owner_registry (the owner registry as read: a token it
        # holds keeps its lease and charge; recovery only where the registry is local to the play host, the genesis owner
        # destination; a decided-context applicable destination is consulted but never recovered from here:
        # PENDING-ROUTE-DELEGATED-RECOVERY); not_applicable -> registry_state_none (known, holds no token: the known-none state
        # exists ONLY here); unknown -> retain_lease_and_charge (known false: every candidate lease and its charge kept).
        # route op1y (observation_boundary, s64 :8176-8248): every not_applicable maps to registry_state_none; one decided from
        # views carries gate reobserve_then_mutate_one_command, which the lease-record removal below honours (_rh_reap_regx.gate:
        # re-read the recorded subject evidence in the removal's own flock command; differs or unreadable removes nothing).
        - name: Map the owner registry reading through the applicability effects (the state this destination's release reads)
          vars:
            _ra: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability }}"
          ansible.builtin.set_fact:
            _rh_reap_regx: >-
              {%- if _rh_reap_appl.state == 'applicable' -%}
                {{ {'effect': _ra.effects.applicable, 'known': _rh_reap_reg.known, 'lock_ok': _rh_reap_reg.lock_ok, 'held': _rh_reap_reg.held,
                    'recs': _rh_reap_reg.recs, 'recover': _rh_reap_app.kind == 'local', 'gate': ''} }}
              {%- elif _rh_reap_appl.state == 'not_applicable' -%}
                {{ {'effect': _ra.effects.not_applicable, 'known': true, 'lock_ok': false, 'held': [], 'recs': {}, 'recover': false, 'gate': _rh_reap_appl.gate} }}
              {%- else -%}
                {{ {'effect': _ra.effects.unknown, 'known': false, 'lock_ok': false, 'held': [], 'recs': {}, 'recover': false, 'gate': ''} }}
              {%- endif -%}

        # Native durability sequence: registry-locked complete cleanup preparation, destination-locked
        # exact lease cleanup, then registry-locked full recovery. Locks are never nested. Neither
        # preparation nor lease removal is record release. Historical order remains in frozen baseline.
        - name: Prepare each dead holder cleanup durably without removing its obligation (registry lock only)
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
            _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
            _prep: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.recovery_prepare_program }}"
            _sp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}."
            _rp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}."
            _rec: "{{ _rh_reap_regx.recs[item] }}"
            _text: >-
              {{ lookup('ansible.builtin.template',
                        rh_repo_root ~ _bs.path_admission.separator ~ _ob.transaction.program_template_rel,
                        template_vars={'rh_ot_bs': _bs, 'rh_ot_wb': _wb, 'rh_ot_program': _prep}) }}
            # the declared params by name (dead_holder.program.params, admitted equal above): the persisted record paths
            # (record_fields paths: staging, local_temp, remote_temp), the reaping name of its staging (staging_infix ->
            # reaping_infix in the destination parent, s64 :8646-8647), the registry, lock name, token, the record bytes' sha256
            _pv: >-
              {{ {'registry_dir': _rh_reap_rg.dir, 'lock_name': _rh_reap_rg.lock_name, 'token': item, 'record_sha256': _rec.sha,
                  'reaping': (_rec.paths.staging | dirname) ~ _bs.path_admission.separator ~ _rp ~ (_rec.paths.staging | basename)[(_sp | length):],
                  'verdict': _rh_reap_tok[item]} | combine(_rec.paths) }}
          ansible.builtin.command:
            argv: >-
              {{ [rh_reap_flock, _ob.commands.recovery_lock.exclusive_arg, _ob.commands.recovery_lock.nonblocking_arg,
                  _ob.commands.recovery_lock.conflict_exit_arg, _lz.busy_rc | string, _rh_reap_rg.lock,
                  rh_reap_sh, _ob.commands.program.inline_arg, _text, _ob.commands.program.arg0]
                 + (_prep.params | map('extract', _pv) | list) }}
            # dead_holder.output terminator none: the stdout is classified exactly as printed (no trailing newline stripped)
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          loop: >-
            {%- set ns = namespace(t=[]) -%}
            {%- if _rh_reap_regx.recover and _rh_reap_regx.known and _rh_reap_regx.lock_ok and _rh_reap_quiet -%}
              {%- for t in _rh_reap_regx.recs | sort -%}
                {%- if t in _rh_reap_tok and _rh_reap_tok[t] == 'dead' and t in _rh_reap_recmap
                       and _rh_reap_regx.recs[t].lease == _rh_reap_recmap[t]
                       and t not in _rh_reap_sel.blocked_tokens and t not in _rh_reap_left -%}{%- set ns.t = ns.t + [t] -%}{%- endif -%}
              {%- endfor -%}
            {%- endif -%}{{ ns.t }}
          register: _rh_reap_prepare
          changed_when: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation.false }}"
          failed_when: false

        - name: Retain every held lease except tokens with current complete durable cleanup preparation
          vars:
            _prep: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.recovery_prepare_program }}"
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
          ansible.builtin.set_fact:
            _rh_reap_keep: >-
              {%- set prepared = _rh_reap_prepare.results | select('contains', 'rc') | select('contains', 'stdout')
                  | selectattr('rc', 'equalto', _prep.output.success_rc) | selectattr('stdout', 'equalto', _prep.output.success)
                  | map(attribute='item') | list -%}
              {%- if _rh_reap_regx.known -%}
                {{ {'keep': _rh_reap_regx.held | reject('in', prepared) | list, 'released': []} }}
              {%- else -%}
                {{ {'keep': _rh_reap_sel.records | map('basename') | map('regex_replace', '^' ~ (_lp | regex_escape), _sc.empty_text) | list, 'released': []} }}
              {%- endif -%}

        - name: Remove each reapable lease record no longer named by any remaining entry nor held by the obligation registry (flock -x -n; rm -f, re-observed when view-derived)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
            _lock: "{{ (rh_reap_dest | dirname) ~ '/.' ~ (rh_reap_dest | basename) ~ '.' ~ _lz.lock_suffix }}"
            _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
            _ra: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability }}"
            _rro: "{{ _rh_reap_appl.reobserve }}"
            _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
            _lease_effect: >-
              {%- set rows = _rh_reap_recs.results | selectattr('item', 'equalto', item) | list -%}
              {{ {'uid': rh_reap_uid | string, 'lease_sha256': (rows | first).content | b64decode | hash(_sc.checksum_algorithm)} }}
            _lease_remove: "{{ lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ _sc.template_rel, template_vars={'rh_sc_bs': rh.controller.bootstrap, 'rh_sc_wb': rh.controller.entry_generation.render.n10.write_bound, 'rh_sc_effect': _lease_effect, 'rh_sc_operation': _sc.operations.remove_lease, 'rh_sc_witness': _sc.empty_mapping, 'rh_sc_source_path': item, 'rh_sc_target_path': _sc.empty_text}) }}"
            # route op2a (codex 942 ROUTE-OP1Z-REOBSERVE-ARGV-ARITY, HIGH): no fixed group sizes. Parameters: $1..$9 fixed
            # (readlink, namespace path, recorded namespace, findmnt, recorded listing, stat, rm, lease record, view count nv),
            # $10 nla, $11 nma, $12 nta (the LENGTHS of the declared listing.args, mount_probe.args and fs_type_probe_args, from
            # the same lists the argv appends), then the three groups in that order, then nv triples (view path, recorded stat
            # stdout, recorded mount_probe stdout). Function sl runs a tool on exactly one group (selected by its offset and
            # count from the caller's whole parameter list, by rotation; no array, no eval, no file), plus the current view
            # path when asked; function pa returns parameter k exactly (sentinel byte, so no trailing newline is lost).
            # A count that is not a canonical decimal, fewer words than the counts declare, or a trailing word count other than
            # 3 * nv is a MALFORMED INVOCATION: stdout malformed_invocation, exit 2, nothing read and nothing removed. C1
            # SR922u rules route's word and status (malformed_invocation, s64 :8222-8229; closes
            # CPL-OP2A-C1-MALFORMED-INVOCATION-DISPOSITION); the classification below counts it as a command FAILURE, never a
            # retention, and admission refuses a busy_rc equal to 0, 1 or 2 (r51 :4357 pins busy_rc to 3..125).
            # route op2b (C1 SR922u argv_transport, s64 :8210-8221; C1 open item 1): every count must be the WHOLE text of
            # transaction.grammar.decimal_ere (s64 :8503, comment :8497-8502, '(0|[1-9][0-9]*)', unanchored ERE) AND at least its count_min. The
            # program has no ERE matcher (its tools are readlink, findmnt, stat and rm), so function ck tests the same language
            # with case globs: a text is refused when it is empty, holds a non-digit (LF included) or is a 0 followed by
            # anything; what remains is exactly '0' or [1-9][0-9]*, the decimal_ere language as a whole text. Then the test
            # -ge count_min (rendered from the word, 1 for every count) refuses 0, and a failed test is malformed too. op2a's arm
            # `0[0-9]*` did NOT match the text 0 (a glob needs a second character), so op2a admitted a zero count; corrected.
            # route op2c addendum (C1 SR922w transaction.grammar.decimal_shell_case, s64 :8503, comment :8497-8502; r51 :7111;
            # closes NOTE-OP2B-DECIMAL-ERE-SHELL-FORM): the case arms are the word's refuse globs, rendered from the grammar
            # argv_transport.count_grammar_from walks to (its decimal_shell_case sibling; pinned by value at admission), each
            # unquoted so the shell matches it as a pattern, the empty glob rendered as ''. No literal glob remains here.
            # route op2c (NOTE-OP2B-ARITH-HUGE-COUNT): two more malformed checks, both before any arithmetic on the count.
            #   [ "$(($1))" = "$1" ]: an unrefused text is a canonical decimal; its arithmetic expansion prints that same text
            #   only when the value is representable. Out of range, a shell either prints another text (a clamped or wrapped
            #   value: the test fails, stdout malformed_invocation, exit 2) or fails the expansion, which in a non-interactive
            #   shell exits it with a non-zero status before anything is printed (POSIX XCU 2.8.1; dash prints its message on
            #   stderr): stdout empty and a status that is not the outcomes.removed / retained pair, so the gated
            #   classification below counts it in _cmdfail (a failure), and a status equal to busy_rc would be read busy
            #   (retained), never a release. Not measured on the target sh (nothing executed): controls C-OP2C-*-COUNT-*.
            #   [ "$1" -le "$#" ] (the outer word count, passed as $3): no count can exceed the words that carry its group, so
            #   a larger one is malformed (fewer words than the counts declare); the sum vb then stays far inside the range.
            _rrp: |
              set -u
              sl() {
                sl_t=$1 sl_k=$2 sl_c=$3 sl_e=$4
                shift 4
                shift "$sl_k"
                sl_r=$(($# - sl_c))
                sl_i=0
                while [ "$sl_i" -lt "$sl_c" ]; do set -- "$@" "$1"; shift; sl_i=$((sl_i + 1)); done
                shift "$sl_r"
                if [ "$sl_e" = 1 ]; then "$sl_t" "$@" "$at"; else "$sl_t" "$@"; fi
              }
              pa() { shift "$1"; printf '%sx' "$1"; }
              [ "$#" -ge 12 ] || { printf '%s' malformed_invocation; exit 2; }
              rl=$1 nsp=$2 nsx=$3 fm=$4 lsx=$5 st=$6 rmt=$7 tgt=$8 nv=$9 nla=${10} nma=${11} nta=${12}
              ck() {
                case $1 in {{ _ob[_ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_grammar_from[0]][_ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_grammar_from[1]].decimal_shell_case.refuse | map('regex_replace', '^$', "''") | join('|') }}) printf '%s' malformed_invocation; exit 2 ;; esac
                [ "$(($1))" = "$1" ] || { printf '%s' malformed_invocation; exit 2; }
                { [ "$1" -ge "$2" ] && [ "$1" -le "$3" ]; } || { printf '%s' malformed_invocation; exit 2; }
              }
              ck "$nv" {{ _ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_min.view_count }} "$#"
              ck "$nla" {{ _ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_min.listing_args }} "$#"
              ck "$nma" {{ _ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_min.mount_probe_args }} "$#"
              ck "$nta" {{ _ra.observation_boundary.reobserve_then_mutate_one_command.argv_transport.count_min.fs_type_probe_args }} "$#"
              vb=$((12 + nla + nma + nta))
              { [ "$#" -ge "$vb" ] && [ "$(($# - vb))" -eq "$((nv * 3))" ]; } || { printf '%s' malformed_invocation; exit 2; }
              o=$("$rl" "$nsp" && printf '%s' x) || { printf '%s' namespace_unreadable; exit 1; }
              [ "$o" = "${nsx}x" ] || { printf '%s' namespace_differs; exit 1; }
              o=$(sl "$fm" 12 "$nla" 0 "$@" && printf '%s' x) || { printf '%s' listing_unreadable; exit 1; }
              [ "$o" = "${lsx}x" ] || { printf '%s' listing_differs; exit 1; }
              vi=0
              while [ "$vi" -lt "$nv" ]; do
                at=$(pa $((vb + 3 * vi + 1)) "$@"); at=${at%x}
                tx=$(pa $((vb + 3 * vi + 2)) "$@"); tx=${tx%x}
                mx=$(pa $((vb + 3 * vi + 3)) "$@"); mx=${mx%x}
                o=$(sl "$st" $((12 + nla + nma)) "$nta" 1 "$@" && printf '%s' x) || { printf '%s' type_unreadable; exit 1; }
                [ "$o" = "${tx}x" ] || { printf '%s' type_differs; exit 1; }
                o=$(sl "$fm" $((12 + nla)) "$nma" 1 "$@" && printf '%s' x) || { printf '%s' mount_probe_unreadable; exit 1; }
                [ "$o" = "${mx}x" ] || { printf '%s' mount_probe_differs; exit 1; }
                vi=$((vi + 1))
              done
              {{ _lease_remove }}
          ansible.builtin.command:
            argv: >-
              {{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock]
                 + ([rh_reap_sh, _ob.commands.program.inline_arg, _lease_remove, _ob.commands.program.arg0] if _rh_reap_regx.gate == '' else
                    ([rh_reap_sh, _ob.commands.program.inline_arg, _rrp, _ob.commands.program.arg0,
                      rh_reap_readlink, _lz.proc_root ~ _lz.proc_paths.join ~ (_ra.observation_boundary.namespace_probe.of_segments | join(_lz.proc_paths.join)), _rro.mnt_ns, rh_reap_findmnt, _rro.listing, rh_reap_stat, rh_reap_rm,
                      item, _rro.views | length | string, _ra.views.nested_mounts.listing.args | length | string,
                      _ra.one_kernel.same_filesystem.mount_probe.args | length | string,
                      rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args | length | string]
                     + _ra.views.nested_mounts.listing.args + _ra.one_kernel.same_filesystem.mount_probe.args
                     + rh.controller.entry_generation.render.n10.write_bound.locations.fs_type_probe_args + (_rro.views | flatten))) }}
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          loop: >-
            {{ _rh_reap_sel.records | reject('in', (_rh_reap_sel.blocked_tokens + _rh_reap_left + _rh_reap_keep.keep) | map('regex_replace', '^', (rh_reap_dest | dirname) ~ '/' ~ _lp) | list) | list }}
          register: _rh_reap_rmrec
          # route op2b (codex 944): gated, changed only on the declared outcomes.removed pair; ungated, status 0
          changed_when: >-
            (_rh_reap_rmrec.rc == _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.status
             and _rh_reap_rmrec.stdout == _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.stdout)
            if _rh_reap_regx.gate != '' else _rh_reap_rmrec.rc == 0
          failed_when: false

        - name: Recover each dead holder's obligation record of this destination (commands.recovery_lock; one command; busy retains)
          vars:
            _bs: "{{ rh.controller.bootstrap }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
            _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
            _prep: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.release_durability.recovery_prepare_program }}"
            _sp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_infix }}."
            _rp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.reaping_infix }}."
            _rec: "{{ _rh_reap_regx.recs[item] }}"
            _text: >-
              {{ lookup('ansible.builtin.template',
                        rh_repo_root ~ _bs.path_admission.separator ~ _ob.transaction.program_template_rel,
                        template_vars={'rh_ot_bs': _bs, 'rh_ot_wb': _wb, 'rh_ot_program': _dh.program}) }}
            # the declared params by name (dead_holder.program.params, admitted equal above): the persisted record paths
            # (record_fields paths: staging, local_temp, remote_temp), the reaping name of its staging (staging_infix ->
            # reaping_infix in the destination parent, s64 :8646-8647), the registry, lock name, token, the record bytes' sha256
            _pv: >-
              {{ {'registry_dir': _rh_reap_rg.dir, 'lock_name': _rh_reap_rg.lock_name, 'token': item, 'record_sha256': _rec.sha,
                  'reaping': (_rec.paths.staging | dirname) ~ _bs.path_admission.separator ~ _rp ~ (_rec.paths.staging | basename)[(_sp | length):],
                  'verdict': _rh_reap_tok[item]} | combine(_rec.paths) }}
          ansible.builtin.command:
            argv: >-
              {{ [rh_reap_flock, _ob.commands.recovery_lock.exclusive_arg, _ob.commands.recovery_lock.nonblocking_arg,
                  _ob.commands.recovery_lock.conflict_exit_arg, _lz.busy_rc | string, _rh_reap_rg.lock,
                  rh_reap_sh, _ob.commands.program.inline_arg, _text, _ob.commands.program.arg0]
                 + (_dh.program.params | map('extract', _pv) | list) }}
            # dead_holder.output terminator none: the stdout is classified exactly as printed (no trailing newline stripped)
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
          loop: >-
            {%- set ns = namespace(t=[]) -%}
            {%- if _rh_reap_regx.recover and _rh_reap_regx.known and _rh_reap_regx.lock_ok and _rh_reap_quiet -%}
              {%- for t in _rh_reap_regx.recs | sort -%}
                {%- if t in _rh_reap_tok and _rh_reap_tok[t] == 'dead' and t in _rh_reap_recmap
                       and _rh_reap_regx.recs[t].lease == _rh_reap_recmap[t]
                       and t not in _rh_reap_sel.blocked_tokens and t not in _rh_reap_left
                       and t in (_rh_reap_prepare.results | select('contains', 'rc') | select('contains', 'stdout') | selectattr('rc', 'equalto', _prep.output.success_rc) | selectattr('stdout', 'equalto', _prep.output.success) | map(attribute='item') | list) -%}{%- set ns.t = ns.t + [t] -%}{%- endif -%}
              {%- endfor -%}
            {%- endif -%}{{ ns.t }}
          register: _rh_reap_recov
          changed_when: >-
            'rc' in _rh_reap_recov and 'stdout' in _rh_reap_recov
            and _rh_reap_recov.rc == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.output.removed.rc
            and _rh_reap_recov.stdout == rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.output.removed.word
          failed_when: false

        # route op1w (dead_holder.output, s64 :8925-8935; r51 :7187-7188; B op1m :374-381): each recover result in exactly ONE
        # class. removed: rc output.removed.rc (0) and the WHOLE stdout the word output.removed.word (one line, no
        # terminator). retained: rc output.retained.rc (1) and the whole stdout one program.steps word other than that word
        # (retained at that step). busy: rc commands.busy_rc_from (lease.busy_rc) and no output at all. not_a_removal (other):
        # every other shape -- another rc, two lines, a terminator, a non-step word, rc 0 with another word, no line with rc 0
        # or 1, an absent rc or stdout. Only `removed` reaches the reaper's own absence observation; every other class retains
        # the record charged, its lease record and its recovery metadata, and is reported.
        - name: Classify each recover command result by the declared output grammar (removed only by the one admitted shape)
          vars:
            _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
          ansible.builtin.set_fact:
            _rh_reap_rcls: >-
              {%- set ns = namespace(m={}) -%}
              {%- for r in _rh_reap_recov.results -%}
                {%- set c = 'not_a_removal' -%}
                {%- if 'rc' in r and 'stdout' in r and r.rc is integer and r.stdout is string -%}
                  {%- if r.rc == _dh.output.removed.rc and r.stdout == _dh.output.removed.word -%}{%- set c = 'removed' -%}
                  {%- elif r.rc == _dh.output.retained.rc and r.stdout in _dh.program.steps and r.stdout != _dh.output.removed.word -%}{%- set c = 'retained' -%}
                  {%- elif r.rc == _lz.busy_rc and r.stdout == '' -%}{%- set c = 'busy' -%}
                  {%- endif -%}
                {%- endif -%}
                {%- set ns.m = ns.m | combine({r.item: c}) -%}
              {%- endfor -%}{{ ns.m }}

        - name: Observe each removed record path after its recovery command (no link followed; removal_proof observed)
          ansible.builtin.stat:
            path: "{{ _rh_reap_rg.dir ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          loop: "{{ _rh_reap_rcls | dict2items | selectattr('value', 'equalto', 'removed') | map(attribute='key') | sort | list }}"
          register: _rh_reap_regpost
          failed_when: false

        # route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING; C1 absence_observation needs_listing observe_record_absent and
        # release_proof_after_remove, s67 :8613, comment :8599-8601: "The rm status is not the proof"): ONE complete listing of
        # the registry directory after the recovery commands, on the play host (recovery runs only where _rh_reap_regx.recover:
        # the owner registry local to the play host), with the leaf_listing argv, locale and stdout rule. A recovered record is
        # observed absent only when its no-follow stat is not_found AND this listing (status 0, plain names) does not list its
        # name; a listed name is present (listed_but_unstatable observe: present). Runs only when a record was classified
        # removed and the listing tool is admitted here; otherwise no record is released.
        - name: List the obligation registry completely after the recovery commands (admitted find; absence_observation observe_record_absent)
          vars:
            _ll: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_ll.tool].path, _rh_reap_rg.dir] + _ll.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap[_ll.env_from[0]][_ll.env_from[1]] }}"
          register: _rh_reap_rpl
          changed_when: false
          failed_when: false
          when:
            - _rh_reap_hfok
            - _rh_reap_rcls | dict2items | selectattr('value', 'equalto', 'removed') | list | length > 0

        # Final held-token observation after durable lease cleanup and record recovery.
        # State known (applicable with a known owner registry): every token the owner registry still holds (a record or a
        # registry temp), minus the tokens whose record this run recovered (`removed`) and then OBSERVED absent. route op1x
        # (replaces the op1w never-selected note): not_applicable (registry_state_none: known, holds no token) keeps NO lease
        # record for the registry, so every lease record no remaining entry names is released (the distinct-target cleanup
        # positive). Not known (unknown applicability, an unreadable or
        # unattributable owner registry, or not a private directory of the owner uid): every token of a candidate lease record
        # (failed_or_unknown retained).
        - name: Decide the lease records the obligation registry still holds (release_order; unknown retains)
          vars:
            _lp: ".{{ rh_reap_dest | basename }}.{{ rh.controller.bootstrap.bundle.staging_retention.lease.lease_infix }}."
          ansible.builtin.set_fact:
            _rh_reap_keep: >-
              {%- set ns = namespace(k=[], rel=[]) -%}
              {#- route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING): released only with the stat not_found AND the complete
                  registry listing (integer status 0, empty or LF-ended stdout, every record a plain name) not listing the
                  token; a skipped, failed or other-shaped listing releases nothing (unknown: the lease record is kept) -#}
              {%- set pl = namespace(ok=false, names=[]) -%}
              {%- if 'rc' in _rh_reap_rpl and _rh_reap_rpl.rc is integer and _rh_reap_rpl.rc is not boolean and _rh_reap_rpl.rc == 0
                     and not ('skipped' in _rh_reap_rpl and _rh_reap_rpl.skipped) and 'stdout' in _rh_reap_rpl and _rh_reap_rpl.stdout is string
                     and (_rh_reap_rpl.stdout == '' or _rh_reap_rpl.stdout[-1:] == '\n') -%}
                {%- set pl.names = _rh_reap_rpl.stdout.split('\n')[:-1] if _rh_reap_rpl.stdout != '' else [] -%}
                {%- set pl.ok = pl.names | select('equalto', '') | list | length == 0
                                and pl.names | select('search', rh.controller.bootstrap.path_admission.separator | regex_escape) | list | length == 0 -%}
              {%- endif -%}
              {%- for r in _rh_reap_regpost.results -%}
                {%- if 'stat' in r and not ('failed' in r and r.failed) and not r.stat.exists and pl.ok and r.item not in pl.names -%}{%- set ns.rel = ns.rel + [r.item] -%}{%- endif -%}
              {%- endfor -%}
              {%- if _rh_reap_regx.known -%}{%- set ns.k = _rh_reap_regx.held | reject('in', ns.rel) | list -%}
              {%- else -%}{%- set ns.k = _rh_reap_sel.records | map('basename') | map('regex_replace', '^' ~ (_lp | regex_escape), '') | list -%}
              {%- endif -%}{{ {'keep': ns.k | unique | list, 'released': ns.rel} }}

        - name: Report the obligation registry recovery (recovered, retained busy / failed, leases kept for a charged obligation)
          vars:
            _ret: "{{ rh.controller.bootstrap.bundle.staging_retention }}"
            # per recover result, only the keys it has (membership; nothing substituted): token -> {rc, stdout, stderr}
            _rh_reap_rshow: >-
              {%- set ns = namespace(r={}, o={}) -%}
              {%- for r in _rh_reap_recov.results -%}
                {%- set v = r | dict2items | selectattr('key', 'in', ['rc', 'stdout', 'stderr']) | list | items2dict -%}
                {%- if _rh_reap_rcls[r.item] == 'retained' -%}{%- set ns.r = ns.r | combine({r.item: v}) -%}
                {%- elif _rh_reap_rcls[r.item] == 'not_a_removal' -%}{%- set ns.o = ns.o | combine({r.item: v}) -%}
                {%- endif -%}
              {%- endfor -%}{{ {'retained': ns.r, 'other': ns.o} }}
          ansible.builtin.debug:
            msg: >-
              owner obligation registry {{ _rh_reap_rg.dir }} for destination {{ rh_reap_dest }} on {{ inventory_hostname }}:
              registry applicability {{ _rh_reap_appl.state }} ({{ _rh_reap_appl.why }}; effect {{ _rh_reap_regx.effect }}
              pending {{ _rh_reap_appl.pending | to_json }}; kernel {{ _rh_reap_appl.kernel }}; boundary gate '{{ _rh_reap_appl.gate }}'); unknown because
              {{ _rh_reap_appl.unknown | to_json }}; overlaps {{ _rh_reap_appl.overlap | to_json }}; mount, namespace and identity
              evidence used {{ _rh_reap_appl.evidence | to_json }}; owner registry read (consulted only when applicable) known {{ _rh_reap_reg.known }}, state of this destination known {{ _rh_reap_regx.known }}, recovery here {{ _rh_reap_regx.recover }};
              unaccountable records held, by first failing record_parse check {{ _rh_reap_reg.unaccountable | to_json }};
              recovered and observed absent {{ _rh_reap_keep.released }};
              {{ _ret.busy_report }} {{ _rh_reap_rcls | dict2items | selectattr('value', 'equalto', 'busy') | map(attribute='key') | list }} (registry lock busy, retained);
              retained at a recover step {{ _rh_reap_rshow.retained | to_json }}; not a removal (any other output shape, retained)
              {{ _rh_reap_rshow.other | to_json }};
              lease records kept for a charged or unknown obligation {{ _rh_reap_keep.keep }}

        # Lease cleanup precedes final record recovery. Only actual outcomes plus independent
        # absence observations earn release; all retained and failed work remains visible below.
        - name: Report the reap result (reaped entries; entries left by a busy lock stay preserved)
          vars:
            _ret: "{{ rh.controller.bootstrap.bundle.staging_retention }}"
            _ra: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability }}"
            # busy: busy_rc on both branches (outcomes.busy.status_from, pinned by value, walks to lease.busy_rc)
            _busy: >-
              {{ (_rh_reap_mv.results + _rh_reap_rm.results + _rh_reap_rmrec.results)
                 | select('contains', 'rc') | selectattr('rc', 'equalto', _ret.lease.busy_rc) | map(attribute='item') | list }}
          # route op2b (codex 944): a lease record is reported reaped only on the declared outcomes.removed pair (gated) or
          # status 0 (ungated rm); retained only on the outcomes.retained pair; command failures are reported by the
          # reservation check below.
          ansible.builtin.debug:
            msg: >-
              {{ _ret.reaped_report }} {{ inventory_hostname }}
              {{ _rh_reap_rm.results | select('contains', 'rc') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}
              records {{ (_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                          | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.status)
                          | selectattr('stdout', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.stdout)
                          | map(attribute='item') | list)
                         if _rh_reap_regx.gate != '' else
                         (_rh_reap_rmrec.results | select('contains', 'rc') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list) }};
              boundary gate '{{ _rh_reap_regx.gate }}', lease records retained by it (record, stdout)
              {{ (_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                  | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.status)
                  | selectattr('stdout', 'in', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.stdout_one_of)
                  | map(attribute='item') | zip(_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                  | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.status)
                  | selectattr('stdout', 'in', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.stdout_one_of)
                  | map(attribute='stdout') | list) | list) if _rh_reap_regx.gate != '' else [] }}{{
              ('; ' ~ _ret.busy_report ~ ' ' ~ inventory_hostname ~ ' ' ~ (_busy | string) ~ ' (destination lock busy)') if _busy | length > 0 else '' }}

        - name: Re-list the scope after the reap
          vars:
            _bn: "{{ rh.controller.bootstrap.bundle }}"
          ansible.builtin.find:
            paths: "{{ rh_reap_dest | dirname }}"
            patterns:
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.reaping_infix }}.*"
              - ".{{ rh_reap_dest | basename }}.{{ _bn.staging_retention.lease.lease_infix }}.*"
            file_type: any
            hidden: true
            recurse: false
            follow: false
          register: _rh_reap_after

        # route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING, "including _rh_reap_regpost and its re-list"; C1 absence_observation
        # needs_listing observe_absent_staging / observe_absent_reaping, glob_decides never, nonzero_listing unknown): the
        # re-list above is ansible.builtin.find with glob patterns, which skips entries it cannot lstat, so its silence about a
        # name is NOT absence. The readback below therefore also takes ONE complete listing of the destination parent with the
        # leaf_listing argv, locale and stdout rule, on this play host, by the admitted tool (_rh_reap_hfok). A reaped entry is
        # observed gone only when this listing (integer status 0, empty or LF-ended stdout, plain-name records) does not list
        # its name; a failed command's entry converged only on the same observation. Anything else refuses (no reservation).
        - name: List the destination parent completely after the reap (admitted find; absence_observation readback)
          vars:
            _ll: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing }}"
          ansible.builtin.command:
            argv: "{{ [rh.controller.bootstrap.os_tools[_ll.tool].path, rh_reap_dest | dirname] + _ll.args }}"
            strip_empty_ends: false
          environment:
            LC_ALL: "{{ rh.controller.bootstrap[_ll.env_from[0]][_ll.env_from[1]] }}"
          register: _rh_reap_dls
          changed_when: false
          failed_when: false
          when: _rh_reap_hfok

        - name: Read the free space of the destination filesystem with the declared df (read-only)
          ansible.builtin.command:
            argv: ["{{ rh_reap_df }}", --output=avail, -B1, --, "{{ rh_reap_dest | dirname }}"]
          register: _rh_reap_df
          changed_when: false

        - name: Refuse if the reap did not converge or the reservation does not fit (backpressure; nothing reserved)
          vars:
            _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
            _ra: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.registry_applicability }}"
            # route op2b (codex 944): a gated lease record counts as released (and must then be OBSERVED absent in the re-list
            # below, the readback) only on the declared outcomes.removed pair; an ungated one on status 0.
            _gone: >-
              {{ (_rh_reap_mv.results | select('contains', 'rc') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list)
                 + (_rh_reap_rm.results | select('contains', 'rc') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list)
                 + ((_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                     | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.status)
                     | selectattr('stdout', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.stdout)
                     | map(attribute='item') | list)
                    if _rh_reap_regx.gate != '' else
                    (_rh_reap_rmrec.results | select('contains', 'rc') | selectattr('rc', 'equalto', 0) | map(attribute='item') | list)) }}
            # a failed command whose entry is STILL present (a competing reaper that already took the entry under the lock
            # makes this run's mv fail with the entry gone: converged, not a failure). route op1y (observation_boundary
            # differs / unreadable_or_unqualified: no_mutation_retained, s64 :8191-8192): a gated lease removal that re-read a
            # different or unreadable value (rc 1, a diagnostic word other than remove_failed) RETAINED its lease record like a
            # busy lock does; it is not a command failure (the next owned pass retries). remove_failed stays a failure.
            # route op2a (codex 942): malformed_invocation (exit 2, no removal) is a command FAILURE, never a retention.
            # route op2b (C1 SR922u outcomes, s64 :8230-8234, C1 open item 2; codex 944): on the gated branch the failures are
            # every lease-record result that is NOT one of the three declared pairs -- outcomes.removed (status 0 AND removed),
            # outcomes.retained (status 1 AND a word in stdout_one_of) or busy (busy_rc) -- whether or not its record is still
            # present; so remove_failed, malformed_invocation, a status-1 result with empty or undeclared stdout and a result
            # with no status are all failures. The ungated branch keeps the rule above (status not 0 and not busy_rc, entry
            # still present).
            _cmdfail: >-
              {{ ((_rh_reap_mv.results + _rh_reap_rm.results + (_rh_reap_rmrec.results if _rh_reap_regx.gate == '' else []))
                  | select('contains', 'rc') | rejectattr('rc', 'in', [0, _lz.busy_rc]) | map(attribute='item')
                  | intersect(_rh_reap_after.files | map(attribute='path') | list) | list)
                 + ([] if _rh_reap_regx.gate == '' else
                    (_rh_reap_rmrec.results | map(attribute='item') | list)
                    | difference(_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                                 | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.status)
                                 | selectattr('stdout', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.removed.stdout)
                                 | map(attribute='item') | list)
                    | difference(_rh_reap_rmrec.results | select('contains', 'rc') | select('contains', 'stdout')
                                 | selectattr('rc', 'equalto', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.status)
                                 | selectattr('stdout', 'in', _ra.observation_boundary.reobserve_then_mutate_one_command.outcomes.retained.stdout_one_of)
                                 | map(attribute='item') | list)
                    | difference(_rh_reap_rmrec.results | select('contains', 'rc') | selectattr('rc', 'equalto', _lz.busy_rc) | map(attribute='item') | list)) }}
            # route op2d: the complete listing of the destination parent ({ok, names}); ok only on an integer status 0, stdout
            # empty or LF-ended and every record a plain name (non-empty, no path_admission.separator)
            _dl: >-
              {%- set o = namespace(ok=false, names=[]) -%}
              {%- if 'rc' in _rh_reap_dls and _rh_reap_dls.rc is integer and _rh_reap_dls.rc is not boolean and _rh_reap_dls.rc == 0
                     and not ('skipped' in _rh_reap_dls and _rh_reap_dls.skipped) and 'stdout' in _rh_reap_dls and _rh_reap_dls.stdout is string
                     and (_rh_reap_dls.stdout == '' or _rh_reap_dls.stdout[-1:] == '\n') -%}
                {%- set o.names = _rh_reap_dls.stdout.split('\n')[:-1] if _rh_reap_dls.stdout != '' else [] -%}
                {%- set o.ok = o.names | select('equalto', '') | list | length == 0
                               and o.names | select('search', rh.controller.bootstrap.path_admission.separator | regex_escape) | list | length == 0 -%}
              {%- endif -%}{{ {'ok': o.ok, 'names': o.names} }}
            # route op2d: the entries of failed commands (status not 0 and not busy_rc; mv, rm and the ungated lease removal)
            # that the complete listing does NOT prove gone: each is a command failure (the op1x "a record already gone
            # converged" rule now needs that observation; the find re-list's silence is not absence)
            _unproven: >-
              {{ (_rh_reap_mv.results + _rh_reap_rm.results + (_rh_reap_rmrec.results if _rh_reap_regx.gate == '' else []))
                 | select('contains', 'rc') | rejectattr('rc', 'in', [0, _lz.busy_rc]) | map(attribute='item')
                 | map('basename') | select('in', _dl.names) | list }}
          ansible.builtin.assert:
            that:
              - _rh_reap_after.files | map(attribute='path') | intersect(_gone) | list | length == 0
              - _cmdfail | length == 0
              # route op2d: the readback by complete listing: it must be complete, list no released entry, and prove every
              # failed command's entry gone
              - _dl.ok
              - _gone | map('basename') | select('in', _dl.names) | list | length == 0
              - _unproven | length == 0
              - _rh_reap_df.stdout_lines | length == 2
              - _rh_reap_df.stdout_lines[-1] | trim is match('^[0-9]+$')
              - _rh_reap_df.stdout_lines[-1] | trim | int >= rh_reap_need
            fail_msg: >-
              REFUSED {{ rh.controller.bootstrap.bundle.staging_retention.budget.refusal }} on {{ inventory_hostname }}: a
              reaped entry is still present or a reap command failed ({{ _cmdfail }}; route op2d: complete listing ok
              {{ _dl.ok }}, failed entries still listed {{ _unproven }}), or {{ rh_reap_dest | dirname }} has
              free bytes (df avail output {{ _rh_reap_df.stdout_lines | to_json }}) below the required {{ rh_reap_need }}.
              Retained and charged: live {{ _rh_reap_sel.live }}, busy {{ _rh_reap_sel.busy }}, unknown {{ _rh_reap_sel.unknown }};
              recorded owners (machine, uid) {{ _rh_reap_recmap.values() | map(attribute='machine') | zip(_rh_reap_recmap.values() | map(attribute='uid')) | unique | list }}.
              No staging dir was reserved.
            quiet: true


- name: Create only after current durable obligation admission
  when: rh_reap_operation == rh.controller.entry_generation.render.n10.write_bound.obligations.reaper_operations.create
  block:
    - name: Bind this host's obligation registry (derived; nothing read or written)
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
      ansible.builtin.set_fact:
        _rh_reap_rg: >-
          {%- set sep = _bs.path_admission.separator -%}
          {%- set lk = namespace(v=_bs) -%}{%- for k in _ob.lock_from -%}{%- set lk.v = lk.v[k] -%}{%- endfor -%}
          {%- set rd = [rh_repo_root, _bs.work_roots.root_rel, _bs.work_roots.sub_roots[_ob.registry.sub], _ob.registry.rel] | join(sep) -%}
          {{ {'dir': rd, 'lock_name': lk.v, 'lock': rd ~ sep ~ lk.v} }}

    - name: Admit the complete declared creation effect before reading any record
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
        _sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
        _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
      ansible.builtin.assert:
        that:
          - "'rh_reap_effect' in vars and rh_reap_effect is mapping"
          - "(rh_reap_effect.keys() | sort) == (_sc.effect_fields | sort)"
          - "_sc.path_fields | map('extract', rh_reap_effect) | reject('string') | list | length == _sc.zero"
          - "_sc.path_fields | map('extract', rh_reap_effect) | reject('match', _bs.path_admission.regex) | list | length == _sc.zero"
          - rh_reap_effect.uid is string and rh_reap_effect.uid is match(_sc.decimal_ere) and rh_reap_effect.uid == (rh_reap_uid | string)
          - rh_reap_effect.destination == rh_reap_dest
          - rh_reap_effect.lease_identity == _rh_lease_rec
          - rh_reap_effect.lease_identity.token == rh_staging_lease
          - rh_reap_effect.record_sha256 is string and rh_reap_effect.record_sha256 is match(_sc.digest_pattern)
          - rh_reap_effect.record_text is string
          - "(rh_reap_effect.record_text | hash('sha256')) == rh_reap_effect.record_sha256"
          - rh_reap_effect.record_path == rh_reap_effect.registry_dir ~ _sep ~ rh_staging_lease
          - rh_reap_effect.registry_dir == _rh_reap_rg.dir and rh_reap_effect.registry_lock == _rh_reap_rg.lock
          - "(rh_reap_effect.staging | dirname) == (rh_reap_dest | dirname)"
          - rh_reap_effect.lease_path == (rh_reap_dest | dirname) ~ _sep ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ _lz.lease_infix ~ _sc.lease_name_separator ~ rh_staging_lease
          - rh_reap_effect.lease_temp_path == rh_reap_effect.staging ~ _sep ~ _sc.lease_temp_rel
          - "'rh_rsv_dirs' in vars and rh_reap_effect.inner_dirs == rh_rsv_dirs"
          - rh_reap_effect.inner_dirs is sequence and rh_reap_effect.inner_dirs is not string and rh_reap_effect.inner_dirs is not mapping
          - rh_reap_effect.inner_dirs | reject('string') | list | length == _sc.zero
          - rh_reap_effect.inner_dirs | reject('match', _sc.relative_dir_pattern) | list | length == _sc.zero
          - rh_reap_effect.inner_dirs | unique(case_sensitive=_bs.path_admission.case_sensitive) | list | length == rh_reap_effect.inner_dirs | length
          - "_sc.lease_temp_rel not in rh_reap_effect.inner_dirs"
          - rh_reap_effect.destination_lease_encoded_bytes is integer and rh_reap_effect.destination_lease_encoded_bytes is not boolean and rh_reap_effect.destination_lease_encoded_bytes > _sc.zero
          - not rh_reap_remote
          - _sc.template_rel in rh.controller.bootstrap.source_admission.members_rel
        fail_msg: "{{ _sc.refusal }}: undeclared, untyped or identity-mismatched creation effect; no application mutation performed"
        quiet: true

    - name: Admit each relative directory against the declared component exclusions
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
        _sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
      ansible.builtin.assert:
        that:
          - item.split(_sep) | intersect(_sc.path_refused_components) | list | length == _sc.zero
          - item == (item | basename) or (item | dirname) in rh_reap_effect.inner_dirs[:rh_reap_effect.inner_dirs.index(item)]
        fail_msg: "{{ _sc.refusal }}: inadmissible directory component"
        quiet: true
      loop: "{{ rh_reap_effect.inner_dirs }}"

    - name: Inspect the exact immutable obligation record and its registry lock
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: "{{ _sc.false }}"
        get_checksum: "{{ _sc.false }}"
        get_mime: "{{ _sc.false }}"
        get_attributes: "{{ _sc.false }}"
      loop: "{{ [rh_reap_effect.record_path, rh_reap_effect.registry_lock] }}"
      register: _rh_n13_effect_stat

    - name: Refuse record or lock outside the declared owner custody
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.assert:
        that:
          - item.stat.exists and item.stat.isreg and not item.stat.islnk
          - item.stat.uid == rh_reap_uid
          - not item.stat.wgrp and not item.stat.woth
          - item.item != rh_reap_effect.record_path or item.stat.mode == _sc.lease_mode
        fail_msg: "{{ _sc.refusal }}: immutable obligation or registry lock custody failed"
        quiet: true
      loop: "{{ _rh_n13_effect_stat.results }}"

    - name: Read the actual complete immutable obligation for this creation effect
      ansible.builtin.slurp:
        src: "{{ rh_reap_effect.record_path }}"
      register: _rh_n13_effect_readback

    - name: Bind the exact admitted obligation without another loader or merge
      ansible.builtin.set_fact:
        _rh_n13_effect_record: "{{ _rh_n13_effect_readback.content | b64decode | from_json }}"

    - name: Join the actual durable obligation to every creation input before any effect
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
        _rf: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.record_fields }}"
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.assert:
        that:
          - "(_rh_n13_effect_readback.content | b64decode) == rh_reap_effect.record_text"
          - "(_rh_n13_effect_readback.content | b64decode | hash('sha256')) == rh_reap_effect.record_sha256"
          - "(_rh_n13_effect_record.keys() | sort) == (_rf.values() | sort)"
          - _rh_n13_effect_record[_rf.token] == rh_staging_lease
          - _rh_n13_effect_record[_rf.destination] == rh_reap_effect.destination
          - _rh_n13_effect_record[_rf.lease] == _rh_lease_rec
          - _rh_n13_effect_record[_rf.paths].staging == rh_reap_effect.staging
          - _rh_n13_effect_record[_rf.destination_lease_encoded_bytes] is mapping
          - _rh_n13_effect_record[_rf.destination_metadata_inodes] is mapping
          - _rh_n13_effect_record[_rf.destination_metadata_bytes] is mapping
        fail_msg: "{{ _sc.refusal }}: durable obligation differs from this invocation effect; nothing created"
        quiet: true

    - name: Inspect the destination parent device before selecting its declared lease envelope
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.command:
        argv: "{{ [rh.controller.bootstrap.os_tools.stat.path] + _sc.lstat_args + [rh_reap_dest | dirname] }}"
      register: _rh_n13_parent_device
      changed_when: "{{ _sc.false }}"

    - name: Observe the covered destination lock without following a link
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.stat:
        path: "{{ (rh_reap_dest | dirname) ~ rh.controller.bootstrap.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ rh.controller.bootstrap.bundle.staging_retention.lease.lock_suffix }}"
        follow: "{{ _sc.false }}"
        get_checksum: "{{ _sc.false }}"
      register: _rh_n13_destination_lock

    - name: Admit the exact destination device and complete first-effect budget
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
        _rf: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.record_fields }}"
        _ob: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations }}"
        _bound: >-
          {%- set bs = rh.controller.bootstrap -%}
          {%- set wb = rh.controller.entry_generation.render.n10.write_bound -%}
          {%- set budget = _ob.destination_lease_serialization_budget -%}
          {%- set law = bs.source_admission.encodings.base64 -%}
          {%- set enc = namespace(v=rh) -%}
          {%- for key in wb.encoding_at.split(bs.source_admission.early_view.override.audit_join) -%}{%- set enc.v = enc.v[key] -%}{%- endfor -%}
          {%- set known = {'dev': _dev, 'inode': budget.inode_width_placeholder,
                           'uid': _rh_lease_rec.uid, 'perms': budget.staging_perms,
                           'type': budget.staging_type, 'path': rh_reap_effect.staging} -%}
          {%- set witness = namespace(value=_sc.empty_mapping) -%}
          {%- for field, source in budget.witness_fields.items() -%}{%- set witness.value = witness.value | combine({field: known[source]}) -%}{%- endfor -%}
          {%- set serialized = (_rh_lease_rec | combine(witness.value)) | to_json(**budget.canonical_json.value) -%}
          {%- set encoded = serialized | b64encode(encoding=enc.v) -%}
          {%- set size = (encoded | length) // law.group * law.bytes - encoded.count(law.pad) -%}
          {%- set effects = _ob.covered_effect_charges.destination_metadata_inodes -%}
          {%- set objects = dict(effects.objects | map(attribute='id') | zip(effects.objects)) -%}
          {%- set lock_count = objects.destination_lock.inodes * (not _rh_n13_destination_lock.stat.exists) -%}
          {%- set inputs = _ob.n13_first_effect_envelope_inputs -%}
          {{ {'lease': size * budget.lease_copies,
              'inodes': lock_count + objects.staging_directory.inodes + (rh_reap_effect.inner_dirs | length) * effects.unit + objects.own_lease_file.inodes,
              'bytes': lock_count * inputs.empty_lock_logical_bytes.value + inputs.empty_staging_directory_logical_bytes.value + (rh_reap_effect.inner_dirs | length) * inputs.empty_inner_directory_logical_bytes.value} }}
        _parts: "{{ _rh_n13_parent_device.stdout.split(_sc.formats.field_separator) }}"
        _dev: "{{ _parts[_sc.lstat_fields.index('dev')] }}"
      ansible.builtin.assert:
        that:
          - _rh_n13_parent_device.rc == _sc.statuses.success
          - "_parts | length == _sc.lstat_fields | length"
          - "_parts[_sc.lstat_fields.index('type')] == _sc.directory_type"
          - _dev is match(_sc.decimal_ere)
          - "_dev in _rh_n13_effect_record[_rf.destination_lease_encoded_bytes]"
          - "_rh_n13_effect_record[_rf.destination_lease_encoded_bytes][_dev] == rh_reap_effect.destination_lease_encoded_bytes"
          - "_dev in _rh_n13_effect_record[_rf.destination_metadata_inodes]"
          - "_dev in _rh_n13_effect_record[_rf.destination_metadata_bytes]"
          - "_rh_n13_effect_record[_rf.destination_metadata_inodes][_dev] is integer and _rh_n13_effect_record[_rf.destination_metadata_inodes][_dev] is not boolean"
          - "_rh_n13_effect_record[_rf.destination_metadata_bytes][_dev] is integer and _rh_n13_effect_record[_rf.destination_metadata_bytes][_dev] is not boolean"
          - "_rh_n13_effect_record[_rf.destination_metadata_inodes][_dev] >= _bound.inodes"
          - "_rh_n13_effect_record[_rf.destination_metadata_bytes][_dev] >= _bound.bytes"
          - "rh_reap_effect.destination_lease_encoded_bytes >= _bound.lease"
        fail_msg: "{{ _sc.refusal }}: record does not bind the observed destination device envelope"
        quiet: true

    - name: Create the charged absent destination lock without overwriting an existing entry
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.command:
        argv: "{{ [rh_reap_sh, _sc.lock_create.inline_arg, _sc.lock_create.script, _sc.lock_create.arg0, _lz.lock_file.create_umask, (rh_reap_dest | dirname) ~ _bs.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ _lz.lock_suffix] }}"
      when: not _rh_n13_destination_lock.stat.exists
      register: _rh_n13_destination_lock_create
      failed_when: "{{ _sc.false }}"

    - name: Read the destination lock back independently before using it
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.stat:
        path: "{{ (rh_reap_dest | dirname) ~ rh.controller.bootstrap.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ rh.controller.bootstrap.bundle.staging_retention.lease.lock_suffix }}"
        follow: "{{ _sc.false }}"
        get_checksum: "{{ _sc.false }}"
      register: _rh_n13_destination_lock_readback

    - name: Admit covered destination lock ownership and shape
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
        _s: "{{ _rh_n13_destination_lock_readback.stat }}"
      ansible.builtin.assert:
        that:
          - _s.exists and _s.isreg and not _s.islnk and _s.uid == rh_reap_uid
          - not _s.wgrp and not _s.woth
          - _rh_n13_destination_lock.stat.exists or _s.mode == rh.controller.bootstrap.bundle.staging_retention.lease.lock_file.mode
        fail_msg: "{{ _sc.refusal }}: destination lock custody is not admitted"
        quiet: true

    - name: Create staging and publish its exact creation witness under one destination lock
      vars:
        _bs: "{{ rh.controller.bootstrap }}"
        _wb: "{{ rh.controller.entry_generation.render.n10.write_bound }}"
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
        _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
        _lock: "{{ (rh_reap_dest | dirname) ~ _bs.path_admission.separator ~ _sc.lease_name_separator ~ (rh_reap_dest | basename) ~ _sc.lease_name_separator ~ _lz.lock_suffix }}"
        _text: "{{ lookup('ansible.builtin.template', rh_repo_root ~ _bs.path_admission.separator ~ _sc.template_rel, template_vars={'rh_sc_bs': _bs, 'rh_sc_wb': _wb, 'rh_sc_effect': rh_reap_effect, 'rh_sc_operation': _sc.operations.create, 'rh_sc_witness': _sc.empty_mapping, 'rh_sc_source_path': _sc.empty_text, 'rh_sc_target_path': _sc.empty_text}) }}"
      ansible.builtin.command:
        argv: "{{ [rh_reap_flock, _lz.reap_lock.exclusive_arg, _lz.reap_lock.nonblocking_arg, _lz.reap_lock.conflict_exit_arg, _lz.busy_rc | string, _lock, rh_reap_sh, _wb.obligations.commands.program.inline_arg, _text, _wb.obligations.commands.program.arg0] }}"
        strip_empty_ends: "{{ _sc.false }}"
      environment:
        LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
      register: _rh_n13_create
      changed_when: _rh_n13_create.rc == _sc.statuses.success
      failed_when: "{{ _sc.false }}"

    - name: Require actual successful same-call creation and witness readback
      vars:
        _sc: "{{ rh.controller.entry_generation.render.n10.write_bound.obligations.staging_creation }}"
      ansible.builtin.assert:
        that:
          - _rh_n13_create.rc is integer and _rh_n13_create.rc is not boolean
          - _rh_n13_create.rc == _sc.statuses.success
          - _rh_n13_create.stdout == _sc.output.created
        fail_msg: "{{ _sc.refusal }}: same-call creation/witness proof failed; preserve all objects and complete obligation charge"
        quiet: true
