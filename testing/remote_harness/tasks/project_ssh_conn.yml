---
# testing/remote_harness/tasks/project_ssh_conn.yml -- the ONE controller projection rh_conn (per target of the declared
# group: the run mode's ssh args + B's ONE admitted ProxyJump form), consumed by tasks/admit_transport.yml and the
# target play's ansible_ssh_common_args. route r4k S-TRANSPORT (codex-tick492): target_bootstrap.yml, testing/e2e/guest/
# guest.yml and observe.yml all INCLUDE this file (the inline copies are gone), so there is ONE projection. The form is
# classified by the ONE shared interpreter (H-FORM-1 lme_rh_proxy_outcome over the declared
# ssh_auth.composition.form_semantics; the capture group is the declared tests.<capture test>.group, applied by the
# interpreter, never re-implemented here), with the RUN mode as classification context only (mode admission stays
# at admit_transport.yml task 1 and the seed). Controller play only (localhost), after tasks/resolve_harness.yml
# (needs rh and the engine role's filter plugins).
#
# Per target: proxy_jump = the interpreter's EXACT jump (null when the form is not admitted); ansible_ssh_common_args =
# the run mode's declared ssh_common_args + the ProxyJump clause for a captured jump, or null when the form is not
# admitted or the run mode is not a declared mode (nothing is composed from a refused form; admit_transport.yml task 1
# refuses that host before any effect). No fallback value is projected.

- name: Refuse a projection for a target group the inventory does not define (no implied empty group)
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.inventory.target_group in groups
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.ssh_auth.refusal }}: the declared target group
      {{ rh.controller.bootstrap.inventory.target_group }} is not an inventory group; rh_conn is not projected and no
      transport is composed.
    quiet: true

- name: Project each target's effective SSH common args (run mode args + B's admitted ProxyJump form; derived output)
  vars:
    _sa: "{{ rh.controller.bootstrap.ssh_auth }}"
    _fr: "{{ rh.controller.bootstrap.ssh_auth.composition.form_semantics.result }}"
    _run_mode: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.ssh_auth.env_mode) }}"
    # the declared FIXED-jump outcome values (form_semantics.outcomes {value, jump}); any other jump is a capture
    _nojump: "{{ rh.controller.bootstrap.ssh_auth.composition.form_semantics.outcomes.values() | selectattr('jump', 'defined') | map(attribute='jump') | list }}"
  ansible.builtin.set_fact:
    rh_conn: >-
      {%- set ns = namespace(d={}) -%}
      {%- for h in groups[rh.controller.bootstrap.inventory.target_group] -%}
      {%- set o = hostvars[h] | lme_rh_proxy_outcome(_sa.composition, _sa, _run_mode) -%}
      {%- set j = o[_fr.jump] -%}
      {%- set args = (_sa.modes[_run_mode].ssh_common_args ~ ((' -o ProxyJump=' ~ j) if j not in _nojump else ''))
            if (o[_fr.admitted] and _run_mode in _sa.modes) else none -%}
      {%- set ns.d = ns.d | combine({h: {'proxy_jump': j, 'ansible_ssh_common_args': args}}) -%}
      {%- endfor -%}
      {{ ns.d }}
