---
# testing/remote_harness/tasks/project_ssh_conn.yml -- the controller projection rh_conn (per target of the declared
# group: the run mode's ssh args + B's ONE admitted ProxyJump form), consumed by tasks/admit_transport.yml and the
# target play's ansible_ssh_common_args. Text IDENTICAL to target_bootstrap.yml's task of the same name (r3g
# ACCEPTED-FORMS, codex 040323); extracted as a task file for observe.yml so the rule is not re-derived. PROPOSAL (not
# applied here): target_bootstrap.yml includes this file instead of its inline copy (B-graph / route owner decision),
# leaving ONE projection. Controller play only (localhost), after tasks/resolve_harness.yml (needs rh).
- name: Project each target's effective SSH common args (run mode args + B's admitted ProxyJump form; derived output)
  vars:
    _sa: "{{ rh.controller.bootstrap.ssh_auth }}"
    _mode_args: "{{ (_sa.modes[lookup('ansible.builtin.env', _sa.env_mode)] | default({})).ssh_common_args | default('') }}"
  ansible.builtin.set_fact:
    rh_conn: >-
      {% set ns = namespace(d={}) %}{% for h in groups[rh.controller.bootstrap.inventory.target_group] | default([]) %}{% set raw
      = hostvars[h][_sa.composition.inventory_forms.var] | default('') %}{% set jump = (raw | regex_replace(_sa.composition.proxy_jump.form_regex, '\\1'))
      if raw is match(_sa.composition.proxy_jump.form_regex) else '' %}{% set ns.d = ns.d | combine({h: {'inventory_common_args': raw,
      'proxy_jump': jump, 'ansible_ssh_common_args': _mode_args ~ ((' -o ProxyJump=' ~ jump) if jump | length > 0 else '')}}) %}{% endfor
      %}{{ ns.d }}
