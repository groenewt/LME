---
# testing/remote_harness/tasks/fixture_checkout.yml -- DECLARED PRODUCER of one checkout fixture (route H3; codex 212700
# release, codex 211754 presentation-only case, codex 220953 canonical relocation). CONTROLLER-local, modules only (no
# shell text editing, no template rendering, no git executed): applies ONE declared case of tests/bundle_fixtures.yml
# checkout_cases to G's Route 3 variant clone and verifies the clone differs from its source in exactly that way.
# The ONLY bundle producer stays package.yml (tasks/package_bundle.yml, unchanged), which the caller runs from the clone.
# Requires resolve_policy.yml (rh, rh_repo_root = the CANONICAL run checkout) earlier in the play. Inputs (include
# params; registry-reserved):
#   rh_fx_clone  the variant clone: G's tests/controls/tasks/variant_clone.yml output {ctl}/vclone (an exact-commit
#                --no-hardlinks clone inside the run dir, i.e. under <rh_repo_root>/<work_roots.root_rel>/); never the
#                canonical checkout, never outside its work root; it must be a real directory holding a .git directory
#   rh_fx_route3 G's Route 3 clone record {ctl, vclone, head} of THAT clone (variant_clone.yml _rhc_t fields): the
#                producer binds rh_fx_clone == rh_fx_route3.vclone == rh_fx_route3.ctl + '/vclone' and the clone's
#                detached .git/HEAD == rh_fx_route3.head (read as a file) before any mutation
#   rh_fx_case   the checkout_cases id
# Common admission (this file), then ONE kind (closed vocabulary; a static include per kind, its `when` decided before
# the file loads, so no task of the other kind is ever templated):
#   edit      tasks/fixture_checkout_edit.yml: ONE exact, bounded text replacement (anchor EXACTLY once) in ONE
#             non-profile source file
#   relocate  tasks/fixture_checkout_relocate.yml: the declared relocation of a COMPLETE source subtree (exactly its
#             declared entries, moved byte- and mode-identical, the old directory removed) plus counted registry
#             edits old-dir/ -> new-dir/, against a clone whose profile G patched with the case's profile_case
# Refused (REFUSED RH-FIXTURE-UNSUPPORTED, nothing written) unless the FULL ancestry through the actual clone, from /
# down to rh_fx_clone itself, passes the ONE resolved ancestry rule (tasks/admit_ancestry.yml: every component a real
# directory, no link, owner / group / other rules) -- here, and again by each kind at its USE boundary right before
# its first write (codex 220515 H3-FIXTURE-ANCESTOR-ESCAPE: a lexical prefix of <rh_repo_root>/<root_rel>/ is not
# containment when a component such as <repo>/.work/link redirects; path-string normalization alone is not accepted),
# and the clone is bound to G's Route 3 record (above). Source custody (each kind): every clone file it changes must
# equal the canonical checkout's file (bytes and mode) before the change. Output (derived fact): rh_fx_result, schema
# fixture-checkout-result/1 (the kind file documents its fields); status_lines = the EXACT porcelain v1
# (--untracked-files=all) lines the fixture adds to the clone's status against {head}: G's clone admission
# (variant_clone.yml clone_status) is the declared mutation set = the profile line plus every applied fixture's
# status_lines, compared as SORTED lists (git prints tracked entries before untracked ones).

- name: Admit the fixture inputs and the catalog (data only; no Jinja start delimiter; exactly one case of this id)
  vars:
    _rh_fx_text: "{{ lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/tests/bundle_fixtures.yml') }}"
    _rr: "{{ rh.controller.bootstrap.work_roots.root_rel }}"
  ansible.builtin.assert:
    that:
      - rh_fx_clone is defined and rh_fx_clone is string and rh_fx_clone is match(rh.controller.bootstrap.path_admission.regex)
      - rh_fx_clone is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
      - rh_fx_clone != rh_repo_root
      - rh_fx_clone.startswith(rh_repo_root ~ '/' ~ _rr ~ '/')
      - rh_fx_route3 is defined and rh_fx_route3 is mapping
      - (rh_fx_route3.keys() | map('string') | sort | list) == ['ctl', 'head', 'vclone']
      - rh_fx_route3.vclone == rh_fx_clone and rh_fx_route3.vclone == rh_fx_route3.ctl ~ '/vclone'
      - (rh_fx_route3.head | string) is match('^[0-9a-f]{40}([0-9a-f]{24})?$')
      - rh_fx_case is defined and rh_fx_case is string
      - _rh_fx_text is not search('[{][{%#]')
      - (_rh_fx_text | from_yaml).schema == 'bundle-fixtures/1'
      - (_rh_fx_text | from_yaml).checkout_cases | selectattr('id', 'equalto', rh_fx_case) | list | length == 1
    fail_msg: >-
      REFUSED RH-FIXTURE-UNSUPPORTED: fixture_checkout.yml needs rh_fx_clone = a normalized absolute clone path under
      {{ rh_repo_root }}/{{ _rr }}/ (never the canonical checkout; got {{ rh_fx_clone | default('absent') }}), rh_fx_route3 =
      G's Route 3 record {ctl, vclone, head} of that clone (vclone == rh_fx_clone == ctl/vclone, head a commit id), and rh_fx_case
      naming exactly ONE checkout_cases entry of a delimiter-free bundle-fixtures/1 catalog (got {{ rh_fx_case | default('absent') }}).
    quiet: true

- name: Admit the full ancestry through the actual clone by the ONE resolved rule (no linked component; codex 220515)
  ansible.builtin.include_tasks: admit_ancestry.yml
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ rh_fx_clone }}"
    rh_anc_refusal: RH-FIXTURE-UNSUPPORTED

- name: Bind the selected case (catalog data; asserted delimiter-free above)
  ansible.builtin.set_fact:
    _rh_fx_c: >-
      {{ (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/tests/bundle_fixtures.yml') | from_yaml).checkout_cases
         | selectattr('id', 'equalto', rh_fx_case) | first }}

- name: Refuse a case kind outside the closed vocabulary
  ansible.builtin.assert:
    that:
      - _rh_fx_c.kind is defined and _rh_fx_c.kind in ['edit', 'relocate']
    fail_msg: "REFUSED RH-FIXTURE-UNSUPPORTED: checkout case {{ rh_fx_case }} declares kind {{ _rh_fx_c.kind | default('absent') }} (edit | relocate)"
    quiet: true

- name: Stat the clone, its .git and .git/HEAD (no link followed)
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: ["{{ rh_fx_clone }}", "{{ rh_fx_clone }}/.git", "{{ rh_fx_clone }}/.git/HEAD"]
  register: _rh_fx_cl

- name: Refuse a clone that is not a real directory holding a .git directory with a regular HEAD file
  vars:
    _c: "{{ _rh_fx_cl.results[:2] | map(attribute='stat') | list }}"
    _h: "{{ _rh_fx_cl.results[2].stat }}"
  ansible.builtin.assert:
    that:
      - _c | selectattr('exists') | selectattr('isdir') | rejectattr('islnk') | list | length == 2
      - _h.exists and _h.isreg and not _h.islnk
    fail_msg: "REFUSED RH-FIXTURE-UNSUPPORTED: {{ rh_fx_clone }} must be a real directory with a .git directory holding a regular HEAD file (no link)"
    quiet: true

- name: Read the clone's HEAD (a file; no git executed)
  ansible.builtin.slurp:
    src: "{{ rh_fx_clone }}/.git/HEAD"
  register: _rh_fx_head

- name: Bind the clone to G's Route 3 output (detached at exactly its head)
  ansible.builtin.assert:
    that:
      - (_rh_fx_head.content | b64decode | trim) == (rh_fx_route3.head | string)
      - (_rh_fx_head.content | b64decode | length) == (rh_fx_route3.head | string | length) + 1
    fail_msg: >-
      REFUSED RH-FIXTURE-UNSUPPORTED: {{ rh_fx_clone }}/.git/HEAD is not the detached head {{ rh_fx_route3.head }} of G's
      Route 3 clone record (a symbolic ref, another commit, or not that clone).
    quiet: true

- name: Apply the edit case (kind edit)
  ansible.builtin.include_tasks: fixture_checkout_edit.yml
  when: _rh_fx_c.kind == 'edit'

- name: Apply the relocation case (kind relocate)
  ansible.builtin.include_tasks: fixture_checkout_relocate.yml
  when: _rh_fx_c.kind == 'relocate'
