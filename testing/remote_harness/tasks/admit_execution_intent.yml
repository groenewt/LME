- name: Clear intent outputs before admitting the selected raw inputs
  ansible.builtin.set_fact:
    "{{ fw_contract.producer_intent.validation.output_fact }}": "{{ fw_contract.validation.no_context_output }}"
    "{{ fw_contract.producer_intent.validation.serialized_output_fact }}": "{{ fw_contract.validation.no_context_output }}"
    "{{ fw_contract.producer_intent.validation.parsed_fact }}": "{{ fw_contract.validation.no_context_output }}"
    "{{ fw_contract.producer_intent.validation.strict_fact }}": "{{ fw_contract.validation.no_context_output }}"

- name: Require actual raw input types and refuse simultaneous selectors
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.producer_intent.validation.diagnostics.selector }}"
    that:
      - fw_intent_json is string or fw_intent_json is none
      - fw_ingress_json is string or fw_ingress_json is none
      - fw_intent_json is none or fw_ingress_json is none

- name: Refuse caller authority over intent publication facts
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.producer_intent.validation.diagnostics.protected }}"
    that:
      - fw_untyped_caller_vars is mapping
      - fw_contract.producer_intent.validation.output_fact not in fw_untyped_caller_vars
      - fw_contract.producer_intent.validation.serialized_output_fact not in fw_untyped_caller_vars

- name: Admit a selected producer intent without inventing its future occurrence
  when: fw_intent_json is not none
  block:
    - name: Parse JSON and preserve strict duplicate-key checking
      ansible.builtin.set_fact:
        "{{ fw_contract.producer_intent.validation.parsed_fact }}": "{{ fw_intent_json | from_json }}"
        "{{ fw_contract.producer_intent.validation.strict_fact }}": "{{ fw_intent_json | lme_manifest_strict(fw_contract.producer_intent.validation.diagnostic_label, fw_parse_contract) }}"

    - name: Require matching strict construction and exact request shape
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.producer_intent.validation.diagnostics.shape }}"
        that:
          - fw_intent_decoded | lme_type_aware_equal(fw_intent_strict_decoded)
          - fw_intent_decoded is mapping
          - fw_intent_decoded | list | sort == [fw_contract.ingress.r.mode, fw_contract.producer_intent.allocation_role] | sort

    - name: Require the existing declared allocation mode
      ansible.builtin.assert:
        quiet: true
        fail_msg: "{{ fw_contract.producer_intent.validation.diagnostics.shape }}"
        that:
          - fw_intent_decoded[fw_contract.ingress.r.mode] is string
          - fw_intent_decoded[fw_contract.ingress.r.mode] in fw_contract.allocation.modes.values()

    - name: Check exact four-field allocation through the existing reusable field validator
      ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.fields }}"
      vars:
        fw_field_value: "{{ fw_intent_decoded[fw_contract.producer_intent.allocation_role] }}"
        fw_field_names: "{{ fw_contract.producer_intent.allocation_roles | map(fw_contract.validation.jinja.extract, fw_contract.f) | list }}"
        fw_field_kinds: "{{ fw_contract.field_kinds }}"
        fw_field_patterns: "{{ fw_contract.field_patterns }}"

    - name: Publish only the admitted intent and its exact JSON serialization
      ansible.builtin.set_fact:
        "{{ fw_contract.producer_intent.validation.output_fact }}": "{{ fw_intent_decoded }}"
        "{{ fw_contract.producer_intent.validation.serialized_output_fact }}": "{{ fw_intent_decoded | to_json }}"
