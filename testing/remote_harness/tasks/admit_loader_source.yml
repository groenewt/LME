        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].keys() | list | sort) == (_rh_sa_reg.carrier_state.node.keys() | list | sort)
        and _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].key == _rh_sa_reg.carrier_state.node.key
        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].words | to_json(sort_keys=true))
