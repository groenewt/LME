# records-lrh-als-02 ALS2-01 (records-c1-framework-28 OW-28-01, C-28-01): the launchers' declared transport words
# (source_admission.launch_transports values) are exactly the ingress declaration transports keys, as a set: every
# declared transport has a launcher and no launcher names an undeclared one. The ingress companions node is typed
# here, before the per-companion bind below iterates it.
- name: "SOURCE ADMISSION -- refuse launcher transport words that are not exactly the ingress declaration transports"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.launch_transports is mapping
      - (_rh_sa_decl.launch_transports.values() | list | unique | sort) == (_rh_sa_regadm.ingress.transports.keys() | list | sort)
      - _rh_sa_regadm.ingress.companions is mapping
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: the declared launcher transport words are not exactly the
      ingress declaration transports, or the ingress companions node is not a mapping
      {{ [_rh_sa_decl.launch_transports, _rh_sa_regadm.ingress.transports.keys() | list | sort] | to_json }}
    quiet: true

# records-lrh-als-02 ALS2-01 (records-c1-framework-27 OW-27-01; seat decision i: the ingress declaration is the name
# authority): each ingress companion variable is the run_local pinned binding its launch record field names -- a
# run_local.pinned_vars key whose value is a declared pinned placeholder, at a one-key path naming a record key whose
# construction field is binding-sourced and pins exactly that variable. Names are read from the declaration (no quoted
# name, no early_names widening); the value equality with the envelope is the ingress render's (macro :45).
- name: "SOURCE ADMISSION -- refuse an ingress companion that is not the run_local pinned binding its record field names"
  ansible.builtin.assert:
    that:
      - _rh_sa_regadm.ingress.companions[item].var in _rh_sa_bs.work_roots.run_local.pinned_vars
      - _rh_sa_bs.work_roots.run_local.pinned_vars[_rh_sa_regadm.ingress.companions[item].var] in (_rh_sa_bs.work_roots.run_local.pinned_placeholders.values() | list)
      - _rh_sa_regadm.ingress.companions[item].path is sequence and _rh_sa_regadm.ingress.companions[item].path is not string
      - (_rh_sa_regadm.ingress.companions[item].path | length) == 1
      - (_rh_sa_regadm.ingress.companions[item].path | first) in _rh_sa_decl.bootstrap_input.record_keys
      - (_rh_sa_regadm.ingress.companions[item].path | first) in _rh_sa_decl.bootstrap_input.construction.fields
      - _rh_sa_decl.bootstrap_input.construction.fields[_rh_sa_regadm.ingress.companions[item].path | first].source == _rh_sa_decl.bootstrap_input.construction.sources.binding
      - _rh_sa_decl.bootstrap_input.construction.fields[_rh_sa_regadm.ingress.companions[item].path | first].pinned == _rh_sa_regadm.ingress.companions[item].var
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: an ingress companion is not the run_local pinned binding
      its launch record field names (a pinned_vars key filled from a declared placeholder, at a binding-sourced
      construction field that pins exactly that variable)
      {{ [item, _rh_sa_regadm.ingress.companions[item].var, _rh_sa_regadm.ingress.companions[item].path] | to_json }}
    quiet: true
  # seat ruling (records-lrh-als-02 parse): iterate the declared companion keys and read each value by key (the
  # ALS :545 keys() idiom); no dict2items field is read, so no literal key / value attribute word is needed
  loop: "{{ _rh_sa_regadm.ingress.companions.keys() | list }}"

- name: "SOURCE ADMISSION -- bind the admitted source input of this phase (projected + protected; reserved output)"
  ansible.builtin.set_fact:
    _rh_sa_in: >-
      {%- if _rh_sa_reg.early_names.rh_rp_input.var in vars -%}
      {%- set idf = _rh_sa_decl.bootstrap_input.record_keys | intersect(_rh_sa_bs.genesis.initializer.root_input['keys']) | list -%}
      {{ dict(idf | zip(idf | map('extract', rh_rp_input)) | map('list') | list)
         | combine({'controller_delegate': vars[_rh_sa_decl.bootstrap_input.construction.fields.controller_delegate.pinned], 'tools': _rh_sa_tools}) }}
      {%- else -%}{{ rh_source_bootstrap }}{%- endif -%}

# The FULL exact typed record shape, on BOTH phases (separate from the cold shape above): the exact-record check the
# base kept at :162 (removed there by S2-ALS-03), now over the ONE admitted input. Full delegation unchanged; a
# record-free host is the declared delegate (admit_controller.yml already admitted the controller host and connection before N2).
# lineage-rh sweep fix (seat ruling, :404 option 1): the type row is its own task, so the full-record diagnostic below
# reads the key list unconditionally (no fallback form).
- name: "SOURCE ADMISSION -- refuse an admitted source input that is not a mapping"
  ansible.builtin.assert:
    that:
      - _rh_sa_in is mapping
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: the admitted source input is not a mapping
      {{ [_rh_sa_in | type_debug, inventory_hostname] | to_json }}
    quiet: true
- name: "SOURCE ADMISSION -- refuse an admitted source input that is not exactly the declared full record (typed; both phases)"
  ansible.builtin.assert:
    that:
      # records-ctx-producer-02 (codex-tick740): this is admission_stages executable_closure. Full phase: the launch record
      # is the complete record. Record-free phase: context is absent until complete_projection_and_carrier, so the admitted
      # input is exactly record_keys without context (the :119 precondition: what the cold record lacks is exactly
      # context / controller_delegate / tools, and A4 adds the last two).
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or (_rh_sa_in.keys() | list | sort) == (_rh_sa_decl.bootstrap_input.record_keys | sort)
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or _rh_sa_in.context is mapping
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_in.keys() | list | sort) == (_rh_sa_decl.bootstrap_input.record_keys | difference(_rh_sa_decl.carrier_state_schema.complete_only) | sort)
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_in.keys() | list | intersect(_rh_sa_decl.carrier_state_schema.complete_only) | length) == 0
      - _rh_sa_in.tools is mapping
      - _rh_sa_in.controller_delegate is string
      - _rh_sa_in.declaration_rel is string
      - _rh_sa_in.declaration_sha256 is string
      - _rh_sa_in.declaration_path is sequence and _rh_sa_in.declaration_path is not string
      - _rh_sa_in.edition is string
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or inventory_hostname == _rh_sa_in.controller_delegate
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: the admitted source input is not exactly the declared
      source_admission.bootstrap_input.record_keys record (typed), or a record-free host is not the declared delegate
      {{ [_rh_sa_in.keys() | list | sort, inventory_hostname] | to_json }}
    quiet: true

# records-context-template-02 (C1 s22, S21-ALS02-TRIPLE-RENDER; supersedes the three renders of records-contract-set-kind-01
# C1-SK-ALS-01 / -02): the member_rel_grammar entry is rendered ONCE per entry, on both phases, into the reserved fact
# _rh_sa_mg, after the values it reads are type-checked here (the C1-SK-ALS-01 type rows, moved, plus the type of the
# members list the macro iterates). The :158 assert (output shape; full-phase equality) and the member refusal read it.
- name: "SOURCE ADMISSION -- refuse a member rel grammar input the macro would read untyped (before its one render)"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.members_rel is sequence and _rh_sa_decl.members_rel is not string and _rh_sa_decl.members_rel is not mapping
      - _rh_sa_reg.vocabulary is mapping and _rh_sa_reg.vocabulary.tests is mapping and _rh_sa_reg.vocabulary.attributes is mapping
      - _rh_sa_reg.member_rel_grammar is mapping and _rh_sa_reg.member_rel_grammar.output is mapping
      - _rh_sa_reg.member_rel_grammar.pattern is string and _rh_sa_reg.patterns[_rh_sa_reg.member_rel_grammar.pattern] is mapping
      - _rh_sa_reg.path_law is mapping and _rh_sa_reg.member_rel_grammar.entry_rel is string
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [_rh_sa_phase, _rh_sa_decl.members_rel is sequence, _rh_sa_reg.member_rel_grammar is mapping] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- bind the member rel grammar result ONCE (the one render; derived, reserved)"
  ansible.builtin.set_fact:
    _rh_sa_mg: >-
      {{ lookup('ansible.builtin.template', rh_repo_root ~ _rh_sa_reg.path_law.separator ~ _rh_sa_reg.member_rel_grammar.entry_rel,
                template_vars={'rh_mg_members': _rh_sa_decl.members_rel}) | from_json }}

- name: "SOURCE ADMISSION -- refuse a launcher record or interface the bound declaration does not declare"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.bootstrap_input.construction.fields.controller_delegate.pinned in _rh_sa_bs.work_roots.run_local.pinned_vars
      - vars[_rh_sa_decl.bootstrap_input.construction.fields.controller_delegate.pinned] == _rh_sa_in.controller_delegate
      - (_rh_sa_bs.work_roots.run_local.inventory | regex_findall(_rh_sa_reg.patterns[_rh_sa_bs.work_roots.run_local.pattern_roles.target])) == [_rh_sa_in.controller_delegate]
      # records-dkjoin-02 (codex-tick724 OD-DKJ02-INCLUDE): the executable include selection and the git argv vectors are the
      # LAUNCH-BOUND git node (launch field early_view.git_field -> source_admission.git, walked by the launch binding over
      # the packaged RESOLVED node). The bound declaration's git node must equal it type-strict HERE, before the include
      # below selects code and before any git argv is built; the include and rh_gp_git then take the carrier value.
      # records-staged-reader-01 (codex-tick747 RF-GIT): full phase -- the launch-bound node equals the bound one before use;
      # both phases -- the include the executable_closure stage runs is the bound (N2 digest-bound) node's, a member.
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var in vars
        or (_rh_sa_decl.early_view.git_field is string
            and _rh_sa_decl.early_view.git_field in _rh_sa_decl.early_view.launch_context_fields
            and _rh_sa_decl.early_view.git_field != _rh_sa_decl.early_view.rel_path_field
            and _rh_sa_decl.early_view.git_field != _rh_sa_decl.early_view.document_rels_field
            and _rh_sa_in.context[_rh_sa_decl.early_view.git_field] is mapping
            and (_rh_sa_in.context[_rh_sa_decl.early_view.git_field] | to_json(sort_keys=true)) == (_rh_sa_decl.git | to_json(sort_keys=true))
            and _rh_sa_in.context[_rh_sa_decl.early_view.git_field].include_rel is string
            and _rh_sa_in.context[_rh_sa_decl.early_view.git_field].include_rel in _rh_sa_decl.members_rel)
      - _rh_sa_decl.git is mapping
      - _rh_sa_decl.git.include_rel is string
      - _rh_sa_decl.git.include_rel in _rh_sa_decl.members_rel
      - _rh_sa_in.edition is match(_rh_sa_decl.git.edition_regex)
      # brr-follow (f05-s3 S3-SEAM-04 consumer :77, placed HERE: early_view.rel_path_field is a declaration value, readable
      # only once _rh_sa_decl is bound; still before every path use): the launch-bound rel grammar is the declared
      # contract. brr-follow-s2 J-GEN3-01 (F05-S4 F05-GEN3-01; the single-regex key is RETIRED): a mapping of EXACTLY {pattern
      # (non-empty string), refused_components (list of strings), separator, terminator (non-empty strings)} (F05-S4
      # groups-summary 36865155 grammar_final_shape); each reader below refuses the grammar's terminator first, then
      # fullmatches the pattern, then refuses a refused component of the split on the grammar's separator (no literal)
      - _rh_sa_decl.early_view.rel_path_field is string
      - _rh_sa_decl.early_view.rel_path_field in _rh_sa_decl.early_view.launch_context_fields
      # records-dkjoin-01 DKJ-02 / records-dkjoin-02 (over _rh_sa_in): the launch field carrying the document rels is declared, launch-bound and distinct from the grammar field
      - _rh_sa_decl.early_view.document_rels_field is string
      - _rh_sa_decl.early_view.document_rels_field in _rh_sa_decl.early_view.launch_context_fields
      - _rh_sa_decl.early_view.document_rels_field != _rh_sa_decl.early_view.rel_path_field
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or _rh_sa_in.context[_rh_sa_decl.early_view.document_rels_field] is mapping
      # records-context-template-02 (C1 s22; supersedes records-contract-set-kind-01 C1-SK-ALS-01): the member rel grammar
      # result is the ONE render bound before this task (_rh_sa_mg, C1-CT-ALS-MG-01, after its type rows). Its declared
      # output shape is checked on both phases; on the full phase the launch-bound projection must EQUAL the canonical form.
      # The phase is the declared phase fact (_rh_sa_phase against resolve_phases.words.record_free), not a presence test.
      - _rh_sa_mg is mapping
      - (_rh_sa_mg.keys() | list | sort) == ([_rh_sa_reg.member_rel_grammar.output.form, _rh_sa_reg.member_rel_grammar.output.refused] | sort)
      - _rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.form] is mapping
      - >-
        _rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.refused] is sequence
        and _rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.refused] is not string
        and _rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.refused] is not mapping
      - >-
        _rh_sa_phase == _rh_sa_decl.resolve_phases.words.record_free
        or (_rh_sa_in.context[_rh_sa_decl.early_view.rel_path_field] | to_json(sort_keys=true))
        == (_rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.form] | to_json(sort_keys=true))
      # r2l R2K-TOOL-FIRST-USE-BINDING: the record's tool contract has exactly the declared roles and row fields
      - (_rh_sa_in.tools.keys() | list | sort) == (_rh_sa_decl.tool_roles.keys() | list | sort)
      - _rh_sa_in.tools.values() | reject('mapping') | list | length == 0
      - _rh_sa_in.tools.values() | map('list') | map('sort') | unique(case_sensitive=true) | list
        == [[_rh_sa_decl.tool_fields.path, _rh_sa_decl.tool_fields.sha256] | sort]
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [_rh_sa_in.declaration_rel, _rh_sa_in.edition, _rh_sa_in.controller_delegate] | to_json }}
    quiet: true

# r2k R2J-EFFECTIVE-OVERRIDE-BINDING (codex-tick454; WITHDRAWS r2j C1-R2J-13's non-tunable freeze). The base / profile /
# operator composition is PRESERVED: the operator layer (early_view.override.var, the engine's declared override input,
# lme_global_override) is composed onto the bound node HERE, with the engine's declared semantics
# (early_view.override.combine: recursive, list_merge -- C1 asserts equality with resolve.yml's composition), so the
# tool / context SELECTION this file uses is the EFFECTIVE one, bound before use. The override subtree at the bound
# declaration path is the only part read; each of its leaves must lie under a declared tunable prefix
# (early_view.override.tunable, relative to the bound node; C1 keeps it equal to the registry's tunable set for these
# nodes) or it refuses here, before any selected tool runs. The override's canonical digest and applied leaf paths are
# bound into rh_early_view's binding and RECONCILED by resolve_policy.yml with the override the resolver composed
# (its digest + lme_remote_harness_overridden_paths) -- an override that changes between this file and the resolver,
# or a resolver that composed differently, refuses there. The source_admission node itself is not tunable (its own
# prefix is never declared tunable), so members / git grammar stay the launcher-bound bytes.
# r2l R2K-OVERRIDE-ROOT (codex-tick473): the override input is read at ITS root. lme_global_override is composed LAST
# onto the declaration's layer_root node (profile_overlay.lme_global; resolve.yml :446-453), so the bound node's place
# inside the override is ovrel = declaration_path[layer_root | length:] (= [remote_harness, controller, bootstrap];
# joined above with the profile's own override nesting declaration). Public override shape and base / profile /
# operator-LAST order unchanged; no private nesting, no second merge engine (the ONE combine with the declared options).
# SHAPE (refused here, before any selected tool is stat'ed or run): the layer is a mapping; every node on ovrel that is
# PRESENT is a mapping (r2k silently read a present non-mapping as "absent"); the layer does not use the declaration-file
# nesting (a top-level key equal to layer_root[0] -- the r2k-accepted nested shape the normal loader rejects); every
# leaf under the bound node lies under a declared tunable prefix. Override content outside ovrel is the normal
# loader's (registry deny-by-default) and selects nothing here: the selected tools are bound by the launch record below.

# TOOL CONTRACT (P4): the ONE declaration -- os_tools.<git|env> of the bound bootstrap node (path + identity); no copy.
# r2l R2K-TOOL-FIRST-USE-BINDING (codex-tick473): the EFFECTIVE selection (live override included) is admitted only
# when it IS the contract the admitted launch record carries -- rh_source_bootstrap.tools {<role>: {<tool_fields.path>,
# <tool_fields.sha256>}}, rendered as DATA into the admitted seed bytes from the PACKAGED effective node (operator
# override applied LAST at packaging; the declared os_tools.<tool>.identity.sha256 -- the seed does not hash git / env
# itself) or by MAIN's genesis runner from its pre-launch admission; the stat below binds the executable to it. The trust root is that launch record -- the same root as declaration_sha256 -- never
# the live variable: a run-time override that changes a tool path, with a digest it also supplies, differs from the
# record and refuses HERE, before the stat below and before the first git / env execution (admit_git_paths.yml).
# A legitimate repackaged override passes: the seed renders the overridden {path, sha256} into the record.

- name: "SOURCE ADMISSION -- hash the record-bound git and env executables (links followed; before either runs)"
  ansible.builtin.stat:
    path: "{{ _rh_sa_tools[item][_rh_sa_decl.tool_fields.path] }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_decl.tool_roles.keys() | list }}"
  register: _rh_sa_tool

- name: "SOURCE ADMISSION -- refuse a missing, non-executable or unidentified git / env executable (digest == the RECORD's)"
  ansible.builtin.assert:
    that:
      - _rh_sa_tool.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | rejectattr('exists') | list | length == 0
      - _rh_sa_tool.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | rejectattr('executable') | list | length == 0
      - _rh_sa_tool.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute=_rh_sa_reg.vocabulary.attributes.stat_checksum) | list
        == _rh_sa_decl.tool_roles.keys() | map('extract', _rh_sa_tools) | map(attribute=_rh_sa_decl.tool_fields.sha256) | list
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.tool }}: {{ _rh_sa_decl.texts.tool }}
      {{ _rh_sa_decl.tool_roles.keys() | list | zip(_rh_sa_tool.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute='exists')) | list | to_json }}
    quiet: true

# DOCUMENT INPUTS (records-dkjoin-01 DKJ-02, the THIRD COMPOSITION; codex-tick714 DKJ_02; supersedes the br-fixed RR-01
# phase 1 / phase 2 text; records-dkjoin-02: read over _rh_sa_in, the ONE admitted source input). No document is
# interpreted before the engine import. The document rels admitted here are the LAUNCH-BOUND map
# _rh_sa_in.context[early_view.document_rels_field] = {<document_inputs name>: <rel>}, which the launch binding walks
# over the packaged RESOLVED controller.bootstrap (launch_context_fields.documents -> source_admission.document_rels,
# the projection the engine derives from its strict document reader; the empty map while the generation contract is
# inactive). Nothing is read from the declaration policy root (the rel_from walk is RETIRED) or from a parent document
# (phase 2 is RETIRED). The rels are only grammar-checked, stat'ed and git-admitted here. After the import the engine
# reader (resolve.yml :311-322) derives every rel itself and refuses a derived rel that is not an admitted member BEFORE
# it returns it to the read (records-dkjoin-02, codex-tick723); it reads a document only when its exact text has the
# admitted digest; resolve_policy.yml then requires the resolved walk == this carrier, type-strict.
- name: "SOURCE ADMISSION -- bind the launch-bound document rels (derived; the carrier field the bound node names)"
  when: _rh_sa_reg.early_names.rh_rp_input.var not in vars
  ansible.builtin.set_fact:
    _rh_sa_dfirst: "{{ _rh_sa_in.context[_rh_sa_decl.early_view.document_rels_field] }}"

- name: "SOURCE ADMISSION -- refuse a malformed, repeated, member-overlapping or out-of-grammar launch-bound document rel (before any path use)"
  when: _rh_sa_reg.early_names.rh_rp_input.var not in vars
  ansible.builtin.assert:
    that:
      - _rh_sa_dfirst is mapping
      - _rh_sa_dfirst.values() | reject('string') | list | length == 0
      - _rh_sa_dfirst.values() | select('equalto', '') | list | length == 0
      - _rh_sa_dfirst.values() | unique(case_sensitive=true) | list | length == _rh_sa_dfirst | length
      - _rh_sa_dfirst.values() | select('in', _rh_sa_decl.members_rel) | list | length == 0
      # the LAUNCH-BOUND rel grammar (brr-follow-s2 J-GEN3-01): terminator first, then the pattern fullmatch, then the refused components
      - _rh_sa_dfirst.values() | select('search', _rh_sa_in.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape) | list | length == 0
      - _rh_sa_dfirst.values() | reject('match', '(?:' ~ _rh_sa_in.context[_rh_sa_decl.early_view.rel_path_field].pattern ~ ')\Z') | list | length == 0
      - _rh_sa_dfirst.values() | map('split', _rh_sa_in.context[_rh_sa_decl.early_view.rel_path_field].separator) | map('intersect', _rh_sa_in.context[_rh_sa_decl.early_view.rel_path_field].refused_components) | reject('equalto', []) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
      {{ [_rh_sa_in.declaration_rel, _rh_sa_decl.early_view.document_rels_field] | to_json }}
    quiet: true

# records-contract-set-kind-01 (codex-tick755 OPEN-S17-RF-MEMBER-GRAMMAR-CONSUMER; supersedes S11-AL-13 / -14): every loader
# member rel is admitted by the CANONICAL member rel grammar (both phases; no projection, no composed regex) BEFORE the
# phase-1 binding, its stat and the git include (refusal source_admission.refusals.member). The program is the
# member_rel_grammar macro (terminator first, then the full match, then the refused components); this task reads its
# declared refused list only.
- name: "SOURCE ADMISSION -- refuse a loader member rel outside the canonical member rel grammar (before any path use)"
  ansible.builtin.assert:
    that:
      - (_rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.refused] | length) == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member_grammar }}
      {{ [_rh_sa_in.declaration_rel, _rh_sa_mg[_rh_sa_reg.member_rel_grammar.output.refused]] | to_json }}
    quiet: true

# records-staged-reader-01 (codex-tick740 executable_closure; codex-tick747 ALS04R-FULL-PHASE): the executable closure is
# source_admission.members_rel ONLY. No document rel is Git-admitted here on either phase (the duplicate pre-admission
# is retired); the resolve.yml staged reader admits every document and, on the full phase, first compares each
# engine-derived rel with the launch-bound map _rh_sa_dfirst (launch-bound path authority kept, C1-DKJ2-ALS-04R).
- name: "SOURCE ADMISSION -- bind the executable_closure admission set (source_admission.members_rel only; derived)"
  ansible.builtin.set_fact:
    _rh_sa_admit: "{{ _rh_sa_decl.members_rel }}"

- name: "SOURCE ADMISSION -- observe every member (stat; exists, regular, not a link) before any git byte comparison"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_admit }}"
  register: _rh_sa_obs

- name: "SOURCE ADMISSION -- refuse a missing, linked or non-regular member"
  vars:
    _rh_sa_st: "{{ _rh_sa_obs.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | list }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_st | selectattr('exists') | list | length == _rh_sa_st | length
      - _rh_sa_st | selectattr('islnk') | list | length == 0
      - _rh_sa_st | rejectattr('isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member }}
      {{ _rh_sa_admit | zip(_rh_sa_st | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- admit every member against the intended commit (shared git admission; before any loader import)"
  ansible.builtin.include_tasks: "{{ (_rh_sa_decl.git if _rh_sa_phase == _rh_sa_decl.resolve_phases.words.record_free else _rh_sa_in.context[_rh_sa_decl.early_view.git_field]).include_rel | basename }}"
  vars:
    # tool contract (P4): the ONE os_tools declaration of the bound node; r2l: FIRST USE takes the launch-record-bound
    # path (== the effective selection, digest == the record's, both checked above)
    rh_gp_tool: "{{ _rh_sa_tools.git[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_env: "{{ _rh_sa_tools.env[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_git: "{{ _rh_sa_decl.git if _rh_sa_phase == _rh_sa_decl.resolve_phases.words.record_free else _rh_sa_in.context[_rh_sa_decl.early_view.git_field] }}"
    rh_gp_repo: "{{ rh_repo_root }}"
    rh_gp_paths: "{{ _rh_sa_admit }}"
    rh_gp_absent: []
    rh_gp_probe: []
    rh_gp_edition: "{{ _rh_sa_in.edition }}"
    rh_gp_codes: "{{ _rh_sa_decl.refusals.git }}"
    rh_gp_texts: "{{ _rh_sa_decl.texts.git }}"
    # GEN-ADOPT2: the shared include's bounded historical proof is not requested by loader admission (explicit null)
    rh_gp_history: null

- name: "SOURCE ADMISSION -- refuse a member whose bytes changed between observation and admission"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_admit }}"
  register: _rh_sa_obs2

- name: "SOURCE ADMISSION -- refuse an observation race (observed digest before and after the git admission differ)"
  ansible.builtin.assert:
    that:
      - _rh_sa_obs2.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute=_rh_sa_reg.vocabulary.attributes.stat_checksum) | list
        == _rh_sa_obs.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute=_rh_sa_reg.vocabulary.attributes.stat_checksum) | list
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.race }}
      {{ _rh_sa_admit | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- refuse a trusted blob that is not the observed bytes' object id (distinct provenance joined)"
  ansible.builtin.assert:
    that:
      - _rh_sa_admit | reject('in', rh_gp_oids) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member }}
      {{ _rh_sa_admit | reject('in', rh_gp_oids) | list | to_json }}
    quiet: true

# records-dkjoin-01 DKJ-02: the br-fixed RR-01 phase 2 (pre-import parent read, parse and rel_at following, the second git
# admission) is RETIRED: every declared document was admitted above from the launch-bound map, by the one git include.
- name: "SOURCE ADMISSION -- bind the complete admitted set (loader members + every launch-bound document; derived)"
  ansible.builtin.set_fact:
    _rh_sa_oids: "{{ rh_gp_oids }}"
    _rh_sa_all: "{{ _rh_sa_admit }}"
    _rh_sa_allobs: "{{ _rh_sa_obs.results }}"

# record_fields is a ROLE MAP (git, tool, edition, loader, members, bootstrap) -> field names; consumers address by role.
# r2j: tool is a per-role mapping (git, env) of {path, sha256} (P4: the one os_tools contract); bootstrap carries the
# bound declaration's rel + digest so receipt joins compare the declaration the run actually consumed (B/R4 PROPOSAL).
# records-staged-reader-01 (codex-tick740 executable_closure; codex-tick747 SCHEMA-PREIMPORT / PARTIAL-FACT): the
# partial admission below is keyed by the declared stage word; that word and the reader's are type / presence checked
# HERE, before any subscript, on the digest-bound declaration (the registry contract C1-CTXP2-D2 / C1-SR-GL-03 adds
# validation inside the one resolve; it cannot retroactively supply this trust). No stage word may equal a record
# field name, so a partial admission and the receipt never share a shape.
- name: "SOURCE ADMISSION -- refuse a malformed admission_stages declaration (before the partial admission is keyed by it)"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.admission_stages is mapping
      - _rh_sa_decl.admission_stages.words is mapping
      - _rh_sa_decl.admission_stages.words.executable_closure is string
      - _rh_sa_decl.admission_stages.words.executable_closure | length > 0
      - _rh_sa_decl.admission_stages.words.single_engine_document_reader is string
      - _rh_sa_decl.admission_stages.words.single_engine_document_reader | length > 0
      - _rh_sa_decl.admission_stages.words.executable_closure != _rh_sa_decl.admission_stages.words.single_engine_document_reader
      - _rh_sa_decl.admission_stages.words.values() | select('in', _rh_sa_decl.record_fields.values() | list) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [_rh_sa_decl.admission_stages is mapping] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- record the admitted source (observed and trusted digests kept distinct; derived output)"
  ansible.builtin.set_fact:
    "{{ _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial }}": >-
      {{ {_rh_sa_decl.admission_stages.words.executable_closure: {_rh_sa_decl.record_fields.git: _rh_sa_decl.git,
          _rh_sa_decl.record_fields.tool: _rh_sa_tools,
          _rh_sa_decl.record_fields.edition: rh_gp_head,
          _rh_sa_decl.record_fields.loader: _rh_sa_decl.loader_rel,
          _rh_sa_decl.record_fields.bootstrap: {_rh_sa_decl.bootstrap_fields.rel: _rh_sa_in.declaration_rel,
                                                _rh_sa_decl.bootstrap_fields.sha256: _rh_sa_in.declaration_sha256},
          _rh_sa_decl.record_fields.members: _rh_sa_members}} }}
  vars:
    _rh_sa_tools: >-
      {%- set ns = namespace(m={}) -%}
      {%- for role, key in _rh_sa_decl.tool_roles.items() -%}
      {%- set ns.m = ns.m | combine({role: {_rh_sa_decl.tool_fields.path: _rh_sa_in.tools[role][_rh_sa_decl.tool_fields.path],
                                            _rh_sa_decl.tool_fields.sha256: _rh_sa_tool.results[loop.index0][_rh_sa_reg.vocabulary.attributes.result_stat][_rh_sa_reg.vocabulary.attributes.stat_checksum]}}) -%}
      {%- endfor -%}{{ ns.m }}
    _rh_sa_members: >-
      {%- set ns = namespace(m={}) -%}
      {%- for r in _rh_sa_allobs -%}
      {%- set ns.m = ns.m | combine({r[_rh_sa_reg.vocabulary.attributes.loop_result_item]: {_rh_sa_decl.member_fields.observed: r[_rh_sa_reg.vocabulary.attributes.result_stat][_rh_sa_reg.vocabulary.attributes.stat_checksum],
                                              _rh_sa_decl.member_fields.trusted: _rh_sa_oids[r[_rh_sa_reg.vocabulary.attributes.loop_result_item]]}}) -%}
      {%- endfor -%}{{ ns.m }}

# EARLY VIEW (codex-tick446 R1S8-EARLY-CONTEXT option c): a PROJECTION of the admitted declaration node by the declared
# paths early_view.context_fields (field -> key path under controller.bootstrap; r4c nodes refusal_grammar and
# path_admission.separator; r2k + body_domain, X-R1-S9-2 / C1-S9-BODY-DOMAIN) -- no desired state. r2k: projected from
# the EFFECTIVE node (_rh_sa_eff: the bound node + the admitted operator override layer, R2J-EFFECTIVE-OVERRIDE-BINDING),
# and the binding role carries, beside the source identity (edition == the admitted HEAD, declaration rel + digest),
# override_paths (the override layer's leaf key paths, sorted; audit join with lme_remote_harness_overridden_paths in
# resolve_policy.yml). r2k X_R1_S10_1 (codex-tick463): the r2k override_sha256 digest is WITHDRAWN -- no separate digest /
# canonicalisation subsystem; the REFERENCE is the COMPLETE typed effective context carried by the admitted launch
# binding rh_source_bootstrap.context (rendered into the admitted seed by the ONE normal loader at packaging, operator
# override applied LAST through the existing configuration path), compared with this derivation below (CARRIER ADMISSION).
# Produced only after every member (incl. this file, the declaration and the git include) passed admission above.
# RE-ENTRANT (X-R1-S9-3): this file is included by check.yml play 1 AND play 2 in one run. Every value here is
# re-derived from fresh reads on every inclusion (slurp, stat, git admission, composition); no task tests for, trusts
# or refuses a value an earlier inclusion published -- set_fact simply supersedes it at the same precedence, and the
# read-backs below compare the VISIBLE value with THIS inclusion's derivation (an outranking extra-var cannot equal it;
# a stale earlier value is overwritten, never consumed).
- name: "SOURCE ADMISSION -- project the early verifier context from the effective declaration (derived output)"
  ansible.builtin.set_fact:
    rh_early_view: >-
      {{ {_rh_sa_decl.early_view.roles.context: _rh_sa_ctx,
          _rh_sa_decl.early_view.roles.binding: {'edition': rh_gp_head,
                                                 'declaration_rel': _rh_sa_in.declaration_rel,
                                                 'declaration_sha256': _rh_sa_in.declaration_sha256,
                                                 'override_paths': _rh_sa_ovp}} }}
  vars:
    _rh_sa_ovp: >-
      {%- macro walk(n, p) -%}{%- if n is mapping and n | length > 0 -%}{%- for k, v in n.items() -%}{{ walk(v, p + [k]) }}{%- endfor -%}
      {%- else -%}{{ p | to_json }}{{ '\n' }}{%- endif -%}{%- endmacro -%}
      {{ (walk(_rh_sa_ov, []) if _rh_sa_ov | length > 0 else '').split('\n') | reject('equalto', '') | map('from_json') | sort | list }}

# PRODUCER-RECORD PROTECTION (R5K-LOADER-TRUST-BOUNDARY): rh_src_admission is a registry reserved_output, so
# refuse_pinned_outputs.yml (the existing first-entry guard) refuses any caller supply before this file runs; this
# read-back additionally proves the value now visible under that name IS this admission's derivation (an outranking
# supply could not equal the fresh edition + per-member observed digests of this run unless it were this run's own).
- name: "SOURCE ADMISSION -- refuse a visible record that is not this admission's derivation (caller replacement)"
  ansible.builtin.assert:
    that:
      # records-staged-reader-01 (codex-tick747 PARTIAL-FACT): the visible value is the executable_closure PARTIAL
      # admission (rh_src_admission is bound only by resolve.yml at the complete stage): exactly one stage word
      # records-lrh-als-03 ALS3-02 (records-c1-framework-30 H30-03, DP-30-02): the partial is read by its DECLARED name
      # (the ingress output.reader_inputs partial role) through an inline lookup at each use; no alias task var
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial) is mapping
      - _rh_sa_decl.admission_stages.words.executable_closure in lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial) | dict2items | rejectattr(_rh_sa_reg.vocabulary.attributes.item_key, 'equalto', _rh_sa_decl.admission_stages.words.executable_closure) | list | length == 0
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure] is mapping
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.edition] == rh_gp_head
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.edition] == _rh_sa_in.edition
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.loader] == _rh_sa_decl.loader_rel
      # records-staged-reader-01: the admitted set is source_admission.members_rel only (documents: the staged reader)
      - (lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.members] | list | sort) == (_rh_sa_all | sort)
      - _rh_sa_allobs | map(attribute=_rh_sa_reg.vocabulary.attributes.loop_result_item) | map('extract', lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.members])
        | map(attribute=_rh_sa_decl.member_fields.observed) | list
        == _rh_sa_allobs | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute=_rh_sa_reg.vocabulary.attributes.stat_checksum) | list
      - (lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.tool].keys() | list | sort) == (_rh_sa_decl.tool_roles.keys() | list | sort)
      - _rh_sa_decl.tool_roles.keys() | map('extract', lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.tool])
        | map(attribute=_rh_sa_decl.tool_fields.sha256) | list
        == _rh_sa_tool.results | map(attribute=_rh_sa_reg.vocabulary.attributes.result_stat) | map(attribute=_rh_sa_reg.vocabulary.attributes.stat_checksum) | list
      # r2l: the published tool record IS the launch-record-bound contract (type-strict)
      - (lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.tool] | to_json(sort_keys=true)) == (_rh_sa_in.tools | to_json(sort_keys=true))
      - lookup('ansible.builtin.vars', _rh_sa_regadm[_rh_sa_regadm.ingress.output.reader_inputs].partial)[_rh_sa_decl.admission_stages.words.executable_closure][_rh_sa_decl.record_fields.bootstrap][_rh_sa_decl.bootstrap_fields.sha256]
        == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.replaced }}: {{ _rh_sa_decl.texts.replaced }}
      {{ [_rh_sa_in.edition, rh_gp_head] | to_json }}
    quiet: true

# EARLY-VIEW READ-BACK: the name rh_early_view is a registry reserved_output (C1-R2J-11; refused pre-supplied by the
# first-entry guard); this proves the visible value IS this projection of THESE admitted bytes (a replaced early
# context or a changed source binding refuses here, before check.yml play 1 or any resolve interprets it).
- name: "SOURCE ADMISSION -- refuse an early context that is not this admission's projection (replaced context / changed binding)"
  vars:
    _rh_sa_ev: "{{ _rh_sa_decl.early_view }}"
  ansible.builtin.assert:
    that:
      - rh_early_view is mapping
      - (rh_early_view.keys() | list | sort) == (_rh_sa_ev.roles.values() | list | sort)
      - (rh_early_view[_rh_sa_ev.roles.context].keys() | list | sort) == (_rh_sa_ev.context_fields.keys() | list | sort)
      - rh_early_view[_rh_sa_ev.roles.context].refusal_grammar == _rh_sa_eff.refusal_grammar
      - rh_early_view[_rh_sa_ev.roles.context].path_separator == _rh_sa_eff.path_admission.separator
      - rh_early_view[_rh_sa_ev.roles.context].body_domain == _rh_sa_eff.body_domain
      - (rh_early_view[_rh_sa_ev.roles.binding].keys() | list | sort) == (_rh_sa_ev.binding_fields | sort)
      - rh_early_view[_rh_sa_ev.roles.binding].edition == rh_gp_head
      - rh_early_view[_rh_sa_ev.roles.binding].edition == _rh_sa_in.edition
      - rh_early_view[_rh_sa_ev.roles.binding].declaration_rel == _rh_sa_in.declaration_rel
      - rh_early_view[_rh_sa_ev.roles.binding].declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_ev.refusal }}: {{ _rh_sa_ev.text }}
      {{ [_rh_sa_in.declaration_rel, _rh_sa_in.edition, rh_gp_head] | to_json }}
    quiet: true

# CARRIER ADMISSION (r2k X_R1_S10_1, codex-tick463; C1 declares the carrier schema bootstrap_input.record_keys incl.
# context). The launch binding rh_source_bootstrap is the REFERENCE R1 compares against just before the walk; extra-vars
# precedence keeps later set_fact from replacing it but is NOT its authentication -- THIS task is: its source identity
# was admitted above (edition == the admitted HEAD, declaration_sha256 == the digest of the bytes read once), and its
# COMPLETE typed context must equal, value for value and type for type, the effective context derived here from those
# admitted bytes + the override layer read through the existing configuration path (early_view.override.var, operator
# override applied LAST by the combine above). A forged carrier context, a forged source binding, or an override layer
# whose CONTEXT-FIELD leaves differ from the ones the packaged carrier was rendered under refuses HERE, at admission,
# before any walk. r2l (CAR-04 overclaim corrected): this task detects only changes of the declared context fields; a
# changed selected git / env contract is refused EARLIER by the record-bound tool admission (before first use); a
# run-time change of any OTHER tunable leaf is not detected by either check -- it is an admitted run-time override
# that the normal loader composes and audits (lme_remote_harness_overridden_paths == the early override_paths).
# R1's carrier / context shape is UNCHANGED by r2l (record gains the sibling key tools only).
- name: "SOURCE ADMISSION -- refuse a launch-binding context that is not this admission's effective context (forged carrier / override)"
  vars:
    _rh_sa_ev: "{{ _rh_sa_decl.early_view }}"
  ansible.builtin.assert:
    that:
      # brr-follow (f05-s3 S3-SEAM-03/04, SUP01): the carrier key set is EXACTLY context_fields UNION launch_context_fields
      # (disjoint); the raw early view projects context_fields only, so the equality is RESTRICTED to those keys
      - _rh_sa_ev.context_fields.keys() | intersect(_rh_sa_ev.launch_context_fields.keys() | list) | list | length == 0
      # MR03 S11: on the record-free path the context rows hold by construction (_rh_sa_in.context is this derivation);
      # the edition / digest rows still bind the N9 carrier to the admitted HEAD and bytes
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or (_rh_sa_in.context.keys() | list | sort) == ((_rh_sa_ev.context_fields.keys() | list) + (_rh_sa_ev.launch_context_fields.keys() | list)) | sort
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or (_rh_sa_in.context | dict2items | selectattr('key', 'in', _rh_sa_ev.context_fields.keys() | list) | items2dict) == rh_early_view[_rh_sa_ev.roles.context]
      # type-strict (Python == holds for 1 == true == 1.0; the JSON text does not)
      - _rh_sa_reg.early_names.rh_rp_input.var in vars or (_rh_sa_in.context | dict2items | selectattr('key', 'in', _rh_sa_ev.context_fields.keys() | list) | items2dict | to_json(sort_keys=true)) == (rh_early_view[_rh_sa_ev.roles.context] | to_json(sort_keys=true))
      - _rh_sa_in.edition == rh_gp_head
      - _rh_sa_in.declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_ev.refusal }}: {{ _rh_sa_ev.text }}
      {{ [_rh_sa_in.declaration_rel, _rh_sa_in.edition, rh_early_view[_rh_sa_ev.roles.binding].override_paths] | to_json }}
    quiet: true
