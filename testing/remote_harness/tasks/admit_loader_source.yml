        and (_rh_sa_ri['override_state']['words'].values() | reject('string') | list | length) == 0
        and (_rh_sa_ri['override_state']['words'].values() | unique | list | length) == (_rh_sa_ri['override_state']['words'] | length)
        and (_rh_sa_ri['override_state']['fields'].values() | select('string') | list | length) == 0
        and (_rh_sa_ri['override_state']['fields'].values() | select('mapping') | list | length) == 0
        and (_rh_sa_ri['override_state']['fields'].values() | reject('sequence') | list | length) == 0
        and (_rh_sa_ri['override_state']['fields'].values() | list | flatten | reject('in', _rh_sa_ri['override_keys']) | list | length) == 0)
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri['override_state']['key'] in rh_rp_input
        and rh_rp_input[_rh_sa_ri['override_state']['key']] is string
        and (_rh_sa_ri['override_state']['words'] | dict2items | selectattr('value', 'equalto', rh_rp_input[_rh_sa_ri['override_state']['key']]) | list | length) == 1)
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or (rh_rp_input.keys() | reject('in', _rh_sa_ri['cold_only']) | sort)
        == ((_rh_sa_ri['keys'] + [_rh_sa_ri['override_state']['key']]
             + _rh_sa_ri['override_state']['fields'][_rh_sa_ri['override_state']['words'] | dict2items | selectattr('value', 'equalto', rh_rp_input[_rh_sa_ri['override_state']['key']]) | map(attribute='key') | first]) | sort)
      # projection precondition: what the cold record does not carry is EXACTLY the three protected fields (:77 constants)
