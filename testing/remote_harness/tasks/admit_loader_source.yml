---
# testing/remote_harness/tasks/admit_loader_source.yml -- PRE-EXECUTION SOURCE ADMISSION of the resolver/loader closure
# (route r2i; codex-tick427-428 loader_source_decision, OPEN-LOADER-BYTES; route owns shared launch/source admission).
# NEW FILE. AUTHORED, NEVER EXECUTED (every control UNRUN).
# r2k (codex-tick454 + R1 s9 cross-owner items): the tool / context selection is the EFFECTIVE node (bound declaration +
# admitted operator override layer, composition preserved; C1-R2J-13 freeze WITHDRAWN) bound into rh_early_view and
# reconciled by resolve_policy.yml (R2J-EFFECTIVE-OVERRIDE-BINDING); context_fields += body_domain (X-R1-S9-2);
# re-entrant across check.yml play 1 and play 2 (X-R1-S9-3). The r2j header text below that says "no override applied"
# is superseded by these r2k lines.
# r2l (codex-tick473 R2K-OVERRIDE-ROOT, R2K-TOOL-FIRST-USE-BINDING): (1) the operator layer is read at its OWN root --
# lme_global_override composes onto the declaration's profile_overlay.lme_global node (resolve.yml :446-453), so the
# override-relative path of the bound node is declaration_path MINUS the declared layer root early_view.override.
# layer_root ([remote_harness, controller, bootstrap]); r2k walked the full declaration_path inside the override and
# treated every valid override as absent. A malformed layer (non-mapping layer or intermediate on that path, the
# r2k nested shape under layer_root[0], or a leaf outside a tunable prefix) refuses before any selected tool is
# stat'ed or run. (2) the selected git / env contract {path, sha256} is bound by the admitted launch record
# rh_source_bootstrap.tools (rendered by the seed from the packaged effective node; genesis: MAIN's runner) BEFORE its
# first use: the effective selection must equal it and the executable's digest must equal the RECORD's digest -- a
# caller-selected path checked against a caller-selected digest is no longer the admission. The r2j sentence below
# "(not merged; no override applied; ...)" is superseded by the r2k / r2l effective-selection text.
#
# Included as the FIRST task of tasks/resolve_policy.yml (r2i-resolve_policy.after.yml), the ONE loader invocation
# point of every producer and consumer path, delegated to the controller (source_admission.controller_delegate).
# resolve_policy.yml's include_role of ansible/roles/podman is what puts the engine filter_plugins (lme_manifests.py)
# on the plugin path, so NO loader byte is imported before this file finishes: wrong, unadmitted loader bytes refuse
# before import. Every launcher must supply the bootstrap record (r2j: rh_source_bootstrap replaces r2i's edition_var
# input; the seed on run / run-local / dispatch; genesis via MAIN's runner; B's e2e launchers -- PROPOSAL).
# r2j EARLY VIEW PRODUCER (codex-tick446 R1S8-EARLY-CONTEXT, option c): this file is ALSO the early authenticated
# declaration view's producer. Output rh_early_view (EXACT reserved output) = the typed verifier context
# {refusal_grammar, path_separator} PROJECTED (not merged; no override applied; no desired state) from the same bound
# declaration node (controller.bootstrap.refusal_grammar / .path_admission.separator, r4c nodes), plus its binding
# {edition, declaration_rel, declaration_sha256}. check.yml play 1 includes this file right after its two guards and
# before the walk (R1 hunk R1-R2J-1), so the structural verifier keeps its early position and the unselected control
# still ends before full resolve. Reconciled later: resolve_policy.yml (resolved grammar/separator == the view) and
# generate_entries.yml (every roster row's loader-projected lme_entry_context == the view).
#
# Trust: the intended immutable commit is an INPUT from outside the checkout (rh_source_bootstrap.edition:
# the genesis launch argv carries MAIN's reviewed commit; the seed passes its bundle's recorded source edition on
# run / run-local / entry dispatch). HEAD must equal it, and every declared member (source_admission.members_rel: the
# registry, the profile, every engine filter plugin incl. ansible/roles/podman/filter_plugins/lme_manifests.py, and
# the role files resolve executes) must be a tracked blob of that commit whose index and worktree bytes are that blob
# (tasks/admit_git_paths.yml). A digest computed by already-executed loader code is never used here.
# Provenance kept DISTINCT per member: observed_sha256 (stat of the worktree bytes, this process) and trusted_oid
# (the blob id the intended commit records). C1 publishes rh_src_admission's compared fact through the existing
# resolve record and the single compared receipt-binding contract (B writes, R4 reads): a different reviewed loader
# edition cannot consume an incompatible old receipt merely because policy text is unchanged.
# r2j BOOTSTRAP TRUST ORDER (codex-tick440 R2I-BOOTSTRAP-TRUST-ORDER, P4, P7; supersedes r2i's raw registry read):
# NO directive is consumed from unadmitted bytes. The ROOT is the launcher's admitted bundle binding: the seed (an
# admitted pre-Ansible artifact: bundle.sha256 + bundle.json name its digest) checks, BEFORE exec, every member of the
# bootstrap closure and the launched playbook's declared importer closure against bundle.json source.inputs
# (controller_seed.j2 source_admit), and passes ONE launcher record rh_source_bootstrap (LAST -e word) with the reviewed
# edition (bundle.json repo_head, never current HEAD), the bound declaration file (the existing checkout_binding file,
# manifests/profiles/remote-harness.yml), ITS sha256 as the bundle recorded it, the key path of the declaration node
# (controller.bootstrap) inside it and the controller delegate. Genesis (no seed): MAIN's declared genesis runner
# supplies the same record from its pre-launch admission of the reviewed commit (PROPOSAL C1-R2J-6; until it lands
# genesis refuses here -- typed, no default).
# This file then reads the declaration file ONCE (slurp), refuses unless sha256 of THOSE bytes is the launcher's value,
# parses THOSE bytes, and takes every directive -- git grammar, tool contract (the ONE os_tools.git / os_tools.env
# identity; the registry duplicate git_tool and its equality check are WITHDRAWN, P4), members, delegate -- from that one
# bound declaration. The resolved view (lme_resolved...source_admission, after the import) is a projection of the same
# node and resolve_policy.yml refuses any difference. The inner git membership check below is ADDITIONAL verification.
# INTERFACE CONSTANTS (before any declaration can be read; ledgered, restated by the declaration's bootstrap_input and
# compared after the read): the record keys of rh_source_bootstrap and the two pre-declaration refusal codes.
#
# Requires: rh_repo_root (refuse_pinned_outputs.yml) and the launcher record rh_source_bootstrap (a declared INPUT; the
# seed appends it last and refuses a caller-supplied one in run-local; its exact key set is asserted here, so a merged
# caller key cannot survive either). Outputs: rh_src_admission, rh_early_view (EXACT reserved outputs; refused if
# pre-supplied by refuse_pinned_outputs.yml and read back below). Registers / task vars: _rh_sa_*.

- name: "SOURCE ADMISSION -- refuse a missing or malformed launcher bootstrap record (no default)"
  ansible.builtin.assert:
    that:
      - rh_source_bootstrap is defined
      - rh_source_bootstrap is mapping
      # r2k X_R1_S10_1 (codex-tick463): + context, the COMPLETE typed effective early context the launch binding carries
      # r2l R2K-TOOL-FIRST-USE-BINDING: + tools, the packaged effective selected tool contract {<role>: {path, sha256}}
      - (rh_source_bootstrap.keys() | list | sort) == ['context', 'controller_delegate', 'declaration_path', 'declaration_rel', 'declaration_sha256', 'edition', 'tools']
      - rh_source_bootstrap.context is mapping
      - rh_source_bootstrap.tools is mapping
      - rh_source_bootstrap.declaration_rel is string
      - rh_source_bootstrap.declaration_sha256 is string
      - rh_source_bootstrap.declaration_path is sequence and rh_source_bootstrap.declaration_path is not string
      - rh_source_bootstrap.edition is string
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-INPUT: no admitted launcher bootstrap record (rh_source_bootstrap {edition,
      declaration_rel, declaration_sha256, declaration_path, controller_delegate, context, tools}) reached this run; a managed launch
      supplies it from its admitted bundle binding, genesis from MAIN's declared runner -- never a default.
    quiet: true

# ONE retained value (codex-tick446 R1S8-PLAINTEXT-BODY-BYTES): read -> decode; digest + exact re-encoding + no escaped
# undecodable byte BEFORE parse; then parse that same value. The '/' join and the undecodable-byte class are interface
# constants here (no declaration is readable yet); after the parse both are compared with the bound declaration's
# path_admission.separator and body_domain.undecodable_regex.
- name: "SOURCE ADMISSION -- read the bound declaration ONCE (read/decode failure refuses)"
  block:
    - name: "SOURCE ADMISSION -- read the bound declaration file (one read)"
      ansible.builtin.slurp:
        src: "{{ rh_repo_root ~ '/' ~ rh_source_bootstrap.declaration_rel }}"
      register: _rh_sa_slurp

    - name: "SOURCE ADMISSION -- decode exactly the bytes read (derived; parsed only after the digest binding)"
      ansible.builtin.set_fact:
        _rh_sa_text: "{{ _rh_sa_slurp.content | b64decode }}"
  rescue:
    - name: "SOURCE ADMISSION -- refuse an unreadable or undecodable bound declaration"
      ansible.builtin.fail:
        msg: >-
          REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_source_bootstrap.declaration_rel }} could not be
          read or decoded: {{ ansible_failed_result.msg }}

- name: "SOURCE ADMISSION -- refuse declaration bytes that are not the ones the launcher's admitted binding recorded"
  ansible.builtin.assert:
    that:
      - (_rh_sa_text | hash('sha256')) == rh_source_bootstrap.declaration_sha256
      - (_rh_sa_text | b64encode) == _rh_sa_slurp.content
      # the Jinja literal '\\u...' yields the regex TEXT [\udc80-\udcff] (the escape is the regex engine's), the same
      # text the declaration's body_domain.undecodable_regex holds (YAML single-quoted, compared below)
      - _rh_sa_text is not search('[\\udc80-\\udcff]')
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_source_bootstrap.declaration_rel }} is not the
      plaintext UTF-8 bytes the launcher admitted ({{ rh_source_bootstrap.declaration_sha256 }}); nothing it declares is consumed.
    quiet: true

- name: "SOURCE ADMISSION -- parse THAT retained value and select the declaration node (parse failure refuses)"
  block:
    - name: "SOURCE ADMISSION -- parse and select (derived)"
      ansible.builtin.set_fact:
        _rh_sa_bs: >-
          {%- set ns = namespace(n=(_rh_sa_text | from_yaml)) -%}
          {%- for k in rh_source_bootstrap.declaration_path -%}{%- set ns.n = ns.n[k] -%}{%- endfor -%}{{ ns.n }}
  rescue:
    - name: "SOURCE ADMISSION -- refuse an unparsable bound declaration or an absent declaration node"
      ansible.builtin.fail:
        msg: >-
          REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_source_bootstrap.declaration_rel }} did not parse
          to a node at {{ rh_source_bootstrap.declaration_path | to_json }}: {{ ansible_failed_result.msg }}

- name: "SOURCE ADMISSION -- refuse a bound node without its declarations (before any is consumed)"
  ansible.builtin.assert:
    that:
      - _rh_sa_bs is mapping
      - _rh_sa_bs.source_admission is mapping
      - _rh_sa_bs.path_admission.separator == '/'
      - _rh_sa_bs.body_domain.undecodable_regex == '[\\udc80-\\udcff]'
    fail_msg: >-
      REFUSED RH-SOURCE-BOOTSTRAP-BYTES: the bound declaration {{ rh_source_bootstrap.declaration_rel }} does not declare
      the source admission, path separator and body domain the bootstrap interface constants restate.
    quiet: true

- name: "SOURCE ADMISSION -- bind the source-admission node of the bound declaration (derived)"
  ansible.builtin.set_fact:
    _rh_sa_decl: "{{ _rh_sa_bs.source_admission }}"

# From here every value is the bound declaration's. Its digest algorithm must be the interface one used above; the
# interface constants must be the ones it declares; the launcher's delegate and edition must satisfy it.
# r2k: context_fields gain body_domain (X-R1-S9-2, C1-S9-BODY-DOMAIN); binding_fields gain the override binding
# (R2J-EFFECTIVE-OVERRIDE-BINDING; X-R2K-OVERRIDE-BINDING to R1 / C1); early_view.override declared.
- name: "SOURCE ADMISSION -- refuse a launcher record or interface the bound declaration does not declare"
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.digest_algorithm == 'sha256'
      - (_rh_sa_decl.bootstrap_input.record_keys | sort) == (rh_source_bootstrap.keys() | list | sort)
      - _rh_sa_decl.bootstrap_input.declaration_rel == rh_source_bootstrap.declaration_rel
      - _rh_sa_decl.bootstrap_input.declaration_path == rh_source_bootstrap.declaration_path
      - _rh_sa_decl.bootstrap_input.refusals == ['RH-SOURCE-BOOTSTRAP-INPUT', 'RH-SOURCE-BOOTSTRAP-BYTES']
      - _rh_sa_decl.controller_delegate == rh_source_bootstrap.controller_delegate
      - rh_source_bootstrap.edition is match(_rh_sa_decl.git.edition_regex)
      - _rh_sa_decl.members_rel is sequence and _rh_sa_decl.members_rel | length > 0
      - _rh_sa_decl.loader_rel in _rh_sa_decl.members_rel
      - rh_source_bootstrap.declaration_rel in _rh_sa_decl.members_rel
      # brr-follow (f05-s3 S3-SEAM-04 consumer :77, placed HERE: early_view.rel_path_field is a declaration value, readable
      # only once _rh_sa_decl is bound; still before every path use): the launch-bound rel grammar is the declared
      # contract. brr-follow-s2 J-GEN3-01 (F05-S4 F05-GEN3-01; the single-regex key is RETIRED): a mapping of EXACTLY {pattern
      # (non-empty string), refused_components (list of strings), separator, terminator (non-empty strings)} (F05-S4
      # groups-summary 36865155 grammar_final_shape); each reader below refuses the grammar's terminator first, then
      # fullmatches the pattern, then refuses a refused component of the split on the grammar's separator (no literal)
      - _rh_sa_decl.early_view.rel_path_field is string
      - _rh_sa_decl.early_view.rel_path_field in _rh_sa_decl.early_view.launch_context_fields
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field] is mapping
      - (rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].keys() | list | sort) == ['pattern', 'refused_components', 'separator', 'terminator']
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern is string
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern | length > 0
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator is string
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator | length > 0
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator is string
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | length > 0
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components is sequence
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components is not string
      - rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components | reject('string') | list | length == 0
      - (_rh_sa_decl.tool_roles.keys() | list | sort) == ['env', 'git']
      - _rh_sa_decl.tool_roles.values() | reject('in', _rh_sa_bs.os_tools) | list | length == 0
      # EARLY VIEW inputs (codex-tick446 option c): the authoritative nodes the verifier context projects
      - _rh_sa_bs.refusal_grammar is mapping
      - _rh_sa_bs.path_admission.separator is string
      - _rh_sa_bs.body_domain is mapping
      - (_rh_sa_decl.early_view.roles.keys() | list | sort) == ['binding', 'context']
      - (_rh_sa_decl.early_view.context_fields.keys() | list | sort) == ['body_domain', 'path_separator', 'refusal_grammar']
      # every context field is a non-empty key path (list of strings) under the bootstrap node
      - _rh_sa_decl.early_view.context_fields.values() | reject('sequence') | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | select('string') | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | map('length') | select('equalto', 0) | list | length == 0
      - _rh_sa_decl.early_view.context_fields.values() | flatten | reject('string') | list | length == 0
      - (_rh_sa_decl.early_view.binding_fields | sort)
        == (['declaration_rel', 'declaration_sha256', 'edition', 'override_paths'] | sort)
      - _rh_sa_decl.early_view.override is mapping
      # r2k: + audit_root / audit_join, the overridden-paths form resolve_policy reconciles against (R2K-DEP-OVERRIDDEN-PATHS-FORM)
      # r2l R2K-OVERRIDE-ROOT: + layer_root, the declaration node the operator layer composes onto (resolve.yml :446-453:
      # global lme_global | profile_overlay.lme_global | lme_global_override LAST); the override-relative path of the
      # bound node is declaration_path[layer_root | length:] and must agree with the profile's existing override nesting
      # declaration (target_prereq.observation.override_path = that path + [os_tools], profile :1983) -- a free join
      - (_rh_sa_decl.early_view.override.keys() | list | sort) == ['audit_join', 'audit_root', 'combine', 'layer_root', 'text', 'tunable', 'var']
      - _rh_sa_decl.early_view.override.var is string
      - _rh_sa_decl.early_view.override.audit_root is string
      - _rh_sa_decl.early_view.override.audit_join is string
      - (_rh_sa_decl.early_view.override.combine.keys() | list | sort) == ['list_merge', 'recursive']
      - _rh_sa_decl.early_view.override.layer_root is sequence and _rh_sa_decl.early_view.override.layer_root is not string
      - _rh_sa_decl.early_view.override.layer_root | length > 0
      - _rh_sa_decl.early_view.override.layer_root | reject('string') | list | length == 0
      - (rh_source_bootstrap.declaration_path | length) > (_rh_sa_decl.early_view.override.layer_root | length)
      - rh_source_bootstrap.declaration_path[:(_rh_sa_decl.early_view.override.layer_root | length)] == _rh_sa_decl.early_view.override.layer_root
      - (rh_source_bootstrap.declaration_path[(_rh_sa_decl.early_view.override.layer_root | length):] + ['os_tools'])
        == _rh_sa_bs.target_prereq.observation.override_path
      # r2l R2K-TOOL-FIRST-USE-BINDING: the record's tool contract has exactly the declared roles and row fields
      - (rh_source_bootstrap.tools.keys() | list | sort) == (_rh_sa_decl.tool_roles.keys() | list | sort)
      - rh_source_bootstrap.tools.values() | reject('mapping') | list | length == 0
      - rh_source_bootstrap.tools.values() | map('list') | map('sort') | unique(case_sensitive=true) | list
        == [[_rh_sa_decl.tool_fields.path, _rh_sa_decl.tool_fields.sha256] | sort]
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.input }}: {{ _rh_sa_decl.texts.input }}
      {{ [rh_source_bootstrap.declaration_rel, rh_source_bootstrap.edition, rh_source_bootstrap.controller_delegate] | to_json }}
    quiet: true

# r2k R2J-EFFECTIVE-OVERRIDE-BINDING (codex-tick454; WITHDRAWS r2j C1-R2J-13's non-tunable freeze). The base / profile /
# operator composition is PRESERVED: the operator layer (early_view.override.var, the engine's declared override input,
# lme_global_override) is composed onto the bound node HERE, with the engine's declared semantics
# (early_view.override.combine: recursive, list_merge -- C1 asserts equality with resolve.yml's composition), so the
# tool / context SELECTION this file uses is the EFFECTIVE one, bound before use. The override subtree at the bound
# declaration path is the only part read; each of its leaves must lie under a declared tunable prefix
# (early_view.override.tunable, relative to the bound node; C1 keeps it equal to the registry's tunable set for these
# nodes) or it refuses here, before any selected tool runs. The override's canonical digest and applied leaf paths are
# bound into rh_early_view's binding and RECONCILED by resolve_policy.yml with the override the resolver composed
# (its digest + lme_remote_harness_overridden_paths) -- an override that changes between this file and the resolver,
# or a resolver that composed differently, refuses there. The source_admission node itself is not tunable (its own
# prefix is never declared tunable), so members / git grammar stay the launcher-bound bytes.
# r2l R2K-OVERRIDE-ROOT (codex-tick473): the override input is read at ITS root. lme_global_override is composed LAST
# onto the declaration's layer_root node (profile_overlay.lme_global; resolve.yml :446-453), so the bound node's place
# inside the override is ovrel = declaration_path[layer_root | length:] (= [remote_harness, controller, bootstrap];
# joined above with the profile's own override nesting declaration). Public override shape and base / profile /
# operator-LAST order unchanged; no private nesting, no second merge engine (the ONE combine with the declared options).
# SHAPE (refused here, before any selected tool is stat'ed or run): the layer is a mapping; every node on ovrel that is
# PRESENT is a mapping (r2k silently read a present non-mapping as "absent"); the layer does not use the declaration-file
# nesting (a top-level key equal to layer_root[0] -- the r2k-accepted nested shape the normal loader rejects); every
# leaf under the bound node lies under a declared tunable prefix. Override content outside ovrel is the normal
# loader's (registry deny-by-default) and selects nothing here: the selected tools are bound by the launch record below.
- name: "SOURCE ADMISSION -- walk the override layer at its own root (derived; shape recorded, nothing consumed yet)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
    _rh_sa_has: "{{ (q('ansible.builtin.varnames', '^' ~ _rh_sa_decl.early_view.override.var ~ '$') | length) > 0 }}"
    _rh_sa_ovr: "{{ lookup('ansible.builtin.vars', _rh_sa_decl.early_view.override.var) if _rh_sa_has else {} }}"
  ansible.builtin.set_fact:
    _rh_sa_ovw: >-
      {%- set rel = rh_source_bootstrap.declaration_path[(_rh_sa_ovd.layer_root | length):] -%}
      {%- set ns = namespace(n=_rh_sa_ovr, present=true, bad=false) -%}
      {%- for k in rel -%}
      {%- if ns.present -%}
      {%- if ns.n is mapping -%}
      {%- if k in ns.n -%}{%- set ns.n = ns.n[k] -%}{%- else -%}{%- set ns.present = false -%}{%- endif -%}
      {%- else -%}{%- set ns.bad = true -%}{%- set ns.present = false -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if ns.present and ns.n is not mapping -%}{%- set ns.bad = true -%}{%- endif -%}
      {{ {'layer_mapping': _rh_sa_ovr is mapping,
          'nested': (_rh_sa_ovr is mapping and (_rh_sa_ovd.layer_root | first) in _rh_sa_ovr),
          'bad': ns.bad,
          'rel': rel,
          'sub': (ns.n if (ns.present and not ns.bad) else {})} }}

- name: "SOURCE ADMISSION -- refuse an override layer that is malformed or reaches an undeclared early path (before any tool use)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
    _rh_sa_sub: "{{ _rh_sa_ovw.sub }}"
    # leaf key paths (lists) of the override subtree; one JSON-encoded path per line (JSON escapes any newline in a key)
    _rh_sa_leaves: >-
      {%- macro walk(n, p) -%}{%- if n is mapping and n | length > 0 -%}{%- for k, v in n.items() -%}{{ walk(v, p + [k]) }}{%- endfor -%}
      {%- else -%}{{ p | to_json }}{{ '\n' }}{%- endif -%}{%- endmacro -%}
      {{ (walk(_rh_sa_sub, []) if _rh_sa_sub | length > 0 else '').split('\n') | reject('equalto', '') | map('from_json') | list }}
    # a leaf is admitted iff a declared tunable key path (a list) is a prefix of it
    _rh_sa_off: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for l in _rh_sa_leaves -%}{%- set hit = namespace(v=false) -%}
      {%- for t in _rh_sa_ovd.tunable -%}{%- if l[:(t | length)] == t -%}{%- set hit.v = true -%}{%- endif -%}{%- endfor -%}
      {%- if not hit.v -%}{%- set ns.o = ns.o + [l] -%}{%- endif -%}
      {%- endfor -%}{{ ns.o }}
  ansible.builtin.assert:
    that:
      - _rh_sa_ovd.tunable is sequence and _rh_sa_ovd.tunable is not string
      - _rh_sa_ovd.tunable | reject('sequence') | list | length == 0
      - _rh_sa_ovd.tunable | select('string') | list | length == 0
      - _rh_sa_ovd.tunable | map('length') | select('equalto', 0) | list | length == 0
      - _rh_sa_ovd.tunable | map('first') | select('equalto', 'source_admission') | list | length == 0
      - _rh_sa_ovw is mapping
      - _rh_sa_ovw.rel == rh_source_bootstrap.declaration_path[(_rh_sa_ovd.layer_root | length):]
      - _rh_sa_ovw.layer_mapping
      - not _rh_sa_ovw.nested
      - not _rh_sa_ovw.bad
      - _rh_sa_sub is mapping
      - _rh_sa_off | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.early_view.refusal }}: {{ _rh_sa_decl.early_view.override.text }}
      {{ [_rh_sa_ovw.rel, _rh_sa_ovw.layer_mapping, _rh_sa_ovw.nested, _rh_sa_ovw.bad, _rh_sa_off] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- bind the EFFECTIVE bound node (profile node + admitted override layer at its own root; derived, re-derived on every entry)"
  vars:
    _rh_sa_ovd: "{{ _rh_sa_decl.early_view.override }}"
  ansible.builtin.set_fact:
    _rh_sa_ov: "{{ _rh_sa_ovw.sub }}"
    _rh_sa_eff: >-
      {{ _rh_sa_bs | combine(_rh_sa_ovw.sub, recursive=_rh_sa_ovd.combine.recursive, list_merge=_rh_sa_ovd.combine.list_merge) }}

# r2k: from here the TOOL and CONTEXT selection is the EFFECTIVE node _rh_sa_eff (identical to the bound node on every
# non-tunable path, by the assert above); the source_admission node stays _rh_sa_decl (never tunable).
- name: "SOURCE ADMISSION -- refuse an effective node without the selected declarations (after composition)"
  ansible.builtin.assert:
    that:
      - _rh_sa_eff.source_admission == _rh_sa_decl
      - _rh_sa_decl.tool_roles.values() | reject('in', _rh_sa_eff.os_tools) | list | length == 0
      - _rh_sa_eff.refusal_grammar is mapping
      - _rh_sa_eff.path_admission.separator is string
      - _rh_sa_eff.body_domain is mapping
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.early_view.refusal }}: {{ _rh_sa_decl.early_view.override.text }}
      {{ [rh_source_bootstrap.declaration_rel, _rh_sa_ov] | to_json }}
    quiet: true

# TOOL CONTRACT (P4): the ONE declaration -- os_tools.<git|env> of the bound bootstrap node (path + identity); no copy.
# r2l R2K-TOOL-FIRST-USE-BINDING (codex-tick473): the EFFECTIVE selection (live override included) is admitted only
# when it IS the contract the admitted launch record carries -- rh_source_bootstrap.tools {<role>: {<tool_fields.path>,
# <tool_fields.sha256>}}, rendered as DATA into the admitted seed bytes from the PACKAGED effective node (operator
# override applied LAST at packaging; the declared os_tools.<tool>.identity.sha256 -- the seed does not hash git / env
# itself) or by MAIN's genesis runner from its pre-launch admission; the stat below binds the executable to it. The trust root is that launch record -- the same root as declaration_sha256 -- never
# the live variable: a run-time override that changes a tool path, with a digest it also supplies, differs from the
# record and refuses HERE, before the stat below and before the first git / env execution (admit_git_paths.yml).
# A legitimate repackaged override passes: the seed renders the overridden {path, sha256} into the record.
- name: "SOURCE ADMISSION -- refuse a selected git / env contract that is not the admitted launch record's (before first use)"
  vars:
    _rh_sa_sel: >-
      {%- set ns = namespace(m={}) -%}
      {%- for role, key in _rh_sa_decl.tool_roles.items() -%}
      {%- set ns.m = ns.m | combine({role: {_rh_sa_decl.tool_fields.path: _rh_sa_eff.os_tools[key].path,
                                            _rh_sa_decl.tool_fields.sha256: _rh_sa_eff.os_tools[key].identity.sha256}}) -%}
      {%- endfor -%}{{ ns.m }}
  ansible.builtin.assert:
    that:
      # type-strict (a string path / digest; JSON text, not Python ==)
      - (_rh_sa_sel | to_json(sort_keys=true)) == (rh_source_bootstrap.tools | to_json(sort_keys=true))
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.tool }}: {{ _rh_sa_decl.texts.tool }}
      {{ [_rh_sa_sel, rh_source_bootstrap.tools] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- hash the record-bound git and env executables (links followed; before either runs)"
  ansible.builtin.stat:
    path: "{{ rh_source_bootstrap.tools[item][_rh_sa_decl.tool_fields.path] }}"
    follow: true
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_decl.tool_roles.keys() | list }}"
  register: _rh_sa_tool

- name: "SOURCE ADMISSION -- refuse a missing, non-executable or unidentified git / env executable (digest == the RECORD's)"
  ansible.builtin.assert:
    that:
      - _rh_sa_tool.results | rejectattr('stat.exists') | list | length == 0
      - _rh_sa_tool.results | map(attribute='stat') | rejectattr('executable') | list | length == 0
      - _rh_sa_tool.results | map(attribute='stat') | map(attribute='checksum') | list
        == _rh_sa_decl.tool_roles.keys() | map('extract', rh_source_bootstrap.tools) | map(attribute=_rh_sa_decl.tool_fields.sha256) | list
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.tool }}: {{ _rh_sa_decl.texts.tool }}
      {{ _rh_sa_decl.tool_roles.keys() | list | zip(_rh_sa_tool.results | map(attribute='stat') | map(attribute='exists')) | list | to_json }}
    quiet: true

# DOCUMENT INPUTS phase 1 (br-fixed RR-01; codex OD-F05-03 / OD-F05-08 / OD-F05-12; tick522 F05S2-DOCUMENT-TRUST-BEFORE-
# CONSUMPTION, OD-S2-03, OD-S2-04). The ONE membership declaration is the bound node's source_admission.document_inputs
# (f05-s2 P1). Requiredness is NOT restated here: it is the registry document_channel.when, and the loader refuses an
# active contract without the node (RH-SOURCE-DOCUMENT-INPUT) before reading anything; this file admits exactly what
# the node declares and nothing when it is absent (an admitted inactive profile). Every {rel_from, root} rel is the
# value at its declared dotted policy path (OD-S2-03; joined by early_view.override.audit_join) under the RAW policy
# root of the bytes digest-bound above (the retained value re-parsed, no second read): declaration_path minus the
# bound node's declared policy path (early_view.override.audit_root). Those rels join the member admission below;
# the {document, rel_at} rels follow in phase 2, only after their parent's admitted bytes are digest-bound.
- name: "SOURCE ADMISSION -- bind the declared document inputs (derived; empty when the node is not declared)"
  ansible.builtin.set_fact:
    _rh_sa_dinp: "{{ _rh_sa_decl.document_inputs if 'document_inputs' in _rh_sa_decl else {} }}"

- name: "SOURCE ADMISSION -- refuse a malformed document-input declaration (before any document is read)"
  vars:
    _rh_sa_dov: "{{ _rh_sa_decl.early_view.override }}"
    _rh_sa_dnp: "{{ _rh_sa_decl.early_view.override.audit_root[:-(_rh_sa_decl.early_view.override.audit_join | length)].split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_sa_dval: "{{ _rh_sa_dinp.values() | map('dict2items') | flatten | map(attribute='value') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_dinp is mapping
      - _rh_sa_dinp.values() | reject('mapping') | list | length == 0
      - _rh_sa_dinp.values() | map('list') | map('sort') | reject('in', [['rel_from', 'root'], ['document', 'rel_at']]) | list | length == 0
      - _rh_sa_dval | reject('string') | list | length == 0
      - _rh_sa_dval | select('equalto', '') | list | length == 0
      # one declared relation level: a document names a rel_from entry
      - _rh_sa_dinp.values() | selectattr('document', 'defined') | map(attribute='document')
        | reject('in', _rh_sa_dinp | dict2items | selectattr('value.rel_from', 'defined') | map(attribute='key') | list) | list | length == 0
      - _rh_sa_dov.audit_join is string and _rh_sa_dov.audit_join | length > 0
      - _rh_sa_dov.audit_root is string and _rh_sa_dov.audit_root.endswith(_rh_sa_dov.audit_join)
      - (_rh_sa_dnp | length) < (rh_source_bootstrap.declaration_path | length)
      - rh_source_bootstrap.declaration_path[-(_rh_sa_dnp | length):] == _rh_sa_dnp
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
      {{ [rh_source_bootstrap.declaration_rel, _rh_sa_dinp] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- resolve every rel_from document rel at the raw policy root (derived; phase 1)"
  vars:
    _rh_sa_dnp: "{{ _rh_sa_decl.early_view.override.audit_root[:-(_rh_sa_decl.early_view.override.audit_join | length)].split(_rh_sa_decl.early_view.override.audit_join) }}"
  ansible.builtin.set_fact:
    _rh_sa_dfirst: >-
      {%- set rp = rh_source_bootstrap.declaration_path[:-(_rh_sa_dnp | length)] -%}
      {%- set raw = _rh_sa_text | from_yaml -%}
      {%- set ns = namespace(m={}) -%}
      {%- for name, e in _rh_sa_dinp | dictsort if e.rel_from is defined -%}
      {%- set w = namespace(n=raw, ok=true) -%}
      {%- for k in rp + e.rel_from.split(_rh_sa_decl.early_view.override.audit_join) -%}
      {%- if w.ok and w.n is mapping and k in w.n -%}{%- set w.n = w.n[k] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
      {%- endfor -%}
      {%- set ns.m = ns.m | combine({name: (w.n if w.ok else none)}) -%}
      {%- endfor -%}{{ ns.m }}

- name: "SOURCE ADMISSION -- refuse an unresolved, repeated or member-overlapping rel_from document rel (phase 1)"
  ansible.builtin.assert:
    that:
      - _rh_sa_dfirst is mapping
      - (_rh_sa_dfirst | list | sort) == (_rh_sa_dinp | dict2items | selectattr('value.rel_from', 'defined') | map(attribute='key') | sort | list)
      - _rh_sa_dfirst.values() | reject('string') | list | length == 0
      - _rh_sa_dfirst.values() | select('equalto', '') | list | length == 0
      - _rh_sa_dfirst.values() | unique(case_sensitive=true) | list | length == _rh_sa_dfirst | length
      - _rh_sa_dfirst.values() | select('in', _rh_sa_decl.members_rel) | list | length == 0
      # brr-follow (S3-SEAM-04, OI-04-before-path-use): every rel_from document rel full-matches the LAUNCH-BOUND rel
      # grammar (rh_source_bootstrap.context[early_view.rel_path_field]) before the :437 stat and the git include
      # brr-follow-s2 J-GEN3-01: the grammar's terminator first, then the pattern fullmatch, then the refused components
      - _rh_sa_dfirst.values() | select('search', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape) | list | length == 0
      - _rh_sa_dfirst.values() | reject('match', '(?:' ~ rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern ~ ')\Z') | list | length == 0
      - _rh_sa_dfirst.values() | map('split', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator) | map('intersect', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components) | reject('equalto', []) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
      {{ [_rh_sa_dfirst, _rh_sa_decl.members_rel] | to_json }}
    quiet: true

# brr-follow (f05-s3 S3-SEAM-04, OI-04-before-path-use): every loader member rel full-matches the LAUNCH-BOUND rel
# grammar BEFORE the phase-1 binding, its stat and the git include (refusal source_admission.refusals.member).
- name: "SOURCE ADMISSION -- refuse a loader member rel outside the launch-bound rel grammar (before any path use)"
  ansible.builtin.assert:
    that:
      # brr-follow-s2 J-GEN3-01: the grammar's terminator first, then the pattern fullmatch, then the refused components
      - _rh_sa_decl.members_rel | select('search', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape) | list | length == 0
      - _rh_sa_decl.members_rel | reject('match', '(?:' ~ rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern ~ ')\Z') | list | length == 0
      - _rh_sa_decl.members_rel | map('split', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator) | map('intersect', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components) | reject('equalto', []) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member_grammar }}
      {{ [rh_source_bootstrap.declaration_rel, _rh_sa_decl.members_rel | reject('match', '(?:' ~ rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern ~ ')\Z') | list,
          _rh_sa_decl.members_rel | select('search', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape) | list,
          _rh_sa_decl.members_rel | reject('search', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape)
            | select('search', '(^|' ~ (rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator | regex_escape) ~ ')('
                     ~ (rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components | map('regex_escape') | join('|'))
                     ~ ')($|' ~ (rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator | regex_escape) ~ ')') | list] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- bind the phase-1 admission set (loader members + rel_from documents; derived)"
  ansible.builtin.set_fact:
    _rh_sa_admit: "{{ _rh_sa_decl.members_rel + (_rh_sa_dfirst | dictsort | map('last') | list) }}"

- name: "SOURCE ADMISSION -- observe every member (stat; exists, regular, not a link) before any git byte comparison"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_admit }}"
  register: _rh_sa_obs

- name: "SOURCE ADMISSION -- refuse a missing, linked or non-regular member"
  vars:
    _rh_sa_st: "{{ _rh_sa_obs.results | map(attribute='stat') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_st | selectattr('exists') | list | length == _rh_sa_st | length
      - _rh_sa_st | selectattr('islnk') | list | length == 0
      - _rh_sa_st | rejectattr('isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member }}
      {{ _rh_sa_admit | zip(_rh_sa_st | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- admit every member against the intended commit (shared git admission; before any loader import)"
  ansible.builtin.include_tasks: "{{ _rh_sa_decl.git.include_rel | basename }}"
  vars:
    # tool contract (P4): the ONE os_tools declaration of the bound node; r2l: FIRST USE takes the launch-record-bound
    # path (== the effective selection, digest == the record's, both checked above)
    rh_gp_tool: "{{ rh_source_bootstrap.tools.git[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_env: "{{ rh_source_bootstrap.tools.env[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_git: "{{ _rh_sa_decl.git }}"
    rh_gp_repo: "{{ rh_repo_root }}"
    rh_gp_paths: "{{ _rh_sa_admit }}"
    rh_gp_absent: []
    rh_gp_probe: []
    rh_gp_edition: "{{ rh_source_bootstrap.edition }}"
    rh_gp_codes: "{{ _rh_sa_decl.refusals.git }}"
    rh_gp_texts: "{{ _rh_sa_decl.texts.git }}"
    # GEN-ADOPT2: the shared include's bounded historical proof is not requested by loader admission (explicit null)
    rh_gp_history: null

- name: "SOURCE ADMISSION -- refuse a member whose bytes changed between observation and admission"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_admit }}"
  register: _rh_sa_obs2

- name: "SOURCE ADMISSION -- refuse an observation race (observed digest before and after the git admission differ)"
  ansible.builtin.assert:
    that:
      - _rh_sa_obs2.results | map(attribute='stat') | map(attribute='checksum') | list
        == _rh_sa_obs.results | map(attribute='stat') | map(attribute='checksum') | list
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.race }}
      {{ _rh_sa_admit | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- refuse a trusted blob that is not the observed bytes' object id (distinct provenance joined)"
  ansible.builtin.assert:
    that:
      - _rh_sa_admit | reject('in', rh_gp_oids) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member }}
      {{ _rh_sa_admit | reject('in', rh_gp_oids) | list | to_json }}
    quiet: true

# DOCUMENT INPUTS phase 2 (br-fixed RR-01; codex OD-F05-03 / OD-F05-12; tick522 F05S2-DOCUMENT-TRUST-BEFORE-CONSUMPTION).
# The parent documents (the rel_from entries a {document, rel_at} entry names) were admitted above with the loader
# members (git blob == observed bytes, no observation race). Each is read ONCE; its exact retained bytes (b64 round
# trip, never stripped) must be the ADMITTED observed digest BEFORE they are parsed; only then is a dependent rel
# resolved at rel_at under the parent's declared root, observed and admitted by the SAME git include. One level is the
# declared relation (phase 1 refuses a document naming a dependent). No dependent -> the include is not run.
- name: "SOURCE ADMISSION -- keep the phase-1 trusted blob ids and name the parent documents (derived)"
  ansible.builtin.set_fact:
    _rh_sa_oid1: "{{ rh_gp_oids }}"
    _rh_sa_head1: "{{ rh_gp_head }}"
    _rh_sa_dpar: "{{ _rh_sa_dinp.values() | selectattr('document', 'defined') | map(attribute='document') | unique(case_sensitive=true) | sort | list }}"

- name: "SOURCE ADMISSION -- read each admitted parent document ONCE (read/decode failure refuses)"
  block:
    - name: "SOURCE ADMISSION -- read the parent document file (one read)"
      ansible.builtin.slurp:
        src: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_dfirst[item] }}"
      loop: "{{ _rh_sa_dpar }}"
      register: _rh_sa_dsl

    - name: "SOURCE ADMISSION -- decode exactly the bytes read (derived; parsed only after the admitted-digest binding)"
      ansible.builtin.set_fact:
        _rh_sa_dtext: "{{ dict(_rh_sa_dsl.results | map(attribute='item') | zip(_rh_sa_dsl.results | map(attribute='content') | map('b64decode'))) }}"
  rescue:
    - name: "SOURCE ADMISSION -- refuse an unreadable or undecodable parent document"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
          {{ [_rh_sa_dpar, ansible_failed_result.msg] | to_json }}

- name: "SOURCE ADMISSION -- refuse parent document bytes that are not the ADMITTED observed digest (before any parse)"
  vars:
    _rh_sa_dob: "{{ dict(_rh_sa_obs.results | map(attribute='item') | zip(_rh_sa_obs.results | map(attribute='stat') | map(attribute='checksum'))) }}"
  ansible.builtin.assert:
    that:
      - (_rh_sa_dtext | list | sort) == _rh_sa_dpar
      - _rh_sa_dpar | map('extract', _rh_sa_dtext) | map('b64encode') | list == _rh_sa_dsl.results | map(attribute='content') | list
      # the same interface regex TEXT as the bound declaration's (:118, compared with body_domain.undecodable_regex at :144)
      - _rh_sa_dpar | map('extract', _rh_sa_dtext) | select('search', '[\\udc80-\\udcff]') | list | length == 0
      - _rh_sa_dpar | map('extract', _rh_sa_dtext) | map('hash', _rh_sa_decl.digest_algorithm) | list
        == _rh_sa_dpar | map('extract', _rh_sa_dfirst) | map('extract', _rh_sa_dob) | list
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
      {{ [_rh_sa_dpar, _rh_sa_dpar | map('extract', _rh_sa_dfirst) | list] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- parse THOSE admitted bytes and resolve every {document, rel_at} rel (parse failure refuses)"
  block:
    - name: "SOURCE ADMISSION -- parse the parents and resolve the dependents (derived; phase 2)"
      ansible.builtin.set_fact:
        _rh_sa_ddep: >-
          {%- set ns = namespace(m={}) -%}
          {%- for name, e in _rh_sa_dinp | dictsort if e.document is defined -%}
          {%- set w = namespace(n=(_rh_sa_dtext[e.document] | from_yaml), ok=true) -%}
          {%- for k in [_rh_sa_dinp[e.document].root] + e.rel_at.split(_rh_sa_decl.early_view.override.audit_join) -%}
          {%- if w.ok and w.n is mapping and k in w.n -%}{%- set w.n = w.n[k] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- set ns.m = ns.m | combine({name: (w.n if w.ok else none)}) -%}
          {%- endfor -%}{{ ns.m }}
  rescue:
    - name: "SOURCE ADMISSION -- refuse an unparsable admitted parent document"
      ansible.builtin.fail:
        msg: >-
          REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
          {{ [_rh_sa_dpar, ansible_failed_result.msg] | to_json }}

- name: "SOURCE ADMISSION -- refuse an unresolved, repeated or already-admitted dependent document rel (phase 2)"
  ansible.builtin.assert:
    that:
      - _rh_sa_ddep is mapping
      - (_rh_sa_ddep | list | sort) == (_rh_sa_dinp | dict2items | selectattr('value.document', 'defined') | map(attribute='key') | sort | list)
      - _rh_sa_ddep.values() | reject('string') | list | length == 0
      - _rh_sa_ddep.values() | select('equalto', '') | list | length == 0
      - _rh_sa_ddep.values() | unique(case_sensitive=true) | list | length == _rh_sa_ddep | length
      - _rh_sa_ddep.values() | select('in', _rh_sa_admit) | list | length == 0
      # brr-follow (S3-SEAM-04): before the stat below, every dependent rel full-matches the LAUNCH-BOUND rel grammar
      # brr-follow-s2 J-GEN3-01: the grammar's terminator first, then the pattern fullmatch, then the refused components
      - _rh_sa_ddep.values() | select('search', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].terminator | regex_escape) | list | length == 0
      - _rh_sa_ddep.values() | reject('match', '(?:' ~ rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].pattern ~ ')\Z') | list | length == 0
      - _rh_sa_ddep.values() | map('split', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].separator) | map('intersect', rh_source_bootstrap.context[_rh_sa_decl.early_view.rel_path_field].refused_components) | reject('equalto', []) | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.document }}: {{ _rh_sa_decl.texts.document }}
      {{ [_rh_sa_ddep, _rh_sa_admit] | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- observe every dependent document (stat; exists, regular, not a link) before its git comparison"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_ddep | dictsort | map('last') | list }}"
  register: _rh_sa_dobs

- name: "SOURCE ADMISSION -- refuse a missing, linked or non-regular dependent document"
  vars:
    _rh_sa_st: "{{ _rh_sa_dobs.results | map(attribute='stat') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_st | selectattr('exists') | list | length == _rh_sa_st | length
      - _rh_sa_st | selectattr('islnk') | list | length == 0
      - _rh_sa_st | rejectattr('isreg') | list | length == 0
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.member }}
      {{ _rh_sa_ddep | dictsort | map('last') | list | zip(_rh_sa_st | map(attribute='exists')) | list | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- admit every dependent document against the intended commit (the same shared git admission)"
  ansible.builtin.include_tasks: "{{ _rh_sa_decl.git.include_rel | basename }}"
  vars:
    rh_gp_tool: "{{ rh_source_bootstrap.tools.git[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_env: "{{ rh_source_bootstrap.tools.env[_rh_sa_decl.tool_fields.path] }}"
    rh_gp_git: "{{ _rh_sa_decl.git }}"
    rh_gp_repo: "{{ rh_repo_root }}"
    rh_gp_paths: "{{ _rh_sa_ddep | dictsort | map('last') | list }}"
    rh_gp_absent: []
    rh_gp_probe: []
    rh_gp_edition: "{{ rh_source_bootstrap.edition }}"
    rh_gp_codes: "{{ _rh_sa_decl.refusals.git }}"
    rh_gp_texts: "{{ _rh_sa_decl.texts.git }}"
    # GEN-ADOPT2 x br-fixed (codex-tick530 OI-02): the dependent-document admission also requests no historical proof
    rh_gp_history: null
  when: _rh_sa_ddep | length > 0

- name: "SOURCE ADMISSION -- refuse a dependent document whose bytes changed between observation and admission"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_sa_ddep | dictsort | map('last') | list }}"
  register: _rh_sa_dobs2

- name: "SOURCE ADMISSION -- refuse a dependent observation race or a dependent without its trusted blob"
  ansible.builtin.assert:
    that:
      - _rh_sa_dobs2.results | map(attribute='stat') | map(attribute='checksum') | list
        == _rh_sa_dobs.results | map(attribute='stat') | map(attribute='checksum') | list
      - _rh_sa_ddep.values() | reject('in', rh_gp_oids) | list | length == 0
      # the second include re-binds rh_gp_head: it must be the phase-1 admitted commit (read by the record + readback below)
      - rh_gp_head == _rh_sa_head1
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.member }}: {{ _rh_sa_decl.texts.race }}
      {{ _rh_sa_ddep | dictsort | map('last') | list | to_json }}
    quiet: true

- name: "SOURCE ADMISSION -- bind the complete admitted set (loader members + every declared document; derived)"
  ansible.builtin.set_fact:
    _rh_sa_oids: "{{ _rh_sa_oid1 | combine(rh_gp_oids) }}"
    _rh_sa_all: "{{ _rh_sa_admit + (_rh_sa_ddep | dictsort | map('last') | list) }}"
    _rh_sa_allobs: "{{ _rh_sa_obs.results + _rh_sa_dobs.results }}"

# record_fields is a ROLE MAP (git, tool, edition, loader, members, bootstrap) -> field names; consumers address by role.
# r2j: tool is a per-role mapping (git, env) of {path, sha256} (P4: the one os_tools contract); bootstrap carries the
# bound declaration's rel + digest so receipt joins compare the declaration the run actually consumed (B/R4 PROPOSAL).
- name: "SOURCE ADMISSION -- record the admitted source (observed and trusted digests kept distinct; derived output)"
  ansible.builtin.set_fact:
    rh_src_admission: >-
      {{ {_rh_sa_decl.record_fields.git: _rh_sa_decl.git,
          _rh_sa_decl.record_fields.tool: _rh_sa_tools,
          _rh_sa_decl.record_fields.edition: rh_gp_head,
          _rh_sa_decl.record_fields.loader: _rh_sa_decl.loader_rel,
          _rh_sa_decl.record_fields.bootstrap: {_rh_sa_decl.bootstrap_fields.rel: rh_source_bootstrap.declaration_rel,
                                                _rh_sa_decl.bootstrap_fields.sha256: rh_source_bootstrap.declaration_sha256},
          _rh_sa_decl.record_fields.members: _rh_sa_members} }}
  vars:
    _rh_sa_tools: >-
      {%- set ns = namespace(m={}) -%}
      {%- for role, key in _rh_sa_decl.tool_roles.items() -%}
      {%- set ns.m = ns.m | combine({role: {_rh_sa_decl.tool_fields.path: rh_source_bootstrap.tools[role][_rh_sa_decl.tool_fields.path],
                                            _rh_sa_decl.tool_fields.sha256: _rh_sa_tool.results[loop.index0].stat.checksum}}) -%}
      {%- endfor -%}{{ ns.m }}
    _rh_sa_members: >-
      {%- set ns = namespace(m={}) -%}
      {%- for r in _rh_sa_allobs -%}
      {%- set ns.m = ns.m | combine({r.item: {_rh_sa_decl.member_fields.observed: r.stat.checksum,
                                              _rh_sa_decl.member_fields.trusted: _rh_sa_oids[r.item]}}) -%}
      {%- endfor -%}{{ ns.m }}

# EARLY VIEW (codex-tick446 R1S8-EARLY-CONTEXT option c): a PROJECTION of the admitted declaration node by the declared
# paths early_view.context_fields (field -> key path under controller.bootstrap; r4c nodes refusal_grammar and
# path_admission.separator; r2k + body_domain, X-R1-S9-2 / C1-S9-BODY-DOMAIN) -- no desired state. r2k: projected from
# the EFFECTIVE node (_rh_sa_eff: the bound node + the admitted operator override layer, R2J-EFFECTIVE-OVERRIDE-BINDING),
# and the binding role carries, beside the source identity (edition == the admitted HEAD, declaration rel + digest),
# override_paths (the override layer's leaf key paths, sorted; audit join with lme_remote_harness_overridden_paths in
# resolve_policy.yml). r2k X_R1_S10_1 (codex-tick463): the r2k override_sha256 digest is WITHDRAWN -- no separate digest /
# canonicalisation subsystem; the REFERENCE is the COMPLETE typed effective context carried by the admitted launch
# binding rh_source_bootstrap.context (rendered into the admitted seed by the ONE normal loader at packaging, operator
# override applied LAST through the existing configuration path), compared with this derivation below (CARRIER ADMISSION).
# Produced only after every member (incl. this file, the declaration and the git include) passed admission above.
# RE-ENTRANT (X-R1-S9-3): this file is included by check.yml play 1 AND play 2 in one run. Every value here is
# re-derived from fresh reads on every inclusion (slurp, stat, git admission, composition); no task tests for, trusts
# or refuses a value an earlier inclusion published -- set_fact simply supersedes it at the same precedence, and the
# read-backs below compare the VISIBLE value with THIS inclusion's derivation (an outranking extra-var cannot equal it;
# a stale earlier value is overwritten, never consumed).
- name: "SOURCE ADMISSION -- project the early verifier context from the effective declaration (derived output)"
  ansible.builtin.set_fact:
    rh_early_view: >-
      {{ {_rh_sa_decl.early_view.roles.context: _rh_sa_ctx,
          _rh_sa_decl.early_view.roles.binding: {'edition': rh_gp_head,
                                                 'declaration_rel': rh_source_bootstrap.declaration_rel,
                                                 'declaration_sha256': rh_source_bootstrap.declaration_sha256,
                                                 'override_paths': _rh_sa_ovp}} }}
  vars:
    _rh_sa_ctx: >-
      {%- set ns = namespace(m={}) -%}
      {%- for f, kp in _rh_sa_decl.early_view.context_fields.items() -%}
      {%- set nn = namespace(n=_rh_sa_eff) -%}{%- for k in kp -%}{%- set nn.n = nn.n[k] -%}{%- endfor -%}
      {%- set ns.m = ns.m | combine({f: nn.n}) -%}
      {%- endfor -%}{{ ns.m }}
    _rh_sa_ovp: >-
      {%- macro walk(n, p) -%}{%- if n is mapping and n | length > 0 -%}{%- for k, v in n.items() -%}{{ walk(v, p + [k]) }}{%- endfor -%}
      {%- else -%}{{ p | to_json }}{{ '\n' }}{%- endif -%}{%- endmacro -%}
      {{ (walk(_rh_sa_ov, []) if _rh_sa_ov | length > 0 else '').split('\n') | reject('equalto', '') | map('from_json') | sort | list }}

# PRODUCER-RECORD PROTECTION (R5K-LOADER-TRUST-BOUNDARY): rh_src_admission is a registry reserved_output, so
# refuse_pinned_outputs.yml (the existing first-entry guard) refuses any caller supply before this file runs; this
# read-back additionally proves the value now visible under that name IS this admission's derivation (an outranking
# supply could not equal the fresh edition + per-member observed digests of this run unless it were this run's own).
- name: "SOURCE ADMISSION -- refuse a visible record that is not this admission's derivation (caller replacement)"
  ansible.builtin.assert:
    that:
      - rh_src_admission is mapping
      - rh_src_admission[_rh_sa_decl.record_fields.edition] == rh_gp_head
      - rh_src_admission[_rh_sa_decl.record_fields.edition] == rh_source_bootstrap.edition
      - rh_src_admission[_rh_sa_decl.record_fields.loader] == _rh_sa_decl.loader_rel
      # br-fixed RR-01: the admitted set is the loader members plus every declared document (phase 1 + phase 2)
      - (rh_src_admission[_rh_sa_decl.record_fields.members] | list | sort) == (_rh_sa_all | sort)
      - _rh_sa_allobs | map(attribute='item') | map('extract', rh_src_admission[_rh_sa_decl.record_fields.members])
        | map(attribute=_rh_sa_decl.member_fields.observed) | list
        == _rh_sa_allobs | map(attribute='stat') | map(attribute='checksum') | list
      - (rh_src_admission[_rh_sa_decl.record_fields.tool].keys() | list | sort) == (_rh_sa_decl.tool_roles.keys() | list | sort)
      - _rh_sa_decl.tool_roles.keys() | map('extract', rh_src_admission[_rh_sa_decl.record_fields.tool])
        | map(attribute=_rh_sa_decl.tool_fields.sha256) | list
        == _rh_sa_tool.results | map(attribute='stat') | map(attribute='checksum') | list
      # r2l: the published tool record IS the launch-record-bound contract (type-strict)
      - (rh_src_admission[_rh_sa_decl.record_fields.tool] | to_json(sort_keys=true)) == (rh_source_bootstrap.tools | to_json(sort_keys=true))
      - rh_src_admission[_rh_sa_decl.record_fields.bootstrap][_rh_sa_decl.bootstrap_fields.sha256]
        == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.refusals.replaced }}: {{ _rh_sa_decl.texts.replaced }}
      {{ [rh_source_bootstrap.edition, rh_gp_head] | to_json }}
    quiet: true

# EARLY-VIEW READ-BACK: the name rh_early_view is a registry reserved_output (C1-R2J-11; refused pre-supplied by the
# first-entry guard); this proves the visible value IS this projection of THESE admitted bytes (a replaced early
# context or a changed source binding refuses here, before check.yml play 1 or any resolve interprets it).
- name: "SOURCE ADMISSION -- refuse an early context that is not this admission's projection (replaced context / changed binding)"
  vars:
    _rh_sa_ev: "{{ _rh_sa_decl.early_view }}"
  ansible.builtin.assert:
    that:
      - rh_early_view is mapping
      - (rh_early_view.keys() | list | sort) == (_rh_sa_ev.roles.values() | list | sort)
      - (rh_early_view[_rh_sa_ev.roles.context].keys() | list | sort) == (_rh_sa_ev.context_fields.keys() | list | sort)
      - rh_early_view[_rh_sa_ev.roles.context].refusal_grammar == _rh_sa_eff.refusal_grammar
      - rh_early_view[_rh_sa_ev.roles.context].path_separator == _rh_sa_eff.path_admission.separator
      - rh_early_view[_rh_sa_ev.roles.context].body_domain == _rh_sa_eff.body_domain
      - (rh_early_view[_rh_sa_ev.roles.binding].keys() | list | sort) == (_rh_sa_ev.binding_fields | sort)
      - rh_early_view[_rh_sa_ev.roles.binding].edition == rh_gp_head
      - rh_early_view[_rh_sa_ev.roles.binding].edition == rh_source_bootstrap.edition
      - rh_early_view[_rh_sa_ev.roles.binding].declaration_rel == rh_source_bootstrap.declaration_rel
      - rh_early_view[_rh_sa_ev.roles.binding].declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_ev.refusal }}: {{ _rh_sa_ev.text }}
      {{ [rh_source_bootstrap.declaration_rel, rh_source_bootstrap.edition, rh_gp_head] | to_json }}
    quiet: true

# CARRIER ADMISSION (r2k X_R1_S10_1, codex-tick463; C1 declares the carrier schema bootstrap_input.record_keys incl.
# context). The launch binding rh_source_bootstrap is the REFERENCE R1 compares against just before the walk; extra-vars
# precedence keeps later set_fact from replacing it but is NOT its authentication -- THIS task is: its source identity
# was admitted above (edition == the admitted HEAD, declaration_sha256 == the digest of the bytes read once), and its
# COMPLETE typed context must equal, value for value and type for type, the effective context derived here from those
# admitted bytes + the override layer read through the existing configuration path (early_view.override.var, operator
# override applied LAST by the combine above). A forged carrier context, a forged source binding, or an override layer
# whose CONTEXT-FIELD leaves differ from the ones the packaged carrier was rendered under refuses HERE, at admission,
# before any walk. r2l (CAR-04 overclaim corrected): this task detects only changes of the declared context fields; a
# changed selected git / env contract is refused EARLIER by the record-bound tool admission (before first use); a
# run-time change of any OTHER tunable leaf is not detected by either check -- it is an admitted run-time override
# that the normal loader composes and audits (lme_remote_harness_overridden_paths == the early override_paths).
# R1's carrier / context shape is UNCHANGED by r2l (record gains the sibling key tools only).
- name: "SOURCE ADMISSION -- refuse a launch-binding context that is not this admission's effective context (forged carrier / override)"
  vars:
    _rh_sa_ev: "{{ _rh_sa_decl.early_view }}"
  ansible.builtin.assert:
    that:
      # brr-follow (f05-s3 S3-SEAM-03/04, SUP01): the carrier key set is EXACTLY context_fields UNION launch_context_fields
      # (disjoint); the raw early view projects context_fields only, so the equality is RESTRICTED to those keys
      - _rh_sa_ev.context_fields.keys() | intersect(_rh_sa_ev.launch_context_fields.keys() | list) | list | length == 0
      - (rh_source_bootstrap.context.keys() | list | sort) == ((_rh_sa_ev.context_fields.keys() | list) + (_rh_sa_ev.launch_context_fields.keys() | list)) | sort
      - (rh_source_bootstrap.context | dict2items | selectattr('key', 'in', _rh_sa_ev.context_fields.keys() | list) | items2dict) == rh_early_view[_rh_sa_ev.roles.context]
      # type-strict (Python == holds for 1 == true == 1.0; the JSON text does not)
      - (rh_source_bootstrap.context | dict2items | selectattr('key', 'in', _rh_sa_ev.context_fields.keys() | list) | items2dict | to_json(sort_keys=true)) == (rh_early_view[_rh_sa_ev.roles.context] | to_json(sort_keys=true))
      - rh_source_bootstrap.edition == rh_gp_head
      - rh_source_bootstrap.declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_ev.refusal }}: {{ _rh_sa_ev.text }}
      {{ [rh_source_bootstrap.declaration_rel, rh_source_bootstrap.edition, rh_early_view[_rh_sa_ev.roles.binding].override_paths] | to_json }}
    quiet: true
