        and _rh_sa_decl.carrier_state_schema.complete_only is not mapping
        and (_rh_sa_decl.carrier_state_schema.complete_only | reject(_rh_sa_reg.carrier_state.member_type) | list | length) == 0
        and (_rh_sa_decl.carrier_state_schema.complete_only | unique | list | length) == (_rh_sa_decl.carrier_state_schema.complete_only | length)
        and (_rh_sa_decl.carrier_state_schema.complete_only | sort) == (_rh_sa_reg.carrier_state.complete_only | sort)
      - >-
        _rh_sa_decl.carrier_state_schema.protected is sequence and _rh_sa_decl.carrier_state_schema.protected is not string
        and _rh_sa_decl.carrier_state_schema.protected is not mapping
        and (_rh_sa_decl.carrier_state_schema.protected | reject(_rh_sa_reg.carrier_state.member_type) | list | length) == 0
        and (_rh_sa_decl.carrier_state_schema.protected | unique | list | length) == (_rh_sa_decl.carrier_state_schema.protected | length)
        and (_rh_sa_decl.carrier_state_schema.protected | sort) == (_rh_sa_reg.carrier_state.protected | sort)
      - _rh_sa_decl.carrier_state_schema.admitted_at is string
      # records-vocab-keys-01 (C1 s24, codex-tick761 O2 / O6): the root_input nodes are selected by the declared pointers
      # _rh_sa_decl.carrier_state_schema.root_input_nodes (state: the override-state node; pair: the override key pair;
      # carried: the carried key list), the node N8 reads from the resolved bs. Typed and distinct on both phases. On the
      # record-free phase the selected nodes are typed and the override-state node and pair equal the canonical node; the
      # carried list meets its canonical partition in N2 (s21 :666-678). The filters of the field-set row are the declared
      # vocabulary words, each passing its declared probe first.
      - _rh_sa_decl.carrier_state_schema.root_input_nodes is mapping
      - _rh_sa_decl.carrier_state_schema.root_input_nodes.state is string and _rh_sa_decl.carrier_state_schema.root_input_nodes.pair is string
      - _rh_sa_decl.carrier_state_schema.root_input_nodes.carried is string
      - (_rh_sa_decl.carrier_state_schema.root_input_nodes.values() | unique | list | length) == (_rh_sa_decl.carrier_state_schema.root_input_nodes | length)
      - _rh_sa_reg.vocabulary.filters is mapping and _rh_sa_reg.vocabulary.probes is mapping
      - (_rh_sa_reg.vocabulary.probes.last.input | map(_rh_sa_reg.vocabulary.filters.last) | list) == _rh_sa_reg.vocabulary.probes.last.output
      - (_rh_sa_reg.vocabulary.probes.sort.input | map(_rh_sa_reg.vocabulary.filters.sort) | list) == _rh_sa_reg.vocabulary.probes.sort.output
      - >-
        _rh_sa_phase != _rh_sa_decl.resolve_phases.words.record_free
        or (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.carried] is sequence
        and _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.carried] is not string
        and _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.carried] is not mapping)
      - >-
