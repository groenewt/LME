---
# testing/remote_harness/tasks/admit_loader_source.yml -- PRE-EXECUTION SOURCE ADMISSION of the resolver/loader closure
# (route r2i; codex-tick427-428 loader_source_decision, OPEN-LOADER-BYTES; route owns shared launch/source admission).
# NEW FILE. AUTHORED, NEVER EXECUTED (every control UNRUN).
# r2k (codex-tick454 + R1 s9 cross-owner items): the tool / context selection is the EFFECTIVE node (bound declaration +
# admitted operator override layer, composition preserved; C1-R2J-13 freeze WITHDRAWN) bound into rh_early_view and
# reconciled by resolve_policy.yml (R2J-EFFECTIVE-OVERRIDE-BINDING); context_fields += body_domain (X-R1-S9-2);
# re-entrant across check.yml play 1 and play 2 (X-R1-S9-3). The r2j header text below that says "no override applied"
# is superseded by these r2k lines.
# r2l (codex-tick473 R2K-OVERRIDE-ROOT, R2K-TOOL-FIRST-USE-BINDING): (1) the operator layer is read at its OWN root --
# lme_global_override composes onto the declaration's profile_overlay.lme_global node (resolve.yml :446-453), so the
# override-relative path of the bound node is declaration_path MINUS the declared layer root early_view.override.
# layer_root ([remote_harness, controller, bootstrap]); r2k walked the full declaration_path inside the override and
# treated every valid override as absent. A malformed layer (non-mapping layer or intermediate on that path, the
# r2k nested shape under layer_root[0], or a leaf outside a tunable prefix) refuses before any selected tool is
# stat'ed or run. (2) the selected git / env contract {path, sha256} is bound by the admitted launch record
# rh_source_bootstrap.tools (rendered by the seed from the packaged effective node; genesis: MAIN's runner) BEFORE its
# first use: the effective selection must equal it and the executable's digest must equal the RECORD's digest -- a
# caller-selected path checked against a caller-selected digest is no longer the admission. The r2j sentence below
# "(not merged; no override applied; ...)" is superseded by the r2k / r2l effective-selection text.
#
# Included as the FIRST task of tasks/resolve_policy.yml (r2i-resolve_policy.after.yml), the ONE loader invocation
# point of every producer and consumer path, delegated to the controller (the pinned run_local binding named by bootstrap_input.construction.fields.controller_delegate.pinned; records-c1-framework-22 DELEGATE).
# resolve_policy.yml's include_role of ansible/roles/podman is what puts the engine filter_plugins (lme_manifests.py)
# on the plugin path, so NO loader byte is imported before this file finishes: wrong, unadmitted loader bytes refuse
# before import. Every launcher must supply the bootstrap record (r2j: rh_source_bootstrap replaces r2i's edition_var
# input; the seed on run / run-local / dispatch; genesis via MAIN's runner; B's e2e launchers -- PROPOSAL).
# r2j EARLY VIEW PRODUCER (codex-tick446 R1S8-EARLY-CONTEXT, option c): this file is ALSO the early authenticated
# declaration view's producer. Output rh_early_view (EXACT reserved output) = the typed verifier context
# {refusal_grammar, path_separator} PROJECTED (not merged; no override applied; no desired state) from the same bound
# declaration node (controller.bootstrap.refusal_grammar / .path_admission.separator, r4c nodes), plus its binding
# {edition, declaration_rel, declaration_sha256}. check.yml play 1 includes this file right after its two guards and
# before the walk (R1 hunk R1-R2J-1), so the structural verifier keeps its early position and the unselected control
# still ends before full resolve. Reconciled later: resolve_policy.yml (resolved grammar/separator == the view) and
# generate_entries.yml (every roster row's loader-projected lme_entry_context == the view).
#
# Trust: the intended immutable commit is an INPUT from outside the checkout (rh_source_bootstrap.edition:
# the genesis launch argv carries MAIN's reviewed commit; the seed passes its bundle's recorded source edition on
# run / run-local / entry dispatch). HEAD must equal it, and every declared member (source_admission.members_rel: the
# registry, the profile, every engine filter plugin incl. ansible/roles/podman/filter_plugins/lme_manifests.py, and
# the role files resolve executes) must be a tracked blob of that commit whose index and worktree bytes are that blob
# (tasks/admit_git_paths.yml). A digest computed by already-executed loader code is never used here.
# Provenance kept DISTINCT per member: observed_sha256 (stat of the worktree bytes, this process) and trusted_oid
# (the blob id the intended commit records). C1 publishes rh_src_admission after all levels complete (resolve,
# C1-SR-RS-02), and the ALS publishes the partial under its declared registry name (records-c1-framework-30 H30-03);
# the compared fact goes through the existing
# resolve record and the single compared receipt-binding contract (B writes, R4 reads): a different reviewed loader
# edition cannot consume an incompatible old receipt merely because policy text is unchanged.
# r2j BOOTSTRAP TRUST ORDER (codex-tick440 R2I-BOOTSTRAP-TRUST-ORDER, P4, P7; supersedes r2i's raw registry read):
# NO directive is consumed from unadmitted bytes. The ROOT is the launcher's admitted bundle binding: the seed (an
# admitted pre-Ansible artifact: bundle.sha256 + bundle.json name its digest) checks, BEFORE exec, every member of the
# bootstrap closure and the launched playbook's declared importer closure against bundle.json source.inputs
# (controller_seed.j2 source_admit), and passes ONE launcher record rh_source_bootstrap (LAST -e word) with the reviewed
# edition (bundle.json repo_head, never current HEAD), the bound declaration file (the existing checkout_binding file,
# manifests/profiles/remote-harness.yml), ITS sha256 as the bundle recorded it, the key path of the declaration node
# (controller.bootstrap) inside it and the controller delegate. Genesis (no seed): MAIN's declared genesis runner
# supplies the same record from its pre-launch admission of the reviewed commit (PROPOSAL C1-R2J-6; until it lands
# genesis refuses here -- typed, no default).
# This file then reads the declaration file ONCE (slurp), refuses unless sha256 of THOSE bytes is the launcher's value,
# parses THOSE bytes, and takes every directive -- git grammar, tool contract (the ONE os_tools.git / os_tools.env
# identity; the registry duplicate git_tool and its equality check are WITHDRAWN, P4), members, delegate -- from that one
# bound declaration. The resolved view (lme_resolved...source_admission, after the import) is a projection of the same
# node and resolve_policy.yml refuses any difference. The inner git membership check below is ADDITIONAL verification.
# INTERFACE CONSTANTS (before any declaration can be read; ledgered, restated by the declaration's bootstrap_input and
# compared after the read): the record keys of rh_source_bootstrap and the two pre-declaration refusal codes.
#
# Requires: rh_repo_root (refuse_pinned_outputs.yml) and the launcher record rh_source_bootstrap (a declared INPUT; the
# seed appends it last and refuses a caller-supplied one in run-local; its exact key set is asserted here, so a merged
# caller key cannot survive either). Outputs: the partial admission under its DECLARED registry name (document_channel
# .admission.partial, returned by the ingress under output.reader_inputs; records-c1-framework-30 H30-03) and
# rh_early_view (EXACT reserved outputs; refused if
# pre-supplied by refuse_pinned_outputs.yml and read back below). Registers / task vars: _rh_sa_*.

# MR03 S12E6 (codex664): CONSUMER ONLY -- the canonical refusal mapping was bound by refuse_pinned_outputs.yml at this
# entry's head; it is required here, never bound again. Absent / reshaped: stop before N2, no code.
- name: "SOURCE ADMISSION -- require the canonical refusal mapping bound at entry (consumer only; no code)"
  ansible.builtin.assert:
    that:
      # records-c1-framework-19 J-FW19-ALS (as corrected by fw20 FW20-SA-READERS): the ONE type row of the early-name
      # contract; every presence row of the six overlap names reads _rh_sa_reg.early_names.<key>.var (no quoted name)
      - _rh_sa_reg is mapping and _rh_sa_reg.early_names is mapping
      - _rh_sa_reg.early_names._rh_sa_rref.var in vars and _rh_sa_rref is mapping
      - (_rh_sa_rref.keys() | list | sort) == ['bytes', 'input']
    fail_msg: >-
      the canonical refusal mapping _rh_sa_rref was not bound at this entry's head (tasks/refuse_pinned_outputs.yml
      must be the entry's first harness task); no refusal code exists without it
    quiet: true

# MR03 S14 (codex-tick673 OD-S14-PHASE-OWED; IF-S14-PHASE-1; supersedes S12E5-AL-PRE): exactly ONE source carrier and
# the including site's protected caller identity reach N2. The phase is NOT an input: N2 derives it from the admitted
# declaration's resolve_phases.callers, so a supplied rh_rp_phase (a stale or forged caller) refuses here. codex-tick675
# OD-ALS02-INCLUDE-REL-01: the N2 include target is the guard-bound registry fact _rh_sa_idt (consumer check only).
# Interpreter / controller / custody / byte checks stay where they are (N2 s11 :196-226, :264-285; HELD-03).
- name: "SOURCE ADMISSION -- refuse both or neither source carrier, a missing caller identity, a supplied phase or an unbound identity task (no default)"
  ansible.builtin.assert:
    that:
      - (_rh_sa_reg.early_names.rh_rp_input.var in vars) != (_rh_sa_reg.early_names.rh_source_bootstrap.var in vars)
      - _rh_sa_reg.early_names.rh_rp_caller.var in vars
      - rh_rp_caller is string
      - rh_rp_caller | length > 0
      - _rh_sa_reg.early_names.rh_rp_phase.var not in vars
      - _rh_sa_reg.early_names._rh_sa_idt.var in vars
      - _rh_sa_idt is mapping
      - (_rh_sa_idt.keys() | list) == ['rel']
      - _rh_sa_idt.rel is string and _rh_sa_idt.rel | length > 0
    fail_msg: >-
      REFUSED {{ _rh_sa_rref.input }}: exactly one source carrier (the launch record rh_source_bootstrap, or the
      record-free carrier rh_rp_input forwarded by the cold entry) and the including site's declared caller identity
      rh_rp_caller must reach the source admission; a resolve phase is never supplied (it is derived from the admitted
      declaration), and the declaration identity task must be the guard-bound registry value
      {{ [_rh_sa_reg.early_names.rh_rp_input.var in vars, _rh_sa_reg.early_names.rh_source_bootstrap.var in vars, _rh_sa_reg.early_names.rh_rp_caller.var in vars, _rh_sa_reg.early_names.rh_rp_phase.var in vars, _rh_sa_reg.early_names._rh_sa_idt.var in vars] | to_json }}
    quiet: true

# Genesis N2 include (records-als-02 MR03-FB-ALS2-01): read once / digest before parse / parse + select / identity /
# override walk / effective node / effective selection / early context, factored into admit_declaration_identity.yml.
# rh_di_input is the caller's carrier (its value is C1 MR03-CON-S11-AL-00's); N2 derives the phase from rh_rp_caller.
- name: "SOURCE ADMISSION -- admit the bound declaration identity (genesis N2 include)"
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/{{ _rh_sa_idt.rel }}"
  vars:
    rh_di_input: "{{ vars[_rh_sa_reg.early_names.rh_rp_input.var] if _rh_sa_reg.early_names.rh_rp_input.var in vars else vars[_rh_sa_reg.early_names.rh_source_bootstrap.var] }}"
# genesis s12-a + codex-tick673 (supersedes S12E2-HELD-03; confirmation after N2, which already derived and checked the
# phase): record_free is reached ONLY with the forwarded carrier, full ONLY without it, and the carrier is bound to THIS
# run: its declaration digest is the digest of the bytes N2 read once.
- name: "SOURCE ADMISSION -- refuse a derived phase that is not a declared word, a phase / carrier mismatch, or a carrier not bound to this run's bytes"
  ansible.builtin.assert:
    that:
      - _rh_sa_phase in (_rh_sa_decl.resolve_phases.words.values() | list)
      - _rh_sa_phase == _rh_sa_decl.resolve_phases.callers[rh_rp_caller]
      - _rh_sa_phase != _rh_sa_decl.resolve_phases.words.record_free or _rh_sa_reg.early_names.rh_rp_input.var in vars
      - _rh_sa_phase != _rh_sa_decl.resolve_phases.words.full or _rh_sa_reg.early_names.rh_rp_input.var not in vars
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or rh_rp_input.declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: the derived resolve phase {{ _rh_sa_phase | to_json }} of
      caller {{ rh_rp_caller | to_json }} is not its declared resolve_phases word, or record_free was reached without the
      forwarded carrier, or full with it, or the carrier's declaration digest is not the bytes admitted in this run
    quiet: true


# FR-CONSTRUCTION OD-CON-03 (codex-tick631; C1-owned, moved from :70): the launch record is checked AFTER the
# record-free declaration identity (genesis N2) binds _rh_sa_decl: its key set is the ONE declared roster
# bootstrap_input.record_keys and its refusal the bound bootstrap_input.refusals.input (the admitted mapping, N2 s06 R2).
# Launch path only: the record-free cold entry carries no launch record (codex-tick647); its carrier is checked by N2
# and S12E-AL-02P. The key-set row comes first: assert stops at the first false condition.
- name: "SOURCE ADMISSION -- refuse a missing or malformed launcher bootstrap record (no default)"
  ansible.builtin.assert:
    that:
      - _rh_sa_reg.early_names.rh_source_bootstrap.var in vars
      - rh_source_bootstrap is mapping
      - (rh_source_bootstrap.keys() | list | sort) == (_rh_sa_decl.bootstrap_input.record_keys | sort)
      - rh_source_bootstrap.context is mapping
      - rh_source_bootstrap.tools is mapping
      - rh_source_bootstrap.declaration_rel is string
      - rh_source_bootstrap.declaration_sha256 is string
      - rh_source_bootstrap.declaration_path is sequence and rh_source_bootstrap.declaration_path is not string
      - rh_source_bootstrap.edition is string
    fail_msg: >-
      REFUSED {{ _rh_sa_decl.bootstrap_input.refusals.input }}: no admitted launcher bootstrap record (rh_source_bootstrap
      with exactly the keys source_admission.bootstrap_input.record_keys of the admitted declaration) reached this run; a
      managed launch supplies it from its admitted bundle binding -- never a default.
    quiet: true
  when: _rh_sa_reg.early_names.rh_rp_input.var not in vars

# From here every value is the bound declaration's. Its digest algorithm must be the interface one used above; the
# interface constants must be the ones it declares; the launcher's delegate and edition must satisfy it.
# r2k: context_fields gain body_domain (X-R1-S9-2, C1-S9-BODY-DOMAIN); binding_fields gain the override binding
# (R2J-EFFECTIVE-OVERRIDE-BINDING; X-R2K-OVERRIDE-BINDING to R1 / C1); early_view.override declared.
# MR03 S12E (codex-tick655 COLD-RECORD-PROJECTION): the record-free carrier is checked against ONE exact cold key set
# under the word genesis.initializer.root_input.phase names (the override pair whole, chosen by its first name: never a
# union); its declared source-identity fields (record_keys INTERSECT root_input['keys']) are PROJECTED into the full
# record and the protected fields are added: controller_delegate (N2-admitted) and tools (N2's _rh_sa_tools). context is
# neither carried nor walked here (codex-tick740): this is source_admission.admission_stages executable_closure, before
# the single engine document reader; context is constructed at complete_projection_and_carrier (resolve_policy.yml,
# records-ctx-producer-02 C1-CTXP2-CS-01). The override pair is chosen by the declared override state word
# (codex-tick738), not by its first name; the state key never reaches _rh_sa_in either (it is no record key).
# interpreter / override_* never reach _rh_sa_in. Subscripts ['keys']: .keys is the dict method.
- name: "SOURCE ADMISSION -- refuse a record-free carrier that is not the exact cold shape of the declared record_free word"
  vars:
    _rh_sa_ri: "{{ _rh_sa_bs.genesis.initializer.root_input }}"
  ansible.builtin.assert:
    that:
      - (_rh_sa_reg.early_names.rh_rp_input.var in vars) == (_rh_sa_phase == _rh_sa_decl.resolve_phases.words.record_free)
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or rh_rp_input is mapping
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri is mapping and 'keys' in _rh_sa_ri and 'override_keys' in _rh_sa_ri and 'phase' in _rh_sa_ri)
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri.phase in _rh_sa_decl.resolve_phases.words and _rh_sa_decl.resolve_phases.words[_rh_sa_ri.phase] == _rh_sa_phase)
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri['override_keys'] | unique | list | length) == 2
      - _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri['override_keys'] | intersect(_rh_sa_ri['keys']) | list | length) == 0
      # records-s12e-coldkeys-01 (OWED-C1-S12E-COLD-KEYSET; N2 s14 OPT-PROJ-N2 partition): the declared cold-only key list is
      # admitted here too (a string list disjoint from the carrier, override and record keys), then the carrier is the
      # input's keys MINUS cold_only and is EXACT: root_input['keys'] alone, or plus the WHOLE override pair, chosen by
      # the presence of the pair's first declared name (never a union). A cold-only key is carried, never read here;
      # a half pair, a tools key, a context key (context is absent before the staged reader, codex-tick740) or any other
      # key refuses. The pair choice by its first name is superseded: the declared override state word selects it (the
      # exact row below, records-ctx-producer-02 C1-CTXP2-A8). Subscript access only (.keys is the dict method).
      # records-s12e-coldkeys-02 (codex-tick728 cold_key_partition): a list is a sequence that is neither a string NOR a
      # mapping (a dict is a sequence of its keys, so without the mapping test a string-keyed mapping would pass both rows).
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or ('cold_only' in _rh_sa_ri and _rh_sa_ri['cold_only'] is sequence
        and _rh_sa_ri['cold_only'] is not string and _rh_sa_ri['cold_only'] is not mapping)
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or (_rh_sa_ri['cold_only'] is not mapping
        and _rh_sa_ri['cold_only'] | reject('string') | list | length == 0)
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or _rh_sa_ri['cold_only']
        | select('in', _rh_sa_ri['keys'] + _rh_sa_ri['override_keys'] + _rh_sa_decl.bootstrap_input.record_keys) | list | length == 0
      # records-ctx-producer-02 C1-CTXP2-A8 (codex-tick738 OPEN-EF0-GGEN-COMBINE; spelling accepted by codex-tick740): the carrier declares its override state. The
      # declared node root_input.override_state is admitted first: a key outside every carrier, override, cold-only and
      # record key; words and fields naming the same states; words distinct strings; every fields entry a list of
      # override names. The carrier then holds that key, its value is exactly ONE declared word, and its keys minus
      # cold_only are EXACTLY root_input['keys'] + [the state key] + the fields of the state that word names. Never
      # key presence: a half pair, a pair under the absent word, an undeclared or non-string word, a missing state key
      # or any other key refuses here, before _rh_sa_in is bound and before any effect. The field and state sets are read
      # from the digest-bound declaration source_admission.carrier_state_schema (codex-tick744), never restated here.
      # records-cold-state-01 (codex-tick751 early_profile_binding / OPEN-N2-10-MEMBER-TYPE; seat review (a)): the canonical
      # node is the retained, digest-admitted registry value _rh_sa_reg.carrier_state, type-checked first; the profile-facing
      # carrier_state_schema then has EXACTLY its declared key set (no key-presence test), each set field is a unique list
      # of the declared member type, and each equals its canonical set (order not significant), on both phases.
      # records-registry-ingress-01 (codex-tick755): every ingress atom the first-entry guard used before the parse is the
      # admitted ABI declaration, and the carrier of this resolve carries the identity the guard admitted the bytes against.
      - _rh_sa_regadm is mapping and _rh_sa_regadm.ingress is mapping and _rh_sa_regadm.ingress.transports is mapping
      - _rh_sa_regadm.ingress.transports.cold.var in _rh_sa_reg.cold_inputs.required
      - (_rh_sa_regadm.ingress.transports.cold.path | length) == 0
      - _rh_sa_regadm.ingress.transports.record.var == _rh_sa_reg.early_names.rh_source_bootstrap.var
      - (_rh_sa_regadm.ingress.transports.record.path | length) == 1
      - (_rh_sa_regadm.ingress.transports.record.path | first) in _rh_sa_decl.bootstrap_input.record_keys
      - _rh_sa_decl.carrier_state_schema is mapping and _rh_sa_decl.carrier_state_schema.root_input_nodes is mapping
      - _rh_sa_decl.carrier_state_schema.root_input_nodes.carried is string
      - (_rh_sa_regadm.ingress.transports.record.path | first) in _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.carried]
      # records-registry-ingress-02 (C1 s23, codex-tick761 O1-ENTRY-TRANSPORT): the initializer transport is the declared
      # root input var at the declared registry-identity construction field; the record path names the same field.
      - _rh_sa_regadm.ingress.transports.init.var == _rh_sa_ri.var
      - (_rh_sa_regadm.ingress.transports.init.path | length) == 1
      - (_rh_sa_regadm.ingress.transports.init.path | first) in _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.carried]
      - _rh_sa_decl.bootstrap_input.construction.fields[_rh_sa_regadm.ingress.transports.init.path | first].source == _rh_sa_decl.bootstrap_input.construction.sources.registry
      - _rh_sa_decl.bootstrap_input.construction.fields[_rh_sa_regadm.ingress.transports.record.path | first].source == _rh_sa_decl.bootstrap_input.construction.sources.registry
      # (codex-tick759 IMPORT-CONTEXT) the guard read each transport var ambiently: the declared var set is exactly the
      # admitted ABI vars, so no undeclared play variable can carry the identity.
      - _rh_sa_reg.vocabulary.attributes is mapping and _rh_sa_reg.vocabulary.attributes.item_value_var is string
      - >-
        (_rh_sa_regadm.ingress.transports | dict2items | map(attribute=_rh_sa_reg.vocabulary.attributes.item_value_var) | list | sort)
        == ([_rh_sa_regadm.ingress.transports.cold.var, _rh_sa_reg.early_names.rh_source_bootstrap.var, _rh_sa_ri.var] | sort)
      # (codex-tick759 DIGEST-OVER-TEXT) the capture refused surrogate escapes with the admitted undecodable regex.
      - _rh_sa_regadm.ingress.capture.undecodable_regex == _rh_sa_bs.body_domain.undecodable_regex
      - _rh_sa_regadm.ingress.cli_arg in _rh_sa_bs.genesis.launch.cli.args
      - _rh_sa_regadm.ingress.separator == _rh_sa_reg.path_law.separator
      - _rh_sa_regadm.ingress.digest.algorithm == _rh_sa_decl.digest_algorithm
      # C1-SR919B (codex 920 known_joins.vocabulary / 921 engine_join; the EXISTING-PATH join, engine r18 not landed): the
      # consumer constants of the admitted ingress declaration (s15 atoms / fullmatch_wrap / canonical_json, their ONLY
      # home; every consumer reads them through output.ingress) are validated HERE by the real loader's admission play,
      # before the carrier equality rows below use canonical_json and before any consumer reads them: each atom of its
      # declared type (type-exact: a bool never an int, an int never a bool), the atoms pairwise distinct under to_json,
      # the wrapper exactly {open, close} and a FULL match by the declared probes, canonical_json exactly {sort_keys}
      # true and key-order independent by the declared probe. No literal: counts, indexes and the null probe value come
      # from the atoms and probes themselves.
      - >-
        _rh_sa_regadm.ingress.atoms is mapping and _rh_sa_regadm.ingress.fullmatch_wrap is mapping
        and _rh_sa_regadm.ingress.canonical_json is mapping and _rh_sa_regadm.ingress.constant_probes is mapping
        and _rh_sa_regadm.ingress.constant_probes.fullmatch_wrap is mapping
      - >-
        _rh_sa_regadm.ingress.atoms.empty_list is sequence and _rh_sa_regadm.ingress.atoms.empty_list is not string
        and _rh_sa_regadm.ingress.atoms.empty_list is not mapping and not _rh_sa_regadm.ingress.atoms.empty_list
      - _rh_sa_regadm.ingress.atoms.empty_map is mapping and not _rh_sa_regadm.ingress.atoms.empty_map
      - _rh_sa_regadm.ingress.atoms.null_value is none
      - _rh_sa_regadm.ingress.atoms.false_value is false
      - _rh_sa_regadm.ingress.atoms.true_value is true
      - _rh_sa_regadm.ingress.atoms.zero is integer and not _rh_sa_regadm.ingress.atoms.zero
      - _rh_sa_regadm.ingress.atoms.one is integer and _rh_sa_regadm.ingress.atoms.one == ([_rh_sa_regadm.ingress.atoms.null_value] | length)
      - (_rh_sa_regadm.ingress.atoms.values() | map('to_json') | unique | list | length) == (_rh_sa_regadm.ingress.atoms | length)
      - >-
        (_rh_sa_regadm.ingress.fullmatch_wrap | length)
        == ([_rh_sa_regadm.ingress.fullmatch_wrap.open, _rh_sa_regadm.ingress.fullmatch_wrap.close] | length)
      - _rh_sa_regadm.ingress.fullmatch_wrap.open is string and _rh_sa_regadm.ingress.fullmatch_wrap.close is string
      - >-
        _rh_sa_regadm.ingress.constant_probes.fullmatch_wrap.alternation is string
        and (_rh_sa_regadm.ingress.constant_probes.fullmatch_wrap.admits | unique | list | length)
            == (_rh_sa_regadm.ingress.constant_probes.fullmatch_wrap.admits | length)
        and (_rh_sa_regadm.ingress.constant_probes.fullmatch_wrap.admits | length) > _rh_sa_regadm.ingress.atoms.one
        and _rh_sa_regadm.ingress.constant_probes.fullmatch_wrap.refuses
      - >-
