        and _rh_sa_decl.carrier_state_schema.node_fields is not mapping
        and (_rh_sa_decl.carrier_state_schema.node_fields | reject(_rh_sa_reg.carrier_state.member_type) | list | length) == 0
        and (_rh_sa_decl.carrier_state_schema.node_fields | unique | list | length) == (_rh_sa_decl.carrier_state_schema.node_fields | length)
        and (_rh_sa_decl.carrier_state_schema.node_fields | sort) == (_rh_sa_reg.carrier_state.node.keys() | list | sort)
      - >-
