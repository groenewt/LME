        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].fields.values() | select(_rh_sa_reg.vocabulary.tests.string) | list | length) == 0
        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].fields.values() | select(_rh_sa_reg.vocabulary.tests.mapping) | list | length) == 0
        and (_rh_sa_reg.carrier_state.node.fields.values() | reject(_rh_sa_reg.vocabulary.tests.sequence) | list | length) == 0
        and (_rh_sa_reg.carrier_state.node.fields.values() | select(_rh_sa_reg.vocabulary.tests.string) | list | length) == 0
        and (_rh_sa_reg.carrier_state.node.fields.values() | select(_rh_sa_reg.vocabulary.tests.mapping) | list | length) == 0
        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.state].fields | dictsort
