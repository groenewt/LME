        and _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.pair] is not string
        and _rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.pair] is not mapping
        and (_rh_sa_ri[_rh_sa_decl.carrier_state_schema.root_input_nodes.pair] | sort) == (_rh_sa_reg.carrier_state.public_inputs.keys() | list | sort))
      - >-
        _rh_sa_reg.early_names.rh_rp_input.var not in vars or ('override_state' in _rh_sa_ri and _rh_sa_ri['override_state'] is mapping
        and (_rh_sa_ri['override_state'].keys() | list | sort) == (_rh_sa_decl.carrier_state_schema.node_fields | sort)
        and _rh_sa_ri['override_state']['words'] is mapping and _rh_sa_ri['override_state']['fields'] is mapping)
