- name: Observe the held root descriptor and exact live holder start time
  ansible.builtin.stat:
    path: '{{ [rh_ar_contract.proc_root, rh_ar_preseal.lock.pid, rh_ar_contract.proc_fd, rh_ar_preseal.lock.fd | string] | join(rh_ar_contract.separator)
      }}'
    follow: true
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _rh_ar_lock_fd
- name: Read live holder identity and its descriptor lock evidence
  ansible.builtin.slurp:
    src: '{{ item }}'
  loop:
  - '{{ [rh_ar_contract.proc_root, rh_ar_preseal.lock.pid, rh_ar_contract.proc_stat] | join(rh_ar_contract.separator) }}'
  - '{{ [rh_ar_contract.proc_root, rh_ar_preseal.lock.pid, rh_ar_contract.proc_fdinfo, rh_ar_preseal.lock.fd | string] | join(rh_ar_contract.separator)
    }}'
  register: _rh_ar_lock_reads
- name: Bind the current holder rather than accepting a caller lock flag
  ansible.builtin.assert:
    that:
    - _rh_ar_lock_fd.stat.exists and _rh_ar_lock_fd.stat.isdir
    - _rh_ar_lock_fd.stat.dev == rh_ar_preseal.lock.device
    - _rh_ar_lock_fd.stat.inode == rh_ar_preseal.lock.inode
    - ((_rh_ar_lock_reads.results | first).content | b64decode).rsplit(rh_ar_contract.proc_stat_close, rh_ar_contract.one)[rh_ar_contract.one].split()[rh_ar_contract.proc_start_index]
      == rh_ar_preseal.lock.start
    - rh_ar_preseal.lock.fdinfo_line in ((_rh_ar_lock_reads.results | last).content | b64decode).splitlines()
    - rh_ar_preseal.lock.fdinfo_line.split()[rh_ar_contract.lock_word_indices.pid] == rh_ar_preseal.lock.pid
    - rh_ar_preseal.lock.fdinfo_line.split()[rh_ar_contract.lock_word_indices.device_inode].rsplit(rh_ar_contract.lock_inode_separator, rh_ar_contract.one)[rh_ar_contract.one]
      == (rh_ar_preseal.lock.inode | string)
    fail_msg: '{{ rh_ar_contract.refusal }}: {{ rh_ar_contract.messages.lock }}'
    quiet: true
