---
# testing/remote_harness/tasks/admit_binding_receipt.yml -- the ONE route admission of a controller-operation BINDING
# RECEIPT (route-r4i over r4h 52b5ca62 over r4g 211b8764 over r4f 62c6efca over r4e 9fb3d594; codex-tick455
# mode_semantics + value_sourcing + R4H-SUPPLIED-NULL-ADMISSION (reader side); codex-tick409 R4C-SHARED-RECEIPT-ADMISSION;
# codex-tick419 R5G-RECEIPT-ADMISSION-CONSUMER; codex-tick421 J_B8_decision; codex-tick425-426 R5H-HISTORY-KEY-CONSUMPTION;
# codex-tick427-428 R4E-ENDPOINT-PRESENCE-BINDING + loader_source_decision; codex-tick439 R4F-PROXY-EQUIVALENCE +
# R4F-METADATA-RESERVATION-JOIN + R4F-CHANGED-VALUE-SOURCING; codex-tick445 R4G-CASE-SENSITIVE-PROXY-OUTCOME +
# shared_mechanic_decision + R4G-SELECTED-PROFILE-KEY-COVERAGE). AUTHORED, NEVER EXECUTED. Shared by every selected
# controller operation whose launch passes B's controller_operation_binding inventory kind (ordered files -i <lab copy>
# -i <binding>; B r5f-interface cd465b8d genesis_launch.inventory_kinds) -- today the measurement
# (tasks/measure_controller_tools.yml, genesis acquire stage) and the HELD privileged prerequisite (controller_prereq.yml,
# managed launch). It is never cloned into a caller. Declaration: controller.bootstrap.binding_admission REVISION 2 (C1
# proposal r4e-c1-hunks.yml). B single sources joined, never redeclared: run_binding.receipt_suffix, lab_role,
# receipt_keys, and the ONE receipt contract run_binding.receipt_bindings / binding_roles (B r5h C1-R5H-3, adopted from
# r4e-admission-output.proposal.yml) / history {key, bindings, prior_keys} (B r5j C1-R5J-1, c1-proposal e7862af3; the
# reader contract of B r5j r4-history-key-contract.proposal.yml 0d2cd12b; see 2b) + history.lineage and
# texts.lineage_malformed (B r5l C1-R5L-1, c1-proposal c5add246; reader contract r4-lineage-roles.proposal.yml f3fb3f5e;
# see 2b / 3c) / ssh_auth.composition (the ONE endpoint rule, read for the 8b floor) / pre_execution_fields /
# loader_output_vars (B r5k C1-R5K-1, X-R4-6) / presence {var, expected_var, expected_path} (B r5k C1-R5K-2, X-R4-7;
# B r5k c1-proposal 725fcafe, cross-owner-proposals 93ace665; see 8b) -- every r5j / r5k / r5l node is a PROPOSED C1 node,
# PROVISIONAL until C1 lands it; genesis.launch.inventory_kinds / file_roles; inventory.controller_operations /
# role_groups (B r5f C1-R5F-1b/-2/-3). No binding_admission node is added (REVISION 2 unchanged).
#
# INCLUDE PARAMETERS (exact registry reserved_outputs names, refused at the includer's FIRST entry by
# refuse_pinned_outputs.yml; legal here as include parameters): rh_rcpt_kind (a genesis.launch.inventory_kinds key that
# declares a receipt), rh_rcpt_operation (an inventory.controller_operations key), rh_rcpt_refusal (the includer's
# declared refusal code). CONTEXT (the includer's resolve; no installer-only name): rh, rh_repo_root, lme_resolved, the
# vars run_binding.receipt_bindings names (today rh_config_revision, lme_resolved, rh_engine_revision), groups,
# hostvars, ansible_inventory_sources. Reads no tr_*, no controller_prerequisite, no rh_gen_stage: the standalone
# measurement acquires no installer dependency through this file.
#
# WHAT IT ADMITS (in order; every refusal is the common grammar through its entry, code rh_rcpt_refusal, except the
# first task's include contract, code binding_admission.include_refusal):
#   1. no pre-supplied name of its own family and no pre-supplied OUTPUT (binding_admission.outputs, every one an exact
#      registry reserved_outputs name; alias-free first task); the declaration revision this file implements
#      (consumer_interface.implements.binding_admission; never the node compared with itself); the include parameters
#   2. the kind: a declared kind with a receipt role, its files naming binding_admission.binding_role and B's
#      run_binding.lab_role; the operation: a declared inputs_in_run_data operation whose placement keys are declared
#      role groups; EXACTLY the kind's file count given
#   2b. THE DECLARED CONTRACT ROLES, refused BEFORE any read (stage 0; code rh_rcpt_refusal, diagnostics.binding):
#      HISTORY (codex-tick425-426 R5H-HISTORY-KEY-CONSUMPTION; B r5j C1-R5J-1 run_binding.history {key, bindings,
#      prior_keys}, role law of r4-history-key-contract.proposal.yml): the receipt's lineage member is the DECLARED
#      history.key, never a literal; it is a receipt key with a role of its own -- never a receipt_bindings field
#      (compared or attributed), never a binding_admission attribution field (which include every launch-file field and
#      binding_sha256, r4e-c1-hunks :58), never one of history.prior_keys; prior_keys are disjoint from receipt_keys.
#      A receipt recorded under a prior key (PRIOR-FORMAT) is attributable -- the stage 1 key-set refusal names the
#      prior key and its lineage record -- but never admissible as the current receipt. PRE-EXECUTION FIELDS (B r5k
#      X-R4-6): at least one; each a COMPARED receipt binding whose var is not a loader output var (a digest computed
#      by already-executed loader code is no proof). PRESENCE (B r5k X-R4-7): the declaration is present and typed.
#      LINEAGE (B r5l C1-R5L-1 run_binding.history.lineage, role -> receipt sub-key): distinct non-empty strings holding
#      the from role, history.bindings not among them, with its own text run_binding.texts.lineage_malformed. ENDPOINT
#      FLOOR (codex-tick433): ssh_auth.composition yields the declared endpoint component vars (8b iii)
#   3. every inventory source an existing, regular, readable, non-link FILE (stat; never a directory)
#   4. the receipt <dirname(binding)><run_binding.receipt_suffix> an existing regular readable non-link file; ONE read
#      of it and ONE of the binding, each hashing to its stat; the receipt's key set is EXACTLY run_binding.receipt_keys
#      (a refusal names the receipt's own keys and any declared prior key with its lineage record, 2b);
#      the receipt contract is coherent (every bound field a receipt key with a declared role; at least one compared)
#   5. the receipt names exactly the given binding and lab copy (path and sha256)
#   6. RECEIPT BINDINGS (codex-tick421 J-B8): the ONE declared contract run_binding.receipt_bindings is ITERATED (no
#      field named here). Each entry names a current-resolve record {var, path} -- an EXISTING record, no new resolver.
#      COMPARED role (today: policy_sha256 = the effective remote_harness policy digest, J-B6 as clarified by tick421;
#      source_edition = lme_resolved.remote_harness.binding.source_edition, the inventory-independent manifest source;
#      interface_sha256 = the resolved consumer_interface aggregate that resolve_policy.yml re-hashed against the
#      checkout bytes, RH-ROUTE-INTERFACE): receipt[field] == this resolve's value, one refusal naming EVERY differing
#      field with both values (bound to its actual cause, never to another field's name). ATTRIBUTED role (today:
#      engine_revision = the producer's resolved-state revision): NOT compared; the producer's receipt value and this
#      consumer's actual value are recorded SEPARATELY in the result, never overwritten or forced equal. STAGE 3c, its
#      OWN cause (texts.lineage_malformed): the receipt's lineage member (the DECLARED run_binding.history.key, 2b; no
#      literal) is null or a transition record whose key set is EXACTLY the history.lineage sub-keys plus
#      history.bindings, its [history.lineage.from] a string, and whose [history.bindings] member attributes EXACTLY the
#      bound fields (both roles), each superseded value under its field; every sub-key read through history.lineage.
#   7. the EFFECTIVE value of each of the operation's declared input vars equals the value the receipt-vouched binding
#      bytes declare for the controller delegation host (vacuous for an operation that declares inputs {} -- today the
#      prerequisite; for the measurement this covers its -e stage selector, r4e-invocation.yml)
#   8. PLACED MEMBERS (the resolved endpoint scope): the members of the operation's placement role groups are exactly the
#      members the receipt-vouched binding declares for those groups, and every var the vouched binding declares for a
#      member is that member's EFFECTIVE value -- except the proxy var (ssh_auth.composition.inventory_forms.var), which
#      is compared by its declared accepted-form OUTCOME on both sides, computed by the ONE shared C1 form interpreter
#      (r4h; see 8b); this resolve's scope and scope_sha256 (which covers binding.deployment,
#      incl. the loader-bound controller endpoint records, C1-R5G-13) are present
#   8b. ENDPOINT / INPUT PRESENCE (codex-tick427-428 R4E-ENDPOINT-PRESENCE-BINDING; the reader of B r5k X-R4-7;
#      PROVISIONAL on C1-R5K-2 and the C1 projection endpoint_presence): the 8 check compares only the vars the vouched
#      binding happens to declare, so an address the inventory omits is not bound by it. B's writer records, for EVERY
#      alias of C1's expected projection, under the declared var run_binding.presence.var in the vouched binding bytes,
#      EVERY declared endpoint / input var: the binding's own value, else the vouched lab-inherited value, else null
#      (declared absence). This file binds that record: its alias set and each alias's var set equal THIS resolve's
#      projection (run_binding.presence.{expected_var, expected_path}) -- the declared set, never the vars a record
#      happens to carry -- and, per var, a recorded null requires the var UNDEFINED in the alias's effective hostvars
#      (an added -e ansible_host refuses) and a recorded value requires the effective value EQUAL. A re-supplied
#      identical value and a same-value move between source locations pass; no whole-engine revision is compared.
#      COMPLETENESS (codex-tick433 R5K-PRESENCE-COMPLETENESS-JOIN): bound to the ADMITTED projection, never shrunk to the
#      record's keys -- every run host (placed member) is a projection alias; every projected var set holds the
#      declared endpoint component vars of ssh_auth.composition; a missing recorded key or a partial projection refuses.
#      PROXY (r4g codex-tick439 R4F-PROXY-EQUIVALENCE; r4h codex-tick445 R4G-CASE-SENSITIVE-PROXY-OUTCOME +
#      shared_mechanic_decision): the proxy var alone is compared through the EXISTING declared rule
#      ssh_auth.composition.inventory_forms, applied to the recorded AND the effective value by the ONE generic pure form
#      interpreter of the loader engine, exposed as the filter lme_rh_proxy_outcome (PROPOSED, r4h-c1-hunks H-FORM-1;
#      this file holds NO local interpretation): both outcomes admitted and the two exact jump strings EQUAL (string
#      equality; no unique, no case folding -- alice@jump vs Alice@jump refuses); absent, empty and the run mode's exact
#      args are the ONE no-jump outcome; a different jump, ProxyCommand, any other option, or proxy mixed with options
#      refuses. No equivalence table, no copied form value; address, port and key keep the strict law.
#      r4i (codex-tick455): the outcome is CLASSIFICATION, not authentication admission -- an unset / unknown run mode
#      only removes the mode-args form; the mode and host mode == run mode are admitted at their own declared boundaries,
#      never claimed here. The result is indexed by the DECLARED result roles composition.form_semantics.result (PROPOSED
#      C1 node; stage 0 types it). A supplied-null CURRENT proxy refuses here; the record side's null-drop relies on B's
#      producer refusing a raw supplied null before absence encoding (dependency, not claimed).
#      UNTIL C1 LANDS THE FILTER this task fails with an undefined-filter TEMPLATE error, not a typed REFUSED <code>:
#      refusal -- the r4h reader is a proposal consumer, not yet a refusal path. METADATA (R4F-METADATA-RESERVATION-JOIN):
#      the presence record's authority is the admitted binding bytes; a surfaced inventory var of the same name must
#      equal it (caller replacement refuses)
#   9. RESULT: the outputs rh_rcpt_inventory / rh_rcpt_receipt_path / rh_rcpt_receipt_stat / rh_rcpt_receipt (r4d, the
#      verified receipt record B's consumer gate reuses, codex-tick421) and the admission EVIDENCE rh_rcpt_admission (a
#      mapping keyed by binding_admission.result_keys; never a boolean) binding that same receipt path / digest to the
#      selected files, the compared bindings, the producer and consumer attribution, the effective inputs, the placed
#      members and the scope digest; then re-read and checked.
#
# CLAIM (narrow): at check time, the given binding and lab bytes are the ones B's receipt names; the receipt's compared
# bindings equal this resolve's records; the effective declared inputs and the effective vars of every placed member
# equal the vouched binding's values; the outputs record exactly these, and the attributed producer / consumer values as
# read. NOT claimed: the origin of the run data (data / data_sha256 recorded, not re-read); PRE-EXECUTION admission of
# the LOADER bytes (ansible/roles/podman/filter_plugins/lme_manifests.py) -- codex-tick427-428 loader_source_decision
# (resolves r4e OPEN-LOADER-BYTES; SUPERSEDES the earlier "OPEN-LOADER-BYTES waits for Codex"): the admitted loader-source digest is ONE compared receipt_bindings field (B r5k
# receipt_bindings.loader_source_sha256, listed in run_binding.pre_execution_fields; its var / path PENDING C1 -- the
# pre-execution admission record, never a loader output var), which stages 3a / 3b iterate like every compared field
# with no code path of its own (no field named in this file) -- a CROSS-STAGE COMPATIBILITY comparison only; admitting
# the bytes before resolver / filter import is R2's shared source admission and is not claimed here; that the
# loader-bound endpoint record equals the contract endpoint (B's consumer compares it); that the placed member has an
# accepted loader scope (C1 R5G-CONTROLLER-ENDPOINT-SCOPE, open); 8b before its joins land (C1-R5K-2 run_binding.presence
# and the projection endpoint_presence; B r5k writer) -- until then stage 0 / 8b refuse, never a silent pass; that the
# projection is the EXACT declared selected alias / var universe with vouched inventory provenance beyond this file's
# floor (run hosts + endpoint component vars) -- the input vars of the role group and the key var of each ownership
# profile are C1's proof before publication (codex-tick433; C1-R5K-2 rules), and neither B's shape admission nor this
# floor is labelled complete coverage (r4h, codex-tick445 R4G-SELECTED-PROFILE-KEY-COVERAGE: the selected profile's
# key_var is C1's to put in the per-alias expected universe BEFORE publication, r4h-c1-hunks H-KEY-1; this file consumes
# that admitted universe exactly at (iv) and never infers a smaller one from runtime presence; r4i H-KEY-1 revision:
# coverage = the selected profile's source key reference var plus, when the alias's selected mode declares a key_var, that
# mode's effective key var -- missing COVERAGE refuses, a declared no-key mode's absent key does not); that a
# recorded null distinguishes a declared absence from a supplied null (the record conflates them; r4i: the producer's
# refusal of a raw supplied null before absence encoding is B's dependency R4H-SUPPLIED-NULL-ADMISSION); that the run's
# selected mode is admitted or equals any host's mode (classification only, codex-tick455 mode_semantics); that this
# file's own refusals precede every effect of an entry it did not guard (entry custody is the R1/R2 generation join);
# installation; the VALUES of the lineage sub-keys other than the from role's type (to / from_binding / retained are
# key-set bound, not value-checked; the whole lineage member is in the published rh_rcpt_receipt); REPRESENTATION
# COMPLIANCE of the literals in the changed sites (codex-tick439 R4F-CHANGED-VALUE-SOURCING): each is sourced or an
# explicit UNRESOLVED DEBT entry in r4i-value-ledger.yml (the from role selector, the inventory_forms test / outcome
# vocabulary and regex group -- now the shared interpreter's, proposed as declared nodes in r4i-c1-hunks H-FORM-VOCAB,
# still debt until landed --, the detail key selector, the case_sensitive=true constant, the proposed filter name; the
# output keys are now read from the PROPOSED declared node form_semantics.result, debt until it lands); no label
# exempts them; D-1..D-10 stay OPEN (codex-tick455 value_sourcing). CASE (r4h): every
# unique in this file passes case_sensitive=true (Ansible's unique otherwise folds case: host names WEB1 / web1 would
# collapse and a member would silently skip the member / presence loops).
#
# MIGRATION (r4f): a receipt written before B's history-key writer (r5j) -- a transition carrying literal
# from_policy_sha256 / from_engine_revision -- is REFUSED (stage 3c lineage), never reinterpreted; a receipt under a
# declared prior key is REFUSED attributably (stage 1); either is re-rendered by B's writer (B: classified revision).
#
# EFFECTS (source analysis): ansible.builtin.stat on every inventory source and on the receipt (follow false,
# get_checksum true, get_mime false, get_attributes false); ONE ansible.builtin.slurp of the receipt and ONE of the
# binding (each checked against its stat digest from the same task run). No write, no command, no network, no contact.
# The receipt path is bound (set_fact rh_rcpt_receipt_path) BEFORE its stat and compared with its derivation after it;
# no module invocation echo (invocation.module_args) is read.
#
# NAMES (exact reserved_outputs, C1 proposal r4d-c1-hunks N-G3 + r4e-c1-hunks E-N-G3): params rh_rcpt_kind /
# rh_rcpt_operation / rh_rcpt_refusal; outputs rh_rcpt_inventory, rh_rcpt_receipt_path, rh_rcpt_receipt_stat,
# rh_rcpt_receipt, rh_rcpt_admission; registers _rh_rcpt_inv, _rh_rcpt_rcs, _rh_rcpt_rcb, _rh_rcpt_bnd; task / loop vars
# _rh_rcpt_ba, _rh_rcpt_rf, _rh_rcpt_lk, _rh_rcpt_kf, _rh_rcpt_op, _rh_rcpt_rc, _rh_rcpt_bound, _rh_rcpt_rb,
# _rh_rcpt_bi, _rh_rcpt_pk, _rh_rcpt_cur, _rh_rcpt_cmp, _rh_rcpt_dif, _rh_rcpt_hs, _rh_rcpt_att, _rh_rcpt_mb,
# _rh_rcpt_vb, _rh_rcpt_g, _rh_rcpt_m,
# _rh_rcpt_rk, and (r4f: stage 0 / 8b) _rh_rcpt_pr, _rh_rcpt_pe, _rh_rcpt_ep, _rh_rcpt_vh, _rh_rcpt_a, _rh_rcpt_pd,
# _rh_rcpt_ev, _rh_rcpt_ph, and (r4h: proxy outcomes; r4g _rh_rcpt_ps / _rh_rcpt_px removed) _rh_rcpt_rm, _rh_rcpt_pv,
# _rh_rcpt_pc, and (r4i: the declared result-role node) _rh_rcpt_fr --
# all in the family binding_admission.name_family (^_rh_rcpt_), refused by this file's FIRST task,
# which itself defines no task var.

# FIRST TASK: ALIAS-FREE (no task vars -- the lesson of codex-tick409 R4C-SELF-REJECTING-NAME-GUARD). It refuses any
# name of the declared family binding_admission.name_family (^_rh_rcpt_..., the registers and task vars below; registry
# reserved_output_patterns.reserved_rcpt_vars, so B's family guard also refuses it at a first entry that includes that
# guard) before any of them is derived: an extra var outranks a register, so a supplied _rh_rcpt_* could stand in for an
# observation. It also refuses every declared OUTPUT (binding_admission.outputs): an extra var outranks set_fact, so a
# supplied output could stand in for this admission (codex-tick419: reject a caller-supplied admission output at the
# entry boundary; every output is also an exact reserved_outputs name, refused at the includer's FIRST entry by
# refuse_pinned_outputs.yml -- acquire.yml includes that guard but not B's family guard). Consequence: this file is
# included at most ONCE per host per run (a second include sees the first one's registers and outputs and refuses).
- name: "BINDING RECEIPT -- refuse pre-supplied admission names and outputs; the implemented declaration revision; the include parameters"
  ansible.builtin.assert:
    that:
      - (vars | list) | select('match', rh.controller.bootstrap.binding_admission.name_family) | list | length == 0
      - rh.controller.bootstrap.binding_admission.outputs | select('in', vars) | list | length == 0
      - rh.controller.bootstrap.binding_admission.revision == rh.controller.bootstrap.consumer_interface.implements.binding_admission
      - rh_rcpt_kind is defined and rh_rcpt_kind is string
      - rh_rcpt_operation is defined and rh_rcpt_operation is string
      - rh_rcpt_refusal is defined and rh_rcpt_refusal is string and rh_rcpt_refusal | length > 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.binding_admission.include_refusal,
                               'rh_rf_detail': [rh.controller.bootstrap.binding_admission.diagnostics.include,
                                                (vars | list) | select('match', rh.controller.bootstrap.binding_admission.name_family) | list | to_json,
                                                rh.controller.bootstrap.binding_admission.outputs | select('in', vars) | list | to_json,
                                                rh.controller.bootstrap.binding_admission.revision | to_json,
                                                rh.controller.bootstrap.consumer_interface.implements | to_json,
                                                rh.controller.bootstrap.binding_admission.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- the kind declares a receipt and both roles; the operation carries its inputs in the run data and places only in role groups; exactly the kind's files"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_lk: "{{ rh.controller.bootstrap.genesis.launch }}"
  ansible.builtin.assert:
    that:
      - rh_rcpt_kind in _rh_rcpt_lk.inventory_kinds
      - _rh_rcpt_lk.inventory_kinds[rh_rcpt_kind].receipt is defined
      - _rh_rcpt_lk.inventory_kinds[rh_rcpt_kind].receipt in _rh_rcpt_lk.file_roles
      - _rh_rcpt_ba.binding_role in _rh_rcpt_lk.inventory_kinds[rh_rcpt_kind].files
      - rh.controller.bootstrap.run_binding.lab_role in _rh_rcpt_lk.inventory_kinds[rh_rcpt_kind].files
      - rh.controller.bootstrap.run_binding.receipt_suffix is string
      - rh.controller.bootstrap.run_binding.receipt_suffix | length > 0
      - rh_rcpt_operation in rh.controller.bootstrap.inventory.controller_operations
      - rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].inputs_in_run_data
      - >-
        rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].placement_keys
        | reject('in', rh.controller.bootstrap.inventory.role_groups) | list | length == 0
      - ansible_inventory_sources | length == _rh_rcpt_lk.inventory_kinds[rh_rcpt_kind].files | length
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.kind, rh_rcpt_kind, rh_rcpt_operation,
                                                (_rh_rcpt_lk.inventory_kinds[rh_rcpt_kind] if rh_rcpt_kind in _rh_rcpt_lk.inventory_kinds else _rh_rcpt_lk.inventory_kinds | list) | to_json,
                                                ansible_inventory_sources | to_json, _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

# STAGE 0 -- THE DECLARED CONTRACT ROLES, before any read (r4f). HISTORY (codex-tick425-426 R5H-HISTORY-KEY-CONSUMPTION;
# B r5j C1-R5J-1 + the role law of r4-history-key-contract.proposal.yml): the receipt's lineage member is read ONLY under
# the declared history.key (stage 3b; no literal member name in this file). That key is a role of its own: a receipt key
# (the stage 1 key set), never a receipt_bindings field (a colliding key would make a bound value and the lineage record
# ONE member), never a binding_admission attribution field (which include every launch-file field and binding_sha256),
# never a declared prior key; prior keys are no current receipt key. B's writer refuses the same law before it records,
# so a declared rename (old key moved into prior_keys in the SAME revision) is coherent across writer, reader and
# history exactly when receipt_keys names the new key and no other role does; otherwise this refuses. LINEAGE (B r5l
# C1-R5L-1 run_binding.history.lineage {from, from_binding, to, retained}: role -> receipt sub-key; r4-lineage-roles
# f3fb3f5e): a mapping of distinct non-empty string sub-keys holding the `from` role, history.bindings not among them,
# and its own refusal text run_binding.texts.lineage_malformed (stage 3c reads every sub-key ONLY through it).
# ENDPOINT FLOOR (codex-tick433 R5K-PRESENCE-COMPLETENESS-JOIN): the declared endpoint rule
# ssh_auth.composition (endpoint_key components that carry a var: address / port / proxy_jump) yields at least one var.
# PRE-EXECUTION FIELDS (codex-tick427-428 loader_source_decision; B r5k X-R4-6, the writer's law): every listed field is
# a COMPARED receipt binding whose var is no declared loader output var -- the reader refuses what the writer refuses.
# PRESENCE (B r5k X-R4-7): the declaration 8b reads is present and typed before anything is read under it.
- name: "BINDING RECEIPT -- stage 0: the history key is a receipt key of its own role; pre-execution fields are compared non-loader-output bindings; the presence declaration (before any read)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_rb: "{{ rh.controller.bootstrap.run_binding }}"
    _rh_rcpt_hs: "{{ rh.controller.bootstrap.run_binding.history }}"
    _rh_rcpt_pr: "{{ rh.controller.bootstrap.run_binding.presence }}"
    # the declared endpoint component vars (ONE endpoint rule; read, never copied)
    _rh_rcpt_ev: >-
      {{ rh.controller.bootstrap.ssh_auth.composition.endpoint_key | select('in', rh.controller.bootstrap.ssh_auth.composition)
         | map('extract', rh.controller.bootstrap.ssh_auth.composition) | select('mapping') | selectattr('var', 'defined')
         | map(attribute='var') | unique(case_sensitive=true) | list }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_rb.receipt_bindings is mapping
      - _rh_rcpt_rb.receipt_keys is sequence and _rh_rcpt_rb.receipt_keys is not string
      # the two declaration nodes are tested on their own path FIRST (their task-var aliases template only after)
      - rh.controller.bootstrap.run_binding.history is mapping
      - rh.controller.bootstrap.run_binding.presence is mapping
      # history (the declared role law)
      - _rh_rcpt_hs is mapping
      - _rh_rcpt_hs.key is string and _rh_rcpt_hs.key | length > 0
      - _rh_rcpt_hs.bindings is string and _rh_rcpt_hs.bindings | length > 0
      - _rh_rcpt_hs.prior_keys is sequence and _rh_rcpt_hs.prior_keys is not string
      - _rh_rcpt_hs.key in _rh_rcpt_rb.receipt_keys
      - _rh_rcpt_hs.key not in _rh_rcpt_rb.receipt_bindings
      - _rh_rcpt_hs.key not in _rh_rcpt_ba.attributed
      - _rh_rcpt_hs.key not in (_rh_rcpt_ba.fields.values() | list)
      - _rh_rcpt_hs.key not in _rh_rcpt_hs.prior_keys
      - _rh_rcpt_hs.prior_keys | select('in', _rh_rcpt_rb.receipt_keys) | list | length == 0
      # lineage roles (B r5l C1-R5L-1): distinct non-empty string sub-keys, the from role held, bindings not among them
      - _rh_rcpt_hs.lineage is mapping
      - ('from' in _rh_rcpt_hs.lineage)
      - _rh_rcpt_hs.lineage.values() | reject('string') | list | length == 0
      - _rh_rcpt_hs.lineage.values() | select('equalto', '') | list | length == 0
      - (_rh_rcpt_hs.lineage.values() | unique(case_sensitive=true) | list | length) == (_rh_rcpt_hs.lineage | length)
      - _rh_rcpt_hs.bindings not in (_rh_rcpt_hs.lineage.values() | list)
      - rh.controller.bootstrap.run_binding.texts is mapping
      - _rh_rcpt_rb.texts.lineage_malformed is string
      # pre-execution fields (the writer's law, read back)
      - _rh_rcpt_rb.pre_execution_fields is sequence and _rh_rcpt_rb.pre_execution_fields is not string
      - _rh_rcpt_rb.pre_execution_fields | length > 0
      - _rh_rcpt_rb.loader_output_vars is sequence and _rh_rcpt_rb.loader_output_vars is not string
      - _rh_rcpt_rb.pre_execution_fields | reject('in', _rh_rcpt_rb.receipt_bindings) | list | length == 0
      - >-
        _rh_rcpt_rb.receipt_bindings | dict2items | selectattr('key', 'in', _rh_rcpt_rb.pre_execution_fields)
        | rejectattr('value.role', 'equalto', _rh_rcpt_rb.binding_roles.compared) | list | length == 0
      - >-
        _rh_rcpt_rb.receipt_bindings | dict2items | selectattr('key', 'in', _rh_rcpt_rb.pre_execution_fields)
        | map(attribute='value.var') | select('in', _rh_rcpt_rb.loader_output_vars) | list | length == 0
      # presence (the declaration 8b reads)
      - _rh_rcpt_pr is mapping
      - _rh_rcpt_pr.var is string and _rh_rcpt_pr.var | length > 0
      - _rh_rcpt_pr.expected_var is string and _rh_rcpt_pr.expected_var | length > 0
      - _rh_rcpt_pr.expected_path is sequence and _rh_rcpt_pr.expected_path is not string
      # the endpoint floor (the declared endpoint rule; tested on its own path first)
      - rh.controller.bootstrap.ssh_auth.composition is mapping
      - rh.controller.bootstrap.ssh_auth.composition.endpoint_key is sequence and rh.controller.bootstrap.ssh_auth.composition.endpoint_key is not string
      - _rh_rcpt_ev | length > 0
      - _rh_rcpt_ev | reject('string') | list | length == 0
      # the proxy component (r4h; r4i adds the result-role node): ONLY the names this file itself reads are typed here --
      # the var it selects by, the run-mode env name it passes, and the declared result roles it indexes by; the WHOLE accepted-forms rule (vocabulary, pairing, other: refuse, the var join,
      # form_regex, modes) is validated by the shared interpreter itself (lme_rh_proxy_outcome, r4h-c1-hunks H-FORM-1),
      # never re-validated or partially re-implemented here
      - rh.controller.bootstrap.ssh_auth.composition.inventory_forms is mapping
      - rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var is string
      - rh.controller.bootstrap.ssh_auth.env_mode is string
      # r4i H-FORM-VOCAB: the declared result-role node whose two members this file indexes the interpreter result by
      # (PROPOSED C1 node composition.form_semantics; distinct non-empty strings), typed on its own path first
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics is mapping
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics.result is mapping
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.admitted is string
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.jump is string
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.admitted | length > 0
      - rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.jump | length > 0
      - >-
        rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.admitted
        != rh.controller.bootstrap.ssh_auth.composition.form_semantics.result.jump
    # the detail is the WHOLE run_binding declaration (always defined: a missing member is shown, never an
    # undefined-name error in place of the typed refusal)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.binding, _rh_rcpt_rb | to_json,
                                                _rh_rcpt_ba.attributed | to_json,
                                                rh.controller.bootstrap | dict2items | selectattr('key', 'equalto', 'ssh_auth') | items2dict | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- stat every inventory source, in launch order (no link followed; no mime / attribute helper)"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.binding_admission.digest }}"
    get_mime: false
    get_attributes: false
  loop: "{{ ansible_inventory_sources }}"
  register: _rh_rcpt_inv

- name: "BINDING RECEIPT -- refuse an inventory source that is not an existing regular readable non-link file"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
  ansible.builtin.assert:
    that:
      - _rh_rcpt_inv.results | rejectattr('stat.exists') | list | length == 0
      - _rh_rcpt_inv.results | selectattr('stat.islnk') | list | length == 0
      - _rh_rcpt_inv.results | rejectattr('stat.isreg') | list | length == 0
      - _rh_rcpt_inv.results | rejectattr('stat.checksum', 'defined') | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.sources, ansible_inventory_sources | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- bind the receipt path beside the binding directory (B's derivation and declared suffix; outside every -i path)"
  vars:
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
  ansible.builtin.set_fact:
    rh_rcpt_receipt_path: >-
      {{ (ansible_inventory_sources[_rh_rcpt_kf.index(rh.controller.bootstrap.binding_admission.binding_role)] | dirname)
         ~ rh.controller.bootstrap.run_binding.receipt_suffix }}

- name: "BINDING RECEIPT -- stat the receipt (no link followed; no mime / attribute helper)"
  ansible.builtin.stat:
    path: "{{ rh_rcpt_receipt_path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap.binding_admission.digest }}"
    get_mime: false
    get_attributes: false
  register: _rh_rcpt_rcs

- name: "BINDING RECEIPT -- refuse a receipt that is absent, a link, not regular or unreadable (before it is read)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
  ansible.builtin.assert:
    that:
      # an extra var outranks set_fact: the bound path is compared with its derivation (rh_rcpt_receipt_path is also an
      # exact reserved output, refused at the includer's first entry and by the first task above)
      - >-
        rh_rcpt_receipt_path == (ansible_inventory_sources[_rh_rcpt_kf.index(_rh_rcpt_ba.binding_role)] | dirname)
        ~ rh.controller.bootstrap.run_binding.receipt_suffix
      - _rh_rcpt_rcs.stat.exists
      - not _rh_rcpt_rcs.stat.islnk
      - _rh_rcpt_rcs.stat.isreg
      - _rh_rcpt_rcs.stat.checksum is defined
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.receipt, rh_rcpt_receipt_path,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- read the receipt ONCE (its exact bytes; checked against its stat digest next)"
  ansible.builtin.slurp:
    src: "{{ rh_rcpt_receipt_path }}"
  register: _rh_rcpt_rcb

- name: "BINDING RECEIPT -- read the binding ONCE (its exact bytes; checked against its stat digest next)"
  vars:
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
  ansible.builtin.slurp:
    src: "{{ ansible_inventory_sources[_rh_rcpt_kf.index(rh.controller.bootstrap.binding_admission.binding_role)] }}"
  register: _rh_rcpt_bnd

- name: "BINDING RECEIPT -- stage 1: both reads are their stat'd bytes; the receipt key set and its contract; the binding declares the delegation host"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
    _rh_rcpt_rb: "{{ rh.controller.bootstrap.run_binding }}"
  ansible.builtin.assert:
    that:
      - (_rh_rcpt_rcb.content | b64decode | hash(_rh_rcpt_ba.digest)) == _rh_rcpt_rcs.stat.checksum
      - (_rh_rcpt_bnd.content | b64decode | hash(_rh_rcpt_ba.digest)) == _rh_rcpt_inv.results[_rh_rcpt_kf.index(_rh_rcpt_ba.binding_role)].stat.checksum
      - (_rh_rcpt_rcb.content | b64decode | from_yaml) is mapping
      - ((_rh_rcpt_rcb.content | b64decode | from_yaml) | list | sort) == (_rh_rcpt_rb.receipt_keys | sort)
      - _rh_rcpt_ba.attributed | reject('in', _rh_rcpt_rb.receipt_keys) | list | length == 0
      - (_rh_rcpt_ba.fields.values() | list) | reject('in', _rh_rcpt_ba.attributed) | list | length == 0
      # the ONE receipt contract (B r5h C1-R5H-3): bound fields are receipt keys, each with a declared role, >= 1 compared
      - _rh_rcpt_rb.receipt_bindings is mapping
      - (_rh_rcpt_rb.receipt_bindings | list) | reject('in', _rh_rcpt_rb.receipt_keys) | list | length == 0
      - _rh_rcpt_rb.receipt_bindings | dict2items | map(attribute='value.role') | reject('in', _rh_rcpt_rb.binding_roles.values() | list) | list | length == 0
      - _rh_rcpt_rb.receipt_bindings | dict2items | selectattr('value.role', 'equalto', _rh_rcpt_rb.binding_roles.compared) | list | length > 0
      - (_rh_rcpt_bnd.content | b64decode | from_yaml) is mapping
      - (_rh_rcpt_bnd.content | b64decode | from_yaml)[_rh_rcpt_ba.inventory_schema.root] is mapping
      - (_rh_rcpt_bnd.content | b64decode | from_yaml)[_rh_rcpt_ba.inventory_schema.root][_rh_rcpt_ba.inventory_schema.hosts] is mapping
      - >-
        rh.controller.bootstrap.inventory.controller_delegation.host
        in (_rh_rcpt_bnd.content | b64decode | from_yaml)[_rh_rcpt_ba.inventory_schema.root][_rh_rcpt_ba.inventory_schema.hosts]
    # the receipt's OWN key set is named beside the declared one (r4f), and every DECLARED PRIOR history key it carries
    # with that key's lineage record: a PRIOR-FORMAT receipt (B r5j reader contract) is refused ATTRIBUTABLY, by its
    # prior key and its lineage -- never admitted as the current receipt (stage 0 typed history.prior_keys)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.receipt, rh_rcpt_receipt_path,
                                                _rh_rcpt_rcs.stat.checksum, _rh_rcpt_rb.receipt_keys | to_json,
                                                (((_rh_rcpt_rcb.content | b64decode | from_yaml) | list | sort)
                                                 if (_rh_rcpt_rcb.content | b64decode | from_yaml) is mapping else []) | to_json,
                                                (((_rh_rcpt_rcb.content | b64decode | from_yaml) | dict2items
                                                  | selectattr('key', 'in', _rh_rcpt_rb.history.prior_keys) | items2dict)
                                                 if (_rh_rcpt_rcb.content | b64decode | from_yaml) is mapping else {}) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- stage 2: the receipt names exactly the given binding and lab copy"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
    _rh_rcpt_rc: "{{ _rh_rcpt_rcb.content | b64decode | from_yaml }}"
  ansible.builtin.assert:
    that:
      - _rh_rcpt_rc[_rh_rcpt_ba.fields.binding] == ansible_inventory_sources[_rh_rcpt_kf.index(_rh_rcpt_ba.binding_role)]
      - _rh_rcpt_rc[_rh_rcpt_ba.fields.binding_sha256] == _rh_rcpt_inv.results[_rh_rcpt_kf.index(_rh_rcpt_ba.binding_role)].stat.checksum
      - _rh_rcpt_rc[_rh_rcpt_ba.fields.lab] == ansible_inventory_sources[_rh_rcpt_kf.index(rh.controller.bootstrap.run_binding.lab_role)]
      - _rh_rcpt_rc[_rh_rcpt_ba.fields.lab_sha256] == _rh_rcpt_inv.results[_rh_rcpt_kf.index(rh.controller.bootstrap.run_binding.lab_role)].stat.checksum
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.join, ansible_inventory_sources | to_json,
                                                _rh_rcpt_inv.results | map(attribute='stat.checksum') | list | to_json,
                                                _rh_rcpt_rc | dict2items | selectattr('key', 'in', _rh_rcpt_ba.fields.values() | list) | items2dict | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

# RECEIPT BINDINGS (codex-tick421 J_B8_decision). Each run_binding.receipt_bindings entry {role, var, path} names an
# EXISTING current-resolve record: the var (one var of that name) and the key path inside it. STAGED: the var is present
# and every path step exists (one entry per item) before any value is read. The value walk is the SAME construction
# proposed for B's writer (r4e-admission-output.proposal.yml W-1), so writer and reader read one declaration one way.
- name: "BINDING RECEIPT -- stage 3a: every declared receipt binding names ONE present record and an existing path in it (one entry per item)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_pk: >-
      {%- set ns = namespace(v=lookup('ansible.builtin.vars', _rh_rcpt_bi.value.var), ok=true) -%}
      {%- for k in _rh_rcpt_bi.value.path -%}
      {%- if ns.ok and ns.v is mapping and k in ns.v -%}{%- set ns.v = ns.v[k] -%}{%- else -%}{%- set ns.ok = false -%}{%- endif -%}
      {%- endfor -%}{{ ns.ok }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_bi.value is mapping
      - _rh_rcpt_bi.value.var is string
      - _rh_rcpt_bi.value.path is sequence and _rh_rcpt_bi.value.path is not string
      - q('ansible.builtin.varnames', '^' ~ _rh_rcpt_bi.value.var ~ '$') | length == 1
      - _rh_rcpt_pk | bool
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.binding, _rh_rcpt_bi.key, _rh_rcpt_bi.value | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true
  loop: "{{ rh.controller.bootstrap.run_binding.receipt_bindings | dict2items }}"
  loop_control:
    loop_var: _rh_rcpt_bi

- name: "BINDING RECEIPT -- stage 3b: every COMPARED binding equals this resolve's record (all differing fields named)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_rb: "{{ rh.controller.bootstrap.run_binding }}"
    _rh_rcpt_rc: "{{ _rh_rcpt_rcb.content | b64decode | from_yaml }}"
    _rh_rcpt_cur: >-
      {%- set ns = namespace(d={}, v=none) -%}
      {%- for f, b in rh.controller.bootstrap.run_binding.receipt_bindings.items() -%}
      {%- set ns.v = lookup('ansible.builtin.vars', b.var) -%}
      {%- for k in b.path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
      {%- set ns.d = ns.d | combine({f: ns.v}) -%}
      {%- endfor -%}{{ ns.d }}
    _rh_rcpt_cmp: >-
      {{ rh.controller.bootstrap.run_binding.receipt_bindings | dict2items
         | selectattr('value.role', 'equalto', rh.controller.bootstrap.run_binding.binding_roles.compared)
         | map(attribute='key') | list }}
    # the compared fields whose receipt value differs from this resolve's record (each named; its OWN cause)
    _rh_rcpt_dif: >-
      {%- set ns = namespace(d=[]) -%}
      {%- for f in _rh_rcpt_cmp -%}{%- if _rh_rcpt_rc[f] != _rh_rcpt_cur[f] -%}{%- set ns.d = ns.d + [f] -%}{%- endif -%}{%- endfor -%}
      {{ ns.d }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_dif | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.binding, _rh_rcpt_dif | to_json,
                                                _rh_rcpt_rc | dict2items | selectattr('key', 'in', _rh_rcpt_dif) | items2dict | to_json,
                                                _rh_rcpt_cur | dict2items | selectattr('key', 'in', _rh_rcpt_dif) | items2dict | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

# STAGE 3c -- THE LINEAGE MEMBER, its OWN cause (r4f; B r5l reader_contract, C1-R5L-1 lineage roles + texts.lineage_malformed;
# codex-tick425-426 history key; PROVISIONAL until C1 lands both). Read ONLY under the DECLARED history.key and every
# sub-key ONLY through history.lineage[<role>] (admitted at stage 0; no literal sub-key in this file): the member is null
# (no recorded transition) or a mapping whose key set is EXACTLY the lineage sub-keys plus history.bindings, its
# from-role value a string, and its [history.bindings] member a mapping keyed by EXACTLY the contract's fields (both
# roles) -- each superseded value under its own declared field. Anything else refuses here, never as an undefined
# name: a pre-r5j transition (literal from_policy_sha256 / from_engine_revision) is such a refusal (MIGRATION).
- name: "BINDING RECEIPT -- stage 3c: the declared lineage member is null or EXACTLY the declared lineage sub-keys plus the bound-field attribution"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_rb: "{{ rh.controller.bootstrap.run_binding }}"
    _rh_rcpt_rc: "{{ _rh_rcpt_rcb.content | b64decode | from_yaml }}"
    _rh_rcpt_hs: "{{ rh.controller.bootstrap.run_binding.history }}"
  ansible.builtin.assert:
    that:
      - _rh_rcpt_rc[_rh_rcpt_hs.key] is none or _rh_rcpt_rc[_rh_rcpt_hs.key] is mapping
      - >-
        _rh_rcpt_rc[_rh_rcpt_hs.key] is none
        or (_rh_rcpt_rc[_rh_rcpt_hs.key] | list | sort) == ((_rh_rcpt_hs.lineage.values() | list) + [_rh_rcpt_hs.bindings]) | sort
      - _rh_rcpt_rc[_rh_rcpt_hs.key] is none or _rh_rcpt_rc[_rh_rcpt_hs.key][_rh_rcpt_hs.lineage['from']] is string
      - >-
        _rh_rcpt_rc[_rh_rcpt_hs.key] is none
        or (_rh_rcpt_rc[_rh_rcpt_hs.key][_rh_rcpt_hs.bindings] is mapping
            and (_rh_rcpt_rc[_rh_rcpt_hs.key][_rh_rcpt_hs.bindings] | list | sort) == (_rh_rcpt_rb.receipt_bindings | list | sort))
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_rb.texts.lineage_malformed, _rh_rcpt_hs | to_json,
                                                _rh_rcpt_rc[_rh_rcpt_hs.key] | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- the effective declared inputs ARE the receipt-vouched binding's values (no override of a different value)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_op: "{{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].inputs | dict2items | map(attribute='value.var') | list }}"
    _rh_rcpt_bound: >-
      {{ (_rh_rcpt_bnd.content | b64decode | from_yaml)[rh.controller.bootstrap.binding_admission.inventory_schema.root][rh.controller.bootstrap.binding_admission.inventory_schema.hosts][rh.controller.bootstrap.inventory.controller_delegation.host] }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_bound is mapping
      - _rh_rcpt_op | reject('in', _rh_rcpt_bound) | list | length == 0
      - query('ansible.builtin.vars', *_rh_rcpt_op) == (_rh_rcpt_op | map('extract', _rh_rcpt_bound) | list)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.input, rh_rcpt_operation, _rh_rcpt_op | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

# PLACED MEMBERS (codex-tick419: bind the result to the resolved endpoint scope; compare effective values with the
# receipt-vouched binding before contact). The members are derived from the DECLARED placement (controller_operations
# [op].placement_keys -> inventory.role_groups -> groups), never from the surviving maps of the loader projection; an
# operation with no placement keys (the measurement) has NO member and these checks are vacuous for it. The loader-bound
# endpoint records are NOT read here (their binding.deployment key names are B's endpoint_kinds declaration): this
# resolve's scope_sha256 covers them (C1-R5G-13) and B's consumer compares the record itself (proposal G-2).
- name: "BINDING RECEIPT -- placed members: each placement group's EFFECTIVE members are the receipt-vouched binding's members (one group per item)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_vb: "{{ (_rh_rcpt_bnd.content | b64decode | from_yaml)[rh.controller.bootstrap.binding_admission.inventory_schema.root] }}"
  ansible.builtin.assert:
    that:
      - _rh_rcpt_ba.inventory_schema.children not in _rh_rcpt_vb or _rh_rcpt_vb[_rh_rcpt_ba.inventory_schema.children] is mapping
      - >-
        ((groups[_rh_rcpt_g] | list) if _rh_rcpt_g in groups else []) | sort
        == (((_rh_rcpt_vb[_rh_rcpt_ba.inventory_schema.children][_rh_rcpt_g][_rh_rcpt_ba.inventory_schema.hosts] | list)
             if (_rh_rcpt_ba.inventory_schema.children in _rh_rcpt_vb
                 and _rh_rcpt_g in _rh_rcpt_vb[_rh_rcpt_ba.inventory_schema.children]
                 and _rh_rcpt_vb[_rh_rcpt_ba.inventory_schema.children][_rh_rcpt_g] is mapping
                 and _rh_rcpt_vb[_rh_rcpt_ba.inventory_schema.children][_rh_rcpt_g][_rh_rcpt_ba.inventory_schema.hosts] is mapping)
             else []) | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.members, rh_rcpt_operation, _rh_rcpt_g,
                                                ((groups[_rh_rcpt_g] | list) if _rh_rcpt_g in groups else []) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true
  loop: >-
    {{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].placement_keys
       | map('extract', rh.controller.bootstrap.inventory.role_groups) | list }}
  loop_control:
    loop_var: _rh_rcpt_g

- name: "BINDING RECEIPT -- placed members: every var the vouched binding declares for a member is its EFFECTIVE value (one member per item)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_vb: >-
      {{ (_rh_rcpt_bnd.content | b64decode | from_yaml)[rh.controller.bootstrap.binding_admission.inventory_schema.root][rh.controller.bootstrap.binding_admission.inventory_schema.hosts] }}
    # R4G-CASE-SENSITIVE-PROXY-OUTCOME (r4h, codex-tick445): the proxy var (ssh_auth.composition.inventory_forms.var) is
    # compared by its accepted-form OUTCOME from the ONE shared interpreter (lme_rh_proxy_outcome, PROPOSED C1 filter,
    # r4h-c1-hunks H-FORM-1): source mapping (absent = the var is not a key; a supplied null stays a value), the
    # declared rule (registry endpoint.rule_path) and auth node (endpoint.auth_path), and the RUN's selected mode (the
    # declared env_mode; the loader passes the host mode_var). r4i codex-tick455 mode_semantics: this is CLASSIFICATION,
    # not authentication admission -- an unset / unknown run mode only means no mode-args form holds; absent, empty and
    # jump forms are still classified. The selected mode, and host mode == run mode, are admitted at their own declared
    # boundaries (seed run --ssh-auth; admit_transport.yml :33-34 in each target play; B resolve_contract), which this
    # reader neither performs nor assumes has run (it runs before contact).
    # Read only when the vouched binding declares the var (an inherited lab value is the presence record's, 8b).
    # r4i H-FORM-VOCAB: the result keys are read from the declared node composition.form_semantics.result (PROPOSED C1
    # node, r4i-c1-hunks H-FORM-VOCAB), never written here as literals.
    _rh_rcpt_fr: "{{ rh.controller.bootstrap.ssh_auth.composition.form_semantics.result }}"
    _rh_rcpt_rm: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.ssh_auth.env_mode) }}"
    _rh_rcpt_pv: >-
      {{ _rh_rcpt_vb[_rh_rcpt_m] | lme_rh_proxy_outcome(rh.controller.bootstrap.ssh_auth.composition,
                                                         rh.controller.bootstrap.ssh_auth, _rh_rcpt_rm) }}
    _rh_rcpt_pc: >-
      {{ hostvars[_rh_rcpt_m] | lme_rh_proxy_outcome(rh.controller.bootstrap.ssh_auth.composition,
                                                      rh.controller.bootstrap.ssh_auth, _rh_rcpt_rm) }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_m in _rh_rcpt_vb
      - _rh_rcpt_vb[_rh_rcpt_m] is mapping
      - >-
        _rh_rcpt_vb[_rh_rcpt_m] | list | reject('equalto', rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var)
        | reject('in', hostvars[_rh_rcpt_m]) | list | length == 0
      - >-
        (_rh_rcpt_vb[_rh_rcpt_m] | list | reject('equalto', rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var)
         | map('extract', hostvars[_rh_rcpt_m]) | list)
        == (_rh_rcpt_vb[_rh_rcpt_m] | list | reject('equalto', rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var)
            | map('extract', _rh_rcpt_vb[_rh_rcpt_m]) | list)
      # the proxy var: both sides ADMITTED by the shared interpreter and the two exact jump strings EQUAL (plain string
      # equality, case-sensitive; a refused outcome on either side refuses; no unique, no case folding)
      - >-
        rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var not in _rh_rcpt_vb[_rh_rcpt_m]
        or (_rh_rcpt_pv[_rh_rcpt_fr.admitted] and _rh_rcpt_pc[_rh_rcpt_fr.admitted]
            and _rh_rcpt_pv[_rh_rcpt_fr.jump] == _rh_rcpt_pc[_rh_rcpt_fr.jump])
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.members, rh_rcpt_operation, _rh_rcpt_m,
                                                ((_rh_rcpt_vb[_rh_rcpt_m] | list) if (_rh_rcpt_m in _rh_rcpt_vb and _rh_rcpt_vb[_rh_rcpt_m] is mapping) else []) | to_json,
                                                ([_rh_rcpt_pv, _rh_rcpt_pc] if (_rh_rcpt_m in _rh_rcpt_vb and _rh_rcpt_vb[_rh_rcpt_m] is mapping
                                                                 and rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var in _rh_rcpt_vb[_rh_rcpt_m]) else []) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true
  loop: >-
    {{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].placement_keys
       | map('extract', rh.controller.bootstrap.inventory.role_groups) | select('in', groups)
       | map('extract', groups) | flatten | unique(case_sensitive=true) | sort }}
  loop_control:
    loop_var: _rh_rcpt_m

# ENDPOINT / INPUT PRESENCE (codex-tick427-428 R4E-ENDPOINT-PRESENCE-BINDING; the reader of B r5k X-R4-7; PROVISIONAL on
# C1-R5K-2). The check above compares only the vars the vouched binding declares for a member; an address the inventory
# omits leaves no key there, so an added -e ansible_host would change no compared key. B's writer therefore records in
# the vouched binding bytes, for every alias of C1's expected projection and under the declared var
# run_binding.presence.var, EVERY declared endpoint / input var (binding value, else vouched lab-inherited value, else
# null = declared absence; values only, never their source location). The EXPECTED SET (aliases and per-alias vars) is
# THIS resolve's projection at run_binding.presence.{expected_var, expected_path} -- the current declaration, never the
# vars a record happens to carry. STAGED like stage 3a: the projection exists and is a mapping of mappings before any
# value is read. No whole-engine / inventory-sensitive revision is compared (engine_revision stays attributed).
# COMPLETENESS (codex-tick433 R5K-PRESENCE-COMPLETENESS-JOIN): the record is bound to the ADMITTED expected universe,
# never shrunk to the record's keys -- (i) every run host of this operation (its placed members, the 8 loop) is an
# alias of the projection (a run host outside it refuses), (ii) every projection alias records presence and nothing else
# does, (iii) every alias's projected var set holds at least the declared endpoint component vars of the ONE endpoint
# rule ssh_auth.composition (address / port / proxy_jump var; an alias mapped to {} or missing one refuses), (iv) the
# record's var set per alias is EXACTLY the projected one (a missing or extra recorded key refuses). The proof that the
# projection is the EXACT declared selected alias / var universe (input vars of the role group, key vars by ownership
# profile) and of its vouched inventory provenance is C1's before publication (C1-R5K-2); this reader does not label
# B's shape admission, nor its own floor, as complete coverage.
- name: "BINDING RECEIPT -- presence: the expected projection exists, holds every run host, and the vouched binding records presence for EXACTLY its aliases"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_pr: "{{ rh.controller.bootstrap.run_binding.presence }}"
    _rh_rcpt_pe: >-
      {%- set ns = namespace(v=none, ok=(q('ansible.builtin.varnames', '^' ~ _rh_rcpt_pr.expected_var ~ '$') | length == 1)) -%}
      {%- if ns.ok -%}{%- set ns.v = lookup('ansible.builtin.vars', _rh_rcpt_pr.expected_var) -%}{%- endif -%}
      {%- for k in _rh_rcpt_pr.expected_path -%}
      {%- if ns.ok and ns.v is mapping and k in ns.v -%}{%- set ns.v = ns.v[k] -%}{%- else -%}{%- set ns.ok = false -%}{%- endif -%}
      {%- endfor -%}{{ ns.ok and ns.v is mapping }}
    _rh_rcpt_ep: >-
      {%- set ns = namespace(v=lookup('ansible.builtin.vars', _rh_rcpt_pr.expected_var)) -%}
      {%- for k in _rh_rcpt_pr.expected_path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}{{ ns.v }}
    _rh_rcpt_vh: >-
      {{ (_rh_rcpt_bnd.content | b64decode | from_yaml)[rh.controller.bootstrap.binding_admission.inventory_schema.root][rh.controller.bootstrap.binding_admission.inventory_schema.hosts] }}
    # this operation's run hosts: its placed members (the SAME expression as the placed-member loop above)
    _rh_rcpt_ph: >-
      {{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].placement_keys
         | map('extract', rh.controller.bootstrap.inventory.role_groups) | select('in', groups)
         | map('extract', groups) | flatten | unique(case_sensitive=true) | sort }}
  ansible.builtin.assert:
    that:
      - _rh_rcpt_pe | bool
      - _rh_rcpt_ep | dict2items | rejectattr('value', 'mapping') | list | length == 0
      # (i) no run host outside the admitted projection (the universe is never shrunk to the record's aliases)
      - _rh_rcpt_ph | reject('in', _rh_rcpt_ep) | list | length == 0
      - >-
        (_rh_rcpt_vh | dict2items | selectattr('value', 'mapping') | selectattr('value', 'contains', _rh_rcpt_pr.var)
         | map(attribute='key') | list | sort)
        == (_rh_rcpt_ep | list | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.members, rh_rcpt_operation, _rh_rcpt_pr | to_json,
                                                ((_rh_rcpt_ph | reject('in', _rh_rcpt_ep) | list) if (_rh_rcpt_pe | bool) else _rh_rcpt_ph) | to_json,
                                                (_rh_rcpt_vh | dict2items | selectattr('value', 'mapping')
                                                 | selectattr('value', 'contains', _rh_rcpt_pr.var) | map(attribute='key') | list | sort) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

# Per alias: a recorded NULL requires the var UNDEFINED in the alias's effective hostvars (absent-to-present refuses,
# whatever the value); a recorded VALUE requires the effective value EQUAL (a re-supplied identical value passes, a
# different one refuses). The projected var set holds every declared endpoint component var (iii) and the record's var
# set is EXACTLY the projection's for that alias (iv: a missing recorded key refuses). One alias per item.
# EXCEPTION, the proxy var only (r4g, codex-tick439 R4F-PROXY-EQUIVALENCE; r4h, codex-tick445): compared by the outcome
# of the declared ssh_auth.composition.inventory_forms rule on BOTH the recorded and the effective value (absent / empty
# / run-mode args = the one no-jump outcome; a different jump or any non-accepted form refuses), computed by the SAME
# shared C1 interpreter as the placed-member check (lme_rh_proxy_outcome; no local copy) and compared EXACTLY. The
# recorded side passes the record with its null entries dropped (the record law: null = declared absence); B's record
# conflates a declared absence with a supplied null (disclosed in CLAIM), so THIS site does not preserve supplied-null
# -- the placed-member site and the interpreter itself do. Address, port and key keep the strict presence law. The surfaced presence metadata var, when
# defined, must equal the admitted record (R4F-METADATA-RESERVATION-JOIN).
- name: "BINDING RECEIPT -- presence: every declared var of every expected alias is effectively absent / equal exactly as the vouched record says (one alias per item)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_pr: "{{ rh.controller.bootstrap.run_binding.presence }}"
    _rh_rcpt_ep: >-
      {%- set ns = namespace(v=lookup('ansible.builtin.vars', rh.controller.bootstrap.run_binding.presence.expected_var)) -%}
      {%- for k in rh.controller.bootstrap.run_binding.presence.expected_path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}{{ ns.v }}
    _rh_rcpt_vh: >-
      {{ (_rh_rcpt_bnd.content | b64decode | from_yaml)[rh.controller.bootstrap.binding_admission.inventory_schema.root][rh.controller.bootstrap.binding_admission.inventory_schema.hosts] }}
    # the declared endpoint component vars (stage 0 admitted them; ONE endpoint rule, read, never copied)
    _rh_rcpt_ev: >-
      {{ rh.controller.bootstrap.ssh_auth.composition.endpoint_key | select('in', rh.controller.bootstrap.ssh_auth.composition)
         | map('extract', rh.controller.bootstrap.ssh_auth.composition) | select('mapping') | selectattr('var', 'defined')
         | map(attribute='var') | unique(case_sensitive=true) | list }}
    # R4G-CASE-SENSITIVE-PROXY-OUTCOME (r4h): the recorded and the effective proxy outcome from the ONE shared
    # interpreter (lme_rh_proxy_outcome, PROPOSED C1 filter, r4h-c1-hunks H-FORM-1) -- read only when the record is a
    # mapping carrying the proxy var (guarded in _rh_rcpt_pd / the detail); the record side drops its null entries
    # (record law: null = declared absence => the var is not a key). r4i R4H-SUPPLIED-NULL-ADMISSION: dropping the
    # record's nulls is sound ONLY because the PRODUCER refuses a raw supplied null for the proxy input of EVERY expected
    # alias (controller and non-target included) before it encodes absence -- B's dependency (r4i-c1-hunks
    # F-SUPPLIED-NULL-PRODUCER), not claimed here; the CURRENT side is hostvars unchanged, so a supplied-null effective
    # proxy is not admitted by the interpreter and refuses below. Mode: classification only (see the placed-member task).
    _rh_rcpt_fr: "{{ rh.controller.bootstrap.ssh_auth.composition.form_semantics.result }}"
    _rh_rcpt_rm: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.ssh_auth.env_mode) }}"
    _rh_rcpt_pv: >-
      {{ _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] | dict2items | rejectattr('value', 'none') | items2dict
         | lme_rh_proxy_outcome(rh.controller.bootstrap.ssh_auth.composition, rh.controller.bootstrap.ssh_auth, _rh_rcpt_rm) }}
    _rh_rcpt_pc: >-
      {{ hostvars[_rh_rcpt_a] | lme_rh_proxy_outcome(rh.controller.bootstrap.ssh_auth.composition,
                                                      rh.controller.bootstrap.ssh_auth, _rh_rcpt_rm) }}
    # the declared vars whose effective presence / value differs from the vouched record (each named). Address, port
    # and key keep the strict null => UNDEFINED / value => EQUAL law (no absence equivalence); ONLY the proxy var is
    # compared by its accepted-form outcome: both admitted and the exact jump strings equal (r4h; no unique)
    _rh_rcpt_pd: >-
      {%- set ns = namespace(d=[]) -%}
      {%- if _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] is mapping -%}
      {%- for v, x in _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var].items() -%}
      {%- if v == rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var -%}
      {%- if not (_rh_rcpt_pv[_rh_rcpt_fr.admitted] and _rh_rcpt_pc[_rh_rcpt_fr.admitted] and _rh_rcpt_pv[_rh_rcpt_fr.jump] == _rh_rcpt_pc[_rh_rcpt_fr.jump]) -%}{%- set ns.d = ns.d + [v] -%}{%- endif -%}
      {%- elif (x is none and v in hostvars[_rh_rcpt_a]) or (x is not none and (v not in hostvars[_rh_rcpt_a] or hostvars[_rh_rcpt_a][v] != x)) -%}
      {%- set ns.d = ns.d + [v] -%}
      {%- endif -%}
      {%- endfor -%}
      {%- endif -%}{{ ns.d }}
  ansible.builtin.assert:
    that:
      # (iii) the projected var set holds the declared endpoint floor (a partial projection, incl. {}, refuses)
      - _rh_rcpt_ev | reject('in', _rh_rcpt_ep[_rh_rcpt_a]) | list | length == 0
      - _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] is mapping
      # (iv) the record's var set is EXACTLY the projected one
      - (_rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] | list | sort) == (_rh_rcpt_ep[_rh_rcpt_a] | list | sort)
      # R4F-METADATA-RESERVATION-JOIN (r4g): the presence member's authority is the ADMITTED binding bytes (read above,
      # never hostvars); when it surfaces as an effective inventory var it must BE the admitted metadata -- an extra-var
      # (or any caller) replacement refuses here, before any dependent effect (no family exemption, no guard suppressed)
      - _rh_rcpt_pr.var not in hostvars[_rh_rcpt_a] or hostvars[_rh_rcpt_a][_rh_rcpt_pr.var] == _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var]
      - _rh_rcpt_pd | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.members, rh_rcpt_operation, _rh_rcpt_a,
                                                (_rh_rcpt_ep[_rh_rcpt_a] | list | sort) | to_json,
                                                (_rh_rcpt_ev | reject('in', _rh_rcpt_ep[_rh_rcpt_a]) | list) | to_json,
                                                ((_rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] | dict2items | selectattr('key', 'in', _rh_rcpt_pd) | items2dict)
                                                 if _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] is mapping else {}) | to_json,
                                                (_rh_rcpt_pd | select('in', hostvars[_rh_rcpt_a]) | list) | to_json,
                                                ([_rh_rcpt_pv, _rh_rcpt_pc] if (_rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var] is mapping
                                                                 and rh.controller.bootstrap.ssh_auth.composition.inventory_forms.var in _rh_rcpt_vh[_rh_rcpt_a][_rh_rcpt_pr.var]) else []) | to_json,
                                                (_rh_rcpt_pr.var in hostvars[_rh_rcpt_a]) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true
  loop: >-
    {%- set ns = namespace(v=lookup('ansible.builtin.vars', rh.controller.bootstrap.run_binding.presence.expected_var)) -%}
    {%- for k in rh.controller.bootstrap.run_binding.presence.expected_path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
    {{ ns.v | list | sort }}
  loop_control:
    loop_var: _rh_rcpt_a

- name: "BINDING RECEIPT -- this resolve binds a scope and its digest (the resolved endpoint scope the evidence records)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.scope is defined
      - lme_resolved.remote_harness.scope_sha256 is defined
      - lme_resolved.remote_harness.scope_sha256 is string
      - lme_resolved.remote_harness.scope_sha256 is match(_rh_rcpt_ba.digest_regex)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.members, rh_rcpt_operation,
                                                (lme_resolved.remote_harness | list) | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true

- name: "BINDING RECEIPT -- publish the admitted sources, receipt stat and parsed receipt (the verified receipt record; the path is bound above)"
  ansible.builtin.set_fact:
    rh_rcpt_inventory: "{{ _rh_rcpt_inv.results }}"
    rh_rcpt_receipt_stat: "{{ _rh_rcpt_rcs.stat }}"
    rh_rcpt_receipt: "{{ _rh_rcpt_rcb.content | b64decode | from_yaml }}"

# EVIDENCE (codex-tick419 / tick421; never an unbound boolean): ONE mapping keyed by the declared
# binding_admission.result_keys, binding the verified receipt record above (path, digest) to the selected files, the
# compared bindings, the attributed values of the PRODUCER (the receipt) and of this CONSUMER (its own resolve) kept
# separately, the effective inputs, the placed members and this resolve's scope digest. B's consumer gate requires the
# receipt record and this evidence before controller-operation contract use (proposal G-1..G-3).
- name: "BINDING RECEIPT -- publish the admission evidence (files, receipt, compared bindings, producer / consumer attribution, inputs, members, scope)"
  vars:
    _rh_rcpt_kf: "{{ rh.controller.bootstrap.genesis.launch.inventory_kinds[rh_rcpt_kind].files }}"
    _rh_rcpt_rk: "{{ rh.controller.bootstrap.binding_admission.result_keys }}"
    _rh_rcpt_rc: "{{ _rh_rcpt_rcb.content | b64decode | from_yaml }}"
    _rh_rcpt_op: "{{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].inputs | dict2items | map(attribute='value.var') | list }}"
    _rh_rcpt_cur: >-
      {%- set ns = namespace(d={}, v=none) -%}
      {%- for f, b in rh.controller.bootstrap.run_binding.receipt_bindings.items() -%}
      {%- set ns.v = lookup('ansible.builtin.vars', b.var) -%}
      {%- for k in b.path -%}{%- set ns.v = ns.v[k] -%}{%- endfor -%}
      {%- set ns.d = ns.d | combine({f: ns.v}) -%}
      {%- endfor -%}{{ ns.d }}
    _rh_rcpt_cmp: >-
      {{ rh.controller.bootstrap.run_binding.receipt_bindings | dict2items
         | selectattr('value.role', 'equalto', rh.controller.bootstrap.run_binding.binding_roles.compared)
         | map(attribute='key') | list }}
    _rh_rcpt_att: >-
      {{ rh.controller.bootstrap.run_binding.receipt_bindings | dict2items
         | selectattr('value.role', 'equalto', rh.controller.bootstrap.run_binding.binding_roles.attributed)
         | map(attribute='key') | list }}
    _rh_rcpt_mb: >-
      {{ rh.controller.bootstrap.inventory.controller_operations[rh_rcpt_operation].placement_keys
         | map('extract', rh.controller.bootstrap.inventory.role_groups) | select('in', groups)
         | map('extract', groups) | flatten | unique(case_sensitive=true) | sort }}
  ansible.builtin.set_fact:
    rh_rcpt_admission: >-
      {{ {_rh_rcpt_rk.operation: rh_rcpt_operation,
          _rh_rcpt_rk.kind: rh_rcpt_kind,
          _rh_rcpt_rk.files: dict(_rh_rcpt_kf | zip(ansible_inventory_sources)),
          _rh_rcpt_rk.file_sha256: dict(_rh_rcpt_kf | zip(_rh_rcpt_inv.results | map(attribute='stat.checksum') | list)),
          _rh_rcpt_rk.receipt: rh_rcpt_receipt_path,
          _rh_rcpt_rk.receipt_sha256: _rh_rcpt_rcs.stat.checksum,
          _rh_rcpt_rk.bindings: rh.controller.bootstrap.run_binding.receipt_bindings,
          _rh_rcpt_rk.compared: _rh_rcpt_cur | dict2items | selectattr('key', 'in', _rh_rcpt_cmp) | items2dict,
          _rh_rcpt_rk.producer: _rh_rcpt_rc | dict2items | selectattr('key', 'in', _rh_rcpt_att) | items2dict,
          _rh_rcpt_rk.consumer: _rh_rcpt_cur | dict2items | selectattr('key', 'in', _rh_rcpt_att) | items2dict,
          _rh_rcpt_rk.inputs: dict(_rh_rcpt_op | zip(query('ansible.builtin.vars', *_rh_rcpt_op))),
          _rh_rcpt_rk.members: _rh_rcpt_mb,
          _rh_rcpt_rk.scope: lme_resolved.remote_harness.scope,
          _rh_rcpt_rk.scope_sha256: lme_resolved.remote_harness.scope_sha256} }}

- name: "BINDING RECEIPT -- every declared output is published and the evidence IS this admission (declared keys; the admitted digests)"
  vars:
    _rh_rcpt_ba: "{{ rh.controller.bootstrap.binding_admission }}"
    _rh_rcpt_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
    _rh_rcpt_rk: "{{ rh.controller.bootstrap.binding_admission.result_keys }}"
  ansible.builtin.assert:
    that:
      # the set_fact names above ARE the declared outputs (a declared name this file does not publish refuses here)
      - rh.controller.bootstrap.binding_admission.outputs | reject('in', vars) | list | length == 0
      - rh_rcpt_admission is mapping
      - (rh_rcpt_admission | list | sort) == (_rh_rcpt_rk.values() | list | sort)
      - rh_rcpt_admission[_rh_rcpt_rk.operation] == rh_rcpt_operation
      - rh_rcpt_admission[_rh_rcpt_rk.receipt] == rh_rcpt_receipt_path
      - rh_rcpt_admission[_rh_rcpt_rk.receipt_sha256] == rh_rcpt_receipt_stat.checksum
      - rh_rcpt_admission[_rh_rcpt_rk.receipt_sha256] == _rh_rcpt_rcs.stat.checksum
      - rh_rcpt_admission[_rh_rcpt_rk.file_sha256] | dict2items | map(attribute='value') | list == _rh_rcpt_inv.results | map(attribute='stat.checksum') | list
      - rh_rcpt_admission[_rh_rcpt_rk.bindings] == rh.controller.bootstrap.run_binding.receipt_bindings
      - rh_rcpt_admission[_rh_rcpt_rk.scope_sha256] == lme_resolved.remote_harness.scope_sha256
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_rcpt_rf,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': rh_rcpt_refusal,
                               'rh_rf_detail': [_rh_rcpt_ba.diagnostics.result, _rh_rcpt_ba.outputs | to_json, _rh_rcpt_rk | to_json,
                                                _rh_rcpt_ba.diagnostics.stop]}) }}
    quiet: true
