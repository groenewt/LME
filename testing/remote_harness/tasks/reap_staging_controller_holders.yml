---
# testing/remote_harness/tasks/reap_staging_controller_holders.yml -- route op1q NEW FILE (codex 931
# ROUTE_DELEGATION_BEFORE_SKIP; records-route-op1q-01 delegation_before_skip). AUTHORED, NEVER RENDERED OR EXECUTED.
# The four DELEGATED controller observations of the recorded holders, moved here VERBATIM from the op1q reap_staging
# successor (op1p :520-536, :550-563, :575-591, :609-622 plus the op1q controller_env word; each `when` dropped).
# ansible-core 2.19.11 task_executor._execute_internal templates delegate_to (_calculate_delegate_to, :458) BEFORE it
# evaluates the task's `when` (:497), so reap_staging.yml includes THIS file only under its decided launch context
# (include_tasks under `when: _rh_reap_app.kind == 'delegated'`); nothing here is templated in the genesis context,
# which has no controller-target binding and gets none invented. Unknown-holder retention is unchanged: every read
# keeps failed_when false, and a missing or failed observation stays UNKNOWN in reap_staging.yml's decision.
# Reads (set by reap_staging.yml before the include): _rh_reap_probe; rh; rh_controller_target,
# rh_controller_connection. Writes: the registers _rh_reap_pid_d, _rh_reap_pstat_d, _rh_reap_cg_d, _rh_reap_cgev_d,
# merged by reap_staging.yml; route op2b addendum 2: + _rh_reap_fid_d, _rh_reap_lls_d (reserved by C1 SR922w, r51
# :7839, comment :7835-7838). route op2c: + the set_fact _rh_reap_ftok and the registers _rh_reap_pvs_d,
# _rh_reap_pmo_d, _rh_reap_aty_d, _rh_reap_asr_d (NEW names, not in r51 reserved_outputs: open item
# CPL-OP2C-NEW-NAMES-UNRESERVED); reads + _rh_reap_anc (reap_staging.yml, before the include). route op2d: + the
# registers _rh_reap_cgv_d (relock.namespace.cgroup_view) and _rh_reap_als_d (cgroup chain listings for
# cgroup_first_absent_segment) (NEW names, not reserved: open item CPL-OP2D-NEW-NAMES-UNRESERVED).
- name: Observe each recorded holder process on the controller (delegated; stat; exists=false is positive absence in this view)
  vars:
    # RH-CONTROLLER-DELEGATION: the declared controller binding, connection, interpreter and remote temp as TASK vars
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  # route op2a (C1 SR922t, s64 :431, :480; route op2c retarget): the record's lease pid must FULLY match
  # pid_placeholder.ere before it is put in a path; a mismatch skips the item (reaper_read_mismatch: unknown, retained
  # in reap_staging.yml's decision). route op2b (C1 SR922u reaper_reads.record_holder_presence, s64 :487): the presence
  # probe is built from its of_segments and follow words; stat.exists false (not found) is only the leaf_absent half,
  # any failure stays unknown; absence ALSO needs the leaf listing below (C1 SR922v absent_also_requires, s64 :487).
  ansible.builtin.stat:
    path: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_presence.of_segments | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.pid) | join(_lz.proc_paths.join)) }}"
    follow: "{{ _lz.proc_paths.reaper_reads.record_holder_presence.follow }}"
    get_checksum: false
  loop: "{{ _rh_reap_probe }}"
  loop_control:
    label: "{{ item.token }}"
  register: _rh_reap_pid_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false
  when: item.pid is string and item.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.pid

- name: Read each present holder's /proc stat on the controller (delegated; reaper_reads.record_holder_stat; a failed or unproven read is UNKNOWN, never dead)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
  ansible.builtin.slurp:
    src: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_stat.of_segments | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.pid) | join(_lz.proc_paths.join)) }}"
  loop: "{{ _rh_reap_probe }}"
  loop_control:
    label: "{{ item.token }}"
  register: _rh_reap_pstat_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false
  when: item.pid is string and item.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.pid

- name: Observe each recorded cgroup and its parent on the controller (delegated; every process of that run stays in it)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _cr: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}"
  ansible.builtin.stat:
    path: "{{ _cr ~ (item.0.cgroup_b64 | b64decode) if item.1 == 'self' else (_cr ~ (item.0.cgroup_b64 | b64decode)) | dirname }}"
    # route op2d (C1 SR922y leaf_absent.ansible_consumer, s67 :8812): follow read from the word
    follow: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_absent.ansible_consumer.follow }}"
    get_checksum: false
  loop: "{{ _rh_reap_probe | product(['self', 'parent']) | list }}"
  loop_control:
    label: "{{ item.0.token }} {{ item.1 }}"
  register: _rh_reap_cg_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

# r3f R3E-WRITER-CONTAINMENT (codex-014047): the subtree proof is cgroup.events `populated` (cgroup v2: covers the
# cgroup AND every descendant), never an empty direct cgroup.procs.
- name: Read each present recorded cgroup's populated state on the controller (delegated; subtree; a failed read is UNKNOWN)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.slurp:
    src: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root ~ (item.cgroup_b64 | b64decode) }}/{{ rh.controller.bootstrap.bundle.staging_retention.lease.events_file }}"
  loop: "{{ _rh_reap_probe }}"
  loop_control:
    label: "{{ item.token }}"
  register: _rh_reap_cgev_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

# route op2b addendum 2 (C1 SR922v relock.absence_proof.leaf_listing, s64 :8778-8789, comment :8744-8777; r51
# :7165-7172): the delegated twins of reap_staging.yml's genesis leaf-listing tasks (same words, same argv, same
# verdict rules there): the declared os_tools row the word names (find; required_by staging_reap, s64 :3453) is
# admitted by identity on the controller before use, then ONE complete listing of each leaf's proven parent per
# recorded holder in the order [pid, cgroup]. ansible.builtin.find is NOT admitted (it skips walk errors and failed
# lstats); the declared tool runs through ansible.builtin.command, env LC_ALL from leaf_listing.env_from, stdout kept
# whole (strip_empty_ends false), stderr never read. An unadmitted tool or unproven pid lists nothing (unknown).
# route op2c (NOTE-SEAT-OP2B-PRELOCK-VISIBILITY): the delegated twins of reap_staging.yml's genesis admission of the
# three holder-decision tools [leaf_listing.tool, proc_mount_unrestricted.tool, each_ancestor.type_probe.tool], its
# _rh_reap_ftok binding, the proc view status read, the proc mount OPTIONS row and the two ancestor observations
# (same words, same argv, same rules; reap_staging.yml states them).
- name: Admit the declared leaf-listing, visibility and ancestor-type tools by identity on the controller (delegated)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[item].path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  loop:
    - "{{ _dh.relock.absence_proof.leaf_listing.tool }}"
    - "{{ _dh.relock.process_visibility.proc_mount_unrestricted.tool }}"
    - "{{ _dh.relock.absence_proof.each_ancestor.type_probe.tool }}"
  register: _rh_reap_fid_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: Bind the controller tools admitted by identity for the holder observations (delegated variant; derived)
  ansible.builtin.set_fact:
    _rh_reap_ftok: >-
      {%- set ns = namespace(ok=[]) -%}
      {%- for r in _rh_reap_fid_d.results -%}
        {%- set row = rh.controller.bootstrap.os_tools[r.item] -%}
        {%- if 'stat' in r and not ('failed' in r and r.failed) and r.stat.exists and r.stat.isreg and not r.stat.islnk
               and 'checksum' in r.stat and row.identity is mapping and 'kind' in row.identity and 'sha256' in row.identity
               and row.identity.kind == 'file_sha256' and r.stat.checksum == row.identity.sha256 -%}
          {%- set ns.ok = ns.ok + [r.item] -%}
        {%- endif -%}
      {%- endfor -%}{{ ns.ok }}

- name: Read this observer's proc view status on the controller (delegated; relock.namespace.proc_view; read-only)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.slurp:
    src: "{{ _lz.proc_root ~ _lz.proc_paths.join ~ (_dh.relock.namespace.proc_view.of_segments | join(_lz.proc_paths.join)) }}"
  register: _rh_reap_pvs_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: Read the proc mount OPTIONS row on the controller (delegated; process_visibility.proc_mount_unrestricted; admitted findmnt)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.process_visibility.proc_mount_unrestricted.tool].path] + _dh.relock.process_visibility.proc_mount_unrestricted.args + [_lz.proc_root] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  register: _rh_reap_pmo_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: _dh.relock.process_visibility.proc_mount_unrestricted.tool in _rh_reap_ftok

# route op2d (NOTE-OP2C-PRELOCK-CGROUP-VIEW-BINDING): the delegated twin of reap_staging.yml's cgroup view read
# (relock.namespace.cgroup_view, s67 :9113; same argv, same rules; reap_staging.yml states them).
- name: Read the cgroup mount TARGET, FSTYPE and FSROOT row on the controller (delegated; relock.namespace.cgroup_view; admitted findmnt)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.program_tools[_dh.relock.namespace.cgroup_view.role]].path] + _dh.relock.namespace.cgroup_view.args + [_lz.cgroup_root] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  register: _rh_reap_cgv_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: rh.controller.entry_generation.render.n10.write_bound.obligations.transaction.program_tools[_dh.relock.namespace.cgroup_view.role] in _rh_reap_ftok

- name: Probe each ancestor's type on the controller (delegated; absence_proof.each_ancestor.type_probe; admitted stat)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.absence_proof.each_ancestor.type_probe.tool].path] + _dh.relock.absence_proof.each_ancestor.type_probe.args + [item.p] }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap.base_env.LC_ALL }}"
  loop: "{{ _rh_reap_anc.probes }}"
  loop_control:
    label: "{{ item.t }} {{ item.k }} {{ item.p }}"
  register: _rh_reap_aty_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: _dh.relock.absence_proof.each_ancestor.type_probe.tool in _rh_reap_ftok

- name: Observe each ancestor's searchability on the controller (delegated; absence_proof.each_ancestor.searchable; no link followed)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.stat:
    path: "{{ item.p }}"
    # route op2d (C1 SR922y each_ancestor.searchable.ansible_consumer, s67 :8806-8808): follow read through follow_from
    follow: "{{ _dh.relock.absence_proof.each_ancestor[_dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.follow_from[0]][_dh.relock.absence_proof.each_ancestor.searchable.ansible_consumer.follow_from[1]] }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ _rh_reap_anc.probes }}"
  loop_control:
    label: "{{ item.t }} {{ item.k }} {{ item.p }}"
  register: _rh_reap_asr_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: List each recorded holder leaf's proven parent on the controller (delegated; absence_proof.leaf_listing)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _lz: "{{ rh.controller.bootstrap.bundle.staging_retention.lease }}"
    _cr: "{{ rh.controller.bootstrap.bundle.staging_retention.lease.cgroup_root }}"
  ansible.builtin.command:
    argv: >-
      {{ [rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path,
          (_lz.proc_root ~ ((_lz.proc_paths.join ~ (_lz.proc_paths.reaper_reads.record_holder_presence.of_segments[:-1] | map('regex_replace', '^' ~ (_lz.proc_paths.pid_placeholder.segment | regex_escape) ~ '$', item.0.pid) | join(_lz.proc_paths.join)))
                               if _lz.proc_paths.reaper_reads.record_holder_presence.of_segments | length > 1 else ''))
          if item.1 == 'pid' else ((_cr ~ (item.0.cgroup_b64 | b64decode)) | dirname)]
         + rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.args }}
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[1]] }}"
  loop: "{{ _rh_reap_probe | product(['pid', 'cgroup']) | list }}"
  loop_control:
    label: "{{ item.0.token }} {{ item.1 }}"
  register: _rh_reap_lls_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  # route op2c: as the genesis twin (tool identity from _rh_reap_ftok; a leaf with no ancestor chain lists nothing)
  when:
    - rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool in _rh_reap_ftok
    - item.1 == 'cgroup' or (item.0.pid is string and item.0.pid is match(_lz.proc_paths.pid_placeholder.ere) and (item.0.pid | regex_search(_lz.proc_paths.pid_placeholder.ere)) == item.0.pid)
    - _rh_reap_anc.paths[item.0.token][item.1] | length > 0

# route op2d (CPL-OP2B-CGROUP-FIRST-ABSENT-SEGMENT): the delegated twin of reap_staging.yml's cgroup chain listings
# (absence_proof.leaf_listing for cgroup_first_absent_segment, s67 :8935-9035, consumer :8961-9031; same argv, same rules).
- name: List each recorded cgroup's ancestor chain entries on the controller (delegated; absence_proof.leaf_listing for cgroup_first_absent_segment)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _dh: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder }}"
  ansible.builtin.command:
    argv: "{{ [rh.controller.bootstrap.os_tools[_dh.relock.absence_proof.leaf_listing.tool].path, item.p] + _dh.relock.absence_proof.leaf_listing.args }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[0]][rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.env_from[1]] }}"
  loop: "{{ _rh_reap_anc.probes | selectattr('k', 'equalto', 'cgroup') | list }}"
  loop_control:
    label: "{{ item.t }} {{ item.p }}"
  register: _rh_reap_als_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when: _dh.relock.absence_proof.leaf_listing.tool in _rh_reap_ftok
