---
# testing/remote_harness/tasks/admit_record_free_entry.yml -- SHARED RECORD-FREE ENTRY ADMISSION (records-c1-framework-20
# FW20-COLD, d2eef9f6; codex-tick815 item 1 :25-39; J-FW20-COLD-ROUTE). NEW FILE (recorded path). AUTHORED, NEVER
# EXECUTED (UNRUN). Body: genesis_generate.successor-06 (a074a2ba) :265-357 and :390-414, de-indented four spaces
# (verbatim-move draft 8729f6b4), then the fw20 changes ONLY:
#   - first task: the SOLE resolve (tasks/resolve_policy.yml, record_free; G01 s06 :258-263 moved here) with the cold
#     carrier _rh_rf_in. Task parameters: NONE beyond the existing caller binder rh_rp_caller, which the includer sets on
#     the include of THIS file (its own rel) and which N2 admits against resolve_phases.callers;
#   - the protected caller presence row reads the declared names node (resolve_phases.names._rh_sa_caller.var), not a
#     presence test on a literal (s06 :290);
#   - the row is the reserved _rh_rf_row (was _rh_ggen_row); the envelope transport word is compared with the ROW's
#     transport (a source_admission.launch_transports word), not with the genesis key; the post-resolve envelope check
#     moves after the row bind;
#   - the "no anchor" row arrives here from admit_cold_launch, by the declared anchor var (genesis.source_record.anchor.var);
#   - purpose within genesis.builder.authoring[row.purpose_class] (replaces the G01-only authoring.stages /
#     authoring.operations rows; the operations row stays in G01 s07);
#   - stage inputs: no stage input is a cold name (row.inputs), and every stage input names a declared input
#     (launch.operator_inputs or launch.stage_results) whose class is its source (replaces the G01-only transition /
#     adoption pair row, which stays in G01 s07 with the transition admission s06 :359-388);
#   - the admission fact is set under the var row.admission (a record_free_admissions member; replaces the quoted
#     "_rh_ggen_adm" row and the fixed fact name); the view assert reads _rh_rf_row.purpose;
#   - last task: tasks/admit_builder.yml with rh_gen_stage = _rh_rf_row.purpose (G01 s06 :416-419 moved here).
# Locals renamed _rh_ggen_r / _rh_ggen_st / _rh_ggen_ent -> _rh_rf_r / _rh_rf_st / _rh_rf_ent.

# C1 IF-S14-PHASE-1: the binder is the includer's own rel (C1-REQ-W1-03R callers row, record_free), set on the include.
# OP-1 H-RF-01 (route records-route-op1-01; C1 sr323_g LC-SR323-OP1-ROUTE / G first-operation-03 J-RP-REQ; codex 907
# caller_classification; route census C26, Q-CENSUS-RF-BIND-SITE answered HERE, the ONE bind site of every record-free
# entry that includes this file): the include site's declared invocation requirement (source_admission.invocation
# requirement_var) is the declared word requirements.ordinary_permitted, by pointer into the admitted declaration node.
# The include var is templated at its first use, RP07-01b (resolve_policy :74-88), after the admission include there
# has bound _rh_sa_decl. A cold record-free entry is a directly admitted entry outside the managed seed, so it never
# passes the leased word; reached under the leased pin it must carry the present resolved-run lease or RP07-02a refuses.
- name: Resolve the harness policy through the SOLE loader (record_free; the admitted cold carrier forwarded)
  ansible.builtin.include_tasks: tasks/resolve_policy.yml
  vars:
    rh_rp_input: "{{ _rh_rf_in }}"
    rh_invocation_requirement: "{{ _rh_sa_decl.invocation.requirements.ordinary_permitted }}"

# codex-tick702 caller_absence: the protected caller fact is a REQUIRED input of everything below. Its absence or a
# non-string value refuses as an input error, one assertion each, before any lookup keyed by it. Its name is the
# declared post-view names node (records-c1-framework-17 / -20 J-FW20-SA-READERS: _rh_sa_caller keeps the profile node).
- name: Refuse a run without the protected caller fact (required input; before the entry lookup)
  ansible.builtin.assert:
    that:
      - _rh_sa_decl.resolve_phases.names._rh_sa_caller.var in vars
      - lookup('ansible.builtin.vars', _rh_sa_decl.resolve_phases.names._rh_sa_caller.var) is string
    fail_msg: >-
      REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.input }}: {{ _rh_sa_bs.genesis.initializer.texts.input }}
      {{ [_rh_sa_decl.resolve_phases.names._rh_sa_caller.var] | to_json }}
    quiet: true

# W1-B1 AUTHENTICATED PURPOSE (codex698 b): the record_free_launches entry AT the protected caller fact, by direct
# key lookup. An absent entry refuses here, before it is read.
- name: Refuse a caller with no declared record-free launch entry (mapping keyed by the admitted rel)
  ansible.builtin.assert:
    that:
      - _rh_sa_bs.genesis.initializer.custody.record_free_launches is mapping
      - _rh_sa_caller in _rh_sa_bs.genesis.initializer.custody.record_free_launches
    fail_msg: >-
      REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.entry }}: {{ _rh_sa_bs.genesis.initializer.texts.entry }}
      {{ [_rh_sa_caller | string, _rh_sa_bs.genesis.initializer.custody.record_free_launches.keys() | list] | to_json }}
    quiet: true

- name: Bind this entry's declared record-free launch entry (the one key; never scanned; reserved _rh_rf_row)
  ansible.builtin.set_fact:
    _rh_rf_row: "{{ _rh_sa_bs.genesis.initializer.custody.record_free_launches[_rh_sa_caller] }}"

# s06 (records-c1-framework-14 FW14-CE-01 / J-FW14-G01-S06; Codex 773 option A; seat G01 s06 pre/post-resolve split):
# the envelope's transport WORD (source_admission.launch_transports) and its context key set (early_view
# context_fields + launch_context_fields; document_parse is a launch_context_fields key) are profile values, readable
# only after the resolve above. admit_loader_source skips its context key-set row on the record_free path (rh_rp_input
# supplied), so this entry binds it here. The pre-resolve half is admitted in admit_cold_launch. fw20: the expected
# word is the admitted row's transport; no anchor is supplied (the declared anchor var is absent).
# op1c CPL-SR328-ROUTE-JOIN (records-route-op1c-01 OP1C-ARFE-01): this envelope row now runs for every record-free row
# EXCEPT the projector row, the row keyed by the playbook that external_invocation.envelope_projection.entry_from names
# (walked over the admitted node, never a quoted rel); that row is admitted by the X2 provenance block below instead.
# Every other row keeps exactly the base rows.
# op1d D916 carrier join (records-route-op1d-01 OP1D-ARFE-01; codex 916 Q-OP1C-PROJECTOR-ENVELOPE): every other row
# must have been admitted at the ingress under the ENVELOPE carrier (the carrier word the ingress macro returns under
# its declared output word, OWED-C1-OP1D-INGRESS-CARRIERS), and its envelope var must be supplied: an ordinary entry
# reached under the projector carrier (no envelope) refuses here with the base code, before any lookup of the envelope.
- name: Refuse a launch envelope whose transport word or context key set is not the row's declared launch, or an anchor (post-resolve)
  vars:
    _rh_x2_entry: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection.entry_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
  when: _rh_sa_caller != _rh_x2_entry
  ansible.builtin.assert:
    that:
      - _rh_sa_regadm.ingress.carriers is mapping
      - _rh_sa_regadm.ingress.output.carrier is string
      - _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] == _rh_sa_regadm.ingress.carriers.words.envelope
      - _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var in vars
      # op1e (codex 918; defense in depth): no external X2 admission reaches an ordinary row
      - _rh_sa_regadm.ingress.carriers.projector.admission.var not in vars
      - _rh_rf_row is mapping
      - _rh_rf_row.transport in (_rh_sa_bs.source_admission.launch_transports.values() | list)
      - lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var)[_rh_sa_regadm.ingress.transport_selector | last] == _rh_rf_row.transport
      - lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var).context is mapping
      - >-
        (lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var).context.keys() | list | sort)
        == ((_rh_sa_bs.source_admission.early_view.context_fields.keys() | list)
            + (_rh_sa_bs.source_admission.early_view.launch_context_fields.keys() | list)) | sort
      # NO ANCHOR (fw14 :44-45; option A admits the envelope only): the declared anchor var is not supplied
      - _rh_sa_bs.genesis.source_record.anchor.var not in vars
    fail_msg: >-
      REFUSED {{ _rh_sa_rref.input }}: the cold launch envelope must name the admitted row's launch transport
      (source_admission.launch_transports) and carry exactly the declared context fields (early_view context_fields and
      launch_context_fields, document_parse among them), and no anchor is admitted
      {{ [_rh_sa_regadm.transport, _rh_sa_bs.source_admission.launch_transports, _rh_sa_bs.genesis.source_record.anchor.var] | to_json }}
    quiet: true

# op1c CPL-SR328-ROUTE-JOIN / codex 915 SR915-X2-PROVENANCE-SHAPES (records-route-op1c-01 OP1C-ARFE-02): THE X2
# PROVENANCE ADMISSION, consumer envelope_projection.provenance.consumer (x2_provenance_admission), which replaces the
# launch envelope (provenance.replaces) for the projector row ONLY. Every value is a declared word walked over the
# admitted node: the record declaration (provenance.record_from), its location, its fields and shapes, the binds of
# each field, the refusal (provenance.refusal_from). Each record field must equal, type-exact (canonical JSON, sorted
# keys), the independently admitted value its binds name: node (this external_invocation node), input (an admitted
# cold input of THIS row), admission (the in-run rh_src_admission record, by record_fields), override (the
# override_state branch of the admitted carrier state), step (the X1 A receipt measured at the X1 root), recorded
# (written by the X2 step, presence only). A bind with `at` compares ONE declared shape key; a field with a declared
# shape is admitted only when every shape key is bound (or the whole value is), so no field is narrowed to one key; a
# bind with `each` compares the COMPLETE rel -> digest set of the record list with the admission mapping (an added,
# missing, duplicated or changed member refuses). Missing record, extra or missing field, changed value or another
# stage refuses with the declared refusal before any projector output (this block precedes the entry stat, the
# admission fact and admit_builder; the projector writes only after this include returns).
# TYPED HOLES (fail closed, refused here until C1 declares them; records-route-op1c-01 couplings): the binding-kind
# vocabulary external_invocation.bind_kinds (OWED-C1-OP1C-BIND-KINDS), the record location in key-path form
# source_admission.record.evidence_dir {sub, rel} (OWED-C1-OP1C-EVIDENCE-DIR), the source / closure projections of
# provenance.binds (`at` / `each`, OWED-C1-SR915-PROJECTIONS) and the admitted tree / status observations
# (record_fields.tree / .status in rh_src_admission, OWED-C1-SR915-TREE-STATUS).
# op1d (records-route-op1d-01; codex 916):
#   D916 carrier: this row is admitted only under the PROJECTOR carrier the ingress selected by the externally admitted
#     entry identity (OWED-C1-OP1D-INGRESS-CARRIERS); a supplied envelope var refuses (alone or mixed); the declared
#     projector entry rel equals entry_from; this entry's measured bytes equal the admitted entry identity.
#   D916-STRICT-RECORD-PARSE: the ONE slurp is bound to its stat checksum (lme_capture_text_bound, the declared
#     body_domain.encoding) and those SAME bytes are parsed by the existing strict parser lme_manifest_strict under the
#     resolved document_parse contract (document_channel.parse: duplicate key / duplicate merge / unparsable / extra
#     document / unconstructable refuse); a non-mapping document refuses as its own row.
#   D916-DECLARED-INTERFACES-AND-VALUES: bind field roles (provenance.bind_fields / each_fields), the a_receipt pairing
#     (the step bind's roles {path, digest}), accumulator / Boolean / count atoms, the full-match wrapper, the
#     canonical comparison options and the texts are declared words (OWED-C1-OP1D-*), gated below; diagnostics go
#     through the ONE refusal grammar macro (refusal_grammar.entry_rel).
#   D916-FAILURE-DIAGNOSTICS: a refusal prints the code, the admitted locator (the record rel) and declared field
#     names / value types only; never the document or a field value.
- name: Admit the projector's X2 provenance record in place of a launch envelope (projector row only; before any output)
  vars:
    _rh_x2_pj: "{{ _rh_sa_regadm.ingress.carriers.projector }}"
    _rh_x2_va: "{{ _rh_sa_reg.vocabulary }}"
    # op1f (C1 s13 decl :108-115, FINAL; codex 919 VOCABULARY_ENGINE_JOIN): atoms, fullmatch_wrap and canonical_json are
    # words of the ingress declaration, read from output.ingress; the registry vocabulary keeps tests / attributes / filters
    _rh_x2_iw: "{{ _rh_sa_regadm.ingress }}"
    # op1g CPL-SR919B-ARFE-EXECUTED-ARM (C1 s37 first_invocation :1233-1238, r24 :3839-3848; codex 920
    # SR920_EXECUTED_BIND_REACHABILITY): the declared first invocation and its executed_bind order
    _rh_x2_fi: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.source_admission.first_invocation }}"
    _rh_x2_tx: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection.provenance.texts }}"
    _rh_x2_rg: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel }}"
    # the resolved DK03 parse contract (loader-projected from the admitted registry document_channel.parse), by the
    # declared pointer early_view.launch_context_fields.document_parse over the resolved controller.bootstrap
    _rh_x2_dp: >-
      {%- set w = namespace(v=rh.controller.bootstrap) -%}
      {%- for k in _rh_sa_decl.early_view.launch_context_fields.document_parse -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_ei: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation }}"
    _rh_x2_ep: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection }}"
    _rh_x2_entry: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.entry_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_rd: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.provenance.record_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_rc: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.provenance.refusal_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_tr: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.transport_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_stg: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_rd.stage_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_act: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_rd.act_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    # op1d: the admitted LOCATOR (the record rel below the repository root; the only path a refusal prints and the rel
    # the strict parser names in its declared diagnostic), and the absolute path built from it
    _rh_x2_rl: >-
      {{ [_rh_sa_bs.work_roots.root_rel, _rh_sa_bs.work_roots.sub_roots[_rh_x2_rd.evidence_dir.sub],
          _rh_x2_rd.evidence_dir.rel, lookup('ansible.builtin.vars', _rh_x2_act.var), _rh_x2_rd.file]
         | join(_rh_sa_bs.path_admission.separator) }}
    _rh_x2_rp: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_x2_rl }}"
    _rh_x2_arp: "{{ lme_resolved[_lme_global_file.lme_config_registry.remote_harness_schema.policy_key][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.to][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.fields.receipt] }}"
  when: _rh_sa_caller == _rh_x2_entry
  block:
    - name: Refuse a projector row or X2 record declaration this consumer cannot bind (row, transport, stage, anchor, declared words)
      ansible.builtin.assert:
        that:
          - _rh_rf_row is mapping
          - _rh_rf_row.transport in (_rh_sa_bs.source_admission.launch_transports.values() | list)
          - _rh_rf_row.transport == _rh_x2_tr
          - _rh_rf_row.transport == _rh_x2_ep.transport
          - _rh_rf_row.purpose == _rh_x2_ep.stage
          - _rh_x2_stg == _rh_x2_ep.stage
          # NO ANCHOR (the base row, kept for this row too)
          - _rh_sa_bs.genesis.source_record.anchor.var not in vars
          # OWED-C1-OP1C-BIND-KINDS: the binding-kind words (absent in s33: refused here, never guessed)
          - _rh_x2_ei.bind_kinds is mapping
          - (_rh_x2_ei.bind_kinds.values() | list | unique | length) == (_rh_x2_ei.bind_kinds | length)
          # OWED-C1-OP1C-EVIDENCE-DIR: the record location in key-path form (s33 carries a prose string: refused here)
          - _rh_x2_rd.evidence_dir is mapping
          - _rh_x2_rd.evidence_dir.sub in _rh_sa_bs.work_roots.sub_roots
          - _rh_x2_rd.evidence_dir.rel is string
          - _rh_x2_rd.evidence_dir.rel
          - _rh_sa_bs.path_admission.separator not in _rh_x2_rd.evidence_dir.rel
          - _rh_x2_rd.file is string
          - _rh_x2_rd.file
          - _rh_sa_bs.path_admission.separator not in _rh_x2_rd.file
          # the act names this row's admitted cold input; its value is one path component
          - _rh_x2_act.var in _rh_rf_row.inputs
          - _rh_x2_act.var in vars
          - lookup('ansible.builtin.vars', _rh_x2_act.var) is string
          - _rh_sa_bs.path_admission.separator not in lookup('ansible.builtin.vars', _rh_x2_act.var)
          # op1d OWED-C1-OP1D-CONSUMER-WORDS: the registry vocabulary words this consumer reads (atoms, full-match
          # wrapper, canonical comparison options; tests / attributes exist) and the provenance role words and texts
          # op1f: atoms / fullmatch_wrap / canonical_json are the ingress declaration words (output.ingress, _rh_x2_iw)
          - _rh_x2_iw.atoms is mapping
          - _rh_x2_iw.fullmatch_wrap is mapping
          - _rh_x2_iw.canonical_json is mapping
          # op1g: the executed_bind admission arm is a declared bind kind (r24 within bind_kinds row, rechecked here)
          - _rh_x2_fi.executed_bind is mapping
          - _rh_x2_fi.executed_bind.admission.arm in (_rh_x2_ei.bind_kinds.values() | list)
          - _rh_x2_va.filters.type_debug is string
          - _rh_x2_ep.provenance.bind_fields is mapping
          - _rh_x2_ep.provenance.each_fields is mapping
          - _rh_x2_tx is mapping
          - _rh_x2_dp is mapping
          # every record field has binds and no bind names an undeclared field; every shape names a record field
          - (_rh_x2_rd.fields | sort) == (_rh_x2_ep.provenance.binds.keys() | list | sort)
          - not (_rh_x2_rd.field_shapes.keys() | reject(_rh_x2_va.tests.in, _rh_x2_rd.fields) | list)
          - _rh_x2_ep.identity.record_field in _rh_x2_rd.fields
          - _rh_x2_ep.identity.input in _rh_rf_row.inputs
          # The engine-derived receipt path uses the same admitted absolute-path grammar.
          - _rh_x2_arp is match(_rh_sa_bs.path_admission.regex)
          - _rh_x2_arp is not search(_rh_sa_bs.path_admission.forbidden_segment_regex)
          # op1d D916 carrier join (OWED-C1-OP1D-INGRESS-CARRIERS): the ingress selected the PROJECTOR carrier, no
          # envelope var is supplied (alone or mixed), the declared projector entry is this row's entry_from playbook, the
          # ingress transport is the projector transport, the entry identity var is supplied and (like the envelope var)
          # is NOT a cold input (the row's inputs stay exactly the cold inputs, the row-inputs equality below) and the ingress digest
          # algorithm is the admitted one (the entry bytes are measured with it below)
          # op1e (records-route-op1e-01 OP1E-ARFE-01; codex 918): DEFENSE IN DEPTH only -- the ingress already selected the
          # carrier by the actual executing entry and bound the external X2 admission before any registry read. The op1d
          # identity var is replaced by that admission (carriers.projector.admission {var, fields}).
          - _rh_sa_regadm.ingress.carriers is mapping
          - _rh_sa_regadm.ingress.output.carrier is string
          - _rh_sa_regadm[_rh_sa_regadm.ingress.output.carrier] == _rh_sa_regadm.ingress.carriers.words.projector
          - _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var not in vars
          - _rh_x2_pj.entry_rel == _rh_x2_entry
          - _rh_x2_pj.transport == _rh_sa_regadm[_rh_sa_regadm.ingress.output.transport]
          - _rh_x2_pj.transport == _rh_x2_ep.transport
          - _rh_x2_pj.admission.var not in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither))
          - _rh_x2_pj.admission.var in vars
          - lookup('ansible.builtin.vars', _rh_x2_pj.admission.var) is mapping
          - lookup('ansible.builtin.vars', _rh_x2_pj.admission.var)[_rh_x2_pj.admission.fields.entry_rel] == _rh_sa_caller
          - lookup('ansible.builtin.vars', _rh_x2_pj.admission.var)[_rh_x2_pj.admission.fields.registry_sha256] == lookup('ansible.builtin.vars', _rh_x2_ep.identity.input)
          # op1f (C1 FINAL shape, five admission fields; defense in depth after the ingress): exactly the declared fields;
          # document_parse is the resolved document_channel.parse node; companions equal the supplied companion vars
          - (lookup('ansible.builtin.vars', _rh_x2_pj.admission.var).keys() | list | sort) == (_rh_x2_pj.admission.fields.values() | list | sort)
          - >-
            (lookup('ansible.builtin.vars', _rh_x2_pj.admission.var)[_rh_x2_pj.admission.fields.document_parse] | to_json(**_rh_x2_iw.canonical_json))
            == (_rh_x2_dp | to_json(**_rh_x2_iw.canonical_json))
          - >-
            (lookup('ansible.builtin.vars', _rh_x2_pj.admission.var)[_rh_x2_pj.admission.fields.companions] | to_json(**_rh_x2_iw.canonical_json))
            == (dict(_rh_x2_iw.companions | dict2items | map(attribute='value') | map(attribute='var')
                     | zip(_rh_x2_iw.companions | dict2items | map(attribute='value') | map(attribute='var') | map('extract', vars)))
                | to_json(**_rh_x2_iw.canonical_json))
          - _rh_sa_regadm.ingress.digest.algorithm == _rh_sa_decl.digest_algorithm
        # D916-FAILURE-DIAGNOSTICS: the code, the caller rel (an admitted locator) and the TYPES of the gated words only
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.row, _rh_sa_caller | to_json,
                                                    [_rh_x2_ei.bind_kinds, _rh_x2_rd.evidence_dir, _rh_x2_iw.atoms,
                                                     _rh_x2_iw.fullmatch_wrap, _rh_x2_iw.canonical_json,
                                                     _rh_x2_ep.provenance.bind_fields, _rh_x2_ep.provenance.each_fields,
                                                     _rh_x2_dp, _rh_sa_regadm.ingress.carriers]
                                                    | map(_rh_x2_va.filters.type_debug) | list | to_json]}) }}
        quiet: true

    - name: Stat this projector entry at its declared path (no link followed; measured bytes, the admitted digest algorithm)
      ansible.builtin.stat:
        path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_caller }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_x2_est

    # op1d D916 carrier: SELECTION BY THE EXTERNALLY ADMITTED ENTRY IDENTITY. The ingress measured the declared projector
    # entry rel against the admitted entry identity before the registry parse; here the RUNNING entry (the caller rel,
    # admitted against resolve_phases.callers) must be that file: its measured bytes equal the same admitted identity
    # the ingress returned. Never envelope absence, a flag, the record stage or a quoted rel.
    - name: Refuse a projector entry whose measured bytes are not the externally admitted entry identity (carrier join)
      ansible.builtin.assert:
        that:
          - _rh_x2_est.stat.exists
          - _rh_x2_est.stat.isreg
          - not _rh_x2_est.stat.islnk
          - _rh_x2_est.stat.checksum == lookup('ansible.builtin.vars', _rh_x2_pj.admission.var)[_rh_x2_pj.admission.fields.entry_sha256]
          - _rh_x2_est.stat.checksum == _rh_sa_regadm[_rh_sa_regadm.ingress.output.entry_identity]
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.carrier, _rh_sa_caller | to_json, _rh_x2_pj.admission.var | to_json]}) }}
        quiet: true

    - name: Stat the X2 provenance record at its declared location (no link followed; measured bytes)
      ansible.builtin.stat:
        path: "{{ _rh_x2_rp }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_x2_rst

    - name: Refuse a missing, linked, irregular or wrong-mode X2 provenance record (before it is read)
      ansible.builtin.assert:
        that:
          - _rh_x2_rst.stat.exists
          - _rh_x2_rst.stat.isreg
          - not _rh_x2_rst.stat.islnk
          - _rh_x2_rst.stat.mode == _rh_x2_rd.mode
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.record, _rh_x2_rl | to_json]}) }}
        quiet: true

    - name: Read the X2 provenance record bytes ONCE (these bytes are digested and parsed)
      ansible.builtin.slurp:
        src: "{{ _rh_x2_rp }}"
      register: _rh_x2_rb

    # D916-STRICT-RECORD-PARSE: the ONE capture (the slurp above) is bound to the record stat checksum by the existing
    # capture binding filter lme_capture_text_bound (digest of the text under the declared body_domain.encoding, the
    # admitted digest algorithm, the declared refusal), and the SAME text object is parsed by the existing strict parser
    # lme_manifest_strict(text, rel, parse) (filter_plugins/lme_manifests.py: "the ONE strict construction of a manifest
    # or record text read outside the document channel": _rh_doc_parse_decl, then _rh_yaml_load_unique -- get_single_data,
    # so a second document refuses as unparsable; duplicate key / duplicate merge refuse -- and the declared
    # document_channel.parse diagnostic, metadata only) under the resolved document_parse contract _rh_x2_dp.
    - name: Strictly parse the X2 provenance record bytes as one YAML document (declared refusal on any failure)
      block:
        - name: Bind the strictly parsed X2 provenance record (capture-bound text; evaluated here, before any read of it)
          ansible.builtin.set_fact:
            _rh_x2_doc: >-
              {{ _rh_x2_rb.content | b64decode
                 | lme_capture_text_bound(_rh_x2_rst.stat.checksum, _rh_sa_decl.digest_algorithm, _rh_sa_bs.body_domain.encoding, _rh_x2_rc)
                 | lme_manifest_strict(_rh_x2_rl, _rh_x2_dp) }}
      rescue:
        - name: Refuse an X2 provenance record text that does not parse (declared refusal, not a templating error)
          ansible.builtin.fail:
            # D916-FAILURE-DIAGNOSTICS: the code, the declared text and the locator only (the failed result is not
            # echoed: neither the text nor a parser or capture message reaches the refusal)
            msg: >-
              {{ lookup('ansible.builtin.template', _rh_x2_rg,
                        template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                       'rh_rf_detail': [_rh_x2_tx.parse, _rh_x2_rl | to_json]}) }}

    # D916-STRICT-RECORD-PARSE wrong type: one admitted document that is not a mapping refuses as its own row, before
    # any field is read; the refusal names the document TYPE only.
    - name: Refuse an X2 provenance record document that is not a mapping (wrong type; before any field read)
      ansible.builtin.assert:
        that:
          - _rh_x2_doc is mapping
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.shape, _rh_x2_rl | to_json, _rh_x2_doc | type_debug]}) }}
        quiet: true

    - name: Stat the X1 A receipt at the X1 root (the step value bound by the record a_receipt; read-only)
      ansible.builtin.stat:
        path: "{{ _rh_x2_arp }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_x2_ar

    # op1d SR917-OVERRIDE-CARRIAGE (codex 917; records-route-op1d-01 OP1D-ARFE-04): when the carrier's ONE selected
    # override state is the PRESENT word (_rh_rf_ovs, admit_cold_launch; the pair was admitted both-or-neither there),
    # the override file named by the pair's declared path role is measured here (no link followed, the admitted digest
    # algorithm) and its bytes must have the digest the pair's declared sha256 role carries; the record override_sha256
    # is then compared (override bind) with that same admitted digest. A half pair refuses at admit_cold_launch
    # (both_or_neither) and in the override bind (the supplied pair names must be the whole declared pair); a malformed
    # digest refuses in the override bind (full match of the declared grammar_from); a mismatched digest or a changed
    # file refuses here. This is a read of the file AFTER the resolve; binding it to the very capture the resolution's
    # override layer consumed is the C1 / loader coupling CPL-OP1D-OVERRIDE-CAPTURE (owed, named in the record).
    - name: Stat the bound override file at its admitted path (present override state only; measured bytes)
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', _rh_sa_bs.genesis.initializer.custody.override_input_roles.path) }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_x2_ovf
      when: _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present

    - name: Refuse a bound override file that is absent, linked, irregular or not the admitted override digest (present state only)
      ansible.builtin.assert:
        that:
          - _rh_x2_ovf.stat.exists
          - _rh_x2_ovf.stat.isreg
          - not _rh_x2_ovf.stat.islnk
          - _rh_x2_ovf.stat.checksum == lookup('ansible.builtin.vars', _rh_sa_bs.genesis.initializer.custody.override_input_roles.sha256)
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.override, _rh_sa_bs.genesis.initializer.custody.override_input_roles | to_json]}) }}
        quiet: true
      when: _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present

    - name: Refuse an X2 provenance record whose field set or any field differs from its declared binding (type-exact; before any output)
      vars:
        # [field, label] for every bind not met: label = the bind's declared kind word, the record value TYPE (shape) or
        # the unbound declared shape keys (coverage) -- never a record value. Values are canonical JSON (the declared
        # canonical_json options) on both sides; nothing is compared with the record itself: every expected value is a
        # declared word, an admitted cold input of this row, the in-run source admission or a measured stat.
        # op1d D916-DECLARED-INTERFACES-AND-VALUES: every bind field is read through its declared role word (bf / ef),
        # every accumulator start, Boolean and count through the declared atoms (va.atoms), the full-match wrapper through
        # va.fullmatch_wrap, the comparison options through va.canonical_json, test / attribute / filter selectors through
        # va.tests / va.attributes / va.filters; the a_receipt value pairs its path and digest by the step bind's declared
        # roles {path, digest} (never field_shapes order). Emptiness is a truth test of the accumulated list (no count).
        _rh_x2_bad: >-
          {%- set kd = _rh_x2_ei.bind_kinds -%}
          {%- set bf = _rh_x2_ep.provenance.bind_fields -%}
          {%- set ef = _rh_x2_ep.provenance.each_fields -%}
          {%- set va = _rh_x2_va -%}
          {%- set iw = _rh_x2_iw -%}
          {%- set cj = _rh_x2_iw.canonical_json -%}
          {%- set fw = _rh_x2_iw.fullmatch_wrap -%}
          {%- set rd = _rh_x2_rd -%}
          {%- set rec = _rh_x2_doc -%}
          {%- set ns = namespace(bad=iw.atoms.empty_list) -%}
          {%- for f in rd.fields -%}
          {%- set cov = namespace(at=iw.atoms.empty_list, whole=iw.atoms.false_value) -%}
          {%- for b in _rh_x2_ep.provenance.binds[f] -%}
          {%- set v = namespace(has=iw.atoms.false_value, val=iw.atoms.null_value, rec=iw.atoms.false_value, pend=iw.atoms.false_value) -%}
          {%- if b[bf.kind] == kd.node -%}
          {%- set w = namespace(v=_rh_x2_ei, ok=iw.atoms.true_value) -%}
          {%- for k in b[bf.ref] -%}{%- if w.ok and w.v is mapping and k in w.v -%}{%- set w.v = w.v[k] -%}{%- else -%}{%- set w.ok = iw.atoms.false_value -%}{%- endif -%}{%- endfor -%}
          {%- set v.has = w.ok -%}{%- set v.val = w.v -%}
          {%- elif b[bf.kind] == kd.input -%}
          {%- if b[bf.ref] in _rh_rf_row.inputs and b[bf.ref] in vars -%}{%- set v.has = iw.atoms.true_value -%}{%- set v.val = lookup('ansible.builtin.vars', b[bf.ref]) -%}{%- endif -%}
          {%- elif b[bf.kind] == kd.admission -%}
          {%- if b[bf.ref] in _rh_sa_decl.record_fields and _rh_sa_decl.record_fields[b[bf.ref]] in rh_src_admission -%}{%- set v.has = iw.atoms.true_value -%}{%- set v.val = rh_src_admission[_rh_sa_decl.record_fields[b[bf.ref]]] -%}{%- endif -%}
          {%- elif b[bf.kind] == kd.override -%}
          {%- if b[bf.ref] in _rh_x2_ei and _rh_x2_ei[b[bf.ref]] is mapping -%}
          {%- set o = _rh_x2_ei[b[bf.ref]] -%}
          {%- set ws = namespace(v=_rh_sa_bs) -%}{%- for k in o.state_from -%}{%- set ws.v = ws.v[k] -%}{%- endfor -%}
          {%- set wp = namespace(v=_rh_sa_bs) -%}{%- for k in o.pair_from -%}{%- set wp.v = wp.v[k] -%}{%- endfor -%}
          {%- set wg = namespace(v=_rh_sa_bs) -%}{%- for k in o.grammar_from -%}{%- set wg.v = wg.v[k] -%}{%- endfor -%}
          {%- set np = namespace(n=iw.atoms.empty_list, k=iw.atoms.empty_list) -%}
          {%- for p in wp.v -%}{%- if p in vars -%}{%- set np.n = np.n + [p] -%}{%- endif -%}{%- endfor -%}
          {%- if ws.v.key in _rh_rf_in -%}{%- for wk, wv in ws.v.words.items() -%}{%- if wv == _rh_rf_in[ws.v.key] -%}{%- set np.k = np.k + [wk] -%}{%- endif -%}{%- endfor -%}{%- endif -%}
          {%- if (np.k | length) == iw.atoms.one and (np.k | first) in o['values'] -%}
          {%- set sp = o['values'][np.k | first] -%}
          {%- if sp[bf.kind] == kd.input and (np.n | sort) == (wp.v | sort) and sp[bf.ref] in wp.v and sp[bf.ref] in _rh_rf_row.inputs
                and lookup('ansible.builtin.vars', sp[bf.ref]) is string
                and lookup('ansible.builtin.vars', sp[bf.ref]) is match(fw.open ~ wg.v ~ fw.close) -%}
          {%- set v.has = iw.atoms.true_value -%}{%- set v.val = lookup('ansible.builtin.vars', sp[bf.ref]) -%}
          {%- elif sp[bf.kind] == kd.word and not np.n -%}
          {%- set ww = namespace(v=_rh_sa_bs, ok=iw.atoms.true_value) -%}
          {%- for k in sp[bf.ref] -%}{%- if ww.ok and ww.v is mapping and k in ww.v -%}{%- set ww.v = ww.v[k] -%}{%- else -%}{%- set ww.ok = iw.atoms.false_value -%}{%- endif -%}{%- endfor -%}
          {%- set v.has = ww.ok -%}{%- set v.val = ww.v -%}
          {%- endif -%}
          {%- endif -%}
          {%- endif -%}
          {%- elif b[bf.kind] == kd.step -%}
          {%- set sr = b[bf.roles] -%}
          {%- if b[bf.ref] == _rh_x2_ep.tool_from and f in rd.field_shapes and sr is mapping
                and sr.path in rd.field_shapes[f] and sr.digest in rd.field_shapes[f] and sr.path != sr.digest
                and _rh_x2_ar.stat.exists and _rh_x2_ar.stat.isreg and not _rh_x2_ar.stat.islnk -%}
          {%- set v.has = iw.atoms.true_value -%}{%- set v.val = dict([[sr.path, _rh_x2_arp], [sr.digest, _rh_x2_ar.stat.checksum]]) -%}
          {%- endif -%}
          {%- elif b[bf.kind] == kd.recorded -%}
          {%- set v.rec = b[bf.ref] == _rh_x2_ep.admitted_by -%}{%- set cov.whole = v.rec -%}
          {%- elif b[bf.kind] == _rh_x2_fi.executed_bind.admission.arm -%}
          {#- op1g EXECUTED ARM (executed_bind.admission: arm executed, holds pending): the bind names the declared first
              invocation, and the field is present and of the record shape (a non-empty list of strings); it is then
              PENDING -- not accepted, not relabelled recorded, never compared with the record itself, not counted as
              bound. A malformed or absent field stays bad. The pending set is fixed below; the verifier consumes it. -#}
          {%- if b[bf.ref] in _rh_x2_ei.source_admission and _rh_x2_ei.source_admission[b[bf.ref]] == _rh_x2_fi
                and rec is mapping and f in rec -%}
          {%- if f == rd.captured_field -%}
          {%- set v.pend = rd.captured_shape.type == va.tests.mapping and rd.captured_shape.nonempty is sameas iw.atoms.true_value
                and rec[f] is mapping and (rec[f] | length) > iw.atoms.zero
                and (rec[f].keys() | reject(va.tests.string) | list | length) == iw.atoms.zero
                and (rec[f].values() | reject(va.tests.string) | list | length) == iw.atoms.zero
                and (rec[f].keys() | reject(va.tests.fullmatch, fw.open ~ rd.captured_shape.key_pattern ~ fw.close) | list | length) == iw.atoms.zero
                and (rec[f].values() | reject(va.tests.fullmatch, fw.open ~ rd.captured_shape.value_pattern ~ fw.close) | list | length) == iw.atoms.zero -%}
          {%- else -%}
          {%- set v.pend = rec[f] is sequence and rec[f] is not string and rec[f] is not mapping
                and (rec[f] | length) > iw.atoms.zero and (rec[f] | reject(va.tests.string) | list | length) == iw.atoms.zero -%}
          {%- endif -%}
          {%- endif -%}
          {%- set cov.whole = v.pend -%}
          {%- endif -%}
          {%- if v.rec or v.pend -%}
          {%- elif not v.has or rec is not mapping or f not in rec -%}{%- set ns.bad = ns.bad + [[f, b[bf.kind]]] -%}
          {%- elif bf.each in b -%}
          {%- set cov.whole = iw.atoms.true_value -%}
          {%- set eb = b[bf.each] -%}
          {%- set g = namespace(m=iw.atoms.empty_map, ok=(rec[f] is sequence and rec[f] is not string and rec[f] is not mapping
                                         and f in rd.field_shapes and v.val is mapping and eb is mapping
                                         and eb[ef.key] in rd.field_shapes[f] and eb[ef.value] in rd.field_shapes[f]
                                         and eb[ef.key] != eb[ef.value]
                                         and eb[ef.member_field] in _rh_sa_decl.member_fields)) -%}
          {%- if g.ok -%}{%- for it in rec[f] -%}
          {%- if it is mapping and (it.keys() | list | sort) == (rd.field_shapes[f] | sort) and it[eb[ef.key]] is string and it[eb[ef.key]] not in g.m -%}
          {%- set g.m = g.m | combine(dict([[it[eb[ef.key]], it[eb[ef.value]]]])) -%}
          {%- else -%}{%- set g.ok = iw.atoms.false_value -%}{%- endif -%}
          {%- endfor -%}{%- endif -%}
          {%- set e = namespace(m=iw.atoms.empty_map) -%}
          {%- if g.ok -%}{%- for r, m in v.val.items() -%}{%- set e.m = e.m | combine(dict([[r, m[_rh_sa_decl.member_fields[eb[ef.member_field]]]]])) -%}{%- endfor -%}{%- endif -%}
          {%- if not g.ok or (g.m | to_json(**cj)) != (e.m | to_json(**cj)) -%}{%- set ns.bad = ns.bad + [[f, b[bf.kind]]] -%}{%- endif -%}
          {%- elif bf.at in b -%}
          {%- set cov.at = cov.at + [b[bf.at]] -%}
          {%- if rec[f] is not mapping or b[bf.at] not in rec[f] or (rec[f][b[bf.at]] | to_json(**cj)) != (v.val | to_json(**cj)) -%}{%- set ns.bad = ns.bad + [[f, b[bf.kind]]] -%}{%- endif -%}
          {%- else -%}
          {%- set cov.whole = iw.atoms.true_value -%}
          {%- if (rec[f] | to_json(**cj)) != (v.val | to_json(**cj)) -%}{%- set ns.bad = ns.bad + [[f, b[bf.kind]]] -%}{%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if rec is mapping and f in rec and f in rd.field_shapes -%}
          {%- if rec[f] is mapping and (rec[f].keys() | list | sort) != (rd.field_shapes[f] | sort) -%}{%- set ns.bad = ns.bad + [[f, rec[f] | type_debug]] -%}{%- endif -%}
          {%- if not cov.whole and (rd.field_shapes[f] | reject(va.tests.in, cov.at) | list) -%}{%- set ns.bad = ns.bad + [[f, rd.field_shapes[f] | reject(va.tests.in, cov.at) | list]] -%}{%- endif -%}
          {%- endif -%}
          {%- endfor -%}{{ ns.bad }}
      ansible.builtin.assert:
        that:
          - _rh_x2_doc is mapping
          - (_rh_x2_doc.keys() | list | sort) == (_rh_x2_rd.fields | sort)
          - (_rh_x2_doc[_rh_x2_ep.identity.record_field] | to_json(**_rh_x2_iw.canonical_json)) == (lookup('ansible.builtin.vars', _rh_x2_ep.identity.input) | to_json(**_rh_x2_iw.canonical_json))
          - not _rh_x2_bad
        # D916-FAILURE-DIAGNOSTICS: the code, the declared text, the locator, the DECLARED fields the record lacks, the
        # NUMBER of undeclared keys (never their names) and the [field, label] list above -- no document, no value
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.binding, _rh_x2_rl | to_json,
                                                    _rh_x2_rd.fields | reject(_rh_x2_va.tests.in, _rh_x2_doc) | list | to_json,
                                                    _rh_x2_doc.keys() | reject(_rh_x2_va.tests.in, _rh_x2_rd.fields) | list | length,
                                                    _rh_x2_bad | to_json]}) }}
        quiet: true

    # op1g executed_bind admission (holds pending; pending_set executed_fields): exactly the record fields whose binds
    # carry the executed arm. Nothing here accepts them; the consumer step at the end of this file includes the verifier
    # and refuses any field still pending.
    - name: Hold the executed-kind record fields PENDING (exactly the fields whose binds carry the executed arm)
      ansible.builtin.set_fact:
        _rh_x2_pending: >-
          {%- set ns = namespace(p=_rh_x2_iw.atoms.empty_list) -%}
          {%- for f in _rh_x2_rd.fields -%}
          {%- set fp = namespace(x=_rh_x2_iw.atoms.false_value) -%}
          {%- for b in _rh_x2_ep.provenance.binds[f] -%}{%- if b[_rh_x2_ep.provenance.bind_fields.kind] == _rh_x2_fi.executed_bind.admission.arm -%}{%- set fp.x = _rh_x2_iw.atoms.true_value -%}{%- endif -%}{%- endfor -%}
          {%- if fp.x -%}{%- set ns.p = ns.p + [f] -%}{%- endif -%}
          {%- endfor -%}{{ ns.p }}

- name: Stat this entry at its declared path (no link followed; measured bytes)
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_caller }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
  register: _rh_rf_ent

- name: Refuse this entry outside its declared row, stage, caller phase, purpose class, bytes, path, builder and inputs
  vars:
    _rh_rf_r: "{{ _rh_rf_row }}"
    _rh_rf_st: "{{ _rh_sa_bs.genesis.launch.stages }}"
    # stage inputs that are a cold name, or name no declared input whose class is their source (templated only when
    # the row below is reached, after the purpose / stage rows passed)
    _rh_rf_sibad: >-
      {%- set ns = namespace(bad=[]) -%}
      {%- set decl = _rh_sa_bs.genesis.launch.operator_inputs | combine(_rh_sa_bs.genesis.launch.stage_results) -%}
      {%- for r in _rh_rf_st[_rh_rf_r.purpose].stage_inputs -%}
      {%- if r.name in _rh_rf_r.inputs or r.name not in decl
            or decl[r.name].class not in _rh_sa_bs.genesis.launch.input_sources
            or _rh_sa_bs.genesis.launch.input_sources[decl[r.name].class] != r.source -%}{%- set ns.bad = ns.bad + [r.name] -%}{%- endif -%}
      {%- endfor -%}{{ ns.bad }}
  ansible.builtin.assert:
    that:
      # the entry's exact field set {purpose, purpose_class, producer, builder, inputs, transport, admission} is the
      # resolve-time registry row (FW20-COLD registry_rows; no literal here); a non-mapping entry refuses here
      - _rh_rf_row is mapping
      - _rh_sa_decl.resolve_phases.callers[_rh_sa_caller] == _rh_sa_decl.resolve_phases.words.record_free
      - _rh_sa_phase == _rh_sa_decl.resolve_phases.callers[_rh_sa_caller]
      - _rh_rf_r.purpose in _rh_rf_st
      - _rh_rf_st[_rh_rf_r.purpose].playbook_rel == _rh_sa_caller
      - _rh_rf_r.purpose_class in _rh_sa_bs.genesis.builder.authoring
      - _rh_rf_r.purpose in _rh_sa_bs.genesis.builder.authoring[_rh_rf_r.purpose_class]
      - _rh_rf_r.producer in _rh_sa_bs.genesis.initializer.custody.producers
      - _rh_rf_r.builder in _rh_sa_bs.genesis.initializer.custody.builders
      - (_rh_rf_r.inputs | sort) == ((_rh_sa_reg.cold_inputs.required.keys() | list) + (_rh_sa_reg.cold_inputs.both_or_neither.keys() | list)) | sort
      - >-
        (_rh_rf_st[_rh_rf_r.purpose].extra_vars | sort)
        == (_rh_sa_reg.cold_inputs.required.keys() | reject('equalto', _rh_sa_bs.genesis.launch.stage_root.act.var) | sort)
      # the operator / stage-result stage inputs are declared, typed by their source, and never a cold name (FW20-COLD);
      # the two declaring nodes are present mappings first (an absent node refuses here, never a template error)
      - _rh_sa_bs.genesis.launch.operator_inputs is mapping
      - _rh_sa_bs.genesis.launch.stage_results is mapping
      - (_rh_rf_sibad | length) == _rh_sa_regadm.ingress.atoms.zero
      - (rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ (_rh_sa_caller | dirname)) == playbook_dir
      - _rh_rf_ent.stat.exists and _rh_rf_ent.stat.isreg and not _rh_rf_ent.stat.islnk
      - >-
        _rh_rf_ent.stat.checksum
        == rh_src_admission[_rh_sa_decl.record_fields.members][_rh_sa_caller][_rh_sa_decl.member_fields.observed]
      - _rh_rf_in.declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
      - rh_src_admission[_rh_sa_decl.record_fields.edition] == _rh_rf_in.edition
      - _rh_rf_r.admission in _rh_sa_decl.resolve_phases.record_free_admissions
    fail_msg: >-
      REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.entry }}: {{ _rh_sa_bs.genesis.initializer.texts.entry }}
      {{ [_rh_sa_caller, _rh_rf_row] | to_json }}
    quiet: true

# op1i CPL-SR922-ACL-PATTERN (C1 sr922_c1 item_3; r25 cold_inputs :2227-2248, engine r17 :4208): every SUPPLIED cold
# input is checked against the leaf its declared spec names, after the resolve, before the admission marker. The spec
# key decides the check: grammar_at names a grammar leaf the value must fully match (wrapped by the ingress
# fullmatch_wrap); equals_at names a leaf the value must equal. A string leaf is compared as it is; a list leaf (the
# declaration node path) is compared with the value split by path_law.separator, the same conversion admit_cold_launch
# uses to build _rh_rf_in.declaration_path. The dotted policy path is walked from the resolved policy root, segment by
# segment, on the declared POLICY-NODE separator source_admission.early_view.override.audit_join (r25
# policy_segment_separator). The key names grammar_at / equals_at are the declared spec keys (r25 :2236-2248); no
# other key name is read. A spec with neither key, a missing segment, or a non-string grammar leaf refuses.
- name: Refuse a supplied cold input that does not fully match its declared grammar_at leaf or equal its declared equals_at leaf (post-resolve)
  vars:
    _rh_rf_cigr: >-
      {%- set iw = _rh_sa_regadm.ingress -%}
      {%- set sep = _rh_sa_bs.source_admission.early_view.override.audit_join -%}
      {%- set ns = namespace(bad=iw.atoms.empty_list) -%}
      {%- for v, s in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither)).items() if v in vars -%}
      {%- set x = lookup('ansible.builtin.vars', v) -%}
      {%- set sp = namespace(p=iw.atoms.null_value, g=iw.atoms.false_value) -%}
      {%- if 'grammar_at' in s -%}{%- set sp.p = s.grammar_at -%}{%- set sp.g = iw.atoms.true_value -%}
      {%- elif 'equals_at' in s -%}{%- set sp.p = s.equals_at -%}
      {%- endif -%}
      {%- set w = namespace(v=rh, ok=(sp.p is string)) -%}
      {%- if w.ok -%}{%- for k in sp.p.split(sep) -%}{%- if w.ok and w.v is mapping and k in w.v -%}{%- set w.v = w.v[k] -%}{%- else -%}{%- set w.ok = iw.atoms.false_value -%}{%- endif -%}{%- endfor -%}{%- endif -%}
      {%- if not w.ok or x is not string -%}{%- set ns.bad = ns.bad + [v] -%}
      {%- elif sp.g -%}
      {%- if w.v is not string or x is not match(iw.fullmatch_wrap.open ~ w.v ~ iw.fullmatch_wrap.close) -%}{%- set ns.bad = ns.bad + [v] -%}{%- endif -%}
      {%- elif w.v is string -%}
      {%- if x != w.v -%}{%- set ns.bad = ns.bad + [v] -%}{%- endif -%}
      {%- elif w.v is sequence and w.v is not mapping -%}
      {%- if (x.split(_rh_sa_reg.path_law.separator) | to_json(**iw.canonical_json)) != (w.v | to_json(**iw.canonical_json)) -%}{%- set ns.bad = ns.bad + [v] -%}{%- endif -%}
      {%- else -%}{%- set ns.bad = ns.bad + [v] -%}
      {%- endif -%}
      {%- endfor -%}{{ ns.bad }}
  ansible.builtin.assert:
    that:
      - _rh_sa_bs.source_admission.early_view.override.audit_join is string
      - (_rh_rf_cigr | length) == _rh_sa_regadm.ingress.atoms.zero
    fail_msg: >-
      REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.input }}: {{ _rh_sa_bs.genesis.initializer.texts.input }}
      {{ _rh_rf_cigr | to_json }}
    quiet: true

# The W1 admission fact (reserved; C1-REQ-W1-04 i) is set only NOW, from the admitted row and the measured bytes,
# under the var the row names (row.admission, a record_free_admissions member; FW20-COLD).
# op1h (records-route-op1h-01 OP1H-ARFE-01; codex 922 EXECUTED_BIND_COMPLETION_MARKER): on the PROJECTOR row (the
# envelope_projection entry_from) the completed admission marker (row.admission, s37 _rh_clp_adm) is WITHHELD here and
# set only by the executed-bind consumer at the end of this file, after the verifier returned and the pending set is
# empty. Every earlier projector check (row, stage, caller, bytes, path, X2 record) is row validation, not completed X2
# admission. A skipped or failed verifier leaves no marker. Every other row is unchanged (marker set here).
- name: Set the record-free admission fact under the row's declared var (reserved; after row, stage, caller, bytes and path were admitted)
  vars:
    _rh_x2_entry: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection.entry_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
  when: _rh_sa_caller != _rh_x2_entry
  ansible.builtin.set_fact:
    "{{ _rh_rf_row.admission }}":
      entry_rel: "{{ _rh_sa_caller }}"
      entry_sha256: "{{ _rh_rf_ent.stat.checksum }}"
      purpose: "{{ _rh_rf_row.purpose }}"
      edition: "{{ _rh_rf_in.edition }}"
      declaration_sha256: "{{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }}"

- name: Refuse a resolved view that is not the admitted cold binding (declaration, node, stage row, edition, carrier)
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.source_admission == _rh_sa_decl
      - rh.controller.bootstrap.source_admission.bootstrap_input.declaration_rel == _rh_rf_in.declaration_rel
      - rh.controller.bootstrap.source_admission.bootstrap_input.declaration_path == _rh_rf_in.declaration_path
      - rh.controller.bootstrap.path_admission.separator == _rh_sa_reg.path_law.separator
      - rh.controller.bootstrap.genesis.launch.stages[_rh_rf_row.purpose] == _rh_sa_eff.genesis.launch.stages[_rh_rf_row.purpose]
      - rh_src_admission[rh.controller.bootstrap.source_admission.record_fields.edition] == _rh_rf_in.edition
      - >-
        (_rh_sa_in | dict2items | selectattr('key', 'in', _rh_rf_in.keys() | list) | items2dict | to_json(**_rh_sa_regadm.ingress.canonical_json))
        == (_rh_rf_in | dict2items | selectattr('key', 'in', rh.controller.bootstrap.source_admission.bootstrap_input.record_keys) | items2dict | to_json(**_rh_sa_regadm.ingress.canonical_json))
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.input }}: {{ rh.controller.bootstrap.genesis.initializer.texts.input }}
    quiet: true

- name: Admit exactly the authoring builder A for the row's purpose (receipt-bound; genesis launch custody)
  ansible.builtin.include_tasks: tasks/admit_builder.yml
  vars:
    rh_gen_stage: "{{ _rh_rf_row.purpose }}"

# op1g CPL-SR919B-ARFE-EXECUTED-ARM, the CONSUMER of executed_bind (C1 s37 first_invocation.executed_bind.consumer
# {rel_from, included_by: admission, include_at: last_step, include_after: builder_admission, include_count: 1}; r24
# enum row; codex 920 SR920_EXECUTED_BIND_REACHABILITY). Order (acyclic): producer MAIN writer.bind_step_rel before the
# record and the exec -> admission THIS FILE (executed arm above: field present and shaped, then PENDING) -> consumer
# the verifier at first_invocation.verifier_rel, included HERE ONLY, EXACTLY ONCE, as the LAST step for the projector
# row, after the builder admission above (admit_builder binds the builder A fact the verifier reads). The verifier
# recomputes the vector and refuses on any difference; when it returns it clears the fields it verified from
# _rh_x2_pending (B coupling CPL-OP1G-B-PENDING-CLEAR). A pending field left (verifier skipped or not clearing) refuses
# below, before this admission returns, so before any projector output. Single include site: B removes the
# cold_launch_projection :97 include (CPL-SR919B-B-SINGLE-INCLUDE).
- name: Verify the executed-kind fields held pending (projector row only; the LAST step, after the builder admission)
  vars:
    _rh_x2_iw: "{{ _rh_sa_regadm.ingress }}"
    _rh_x2_ei: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation }}"
    _rh_x2_ep: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection }}"
    _rh_x2_eb: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.source_admission.first_invocation.executed_bind }}"
    _rh_x2_tx: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.envelope_projection.provenance.texts }}"
    _rh_x2_rg: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel }}"
    _rh_x2_entry: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.entry_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    _rh_x2_rc: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_ep.provenance.refusal_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
    # the verifier rel, walked along executed_bind.consumer.rel_from (= first_invocation.verifier_rel)
    _rh_x2_vr: >-
      {%- set w = namespace(v=_rh_sa_bs) -%}
      {%- for k in _rh_x2_eb.consumer.rel_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
  when: _rh_sa_caller == _rh_x2_entry
  block:
    - name: Stat the first-invocation verifier at its declared rel (no link followed; measured bytes)
      ansible.builtin.stat:
        path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_x2_vr }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_x2_vst

    - name: Refuse an executed bind this admission cannot consume (order, include site and count, verifier member bytes, pending set)
      ansible.builtin.assert:
        that:
          - _rh_x2_eb.consumer.included_by in _rh_x2_eb.order
          - _rh_x2_eb.consumer.include_count == _rh_x2_iw.atoms.one
          - _rh_x2_vr is string
          - _rh_x2_vr in rh_src_admission[_rh_sa_decl.record_fields.members]
          - _rh_x2_vst.stat.exists and _rh_x2_vst.stat.isreg and not _rh_x2_vst.stat.islnk
          - _rh_x2_vst.stat.checksum == rh_src_admission[_rh_sa_decl.record_fields.members][_rh_x2_vr][_rh_sa_decl.member_fields.observed]
          - _rh_x2_pending is sequence and _rh_x2_pending is not string and _rh_x2_pending is not mapping
          - (_rh_x2_pending | length) > _rh_x2_iw.atoms.zero
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.binding, _rh_sa_caller | to_json, _rh_x2_vr | to_json]}) }}
        quiet: true

    # include_count 1: this is the ONE include of the verifier on the projector row
    - name: Include the first-invocation verifier ONCE (executed_bind consumer; reads only facts this admission bound)
      ansible.builtin.include_tasks: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_x2_vr }}"

    - name: Refuse an executed-kind field still pending after the verifier (unverified; before any projector output)
      ansible.builtin.assert:
        that:
          - _rh_x2_pending is sequence and _rh_x2_pending is not string and _rh_x2_pending is not mapping
          - (_rh_x2_pending | length) == _rh_x2_iw.atoms.zero
        fail_msg: >-
          {{ lookup('ansible.builtin.template', _rh_x2_rg,
                    template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar, 'rh_rf_code': _rh_x2_rc,
                                   'rh_rf_detail': [_rh_x2_tx.binding, _rh_sa_caller | to_json, _rh_x2_pending | to_json]}) }}
        quiet: true

    # op1h (codex 922 EXECUTED_BIND_COMPLETION_MARKER): the COMPLETED projector admission marker, set ONLY here -- after
    # the builder admission, the single verifier include and the pending == 0 assert above. Same var (row.admission,
    # s37 _rh_clp_adm) and the same fields as every other row; nothing is renamed.
    - name: Set the completed record-free admission fact of the projector row (only after the executed bind is verified)
      ansible.builtin.set_fact:
        "{{ _rh_rf_row.admission }}":
          entry_rel: "{{ _rh_sa_caller }}"
          entry_sha256: "{{ _rh_rf_ent.stat.checksum }}"
          purpose: "{{ _rh_rf_row.purpose }}"
          edition: "{{ _rh_rf_in.edition }}"
          declaration_sha256: "{{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }}"
