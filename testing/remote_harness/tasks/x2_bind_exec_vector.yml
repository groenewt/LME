---
# testing/remote_harness/tasks/x2_bind_exec_vector.yml -- the PRE-LAUNCH EXECUTABLE BINDING of the projector's first
# invocation, inside the existing declared X2 writer (C1 s35 source_admission.writer; codex 919
# SR918_ACTUAL_EXECUTION_BINDING; codex 916 (3) D916-EXECUTION-BINDING). NEW FILE (B op1e). AUTHORED, NEVER EXECUTED
# (UNRUN). Change record: b/op1e-projector/records-b-op1e-projector-01.yml.
# WHERE IT RUNS: in MAIN's X2 admission / writer process, AFTER MAIN composed the first exec vector and the admission
# and BEFORE the X2 record is written and BEFORE the exec. A refusal here launches nothing, so no registry capture, parse
# or resolve of the projector process ever happens. It is not a resolver: it reads no profile layer, merges nothing and
# parses no registry; it measures files and compares words.
# WHAT IT BINDS (919): the ACTUAL executed playbook path and bytes plus the registry identity to the carried admission:
#   (a) the playbook word of the vector (the word right before the carrier tail, by the declared form genesis.launch.argv
#       '{checkout}/{playbook_rel}', '{source_record}') is EXACTLY <checkout>/<admission entry_rel>, and admission
#       entry_rel is the ingress projector.entry_rel;
#   (b) that path, reached with no symbolic link in any component below the checkout, is a regular file whose bytes hash
#       (ingress digest.algorithm) to admission entry_sha256, which is also the X2 closure row of that rel;
#   (c) the registry rel bytes hash to admission registry_sha256 = its X2 closure row = the registry cold input word
#       carried in the same vector;
#   (d) the carrier tail is exactly [flag, {<admission var>: admission}, flag, <companion map>] in carrier.order, the
#       companion map equal to admission companions (var names only through s35 carrier.roles inside the ingress decl);
#   (e) SUPPLEMENTARY consistency only (919: never the binding): the projector entry holds exactly ONE play, named the
#       literal select.play_name, and no other playbook of the X2 closure declares a play of that name (rules.play_name
#       {literal, plays_in_entry, unique_among: admitted_members}).
# Include parameters (all required, no default; MAIN's writer binds them):
#   rh_xb_vector     the composed first exec vector (list of strings) MAIN will exec byte for byte
#   rh_xb_admission  the admission mapping MAIN computed (s35 carrier.admission.sources)
#   rh_xb_ingress    the X2-admitted ingress declaration (testing/remote_harness/registry_ingress.decl.yml), strictly parsed
#   rh_xb_closure    the X2 closure rows ({rel, sha256} per field_shapes.closure) MAIN measured
#   rh_xb_checkout   the admitted checkout (absolute)
# Diagnostics: the provenance refusal code, locators and field names only (916 (4)); never a value.
# op1f (B; cp -n of op1e a5d7ee04, then Edit; change record b/op1f-projector/records-b-op1f-projector-01.yml): this file
# is PLACED by the declared C1 s37 word source_admission.writer.bind_step_rel (:1338; a members_rel member :6195;
# first_invocation.executed_bind.producer.step_from walks to it): MAIN's writer reaches it by that word, never by a
# literal rel. It reads writer.words.play_name_key (:1341) and run_local.caller_vars.form_separators.name_eq_value
# (:3498) instead of the op1e literals. The executed_bind order is producer (this step) -> admission (route ARFE
# executed arm, pending) -> consumer (verify_first_invocation, included once by ARFE).

- name: X2 BIND -- refuse a missing or malformed binding parameter (no default)
  vars:
    _rh_xb_cr: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.first_invocation.lists[rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.first_invocation.lists.source_record] }}"
  ansible.builtin.assert:
    that:
      - rh_xb_vector is sequence and rh_xb_vector is not string and rh_xb_vector is not mapping
      - rh_xb_vector | reject('string') | list | length == 0
      - rh_xb_admission is mapping
      - (rh_xb_admission.keys() | list | sort) == (rh_xb_ingress.carriers.projector.admission.fields.values() | list | sort)
      - rh_xb_ingress is mapping and rh_xb_ingress.carriers is mapping
      - rh_xb_closure is sequence and rh_xb_closure is not string
      - rh_xb_checkout is string and rh_xb_checkout is match(rh.controller.bootstrap.path_admission.regex)
      - (_rh_xb_cr.admission.sources.keys() | list | sort) == (rh_xb_ingress.carriers.projector.admission.fields.keys() | list | sort)
      - (rh_xb_vector | length) > ((_rh_xb_cr.order + _rh_xb_cr.order) | length)
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.provenance.texts.carrier }}
      {{ ['rh_xb_vector', 'rh_xb_admission', 'rh_xb_ingress', 'rh_xb_closure', 'rh_xb_checkout'] | to_json }}
    quiet: true

- name: X2 BIND -- bind the playbook word, the carrier tail and the walked words (derived; nothing measured yet)
  vars:
    _rh_xb_cr: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.first_invocation.lists[rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.first_invocation.lists.source_record] }}"
    _rh_xb_tail_n: "{{ (_rh_xb_cr.order + _rh_xb_cr.order) | length }}"
  ansible.builtin.set_fact:
    _rh_xb_pb: "{{ rh_xb_vector[(rh_xb_vector | length) - (_rh_xb_tail_n | int) - 1] }}"
    _rh_xb_tail: "{{ rh_xb_vector[(rh_xb_vector | length) - (_rh_xb_tail_n | int):] }}"
    _rh_xb_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    _rh_xb_af: "{{ rh_xb_ingress.carriers.projector.admission.fields }}"
    # role -> var, walked inside the ingress declaration (s35 carrier.roles)
    _rh_xb_rv: >-
      {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
      {%- for r, path in _rh_xb_cr.roles | dictsort -%}
      {%- set w = namespace(v=rh_xb_ingress) -%}{%- for k in path -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
      {%- set ns.p = ns.p + [[r, w.v]] -%}{%- endfor -%}{{ dict(ns.p) }}
    # the expected carrier tail in carrier.order (a role member -> {<role var>: admission}; the companion node ->
    # admission companions as the flat companion map)
    _rh_xb_tail_x: >-
      {%- set ns = namespace(w=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
      {%- set fw = namespace(v=rh.controller.bootstrap) -%}{%- for k in _rh_xb_cr.flag_from -%}{%- set fw.v = fw.v[k] -%}{%- endfor -%}
      {%- for m in _rh_xb_cr.order -%}
      {%- set rv = namespace(v=rh_xb_ingress) -%}
      {%- if m in _rh_xb_cr.roles -%}
      {%- for k in _rh_xb_cr.roles[m] -%}{%- set rv.v = rv.v[k] -%}{%- endfor -%}
      {%- set ns.w = ns.w + [fw.v, {rv.v: rh_xb_admission} | to_json] -%}
      {%- else -%}{%- set ns.w = ns.w + [fw.v, rh_xb_admission[rh_xb_ingress.carriers.projector.admission.fields.companions] | to_json] -%}{%- endif -%}
      {%- endfor -%}{{ ns.w }}

# (a)+(b): every component of the playbook path below the checkout, and the registry rel, measured without following
# a link; the leaf with its digest
- name: X2 BIND -- stat each component of the playbook word below the checkout (no link followed)
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop: >-
    {%- set ns = namespace(p=rh_xb_checkout, l=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
    {%- for c in rh_xb_admission[_rh_xb_af.entry_rel].split(_rh_xb_sep) -%}{%- set ns.p = ns.p ~ _rh_xb_sep ~ c -%}{%- set ns.l = ns.l + [ns.p] -%}{%- endfor -%}{{ ns.l }}
  register: _rh_xb_comp

- name: X2 BIND -- measure the playbook word and the registry (no link followed; ingress digest algorithm)
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh_xb_ingress.digest.algorithm }}"
  loop:
    - "{{ _rh_xb_pb }}"
    - "{{ rh_xb_checkout ~ _rh_xb_sep ~ rh_xb_ingress.registry_rel }}"
  register: _rh_xb_m

- name: X2 BIND -- refuse a vector whose playbook word, bytes, registry or carrier tail are not the carried admission (before launch)
  vars:
    _rh_xb_cs: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.record.field_shapes.closure }}"
    _rh_xb_reg_in: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.identity.input }}"
  ansible.builtin.assert:
    that:
      # (a) the playbook word is exactly <checkout>/<admission entry_rel>, the declared projector entry
      - rh_xb_admission[_rh_xb_af.entry_rel] == rh_xb_ingress.carriers.projector.entry_rel
      - _rh_xb_pb == rh_xb_checkout ~ _rh_xb_sep ~ rh_xb_admission[_rh_xb_af.entry_rel]
      - _rh_xb_pb == _rh_xb_comp.results[-1].item
      # (b) no linked component; a regular file whose bytes are admission entry_sha256 and its closure row
      - _rh_xb_comp.results | map(attribute='stat') | rejectattr('exists') | list | length == 0
      - _rh_xb_comp.results | map(attribute='stat') | selectattr('islnk') | list | length == 0
      - _rh_xb_m.results[0].stat.exists and _rh_xb_m.results[0].stat.isreg and not _rh_xb_m.results[0].stat.islnk
      - _rh_xb_m.results[0].stat.checksum == rh_xb_admission[_rh_xb_af.entry_sha256]
      - (rh_xb_closure | selectattr(_rh_xb_cs[0], 'equalto', rh_xb_admission[_rh_xb_af.entry_rel]) | map(attribute=_rh_xb_cs[1]) | list) == [_rh_xb_m.results[0].stat.checksum]
      # (c) the registry bytes are admission registry_sha256, its closure row and the registry cold input word
      - _rh_xb_m.results[1].stat.exists and _rh_xb_m.results[1].stat.isreg and not _rh_xb_m.results[1].stat.islnk
      - _rh_xb_m.results[1].stat.checksum == rh_xb_admission[_rh_xb_af.registry_sha256]
      - (rh_xb_closure | selectattr(_rh_xb_cs[0], 'equalto', rh_xb_ingress.registry_rel) | map(attribute=_rh_xb_cs[1]) | list) == [_rh_xb_m.results[1].stat.checksum]
      # op1f: the name=value separator is the declared s37 run_local.caller_vars.form_separators.name_eq_value
      - (rh_xb_vector | select('equalto', _rh_xb_reg_in ~ rh.controller.bootstrap.work_roots.run_local.caller_vars.form_separators.name_eq_value ~ _rh_xb_m.results[1].stat.checksum) | list | length) == 1
      # (d) the carrier tail is exactly the admission then the companion map, in carrier.order
      - _rh_xb_tail == _rh_xb_tail_x
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.provenance.texts.carrier }}
      {{ [rh_xb_ingress.carriers.projector.entry_rel, rh_xb_ingress.registry_rel, _rh_xb_af.keys() | list] | to_json }}
    quiet: true

# (e) SUPPLEMENTARY: the play-name rules over the X2 closure playbooks (every closure rel with the entry's extension
# that parses as a play list); op1f: the plays' name key is the declared s37 source_admission.writer.words.play_name_key
# (R-OP1E-PLAY-NAME-KEY closed)
- name: X2 BIND -- refuse a projector play name that is not literal, single and unique among the admitted members (supplementary)
  vars:
    _rh_xb_cs: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.record.field_shapes.closure }}"
    _rh_xb_pn: "{{ rh_xb_ingress.carriers.projector.select.play_name }}"
    _rh_xb_pk: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.source_admission.writer.words.play_name_key }}"
    _rh_xb_names: >-
      {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
      {%- for r in rh_xb_closure | map(attribute=_rh_xb_cs[0]) -%}
      {%- if (r | splitext | last) == (rh_xb_ingress.carriers.projector.entry_rel | splitext | last) -%}
      {%- set doc = lookup('ansible.builtin.file', rh_xb_checkout ~ _rh_xb_sep ~ r, rstrip=false) | from_yaml -%}
      {%- if doc is sequence and doc is not string and doc is not mapping -%}
      {%- set ns.p = ns.p + [[r, doc | select('mapping') | map(attribute=_rh_xb_pk) | list]] -%}
      {%- endif -%}{%- endif -%}{%- endfor -%}{{ dict(ns.p) }}
  ansible.builtin.assert:
    that:
      - rh_xb_ingress.carriers.projector.entry_rel in _rh_xb_names
      - _rh_xb_names[rh_xb_ingress.carriers.projector.entry_rel] == [_rh_xb_pn]
      - (_rh_xb_names | dict2items | rejectattr('key', 'equalto', rh_xb_ingress.carriers.projector.entry_rel) | map(attribute='value') | flatten | select('equalto', _rh_xb_pn) | list | length) == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.provenance.texts.carrier }}
      {{ [rh_xb_ingress.carriers.projector.entry_rel, rh_xb_ingress.carriers.projector.select.play_name] | to_json }}
    quiet: true
