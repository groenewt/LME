                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.refusals.member,
                               'rh_rf_detail': [_rh_lock_rel]}) }}
    quiet: true

- name: "NP-01 stat the executing controller lock before its one read (lock_capture.verify; no link followed)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ _rh_lock_rel }}"
    follow: "{{ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.follow }}"
    get_checksum: true
