        lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.digest_field in _rh_lock_st.stat
        and _rh_lock_st.stat[lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.digest_field] == _rh_lock_cap.sha256
