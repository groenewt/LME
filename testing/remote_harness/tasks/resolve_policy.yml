      # projection extends exactly the executable_closure partial admission (every other field equal; every partial
      # member unchanged; the added members are the document view rels, :111 above).
      - rh_src_partial[_rh_sa_f.admission_stages.words.executable_closure] is mapping
      - (rh_src_admission | dict2items | rejectattr('key', 'equalto', _rh_sa_f.record_fields.members) | items2dict | to_json(sort_keys=true))
        == (rh_src_partial[_rh_sa_f.admission_stages.words.executable_closure] | dict2items | rejectattr('key', 'equalto', _rh_sa_f.record_fields.members) | items2dict | to_json(sort_keys=true))
      - (rh_src_partial[_rh_sa_f.admission_stages.words.executable_closure][_rh_sa_f.record_fields.members] | to_json(sort_keys=true))
        == (rh_src_admission[_rh_sa_f.record_fields.members] | dict2items | selectattr('key', 'in', rh_src_partial[_rh_sa_f.admission_stages.words.executable_closure][_rh_sa_f.record_fields.members].keys() | list) | items2dict | to_json(sort_keys=true))
      # r2l R2K-TOOL-FIRST-USE-BINDING: the tool contract admission ran (rh_src_admission tool rows) IS the launch
      # record's, type-strict (the resolved os_tools equality above then binds the normal loader to it too)
      - (_rh_tools | to_json(sort_keys=true)) == (_rh_sa_in.tools | to_json(sort_keys=true))
      - _rh_audit == _rh_early_audit
      - _rh_eb.edition == rh_src_admission[_rh_sa_f.record_fields.edition]
      - _rh_eb.declaration_sha256 == rh_src_admission[_rh_sa_f.record_fields.bootstrap][_rh_sa_f.bootstrap_fields.sha256]
      # resolve_policy-05 (RP04-PI; X-R2J-RPSHA closed, N-PI-02): rh_profile_sha256 is the profile capture digest (exact
      # bytes); no row here equates it with the declaration digest (OW-ALS-DECL-MEMBER-EQ, C1).
    fail_msg: >-
