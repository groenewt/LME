      {{ [_rh_eb.declaration_rel, _rh_eb.edition] | to_json }}
    quiet: true

# records-context-macro-join-01 (codex-tick754 context_ruling; supersedes records-staged-reader-01 C1-SR-RP-05 at the same
# point): the COMPLETED CONTEXT, assigned directly from the ONE construction _rh_sa_cx (bound before the reconciliation)
