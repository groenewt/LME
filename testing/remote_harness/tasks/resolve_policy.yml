      # RP06-04: the engine's loaded-profile capture lies under the run's capture root
      - >-
        (lookup('ansible.builtin.varnames', '^' ~ (lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var | regex_escape) ~ '$')
         != lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var)
        or ((lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var).capture_path is string)
            and lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var).capture_path.startswith(lookup('ansible.builtin.vars', lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var).capture.root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator))
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.conflict_refusal,
                               'rh_rf_detail': [rh_repo_root, lme_source_binding | to_json, lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var) | to_json]}) }}
    quiet: true

# NP-01 LOCK CAPTURE (MR03 PKG-CALLER resolve_policy optb-after-01, successor of m1-1 ff2ce4b0; codex721 LOCKSHA-01;
# MIGRATION-PKG-LOCKSHA-01 NP-01; C1 records-pkg-optb-05 controller.bootstrap.lock_capture (C1PKG-REQ-LOCKCAP-CTL);
# composition C1 records-dkjoin-02 C1-DKJ2-RP-02R; AUTHORED, NEVER EXECUTED, UNRUN). The executing controller's lock
# (_rh_lock_rel, bound ONCE from the published builder recipe (resolved_recipe.builder)) is captured ONCE, controller-side (the source_admission delegate, as
# the re-hash above; inside a target play the checkout is the controller's): stat under lock_capture.verify BEFORE the
# one read, then the one read (exact bytes), text, digest by lock_capture.digest_algorithm, verify (every require field
# true, digest_field == the captured digest), the ONE strict parse (lme_manifest_strict with the registry parse words;
# never from_yaml) with packages / collections mandatory, and last the shape check (keys == lock_capture.fields).
# Publishes _rh_lock_cap = {text, sha256, packages, collections}; C1-DKJ2-RP-02R binds rh_seed_lock to it at :157 (no
# second read, no second parse); S6-RP-01 follows the RP-02R line. rh is not yet published here, so every word is read
# from lme_resolved.remote_harness.policy.controller. BLOCKED-ON: GL-REQ-PKG-11 (_rh_lock_st, _rh_lock_raw,
# _rh_lock_cap) and C1PKG-REQ-LOCKCAP-REFUSAL (lock_capture.refusal, the refusal code of this capture; pending C1).
# Change record: proposals/mr03-pkg-caller/optb-resolve_policy-01v.change.yml.
# optb-after-02 (successor of optb-after-01 f0cedbac; MAIN F2 PARITY-REQUIRE; UNRUN): the verify.require fields are
# asserted BEFORE the slurp (typed refusal, as package P1c). Change record: optb-resolve_policy-02v.change.yml.
# optb-after-03 (successor of optb-after-02 7a6cbf3e; C1 records-lock-trust-01 319738f0 LT-CTL binding_NP01 B-CTL-1..3;
# codex-tick728 lock_capture_trust option (b): git / source admission IN ADDITION to the stat; UNRUN): the membership
# declaration is C1-FBC-P-01 / P-02 (records-fbc-01 11bd51a2), reused unchanged; these rows bind the capture to the ONE
# admitted source record rh_src_admission (admit_loader_source.yml, the first task above), addressed by the declared
# source_admission role names only. B-CTL-3 (algorithm equality) then B-CTL-1 (membership) run before the stat and the
# one read; B-CTL-2 (captured digest == the member's observed digest) runs after the capture verify, before the parse and
# before rh_seed_lock is published. Refusal source_admission.refusals.member (RH-SOURCE-MEMBER; no new code). B-CTL-3 is
# a leaf-equals-leaf check the registry cannot state: enforced here (records-lock-trust-01 not_expressible_in_registry).
# The stat, the require assert and the capture verify all stay. Change record: optb-resolve_policy-03v.change.yml.
# optb-after-04 LOCK BINDING (successor of optb-after-03 760112a4; codex 883 builder executor lock; SR-290-32, SR-290-35,
# SR-290-40; C1 OW-H11-C1-01-PUB select_tree resolved_recipe; UNRUN): the executing controller lock rel is DEREFERENCED
# once from the published builder recipe lock_capture.resolved_recipe.builder.recipe.lock_file_rel; no recipe address is
# walked and nothing is selected here. An absent key or a non-string / empty value refuses lock_capture.refusal first.
- name: "NP-01 refuse an absent or non-string published builder lock rel (before any effect)"
  ansible.builtin.assert:
    that:
      - "'resolved_recipe' in lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe is mapping and 'builder' in lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder is mapping and 'recipe' in lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder"
      - "lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder.recipe is mapping and 'lock_file_rel' in lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder.recipe"
      - lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder.recipe.lock_file_rel is string
      - lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder.recipe.lock_file_rel | length > 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,
                               'rh_rf_detail': [lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture | list | sort | to_json]}) }}
    quiet: true

- name: "NP-01 bind the executing controller lock rel ONCE (the published builder recipe; codex 883)"
  ansible.builtin.set_fact:
    _rh_lock_rel: "{{ lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.resolved_recipe.builder.recipe.lock_file_rel }}"

- name: "NP-01 B-CTL-3 refuse unless lock_capture.digest_algorithm is source_admission.digest_algorithm (once; before any digest comparison)"
  ansible.builtin.assert:
