- name: "NP-01 read the executing controller lock ONCE (exact bytes; the capture source)"
  ansible.builtin.slurp:
    src: "{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ _rh_lock_rel }}"
  delegate_to: "{{ lme_resolved.remote_harness.source_admission.controller_delegate }}"
  register: _rh_lock_raw

- name: "NP-01 capture the lock text (lock_capture text: the decoded bytes of the one read, no strip)"
  ansible.builtin.set_fact:
    _rh_lock_cap:
      text: "{{ _rh_lock_raw.content | b64decode }}"

- name: "NP-01 digest the captured text (lock_capture sha256 by lock_capture.digest_algorithm; after the text)"
  ansible.builtin.set_fact:
    _rh_lock_cap: "{{ _rh_lock_cap | combine({'sha256': _rh_lock_cap.text | hash(lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.digest_algorithm)}) }}"

- name: "NP-01 refuse unless the captured bytes are the regular file stat'ed in this flow (lock_capture.verify; before any row is used)"
  ansible.builtin.assert:
