      # optb-after-04 (SR-290-29, SR-290-39): rh_rp_input presence re-expressed in the presence-by-key form
      - "'rh_rp_input' in vars or (rh_src_context | to_json(sort_keys=true)) == (_rh_sa_in.context | to_json(sort_keys=true))"
      - >-
        (rh_src_context[lme_resolved.remote_harness.source_admission.early_view.git_field] | to_json(sort_keys=true))
        == (rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] | to_json(sort_keys=true))
    fail_msg: >-
      REFUSED {{ lme_resolved.remote_harness.source_admission.early_view.refusal }}: {{ lme_resolved.remote_harness.source_admission.early_view.text }}
      {{ rh_src_context | to_json }}
    quiet: true

# ROUTE-INTERFACE-BYTES-BEFORE-CONSUMPTION (codex-tick372 interface-binding verdict): the FIRST point at which the
# resolved declaration exists, and before ANY consumer includes another pinned member (resolve_harness.yml:14 includes
# verify_toolchain_receipt.yml only after this file returns; guest.yml:79 reaches it through resolve_harness.yml;
# initial_contact / admit_ancestry / decide_private_group are included later still). Every member of the resolved
# controller.bootstrap.consumer_interface is re-hashed from the CONTROLLER checkout (lookup runs on the controller
# even inside a target play; rstrip=false: the exact bytes) and compared with its declared digest, and the aggregate
# is recomputed with the EXISTING recipe (profile consumer_interface comment: sha256 of the lines "<sha256>  <path>\n",
# paths relative to testing/remote_harness, sorted by path; == transfer.j2:439-443) and compared with the declared
# interface_sha256. No new digest format and no loader. LIMIT (stated, not claimed away): refuse_pinned_outputs.yml and
# THIS file are consumed before any resolved declaration exists, so for those two members this check DETECTS drift
# (the run refuses before any further member is consumed) but cannot PREVENT their own consumption; their pre-execution
# custody stays B's check.yml (transfer.j2:418-443) and G's controls pins.
- name: Refuse a consumer interface whose member bytes are not the resolved declaration (before any other member is consumed)
  vars:
    # optb-after-04 (F-933; SR-272-03 :399 :412 :417; OW-H11-RT-10): presence by key, then the type; no default filter and
    # no fallback value. _ci and _l are read only once _ci_ok holds (the assert stops at its first false row; the fail_msg
    # renders them only under the same test).
    _ci_bs: "{{ lme_resolved.remote_harness.policy.controller.bootstrap }}"
    _ci_ok: >-
      {{ 'consumer_interface' in _ci_bs and _ci_bs.consumer_interface is mapping
         and 'revision' in _ci_bs.consumer_interface and _ci_bs.consumer_interface.revision is integer
         and 'files' in _ci_bs.consumer_interface and _ci_bs.consumer_interface.files is mapping
         and _ci_bs.consumer_interface.files | length > 0
         and 'interface_sha256' in _ci_bs.consumer_interface and _ci_bs.consumer_interface.interface_sha256 is string
         and _ci_bs.consumer_interface.interface_sha256 is match('^[0-9a-f]{64}$') }}
    _ci: "{{ _ci_bs.consumer_interface }}"
    _l: >-
      {%- set ns = namespace(o=[]) -%}
      {%- for rel in _ci.files | list | sort -%}
      {%- set ns.o = ns.o + [[rel, lookup('ansible.builtin.file', rh_repo_root ~ '/testing/remote_harness/' ~ rel, rstrip=false) | hash('sha256')]] -%}
      {%- endfor -%}{{ ns.o }}
    # the recipe's listing, from the ACTUAL digests: "<sha256>  <rel>\n" per member, sorted by rel
    _txt: "{{ _l | map('reverse') | map('join', '  ') | map('regex_replace', '$', '\n') | join('') }}"
  ansible.builtin.assert:
    that:
      - _ci_ok is sameas true
      - _l | map('last') | list == _l | map('first') | map('extract', _ci.files) | list
      - (_txt | hash('sha256')) == _ci.interface_sha256
    fail_msg: >-
      REFUSED RH-ROUTE-INTERFACE: the resolved consumer interface{% if _ci_ok is sameas true %} (revision {{ _ci.revision }},
      {{ _ci.interface_sha256 }}) does not describe the checkout's bytes. Drifted members:
      {% for p in _l if p[1] != _ci.files[p[0]] %}{{ p[0] }}={{ p[1] }} (declared {{ _ci.files[p[0]] }}) {% endfor %}.{% endif %}
      {% if _ci_ok is not sameas true %}is absent, or lacks an integer revision, a non-empty files mapping or a 64-hex interface_sha256.{% endif %}
      Republish the interface (revision, members, aggregate) through C1 before any consumer runs; nothing further was
      included.
    quiet: true

- name: Report the resolved harness policy (audit of admitted overrides; not revision-bound)
  ansible.builtin.debug:
    msg: >-
      RH-POLICY policy_sha256={{ rh_config_revision }} lme_resolved_revision={{ rh_engine_revision }}
      overridden_paths={{ lme_remote_harness_overridden_paths }}
# FROZEN, no further writes
