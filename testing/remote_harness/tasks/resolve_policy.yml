        == _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var
      - lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var) is mapping
      - >-
        (lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var) | list | sort)
        == (_lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.fields | sort)
      - >-
        lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var).path
        == rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel
      - >-
        lookup('ansible.builtin.vars', _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var).sha256
        == _rh_prof_cap.sha256
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.conflict_refusal,
                               'rh_rf_detail': [lme_profile, lme_manifests_dir, _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var,
                                                lookup('ansible.builtin.varnames', '^' ~ (_lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var | regex_escape) ~ '$') == _lme_global_file.lme_config_registry.remote_harness_schema.profile_identity.var,
                                                _rh_prof_cap.sha256]}) }}
    quiet: true

- name: "RP06 -- refuse a run capture, loaded-profile capture or source binding that is not the declared one (PI-02; C1 r12, s27)"
  ansible.builtin.assert:
    that:
      # RP06-02: the engine-published source binding is this helper's admitted checkout, under the declared applies word
      # RP07-05 (SR-311-05; closes HOLE-PI02-SOURCE-BINDING-WORDS): the registry source_binding.applicability vocabulary
      - lme_source_binding is mapping
      - lme_source_binding.root == rh_repo_root
      - lme_source_binding.applicability == _lme_global_file.lme_config_registry.remote_harness_schema.source_binding.applicability.applies
      # RP06-01 / 03 / 04 hold where the play carries the declared resolved run (presence by name, never a fallback value)
      # RP06-01: its capture carries exactly the declared resolved_run.capture_fields
      - >-
        (lookup('ansible.builtin.varnames', '^' ~ (lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var | regex_escape) ~ '$')
         != lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var)
        or ((lookup('ansible.builtin.vars', lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var).capture is mapping)
            and ((lookup('ansible.builtin.vars', lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var).capture | list | sort)
                 == (lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.capture_fields | sort)))
      # RP06-03: its serving scope is the declared serving_scope_from, and the source binding's expectations are that
      # scope's engine generation bindings, lme_resolved.remote_harness.scopes[<serving_scope>][generation_binding.to]
      - >-
        (lookup('ansible.builtin.varnames', '^' ~ (lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var | regex_escape) ~ '$')
         != lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var)
        or ((lookup('ansible.builtin.vars', lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var).serving_scope == lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.serving_scope_from)
            and (lookup('ansible.builtin.vars', lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.var).serving_scope in lme_resolved.remote_harness.scopes)
            and (lme_source_binding.expectations
