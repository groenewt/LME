      # former A1, at the complete stage: the cold record plus this context lacks EXACTLY the protected fields
      - >-
        'rh_rp_input' not in vars or
        (_rh_sa_f.bootstrap_input.record_keys | difference(rh.controller.bootstrap.genesis.initializer.root_input['keys'] + _rh_sa_f.carrier_state_schema.complete_only) | sort)
