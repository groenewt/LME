---
# testing/remote_harness/tasks/resolve_policy.yml -- resolve the harness policy through the shared engine.
# Requires tasks/refuse_pinned_outputs.yml to have run first in the play (it derives rh_repo_root).
#
# SEED-06 (JOINT with C1; consumer interface revision 4): the policy is the engine's typed section
# lme_resolved.remote_harness = {schema_version: 3, policy, policy_sha256, adapter: {name, tools: {'target.tools': {<tool>:
# {used_by, path, identity}}}}} -- adapter tool path/identity DERIVED by C1 from the effective os_tools (tick144). resolve.yml composes lme_global exactly ONCE
# (global | profile | lme_global_override LAST, recursive), validates it deny-by-default against C1's registry
# (manifests/global.yml lme_config_registry.remote_harness_schema: tunable paths, declared leaf types, executable
# identity, bounds, adapter, package mapping, inventory variable names, retired paths) and binds the section into
# lme_resolved_revision. An admitted override is therefore part of the policy and of both revisions; its dotted
# leaves are audited in lme_remote_harness_overridden_paths (not revision-bound; a same-value override is listed).
# This file reads no policy from the raw profile: no _lme_profile_file read, no interim override refusal. Its ONE raw
# profile read is the admitted profile capture (controller.bootstrap.profile_capture; resolve_policy-05 RP04-PI).

#
# r3f DECLARED-INPUTS-VS-DERIVED-OUTPUTS (codex-tick144): clone_directory, lme_manifests_dir and lme_profile are the
# engine's DECLARED INPUTS, not harness outputs (never reserved). This helper binds them to the harness checkout and
# the remote-harness profile; an inventory value cannot reach the resolve (include vars outrank inventory), and an
# extra-var that does reach it is refused AFTER the resolve by comparing the EFFECTIVE bindings the engine used
# (lme_profile, lme_manifests_dir, its published profile identity) with the admitted ones and the capture. Profile
# composition (global | remote-harness | lme_global_override) is unchanged; lme_global_override stays a declared input.

# r2i R5K-LOADER-TRUST-BOUNDARY (codex-tick433; tick427-428 loader_source_decision): THIS file is the ONE loader
# invocation point of every remote-harness producer and consumer path (rg over testing/remote_harness + testing/e2e;
# LME playbooks outside the harness load the role themselves -- r2i P-15) (package.yml genesis; resolve_harness.yml -> controller.yml,
# verify_entries.yml, bind_controller.yml, guest.yml; render_run_binding.yml; prereq_observe.yml; resolve_work_root.yml),
# so the immutable-source admission is its FIRST task: no include_role of ansible/roles/podman (which puts
# filter_plugins/lme_manifests.py on the plugin path) can happen on any path before the loader's bytes are admitted
# against the intended commit. Controller-side always (delegated: inside a target play the checkout is the
# controller's). The admitted record rh_src_admission is a REGISTRY reserved_output (refuse_pinned_outputs.yml, the
# existing first-entry mechanism -- not a new blacklist), re-derived on every entry, and read back below.
# r2j (R2I-BOOTSTRAP-TRUST-ORDER, P4): the delegate comes from the launcher record rh_source_bootstrap (bound to the
# admitted bundle / genesis runner), never from a raw registry read; admit_loader_source.yml refuses unless the bound
# declaration declares that same delegate (the raw '/manifests/global.yml' read of r2i is REMOVED).
# records-staged-reader-01 (codex-tick740 / 747 / 751): this include is admission_stages executable_closure -- it binds
# the explicit PARTIAL admission rh_src_partial (source_admission.members_rel only). The role import below runs
# single_engine_document_reader and binds the completed receipt rh_src_admission INSIDE the one resolve, before its
# projection; the tasks after the import read the receipt back and construct nothing. The completed context
# rh_src_context is published after the reconciliation below.
- name: Admit the resolver / loader closure against the intended immutable commit BEFORE any loader import
  ansible.builtin.include_tasks:
    file: admit_loader_source.yml
    apply:
      # MR03 S11 (codex-tick647; MAIN genesis join a): the record-free cold entry carries no launch record and no delegate
      # before N2; it runs on its own controller play host, which admit_loader_source.yml binds to the N2-admitted
      # _rh_sa_decl.controller_delegate right after N2 (refused otherwise).
      # optb-after-04 (SR-290-29): rh_rp_input presence re-expressed in the presence-by-key form
      delegate_to: "{{ rh_source_bootstrap.controller_delegate if 'rh_rp_input' not in vars else inventory_hostname }}"

# RP07 (route resolve_policy-07; C1-INVOCATION-CONTEXT-01 S28-05 / S28-06; codex 895 F895, SR-302-10, SR-318-02): the
# include site's declared invocation requirement (source_admission.invocation requirement_var, a word of requirements)
# selects the engine invocation mode BEFORE resolve, read from the admitted declaration node _rh_sa_decl.invocation that
# the admission include above binds (OW-RP07-SADECL answered route-side; rh_early_view carries no launch context field).
# Effective leased = the requirement is leased, or the requirement is ordinary_permitted and the mode variable is present
# with the leased word (the run-local seed pin, run_local.pinned_vars). A leased invocation passes the lease read from the
# present resolved-run record (lease_from); a missing or malformed lease refuses HERE and never mints an ordinary run.
# Variable presence alone never selects the mode. The pointer words lease_from.var_from, capture_fields_from and
# capture_kinds_from are walked over the bound bootstrap node _rh_sa_bs with the ONE declared dotted-path join word
# source_admission.early_view.override.audit_join (no registry pointer grammar exists; OW-RP07-POINTER-GRAMMAR).
- name: "RP07-01a -- refuse an admitted source-admission declaration that carries no invocation node (texts.input)"
  ansible.builtin.assert:
    that:
      - "'invocation' in _rh_sa_decl"
      - _rh_sa_decl.invocation is mapping
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_sa_decl.refusals.input,
                               'rh_rf_detail': [_rh_sa_decl.texts.input, _rh_sa_decl | list | sort | to_json]}) }}
    quiet: true

# OP1B-RP-01 (route records-route-op1b-01; OW-OP1-RP-EARLY-NAME / LC-SR323-EARLY-NAME): the early check reads the
# include var NAME through the ONE registry early-name word contract_admission.early_names.rh_invocation_requirement.var
# (the guard-bound slice _rh_sa_reg, refuse_pinned_outputs; the als03 early-name presence form), and first proves the
# admitted declaration pointer invocation.requirement_var names the same var (registry equals_registry row), so the
# later reads of _rh_ip.requirement_var in this file read the registry-owned name.
- name: "RP07-01b -- refuse an include site that declares no invocation requirement word of the declared set (texts.requirement)"
  vars:
    _rh_ip: "{{ _rh_sa_decl.invocation }}"
    _rh_ip_rv: "{{ _rh_sa_reg.early_names.rh_invocation_requirement.var }}"
  ansible.builtin.assert:
    that:
      - _rh_ip.requirement_var == _rh_ip_rv
      - lookup('ansible.builtin.varnames', '^' ~ (_rh_ip_rv | regex_escape) ~ '$') == _rh_ip_rv
      - lookup('ansible.builtin.vars', _rh_ip_rv) is string
      - lookup('ansible.builtin.vars', _rh_ip_rv) in (_rh_ip.requirements.values() | list)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_ip.refusal,
                               'rh_rf_detail': [_rh_ip.texts.requirement, _rh_ip_rv, _rh_ip.requirement_var]}) }}
    quiet: true

- name: "RP07-01c -- refuse a present invocation mode outside the declared modes or other than the mode the requirement declares (texts.mode)"
  vars:
    _rh_ip: "{{ _rh_sa_decl.invocation }}"
  ansible.builtin.assert:
    that:
      - >-
        (lookup('ansible.builtin.varnames', '^' ~ (_rh_ip.mode_var | regex_escape) ~ '$') != _rh_ip.mode_var)
        or (lookup('ansible.builtin.vars', _rh_ip.mode_var) in (_rh_ip.modes.values() | list))
      - >-
        (lookup('ansible.builtin.varnames', '^' ~ (_rh_ip.mode_var | regex_escape) ~ '$') != _rh_ip.mode_var)
        or (lookup('ansible.builtin.vars', _rh_ip.requirement_var) != _rh_ip.requirements.leased)
        or (lookup('ansible.builtin.vars', _rh_ip.mode_var) == _rh_ip.modes.leased)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_ip.refusal,
                               'rh_rf_detail': [_rh_ip.texts.mode, _rh_ip.mode_var, _rh_ip.requirement_var]}) }}
    quiet: true

- name: "RP07-02a -- refuse a leased invocation whose resolved-run record is absent; no ordinary run is minted (texts.missing)"
  vars:
    _rh_ip: "{{ _rh_sa_decl.invocation }}"
    _rh_ip_rrp: "{{ _rh_sa_decl.invocation.lease_from.var_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_rr: "{{ _rh_ip_rrp[:1] | map('extract', _rh_sa_bs, _rh_ip_rrp[1:]) | first }}"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.varnames', '^' ~ (_rh_ip_rr | regex_escape) ~ '$') == _rh_ip_rr
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_ip.refusal,
                               'rh_rf_detail': [_rh_ip.texts.missing, _rh_ip_rr]}) }}
    quiet: true
  when: >-
    (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_sa_decl.invocation.requirements.leased)
    or ((lookup('ansible.builtin.varnames', '^' ~ (_rh_sa_decl.invocation.mode_var | regex_escape) ~ '$') == _rh_sa_decl.invocation.mode_var)
    and (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.mode_var) == _rh_sa_decl.invocation.modes.leased))

- name: "RP07-02b -- refuse a leased invocation whose lease is not exactly the declared capture fields (texts.malformed)"
  vars:
    _rh_ip: "{{ _rh_sa_decl.invocation }}"
    _rh_ip_rrp: "{{ _rh_sa_decl.invocation.lease_from.var_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_rr: "{{ _rh_ip_rrp[:1] | map('extract', _rh_sa_bs, _rh_ip_rrp[1:]) | first }}"
    _rh_ip_cp: "{{ _rh_sa_decl.invocation.capture_fields_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_cf: "{{ _rh_ip_cp[:1] | map('extract', _rh_sa_bs, _rh_ip_cp[1:]) | first }}"
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', _rh_ip_rr) is mapping
      - _rh_ip.lease_from.field in (lookup('ansible.builtin.vars', _rh_ip_rr) | list)
      - lookup('ansible.builtin.vars', _rh_ip_rr)[_rh_ip.lease_from.field] is mapping
      - (lookup('ansible.builtin.vars', _rh_ip_rr)[_rh_ip.lease_from.field] | list | sort) == (_rh_ip_cf | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_ip.refusal,
                               'rh_rf_detail': [_rh_ip.texts.malformed, _rh_ip_rr, _rh_ip_cf | to_json]}) }}
    quiet: true
  when: >-
    (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_sa_decl.invocation.requirements.leased)
    or ((lookup('ansible.builtin.varnames', '^' ~ (_rh_sa_decl.invocation.mode_var | regex_escape) ~ '$') == _rh_sa_decl.invocation.mode_var)
    and (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.mode_var) == _rh_sa_decl.invocation.modes.leased))

# RP07-03 / RP07-04: ONE engine entry, two mode-gated forms (exactly one runs). The leased form replaces the obsolete PI-02
# lme_profile_capture input (no C1 head reads it) with the engine caller inputs named by source_admission.invocation
# mode_var and lease_var; a YAML key cannot be read from the declaration, so those two keys are the declared words
# restated (HOLE-RP07-INPUT-KEYS). The ordinary form passes neither: the role defaults apply.
- name: Resolve through the shared engine entrypoint (profile remote-harness) -- RP07-03 leased invocation
  ansible.builtin.include_role:
    name: "{{ rh_repo_root }}/ansible/roles/podman"
    tasks_from: resolve
  vars:
    clone_directory: "{{ rh_repo_root }}"
    lme_manifests_dir: "{{ rh_repo_root }}/manifests"
    lme_profile: remote-harness
    lme_invocation_mode: "{{ _rh_sa_decl.invocation.modes.leased }}"
    lme_invocation_lease: >-
      {{ lookup('ansible.builtin.vars', (_rh_sa_decl.invocation.lease_from.var_from.split(_rh_sa_decl.early_view.override.audit_join))[:1]
      | map('extract', _rh_sa_bs, (_rh_sa_decl.invocation.lease_from.var_from.split(_rh_sa_decl.early_view.override.audit_join))[1:])
      | first)[_rh_sa_decl.invocation.lease_from.field] }}
  when: >-
    (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_sa_decl.invocation.requirements.leased)
    or ((lookup('ansible.builtin.varnames', '^' ~ (_rh_sa_decl.invocation.mode_var | regex_escape) ~ '$') == _rh_sa_decl.invocation.mode_var)
    and (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.mode_var) == _rh_sa_decl.invocation.modes.leased))

- name: Resolve through the shared engine entrypoint (profile remote-harness) -- RP07-04 ordinary invocation
  ansible.builtin.include_role:
    name: "{{ rh_repo_root }}/ansible/roles/podman"
    tasks_from: resolve
  vars:
    clone_directory: "{{ rh_repo_root }}"
    lme_manifests_dir: "{{ rh_repo_root }}/manifests"
    lme_profile: remote-harness
  when: >-
    not ((lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_sa_decl.invocation.requirements.leased)
    or ((lookup('ansible.builtin.varnames', '^' ~ (_rh_sa_decl.invocation.mode_var | regex_escape) ~ '$') == _rh_sa_decl.invocation.mode_var)
    and (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.mode_var) == _rh_sa_decl.invocation.modes.leased)))

# RP07-02c (HOLE-RP07-KIND-TESTS-PRE-RESOLVE): the kind-test map (resolved_run.capture_kinds_from, under the controller
# node) is not bound before resolve, so the per-field kind refusal runs here, after resolve and before any mutation by
# this helper; the engine's own PCTX admission of the same lease runs inside the resolve. Exactly one definition test
# must accept the value and none of its excludes may (the struct_kind_tests contract).
- name: "RP07-02c -- refuse a leased run context field whose value is not of its declared capture kind (texts.malformed)"
  vars:
    _rh_ip: "{{ _rh_sa_decl.invocation }}"
    _rh_ip_rrp: "{{ _rh_sa_decl.invocation.lease_from.var_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_lease: "{{ lookup('ansible.builtin.vars', _rh_ip_rrp[:1] | map('extract', _rh_sa_bs, _rh_ip_rrp[1:]) | first)[_rh_sa_decl.invocation.lease_from.field] }}"
    _rh_ip_cp: "{{ _rh_sa_decl.invocation.capture_fields_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_cf: "{{ _rh_ip_cp[:1] | map('extract', _rh_sa_bs, _rh_ip_cp[1:]) | first }}"
    _rh_ip_kp: "{{ _rh_sa_decl.invocation.capture_kinds_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_ck: "{{ _rh_ip_kp[:1] | map('extract', _rh_sa_bs, _rh_ip_kp[1:]) | first }}"
    _rh_ip_tp: "{{ lme_resolved.remote_harness.policy.controller.bootstrap.work_roots.run_local.resolved_run.capture_kinds_from.split(_rh_sa_decl.early_view.override.audit_join) }}"
    _rh_ip_kt: "{{ _rh_ip_tp[:1] | map('extract', lme_resolved.remote_harness.policy.controller, _rh_ip_tp[1:]) | first }}"
    _rh_ip_kx: "{% for e in _rh_ip_kt[_rh_ip_ck[item]].excludes %}{% if [_rh_ip_lease[item]] | select(e) | list | length > 0 %}{{ e }}{% endif %}{% endfor %}"
  ansible.builtin.assert:
    that:
      - _rh_ip_ck[item] in _rh_ip_kt
      - ([_rh_ip_lease[item]] | select(_rh_ip_kt[_rh_ip_ck[item]].test) | list | length) == 1
      - (_rh_ip_kx | length) == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': _rh_sa_bs.refusal_grammar,
                               'rh_rf_code': _rh_ip.refusal,
                               'rh_rf_detail': [_rh_ip.texts.malformed, item, _rh_ip_ck[item]]}) }}
    quiet: true
  loop: "{{ _rh_ip_cf }}"
  when: >-
    (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_sa_decl.invocation.requirements.leased)
    or ((lookup('ansible.builtin.varnames', '^' ~ (_rh_sa_decl.invocation.mode_var | regex_escape) ~ '$') == _rh_sa_decl.invocation.mode_var)
    and (lookup('ansible.builtin.vars', _rh_sa_decl.invocation.mode_var) == _rh_sa_decl.invocation.modes.leased))

# BYTES AT USE (post-import, stated LIMIT: this detects, it cannot un-run): the loader and every admitted member are
# re-hashed after the import and must still be the admitted observed digest (== the trusted blob of the intended commit).
- name: Re-hash the admitted source members after the loader import (controller checkout; no link followed)
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ rh_early_view[lme_resolved.remote_harness.source_admission.early_view.roles.context].path_separator ~ item }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ lme_resolved.remote_harness.source_admission.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  loop: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.members] | list | sort }}"
  delegate_to: "{{ lme_resolved.remote_harness.source_admission.controller_delegate }}"
  register: _rh_sa_use

- name: Refuse a loader or source member whose bytes changed between admission and use
  vars:
    _rh_sa_f: "{{ lme_resolved.remote_harness.source_admission }}"
    _rh_sa_m: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.members] }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_use.results | rejectattr('stat.exists') | list | length == 0
      - _rh_sa_use.results | map(attribute='stat.checksum') | list
        == (_rh_sa_m | list | sort | map('extract', _rh_sa_m) | map(attribute=_rh_sa_f.member_fields.observed) | list)
      - rh_src_admission[_rh_sa_f.record_fields.loader] == _rh_sa_f.loader_rel
    fail_msg: >-
      REFUSED {{ _rh_sa_f.refusals.member }}: {{ _rh_sa_f.texts.use }}
      {{ _rh_sa_m | list | sort | to_json }}
    quiet: true

# DOCUMENT VIEWS (br-fixed RR-02 / RR-03; codex OD-F05-01 / OD-F05-03 / OD-F05-12; tick522 F05S2-DOCUMENT-TRUST-BEFORE-
# CONSUMPTION: this is a LATER READBACK, never the first trust check -- the resolve.yml staged reader Git-admits every
# declared document before reading it (records-staged-reader-01), and the loader compares its retained exact bytes with the admitted digest before
# it parses them). Gated by the published contract (OD-S2-04). Active: both views are published, the document view
# names exactly the declared documents, each rel is an admitted member (checked before its digest is read) and its
# sha256 is that member's observed digest (exact bytes; a stripped read differs); the admitted members are exactly
# the loader members plus those rels; the entry_generation roster source is the ONE document with that rel (bound by
# rel, never by a document name). Inactive: neither view is published and no document node is declared (an admitted
# inactive profile; a missing admission under an active contract refuses here or earlier, never falls back).
# The re-hash above already covers every admitted document (they are rh_src_admission members).
- name: Refuse published document views that are not the admitted document bytes (readback; gated by the published contract)
  vars:
    _rh_sa_f: "{{ lme_resolved.remote_harness.source_admission }}"
    _rh_sa_m: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.members] }}"
    _rh_dc_on: "{{ lme_resolved.remote_harness.entry_generation_contract.active }}"
    # optb-after-04 (F-933): the published view is SELECTED, never manufactured: zero or one document_inputs node
    _rh_dc_vs: "{{ lme_resolved.remote_harness | dict2items | selectattr('key', 'equalto', 'document_inputs') | map(attribute='value') | list }}"
    _rh_dc_rows: "{{ _rh_dc_vs | select('mapping') | map('dict2items') | flatten(levels=1) | map(attribute='value') | list }}"
    _rh_dc_rels: "{{ _rh_dc_rows | map(attribute='rel') | list }}"
  ansible.builtin.assert:
    that:
      - _rh_dc_on is boolean
      - _rh_dc_on or ('document_inputs' not in lme_resolved.remote_harness and 'entry_generation' not in lme_resolved.remote_harness
                      and 'document_inputs' not in _rh_sa_f)
      - not _rh_dc_on or ('document_inputs' in lme_resolved.remote_harness and 'entry_generation' in lme_resolved.remote_harness
                          and 'document_inputs' in _rh_sa_f)
      - _rh_dc_vs | reject('mapping') | list | length == 0
      - not _rh_dc_on or (_rh_dc_vs | map('list') | flatten(levels=1) | sort) == (_rh_sa_f.document_inputs | list | sort)
      - _rh_dc_rows | reject('mapping') | list | length == 0
      - _rh_dc_rows | map('list') | map('sort') | reject('equalto', ['rel', 'sha256']) | list | length == 0
      - _rh_dc_rels | reject('string') | list | length == 0
      - _rh_dc_rels | reject('in', _rh_sa_m) | list | length == 0
      - _rh_dc_rows | map(attribute='sha256') | list
        == _rh_dc_rels | map('extract', _rh_sa_m) | map(attribute=_rh_sa_f.member_fields.observed) | list
      - (_rh_sa_m | list | sort) == ((_rh_sa_f.members_rel + _rh_dc_rels) | sort)
      - not _rh_dc_on or (_rh_dc_rows | selectattr('rel', 'equalto', lme_resolved.remote_harness.entry_generation.roster_source_rel)
                          | map(attribute='sha256') | list) == [lme_resolved.remote_harness.entry_generation.roster_source_sha256]
    fail_msg: >-
      REFUSED {{ _rh_sa_f.refusals.document }}: {{ _rh_sa_f.texts.document_view }}
      {{ [_rh_dc_on, _rh_dc_vs, _rh_sa_m | list | sort] | to_json }}
    quiet: true

- name: Refuse a resolution without the typed harness policy section (C1 projection; no fallback)
  ansible.builtin.assert:
    that:
      # optb-after-04 (F-933): presence by key in the presence form of ALS ea00724b (seat FW24-RS-PRESENCE), then
      # the type; no default filter and no fallback value
      - "'lme_resolved' in vars and lme_resolved is mapping"
      - "'remote_harness' in lme_resolved and lme_resolved.remote_harness is mapping"
      - "'schema_version' in lme_resolved.remote_harness and lme_resolved.remote_harness.schema_version == 3"
      - "'policy' in lme_resolved.remote_harness and lme_resolved.remote_harness.policy is mapping"
      - >-
        'policy_sha256' in lme_resolved.remote_harness and lme_resolved.remote_harness.policy_sha256 is string
        and lme_resolved.remote_harness.policy_sha256 is match('^[0-9a-f]{64}$')
      - >-
        'adapter' in lme_resolved.remote_harness and lme_resolved.remote_harness.adapter is mapping
        and 'tools' in lme_resolved.remote_harness.adapter and lme_resolved.remote_harness.adapter.tools is mapping
        and 'target.tools' in lme_resolved.remote_harness.adapter.tools and lme_resolved.remote_harness.adapter.tools['target.tools'] is mapping
      - "'lme_resolved_revision' in vars and lme_resolved_revision is string and lme_resolved_revision is match('^[0-9a-f]{64}$')"
      - "'lme_remote_harness_overridden_paths' in vars"
    fail_msg: >-
      REFUSED RH-POLICY-UNRESOLVED: the engine resolve produced no lme_resolved.remote_harness section of schema 3
      ({policy, policy_sha256, adapter.tools['target.tools']}) bound into lme_resolved_revision; the harness reads no policy from the raw profile (its ONE admitted raw read is the profile capture below).
    quiet: true

# resolve_policy-05 RP04-PI PROFILE CAPTURE (C1-PROFILE-IDENTITY-01; codex 882 SR-290-05; codex 885; C1
# records-c1-profile-identity-01 RP04-PI; replaces HOLE-RP04-PROFILE-IDENTITY of optb-after-04; AUTHORED, UNRUN). The
# profile this helper admits is its OWN capture, never the lock capture: controller.bootstrap.profile_capture over the
# declared profile (source_admission.bootstrap_input.declaration_rel, an admitted member) -- algorithm and membership
# check, stat under verify, the ONE read (exact bytes), text, digest, verify (require fields, stat digest, member
# observed digest), the ONE strict parse (lme_manifest_strict with the registry parse words; never from_yaml). Byte
# identity rests on the stat digest and the member observed digest of this one read; parsed equality asserts none.
# The comparison is with the engine-published identity addressed by its registry name and fields
# (remote_harness_schema.profile_identity.var, .fields): its path and sha256 must equal this capture's. That the
# published sha256 digests the bytes the engine actually loaded is the engine producer's to establish
# (OW-C1-PI-BYTE-BINDING-01); this comparison asserts only equality with the route's own capture. No second configuration
# merge: an admitted lme_global_override moves policy_sha256 / lme_resolved_revision (audited below), never the profile
# identity.
- name: "PI-01 refuse unless the profile capture uses the source admission digest algorithm and the profile is an admitted member (before the stat and the one read)"
  ansible.builtin.assert:
    that:
      - >-
        lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.digest_algorithm
        == lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.digest_algorithm
      - >-
        lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel
        in rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members]
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.refusal,
                               'rh_rf_detail': [lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel,
                                                lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.digest_algorithm,
                                                lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.digest_algorithm]}) }}
    quiet: true

- name: "PI-02 stat the declared profile before its one read (profile_capture.verify; no link followed)"
  ansible.builtin.stat:
    path: "{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel }}"
    follow: "{{ lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.follow }}"
    get_checksum: true
    checksum_algorithm: "{{ lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.digest_algorithm }}"
    get_mime: false
    get_attributes: false
  delegate_to: "{{ lme_resolved.remote_harness.source_admission.controller_delegate }}"
  register: _rh_prof_st

- name: "PI-03 refuse a profile that fails a profile_capture.verify require field before its one read (typed; no read)"
  ansible.builtin.assert:
    that:
      - >-
        (lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.require | select('in', _rh_prof_st.stat)
         | map('extract', _rh_prof_st.stat) | select('sameas', true) | list | length)
        == (lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.require | length)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.refusal,
                               'rh_rf_detail': [lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel,
                                                lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.require | to_json,
                                                _rh_prof_st.stat | to_json]}) }}
    quiet: true

- name: "PI-04 read the declared profile ONCE (exact bytes; the capture source)"
  ansible.builtin.slurp:
    src: "{{ rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel }}"
  delegate_to: "{{ lme_resolved.remote_harness.source_admission.controller_delegate }}"
  register: _rh_prof_raw

- name: "PI-05 capture the profile text (the decoded bytes of the one read, no strip)"
  ansible.builtin.set_fact:
    _rh_prof_cap:
      text: "{{ _rh_prof_raw.content | b64decode }}"

- name: "PI-06 digest the captured text (profile_capture sha256 by profile_capture.digest_algorithm; after the text)"
  ansible.builtin.set_fact:
    _rh_prof_cap: "{{ _rh_prof_cap | combine({'sha256': _rh_prof_cap.text | hash(lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.digest_algorithm)}) }}"

- name: "PI-07 refuse a capture that is not the regular file stat'ed here and the admitted member bytes (before the parse)"
  ansible.builtin.assert:
    that:
      - >-
        (lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.require | select('in', _rh_prof_st.stat)
         | map('extract', _rh_prof_st.stat) | select('sameas', true) | list | length)
        == (lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.require | length)
      - >-
        lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.digest_field in _rh_prof_st.stat
        and _rh_prof_st.stat[lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.verify.digest_field] == _rh_prof_cap.sha256
      - >-
        _rh_prof_cap.sha256
        == rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.member_fields.observed]
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.refusal,
                               'rh_rf_detail': [lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel, _rh_prof_cap.sha256, _rh_prof_st.stat | to_json]}) }}
    quiet: true

- name: "PI-08 parse the verified capture ONCE by the strict construction and refuse a capture that is not exactly the declared fields"
  ansible.builtin.assert:
    that:
      - (_rh_prof_cap.text | lme_manifest_strict(lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel, _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse)) is mapping
      - (_rh_prof_cap | list | sort) == (lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.fields | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.profile_capture.refusal,
                               'rh_rf_detail': [lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.bootstrap_input.declaration_rel, _rh_prof_cap | list | sort | to_json]}) }}
    quiet: true

- name: Refuse an engine resolve whose effective checkout or loaded profile is not this helper's admitted profile capture
  ansible.builtin.assert:
    that:
      - lme_profile == 'remote-harness'
      - lme_manifests_dir == rh_repo_root ~ '/manifests'
      # clone_directory only feeds the engine's lme_manifests_dir default, which this helper binds explicitly, so an
      # inventory/extra-var clone_directory (e.g. a shared LME inventory) is harmless here and is not refused
      - >-
