# context; record-free: the exact-shape rows of C1-SR-RP-03). No walk, no second render, nothing built from
# _rh_sa_in.context or the raw declaration. Protected output (reserved, C1-SR-GL-01). N1 compares its retained generated
# context with it type-strictly before initializer effects. The receipt rh_src_admission stays bound earlier, inside
