        _rh_lock_cap.sha256
        == rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members][_rh_lock_rel][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.member_fields.observed]
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.refusals.member,
                               'rh_rf_detail': [_rh_lock_rel, _rh_lock_cap.sha256,
                                                rh_src_admission[lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.record_fields.members][_rh_lock_rel][lme_resolved.remote_harness.policy.controller.bootstrap.source_admission.member_fields.observed]]}) }}
    quiet: true

- name: "NP-01 parse the verified capture ONCE (engine strict construction; lock_capture packages / collections mandatory)"
  ansible.builtin.set_fact:
    _rh_lock_cap: >-
      {%- set y = _rh_lock_cap.text | lme_manifest_strict(_rh_lock_rel, _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse) -%}
      {%- set m = lookup('ansible.builtin.template',
                         rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                         template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                                        'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,
                                        'rh_rf_detail': [_rh_lock_rel, lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields | to_json]}) -%}
      {{ _rh_lock_cap | combine({'packages': y.packages | mandatory(m), 'collections': y.collections | mandatory(m)}) }}

- name: "NP-01 refuse a lock capture that is not exactly the declared capture (keys == lock_capture.fields; rows are lists)"
  ansible.builtin.assert:
    that:
      - (_rh_lock_cap | list | sort) == (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields | sort)
      - (_rh_lock_cap | list | length) == (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields | length)
      - _rh_lock_cap.packages is sequence and _rh_lock_cap.packages is not string and _rh_lock_cap.packages is not mapping
      - _rh_lock_cap.collections is sequence and _rh_lock_cap.collections is not string and _rh_lock_cap.collections is not mapping
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,
                               'rh_rf_detail': [_rh_lock_rel, _rh_lock_cap | list | sort | to_json, lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.fields | to_json]}) }}
    quiet: true

# optb-after-04 (codex 882 SR-290-04; C1 records-dkjoin-02 C1-DKJ2-RP-02R wording): rh_seed_lock IS the admitted
# capture _rh_lock_cap = {text, sha256, packages, collections} -- the ONE strict parse (lme_manifest_strict) of the
# verified text above, shape-checked against lock_capture.fields. The second file read and from_yaml are removed; no
# re-parse, no subset and no added field. resolve_policy-05 (RP04-PI): rh_profile_sha256 is _rh_prof_cap.sha256, the
# exact-file-bytes digest of the profile capture above (profile_capture.digest_of); the rstripped second read is removed.
- name: Publish the resolved harness policy, its revisions and the lock (derived outputs; pre-supply refused at entry)
  ansible.builtin.set_fact:
    rh: "{{ lme_resolved.remote_harness.policy }}"
    rh_config_revision: "{{ lme_resolved.remote_harness.policy_sha256 }}"
    rh_engine_revision: "{{ lme_resolved_revision }}"
    rh_profile_sha256: "{{ _rh_prof_cap.sha256 }}"
    rh_seed_lock: >-
      {{ _rh_lock_cap }}

# FR-CONSTRUCTION OD-CON-01 (codex-tick631; codex-tick637): RESOLVED-VALUE admission of the ONE construction map at the
# FIRST point the resolved node exists (rh, published above) and before every consumer, render and package step. Every
# POLICY field's key path is walked step by step over the RESOLVED controller.bootstrap; a missing step, or a value not
# accepted by EXACTLY ONE definition of entry_generation.struct_kind_tests equal to its declared record_kinds word, refuses.
# No second resolver. Ungated (every resolve). _rh_sa_cb / _rh_sa_cbad are REGISTRY reserved_outputs: a pre-supplied value
# (extra-var / inventory) is refused at first entry (refuse_pinned_outputs.yml), so the assert cannot be voided.
- name: Refuse a construction policy field whose resolved value is absent or not its declared kind (before any consumer)
  vars:
    _rh_sa_cb: "{{ rh.controller.bootstrap.source_admission.bootstrap_input }}"
    _rh_sa_cbad: >-
      {%- set cm = _rh_sa_cb.construction -%}
      {%- set ns = namespace(bad=[]) -%}
      {%- for k, c in cm.fields | dictsort if c.source == cm.sources.policy -%}
      {%- set w = namespace(ok=true, v=rh.controller.bootstrap, n=0, hits=[]) -%}
      {%- for s in c.path -%}{%- if w.ok and w.v is mapping and s in w.v -%}{%- set w.v = w.v[s] -%}{%- set w.n = w.n + 1 -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if w.ok -%}{%- for t in rh.controller.entry_generation.struct_kind_tests | dict2items -%}
      {%- set m = namespace(hit=([w.v] | select(t.value.test) | list | length == 1)) -%}
      {%- for x in t.value.excludes -%}{%- if [w.v] | select(x) | list | length > 0 -%}{%- set m.hit = false -%}{%- endif -%}{%- endfor -%}
      {%- if m.hit -%}{%- set w.hits = w.hits + [t.key] -%}{%- endif -%}
      {%- endfor -%}{%- endif -%}
      {%- if not w.ok or w.hits != [_rh_sa_cb.record_kinds[k]] -%}{%- set ns.bad = ns.bad + [[k, c.path, w.n, _rh_sa_cb.record_kinds[k], w.hits]] -%}{%- endif -%}
      {%- endfor -%}{{ ns.bad }}
  ansible.builtin.assert:
    that:
      - _rh_sa_cbad | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.source_admission.refusals.input }}: {{ rh.controller.bootstrap.source_admission.texts.construction }}
      {{ _rh_sa_cbad | to_json }}
    quiet: true

# records-context-macro-join-01 (codex-tick754 context_ruling): ONE construction of the complete early-view context over
# the RESOLVED rh.controller.bootstrap, after the normal projection above and before the reconciliation below. It is the
# existing bootstrap_context(bs) macro (controller.bootstrap.macros_rel) reached through the declared entrypoint
# source_admission.launch_record_readback.context_template (rel; input = the ONE template var carrying bs). Both rels are
# source_admission members, admitted by the receipt before the projection. Its JSON is decoded ONCE into the protected
# intermediate _rh_sa_cx (reserved: a pre-supplied value is refused at first entry). The reconciliation selects its early /
# launch subsets from it by the declared field-name sets; rh_src_context is assigned from it after the reconciliation.
- name: Construct the complete early-view context once (complete_projection_and_carrier; bootstrap_context over the resolved bootstrap)
  ansible.builtin.set_fact:
    _rh_sa_cx: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.source_admission.launch_record_readback.context_template.rel,
                template_vars={rh.controller.bootstrap.source_admission.launch_record_readback.context_template.input: rh.controller.bootstrap}) | from_json }}

- name: Read-back guard -- the one construction is exactly the declared context field sets (decoded once; no second render)
  ansible.builtin.assert:
    that:
      - _rh_sa_cx is mapping
      - >-
        (_rh_sa_cx.keys() | list | sort)
        == (((lme_resolved.remote_harness.source_admission.early_view.context_fields.keys() | list)
             + (lme_resolved.remote_harness.source_admission.early_view.launch_context_fields.keys() | list)) | sort)
    fail_msg: >-
      REFUSED {{ lme_resolved.remote_harness.source_admission.early_view.refusal }}: {{ lme_resolved.remote_harness.source_admission.early_view.text }}
      {{ _rh_sa_cx | to_json }}
    quiet: true

# EARLY/RESOLVED RECONCILIATION (codex-tick440 "derive early and resolved views from that same bound declaration";
# codex-tick446 option c "reconcile it with the later authoritative loader/artifact projection"). r2k
# R2J-EFFECTIVE-OVERRIDE-BINDING (codex-tick454): the r2j C1-R2J-13 non-tunable freeze is WITHDRAWN; the base / profile /
# operator composition is preserved and the early view is the EFFECTIVE selection (admit_loader_source.yml composes
# the admitted override layer before use). Here the resolver's composition must equal it: every early context field ==
# the resolved node; the selected git / env tools (path + identity as admitted and run) == the resolved os_tools; the
# resolver's COMPLETE typed context == the admitted launch-binding carrier rh_source_bootstrap.context (r2k
# X_R1_S10_1; replaces the withdrawn override digest), and the resolver's audited overridden leaves under that path (lme_remote_harness_overridden_paths,
# re-rooted by early_view.override.audit_root -- dependency R2K-DEP-OVERRIDDEN-PATHS-FORM) are exactly the early
# override_paths. An override changed between the two, or a resolver composing differently, refuses here.
# r2l (codex-tick473): override_paths are now read at the override layer's own root (early_view.override.layer_root,
# R2K-OVERRIDE-ROOT), so a valid override yields the same leaves here and early; the admitted tool record must also
# equal the launch record's tool contract (R2K-TOOL-FIRST-USE-BINDING).
- name: Refuse a resolved view that is not the effective selection the early view bound
  vars:
    _rh_sa_f: "{{ lme_resolved.remote_harness.source_admission }}"
    _rh_ev: "{{ rh_early_view[lme_resolved.remote_harness.source_admission.early_view.roles.context] }}"
    _rh_eb: "{{ rh_early_view[lme_resolved.remote_harness.source_admission.early_view.roles.binding] }}"
    _rh_ovd: "{{ lme_resolved.remote_harness.source_admission.early_view.override }}"
    # records-context-macro-join-01 (codex-tick754): the early subset (context_fields) and the LAUNCH subset
    # (launch_context_fields; the raw early view never projects them, so they join only the carrier comparison below) are
    # SELECTED from the ONE construction _rh_sa_cx by the declared field-name sets. No key-path walk remains here.
    _rh_ctx: "{{ _rh_sa_cx | dict2items | selectattr('key', 'in', _rh_sa_f.early_view.context_fields.keys() | list) | items2dict }}"
    _rh_lctx: "{{ _rh_sa_cx | dict2items | selectattr('key', 'in', _rh_sa_f.early_view.launch_context_fields.keys() | list) | items2dict }}"
    _rh_audit: >-
      {{ lme_remote_harness_overridden_paths | select('match', '^' ~ (_rh_ovd.audit_root | regex_escape)) | map('regex_replace', '^' ~ (_rh_ovd.audit_root | regex_escape), '') | sort | list }}
    _rh_early_audit: "{{ _rh_eb.override_paths | map('join', _rh_ovd.audit_join) | sort | list }}"
    _rh_tools: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.tool] }}"
  ansible.builtin.assert:
    that:
      - _rh_sa_f == rh.controller.bootstrap.source_admission
      - _rh_ev == _rh_ctx
      - _rh_sa_f.tool_roles | dict2items | rejectattr('value', 'in', rh.controller.bootstrap.os_tools) | list | length == 0
      - _rh_sa_f.tool_roles.keys() | map('extract', _rh_tools) | map(attribute=_rh_sa_f.tool_fields.path) | list
        == _rh_sa_f.tool_roles.values() | map('extract', rh.controller.bootstrap.os_tools) | map(attribute='path') | list
      - _rh_sa_f.tool_roles.keys() | map('extract', _rh_tools) | map(attribute=_rh_sa_f.tool_fields.sha256) | list
        == _rh_sa_f.tool_roles.values() | map('extract', rh.controller.bootstrap.os_tools) | map(attribute='identity') | map(attribute='sha256') | list
      # r2k X_R1_S10_1: the NORMAL loader's result equals the admitted launch-binding carrier, type-strict (one valid
      # effective override changes both together; the r2k override digest is withdrawn)
      # brr-follow (S3-SEAM-03 consumer :199): the carrier = context_fields walk UNION launch_context_fields walk (disjoint)
      - _rh_ctx.keys() | intersect(_rh_lctx.keys() | list) | list | length == 0
      # records-context-macro-join-01 (codex-tick754): disjoint (above) and together exactly the one construction, type-aware,
      # so the value reconciled here is the value rh_src_context publishes after this assert
      - (_rh_ctx | combine(_rh_lctx)) | lme_type_aware_equal(_rh_sa_cx)
      # records-ctx-producer-02 (codex-tick740): this assert is admission_stages complete_projection_and_carrier -- it runs after
      # the ONE resolve, i.e. after the single engine document reader admitted the declared document set. Full phase: the
      # launch record context (bound as _rh_sa_in) equals the fresh projection, as before. Record-free phase: the cold carrier
      # never carried context (absent before the reader); the fresh projection _rh_ctx + _rh_lctx (the bootstrap_context(bs)
      # construction over the resolved node) IS its complete context, and the rows below admit its exact shape. N1 compares
      # its generated carrier with this fresh projection on its own side (codex-tick740; genesis G-03).
      # optb-after-04 (SR-290-29): rh_rp_input presence re-expressed in the presence-by-key form
      - "'rh_rp_input' in vars or ((_rh_ctx | combine(_rh_lctx)) | to_json(sort_keys=true)) == (_rh_sa_in.context | to_json(sort_keys=true))"
      - "'rh_rp_input' not in vars or (_rh_sa_in.keys() | list | intersect(_rh_sa_f.carrier_state_schema.complete_only) | length) == 0"
      # former A6, at the complete stage: the exact context-key row, then each launch-bound field by its declared selector
      - >-
        ((_rh_ctx | combine(_rh_lctx)).keys() | list | sort)
        == (((_rh_sa_f.early_view.context_fields.keys() | list) + (_rh_sa_f.early_view.launch_context_fields.keys() | list)) | sort)
      - >-
        _rh_sa_f.early_view.document_rels_field is string
        and _rh_sa_f.early_view.document_rels_field in _rh_sa_f.early_view.launch_context_fields
        and _rh_lctx[_rh_sa_f.early_view.document_rels_field] is mapping
      - >-
        _rh_sa_f.early_view.git_field is string
        and _rh_sa_f.early_view.git_field in _rh_sa_f.early_view.launch_context_fields
        and _rh_lctx[_rh_sa_f.early_view.git_field] is mapping
      # records-staged-reader-01 (codex-tick747 RF-GIT): the ENTIRE protected Git node the executable_closure stage and the
      # reader ran (the receipt's) equals the completed projection, on both phases (full: the launch-bound node, equal
      # before use by C1-SR-ALS-08; record-free: the N2 digest-bound node, so this is not two fresh copies of one input).
      - (_rh_lctx[_rh_sa_f.early_view.git_field] | to_json(sort_keys=true)) == (rh_src_admission[_rh_sa_f.record_fields.git] | to_json(sort_keys=true))
      - >-
        _rh_sa_f.early_view.rel_path_field is string
        and _rh_sa_f.early_view.rel_path_field in _rh_sa_f.early_view.launch_context_fields
        and _rh_lctx[_rh_sa_f.early_view.rel_path_field] is mapping
      # codex-tick740 empty_prefix: the reader's empty prefix never satisfies an active complete documents map; under an
