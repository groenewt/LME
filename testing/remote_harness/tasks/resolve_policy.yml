- name: "NP-01 refuse a lock that fails a lock_capture.verify require field before its one read (typed; no read)"
  ansible.builtin.assert:
    that:
      - >-
        (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require | select('in', _rh_lock_st.stat)
         | map('extract', _rh_lock_st.stat) | select('sameas', true) | list | length)
        == (lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.verify.require | length)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
