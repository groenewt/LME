      {{ lookup('ansible.builtin.template',
                rh_repo_root ~ lme_resolved.remote_harness.policy.controller.bootstrap.path_admission.separator ~ lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': lme_resolved.remote_harness.policy.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': lme_resolved.remote_harness.policy.controller.bootstrap.lock_capture.refusal,
                               'rh_rf_detail': [_rh_lock_rel, _rh_lock_cap.sha256, _rh_lock_st.stat | to_json]}) }}
    quiet: true

# optb-after-03 B-CTL-2 (records-lock-trust-01 LT-CTL): the stat above proves the captured bytes are the regular file at
# the path in this flow; this row proves they are the bytes the loader admitted at the admitted edition (the member's
# observed digest == its committed blob). A lock replaced after loader admission refuses here (C-LT-CTL-RACE).
- name: "NP-01 B-CTL-2 refuse a capture whose digest is not the admitted member's observed digest (after the verify; before the parse and publish)"
  ansible.builtin.assert:
