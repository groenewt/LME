- name: Publish the completed context (complete_projection_and_carrier; after the reconciliation; protected output)
  ansible.builtin.set_fact:
    rh_src_context: "{{ _rh_sa_cx }}"

- name: Read-back guard -- the visible completed context is the one construction (type-aware; untamperable)
  ansible.builtin.assert:
