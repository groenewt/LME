---
# testing/remote_harness/tasks/resolve_harness.yml -- CONTROLLER-side policy + executor binding for every route
# playbook that runs under the managed toolchain (never for package.yml, which may run at genesis).
#
# RH-ACTUAL-EXECUTABLE-SELECTION: the executor must be the managed generation of the DECLARED root
# (inventory host vars lme_toolchain_root / lme_toolchain_owner, no default), started by `seed run` or with the
# identical environment: the declared core on the pinned interpreter, ANSIBLE_CONFIG = the sealed generation
# ansible.cfg and ANSIBLE_COLLECTIONS_PATH = the generation collections. Ambient executors are refused.

- name: Resolve the harness policy through the engine
  ansible.builtin.include_tasks: resolve_policy.yml
  vars:
    rh_rp_caller: testing/remote_harness/tasks/resolve_harness.yml
    rh_invocation_requirement: "{{ _rh_sa_decl.invocation.requirements.ordinary_permitted }}"

- name: Capture the selected managed-controller recipe lock from its admitted source
  ansible.builtin.include_tasks: capture_recipe_lock.yml
  vars:
    rh_capture_role: "{{ rh.controller.bootstrap.bundle.payload_role }}"
    rh_capture_binding: "{{ lme_resolved.remote_harness.generation_bindings[rh.controller.bootstrap.bundle.payload_role] }}"

- name: Verify the declared root's toolchain receipt against a fresh render of the declarations
  ansible.builtin.include_tasks: verify_toolchain_receipt.yml
  vars:
    rh_tc_root: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.root_var, default='') }}"
    rh_tc_owner: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.inventory.owner_var, default='') }}"
    rh_tc_role: "{{ rh.controller.bootstrap.bundle.payload_role }}"
    rh_tc_lock: "{{ rh_recipe_lock }}"

- name: Publish the managed controller toolchain (binding member of every receipt)
  ansible.builtin.set_fact:
    rh_controller_toolchain: "{{ rh_toolchain }}"
    rh_owned_root: "{{ rh_toolchain.root }}"
    rh_controller_recipe: "{{ {'role': rh.controller.bootstrap.bundle.payload_role, 'leg': lme_resolved.remote_harness.generation_bindings[rh.controller.bootstrap.bundle.payload_role].leg, 'recipe_sha256': lme_resolved.remote_harness.generation_bindings[rh.controller.bootstrap.bundle.payload_role].recipe_sha256} }}"

- name: Refuse any executor that is not the declared root's managed generation (RH-CONTROLLER-TOOLCHAIN-UNSUPPORTED)
  ansible.builtin.assert:
    that:
      - ansible_version.full == lme_resolved.remote_harness.toolchain_renderers[rh.controller.bootstrap.bundle.payload_role].controller.expect_core
      # codex-tick853: the executor is the SELECTED test-controller leg; the builder receipt is never proof of it
      - rh_tc_expected.recipe_sha256 == lme_resolved.remote_harness.generation_bindings[rh.controller.bootstrap.bundle.payload_role].recipe_sha256
      - ansible_playbook_python == rh_controller_toolchain.python
      - lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') == rh_controller_toolchain.collections_path
      - lookup('ansible.builtin.env', 'ANSIBLE_CONFIG') == rh_controller_toolchain.ansible_config
      - (ansible_config_file | default('')) == rh_controller_toolchain.ansible_config
    fail_msg: >-
      REFUSED RH-CONTROLLER-TOOLCHAIN-UNSUPPORTED: executor core {{ ansible_version.full }} at {{ ansible_playbook_python }} (ANSIBLE_CONFIG
      {{ lookup('ansible.builtin.env', 'ANSIBLE_CONFIG') }}, loaded config file {{ ansible_config_file | default('none') }},
      ANSIBLE_COLLECTIONS_PATH
      {{ lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') }}) is not the managed generation of the declared
      root ({{ rh_controller_toolchain.python }}, {{ rh_controller_toolchain.ansible_config }},
      {{ rh_controller_toolchain.collections_path }}). Start it with `lme-controller-seed.sh run --root <root> -- ...`.
    quiet: true
