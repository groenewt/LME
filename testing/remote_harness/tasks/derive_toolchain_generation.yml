---
# testing/remote_harness/tasks/derive_toolchain_generation.yml -- the ONE controller-seed generation identity/location
# recipe (brr-follow successor; codex-tick542 GEN-STABLE-GENERATION, codex-tick543 OD-S3-08 / OD-BRR-10 / OD-BRR-11).
# Moved VERBATIM in substance out of tasks/verify_toolchain_receipt.yml (which now includes this file) so that every
# consumer -- the receipt verifier, admit_builder.yml (the genesis builder binding, which needs the generation's python
# BEFORE its first module) and the genesis entry render -- applies the SAME rule and no second formula exists.
#
# Controller-side only: assert + set_fact (action plugins; no module, no interpreter discovery, no read of the
# generation). It derives the EXPECTATION from a fresh render of the declarations, never from a receipt; the receipt
# verifier then binds the installed generation to it.
#
# Requires, earlier in the play: tasks/refuse_pinned_outputs.yml (rh_repo_root), tasks/resolve_policy.yml (rh,
# rh_seed_lock, rh_tc_recipes). Inputs (no default): rh_tc_root -- the toolchain root; rh_tc_role -- the recipe role
# (codex-tick853 option (a): builder | test, the keys of rh_tc_recipes from tasks/admit_toolchain_recipe.yml). Every
# recipe value below is read from that ONE admitted role context, never from controller.* directly. Outputs:
# rh_tc_recipe (the role's admitted recipe), rh_tc_expected {seed_sha256, generation, role, leg, recipe_sha256},
# _rh_tc_gen (the generation directory).

- name: Admit the declared toolchain root with the ONE path-admission rule (no default)
  ansible.builtin.assert:
    that:
      - rh_tc_root is string
      - rh_tc_root is match(rh.controller.bootstrap.path_admission.regex)
      - rh_tc_root is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
    fail_msg: >-
      REFUSED RH-TOOLCHAIN-RECEIPT: {{ rh.controller.bootstrap.inventory.root_var }} must be a normalized absolute path
      matching {{ rh.controller.bootstrap.path_admission.regex }} with no forbidden segment.
    quiet: true

- name: Admit the recipe role and bind its admitted recipe (codex-tick853; no default, no fallback)
  ansible.builtin.assert:
    that:
      - rh_tc_role is string
      - rh_tc_recipes is mapping and rh_tc_role in rh_tc_recipes
    fail_msg: >-
      REFUSED RH-TOOLCHAIN-RECIPE: rh_tc_role must name an admitted recipe role ({{ rh_tc_recipes | list | to_json }});
      the generation of an unnamed or unknown role is never derived.
    quiet: true

- name: Bind the role recipe every derivation below reads
  ansible.builtin.set_fact:
    rh_tc_recipe: "{{ rh_tc_recipes[rh_tc_role] }}"

- name: Derive the expected installation from a fresh render of the declarations (never from the receipt)
  ansible.builtin.set_fact:
    rh_tc_expected:
      seed_sha256: >-
        {{ lookup('ansible.builtin.template', rh_repo_root ~ '/' ~ rh.controller.bootstrap.template_rel,
                  template_vars={'lme_seed_bs': rh_tc_recipe.bs, 'lme_seed_ctl': rh_tc_recipe.ctl,
                                 'lme_seed_lock': rh_tc_recipe.lock}
                                | combine({'lme_seed_dispatch': rh.controller.entry_generation.dispatch}
                                          if rh.controller.bootstrap.source_admission.dispatch_admission.mode == rh.controller.bootstrap.source_admission.dispatch_modes.generation else {})) | hash('sha256') }}

- name: Derive the expected generation id and directory from the declared root
  ansible.builtin.set_fact:
    rh_tc_expected: >-
      {{ rh_tc_expected | combine({'generation': 'core' ~ rh_tc_recipe.ctl.expect_core ~ '-py' ~ rh_tc_recipe.bs.python.version
                                    ~ '-uv' ~ rh_tc_recipe.bs.uv.version ~ '-' ~ rh_tc_expected.seed_sha256[:12],
                                   'role': rh_tc_role, 'leg': rh_tc_recipe.leg, 'recipe_sha256': rh_tc_recipe.recipe_sha256}) }}
    _rh_tc_gen: >-
      {{ rh_tc_root ~ '/' ~ rh_tc_recipe.bs.layout.generations_dir ~ '/core' ~ rh_tc_recipe.ctl.expect_core
         ~ '-py' ~ rh_tc_recipe.bs.python.version ~ '-uv' ~ rh_tc_recipe.bs.uv.version ~ '-'
         ~ rh_tc_expected.seed_sha256[:12] }}
