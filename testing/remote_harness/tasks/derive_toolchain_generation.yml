---
# testing/remote_harness/tasks/derive_toolchain_generation.yml -- the ONE controller-seed generation identity/location
# recipe (brr-follow successor; codex-tick542 GEN-STABLE-GENERATION, codex-tick543 OD-S3-08 / OD-BRR-10 / OD-BRR-11).
# Moved VERBATIM in substance out of tasks/verify_toolchain_receipt.yml (which now includes this file) so that every
# consumer -- the receipt verifier, admit_builder.yml (the genesis builder binding, which needs the generation's python
# BEFORE its first module) and the genesis entry render -- applies the SAME rule and no second formula exists.
#
# Controller-side only: assert + set_fact (action plugins; no module, no interpreter discovery, no read of the
# generation). It derives the EXPECTATION from a fresh render of the declarations, never from a receipt; the receipt
# verifier then binds the installed generation to it.
#
# Requires the existing resolved section with toolchain_renderers and generation_bindings.
# Inputs: rh_tc_root, rh_tc_role, rh_tc_lock (a captured lock whose digest matches the
# role binding). Every renderer value comes from the existing engine; no selector,
# manifest read, desired-state merge or receipt-sourced expectation occurs here.

- name: Admit the declared toolchain root with the ONE path-admission rule (no default)
  ansible.builtin.assert:
    that:
      - rh_tc_root is string
      - rh_tc_root is match(rh.controller.bootstrap.path_admission.regex)
      - rh_tc_root is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
    fail_msg: >-
      REFUSED RH-TOOLCHAIN-RECEIPT: {{ rh.controller.bootstrap.inventory.root_var }} must be a normalized absolute path
      matching {{ rh.controller.bootstrap.path_admission.regex }} with no forbidden segment.
    quiet: true

- name: Admit the engine-published recipe renderer and its source-bound captured lock
  ansible.builtin.assert:
    that:
      - rh_tc_role is string
      - rh_tc_role in lme_resolved.remote_harness.toolchain_renderers
      - rh_tc_role in lme_resolved.remote_harness.generation_bindings
      - rh_tc_lock is mapping
      - (rh_tc_lock | list | sort) == (rh.controller.bootstrap.lock_capture.fields | sort)
      - rh_tc_lock.sha256 == lme_resolved.remote_harness.generation_bindings[rh_tc_role].lock_sha256
      - (rh_tc_lock.text | hash(rh.controller.bootstrap.lock_capture.digest_algorithm)) == rh_tc_lock.sha256
    fail_msg: >-
      {{ lookup(rh.controller.bootstrap.refusal_grammar.plugin,
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.lock_capture.refusal,
                               'rh_rf_detail': [rh_tc_role]}) }}
    quiet: true

- name: Bind the existing engine renderer and captured lock without recipe selection or merge
  ansible.builtin.set_fact:
    rh_tc_recipe:
      ctl: "{{ lme_resolved.remote_harness.toolchain_renderers[rh_tc_role].controller }}"
      bs: "{{ lme_resolved.remote_harness.toolchain_renderers[rh_tc_role].controller.bootstrap }}"
      lock: "{{ rh_tc_lock }}"
      role: "{{ rh_tc_role }}"
      leg: "{{ lme_resolved.remote_harness.generation_bindings[rh_tc_role].leg }}"
      recipe_sha256: "{{ lme_resolved.remote_harness.generation_bindings[rh_tc_role].recipe_sha256 }}"

# Native composition: the existing authoring caller's pin is an exact declaration,
# not a caller-selected seed. Admission is read-only and keeps the recipe's role.
- name: Admit the authoring pin only at its declared root and recipe role
  ansible.builtin.assert:
    that:
      - rh_tc_pin is mapping
      - rh_tc_pin | lme_type_aware_equal(dict(rh.controller.bootstrap.genesis.builder.authoring.pin.fields | zip(rh.controller.bootstrap.genesis.builder.authoring.pin.fields | map('extract', rh.controller.bootstrap.genesis.builder.authoring))))
      - rh_tc_role == rh.controller.bootstrap.genesis.builder.toolchain_role
      - rh_tc_root == lme_resolved[_lme_global_file.lme_config_registry.remote_harness_schema.policy_key][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.to][_lme_global_file.lme_config_registry.remote_harness_schema.authoring_location.fields.root]
    fail_msg: >-
      {{ lookup(rh.controller.bootstrap.refusal_grammar.plugin,
                rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.genesis.builder.authoring.refusal,
                               'rh_rf_detail': [rh.controller.bootstrap.genesis.builder.authoring.texts.pin]}) }}
    quiet: true
  when: "'rh_tc_pin' in vars"

- name: Derive the authoring expectation from its admitted declaration pin
  ansible.builtin.set_fact:
    rh_tc_expected: "{{ rh_tc_pin }}"
  when: "'rh_tc_pin' in vars"

- name: Derive the expected installation from a fresh render of the declarations (never from the receipt)
  ansible.builtin.set_fact:
    rh_tc_expected:
      seed_sha256: >-
        {{ lookup(rh_tc_recipe.bs.seed_render.plugin, rh_repo_root ~ rh_tc_recipe.bs.path_admission.separator ~ rh_tc_recipe.bs.template_rel,
                  template_vars={'lme_seed_bs': rh_tc_recipe.bs, 'lme_seed_ctl': rh_tc_recipe.ctl,
                                 'lme_seed_lock': rh_tc_recipe.lock}
                                | combine({'lme_seed_dispatch': rh.controller.entry_generation.dispatch}
                                          if rh.controller.bootstrap.source_admission.dispatch_admission.mode == rh.controller.bootstrap.source_admission.dispatch_modes.generation else {})) | hash(rh_tc_recipe.bs.seed_render.digest_algorithm) }}
  when: "'rh_tc_pin' not in vars"

# Read the existing declared order/prefix/source grammar against the engine-selected
# renderer. Digest source words name fields of the admitted expectation; no second
# recipe selector, version table or literal generation format is introduced.
- name: Derive the expected generation id and directory from the declared root
  ansible.builtin.set_fact:
    rh_tc_expected: >-
      {%- set gi = rh_tc_recipe.bs.layout.generation_id -%}
      {%- set generation = namespace(value='') -%}
      {%- for role in gi.order -%}
      {%- if 'digest' in gi.sources[role] -%}
      {%- set value = rh_tc_expected[gi.sources[role].digest][:gi.seed_digest_chars] -%}
      {%- else -%}
      {%- set walk = namespace(value=rh_tc_recipe.ctl) -%}
      {%- for segment in gi.sources[role].policy.split(rh_tc_recipe.bs.source_admission.early_view.override.audit_join) -%}
      {%- set walk.value = walk.value[segment] -%}
      {%- endfor -%}
      {%- set value = walk.value -%}
      {%- endif -%}
      {%- set generation.value = generation.value ~ gi.prefixes[role] ~ value -%}
      {%- endfor -%}
      {{ rh_tc_expected | combine({'generation': generation.value,
                                   'role': rh_tc_role, 'leg': rh_tc_recipe.leg,
                                   'recipe_sha256': rh_tc_recipe.recipe_sha256}) }}

- name: Bind the expected generation directory using the already derived generation
  ansible.builtin.set_fact:
    _rh_tc_gen: >-
      {{ [rh_tc_root, rh_tc_recipe.bs.layout.generations_dir, rh_tc_expected.generation]
         | join(rh_tc_recipe.bs.path_admission.separator) }}
