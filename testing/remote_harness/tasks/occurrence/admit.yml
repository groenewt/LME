- name: Clear supervision before attempting a new occurrence admission
  ansible.builtin.set_fact:
    "{{ rh_fw_occurrence_contract.output_fact }}": "{{ rh_fw_occurrence_contract.structural.absent }}"

- name: Require the exact immutable occurrence reference
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.input }}"
    that:
      - rh_fw_occurrence_reference is mapping
      - rh_fw_occurrence_reference.keys() | list | sort == rh_fw_occurrence_contract.reference_fields | sort
      - rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] is regex(rh_fw_occurrence_contract.patterns.absolute, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] is not search(rh_fw_occurrence_contract.patterns.forbidden_path)
      - rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] == ([rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory], rh_fw_occurrence_contract.artifacts.basename] | path_join)
      - rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.sha256] is regex(rh_fw_occurrence_contract.patterns.digest, match_type=rh_fw_occurrence_contract.patterns.match_type)

- name: Observe finalized occurrence without following links
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
    checksum_algorithm: "{{ rh_fw_occurrence_contract.structural.digest }}"
  register: _rh_fw_occurrence_snapshot_before

- name: Require finalized file identity and exact digest
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.bytes }}"
    that:
      - _rh_fw_occurrence_snapshot_before.stat.exists and _rh_fw_occurrence_snapshot_before.stat.isreg
      - not _rh_fw_occurrence_snapshot_before.stat.islnk
      - _rh_fw_occurrence_snapshot_before.stat.nlink == rh_fw_occurrence_contract.structural.one
      - _rh_fw_occurrence_snapshot_before.stat.mode == rh_fw_occurrence_contract.artifacts.mode
      - _rh_fw_occurrence_snapshot_before.stat.uid == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid]
      - _rh_fw_occurrence_snapshot_before.stat.checksum == rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.sha256]

- name: Read exact immutable occurrence bytes
  ansible.builtin.slurp:
    src: "{{ rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] }}"
  register: _rh_fw_occurrence_snapshot_read

- name: Resolve the finalized snapshot ancestry
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_snapshot_realpath

- name: Require reference digest to match the actual opened bytes
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.bytes }}"
    that:
      - _rh_fw_occurrence_snapshot_realpath.stdout == rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path]
      - (_rh_fw_occurrence_snapshot_read.content | b64decode | hash(rh_fw_occurrence_contract.structural.digest)) == rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.sha256]

- name: Decode source-produced immutable snapshot
  ansible.builtin.set_fact:
    _rh_fw_occurrence_snapshot: "{{ _rh_fw_occurrence_snapshot_read.content | b64decode | from_json }}"

- name: Require exact snapshot schema and caller binding
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.input }}"
    that:
      - _rh_fw_occurrence_snapshot is mapping
      - _rh_fw_occurrence_snapshot.keys() | list | sort == rh_fw_occurrence_contract.fields | sort
      - _rh_fw_occurrence_snapshot[rh_fw_occurrence_contract.f.schema] == rh_fw_occurrence_contract.schema
      - _rh_fw_occurrence_snapshot[rh_fw_occurrence_contract.f.binding] == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding]
      - _rh_fw_occurrence_snapshot[rh_fw_occurrence_contract.f.supervisor].keys() | list | sort == rh_fw_occurrence_contract.supervisor_fields | sort

- name: Verify the still-open occurrence against actual live kernel state
  ansible.builtin.include_tasks:
    file: "{{ [rh_fw_occurrence_source_root, rh_fw_occurrence_contract.task_observe] | path_join }}"
  vars:
    rh_fw_occurrence_active: "{{ _rh_fw_occurrence_snapshot[rh_fw_occurrence_contract.f.active] }}"

- name: Reobserve finalized snapshot after live process proof
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
    checksum_algorithm: "{{ rh_fw_occurrence_contract.structural.digest }}"
  register: _rh_fw_occurrence_snapshot_after

- name: Recheck exact canonical snapshot ancestry after all reads
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_snapshot_realpath_after

- name: Require the same snapshot and exact live supervisor identity
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.replay }}"
    that:
      - _rh_fw_occurrence_snapshot_realpath_after.stdout == rh_fw_occurrence_reference[rh_fw_occurrence_contract.reference.path]
      - _rh_fw_occurrence_snapshot_after.stat.exists and _rh_fw_occurrence_snapshot_after.stat.isreg
      - not _rh_fw_occurrence_snapshot_after.stat.islnk
      - _rh_fw_occurrence_snapshot_after.stat.mode == _rh_fw_occurrence_snapshot_before.stat.mode
      - _rh_fw_occurrence_snapshot_after.stat.uid == _rh_fw_occurrence_snapshot_before.stat.uid
      - _rh_fw_occurrence_snapshot_after.stat.nlink == _rh_fw_occurrence_snapshot_before.stat.nlink
      - _rh_fw_occurrence_snapshot_after.stat.dev == _rh_fw_occurrence_snapshot_before.stat.dev
      - _rh_fw_occurrence_snapshot_after.stat.inode == _rh_fw_occurrence_snapshot_before.stat.inode
      - _rh_fw_occurrence_snapshot_after.stat.checksum == _rh_fw_occurrence_snapshot_before.stat.checksum
      - _rh_fw_occurrence_snapshot[rh_fw_occurrence_contract.f.supervisor] == _rh_fw_occurrence_supervisor

- name: Publish observed supervision only after all independent checks
  ansible.builtin.set_fact:
    "{{ rh_fw_occurrence_contract.output_fact }}": >-
      {{ {rh_fw_occurrence_contract.output.reference: rh_fw_occurrence_reference,
          rh_fw_occurrence_contract.output.supervised: rh_fw_occurrence_contract.structural.accepted,
          rh_fw_occurrence_contract.output.supervisor: _rh_fw_occurrence_supervisor} }}
