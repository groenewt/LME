- name: Require source-bound occurrence expectations and the actual active reference
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.input }}"
    that:
      - rh_fw_occurrence_expected is mapping
      - rh_fw_occurrence_expected.keys() | list | sort == rh_fw_occurrence_contract.expected_fields | sort
      - lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier) is mapping
      - lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier).keys() | list | sort == rh_fw_occurrence_contract.carrier.fields | sort
      - rh_fw_occurrence_active == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.active]
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program] == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.program]
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.generation] == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.generation]
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid] == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.uid]
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory] == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.directory]
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory] is regex(rh_fw_occurrence_contract.patterns.absolute, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory] is not search(rh_fw_occurrence_contract.patterns.forbidden_path)
      - lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity].keys() | list | sort == rh_fw_occurrence_contract.carrier.identity_fields | sort
      - rh_fw_occurrence_active is mapping
      - rh_fw_occurrence_active.keys() | list | sort == rh_fw_occurrence_contract.reference_fields | sort
      - rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] is string
      - rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] is regex(rh_fw_occurrence_contract.patterns.absolute, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] is not search(rh_fw_occurrence_contract.patterns.forbidden_path)
      - rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.sha256] is regex(rh_fw_occurrence_contract.patterns.digest, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid] is integer
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid] is not boolean
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding] is mapping
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding].keys() | list | sort == rh_fw_occurrence_contract.binding_fields | sort
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program].keys() | list | sort == rh_fw_occurrence_contract.reference_fields | sort

- name: Project runtime words through declared source pointers
  ansible.builtin.set_fact:
    _rh_fw_occurrence_runtime: "{{ rh_fw_occurrence_contract.structural.empty_map }}"

- name: Bind one already resolved runtime source
  ansible.builtin.set_fact:
    _rh_fw_occurrence_runtime: >-
      {%- set found = namespace(value=rh_fw_occurrence_bootstrap) -%}
      {%- for key in item.value -%}{%- set found.value = found.value[key] -%}{%- endfor -%}
      {{ _rh_fw_occurrence_runtime | combine({item.key: found.value}) }}
  loop: "{{ rh_fw_occurrence_contract.runtime_sources | dict2items }}"

- name: Observe source-owned snapshot publication directory before reads
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
  register: _rh_fw_occurrence_directory

- name: Resolve source-owned snapshot publication directory before reads
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_directory_realpath

- name: Require the actual protected publication directory before reads
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.publication }}"
    that:
      - _rh_fw_occurrence_directory.stat.exists and _rh_fw_occurrence_directory.stat.isdir
      - not _rh_fw_occurrence_directory.stat.islnk
      - _rh_fw_occurrence_directory_realpath.stdout == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory]
      - _rh_fw_occurrence_directory.stat.dev == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.device]
      - _rh_fw_occurrence_directory.stat.inode == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.inode]
      - _rh_fw_occurrence_directory.stat.uid == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.owner]
      - _rh_fw_occurrence_directory.stat.uid == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid]
      - _rh_fw_occurrence_directory.stat.mode == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.mode]
      - _rh_fw_occurrence_directory.stat.mode == rh_fw_occurrence_contract.artifacts.directory_mode

- name: Observe actual active record parent directory before
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] | dirname }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
  register: _rh_fw_occurrence_parent_before

- name: Observe active occurrence file without following links
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
    checksum_algorithm: "{{ rh_fw_occurrence_contract.structural.digest }}"
  register: _rh_fw_occurrence_before

- name: Require the active record's owner, mode, digest and file kind
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.record }}"
    that:
      - _rh_fw_occurrence_parent_before.stat.exists and _rh_fw_occurrence_parent_before.stat.isdir
      - not _rh_fw_occurrence_parent_before.stat.islnk
      - _rh_fw_occurrence_parent_before.stat.uid == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid]
      - _rh_fw_occurrence_before.stat.exists and _rh_fw_occurrence_before.stat.isreg
      - not _rh_fw_occurrence_before.stat.islnk
      - _rh_fw_occurrence_before.stat.nlink == rh_fw_occurrence_contract.structural.one
      - _rh_fw_occurrence_before.stat.mode == rh_fw_occurrence_contract.active.mode
      - _rh_fw_occurrence_before.stat.uid == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid]
      - _rh_fw_occurrence_before.stat.checksum == rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.sha256]

- name: Resolve the active record's actual ancestry
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_realpath

- name: Read the actual active occurrence bytes
  ansible.builtin.slurp:
    src: "{{ rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] }}"
  register: _rh_fw_occurrence_read

- name: Require complete exact active bytes with no link ancestry
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.bytes }}"
    that:
      - _rh_fw_occurrence_realpath.stdout == rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path]
      - (_rh_fw_occurrence_read.content | b64decode | hash(rh_fw_occurrence_contract.structural.digest)) == rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.sha256]
      - (_rh_fw_occurrence_read.content | b64decode).splitlines() | length == rh_fw_occurrence_contract.structural.one
      - (_rh_fw_occurrence_read.content | b64decode).endswith(rh_fw_occurrence_contract.structural.newline)
      - (_rh_fw_occurrence_read.content | b64decode).split() | length == rh_fw_occurrence_contract.active.fields | length

- name: Decode declared active record fields
  ansible.builtin.set_fact:
    _rh_fw_occurrence_active_record: "{{ dict(rh_fw_occurrence_contract.active.fields | zip((_rh_fw_occurrence_read.content | b64decode).split())) }}"

- name: Refuse terminal, replayed or unrelated occurrence records
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.replay }}"
    that:
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.state] == _rh_fw_occurrence_runtime.consuming
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.close] == _rh_fw_occurrence_runtime.pending
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.exit] == _rh_fw_occurrence_runtime.pending
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.generation] == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.generation]
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.uid] == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid] | string
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.pid] is regex(rh_fw_occurrence_contract.patterns.positive_decimal, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.start] is regex(rh_fw_occurrence_contract.patterns.positive_decimal, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.ordinal] is regex(rh_fw_occurrence_contract.patterns.positive_decimal, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.scope] is regex(rh_fw_occurrence_contract.patterns.absolute, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.scope] is not search(rh_fw_occurrence_contract.patterns.forbidden_path)

- name: Observe the admitted supervisor program file
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program][rh_fw_occurrence_contract.reference.path] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
    checksum_algorithm: "{{ rh_fw_occurrence_contract.structural.digest }}"
  register: _rh_fw_occurrence_program

- name: Read actual supervisor command line
  ansible.builtin.slurp:
    src: "{{ [_rh_fw_occurrence_runtime.proc_root, _rh_fw_occurrence_active_record[rh_fw_occurrence_contract.active.roles.pid], rh_fw_occurrence_contract.proc.command] | path_join }}"
  register: _rh_fw_occurrence_command

- name: Bind supervisor identity to its admitted seed program
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.supervisor }}"
    that:
      - _rh_fw_occurrence_program.stat.exists and _rh_fw_occurrence_program.stat.isreg
      - not _rh_fw_occurrence_program.stat.islnk
      - _rh_fw_occurrence_program.stat.checksum == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program][rh_fw_occurrence_contract.reference.sha256]
      - (_rh_fw_occurrence_command.content | b64decode).split(rh_fw_occurrence_contract.proc.command_separator) | length > rh_fw_occurrence_contract.proc.supervisor_program_index
      - (_rh_fw_occurrence_command.content | b64decode).split(rh_fw_occurrence_contract.proc.command_separator)[rh_fw_occurrence_contract.proc.supervisor_program_index] == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program][rh_fw_occurrence_contract.reference.path]

- name: Observe live supervisor identity, namespaces, cgroups and the actual reader ancestry
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.shell].path] + rh_fw_occurrence_contract.tools.shell_args + [lookup(rh_fw_occurrence_contract.plugins.template, rh_fw_occurrence_source_root ~ rh_fw_occurrence_contract.structural.path_separator ~ rh_fw_occurrence_contract.process_template), rh_fw_occurrence_contract.tools.shell_arg0] + (rh_fw_occurrence_contract.shell.argument_fields | map(rh_fw_occurrence_contract.filters.extract, _rh_fw_occurrence_active_record) | list) }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_process

- name: Observe actual active record parent directory after
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] | dirname }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
  register: _rh_fw_occurrence_parent_after

- name: Reobserve active record after the live process proof
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
    checksum_algorithm: "{{ rh_fw_occurrence_contract.structural.digest }}"
  register: _rh_fw_occurrence_after

- name: Recheck exact canonical active record ancestry after reads
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_realpath_after

- name: Observe source-owned snapshot publication directory after reads
  ansible.builtin.stat:
    path: "{{ rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory] }}"
    follow: "{{ rh_fw_occurrence_contract.structural.refused }}"
  register: _rh_fw_occurrence_directory

- name: Resolve source-owned snapshot publication directory after reads
  ansible.builtin.command:
    argv: "{{ [rh_fw_occurrence_bootstrap.os_tools[rh_fw_occurrence_contract.tools.realpath].path] + rh_fw_occurrence_contract.tools.realpath_args + [rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory]] }}"
  changed_when: rh_fw_occurrence_contract.structural.refused
  register: _rh_fw_occurrence_directory_realpath

- name: Require the actual protected publication directory after reads
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.publication }}"
    that:
      - _rh_fw_occurrence_directory.stat.exists and _rh_fw_occurrence_directory.stat.isdir
      - not _rh_fw_occurrence_directory.stat.islnk
      - _rh_fw_occurrence_directory_realpath.stdout == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.directory]
      - _rh_fw_occurrence_directory.stat.dev == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.device]
      - _rh_fw_occurrence_directory.stat.inode == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.inode]
      - _rh_fw_occurrence_directory.stat.uid == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.owner]
      - _rh_fw_occurrence_directory.stat.uid == rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.uid]
      - _rh_fw_occurrence_directory.stat.mode == lookup(rh_fw_occurrence_contract.plugins.vars, rh_fw_occurrence_contract.source_carrier)[rh_fw_occurrence_contract.carrier.f.identity][rh_fw_occurrence_contract.carrier.identity.mode]
      - _rh_fw_occurrence_directory.stat.mode == rh_fw_occurrence_contract.artifacts.directory_mode

- name: Refuse changed active record during observation
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.replay }}"
    that:
      - _rh_fw_occurrence_realpath_after.stdout == rh_fw_occurrence_active[rh_fw_occurrence_contract.reference.path]
      - _rh_fw_occurrence_parent_after.stat.exists and _rh_fw_occurrence_parent_after.stat.isdir
      - not _rh_fw_occurrence_parent_after.stat.islnk
      - _rh_fw_occurrence_parent_after.stat.dev == _rh_fw_occurrence_parent_before.stat.dev
      - _rh_fw_occurrence_parent_after.stat.inode == _rh_fw_occurrence_parent_before.stat.inode
      - _rh_fw_occurrence_parent_after.stat.uid == _rh_fw_occurrence_parent_before.stat.uid
      - _rh_fw_occurrence_parent_after.stat.mode == _rh_fw_occurrence_parent_before.stat.mode
      - _rh_fw_occurrence_after.stat.exists and _rh_fw_occurrence_after.stat.isreg
      - not _rh_fw_occurrence_after.stat.islnk
      - _rh_fw_occurrence_after.stat.nlink == _rh_fw_occurrence_before.stat.nlink
      - _rh_fw_occurrence_after.stat.mode == _rh_fw_occurrence_before.stat.mode
      - _rh_fw_occurrence_after.stat.uid == _rh_fw_occurrence_before.stat.uid
      - _rh_fw_occurrence_after.stat.dev == _rh_fw_occurrence_before.stat.dev
      - _rh_fw_occurrence_after.stat.inode == _rh_fw_occurrence_before.stat.inode
      - _rh_fw_occurrence_after.stat.checksum == _rh_fw_occurrence_before.stat.checksum

- name: Initialize observed supervisor projection
  ansible.builtin.set_fact:
    _rh_fw_occurrence_supervisor: "{{ {rh_fw_occurrence_contract.supervisor.program: rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.program]} }}"

- name: Project each declared supervisor identity field from observed bytes
  ansible.builtin.set_fact:
    _rh_fw_occurrence_supervisor: "{{ _rh_fw_occurrence_supervisor | combine({item.key: _rh_fw_occurrence_active_record[item.value]}) }}"
  loop: "{{ rh_fw_occurrence_contract.active.supervisor_sources | dict2items }}"
