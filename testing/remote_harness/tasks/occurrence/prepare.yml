- name: Clear an earlier in-memory occurrence artifact
  ansible.builtin.set_fact:
    "{{ rh_fw_occurrence_contract.content_fact }}": "{{ rh_fw_occurrence_contract.structural.absent }}"
    "{{ rh_fw_occurrence_contract.output_fact }}": "{{ rh_fw_occurrence_contract.structural.absent }}"

- name: Require caller allocation fields independently of occurrence creation
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.input }}"
    that:
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding] is mapping
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding].keys() | list | sort == rh_fw_occurrence_contract.binding_fields | sort
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding][rh_fw_occurrence_contract.binding.locator] is regex(rh_fw_occurrence_contract.patterns.absolute, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding][rh_fw_occurrence_contract.binding.locator] is not search(rh_fw_occurrence_contract.patterns.forbidden_path)

- name: Require plain caller identity segments
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.input }}"
    that:
      - item is string
      - item is regex(rh_fw_occurrence_contract.patterns.segment, match_type=rh_fw_occurrence_contract.patterns.match_type)
      - item not in rh_fw_occurrence_contract.patterns.refused_segments
  loop: "{{ [rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding][rh_fw_occurrence_contract.binding.run], rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding][rh_fw_occurrence_contract.binding.attempt], rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding][rh_fw_occurrence_contract.binding.cell]] }}"

- name: Observe the real open invoking lifecycle before constructing bytes
  ansible.builtin.include_tasks:
    file: "{{ [rh_fw_occurrence_source_root, rh_fw_occurrence_contract.task_observe] | path_join }}"

- name: Construct the immutable invoking occurrence from verified observations
  ansible.builtin.set_fact:
    _rh_fw_occurrence_record: >-
      {{ {rh_fw_occurrence_contract.f.schema: rh_fw_occurrence_contract.schema,
          rh_fw_occurrence_contract.f.active: rh_fw_occurrence_active,
          rh_fw_occurrence_contract.f.supervisor: _rh_fw_occurrence_supervisor,
          rh_fw_occurrence_contract.f.binding: rh_fw_occurrence_expected[rh_fw_occurrence_contract.expected.binding]} }}

- name: Serialize the sole occurrence artifact once
  ansible.builtin.set_fact:
    _rh_fw_occurrence_content: "{{ (_rh_fw_occurrence_record | to_json(sort_keys=rh_fw_occurrence_contract.structural.sort_keys, indent=rh_fw_occurrence_contract.structural.indent)) ~ rh_fw_occurrence_contract.structural.newline }}"

- name: Measure exact UTF-8 encoded artifact size
  ansible.builtin.set_fact:
    _rh_fw_occurrence_base64: "{{ _rh_fw_occurrence_content | b64encode(encoding=rh_fw_occurrence_contract.structural.encoding) }}"

- name: Require the snapshot to fit the already reserved finite publication envelope
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ rh_fw_occurrence_contract.diagnostics.charge }}"
    that:
      - ((_rh_fw_occurrence_base64 | length) // rh_fw_occurrence_contract.structural.base64_group * rh_fw_occurrence_contract.structural.base64_bytes - (_rh_fw_occurrence_base64 | length - (_rh_fw_occurrence_base64.rstrip(rh_fw_occurrence_contract.structural.base64_pad) | length))) <= rh_fw_occurrence_contract.artifacts.maximum_bytes

- name: Publish only immutable in-memory bytes for the existing charged publisher
  ansible.builtin.set_fact:
    "{{ rh_fw_occurrence_contract.content_fact }}": >-
      {{ {rh_fw_occurrence_contract.artifacts.f.content: _rh_fw_occurrence_content,
          rh_fw_occurrence_contract.artifacts.f.sha256: _rh_fw_occurrence_content | hash(rh_fw_occurrence_contract.structural.digest),
          rh_fw_occurrence_contract.artifacts.f.bytes: ((_rh_fw_occurrence_base64 | length) // rh_fw_occurrence_contract.structural.base64_group * rh_fw_occurrence_contract.structural.base64_bytes - (_rh_fw_occurrence_base64 | length - (_rh_fw_occurrence_base64.rstrip(rh_fw_occurrence_contract.structural.base64_pad) | length))),
          rh_fw_occurrence_contract.artifacts.f.basename: rh_fw_occurrence_contract.artifacts.basename,
          rh_fw_occurrence_contract.artifacts.f.mode: rh_fw_occurrence_contract.artifacts.mode} }}
