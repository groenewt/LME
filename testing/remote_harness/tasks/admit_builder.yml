---
# testing/remote_harness/tasks/admit_builder.yml -- GENESIS builder admission (codex-tick127 genesis).
#
# The package-builder stage (package.yml, acquire.yml) runs on the MANAGED builder: the controller-seed generation of
# the toolchain root (controller.bootstrap.genesis.builder; one stable verified generation, never per act). It is
# admitted ONLY when it is exactly that generation: executable and python paths in G equal to the receipt's, the
# executable's first line running the generation python, the declared core and python major.minor, the ansible package
# imported from inside G, the generation's sealed ansible.cfg as the config file, the generation collections path, and
# no ANSIBLE_* variable outside env_allow. No search, no fallback. Nothing is written before this passes. Non-root only.
# Requires refuse_pinned_outputs.yml and resolve_policy.yml earlier in the play (localhost, connection local; both are
# controller-side action plugins only -- assert / set_fact / include_vars -- so no module has staged anything yet).
# Input (no default): rh_gen_stage, the genesis.launch.stages key of the including playbook (acquire | package), and
# the launch's act identity (genesis.launch.stage_root.act.var, an extra var from the launch argv; its own stage root).
# RH-GENESIS-TEMP-BINDING (codex-tick184): the process environment and every temp are genesis.launch. The FIRST task
# below uses controller-side lookups only (env, config, path tests), so a mis-bound environment refuses before the
# first module stages anything; the builder's own start-up local temp (created before any task) is reported by its
# effective location. The first module (setup, read-only) then yields the full environment (undeclared ANSIBLE_*) and
# the custody facts, refused right after, before any write.
# CONNECTED-LINEAGE PORT (codex-tick332 F1; ROUTE-X): the genesis launch admission below is the qualified mechanism of
# the genesis lineage, adapted onto this file's m1-1 interpreter binding (9c0c9b9) -- source closures 2e8ff44
# (RH-GENESIS-TEMP-BINDING: launch assert, custody stat + assert, mounts subset), e0c0aa5 (env['clear'] by subscript),
# 0fde998 (per-act stage root only), 55ec7aa (act as a declared fullmatch) and the genesis-only act-required portion
# of 929f5b3 (C1-ACT-REQUIRED-COMPONENT, codex 193337 / 194825; the registry side contract_admission.required_values
# .genesis_act is already on this lineage). Requires the profile's controller.bootstrap.genesis.launch (C1 hunk):
# without it the first task fails on an undefined policy node, never on a silent default.

# MANAGED BUILDER = THE CONTROLLER-SEED GENERATION (codex-tick542 OD-GEN-07 + GEN-STABLE-GENERATION; codex-tick543
# OD-S3-08): ONE stable verified generation, located by the ONE shared recipe tasks/derive_toolchain_generation.yml
# under the toolchain root R = <repo>/<work_roots.root_rel>/<work_roots.sub_roots[genesis.builder.root.sub]> (== the
# controller seed --root). G = R/<layout.generations_dir>/<generation id>; each path = G/<layout.gen_dirs[<gen_dir>]>/
# <rel>. Acts own only scratch and evidence; there is no per-act toolchain. Derived controller-side FIRST, before the
# launch-environment admission (genesis.launch.env.generation_paths are <G>/<layout key path>: GEN2-PROF-02) and before
# the first module (the interpreter binding below needs the python path); assert / include_tasks / set_fact only, so
# nothing is staged. The installed generation is bound to it after the first read-only module by the receipt verifier.
# The toolchain VALUE, the config_file VALUE and the retired scalar keys are admitted / refused by the registry (F05),
# never re-checked or read here.
- name: Refuse a builder declaration that is not the generation shape and derive the managed builder paths (before any module)
  vars:
    _gb: "{{ rh.controller.bootstrap.genesis.builder }}"
    _wr: "{{ rh.controller.bootstrap.work_roots }}"
    _sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
    # each env.generation_paths value walked through bootstrap.layout (none where a step is not a key of a mapping)
    _gwalk: >-
      {% set ns = namespace(l=[]) %}{% for p in rh.controller.bootstrap.genesis.launch.env.generation_paths.values() %}{% set w = namespace(v=rh.controller.bootstrap.layout) %}{% for s in p %}{% if w.v is mapping and s in w.v %}{% set w.v = w.v[s] %}{% else %}{% set w.v = none %}{% endif %}{% endfor %}{% set ns.l = ns.l + [w.v] %}{% endfor %}{{ ns.l }}
  block:
    - name: Refuse a builder declaration that is not the seed generation shape (RH-BUILDER-UNSUPPORTED)
      ansible.builtin.assert:
        that:
          - _gb.root is mapping and _gb.root.sub in _wr.sub_roots
          - _gb.executable is mapping and _gb.python is mapping
          - _gb.executable.gen_dir in rh.controller.bootstrap.layout.gen_dirs
          - _gb.python.gen_dir in rh.controller.bootstrap.layout.gen_dirs
          - rh.controller.bootstrap.genesis.launch.env.generation_paths is mapping
          - rh.controller.bootstrap.genesis.launch.env.generation_paths.values() | reject('sequence') | list | length == 0
          - _gwalk | reject('string') | list | length == 0
        fail_msg: >-
          REFUSED {{ _gb.refusal }}: controller.bootstrap.genesis.builder must name the controller-seed generation
          {root{sub in work_roots.sub_roots}, executable{gen_dir, rel}, python{gen_dir, rel}} with gen_dir in
          layout.gen_dirs, and genesis.launch.env.generation_paths must map each name to a bootstrap.layout key path
          that ends on a string (walked: {{ _gwalk }}); the host-package builder and the per-act toolchain are retired
          (codex-tick537 / tick542). Nothing was staged.
        quiet: true
    - name: Derive the seed generation of the toolchain root (the ONE shared recipe; controller-side, no module)
      ansible.builtin.include_tasks: derive_toolchain_generation.yml
      vars:
        rh_tc_root: "{{ [rh_repo_root, _wr.root_rel, _wr.sub_roots[_gb.root.sub]] | join(_sep) }}"
    - name: Derive the managed builder paths in that generation
      ansible.builtin.set_fact:
        _rh_bld_m:
          root: "{{ [rh_repo_root, _wr.root_rel, _wr.sub_roots[_gb.root.sub]] | join(_sep) }}"
          g: "{{ _rh_tc_gen }}"
          executable: "{{ [_rh_tc_gen, rh.controller.bootstrap.layout.gen_dirs[_gb.executable.gen_dir], _gb.executable.rel] | join(_sep) }}"
          python: "{{ [_rh_tc_gen, rh.controller.bootstrap.layout.gen_dirs[_gb.python.gen_dir], _gb.python.rel] | join(_sep) }}"
          # builder.config_file generation (GEN2-PROF-10): the sealed generation ansible.cfg (seed SEED-01 managed pair)
          config: "{{ [_rh_tc_gen, rh.controller.bootstrap.layout.config_file] | join(_sep) }}"

- name: Refuse an undeclared or mis-bound genesis process environment before any module (RH-GENESIS-TEMP-BINDING; lookups only)
  vars:
    _l: "{{ rh.controller.bootstrap.genesis.launch }}"
    _wr: "{{ rh.controller.bootstrap.work_roots }}"
    _w: "{{ rh_repo_root ~ '/' ~ rh.controller.bootstrap.work_roots.root_rel }}"
    # PER-ACT ISOLATION (launch.stage_root.act): the stage root is this launch's own act dir
    # REQUIRED (C1-ACT-REQUIRED-COMPONENT, codex 193337): an absent act is none (refused below), never defaulted to ''.
    # Absence is bound EXPLICITLY: the 2.19 vars lookup treats default=none as NO default (plugins/lookup/vars.py:
    # `if default is None` -> an undefined marker), which would raise at the first use instead of the declared refusal.
    # act.var is admitted as var_name (no regex metacharacter), so the varnames pattern is exact.
    _act: >-
      {{ lookup('ansible.builtin.vars', _l.stage_root.act.var)
         if (q('ansible.builtin.varnames', '^' ~ _l.stage_root.act.var ~ '$') | length) > 0 else none }}
    # the registry's act component rule (contract_admission.required_values.genesis_act -> patterns); raw registry read
    # under the SEED-06 raw_readers precedent of refuse_pinned_outputs.yml (the registry is not part of lme_global: no
    # override reaches it; global.yml is byte-bound by the engine); rh_repo_root is guarded inline at play entry
    _act_req: "{{ (lookup('ansible.builtin.file', rh_repo_root ~ '/manifests/global.yml') | from_yaml).lme_config_registry.remote_harness_schema.contract_admission }}"
    # display gate for the refusal message only: when the act is refused, no stage-root path is derived or stat'ed for
    # the message either (codex 194825: nothing derived from a refused act); the asserts below are the decision
    _act_ok: >-
      {{ (q('ansible.builtin.varnames', '^' ~ _l.stage_root.act.var ~ '$') | length) > 0 and _act is not none and _act is string
         and (_act | length) > 0
         and _act is ansible.builtin.regex(_act_req.patterns[_act_req.required_values.genesis_act.pattern], match_type='fullmatch')
         and _act is ansible.builtin.regex(_l.stage_root.act.regex, match_type=_l.stage_root.act.match) }}
    _sr: "{{ _w ~ '/' ~ _wr.sub_roots[_l.stage_root.sub] ~ '/' ~ _l.stage_root.rel ~ '/' ~ (rh_gen_stage | default('')) ~ '/' ~ _act }}"
    _paths: >-
      {% set ns = namespace(d={}) %}{% for k, v in _l.env.stage_paths.items() %}{% set ns.d = ns.d | combine({k: _sr ~ '/' ~ v}) %}{% endfor %}{{ ns.d }}
    # GEN2-PROF-02 env.generation_paths: names bound INTO the managed generation G (derived by the block above) at
    # <G>/<bootstrap.layout key path>, admitted at their declared values like every other declared pair
    _gpaths: >-
      {% set ns = namespace(d={}) %}{% for k, p in _l.env.generation_paths.items() %}{% set w = namespace(v=rh.controller.bootstrap.layout) %}{% for s in p %}{% set w.v = w.v[s] %}{% endfor %}{% set ns.d = ns.d | combine({k: [_rh_bld_m.g, w.v] | join(rh.controller.bootstrap.path_admission.separator)}) %}{% endfor %}{{ ns.d }}
    _want: "{{ rh.controller.bootstrap.base_env | combine(_l.env.literal) | combine(_paths) | combine(_gpaths) }}"
    _bad: >-
      {% set ns = namespace(b=[]) %}{% for k, v in _want.items() %}{% set a = lookup('ansible.builtin.env', k, default='<unset>') %}{% if a != v %}{% set ns.b = ns.b + [k ~ '=' ~ a ~ ' (declared ' ~ v ~ ')'] %}{% endif %}{% endfor %}{{ ns.b }}
    _chain: >-
      {% set ns = namespace(p=[]) %}{% for full in _paths.values() %}{% for i in range(1, (full.split('/') | length) + 1) %}{% set ns.p = ns.p + ['/' ~ (full.split('/')[1:i] | join('/'))] %}{% endfor %}{% endfor %}{{ ns.p | unique | sort | list }}
    _ltmp: "{{ lookup('ansible.builtin.config', 'DEFAULT_LOCAL_TMP') }}"
    _home: "{{ lookup('ansible.builtin.config', 'ANSIBLE_HOME') }}"
    _rtmp: "{{ lookup('ansible.builtin.config', 'remote_tmp', plugin_type='shell', plugin_name='sh') }}"
  ansible.builtin.assert:
    that:
      - rh_gen_stage is defined and rh_gen_stage in _l.stages
      # FULL match of the whole value (declared act.match = fullmatch): a trailing newline is refused (RH-GENESIS-ACT-STRICT-END)
      - _l.stage_root.act.match == 'fullmatch'
      # RH-GENESIS-ACT-REQUIRED (C1-ACT-REQUIRED-COMPONENT, codex 193337 / 194825): the RAW looked-up value (never
      # converted to a string) must be present, not null, a string, non-empty and a FULL match of the REGISTRY component
      # pattern (contract_admission.required_values.genesis_act -> patterns.rel_segment: no '/', no newline), all
      # BEFORE the profile pattern and before any use of the stage root derived from it (a profile act.regex such as
      # '^$' or '^x/y$' can never admit a missing, empty or slash-bearing act). Asserts stop at the first false, and the
      # result's `assertion` names which one: one distinguishable refusal per case.
      - (q('ansible.builtin.varnames', '^' ~ _l.stage_root.act.var ~ '$') | length) > 0
      - _act is not none
      - _act is string
      - (_act | length) > 0
      - _act is ansible.builtin.regex(_act_req.patterns[_act_req.required_values.genesis_act.pattern], match_type='fullmatch')
      - _act is ansible.builtin.regex(_l.stage_root.act.regex, match_type=_l.stage_root.act.match)
      # env['clear'] by SUBSCRIPT: `.clear` resolves to the dict METHOD (attribute access prefers it), never the key
      - _l.env['clear'] is sameas true and (_l.env.order | sort) == ((_want.keys() | list) + (_l.env.inherited.keys() | list)) | sort
      - (rh.controller.bootstrap.genesis.builder.env_allow | sort) == (_want.keys() | select('match', '^ANSIBLE_') | sort | list)
      - _bad | length == 0
      - lookup('ansible.builtin.env', 'HOME', default='') is match('^/')
      - (_ltmp | dirname) == _paths.ANSIBLE_LOCAL_TEMP and (_ltmp | basename) is match('^ansible-local-')
      - _home == _paths.ANSIBLE_HOME
      - _rtmp == _paths.ANSIBLE_REMOTE_TMP
      - (ansible_remote_tmp | default(_paths.ANSIBLE_REMOTE_TMP)) == _paths.ANSIBLE_REMOTE_TMP
      - (_sr ~ '/') is not match('(' ~ (_wr.admission.refused_prefixes | map('regex_escape') | join('|')) ~ ')')
      - _chain | select('link') | list | length == 0
      - _l.env.must_exist | map('extract', _paths) | reject('directory') | list | length == 0
    fail_msg: >-
      REFUSED {{ _l.refusal }} (RH-GENESIS-TEMP-BINDING): the genesis stage '{{ rh_gen_stage | default('') }}' runs only
      under env -i with exactly the declared pairs (controller.bootstrap.genesis.launch.env), every temp under the stage
      root {{ _sr if _act_ok else '(not derived: the act was refused)' }} of its own act (RH-GENESIS-ACT-ISOLATION: -e {{ _l.stage_root.act.var }}=<act> matching
      {{ _l.stage_root.act.regex }} as a {{ _l.stage_root.act.match }} of the whole value, got {{ _act | to_json }}; RH-GENESIS-ACT-REQUIRED:
      the act is required (present, not null, a string, non-empty) and must fully match the registry component pattern
      {{ _act_req.patterns[_act_req.required_values.genesis_act.pattern] }} before the profile pattern applies; the failed
      `assertion` names which check refused); mismatched or unset: {{ _bad if _act_ok else '(not compared: the act was refused)' }}; effective local temp {{ _ltmp }} (declared inside
      {{ _paths.ANSIBLE_LOCAL_TEMP | default('') if _act_ok else '(not derived)' }}), ANSIBLE_HOME {{ _home }}, remote_tmp {{ _rtmp }} / ansible_remote_tmp
      {{ ansible_remote_tmp | default('unset') }}; env_allow {{ rh.controller.bootstrap.genesis.builder.env_allow }} must
      equal the declared ANSIBLE_* names; the stage root must not be under {{ _wr.admission.refused_prefixes }}; linked
      components {{ (_chain | select('link') | list) if _act_ok else '(not checked)' }}; missing {{ (_l.env.must_exist | map('extract', _paths) | reject('directory') | list) if _act_ok else '(not checked)' }}.
      Nothing was staged; re-launch with the declared argv/env (genesis.launch), never an ad hoc export.
    quiet: true

# INTERPRETER BINDING (RH-BUILDER-UNSUPPORTED; e0c0aa51 genesis acquire refusal): the module interpreter is BOUND to the
# declared builder.python, never discovered. Without a binding, 2.19 interpreter discovery runs at the first module
# (setup below) and picks the first INTERPRETER_PYTHON_FALLBACK hit (/usr/bin/python3.13), not the declared
# /usr/bin/python3. Everything before this point in both genesis plays (refuse_pinned_outputs, admit_controller,
# resolve_policy incl. the engine resolve role, the assert above) is assert / set_fact / include_* / debug -- action
# plugins on the controller, no module, no discovery. This file is the single point both genesis plays (acquire.yml,
# package.yml) include before their first module, and set_fact is host-persistent, so the binding covers every later
# module of the play. A pre-supplied binding (inventory, extra-var) is admitted only when EQUAL to the declared one
# (an extra-var would outrank set_fact; an inventory value would be silently masked by it): it refuses here, still
# before any module. Under genesis the set_fact also outranks the task-var pins of reap_staging.yml /
# decide_private_group.yml (ansible_playbook_python): equal values, since the builder assert below requires
# ansible_playbook_python == builder.python. set_fact does not outlive this process.

- name: Refuse a pre-supplied module interpreter other than the declared builder python (before any module)
  ansible.builtin.assert:
    that:
      - ansible_python_interpreter is not defined or ansible_python_interpreter == _rh_bld_m.python
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the genesis module interpreter is bound by the harness
      to the managed builder python {{ _rh_bld_m.python }}; a pre-supplied
      ansible_python_interpreter (inventory or extra-var) must be absent or equal to it (got
      '{{ ansible_python_interpreter | default('unset') }}'). Nothing was staged.
    quiet: true

- name: Bind the module interpreter to the declared builder python (derived after the resolve; before the first module)
  ansible.builtin.set_fact:
    ansible_python_interpreter: "{{ _rh_bld_m.python }}"

- name: Refuse a privileged builder and read the builder's environment and interpreter facts (no writes)
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', 'env', 'python', 'user', 'mounts']

- name: Bind the installed seed generation at consumption (the existing receipt verifier; owner-read, read-only)
  ansible.builtin.include_tasks: verify_toolchain_receipt.yml
  vars:
    rh_tc_root: "{{ _rh_bld_m.root }}"
    rh_tc_owner: "{{ ansible_facts.user_id }}"

- name: Stat every component from / down to each genesis stage path (no link followed; read-only)
  vars:
    _l: "{{ rh.controller.bootstrap.genesis.launch }}"
    _wr: "{{ rh.controller.bootstrap.work_roots }}"
    _sr: "{{ rh_repo_root ~ '/' ~ _wr.root_rel ~ '/' ~ _wr.sub_roots[_l.stage_root.sub] ~ '/' ~ _l.stage_root.rel ~ '/' ~ rh_gen_stage ~ '/' ~ lookup('ansible.builtin.vars', _l.stage_root.act.var) }}"
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
  loop: >-
    {% set ns = namespace(p=[]) %}{% for v in _l.env.stage_paths.values() %}{% set full = _sr ~ '/' ~ v %}{% for i in range(1, (full.split('/') | length) + 1) %}{% set ns.p = ns.p + ['/' ~ (full.split('/')[1:i] | join('/'))] %}{% endfor %}{% endfor %}{{ ns.p | unique | sort | list }}
  register: _rh_bld_gen_stat

- name: Refuse genesis temp custody that is not the invoker's, on the admitted disk-backed work root (RH-GENESIS-TEMP-BINDING)
  vars:
    _l: "{{ rh.controller.bootstrap.genesis.launch }}"
    _wr: "{{ rh.controller.bootstrap.work_roots }}"
    _w: "{{ rh_repo_root ~ '/' ~ rh.controller.bootstrap.work_roots.root_rel }}"
    _u: "{{ ansible_facts.user_uid | int }}"
    # stat of an absent path carries only `exists`: the looped path is attached from the loop item
    _st: >-
      {% set ns = namespace(l=[]) %}{% for r in _rh_bld_gen_stat.results %}{% set ns.l = ns.l + [r.stat | combine({'path': r.item})] %}{% endfor %}{{ ns.l }}
    _above: "{{ _st | selectattr('exists') | rejectattr('path', 'equalto', _w) | rejectattr('path', 'match', '^' ~ (_w | regex_escape) ~ '/') | list }}"
    _within: "{{ _st | selectattr('exists') | selectattr('path', 'match', '^' ~ (_w | regex_escape) ~ '(/|$)') | list }}"
    _wdev: "{{ (_st | selectattr('path', 'equalto', _w) | first | default({})).dev | default(-1) }}"
    # the mount holding the work root: the longest mount point that is a path prefix of it
    _wm: >-
      {% set ns = namespace(m={}, n=-1) %}{% for m in ansible_facts.mounts | default([]) %}{% if (m.mount == '/' or (_w ~ '/').startswith(m.mount ~ '/')) and (m.mount | length) > ns.n %}{% set ns.m = m %}{% set ns.n = m.mount | length %}{% endif %}{% endfor %}{{ ns.m }}
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'HOME', default='') == ansible_facts.user_dir
      # the full environment (first read-only module): no ANSIBLE_* outside env_allow (re-asserted in the builder assert)
      - >-
        ansible_facts.env | dict2items | map(attribute='key') | select('match', '^ANSIBLE_')
        | reject('in', rh.controller.bootstrap.genesis.builder.env_allow) | list | length == 0
      - _st | selectattr('path', 'equalto', _w) | selectattr('exists') | list | length == 1
      - _st | selectattr('exists') | selectattr('islnk') | list | length == 0
      - _st | selectattr('exists') | rejectattr('isdir') | list | length == 0
      - _above | map(attribute='uid') | reject('in', [0, _u | int]) | list | length == 0
      - _above | selectattr('wgrp') | list | length == 0 and _above | selectattr('woth') | list | length == 0
      - _within | map(attribute='uid') | reject('equalto', _u | int) | list | length == 0
      - _within | selectattr('wgrp') | list | length == 0 and _within | selectattr('woth') | list | length == 0
      - _within | map(attribute='dev') | reject('equalto', _wdev) | list | length == 0
      - _wm.fstype is defined and _wm.fstype not in _wr.admission.refused_fs_types
      - (_wm.size_available | default(0) | int) >= (_wr.admission.free_bytes_min | int)
      - (_wm.inode_available | default(0) | int) >= (_wr.admission.free_inodes_min | int)
    fail_msg: >-
      REFUSED {{ _l.refusal }} (RH-GENESIS-TEMP-BINDING): HOME must be the invoker's passwd home ({{ ansible_facts.user_dir }};
      got '{{ lookup('ansible.builtin.env', 'HOME', default='') }}', never redirected); no ANSIBLE_* besides
      {{ rh.controller.bootstrap.genesis.builder.env_allow }} (found {{ ansible_facts.env | dict2items | map(attribute='key')
      | select('match', '^ANSIBLE_') | list }}); the work root {{ _w }} must exist;
      every component above it a real directory owned by 0 or uid {{ _u }}, not group/other-writable (no private-group
      exception at genesis); it and every component below it to the stage paths a real directory owned by uid {{ _u }},
      not group/other-writable, on the work root's device (no nested mount); the work root's filesystem
      ({{ _wm.mount | default('?') }} {{ _wm.fstype | default('?') }}) not in {{ _wr.admission.refused_fs_types }} with
      >= {{ _wr.admission.free_bytes_min }} bytes ({{ _wm.size_available | default('?') }}) and
      >= {{ _wr.admission.free_inodes_min }} inodes ({{ _wm.inode_available | default('?') }}) free. Components:
      {{ _st | map(attribute='path', default='?') | zip(_st | map(attribute='uid', default='-'), _st | map(attribute='mode', default='absent')) | list }}.
    quiet: true

# results[0] the executable (not followed), results[1] the declared python path itself (not followed: a Debian
# /usr/bin/python3 is a symlink -> lnk_source, and stat gives NO checksum for a link), results[2] the same path
# followed (the regular file it resolves to: the measured python_sha256).
- name: Read the declared builder executable and interpreter (no writes)
  ansible.builtin.stat:
    path: "{{ item.path }}"
    follow: "{{ item.follow }}"
    get_checksum: true
    checksum_algorithm: sha256
  loop:
    - {path: "{{ _rh_bld_m.executable }}", follow: false}
    - {path: "{{ _rh_bld_m.python }}", follow: false}
    - {path: "{{ _rh_bld_m.python }}", follow: true}
  register: _rh_bld_stat

- name: Read the builder executable's first line (its interpreter binding)
  ansible.builtin.slurp:
    src: "{{ _rh_bld_m.executable }}"
  register: _rh_bld_head
  when: _rh_bld_stat.results[0].stat.exists

- name: Ask the declared interpreter where its ansible package lives (read-only)
  ansible.builtin.command:
    argv:
      - "{{ _rh_bld_m.python }}"
      - -I
      - -B
      - -c
      - import ansible, os; print(os.path.dirname(ansible.__file__))
  register: _rh_bld_pkg
  changed_when: false
  failed_when: false
  when: _rh_bld_stat.results[1].stat.exists

- name: Refuse any builder that is not exactly the declared one (RH-BUILDER-UNSUPPORTED)
  ansible.builtin.assert:
    that:
      - ansible_facts.user_uid | int != 0
      - _rh_bld_stat.results[0].stat.exists and _rh_bld_stat.results[0].stat.isreg and _rh_bld_stat.results[0].stat.executable
      - _rh_bld_stat.results[1].stat.exists and _rh_bld_stat.results[1].stat.executable
      - _rh_bld_stat.results[2].stat.exists and _rh_bld_stat.results[2].stat.isreg and _rh_bld_stat.results[2].stat.checksum is defined
      # codex-tick537 item 4: the executable's interpreter binding is the MANAGED python, never the host system python
      # the seed's declared interpreter rule (controller_seed.j2 run_local_exec): first line #!<python>, or #!/bin/sh with
      # the launcher exec of exactly '<python>' (a shebang too long for the kernel)
      - >-
        (_rh_bld_head.content | b64decode).splitlines()[0] == '#!' ~ _rh_bld_m.python
        or ((_rh_bld_head.content | b64decode).splitlines()[0] == '#!/bin/sh'
            and ("'''exec' '" ~ _rh_bld_m.python ~ "' ") in (_rh_bld_head.content | b64decode))
      # the builder is EXACTLY the verified seed generation (receipt verifier output, bound at consumption)
      - _rh_bld_m.g == rh_toolchain.generation_dir
      - _rh_bld_m.executable == rh_toolchain.ansible_playbook
      - _rh_bld_m.python == rh_toolchain.python
      - _rh_bld_stat.results[0].stat.checksum == rh_toolchain.ansible_playbook_sha256
      - ansible_playbook_python == _rh_bld_m.python
      - ansible_version.full == rh.controller.bootstrap.genesis.builder.core
      # the binding held (an extra-var would outrank the set_fact; refused before setup, re-checked here) and no module
      # ran interpreter discovery (2.19 records it as ansible_facts.discovered_interpreter_python)
      - ansible_python_interpreter == _rh_bld_m.python
      - "'discovered_interpreter_python' not in ansible_facts"
      # STRICT path equality, no realpath: the module runs as '<bound path> AnsiballZ_*.py' and CPython reports argv0
      # unresolved as sys.executable (the same property ansible_playbook_python == builder.python relies on)
      - ansible_facts.python.executable == _rh_bld_m.python
      - (ansible_facts.python.version.major ~ '.' ~ ansible_facts.python.version.minor) == rh.controller.bootstrap.genesis.builder.python_major_minor
      # the imported ansible package lies inside the managed toolchain G (derived; the retired ansible_package_dir literal is gone)
      - _rh_bld_pkg.rc == 0 and _rh_bld_pkg.stdout.startswith(_rh_bld_m.g ~ rh.controller.bootstrap.path_admission.separator)
      # GEN2-PROF-10 (builder.config_file generation): the effective config file IS the sealed generation ansible.cfg
      # bound by the receipt, and the collections path is the generation's (both admitted at their declared values first)
      - ansible_config_file is string and ansible_config_file == _rh_bld_m.config
      - _rh_bld_m.config == rh_toolchain.ansible_config
      - lookup('ansible.builtin.env', 'ANSIBLE_COLLECTIONS_PATH') == rh_toolchain.collections_path
      - >-
        ansible_facts.env | dict2items | map(attribute='key') | select('match', '^ANSIBLE_')
        | reject('in', rh.controller.bootstrap.genesis.builder.env_allow) | list | length == 0
    fail_msg: >-
      REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the genesis stage runs only on the MANAGED builder
      {{ _rh_bld_m.executable }} (first line '#!{{ _rh_bld_m.python }}', core {{ rh.controller.bootstrap.genesis.builder.core }},
      python {{ _rh_bld_m.python }} {{ rh.controller.bootstrap.genesis.builder.python_major_minor }}, ansible package under
      {{ _rh_bld_m.g }}), non-root, with the generation config file {{ _rh_bld_m.config }} (== the receipt ansible_config;
      found: {{ ansible_config_file }}), collections path {{ rh_toolchain.collections_path }}, and no ANSIBLE_* variables besides
      {{ rh.controller.bootstrap.genesis.builder.env_allow }} (found:
      {{ ansible_facts.env | dict2items | map(attribute='key') | select('match', '^ANSIBLE_') | list }}).
      Observed: core {{ ansible_version.full }}; controller python (ansible_playbook_python) {{ ansible_playbook_python }};
      bound module interpreter {{ ansible_python_interpreter | default('unset') }}; module python (ansible_facts.python.executable)
      {{ ansible_facts.python.executable | default('?') }} {{ ansible_facts.python.version.major | default('?') }}.{{ ansible_facts.python.version.minor | default('?') }};
      discovered {{ ansible_facts.discovered_interpreter_python | default('none') }}; declared python resolves to
      {{ ((_rh_bld_stat.results[1].stat.lnk_source if _rh_bld_stat.results[1].stat.islnk else _rh_bld_m.python) if _rh_bld_stat.results[1].stat.exists else 'absent: ' ~ _rh_bld_m.python) }}
      (regular {{ _rh_bld_stat.results[2].stat.isreg | default('?') }}); ansible package
      {{ _rh_bld_pkg.stdout | default('?') }} (rc {{ _rh_bld_pkg.rc | default('?') }}). A missing builder is installed by
      the genesis entry as the controller-seed generation in the toolchain root {{ _rh_bld_m.root }} (the seed's own
      lifecycle; never per act, never an operator package step); this task never installs and nothing else is searched.
    quiet: true

# GENESIS contract reconciliation (codex 143844 bootstrap note; authority genesis.decision.ref, execution binding
# genesis.builder = the controller-seed generation). ENFORCED above: the generation of the toolchain root derived by the
# ONE shared recipe and bound through the receipt verifier (receipt, COMPLETE, active pointer, tree digests); the
# executable / python paths in that generation equal the receipt's; the executable bytes equal the receipt's
# ansible_playbook_sha256; its first line runs the generation python (#! or the declared /bin/sh exec trampoline); the
# python path as run, as BOUND module interpreter with no discovery, AND as reported + major.minor; core; the ansible
# package located under G; the config file is the generation's sealed ansible.cfg (== the receipt ansible_config) and
# ANSIBLE_COLLECTIONS_PATH the generation's collections path (== the receipt collections_path); ANSIBLE_* confined to
# env_allow; non-root.
# RECORDED below, NOT separately enforced: python_sha256 is a MEASUREMENT (stat sha256) of the regular file the python
# path resolves to (python_resolved), written into bundle.json for later audit (the receipt binds interpreter_sha256 to
# the generation interpreter, not to this venv path). identity_basis says so in the record itself.
- name: Record the admitted builder identity (derived output)
  ansible.builtin.set_fact:
    rh_builder:
      identity_basis: verified_seed_generation; executable_sha256 equals the receipt ansible_playbook_sha256; python_sha256 is a recorded measurement
      executable: "{{ _rh_bld_m.executable }}"
      executable_sha256: "{{ _rh_bld_stat.results[0].stat.checksum }}"
      python: "{{ ansible_playbook_python }}"
      # the regular file the declared python path resolves to (the path itself may be a link: stat checksums no link)
      python_resolved: "{{ _rh_bld_stat.results[1].stat.lnk_source if _rh_bld_stat.results[1].stat.islnk else _rh_bld_m.python }}"
      python_sha256: "{{ _rh_bld_stat.results[2].stat.checksum }}"
      python_version: "{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}.{{ ansible_facts.python.version.micro }}"
      ansible_core: "{{ ansible_version.full }}"
      ansible_package_dir: "{{ _rh_bld_pkg.stdout }}"
      config_file: "{{ ansible_config_file }}"
      uid: "{{ ansible_facts.user_uid }}"
