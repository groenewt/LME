---
# testing/remote_harness/tasks/reap_staging_controller_registry.yml -- route op1w NEW FILE (C1 SR922l
# registry_applicability, now s64 :7913-8248, pinned whole r51 :6991-7061, route op2c retarget; codex 938 C1-TARGET-NONE-APPLICABILITY;
# records-route-op1w-01). AUTHORED, NEVER RENDERED OR EXECUTED (UNRUN).
# The DELEGATED variant of reap_staging.yml's three owner registry reads (stat, listing, record reads), the op1s
# reading moved onto the OWNER: placement.owner is the run controller (n13_publishing_host), so in a decided launch
# context the owner registry is read on the declared controller binding rh_controller_target over the declared
# connection, interpreter and remote temp (TASK vars), never on the reap destination host. The same codex 931
# ROUTE_DELEGATION_BEFORE_SKIP rule as reap_staging_controller_ns.yml / _holders.yml: ansible-core 2.19.11 templates
# delegate_to before `when`, so reap_staging.yml includes THIS file only under `when: _rh_reap_app.kind ==
# 'delegated'`, after the stage-1b asserts admitted the binding; nothing here is templated in the genesis context.
# The owner uid the record reads are filtered by is the controller run's own uid (_rh_lease_rec.uid, read on the
# controller at lease derivation, admitted decimal there). Every read keeps failed_when false; a missing or failed
# observation leaves the registry UNKNOWN in reap_staging.yml's decision (unobservable: unknown).
# Reads (set by reap_staging.yml before the include): _rh_reap_rg, _rh_lease_rec; rh; rh_controller_target,
# rh_controller_connection. Writes: the registers _rh_reap_regst_d, _rh_reap_regls_d, _rh_reap_regrd_d, merged by
# reap_staging.yml. route op2d: + the registers _rh_reap_rfid_d and _rh_reap_regcl_d (NEW names, not reserved: open
# item CPL-OP2D-NEW-NAMES-UNRESERVED).
- name: Stat the owner's obligation registry on the controller (delegated; no link followed; read-only)
  vars:
    # RH-CONTROLLER-DELEGATION: the declared controller binding, connection, interpreter and remote temp as TASK vars
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.stat:
    path: "{{ _rh_reap_rg.dir }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: _rh_reap_regst_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: List every entry of the owner's obligation registry on the controller (delegated; hidden included; no link followed)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.find:
    paths: "{{ _rh_reap_rg.dir }}"
    file_type: any
    hidden: true
    recurse: false
    follow: false
  register: _rh_reap_regls_d
  delegate_to: "{{ rh_controller_target }}"
  when:
    - "'stat' in _rh_reap_regst_d"
    - _rh_reap_regst_d.stat.exists
    - _rh_reap_regst_d.stat.isdir
    - not _rh_reap_regst_d.stat.islnk
  failed_when: false

- name: Read every owner registry record named by a token on the controller (delegated; regular, the owner uid; a failed read is unknown)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.slurp:
    src: "{{ item }}"
  # membership: a registry that was not listed yields no read (its state is decided unknown or absent in
  # reap_staging.yml, never from this list); a listed entry is read when its name is a token
  loop: >-
    {%- set ns = namespace(p=[]) -%}
    {%- if 'files' in _rh_reap_regls_d -%}
      {%- for e in _rh_reap_regls_d.files -%}
        {%- if e.isreg and not e.islnk and (e.uid | string) == _rh_lease_rec.uid and (e.path | basename) is match(rh.controller.bootstrap.bundle.staging_retention.lease.token_regex) -%}
          {%- set ns.p = ns.p + [e.path] -%}
        {%- endif -%}
      {%- endfor -%}
    {%- endif -%}{{ ns.p | sort }}
  register: _rh_reap_regrd_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

# route op2d (NOTE-OP2C-REGPOST-ABSENCE-LISTING; C1 lifetime.absence_observation s67 :8610-8658, comment :8585-8609):
# the delegated twins of reap_staging.yml's owner-registry listing tool admission and complete listing (same words,
# same argv, same rules; reap_staging.yml states them). The tool is listing_from's leaf_listing.tool (os_tools.find),
# admitted by its declared identity on the controller before use; an unadmitted tool lists nothing (unknown).
- name: Admit the declared listing tool by identity on the controller (delegated; absence_observation listing_from leaf_listing.tool)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
  ansible.builtin.stat:
    path: "{{ rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool].path }}"
    follow: false
    get_checksum: true
    checksum_algorithm: sha256
    get_mime: false
    get_attributes: false
  register: _rh_reap_rfid_d
  delegate_to: "{{ rh_controller_target }}"
  failed_when: false

- name: List the owner's obligation registry completely on the controller (delegated; the registry, or its parent when observed absent)
  vars:
    ansible_connection: "{{ rh_controller_connection }}"
    ansible_python_interpreter: "{{ lookup('ansible.builtin.vars', hostvars[rh_controller_target].rh.controller.bootstrap.inventory.controller_delegation.python_var) }}"
    ansible_remote_tmp: "{{ lookup('ansible.builtin.env', rh.controller.bootstrap.work_roots.remote_tmp_authority.delegated_controller.controller_env) }}"
    _ll: "{{ rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing }}"
    _fr: "{{ rh.controller.bootstrap.os_tools[rh.controller.entry_generation.render.n10.write_bound.lifetime.dead_holder.relock.absence_proof.leaf_listing.tool] }}"
  ansible.builtin.command:
    argv: "{{ [_fr.path, (_rh_reap_rg.dir if _rh_reap_regst_d.stat.exists else (_rh_reap_rg.dir | dirname))] + _ll.args }}"
    strip_empty_ends: false
  environment:
    LC_ALL: "{{ rh.controller.bootstrap[_ll.env_from[0]][_ll.env_from[1]] }}"
  register: _rh_reap_regcl_d
  delegate_to: "{{ rh_controller_target }}"
  changed_when: false
  failed_when: false
  when:
    - "'stat' in _rh_reap_rfid_d and not ('failed' in _rh_reap_rfid_d and _rh_reap_rfid_d.failed) and _rh_reap_rfid_d.stat.exists and _rh_reap_rfid_d.stat.isreg and not _rh_reap_rfid_d.stat.islnk and 'checksum' in _rh_reap_rfid_d.stat"
    - _fr.identity is mapping and 'kind' in _fr.identity and 'sha256' in _fr.identity and _fr.identity.kind == 'file_sha256' and _rh_reap_rfid_d.stat.checksum == _fr.identity.sha256
    - "'stat' in _rh_reap_regst_d and not ('failed' in _rh_reap_regst_d and _rh_reap_regst_d.failed)"
    - (not _rh_reap_regst_d.stat.exists) or (_rh_reap_regst_d.stat.isdir and not _rh_reap_regst_d.stat.islnk)
