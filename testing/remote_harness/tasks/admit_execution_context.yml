- name: Clear both outputs before admitting this invocation
  ansible.builtin.set_fact:
    "{{ fw_contract.validation.output_fact }}": "{{ fw_contract.validation.no_context_output }}"
    "{{ fw_contract.validation.serialized_output_fact }}": "{{ fw_contract.validation.no_context_output }}"
    fw_json_decoded: "{{ fw_contract.validation.no_context_output }}"

- name: Require JSON text or explicit omission at the distinct typed caller ingress
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.validation.diagnostics.request }}"
    that:
      - fw_ingress_json is string or fw_ingress_json is none

- name: Refuse a direct protected variable in caller arguments before publication
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.validation.diagnostics.protected }}"
    that:
      - fw_untyped_caller_vars is mapping
      - fw_contract.var not in fw_untyped_caller_vars

- name: Parse only JSON and reject duplicate keys through the existing strict parser
  when: fw_ingress_json is not none
  ansible.builtin.set_fact:
    fw_json_decoded: "{{ fw_ingress_json | from_json }}"
    fw_strict_decoded: "{{ fw_ingress_json | lme_manifest_strict(fw_ingress_label, fw_parse_contract) }}"

- name: Refuse divergent JSON/YAML value construction
  when: fw_ingress_json is not none
  ansible.builtin.assert:
    quiet: true
    fail_msg: "{{ fw_contract.validation.diagnostics.request }}"
    that:
      - fw_json_decoded | lme_type_aware_equal(fw_strict_decoded)

- name: Admit the typed request with already admitted matrix/allocator inputs
  ansible.builtin.include_tasks: "{{ fw_source_root ~ fw_path_law.separator ~ fw_contract.validation.tasks.context }}"
  vars:
    fw_request: "{{ fw_json_decoded }}"

- name: Publish admitted context and its one-variable JSON together after every check
  ansible.builtin.set_fact:
    "{{ fw_contract.validation.output_fact }}": "{{ fw_json_decoded[fw_contract.ingress.r.context] if fw_json_decoded is not none else fw_contract.validation.no_context_output }}"
    "{{ fw_contract.validation.serialized_output_fact }}": "{{ {fw_contract.var: fw_json_decoded[fw_contract.ingress.r.context]} | to_json if fw_json_decoded is not none else fw_contract.validation.no_context_output }}"
