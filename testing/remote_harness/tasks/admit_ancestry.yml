---
# testing/remote_harness/tasks/admit_ancestry.yml -- the ONE resolved ancestry rule for playbook consumers
# (rh.controller.bootstrap.path_admission.ancestry, = lme_resolved.remote_harness.policy.controller.bootstrap
# .path_admission.ancestry; codex 143342 WORK-ROOT-ANCESTRY-PRIVATE-GROUP). The seed applies the same rule (macros
# ancestry_check / private_group_admit); consumers include THIS file instead of keeping a private copy
# (verify_toolchain_receipt.yml; B admit_state_dir.yml / CONTROLS-WORK-ROOT; G tests/controls/tasks/execute.yml).
# Every EXISTING component of rh_anc_path, from / down to rh_anc_path itself: a real directory (a link refuses),
# owned by uid 0 or the running uid, never other-writable (sticky included); group-writable only when owned by the
# running uid AND admitted by owner_private_group (facts gathered here with the declared, hash-admitted tools; decided
# on the controller by tasks/decide_private_group.yml with the generated program). Read-only.
# Include it at the USE boundary (right before the first write under rh_anc_path), not only at admission.
# EFFECTS (source analysis, not observed execution; route-r4c R4-SHARED-STAT-EFFECTS): the declared os_tools id (-u)
# always; the ansible.builtin.stat module per component (Python, in the module process; mime / attribute helpers
# disabled, so no `file` / `lsattr`); ONLY for an owner-owned group-writable component, the declared sh running the
# generated facts program (its declared tools) and tasks/decide_private_group.yml: its controller decision tool and
# its own stat of that tool -- which at eb85ba51 :60-64 leaves get_mime / get_attributes at the module defaults, so
# `file` / `lsattr` may run there on that one path (codex-tick409: a separate bounded leaf of the R2 route writer;
# not changed here). Nothing is written.
# Inputs (no defaults):
#   rh_anc_bs         the resolved remote_harness.controller.bootstrap map (rh.controller.bootstrap)
#   rh_anc_repo_root  the checkout holding the program template (absolute)
#   rh_anc_path       the path to admit (absolute, path_admission.regex)
#   rh_anc_refusal    the caller's refusal code
# Refusals (route-r4d): the common grammar rh_anc_bs.refusal_grammar through its entry template; the include contract
# with the declared code rh_anc_bs.path_admission.include_refusal, every later refusal with the caller's rh_anc_refusal;
# diagnostic texts rh_anc_bs.path_admission.admission_texts; paths split / joined by rh_anc_bs.path_admission.separator
# (C1 proposal r4c-c1-hunks.yml N-P1 + r4d-c1-hunks.yml).
# Output: rh_anc_admitted_private_groups (the group-writable components admitted by owner_private_group).
#
# INCLUDE CONTRACT (codex-tick409 R4C-REMAINING-VALUE-SOURCING :42-45; no authored message text, no default():
#   stage 1a NATIVE: the inputs the declared refusal itself needs (rh_anc_bs with refusal_grammar and path_admission
#            {separator, regex, include_refusal, include_inputs, admission_texts.include}, rh_anc_repo_root). Before
#            they hold no declaration is reachable, so the assert carries NO fail_msg: Ansible's own assertion report
#            names the failed condition. Nothing is observed or fabricated.
#   stage 1b DECLARED: the remaining inputs (rh_anc_refusal, rh_anc_path), refused in the common grammar with the
#            declared include code and text; the detail lists the declared input names and which of them were supplied.
#   stage 2  values, with the caller's code (unchanged).
- name: Admit the ancestry include contract (stage 1a; the refusal's own inputs; native assertion report, no authored text)
  ansible.builtin.assert:
    that:
      - rh_anc_bs is defined and rh_anc_bs is mapping
      - rh_anc_bs.refusal_grammar is defined and rh_anc_bs.refusal_grammar is mapping
      - rh_anc_bs.refusal_grammar.entry_rel is defined and rh_anc_bs.refusal_grammar.entry_rel is string
      - rh_anc_bs.path_admission is defined and rh_anc_bs.path_admission is mapping
      - rh_anc_bs.path_admission.separator is defined and rh_anc_bs.path_admission.separator is string
      - rh_anc_bs.path_admission.regex is defined and rh_anc_bs.path_admission.regex is string
      - rh_anc_bs.path_admission.include_refusal is defined and rh_anc_bs.path_admission.include_refusal is string
      - rh_anc_bs.path_admission.include_inputs is defined and rh_anc_bs.path_admission.include_inputs is sequence
      - rh_anc_bs.path_admission.admission_texts.include is defined and rh_anc_bs.path_admission.admission_texts.include is string
      - rh_anc_repo_root is defined and rh_anc_repo_root is string and rh_anc_repo_root is match(rh_anc_bs.path_admission.regex)

- name: Admit the ancestry include contract (stage 1b; presence and types; the declared include refusal)
  ansible.builtin.assert:
    that:
      - rh_anc_refusal is defined and rh_anc_refusal is string and rh_anc_refusal | length > 0
      - rh_anc_path is defined
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_bs.path_admission.include_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.include,
                                                rh_anc_bs.path_admission.include_inputs | to_json,
                                                rh_anc_bs.path_admission.include_inputs | select('in', vars) | list | to_json]}) }}
    quiet: true

- name: Admit the ancestry inputs (stage 2; values; the ONE path-admission rule; common refusal grammar)
  ansible.builtin.assert:
    that:
      - rh_anc_bs.path_admission.ancestry is mapping
      - rh_anc_bs.path_admission.ancestry.owner_private_group is mapping
      - rh_anc_path is string and rh_anc_path is match(rh_anc_bs.path_admission.regex)
      - rh_anc_path is not search(rh_anc_bs.path_admission.forbidden_segment_regex)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.inputs, rh_anc_path | to_json]}) }}
    quiet: true

- name: Read the running uid (the owner principal) with the declared tool
  ansible.builtin.command:
    argv: ["{{ rh_anc_bs.os_tools.id.path }}", -u]
  register: _rh_anc_uid
  changed_when: false

- name: Stat every component of the path (no link followed; read-only; no mime / attribute helper)
  # get_mime / get_attributes false (route-r4c R4-SHARED-STAT-EFFECTS, codex-tick400): the stat module's defaults
  # would run the PATH-resolved helpers `file` (mime) and `lsattr` (attributes) on every component; neither result is
  # read by this rule. Native YAML module-configuration declarations (codex-tick399 stat_flags), not tunable.
  ansible.builtin.stat:
    path: >-
      {{ rh_anc_bs.path_admission.separator
         ~ (rh_anc_path.split(rh_anc_bs.path_admission.separator)[1:item] | join(rh_anc_bs.path_admission.separator)) }}
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ range(1, (rh_anc_path.split(rh_anc_bs.path_admission.separator) | length) + 1) | list }}"
  register: _rh_anc_st

- name: Refuse linked, non-directory, foreign-owned, other-writable or foreign group-writable components
  vars:
    _ex: "{{ _rh_anc_st.results | map(attribute='stat') | selectattr('exists') | list }}"
    _u: "{{ _rh_anc_uid.stdout | int }}"
  ansible.builtin.assert:
    that:
      - _u | int != 0
      - _ex | selectattr('islnk') | list | length == 0
      - _ex | rejectattr('isdir') | list | length == 0
      - _ex | map(attribute='uid') | reject('in', [0, _u | int]) | list | length == 0
      - _ex | selectattr('woth') | list | length == 0
      - _ex | selectattr('wgrp') | rejectattr('uid', 'equalto', _u | int) | list | length == 0
      - rh_anc_bs.path_admission.ancestry.owner_private_group.enabled | bool or (_ex | selectattr('wgrp') | list | length == 0)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_path, rh_anc_bs.path_admission.admission_texts.components, _u,
                                                (_ex | selectattr('islnk') | map(attribute='path') | list + (_ex | rejectattr('isdir') | map(attribute='path') | list)
                                                 + (_ex | rejectattr('uid', 'in', [0, _u | int]) | map(attribute='path') | list) + (_ex | selectattr('woth') | map(attribute='path') | list)
                                                 + (_ex | selectattr('wgrp') | rejectattr('uid', 'equalto', _u | int) | map(attribute='path') | list)) | to_json]}) }}
    quiet: true

- name: Select the owner-owned group-writable components that need the owner-private-group proof
  ansible.builtin.set_fact:
    _rh_anc_pg: "{{ _rh_anc_st.results | map(attribute='stat') | selectattr('exists') | selectattr('wgrp') | map(attribute='path') | list }}"

- name: Gather the private-group facts of each such component (declared tools; the same text the seed runs; read-only)
  vars:
    _pg: "{{ rh_anc_bs.path_admission.ancestry.owner_private_group }}"
  ansible.builtin.command:
    argv:
      - "{{ rh_anc_bs.os_tools.sh.path }}"
      - -c
      - >-
        {{ lookup('ansible.builtin.template', rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ _pg.program_template_rel,
                  template_vars={'rh_pg_bs': rh_anc_bs, 'rh_pg_part': 'facts'}) }}
      - lme-private-group-facts
  # the generated text reads the directory from $_pgdir (task environment of this one command; nothing is exported)
  environment:
    _pgdir: "{{ item }}"
  loop: "{{ _rh_anc_pg }}"
  register: _rh_anc_facts
  changed_when: false

- name: Decide each group-writable component with the ONE generated program (controller)
  ansible.builtin.include_tasks: decide_private_group.yml
  vars:
    rh_pg_bs: "{{ rh_anc_bs }}"
    rh_pg_repo_root: "{{ rh_anc_repo_root }}"
    rh_pg_facts: "{{ _rh_anc_fact.stdout }}"
    rh_pg_refusal: "{{ rh_anc_refusal }}"
  loop: "{{ _rh_anc_facts.results }}"
  loop_control:
    loop_var: _rh_anc_fact
    label: "{{ _rh_anc_fact.item }}"

- name: Record the admitted owner-private-group components (output)
  ansible.builtin.set_fact:
    rh_anc_admitted_private_groups: "{{ _rh_anc_pg }}"
