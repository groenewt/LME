---
# testing/remote_harness/tasks/admit_ancestry.yml -- the ONE resolved ancestry rule for playbook consumers
# (rh.controller.bootstrap.path_admission.ancestry, = lme_resolved.remote_harness.policy.controller.bootstrap
# .path_admission.ancestry; codex 143342 WORK-ROOT-ANCESTRY-PRIVATE-GROUP). The seed applies the same rule (macros
# ancestry_check / private_group_admit); consumers include THIS file instead of keeping a private copy
# (verify_toolchain_receipt.yml; B admit_state_dir.yml / CONTROLS-WORK-ROOT; G tests/controls/tasks/execute.yml).
# Every EXISTING component of rh_anc_path, from / down to rh_anc_path itself: a real directory (a link refuses),
# owned by uid 0 or the running uid, never other-writable (sticky included); group-writable only when owned by the
# running uid AND admitted by owner_private_group (facts gathered here with the declared, hash-admitted tools; decided
# on the controller by tasks/decide_private_group.yml with the generated program). Read-only.
# Include it at the USE boundary (right before the first write under rh_anc_path), not only at admission.
# EFFECTS (source analysis, not observed execution; route-r4c R4-SHARED-STAT-EFFECTS): the declared os_tools id (-u)
# always; the ansible.builtin.stat module per component (Python, in the module process; mime / attribute helpers
# disabled, so no `file` / `lsattr`); ONLY for an owner-owned group-writable component, the declared sh running the
# generated facts program (its declared tools) and tasks/decide_private_group.yml: its controller decision tool and
# its own stat of that tool -- which at eb85ba51 :60-64 leaves get_mime / get_attributes at the module defaults, so
# `file` / `lsattr` may run there on that one path (codex-tick409: a separate bounded leaf of the R2 route writer;
# not changed here). Nothing is written.
# Inputs (no defaults):
#   rh_anc_bs         the resolved remote_harness.controller.bootstrap map (rh.controller.bootstrap)
#   rh_anc_repo_root  the checkout holding the program template (absolute)
#   rh_anc_path       the path to admit (absolute, path_admission.regex)
#   rh_anc_refusal    the caller's refusal code
# Refusals (route-r4d): the common grammar rh_anc_bs.refusal_grammar through its entry template; the include contract
# with the declared code rh_anc_bs.path_admission.include_refusal, every later refusal with the caller's rh_anc_refusal;
# diagnostic texts rh_anc_bs.path_admission.admission_texts; paths split / joined by rh_anc_bs.path_admission.separator
# (C1 proposal r4c-c1-hunks.yml N-P1 + r4d-c1-hunks.yml).
# Output: rh_anc_admitted_private_groups (the group-writable components admitted by owner_private_group).
#
# INCLUDE CONTRACT (codex-tick409 R4C-REMAINING-VALUE-SOURCING :42-45; no authored message text, no fallback filter;
# op1l codex 924: every presence test is MEMBERSHIP on vars or on the parent mapping, parent before child):
#   stage 1a NATIVE: the inputs the declared refusal itself needs (rh_anc_bs with refusal_grammar and path_admission
#            {separator, regex, include_refusal, include_inputs, admission_texts {include, inputs, components}},
#            rh_anc_repo_root). Before
#            they hold no declaration is reachable, so the assert carries NO fail_msg: Ansible's own assertion report
#            names the failed condition. Nothing is observed or fabricated.
#   stage 1b DECLARED: the remaining inputs (rh_anc_refusal, rh_anc_path), refused in the common grammar with the
#            declared include code and text; the detail lists the declared input names and which of them were supplied.
#   stage 2  values, with the caller's code (unchanged).
- name: Admit the ancestry include contract (stage 1a; the refusal's own inputs; native assertion report, no authored text)
  ansible.builtin.assert:
    that:
      - "'rh_anc_bs' in vars and rh_anc_bs is mapping"
      - "'refusal_grammar' in rh_anc_bs and rh_anc_bs.refusal_grammar is mapping"
      - "'entry_rel' in rh_anc_bs.refusal_grammar and rh_anc_bs.refusal_grammar.entry_rel is string"
      - "'path_admission' in rh_anc_bs and rh_anc_bs.path_admission is mapping"
      - "'separator' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.separator is string"
      - "'regex' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.regex is string"
      - "'include_refusal' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.include_refusal is string"
      - "'include_inputs' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.include_inputs is sequence"
      - "'admission_texts' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.admission_texts is mapping"
      - "'include' in rh_anc_bs.path_admission.admission_texts and rh_anc_bs.path_admission.admission_texts.include is string"
      # op1n: the two further declared texts the stage-2 and component refusals render (:79, :120 of op1l)
      - "'inputs' in rh_anc_bs.path_admission.admission_texts and rh_anc_bs.path_admission.admission_texts.inputs is string"
      - "'components' in rh_anc_bs.path_admission.admission_texts and rh_anc_bs.path_admission.admission_texts.components is string"
      - "'rh_anc_repo_root' in vars and rh_anc_repo_root is string and rh_anc_repo_root is match(rh_anc_bs.path_admission.regex)"

- name: Admit the ancestry include contract (stage 1b; presence and types; the declared include refusal)
  ansible.builtin.assert:
    that:
      - "'rh_anc_refusal' in vars and rh_anc_refusal is string and rh_anc_refusal | length > 0"
      - "'rh_anc_path' in vars"
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_bs.path_admission.include_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.include,
                                                rh_anc_bs.path_admission.include_inputs | to_json,
                                                rh_anc_bs.path_admission.include_inputs | select('in', vars) | list | to_json]}) }}
    quiet: true

- name: Admit the ancestry inputs (stage 2; values; the ONE path-admission rule; common refusal grammar)
  ansible.builtin.assert:
    that:
      # op1n (codex 924; CPL-OP1M-DPG-TEMPLATE-KEYS): every key this file and the facts part of the program template
      # read is tested by MEMBERSHIP, parent before child, before any dependent read (asserts stop at the first false)
      - "'ancestry' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.ancestry is mapping"
      - "'owner_private_group' in rh_anc_bs.path_admission.ancestry and rh_anc_bs.path_admission.ancestry.owner_private_group is mapping"
      # route op1r (C1 SR922h C1-GAP-ANCESTRY-UID-GRAMMAR; s64 :4471-4476 ancestry.uid_regex, route op2c retarget, = s61 :4400-4405 = s60 :4362-4367 = s58 = s56 :4347-4352 = s55 = s51 = s50 = s49 :4327-4332 = s47; route op1u retarget): the grammar the running
      # uid line and every stat uid must fully match before any integer read below
      - "'uid_regex' in rh_anc_bs.path_admission.ancestry and rh_anc_bs.path_admission.ancestry.uid_regex is string"
      - "'enabled' in rh_anc_bs.path_admission.ancestry.owner_private_group"
      # route op1r (C1 SR922h; r51 :4871-4873 pins enabled to the type-exact boolean enum at load): admitted here as a
      # BOOLEAN and read below by sameas, never through a coercing filter
      - rh_anc_bs.path_admission.ancestry.owner_private_group.enabled is boolean
      - "'program_template_rel' in rh_anc_bs.path_admission.ancestry.owner_private_group and rh_anc_bs.path_admission.ancestry.owner_private_group.program_template_rel is string"
      - "'forbidden_segment_regex' in rh_anc_bs.path_admission and rh_anc_bs.path_admission.forbidden_segment_regex is string"
      # the running-uid and facts shells (:121, :172 below)
      - "'os_tools' in rh_anc_bs and rh_anc_bs.os_tools is mapping"
      - "'id' in rh_anc_bs.os_tools and rh_anc_bs.os_tools.id is mapping and 'path' in rh_anc_bs.os_tools.id"
      - "'sh' in rh_anc_bs.os_tools and rh_anc_bs.os_tools.sh is mapping and 'path' in rh_anc_bs.os_tools.sh"
      # the facts part (private_group_program.j2 rh_pg_part 'facts' :15-16 -> macros/controller_seed.j2
      # private_group_facts :435-450 and x :22-24): facts_tools {principal, stat, read, filter}, identity_provider
      # {nsswitch_file, enumeration_tool}, acl_tool; every tool role names an os_tools entry with a path
      - "'facts_tools' in rh_anc_bs.path_admission.ancestry.owner_private_group and rh_anc_bs.path_admission.ancestry.owner_private_group.facts_tools is mapping"
      - "['principal', 'stat', 'read', 'filter'] | reject('in', rh_anc_bs.path_admission.ancestry.owner_private_group.facts_tools) | list | length == 0"
      - "'identity_provider' in rh_anc_bs.path_admission.ancestry.owner_private_group and rh_anc_bs.path_admission.ancestry.owner_private_group.identity_provider is mapping"
      - "['nsswitch_file', 'enumeration_tool'] | reject('in', rh_anc_bs.path_admission.ancestry.owner_private_group.identity_provider) | list | length == 0"
      - "'acl_tool' in rh_anc_bs.path_admission.ancestry.owner_private_group"
      - >-
        (['principal', 'stat', 'read', 'filter'] | map('extract', rh_anc_bs.path_admission.ancestry.owner_private_group.facts_tools) | list
         + [rh_anc_bs.path_admission.ancestry.owner_private_group.identity_provider.enumeration_tool,
            rh_anc_bs.path_admission.ancestry.owner_private_group.acl_tool])
        | reject('in', rh_anc_bs.os_tools) | list | length == 0
      - >-
        (['principal', 'stat', 'read', 'filter'] | map('extract', rh_anc_bs.path_admission.ancestry.owner_private_group.facts_tools) | list
         + [rh_anc_bs.path_admission.ancestry.owner_private_group.identity_provider.enumeration_tool,
            rh_anc_bs.path_admission.ancestry.owner_private_group.acl_tool])
        | map('extract', rh_anc_bs.os_tools) | reject('mapping') | list | length == 0
      # membership of 'path' in each tool entry (the ansible.builtin.contains test is `value in seq`)
      - >-
        (['principal', 'stat', 'read', 'filter'] | map('extract', rh_anc_bs.path_admission.ancestry.owner_private_group.facts_tools) | list
         + [rh_anc_bs.path_admission.ancestry.owner_private_group.identity_provider.enumeration_tool,
            rh_anc_bs.path_admission.ancestry.owner_private_group.acl_tool])
        | map('extract', rh_anc_bs.os_tools) | reject('contains', 'path') | list | length == 0
      - rh_anc_path is string and rh_anc_path is match(rh_anc_bs.path_admission.regex)
      - rh_anc_path is not search(rh_anc_bs.path_admission.forbidden_segment_regex)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.inputs, rh_anc_path | to_json]}) }}
    quiet: true

- name: Read the running uid (the owner principal) with the declared tool
  ansible.builtin.command:
    argv: ["{{ rh_anc_bs.os_tools.id.path }}", -u]
  register: _rh_anc_uid
  changed_when: false

- name: Stat every component of the path (no link followed; read-only; no mime / attribute helper)
  # get_mime / get_attributes false (route-r4c R4-SHARED-STAT-EFFECTS, codex-tick400): the stat module's defaults
  # would run the PATH-resolved helpers `file` (mime) and `lsattr` (attributes) on every component; neither result is
  # read by this rule. Native YAML module-configuration declarations (codex-tick399 stat_flags), not tunable.
  ansible.builtin.stat:
    path: >-
      {{ rh_anc_bs.path_admission.separator
         ~ (rh_anc_path.split(rh_anc_bs.path_admission.separator)[1:item] | join(rh_anc_bs.path_admission.separator)) }}
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: "{{ range(1, (rh_anc_path.split(rh_anc_bs.path_admission.separator) | length) + 1) | list }}"
  register: _rh_anc_st

# route op1r (C1 SR922h C1-GAP-ANCESTRY-UID-GRAMMAR; s64 :4471-4476, op2c retarget): the observed `id -u` line and each existing
# component's stat uid are admitted by FULL match of path_admission.ancestry.uid_regex (stat uids: a non-boolean integer
# whose decimal text fully matches) in THIS task, before the next task reads either as an integer. Its own fail_msg
# (templated before `that`, ansible-core 2.19.11) carries the observed values as JSON text only, never coerced. The
# caller's code and the declared components text (s64 :4455) refuse; no new text is authored.
- name: Admit the running uid line and every stat uid by the declared uid grammar (full match, before any integer read)
  vars:
    _ex: "{{ _rh_anc_st.results | map(attribute='stat') | selectattr('exists') | list }}"
  ansible.builtin.assert:
    that:
      - "'stdout' in _rh_anc_uid and _rh_anc_uid.stdout is string"
      - _rh_anc_uid.stdout is regex(rh_anc_bs.path_admission.ancestry.uid_regex, match_type='fullmatch')
      - _ex | reject('contains', 'uid') | list | length == 0
      - _ex | map(attribute='uid') | reject('integer') | list | length == 0
      - _ex | map(attribute='uid') | select('boolean') | list | length == 0
      - _ex | map(attribute='uid') | map('string') | reject('regex', rh_anc_bs.path_admission.ancestry.uid_regex, match_type='fullmatch') | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_path, rh_anc_bs.path_admission.admission_texts.components]
                                               + ([_rh_anc_uid.stdout | to_json] if ('stdout' in _rh_anc_uid) else [])
                                               + [_ex | map(attribute='path') | list | to_json]}) }}
    quiet: true

- name: Refuse linked, non-directory, foreign-owned, other-writable or foreign group-writable components
  # route op1r: every `| int` below reads a value the previous task admitted by full match of
  # ancestry.uid_regex (s64 :4476): GUARDED, no coercion fallback is reachable
  vars:
    _ex: "{{ _rh_anc_st.results | map(attribute='stat') | selectattr('exists') | list }}"
    _u: "{{ _rh_anc_uid.stdout | int }}"
  ansible.builtin.assert:
    that:
      - _u | int != 0
      - _ex | selectattr('islnk') | list | length == 0
      - _ex | rejectattr('isdir') | list | length == 0
      - _ex | map(attribute='uid') | reject('in', [0, _u | int]) | list | length == 0
      - _ex | selectattr('woth') | list | length == 0
      - _ex | selectattr('wgrp') | rejectattr('uid', 'equalto', _u | int) | list | length == 0
      - rh_anc_bs.path_admission.ancestry.owner_private_group.enabled is sameas true or (_ex | selectattr('wgrp') | list | length == 0)
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_path, rh_anc_bs.path_admission.admission_texts.components, _u,
                                                (_ex | selectattr('islnk') | map(attribute='path') | list + (_ex | rejectattr('isdir') | map(attribute='path') | list)
                                                 + (_ex | rejectattr('uid', 'in', [0, _u | int]) | map(attribute='path') | list) + (_ex | selectattr('woth') | map(attribute='path') | list)
                                                 + (_ex | selectattr('wgrp') | rejectattr('uid', 'equalto', _u | int) | map(attribute='path') | list)) | to_json]}) }}
    quiet: true

- name: Select the owner-owned group-writable components that need the owner-private-group proof
  ansible.builtin.set_fact:
    _rh_anc_pg: "{{ _rh_anc_st.results | map(attribute='stat') | selectattr('exists') | selectattr('wgrp') | map(attribute='path') | list }}"

# route op1p (CPL-SR922D-ROUTE-ANC-APPLICABILITY; C1 SR922d / SR922e): WHERE the exception may be attempted, per s43
# path_admission.ancestry.owner_private_group.applicability (key :4232, rule comment :4197-4231): the launch context is
# DERIVED here (first_match over `order`) from independently admitted facts only -- the N2 caller fact named at
# caller_fact_from, the pinned lme_invocation_mode, the presence of the run_pinned_vars bindings -- never from an
# include parameter; with no owner-owned group-writable component nothing here is read (when). A context whose
# `exception` is not `decided` (genesis_launch) and the `otherwise` case refuse with the caller's code and the declared
# text BEFORE the facts program and the decide_private_group.yml include. by_runner (s43 :4253-4254) is a declared
# landing table, not a context: MAIN_only launches arrive here as seed_run, their genesis-stage operations as
# genesis_launch, their privileged target plays never include this file (root_only).
- name: Admit the private-group applicability declaration (only with such a component; the shape this file implements)
  vars:
    _opg: "{{ rh_anc_bs.path_admission.ancestry.owner_private_group }}"
  ansible.builtin.assert:
    that:
      - "'applicability' in _opg and _opg.applicability is mapping"
      - "['derive', 'order', 'caller_fact_from', 'contexts', 'otherwise'] | reject('in', _opg.applicability) | list | length == 0"
      - _opg.applicability.derive == 'first_match'
      - _opg.applicability.order is sequence and _opg.applicability.order is not string
      - _opg.applicability.caller_fact_from is sequence and _opg.applicability.caller_fact_from is not string
      - _opg.applicability.contexts is mapping
      - _opg.applicability.order | reject('in', _opg.applicability.contexts) | list | length == 0
      - _opg.applicability.order | map('extract', _opg.applicability.contexts) | reject('mapping') | list | length == 0
      - _opg.applicability.order | map('extract', _opg.applicability.contexts) | reject('contains', 'when') | list | length == 0
      - _opg.applicability.order | map('extract', _opg.applicability.contexts) | reject('contains', 'exception') | list | length == 0
      - _opg.applicability.order | map('extract', _opg.applicability.contexts) | map(attribute='when') | reject('mapping') | list | length == 0
      # each `when` is one of the three forms this file derives; anything else is a shape it does not implement
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | map(attribute='when')
        | map('dict2items') | map('map', attribute='key') | map('sort') | map('list')
        | reject('in', [['caller_field', 'caller_in'], ['equals_from', 'var'], ['bindings_present', 'var_absent']]) | list | length == 0
      # a decided context names its bindings and where they come from; a refused one carries its text
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | selectattr('exception', 'equalto', 'decided')
        | reject('contains', 'bindings') | list | length == 0
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | selectattr('exception', 'equalto', 'decided')
        | rejectattr('bindings', 'sequence') | list | length == 0
      # the binding form (`var_absent`) is derived from the context's bindings_from / bindings: both present, a sequence each
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | selectattr('when', 'contains', 'var_absent')
        | reject('contains', 'bindings_from') | list | length == 0
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | selectattr('when', 'contains', 'var_absent')
        | reject('contains', 'bindings') | list | length == 0
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | selectattr('when', 'contains', 'var_absent')
        | map(attribute='bindings_from') | reject('sequence') | list | length == 0
      - >-
        _opg.applicability.order | map('extract', _opg.applicability.contexts) | rejectattr('exception', 'equalto', 'decided')
        | reject('contains', 'text') | list | length == 0
      - _opg.applicability.otherwise is mapping and 'text' in _opg.applicability.otherwise and _opg.applicability.otherwise.text is string
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.inputs,
                                                rh_anc_bs.path_admission.ancestry.owner_private_group | list | to_json]}) }}
    quiet: true
  when: _rh_anc_pg | length > 0

- name: Derive the launch context (first_match over the declared order; admitted facts only; read-only)
  vars:
    _app: "{{ rh_anc_bs.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.set_fact:
    _rh_anc_app: >-
      {%- set r = namespace(missing=[], holds=[]) -%}
      {%- set cf = namespace(n=rh_anc_bs, ok=true) -%}
      {%- for k in _app.caller_fact_from -%}{%- if cf.ok and cf.n is mapping and k in cf.n -%}{%- set cf.n = cf.n[k] -%}{%- else -%}{%- set cf.ok = false -%}{%- endif -%}{%- endfor -%}
      {%- if not (cf.ok and cf.n is string) -%}{%- set r.missing = r.missing + ['caller_fact_from'] -%}{%- endif -%}
      {%- for name in _app.order -%}
        {%- set c = _app.contexts[name] -%}{%- set w = c.when -%}
        {%- if 'caller_in' in w -%}
          {%- set p = namespace(n=rh_anc_bs, ok=true) -%}
          {%- for k in w.caller_in -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif cf.ok and cf.n is string and cf.n in vars
                   and lookup('ansible.builtin.vars', cf.n) in (p.n.values() | select('mapping') | select('contains', w.caller_field) | map(attribute=w.caller_field) | list) -%}
            {%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- elif 'equals_from' in w -%}
          {%- set p = namespace(n=rh_anc_bs, ok=true) -%}
          {%- for k in w.equals_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is string) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var in vars and lookup('ansible.builtin.vars', w.var) == p.n -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- else -%}
          {%- set p = namespace(n=rh_anc_bs, ok=true) -%}
          {%- for k in c.bindings_from -%}{%- if p.ok and p.n is mapping and k in p.n -%}{%- set p.n = p.n[k] -%}{%- else -%}{%- set p.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not (p.ok and p.n is mapping and c.bindings | reject('in', p.n) | list | length == 0 and w.bindings_present is sameas true) -%}{%- set r.missing = r.missing + [name] -%}
          {%- elif w.var_absent not in vars and c.bindings | reject('in', vars) | list | length == 0 -%}{%- set r.holds = r.holds + [name] -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ {'missing': r.missing, 'holds': r.holds} }}
  when: _rh_anc_pg | length > 0

- name: Refuse a launch context this declaration does not resolve (a declared path word absent)
  ansible.builtin.assert:
    that:
      - _rh_anc_app.missing | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': [rh_anc_bs.path_admission.admission_texts.inputs, _rh_anc_app.missing | to_json]}) }}
    quiet: true
  when: _rh_anc_pg | length > 0

- name: Refuse the exception outside a decided context (genesis_launch, otherwise) before any facts or decision
  vars:
    _app: "{{ rh_anc_bs.path_admission.ancestry.owner_private_group.applicability }}"
  ansible.builtin.assert:
    that:
      - _rh_anc_app.holds | length > 0
      - _app.contexts[_rh_anc_app.holds | first].exception == 'decided'
    # route op1q (codex 931 ROUTE_ASSERTION_DIAGNOSTICS): the assert action templates fail_msg BEFORE it evaluates
    # `that`, so every detail part is valid for every admitted context, a decided one (no `text` field) included: the
    # held context's text joins only under its membership conditional, otherwise.text only when nothing holds
    fail_msg: >-
      {{ lookup('ansible.builtin.template',
                rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ rh_anc_bs.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh_anc_bs.refusal_grammar, 'rh_rf_code': rh_anc_refusal,
                               'rh_rf_detail': ([_app.otherwise.text] if (_rh_anc_app.holds | length == 0) else [])
                                               + ([_app.contexts[_rh_anc_app.holds | first].text]
                                                  if (_rh_anc_app.holds | length > 0 and 'text' in _app.contexts[_rh_anc_app.holds | first]) else [])
                                               + [_rh_anc_app.holds | to_json, _rh_anc_pg | to_json]}) }}
    quiet: true
  when: _rh_anc_pg | length > 0

- name: Gather the private-group facts of each such component (declared tools; the same text the seed runs; read-only)
  vars:
    _pg: "{{ rh_anc_bs.path_admission.ancestry.owner_private_group }}"
  ansible.builtin.command:
    argv:
      - "{{ rh_anc_bs.os_tools.sh.path }}"
      - -c
      - >-
        {{ lookup('ansible.builtin.template', rh_anc_repo_root ~ rh_anc_bs.path_admission.separator ~ _pg.program_template_rel,
                  template_vars={'rh_pg_bs': rh_anc_bs, 'rh_pg_part': 'facts'}) }}
      - lme-private-group-facts
  # the generated text reads the directory from $_pgdir (task environment of this one command; nothing is exported)
  environment:
    _pgdir: "{{ item }}"
  loop: "{{ _rh_anc_pg }}"
  register: _rh_anc_facts
  changed_when: false

- name: Decide each group-writable component with the ONE generated program (controller)
  ansible.builtin.include_tasks: decide_private_group.yml
  vars:
    rh_pg_bs: "{{ rh_anc_bs }}"
    rh_pg_repo_root: "{{ rh_anc_repo_root }}"
    rh_pg_facts: "{{ _rh_anc_fact.stdout }}"
    rh_pg_refusal: "{{ rh_anc_refusal }}"
  loop: "{{ _rh_anc_facts.results }}"
  loop_control:
    loop_var: _rh_anc_fact
    label: "{{ _rh_anc_fact.item }}"

- name: Record the admitted owner-private-group components (output)
  ansible.builtin.set_fact:
    rh_anc_admitted_private_groups: "{{ _rh_anc_pg }}"
