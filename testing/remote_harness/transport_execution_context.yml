---
- name: Admit execution context through the source-bound managed controller
  hosts: "{{ rh_controller_target }}"
  gather_facts: false
  become: false
  tasks:
  - name: Refuse supplied derived outputs and bind the checkout
    ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml
  - name: Admit the actual controller connection before any stage effect
    ansible.builtin.include_tasks: tasks/admit_controller.yml
  - name: Resolve the original source and managed generation through the existing
      loader
    ansible.builtin.include_tasks: tasks/resolve_harness.yml
  - name: Bind the exact resolved execution contract and its original parser declarations
    ansible.builtin.set_fact:
      fw_contract: "{{ rh.controller.bootstrap.work_roots.run_local.execution_context
        }}"
      fw_source_root: "{{ rh_repo_root }}"
      fw_kind_tests: "{{ rh.controller.entry_generation.struct_kind_tests }}"
      fw_patterns: "{{ _lme_global_file.lme_config_registry.remote_harness_schema.contract_admission.patterns
        }}"
      fw_path_law: "{{ _lme_global_file.lme_config_registry.remote_harness_schema.contract_admission.path_law
        }}"
      fw_record_fields: "{{ rh.controller.bootstrap.resolved_config_record.fields
        }}"
      fw_parse_contract: "{{ _lme_global_file.lme_config_registry.remote_harness_schema.document_channel.parse
        }}"
      rh_fw_transport: "{{ rh.controller.bootstrap.work_roots.run_local.execution_context.transport
        }}"
      rh_fw_stage: "{{ rh.controller.bootstrap.work_roots.run_local.execution_context.stage
        }}"
  - name: Clear earlier canonical outputs before any stage request validation
    ansible.builtin.set_fact:
      '{{ fw_contract.validation.output_fact }}': '{{ rh_fw_transport.structural.absent }}'
      '{{ fw_contract.validation.serialized_output_fact }}': '{{ rh_fw_transport.structural.absent }}'
  - name: Bind the protected stage inputs using their declared names
    ansible.builtin.set_fact:
      rh_fw_seed_input: "{{ lookup(rh_fw_transport.jinja.vars, rh_fw_transport.seed.runtime.input_var)
        }}"
      rh_fw_current_phase: "{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.phase_var)
        }}"
      fw_ingress_label: "{{ rh_fw_transport.diagnostics.stage }}"
      fw_supervised: "{{ rh_fw_transport.structural.refused }}"
      fw_untyped_caller_vars: "{{ {fw_contract.var: lookup(rh_fw_transport.jinja.vars,
        fw_contract.var)} if fw_contract.var in vars else rh_fw_transport.structural.empty_map
        }}"
      rh_fw_ingress_selector: "{{ lookup(rh_fw_transport.jinja.vars, rh_fw_stage.selector_var)
        }}"
  - name: Admit the exact stage shape and phase before reading request bytes
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ rh_fw_stage.diagnostics.phase }}"
      that:
      - rh_fw_seed_input is mapping
      - rh_fw_seed_input.keys() | list | sort == rh_fw_transport.seed.runtime.input_fields.values()
        | list | sort
      - rh_fw_current_phase in rh_fw_stage.phases.values()
      - rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.selected] in rh.controller.bootstrap.source_admission.importers
      - rh_fw_ingress_selector in [fw_contract.ingress.caller_option, fw_contract.producer_intent.option]
  - name: Read the source-admitted gate publication declaration as data
    ansible.builtin.slurp:
      src: "{{ [fw_source_root, rh_fw_stage.source.gate_declaration] | path_join }}"
    register: rh_fw_gate_declaration_capture
  - name: Bind the original result publication policy
    ansible.builtin.set_fact:
      rh_fw: "{{ (rh_fw_gate_declaration_capture.content | b64decode | from_yaml)[rh_fw_stage.source.gate_root][rh_fw_stage.source.gate_results][rh_fw_stage.source.gate_descriptor]
        }}"
  - name: Derive requirement from the actual resolved acceptance importer
    ansible.builtin.set_fact:
      fw_required: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.selected]
        == rh.controller.bootstrap.work_roots.run_local.runners[rh_fw_stage.selected_runner].playbook
        }}"
      rh_fw_stage_directory: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.stage]
        }}"
  - name: Admit the stage request ancestry through the existing harness rule
    ansible.builtin.include_tasks: tasks/admit_ancestry.yml
    vars:
      rh_anc_bs: "{{ rh.controller.bootstrap }}"
      rh_anc_repo_root: "{{ rh_repo_root }}"
      rh_anc_path: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.request]
        }}"
      rh_anc_refusal: "{{ rh_fw_transport.diagnostics.stage }}"
  - name: Read the actual unprivileged stage owner
    ansible.builtin.command:
      argv: "{{ [rh.controller.bootstrap.os_tools.id.path] + rh_fw_transport.tools.id_flags
        }}"
    changed_when: rh_fw_transport.structural.refused
    register: rh_fw_stage_owner
  - name: Bind admitted tools and the original producer identity
    ansible.builtin.set_fact:
      rh_fw_producer_uid: "{{ rh_fw_stage_owner.stdout | int }}"
      rh_fw_realpath_tool: "{{ rh.controller.bootstrap.os_tools.realpath.path }}"
      rh_fw_sync_tool: "{{ rh.controller.bootstrap.os_tools.sync.path }}"
      rh_fw_move_tool: "{{ rh.controller.bootstrap.os_tools.mv.path }}"
      rh_fw_mkdir_tool: "{{ rh.controller.bootstrap.os_tools.mkdir.path }}"
  - name: Inspect the request once before retaining its bytes
    ansible.builtin.stat:
      path: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.request]
        }}"
      follow: "{{ rh_fw_transport.structural.refused }}"
      get_checksum: "{{ rh_fw_transport.structural.accepted }}"
      checksum_algorithm: "{{ rh_fw_transport.workroot.receipt.digest }}"
    register: rh_fw_request_stat
  - name: Require the exact private request file under this stage
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ rh_fw_transport.diagnostics.stage }}"
      that:
      - rh_fw_request_stat.stat.exists
      - rh_fw_request_stat.stat.isreg and not rh_fw_request_stat.stat.islnk
      - rh_fw_request_stat.stat.nlink == rh_fw_transport.structural.one
      - rh_fw_request_stat.stat.uid == rh_fw_producer_uid
      - rh_fw_request_stat.stat.mode == rh_fw_transport.seed.runtime.file_mode
      - rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.request] == [rh_fw_stage_directory,
        rh_fw_transport.seed.runtime.request_basename] | path_join
  - name: Retain the exact typed ingress without interpreting it in shell
    ansible.builtin.slurp:
      src: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.request]
        }}"
    register: rh_fw_request_capture
  - name: Bind retained request bytes and digest
    ansible.builtin.set_fact:
      fw_ingress_json: "{{ rh_fw_request_capture.content | b64decode if rh_fw_ingress_selector
        == fw_contract.ingress.caller_option else rh_fw_transport.structural.absent
        }}"
      rh_fw_request_sha256: "{{ rh_fw_request_capture.content | b64decode | hash(rh_fw_transport.workroot.receipt.digest)
        }}"
      fw_intent_json: "{{ rh_fw_request_capture.content | b64decode if rh_fw_ingress_selector
        == fw_contract.producer_intent.option else rh_fw_transport.structural.absent
        }}"
  - name: Refuse a request changed during its retained read
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ rh_fw_transport.diagnostics.stage }}"
      that:
      - rh_fw_request_sha256 == rh_fw_request_stat.stat.checksum
  - name: Reobserve the private request after retaining its exact bytes
    ansible.builtin.stat:
      path: "{{ rh_fw_seed_input[rh_fw_transport.seed.runtime.input_fields.request]
        }}"
      follow: "{{ rh_fw_transport.structural.refused }}"
      get_checksum: "{{ rh_fw_transport.structural.accepted }}"
      checksum_algorithm: "{{ rh_fw_transport.workroot.receipt.digest }}"
    register: rh_fw_request_after
  - name: Refuse changed request identity ownership mode or contents
    ansible.builtin.assert:
      quiet: true
      fail_msg: "{{ rh_fw_transport.diagnostics.stage }}"
      that:
      - rh_fw_request_after.stat.isreg and not rh_fw_request_after.stat.islnk
      - rh_fw_request_after.stat.nlink == rh_fw_transport.structural.one
      - rh_fw_request_after.stat.uid == rh_fw_producer_uid
      - rh_fw_request_after.stat.mode == rh_fw_transport.seed.runtime.file_mode
      - rh_fw_request_after.stat.dev == rh_fw_request_stat.stat.dev
      - rh_fw_request_after.stat.inode == rh_fw_request_stat.stat.inode
      - rh_fw_request_after.stat.checksum == rh_fw_request_sha256
  - name: Run the declared transport task under this admitted source and toolchain
    ansible.builtin.include_tasks: "{{ [rh_repo_root, rh_fw_stage.source.tasks] |
      path_join }}"
