---
# testing/remote_harness/initialize.yml -- the FIRST SOURCE BUILD INITIALIZER entry (N1; MAIN-recorded role: "committed
# source-authored initializer playbook (localhost, local connection, become false, under A)"). NEW FILE. NON-GENERATED.
# AUTHORED, NEVER EXECUTED (UNRUN). Change record: successor-03/records-n1.yml.
# SUCCESSOR-05: supersedes initialize.successor-04.yml.after (e89cfe55, FROZEN, not rewritten) per the coordinator ledger
# 68a15997, codex-tick757 (per-field source semantics), codex-tick761 O1 / O3 / O6 and C1 s23 records-registry-ingress-02
# (d58b7fff). Change record: successor-03/records-n1-07.yml. ATOMIC JOIN: lands only with C1 s23 (C1-RI2-DECL-03 init
# transport, C1-RI2-ALS-01) and C1 s24 records-vocab-keys-01 (0fe87210; the vocabulary node it reads).
#   D10 the retain / strip selectors are the registry vocabulary words attributes.item_key and tests.in (typed before
#       use), not quoted selectors.
#   D11 per field (757; 761 O3): every retained field is declared in source_admission.bootstrap_input.construction.fields
#       with exactly the declared context source; a missing field declaration or any other source refuses. The value of a
#       context-source field is compared with the whole protected rh_src_context (761 O3), type-strict, as in s04. No
#       field count is pinned and rh_src_context is never indexed by a field name.
#   D12 761 O1 / C1 s23: the guard admitted the registry identity on the transport whose var is this entry's declared
#       root input var, and the forwarded carrier holds that identity at that transport's key path.
# SUCCESSOR-04: supersedes initialize.successor-03.yml.after (91e0d399, FROZEN, not rewritten) per codex-tick751
# (OPEN-N1-05-CTX-STRIP) and codex-tick754 (context_ruling order). Change record: successor-03/records-n1-06.yml. ATOMIC
# JOIN: lands only with N8 s12, C1 records-cold-state-01 (carrier_state; _rh_sa_reg from its PR-RPO producer, HELD) and C1
# records-context-macro-join-01 (rh_src_context). Not deployable before them (OPEN-N1-06-STRIP-SOURCE).
#   D8 the root input carries the generated complete-only fields (N8 s12). BEFORE any filter, a root missing a field of
#      the retained registry set _rh_sa_reg.carrier_state.complete_only refuses. The fields are retained in the protected
#      fact _rh_init_ctx; ONLY that set is removed from the forwarded carrier _rh_init_in (rh_rp_input).
#   D9 after the ONE resolve and before _rh_init_adm and admit_builder, the retained key set equals the profile binding
#      source_admission.carrier_state_schema.complete_only, and each retained value equals the protected completed context
#      rh_src_context (C1-CMJ-RP-05R) under the existing lme_type_aware_equal filter. rh_src_context is read, never rebuilt.
#      The ORDER step 3 and DECLARED INPUT text below predate s04 (OPEN-N1-06-STALE-TEXT).
# SUCCESSOR-03: supersedes initialize.successor-02.yml.after (f9fc065e, FROZEN, not rewritten) per codex-tick740 (staged
# admission; N1 is the third caller), codex-tick744 (value sourcing; 744-STATE-PRODUCERS kept) and codex-tick747
# (known_consumer_joins). Change record: successor-03/records-n1-05.yml. ATOMIC JOIN: lands only with genesis_generate
# s04, N9 s08, N8 s11, N2 s19, N11 s10, records-profile-06, records-global-12, C1 records-ctx-producer-02 and C1
# records-staged-reader-01. The s02 ATOMIC JOIN line naming records-ctx-producer-01 is superseded by this list.
#   D6 prose: D5 and the DECLARED INPUT comment no longer say the root input carries context (codex-tick740: it does not).
#   D7 after the ONE resolve, the forwarded carrier holds no complete-only record key. The key set is read from the
#      contract-admitted source_admission.carrier_state_schema.complete_only (codex-tick747 SCHEMA-HOME), not restated.
#      The codex-tick747 join "strip context from the cold forwarded carrier, then compare the generated complete
#      context with the completed projection" is NOT implemented. The strip has to happen before the resolve, when no
#      declared value naming the complete-only key is readable here. N7 also generates no context (root_input['keys'] has
#      none). Carried as OPEN-N1-05-CTX-STRIP (the same root cause as OPEN-EF0-OVS-COLD-SOURCE).
# SUCCESSOR-02: supersedes initialize.successor-01.yml.after (0cd7608e, FROZEN, not rewritten) per codex-tick738
# controller_decisions (OPEN-EF0-GGEN-COMBINE; early_context = codex-tick728 option (i)) and the EF0-GENESIS-CTX design
# record proposals/ef0-controller/genesis-ctx-producer-design-01.yml (b800a2e6) G-03. Change record:
# successor-03/records-n1-04.yml. ATOMIC JOIN: lands only with N8 s10, N11 s09, N2 s18, records-profile-06,
# records-global-12 and C1 records-ctx-producer-01.
#   D5 the root input carries NO context (s03 correction, codex-tick740: root_input['keys'] stays the five cold keys,
#      records-profile-06; context is constructed after the staged reader) but the declared override state: <override_state.key> holds ONE
#      override_state.words value, and the root keys minus cold_only are EXACTLY root_input['keys'] + [override_state.key]
#      + override_state.fields[<the state that word names>]. The s01 presence count of the override pair is retired: a
#      half pair, an unknown or missing state word, or a field the state does not declare refuses (texts.input). The
#      state words, field sets and the projection come from the declaration; no word is literal here.
# SUCCESSOR-01: supersedes initialize.yml.after (fc4ec70a, FROZEN, not rewritten) per codex715 OPT-ACT-STAGE (N1 is the
# dispatcher), C1-PKG records-dispatch-03 (a3411420; OPT-OP-DISPATCH-INPUTS, OPT-PROJ-N2) and codex725 ADMIT-01 YES.
# ATOMIC JOIN (codex719 / codex725): lands only with N2 s14, AB-02V (records-tasks-02), N8 s08 / s09, N11 s08 and
# records-dispatch-01 / -02 / -03. Change record: successor-03/records-n1-02.yml.
#   D1 the pre-resolve shape assert no longer refuses a non-string value: the root carries the cold-only keys
#      (root_input.cold_only) in their cold_forms, unattributable before the resolve; N2 s14 judges the carrier forms.
#   D2 the WHOLE root is forwarded (no pre-resolve projection); after the resolve the root keys minus override_keys minus
#      cold_only must be root_input['keys'] (subscript: attribute .keys is the dict METHOD), and every cold-only key is
#      admitted by its cold_forms entry (one ordered record per inventory_kinds[inventory_kind].files entry, each record
#      exactly fields, the role words in that order, each digest a digest_regex match).
#   D3 the N5 gate and include are removed (N6 dissolved; OD-N1-GSR-IFACE and OD-N1-DOUBLE-RESOLVE close: N1 resolves
#      once, record_free; the W1 child source_bootstrap resolves in its own process). After the admission fact and the
#      view compare, admit_builder runs for the declared genesis.initializer.stage (codex725) in the stage root N7
#      prepared, N1's own -i sources and their current bytes are compared to the admitted inventory binding, and the ONE
#      W1 plan selection.plans[dispatch.flow] is dispatched ONCE with the same act (one command, no ignore_errors).
#   D4 the entry stat reads the declared source_admission.digest_algorithm (was the literal sha256).
#   ORDERING OBLIGATION (codex725, not admitted retroactively): the entry stat below and the N2 loader modules inside
#   resolve_policy run BEFORE admit_builder binds the genesis temps and interpreter.
#
# ORDER (profile header: refuse_pinned_outputs -> admit_controller -> the ONE loader, record-free first pass -> own work):
#   1. tasks/refuse_pinned_outputs.yml (derives rh_repo_root; refuses pre-supplied reserved outputs, _rh_init_* among
#      them; binds the canonical refusal value _rh_sa_rref) -> tasks/admit_controller.yml (localhost, local, no become).
#   2. no anchor record may be supplied (texts.anchor); the root input is admitted by SHAPE only (nothing readable yet),
#      the running controller python is its interpreter key (first module context, as N9 s03).
#   3. the carrier _rh_init_in admitted ONCE from rh_init_root (reserved fact; forwarded verbatim, cold-only keys included).
#   4. tasks/resolve_policy.yml with rh_rp_input + rh_rp_caller (this file's rel; IF-S14-PHASE-1): N2 derives the
#      phase from resolve_phases.callers[rh_rp_caller] (record_free; C1 callers row), the SOLE loader; N2 s14 projects
#      the carrier by the declared key partition after its parse (OPT-PROJ-N2).
#   5. the entry identity from the admitted declaration (genesis.initializer.playbook_rel), measured bytes / caller row /
#      phase / path, the root input against root_input (keys, var, override pair, cold_only by cold_forms) ->
#      _rh_init_adm (records-tasks AB-02U / AB-02V contract: entry_rel, declaration_sha256, edition).
#   6. the resolved view compared with the carrier.
#   7. tasks/admit_builder.yml with rh_gen_stage = genesis.initializer.stage (AB-02V initializer branch).
#   8. the -i sources against the admitted inventory binding; the dispatch inputs against the dispatched plan; the ONE
#      W1 dispatch (genesis.entry.generated_rel) with the same act. N7 reads the W1 step records back (N8).
#
# OPEN (reported, not invented):
#   OD-N1-N6               CLOSED by records-n6-01 SUP-04 (N6 dissolved; no include).
#   OD-N1-GSR-IFACE        CLOSED by records-n6-01 SUP-04 (no N5 include; N1 dispatches W1).
#   OD-N1-DOUBLE-RESOLVE   CLOSED by records-n6-01 SUP-04 (one record_free resolve in this process).
#   OD-N1-ROOT-RESERVE     _rh_init_adm and _rh_init_in are registry reserved_outputs (records-global-06 GL-02Z); the
#                          stat registers _rh_init_ent and _rh_init_inv are not (PROP-GL-02Z1, C1).
#   OD-N1-ENTRY-TEXT       texts.entry describes the RELEASE entry (custody.entry_rel); this entry uses refusals.entry
#                          for its own identity; the text needs an initializer wording.
#   OD-N1-LAUNCH-TEXT      texts.launch names "the package child process"; the dispatch refusal uses it for the W1 plan.
#   OD-N1-MEMBER           the bytes check below reads N1's member digest; N1 must be a members_rel member (C1 MEM-AUTH-INIT).
#   OD-N1-VAR-LITERAL      the input name rh_init_root is a literal here (the stage input word N7 writes); it is checked
#                          equal to genesis.initializer.root_input.var after the resolve (control C-N1-VAR-LITERAL).
#   OD-N1-ENV-PAIR         the entry's env -i pairs are NAME '=' VALUE words (env(1) grammar): no declaration names the
#                          separator; the same literal stands in B run_one_case (dk3 :1679). Disclosed, not exempted.
#
# DECLARED INPUT: rh_init_root (genesis.initializer.root_input.var; one typed JSON stage input written by N7):
#   {declaration_path: [..], declaration_rel, declaration_sha256, edition, interpreter,   (no context: s03, codex-tick740)
#    <override_state.key>: <a words value>[, the fields of that state]}  (s02 D5)
#   + the cold-only keys (root_input.cold_only), each in its root_input.cold_forms form.

- name: First source build initializer (record-free entry under admitted A; launched by the release artifact)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs, derive the repository root and bind the canonical refusal value
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, localhost, no become)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    # Nothing of the declaration is readable yet: the root input is admitted by shape; the refusal value is C1's
    # protected fact (refuse_pinned_outputs.yml). An anchor record is never an initializer input (texts.anchor).
    # A cold-only value (a list of records) cannot be attributed before the resolve: no per-value string check here
    # (records-dispatch-03 OPT-PROJ-N2; carrier forms are judged by N2 s14, cold-only forms below by cold_forms).
    - name: Refuse an absent or malformed root input, or a running interpreter other than its own (shape only; pre-resolve)
      ansible.builtin.assert:
        that:
          - rh_gen_anchor is not defined
          - rh_init_root is defined and rh_init_root is mapping
          - rh_init_root.interpreter is defined and rh_init_root.interpreter is string
          - rh_init_root.declaration_path is defined and rh_init_root.declaration_path is sequence and rh_init_root.declaration_path is not string
          - rh_init_root | dict2items | map(attribute='value') | select('equalto', '') | list | length == 0
          - ansible_playbook_python == rh_init_root.interpreter
        fail_msg: >-
          REFUSED {{ _rh_sa_rref.input }}: the initializer takes exactly one mapping root input (its declaration_path a
          list, no empty value), no anchor record, and runs under the interpreter that input names
        quiet: true

    # s04 D8 (codex-tick751 OPEN-N1-05-CTX-STRIP): the complete-only names come from the retained, digest-admitted registry
    # node _rh_sa_reg.carrier_state (C1 records-cold-state-01; its producer PR-RPO is HELD: OPEN-N1-06-STRIP-SOURCE),
    # type-checked with its declared member type. A root missing any of them refuses BEFORE anything is filtered.
    - name: Refuse a root input missing a declared complete-only field (before the strip; names from the retained registry)
      ansible.builtin.assert:
        that:
          - _rh_sa_reg is mapping and _rh_sa_reg.carrier_state is mapping and _rh_sa_reg.carrier_state.member_type is string
          - >-
            _rh_sa_reg.carrier_state.complete_only is sequence and _rh_sa_reg.carrier_state.complete_only is not string
            and _rh_sa_reg.carrier_state.complete_only is not mapping
            and (_rh_sa_reg.carrier_state.complete_only | length) != 0
            and (_rh_sa_reg.carrier_state.complete_only | reject(_rh_sa_reg.carrier_state.member_type) | list | length) == 0
            and (_rh_sa_reg.carrier_state.complete_only | unique | list | length) == (_rh_sa_reg.carrier_state.complete_only | length)
          - (_rh_sa_reg.carrier_state.complete_only | difference(rh_init_root.keys() | list) | length) == 0
          # s05 D10 (C1 s24 records-vocab-keys-01 C1-VK-GL-05 vocabulary): the selector words read below are typed first
          - _rh_sa_reg.vocabulary is mapping and _rh_sa_reg.vocabulary.tests is mapping and _rh_sa_reg.vocabulary.attributes is mapping
          - _rh_sa_reg.vocabulary.attributes.item_key is string and _rh_sa_reg.vocabulary.tests.in is string
        fail_msg: >-
          REFUSED {{ _rh_sa_rref.input }}: the initializer root input must carry every declared complete-only field
        quiet: true

    # s04 D8: the generated complete-only fields are RETAINED in the protected fact _rh_init_ctx (reserved: records-n1-06)
    # and removed ONLY from the forwarded carrier _rh_init_in, by the same declared name set. Nothing else is filtered.
    - name: Retain the generated complete-only fields, then admit the carrier ONCE without them (reserved facts; never regenerated)
      ansible.builtin.set_fact:
        # s05 D10: the selectors are the registry vocabulary words (typed above), not quoted literals
        _rh_init_ctx: "{{ rh_init_root | dict2items | selectattr(_rh_sa_reg.vocabulary.attributes.item_key, _rh_sa_reg.vocabulary.tests.in, _rh_sa_reg.carrier_state.complete_only) | items2dict }}"
        _rh_init_in: "{{ rh_init_root | dict2items | rejectattr(_rh_sa_reg.vocabulary.attributes.item_key, _rh_sa_reg.vocabulary.tests.in, _rh_sa_reg.carrier_state.complete_only) | items2dict }}"

    # C1 IF-S14-PHASE-1: the binder is this authored file's own rel (its resolve_phases.callers key, record_free).
    # OPT-PROJ-N2: the root minus ONLY its complete-only fields (s04 D8) is forwarded; N2 s14 projects the carrier after its
    # parse and never reads a cold-only value (records-staged-reader-01 C1-SR-RP-03 refuses a forwarded complete-only key).
    - name: Resolve the harness policy through the SOLE loader (record-free first pass; N2 runs once inside it)
      ansible.builtin.include_tasks: tasks/resolve_policy.yml
      vars:
        rh_rp_caller: testing/remote_harness/initialize.yml
        rh_rp_input: "{{ _rh_init_in }}"
        rh_invocation_requirement: "{{ _rh_sa_decl.invocation.requirements.ordinary_permitted }}"

    - name: Stat this entry at its declared path (no link followed; measured bytes)
      ansible.builtin.stat:
        path: "{{ rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ _rh_sa_bs.genesis.initializer.playbook_rel }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_init_ent

    - name: Refuse this entry outside its declared identity, record-free caller row, phase, bytes, path and root input
      ansible.builtin.assert:
        that:
          - _rh_sa_decl.resolve_phases.callers[_rh_sa_bs.genesis.initializer.playbook_rel] == _rh_sa_decl.resolve_phases.words[_rh_sa_bs.genesis.initializer.root_input.phase]
          - _rh_sa_phase == _rh_sa_decl.resolve_phases.callers[_rh_sa_bs.genesis.initializer.playbook_rel]
          - (rh_repo_root ~ _rh_sa_bs.path_admission.separator ~ (_rh_sa_bs.genesis.initializer.playbook_rel | dirname)) == playbook_dir
          - _rh_init_ent.stat.exists and _rh_init_ent.stat.isreg and not _rh_init_ent.stat.islnk
          - >-
            _rh_init_ent.stat.checksum
            == rh_src_admission[_rh_sa_decl.record_fields.members][_rh_sa_bs.genesis.initializer.playbook_rel][_rh_sa_decl.member_fields.observed]
          - _rh_sa_bs.genesis.initializer.admission.var == '_rh_init_adm'
        fail_msg: >-
          REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.entry }}: {{ _rh_sa_bs.genesis.initializer.texts.entry }}
        quiet: true

    - name: Refuse a root input that is not exactly the declared root input of the admitted declaration
      ansible.builtin.assert:
        that:
          # C-N1-VAR-LITERAL: the input word this entry reads is the declared root_input.var
          - _rh_sa_bs.genesis.initializer.root_input.var == 'rh_init_root'
          # records-dispatch-03 + s02 D5 (codex-tick738): the carrier names ONE declared override state word, and the root keys
          # minus cold_only == root_input['keys'] + [override_state.key] + the fields of that state (subscript; exact)
          - _rh_sa_bs.genesis.initializer.root_input.override_state.key in _rh_init_in
          - >-
            (_rh_sa_bs.genesis.initializer.root_input.override_state.words | dict2items
             | selectattr('value', 'equalto', _rh_init_in[_rh_sa_bs.genesis.initializer.root_input.override_state.key])
             | list | length) == 1
          - >-
            (_rh_init_in.keys() | reject('in', _rh_sa_bs.genesis.initializer.root_input.cold_only) | sort)
            == ((_rh_sa_bs.genesis.initializer.root_input['keys'] + [_rh_sa_bs.genesis.initializer.root_input.override_state.key]
                 + _rh_sa_bs.genesis.initializer.root_input.override_state.fields[_rh_sa_bs.genesis.initializer.root_input.override_state.words
                   | dict2items | selectattr('value', 'equalto', _rh_init_in[_rh_sa_bs.genesis.initializer.root_input.override_state.key])
                   | map(attribute='key') | first]) | sort)
          - _rh_init_in.declaration_sha256 == (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm))
          - rh_src_admission[_rh_sa_decl.record_fields.edition] == _rh_init_in.edition
          # s05 D12 (codex-tick761 O1; C1 s23 records-registry-ingress-02 C1-RI2-DECL-03 / C1-RI2-ALS-01; result words of
          # records-registry-ingress-01 PR-RI-DECL output): the guard took the identity on the transport whose var is this
          # entry's declared root input var, and the forwarded carrier holds the guard identity at that transport's key path
          - _rh_sa_regadm.ingress.transports[_rh_sa_regadm[_rh_sa_regadm.ingress.output.transport]].var == _rh_sa_bs.genesis.initializer.root_input.var
          - >-
            _rh_init_in[_rh_sa_regadm.ingress.transports[_rh_sa_regadm[_rh_sa_regadm.ingress.output.transport]].path | first]
            == _rh_sa_regadm[_rh_sa_regadm.ingress.output.identity]
        fail_msg: >-
          REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.input }}: {{ _rh_sa_bs.genesis.initializer.texts.input }}
        quiet: true

    # records-dispatch-03 owed_constraints: each cold-only key of _rh_init_in by its cold_forms entry. The record words
    # are the step record's inventory words (genesis.launch.step_record.emit['keys'].config.inventory: role / path /
    # sha256 fields, as N8 s08 :135-147); the role words are inventory_kinds[cold_forms[key].inventory_kind].files in
    # that order. Bytes and paths are compared to this process's own -i sources after admit_builder (below).
    - name: Refuse a cold-only root key that is absent or not its declared cold form (after the resolve)
      vars:
        _gi: "{{ _rh_sa_bs.genesis.initializer }}"
        _ci: "{{ _rh_sa_bs.genesis.launch.step_record.emit['keys'].config.inventory }}"
        _cbad: >-
          {%- set ns = namespace(b=[]) -%}
          {%- for k in _gi.root_input.cold_only -%}
          {%- if k not in _gi.root_input.cold_forms or k not in _rh_init_in -%}{%- set ns.b = ns.b + [k] -%}
          {%- else -%}
          {%- set cf = _gi.root_input.cold_forms[k] -%}
          {%- set v = _rh_init_in[k] -%}
          {%- if cf.inventory_kind != _gi.custody.launch.inventory_kind or cf.inventory_kind not in _rh_sa_bs.genesis.launch.inventory_kinds
                 or (cf.fields | sort) != ([_ci.role, _ci.path, _ci.sha256] | sort)
                 or v is string or v is mapping or v is not sequence
                 or (v | length) != (_rh_sa_bs.genesis.launch.inventory_kinds[cf.inventory_kind].files | length) -%}
          {%- set ns.b = ns.b + [k] -%}
          {%- else -%}
          {%- for rec in v -%}
          {%- if rec is not mapping or (rec.keys() | list | sort) != (cf.fields | sort)
                 or rec[_ci.role] != _rh_sa_bs.genesis.launch.inventory_kinds[cf.inventory_kind].files[loop.index0]
                 or rec[_ci.path] is not string or rec[_ci.sha256] is not string
                 or rec[_ci.sha256] is not ansible.builtin.regex(_rh_sa_bs.genesis.entry.digest_regex, match_type='fullmatch') -%}
          {%- set ns.b = ns.b + [k ~ _rh_sa_bs.path_admission.separator ~ loop.index0] -%}
          {%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}{{ ns.b }}
      ansible.builtin.assert:
        that:
          - _cbad | length == 0
        fail_msg: >-
          REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.input }}: {{ _rh_sa_bs.genesis.initializer.texts.input }}
          (cold-only {{ _cbad | to_json }})
        quiet: true

    # s04 D9 (codex-tick751 CTX-STRIP; codex-tick754 order: rh_src_context publication -> THIS comparison -> initializer
    # admission and effects). rh_src_context is the protected completed context resolve_policy published from its ONE
    # construction (C1 records-context-macro-join-01 C1-CMJ-RP-05R; reserved C1-SR-GL-01): only read here, never rebuilt
    # (no reload, no second resolve, nothing derived from _rh_init_ctx). The retained key set equals the profile binding
    # and the retained registry set; every retained value equals rh_src_context under the existing lme_type_aware_equal.
    - name: Refuse retained generated fields that are not the completed context (type-strict; before the initializer admission)
      ansible.builtin.assert:
        that:
          - (_rh_init_ctx.keys() | list | sort) == (rh.controller.bootstrap.source_admission.carrier_state_schema.complete_only | sort)
          - (_rh_init_ctx.keys() | list | sort) == (_rh_sa_reg.carrier_state.complete_only | sort)
          # s05 D11 (codex-tick757 per-field; codex-tick761 O3 the existing construction.fields[field].source dispatch):
          # the construction entries of the retained fields are EXACTLY one {source: <the declared context source>} per
          # retained field. A retained field without a construction entry, or with any other source or a path, refuses;
          # the context source is the whole completed rh_src_context, so each value is compared with it below.
          - >-
            _rh_sa_decl.bootstrap_input.construction is mapping and _rh_sa_decl.bootstrap_input.construction.fields is mapping
            and _rh_sa_decl.bootstrap_input.construction.sources is mapping
            and _rh_sa_decl.bootstrap_input.construction.sources.context is string
          - >-
            (_rh_sa_decl.bootstrap_input.construction.fields | dict2items
             | selectattr(_rh_sa_reg.vocabulary.attributes.item_key, _rh_sa_reg.vocabulary.tests.in, _rh_init_ctx.keys() | list)
             | items2dict | to_json(sort_keys=true))
            == (dict(_rh_init_ctx.keys() | list
                     | zip([dict(source=_rh_sa_decl.bootstrap_input.construction.sources.context)] * (_rh_init_ctx | length)))
                | to_json(sort_keys=true))
          - rh_src_context is mapping
          - _rh_init_ctx.values() | list | lme_type_aware_equal([rh_src_context] * (_rh_init_ctx | length))
        fail_msg: >-
          REFUSED {{ _rh_sa_bs.genesis.initializer.refusals.input }}: {{ _rh_sa_bs.genesis.initializer.texts.input }}
          (complete-only {{ _rh_init_ctx.keys() | list | sort | to_json }})
        quiet: true

    # The initializer admission fact (reserved; records-tasks AB-02U / AB-02V contract, OD-N1-ADM-SHAPE-01) is set only NOW.
    - name: Set the initializer admission fact (reserved; after its identity, caller, bytes, path and input were admitted)
      ansible.builtin.set_fact:
        _rh_init_adm:
          entry_rel: "{{ _rh_sa_bs.genesis.initializer.playbook_rel }}"
          edition: "{{ _rh_init_in.edition }}"
          declaration_sha256: "{{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }}"

    - name: Refuse a resolved view that is not the admitted record-free binding (declaration, node, initializer, edition)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.source_admission == _rh_sa_decl
          # s03 D7 (codex-tick740 / 747): the forwarded cold carrier holds no complete-only record key. The set is the
          # contract-admitted carrier_state_schema.complete_only, never restated. s04 (codex-tick751): the generated
          # complete-only fields were retained in _rh_init_ctx, stripped before forwarding and compared above (s04 D9).
          - (_rh_init_in.keys() | list | intersect(rh.controller.bootstrap.source_admission.carrier_state_schema.complete_only) | length) == 0
          - rh.controller.bootstrap.source_admission.bootstrap_input.declaration_rel == _rh_init_in.declaration_rel
          - rh.controller.bootstrap.source_admission.bootstrap_input.declaration_path == _rh_init_in.declaration_path
          - rh.controller.bootstrap.genesis.initializer == _rh_sa_eff.genesis.initializer
          - rh_src_admission[rh.controller.bootstrap.source_admission.record_fields.edition] == _rh_init_in.edition
          - >-
            (_rh_sa_in | dict2items | selectattr('key', 'in', _rh_init_in.keys() | list) | items2dict | to_json(sort_keys=true))
            == (_rh_init_in | dict2items | selectattr('key', 'in', rh.controller.bootstrap.source_admission.bootstrap_input.record_keys) | items2dict | to_json(sort_keys=true))
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.input }}: {{ rh.controller.bootstrap.genesis.initializer.texts.input }}
        quiet: true

    # codex725 ADMIT-01: the existing builder admission, for the declared initializer stage (an authoring.initializer
    # purpose, AB-02V), in the stage root N7 prepared under OPT-ACT-STAGE (<tmp>/<stage_root.rel>/<stage>/<act>, the
    # same act). It binds the genesis temps, the module interpreter and the act before any module below.
    - name: Admit the authoring builder for the declared initializer stage (the existing admit_builder initializer branch)
      ansible.builtin.include_tasks: tasks/admit_builder.yml
      vars:
        rh_gen_stage: "{{ rh.controller.bootstrap.genesis.initializer.stage }}"

    - name: Dispatch the ONE W1 plan of the declared dispatch flow with the same act (after the inventory and input checks)
      vars:
        _rb: "{{ rh.controller.bootstrap }}"
        _g: "{{ rh.controller.bootstrap.genesis }}"
        _dp: "{{ rh.controller.bootstrap.genesis.initializer.dispatch }}"
        _sel: "{{ rh.controller.bootstrap.genesis.entry.selection }}"
        _cli: "{{ rh.controller.bootstrap.genesis.entry.cli }}"
        _l: "{{ rh.controller.bootstrap.genesis.launch }}"
        _sl: "{{ rh.controller.bootstrap.seed_launch }}"
        _ci: "{{ rh.controller.bootstrap.genesis.launch.step_record.emit['keys'].config.inventory }}"
        # the admitted cold inventory records, every cold-only key in cold_only order (each admitted above)
        _crec: >-
          {%- set ns = namespace(r=[]) -%}
          {%- for k in rh.controller.bootstrap.genesis.initializer.root_input.cold_only -%}{%- set ns.r = ns.r + _rh_init_in[k] -%}{%- endfor -%}{{ ns.r }}
        _rpath: >-
          {%- set ns = namespace(d={}) -%}
          {%- for rec in _crec -%}{%- set ns.d = ns.d | combine({rec[_ci.role]: rec[_ci.path]}) -%}{%- endfor -%}{{ ns.d }}
        # Operator inputs follow the same declared gate semantics as the genesis entry. Ungated inputs are
        # mandatory. An open gated input is selected when required or supplied; a closed gate selects nothing.
        # The exact-key assertion below therefore refuses both missing required inputs and supplied closed inputs.
        _ops: >-
          {%- set ns = namespace(o=[]) -%}
          {%- for st in _sel.plans[_dp.flow].steps -%}{%- for row in _l.stages[st.stage].stage_inputs -%}
          {%- if row.name in _l.operator_inputs and row.source == _l.operator_inputs[row.name].class
                 and row.name != _sel.input and row.name not in ns.o -%}
          {%- set oi = _l.operator_inputs[row.name] -%}
          {%- if (oi.keys() | select(_rh_sa_reg.vocabulary.tests.in, _l.operator_input_kinds.modifiers) | list | length) == 0 -%}
          {%- set ns.o = ns.o + [row.name] -%}
          {%- elif oi.gate.input in _dp.inputs -%}
          {%- set gd = namespace(v=rh.controller) -%}
          {%- for k in _l.operator_inputs[oi.gate.input].domain -%}{%- set gd.v = gd.v[k] -%}{%- endfor -%}
          {%- if gd.v[_dp.inputs[oi.gate.input]] == gd.v[oi.gate.key]
                 and (oi.gate.required or row.name in _dp.inputs) -%}
          {%- set ns.o = ns.o + [row.name] -%}
          {%- endif -%}{%- endif -%}{%- endif -%}
          {%- endfor -%}{%- endfor -%}{{ ns.o }}
        # the file roles of the dispatched plan's inventory kinds that are entry path arguments (selection.file_args)
        _roles: >-
          {%- set ns = namespace(r=[]) -%}
          {%- for st in _sel.plans[_dp.flow].steps -%}{%- for r in _l.inventory_kinds[st.inventory_kind].files -%}
          {%- if r in _sel.file_args and r not in ns.r -%}{%- set ns.r = ns.r + [r] -%}{%- endif -%}
          {%- endfor -%}{%- endfor -%}{{ ns.r }}
        # the entry's env -i pairs: EXACTLY seed_launch.env.order (the entry's launch_base_check / launch_home contract),
        # each from ONE declared source: the base node, or an inherited name whose source is the one this process's own
        # launch env declares (admitted by admit_builder), carried from this process
        _env: >-
          {%- set ns = namespace(p=[], bad=[]) -%}
          {%- for n in _sl.env.order -%}
          {%- if ([n in _rb[_sl.env.base], n in _sl.env.inherited] | select | list | length) != 1 -%}{%- set ns.bad = ns.bad + [n] -%}
          {%- elif n in _rb[_sl.env.base] -%}{%- set ns.p = ns.p + [n ~ '=' ~ _rb[_sl.env.base][n]] -%}
          {%- elif n in _l.env.inherited and _l.env.inherited[n] == _sl.env.inherited[n] -%}{%- set ns.p = ns.p + [n ~ '=' ~ lookup('ansible.builtin.env', n)] -%}
          {%- else -%}{%- set ns.bad = ns.bad + [n] -%}
          {%- endif -%}
          {%- endfor -%}{{ {'pairs': ns.p, 'bad': ns.bad} }}
        # the env(1) words between the env tool and its pairs in the declared genesis exec vector (launch.argv)
        _eflags: "{{ _l.argv[(_l.argv.index(_l.scalar_slots.env_path) + 1):_l.argv.index(_l.slots.env_pairs)] }}"
        _argv: >-
          {%- set ns = namespace(w=[_rb.os_tools.env.path] + _eflags + _env.pairs
                + [_rb.os_tools.sh.path, rh_repo_root ~ _rb.path_admission.separator ~ _g.entry.generated_rel,
                   _cli.prefix ~ _cli.args.act, lookup('ansible.builtin.vars', _l.stage_root.act.var),
                   _cli.prefix ~ _cli.args.edition, _rh_init_in.edition,
                   _cli.prefix ~ _cli.args.declaration_sha256, _rh_init_in.declaration_sha256,
                   _cli.prefix ~ _cli.input_prefix ~ _sel.input, _sel.flows[_dp.flow]]) -%}
          {%- for k in _rb.source_admission.bootstrap_input.record_keys
                if _rb.source_admission.bootstrap_input.construction.fields[k].source
                   == _rb.source_admission.bootstrap_input.construction.sources.registry -%}
          {%- set ns.w = ns.w + [_cli.prefix ~ _cli.args[k], _rh_init_in[k]] -%}
          {%- endfor -%}
          {%- for r in _roles -%}{%- set ns.w = ns.w + [_cli.prefix ~ _cli.args[_sel.file_args[r]], _rpath[r]] -%}{%- endfor -%}
          {%- for n in _ops -%}
          {%- set d = namespace(v=rh.controller) -%}{%- for s in _l.operator_inputs[n].domain -%}{%- set d.v = d.v[s] -%}{%- endfor -%}
          {%- set ns.w = ns.w + [_cli.prefix ~ _cli.input_prefix ~ n, d.v[_dp.inputs[n]]] -%}
          {%- endfor -%}{{ ns.w }}
      block:
        - name: Stat each admitted inventory record's file (no link followed; current bytes)
          ansible.builtin.stat:
            path: "{{ item[_ci.path] }}"
            follow: false
            get_checksum: true
            checksum_algorithm: "{{ _rb.source_admission.digest_algorithm }}"
          loop: "{{ _crec }}"
          register: _rh_init_inv

        - name: Refuse -i sources that are not exactly the admitted inventory binding (missing, extra, reordered or changed)
          vars:
            _ibad: >-
              {%- set ns = namespace(b=[]) -%}
              {%- for r in _rh_init_inv.results -%}
              {%- if not r.stat.exists or not r.stat.isreg or r.stat.islnk or r.stat.checksum != r.item[_ci.sha256] -%}
              {%- set ns.b = ns.b + [r.item[_ci.path]] -%}{%- endif -%}
              {%- endfor -%}{{ ns.b }}
          ansible.builtin.assert:
            that:
              - (_rh_init_inv.results | length) == (_crec | length)
              - ansible_inventory_sources == (_crec | map(attribute=_ci.path) | list)
              - _ibad | length == 0
            fail_msg: >-
              REFUSED {{ _g.initializer.refusals.input }}: {{ _g.initializer.texts.input }}
              (inventory {{ ansible_inventory_sources | to_json }} vs {{ _crec | to_json }}; changed {{ _ibad | to_json }})
            quiet: true

        - name: Refuse a dispatch that is not the declared plan, its declared operator inputs and the admitted path roles
          ansible.builtin.assert:
            that:
              - _dp.flow in _sel.flows and _dp.flow in _sel.plans
              - _dp.flow not in _g.entry.staging.plans
              - _g.initializer.stage not in (_sel.plans[_dp.flow].steps | map(attribute='stage') | list)
              # Dispatch supplies exactly the selected plan's ungated and active required/supplied gated inputs.
              - (_dp.inputs.keys() | list | sort) == (_ops | sort)
              - _roles | reject('in', _rpath.keys() | list) | list | length == 0
              - _sl.env['clear'] is sameas true
              - (_sl.env.order | sort) == (((_rb[_sl.env.base].keys() | list) + (_sl.env.inherited.keys() | list)) | sort)
              - _env.bad | length == 0
              - _l.scalar_slots.env_path in _l.argv and _l.slots.env_pairs in _l.argv
              - _l.argv.index(_l.scalar_slots.env_path) < _l.argv.index(_l.slots.env_pairs)
            fail_msg: >-
              REFUSED {{ _g.initializer.refusals.launch }}: {{ _g.initializer.texts.launch }}
              (flow {{ _dp.flow | to_json }}, inputs {{ _dp.inputs | to_json }}; the failed assertion names the check)
            quiet: true

        # ONE command, no ignore_errors: this entry fails when the dispatched plan fails (N7 records it and reads back).
        - name: Dispatch the W1 plan once (env -i, the generated genesis entry, the same act)
          ansible.builtin.command:
            argv: "{{ _argv }}"
# Native successor: bounded dispatch gate and admitted registry transport repairs; source freeze recorded separately.
