---
# testing/remote_harness/jobs/observations.yml -- READ-ONLY observation jobs (DATA ONLY; no executable text).
# Consumed by the generic observation runner testing/remote_harness/observe.yml, which reads this file ONLY through
# the profile binding controller.bootstrap.observation.{jobs_rel, jobs_sha256} (codex-tick307: a missing file or a
# different byte refuses before any contact; expected and observed digests are recorded in attempt.json) and renders
# every command from it with the macros in templates/macros/observation.j2. Any edit here therefore needs the profile's
# jobs_sha256 re-declared (C1-routed) and a new attempt identity. Host names, paths and unit selections are NOT here:
# they are DECLARED TARGET INPUTS (target_inputs below name the roles of controller.bootstrap.inventory.target_inputs;
# global.yml host_scope.target_inputs), which the loader types and binds per target into
# binding.deployment.target_inputs.<target>.<role> -- part of every scope_sha256. Adding a host is inventory data only.
#
# PROVENANCE. Q-TOOLS, Q-SYSCTL and Q-NOFILE are PORTED from the route-v2 author-session declaration
#   Q-storage-qualification.yml (NOT in the product tree; identified by content only)
#   sha256 79c0d1e9abf816097b95bb5cd26bd70de4b77d9410a60cbdbb760d071b1207a5 (runs[].id Q-TOOLS / Q-SYSCTL / Q-NOFILE)
# with every argv word kept, in order, except: absolute tool paths become {tool:<os_tools name>} (the path and the
# identity come from the host's resolved os_tools, never from this file), and host names are removed (paths come
# from the bound target inputs; the job runs on every host of the declared target group). Q-SYN, Q-ALLOW and Q-MOUNT are
# HELD in the source and are NOT ported. O-CAPACITY and O-PRIOR-STATE are NEW (no source declaration exists).
#
# DEVIATIONS FROM THE SOURCE (declared, not silent):
#   privilege  the source says `root read-only (Claude MAIN)`; this runner connects as the declared NON-ROOT owner
#              (controller.bootstrap.inventory.connection_profiles.owner, no become). Unprivileged output may differ
#              (findmnt UUID, lsblk fields, /proc/<pid>/limits under hidepid). A root leg is MAIN-only and out of scope.
#   hosts      the source names graph / trixie; here the declared group (controller.bootstrap.inventory.target_group).
#              Q-NOFILE therefore also runs where lme-elasticsearch.service is absent -> PRECONDITION_FALSE there.
#   Q-NOFILE   the source's implicit gates are explicit: an empty or invalid ControlGroup, or no pid in its
#              cgroup.procs files, is PRECONDITION_FALSE BEFORE find / grep (never a scan of /sys/fs/cgroup or /proc).
#   ordering   Q-NOFILE must run BEFORE H-QUADLET and before any deploy or wipe on the host (source gate.order);
#              this file cannot enforce ordering across operations -- the operator runs it first.
schema: lme-observation-jobs/1
provenance:
  ported_from:
    name: Q-storage-qualification.yml   # author-session declaration, not in the product tree; content-identified
    sha256: 79c0d1e9abf816097b95bb5cd26bd70de4b77d9410a60cbdbb760d071b1207a5
    ported: [Q-TOOLS, Q-SYSCTL, Q-NOFILE]
    held_not_ported: [Q-SYN, Q-ALLOW, Q-MOUNT]
  new: [O-CAPACITY, O-PRIOR-STATE]

# ---- runner semantics (the closed vocabulary observe.yml and macros/observation.j2 implement; anything else refuses)
semantics:
  channel: raw                     # ansible.builtin.raw only: no module staged, no remote temp, no target Python
  tty: false                       # play var ansible_ssh_use_tty=false so stdout and stderr stay separate streams
  write: none                      # no job writes on a target; evidence is written on the controller only
  # every command is `<sh> -c 'export LC_ALL=<locale>; exec <timeout> -k <kill_after_sec>s <timeout_sec>s <argv...>'`
  # with each word shell-quoted; argv[0] is exactly one {tool:<name>} token (the tool's declared os_tools path on THAT
  # host). <locale> is the host policy's base_env.LC_ALL (the seed's own locale; message texts such as the Q-NOFILE
  # precondition stderr and stat's %F type names are then untranslated); nothing else of the login environment changes
  locale_from: base_env.LC_ALL
  # identity-checked with the job's own tools before any job step (digest + followed file metadata; NOT path ancestry)
  runner_tools: [sh, timeout, sha256sum, stat, id]
  # the connected principal (uid| / uname| lines, initial_contact.yml's convention) is read back by this runner tool in
  # the same first raw contact; a uid-0 account or another account name refuses before any job step
  principal_tool: id
  kill_after_sec: 2
  input_kinds: [once, host_list, from_step]
  extract_kinds: [json, json_line, lines, basename]
  on_empty: [skip, precondition_false]           # what a step with no input instance records
  on_failure: [continue, stop]                   # stop: no later step of the job runs on that host
  # rc classification, in this order (a step's own allowed_rc / precondition_false are checked first):
  rc_classes:
    ok: [0]
    timeout: [124, 137]            # 124 timed out; 137 = killed after kill_after_sec (GNU timeout)
    tool_missing: [126, 127]       # found but not executable / not found
    other: FAILED                  # 125 (timeout itself failed) and every other rc
  step_classes: [OK, ALLOWED_RC, PRECONDITION_FALSE, TIMEOUT, TOOL_MISSING, FAILED, EXTRACT_INVALID, TRUNCATED, NO_INPUT, UNREACHABLE]
  bad_classes: [TIMEOUT, TOOL_MISSING, FAILED, EXTRACT_INVALID, TRUNCATED, UNREACHABLE]
  # output bound per stream, counted in Unicode scalar values of the text Ansible decoded from the ssh stream
  # (non-UTF-8 bytes are replaced by Ansible's decoder: the record is decoded text, not the raw bytes)
  max_output_chars: 1048576
  host_results: [COMPLETE, PRECONDITION_FALSE, INCOMPLETE, REFUSED, UNREACHABLE, NOT_SELECTED]
  attempt_results: [COMPLETE, INCOMPLETE]
  # COMPLETE: the identity and principal checks passed, every step ran with no bad class, and every step's recorded
  # instances are exactly its selected values (exact, case-sensitive; a job needs at least one step). PRECONDITION_FALSE: a declared
  # precondition was false (a valid terminal answer; later steps are not run). REFUSED: a declaration, input or
  # identity check refused before or between steps. An attempt is COMPLETE only when the target group is not empty
  # and EVERY host of it has a result that is COMPLETE or PRECONDITION_FALSE (a host without one is NOT_SELECTED);
  # otherwise the run fails AFTER writing the evidence.

# ---- typed substitution parameters. A {name} in an argv word is replaced ONLY by a value that matched its type here
# (target-input values before any contact; extracted values when extracted). No regex admits `{`, `}`, whitespace,
# a quote or a backslash, so a substituted value can never form a placeholder, a template or a shell word boundary.
parameters:
  path:              {regex: '^/[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*$', forbidden_regex: '(^|/)[.]{1,2}(/|$)'}
  prior_dir:         {regex: '^/[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*$', forbidden_regex: '(^|/)[.]{1,2}(/|$)'}
  unit_pattern:      {regex: '^[A-Za-z0-9@_.:*-]+$'}
  unit:              {regex: '^[A-Za-z0-9@_.:-]+[.]service$'}
  maj_min:           {regex: '^[0-9]+:[0-9]+$'}
  name:              {regex: '^[A-Za-z0-9_.+-]+$', forbidden_regex: '^[.]{1,2}$'}
  unit_path:         {regex: '^/org/freedesktop/systemd1/unit/[A-Za-z0-9_]+$'}
  # one or more path segments: an empty ControlGroup never becomes `/sys/fs/cgroup` (it is dropped as empty)
  control_group:     {regex: '^(/[A-Za-z0-9._@:+-]+)+$', forbidden_regex: '(^|/)[.]{1,2}(/|$)'}
  # a cgroup.procs file strictly under /sys/fs/cgroup<ControlGroup>/ of THIS host's extracted ControlGroup
  cgroup_procs_file:
    regex: '^/sys/fs/cgroup(/[A-Za-z0-9._@:+-]+)+/cgroup[.]procs$'
    forbidden_regex: '(^|/)[.]{1,2}(/|$)'
    within: {prefix: /sys/fs/cgroup, yield: control_group}
  pid:               {regex: '^[1-9][0-9]{0,9}$'}
  find_depth:        {regex: '^[1-3]$'}

# ---- target inputs: ROLE names of controller.bootstrap.inventory.target_inputs (the policy declares each role's
# inventory var, type and pattern once; the loader binds the typed values per target; no defaults). The runner reads
# ONLY the bound value. A job that names a role refuses the host before any contact when that role is not bound for
# it, is not a non-empty list, or has a value failing the job parameter type below (a second, narrower admission).
target_inputs:
  obs_paths:         {param: path, note: 'storage paths to qualify, e.g. /data, /home and the podman graphroot'}
  obs_prior_dirs:    {param: prior_dir, note: 'directories whose prior LME state (preserved stack, interrupted retirement, owned resources) is listed'}
  obs_unit_patterns: {param: unit_pattern, note: 'systemd unit globs of prior LME units, e.g. lme-*'}

jobs:
  Q-TOOLS:
    label: PORTED
    gate: READY
    record: JSON value types (number or string) for size/avail and maj:min, key spellings, uuid/fsroot presence, rc on the missing descendant
    forbidden: [mount, create, format, partition, the unmounted graph USB device, machine-id content]
    steps:
      - {id: mnt-ns, input: {kind: once}, argv: ['{tool:readlink}', /proc/self/ns/mnt], timeout_sec: 5, on_failure: continue}
      - {id: boot-id, input: {kind: once}, argv: ['{tool:cat}', /proc/sys/kernel/random/boot_id], timeout_sec: 5, on_failure: continue}
      - id: mount
        input: {kind: host_list, target_input: obs_paths, param: path}
        argv: ['{tool:findmnt}', --json, --bytes, --output, 'TARGET,SOURCE,FSTYPE,UUID,FSROOT,MAJ:MIN,SIZE,AVAIL', --mountpoint, '{path}']
        allowed_rc: [1]            # a path that is not itself a mount point
        timeout_sec: 10
        on_failure: continue
      - id: containment
        input: {kind: host_list, target_input: obs_paths, param: path}
        argv: ['{tool:findmnt}', --json, --bytes, --output, 'TARGET,FSROOT,MAJ:MIN', --target, '{path}']
        timeout_sec: 10
        on_failure: continue
        yields: {maj_min: {kind: json, path: [filesystems, 0, 'maj:min'], param: maj_min}}
      - id: missing-descendant
        input: {kind: host_list, target_input: obs_paths, param: path}
        argv: ['{tool:findmnt}', --json, --bytes, --output, 'TARGET,FSROOT,MAJ:MIN', --target, '{path}/lme-rh-q-tools-does-not-exist']
        allowed_rc: [1]            # records --target behaviour on a missing descendant; creates nothing
        timeout_sec: 10
        on_failure: continue
      - id: sysfs-link
        input: {kind: from_step, step: containment, yield: maj_min, param: maj_min, on_empty: skip}
        argv: ['{tool:readlink}', '/sys/dev/block/{maj_min}']
        allowed_rc: [1]            # a virtual device (e.g. 0:NN) has no /sys/dev/block entry
        timeout_sec: 10
        on_failure: continue
        yields: {name: {kind: basename, param: name}}
      - id: backing
        input: {kind: from_step, step: sysfs-link, yield: name, param: name, on_empty: skip}
        argv: ['{tool:lsblk}', --json, --bytes, --list, --inverse, --output, 'NAME,TYPE,SIZE,MAJ:MIN', '/dev/{name}']
        timeout_sec: 10
        on_failure: continue

  Q-SYSCTL:
    label: PORTED
    gate: READY
    record: whether /etc/sysctl.conf participates and where, any second loader, the per-file header format, current runtime values
    forbidden: [sysctl -w, sysctl -p, sysctl --system, any file write]
    steps:
      - {id: cat-config, input: {kind: once}, argv: ['{tool:systemd-analyze}', cat-config, sysctl.d], timeout_sec: 20, on_failure: continue}
      - {id: loader-unit, input: {kind: once}, argv: ['{tool:systemctl}', cat, systemd-sysctl.service], timeout_sec: 10, on_failure: continue}
      # a missing path is recorded by rc + stderr, not an error of the job
      - {id: conf-links, input: {kind: once}, argv: ['{tool:stat}', -c, '%N %F', /etc/sysctl.conf, /etc/sysctl.d/99-sysctl.conf], allowed_rc: [1], timeout_sec: 5, on_failure: continue}
      - {id: second-loaders, input: {kind: once}, argv: ['{tool:systemctl}', list-unit-files, 'procps*', 'sysctl*'], allowed_rc: [1], timeout_sec: 10, on_failure: continue}
      - {id: runtime-values, input: {kind: once}, argv: ['{tool:cat}', /proc/sys/vm/max_map_count, /proc/sys/net/core/rmem_max, /proc/sys/net/core/wmem_max], timeout_sec: 5, on_failure: continue}

  Q-NOFILE:
    label: PORTED
    gate: READY_ON_PRECONDITION
    record: D-Bus JSON shapes (one line per property), ExecStartPre tuple layout, ignore flag position, cgroup layout, applied soft/hard
    decides: LoadUnit versus GetUnit for H-QUADLET
    constants: {unit: lme-elasticsearch.service}
    steps:
      # PRECONDITION: the unit is loaded NOW. GetUnit answers org.freedesktop.systemd1.NoSuchUnit for a unit that is
      # not loaded; busctl reports it as rc 1 with `Unit <name> not loaded.` on stderr (message text UNVERIFIED on the
      # hosts until run) -> PRECONDITION_FALSE and the job stops. Any other failure stops the job as FAILED.
      - id: get-unit
        input: {kind: once}
        argv: ['{tool:busctl}', --json=short, call, org.freedesktop.systemd1, /org/freedesktop/systemd1, org.freedesktop.systemd1.Manager, GetUnit, s, '{unit}']
        precondition_false: {rc: [1], stderr_regex: 'Unit [A-Za-z0-9@_.:-]+ not loaded'}
        timeout_sec: 10
        on_failure: stop
        yields: {unit_path: {kind: json, path: [data, 0], param: unit_path}}
      - id: unit-props
        input: {kind: from_step, step: get-unit, yield: unit_path, param: unit_path, on_empty: precondition_false}
        argv: ['{tool:busctl}', --json=short, get-property, org.freedesktop.systemd1, '{unit_path}', org.freedesktop.systemd1.Unit, LoadState, DropInPaths, ActiveState]
        timeout_sec: 10
        on_failure: stop
      - id: service-props
        input: {kind: from_step, step: get-unit, yield: unit_path, param: unit_path, on_empty: precondition_false}
        argv: ['{tool:busctl}', --json=short, get-property, org.freedesktop.systemd1, '{unit_path}', org.freedesktop.systemd1.Service, ExecStartPre, TimeoutStartUSec, LimitNOFILE, LimitNOFILESoft, ControlGroup]
        timeout_sec: 10
        on_failure: stop
        # busctl prints one JSON line per requested property, in request order: ControlGroup is line index 4
        yields: {control_group: {kind: json_line, line: 4, path: [data], param: control_group}}
      # GATE: runs only with a non-empty, typed ControlGroup (empty -> PRECONDITION_FALSE, never /sys/fs/cgroup itself)
      - id: cgroup-procs-files
        input: {kind: from_step, step: service-props, yield: control_group, param: control_group, on_empty: precondition_false}
        argv: ['{tool:find}', '/sys/fs/cgroup{control_group}', -maxdepth, '3', -name, cgroup.procs, -type, f]
        timeout_sec: 10
        on_failure: stop
        yields: {cgroup_procs_file: {kind: lines, param: cgroup_procs_file}}
      - id: cgroup-pids
        input: {kind: from_step, step: cgroup-procs-files, yield: cgroup_procs_file, param: cgroup_procs_file, on_empty: precondition_false}
        argv: ['{tool:cat}', '{cgroup_procs_file}']
        timeout_sec: 5
        on_failure: continue
        yields: {pid: {kind: lines, param: pid}}
      # GATE: only pids read from the unit's own cgroup.procs files (no pid -> PRECONDITION_FALSE; no /proc scan)
      - id: pid-limits
        input: {kind: from_step, step: cgroup-pids, yield: pid, param: pid, on_empty: precondition_false}
        argv: ['{tool:grep}', '^Max open files', '/proc/{pid}/limits']
        allowed_rc: [1, 2]         # no such line / the pid exited meanwhile (recorded, not retried)
        timeout_sec: 5
        on_failure: continue

  O-CAPACITY:
    label: NEW
    gate: READY
    record: bytes and inodes of each declared path's filesystem, memory, load and online CPUs (read-only)
    steps:
      - id: df-bytes
        input: {kind: host_list, target_input: obs_paths, param: path}
        argv: ['{tool:df}', -B1, '--output=source,fstype,size,used,avail,target', --, '{path}']
        timeout_sec: 10
        on_failure: continue
      - id: df-inodes
        input: {kind: host_list, target_input: obs_paths, param: path}
        argv: ['{tool:df}', '--output=source,itotal,iused,iavail,target', --, '{path}']
        timeout_sec: 10
        on_failure: continue
      - {id: meminfo, input: {kind: once}, argv: ['{tool:cat}', /proc/meminfo], timeout_sec: 5, on_failure: continue}
      - {id: loadavg, input: {kind: once}, argv: ['{tool:cat}', /proc/loadavg], timeout_sec: 5, on_failure: continue}
      - {id: cpu-online, input: {kind: once}, argv: ['{tool:cat}', /sys/devices/system/cpu/online], timeout_sec: 5, on_failure: continue}

  O-PRIOR-STATE:
    label: NEW
    gate: READY
    record: prior LME system and owner units, the entries of each declared prior-state dir (type, owner, group, mode, size, mtime, path; depth-bounded, one filesystem), and lingering accounts
    constants: {find_depth: '2'}
    steps:
      - id: system-units
        input: {kind: host_list, target_input: obs_unit_patterns, param: unit_pattern}
        argv: ['{tool:systemctl}', list-units, --all, --no-legend, --no-pager, --plain, '{unit_pattern}']
        timeout_sec: 10
        on_failure: continue
      - id: system-unit-files
        input: {kind: host_list, target_input: obs_unit_patterns, param: unit_pattern}
        argv: ['{tool:systemctl}', list-unit-files, --no-legend, --no-pager, '{unit_pattern}']
        allowed_rc: [1]            # no unit file matches
        timeout_sec: 10
        on_failure: continue
      # the owner's user manager (the SSH session as the owner carries it); an absent user bus is recorded by rc
      - id: user-units
        input: {kind: host_list, target_input: obs_unit_patterns, param: unit_pattern}
        argv: ['{tool:systemctl}', --user, list-units, --all, --no-legend, --no-pager, --plain, '{unit_pattern}']
        allowed_rc: [1]
        timeout_sec: 10
        on_failure: continue
      - id: prior-dirs
        input: {kind: host_list, target_input: obs_prior_dirs, param: prior_dir}
        argv: ['{tool:find}', '{prior_dir}', -xdev, -maxdepth, '{find_depth}', -printf, '%y %u %g %m %s %T@ %p\n']
        allowed_rc: [1]            # an absent dir or an unreadable descendant (recorded with stderr)
        timeout_sec: 30
        on_failure: continue
      - id: linger
        input: {kind: once}
        argv: ['{tool:find}', /var/lib/systemd/linger, -mindepth, '1', -maxdepth, '1', -printf, '%f\n']
        allowed_rc: [1]            # no linger dir
        timeout_sec: 5
        on_failure: continue
