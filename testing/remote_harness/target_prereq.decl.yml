---
# testing/remote_harness/target_prereq.decl.yml -- PROPOSAL INPUT for C1. It is NOT policy and nothing reads it:
# testing/remote_harness/target_prereq.yml reads ONLY the RESOLVED `rh.controller.bootstrap.target_prereq` and refuses
# RH-TARGET-PREREQ while that is absent or not this revision. C1 registered REVISION 2 (global.yml 32d26c0d
# lme_config_registry ... target_prereq / target_prereq_owner_key). REVISION 3 (this file) is the proposal for
# codex-tick318-321 item 3 (declared read-only PREFLIGHT with a record even on refusal) and codex tick320 findings
# 1-4 (PREREQ-KEY-RESUME, PREREQ-DONE-READBACK, PREREQ-STORAGE-ADOPTION, PREREQ-LINGER-TOOL). The rev 3 contract delta
# for C1 is in the hand-back (new keys: preflight, resume, hypervisor.capacity.alternatives; revision enum [3]).
#
# NOT keys of this section (C1: one authority each; the consumer reads them THERE):
#   the input NAMES            -> rh.controller.bootstrap.inventory.{owner_var, root_var, bundle_var} and
#                                 connection_profiles.{owner,privileged}.key_var / owner.pubkey_var
#   the target input ROLES     -> rh.controller.bootstrap.inventory.target_inputs; the VALUES only from the loader
#                                 binding lme_resolved.remote_harness.binding.deployment.target_inputs.<host>.<role>
#                                 (owner, toolchain_root, bundle_dir, owner_key, privileged_key, owner_pubkey,
#                                 prereq_owner_shell, prereq_owner_home, prereq_work_root, prereq_bundle_root,
#                                 prereq_preserved_units and -- C1 join, four STRING roles replacing the mapping role --
#                                 prereq_work_parent_{path,owner,group,mode} <- lme_deploy_work_parent_{path,owner,group,mode}).
#                                 Every role is declared optional; THIS leg refuses (before contact) when a role it needs
#                                 is absent -- owner and toolchain_root included -- and never defaults one.
#   the package source         -> rh.packages (by_os_family / required); RedHat names UNVERIFIED
#   the hypervisor group       -> rh.controller.bootstrap.inventory.role_groups.hypervisors
#   the user manager runtime   -> rh.controller.bootstrap.target_bootstrap.user_manager.{runtime_dir, bus}
#   the linger tool            -> rh.controller.bootstrap.os_tools.loginctl (path + identity; C1 join, required_by
#                                 [target_prereq] -- the codex-tick328-329 target label). UNVERIFIED on graph.
#                                 (ssh-keygen is a CONTROLLER os_tools entry required_by [owner_key_generation], joined
#                                 by C1 JK-1 for the J-KEY producer; it is not a target_prereq tool; see below.)
#
# The leg is the MAIN-only privileged PREREQUISITE the route names but does not implement (target_bootstrap
# user_manager.linger precondition; "MAIN's privileged package step"). It adds no engine: it reuses B's ONE privileged
# connection contract (testing/e2e/transfer tasks/bind_controller.yml -> tr_conn) and the route's privileged INITIAL
# CONTACT.
target_prereq:
  revision: 3
  runner: MAIN_only                     # privileged connection profile; subagents and owner runs never start it
  connection_profile: privileged        # rh.controller.bootstrap.inventory.connection_profiles.<this> (user root)
  refusal: RH-TARGET-PREREQ
  reuse:
    transfer_dir_rel: testing/e2e/transfer          # tr_dir == <rh_repo_root>/<this> (derived at first entry; asserted)
    transfer_decl: transfer.decl.yml
    controller_prelude: tasks/bind_controller.yml   # tr_conn, tr_bs, tr_state, tr_scope_expect (the ONE contract)
    contact_rel: testing/remote_harness/tasks/initial_contact.yml
    contact_variant: privileged
  layout:
    toolchain_rel: toolchain                    # toolchain root == <work root>/<this> (== work_roots.sub_roots.toolchain)
    bundles_rel: bundles                        # bundle root == <work root>/<this>
    bundle_leaf_regex: '^[0-9a-f]{64}$'         # bundle dir == <bundle root>/<immutable identity leaf>
    owner_dir_mode: '0700'
    # the work root's parent (codex ACCEPTED: a root-owned intermediate as a declared, overridable INVENTORY choice,
    # the four prereq_work_parent_* roles). Its path must be dirname(<work root>), its owner root, its mode never
    # group/other-writable (C1: the regex refuses 0722, 0702, 0620 ...: only 0/1/4/5 in the group and other digits).
    work_parent_rule: {path: dirname_of_work_root, owner: root, mode_regex: '^0[0-7][0145][0145]$'}
  # ADOPTION (codex-tick302; tick320 (3)): observe first. Absent -> created. Matching campaign state -> OBSERVATION ONLY
  # (no write; "matching" is the COMPLETE metadata: type, no link, uid, gid, mode, and content digest where declared).
  # Anything else -> REFUSED before any mutation: preserved untouched and reported. Never a usermod, chown or chmod of
  # state that neither this run nor a recorded unfinished run of this leg created.
  owner_account:
    # the campaign marker: an owner account is campaign state ONLY with exactly this GECOS, the declared shell and
    # home, and a same-named primary group. A historical account (e.g. shell nologin) is NEVER converted.
    gecos: 'LME remote-harness deployment owner (target_prereq)'
    create_home: true
    system: false
    passwd_fields: {gecos: 3, home: 4, shell: 5}        # getent passwd value index (after the name key)
    home_mode_regex: '^0[0-7][0145][0145]$'             # the created home is never group/other-writable
  authorized_keys:
    dir_rel: .ssh
    dir_mode: '0700'
    file_rel: .ssh/authorized_keys
    file_mode: '0600'
    # one line, a public key only (never a private-key block); the comment part is optional
    pubkey_regex: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521)|sk-ssh-ed25519@openssh\.com|sk-ecdsa-sha2-nistp256@openssh\.com) [A-Za-z0-9+/]+={0,3}( [ -~]*)?$'
    # written content == <pubkey line> + "\n"; an existing file must equal it byte-for-byte (sha256), else REFUSED
  # PARTIAL-BOOTSTRAP OWNERSHIP AND RECOVERY. A ROOT-OWNED journal on the target, written BEFORE the first effect and
  # after each op, binds the campaign state to: owner name, the uid observed right after creation, the GECOS marker, the
  # owner public-key sha256 and the ordered op list. A run resumes ONLY the first op that is not `done`; every later op
  # must still be `pending`. The journal is never trusted alone: see `resume`. Ancestry is re-admitted (root-only rule,
  # fresh stat, no link) immediately before every write. The journal is never deleted by this leg.
  journal:
    dir: /var/lib/lme-target-prereq              # root:root, dir_mode; admitted by the privileged contact (rh_ic_paths)
    dir_mode: '0700'
    file_mode: '0600'
    file_suffix: .journal.json                   # <dir>/<owner><suffix>
    schema: lme-target-prereq-journal/v1
    # ORDER is the contract: the key is installed BEFORE linger; the work root is handed over LAST.
    ops: [account, ssh_dir, authorized_key, linger, work_root, work_children, work_handover, storage_root]
    states: [pending, started, done]
    binding: [owner, uid, gecos, pubkey_sha256]
  # RESUME RULES (tick320 (1) PREREQ-KEY-RESUME, (2) PREREQ-DONE-READBACK). Pinned words, enforced by
  # target_prereq.yml + tasks/prereq_readback.yml:
  #   done_ops            every op the journal says `done` is READ BACK against the actual target state (the one
  #                       predicate set of tasks/prereq_readback.yml) after classification and before any effect, and
  #                       ALL ops again at the end; drift refuses and preserves (never trust the journal, never repair).
  #   owner_home_writes   root writes inside the owner's home (.ssh, authorized_keys) ONLY while authorized_key is
  #                       still `pending`: before it no key has ever existed, so no key-authenticated owner process can.
  #                       (Linger marker / /run/user absence is RECORDED, never proof of quiescence.)
  #   after_key_install   authorized_key `started` (interrupted after or during the install): OBSERVATION ONLY -- the
  #                       exact file (home, .ssh, file: no link, uid, gid, mode, sha256) marks it done with no write;
  #                       anything else, ABSENT included, refuses (an absent file after `started` does not prove the key
  #                       was never usable). No root write to an owner path follows the key install at all, so no
  #                       quiescence/adoption rule is needed; any future one is a new declared revision.
  #   existing_account    the account op never re-runs the account module on an existing account (groups + append can
  #                       usermod): an existing campaign account is observation-only.
  #   file_tasks          every directory task runs only when its path is ABSENT (journal dir, work parent, .ssh, work
  #                       root, each child, storage root); the handover chown only while the work root is uid 0.
  resume:
    done_ops: readback_refuse_on_drift
    owner_home_writes: only_while_authorized_key_pending
    after_key_install: observation_only
    existing_account: observation_only
    file_tasks: only_when_absent
  linger:
    tool: loginctl                              # os_tools NAME (C1 join: path + identity, required_by target_prereq);
                                                # argv[0] is os_tools.loginctl.path, re-verified (fresh stat, sha256 ==
                                                # identity, root_only ancestry) immediately before the one command
    marker_dir: /var/lib/systemd/linger         # <marker_dir>/<owner> exists <=> linger enabled (root-owned regular file)
    wait: {retries: 20, delay: 1}               # user manager runtime dir + bus: target_bootstrap.user_manager
  packages:
    install_module: ansible.builtin.package      # the distro-neutral module (no package manager literal)
    # every member: rh.packages.required + the transfer adapter's target packages. Hypervisor members also get
    # hypervisor_required. A name without a mapping for the observed family REFUSES (in the PREFLIGHT; never guessed).
    # RedHat names UNVERIFIED.
    hypervisor_required: [qemu_utils, qemu_system_x86, cloud_image_utils]
  # RS guest-lifecycle prerequisites on every member of rh.controller.bootstrap.inventory.role_groups.hypervisors. Values
  # that belong to the guest allocation are READ from this host's resolved rh.guest (RS carrier) and never duplicated
  # here: storage_root, base_image, memory_mib, host_headroom_mib, kvm_device, layout.bases_dir.
  hypervisor:
    kvm_group: kvm                               # the owner's supplementary group for /dev/kvm (created account only;
                                                 # an adopted account must already hold it, else REFUSED)
    storage_mode: '0700'                         # rh.guest.allocation.storage_root, owner-owned (uid AND gid)
    base_image_checksum: sha512                  # observed only (MAIN acquires it; never fetched or rewritten here)
    # the preserved dev stack stays INACTIVE: observed only (service_facts, system units) in the PREFLIGHT. Never
    # started, stopped, enabled, disabled or masked by this leg. An active, enabled or unknown unit REFUSES (recorded).
    preserved_refused_states: [running]
    preserved_refused_status: [enabled, enabled-runtime]
    # memory (codex-tick308-309; tick318-321 item 3): budget = rh.guest.allocation.memory_mib (13312) +
    # host_headroom_mib (2048), both READ from rh.guest, never restated here. The PREFLIGHT MEASURES /proc/meminfo
    # (kB floor-divided to MiB) and RECORDS MemTotal, MemAvailable, the budget and the shortfall. It REFUSES exactly
    # when MemTotal < budget (class never_fits) or when /proc/meminfo cannot be measured (class unmeasured; fail-closed,
    # never reported as a measurement) -- the check is never weakened; the guest is never shrunk; headroom is never
    # cut. It NEVER
    # admits a provision (admits_provision false): RS admit.yml re-reads MemAvailable immediately before a fresh
    # provision. A refusal is recorded with the measured values and the declared alternatives below; until MAIN's
    # preflight record measures a host, any obstruction is PREDICTED only.
    capacity:
      meminfo: /proc/meminfo
      admits_provision: false
      refusal: RH-TARGET-PREREQ-CAPACITY
      alternatives:                              # inventory / profile choices only; never a host name; never a shrink
        - another_hypervisor_member              # place the guest on another role_groups.hypervisors member
        - not_a_hypervisor_member                # remove this target from role_groups.hypervisors (non-hypervisor target)
        - more_host_memory                       # raise the host's RAM, then re-run the preflight
        - raise_budget_and_fail                  # a larger declared budget refuses the same way (capacity stays failed)
  # SSH INTERCEPT (codex; tick320 sequencing). Read in the PREFLIGHT after the privileged contact and before any
  # effect: the session's process ancestry must contain an OpenSSH server process and no Tailscale daemon. This proves
  # the SERVER PROCESS serving the session (and, recorded only, a listener on the connected port) -- NOT which auth
  # method succeeded. A Tailscale SSH intercept REFUSES; the remedy is an inventory-declared OpenSSH endpoint or an
  # explicitly admitted Tailscale SSH profile. UNVERIFIED on graph (Debian 13 OpenSSH layout; sshd-session >= 9.8).
  endpoint:
    ancestry_max_depth: 16
    admitted_server_exe_regex: '^/usr/(sbin/sshd|lib/openssh/sshd-session)$'
    refused_exe_regex: '(^|/)tailscaled$'
    refusal: RH-TARGET-PREREQ-SSH-INTERCEPT
    # program text run with the admitted privileged `sh` (argv: sh -c <text> lme-endpoint-ancestry <max depth>
    # <admitted realpath> <admitted sed>; no PATH lookup); prints one resolved exe per ancestor, nearest first.
    ancestry_program: >-
      p=$PPID; n=0;
      while [ "$p" -gt 1 ] && [ "$n" -lt "$1" ]; do
      "$2" -e "/proc/$p/exe" 2>/dev/null || echo "?";
      p=$("$3" -n 's/^PPid:[[:space:]]*//p' "/proc/$p/status"); n=$((n+1)); done
  # PREFLIGHT (codex-tick318-321 item 3): a declared READ-ONLY phase (play prereq-preflight) on the admitted
  # privileged contact, BEFORE any owner creation or effect. It depends on nothing an effect provides (no package, no
  # account, no directory). It observes: the principal and interpreter (the contact itself), the SSH ancestry, the
  # connected port's listeners (record only), every component of the root-only paths (work parent incl. /data, home
  # parent, journal dir, linger marker dir, the linger tool's dir, the guest storage parent) with owner/group/mode, the
  # work root / home / storage root leaves, the owner account (getent), the os family and the package mapping, the
  # preserved units and memory (hypervisor members), and the linger tool's identity. It ALWAYS writes a scoped record
  # <state dir>/gate.<label><record_suffix> (0600; scope id + scope_sha256 + label + target) -- also when it refuses
  # (refusals listed; a contact or observation failure is rescued into the record). Only then does the record play
  # refuse. Not recorded (nothing contacted): a controller-side pre-contact refusal, an UNREACHABLE target (Ansible
  # does not rescue it). Owner-side observation is NOT here: it follows the owner bootstrap (target_bootstrap.yml);
  # no ad hoc SSH.
  preflight:
    record_suffix: .prereq-preflight.json
    record_schema: lme-target-prereq-preflight/v1
    listener_sources: [/proc/net/tcp, /proc/net/tcp6]
  # D -- tool identity observation (codex-tick302 (D); codex-tick328-329 closed required_by partition: controller
  # [seed, uv_installer, package_source_binding, source_edition_binding, owner_key_generation] / target
  # [target_adapter, privileged_contact, target_prereq, guest, observation]). After packages, every os_tools entry
  # labelled with one of the TARGET labels below is hashed on the target and compared with its declared identity:
  # every member: target_adapter, privileged_contact, target_prereq (loginctl) and observation (the route observation
  # runner's target tools); hypervisor members additionally guest (the RS guest tools the hypervisor packages provide).
  # Controller labels are never hashed here (not target tools); that never waives this leg's own target identity
  # checks (the privileged contact's tools, the linger tool at its use boundary). The record carries a CANDIDATE
  # per-host lme_global_override ONLY for differing digests; MAIN decides and admits it through the per-run binding;
  # this leg never applies it. A required tool that is still missing after packages REFUSES.
  observation:
    required_by: [target_adapter, privileged_contact, target_prereq, observation]
    hypervisor_required_by: [guest]
    override_path: [remote_harness, controller, bootstrap, os_tools]   # lme_global_override nesting (tunable_paths)
    identity_kind: file_sha256
    record_suffix: .prereq.json                  # <state dir>/gate.<label><suffix>
    record_schema: lme-target-prereq/v1
  # J-KEY (codex: a new leg inside the manifest/credential lifecycle) is NOT a key of this section: it is its own
  # producer, testing/e2e/target_prereq/owner_key.yml, whose policy source is testing/e2e/target_prereq/owner_key.decl.yml
  # (registered by C1 as rh.controller.bootstrap.owner_key, JK-1..4 landed; JK-6 delta pending). The generator
  # (ssh-keygen) is the CONTROLLER os_tools entry required_by [owner_key_generation], delivered through the declared
  # toolchain (never hand-installed, never target-only). The former proposal text here ('storage_rel: keys',
  # '<controller state root>/keys/<deployment>/<owner>') is SUPERSEDED: the owned location is
  #   <W>/<sub_roots.credentials>/<owner_key.storage.keys_rel>/<deployment>/<target>/<owner>/<key_name> (+ pub_suffix),
  # rendered only by owner_key.location_rule_rel (templates/owner_key_location.j2). The leg's shape, for reference:
  #   generate  the NON-ROOT controller generates the owner key at that owned location (per target)
  #   install   MAIN installs the initial authorized key through THIS leg (authorized_key op)
  #   rotate    an owner-side leg over the CURRENT key: admit the replacement, prove access with it, retire the prior
