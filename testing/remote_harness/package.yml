    # codex716 (a): every allocation of every class is admitted before any is consumed. Artifact rows (class policy), lock
    # packages / collections rows (the class capture) and the fixed members (class policy bundle.member_max_bytes) follow
    # the same value semantics: max_bytes present, an integer that is NOT a boolean (Jinja tests integer and boolean), > 0;
