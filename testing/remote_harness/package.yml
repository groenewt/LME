          {%- if r is not mapping or 'file' not in r or 'max_bytes' not in r
                 or r.max_bytes is boolean or r.max_bytes is not integer or r.max_bytes <= 0 -%}
          {%- set cl.rowbad = true -%}{%- set ns.l = ns.l + [[c.key, r]] -%}{%- endif -%}
          {%- endfor -%}
          {%- if not cl.rowbad and (rows | map(attribute='file') | unique | list | length) != (rows | length) -%}
          {%- set ns.l = ns.l + [[c.key, rows | map(attribute='file') | list]] -%}{%- endif -%}
