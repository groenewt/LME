          - _rh_pk_rels | reject('match', '(?:' ~ _rh_pk_g.pattern ~ ')\Z') | list | length == 0
          - _rh_pk_rels | map('split', _rh_pk_g.separator) | map('intersect', _rh_pk_g.refused_components) | reject('equalto', []) | list | length == 0
