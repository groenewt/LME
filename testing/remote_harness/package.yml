          {{ (rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | map('first') | list)
             + (rh.controller.bootstrap.source_admission.document_rels | dictsort | map('last') | list) }}
      ansible.builtin.assert:
        that:
          - _rh_pk_g is mapping and (_rh_pk_g.keys() | list | sort) == ['pattern', 'refused_components', 'separator', 'terminator']
          - _rh_pk_g.pattern is string and _rh_pk_g.pattern | length > 0
          - _rh_pk_g.separator is string and _rh_pk_g.separator | length > 0
          - _rh_pk_g.terminator is string and _rh_pk_g.terminator | length > 0
          - _rh_pk_g.refused_components is sequence and _rh_pk_g.refused_components is not string
          - _rh_pk_g.refused_components | reject('string') | list | length == 0
