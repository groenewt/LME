---
# testing/remote_harness/package.yml -- artifact admission + seed packaging (SEED-07 / SEED-08). Local, offline.
#
#   ansible-playbook -i <operator inventory> testing/remote_harness/package.yml
# with localhost host vars (inputs, no defaults):
#   rh_artifact_source  directory holding the declared artifact files (controller.bootstrap.artifacts + the lock's
#                       wheels and collections), e.g. an acquisition directory; never fetched, never downloaded
#   rh_bundle_dir       the bundle destination (its parent owned by the invoking account; absent, or already holding
#                       the byte-identical bundle -> UNCHANGED). It becomes:
#                         <bundle>/lme-controller-seed.sh   rendered seed (build output, mode 0500)
#                         <bundle>/artifacts/<file>         admitted copies, sha256-verified, mode 0400
#                         <bundle>/bundle.json              schema, seed/profile/lock digests, artifact rows, renderer
# Then: <bundle>/lme-controller-seed.sh apply --root <owned root>   and
#       <bundle>/lme-controller-seed.sh run --root <owned root> --ssh-auth <mode> -- -i <inventory> testing/remote_harness/controller.yml
#
# Offline behaviour: every declared file must already be in rh_artifact_source with its declared sha256; ALL
# missing and ALL mismatched files are named in one refusal before anything is written.
# SEED2-PACKAGE-RESERVATION: every component of the destination's ancestry is admitted (real dirs, owned by 0 or the
# builder, not group/other-writable; the parent owned by the builder) and the destination, if present, is an owned real
# dir -- all BEFORE any write. The bundle is built ONLY inside an exclusively reserved sibling staging dir
# (ansible.builtin.tempfile = mkdtemp, `.<name>.<bundle.staging_infix>.<holder lease>.<random>`) and published by ONE
# declared `mv -T` rename; concurrent builders at one destination each own a private staging dir, and exactly one
# rename can land (a rename onto a non-empty directory fails), so mixed identities can never be published. A destination
# already holding the byte-identical bundle.sha256 AND bundle.json (same provenance: profile, lock, class key,
# builder, source) is UNCHANGED; any other content refuses and is preserved. A failed or interrupted run leaves only
# its staging dir and lease record; the NEXT attempt reaps them only when that run's writers are PROVABLY QUIESCENT
# (tasks/reap_staging.yml, bundle.staging_retention: owned-manifest admission + lease record + the recorded holder
# absent AND its cgroup gone/empty in an admitted namespace view; every reap mutation under `flock -x -n` on the
# destination lock; a LIVE, busy or unprovable entry is never touched, it is preserved, reported and charged; free
# space checked after the reap, before reserving), so no quiescent staging accumulates and rerunning at the SAME
# destination resumes. PUBLISH FENCE: the one publish rename runs under `flock -x -w` on the SAME destination lock,
# so a staging path a reaper moved away can never be published (mv finds no source), and a lock held past
# lease.publish_wait_seconds refuses RH-STAGING-BUSY. PUBLICATION AUTHORITY (r3f, lease.authority): the token-named
# staging path is the authority, checked atomically by the NO-REPLACE rename while the lock is held; a revoker renames
# it away under the lock only after proving quiescence, so a resumed old writer refuses RH-STAGING-REVOKED and never
# touches the revoker's staging; a destination that appeared (even empty) is never replaced; a present different
# bundle is refused with its recorded class_key reported. A concurrent builder at the same destination keeps its
# staging: one PUBLISHED, the other UNCHANGED (same bundle) or REFUSED (different bundle), each releasing only its own.
# bundle.json is written last inside the staging dir; the
# seed's `apply` independently refuses an incomplete bundle (SEED2-BUNDLE-COMPLETION).
# GENESIS (codex-tick127, controller.bootstrap.genesis): this playbook IS the declared package-builder stage. Before
# any write it admits EXACTLY the declared builder (tasks/admit_builder.yml: executable + shebang, python, core,
# ansible package dir, no config file, no stray ANSIBLE_* env, non-root; no search/fallback), and binds the source
# edition with the declared git (os_tools.git, conditional prerequisite of package_source_binding). bundle.json
# records builder, source, input and output identities. The bundle is the distributable bootstrap artifact: a fresh
# consumer needs NO Ansible -- `sha256sum --check bundle.sha256` inside it, then the seed. controller.yml's managed
# re-render is a SECOND check, not retroactive authorization.
# Missing artifacts: testing/remote_harness/acquire.yml (MAIN, network stage, sha256-pinned, declared sources only).
# The per-destination body (input admission -> reap -> reserve -> render -> readback -> publish -> admit_bundle) lives
# in tasks/package_bundle.yml (r3g step 1, a pure move) and runs ONCE PER ARTIFACT CLASS (r3g step 2,
# controller.bootstrap.bundle.per_class): tasks/scope_classes.yml binds the controller scope and partitions the
# deployment's scopes by C1's published class key; the controller's class publishes at rh_bundle_dir, every other class
# at its declared sibling. Run package.yml with the SAME inventory as target_bootstrap.yml so every class exists.
# bundle.json records class_key (identity = class key + artifact digests), not a policy digest (r3g change: the former
# config_revision field is replaced; seed, artifacts and bundle.sha256 of a homogeneous deployment are unchanged).
- name: Package the managed-controller bundle (admit artifacts, render the seed)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs and derive the repository root
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, localhost, no become; r3g)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    - name: Resolve the harness policy through the engine
      ansible.builtin.include_tasks: tasks/resolve_policy.yml

    - name: Admit exactly the declared builder before any write (GENESIS)
      ansible.builtin.include_tasks: tasks/admit_builder.yml
      vars:
        rh_gen_stage: package     # genesis.launch.stages key: env and temps under <work root>/tmp/genesis/package/<act>

    # r2i ENTRY GENERATION (codex-tick417 option B; route node controller.entry_generation): the generated entries are
    # rendered into an owned mirror and gated against the ACCEPTED generation record BEFORE any packaging; a genuinely
    # inactive generation contract (C1 projection active: false) skips it, an absent contract refuses (typed, no
    # default). The source/loader closure was admitted against the intended commit by resolve_policy.yml's FIRST task.
    - name: Refuse a resolution without the entry-generation contract (C1 projection; typed, no default)
      ansible.builtin.assert:
        that:
          - lme_resolved.remote_harness.entry_generation_contract is defined
          - lme_resolved.remote_harness.entry_generation_contract is mapping
          - lme_resolved.remote_harness.entry_generation_contract.active is boolean
        fail_msg: >-
          REFUSED RH-POLICY-UNRESOLVED: the engine resolve produced no lme_resolved.remote_harness.entry_generation_contract
          {active} (C1 projection); entry generation is never assumed inactive.
        quiet: true

    - name: Generate / verify the generated entries in the genesis context (tasks/generate_entries.yml)
      ansible.builtin.include_tasks: tasks/generate_entries.yml
      vars:
        rh_entry_context: genesis
      when: lme_resolved.remote_harness.entry_generation_contract.active

    - name: End the act after an authoring (generate) or verify-only operation (no bundle is published)
      ansible.builtin.meta: end_play
      when:
        - lme_resolved.remote_harness.entry_generation_contract.active
        - rh_eg_op != rh.controller.entry_generation.operation.modes.package

    # OS-TOOL CONSUMER PARTITION (codex-tick328-329; controller.bootstrap.os_tool_consumers, registry-owned, not tunable):
    # every required_by name is EXACTLY one controller or one target consumer. An entry with ANY controller consumer stays
    # a controller precondition (hashed and admitted below); only entries used exclusively by target consumers are
    # skipped here -- target execution admits those in its own namespace. An undeclared name refuses (never silently
    # skipped or hashed). The identity, missing-tool and source-binding guards below are unchanged.
    - name: Refuse an os_tools consumer outside the declared controller/target partition (before any hash)
      vars:
        _rh_pkg_oc: "{{ rh.controller.bootstrap.os_tool_consumers | default({}) }}"
        _rh_pkg_used: "{{ rh.controller.bootstrap.os_tools | dict2items | map(attribute='value.required_by', default=[]) | flatten | unique | list }}"
      ansible.builtin.assert:
        that:
          - _rh_pkg_oc.controller | default([]) | length > 0
          - _rh_pkg_oc.target is defined
          - _rh_pkg_oc.controller | intersect(_rh_pkg_oc.target) | length == 0
          - rh.controller.bootstrap.os_tools | dict2items | rejectattr('value.required_by', 'defined') | list | length == 0
          - rh.controller.bootstrap.os_tools | dict2items | selectattr('value.required_by', 'equalto', []) | list | length == 0
          - _rh_pkg_used | reject('in', _rh_pkg_oc.controller + _rh_pkg_oc.target) | list | length == 0
        fail_msg: >-
          REFUSED RH-OS-TOOL-CONSUMER: every os_tools required_by name must be exactly one declared consumer of
          controller.bootstrap.os_tool_consumers (controller {{ _rh_pkg_oc.controller | default([]) }}, target
          {{ _rh_pkg_oc.target | default([]) }}); undeclared: {{ _rh_pkg_used | reject('in', (_rh_pkg_oc.controller | default([])) + (_rh_pkg_oc.target | default([]))) | list }}.
        quiet: true

    - name: Hash every declared executable this controller runs, independently of the tools (stat sha256, links followed)
      ansible.builtin.stat:
        path: "{{ item.value.path }}"
        follow: true
        get_checksum: true
        checksum_algorithm: sha256
      # target-only entries (required_by names only target consumers: adapter tools, the privileged contact's interpreter,
      # target_prereq / guest / observation tools) are not controller preconditions; with the partition admitted above,
      # "not a subset of target" == "names at least one controller consumer". PREPARATION-only entries (required_by a
      # subset of target + [preparation.tool_label]: gpgv, dpkg-deb, xz) are likewise skipped: they are admitted at their
      # own use boundary (tasks/admit_prep_tools.yml, acquire stage) and are no precondition of packaging (a controller
      # without dpkg-deb -- e.g. RedHat -- still packages); an entry that ALSO serves seed/uv_installer (tar) stays hashed
      loop: >-
        {{ rh.controller.bootstrap.os_tools | dict2items
           | rejectattr('value.required_by', 'subset', rh.controller.bootstrap.os_tool_consumers.target
                        + ([rh.controller.bootstrap.preparation.tool_label] if rh.controller.bootstrap.preparation is defined else []))
           | list }}
      loop_control:
        label: "{{ item.key }}"
      register: _rh_pkg_ident

    # r3f (G D05): identity is judged on PRESENT files only; an absent tool is a MISSING tool (git: the source-binding
    # refusal below, D05; any other: RH-OS-TOOL-MISSING), never an identity refusal. All still before any tool runs.
    - name: Refuse any declared executable whose content is not its declared identity (SEED-06 file_sha256; before any tool runs)
      vars:
        _tst: "{{ _rh_pkg_ident.results | selectattr('stat.exists') | list }}"
      ansible.builtin.assert:
        that:
          - _rh_pkg_ident.results | map(attribute='item.value.identity.kind') | unique | list == ['file_sha256']
          - >-
            _tst | map(attribute='stat') | map(attribute='checksum', default='') | list
            == _tst | map(attribute='item.value.identity.sha256') | list
        fail_msg: >-
          REFUSED RH-OS-TOOL-IDENTITY: declared executables whose resolved content differs from the declared file_sha256
          (or is unreadable):
          {% for r in _tst if (r.stat.checksum | default('')) != r.item.value.identity.sha256 %}{{ r.item.key }}={{ r.item.value.path }}({{ r.stat.checksum | default('unreadable') }}) {% endfor %}.
          Nothing was written; re-hash the declaration only after MAIN verifies the new file.
        quiet: true

    - name: Check the conditional source-binding prerequisite (os_tools.git, package_source_binding)
      ansible.builtin.stat:
        path: "{{ rh.controller.bootstrap.os_tools.git.path }}"
      register: _rh_src_tool

    - name: Refuse a missing source-binding tool (never installed ad hoc)
      ansible.builtin.assert:
        that:
          - "'package_source_binding' in rh.controller.bootstrap.os_tools.git.required_by"
          - _rh_src_tool.stat.exists and _rh_src_tool.stat.executable
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: package_source_binding needs
          {{ rh.controller.bootstrap.os_tools.git.path }} (packages.by_os_family.<family>.git; installed by MAIN).
        quiet: true

    - name: Refuse missing or non-executable controller tools, named with their packages, before any of them runs (read-only)
      vars:
        _missing_names: >-
          {{ _rh_pkg_ident.results | rejectattr('stat.exists') | map(attribute='item.key') | list
             + (_rh_pkg_ident.results | selectattr('stat.exists') | rejectattr('stat.executable') | map(attribute='item.key') | list) }}
        _pkgs: >-
          {% set ns = namespace(p=[]) %}{% for kv in rh.packages.provides | dict2items %}{% if kv.value | intersect(_missing_names) | length > 0 %}{% set ns.p = ns.p + [kv.key] %}{% endif %}{% endfor %}{{ ns.p }}
      ansible.builtin.assert:
        that:
          - _missing_names | length == 0
        fail_msg: >-
          REFUSED RH-OS-TOOL-MISSING: missing or non-executable controller tools {{ _missing_names }} at
          {{ _missing_names | map('extract', rh.controller.bootstrap.os_tools) | map(attribute='path') | list }} -> logical
          packages {{ _pkgs }} = Debian {{ _pkgs | map('extract', rh.packages.by_os_family.Debian) | list }} / RedHat
          {{ _pkgs | map('extract', rh.packages.by_os_family.RedHat) | list }} (MAIN installs them; never ad hoc; an
          admitted os_tools path override names its own location). Nothing was written.
        quiet: true

    # PREPARATION ADMISSION (codex-tick369; C1 proposal controller.bootstrap.preparation): the guest tool identities and
    # a hypervisor's base image are admitted only as the candidate of the preparation record whose digest the profile
    # declares (tasks/admit_preparation.yml; before any write). Absent section -> skipped (the pre-guest profile).
    - name: Admit the preparation candidates the declarations carry (tasks/admit_preparation.yml; declared only)
      ansible.builtin.include_tasks: tasks/admit_preparation.yml
      when: rh.controller.bootstrap.preparation is defined

    # r2k R2J-PACKAGING-GIT-CLOSURE (codex-tick454; r2j ran bare `git -C`): every packaging git call uses the SAME admitted
    # invocation policy as tasks/admit_git_paths.yml -- `<env> -i <git.env_pairs...> <git> <git.global...> <repo>` from
    # the admitted env / git identities of rh_src_admission and the ONE bootstrap git node; head = git.head; status =
    # git.package_status + git.end_of_options + the exact pathspec (the r2i literal path list moved to the declared
    # source_admission.package_status_rel, C1-R2K-GIT). failed_when false + a classified tool refusal (no ambient
    # GIT_* / HOME / config steers it). The recorded worktree_status digest keeps the porcelain form of r2j.
    - name: Bind the source edition (read-only git, admitted invocation)
      vars:
        _rh_pk_sa: "{{ lme_resolved.remote_harness.source_admission }}"
        _rh_pk_git: "{{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.git] }}"
        _rh_pk_x: >-
          {{ [rh_src_admission[_rh_pk_sa.record_fields.tool].env[_rh_pk_sa.tool_fields.path], _rh_pk_git.env_clear] + _rh_pk_git.env_pairs
             + [rh_src_admission[_rh_pk_sa.record_fields.tool].git[_rh_pk_sa.tool_fields.path]] + _rh_pk_git.global + [rh_repo_root] }}
      ansible.builtin.command:
        argv: "{{ _rh_pk_x + item }}"
      # r2i: the generation's admission inputs + outputs (incl. roster authority, accepted / retained records), the
      # verifier closure and the source-admission members join the porcelain pathspec (exact paths)
      # r2j (R2I-BOOTSTRAP-TRUST-ORDER): the bootstrap members (controller.bootstrap.source_admission.members_rel) and
      # every declared importer closure (source_admission.importers keys + values) are UNCONDITIONAL, so the seed's
      # source_admit always finds their bundle.json source.inputs lines (dispatch.source_members_rel WITHDRAWN)
      loop: >-
        {{ [_rh_pk_git.head,
            _rh_pk_git.package_status + [_rh_pk_git.end_of_options]
            + rh.controller.bootstrap.source_admission.package_status_rel
            + ((rh_eg_evidence[rh.controller.entry_generation.evidence.paths_field]
                + rh.controller.entry_generation.dispatch.closure_rel)
               if lme_resolved.remote_harness.entry_generation_contract.active else [])
            + rh.controller.bootstrap.source_admission.members_rel
            + ((rh.controller.bootstrap.source_admission.document_rels | dictsort | map('last') | list)
               if lme_resolved.remote_harness.entry_generation_contract.active else [])
            + (rh.controller.bootstrap.source_admission.importers | dict2items | map(attribute='key') | list)
            + (rh.controller.bootstrap.source_admission.importers.values() | flatten | list)
            + ((rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | map('first') | list)
               if lme_resolved.remote_harness.entry_generation_contract.active else [])] }}
      register: _rh_src_git
      changed_when: false
      failed_when: false

    - name: Refuse a git tool failure while binding the packaged source (tool cause; nothing continues)
      ansible.builtin.assert:
        that:
          - _rh_src_git.results | map(attribute='rc') | reject('equalto', 0) | list | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}:
          {{ rh.controller.bootstrap.genesis.builder.messages.source_git }}
          {{ _rh_src_git.results | map(attribute='rc') | zip(_rh_src_git.results | map(attribute='stderr')) | list | to_json }}
        quiet: true

    - name: Refuse a packaged source edition that is not the admitted intended commit (loader admission + entry generation)
      ansible.builtin.assert:
        that:
          - _rh_src_git.results[0].rc == 0
          - _rh_src_git.results[0].stdout == rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition]
          - not lme_resolved.remote_harness.entry_generation_contract.active
            or _rh_src_git.results[0].stdout == rh_eg_edition
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}: the packaged source edition
          {{ _rh_src_git.results[0].stdout }} is not the admitted intended commit
          {{ rh_src_admission[lme_resolved.remote_harness.source_admission.record_fields.edition] }}.
        quiet: true

    - name: List the engine filter plugins the builder loads (filter closure)
      ansible.builtin.find:
        paths: "{{ rh.controller.bootstrap.genesis.builder.filter_plugins_rel | map('regex_replace', '^', rh_repo_root ~ '/') | list }}"
        patterns: ['*.py']
        file_type: file
      register: _rh_src_filters

    # r2k X-R1-S9-5: every declared generated-play body (importer_obligations body rels) is a packaged input -- the seed admits it
    # pre-launch (raw digest == body_sha256, controller_seed source_admit)
    - name: Digest every source input of the render (profile, lock, templates, playbook, tasks, filter plugins)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: >-
        {{ ([rh.controller.bootstrap.template_rel, rh.controller.bootstrap.seed_launcher.template_rel,
             rh.controller.bootstrap.macros_rel, rh.controller.bootstrap.package_playbook_rel,
             rh.controller.lock_file_rel, 'manifests/profiles/remote-harness.yml', 'testing/remote_harness/tasks/admit_builder.yml',
             'testing/remote_harness/tasks/derive_toolchain_generation.yml', 'testing/remote_harness/tasks/verify_toolchain_receipt.yml',
             'testing/remote_harness/tasks/admit_ancestry.yml',
             'testing/remote_harness/tasks/resolve_policy.yml', 'testing/remote_harness/tasks/refuse_pinned_outputs.yml',
             'testing/remote_harness/tasks/admit_controller.yml', 'testing/remote_harness/tasks/scope_classes.yml',
             'testing/remote_harness/tasks/package_bundle.yml']
            | map('regex_replace', '^', rh_repo_root ~ '/') | list)
           + (_rh_src_filters.files | map(attribute='path') | sort)
           + ((((rh_eg_evidence[rh.controller.entry_generation.evidence.paths_field]
                 + rh.controller.entry_generation.dispatch.closure_rel)
                if lme_resolved.remote_harness.entry_generation_contract.active else [])
               + rh.controller.bootstrap.source_admission.members_rel
               + ((rh.controller.bootstrap.source_admission.document_rels | dictsort | map('last') | list)
                  if lme_resolved.remote_harness.entry_generation_contract.active else [])
               + (rh.controller.bootstrap.source_admission.importers | dict2items | map(attribute='key') | list)
               + (rh.controller.bootstrap.source_admission.importers.values() | flatten | list)
               + ((rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | map('first') | list)
                  if lme_resolved.remote_harness.entry_generation_contract.active else [])) | unique | sort
              | map('regex_replace', '^', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | list) }}
      register: _rh_src_inputs

    # brr-follow (codex-tick522 F05S2-RELATIVE-PATH-GRAMMAR; f05-s3 S3-SEAM-03 / S3-SEAM-05): every generated-play body
    # rel and every admitted document rel is REPOSITORY-RELATIVE and is admitted by the registry rel_path grammar
    # projected as source_admission.rel_path_grammar (the same value the launch record carries) -- before any digest or
    # join. brr-follow-s2 J-GEN3-01 (F05-S4 F05-GEN3-01; the single-regex key is RETIRED): exactly {pattern,
    # refused_components, separator, terminator} (F05-S4 groups-summary 36865155 grammar_final_shape); the declared
    # terminator refused first, then the pattern fullmatch, then a refused component of the split on the grammar's
    # separator (no literal). Generation projections only (RR-06): inactive reads neither key.
    - name: Refuse a body or document rel outside the registry rel_path grammar (generation projections; before any digest)
      vars:
        _rh_pk_g: "{{ rh.controller.bootstrap.source_admission.rel_path_grammar }}"
        _rh_pk_rels: >-
          {{ (rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | map('first') | list)
             + (rh.controller.bootstrap.source_admission.document_rels | dictsort | map('last') | list) }}
      ansible.builtin.assert:
        that:
          - _rh_pk_g is mapping and (_rh_pk_g.keys() | list | sort) == ['pattern', 'refused_components', 'separator', 'terminator']
          - _rh_pk_g.pattern is string and _rh_pk_g.pattern | length > 0
          - _rh_pk_g.separator is string and _rh_pk_g.separator | length > 0
          - _rh_pk_g.terminator is string and _rh_pk_g.terminator | length > 0
          - _rh_pk_g.refused_components is sequence and _rh_pk_g.refused_components is not string
          - _rh_pk_g.refused_components | reject('string') | list | length == 0
          - _rh_pk_rels | select('search', _rh_pk_g.terminator | regex_escape) | list | length == 0
          - _rh_pk_rels | reject('match', '(?:' ~ _rh_pk_g.pattern ~ ')\Z') | list | length == 0
          - _rh_pk_rels | map('split', _rh_pk_g.separator) | map('intersect', _rh_pk_g.refused_components) | reject('equalto', []) | list | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.source_admission.refusals.member }}: a generated-play body or document rel
          is not admitted by source_admission.rel_path_grammar (registry contract_admission.path_law + patterns.rel_path:
          terminator, pattern fullmatch, refused component):
          {{ ((_rh_pk_rels | select('search', _rh_pk_g.terminator | regex_escape) | list) + (_rh_pk_rels | reject('match', '(?:' ~ _rh_pk_g.pattern ~ ')\Z') | list))
             | to_json if (_rh_pk_g is mapping and _rh_pk_g.pattern is defined and _rh_pk_g.pattern is string
                          and _rh_pk_g.terminator is defined and _rh_pk_g.terminator is string) else ([_rh_pk_g] | to_json) }}
        quiet: true
      when: lme_resolved.remote_harness.entry_generation_contract.active

    # r2k X-R1-S9-5: a packaged body whose raw digest is not its declared body_sha256 refuses at packaging (before the
    # seed could ever admit it)
    - name: Digest every declared generated-play body (no link followed)
      ansible.builtin.stat:
        path: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ item[0] }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: >-
        {{ (rh.controller.bootstrap.source_admission.importer_obligations.values() | map('dict2items') | flatten(levels=1) | map(attribute='value') | flatten(levels=1) | list)
           if lme_resolved.remote_harness.entry_generation_contract.active else [] }}
      register: _rh_pk_bodies

    - name: Refuse a generated-play body whose packaged raw digest is not its declared body_sha256
      vars:
        _rh_pk_bad: >-
          {%- set ns = namespace(o=[]) -%}
          {%- for r in _rh_pk_bodies.results -%}
          {%- if not r.stat.exists or r.stat.islnk or not r.stat.isreg or r.stat.checksum != r.item[1] -%}{%- set ns.o = ns.o + [r.item] -%}{%- endif -%}
          {%- endfor -%}{{ ns.o }}
      ansible.builtin.assert:
        that:
          - _rh_pk_bad | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.builder.refusal }}:
          {{ rh.controller.bootstrap.genesis.builder.messages.body_digest }}
          {{ _rh_pk_bad | to_json }}
        quiet: true

    - name: Bind the controller scope and derive the deployment's artifact classes (RH-SCOPE-BINDING; tasks/scope_classes.yml)
      ansible.builtin.include_tasks: tasks/scope_classes.yml

    # r3g per-class publication: ONE full publication destination per class (bundle.per_class); the controller's class
    # at rh_bundle_dir. The CONTENT view is the class scope's own policy and lock; the EXECUTION view (tools, path
    # admission, staging/lease policy) stays this controller's rh. Include params are registry-reserved names.
    - name: Publish each class's bundle destination (input admission, reap, reserve, render, readback, publish, admission)
      ansible.builtin.include_tasks: tasks/package_bundle.yml
      loop: "{{ rh_classes }}"
      loop_control:
        loop_var: _rh_class
        label: "{{ _rh_class.key }} {{ _rh_class.dir }} controller={{ _rh_class.controller }} targets={{ _rh_class.targets }}"
      vars:
        rh_pub_dir: "{{ _rh_class.dir }}"
        rh_pub_key: "{{ _rh_class.key }}"
        rh_pub_policy: "{{ _rh_class.policy }}"
        rh_pub_lock: "{{ lookup('ansible.builtin.file', rh_repo_root ~ '/' ~ _rh_class.policy.controller.lock_file_rel) | from_yaml }}"
