          {%- else -%}
          {%- for k in fixed -%}
          {%- if fixed[k] is boolean or fixed[k] is not integer or fixed[k] <= 0 -%}{%- set ns.l = ns.l + [[c.key, k, fixed[k]]] -%}{%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [_rh_pkg_bad | to_json]}) }}
        quiet: true

    # option B binder (codex711): each class's allocation from its OWN rows, row by row (each row's own file and cap; no
    # positional pairing), plus the fixed members by role (role word -> declared file name of that role). The {rows, total}
    # keys are the N13 rh_rsv_max_bytes interface (erratum-02 binder_interface_for_MAIN; GL-02Z), carried.
    - name: Bind each class's allocation (preflight P8, after P7; BLOCKED-ON-GENESIS-GL _rh_pkg_alloc)
      ansible.builtin.set_fact:
        _rh_pkg_alloc: >-
          {%- set bn = rh.controller.bootstrap.bundle -%}
          {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
          {%- set ns = namespace(m={}) -%}
          {%- for c in rh_classes -%}
          {%- set fixed = c.renderer.bootstrap.bundle.member_max_bytes -%}
          {%- set r = namespace(m={}) -%}
          {%- for a in c.renderer.bootstrap.artifacts + _rh_pkg_lock[c.key].packages + _rh_pkg_lock[c.key].collections -%}
          {%- set r.m = r.m | combine({bn.artifacts_dir ~ sep ~ a.file: a.max_bytes}) -%}
          {%- endfor -%}
          {%- for role in fixed -%}{%- set r.m = r.m | combine({bn[role]: fixed[role]}) -%}{%- endfor -%}
          {%- set ns.m = ns.m | combine({c.key: {'rows': r.m, 'total': r.m.values() | sum}}) -%}
          {%- endfor -%}{{ ns.m }}

    - name: Refuse an allocation that does not cover exactly this class's staged files (preflight P9, after P8; exact coverage against the captured class lock)
      vars:
        _rh_pkg_bad: >-
          {%- set bn = rh.controller.bootstrap.bundle -%}
          {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
          {%- set ns = namespace(l=[]) -%}
          {%- for c in rh_classes -%}
          {%- set want = [bn.seed_file, bn.launcher_file, bn.manifest_file, bn.checksum_file]
                         + ((c.renderer.bootstrap.artifacts + _rh_pkg_lock[c.key].packages + _rh_pkg_lock[c.key].collections)
                            | map(attribute='file') | map('regex_replace', '^', bn.artifacts_dir ~ sep) | list) -%}
          {%- if (_rh_pkg_alloc[c.key].rows | list | sort) != (want | sort) or (_rh_pkg_alloc[c.key].rows | length) != (want | length) -%}
          {%- set ns.l = ns.l + [[c.key, _rh_pkg_alloc[c.key].rows | list | sort, want | sort]] -%}{%- endif -%}
          {%- endfor -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [_rh_pkg_bad | to_json]}) }}
        quiet: true

    # codex714 REC-01 (R1): the bundle.json record is built in package_bundle field by field from
    # controller.bootstrap.bundle.manifest_record roles (never a positional zip). Admitted here for every class before any
    # publication: each field list distinct; each roles node's key set == its field list (the nested pairing source_roles
    # <-> source_fields, genesis_roles <-> genesis_fields is by those declared names: C1PKG-REQ-NESTED-LINK); every role one
    # kind this producer implements; the declared derived words == the words this producer implements (_rh_pkg_impl:
    # the visible residual of VS-PKG-REC-ORDER, OPEN-REQUIRED); every policy path resolves from the declared policy scope
    # root (records-pkg-optb-03 manifest_record.policy_scope: fact rh, path [controller] = the EXECUTING CONTROLLER
    # PUBLICATION POLICY, codex717 (a); walked from the declared fact and path, no literal root); the {policy} roles of
    # every roles node are exactly that node's policy_scope members and no other role is one (optb-03 consumer_owed: the
    # cross-row equality no engine kind states); class content stays rh_pub_policy; and every generation_id source
    # resolves in every class policy controller (class content, class-bound).
    - name: Refuse a record or generation-id declaration this producer cannot build by role (preflight P10)
      vars:
        _rh_pkg_impl:
          record_kinds: [policy, derived, nested]
          derived: [seed_render_sha256, launcher_render_sha256, generation_id, profile_sha256, class_lock_sha256, class_key,
                    artifact_rows, checksum_file_sha256, builder, repo_root, repo_head, worktree_status_sha256, worktree_dirty,
                    source_input_rows, recipe_provenance, class_allocation]
          generation_kinds: [policy, digest]
          generation_digests: [seed_sha256]
        _rh_pkg_bad: >-
          {%- set mr = rh.controller.bootstrap.bundle.manifest_record -%}
          {%- set gi = rh.controller.bootstrap.layout.generation_id -%}
          {%- set ps = mr.policy_scope -%}
          {%- set ns = namespace(l=[], d=[]) -%}
          {#- optb-after-02 (records-pkg-optb-03): the policy-role scope root is the declared fact walked by the declared path -#}
          {%- set root = namespace(n=lookup('ansible.builtin.vars', ps.fact), ok=true) -%}
          {%- for s in ps.path -%}
          {%- if root.ok and root.n is mapping and s in root.n -%}{%- set root.n = root.n[s] -%}{%- else -%}{%- set root.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- if not root.ok -%}{%- set ns.l = ns.l + [['policy_scope', ps.fact, ps.path]] -%}{%- endif -%}
          {%- set nodes = [['roles', mr.fields], ['source_roles', mr.source_fields], ['genesis_roles', mr.genesis_fields]] -%}
          {%- if ps.members | list | reject('in', nodes | map('first') | list) | list | length > 0 -%}{%- set ns.l = ns.l + [['policy_scope', ps.members | list]] -%}{%- endif -%}
          {%- for nn, fl in nodes -%}
          {%- set rn = mr[nn] -%}
          {%- if (fl | unique | list | length) != (fl | length) -%}{%- set ns.l = ns.l + [['fields', fl]] -%}{%- endif -%}
          {%- if rn is not mapping or (rn | list | sort) != (fl | sort) -%}{%- set ns.l = ns.l + [['roles', fl, rn]] -%}
          {%- else -%}
          {%- set pf = namespace(l=[]) -%}
          {%- for f in fl -%}
          {%- set r = rn[f] -%}
          {%- if r is not mapping or (r | length) != 1 or (r | list | first) not in _rh_pkg_impl.record_kinds -%}{%- set ns.l = ns.l + [['kind', f, r]] -%}
          {%- elif 'derived' in r -%}{%- set ns.d = ns.d + [r.derived] -%}
          {%- elif 'nested' in r -%}
          {%- if r.nested not in mr or mr[r.nested] is not mapping -%}{%- set ns.l = ns.l + [['nested', f, r.nested]] -%}{%- endif -%}
          {%- elif 'policy' in r -%}
          {%- set pf.l = pf.l + [f] -%}
          {%- if root.ok -%}
          {#- optb-after-04: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
          {%- set w = namespace(n=root.n, ok=true) -%}
          {%- for s in r.policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}
          {%- if w.ok and w.n is mapping and s in w.n -%}{%- set w.n = w.n[s] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- if not w.ok -%}{%- set ns.l = ns.l + [['policy', f, r.policy]] -%}{%- endif -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {#- optb-after-02 (records-pkg-optb-03 consumer_owed): the {policy} roles of this node are EXACTLY its policy_scope
              members; a node without a members entry has no policy role (the cross-row equality no engine kind states) -#}
          {%- if nn in ps.members -%}
          {%- if (pf.l | sort) != (ps.members[nn] | sort) or (pf.l | length) != (ps.members[nn] | length) -%}{%- set ns.l = ns.l + [['policy_scope', nn, pf.l, ps.members[nn]]] -%}{%- endif -%}
          {%- elif pf.l | length > 0 -%}{%- set ns.l = ns.l + [['policy_scope', nn, pf.l]] -%}
          {%- endif -%}
          {%- endif -%}
          {%- endfor -%}
          {%- if (ns.d | unique | sort) != (_rh_pkg_impl.derived | sort) or (ns.d | unique | list | length) != (ns.d | length) -%}
          {%- set ns.l = ns.l + [['derived', ns.d, _rh_pkg_impl.derived]] -%}{%- endif -%}
          {%- for o in gi.order -%}
          {%- if o not in gi.sources or o not in gi.prefixes or gi.sources[o] is not mapping or (gi.sources[o] | length) != 1
                 or (gi.sources[o] | list | first) not in _rh_pkg_impl.generation_kinds -%}{%- set ns.l = ns.l + [['generation', o]] -%}
          {%- elif 'digest' in gi.sources[o] -%}
          {%- if gi.sources[o].digest not in _rh_pkg_impl.generation_digests -%}{%- set ns.l = ns.l + [['generation', o, gi.sources[o]]] -%}{%- endif -%}
          {%- else -%}
          {%- for c in rh_classes -%}
          {#- optb-after-04: policy segments split on the declared audit_join (records-pkg-optb-04; C1-OPTB4-GL-02) -#}
          {%- set w = namespace(n=c.renderer, ok=true) -%}
          {%- for s in gi.sources[o].policy.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) -%}
          {%- if w.ok and w.n is mapping and s in w.n -%}{%- set w.n = w.n[s] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- if not w.ok -%}{%- set ns.l = ns.l + [['generation', o, c.key, gi.sources[o].policy]] -%}{%- endif -%}
          {%- endfor -%}
          {%- endif -%}
          {%- endfor -%}
          {#- optb-after-08 (records-n1-03 OPEN-OPTB4-RULE-CLASS-EQ-SITE, supp-01 N1-03-S1-P10-SITE; C-OPTB4-RULE-CLASS-EQ): every
              bootstrap node the seed generation_id macro reads must be equal in each class and in rh.controller (node list
              literal here: OPEN-PKG08-RULE-NODES asks for a declared node list) -#}
          {%- for c in rh_classes -%}{%- for p in [['layout', 'generation_id'], ['layout', 'generations_dir'], ['path_admission', 'separator'], ['source_admission', 'early_view', 'override', 'audit_join']] -%}
          {%- set a = namespace(n=c.renderer.bootstrap, ok=true) -%}{%- set b = namespace(n=rh.controller.bootstrap, ok=true) -%}
          {%- for s in p -%}
          {%- if a.ok and a.n is mapping and s in a.n -%}{%- set a.n = a.n[s] -%}{%- else -%}{%- set a.ok = false -%}{%- endif -%}
          {%- if b.ok and b.n is mapping and s in b.n -%}{%- set b.n = b.n[s] -%}{%- else -%}{%- set b.ok = false -%}{%- endif -%}
          {%- endfor -%}
          {%- if not a.ok or not b.ok or (a.n | to_json(sort_keys=true)) != (b.n | to_json(sort_keys=true)) -%}{%- set ns.l = ns.l + [['generation_rule', c.key, p]] -%}{%- endif -%}
          {%- endfor -%}{%- endfor -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.genesis.builder.refusal,
                                   'rh_rf_detail': [_rh_pkg_bad | to_json]}) }}
        quiet: true

    # optb-after-03 (codex721 PREFLIGHT-ARTIFACTS = yes): the artifact store custody and the selected artifact inputs of
    # EVERY class are admitted here, before the first bundle publication mutation (moved from package_bundle optb-after-02
    # :81-174, which admitted only the current class just before its N13 include). Preflight discipline, NOT a
    # transactional multi-bundle claim: the immediate checks stay inside N13 (each artifact a no-follow regular file at
    # the copy source with its size cap, the STAGED copy digest-bound to the declared sha256 before publication).
    # codex-tick702 OPEN-PKG-01-GAP-A (ancestors), PROTECTIONS STATED, NOT OVERCLAIMED: (1) the ONE ancestry rule admits
    # every existing component of the store path (real directories, owned by uid 0 or the running uid, never
    # other-writable, group-writable only when owner-owned AND admitted by owner_private_group), so apart from uid 0 and
    # the builder account itself no principal can rename or replace a component; (2) the store root is the builder's own
    # real directory; (3) every declared artifact of every class is a flat name directly under it, so the admitted
    # ancestry is each artifact's whole ancestry; (4) each artifact is a no-follow regular file here, again at the N13 copy
    # source. NOT PROTECTED: these are separate lstat observations in this controller's mount namespace (local
    # connection, no become), not one atomic open: no openat / no-follow descriptor chain and no lock on the store, so
    # uid 0 or the builder account can replace a component between this preflight and N13's read by path (a window that
    # now spans earlier classes' publications). A changed ancestor at consumption is caught only when the bytes read
    # differ from the declaration (digest refusal); identical declared bytes read through a replaced path are admitted,
    # their path provenance qualified to the store as admitted here, modulo uid 0 and the builder account.
    - name: Refuse an artifact store host var that is not a normalized absolute path (preflight P11; before the store is read)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.genesis.acquisition.source_var is string and rh.controller.bootstrap.genesis.acquisition.source_var in vars
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is string
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is match(rh.controller.bootstrap.path_admission.regex)
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [rh.controller.bootstrap.genesis.acquisition.source_var]}) }}
        quiet: true

    - name: Admit the artifact store path by the ONE ancestry rule (preflight P12; store custody; tasks/admit_ancestry.yml)
      ansible.builtin.include_tasks: tasks/admit_ancestry.yml
      vars:
        rh_anc_bs: "{{ rh.controller.bootstrap }}"
        rh_anc_repo_root: "{{ rh_repo_root }}"
        rh_anc_path: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) }}"
        rh_anc_refusal: "{{ rh.controller.bootstrap.bundle.refusals.artifacts }}"

    - name: Stat the artifact store root itself (preflight P13; no link followed; read-only)
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) }}"
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      register: _rh_pkg_anc

    - name: Refuse a store root that is not the builder's own real directory, or any class artifact that is not a flat name in it (preflight P14)
      vars:
        _rh_pkg_bad: >-
          {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
          {%- set ns = namespace(l=[]) -%}
          {%- for c in rh_classes -%}
          {%- for a in c.renderer.bootstrap.artifacts + _rh_pkg_lock[c.key].packages + _rh_pkg_lock[c.key].collections -%}
          {%- if a.file is search(sep | regex_escape) -%}{%- set ns.l = ns.l + [[c.key, a.file]] -%}{%- endif -%}
          {%- endfor -%}
          {%- endfor -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_anc.stat.exists
          - _rh_pkg_anc.stat.isdir
          - not _rh_pkg_anc.stat.islnk
          - _rh_pkg_anc.stat.uid == rh_builder.uid | int
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var),
                                                    rh.controller.bootstrap.path_admission.admission_texts.components,
                                                    rh_builder.uid,
                                                    _rh_pkg_bad | to_json]}) }}
        quiet: true

    # One row per (class, declared artifact row), in class order then declared row order; each row carries its class key,
    # file, store path and declared sha256, so every refusal names the class (rows shared by classes are stat'ed per class).
    - name: Stat every declared artifact of every class in the store (preflight P15; no link followed; a link or non-regular file refuses below)
      ansible.builtin.stat:
        path: "{{ _rh_pkg_art.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: >-
        {%- set st = lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) -%}
        {%- set sep = rh.controller.bootstrap.path_admission.separator -%}
        {%- set ns = namespace(l=[]) -%}
        {%- for c in rh_classes -%}
        {%- for a in c.renderer.bootstrap.artifacts + _rh_pkg_lock[c.key].packages + _rh_pkg_lock[c.key].collections -%}
        {%- set ns.l = ns.l + [{'key': c.key, 'file': a.file, 'path': st ~ sep ~ a.file, 'sha256': a.sha256}] -%}
        {%- endfor -%}
        {%- endfor -%}{{ ns.l }}
      loop_control:
        loop_var: _rh_pkg_art
        label: "{{ _rh_pkg_art.key }} {{ _rh_pkg_art.file }}"
      register: _rh_pkg_src

    - name: Refuse a present declared artifact of any class that is a link or not a regular file (preflight P16; OPEN-PKG-01 kept; no fallback)
      ansible.builtin.assert:
        that:
          - _rh_pkg_src.results | map(attribute='stat') | selectattr('exists') | selectattr('islnk') | list | length == 0
          - _rh_pkg_src.results | map(attribute='stat') | selectattr('exists') | rejectattr('isreg') | list | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [rh.controller.bootstrap.path_admission.admission_texts.components,
                                                    _rh_pkg_src.results | selectattr('stat.exists') | rejectattr('stat.isreg')
                                                    | map(attribute='_rh_pkg_art') | list | to_json]}) }}
        quiet: true

    - name: Refuse a missing or mismatched declared artifact of any class (preflight P17; offline admission; before any publication)
      vars:
        _rh_pkg_bad: >-
          {%- set ns = namespace(l=[]) -%}
          {%- for r in _rh_pkg_src.results -%}
          {%- if not r.stat.exists or r.stat.checksum != r._rh_pkg_art.sha256 -%}{%- set ns.l = ns.l + [r._rh_pkg_art] -%}{%- endif -%}
          {%- endfor -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.bundle.refusals.artifacts,
                                   'rh_rf_detail': [lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var),
                                                    rh.controller.bootstrap.genesis.acquisition.source_var,
                                                    _rh_pkg_bad | to_json]}) }}
        quiet: true

    # optb-after-07 (C1-PKG records-pubrcpt-01 consumers_owed rows 1 / 2): the receipt accumulator starts EMPTY here, once,
    # before the class loop; package_bundle optb-after-05 adds each admitted class (keys exactly receipt.class_fields; a class
    # already present refuses). An initialization, not a fallback: no reader defaults it.
    - name: Start the publication receipt accumulator before the class loop (BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt)
      ansible.builtin.set_fact:
        _rh_pkg_rcpt: {}

    # optb-after-08 CLASS RECORDS DIR (C1-PKG records-pubrcpt-02 rulings.class_records.dir; records-recovery-vocab-02 PKG-CALLER
    # consumer row: resume detection from state this stage owns, never an attempt marker). The dir is <act dir>/
    # <receipt.class_records.dir_rel> (the receipt's act dir join, genesis_source_record_emit :202-209). Observed without
    # following links BEFORE the class loop. Absent -> ONE mkdir without -p at class_records.dir_mode by the declared
    # os_tools.mkdir (admitted first: exists, regular, executable, os_tool_identity.owner_uid, not group / other-writable,
    # as reserve_publish RESERVE :109-148), resumed false; a mkdir that fails (the dir appeared) refuses. Present -> resumed
    # true, admitted only as a real dir owned by the builder at exactly dir_mode whose entries (hidden ones included, no
    # recursion, no link followed) are only class_records.name of a partition class key, each a regular file (no link) of
    # class_records.mode owned by the builder. Every refusal is receipt.refusal (RH-PACKAGE-RECEIPT); nothing is removed.
    # OPEN-PKG08-NAME-PLACEHOLDER: the {class_key} placeholder token of class_records.name is substituted literally.
    - name: Observe the class-records dir before the class loop (no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_cdir)
      ansible.builtin.stat:
        path: >-
          {{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
              rh.controller.bootstrap.work_roots.sub_roots[rh.controller.bootstrap.genesis.launch.stage_root.sub],
              rh.controller.bootstrap.genesis.launch.stage_root.rel,
              rh.controller.bootstrap.genesis.initializer.dispatch.evidence.publication.stage,
              lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
              rh.controller.bootstrap.package_publish.receipt.class_records.dir_rel] | join(rh.controller.bootstrap.path_admission.separator) }}
        follow: false
        get_checksum: false
      register: _rh_pkg_rcpt_cdir

    - name: Stat the declared mkdir tool before any use (links followed, as RESERVE; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_ctool)
      ansible.builtin.stat:
        path: "{{ rh.controller.bootstrap.os_tools.mkdir.path }}"
        follow: true
        get_checksum: false
      register: _rh_pkg_rcpt_ctool

    - name: Refuse a declared mkdir tool that is not a root-owned, non-writable regular executable (before the class-records mkdir)
      ansible.builtin.assert:
        that:
          - _rh_pkg_rcpt_ctool.stat.exists and _rh_pkg_rcpt_ctool.stat.isreg and _rh_pkg_rcpt_ctool.stat.executable
          - _rh_pkg_rcpt_ctool.stat.uid == rh.controller.bootstrap.os_tool_identity.owner_uid
          - not _rh_pkg_rcpt_ctool.stat.wgrp and not _rh_pkg_rcpt_ctool.stat.woth
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                   'rh_rf_detail': [rh.controller.bootstrap.os_tools.mkdir.path]}) }}
        quiet: true

    - name: Create the class-records dir once when absent (declared mkdir, no -p, class_records.dir_mode)
      when: not _rh_pkg_rcpt_cdir.stat.exists
      block:
        - name: Create the class-records dir (BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_cmk)
          ansible.builtin.command:
            argv:
              - "{{ rh.controller.bootstrap.os_tools.mkdir.path }}"
              - -m
              - "{{ rh.controller.bootstrap.package_publish.receipt.class_records.dir_mode }}"
              - --
              - >-
                {{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
                    rh.controller.bootstrap.work_roots.sub_roots[rh.controller.bootstrap.genesis.launch.stage_root.sub],
                    rh.controller.bootstrap.genesis.launch.stage_root.rel,
                    rh.controller.bootstrap.genesis.initializer.dispatch.evidence.publication.stage,
                    lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
                    rh.controller.bootstrap.package_publish.receipt.class_records.dir_rel] | join(rh.controller.bootstrap.path_admission.separator) }}
          register: _rh_pkg_rcpt_cmk
      rescue:
        - name: Refuse a failed class-records mkdir (the dir appeared or could not be made; nothing is removed)
          ansible.builtin.fail:
            msg: >-
              {{ lookup('ansible.builtin.template',
                        rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                        template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                       'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                       'rh_rf_detail': [rh.controller.bootstrap.package_publish.receipt.class_records.dir_rel, ansible_failed_result.msg]}) }}

    - name: List a present class-records dir (hidden entries, any type, no recursion, no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_cls)
      ansible.builtin.find:
        paths: "{{ _rh_pkg_rcpt_cdir.stat.path }}"
        file_type: any
        hidden: true
        recurse: false
        follow: false
      when: _rh_pkg_rcpt_cdir.stat.exists
      register: _rh_pkg_rcpt_cls

    - name: Bind whether this run resumes this act's publication (the class-records dir was present; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_resumed)
      ansible.builtin.set_fact:
        _rh_pkg_rcpt_resumed: "{{ _rh_pkg_rcpt_cdir.stat.exists }}"

    - name: Refuse a class-records dir or entry of another kind, owner, mode or name (before the class loop)
      vars:
        _rh_pkg_bad: >-
          {%- set cr = rh.controller.bootstrap.package_publish.receipt.class_records -%}
          {%- set ns = namespace(l=[]) -%}
          {%- if _rh_pkg_rcpt_cdir.stat.exists -%}
          {%- set st = _rh_pkg_rcpt_cdir.stat -%}
          {%- if not st.isdir or st.islnk or st.uid != rh_builder.uid | int or st.mode != cr.dir_mode -%}{%- set ns.l = ns.l + [[st.path, st.mode, st.uid]] -%}{%- endif -%}
          {%- set nm = namespace(l=[]) -%}
          {%- for c in rh_classes -%}{%- set nm.l = nm.l + [cr.name | replace('{class_key}', c.key)] -%}{%- endfor -%}
          {%- for f in _rh_pkg_rcpt_cls.files -%}
          {%- if (f.path | basename) not in nm.l or not f.isreg or f.islnk or f.mode != cr.mode or f.uid != rh_builder.uid | int -%}
          {%- set ns.l = ns.l + [[f.path, f.mode, f.uid]] -%}{%- endif -%}
          {%- endfor -%}
          {%- elif _rh_pkg_rcpt_cmk.rc != 0 -%}{%- set ns.l = ns.l + [[_rh_pkg_rcpt_cmk.cmd, _rh_pkg_rcpt_cmk.rc]] -%}
          {%- endif -%}{{ ns.l }}
      ansible.builtin.assert:
        that:
          - _rh_pkg_bad | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                   'rh_rf_detail': [_rh_pkg_bad | to_json]}) }}
        quiet: true

    # r3g per-class publication: ONE full publication destination per class (bundle.per_class); the controller's class
    # at rh_bundle_dir. The CONTENT view is the class scope's own policy and lock; the EXECUTION view (tools, path
    # admission, staging/lease policy) stays this controller's rh. Include params are registry-reserved names.
    - name: Publish each class's bundle destination (input admission, reap, reserve, render, readback, publish, admission)
      ansible.builtin.include_tasks: tasks/package_bundle.yml
      loop: "{{ rh_classes }}"
      loop_control:
        loop_var: _rh_class
        label: "{{ _rh_class.key }} {{ _rh_class.dir }} controller={{ _rh_class.controller }} targets={{ _rh_class.targets }}"
      vars:
        rh_pub_dir: "{{ _rh_class.dir }}"
        rh_pub_key: "{{ _rh_class.key }}"
        rh_pub_policy: "{{ _rh_class.policy }}"
        rh_pub_controller: "{{ _rh_class.renderer }}"
        rh_pub_binding: "{{ _rh_class.generation_binding }}"

    # optb-after-07 PUBLICATION RECEIPT (C1-PKG records-pubrcpt-01 REQ-PUBRCPT-01..03; consumers_owed row 2; codex726
    # OPEN_N6_PUB_READBACK). Reached only when every class was PUBLISHED or UNCHANGED and admitted by admit_bundle (a
    # refused class stops the loop first: no receipt, never a partial one). Every word is read from the EXECUTING
    # controller policy rh.controller.bootstrap.package_publish.receipt, never a class policy. Order: coverage partition
    # (receipt.coverage, pinned [partition] at resolve by C1-RCPT-GL-02) -> the word (keys exactly receipt.fields; source
    # = the receipt.source_fields values of the admitted source record, the var named by source_admission.bootstrap_input
    # .var, never re-measured) -> the path (this launch's own exclusively created act dir under the publication stage,
    # the genesis_source_record_emit :202-209 join) -> stat without following links -> ONE write (force false) at
    # receipt.mode -> ONE read back equal to the word -> stat mode, owner and digest (:211-259 pattern).
    # Every refusal is receipt.refusal (RH-PACKAGE-RECEIPT). A written receipt that fails readback is never deleted.
    # optb-after-08 (C1-PKG records-pubrcpt-02 rulings.receipt; codex729 729-RECOVERY-RECEIPT-REUSE): the word carries
    # resumed (_rh_pkg_rcpt_resumed, the class-records dir observation above). The refuse-if-present branch is WITHDRAWN:
    # absent -> written once as above; present (an earlier attempt of THIS act wrote it) -> never rewritten, admitted only
    # when its bytes are EXACTLY the word rebuilt from this run's entries with resumed = its OWN resumed value (the two
    # candidates differ only in resumed; the present bytes must equal one of them, so their resumed is a bool and act,
    # stage, source, schema and every class entry are byte-equal). One read either way (the readback of a write, or the
    # read of the present receipt), then the post stat. The class entries are package_bundle optb-after-06's (record
    # values, trusted_oid included: B-CLS-4).
    - name: Refuse a publication receipt whose classes are not exactly the deployment partition (receipt.coverage partition)
      ansible.builtin.assert:
        that:
          - (_rh_pkg_rcpt | list | sort) == (rh_classes | map(attribute='key') | list | sort)
          - (_rh_pkg_rcpt | length) == (rh_classes | length)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                   'rh_rf_detail': [_rh_pkg_rcpt | list | sort | to_json, rh_classes | map(attribute='key') | list | sort | to_json]}) }}
        quiet: true

    - name: Bind the publication receipt word and its path (keys exactly receipt.fields; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_word / _rh_pkg_rcpt_out)
      ansible.builtin.set_fact:
        _rh_pkg_rcpt_word: >-
          {%- set rc = rh.controller.bootstrap.package_publish.receipt -%}
          {%- set sr = lookup('ansible.builtin.vars', rh.controller.bootstrap.source_admission.bootstrap_input.var) -%}
          {%- set src = namespace(m={}) -%}
          {%- for f in rc.source_fields -%}{%- set src.m = src.m | combine({f: sr[f]}) -%}{%- endfor -%}
          {%- set v = {'act': lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
                       'classes': _rh_pkg_rcpt, 'resumed': _rh_pkg_rcpt_resumed, 'schema': rc.schema, 'source': src.m,
                       'stage': rh.controller.bootstrap.genesis.initializer.dispatch.evidence.publication.stage} -%}
          {%- if (v | list | sort) == (rc.fields | sort) and (v | length) == (rc.fields | length) -%}
          {{ {'json': v | to_json(sort_keys=true)}[rc.format] }}
          {%- else -%}
          {{ undef() | mandatory(lookup('ansible.builtin.template',
                                        rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                                        template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                                       'rh_rf_code': rc.refusal,
                                                       'rh_rf_detail': [rc.fields | to_json, v | list | sort | to_json]})) }}
          {%- endif -%}
        _rh_pkg_rcpt_out: >-
          {{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
              rh.controller.bootstrap.work_roots.sub_roots[rh.controller.bootstrap.genesis.launch.stage_root.sub],
              rh.controller.bootstrap.genesis.launch.stage_root.rel,
              rh.controller.bootstrap.genesis.initializer.dispatch.evidence.publication.stage,
              lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.launch.stage_root.act.var),
              rh.controller.bootstrap.package_publish.receipt.record_rel] | join(rh.controller.bootstrap.path_admission.separator) }}

    - name: Observe the publication receipt path before the write (no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_pre)
      ansible.builtin.stat:
        path: "{{ _rh_pkg_rcpt_out }}"
        follow: false
        get_checksum: false
      register: _rh_pkg_rcpt_pre

    - name: Write the publication receipt once when absent (receipt.mode; force false; a present receipt is re-admitted below, never rewritten)
      when: not _rh_pkg_rcpt_pre.stat.exists
      block:
        - name: Write the publication receipt
          ansible.builtin.copy:
            content: "{{ _rh_pkg_rcpt_word }}"
            dest: "{{ _rh_pkg_rcpt_out }}"
            mode: "{{ rh.controller.bootstrap.package_publish.receipt.mode }}"
            force: false
      rescue:
        - name: Refuse a failed publication receipt write
          ansible.builtin.fail:
            msg: >-
              {{ lookup('ansible.builtin.template',
                        rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                        template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                       'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                       'rh_rf_detail': [_rh_pkg_rcpt_out, ansible_failed_result.msg]}) }}

    - name: Read the publication receipt once (the readback of this write, or the present receipt; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_back)
      ansible.builtin.slurp:
        src: "{{ _rh_pkg_rcpt_out }}"
      register: _rh_pkg_rcpt_back

    - name: Observe the written publication receipt (mode, owner, digest; no link followed; BLOCKED-ON-GENESIS-GL _rh_pkg_rcpt_post)
      ansible.builtin.stat:
        path: "{{ _rh_pkg_rcpt_out }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ rh.controller.bootstrap.source_admission.digest_algorithm }}"
      register: _rh_pkg_rcpt_post

    # optb-after-08: written -> the bytes equal this run's word; present -> the bytes equal this run's word OR the same word
    # with resumed negated (its own resumed value; nothing else may differ). The digest is checked against the bytes read.
    - name: Refuse a publication receipt file that is not exactly the written or re-admitted word (bytes, regular file, mode, owner, digest)
      ansible.builtin.assert:
        that:
          - >-
            (_rh_pkg_rcpt_back.content | b64decode) == _rh_pkg_rcpt_word
            or (_rh_pkg_rcpt_pre.stat.exists
                and (_rh_pkg_rcpt_back.content | b64decode)
                    == {'json': _rh_pkg_rcpt_word | from_json | combine({'resumed': not _rh_pkg_rcpt_resumed}) | to_json(sort_keys=true)}[rh.controller.bootstrap.package_publish.receipt.format])
          - _rh_pkg_rcpt_post.stat.isreg and not _rh_pkg_rcpt_post.stat.islnk
          - _rh_pkg_rcpt_post.stat.mode == rh.controller.bootstrap.package_publish.receipt.mode
          - _rh_pkg_rcpt_post.stat.uid == rh_builder.uid | int
          - _rh_pkg_rcpt_post.stat.checksum == (_rh_pkg_rcpt_back.content | b64decode | hash(rh.controller.bootstrap.source_admission.digest_algorithm))
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.package_publish.receipt.refusal,
                                   'rh_rf_detail': [_rh_pkg_rcpt_out, _rh_pkg_rcpt_post.stat.checksum]}) }}
        quiet: true
# FROZEN, no further writes
