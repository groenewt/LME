---
# testing/remote_harness/verify_entries.yml -- SAME-CONSUMER ENTRY VERIFIER (route r2i; codex-tick424 item 7
# before_dependent_invocation). NEW FILE, a NEVER-GENERATED member (generator / first guard / verifier set). AUTHORED,
# NEVER EXECUTED (UNRUN).
#
# Started ONLY by the seed's entry dispatch (controller_seed.j2 macro entry_verify), as a CHILD of the seed (not an
# exec, not a recursive seed run: the seed holds its lock, a nested `seed run` would be RH-SEED-BUSY), with a CLOSED
# argv: the admitted managed generation's ansible-playbook, the run_local inventory/connection, the run_local pinned
# vars, the inventory root/owner variables, the context selector (seed), ONE dispatch input JSON (edition, roster
# digest, accepted record file digest, invoked entries' digests) and -- r2j, replacing r2i's edition-only input --
# the launcher bootstrap record rh_source_bootstrap (LAST; produced by the seed's source_admit from the same bundle
# binding; consumed by admit_loader_source.yml through resolve_harness.yml -> resolve_policy.yml).
# No caller argument reaches it. It exits non-zero on every refusal; the seed then refuses RH-SEED-ENTRY-VERIFY and the
# dependent entry never starts. It renders the entries afresh into the seed-created dispatch tmp (mirror parent) and
# applies EVERY verify gate of tasks/generate_entries.yml in the seed context (operation fixed to verify).
#
# Why not package.yml: admit_builder.yml admits only the genesis builder (/usr/bin/ansible-playbook), and this runs
# under the managed generation. Why not controller.yml: it writes a controller receipt; this verifier writes nothing
# but its mirror inside the seed's run tmp.
# Order: first-entry guard -> controller binding -> resolve_harness.yml (its resolve_policy.yml FIRST admits the loader
# closure against the dispatched edition, r2i R5K-LOADER-TRUST-BOUNDARY; then binds the executor to the toolchain
# receipt) -> the generation consumer in the seed context.

- name: Seed entry dispatch -- verify the invoked generated entries before they run
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs and derive the repository root
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, localhost, no become)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    - name: Admit the loader closure, resolve the harness policy, verify the receipt and bind the executor
      ansible.builtin.include_tasks: tasks/resolve_harness.yml

    - name: Verify the dispatched entries in the seed context (operation fixed to verify by the declaration)
      ansible.builtin.include_tasks: tasks/generate_entries.yml
      vars:
        rh_entry_context: seed
