- name: "PREREQ -- report (then MAIN repeats the measurement; only the NEW record is a candidate)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_rp: "{{ rh.controller.bootstrap.report_frame }}"
    _rh_cpq_rk: "{{ rh.controller.bootstrap.controller_prerequisite.report_fields }}"
  ansible.builtin.debug:
    msg: >-
      {{ {_rh_cpq_rp.text: _rh_cpq_n.report,
          _rh_cpq_rk.packages: rh_cpq_packages,
          _rh_cpq_rk.reviewed_record: _rh_cpq_n.reviewed_record.sha256,
          _rh_cpq_rk.host: rh_cpq_host,
          _rh_cpq_rk.contract: tr_contract | dict2items | selectattr('key', 'in', _rh_cpq_rk.contract_keys) | items2dict,
          _rh_cpq_rk.binding_receipt: {_rh_cpq_rk.path: rh_rcpt_receipt_path, _rh_cpq_rk.sha256: rh_rcpt_receipt_stat.checksum},
          _rh_cpq_rk.then: _rh_cpq_n.then,
          _rh_cpq_rp.stop: _rh_cpq_n.diagnostics.stop} }}
