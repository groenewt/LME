# testing/remote_harness/entry_bodies/controller_prereq/cpq-controller.yml -- the authored BODY of play cpq-controller
# of the GENERATED entry testing/remote_harness/controller_prereq.yml (R4-owned body; route-r4f, B-r1 s7
# join-proposal-s7.yml faf64f5f / join-s7 transfer.decl.proposal.yml f224d867 hunk 6). The entry's play metadata and
# first-entry head (route guard `include`, B family guard `family`) are constructed from transfer.decl.yml entry_sets by
# the entry macros; this file holds every task AFTER the head, byte-identical to route-r4 r4e-controller_prereq.after.yml
# (0450d946; unchanged in r4f) :86-381 de-indented by 4. A task list, STATICALLY imported by the generated entry; its
# playbook_dir is still the entry directory (testing/remote_harness), so the family-guard path check below
# ((playbook_dir | dirname | dirname) == rh_repo_root) keeps its meaning -- a placement change needs R4 review.
# RELOCATED (r4f): the entry header r4e :2-58 (below, verbatim; its HELD / PENDING-construction wording is the r4e state,
# superseded for construction by the s7 join) and the head comment r4e :80-82. r4e :60-69 (hand-copied entry forms /
# play keys) is NOT relocated: generation retires the hand copies it described.
#
# testing/remote_harness/controller_prereq.yml -- ENTRY: the MAIN-only PRIVILEGED CONTROLLER PREREQUISITE operation
# (codex-tick393 R4_privilege; codex-tick400 R4-PRIVILEGED-CONTRACT route consumer; route-r4e over r4d ee3bf99b;
# profile controller.bootstrap.controller_prerequisite REVISION 3, C1 proposal r4d-c1-hunks.yml + r4e-c1-hunks.yml). AUTHORED, NEVER
# EXECUTED. HELD: the installer is NOT runnable until the C1 join lands, B's r5f controller_operation endpoint kind lands
# (testing/e2e/transfer/tasks/resolve_contract.yml f183eb24 + endpoint_bind.yml 4df801cf; B r5f-interface.yml cd465b8d
# privileged_contract), R1 s4 entry construction lands (PENDING: entry_sets / placement for this file), and MAIN lands
# reviewed_record.sha256 (null = fail-closed). The full acquisition workflow is NOT claimed runnable.
#
# WHAT: installs EXACTLY the missing_packages of ONE MAIN-REVIEWED preparation measurement record on THIS controller,
# with the distro-neutral install module at the declared state (present: never latest, never a removal), then STOPS;
# MAIN repeats the measurement (controller_prerequisite.then) and only the NEW record is a candidate. The package names
# are the record's DECLARED associations (preparation_measurement.package_basis), re-derived from the declaration.
#
# CONNECTION (codex-tick400 R4-PRIVILEGED-CONTRACT): B's ONE privileged contract, never a route projection. The
# controller play names the peer tr_peer = {alias: the ONE member of groups[inventory.role_groups[host_group]], kind:
# controller_prerequisite.endpoint_kind (controller_operation), role_group: host_group} and includes B's
# tasks/resolve_contract.yml then tasks/endpoint_bind.yml (paths from controller_prerequisite.reuse). B binds the key
# from the LOADER-BOUND input binding.deployment.controller_endpoint_inputs[alias][privileged_key] (no raw host-var key
# read here or there) and the endpoint from binding.deployment.controller_endpoints[alias]; it neutralizes every
# credential selector. The privileged play binds EXACTLY transfer.contract.conn_vars + credential_selectors.bind_key +
# credential_selectors.clear as PLAY vars from hostvars['localhost'].tr_conn (the target_prereq.yml :285-301 form; the
# play-var keys are B's declared list, which B's check.yml enforces).
#
# FIRST ENTRY OF THE PRIVILEGED HOST (codex-tick409 R4C-SELF-REJECTING-NAME-GUARD): route guard, B family guard, then
# the prerequisite NAME GUARD, which defines NO task var (it reads hostvars['localhost'] directly, so its own alias can
# never be what it refuses), then the CONTRACT PROOF, the only task that binds the alias _rh_cpq_lh, proving every bound
# play var equals the contract. Both run before resolve_policy and long before initial contact. An externally supplied
# _rh_cpq_lh (or any ^_?rh_cpq_ name) is refused by the name guard before the proof binds it.
#
# BINDING RECEIPT (codex-tick409 R4C-SHARED-RECEIPT-ADMISSION; r4e codex-tick419 R5G-RECEIPT-ADMISSION-CONSUMER and
# codex-tick421 J-B8): the launch's files, B's binding receipt (its COMPARED bindings -- policy, source edition,
# interface -- equal to THIS resolve's records; its attributed resolved-state revision recorded, never compared), the
# effective declared inputs and the PLACED MEMBERS (the effective members of the placement group and every var the
# vouched binding declares for them equal the vouched binding) are admitted by the ONE shared admission
# tasks/admit_binding_receipt.yml (controller.bootstrap.binding_admission) -- the same file the measurement includes,
# never a clone -- with this declaration's inventory_kind / controller_operation / refusal, before scope admission and
# before any contact. It publishes the verified receipt record (rh_rcpt_receipt_path, rh_rcpt_receipt_stat) and the
# admission evidence rh_rcpt_admission (exact reserved outputs, refused at the first entry and by the admission's first
# task); B's resolve_contract / endpoint_bind REQUIRE both before contract use (r4e-admission-output.proposal.yml,
# B-owned consumer; until B lands it the join is by ordering only and is NOT claimed).
#
# IDENTITY / FAMILY (codex-tick400 Q5 / Q8): the endpoint binding is B's (tr_endpoint == the loader-bound endpoint).
# machine-id equality with the controller play is SUPPORTING evidence only (host_identity.role). The privileged host's
# OBSERVED os family must be in preparation_measurement.controller_families (declared ONCE, on the measurement node)
# AND equal the measurement's package-association family before any effect.
#
# LAUNCH (HELD; r4d-invocation.yml step prerequisite): the seed's managed generation, NON-ROOT toolchain owner, become
# off, inventory = the controller_operation_binding kind for operation controller_prerequisite (explicit ordered files
# -i <lab copy> -i <binding>), -e <record_var>=<reviewed record path>.
#
# REFUSALS: every refusal is the common grammar controller.bootstrap.refusal_grammar (REFUSED <code>: <detail>) through
# its entry template (rh_cpq_rf_tpl). No default(. Asserts are staged (presence, then values) so that a fail_msg only
# names values an earlier stage admitted. The report is a mapping keyed by declared names (report_frame, report_fields),
# admitted BEFORE any effect (r4e, codex-tick421 R4D-REPORT-FRAME-PRE-EFFECT).
# NAMES: derived names are in controller_prerequisite.name_family (registry reserved_cpq_vars) or B's tr_ family
# (reserved_transfer_vars: tr_dir, tr, tr_bs, tr_peer set here; tr_contract, tr_conn, tr_ssh_argv, tr_endpoint by B);
# the shared admission's include parameters / outputs rh_rcpt_* are exact registry reserved_outputs.
#
# B family guard, second task of the first entry (B r5f-interface consumer_preconditions; target_prereq.yml :63
# form; s4 rendered form for testing/remote_harness). It runs BEFORE the resolve, so its path cannot come from the
# resolved declaration: it is checked against controller_prerequisite.reuse after the resolve.

- name: Resolve the harness policy, verify the controller receipt and bind the executor (route author)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_harness.yml"

- name: "PREREQ -- refuse pre-supplied prerequisite names (the declared name family; before any is derived)"
  ansible.builtin.assert:
    that:
      - (vars | list) | select('match', rh.controller.bootstrap.controller_prerequisite.name_family) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': rh.controller.bootstrap.controller_prerequisite.refusal,
                               'rh_rf_detail': [rh.controller.bootstrap.controller_prerequisite.diagnostics.names,
                                                (vars | list) | select('match', rh.controller.bootstrap.controller_prerequisite.name_family) | list | to_json]}) }}
    quiet: true

- name: "PREREQ -- bind the refusal entry (derived from the declaration)"
  ansible.builtin.set_fact:
    rh_cpq_rf_tpl: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"

# supported revision (codex-tick409 :82): the revision this entry implements is recorded in the route consumer
# interface beside this entry's own pinned bytes (consumer_interface.files gains controller_prereq.yml and
# tasks/admit_binding_receipt.yml; consumer_interface.implements {controller_prerequisite, binding_admission} --
# resolve_policy.yml re-hashes every files member and refuses RH-ROUTE-INTERFACE on drift, so a byte change of this
# entry cannot keep a stale implemented revision without a C1 re-pin). NOT a literal here and never the node
# compared with itself.
- name: "PREREQ -- admit the declaration, its connection profile, endpoint kind and launch kind (presence; no defaults)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - _rh_cpq_n.revision == rh.controller.bootstrap.consumer_interface.implements.controller_prerequisite
      - _rh_cpq_n.connection_profile in rh.controller.bootstrap.inventory.connection_profiles
      - _rh_cpq_n.host_group in rh.controller.bootstrap.inventory.role_groups
      - _rh_cpq_n.controller_operation in rh.controller.bootstrap.inventory.controller_operations
      - _rh_cpq_n.host_group in rh.controller.bootstrap.inventory.controller_operations[_rh_cpq_n.controller_operation].placement_keys
      - _rh_cpq_n.inventory_kind in rh.controller.bootstrap.genesis.launch.inventory_kinds
      - _rh_cpq_n.measurement in rh.controller.bootstrap
      - _rh_cpq_n.ssh_auth_mode in rh.controller.bootstrap.ssh_auth.modes
      - _rh_cpq_n.record_var in vars
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.inputs, _rh_cpq_n | to_json,
                                                rh.controller.bootstrap.consumer_interface.implements | to_json,
                                                _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- admit the profile, the reviewed digest and the record path (values)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_p: "{{ rh.controller.bootstrap.inventory.connection_profiles[rh.controller.bootstrap.controller_prerequisite.connection_profile] }}"
    _rh_cpq_rp: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.controller_prerequisite.record_var) }}"
  ansible.builtin.assert:
    that:
      - _rh_cpq_n.runner == _rh_cpq_p.runner
      - not _rh_cpq_p.become
      - _rh_cpq_n.reviewed_record.sha256 is string
      - _rh_cpq_n.reviewed_record.sha256 is match(rh.controller.bootstrap.controller_prerequisite.reviewed_record.regex)
      - _rh_cpq_rp is string
      - _rh_cpq_rp is match(rh.controller.bootstrap.path_admission.regex)
      - _rh_cpq_rp is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.inputs, _rh_cpq_n.connection_profile, _rh_cpq_p | to_json,
                                                _rh_cpq_n.reviewed_record | to_json, _rh_cpq_n.record_var, _rh_cpq_rp | to_json,
                                                _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

# REPORT FRAME BEFORE EFFECTS (codex-tick421 R4D-REPORT-FRAME-PRE-EFFECT): the cpq-report play reads report_frame
# {text, stop}, the node's report word / then / diagnostics.stop and every report_fields role it keys the report by.
# All are admitted HERE, before the shared admission, any contact and the package install; the declaration
# dependency is C1's contract (r4e-c1-hunks E-N-G5: the frame is checked whenever this consuming node is declared).
- name: "PREREQ -- the report frame and every report field role the report uses are declared (before any effect)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - rh.controller.bootstrap.report_frame is defined
      - rh.controller.bootstrap.report_frame is mapping
      - rh.controller.bootstrap.report_frame.text is defined and rh.controller.bootstrap.report_frame.text is string
      - rh.controller.bootstrap.report_frame.stop is defined and rh.controller.bootstrap.report_frame.stop is string
      - _rh_cpq_n.report is defined and _rh_cpq_n.then is defined
      - _rh_cpq_n.report_fields is defined and _rh_cpq_n.report_fields is mapping
      - _rh_cpq_n.report_fields.packages is defined and _rh_cpq_n.report_fields.reviewed_record is defined
      - _rh_cpq_n.report_fields.host is defined and _rh_cpq_n.report_fields.contract is defined
      - _rh_cpq_n.report_fields.contract_keys is defined and _rh_cpq_n.report_fields.binding_receipt is defined
      - _rh_cpq_n.report_fields.path is defined and _rh_cpq_n.report_fields.sha256 is defined
      - _rh_cpq_n.report_fields.then is defined
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.report, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- admit the launch's files, B's binding receipt, the effective inputs and the placed members (the ONE shared admission; before scope and contact)"
  ansible.builtin.include_tasks: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.binding_admission.tasks_rel }}"
  vars:
    rh_rcpt_kind: "{{ rh.controller.bootstrap.controller_prerequisite.inventory_kind }}"
    rh_rcpt_operation: "{{ rh.controller.bootstrap.controller_prerequisite.controller_operation }}"
    rh_rcpt_refusal: "{{ rh.controller.bootstrap.controller_prerequisite.refusal }}"

- name: "PREREQ -- refuse unless the scope is the controller plus exactly ONE alias in role_groups[host_group] (no target)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_iv: "{{ rh.controller.bootstrap.inventory }}"
    _rh_cpq_g: "{{ groups | dict2items | selectattr('key', 'equalto', rh.controller.bootstrap.inventory.role_groups[rh.controller.bootstrap.controller_prerequisite.host_group]) | map(attribute='value') | flatten | list }}"
  ansible.builtin.assert:
    that:
      - lme_resolved.remote_harness.scopes.targets is mapping
      - lme_resolved.remote_harness.scopes.targets | length == 0
      - groups | dict2items | selectattr('key', 'equalto', _rh_cpq_iv.target_group) | map(attribute='value') | flatten | list | length == 0
      - _rh_cpq_g | length == 1
      - >-
        groups | dict2items | selectattr('key', 'in', _rh_cpq_iv.role_groups.values() | list)
        | rejectattr('key', 'equalto', _rh_cpq_iv.role_groups[_rh_cpq_n.host_group]) | map(attribute='value') | flatten
        | list | length == 0
      - groups['all'] | reject('equalto', _rh_cpq_iv.controller_delegation.host) | reject('in', _rh_cpq_g) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.scope,
                                                groups | dict2items | selectattr('key', 'in', [_rh_cpq_iv.target_group] + (_rh_cpq_iv.role_groups.values() | list)) | items2dict | to_json,
                                                groups['all'] | to_json, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- bind the privileged alias and B's contract inputs (tr_dir / tr derived from controller_prerequisite.reuse)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
  ansible.builtin.set_fact:
    rh_cpq_host: "{{ groups[rh.controller.bootstrap.inventory.role_groups[rh.controller.bootstrap.controller_prerequisite.host_group]] | first }}"
    tr_dir: "{{ rh_repo_root ~ _rh_cpq_sep ~ _rh_cpq_n.reuse.transfer_dir_rel }}"
    tr: "{{ (lookup('ansible.builtin.file', rh_repo_root ~ _rh_cpq_sep ~ _rh_cpq_n.reuse.transfer_dir_rel ~ _rh_cpq_sep ~ _rh_cpq_n.reuse.transfer_decl) | from_yaml).transfer }}"
    tr_bs: "{{ rh.controller.bootstrap }}"

- name: "PREREQ -- admit the reuse paths and B's bindings (an extra var outranks set_fact: compared with the derivation)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
  ansible.builtin.assert:
    that:
      - tr_dir == rh_repo_root ~ _rh_cpq_sep ~ _rh_cpq_n.reuse.transfer_dir_rel
      - tr == (lookup('ansible.builtin.file', tr_dir ~ _rh_cpq_sep ~ _rh_cpq_n.reuse.transfer_decl) | from_yaml).transfer
      - tr_bs == rh.controller.bootstrap
      - rh_cpq_host == groups[rh.controller.bootstrap.inventory.role_groups[_rh_cpq_n.host_group]] | first
      # the pre-resolve family-guard include path (second task) is exactly the declared one
      - (playbook_dir | dirname | dirname) == rh_repo_root
      - _rh_cpq_n.reuse.family_rel == tr.entry_guard.family_rel
      - _rh_cpq_n.endpoint_kind in tr.contract.endpoint_kinds
      - not tr.contract.endpoint_kinds[_rh_cpq_n.endpoint_kind].target_scope
      - tr.contract.connection_profile == _rh_cpq_n.connection_profile
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.contract, tr_dir, _rh_cpq_n.reuse | to_json,
                                                _rh_cpq_n.endpoint_kind, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- name the contract peer (the ONE controller-operation endpoint of role_groups[host_group])"
  ansible.builtin.set_fact:
    tr_peer:
      alias: "{{ rh_cpq_host }}"
      kind: "{{ rh.controller.bootstrap.controller_prerequisite.endpoint_kind }}"
      role_group: "{{ rh.controller.bootstrap.controller_prerequisite.host_group }}"

- name: Resolve the ONE privileged connection contract (B)
  ansible.builtin.include_tasks: "{{ tr_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.controller_prerequisite.reuse.resolver_rel }}"

- name: Bind the contract endpoint to the loader-bound controller endpoint (B)
  ansible.builtin.include_tasks: "{{ tr_dir ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.controller_prerequisite.reuse.endpoint_rel }}"

- name: "PREREQ -- admit the resolved contract: this alias, the declared auth mode, a bound-input key, the declared play-var set"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - tr_contract.alias == rh_cpq_host
      - tr_contract.auth_mode == _rh_cpq_n.ssh_auth_mode
      - tr_contract.key_source == tr.contract.endpoint_kinds[_rh_cpq_n.endpoint_kind].key_source
      - >-
        (tr_conn | list | sort) == ((tr.contract.conn_vars + tr.contract.credential_selectors.bind_key
                                     + tr.contract.credential_selectors['clear']) | sort)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.contract, tr_contract.alias, tr_contract.auth_mode,
                                                tr_contract.key_source, tr_conn | list | sort | to_json,
                                                _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- observe the reviewed record (no link followed)"
  ansible.builtin.stat:
    path: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.controller_prerequisite.record_var) }}"
    follow: false
    get_checksum: true
    checksum_algorithm: "{{ rh.controller.bootstrap[rh.controller.bootstrap.controller_prerequisite.measurement].digest }}"
    get_attributes: false
    get_mime: false
  register: _rh_cpq_st

- name: "PREREQ -- refuse a record path that is absent, a link, not regular or unreadable (before it is read)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - _rh_cpq_st.stat.exists
      - not _rh_cpq_st.stat.islnk
      - _rh_cpq_st.stat.isreg
      - _rh_cpq_st.stat.checksum is defined
      - _rh_cpq_st.stat.checksum == _rh_cpq_n.reviewed_record.sha256
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.record, lookup('ansible.builtin.vars', _rh_cpq_n.record_var),
                                                _rh_cpq_n.reviewed_record.sha256, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- read the reviewed record ONCE (hashed and parsed from these same bytes)"
  ansible.builtin.slurp:
    src: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.controller_prerequisite.record_var) }}"
  register: _rh_cpq_raw

- name: "PREREQ -- refuse unless the read bytes are the reviewed digest and parse to a mapping (stage 1)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_m: "{{ rh.controller.bootstrap[rh.controller.bootstrap.controller_prerequisite.measurement] }}"
  ansible.builtin.assert:
    that:
      - (_rh_cpq_raw.content | b64decode | hash(_rh_cpq_m.digest)) == _rh_cpq_n.reviewed_record.sha256
      - (_rh_cpq_raw.content | b64decode | from_json) is mapping
      - (_rh_cpq_m.record_fields | dict2items | selectattr('key', 'in', _rh_cpq_n.record_checks) | map(attribute='value') | list) | reject('in', _rh_cpq_raw.content | b64decode | from_json) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.record, _rh_cpq_n.reviewed_record.sha256,
                                                _rh_cpq_n.record_checks | to_json, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- bind the record (declared reviewed digest; derived output)"
  ansible.builtin.set_fact:
    rh_cpq_record: "{{ _rh_cpq_raw.content | b64decode | from_json }}"

- name: "PREREQ -- refuse a record that is not the REVIEWED candidate of this declaration and deployment (stage 2)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_m: "{{ rh.controller.bootstrap[rh.controller.bootstrap.controller_prerequisite.measurement] }}"
    _rh_cpq_f: "{{ rh.controller.bootstrap[rh.controller.bootstrap.controller_prerequisite.measurement].record_fields }}"
  ansible.builtin.assert:
    that:
      - rh_cpq_record[_rh_cpq_f.schema] == _rh_cpq_m.record_schema
      - rh_cpq_record[_rh_cpq_f.operation] == _rh_cpq_m.operation
      - rh_cpq_record[_rh_cpq_f.candidate] == _rh_cpq_m.record_values.candidate
      - rh_cpq_record[_rh_cpq_f.self_authorizing] == _rh_cpq_m.record_values.self_authorizing
      - rh_cpq_record[_rh_cpq_f.deployment_identity] == (lme_resolved | lme_validated_deployment_identity)
      - rh_cpq_record[_rh_cpq_f[_rh_cpq_n.selects]] is sequence
      - rh_cpq_record[_rh_cpq_f[_rh_cpq_n.selects]] is not string
      - rh_cpq_record[_rh_cpq_f[_rh_cpq_n.selects]] is not mapping
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.record,
                                                rh_cpq_record | dict2items | selectattr('key', 'in', _rh_cpq_f | dict2items | selectattr('key', 'in', _rh_cpq_n.record_checks) | map(attribute='value') | list) | items2dict | to_json,
                                                _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- the package set: the record's missing packages, each a DECLARED association of a measured resource"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_m: "{{ rh.controller.bootstrap[rh.controller.bootstrap.controller_prerequisite.measurement] }}"
  ansible.builtin.set_fact:
    rh_cpq_packages: "{{ rh_cpq_record[_rh_cpq_m.record_fields[_rh_cpq_n.selects]] | sort | list }}"
    rh_cpq_declared: >-
      {{ _rh_cpq_m.resources | dict2items | map(attribute='value') | map('dict2items') | flatten
         | map(attribute='value.package') | map('extract', rh.packages.by_os_family[_rh_cpq_m.family]) | unique | sort | list }}

- name: "PREREQ -- refuse a package outside the declared association set (never a free package name)"
  vars:
    _rh_cpq_n: "{{ rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - rh_cpq_packages | reject('in', rh_cpq_declared) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.packages, rh_cpq_packages | reject('in', rh_cpq_declared) | list | to_json,
                                                rh_cpq_declared | to_json, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- this controller's machine identity (native facts; SUPPORTING evidence only, host_identity.role)"
  ansible.builtin.setup:
    gather_subset: "{{ rh.controller.bootstrap.controller_prerequisite.host_identity.gather_subset }}"

- name: "PREREQ -- bind the controller identity (derived output; supporting evidence)"
  ansible.builtin.set_fact:
    rh_cpq_identity: "{{ ansible_facts[rh.controller.bootstrap.controller_prerequisite.host_identity.fact] }}"
