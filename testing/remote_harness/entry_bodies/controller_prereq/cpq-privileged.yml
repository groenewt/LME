# play metadata (hosts = the declared remote placement controller_operation, entry_forms.placement.remote), the play
# vars (constructed by target_vars) and the first-entry head of this host (route guard `include`, B family guard
# `family`) are constructed from transfer.decl.yml entry_sets; this file holds every task AFTER the head,
# byte-identical to route-r4 r4e-controller_prereq.after.yml (0450d946; unchanged in r4f) :416-500 de-indented by 4.
# A task list, STATICALLY imported by the generated entry.
# RELOCATED (r4f): the play-vars comment r4e :387-389 and the head comment r4e :408-409, verbatim (de-indented):
#
# EXACTLY transfer.contract.conn_vars + credential_selectors.bind_key + credential_selectors.clear, each from the ONE
# contract (B r5f privileged_contract.outputs.tr_conn; the target_prereq.yml :285-301 form); proven by the contract
# proof task below.
# first entry of this host: refuse_pinned_outputs (which reserves rh_ic_paths, C1-R2D-5) is NOT re-included after
# initial_contact on this host (R2 precondition); the later include parameter rh_ic_paths stays legal.

# NAME GUARD, ALIAS-FREE (codex-tick409 R4C-SELF-REJECTING-NAME-GUARD): NO task vars -- every declaration is read
# from hostvars['localhost'] in place, so the only rh_cpq_* / _rh_cpq_* names in `vars` are ones supplied from
# outside (extra-vars / inventory). The family is not weakened and no alias is exempted.
- name: "PREREQ -- refuse pre-supplied prerequisite names on the privileged host (alias-free; before any alias is bound)"
  ansible.builtin.assert:
    that:
      - (vars | list) | select('match', hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.name_family) | list | length == 0
    fail_msg: >-
      {{ lookup('ansible.builtin.template', hostvars['localhost'].rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': hostvars['localhost'].rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.refusal,
                               'rh_rf_detail': [hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.diagnostics.names,
                                                (vars | list) | select('match', hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.name_family) | list | to_json]}) }}
    quiet: true

# CONTRACT PROOF: the first task that binds the alias _rh_cpq_lh (the name guard above has already refused a supplied
# one). It compares contract values only; it runs before resolve_policy and before initial contact.
- name: "PREREQ -- prove the play vars ARE the contract (rendered, in tr_conn key order)"
  vars:
    _rh_cpq_lh: "{{ hostvars['localhost'] }}"
  ansible.builtin.assert:
    that:
      # the RENDERED play vars (vars lookup templates them), in tr_conn key order, equal the contract values
      - query('ansible.builtin.vars', *(_rh_cpq_lh.tr_conn | list)) == (_rh_cpq_lh.tr_conn | list | map('extract', _rh_cpq_lh.tr_conn) | list)
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_cpq_lh.rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': _rh_cpq_lh.rh.controller.bootstrap.refusal_grammar,
                               'rh_rf_code': _rh_cpq_lh.rh.controller.bootstrap.controller_prerequisite.refusal,
                               'rh_rf_detail': [_rh_cpq_lh.rh.controller.bootstrap.controller_prerequisite.diagnostics.contract,
                                                _rh_cpq_lh.tr_conn | list | to_json,
                                                _rh_cpq_lh.rh.controller.bootstrap.controller_prerequisite.diagnostics.stop]}) }}
    quiet: true

- name: Resolve this host's harness policy (controller-side; no contact)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

- name: PRIVILEGED INITIAL CONTACT (route author; raw only) before any module -- the declared variant and paths
  ansible.builtin.include_tasks: "{{ rh_repo_root ~ hostvars['localhost'].rh.controller.bootstrap.path_admission.separator ~ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.reuse.contact_rel }}"
  vars:
    rh_ic_variant: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.contact.variant }}"
    rh_ic_paths: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.contact.paths }}"

- name: "PREREQ -- observe the privileged host's identity and os family (native facts)"
  ansible.builtin.setup:
    gather_subset: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.host_identity.gather_subset }}"

- name: "PREREQ -- refuse unless the identity and family facts were observed (stage 1)"
  vars:
    _rh_cpq_lh: "{{ hostvars['localhost'] }}"
    _rh_cpq_n: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite }}"
  ansible.builtin.assert:
    that:
      - _rh_cpq_n.host_identity.fact in ansible_facts
      - _rh_cpq_n.host_identity.family_fact in ansible_facts
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_cpq_lh.rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': _rh_cpq_lh.rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.identity, inventory_hostname,
                                                _rh_cpq_n.host_identity | to_json, _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- refuse a family outside controller_families or not the measured association family; machine id (supporting)"
  vars:
    _rh_cpq_lh: "{{ hostvars['localhost'] }}"
    _rh_cpq_n: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite }}"
    _rh_cpq_m: "{{ hostvars['localhost'].rh.controller.bootstrap[hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.measurement] }}"
  ansible.builtin.assert:
    that:
      - ansible_facts[_rh_cpq_n.host_identity.family_fact] in _rh_cpq_m.controller_families
      - ansible_facts[_rh_cpq_n.host_identity.family_fact] == _rh_cpq_m.family
      - ansible_facts[_rh_cpq_n.host_identity.fact] == _rh_cpq_lh.rh_cpq_identity
    fail_msg: >-
      {{ lookup('ansible.builtin.template', _rh_cpq_lh.rh_cpq_rf_tpl,
                template_vars={'rh_rf_grammar': _rh_cpq_lh.rh.controller.bootstrap.refusal_grammar, 'rh_rf_code': _rh_cpq_n.refusal,
                               'rh_rf_detail': [_rh_cpq_n.diagnostics.identity, inventory_hostname,
                                                ansible_facts[_rh_cpq_n.host_identity.family_fact],
                                                _rh_cpq_m.controller_families | to_json, _rh_cpq_m.family,
                                                _rh_cpq_n.diagnostics.stop]}) }}
    quiet: true

- name: "PREREQ -- install EXACTLY the reviewed record's missing declared packages (distro-neutral module, state present)"
  ansible.builtin.package:
    name: "{{ hostvars['localhost'].rh_cpq_packages }}"
    state: "{{ hostvars['localhost'].rh.controller.bootstrap.controller_prerequisite.state }}"
  when: hostvars['localhost'].rh_cpq_packages | length > 0
