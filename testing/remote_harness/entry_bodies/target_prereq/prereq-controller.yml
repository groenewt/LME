#
# testing/remote_harness/target_prereq.yml -- ENTRY: the MAIN-only privileged PREREQUISITE leg of one target
# (codex-tick302 (B)/(D); codex-graph-guest-security-prerequisite-decisions; codex-tick318-321 item 3; codex tick320
# findings 1-4). Started only through the seed launcher, by MAIN, after controller package + apply and BEFORE
# target_bootstrap.yml (codex ACCEPTED order):
#   <bundle>/lme-seed-launch.sh run <controller root> explicit_key -i <run inventory dir> \
#     testing/remote_harness/target_prereq.yml -e lme_transfer_target=<alias> -e lme_transfer_ssh_key= \
#     -e lme_transfer_state_dir=<abs> -e lme_transfer_label=<label>
# POLICY: ONLY the resolved rh.controller.bootstrap.target_prereq (C1 registers the decl there; this consumer needs
# REVISION 4 = testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml over the frozen revision-3
# target_prereq.decl.yml). Anything else REFUSES RH-TARGET-PREREQ before any contact (no raw-lookup policy beside rh).
# PRESERVATION (codex-tick360): every target member declares a preservation BASIS through its bound target inputs
# (known_set: exact member units with an expected state each; verified_none: explicitly no prior deployment, checked by
# the discovery selectors). Absent basis refuses before contact; the preflight evaluates EVERY declared member against
# its expected state and never filters the scope by observed state (testing/e2e/target_prereq/tasks/prereq_preflight.yml).
# The read-only OBSERVATION that seeds that declaration is testing/e2e/target_prereq/prereq_observe.yml (same preflight
# tasks, no owner key).
# Target input VALUES come only from the loader binding (binding.deployment.target_inputs.<host>.<role>); every role is
# declared optional, so this leg refuses an absent role it needs (owner and toolchain_root included) and never defaults
# one. Guest values (storage root, base image, memory budget, kvm device) come from THIS host's resolved rh.guest.
# CONNECTION: B's ONE privileged contract (testing/e2e/transfer tasks/bind_controller.yml -> tr_conn; user root, the
# privileged key reference); then the route's privileged INITIAL CONTACT before any module, in EVERY target play.
# Plays:
#   prereq-controller        (localhost) route guard + first-entry guard, the ONE contract, the leg's controller values
#   prereq-preflight         (target)    READ-ONLY (testing/e2e/target_prereq/tasks/prereq_preflight.yml): contact, SSH
#                                        ancestry + listener (record), root-only path metadata (incl. /data), account,
#                                        os family + package mapping, the declared preservation selection (every member
#                                        vs its expected state + discovery matches), memory, linger tool identity;
#                                        failures are rescued into the record. READ-ONLY = no deployment-state
#                                        mutation intended; ordinary admitted Ansible module staging (root module temp)
#                                        occurs. Discovery (service_facts) covers SYSTEM .service units only (no timer /
#                                        socket / path / user units); every declared expectation and absence is decided
#                                        by the exact-unit probe (decl r4 preservation.probe; codex-tick375-377) and a
#                                        probe_unknown result (tool not admitted, rc != 0, missing field, value outside
#                                        its enum) REFUSES here before any effect; UnitFileState `generated` is admitted
#                                        despite possible autostart until ownership/lifecycle evidence is joined
#   prereq-preflight-record  (localhost) ALWAYS writes <state dir>/gate.<label>.prereq-preflight.json (0600), THEN
#                                        refuses when the preflight refused
#   prereq-target            (target)    classify, READ BACK every done op, then the effects (each only when absent)
#   prereq-record            (localhost) <state dir>/gate.<label>.prereq.json
# Effects on the target (each only when ABSENT, after observation; matching state is observation-only; foreign or
# drifted state is preserved and REFUSED): packages (rh.packages logical names), the work parent (root-owned
# intermediate), the root journal, the owner account (+kvm on hypervisor members), .ssh + authorized_keys (only while
# authorized_key is pending), linger (the admitted os_tools loginctl), the work root and its children (created while
# the work root is root-owned 0700, handed to the owner LAST), the guest storage root.
# Never: usermod/chown/chmod of state no run of this leg created, a unit start/stop/enable/disable/mask, a base image
# fetch or rewrite, a read of any private key, an operator-key write, a rotation (J-KEY is its own leg).
#
# FIRST-ENTRY GUARD (codex-tick318-321 item 2; codex-tick333 (2) families): every name this entry derives is
# refused when it is already defined (an extra var or an inventory var would outrank the set_fact that derives it).
# The FAMILIES (tr_ / _tr_ / tp_ / _tp_ / ... every registered reserved_output_patterns entry) are refused by B's
# family guard, magic-rooted (playbook_dir, never an input); the BARE names no family covers are refused inline
# right after it. Both run before any value of these names reaches an include path, a lookup or privilege selection.
- name: Derive the transfer declaration and its directory (derived here; never a play var or an input)
  ansible.builtin.set_fact:
    tr_dir: "{{ rh_repo_root ~ '/testing/e2e/transfer' }}"
    tr: "{{ (lookup('ansible.builtin.file', rh_repo_root ~ '/testing/e2e/transfer/transfer.decl.yml') | from_yaml).transfer }}"

- name: Controller prelude (policy, executor, the ONE privileged contract, state dir)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/e2e/transfer/tasks/bind_controller.yml"

- name: Refuse an unregistered leg, a moved transfer dir, a foreign contract, or an unregistered tool / group / runtime
  vars:
    _tpr: "{{ rh.controller.bootstrap.target_prereq | default({}) }}"
    _tools: "{{ rh.controller.bootstrap.os_tools }}"
  ansible.builtin.assert:
    that:
      - _tpr is mapping and _tpr.revision | default(0) == 4
      - _tpr.runner | default('') == 'MAIN_only'
      - tr_dir == rh_repo_root ~ '/' ~ _tpr.reuse.transfer_dir_rel
      - tr.contract.connection_profile == _tpr.connection_profile
      - _tpr.linger.tool in _tools and _tools[_tpr.linger.tool].path is match(rh.controller.bootstrap.path_admission.regex)
      - (_tools[_tpr.linger.tool].identity.sha256 | default('')) is match('^[0-9a-f]{64}$')
      - "'target_prereq' in (_tools[_tpr.linger.tool].required_by | default([]))"
      - (rh.controller.bootstrap.inventory.role_groups.hypervisors | default('')) is match('^[A-Za-z_][A-Za-z0-9_]*$')
      - (rh.controller.bootstrap.target_bootstrap.user_manager.runtime_dir | default('')) is match('^/.*[{]uid[}]')
      - (rh.controller.bootstrap.target_bootstrap.user_manager.bus | default('')) is match('^[^/]+$')
    fail_msg: >-
      REFUSED RH-TARGET-PREREQ: rh.controller.bootstrap.target_prereq is not registered at revision 4 (runner
      MAIN_only; C1 registers testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml over the frozen
      revision-3 testing/remote_harness/target_prereq.decl.yml), or its transfer dir / contract profile
      differs from B's, or os_tools.{{ _tpr.linger.tool | default('?') }} (path + identity sha256, required_by
      target_prereq), inventory.role_groups.hypervisors or target_bootstrap.user_manager.{runtime_dir, bus} is not
      registered (C1 joins). Nothing was contacted.
    quiet: true

- name: Bind the leg policy (resolved rh only)
  ansible.builtin.set_fact:
    tp: "{{ rh.controller.bootstrap.target_prereq }}"

- name: Refuse a roster other than the registry's (target group membership; the toolchain sub-root)
  ansible.builtin.assert:
    that:
      - tp == rh.controller.bootstrap.target_prereq
      - tp.layout.toolchain_rel == rh.controller.bootstrap.work_roots.sub_roots.toolchain
      - lme_transfer_target in (groups[rh.controller.bootstrap.inventory.target_group] | default([]))
    fail_msg: >-
      REFUSED {{ tp.refusal }}: tp is not the resolved policy, its toolchain_rel is not the work_roots toolchain
      sub-root, or {{ lme_transfer_target }} is not a member of {{ rh.controller.bootstrap.inventory.target_group }}.
    quiet: true

- name: Bind this target's typed target inputs (ONLY the loader binding; the host vars are never read raw)
  ansible.builtin.set_fact:
    tp_ti: "{{ ((lme_resolved.remote_harness.binding.deployment.target_inputs | default({}))[lme_transfer_target] | default({})) }}"

- name: Refuse an absent target input this leg needs (every role is optional in the registry; no default here)
  ansible.builtin.assert:
    that:
      - >-
        ['owner', 'toolchain_root', 'bundle_dir', 'owner_key', 'privileged_key', 'owner_pubkey', 'prereq_owner_shell',
         'prereq_owner_home', 'prereq_work_root', 'prereq_bundle_root', 'prereq_work_parent_path',
         'prereq_work_parent_owner', 'prereq_work_parent_group', 'prereq_work_parent_mode']
        | reject('in', tp_ti) | list | length == 0
    fail_msg: >-
      REFUSED {{ tp.refusal }}: {{ lme_transfer_target }} has no bound target input(s)
      {{ ['owner', 'toolchain_root', 'bundle_dir', 'owner_key', 'privileged_key', 'owner_pubkey', 'prereq_owner_shell',
          'prereq_owner_home', 'prereq_work_root', 'prereq_bundle_root', 'prereq_work_parent_path',
          'prereq_work_parent_owner', 'prereq_work_parent_group', 'prereq_work_parent_mode'] | reject('in', tp_ti) | list }}
      (binding.deployment.target_inputs; C1 declares the prereq_work_parent_* roles). Nothing was contacted.
    quiet: true

- name: Refuse malformed target inputs, a layout other than the declared one, or shared keys (pre-contact)
  vars:
    _rx: "{{ rh.controller.bootstrap.path_admission.regex }}"
    _w: "{{ tp_ti.prereq_work_root }}"
    _refp: "{{ rh.controller.bootstrap.work_roots.admission.refused_prefixes }}"
  ansible.builtin.assert:
    that:
      - tp_ti.owner is string and tp_ti.owner is match('^[a-z_][a-z0-9_-]{0,31}$')
      - tp_ti.prereq_owner_shell is match(_rx) and tp_ti.prereq_owner_home is match(_rx)
      - _w is match(_rx) and _w is match('^/.+/[^/]+$')
      - (_w ~ '/') is not match('(' ~ (_refp | map('regex_escape') | join('|')) ~ ')')
      - tp_ti.toolchain_root == _w ~ '/' ~ tp.layout.toolchain_rel
      - tp_ti.prereq_bundle_root == _w ~ '/' ~ tp.layout.bundles_rel
      - (tp_ti.bundle_dir | dirname) == tp_ti.prereq_bundle_root
      - (tp_ti.bundle_dir | basename) is match(tp.layout.bundle_leaf_regex)
      - tp_ti.prereq_work_parent_path == (_w | dirname)
      - tp_ti.prereq_work_parent_owner == tp.layout.work_parent_rule.owner
      - tp_ti.prereq_work_parent_mode is string and tp_ti.prereq_work_parent_mode is match(tp.layout.work_parent_rule.mode_regex)
      - tp_ti.prereq_work_parent_group is match('^[a-z_][a-z0-9_-]{0,31}$')
      - tp_ti.owner_key is match(_rx) and tp_ti.privileged_key is match(_rx) and tp_ti.owner_key != tp_ti.privileged_key
      # the public-half naming is the J-KEY producer contract's (owner_key.storage.pub_suffix; C3 naming join), never
      # a literal here; an unregistered suffix fails the comparison (fail closed)
      - (rh.controller.bootstrap.owner_key.storage.pub_suffix | default('')) | length > 0
      - tp_ti.owner_pubkey == tp_ti.owner_key ~ rh.controller.bootstrap.owner_key.storage.pub_suffix
    fail_msg: >-
      REFUSED {{ tp.refusal }}: {{ lme_transfer_target }}'s bound target inputs {{ tp_ti | list }} must give an
      account-name owner, toolchain root == <work root>/{{ tp.layout.toolchain_rel }}, bundle root == <work
      root>/{{ tp.layout.bundles_rel }}, bundle dir == <bundle root>/<64-hex leaf>, a work parent {path: dirname(work
      root), owner: root, group, mode matching {{ tp.layout.work_parent_rule.mode_regex }}}, a work root outside
      {{ _refp }}, distinct owner/privileged key PATHS and the owner public key at <owner key><owner_key.storage.pub_suffix
      = {{ rh.controller.bootstrap.owner_key.storage.pub_suffix | default('<unregistered>') }}>. Nothing was contacted.
    quiet: true

# UNVALIDATED CANDIDATE (the J-KEY C2 rule, applied to this consumer): the owner .pub file is not public material
# until admitted. Its read and the pattern match run under no_log; the refusal names the PATH only; only the
# admitted line is bound.
- name: Read the owner PUBLIC key candidate (the only key file this leg reads; no_log until admitted)
  ansible.builtin.set_fact:
    _tp_cand: "{{ lookup('ansible.builtin.file', tp_ti.owner_pubkey) | trim }}"
  no_log: true

- name: Match the candidate against the declared public-key form (no_log; only a boolean leaves this task)
  ansible.builtin.set_fact:
    _tp_admit: >-
      {{ (_tp_cand is match(tp.authorized_keys.pubkey_regex)) and ('\n' not in _tp_cand)
         and ('PRIVATE KEY' not in _tp_cand) }}
  no_log: true

- name: Refuse anything but one public-key line (path only; the content is withheld)
  ansible.builtin.assert:
    that:
      - _tp_admit | bool
    fail_msg: >-
      REFUSED {{ tp.refusal }}: {{ tp_ti.owner_pubkey }} is not one public-key line; its content was never admitted
      and is not shown. Nothing was contacted.
    quiet: true

- name: Admit the owner public line (from here on it is public material) and drop the candidate
  ansible.builtin.set_fact:
    _tp_pub: "{{ _tp_cand }}"
    _tp_cand: ''
  no_log: true

# PRESERVATION SELECTION (codex-tick360 items 1-3; decl r4 `preservation`): DESIRED configuration of the lab
# inventory, bound by the loader as target inputs; one member role per expected state (expected_states.<state>.role),
# the verified_none bool role, the discovery selector role (obs_unit_patterns). Derived here, never an input.
- name: Bind the declared preservation selection (loader binding only; no default)
  vars:
    _pvd: "{{ tp.preservation }}"
  ansible.builtin.set_fact:
    tp_pv: >-
      {%- set m = namespace(d={}, dup=[]) -%}
      {%- for st in _pvd.expected_states | list | sort if _pvd.expected_states[st].role in tp_ti -%}
      {%- for u in tp_ti[_pvd.expected_states[st].role] -%}
      {%- if u in m.d -%}{%- set m.dup = m.dup + [u] -%}{%- endif -%}
      {%- set m.d = m.d | combine({u: st}) -%}
      {%- endfor -%}{%- endfor -%}
      {%- set vr = _pvd.bases.verified_none.role -%}
      {%- set vn = tp_ti[vr] if vr in tp_ti else none -%}
      {{ {'basis': ('conflicting' if (m.dup | length > 0 or (vn is not none and (vn is not sameas true or m.d | length > 0)))
                    else ('verified_none' if vn is sameas true else ('known_set' if m.d | length > 0 else 'undeclared'))),
          'members': m.d, 'duplicates': m.dup,
          'selectors': tp_ti[_pvd.discovery.selector_role] if (_pvd.discovery.selector_role in tp_ti) else []} }}

- name: Publish the controller-decided leg values (derived output)
  vars:
    _um: "{{ rh.controller.bootstrap.target_bootstrap.user_manager }}"
    _lt: "{{ rh.controller.bootstrap.os_tools[tp.linger.tool] }}"
  ansible.builtin.set_fact:
    tp_ctl:
      owner: "{{ tp_ti.owner }}"
      shell: "{{ tp_ti.prereq_owner_shell }}"
      home: "{{ tp_ti.prereq_owner_home }}"
      work_root: "{{ tp_ti.prereq_work_root }}"
      work_parent:
        path: "{{ tp_ti.prereq_work_parent_path }}"
        owner: "{{ tp_ti.prereq_work_parent_owner }}"
        group: "{{ tp_ti.prereq_work_parent_group }}"
        mode: "{{ tp_ti.prereq_work_parent_mode }}"
      children: >-
        {{ [tp.layout.toolchain_rel, tp.layout.bundles_rel, rh.controller.bootstrap.work_roots.sub_roots.tmp,
            rh.controller.bootstrap.work_roots.sub_roots.tmp ~ '/' ~ rh.controller.bootstrap.work_roots.remote_tmp_rel] }}
      pubkey: "{{ _tp_pub }}"
      pubkey_sha256: "{{ _tp_pub | hash('sha256') }}"
      authorized_sha256: "{{ (_tp_pub ~ '\n') | hash('sha256') }}"
      hypervisor: "{{ lme_transfer_target in (groups[rh.controller.bootstrap.inventory.role_groups.hypervisors] | default([])) }}"
      preservation: {basis: "{{ tp_pv.basis }}", members: "{{ tp_pv.members }}", selectors: "{{ tp_pv.selectors }}"}
      linger_tool: {name: "{{ tp.linger.tool }}", path: "{{ _lt.path }}", sha256: "{{ _lt.identity.sha256 }}"}
      runtime_dir_tpl: "{{ _um.runtime_dir }}"
      bus_rel: "{{ _um.bus }}"
      preflight_path: "{{ lme_transfer_state_dir }}/{{ tr.outputs.prefix }}{{ lme_transfer_label }}{{ tp.preflight.record_suffix }}"
      record_path: "{{ lme_transfer_state_dir }}/{{ tr.outputs.prefix }}{{ lme_transfer_label }}{{ tp.observation.record_suffix }}"

# codex-tick360 item 3: a hypervisor does NOT imply a non-empty old stack, and no member may leave its prior state
# unstated. EVERY member declares known_set (exact members, each with an expected state) or verified_none (explicitly
# no prior deployment, verified by at least one discovery selector). Absence never shrinks a known set: an absent
# known member refuses in the preflight (outcome absent), it is never dropped here.
- name: Refuse a member without an explicit preservation basis, a conflicting one, or malformed members / selectors
  vars:
    _pvd: "{{ tp.preservation }}"
  ansible.builtin.assert:
    that:
      - tp_pv.basis in (_pvd.bases | list)
      - tp_pv.members.keys() | list | reject('match', _pvd.unit_regex) | list | length == 0
      - tp_pv.members.values() | list | reject('in', _pvd.expected_states | list) | list | length == 0
      - tp_pv.selectors | reject('match', _pvd.discovery.selector_regex) | list | length == 0
      - tp_pv.basis != 'verified_none' or tp_pv.selectors | length > 0
      - tp_ctl.preservation.basis == tp_pv.basis and tp_ctl.preservation.members == tp_pv.members
    fail_msg: >-
      REFUSED {{ _pvd.refusal }}: {{ lme_transfer_target }} preservation basis is {{ tp_pv.basis }} (members
      {{ tp_pv.members | to_json }}, duplicates {{ tp_pv.duplicates | to_json }}, selectors {{ tp_pv.selectors | to_json }}).
      Declare exactly one of: known_set = the member roles {{ _pvd.expected_states | dict2items | map(attribute='value.role') | list }}
      (exact .service names, each in one role only), or verified_none = {{ _pvd.bases.verified_none.role }}: true with
      the discovery selector role {{ _pvd.discovery.selector_role }} and no member role. Nothing was contacted.
    quiet: true
