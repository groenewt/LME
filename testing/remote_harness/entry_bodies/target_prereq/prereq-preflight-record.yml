# testing/remote_harness/entry_bodies/target_prereq/prereq-preflight-record.yml -- the authored BODY of play
# prereq-preflight-record of the GENERATED entry testing/remote_harness/target_prereq.yml (route / B body; B-r5 r5m
# extraction, codex-tick417 option B). A later controller play: metadata constructed, no head; this file holds its
# tasks, byte-identical to the candidate m1-1 testing/remote_harness/target_prereq.yml (sha256
# b278443b544a52ae6221472b3b6464eddd88e2d9a6063dbce0b33c89f6e2eb30) :355-379 de-indented by 4 (the trailing blank
# lines :380-381 are inter-play spacing, not body).
#
- name: Re-admit the state directory ancestry at the write boundary (owner rule; the controller is non-root)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/admit_ancestry.yml"
  vars:
    rh_anc_bs: "{{ rh.controller.bootstrap }}"
    rh_anc_repo_root: "{{ rh_repo_root }}"
    rh_anc_path: "{{ lme_transfer_state_dir }}"
    rh_anc_refusal: "{{ tp.refusal }}"

- name: Record the preflight for MAIN, ALSO when it refused (<state dir>/gate.<label>.prereq-preflight.json)
  ansible.builtin.copy:
    content: "{{ hostvars[lme_transfer_target].tp_pre | to_nice_json }}\n"
    dest: "{{ tp_ctl.preflight_path }}"
    mode: '0600'
    follow: false

- name: Refuse when the preflight did not admit the contact or collected a refusal (recorded above; no deployment state changed)
  ansible.builtin.assert:
    that:
      - hostvars[lme_transfer_target].tp_pre.contact == 'admitted'
      - hostvars[lme_transfer_target].tp_pre.refusals | length == 0
    fail_msg: >-
      REFUSED {{ tp.refusal }}-PREFLIGHT on {{ lme_transfer_target }}: {{ hostvars[lme_transfer_target].tp_pre.refusals }}
      (record {{ tp_ctl.preflight_path }}). No owner, directory, package or unit was touched (no deployment-state
      mutation; only admitted module staging under the root module temp).
    quiet: true
