# testing/remote_harness/entry_bodies/target_prereq/prereq-preflight.yml -- the authored BODY of play prereq-preflight of
# the GENERATED entry testing/remote_harness/target_prereq.yml (route / B body; B-r5 r5m extraction, codex-tick417 option
# B). The play metadata, its contract connection vars (macro target_vars) and the first-entry head of this target host
# are constructed; this file holds every task AFTER the head, byte-identical to the candidate m1-1
# testing/remote_harness/target_prereq.yml (sha256 b278443b544a52ae6221472b3b6464eddd88e2d9a6063dbce0b33c89f6e2eb30)
# :321-347 de-indented by 4. Relocated below: the inter-play comment :278-280 and the play vars comments :302-304
# (de-indented).
#
# ---- PREFLIGHT (codex-tick318-321 item 3): READ-ONLY on the admitted privileged contact, before any effect. It
# depends on nothing an effect provides. Every refusal is COLLECTED into tp_pre.refusals (never asserted here); a
# contact or observation failure is rescued into it; prereq-preflight-record writes the record and only then refuses.
# no ansible_remote_tmp / ansible_python_interpreter / become: the PRIVILEGED contact sets both as host facts.
# No play var carries leg values (an extra-var outranks a play var); they are the controller's derived output
# tp_ctl, copied below AFTER refuse_pinned_outputs.
- name: Resolve the harness policy on this host (its OWN scope)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/remote_harness/tasks/resolve_policy.yml"

- name: Carry the controller-decided leg values to this host and bind the policy (controller-side; no target module)
  ansible.builtin.set_fact:
    tp_ctl: "{{ hostvars['localhost'].tp_ctl }}"
    tp: "{{ rh.controller.bootstrap.target_prereq }}"

- name: Refuse a split policy, split target inputs, or a hypervisor member without a resolved guest policy
  ansible.builtin.assert:
    that:
      - tp == hostvars['localhost'].tp
      - >-
        ((lme_resolved.remote_harness.binding.deployment.target_inputs | default({}))[inventory_hostname] | default({}))
        == hostvars['localhost'].tp_ti
      - not tp_ctl.hypervisor or (rh.guest is defined and rh.guest.allocation is defined and rh.guest.allocation is mapping)
    fail_msg: >-
      REFUSED {{ tp.refusal }} on {{ inventory_hostname }}: the target scope's target_prereq or bound target inputs
      differ from the controller's, or this hypervisor member has no resolved rh.guest.allocation (RS carrier).
    quiet: true

# The ONE declared read-only preflight (B-owned tasks file, shared with testing/e2e/target_prereq/prereq_observe.yml;
# the former inline lines, unchanged except the preservation evaluation -- decl r4 `preservation`). It starts
# tp_pre, runs the privileged initial contact and every observation inside ONE block whose rescue collects a
# failure into tp_pre.refusals; the record play below writes it and only then refuses.
- name: PREFLIGHT (read-only; the shared declared tasks)
  ansible.builtin.include_tasks: "{{ rh_repo_root }}/testing/e2e/target_prereq/tasks/prereq_preflight.yml"
