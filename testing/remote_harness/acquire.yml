---
# testing/remote_harness/acquire.yml -- declared ACQUISITION route (codex-tick127 genesis: acquisition/admission
# route + missing-dependency handling). MAIN runs it; it is the ONLY network-permitted stage of the bootstrap.
#
#   ansible-playbook -i <operator inventory> testing/remote_harness/acquire.yml
# localhost host vars (inputs, no defaults), both NAMED by the declaration, never by a literal here (brr-follow-s2
# OPEN-C; codex-tick542 OD-GEN-09; codex-tick556 settled_join_precision OPEN_C): the host var named by
# genesis.acquisition.source_var = an EXISTING directory owned by the invoking account (the artifact store); the host var
# named by genesis.acquisition.receipt_var = the receipt file path, OUTSIDE the store, in an existing owned directory.
# Their VALUES are read INLINE in every use by a lookup of the declared name (brr-follow-s2 successor-06
# ACQ-PLAY-VAR-PRECEDENCE, codex-572): no play-level alias exists, so no extra-var or host var can outrank or stand in
# for the declared inputs; every lookup is evaluated only after the admission task below has checked the declared names
# and the vars' presence (the measurement-only branch above it reads no acquisition input).
#
# Runs on the declared builder only (tasks/admit_builder.yml). For every declared artifact row
# (controller.bootstrap.artifacts + the lock's packages and collections):
#   EVERY row must declare `url` (present or not): a row without a declared source refuses before any fetch, so the
#   declared mechanism alone can always carry a COLD acquisition (codex-000010: no manual placement by MAIN);
#   a lock row's url must end in its exact `file` name (the lock records the tick112 URLs verbatim)
#   present with the declared sha256            -> REUSED, not fetched (content-addressed: the digest is the lock's /
#                                                  profile's declared sha256, never the file's own claim)
#   present with another digest                 -> refused (never overwritten)
#   absent                                      -> FETCHED by ansible.builtin.get_url from that exact URL, checksum-
#                                                  pinned (2.19.11: download into the module tmpdir, sha256 checked
#                                                  BEFORE atomic_move into the store, temp removed on mismatch)
# A non-empty store is admitted (warm reapply is idempotent). Q-D04-COLD-START (codex-tick138, option (a)): the
# store's entries are listed BEFORE any fetch; after the fetch every row is re-verified and ONE JSON receipt is written
# OUTSIDE the store (so the store snapshot is untouched) recording store_empty_before, store_entries_before,
# store_foreign_entries and, per row, file / declared url / declared sha256 / observed disposition (fetched | reused).
# Cold qualification is store_empty_before AND every row fetched -- a warm or manually prefilled store cannot produce
# it. Stdout marker: ACQUIRED ...; refusal: RH-ACQUIRE.
# Nothing else is downloaded and nothing is executed. package.yml then admits the directory offline.
# PREPARATION (codex-tick369 GUEST-ACQUISITION-ADMISSION-CYCLE, tick372 trust correction; C1 proposal
# controller.bootstrap.preparation): ONLY when the resolved policy declares that section, a last phase
# (tasks/prepare.yml) produces the CANDIDATES no other producer can -- the guest tool identities (members of the
# OpenPGP-verified Debian packages, measured by native stat; no local QEMU install) and each declared base image
# (debian_official_tls_sha512: constrained HTTPS, one dated edition, one checksum entry, SHA512 before atomic
# admission) -- into ONE immutable content-addressed record under the localhost host var <preparation.root_var>,
# disjoint from the store. It runs the admitted preparation tools only (tasks/admit_prep_tools.yml first), fetches only
# through tasks/prepare_fetch.yml, and neither reads a target scope nor guest.allocation (this stage's inventory is
# operator_controller_inventory). The candidate is admitted by C1 / B declarations and package.yml
# (tasks/admit_preparation.yml), never by itself. Without the section this playbook is unchanged.
# MEASUREMENT-ONLY (codex R4, route-r4b; C1 proposal controller.bootstrap.preparation_measurement revision 2 and
# genesis.launch.stages.acquire selectors / operations): selected by a declared stage selector (localhost host var);
# right after builder admission a selector gate refuses any requested operation that is undeclared, unsupported or
# ambiguous, whether or not acquisition inputs are present; the admitted one (tasks/measure_controller_tools.yml)
# checks the controller-only scope, writes ONE candidate measurement record under preparation_measurement.root_var and
# ENDS the play (no fetch, no preparation). With no selector supplied this playbook is unchanged. route-r4c: the
# selector gate's refusals use the common grammar controller.bootstrap.refusal_grammar (REFUSED <code>: <detail>,
# through its entry template) and its path join uses path_admission.separator (C1 proposal r4c-c1-hunks.yml).
# MR03 PKG-CALLER optb-after-01 (successor of work / m1-1 210d3e15; NOT of the excluded FB-ROUTE afters; codex721
# LOCKSHA-01; AUTHORED, NEVER EXECUTED, UNRUN): the receipt's lock_sha256 is the RAW captured-file digest of the ONE
# controller lock capture rh_seed_lock {text, sha256, packages, collections} (captured once, digested, verified and
# parsed from that capture by tasks/resolve_policy.yml), never a second read of the lock and never the rstripped-text
# digest of lookup('file') | hash. Historical stripped-digest receipts stay as written (never rewritten, never accepted as
# the new value; MIGRATION-PKG-LOCKSHA-01, migration-pkg-locksha-01.yml). BLOCKED-ON-MAIN-RECORD + atomic join: the
# resolve_policy.yml capture successor (a NEW path) and the controller.yml / tasks/prepare.yml writers land in the same
# unit. Change record: proposals/mr03-pkg-caller/optb-acquire-01v.change.yml.
- name: Acquire the declared bootstrap artifacts (sha256-pinned, declared sources only)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs and derive the repository root
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, localhost, no become; r3g)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    - name: Resolve the harness policy through the engine
      ansible.builtin.include_tasks: tasks/resolve_policy.yml
      vars:
        rh_rp_caller: testing/remote_harness/acquire.yml
        rh_invocation_requirement: "{{ _rh_sa_decl.invocation.requirements.ordinary_permitted }}"

    - name: Admit exactly the declared builder (GENESIS)
      ansible.builtin.include_tasks: tasks/admit_builder.yml
      vars:
        rh_gen_stage: acquire     # genesis.launch.stages key: env and temps under <work root>/tmp/genesis/acquire/<act>

    # STAGE OPERATION SELECTORS (route-r4b R4-MODE-WITHOUT-DECLARATION; C1 proposal genesis.launch.stages.acquire
    # selectors / operations). The selector NAMES are declared at the stage, apart from the operation nodes, so an
    # explicitly requested operation is recognised even when its node is undeclared. ANY supplied selector (extra-var or
    # inventory; presence, whatever its value -- an empty value is a request too) requires: exactly ONE requested
    # operation, its node declared at the revision the stage declares, its mode selector supplied with the declared mode
    # value. Otherwise REFUSED here -- after builder admission, before the artifact-source admission and any fetch --
    # whether or not acquisition inputs are present. With NO selector supplied every expression below is vacuous and the
    # stage is unchanged. The selector declaration itself is required (no default): the contract
    # (contract_admission.genesis_stage_operations) makes it mandatory, so every admissible resolve carries it.
    # Inline in every use (no task var: an extra-var would outrank it).
    - name: "SELECTORS -- refuse a resolve without the stage selector declaration (required; no default)"
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.genesis.launch.stages.acquire.selectors is mapping
          - rh.controller.bootstrap.genesis.launch.stages.acquire.operations is mapping
          - rh.controller.bootstrap.genesis.launch.stages.acquire.refusal is string
          - rh.controller.bootstrap.genesis.launch.stages.acquire.diagnostics is mapping
        # absent-node diagnostics from the ADMITTED parent (genesis.launch.refusal, the stage's playbook_rel and its key
        # set), formatted by the common refusal grammar (route-r4c; C1 controller.bootstrap.refusal_grammar)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.genesis.launch.refusal,
                                   'rh_rf_detail': [rh.controller.bootstrap.genesis.launch.stages.acquire.playbook_rel,
                                                    rh.controller.bootstrap.genesis.launch.stages.acquire | list | to_json]}) }}
        quiet: true

    - name: "SELECTORS -- refuse an explicitly requested acquire-stage operation that is undeclared, unsupported or ambiguous"
      ansible.builtin.assert:
        that:
          - >-
            rh.controller.bootstrap.genesis.launch.stages.acquire.selectors.values()
            | reject('in', rh.controller.bootstrap.genesis.launch.stages.acquire.operations) | list | length == 0
          - >-
            rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
            | map(attribute='value') | unique | list | length <= 1
          - >-
            rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
            | map(attribute='value') | unique | reject('in', rh.controller.bootstrap) | list | length == 0
          - >-
            (rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
             | map(attribute='value') | unique | map('extract', rh.controller.bootstrap) | map(attribute='revision') | list)
            == (rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
                | map(attribute='value') | unique | map('extract', rh.controller.bootstrap.genesis.launch.stages.acquire.operations)
                | map(attribute='revision') | list)
          - >-
            rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
            | map(attribute='value') | unique | map('extract', rh.controller.bootstrap.genesis.launch.stages.acquire.operations)
            | map(attribute='mode_selector') | reject('in', vars) | list | length == 0
          - >-
            query('ansible.builtin.vars', *(rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items
                  | selectattr('key', 'in', vars) | map(attribute='value') | unique
                  | map('extract', rh.controller.bootstrap.genesis.launch.stages.acquire.operations)
                  | map(attribute='mode_selector') | list))
            == (rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
                | map(attribute='value') | unique | map('extract', rh.controller.bootstrap.genesis.launch.stages.acquire.operations)
                | map(attribute='mode_value') | list)
        fail_msg: >-
          {{ lookup('ansible.builtin.template',
                    rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel,
                    template_vars={'rh_rf_grammar': rh.controller.bootstrap.refusal_grammar,
                                   'rh_rf_code': rh.controller.bootstrap.genesis.launch.stages.acquire.refusal,
                                   'rh_rf_detail': [rh.controller.bootstrap.genesis.launch.stages.acquire.diagnostics.selectors,
                                                    rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | list | select('in', vars) | list | to_json,
                                                    rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
                                                    | map(attribute='value') | unique | list | to_json,
                                                    rh.controller.bootstrap.genesis.launch.stages.acquire.diagnostics.stop]}) }}
        quiet: true

    # THE REQUESTED OPERATION (codex-r2-r4-r5-bootstrap-decisions-20261006 R4; route-r4b): the ONE operation the gate
    # above admitted runs from its declared tasks_rel (preparation_measurement -> tasks/measure_controller_tools.yml,
    # which ENDS the play) -- before the artifact-source admission below, any fetch and preparation. No selector
    # supplied -> skipped (the when is evaluated before the file name is templated) and the stage is unchanged.
    - name: "STAGE OPERATION -- the requested declared operation, then END (its declared tasks_rel)"
      ansible.builtin.include_tasks: >-
        {{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.launch.stages.acquire.operations[
             rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
             | map(attribute='value') | first].tasks_rel }}
      vars:
        rh_gen_stage: acquire     # the same genesis.launch.stages key as the builder admission above
      when: >-
        rh.controller.bootstrap.genesis.launch.stages.acquire.selectors | dict2items | selectattr('key', 'in', vars)
        | list | length > 0

    - name: Admit the artifact source path (the ONE path-admission rule; no default)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.genesis.acquisition.source_var is string and rh.controller.bootstrap.genesis.acquisition.source_var in vars
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is string
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is match(rh.controller.bootstrap.path_admission.regex)
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - rh.controller.bootstrap.genesis.acquisition.receipt_var is string and rh.controller.bootstrap.genesis.acquisition.receipt_var in vars
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) is string
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) is match(rh.controller.bootstrap.path_admission.regex)
          - lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - not (lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) ~ '/').startswith(lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) ~ '/')
        fail_msg: >-
          REFUSED RH-ACQUIRE the host vars named by genesis.acquisition.source_var
          ({{ rh.controller.bootstrap.genesis.acquisition.source_var }}) and receipt_var
          ({{ rh.controller.bootstrap.genesis.acquisition.receipt_var }}) must be normalized absolute paths (host vars
          of localhost; no defaults), and the receipt must lie OUTSIDE the store.
        quiet: true

    - name: Stat the receipt path and its directory (read-only; the receipt never lands in the store)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) | dirname }}"
        - "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) }}"
      register: _rh_acq_rcpt

    - name: Refuse an unowned receipt directory or a receipt path that is not an owned regular file
      vars:
        _d: "{{ _rh_acq_rcpt.results[0].stat }}"
        _f: "{{ _rh_acq_rcpt.results[1].stat }}"
      ansible.builtin.assert:
        that:
          - _d.exists and _d.isdir and not _d.islnk and _d.uid == rh_builder.uid | int and not (_d.wgrp or _d.woth)
          - not _f.exists or (_f.isreg and not _f.islnk and _f.uid == rh_builder.uid | int)
        fail_msg: >-
          REFUSED RH-ACQUIRE: {{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) | dirname }}
          must be an existing real directory owned by uid {{ rh_builder.uid }} and not group/other-writable, and
          {{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) }} absent or an owned regular file.
        quiet: true

    - name: List every entry of the artifact store BEFORE any fetch (the cold-qualification observation; read-only)
      ansible.builtin.find:
        paths: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) }}"
        file_type: any
        hidden: true
        recurse: false
        follow: false
      register: _rh_acq_before

    - name: Stat the artifact source directory and every declared row in it
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: >-
        {{ [lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var)]
           + ((rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections) | map(attribute='file')
              | map('regex_replace', '^', lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) ~ '/')
              | list) }}
      register: _rh_acq_have

    - name: Refuse before any fetch -- unowned source dir, wrong digests, or absent rows without a declared source
      vars:
        _rows: "{{ rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections }}"
        _st: "{{ _rh_acq_have.results[1:] | map(attribute='stat') | list }}"
      ansible.builtin.assert:
        that:
          - _rh_acq_have.results[0].stat.exists and _rh_acq_have.results[0].stat.isdir and not _rh_acq_have.results[0].stat.islnk
          - _rh_acq_have.results[0].stat.uid == rh_builder.uid | int
          - not (_rh_acq_have.results[0].stat.wgrp or _rh_acq_have.results[0].stat.woth)
          - >-
            _rows | zip(_st) | selectattr('1.exists') | selectattr('1.islnk') | list | length == 0
          - >-
            _rows | zip(_st) | selectattr('1.exists') | map('last') | map(attribute='checksum') | list
            == _rows | zip(_st) | selectattr('1.exists') | map('first') | map(attribute='sha256') | list
          - _rows | rejectattr('url', 'defined') | list | length == 0
          - _rows | selectattr('url', 'defined') | rejectattr('url', 'string') | list | length == 0
          - >-
            (rh_seed_lock.packages + rh_seed_lock.collections) | selectattr('url', 'defined')
            | map(attribute='url') | map('regex_replace', '^.*/', '') | list
            == (rh_seed_lock.packages + rh_seed_lock.collections) | selectattr('url', 'defined') | map(attribute='file') | list
        fail_msg: >-
          REFUSED RH-ACQUIRE: source dir must be an existing real directory owned by uid {{ rh_builder.uid }} and not
          group/other-writable; present-but-wrong or linked: {{ _rows | zip(_st) | selectattr('1.exists')
          | rejectattr('1.checksum', 'in', _rows | map(attribute='sha256') | list) | map('first') | map(attribute='file') | list }};
          rows with NO declared source (every row declares `url`; placing a file by hand is not a source):
          {{ _rows | rejectattr('url', 'defined') | map(attribute='file') | list }}; lock rows whose url does not end in
          their file name: {% for r in rh_seed_lock.packages + rh_seed_lock.collections if r.url is defined and (r.url | regex_replace('^.*/', '')) != r.file %}{{ r.file }} {% endfor %}.
        quiet: true

    - name: Fetch each absent row from its declared source, checksum-pinned (the only network effect)
      vars:
        _rows: "{{ rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections }}"
      ansible.builtin.get_url:
        url: "{{ item.0.url }}"
        dest: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) }}/{{ item.0.file }}"
        checksum: "sha256:{{ item.0.sha256 }}"
        mode: '0400'
        force: false
        use_proxy: true
      loop: "{{ _rows | zip(_rh_acq_have.results[1:] | map(attribute='stat') | list) | rejectattr('1.exists') | list }}"
      loop_control:
        label: "{{ item.0.file }}"

    - name: Re-verify every declared row in the store after the fetch (links not followed)
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var) }}/{{ item.file }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop: "{{ rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections }}"
      loop_control:
        label: "{{ item.file }}"
      register: _rh_acq_after

    - name: Refuse unless every declared row is now present with its declared digest
      vars:
        _rows: "{{ rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections }}"
      ansible.builtin.assert:
        that:
          - _rh_acq_after.results | map(attribute='stat') | selectattr('exists') | selectattr('isreg') | rejectattr('islnk') | list | length == _rows | length
          - _rh_acq_after.results | map(attribute='stat') | map(attribute='checksum', default='') | list == _rows | map(attribute='sha256') | list
          - _rh_acq_before.files is defined
        fail_msg: >-
          REFUSED RH-ACQUIRE: after acquisition not every declared row is a regular file with its declared sha256
          (absent: {{ _rh_acq_after.results | rejectattr('stat.exists') | map(attribute='item.file') | list }});
          no receipt was written.
        quiet: true

    - name: Write this run's acquisition receipt (observed dispositions; overwrites any earlier receipt)
      vars:
        _acq: "{{ rh.controller.bootstrap.genesis.acquisition }}"
        _rows: "{{ rh.controller.bootstrap.artifacts + rh_seed_lock.packages + rh_seed_lock.collections }}"
        _pre: "{{ _rh_acq_have.results[1:] | map(attribute='stat') | list }}"
        _empty: "{{ _rh_acq_before.files | length == 0 }}"
        _disp: "{{ _pre | map(attribute='exists') | map('ternary', _acq.dispositions[1], _acq.dispositions[0]) | list }}"
        _out: >-
          {%- set ns = namespace(r=[]) -%}{%- for x in _rows -%}
          {%- set ns.r = ns.r + [{'file': x.file, 'url': x.url, 'sha256': x.sha256, 'disposition': _disp[loop.index0]}] -%}
          {%- endfor -%}{{ ns.r }}
        _decl: "{{ _rows | map(attribute='file') | list }}"
      ansible.builtin.copy:
        dest: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) }}"
        mode: '0400'
        content: >-
          {{ {'schema': _acq.receipt_schema,
              'observed_at_utc': now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'store': lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.source_var),
              'store_empty_before': _empty,
              'store_entries_before': _rh_acq_before.files | map(attribute='path') | map('basename') | sort,
              'store_foreign_entries': _rh_acq_before.files | map(attribute='path') | map('basename') | reject('in', _decl) | sort,
              'profile_sha256': rh_profile_sha256,
              'lock_sha256': rh_seed_lock.sha256,
              'builder_uid': rh_builder.uid,
              'rows': _out,
              'cold_qualified': _empty and (_disp | unique | list == [_acq.dispositions[0]])} | to_nice_json }}

    - name: Report the acquisition result
      vars:
        _acq: "{{ rh.controller.bootstrap.genesis.acquisition }}"
        _pre: "{{ _rh_acq_have.results[1:] | map(attribute='stat') | list }}"
      ansible.builtin.debug:
        msg: >-
          {{ _acq.report }} store_empty_before={{ _rh_acq_before.files | length == 0 }}
          fetched={{ _pre | rejectattr('exists') | list | length }} reused={{ _pre | selectattr('exists') | list | length }}
          cold_qualified={{ (_rh_acq_before.files | length == 0) and (_pre | selectattr('exists') | list | length == 0) }}
          receipt={{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.acquisition.receipt_var) }}

    - name: "PREPARATION -- the declared candidates (guest tool identities, base images) (tasks/prepare.yml; declared only)"
      ansible.builtin.include_tasks: tasks/prepare.yml
      when: rh.controller.bootstrap.preparation is defined
# FROZEN, no further writes
