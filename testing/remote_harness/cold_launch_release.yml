---
# testing/remote_harness/cold_launch_release.yml -- OP-1 / X4: the COLD-LAUNCH RELEASE entry (codex-tick822 B-E2 X4;
# codex-tick909 first_operation; codex-tick910 answers.argv_and_importer; G records-g-toolchain-first-operation-03 OP-1).
# NEW FILE. NON-GENERATED. AUTHORED, NEVER EXECUTED (UNRUN). Change records: b/op1-cold-launch/records-b-op1-cold-launch-01.yml;
# b/op1b-cold-launch/records-b-op1b-cold-launch-01.yml (OWED-B-SR327-PUB, OWED-B-SR327-ROLES; C1 sr327_c1 S32 / R19).
# SUCCESSOR-01 (B op1g; cp -n of b/op1b-cold-launch cold_launch_release.yml.after.partial 2c2e91be, then Edit; change
# record b/op1g-projector/records-b-op1g-projector-01.yml): ONLY the N13 include (:313) gains rh_rsv_render_scope and
# rh_rsv_uid from its callers.sites.cold_launch_release row (C1 sr922b; codex 923). Nothing else changes; the final
# admission's rh_builder.uid read (base :436) is the same fact the site's uid path names.
# SUCCESSOR-02 (B op1i; cp -n of successor-01, then Edit; change record b/op1i-projector/records-b-op1i-projector-01.yml;
# C1 s42 5afeb068 / r29 c390c0e8, sr922d_c1 + sr922e_c1; first authored on s41 / r28): ONLY the N13 include gains rh_rsv_include_rel = this file's own rel, bound
# literally (write_bound.authority.include_param). The caller fact N13 joins is _rh_sa_caller, set by N2 from this
# file's rh_rp_caller (:55). Nothing else changes.
#   WHO RUNS IT   the externally admitted builder A, once, as the external invocation row
#                 genesis.initializer.custody.external_invocation.cold_launch_release (X4, after X1-X3). Its argv is
#                 RENDER-OWED: the row now names its generator (s32 cold_launch_release.generator, names only), whose
#                 implementation and render authority wait on the Codex ruling Q-OP1-RENDER (HOLE-B-OP1-X4-GEN-B);
#                 nothing here assembles the vector.
#   WHAT IT DOES  publishes the thin cold consumer custody.cold_launch.artifact.file (rendered from
#                 custody.cold_launch.template_rel with custody.cold_launch.template_vars), which OP-2 invokes to reach G01.
#   SHARED COLD   tasks/admit_cold_launch.yml then tasks/admit_record_free_entry.yml, both INCLUDED, never copied (the
#                 genesis_generate s09 form). This file's own rel is the binder rh_rp_caller (resolve_phases.callers row,
#                 record_free). The include site's invocation requirement (source_admission.invocation.requirement_var,
#                 RP07-01b) is bound beside it BY POINTER to the declared word of this invocation row
#                 (external_invocation.cold_launch_release.requirement, ordinary_permitted); it is templated lazily at
#                 RP07-01b, after N2 binds _rh_sa_bs (route census C26 / Q-CENSUS-RF-BIND-SITE: bound at the outer include).
#   PUBLICATION   the N9 initializer_release s11 publication form (dest, inventory, closure, N12, pin, members, budget,
#                 N13, independent fresh-render readback) over cl = custody.cold_launch. s32 declares the cold publication
#                 words (C1-SR327 S32-03 / S32-04; r19 cold_launch exact keys + shape rows R19-06 / R19-08): dest_var
#                 (rh_cold_launch_dir, never custody.dest_var: N13 renames its staging onto the whole destination),
#                 binding {rel, mode, schema, fields, override_none, field_roles}, consume and budget. The binding values
#                 pair with their fields BY ROLE (cl.binding.field_roles), never by position; the absent override reads
#                 cl.binding.override_none; the companion pair of the pin maps by role through
#                 external_invocation.cold_launch_release.companion_roles. consume {before invoke, checks} is the OP-2
#                 invoker's bind-before-use row: this publisher asserts it is the custody.consume row and its final
#                 admission reproduces every check word it names (record CONSUME map). Nothing is written before the
#                 destination, closure, pin, member and budget asserts.
#   LITERALS      SR-912 / SR-913 (codex 912, 913): no disclosure or comparison waives an atom. The two include-var KEYS
#                 below (rh_rp_caller, rh_invocation_requirement) and the caller rel VALUE stay literal and OPEN
#                 (HOLE-B-912-INCLUDE-KEYS, HOLE-B-912-CALLER-SELF); the checks after the include read the declared
#                 names by lookup, with no quoted name atom. The N13 row names, the pin declaration key, the X4 stage
#                 inputs and the accumulator starts read proposed C1 words (cl.publish_rows, cl.pin_declaration_key,
#                 cold_launch_release.stage_inputs, cl.initial; record C1-912-W-*): until C1 declares them this entry
#                 refuses (an absent word) before any write. Remaining positional / numeric atoms are listed in the
#                 record (R-912-RESIDUAL), not waived.

- name: Release the cold-launch consumer (record-free cold entry under the externally admitted A; X4)
  hosts: "{{ rh_controller_target }}"
  connection: "{{ rh_controller_connection }}"
  gather_facts: false
  become: false
  tasks:
    - name: Admit the cold launch (first-entry guard, controller, registry guard value, envelope, cold inputs, carrier)
      ansible.builtin.include_tasks: tasks/admit_cold_launch.yml

    - name: Admit the record-free entry (SOLE resolve, row, envelope word, stage, caller, bytes, inputs, admission, builder A)
      ansible.builtin.include_tasks: tasks/admit_record_free_entry.yml
      vars:
        rh_rp_caller: testing/remote_harness/cold_launch_release.yml
        rh_invocation_requirement: "{{ _rh_sa_bs.genesis.initializer.custody.external_invocation.cold_launch_release.requirement }}"

    # OP-1 row admission (this entry only; the shared include admitted the generic record-free row). The external
    # invocation row names THIS stage, THIS entry (entry_from), THIS row (inputs_from), the row's builder and transport,
    # the builder leg, the ordinary_permitted requirement (bound above and read back here), an empty stage-input list,
    # and the companion pair the ingress declares.
    - name: Refuse an X4 row that is not this entry's declared external invocation (stage, entry, row, builder, transport, leg, requirement, companions)
      vars:
        _rh_clr_xr: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release }}"
        _rh_clr_walk: >-
          {%- set ns = namespace(e=rh.controller.bootstrap, i=rh.controller.bootstrap, t=rh.controller.bootstrap) -%}
          {%- for k in _rh_clr_xr.entry_from -%}{%- set ns.e = ns.e[k] -%}{%- endfor -%}
          {%- for k in _rh_clr_xr.inputs_from -%}{%- set ns.i = ns.i[k] -%}{%- endfor -%}
          {%- for k in _rh_clr_xr.ingress.transport_from -%}{%- set ns.t = ns.t[k] -%}{%- endfor -%}
          {{ [ns.e, ns.i[_rh_sa_caller], ns.t] }}
      ansible.builtin.assert:
        that:
          # SR-912 / 913 :53-54: no quoted name atom. The declared caller_param / requirement_var names must be the vars
          # bound at the include above and carry this entry's rel and this row's requirement (a different literal key
          # leaves the declared name unbound and refuses here). The two YAML keys stay literal (HOLE-B-912-INCLUDE-KEYS).
          - _rh_sa_decl.resolve_phases.caller_param in vars
          - lookup('ansible.builtin.vars', _rh_sa_decl.resolve_phases.caller_param) == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.entry_rel
          - _rh_sa_decl.invocation.requirement_var in vars
          - _rh_clr_xr.stage == _rh_rf_row.purpose
          - _rh_clr_xr.stage in rh.controller.bootstrap.genesis.builder.authoring.releases
          - _rh_clr_walk[0] == _rh_sa_caller
          - _rh_clr_walk[0] == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.entry_rel
          - _rh_clr_walk[1] == _rh_rf_row
          - _rh_rf_row.producer == rh.controller.bootstrap.genesis.initializer.custody.producers.external_invocation
          - _rh_clr_xr.builder == _rh_rf_row.builder
          - _rh_clr_xr.transport == _rh_rf_row.transport
          # codex-tick912 answers.transport: the transport is the declared source_admission.launch_transports selection
          # NAMED by the X4 ingress row (ingress.transport_from, a key path under controller.bootstrap), and it agrees
          # with the record-free row, the X4 row, the transport the registry ingress guard selected (its output word
          # transport) and the envelope's own transport_field; nothing is inferred from which variables are present.
          - _rh_clr_walk[2] == _rh_clr_xr.transport
          - _rh_clr_walk[2] == _rh_rf_row.transport
          - _rh_clr_walk[2] in rh.controller.bootstrap.source_admission.launch_transports.values()
          - _rh_clr_walk[2] == _rh_sa_regadm[_rh_sa_regadm.ingress.output.transport]
          - _rh_clr_xr.ingress.envelope.early_name == _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var
          - >-
            _rh_clr_walk[2]
            == lookup('ansible.builtin.vars', _rh_clr_xr.ingress.envelope.early_name)[_rh_clr_xr.ingress.envelope.transport_field]
          - _rh_clr_xr.leg == rh.controller.builder_leg
          - _rh_clr_xr.requirement == _rh_sa_decl.invocation.requirements.ordinary_permitted
          - lookup('ansible.builtin.vars', _rh_sa_decl.invocation.requirement_var) == _rh_clr_xr.requirement
          # SR-913 :66: the row's own declared stage-input list (C1-912-W-STAGE-INPUTS), never a literal []
          - rh.controller.bootstrap.genesis.launch.stages[_rh_rf_row.purpose].stage_inputs == _rh_clr_xr.stage_inputs
          - >-
            (_rh_clr_xr.companions | sort)
            == (_rh_sa_regadm.ingress.companions.values() | map(attribute='var') | list | sort)
          # OWED-B-SR327-ROLES (s32 companion_roles; r19 R19-02): role -> companion is a bijection between the
          # step_record.context.mapping_keys.controller_pair roles and the row companions (the pin below maps by it)
          - _rh_clr_xr.companion_roles is mapping
          - >-
            (_rh_clr_xr.companion_roles.keys() | list | sort)
            == (rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.controller_pair.keys() | list | sort)
          - (_rh_clr_xr.companion_roles.values() | list | sort) == (_rh_clr_xr.companions | sort)
          - (_rh_clr_xr.companion_roles.values() | unique | list | length) == (_rh_clr_xr.companion_roles | length)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.entry }}: {{ rh.controller.bootstrap.genesis.initializer.texts.entry }}
          {{ [_rh_sa_caller, _rh_rf_row, _rh_clr_xr] | to_json }}
        quiet: true

    # LC-SR323-ENVELOPE (envelope context): admit_record_free_entry compared the envelope context KEY SET with early_view
    # context_fields + launch_context_fields. Here every launch_context_fields VALUE (the invocation node among them,
    # external_invocation.cold_launch_release.context_from) carried by the envelope equals the value at its key path in
    # the resolved view, and every companion binding equals the envelope value at its declared ingress path.
    - name: Refuse an envelope whose launch context values or companion values are not the resolved and pinned ones
      vars:
        _rh_clr_env: "{{ lookup('ansible.builtin.vars', _rh_sa_regadm.ingress.transports[_rh_sa_regadm.ingress.envelope_transport].var) }}"
        # SR-913: the accumulator starts at the declared cold_launch.initial.rows (C1-912-W-INITIAL); the envelope's
        # context node is the envelope record key whose construction field has the context source
        # (source_admission.bootstrap_input.construction; the record_text context arm), and each companion value is read
        # at its whole declared ingress path (no positional atom)
        _rh_clr_cbad: >-
          {%- set cm = rh.controller.bootstrap.source_admission.bootstrap_input.construction -%}
          {%- set ns = namespace(lcf=rh.controller.bootstrap, ctx=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows, bad=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for k in rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release.context_from -%}{%- set ns.lcf = ns.lcf[k] -%}{%- endfor -%}
          {%- for k in rh.controller.bootstrap.source_admission.bootstrap_input.record_keys if cm.fields[k].source == cm.sources.context -%}{%- set ns.ctx = _rh_clr_env[k] -%}{%- endfor -%}
          {%- for f, kp in ns.lcf | dictsort -%}
          {%- set w = namespace(n=rh.controller.bootstrap) -%}{%- for k in kp -%}{%- set w.n = w.n[k] -%}{%- endfor -%}
          {%- if f not in ns.ctx or ns.ctx[f] != w.n -%}{%- set ns.bad = ns.bad + [f] -%}{%- endif -%}
          {%- endfor -%}
          {%- for r, c in _rh_sa_regadm.ingress.companions | dictsort -%}
          {%- set cw = namespace(n=_rh_clr_env) -%}{%- for k in c.path -%}{%- set cw.n = cw.n[k] -%}{%- endfor -%}
          {%- if lookup('ansible.builtin.vars', c.var) != cw.n -%}{%- set ns.bad = ns.bad + [c.var] -%}{%- endif -%}
          {%- endfor -%}{{ ns.bad }}
      ansible.builtin.assert:
        that:
          - _rh_clr_cbad == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
        fail_msg: >-
          REFUSED {{ _rh_sa_rref.input }}: {{ rh.controller.bootstrap.genesis.initializer.texts.input }}
          {{ _rh_clr_cbad | to_json }}
        quiet: true

    # The N9 :358-377 destination row over cl, at cl.dest_var (s32 :977 rh_cold_launch_dir; r19 :5514-5516 var_name,
    # enum, distinct_from custody.dest_var). HOLE-B-OP1-PUB is satisfiable from declared words once the operator
    # controller inventory supplies rh_cold_launch_dir (C1 OWED-MAIN-SR327-INVENTORY); absent, `in vars` refuses here.
    # NEVER a release directory: the var name differs from custody.dest_var, and when the release var is also bound
    # its directory is neither this one nor nested with it (N13 renames its staging onto the whole destination).
    - name: Refuse a consumer publication directory that is not an owned normalized absolute path OUTSIDE the checkout and every release directory
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
      ansible.builtin.assert:
        that:
          - cl.dest_var is string
          - cl.dest_var != rh.controller.bootstrap.genesis.initializer.custody.dest_var
          - cl.dest_var in vars
          - lookup('ansible.builtin.vars', cl.dest_var) is string
          - >-
            rh.controller.bootstrap.genesis.initializer.custody.dest_var not in vars
            or (lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) is string
                and lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) != lookup('ansible.builtin.vars', cl.dest_var)
                and not (lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator).startswith(lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) ~ rh.controller.bootstrap.path_admission.separator)
                and not (lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) ~ rh.controller.bootstrap.path_admission.separator).startswith(lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator))
          - lookup('ansible.builtin.vars', cl.dest_var) is match(rh.controller.bootstrap.path_admission.regex)
          - lookup('ansible.builtin.vars', cl.dest_var) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - lookup('ansible.builtin.vars', cl.dest_var) != rh_repo_root
          - not (lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator).startswith(rh_repo_root ~ rh.controller.bootstrap.path_admission.separator)
          - not (rh_repo_root ~ rh.controller.bootstrap.path_admission.separator).startswith(lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator)
        fail_msg: >-
          REFUSED {{ cl.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [cl.entry_rel, cl.artifact.file] | to_json }}
        quiet: true

    - name: Stat the selected inventory source and its adjacent auto-load locations (no link followed)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      loop: >-
        {{ ansible_inventory_sources
           + (rh.controller.bootstrap.genesis.entry.closure.inventory_adjacent_absent
              | map('regex_replace', '^', (ansible_inventory_sources | first | dirname) ~ rh.controller.bootstrap.path_admission.separator)
              | list) }}
      register: _rh_clr_inv

    - name: Refuse an inventory that is not exactly the stage's one kind of regular unlinked files without adjacent auto-load locations
      ansible.builtin.assert:
        that:
          - ansible_inventory_sources | length == 1
          - >-
            (rh.controller.bootstrap.genesis.launch.inventory_kinds[rh.controller.bootstrap.genesis.launch.stages[_rh_rf_row.purpose].inventory | first].files | length)
            == (ansible_inventory_sources | length)
          - (ansible_inventory_sources | first) is match(rh.controller.bootstrap.path_admission.regex)
          - (ansible_inventory_sources | first) is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - _rh_clr_inv.results[0].stat.exists and _rh_clr_inv.results[0].stat.isreg and not _rh_clr_inv.results[0].stat.islnk
          - _rh_clr_inv.results[1:] | map(attribute='stat.exists') | select | list | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.input }}: {{ rh.controller.bootstrap.genesis.initializer.texts.input }}
          {{ ansible_inventory_sources | to_json }}
        quiet: true

    # codex-tick910 (2): the closure of this entry is members_rel plus its dispatch_admission.authored row (the X2
    # closure_from of external_invocation.source_admission); C1 projects that row from the B record list
    # (records-b-op1-cold-launch-01 closure). No second list here: the paths this entry selects by policy must be in
    # that union, and every row member is a plain rel. OWED-B-SR327-PUB: + cl.macros_rel (s32 :970 cold_envelope.j2,
    # the one non-member, carried by the authored row s32 :5565).
    - name: Refuse a consumer closure that is not the common member set plus this entry's declared authored row
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clr_cls: >-
          {{ rh.controller.bootstrap.source_admission.members_rel
             + rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] }}
      ansible.builtin.assert:
        that:
          - _rh_sa_caller in rh.controller.bootstrap.source_admission.dispatch_admission.authored
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] is sequence
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] is not string
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] | reject('string') | list | length == 0
          - >-
            [cl.entry_rel, cl.template_rel, cl.macros_rel,
             rh.controller.bootstrap.genesis.initializer.custody.macros_rel,
             rh.controller.bootstrap.macros_rel]
            | reject('in', _rh_clr_cls) | list | length == 0
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.entry }}: {{ rh.controller.bootstrap.genesis.initializer.texts.entry }}
          {{ [_rh_sa_caller, cl.template_rel] | to_json }}
        quiet: true

    - name: Bind the source edition, status and closure digests (N12; members_rel plus this entry's authored row)
      ansible.builtin.include_tasks: tasks/bind_source_inputs.yml
      vars:
        rh_bsi_status_rel: "{{ rh.controller.bootstrap.source_admission.package_status_rel }}"
        rh_bsi_editions: ["{{ rh_rel_edition }}"]
        rh_bsi_inputs: >-
          {{ (rh.controller.bootstrap.source_admission.members_rel
              + rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller]) | unique | sort
             | map('regex_replace', '^', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | list }}

    # The pin of the consumer: ONE declaration key (the cold_launch.pin key that is no context word) with the digest
    # measured from N2's admitted bytes, plus the carried context words in their declared shapes (the N9 :434-449 rule).
    - name: Refuse a measured pin that is the marker, not the admitted declaration digest, or not the declared pin carriage
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clr_ck: "{{ rh.controller.bootstrap.genesis.launch.step_record.context['keys'] }}"
      ansible.builtin.assert:
        that:
          - (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm)) == rh_rel_declaration_sha256
          # SR-913 :194: the declaration key is the declared word cl.pin_declaration_key (C1-912-W-PIN-DECL), not a count
          - (cl.pin.keys() | reject('in', _rh_clr_ck.values() | list) | list) == [cl.pin_declaration_key]
          - >-
            (cl.pin.keys() | select('in', _rh_clr_ck.values() | list) | list | sort)
            == ([_rh_clr_ck.edition, _rh_clr_ck.registry_digest, _rh_clr_ck.override_digest, _rh_clr_ck.a_receipt,
                 _rh_clr_ck.controller_pair, _rh_clr_ck.inventory_digest] | sort)
          - (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm)) not in (cl.pin.values() | list)
          - (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm)) is match('(?:' ~ rh.controller.bootstrap.genesis.entry.digest_regex ~ ')')
        fail_msg: >-
          REFUSED {{ cl.refusals.source }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.binding }}
        quiet: true

    - name: Refuse a consumer member that is not ONE normalized relative component inside the publication directory
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clr_gr: "{{ rh.controller.bootstrap.source_admission.rel_path_grammar }}"
        _rh_clr_members: ["{{ cl.artifact.file }}", "{{ cl.binding.rel }}"]
      ansible.builtin.assert:
        that:
          - _rh_clr_members | reject('string') | list | length == 0
          - _rh_clr_members | unique | list | length == _rh_clr_members | length
          - _rh_clr_members | select('search', _rh_clr_gr.separator | regex_escape) | list | length == 0
          - _rh_clr_members | select('search', _rh_clr_gr.terminator | regex_escape) | list | length == 0
          - _rh_clr_members | select('in', _rh_clr_gr.refused_components) | list | length == 0
          - _rh_clr_members | reject('match', '(?:' ~ _rh_clr_gr.pattern ~ ')\Z') | list | length == 0
        fail_msg: >-
          REFUSED {{ cl.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
        quiet: true

    # SR-913 :230: the N13 row names are the declared cl.publish_rows words (C1-912-W-PUBLISH-ROWS: render -> the
    # artifact row, record -> the binding row), equal to the budget.payload_max_bytes roles; no quoted row name.
    - name: Refuse a consumer budget envelope that is not one positive integer byte cap per staged row, or binding words that are not the declared role map
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
      ansible.builtin.assert:
        that:
          - cl.budget is mapping
          - cl.budget.payload_max_bytes is mapping
          - (cl.budget.payload_max_bytes.keys() | list | sort) == (cl.publish_rows.values() | list | sort)
          - (cl.publish_rows.values() | unique | list | length) == (cl.publish_rows | length)
          - (cl.budget.payload_max_bytes.values() | select('integer') | list) == (cl.budget.payload_max_bytes.values() | list)
          - cl.budget.payload_max_bytes.values() | select('le', 0) | list | length == 0
          # OWED-B-SR327-PUB (s32 :1020-1026; r19 :5517-5531): the cold binding words. fields: the same list as the N7
          # release binding in its declared order (the s32 comment's asserted equality); field_roles: role -> field, a
          # bijection onto fields (the binding document below pairs every value with its field BY ROLE);
          # override_none: the custody word (r19 :5527 within)
          - cl.binding.fields == rh.controller.bootstrap.genesis.initializer.custody.binding.fields
          - cl.binding.schema is string
          - cl.binding.field_roles is mapping
          - (cl.binding.field_roles.values() | list | sort) == (cl.binding.fields | sort)
          - (cl.binding.field_roles.values() | unique | list | length) == (cl.binding.field_roles | length)
          - cl.binding.override_none == rh.controller.bootstrap.genesis.initializer.custody.binding.override_none
          # consume: the OP-2 invoker's bind-before-use row, the custody.consume row mirrored (r19 :5532-5534); the
          # final admission below reproduces each check word (record CONSUME map); its runner is OP-2 (CPL-B-912-CONSUME)
          - cl.consume == rh.controller.bootstrap.genesis.initializer.custody.consume
        fail_msg: >-
          REFUSED {{ cl.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
        quiet: true

    - name: Reserve, render, seal and publish the cold-launch consumer (N13 -> N10; ONE publisher)
      ansible.builtin.include_tasks: tasks/reserve_publish.yml
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clr_ck: "{{ rh.controller.bootstrap.genesis.launch.step_record.context['keys'] }}"
        _rh_clr_mk: "{{ rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys }}"
        _rh_clr_tf: "{{ rh.controller.bootstrap.source_admission.tool_fields }}"
        _rh_clr_xr: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release }}"
        # the ONE pin expression (the anchor is re-used verbatim by the independent fresh render below). The
        # declaration key is cl.pin_declaration_key; the absent override is cl.binding.override_none (OWED-B-SR327-PUB);
        # the controller_pair maps each mapping_keys.controller_pair role to the value of its companion var through
        # companion_roles (OWED-B-SR327-ROLES), never a literal var name
        _rh_clr_pin: &clr_pin >-
          {{ {cl.pin_declaration_key: _rh_sa_text | hash(_rh_sa_decl.digest_algorithm)}
             | combine({_rh_clr_ck.edition: rh_rel_edition,
                        _rh_clr_ck.registry_digest: rh_rel_registry_sha256,
                        _rh_clr_ck.a_receipt: {_rh_clr_mk.a_receipt.path: rh_a_receipt[_rh_clr_mk.a_receipt.path],
                                               _rh_clr_mk.a_receipt.sha256: rh_a_receipt[_rh_clr_mk.a_receipt.sha256]},
                        _rh_clr_ck.override_digest:
                          (lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles.sha256)
                           if _rh_rf_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                           else cl.binding.override_none),
                        _rh_clr_ck.controller_pair:
                          dict(_rh_clr_xr.companion_roles | dictsort | map('first') | map('extract', _rh_clr_mk.controller_pair)
                               | zip(query('ansible.builtin.vars', *(_rh_clr_xr.companion_roles | dictsort | map('last') | list)))),
                        _rh_clr_ck.inventory_digest: (_rh_clr_inv.results[:(ansible_inventory_sources | length)] | map(attribute='stat.checksum') | list)}) }}
        rh_rsv_dir: "{{ lookup('ansible.builtin.vars', cl.dest_var) }}"
        rh_rsv_refusal: "{{ cl.refusals.prepare }}"
        rh_rsv_staged: "{{ cl.refusals.prepare }}"
        rh_rsv_need: "{{ (cl.budget.payload_max_bytes.values() | sum) + (cl.budget.payload_max_bytes.values() | max) }}"
        # budget.payload_max_bytes {artifact, binding} by the declared row words (cl.publish_rows)
        rh_rsv_max_bytes:
          total: "{{ cl.budget.payload_max_bytes.values() | sum }}"
          rows: "{{ {cl.artifact.file: cl.budget.payload_max_bytes[cl.publish_rows.render], cl.binding.rel: cl.budget.payload_max_bytes[cl.publish_rows.record]} }}"
        # op1g (C1 sr922b render.n10.write_bound.callers.sites.cold_launch_release {render_scope: lookup, uid: [rh_builder,
        # uid], copies: {}}; codex 923 N13_CALLER_AND_DECLARATION_JOIN; CPL-SR922B-CALLER-SUCCESSORS): the two required N13
        # params (callers.params; absent refuses) from THIS site's row: the N10 scope scopes[<site render_scope>] and the
        # decimal text of the fact at the site's uid path (first word the fact var, the rest keys). copies {} is
        # HOLE-SR922B-LOOKUP-SITE-COPIES (C1): the staged copies stay charged by rh_rsv_need above.
        rh_rsv_render_scope: "{{ rh.controller.entry_generation.render.n10.scopes[rh.controller.entry_generation.render.n10.write_bound.callers.sites.cold_launch_release.render_scope] }}"
        rh_rsv_uid: >-
          {%- set st = rh.controller.entry_generation.render.n10.write_bound.callers.sites.cold_launch_release -%}
          {%- set w = namespace(v=lookup('ansible.builtin.vars', st.uid | first)) -%}
          {%- for k in st.uid[1:] -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v | string }}
        # SUCCESSOR-02 (B op1i; s42 write_bound.authority include_param :7475; r29 reserved_outputs :7241): the rel of
        # THIS authored file, which carries the N13 include, bound LITERALLY here (never derived, never -e); N13 compares
        # it with the LAST entry of sites.cold_launch_release.authority.include_chain[_rh_sa_caller] (s42 :7534).
        rh_rsv_include_rel: testing/remote_harness/cold_launch_release.yml
        rh_rsv_members: ["{{ cl.artifact.file }}", "{{ cl.binding.rel }}"]
        # SR-912: the unused N13 row lists start at the declared cold_launch.initial.rows (C1-912-W-INITIAL)
        rh_rsv_dirs: "{{ cl.initial.rows }}"
        rh_rsv_copies: "{{ cl.initial.rows }}"
        rh_rsv_checks: "{{ cl.initial.rows }}"
        rh_rsv_prepublish: {rows: {}}
        rh_rsv_renders:
          - name: "{{ cl.publish_rows.render }}"
            src: "{{ cl.template_rel }}"
            rel: "{{ cl.artifact.file }}"
            mode: "{{ cl.artifact.mode }}"
            vars: "{{ {cl.template_vars.bs: rh.controller.bootstrap, cl.template_vars.ctl: rh.controller, cl.template_vars.pin: _rh_clr_pin} }}"
        rh_rsv_record:
          name: "{{ cl.publish_rows.record }}"
          rel: "{{ cl.binding.rel }}"
          mode: "{{ cl.binding.mode }}"
          content: "{{ _rh_clr_bdoc | to_nice_yaml }}"
        # the artifact digest the binding binds: N10's rendered digest here, the independently measured one below
        _rh_clr_asha: "{{ _rh_ra_rendered[cl.publish_rows.render].sha256 }}"
        # the ONE binding document expression (the anchor is re-used verbatim by the independent readback below):
        # OWED-B-SR327-PUB: each value is keyed by the field its ROLE names (cl.binding.field_roles[<role>], s32 :1026;
        # r19 :5529-5531 bijection), never by position; the absent override is cl.binding.override_none; nested pairs
        # keyed by source_admission.tool_fields / record_fields words; the schema under step_record.emit keys.schema
        _rh_clr_bdoc: &clr_bind >-
            {{ {cl.binding.field_roles.artifact_file: cl.artifact.file,
                cl.binding.field_roles.artifact_sha256: _rh_clr_asha,
                cl.binding.field_roles.publication_dir: lookup('ansible.builtin.vars', cl.dest_var),
                cl.binding.field_roles.template_sha256:
                  (_rh_src_inputs.results | selectattr('item', 'equalto', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ cl.template_rel) | map(attribute='stat.checksum') | first),
                cl.binding.field_roles.inputs_sha256:
                  ((dict(_rh_src_inputs.results | map(attribute='item')
                         | map('regex_replace', '^' ~ ((rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | regex_escape), '')
                         | zip(_rh_src_inputs.results | map(attribute='stat.checksum')) | map('list') | list)
                    | to_json(sort_keys=true)) | hash(_rh_sa_decl.digest_algorithm)),
                cl.binding.field_roles.policy_sha256: rh_config_revision,
                cl.binding.field_roles.profile_sha256: _rh_sa_text | hash(_rh_sa_decl.digest_algorithm),
                cl.binding.field_roles.declaration_sha256: _rh_sa_text | hash(_rh_sa_decl.digest_algorithm),
                cl.binding.field_roles.override:
                  ({_rh_clr_tf.path: lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles.path),
                    _rh_clr_tf.sha256: lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.override_input_roles.sha256)}
                   if _rh_rf_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                   else cl.binding.override_none),
                cl.binding.field_roles.inventory: {_rh_clr_tf.path: ansible_inventory_sources | first, _rh_clr_tf.sha256: _rh_clr_inv.results[0].stat.checksum},
                cl.binding.field_roles.builder: rh_builder,
                cl.binding.field_roles.source:
                  {_rh_sa_decl.record_fields.edition: _rh_src_git.results[0].stdout,
                   _rh_sa_decl.record_fields.git: _rh_src_git.results[1].stdout | hash(_rh_sa_decl.digest_algorithm)}}
               | combine({rh.controller.bootstrap.genesis.launch.step_record.emit['keys'].schema: cl.binding.schema}) }}

    # INDEPENDENT FINAL ADMISSION (the N9 :580-657 form): its own reads, never N13's readback.
    - name: Stat the published consumer and its binding (no link followed)
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      loop:
        - "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.artifact.file }}"
        - "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.binding.rel }}"
      register: _rh_clr_fin

    - name: Read the published binding back (one read)
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
      ansible.builtin.slurp:
        src: "{{ lookup('ansible.builtin.vars', cl.dest_var) ~ rh.controller.bootstrap.path_admission.separator ~ cl.binding.rel }}"
      register: _rh_clr_bind

    - name: Refuse a published consumer that is not a fresh render bound by its exact binding with the measured pin
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clr_ck: "{{ rh.controller.bootstrap.genesis.launch.step_record.context['keys'] }}"
        _rh_clr_mk: "{{ rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys }}"
        _rh_clr_tf: "{{ rh.controller.bootstrap.source_admission.tool_fields }}"
        _rh_clr_pin: *clr_pin
        _rh_clr_art: >-
          {{ lookup('ansible.builtin.file', lookup('ansible.builtin.vars', cl.dest_var)
                    ~ rh.controller.bootstrap.path_admission.separator ~ cl.artifact.file, rstrip=false) }}
        _rh_clr_doc: "{{ _rh_clr_bind.content | b64decode | from_yaml }}"
        # the EXPECTED binding reproduced from the admitted inputs with the INDEPENDENTLY measured artifact digest
        _rh_clr_asha: "{{ _rh_clr_fin.results[0].stat.checksum }}"
        _rh_clr_bdoc: *clr_bind
      ansible.builtin.assert:
        that:
          # SR-913 :351: one regular unlinked file per declared publication row (cl.publish_rows), not a count literal
          - (_rh_clr_fin.results | map(attribute='stat') | selectattr('exists') | selectattr('isreg') | rejectattr('islnk') | list | length) == (cl.publish_rows | length)
          - _rh_clr_fin.results[0].stat.mode == cl.artifact.mode
          - _rh_clr_fin.results[1].stat.mode == cl.binding.mode
          - _rh_clr_fin.results | map(attribute='stat.uid') | reject('equalto', rh_builder.uid | int) | list | length == 0
          # the EXPECTED consumer reproduced from the admitted inputs: a FRESH render with the same template_vars
          - >-
            _rh_clr_fin.results[0].stat.checksum
            == lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ cl.template_rel,
                      template_vars={cl.template_vars.bs: rh.controller.bootstrap, cl.template_vars.ctl: rh.controller,
                                     cl.template_vars.pin: _rh_clr_pin}) | hash(_rh_sa_decl.digest_algorithm)
          - (_rh_clr_art | hash(_rh_sa_decl.digest_algorithm)) == _rh_clr_fin.results[0].stat.checksum
          # the measured pin is baked, no pin marker is
          - (_rh_sa_text | hash(_rh_sa_decl.digest_algorithm)) in _rh_clr_art
          - cl.pin.values() | select('string') | select('in', _rh_clr_art) | list | length == 0
          # the binding: exactly the schema word + the declared fields, binding THIS artifact, pin, edition and directory
          - _rh_clr_fin.results[1].stat.checksum == ((_rh_clr_bind.content | b64decode) | hash(_rh_sa_decl.digest_algorithm))
          - >-
            (_rh_clr_doc.keys() | list | sort)
            == ((cl.binding.fields + [rh.controller.bootstrap.genesis.launch.step_record.emit['keys'].schema]) | sort)
          - _rh_clr_doc[rh.controller.bootstrap.genesis.launch.step_record.emit['keys'].schema] == cl.binding.schema
          # the whole binding equals the expected document (artifact, directory, template, inputs, pin, override,
          # inventory, builder and source edition), compared as one structure
          - (_rh_clr_doc | to_json(sort_keys=true)) == (_rh_clr_bdoc | to_json(sort_keys=true))
        fail_msg: >-
          REFUSED {{ cl.refusals.source }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.binding }}
          {{ _rh_clr_fin.results | map(attribute='item') | list | to_json }}
        quiet: true

    # codex-tick914 (1) BUDGET: the caps are an explicit MAXIMUM allocation, never a size proof. The measured managed
    # rendered / staged bytes N13 reports (_rh_rsv_bytes) are printed beside the frozen allocation (the N9 :667 form);
    # an over-cap render is refused by N10 / N13 before any publication (rh_rsv_max_bytes above).
    - name: Report the consumer release (the receipt is the binding; MAIN admits the consumer independently before OP-2)
      vars:
        cl: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
      ansible.builtin.debug:
        msg: >-
          {{ cl.phase_prefix }}{{ _rh_rsv_outcome }}
          {{ lookup('ansible.builtin.vars', cl.dest_var) }}
          {{ cl.artifact.file }} {{ _rh_clr_fin.results[0].stat.checksum }}
          {{ cl.binding.rel }} {{ _rh_clr_fin.results[1].stat.checksum }}
          {{ rh_rel_edition }} {{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }} {{ rh_builder.executable }}
          {{ _rh_rsv_bytes | to_json(sort_keys=true) }} {{ cl.budget.payload_max_bytes | to_json(sort_keys=true) }}
