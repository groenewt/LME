---
# testing/remote_harness/target_prereq.cases.yml -- DECLARED CASES for testing/remote_harness/target_prereq.yml
# (codex-tick318-321 item 3; codex tick320 findings 1-4). STATUS: DECLARED, NO RUNNER, NOT EVIDENCE. Nothing reads
# this file; no case has run. Each case needs a DISPOSABLE VM target (never graph, never a physical host, never
# silmaril) reached through the privileged contract, and MAIN (root) to set up its pre-state. Every case states its
# pre-state, the expected refusal or record, and `unchanged`: the paths whose before/after stat (type, uid, gid, mode,
# sha256 where a file) must be byte-equal -- a refusal makes no deployment-state mutation (ordinary admitted Ansible
# module staging under the root module temp still occurs and is not a listed path).
# Refusal codes: RH-TARGET-PREREQ (tp.refusal), -KEY-RESUME, -DRIFT, -PREFLIGHT, -CAPACITY (tp.hypervisor.capacity.
# refusal), RH-TARGET-PREREQ-SSH-INTERCEPT (tp.endpoint.refusal), RH-TARGET-PREREQ-DERIVED-OUTPUT-PINNED (bare names),
# RESERVED-FAMILY-DERIVED-OUTPUT-PINNED / RESERVED-FAMILY-REGISTRY (B's family guard, codex-tick333 (2)),
# RH-TARGET-PREREQ-PRESERVATION (tp.preservation.refusal, decl r4) and RH-TARGET-PREREQ-OBSERVE
# (testing/e2e/target_prereq/prereq_observe.yml). Every case needs decl REVISION 4 registered (OB07 is the neighbour).
# PRESERVATION BASIS DEFAULT (decl r4: every member needs a basis before contact): every case that does not state its
# own preservation inputs (KR*, DR*, SA*, LT*, PF*, PK01) binds prereq_verified_no_prior_deployment: true and
# obs_unit_patterns: [lme-tpcase-*] with NO matching unit on the VM; without it each would refuse PV04 instead.
# <home>, <ak> (= <home>/.ssh/authorized_keys), <journal>, <work root>, <storage root>, <marker> are the leg's bound
# values; `journal:` gives the op states the pre-state journal holds (root:root 0600, bound to this owner/key).
schema: lme-target-prereq-cases/v1
status: declared_unrun
cases:
  # ---------------- tick320 (1) PREREQ-KEY-RESUME: interrupted resume ----------------
  - id: KR01-interrupted-after-key-install-exact-file-observation-only
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: started, linger: pending}
      target: <ak> is the exact owner key line (u:g 0600, sha256 == authorized_sha256); .ssh u:g 0700
      note: the run was killed after the copy and before the `done` journal write; an owner process MAY exist
    expect:
      rc: 0
      authorized_key: marked done WITHOUT a write (the copy task is skipped; only `pending` installs)
      record: prereq.json journal.ops.authorized_key == done; resumed_from.authorized_key == started
    unchanged: [<home>, <home>/.ssh, <ak>]
  - id: KR02-interrupted-after-key-install-file-absent-refused
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: started, linger: pending}
      target: <ak> ABSENT (e.g. deleted by an owner process after key login)
    expect: {rc: fail, out: [RH-TARGET-PREREQ-KEY-RESUME, 'authorized_key=started']}
    unchanged: [<home>, <home>/.ssh, <journal>]
  - id: KR03-interrupted-after-key-install-file-differs-refused
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: started}
      target: <ak> holds a second key line appended (sha256 != authorized_sha256)
    expect: {rc: fail, out: [RH-TARGET-PREREQ-KEY-RESUME]}
    unchanged: [<home>, <home>/.ssh, <ak>, <journal>]
  - id: KR04-owner-path-replacement-ssh-dir-symlink-refused
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: started}
      target: <home>/.ssh replaced by a symlink to /root/.ssh (owner process after key login)
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, ssh_dir]}      # the resume read-back of done ssh_dir fires first
    unchanged: [<home>, <home>/.ssh, /root/.ssh, /root/.ssh/authorized_keys, <journal>]
  - id: KR05-owner-path-replacement-ak-symlink-refused
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: started}
      target: <ak> replaced by a symlink to /etc/shadow
    expect: {rc: fail, out: [RH-TARGET-PREREQ-KEY-RESUME]}
    unchanged: [<ak>, /etc/shadow, <journal>]
  - id: KR06-pending-key-pre-existing-file-refused
    finding: PREREQ-KEY-RESUME
    pre_state:
      journal: {account: done, ssh_dir: done, authorized_key: pending}
      target: <ak> exists (anything) although no run of this leg started the key op
    expect: {rc: fail, out: [RH-TARGET-PREREQ-KEY-RESUME, 'authorized_key=pending']}
    unchanged: [<ak>, <journal>]
  - id: KR07-interrupted-account-existing-observation-only
    finding: PREREQ-KEY-RESUME (existing_account)
    pre_state:
      journal: {account: started}
      target: the campaign account exists (created before the interruption), +kvm on a hypervisor member
    expect:
      rc: 0
      account: the account module is NOT run (no usermod); journal account done with the observed uid
    unchanged: [/etc/passwd, /etc/group, /etc/shadow]

  # ---------------- tick320 (2) PREREQ-DONE-READBACK: completed-state drift ----------------
  - id: DR01-completed-authorized-keys-changed-refused
    finding: PREREQ-DONE-READBACK
    pre_state:
      journal: all ops done (a completed run)
      target: <ak> content changed (a second key line)
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, authorized_key, '(resume)']}
    unchanged: [<ak>, <journal>, <work root>]
  - id: DR02-completed-missing-child-refused
    finding: PREREQ-DONE-READBACK
    pre_state:
      journal: all ops done
      target: <work root>/bundles removed
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, work_children]}
    unchanged: [<work root>, <journal>]
    note: never re-created (never repair foreign state)
  - id: DR03-completed-work-root-mode-drift-refused
    finding: PREREQ-DONE-READBACK
    pre_state: {journal: all ops done, target: '<work root> chmod 0750'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, work_root, work_handover]}
    unchanged: [<work root>, <journal>]
  - id: DR04-completed-linger-marker-removed-refused
    finding: PREREQ-DONE-READBACK
    pre_state: {journal: all ops done, target: '<marker> removed (loginctl disable-linger)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, linger]}
    unchanged: [<marker>, <journal>]
  - id: DR05-completed-account-shell-changed-refused
    finding: PREREQ-DONE-READBACK
    pre_state: {journal: all ops done, target: 'owner shell changed to /usr/sbin/nologin'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ]}                     # classified foreign before the read-back
    unchanged: [/etc/passwd, <journal>]
  - id: DR06-completed-storage-root-group-drift-refused
    finding: PREREQ-DONE-READBACK
    pre_state: {journal: all ops done (hypervisor member), target: '<storage root> chgrp to kvm'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, storage_root]}
    unchanged: [<storage root>, <journal>]
  - id: DR07-completed-clean-rerun-no-write
    finding: PREREQ-DONE-READBACK (neighbour)
    pre_state: {journal: all ops done, target: exact end state}
    expect: {rc: 0, record: 'prereq.json end_readback.drift == []'}
    unchanged: [<home>, <home>/.ssh, <ak>, <marker>, <work root>, <storage root>, <journal>]

  # ---------------- tick320 (3) PREREQ-STORAGE-ADOPTION ----------------
  - id: SA01-storage-root-group-mismatch-refused-before-mutation
    finding: PREREQ-STORAGE-ADOPTION
    pre_state:
      journal: {storage_root: pending, all earlier ops: done}
      target: <storage root> exists owner uid, gid of another group, 0700
    expect: {rc: fail, out: [RH-TARGET-PREREQ, 'uid, gid, mode']}
    unchanged: [<storage root>, <journal>]
  - id: SA02-storage-root-exact-observation-only
    finding: PREREQ-STORAGE-ADOPTION
    pre_state:
      journal: {storage_root: pending, all earlier ops: done}
      target: <storage root> exists u:g 0700
    expect: {rc: 0, storage_root: done without the file task (skipped)}
    unchanged: [<storage root>]
  - id: SA03-adoption-journal-less-gid-mismatch-refused
    finding: PREREQ-STORAGE-ADOPTION (generalised to adoption)
    pre_state:
      journal: absent
      target: campaign account with the full end state except <home>/.ssh group = another gid
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DRIFT, '(adopt)', ssh_dir]}
    unchanged: [<home>/.ssh, <ak>]
    note: no journal is written (the read-back precedes the journal write)

  # ---------------- tick320 (4) PREREQ-LINGER-TOOL ----------------
  - id: LT01-linger-tool-identity-mismatch-refused-in-preflight
    finding: PREREQ-LINGER-TOOL
    pre_state: {target: 'os_tools.loginctl.path replaced by a different binary (sha256 != identity)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, linger tool], record: 'prereq-preflight.json linger_tool.ok == false'}
    unchanged: [<marker>]
  - id: LT02-linger-tool-swapped-between-preflight-and-use-refused
    finding: PREREQ-LINGER-TOOL
    pre_state: {target: 'loginctl swapped after the preflight record, before op linger (declared race; injected by MAIN)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ, 'is not the admitted os_tools.loginctl']}
    unchanged: [<marker>]
  - id: LT03-linger-tool-not-registered-refused-before-contact
    finding: PREREQ-LINGER-TOOL
    pre_state: {policy: 'os_tools has no loginctl entry, or it lacks required_by target_prereq'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ, 'os_tools.loginctl'], contacted: false}

  # ---------------- item 3: PREFLIGHT records (also when refusing) ----------------
  # PREREQ-PREFLIGHT-NEWLINE (codex-tick333): the capacity and listener cases carry REAL multi-line fixture content
  # (YAML literal blocks: one physical line per /proc line, newline-terminated). The runner (none yet) presents it as
  # the slurped file of the named path; target_prereq.yml splits it with str.splitlines(). Budget = 13312 + 2048 =
  # 15360 MiB (never lowered); MiB = kB // 1024.
  - id: PF01-capacity-never-fits-recorded-then-refused
    finding: PREFLIGHT capacity (PREREQ-PREFLIGHT-NEWLINE fixture)
    pre_state:
      target: hypervisor member
      fixture:
        /proc/meminfo: |
          MemTotal:       15000000 kB
          MemFree:         9000000 kB
          MemAvailable:   12000000 kB
          Buffers:          200000 kB
          Cached:          2500000 kB
          SwapTotal:       1000000 kB
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-CAPACITY, 'MemTotal 14648 MiB < budget 15360 MiB']
      record: >-
        prereq-preflight.json exists (0600) with capacity {mem_total_mib: 14648, mem_available_mib: 11718, budget_mib:
        15360, shortfall_mib: 712, available_now_ge_budget: false, class: never_fits, admits_provision: false,
        alternatives: tp.hypervisor.capacity.alternatives}
      discriminates: 'a split that does not break the lines yields class unmeasured and mem_total_mib -1, which fails this case'
    unchanged: ['/etc/passwd', <work root>, <storage root>, /var/lib/lme-target-prereq]
  - id: PF02-capacity-total-holds-budget-recorded
    finding: PREFLIGHT capacity (neighbour; PREREQ-PREFLIGHT-NEWLINE fixture)
    pre_state:
      target: hypervisor member (every other preflight observation clean)
      fixture:
        /proc/meminfo: |
          MemTotal:       16233868 kB
          MemFree:         1200000 kB
          MemAvailable:    9000000 kB
          Buffers:          150000 kB
          Cached:          6000000 kB
    expect:
      rc: 0
      record: >-
        capacity {mem_total_mib: 15853, mem_available_mib: 8789, budget_mib: 15360, shortfall_mib: 0,
        available_now_ge_budget: false, class: total_holds_budget, admits_provision: false, alternatives: []}; refusals []
      discriminates: 'an unsplit meminfo refuses (unmeasured) instead of passing'
  - id: PF02b-capacity-available-line-missing-unmeasured-refused
    finding: PREFLIGHT capacity (missing measurement keeps its refusal)
    pre_state:
      target: hypervisor member
      fixture:
        /proc/meminfo: |
          MemTotal:       16233868 kB
          MemFree:         1200000 kB
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-CAPACITY]
      record: 'capacity {mem_total_mib: 15853, mem_available_mib: -1, class: unmeasured, shortfall_mib: 0}'
  - id: PF09-listener-count-per-source-recorded
    finding: PREFLIGHT endpoint listeners (PREREQ-PREFLIGHT-NEWLINE fixture; record only, never an admission)
    pre_state:
      target: every other preflight observation clean
      env: {SSH_CONNECTION: '192.0.2.20 51514 192.0.2.10 22'}
      fixture:
        /proc/net/tcp: |2
            sl  local_address rem_address   st tx_queue rx_queue tr tm->when retrnsmt   uid  timeout inode
             0: 00000000:0016 00000000:0000 0A 00000000:00000000 00:00000000 00000000     0        0 21345 1 0000000000000000 100 0 0 10 0
             1: 0100007F:0CEA 00000000:0000 0A 00000000:00000000 00:00000000 00000000     0        0 22001 1 0000000000000000 100 0 0 10 0
             2: 0A0200C0:0016 140200C0:C8FA 01 00000000:00000000 02:0009A1C3 00000000     0        0 23456 4 0000000000000000 20 4 29 10 -1
        /proc/net/tcp6: |2
            sl  local_address                         remote_address                        st tx_queue rx_queue tr tm->when retrnsmt   uid  timeout inode
             0: 00000000000000000000000000000000:0016 00000000000000000000000000000000:0000 0A 00000000:00000000 00:00000000 00000000     0        0 21347 1 0000000000000000 100 0 0 10 0
    expect:
      rc: 0
      record: >-
        endpoint {ssh_connection_port: 22, listeners_on_port: {/proc/net/tcp: 1, /proc/net/tcp6: 1}} -- the
        established :0016 row (st 01) and the :0CEA listener are not counted
      discriminates: 'an unsplit source yields 0 for both (one line whose start is the header), which fails this case'
  - id: PF09b-listener-source-absent-recorded
    finding: PREFLIGHT endpoint listeners (an IPv6-disabled host)
    pre_state:
      env: {SSH_CONNECTION: '192.0.2.20 51514 192.0.2.10 22'}
      fixture:
        /proc/net/tcp: |2
            sl  local_address rem_address   st tx_queue rx_queue tr tm->when retrnsmt   uid  timeout inode
             0: 00000000:0016 00000000:0000 0A 00000000:00000000 00:00000000 00000000     0        0 21345 1 0000000000000000 100 0 0 10 0
        /proc/net/tcp6: absent
    expect: {rc: 0, record: 'listeners_on_port {/proc/net/tcp: 1} (no tcp6 key: the source was not read)'}
  - id: PF03-data-owner-mode-refused-recorded
    finding: PREFLIGHT /data
    pre_state: {target: '/data owned by a non-root user (or mode 0777) above the work parent'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, root-only component /data], record: 'paths["/data"] recorded'}
    unchanged: [/data]
  - id: PF04-tailscale-ssh-intercept-refused-recorded
    finding: PREFLIGHT endpoint
    pre_state: {target: 'the contract endpoint is served by Tailscale SSH (tailscaled ancestor)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-SSH-INTERCEPT], record: 'endpoint.ancestry recorded'}
  - id: PF05-preserved-unit-running-refused-recorded
    finding: PREFLIGHT preservation (decl r4; was `preserved units`, r3)
    pre_state: {target: 'a declared known_set member (prereq_preserved_units, expected inactive_not_enabled) is running'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-PRESERVATION, 'observed running'], record: 'prereq-preflight.json (schema lme-target-prereq-preflight/v2) preservation.members.<unit>.outcome == running'}
    unchanged: ['the unit state (never started/stopped/enabled/disabled/masked)']
  - id: PF06-contact-refused-rescued-into-record
    finding: PREFLIGHT contact
    pre_state: {target: 'the privileged system interpreter is not the declared version'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, 'preflight stopped at'], record: 'contact not_admitted'}
  - id: PF07-unreachable-target-no-record
    finding: PREFLIGHT limit (declared)
    pre_state: {target: unreachable}
    expect: {rc: fail, record: absent}
    note: Ansible does not rescue an unreachable host; any_errors_fatal ends the run before the record play
  - id: PF08-forged-derived-output-refused-before-contact
    finding: first-entry guard (family, codex-tick333 (2))
    pre_state: {invocation: '-e tp_ctl={...} (or an inventory host var tp_pre on the target)'}
    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED, "'tp_ctl'"], contacted: false, record: absent}
    note: >-
      the family guard (testing/e2e/transfer/tasks/refuse_reserved_families.yml) refuses tp_ctl before any include
      path, lookup or privilege selection reads it. GATED on C1's pattern hunk: until reserved_prereq_vars is registered
      every run of this entry refuses RESERVED-FAMILY-REGISTRY instead (the atomic join), so this case AND every positive
      case of this file are red until then.
  # ---------------- codex-tick333 (2): reserved name FAMILIES + bare names (pinned toolchain, extra vars) ----------------
  - id: PF10-forged-unlisted-family-member-refused
    finding: family guard (a tp_ name this leg never derives is still reserved)
    pre_state: {invocation: '-e tp_novel=1'}
    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED, "'tp_novel'"], contacted: false, record: absent}
  - id: PF11-forged-underscore-family-member-refused
    finding: family guard (_tp_ prefix)
    pre_state: {invocation: '-e _tp_x=1'}
    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED, "'_tp_x'"], contacted: false, record: absent}
  - id: PF12-forged-transfer-family-member-refused
    finding: family guard (tr_ family on this leg too; tr_conn would select the privileged connection)
    pre_state: {invocation: '-e tr_conn={...}'}
    expect: {rc: fail, out: [RESERVED-FAMILY-DERIVED-OUTPUT-PINNED, "'tr_conn'"], contacted: false, record: absent}
  - id: PF13-forged-bare-name-refused
    finding: bare exact reservation (no family matches `tp` / `tr`)
    pre_state: {invocation: '-e tp={...}   (and separately -e tr={...})'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-DERIVED-OUTPUT-PINNED, "'tp'"], contacted: false, record: absent}
    note: after C1 reserves tp / tr exactly, the route's refuse_pinned_outputs.yml refuses first (its own token); either refusal passes this case
  - id: PF14-legitimate-public-inputs-admitted
    finding: family guard positive (declared public namespaces never match a family)
    pre_state:
      invocation: 'the documented -e lme_transfer_target / lme_transfer_ssh_key / lme_transfer_state_dir / lme_transfer_label only'
      target: a disposable VM whose prereqs are already all done
    expect: {rc: 0, out_absent: [RESERVED-FAMILY, DERIVED-OUTPUT-PINNED], record: 'prereq.json written; every op observation-only'}
    note: GATED on C1's pattern hunk (see PF08)
  # ---------------- J-KEY C2 rule applied to this consumer (codex-tick350 JKEY-UNVALIDATED-PUBLIC-FILE-EXPOSURE) -------
  - id: PK01-unvalidated-owner-pub-not-exposed
    finding: the owner .pub is read, matched and refused under no_log (SYNTHETIC data only; never a real key)
    pre_state:
      invocation: the documented inputs
      controller: the bound owner_pubkey file holds the synthetic lines '-----BEGIN OPENSSH PRIVATE KEY-----' /
        'TPSYNTHETICJUNKNOTAKEYcccccccccccccccccccccccccccc' / '-----END OPENSSH PRIVATE KEY-----'
    expect: {rc: fail, out: [RH-TARGET-PREREQ, 'never admitted'], out_absent: ['BEGIN OPENSSH', 'PRIVATE KEY', TPSYNTHETICJUNK, cccccccccccccccc], contacted: false, record: absent}
  # ---------------- codex-tick360 PRESERVATION (decl r4 `preservation`; testing/e2e/target_prereq/tasks/prereq_preflight.yml) ----
  # Bound roles: prereq_preserved_units (-> inactive_not_enabled), prereq_retired_units (-> retired_absent),
  # prereq_verified_no_prior_deployment (bool), obs_unit_patterns (discovery selectors). <u> = a synthetic unit
  # lme-tpcase-<n>.service installed by MAIN on the disposable VM; never a real LME unit, never graph.
# COVERAGE LIMITS (codex-tick370; no case here can prove more): service_facts lists SYSTEM .service units only -- no
# .timer / .socket / .path units and no user-manager units; status `generated` is ADMITTED despite possible autostart
# until ownership/lifecycle evidence is joined; ABSENT = not listed, or status in absent_status [not-found] AND state
# in absent_states [inactive] -- a listed not-found unit is reported `running` or `stopped` (sub-state only), so it is
# never proven inactive and refuses loaded_without_unit_file (PV10-PV14; join TP4-ACTIVESTATE-PROBE).
# "not listed" = no unit file AND not loaded (never started, or stopped then removed + daemon-reload, no reference).
  - id: PV01-known-member-absent-refused-never-shrunk
    finding: codex-tick360 rule 3 (absence must not silently shrink a known set)
    pre_state: {inputs: 'known_set members [<u1>, <u2>] (inactive_not_enabled)', target: '<u1> present inactive disabled; <u2> has no unit file and is not loaded (not listed)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-PRESERVATION, '<u2> is declared inactive_not_enabled but observed absent'], record: 'preservation.members has BOTH <u1> (as_expected) and <u2> (absent, route.mechanism null)'}
    unchanged: [<u1>, /etc/passwd, <work root>]
    discriminates: 'a consumer that filters the declared set to observed units passes (rc 0) and fails this case'
  - id: PV02-verified-none-with-discovery-match-refused
    finding: codex-tick360 rule 3 (verified_none is verified, not assumed)
    pre_state: {inputs: 'prereq_verified_no_prior_deployment true, obs_unit_patterns [lme-tpcase-*]', target: '<u1> present, inactive'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION, 'declared verified_none'], record: 'preservation.outside_known.<u1> recorded'}
    unchanged: [<u1>]
  - id: PV03-active-known-member-recorded-routed-refused-untouched
    finding: codex-tick360 rule 5 (an active authorized old unit is recorded and routed; never filtered out; unrelated units never stopped)
    pre_state: {inputs: 'known_set [<u1>] inactive_not_enabled; obs_unit_patterns [lme-tpcase-*]', target: '<u1> RUNNING; <u9> (lme-tpcase-9, not declared) running'}
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PRESERVATION, 'observed running', testing/e2e/reclaim/reclaim.yml, native_service_remove, obstructed]
      record: 'members.<u1> {outcome: running, route.op: native_service_remove, route.status: obstructed}; outside_known.<u9> recorded AND refused (unclassified running)'
    unchanged: ['<u1> ActiveState/UnitFileState (still running)', '<u9> ActiveState (still running)']
  - id: PV04-basis-absent-refused-before-contact
    finding: codex-tick360 rule 3 (explicit expectation; no hypervisor implication)
    pre_state: {inputs: 'no prereq_preserved_units, no prereq_retired_units, no prereq_verified_no_prior_deployment (hypervisor member AND, separately, a non-hypervisor member)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION, 'basis is undeclared'], contacted: false, record: absent}
  - id: PV05-conflicting-basis-refused-before-contact
    finding: basis vocabulary (exactly one)
    pre_state: {inputs: '(a) <u1> in both prereq_preserved_units and prereq_retired_units; (b) verified_none true plus a member; (c) prereq_verified_no_prior_deployment false'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION, 'basis is conflicting'], contacted: false, record: absent}
  - id: PV06-hypervisor-verified-none-clean-admitted
    finding: codex-tick360 rule 3 neighbour (a fresh hypervisor needs no old stack; the r3 non-empty-list refusal is gone)
    pre_state: {inputs: 'hypervisor member; verified_none true; obs_unit_patterns [lme-tpcase-*]', target: 'no matching unit'}
    expect: {rc: 0, record: 'preflight preservation {basis: verified_none, evaluated: true, members: {}, outside_known: {}, refusals: []}'}
  - id: PV07-retired-member-present-again-refused-routed
    finding: interrupted / reverted retirement
    pre_state: {inputs: 'known_set: prereq_retired_units [<u3>]', target: '<u3> unit file present, inactive'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION, present_after_retirement, native_service_remove]}
    unchanged: [<u3>]
  - id: PV08-known-member-enabled-inactive-refused
    finding: expected-state neighbour (not running but enabled)
    pre_state: {inputs: 'known_set [<u1>] inactive_not_enabled', target: '<u1> inactive, UnitFileState enabled'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION, 'observed enabled']}
    unchanged: [<u1>]
  - id: PV09-unclassified-inactive-match-recorded-admitted
    finding: codex-tick360 rule 2 (observation grants no authority; an inactive unclassified match is evidence, not a refusal)
    pre_state: {inputs: 'known_set [<u1>]; obs_unit_patterns [lme-tpcase-*]', target: '<u1> inactive disabled; <u8> inactive (undeclared)'}
    expect: {rc: 0, record: 'outside_known.<u8> {state, status, source, selected_by: [selector]}; refusals []'}
  # codex-tick370 PREREQ-RUNNING-NOTFOUND-ABSENCE: a LOADED unit whose unit file vanished is never absent. Pre-state
  # recipe (MAIN, disposable VM): start <u>, remove its unit file, systemctl daemon-reload -- the unit stays listed with
  # LOAD not-found while its process runs (service_facts {state: running, status: not-found}).
  - id: PV10-known-member-running-not-found-refused-active
    finding: PREREQ-RUNNING-NOTFOUND-ABSENCE (known_set absent path)
    pre_state: {inputs: 'known_set [<u1>] inactive_not_enabled', target: '<u1> running, unit file removed + daemon-reload (state running, status not-found)'}
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PREFLIGHT, RH-TARGET-PREREQ-PRESERVATION, 'observed loaded_without_unit_file', native_service_remove, obstructed]
      record: 'members.<u1> {outcome: loaded_without_unit_file, observed: {state: running, status: not-found}, route.op: native_service_remove}'
    unchanged: ['<u1> ActiveState (still running)']
    discriminates: 'the pre-fix predicate (status not-found == absent) yields outcome absent with route.mechanism null, which fails this case'
  - id: PV11-retired-member-running-not-found-refused
    finding: PREREQ-RUNNING-NOTFOUND-ABSENCE (retired_absent)
    pre_state: {inputs: 'known_set: prereq_retired_units [<u3>]', target: '<u3> running, unit file removed + daemon-reload (state running, status not-found)'}
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PRESERVATION, '<u3> is declared retired_absent but observed loaded_without_unit_file', native_service_remove]
      record: 'members.<u3>.outcome == loaded_without_unit_file'
    unchanged: ['<u3> ActiveState (still running)']
    discriminates: 'the pre-fix predicate evaluates <u3> as_expected (retirement accepted while its process runs) and passes rc 0'
  - id: PV12-verified-none-running-not-found-match-refused
    finding: PREREQ-RUNNING-NOTFOUND-ABSENCE (verified_none discovery)
    pre_state: {inputs: 'prereq_verified_no_prior_deployment true, obs_unit_patterns [lme-tpcase-*]', target: '<u1> running, unit file removed + daemon-reload (state running, status not-found)'}
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PRESERVATION, 'declared verified_none', 'LOADED WITHOUT ITS UNIT FILE']
      record: 'preservation.outside_known.<u1> {state: running, status: not-found}'
    unchanged: ['<u1> ActiveState (still running)']
    discriminates: 'the pre-fix check (status not in absent_status) skips <u1> and passes rc 0'
  - id: PV13-retired-member-active-exited-not-found-refused
    finding: PREREQ-RUNNING-NOTFOUND-ABSENCE (absent_states choice; `stopped` is not inactivity)
    pre_state: {inputs: 'known_set: prereq_retired_units [<u4>]', target: '<u4> Type=oneshot RemainAfterExit=yes started (ActiveState active, SubState exited), unit file removed + daemon-reload (service_facts state stopped, status not-found)'}
    expect:
      rc: fail
      out: [RH-TARGET-PREREQ-PRESERVATION, loaded_without_unit_file]
      record: 'members.<u4> {outcome: loaded_without_unit_file, observed: {state: stopped, status: not-found}}'
    unchanged: ['<u4> ActiveState (still active)']
    discriminates: 'an absent_states that admits service_facts `stopped` accepts an ACTIVE unit as retired and fails this case'
  - id: PV14-retired-member-not-listed-admitted
    finding: PREREQ-RUNNING-NOTFOUND-ABSENCE (neighbour; absence proven by not listed)
    pre_state: {inputs: 'known_set: prereq_retired_units [<u5>]', target: '<u5> stopped, unit file removed + daemon-reload, no remaining reference (not listed by service_facts)'}
    expect: {rc: 0, record: 'members.<u5> {observed: null, outcome: as_expected}; refusals []'}
    note: a retirement that leaves a drop-in (e.g. graph's 90-lme-preserved-*.conf) keeps the unit loaded not-found and refuses until MAIN reconciles (TP4-ACTIVESTATE-PROBE)
  # ---------------- prereq_observe.yml (testing/e2e/target_prereq; MAIN-only, read-only, no owner key) ----------------
  - id: OB01-observe-no-owner-key-dependency
    finding: codex-tick360 rule 6 (no generated owner key; nothing an effect creates)
    pre_state: {inputs: 'owner_pubkey / owner_key bound to paths that DO NOT EXIST on the controller; the owner account absent on the target'}
    expect: {rc: 0, record: '<state dir>/gate.<label>.prereq-observe.json (0600) written; preflight.account.passwd null; no key file opened (strace-free proof: the paths do not exist and the run passes)'}
    unchanged: [the controller key paths (still absent), /etc/passwd]
  - id: OB02-observe-undeclared-basis-records-matches
    finding: observation before the lab declaration
    pre_state: {inputs: 'no basis roles; obs_unit_patterns [lme-tpcase-*]', target: '<u1> running, <u2> inactive'}
    expect: {rc: 0, record: 'preservation {basis: undeclared, evaluated: false, members: {}, outside_known: {<u1>, <u2>}, refusals: []}; findings exclude preservation'}
    unchanged: ['<u1> still running', <u2>]
  - id: OB03-observe-undeclared-basis-without-selector-refused
    finding: an observation that could see nothing is refused, not reported clean
    pre_state: {inputs: 'no basis roles, no obs_unit_patterns'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-PRESERVATION], contacted: false, record: absent}
  - id: OB04-observe-findings-recorded-not-enforced
    finding: observe never refuses on a finding once contact is admitted
    pre_state: {inputs: 'known_set [<u1>]', target: '<u1> running; /data mode 0777'}
    expect: {rc: 0, record: 'findings include RH-TARGET-PREREQ-PRESERVATION <u1> running and root-only component /data', rc_meaning: 'rc 0 WITH findings: the consumer reads the record, never the rc alone'}
    unchanged: ['<u1> still running', /data]
  - id: OB08-observe-rc0-with-observation-error-read-the-record
    finding: codex-tick370 coverage correction (c) -- rc 0 can include observation errors and preflight findings
    pre_state: {inputs: 'obs_paths [/mnt/lme-tpcase-fuse]', target: '/mnt/lme-tpcase-fuse is a FUSE mount without allow_other (root stat refused); every preflight observation otherwise clean'}
    expect:
      rc: 0
      record: 'contact admitted; obs_paths null; obs_paths_error starts "observation stopped at"; claim names the record, not the exit code, as the result'
      rc_meaning: 'rc 0 is NOT a clean observation: it includes observation errors (obs_paths_error, a rescued preflight stop in preflight.refusals) and findings; consumers read the record, never the rc alone'
    unchanged: [/mnt/lme-tpcase-fuse]
    discriminates: 'a consumer that treats rc 0 as "observed clean" misses the error and fails this case'
  - id: OB05-observe-contact-not-admitted-recorded-then-refused
    finding: observe record even on a failed contact
    pre_state: {target: 'the privileged system interpreter is not the declared version'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ-OBSERVE], record: 'contact not_admitted; obs_paths null'}
  - id: OB06-observe-obs-paths-chain-and-listing
    finding: evidence for obs_prior_dirs
    pre_state: {inputs: 'obs_paths [/data, /home]', target: '/data holds a dir, a file and a symlink; /home holds one home'}
    expect: {rc: 0, record: 'obs_paths./data.chain has / and /data {type, uid, gid, owner, group, mode}; listing has exactly the three children with type dir/file/link (link not followed); listing_depth 1'}
    unchanged: [/data, /home]
  - id: OB07-observe-unregistered-r4-refused-before-contact
    finding: inert until C1 registers revision 4
    pre_state: {policy: 'resolved target_prereq revision 3 (current profile)'}
    expect: {rc: fail, out: [RH-TARGET-PREREQ, 'revision 4'], contacted: false, record: absent}
