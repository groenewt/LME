                                 if _rh_rel_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                                 else rh.controller.bootstrap.genesis.initializer.custody.binding.override_none),
                              rh.controller.bootstrap.genesis.launch.step_record.context['keys'].controller_pair:
                                {rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.controller_pair.target: rh_controller_target,
                                 rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.controller_pair.connection: rh_controller_connection},
                              rh.controller.bootstrap.genesis.launch.step_record.context['keys'].inventory_digest:
                                (_rh_rel_inv.results[:(ansible_inventory_sources | length)] | map(attribute='stat.checksum') | list)}) }}
        rh_rsv_record:
          name: binding
          rel: "{{ rh.controller.bootstrap.genesis.initializer.custody.binding.rel }}"
          mode: "{{ rh.controller.bootstrap.genesis.initializer.custody.binding.mode }}"
          content: >-
            {{ {'schema': rh.controller.bootstrap.genesis.initializer.custody.binding.schema,
                'artifact_file': rh.controller.bootstrap.genesis.initializer.custody.artifact.file,
                'artifact_sha256': _rh_ra_rendered.artifact.sha256,
                'publication_dir': lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var),
                'template_sha256': (_rh_src_inputs.results | selectattr('item', 'equalto', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.initializer.custody.template_rel) | map(attribute='stat.checksum') | first),
                'inputs_sha256': (dict(_rh_src_inputs.results | map(attribute='item')
                                       | map('regex_replace', '^' ~ ((rh_repo_root ~ rh.controller.bootstrap.path_admission.separator) | regex_escape), '')
                                       | zip(_rh_src_inputs.results | map(attribute='stat.checksum')) | map('list') | list)
                                  | to_json(sort_keys=true)) | hash('sha256'),
                'policy_sha256': rh_config_revision,
                'profile_sha256': _rh_sa_text | hash(_rh_sa_decl.digest_algorithm),
                'declaration_sha256': _rh_sa_text | hash(_rh_sa_decl.digest_algorithm),
                'override': ({'path': rh_rel_override_path, 'sha256': rh_rel_override_sha256}
                             if _rh_rel_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                             else rh.controller.bootstrap.genesis.initializer.custody.binding.override_none),
                'inventory': {'path': ansible_inventory_sources | first, 'sha256': _rh_rel_inv.results[0].stat.checksum},
                'builder': rh_builder,
                'source': {'checkout': rh_repo_root,
                           'repo_head': _rh_src_git.results[0].stdout,
                           'worktree_status_sha256': _rh_src_git.results[1].stdout | hash('sha256'),
                           'worktree_dirty': _rh_src_git.results[1].stdout | length > 0}} | to_nice_yaml }}

    # INDEPENDENT FINAL ADMISSION (codex-tick652 OD-N13-01 = YES): reproduce the expected pin and output from the admitted
    # inputs, then independently re-read the served artifact and receipt. Its own reads, never N13's readback.
    - name: Stat the published artifact and binding (no link followed)
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) ~ rh.controller.bootstrap.path_admission.separator ~ item }}"
        follow: false
        get_checksum: true
        checksum_algorithm: sha256
      loop:
        - "{{ rh.controller.bootstrap.genesis.initializer.custody.artifact.file }}"
        - "{{ rh.controller.bootstrap.genesis.initializer.custody.binding.rel }}"
      register: _rh_rel_fin

    - name: Read the published binding back (one read)
      ansible.builtin.slurp:
        src: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.initializer.custody.binding.rel }}"
      register: _rh_rel_bind

    - name: Refuse a published release that is not a fresh render bound by its exact binding with the measured pin
      vars:
        _rh_rel_n7: >-
          {{ lookup('ansible.builtin.file', lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var)
                    ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.initializer.custody.artifact.file, rstrip=false) }}
        _rh_rel_pin: "{{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }}"
        _rh_rel_doc: "{{ _rh_rel_bind.content | b64decode | from_yaml }}"
      ansible.builtin.assert:
        that:
          - _rh_rel_fin.results | map(attribute='stat') | selectattr('exists') | selectattr('isreg') | rejectattr('islnk') | list | length == 2
          - _rh_rel_fin.results[0].stat.mode == rh.controller.bootstrap.genesis.initializer.custody.artifact.mode
          - _rh_rel_fin.results[1].stat.mode == rh.controller.bootstrap.genesis.initializer.custody.binding.mode
          - _rh_rel_fin.results | map(attribute='stat.uid') | reject('equalto', rh_builder.uid | int) | list | length == 0
          # the EXPECTED output reproduced from the admitted inputs: a FRESH render (not N13's readback)
          - >-
            _rh_rel_fin.results[0].stat.checksum
            == lookup('ansible.builtin.template', rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.initializer.custody.template_rel,
                      template_vars={'lme_init_bs': rh.controller.bootstrap, 'lme_init_ctl': rh.controller,
                                     'lme_init_pin': dict(rh.controller.bootstrap.genesis.initializer.custody.pin.keys()
                                                          | reject('in', rh.controller.bootstrap.genesis.launch.step_record.context['keys'].values() | list)
                                                          | zip([_rh_sa_text | hash(_rh_sa_decl.digest_algorithm)]))
                                                     | combine({rh.controller.bootstrap.genesis.launch.step_record.context['keys'].edition: rh_rel_edition,
                                                                rh.controller.bootstrap.genesis.launch.step_record.context['keys'].registry_digest: rh_rel_registry_sha256,
                                                                rh.controller.bootstrap.genesis.launch.step_record.context['keys'].a_receipt:
                                                                  {rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.a_receipt.path: rh_a_receipt[rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.a_receipt.path],
                                                                   rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.a_receipt.sha256: rh_a_receipt[rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.a_receipt.sha256]},
                                                                rh.controller.bootstrap.genesis.launch.step_record.context['keys'].override_digest:
                                                                  (rh_rel_override_sha256
                                                                   if _rh_rel_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                                                                   else rh.controller.bootstrap.genesis.initializer.custody.binding.override_none),
                                                                rh.controller.bootstrap.genesis.launch.step_record.context['keys'].controller_pair:
                                                                  {rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.controller_pair.target: rh_controller_target,
                                                                   rh.controller.bootstrap.genesis.launch.step_record.context.mapping_keys.controller_pair.connection: rh_controller_connection},
                                                                rh.controller.bootstrap.genesis.launch.step_record.context['keys'].inventory_digest:
                                                                  (_rh_rel_inv.results[:(ansible_inventory_sources | length)] | map(attribute='stat.checksum') | list)})}) | hash('sha256')
          - (_rh_rel_n7 | hash('sha256')) == _rh_rel_fin.results[0].stat.checksum
          # pin reproduction (codex-tick639): the measured pin is baked, the marker is not
          - _rh_rel_pin in _rh_rel_n7
          - rh.controller.bootstrap.genesis.initializer.custody.pin.declaration_sha256 not in _rh_rel_n7
          # the binding: exactly schema + the declared fields, binding THIS artifact, pin, edition, override and directory
          - _rh_rel_fin.results[1].stat.checksum == ((_rh_rel_bind.content | b64decode) | hash('sha256'))
          - (_rh_rel_doc.keys() | list | sort) == ((rh.controller.bootstrap.genesis.initializer.custody.binding.fields + ['schema']) | sort)
          - _rh_rel_doc.schema == rh.controller.bootstrap.genesis.initializer.custody.binding.schema
          - _rh_rel_doc.artifact_sha256 == _rh_rel_fin.results[0].stat.checksum
          - _rh_rel_doc.declaration_sha256 == rh_rel_declaration_sha256
          - _rh_rel_doc.source.repo_head == rh_rel_edition
          - _rh_rel_doc.publication_dir == lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var)
          - _rh_rel_doc.artifact_file == rh.controller.bootstrap.genesis.initializer.custody.artifact.file
          - >-
            _rh_rel_doc.override
            == ({'path': rh_rel_override_path, 'sha256': rh_rel_override_sha256}
                if _rh_rel_in[_rh_sa_reg.carrier_state.node.key] == _rh_sa_reg.carrier_state.node.words.present
                else rh.controller.bootstrap.genesis.initializer.custody.binding.override_none)
          # DEV-N9-01: the ACTUAL selected inventory bytes, re-measured independently
          - >-
            _rh_rel_doc.inventory
            == {'path': ansible_inventory_sources | first, 'sha256': _rh_rel_inv.results[0].stat.checksum}
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.refusals.binding }}:
          {{ rh.controller.bootstrap.genesis.initializer.custody.texts.binding }}
          {{ _rh_rel_fin.results | map(attribute='item') | list | to_json }}
        quiet: true

    - name: Report the release result (the receipt is the binding; MAIN admits N7 independently before use)
      ansible.builtin.debug:
        msg: >-
          GENESIS-RELEASE {{ _rh_rsv_outcome }}
          {{ lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.dest_var) }}
          artifact {{ rh.controller.bootstrap.genesis.initializer.custody.artifact.file }} sha256 {{ _rh_rel_fin.results[0].stat.checksum }}
          binding {{ rh.controller.bootstrap.genesis.initializer.custody.binding.rel }} sha256 {{ _rh_rel_fin.results[1].stat.checksum }}
          edition {{ rh_rel_edition }} declaration {{ _rh_sa_text | hash(_rh_sa_decl.digest_algorithm) }} builder {{ rh_builder.executable }}
          payload_bytes {{ _rh_rsv_bytes | to_json(sort_keys=true) }} caps {{ rh.controller.bootstrap.genesis.initializer.custody.budget.payload_max_bytes | to_json(sort_keys=true) }}
# FROZEN, no further writes
