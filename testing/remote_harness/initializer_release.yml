- name: Release the initial genesis initializer artifact (direct cold entry under admitted A; ALT-B)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    # codex-tick664: the first-entry guard also binds the canonical refusal value _rh_sa_rref (C1 S12E6-RPO-03), before
    # its earliest consumer below.
    - name: Refuse pre-supplied derived outputs, derive the repository root and bind the canonical refusal value
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, localhost, no become)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    # C1 S12E (codex-tick655 / 656; codex-tick662 registry route): the PUBLIC cold inputs, admitted from the ONE registry
    # set contract_admission.cold_inputs (raw; nothing of the declaration is readable yet). Protected outputs were refused
    # SEPARATELY by refuse_pinned_outputs.yml (_rh_rel_cibad is an exact reserved output, S12E-GL-03P). s09 (codex-tick751
    # trust_join; C1-RI-RPO-01): the contract is the protected retained value _rh_sa_reg the guard bound from its one
    # digest-before-parse capture; this entry no longer reads manifests/global.yml and binds no copy (consumer check).
    - name: Refuse a run without the guard-bound registry contract admission (consumer check; no lookup, no binding)
      ansible.builtin.assert:
        that:
          - _rh_sa_reg is mapping
          - _rh_sa_reg.cold_inputs is mapping
          - _rh_sa_reg.carrier_state is mapping
          - _rh_sa_reg.vocabulary is mapping
          - _rh_sa_regadm is mapping
          - _rh_sa_regadm.ingress is mapping
        fail_msg: >-
          REFUSED {{ _rh_sa_rref.input }}: the registry contract admission bound by the first-entry guard
          (tasks/refuse_pinned_outputs.yml, C1-RI-RPO-01) is unadmitted in this run; nothing is read.
        quiet: true

    - name: Refuse an absent, untyped or ungrammatical public cold input, or half the override pair (registry cold_inputs; raw)
      vars:
        _rh_rel_cibad: >-
          {%- set ns = namespace(bad=[]) -%}
          {%- for v, s in (_rh_sa_reg.cold_inputs.required | combine(_rh_sa_reg.cold_inputs.both_or_neither)).items() if v in vars -%}
          {%- set x = lookup('ansible.builtin.vars', v) -%}
          {%- if x is not string or x | length == 0 -%}{%- set ns.bad = ns.bad + [v] -%}
          {%- elif 'pattern' in s and _rh_sa_reg.patterns[s.pattern] is string and x is not match('(?:' ~ _rh_sa_reg.patterns[s.pattern] ~ ')\Z') -%}{%- set ns.bad = ns.bad + [v] -%}
          {%- elif 'pattern' in s and _rh_sa_reg.patterns[s.pattern] is mapping
                and (x is not match('(?:' ~ _rh_sa_reg.patterns[s.pattern].pattern ~ ')\Z')
                     or (x.split(_rh_sa_reg.path_law.separator) | select('in', _rh_sa_reg.patterns[s.pattern].refused_components) | list | length) > 0) -%}{%- set ns.bad = ns.bad + [v] -%}
          {%- endif -%}
          {%- endfor -%}{{ ns.bad }}
      ansible.builtin.assert:
        that:
          - _rh_sa_reg.cold_inputs.required.keys() | reject('in', vars) | list | length == 0
          - (_rh_sa_reg.cold_inputs.both_or_neither.keys() | select('in', vars) | list | length) in [0, 2]
          - _rh_rel_cibad | length == 0
          # genesis delta (codex-tick655, kept from s03): before the FIRST module the running controller python is the
          # admitted A interpreter (the typed row above admitted its grammar)
          - ansible_playbook_python == rh_rel_interpreter
        fail_msg: >-
          REFUSED {{ _rh_sa_rref.input }}: the initial release entry takes exactly the public cold
          inputs contract_admission.cold_inputs declares (every required one, the override pair both or neither), each a
          non-empty string of its declared grammar, and runs under the admitted interpreter {{ _rh_rel_cibad | to_json }}
        quiet: true

    # COLD-CARRIER-FORWARDING (codex-tick655): the ONE admitted carrier object (reserved fact); forwarded verbatim below.
    # s09 (codex-tick751 producer_semantics; C1-CS-GL-01): NO context (codex-tick740). The public optional pair was
    # admitted both-or-neither above; its ONE matching declared state is selected here (supplied-input detection of the
    # declared public inputs, not a fallback) and emitted as an explicit word; the carrier carries exactly that state's
    # fields. The s08 conditional empty-map combine is removed. Operator / attribute words are the registry vocabulary
    # (_rh_sa_reg.vocabulary); the state accessors .absent / .present are the carried N2 idiom.
    - name: Select the ONE declared override state of the cold carrier from the supplied public inputs (reserved fact)
      ansible.builtin.set_fact:
        _rh_rel_ovs: >-
          {{ _rh_sa_reg.carrier_state.node.words.present
             if (_rh_sa_reg.carrier_state.public_inputs.values() | select(_rh_sa_reg.vocabulary.tests.in, vars) | list | length) > 0
             else _rh_sa_reg.carrier_state.node.words.absent }}

    - name: Admit the cold carrier ONCE from the declared scalar inputs and the selected state (reserved fact; never regenerated)
      vars:
        # the declared public inputs of the selected state's fields (an empty selection for a state with no fields)
        _rh_rel_ovp: >-
          {{ _rh_sa_reg.carrier_state.public_inputs | dict2items
             | selectattr(_rh_sa_reg.vocabulary.attributes.item_key, _rh_sa_reg.vocabulary.tests.in,
                          _rh_sa_reg.carrier_state.node.fields.present
                          if _rh_rel_ovs == _rh_sa_reg.carrier_state.node.words.present
                          else _rh_sa_reg.carrier_state.node.fields.absent)
             | list }}
      ansible.builtin.set_fact:
        _rh_rel_in: >-
          {{ {'edition': rh_rel_edition,
              'declaration_rel': rh_rel_declaration_rel,
              'declaration_sha256': rh_rel_declaration_sha256,
