---
# testing/remote_harness/cold_launch_projection.yml -- X2P: THE COLD-LAUNCH ENVELOPE PROJECTOR, the earliest project-source
# operation of the OP-1 chain (C1 s33 genesis.initializer.custody.external_invocation.envelope_projection :1202-1253;
# codex 912 X4_preparse_projection, 913 concrete_projection_path, 914 Q-OP1-RENDER P-B1 / Q-OP1-BUDGET, 915).
# NEW FILE. NON-GENERATED. AUTHORED, NEVER EXECUTED (UNRUN). Change record: b/op1c-projector/records-b-op1c-projector-01.yml.
#   WHO RUNS IT   MAIN execs admitted A ONCE on this entry (stage envelope_projection.stage, a record_free_launches key,
#                 a resolve_phases.callers record_free row), after X1 (tool_bootstrap) and X2 (source_admission), before
#                 X3 and X4. Its own exec vector is the X2-boundary vector (codex 915 (1) base case; record
#                 X2P-EXEC), recorded by the X2 writer in the X2 record field `invocation` before this exec.
#   SAME ENGINE   tasks/admit_cold_launch.yml then tasks/admit_record_free_entry.yml, INCLUDED, never copied: the SOLE
#                 resolve (resolve_policy -> admit_loader_source -> the podman tasks_from resolve, loader
#                 source_admission.loader_rel), the record-free row, builder A (admit_builder). No second resolver, no
#                 parallel merge, no second provenance consumer.
#   ADMISSION     ONLY by the X2 provenance record: the ONE consumer x2_provenance_admission is route's join inside
#                 admit_record_free_entry (route op1c a3cec626 :102-332, CPL-SR328-ROUTE-JOIN), selected for this row by
#                 the walked envelope_projection.entry_from; every record field is bound there and any mismatch refuses
#                 with provenance.refusal_from before the include returns. This entry writes NOTHING before that include
#                 returns (CPL-OP1C-B-INCLUDE). The pre-parse first-entry guard and admit_cold_launch :61-65 still require a
#                 launch envelope for every entry (HOLE-OP1C-PREPARSE-ENVELOPE, C1 s34 ingress words owed): this entry
#                 refuses there until they land; no envelope is hand-built and no missing-envelope path is added.
#   OUTPUTS       the declared outputs (envelope / companions / argv) rendered from their declared template_rel by the
#                 macros their declared words name, published ONCE by the declared publish_rel (N13: rename of the
#                 staging dir onto the WHOLE output dir, which must be absent: created exclusive) at output_mode, then
#                 independently read back (fresh render, digests, parsed shapes; the companion map proved against the
#                 supplied companion inputs independently of the envelope output, codex 915 (2)).
#   BUDGET        codex 914 / 915 (4): budget.payload_max_bytes are MAXIMUM capacity allocations, never a size proof.
#                 N10 / N13 refuse an over-cap render or staged payload with NO publication. Total, reservation,
#                 retained obligation and the temp-fs probe are typed slots read from PROPOSED C1 words
#                 (envelope_projection.capacity, C1-SR328-W-CAPACITY). The measured staged bytes are printed beside the
#                 frozen caps. No enlargement; no publication after any refusal.
#   PROPOSED C1 WORDS read here (absent in s33: this entry fails closed at the first read, before any write):
#                 envelope_projection.template_vars, .publish_record, .capacity. Residual atoms (the include-var key and
#                 caller rel, N13 interface keys, the '=' of name=value words, shape-role order) are listed in the
#                 record (R-OP1C-RESIDUAL), not waived.
# OP1D (B successor; cp -n of op1c bc1bfe6e, then Edit; change record b/op1d-projector/records-b-op1d-projector-01.yml;
# codex 917 SR917-*, 918 SR918_CARRIER_SELECTION_ORDER; C1 s34 envelope_projection / first_invocation / override_carriage):
#   FIRST INVOCATION  direct A (s34 first_invocation.form direct_a): MAIN execs the receipt-bound A ansible-playbook under
#                 env -i and the declared genesis.launch env; the seed launcher route is RETIRED (op1c kept as evidence).
#                 tasks/verify_first_invocation.yml (B, executed bind) proves, before ANY output, that the X2 record's
#                 executed-kind field is exactly this process's vector, that the captured inputs are the bytes measured
#                 now, that the projector carrier carries the X2-admitted entry / registry closure rows (SR918), and the
#                 override pair's resolved effect (override LAST).
#   N10           every output (the argv record role included, N13-S06-RECORD-RENDER) is rendered by N10 successor-03 in
#                 the MODULE scope (the declared entry_generation.render options); the independent readback re-renders
#                 each published file through the SAME N10 operation (op verify), never a bare template lookup.
#   OWNER / PARENT / CAPACITY  the s34 words: owner_fact (the running uid measured by the custody tool_argv role, never
#                 rh_builder.uid), output_dir.parent (created only if absent by this stage, 0700, destination custody),
#                 capacity.need_bytes above the protected reserve, the temp filesystems measured on their real dirs.
# OP1E (B successor; cp -n of op1d cf41edc9, then Edit; change record b/op1e-projector/records-b-op1e-projector-01.yml;
# C1 s35 a50ebc66 / r22 ad3608f1 / s13 decl 29a1084a, sr918_reconcile_c1; codex 919): the play is the literal
# lme-cold-launch-projection (the ONLY play); the carrier is the s35 FINAL shape (admission then companion map; var
# names only through carrier.roles); the executing file and registry are bound to the admission BEFORE launch by the X2
# writer step tasks/x2_bind_exec_vector.yml (919 SR918_ACTUAL_EXECUTION_BINDING) and rechecked in-process by
# verify_first_invocation. rh_rsv_render_scope / rh_rsv_uid are r22 reserved_outputs.
# OP1F (B successor; cp -n of op1e 98a65b1e, then Edit; change record b/op1f-projector/records-b-op1f-projector-01.yml;
# C1 s37 6482c549 / r24 7e04ef09 / s15 42600902, sr919b_c1; codex 920 / 921; route op1g ARFE c48db433): the
# executed-bind verifier is no longer included here (single include site: route ARFE, CPL-SR919B-B-SINGLE-INCLUDE);
# the -e name=value separator is s37 run_local.caller_vars.form_separators.name_eq_value; the output dir creation
# words are s37 output_dir.words; the N13 caller passes the four write_bound.callers.params (N13 successor-07 /
# N10 successor-04 enforce capacity.write_bound before the first write; budget.expansion is PROPOSED by B in the
# x2p decl and stays HOLE-SR919B-X2P-EXPANSION until C1 places it -- until then every module-scope row REFUSES).
# OP1G (B successor; cp -n of op1f 76fc4330, then Edit; change record b/op1g-projector/records-b-op1g-projector-01.yml;
# C1 s39 76c1de8b / r26 ede8f4a6, sr922b_c1; codex 923; route op1i ARFE 19f61c14): each output role renders from its
# NARROWED input view (envelope_projection.input_view: bs / ctl views + the whole runtime map) and the module input bound
# measures that same per-role mapping (render rows, record row, op-verify rows); the write bound lives at
# controller.entry_generation.render.n10.write_bound and this entry's caller-site row there supplies rh_rsv_render_scope
# and rh_rsv_uid (N13 successor-08 / N10 successor-05); budget.expansion is C1's (HOLE-SR919B-X2P-EXPANSION closed by
# s39); the env -i pair separator is genesis.launch.env_pair_separator (HOLE-B-OP1F-ENV-PAIR-SEP closed).
# OP1H (B successor; cp -n of op1g 0ca14b2b, then Edit; change record b/op1h-projector/records-b-op1h-projector-01.yml;
# C1 s40 1903b690 / r27 11d80b96, sr922c_c1; codex 924 / 925 / 926): (1) the runtime map is DECLARED KEYS per role
# (input_view.runtime declared_keys): each role keeps exactly the keys its roles.<role>.rt paths reach (walked from
# controller.bootstrap: a mapping keeps every value, a string that one key); a declared key absent from the built map
# refuses BEFORE N13 (the runtime anchor moved to the check task so it is admitted first); (2) this entry's caller-site
# row is DERIVED by the identity rule (the one callers.sites key whose renders_from set equals the set of this entry's
# output template_rels; none or several refuse), never the literal site key; (3) the op-verify rows pass that key as
# rh_ra_site (N10 successor-06). N13 successor-09 HOLDS every write (codex 926 CPL-OP1H-B-CALLER-AUTHORITY and the
# obligation joins), so at s40 this entry refuses at N13 before its first write.
# OP1I (B successor; cp -n of op1h 57941d07, then Edit; change record b/op1i-projector/records-b-op1i-projector-01.yml;
# C1 s42 5afeb068 / r29 c390c0e8, sr922d_c1 + sr922e_c1; first authored on s41 / r28): the N13 include passes rh_rsv_include_rel = this file's own rel, bound
# literally at the include line (s41 write_bound.authority.include_param; r28 reserved_outputs). N13 successor-10
# replaces the HOLD with the authority join (the admitted caller fact _rh_sa_caller, set by N2 from this file's
# rh_rp_caller at the admit_record_free_entry include above) and the obligation registry joins.
# OP1J SUCCESSOR-01 (B; cp -n of the op1j copy b3bd7b1b of the op1i projection, which is the op1i hand-back 830b1761
# plus the post-hand-back key_identity edit; change record b/op1j-projector/records-b-op1j-projector-01.yml; C1 s43
# b800c6aa / r30 fe527ddc, sr922f_c1; codex tick928): the runtime-map key dedup reads its unique option from
# genesis.launch.key_identity (below); the N13 include binding cites are re-cited to s43 / r30. N13 is successor-11.

# op1e (C1 s13 decl carriers.projector.select.play_name; rules.play_name {literal: true, plays_in_entry: 1,
# unique_among: admitted_members}; CPL-SR918R-B-PLAY-NAME): the play name is the LITERAL below (never templated), this
# is the ONLY play of this file, and no other admitted playbook declares it (checked before launch by the X2 writer
# step tasks/x2_bind_exec_vector.yml (e) and again in-process). Per codex 919 the name / directory are SUPPLEMENTARY
# consistency only; the executing file is bound by the measured playbook word of the X2-admitted vector.
- name: lme-cold-launch-projection
  hosts: "{{ rh_controller_target }}"
  connection: "{{ rh_controller_connection }}"
  gather_facts: false
  become: false
  tasks:
    - name: Admit the cold launch (first-entry guard, controller, registry guard value, cold inputs, carrier)
      ansible.builtin.include_tasks: tasks/admit_cold_launch.yml

    # CPL-OP1C-B-INCLUDE (route records-route-op1c-01 :177): the include var is exactly rh_rp_caller = this entry's own
    # rel (the walked envelope_projection.entry_from value, checked below); the route join admits the X2 record here.
    - name: Admit the record-free entry and the X2 provenance record (SOLE resolve, row, x2_provenance_admission, builder A)
      ansible.builtin.include_tasks: tasks/admit_record_free_entry.yml
      vars:
        rh_rp_caller: testing/remote_harness/cold_launch_projection.yml

    # codex 916 (1): this entry accepts EXACTLY its X2 provenance carrier. A supplied launch envelope (the X4 ingress
    # envelope var), an anchor, or both carriers at once refuse here -- after route's join admitted the X2 record by the
    # walked entry identity, never selected by envelope absence or a flag. The EARLIEST boundary (registry ingress,
    # before parse) must make the same selection by the externally admitted entry / registry identity C1 declares in
    # s34 (CPL-B-OP1C-INGRESS-CARRIER, record); this row is the second, later check of the same rule.
    - name: Refuse a launch envelope or anchor supplied to the projector (one carrier only -- the X2 provenance record)
      ansible.builtin.assert:
        that:
          - rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release.ingress.envelope.early_name not in vars
          - rh.controller.bootstrap.genesis.source_record.anchor.var not in vars
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.input }}: {{ rh.controller.bootstrap.genesis.initializer.texts.input }}
          {{ [rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release.ingress.envelope.early_name,
              rh.controller.bootstrap.genesis.source_record.anchor.var] | to_json }}
        quiet: true

    # OP1F (CPL-SR919B-B-SINGLE-INCLUDE; C1 s37 first_invocation.executed_bind consumer {included_by: admission,
    # include_at: last_step, include_after: builder_admission, include_count: 1}): the executed-bind verifier is NOT
    # included here. Its ONE include site is route's admit_record_free_entry above (op1i ARFE 19f61c14 :754-755), after
    # admit_builder (:694); ARFE refuses any executed-kind field still pending (:757-766) and only then sets the
    # completed row marker (:768-778) before this entry continues, so no projector output precedes the verification
    # (CPL-OP1I-B-ANCHOR-SHIFT: op1h :712-713 / :652 / :715-724 / :726-736 shifted by +42, nothing renamed).
    # CPL-OP1H-B-NO-MARKER-READ: this entry never reads that marker (row.admission / _rh_clp_adm); it reads _rh_rf_row. (op1e :93-97 included it here, after ARFE
    # had already refused the unarmed executed binding -- codex 920 SR920_EXECUTED_BIND_REACHABILITY.)

    # s34 output_dir.owner_fact: the running uid, an admitted fact in the acceptance.running_uid form (route accept_source
    # :86-139): the custody tool_argv role argv_from, its os_tools tool admitted by digest before it runs, one output line
    # fully matching regex_from, bound under owner_fact.var. Every owner comparison below reads that var.
    - name: Bind the running uid argv, tool and regex from the declared owner fact (derived)
      vars:
        _rh_clp_of: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.owner_fact }}"
        _rh_clp_ua: "{{ rh.controller.bootstrap.genesis.initializer.custody.tool_argv[_rh_clp_of.argv_from] }}"
        _rh_clp_rx_p: "{{ _rh_clp_of.regex_from.split(rh.controller.bootstrap.source_admission.early_view.override.audit_join) }}"
      ansible.builtin.set_fact:
        _rh_clp_uid_argv: "{{ _rh_clp_ua }}"
        _rh_clp_uid_tool: "{{ rh.controller.bootstrap.os_tools[_rh_clp_ua | first] }}"
        _rh_clp_uid_rx: "{{ _rh_clp_rx_p | first | extract(rh, _rh_clp_rx_p[1:]) }}"

    - name: Stat the running uid tool (no link followed; the declared digest algorithm)
      ansible.builtin.stat:
        path: "{{ _rh_clp_uid_tool.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_clp_uid_st

    - name: Refuse a running uid tool that is not the admitted custody executable (before it runs)
      ansible.builtin.assert:
        that:
          - (_rh_clp_uid_argv | first) in rh.controller.bootstrap.genesis.initializer.custody.tools
          - _rh_clp_uid_st.stat.exists and _rh_clp_uid_st.stat.isreg and not _rh_clp_uid_st.stat.islnk
          - _rh_clp_uid_st.stat.checksum == _rh_clp_uid_tool.identity.sha256
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_clp_uid_tool.path] | to_json }}
        quiet: true

    - name: Measure the running uid (the declared argv; read verb)
      ansible.builtin.command:
        argv: "{{ [_rh_clp_uid_tool.path] + _rh_clp_uid_argv[1:] }}"
      register: _rh_clp_uid_r
      changed_when: false
      failed_when: false

    - name: Refuse a running uid measurement that is not one line of the declared uid form
      ansible.builtin.assert:
        that:
          - _rh_clp_uid_r.rc == rh.controller.bootstrap.genesis.launch.step_record.emit['values'].exit_success
          - _rh_clp_uid_r.stdout_lines | length == 1
          - _rh_clp_uid_r.stdout is match(_rh_clp_uid_rx)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_clp_uid_tool.path, _rh_clp_uid_r.rc] | to_json }}
        quiet: true

    - name: Bind the measured running uid under the declared owner fact var (derived; reserved output)
      ansible.builtin.set_fact:
        "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.owner_fact.var }}": "{{ _rh_clp_uid_r.stdout }}"

    # X2P ROW ADMISSION (this entry only): the declared projector row names THIS stage, entry, row, builder, transport,
    # leg, requirement, tool step, admission step, order position and engine words; its outputs are the declared roles
    # of its own budget, each template a member and each macro a declared macros_from word.
    - name: Refuse an X2P row that is not this entry's declared projection operation
      vars:
        _rh_clp_xi: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation }}"
        _rh_clp_xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_ini: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows }}"
        _rh_clp_walk: >-
          {%- set xp = rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection -%}
          {%- set ns = namespace(e=rh.controller.bootstrap, i=rh.controller.bootstrap, t=rh.controller.bootstrap, c=rh.controller.bootstrap, d=rh.controller.bootstrap, r=rh.controller.bootstrap) -%}
          {%- for k in rh.controller.bootstrap.genesis.initializer.custody.external_invocation[xp.tool_from].root_from -%}{%- set ns.r = ns.r[k] -%}{%- endfor -%}
          {%- for k in xp.entry_from -%}{%- set ns.e = ns.e[k] -%}{%- endfor -%}
          {%- for k in xp.inputs_from -%}{%- set ns.i = ns.i[k] -%}{%- endfor -%}
          {%- for k in xp.transport_from -%}{%- set ns.t = ns.t[k] -%}{%- endfor -%}
          {%- for k in xp.same_engine.caller_from -%}{%- set ns.c = ns.c[k] -%}{%- endfor -%}
          {%- for k in xp.same_engine.loader_from -%}{%- set ns.d = ns.d[k] -%}{%- endfor -%}
          {{ [ns.e, ns.i[_rh_sa_caller], ns.t, ns.c[_rh_sa_caller], ns.d, ns.r] }}
      ansible.builtin.assert:
        that:
          - _rh_sa_decl.resolve_phases.caller_param in vars
          - lookup('ansible.builtin.vars', _rh_sa_decl.resolve_phases.caller_param) == _rh_clp_walk[0]
          - _rh_clp_xp.requirement == _rh_sa_decl.invocation.requirements.ordinary_permitted
          - _rh_clp_xp.requirement == _rh_clp_xi.cold_launch_release.requirement
          - _rh_clp_xp.stage == _rh_rf_row.purpose
          - _rh_clp_xp.stage in rh.controller.bootstrap.genesis.launch.stages
          - _rh_clp_xp.stage in rh.controller.bootstrap.genesis.builder.authoring[_rh_rf_row.purpose_class]
          - _rh_clp_xp.stage != _rh_clp_xi.cold_launch_release.stage
          - _rh_clp_walk[0] == _rh_sa_caller
          - _rh_clp_walk[1] == _rh_rf_row
          - _rh_rf_row.producer == rh.controller.bootstrap.genesis.initializer.custody.producers.external_invocation
          - _rh_clp_xp.builder == _rh_rf_row.builder
          - _rh_clp_xp.builder == _rh_clp_xi.cold_launch_release.builder
          # codex 912 answers.transport: one word -- the walked launch_transports selection, this row, the record-free
          # row and the X4 row
          - _rh_clp_walk[2] == _rh_clp_xp.transport
          - _rh_clp_walk[2] == _rh_rf_row.transport
          - _rh_clp_walk[2] == _rh_clp_xi.cold_launch_release.transport
          - _rh_clp_walk[2] in rh.controller.bootstrap.source_admission.launch_transports.values()
          - _rh_clp_xp.leg == rh.controller.builder_leg
          - _rh_clp_xp.leg == _rh_clp_xi.cold_launch_release.leg
          - _rh_clp_xp.actor == _rh_clp_xi.source_admission.actor
          # admitted by X2 only; A from X1; this node directly follows its declared `after` steps in the declared order
          - _rh_clp_xp.tool_from in _rh_clp_xp.after
          - _rh_clp_xp.admitted_by in _rh_clp_xp.after
          - _rh_clp_xp in (_rh_clp_xi[_rh_clp_xp.admitted_by].admits | map('extract', _rh_clp_xi) | list)
          - (_rh_clp_xi.order[:(_rh_clp_xp.after | length)]) == _rh_clp_xp.after
          - (_rh_clp_xi.order | map('extract', _rh_clp_xi) | list)[_rh_clp_xp.after | length] == _rh_clp_xp
          # the same engine, read by its declared paths: the record_free caller phase and the admitted loader member
          - _rh_clp_walk[3] == _rh_sa_decl.resolve_phases.words.record_free
          - _rh_clp_walk[3] == _rh_sa_phase
          - _rh_clp_walk[4] == _rh_sa_decl.loader_rel
          - _rh_clp_walk[4] in rh.controller.bootstrap.source_admission.members_rel
          - rh.controller.entry_generation.render is mapping
          # op1d N10: the module scope is a declared engine scope of the admitted core (the declared render options)
          - rh.controller.entry_generation.render.n10.scopes.module in rh.controller.entry_generation.render.engine.by_core[rh.controller.expect_core].scopes
          # op1d: the PROPOSED refuse_macro word is a macros_from word (C1-SR917-W-PROJECTION-MACROS)
          - _rh_clp_xp.refuse_macro in _rh_clp_xp.macros_from
          # op1d s34 argv_slots.source_record: exactly the non-record outputs, carried in the record role (argv)
          - (_rh_clp_xp.argv_slots.source_record.outputs | sort) == (_rh_clp_xp.outputs.keys() | reject('equalto', _rh_clp_xp.publish_record) | list | sort)
          # the X4 launch form, inputs and inventory kind are the projector's own (the vector it renders is X4's)
          - _rh_clp_xp.argv_from == _rh_clp_xi.cold_launch_release.argv_from
          - _rh_clp_xp.inputs_from == _rh_clp_xi.cold_launch_release.inputs_from
          - >-
            (rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xp.stage].extra_vars | sort)
            == (rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xi.cold_launch_release.stage].extra_vars | sort)
          - >-
            rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xp.stage].inventory
            == rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xi.cold_launch_release.stage].inventory
          - >-
            rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xp.stage].stage_inputs
            == rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xi.cold_launch_release.stage].stage_inputs
          # identity: the cold input carrying the admitted registry identity is the X4 ingress identity input
          - _rh_clp_xp.identity.input == _rh_clp_xi.cold_launch_release.ingress.identity.input
          - _rh_clp_xp.identity.input in rh.controller.bootstrap.genesis.launch.stages[_rh_clp_xp.stage].extra_vars
          - _rh_clp_xp.identity.record_field in _rh_clp_xi.source_admission.record.fields
          # op1d s34 override_carriage: carried by BOTH this stage's first invocation and the X4 vector, in the stage
          # extra-vars slot; the X4 extra-vars flag is a work_roots.run_local.arg_flags member (codex 917 (c))
          - _rh_clp_xp.stage in _rh_clp_xi.override_carriage.stages
          - _rh_clp_xi.cold_launch_release.stage in _rh_clp_xi.override_carriage.stages
          - _rh_clp_xi.override_carriage.slot in rh.controller.bootstrap.genesis.launch.slots
          - rh.controller.bootstrap.genesis.launch.extra_vars_flag in rh.controller.bootstrap.work_roots.run_local.arg_flags
          # outputs: exactly the budget roles; each macro a macros_from word; each template a member; files distinct;
          # the proposed N13 record role (C1-SR328-W-PUBLISH-RECORD) one of them; template var names distinct
          - (_rh_clp_xp.outputs.keys() | list | sort) == (_rh_clp_xp.budget.payload_max_bytes.keys() | list | sort)
          - (_rh_clp_xp.outputs.values() | map(attribute='macro') | reject('in', _rh_clp_xp.macros_from) | list) == _rh_clp_ini
          - (_rh_clp_xp.outputs.values() | map(attribute='template_rel') | reject('in', rh.controller.bootstrap.source_admission.members_rel) | list) == _rh_clp_ini
          - (_rh_clp_xp.outputs.values() | map(attribute='file') | unique | list | length) == (_rh_clp_xp.outputs | length)
          - _rh_clp_xp.publish_record in _rh_clp_xp.outputs
          - _rh_clp_xp.publish_rel in rh.controller.bootstrap.source_admission.members_rel
          - (_rh_clp_xp.template_vars.values() | unique | list | length) == (_rh_clp_xp.template_vars | length)
          # CPL-OP1C-AB-AROOT: the builder admit_builder bound is the X1 tool -- its executable lies under the X1 root
          # (the sub-root key walked at tool_bootstrap.root_from, the same walk as route _rh_x2_asub, S-ARFE :143-146);
          # a managed-root builder refuses here (never silently accepted)
          - >-
            _rh_bld_a.executable.startswith(
              ([rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
                rh.controller.bootstrap.work_roots.sub_roots[_rh_clp_walk[5]]]
               | join(rh.controller.bootstrap.path_admission.separator)) ~ rh.controller.bootstrap.path_admission.separator)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.entry }}: {{ rh.controller.bootstrap.genesis.initializer.texts.entry }}
          {{ [_rh_sa_caller] | to_json }}
        quiet: true

    # CLOSURE (X2 closure_from = members_rel + dispatch_admission.authored[<this entry>]): every path this entry selects
    # by policy -- its own rel, the publisher, each output template and each macro module the declared macro words reach
    # -- is in that union. HOLE-SR328-X2P-CLOSURE: s33 authors no authored row for this entry; absent, this refuses.
    - name: Refuse a projector closure that is not the common member set plus this entry's declared authored row
      vars:
        _rh_clp_xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_mods: >-
          {%- set ns = namespace(m=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for mw, kp in _rh_clp_xp.macros_from | dictsort -%}{%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in kp -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{%- set ns.m = ns.m + [w.v] -%}{%- endfor -%}
          {{ ns.m }}
      ansible.builtin.assert:
        that:
          - _rh_sa_caller in rh.controller.bootstrap.source_admission.dispatch_admission.authored
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] is sequence
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] is not string
          - rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller] | reject('string') | list | length == 0
          - >-
            ([_rh_sa_caller, _rh_clp_xp.publish_rel]
             + (_rh_clp_xp.outputs.values() | map(attribute='template_rel') | list) + _rh_clp_mods)
            | reject('in', rh.controller.bootstrap.source_admission.members_rel
                           + rh.controller.bootstrap.source_admission.dispatch_admission.authored[_rh_sa_caller])
            | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.refusals.entry }}: {{ rh.controller.bootstrap.genesis.initializer.texts.entry }}
          {{ [_rh_sa_caller] + (_rh_clp_xp.outputs.values() | map(attribute='template_rel') | list) | to_json }}
        quiet: true

    # OUTPUT DIR (envelope_projection.output_dir): <work root>/<sub_roots[sub]>/<rel>/<act>, act = the value of the var
    # named at act_from (the ONE act of this X2 / X2P / X3 / X4 chain: the X2 record binds rh_gen_act of this run).
    # Normalized absolute, under no work_roots.admission.refused_prefixes member, distinct from (never equal to, inside or
    # above) every bound directory named at distinct_from (the release and cold-consumer dest vars).
    - name: Refuse a projection directory that is not the declared per-act work-root path, or that meets a publication directory or a refused prefix
      vars:
        _rh_clp_xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
        _rh_clp_out: &clp_out >-
          {%- set w = namespace(a=rh.controller.bootstrap) -%}
          {%- for k in rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.act_from -%}{%- set w.a = w.a[k] -%}{%- endfor -%}
          {{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel,
              rh.controller.bootstrap.work_roots.sub_roots[rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.sub],
              rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.rel,
              lookup('ansible.builtin.vars', w.a.var)]
             | join(rh.controller.bootstrap.path_admission.separator) }}
        # [dest var name, bound value or the empty rows word when unbound] per distinct_from path
        _rh_clp_dv: >-
          {%- set ns = namespace(d=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for p in _rh_clp_xp.output_dir.distinct_from -%}{%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- if w.v in vars -%}{%- set ns.d = ns.d + [[w.v, lookup('ansible.builtin.vars', w.v)]] -%}{%- endif -%}{%- endfor -%}
          {{ ns.d }}
        _rh_clp_pfx: >-
          {%- set ns = namespace(h=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for p in rh.controller.bootstrap.work_roots.admission.refused_prefixes -%}
          {%- if (_rh_clp_out ~ _rh_clp_sep).startswith(p) -%}{%- set ns.h = ns.h + [p] -%}{%- endif -%}{%- endfor -%}
          {{ ns.h }}
        _rh_clp_own: >-
          {%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in _rh_clp_xp.output_dir.owner_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
        _rh_clp_nest: >-
          {%- set ns = namespace(n=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for d in _rh_clp_dv | map('last') | select('string') -%}
          {%- if (_rh_clp_out ~ _rh_clp_sep).startswith(d ~ _rh_clp_sep) or (d ~ _rh_clp_sep).startswith(_rh_clp_out ~ _rh_clp_sep) -%}{%- set ns.n = ns.n + [d] -%}{%- endif -%}{%- endfor -%}
          {{ ns.n }}
      ansible.builtin.assert:
        that:
          - _rh_clp_xp.output_dir.created == rh.controller.bootstrap.genesis.launch.stage_root.act.created
          # op1f (s37 output_dir.words): the act dir is created EXCLUSIVE (an existing path refuses), the declared word
          - _rh_clp_xp.output_dir.created == _rh_clp_xp.output_dir.words.created.exclusive
          # the owner word walked at owner_from resolves to the s34 owner_fact word (running_uid), whose var this run
          # bound from its own measurement above (DEV-B-OP1C-OWNER-WORD closed by s34 owner_fact)
          - _rh_clp_own == rh.controller.bootstrap.work_roots.destination_custody.owner
          - _rh_clp_own == _rh_clp_xp.output_dir.owner_fact.word
          - _rh_clp_xp.output_dir.parent.owner_from == _rh_clp_xp.output_dir.owner_from
          - _rh_clp_out is match(rh.controller.bootstrap.path_admission.regex)
          - _rh_clp_out is not search(rh.controller.bootstrap.path_admission.forbidden_segment_regex)
          - _rh_clp_pfx == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_dv | map('last') | reject('string') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          # equal, inside or above: (out + sep) starts with (dest + sep) or the reverse -- none
          - _rh_clp_nest == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_clp_xp.output_dir.sub, _rh_clp_xp.output_dir.rel, _rh_clp_dv | map('first') | list] | to_json }}
        quiet: true

    # s34 output_dir.parent {created_by: stage, created: only_if_absent, mode, owner_from, custody_from, capacity_bytes 0}:
    # the parent (<work root>/<sub>/<rel>) is created by THIS stage only when absent, directly under an existing real
    # directory (no intermediate is ever created); an existing parent that breaks a destination_custody rule refuses
    # (never re-moded or re-owned). [0] act dir (must be absent), [1] parent, [2] its parent, [3] the work root.
    - name: Stat the projection directory, its parent, the parent's parent and the work root (no link followed)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ _rh_clp_out_p }}"
        - "{{ _rh_clp_out_p | dirname }}"
        - "{{ _rh_clp_out_p | dirname | dirname }}"
        - "{{ [rh_repo_root, rh.controller.bootstrap.work_roots.root_rel] | join(rh.controller.bootstrap.path_admission.separator) }}"
      vars:
        _rh_clp_out_p: *clp_out
      register: _rh_clp_od0

    - name: Refuse a projection parent that this stage may not create (act dir present, or no real owned directory above it)
      vars:
        _rh_clp_pa: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.parent }}"
        # op1f (C1 s37 output_dir.words :1561; R-OP1D-PARENT-WORDS closed): the creation vocabulary
        _rh_clp_ow: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.words }}"
      ansible.builtin.assert:
        that:
          # op1f: the parent's creation words are the declared ones this stage implements -- created_by.stage (THIS stage
          # creates it, the gated create below) and created.only_if_absent (created when absent; an existing parent is
          # admitted only under the custody rules, never re-moded / re-owned); any other word refuses
          - _rh_clp_pa.created_by in _rh_clp_ow.created_by.values()
          - _rh_clp_pa.created in _rh_clp_ow.created.values()
          - _rh_clp_pa.created_by == _rh_clp_ow.created_by.stage
          - _rh_clp_pa.created == _rh_clp_ow.created.only_if_absent
          - _rh_clp_pa.capacity_bytes is integer and _rh_clp_pa.capacity_bytes >= 0
          - not _rh_clp_od0.results[0].stat.exists
          - _rh_clp_od0.results[2].stat.exists and _rh_clp_od0.results[2].stat.isdir and not _rh_clp_od0.results[2].stat.islnk
          - _rh_clp_od0.results[3].stat.exists and _rh_clp_od0.results[3].stat.isdir and not _rh_clp_od0.results[3].stat.islnk
          - _rh_clp_od0.results[2].stat.uid == lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.owner_fact.var) | int
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ _rh_clp_od0.results | map(attribute='item') | list | to_json }}
        quiet: true

    - name: Create the projection parent ONLY when absent (this stage; declared mode; never an intermediate)
      ansible.builtin.file:
        path: "{{ _rh_clp_od0.results[1].item }}"
        state: directory
        mode: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.parent.mode }}"
      when: not _rh_clp_od0.results[1].stat.exists

    - name: Stat the projection directory and its parent again (no link followed; the act dir must be absent -- created exclusive)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ _rh_clp_od0.results[0].item }}"
        - "{{ _rh_clp_od0.results[1].item }}"
      register: _rh_clp_od

    # CAPACITY (codex 914 Q-OP1-BUDGET / 915 (4)): typed slots read from the PROPOSED C1 word envelope_projection.capacity
    # (C1-SR328-W-CAPACITY) {total_max_bytes, transient_max_bytes, retained_obligation_bytes, fs_probe_args}: maximum
    # allocations, never a size proof. total covers the summed output caps (N13 option (a)); transient covers the largest
    # cap (the one atomic-move temp); retained_obligation is the bytes the published act dir keeps after this run; the
    # reservation N13 demands is their sum. The temp-fs probe runs the admitted os_tools.stat (digest-checked first) on
    # the parent with the declared probe args. No enlargement: a cap is read, never raised; any refusal precedes N13.
    - name: Stat the admitted stat tool (identity digest before its one use; read-only)
      ansible.builtin.stat:
        path: "{{ rh.controller.bootstrap.os_tools.stat.path }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      register: _rh_clp_st

    - name: Refuse a stat tool that is not the admitted identity, or a projection parent outside the destination custody
      vars:
        _rh_clp_dc: >-
          {%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.parent.custody_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
      ansible.builtin.assert:
        that:
          - _rh_clp_st.stat.exists and _rh_clp_st.stat.isreg and not _rh_clp_st.stat.islnk
          - _rh_clp_st.stat.checksum == rh.controller.bootstrap.os_tools.stat.identity.sha256
          - not _rh_clp_od.results[0].stat.exists
          - _rh_clp_od.results[1].stat.exists and _rh_clp_od.results[1].stat.isdir and not _rh_clp_od.results[1].stat.islnk
          # the s34 owner fact (measured above), never rh_builder.uid
          - _rh_clp_od.results[1].stat.uid == lookup('ansible.builtin.vars', rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.owner_fact.var) | int
          # destination_custody (custody_from): same device as the work root; no group / other write; no link
          - (not _rh_clp_dc.same_device_as_work_root) or _rh_clp_od.results[1].stat.dev == _rh_clp_od0.results[3].stat.dev
          - (not _rh_clp_dc.refuse_group_other_writable) or not (_rh_clp_od.results[1].stat.wgrp or _rh_clp_od.results[1].stat.woth)
          - (not _rh_clp_dc.refuse_links) or not _rh_clp_od.results[1].stat.islnk
          # created now: exactly the declared mode (an existing parent is never re-moded)
          - _rh_clp_od0.results[1].stat.exists or _rh_clp_od.results[1].stat.mode == rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.output_dir.parent.mode
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ _rh_clp_od.results | map(attribute='item') | list | to_json }}
        quiet: true

    - name: Probe the projection parent's filesystem type (admitted os_tools.stat, declared probe args; read-only)
      ansible.builtin.command:
        argv: >-
          {{ [rh.controller.bootstrap.os_tools.stat.path]
             + rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.capacity.fs_probe_args
             + [_rh_clp_od.results[1].item] }}
      register: _rh_clp_fs

    # s34 capacity.temp_filesystems: the REAL temp dirs of this stage process (the genesis.launch.env stage_paths names
    # local / remote env), measured at the existing leaf else its parent (R-OP1D-TEMP-WORDS: measure_at / nested_mount
    # words implemented, no declared vocabulary to compare them with). Each must be a real directory on the projection
    # parent's device (a tmpfs or other device refuses) whose filesystem type is admitted.
    - name: Stat each declared temp filesystem dir and its parent (no link followed)
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop: >-
        {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
        {%- for k, t in rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.capacity.temp_filesystems | dictsort -%}
        {%- set ns.p = ns.p + [lookup('ansible.builtin.env', t.env), lookup('ansible.builtin.env', t.env) | dirname] -%}
        {%- endfor -%}{{ ns.p }}
      register: _rh_clp_tfs

    - name: Probe each measured temp dir's filesystem type (admitted os_tools.stat, declared probe args; read-only)
      ansible.builtin.command:
        argv: >-
          {{ [rh.controller.bootstrap.os_tools.stat.path]
             + rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.capacity.fs_probe_args
             + [item] }}
      loop: >-
        {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
        {%- for r in _rh_clp_tfs.results | batch(2) -%}
        {%- set ns.p = ns.p + [r[0].item if r[0].stat.exists else r[1].item] -%}
        {%- endfor -%}{{ ns.p }}
      register: _rh_clp_tfp
      changed_when: false

    - name: Refuse a temp filesystem that is absent, a link, on another device than the projection, or of a refused type
      vars:
        _rh_clp_tm: >-
          {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for r in _rh_clp_tfs.results | batch(2) -%}
          {%- set ns.p = ns.p + [r[0].stat if r[0].stat.exists else r[1].stat] -%}
          {%- endfor -%}{{ ns.p }}
      ansible.builtin.assert:
        that:
          - (_rh_clp_tfs.results | map(attribute='item') | select('equalto', '') | list) == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_tm | rejectattr('exists') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_tm | rejectattr('isdir') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_tm | selectattr('islnk') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_tm | map(attribute='dev') | reject('equalto', _rh_clp_od.results[1].stat.dev) | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_tfp.results | map(attribute='stdout') | select('in', rh.controller.bootstrap.work_roots.admission.refused_fs_types) | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.capacity.temp_filesystems.keys() | list | to_json }}
        quiet: true

    - name: Refuse a capacity allocation that is not the typed slots, or a projection on a refused filesystem type
      vars:
        _rh_clp_xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_caps: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.budget.payload_max_bytes }}"
      ansible.builtin.assert:
        that:
          - _rh_clp_fs.stdout not in rh.controller.bootstrap.work_roots.admission.refused_fs_types
          - (_rh_clp_caps.values() | select('integer') | list) == (_rh_clp_caps.values() | list)
          - _rh_clp_caps.values() | select('le', 0) | list | length == 0
          - _rh_clp_xp.capacity.total_max_bytes is integer
          - _rh_clp_xp.capacity.transient_max_bytes is integer
          - _rh_clp_xp.capacity.retained_obligation_bytes is integer
          - _rh_clp_xp.capacity.total_max_bytes >= (_rh_clp_caps.values() | sum)
          - _rh_clp_xp.capacity.transient_max_bytes >= (_rh_clp_caps.values() | max)
          - _rh_clp_xp.capacity.retained_obligation_bytes >= _rh_clp_xp.capacity.total_max_bytes
          - _rh_clp_xp.capacity.fs_probe_args is sequence and _rh_clp_xp.capacity.fs_probe_args is not string
          # op1d s34: retained outputs are exactly the declared outputs; need = total + transient + every temp reserve
          - (_rh_clp_xp.capacity.retained_outputs | sort) == (_rh_clp_xp.outputs.keys() | list | sort)
          - _rh_clp_xp.capacity.need_bytes is integer
          - >-
            _rh_clp_xp.capacity.need_bytes
            >= _rh_clp_xp.capacity.total_max_bytes + _rh_clp_xp.capacity.transient_max_bytes
               + (_rh_clp_xp.capacity.temp_filesystems.values() | map(attribute='reserve_bytes') | sum)
          - _rh_clp_xp.capacity.temp_filesystems.values() | map(attribute='reserve_bytes') | reject('integer') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_clp_xp.capacity.keys() | list, _rh_clp_caps.keys() | list, _rh_clp_od.results[1].item] | to_json }}
        quiet: true

    # OP1G (C1 sr922b input_view, s39 :1684-1802; render.n10.write_bound.callers.sites.cold_launch_projection, s39
    # :7069-7078; codex 923 OBS_B_OP1F_INPUT_BOUND_WIDTH / N13_CALLER_AND_DECLARATION_JOIN; CPL-SR922B-B-VIEW): this
    # entry's ONE caller-site row (its render_scope, uid fact path, view_from) and the declared input view it reaches.
    # Every declared view path (bs and bs_anchors walked from controller.bootstrap, ctl from controller) must be
    # present in the RESOLVED declaration, and every anchor must be a mapping, BEFORE any write (a path absent from the
    # resolved declaration refuses; no default). The site's uid fact is this entry's owner fact (never rh_builder.uid).
    # OP1H (C1 sr922c identity, s40 write_bound.identity site_from renders; CPL-SR922C-B-IDENTITY): this entry's site key
    # is DERIVED, never the literal key: the ONE callers.sites key whose renders_from set (walked from controller.bootstrap)
    # equals the set of this entry's output template_rels (its render rows and its render-form record). None or several
    # refuse here, before any write (this task's fail_msg reads only the derived list).
    - name: Refuse a caller-site classification that does not name exactly one declared site (before any write)
      vars:
        _rh_clp_skeys: &clp_skeys >-
          {%- set xp = rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection -%}
          {%- set own = xp.outputs.values() | map(attribute='template_rel') | unique | sort -%}
          {%- set ns = namespace(k=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for s in rh.controller.entry_generation.render.n10.write_bound.callers.sites | dict2items -%}
          {%- set rs = namespace(r=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for p in s.value.renders_from -%}
          {%- set w = namespace(v=rh.controller.bootstrap) -%}{%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- set rs.r = rs.r + [w.v] -%}
          {%- endfor -%}
          {%- if (rs.r | unique | sort) == own -%}{%- set ns.k = ns.k + [s.key] -%}{%- endif -%}
          {%- endfor -%}{{ ns.k | to_json }}
      ansible.builtin.assert:
        that:
          - (_rh_clp_skeys | from_json | length) == 1
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ _rh_clp_skeys }}
        quiet: true

    - name: Refuse an input view path absent from the resolved declaration, or a caller site that is not this entry's
      vars:
        xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_skeys: *clp_skeys
        _rh_clp_site: &clp_site "{{ rh.controller.entry_generation.render.n10.write_bound.callers.sites[_rh_clp_skeys | from_json | first] }}"
        _rh_clp_iv: &clp_iv >-
          {%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in _rh_clp_site.view_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v }}
        _rh_clp_ivbad: >-
          {%- set ns = namespace(b=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for role, rv in _rh_clp_iv.roles | dictsort -%}
          {%- for src in [[rh.controller.bootstrap, rv.bs, false], [rh.controller.bootstrap, rv.bs_anchors, true], [rh.controller, rv.ctl, false], [rh.controller.bootstrap, rv.rt, false]] -%}
          {%- for p in src[1] -%}
          {%- set w = namespace(v=src[0], ok=true) -%}
          {%- for k in p -%}{%- if w.ok and w.v is mapping and k in w.v -%}{%- set w.v = w.v[k] -%}{%- else -%}{%- set w.ok = false -%}{%- endif -%}{%- endfor -%}
          {%- if not w.ok or (src[2] and w.v is not mapping) -%}{%- set ns.b = ns.b + [[role, p]] -%}{%- endif -%}
          {%- endfor -%}{%- endfor -%}{%- endfor -%}{{ ns.b }}
        # the ONE runtime map AS BUILT (anchor re-used verbatim by the N13 include and the fresh readback render; OP1H:
        # defined HERE so its declared keys are admitted present before N13): construction source words ->
        # this run's admitted values; launch slot placeholders -> the X4 vector words (B's vector macro keys rt by the
        # declared placeholder text). op1d: env_pairs from genesis.launch.env for the X4 stage (HOLE-B-OP1C-ENV-PAIRS
        # closed); stage_extra_vars per s34 argv_slots.stage_extra_vars incl. the override tail (override LAST); the
        # source_record slot is built INSIDE the argv template from the envelope / companions macros (s34
        # argv_slots.source_record). The binding (companion) values are this run's received companion vars, which
        # verify_first_invocation proved equal to the run_local-rule values and to the admission companions field
        # (s35 carrier, FINAL; HOLE-OP1D-PROJECTOR-COMPANIONS closed); never a later envelope.
        _rh_clp_rt: &clp_rt >-
          {%- set bs = rh.controller.bootstrap -%}
          {%- set xi = bs.genesis.initializer.custody.external_invocation -%}
          {%- set xr = xi.cold_launch_release -%}
          {%- set cm = bs.source_admission.bootstrap_input.construction -%}
          {%- set l = bs.genesis.launch -%}
          {%- set oc = xi.override_carriage -%}
          {%- set cu = bs.genesis.initializer.custody -%}
          {%- set w = namespace(t=bs, e=bs, nm=bs, inv=cu.cold_launch.initial.rows, ev=cu.cold_launch.initial.rows, env=cu.cold_launch.initial.rows) -%}
          {%- for k in xi.envelope_projection.transport_from -%}{%- set w.t = w.t[k] -%}{%- endfor -%}
          {%- for k in xr.entry_from -%}{%- set w.e = w.e[k] -%}{%- endfor -%}
          {%- for k in xi.envelope_projection.argv_slots.stage_extra_vars.names_from -%}{%- set w.nm = w.nm[k] -%}{%- endfor -%}
          {%- for f in ansible_inventory_sources -%}{%- set w.inv = w.inv + [bs.ssh_auth.run_grammar.inventory_flag, f] -%}{%- endfor -%}
          {#- op1f: the -e name=value separator is the declared s37 run_local.caller_vars.form_separators.name_eq_value -#}
          {%- set nev = bs.work_roots.run_local.caller_vars.form_separators.name_eq_value -%}
          {%- for n in w.nm -%}{%- set w.ev = w.ev + [l.extra_vars_flag, n ~ nev ~ lookup('ansible.builtin.vars', n)] -%}{%- endfor -%}
          {#- s34 override_carriage (override LAST): state present -> the pair in pair order, then the layer flag + prefix +
              path (the -e @<path> layer the loader composes last); absent -> nothing (both-or-neither admitted upstream) -#}
          {%- if _rh_rf_ovs == _rh_sa_reg.carrier_state.node.words.present -%}
          {%- for n in cu.override_inputs -%}{%- set w.ev = w.ev + [l.extra_vars_flag, n ~ nev ~ lookup('ansible.builtin.vars', n)] -%}{%- endfor -%}
          {%- set w.ev = w.ev + [l.extra_vars_flag, oc.layer.prefix ~ lookup('ansible.builtin.vars', cu.override_input_roles[oc.layer.role])] -%}
          {%- endif -%}
          {#- s34 argv_slots.env_pairs_from = genesis.launch.env, for the X4 stage: stage_paths names re-rooted at the X4
              stage root <work root>/<sub_roots[stage_root.sub]>/<stage_root.rel>/<X4 stage>/<act>; every other class
              (base, inherited, literal, generation_paths of the SAME A generation, checkout_members of the SAME
              checkout) is this process's admitted value (DEV-B-OP1D-X4-ENV; X4's admit_builder re-admits each) -#}
          {#- op1g: the separator of an env -i pair is the declared genesis.launch.env_pair_separator (C1 sr922b, s39
              :2444-2448; HOLE-B-OP1F-ENV-PAIR-SEP CLOSED, CPL-SR922B-B-ENV-SEP) -#}
          {%- set eps = l.env_pair_separator -%}
          {%- set sr4 = [rh_repo_root, bs.work_roots.root_rel, bs.work_roots.sub_roots[l.stage_root.sub], l.stage_root.rel, xr.stage, lookup('ansible.builtin.vars', l.stage_root.act.var)] | join(bs.path_admission.separator) -%}
          {%- for n in l.env.order -%}
          {%- if n in l.env.stage_paths -%}{%- set w.env = w.env + [n ~ eps ~ sr4 ~ bs.path_admission.separator ~ l.env.stage_paths[n]] -%}
          {%- else -%}{%- set w.env = w.env + [n ~ eps ~ lookup('ansible.builtin.env', n)] -%}{%- endif -%}
          {%- endfor -%}
          {{ {cm.sources.edition: rh_rel_edition,
              cm.sources.digest: rh_rel_declaration_sha256,
              cm.sources.registry: rh_rel_registry_sha256,
              cm.sources.launch_transport: w.t,
              cm.sources.binding: dict(xr.companions | zip(query('ansible.builtin.vars', *xr.companions))),
              l.scalar_slots.env_path: bs.os_tools.env.path,
              l.scalar_slots.builder: _rh_bld_a.executable,
              l.scalar_slots.act_var: l.stage_root.act.var,
              l.scalar_slots.act: lookup('ansible.builtin.vars', l.stage_root.act.var),
              l.scalar_slots.checkout: rh_repo_root,
              l.scalar_slots.playbook: w.e,
              l.slots.inventory_args: w.inv,
              l.slots.stage_extra_vars: w.ev,
              l.slots.env_pairs: w.env,
              l.slots.stage_inputs: xr.stage_inputs} }}
        # OP1H (input_view.runtime declared_keys; CPL-SR922C-B-RT): role -> the runtime-map KEYS that role keeps, from
        # exactly its roles.<role>.rt paths walked from controller.bootstrap (a mapping keeps every value, a string that
        # one key; the paths' presence is admitted by _rh_clp_ivbad, their leaf shapes and the keys' presence below)
        _rh_clp_rtk: &clp_rtk >-
          {%- set e = rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows -%}
          {%- set out = namespace(p=e) -%}
          {%- for role, rv in _rh_clp_iv.roles | dictsort -%}
          {%- set ks = namespace(k=e) -%}
          {%- for p in rv.rt -%}
          {%- set w = namespace(v=rh.controller.bootstrap) -%}{%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- if w.v is mapping -%}{%- set ks.k = ks.k + (w.v.values() | list) -%}{%- elif w.v is string -%}{%- set ks.k = ks.k + [w.v] -%}{%- endif -%}
          {%- endfor -%}
          {#- OP1J SUCCESSOR-01 (codex tick928 B_CASE_SENSITIVE_RUNTIME_KEYS; C1 SR922f, s43 genesis.launch.key_identity
              :2543, r30 pin :5171-5178): this dedup keeps EXACT-key identity (keys differing only in case stay distinct; exact
              duplicates still collapse). The unique filter's option NAME and VALUE are read from the declared word
              (ki.unique_option / ki.unique_value), never written as literals (controls C-SR922F-KEY-CASE,
              C-SR922F-KEY-IDENTITY-PIN). -#}
          {%- set ki = rh.controller.bootstrap.genesis.launch.key_identity -%}
          {%- set out.p = out.p + [[role, ks.k | unique(**{ki.unique_option: ki.unique_value}) | list]] -%}
          {%- endfor -%}{{ dict(out.p) }}
        # every rt leaf that is neither a string nor a mapping of strings, and every declared key absent from the map as
        # built: [role, path] / [role, key]; a non-empty list refuses before any write (no substitution)
        _rh_clp_rtbad: >-
          {%- set ns = namespace(b=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for role, rv in _rh_clp_iv.roles | dictsort -%}
          {%- for p in rv.rt -%}
          {%- set w = namespace(v=rh.controller.bootstrap) -%}{%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- if not ((w.v is string) or ((w.v is mapping) and ((w.v.values() | reject('string') | list | length) == 0))) -%}{%- set ns.b = ns.b + [[role, p]] -%}{%- endif -%}
          {%- endfor -%}
          {%- for k in _rh_clp_rtk[role] | reject('in', _rh_clp_rt) -%}{%- set ns.b = ns.b + [[role, k]] -%}{%- endfor -%}
          {%- endfor -%}{{ ns.b }}
      ansible.builtin.assert:
        that:
          - _rh_clp_iv is mapping
          - (_rh_clp_iv.roles.keys() | list | sort) == (xp.outputs.keys() | list | sort)
          - _rh_clp_ivbad == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          # OP1H: every role's declared runtime keys are present in the map as built (absent refuses; no default)
          - _rh_clp_rtbad == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - _rh_clp_site.render_scope in rh.controller.entry_generation.render.n10.scopes
          - (_rh_clp_site.uid | first) == xp.output_dir.owner_fact.var
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_clp_ivbad, _rh_clp_rtbad, _rh_clp_site.render_scope, _rh_clp_site.uid] | to_json }}
        quiet: true

    - name: Reserve, render, seal and publish the projection (N13 -> N10; ONE publisher; the record role written last)
      ansible.builtin.include_tasks: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.publish_rel | relpath(_rh_sa_caller | dirname) }}"
      vars:
        xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        cd: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clp_skeys: *clp_skeys
        _rh_clp_site: *clp_site
        _rh_clp_iv: *clp_iv
        # OP1H: the runtime map as built (its anchor now sits in the check task above, where every declared key was
        # admitted present) and the per-role declared keys
        _rh_clp_rt: *clp_rt
        _rh_clp_rtk: *clp_rtk
        # OP1G (C1 sr922b input_view; CPL-SR922B-B-VIEW): role -> the NARROWED template input of that output role,
        #   {template_vars.bs: view(controller.bootstrap, roles[role].bs, roles[role].bs_anchors),
        #    template_vars.ctl: view(controller, roles[role].ctl, []), template_vars.rt: the runtime map (whole)}
        # with the template_vars names walked at the view's entry_read. view: each path carries the WHOLE value there,
        # every ancestor is a mapping of only declared children, an anchor is a mapping of only declared children
        # (presence admitted by the task above). This per-role mapping is the row's rh_ra_vars: N10 measures it
        # (input bound) and renders it, the SAME mapping (replaces op1f's whole-map supply of bootstrap / controller).
        _rh_clp_tv: &clp_tv >-
          {%- set e = rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows -%}
          {%- set tw = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in _rh_clp_iv.entry_read -%}{%- set tw.v = tw.v[k] -%}{%- endfor -%}
          {%- set out = namespace(p=e) -%}
          {%- for role, rv in _rh_clp_iv.roles | dictsort -%}
          {%- set vw = namespace(bs=dict(e), ctl=dict(e)) -%}
          {%- for p in rv.bs_anchors -%}
          {%- set n = namespace(v=dict(e)) -%}{%- for k in p | reverse -%}{%- set n.v = {k: n.v} -%}{%- endfor -%}
          {%- set vw.bs = vw.bs | combine(n.v, recursive=true) -%}
          {%- endfor -%}
          {%- for p in rv.bs -%}
          {%- set w = namespace(v=rh.controller.bootstrap) -%}{%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- set n = namespace(v=w.v) -%}{%- for k in p | reverse -%}{%- set n.v = {k: n.v} -%}{%- endfor -%}
          {%- set vw.bs = vw.bs | combine(n.v, recursive=true) -%}
          {%- endfor -%}
          {%- for p in rv.ctl -%}
          {%- set w = namespace(v=rh.controller) -%}{%- for k in p -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {%- set n = namespace(v=w.v) -%}{%- for k in p | reverse -%}{%- set n.v = {k: n.v} -%}{%- endfor -%}
          {%- set vw.ctl = vw.ctl | combine(n.v, recursive=true) -%}
          {%- endfor -%}
          {#- OP1H (runtime declared_keys): rt = exactly this role's declared keys of the map as built -#}
          {%- set rk = _rh_clp_rtk[role] -%}
          {%- set out.p = out.p + [[role, {tw.v.bs: vw.bs, tw.v.ctl: vw.ctl, tw.v.rt: dict(rk | zip(rk | map('extract', _rh_clp_rt)))}]] -%}
          {%- endfor -%}{{ dict(out.p) }}
        rh_rsv_dir: *clp_out
        rh_rsv_refusal: "{{ cd.refusals.prepare }}"
        rh_rsv_staged: "{{ cd.refusals.prepare }}"
        # op1d s34: need = capacity.need_bytes (total + transient + temp reserves, admitted above) required free ABOVE
        # the protected reserve (protected_reserve_from): N13 reap_staging requires df avail >= rh_rsv_need
        rh_rsv_need: >-
          {%- set w = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in xp.capacity.protected_reserve_from -%}{%- set w.v = w.v[k] -%}{%- endfor -%}
          {{ xp.capacity.need_bytes + w.v }}
        # op1d N10 (codex 917 item 4): every row and the record render in the MODULE scope (declared render options).
        # op1g (render.n10.write_bound.callers.sites.cold_launch_projection): rh_rsv_render_scope = scopes[<site
        # render_scope>] (module) and rh_rsv_uid = the decimal text of the fact at the site's uid path ([_rh_clp_uid]:
        # the s34 owner fact, the measured running uid, never rh_builder.uid; equal to output_dir.owner_fact.var above)
        rh_rsv_render_scope: "{{ rh.controller.entry_generation.render.n10.scopes[_rh_clp_site.render_scope] }}"
        rh_rsv_uid: >-
          {%- set w = namespace(v=lookup('ansible.builtin.vars', _rh_clp_site.uid | first)) -%}
          {%- for k in _rh_clp_site.uid[1:] -%}{%- set w.v = w.v[k] -%}{%- endfor -%}{{ w.v | string }}
        # OP1I, re-cited OP1J (s43 write_bound.authority include_param :7565; r30 reserved_outputs :7272): the rel of THIS
        # authored file, which carries the N13 include, bound LITERALLY here (never derived, never -e); N13 compares it with
        # the LAST entry of sites.cold_launch_projection.authority.include_chain[_rh_sa_caller] (s43 :7594).
        rh_rsv_include_rel: testing/remote_harness/cold_launch_projection.yml
        rh_rsv_max_bytes:
          total: "{{ xp.capacity.total_max_bytes }}"
          rows: "{{ dict(xp.outputs | dictsort | map('last') | map(attribute='file') | zip(xp.budget.payload_max_bytes | dictsort | map('last'))) }}"
        rh_rsv_members: "{{ xp.outputs | dictsort | map('last') | map(attribute='file') | list }}"
        rh_rsv_dirs: "{{ cd.initial.rows }}"
        rh_rsv_copies: "{{ cd.initial.rows }}"
        rh_rsv_checks: "{{ cd.initial.rows }}"
        rh_rsv_prepublish: {rows: {}}
        rh_rsv_renders: >-
          {%- set ns = namespace(r=cd.initial.rows) -%}
          {%- for role, o in xp.outputs | dictsort if role != xp.publish_record -%}
          {%- set ns.r = ns.r + [{'name': role, 'src': o.template_rel, 'rel': o.file, 'mode': xp.output_mode, 'vars': _rh_clp_tv[role]}] -%}
          {%- endfor -%}{{ ns.r }}
        # op1d N13-S06-RECORD-RENDER: the record role (publish_record: argv) is an N10 render row rendered LAST in the
        # module scope (no bare template lookup; the declared render options apply)
        rh_rsv_record:
          name: "{{ xp.publish_record }}"
          rel: "{{ xp.outputs[xp.publish_record].file }}"
          mode: "{{ xp.output_mode }}"
          src: "{{ xp.outputs[xp.publish_record].template_rel }}"
          vars: "{{ _rh_clp_tv[xp.publish_record] }}"

    - name: Refuse a projection this run did not publish (created exclusive -- an existing act dir is never accepted)
      ansible.builtin.assert:
        that:
          - _rh_rsv_published
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.prepare }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.staged }}
          {{ [_rh_rsv_outcome] | to_json }}
        quiet: true

    # INDEPENDENT READBACK (the op1b :395-459 form; never N13's own readback): its own stats, a fresh render of each role
    # through N10 op verify (op1d; same options, vars and closure), parsed shapes; the companion map is proved against the supplied companion inputs
    # independently of the envelope, then cross-checked with the envelope's binding fields.
    - name: Stat the published projection outputs (no link followed)
      ansible.builtin.stat:
        path: "{{ _rh_clp_out_p ~ rh.controller.bootstrap.path_admission.separator ~ item.value.file }}"
        follow: false
        get_checksum: true
        checksum_algorithm: "{{ _rh_sa_decl.digest_algorithm }}"
      loop: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.outputs | dict2items }}"
      vars:
        _rh_clp_out_p: *clp_out
      register: _rh_clp_fin

    # op1d N10 PARITY (codex 917 item 4): each PUBLISHED file is re-rendered through the SAME shared N10 operation (op
    # verify, module scope: the declared entry_generation.render options, the same template, the same vars) in check
    # mode; N10 refuses unless the fresh render reports no change. Reached by the PROPOSED N10 rel word
    # (entry_generation.render.n10.rel, C1-SR917-W-N10). Never a bare template lookup (op1c :415 retired).
    - name: Re-render each published output through N10 (op verify, module scope; nothing written)
      ansible.builtin.include_tasks: "{{ rh.controller.entry_generation.render.n10.rel | relpath(_rh_sa_caller | dirname) }}"
      loop: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection.outputs | dictsort }}"
      loop_control:
        loop_var: _rh_clp_vrow
        label: "{{ _rh_clp_vrow[0] }}"
      vars:
        xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        cd: "{{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch }}"
        _rh_clp_out_p: *clp_out
        _rh_clp_rt: *clp_rt
        # op1g: the op-verify rows get the SAME per-role view, re-derived here (N10 bounds these fresh inputs again)
        # OP1H: the derived site key (also passed as rh_ra_site) and the per-role declared runtime keys
        _rh_clp_skeys: *clp_skeys
        _rh_clp_site: *clp_site
        _rh_clp_iv: *clp_iv
        _rh_clp_rtk: *clp_rtk
        _rh_clp_tv: *clp_tv
        rh_ra_name: "{{ _rh_clp_vrow[0] }}"
        rh_ra_src: "{{ _rh_clp_vrow[1].template_rel }}"
        rh_ra_dest: "{{ _rh_clp_out_p ~ rh.controller.bootstrap.path_admission.separator ~ _rh_clp_vrow[1].file }}"
        rh_ra_mode: "{{ xp.output_mode }}"
        rh_ra_vars: "{{ _rh_clp_tv[_rh_clp_vrow[0]] }}"
        rh_ra_refusal: "{{ cd.refusals.source }}"
        rh_ra_max_bytes: "{{ xp.budget.payload_max_bytes[_rh_clp_vrow[0]] }}"
        rh_ra_scope: "{{ rh.controller.entry_generation.render.n10.scopes.module }}"
        rh_ra_op: "{{ rh.controller.entry_generation.render.n10.ops.verify }}"
        rh_ra_site: "{{ _rh_clp_skeys | from_json | first }}"

    - name: Refuse a published projection that is not three fresh renders of the admitted inputs in their declared shapes
      vars:
        xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        xr: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.cold_launch_release }}"
        cm: "{{ rh.controller.bootstrap.source_admission.bootstrap_input.construction }}"
        _rh_clp_out_p: *clp_out
        _rh_clp_rt: *clp_rt
        _rh_clp_txt: >-
          {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for r in _rh_clp_fin.results -%}
          {%- set ns.p = ns.p + [[r.item.key, lookup('ansible.builtin.file', _rh_clp_out_p ~ rh.controller.bootstrap.path_admission.separator ~ r.item.value.file, rstrip=false)]] -%}
          {%- endfor -%}{{ dict(ns.p) }}
        _rh_clp_doc: "{{ dict(_rh_clp_txt | dictsort | map('first') | zip(_rh_clp_txt | dictsort | map('last') | map('from_json'))) }}"
        # role -> [flag, published text] for each s34 source_record output (the words the argv must end with)
        _rh_clp_src: >-
          {%- set fw = namespace(v=rh.controller.bootstrap) -%}
          {%- for k in xp.argv_slots.source_record.flag_from -%}{%- set fw.v = fw.v[k] -%}{%- endfor -%}
          {%- set ns = namespace(p=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for role in xp.argv_slots.source_record.outputs -%}{%- set ns.p = ns.p + [[role, [fw.v, _rh_clp_txt[role]]]] -%}{%- endfor -%}
          {{ dict(ns.p) }}
        _rh_clp_bad: >-
          {%- set ns = namespace(b=rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows) -%}
          {%- for r in _rh_clp_fin.results -%}
          {%- if not (r.stat.exists and r.stat.isreg and not r.stat.islnk) or r.stat.mode != xp.output_mode
                or r.stat.uid != lookup('ansible.builtin.vars', xp.output_dir.owner_fact.var) | int
                or (_rh_clp_txt[r.item.key] | hash(_rh_sa_decl.digest_algorithm)) != r.stat.checksum -%}
          {%- set ns.b = ns.b + [r.item.key] -%}{%- endif -%}{%- endfor -%}
          {{ ns.b }}
      ansible.builtin.assert:
        that:
          - (_rh_clp_fin.results | length) == (xp.outputs | length)
          - _rh_clp_bad == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          # companions: a flat map, exactly the X4 companions, equal to the supplied companion inputs (independent)
          - _rh_clp_doc.companions is mapping
          - (_rh_clp_doc.companions.keys() | list | sort) == (xr.companions | sort)
          - (_rh_clp_doc.companions | to_json(sort_keys=true)) == (dict(xr.companions | zip(query('ansible.builtin.vars', *xr.companions))) | to_json(sort_keys=true))
          # envelope: exactly one early-name record whose binding fields carry the same companion values
          - _rh_clp_doc.envelope is mapping
          - (_rh_clp_doc.envelope.keys() | list) == [xr.ingress.envelope.early_name]
          - >-
            rh.controller.bootstrap.source_admission.bootstrap_input.record_keys | map('extract', cm.fields)
            | selectattr('source', 'equalto', cm.sources.binding) | map(attribute='pinned')
            | map('extract', _rh_clp_doc.companions) | list
            == (rh.controller.bootstrap.source_admission.bootstrap_input.record_keys
                | select('in', cm.fields | dict2items | selectattr('value.source', 'equalto', cm.sources.binding) | map(attribute='key') | list)
                | map('extract', _rh_clp_doc.envelope[xr.ingress.envelope.early_name]) | list)
          # argv: a list of strings ending with the X4 playbook word then the s34 source_record words: per declared
          # output, the extra_vars flag + EXACTLY the published text of that output (the argv carries what was published)
          - _rh_clp_doc.argv is sequence and _rh_clp_doc.argv is not string and _rh_clp_doc.argv is not mapping
          - _rh_clp_doc.argv | reject('string') | list == rh.controller.bootstrap.genesis.initializer.custody.cold_launch.initial.rows
          - >-
            _rh_clp_doc.argv[(_rh_clp_doc.argv | length) - (xp.argv_slots.source_record.outputs | map('extract', _rh_clp_src) | flatten | list | length) - 1:]
            == [rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.entry_rel]
               + (xp.argv_slots.source_record.outputs | map('extract', _rh_clp_src) | flatten | list)
        fail_msg: >-
          REFUSED {{ rh.controller.bootstrap.genesis.initializer.custody.cold_launch.refusals.source }}: {{ rh.controller.bootstrap.genesis.initializer.custody.texts.binding }}
          {{ [_rh_clp_out_p, _rh_clp_bad] | to_json }}
        quiet: true

    # codex 914 (1) BUDGET: the measured staged bytes N13 reports beside the frozen caps and the capacity slots; never a
    # claim that the output fits anything but this run's measurement. The rows printed are the X3 projection rows
    # {role, path, sha256} (field_shapes.projection) X3's writer binds. Locators, digests and sizes only (codex 916 (4)).
    - name: Report the projection (locators, digests, measured bytes against the frozen caps; MAIN admits X3 independently)
      vars:
        xp: "{{ rh.controller.bootstrap.genesis.initializer.custody.external_invocation.envelope_projection }}"
        _rh_clp_out_p: *clp_out
      ansible.builtin.debug:
        msg: >-
          {{ _rh_rsv_outcome }} {{ _rh_clp_out_p }}
          {{ _rh_clp_fin.results | map(attribute='item.key') | zip(_rh_clp_fin.results | map(attribute='stat.path'), _rh_clp_fin.results | map(attribute='stat.checksum')) | list | to_json }}
          {{ _rh_rsv_bytes | to_json(sort_keys=true) }} {{ xp.budget.payload_max_bytes | to_json(sort_keys=true) }}
          {{ xp.capacity | to_json(sort_keys=true) }}
