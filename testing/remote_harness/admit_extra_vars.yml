---
# testing/remote_harness/admit_extra_vars.yml -- NORMAL-RUN EXTRA-VAR ADMISSION STAGE (route records-route-adm-01;
# OW-L15-ADM-UNIT). NEW FILE, a never-generated member (as verify_entries.yml). AUTHORED, NEVER EXECUTED (UNRUN).
#
# Started ONLY by the seed's normal run (controller_seed.j2, records-route-adm-01 ADM-H2) as a child occurrence after
# entry_verify and before the final run. It uses the final run's launch word run_launch(bs) and a CLOSED argv: the
# run_local inventory, this playbook, the run_local pinned vars, the inventory root / owner vars, ONE stage input
# (seed_launch.extra_var_admission.stage.input_var) and, LAST, the launcher bootstrap record rh_source_bootstrap.
# The caller values are files named by that input (C1 records-32 OW-32-02), never -e words here.
# Order: first-entry guard -> controller binding -> resolve_harness.yml -> stage input -> values ->
# lme_extra_var_files -> for each @file, tasks/admit_extra_var_file.yml: root / path rule / ancestry, kind, then
# retention in this stage's own act evidence dir (custody retain_impl) -> retention record -> lme_extra_var_admit with
# the C1 records-35 carrier rows of the retention (the filter reads the retained bytes itself). Exit 0 only when
# every value was admitted.
# Output (life-15 L15-ADM-02; records-34 OW-34-04): every task that holds a caller value, a caller path or a snapshot
# reference is no_log. A refusal is either the filter's declared text, or the common refusal grammar with a declared
# text and the argument ordinal.
- name: Normal-run extra-var admission -- admit every caller extra-var before the final run
  hosts: "{{ rh_controller_target }}"
  gather_facts: false
  become: false
  tasks:
    - name: Refuse pre-supplied derived outputs and derive the repository root
      ansible.builtin.include_tasks: tasks/refuse_pinned_outputs.yml

    - name: Bind the effective controller connection before any effect (local, no become)
      ansible.builtin.include_tasks: tasks/admit_controller.yml

    - name: Admit the loader closure, resolve the harness policy, verify the receipt and bind the executor
      ansible.builtin.include_tasks: tasks/resolve_harness.yml

    - name: Bind the admission node, its refusal code and grammar entry, and the stage input
      ansible.builtin.set_fact:
        rh_adm_x: "{{ rh.controller.bootstrap.seed_launch.extra_var_admission }}"
        rh_adm_bs: "{{ rh.controller.bootstrap }}"
        rh_adm_sep: "{{ rh.controller.bootstrap.path_admission.separator }}"
        rh_adm_code: "{{ rh.controller.bootstrap.work_roots.run_local.caller_vars.refusal }}"
        rh_adm_rf: "{{ rh_repo_root ~ rh.controller.bootstrap.path_admission.separator ~ rh.controller.bootstrap.refusal_grammar.entry_rel }}"
        rh_adm_in: "{{ lookup('ansible.builtin.vars', rh.controller.bootstrap.seed_launch.extra_var_admission.stage.input_var) }}"

    - name: Admit the stage input (exactly the declared keys; the act and the evidence dir the seed composed)
      vars:
        _ik: "{{ rh_adm_x.stage.input_keys }}"
        _er: >-
          {{ rh_adm_in[_ik.work_root] ~ rh_adm_sep ~ rh_adm_bs.work_roots.sub_roots[rh_adm_x.evidence.sub]
             ~ rh_adm_sep ~ rh_adm_x.evidence.rel }}
      ansible.builtin.assert:
        that:
          - (rh_adm_in.keys() | list | sort) == (_ik.values() | list | sort)
          - rh_adm_in[_ik.count] is integer
          - rh_adm_in[_ik.act] is regex(rh_adm_bs.genesis.launch.stage_root.act.regex, match_type=rh_adm_bs.genesis.launch.stage_root.act.match)
          - rh_adm_in[_ik.evidence_dir] == _er ~ rh_adm_sep ~ rh_adm_in[_ik.act]
          - rh_adm_in[_ik.evidence_dir] == rh_adm_in[_ik.evidence_dir] | ansible.builtin.normpath
          - rh_adm_in[_ik.protected] | length > 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_adm_rf,
                    template_vars={'rh_rf_grammar': rh_adm_bs.refusal_grammar, 'rh_rf_code': rh_adm_code,
                                   'rh_rf_detail': [rh_adm_x.texts.stage]}) }}
        quiet: true

    - name: Read the running uid with the declared tool (the admit_ancestry.yml :80-84 form; the retention owner)
      ansible.builtin.command:
        argv: ["{{ rh_adm_bs.os_tools.id.path }}", -u]
      register: rh_adm_uid
      changed_when: false

    - name: Admit the values dir with the ONE ancestry rule
      ansible.builtin.include_tasks: tasks/admit_ancestry.yml
      vars:
        rh_anc_bs: "{{ rh_adm_bs }}"
        rh_anc_repo_root: "{{ rh_repo_root }}"
        rh_anc_path: "{{ rh_adm_in[rh_adm_x.stage.input_keys.values_dir] }}"
        rh_anc_refusal: "{{ rh_adm_code }}"

    - name: Stat every value file (seed-written, one per argument ordinal; no link followed)
      ansible.builtin.stat:
        path: >-
          {{ rh_adm_in[rh_adm_x.stage.input_keys.values_dir] ~ rh_adm_sep
             ~ (rh_adm_x.stage.value_rel | replace(rh_adm_x.file.placeholders.ordinal, item | string)) }}
        follow: false
        get_checksum: false
        get_mime: false
        get_attributes: false
      loop: "{{ range(1, rh_adm_in[rh_adm_x.stage.input_keys.count] + 1) | list }}"
      register: rh_adm_vst

    - name: Refuse a missing, linked, non-regular or foreign-owned value file
      vars:
        _s: "{{ rh_adm_vst.results | map(attribute='stat') | list }}"
      ansible.builtin.assert:
        that:
          - _s | rejectattr('exists') | list | length == 0
          - _s | selectattr('islnk') | list | length == 0
          - _s | rejectattr('isreg') | list | length == 0
          - _s | rejectattr('uid', 'equalto', rh_adm_uid.stdout | int) | list | length == 0
        fail_msg: >-
          {{ lookup('ansible.builtin.template', rh_adm_rf,
                    template_vars={'rh_rf_grammar': rh_adm_bs.refusal_grammar, 'rh_rf_code': rh_adm_code,
                                   'rh_rf_detail': [rh_adm_x.texts.stage]}) }}
        quiet: true

    - name: Read the caller values in argument order (declared input; no_log)
      no_log: true
      ansible.builtin.slurp:
        src: "{{ item.stat.path }}"
      loop: "{{ rh_adm_vst.results }}"
      register: rh_adm_vrd

    - name: Bind the caller values as argument strings (no_log)
      no_log: true
      ansible.builtin.set_fact:
        rh_adm_values: "{{ rh_adm_vrd.results | map(attribute='content') | map('ansible.builtin.b64decode') | list }}"

    - name: Select the @file ordinals (records-32 lme_extra_var_files; a bare path refuses with its declared text)
      block:
        - name: Dispatch the caller values in argument order (no_log)
          no_log: true
          ansible.builtin.set_fact:
            rh_adm_files: "{{ rh_adm_values | lme_extra_var_files(rh_adm_x, rh) }}"
            rh_adm_snaps: []
      rescue:
        - name: Refuse with the filter's declared text only
          vars:
            _m: "{{ ansible_failed_result.msg | ansible.builtin.regex_search((rh_adm_code | ansible.builtin.regex_escape) ~ ' [^\\n]*') }}"
          ansible.builtin.fail:
            msg: >-
              {{ _m if _m else lookup('ansible.builtin.template', rh_adm_rf,
                                      template_vars={'rh_rf_grammar': rh_adm_bs.refusal_grammar, 'rh_rf_code': rh_adm_code,
                                                     'rh_rf_detail': [rh_adm_x.texts.stage]}) }}

    - name: Admit and retain each @file (root, kind, retention; one ordinal per include)
      ansible.builtin.include_tasks: tasks/admit_extra_var_file.yml
      loop: "{{ rh_adm_files }}"
      loop_control:
        loop_var: rh_adm_f
        label: "{{ rh_adm_f.ordinal }}"

    # records-route-life-19 (codex-tick836 F-836; O-L16-01): the retention record path is derived ONCE from the admitted
    # evidence_dir, the declared separator and evidence.retention_rel. The pinned stat of an absent path returns
    # exists only (no path), so no task reads a path from a stat result; the stat is observation only.
    - name: Derive the retention record path once (admitted evidence_dir, declared separator, evidence.retention_rel)
      no_log: true
      ansible.builtin.set_fact:
        rh_adm_rr: "{{ rh_adm_in[rh_adm_x.stage.input_keys.evidence_dir] ~ rh_adm_sep ~ rh_adm_x.evidence.retention_rel }}"

    # Declared exclusive first creation in the exclusive act dir (life-16 C-ADM01-06): absent first, a copy that must
    # have created the record, then owner / kind / mode / content readback. Scoped to this write only.
    - name: Write the retention record by exclusive first creation (one line per @file ordinal -- ordinal, separator, retention digest)
      no_log: true
      vars:
        _ri: "{{ rh_adm_bs.genesis.initializer.custody.retain_impl }}"
        _rc: "{% for s in rh_adm_snaps %}{{ s[rh_adm_x.file.snapshot_record | first] }}{{ rh_adm_bs.bundle.checksum_format.separator }}{{ s[rh_adm_x.file.snapshot_record | last] }}\n{% endfor %}"
      block:
        - name: Refuse a derived retention record path that is not normalized
          ansible.builtin.assert:
            that:
              - rh_adm_rr == rh_adm_rr | ansible.builtin.normpath
            quiet: true

        - name: Observe the retention record path (observation only; no link followed)
          ansible.builtin.stat:
            path: "{{ rh_adm_rr }}"
            follow: false
            get_checksum: false
            get_mime: false
            get_attributes: false
          register: rh_adm_rrs

        - name: Refuse an existing retention record (absent first)
          ansible.builtin.assert:
            that:
              - not rh_adm_rrs.stat.exists
            quiet: true

        - name: Copy the record lines to the derived path (no overwrite; declared mode; no link followed)
          ansible.builtin.copy:
            dest: "{{ rh_adm_rr }}"
            content: "{{ _rc }}"
            mode: "{{ rh_adm_x.file.snapshot.mode }}"
            force: false
            follow: false
          register: rh_adm_rrc

        - name: Refuse a copy that did not create the record (force false skips an existing destination without error)
          ansible.builtin.assert:
            that:
              - rh_adm_rrc.changed
            quiet: true

        - name: Read back the retention record facts with the declared digest
          ansible.builtin.stat:
            path: "{{ rh_adm_rr }}"
            follow: false
            get_checksum: true
            checksum_algorithm: "{{ _ri.fixed.digest }}"
            get_mime: false
            get_attributes: false
          register: rh_adm_rra

        - name: Refuse a retention record that is not the written lines, owner, kind or mode
          ansible.builtin.assert:
            that:
              - rh_adm_rra.stat.exists
              - not rh_adm_rra.stat.islnk
              - rh_adm_rra.stat.isreg
              - rh_adm_rra.stat.uid == rh_adm_uid.stdout | int
              - rh_adm_rra.stat.mode == rh_adm_x.file.snapshot.mode
              - rh_adm_rra.stat.checksum == _rc | hash(_ri.fixed.digest)
            quiet: true
      rescue:
        - name: Refuse file_snapshot with the declared text only
          ansible.builtin.fail:
            msg: >-
              {{ lookup('ansible.builtin.template', rh_adm_rf,
                        template_vars={'rh_rf_grammar': rh_adm_bs.refusal_grammar, 'rh_rf_code': rh_adm_code,
                                       'rh_rf_detail': [rh_adm_x.texts.file_snapshot]}) }}

    - name: Admit every caller value (records-32 lme_extra_var_admit; records-35 carrier; declared refusal text only)
      block:
        - name: Admit in argument order (the filter reads each retained snapshot itself; nothing is installed here)
          no_log: true
          ansible.builtin.set_fact:
            rh_adm_admitted: "{{ rh_adm_values | lme_extra_var_admit(rh_adm_x, rh, rh_adm_in[rh_adm_x.stage.input_keys.protected], rh_adm_snaps) }}"
      rescue:
        - name: Refuse with the filter's declared text only
          vars:
            _m: "{{ ansible_failed_result.msg | ansible.builtin.regex_search((rh_adm_code | ansible.builtin.regex_escape) ~ ' [^\\n]*') }}"
          ansible.builtin.fail:
            msg: >-
              {{ _m if _m else lookup('ansible.builtin.template', rh_adm_rf,
                                      template_vars={'rh_rf_grammar': rh_adm_bs.refusal_grammar, 'rh_rf_code': rh_adm_code,
                                                     'rh_rf_detail': [rh_adm_x.texts.stage]}) }}
