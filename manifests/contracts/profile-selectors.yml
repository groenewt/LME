lme_profile_selectors:
  schema_version: 1
  provenance:
    authority: .ocr/sessions/2026-09-22-fix-debian-13-selinux-apt/requirements-src/2026-09-22-observability-implementation.md
    section: Interfaces and invariants
    architecture: .ocr/sessions/2026-09-22-fix-debian-13-selinux-apt/requirements-src/2026-09-22-manifest-reconciliation.md
    database_membership: config/postgresql-platform/runtime-inventory-requirements.contract.yaml
    qualification: Selector composition and admission only; bindings do not prove runtime readiness.
  template: profile_selectors.yml.j2
  admission_template: profile_admission.yml.j2
  macros: macros/profile_selectors.j2
  empty: {mapping: {}, sequence: [], text: ''}
  empty_overlay: {vars: {}, lme_global: {}, services: {}}
  constants: {zero: 0, enabled: true, disabled: false}
  tests: {string: string}
  overlay_fields: {variables: vars, global: lme_global, services: services}
  result_fields:
    overlay: overlay
    selected: selected
    required_roles: required_roles
    required_inputs: required_inputs
    errors: errors
  input_selection_member: selections
  global_bindings_field: application_service_bindings
  service_enabled_field: enabled_when
  service_always: [always]
  destination_separator: ','
  destination_field: lme_telemetry_destinations
  destination_selector: lme_telemetry_profile
  destination_effective_field: effective_profile
  derived_fields: [lme_effective_telemetry_profile, lme_effective_telemetry_destinations]
  derived_profile_field: lme_effective_telemetry_profile
  derived_destinations_field: lme_effective_telemetry_destinations
  selected_profile_field: profile
  selected_destinations_field: destinations
  role_services_field: service_refs
  task_names:
    compose: Compose independent profile overlays through the existing resolver
    readback: Verify independent profile composition from admitted declarations
    admit: Admit selected profiles and required service bindings before activation
  errors:
    selector: unsupported_or_empty_selector
    destinations_without_profile: destinations_require_telemetry_profile
    destinations_type: destinations_must_be_nonempty_csv_or_sequence
    destinations_duplicate: duplicate_destinations
    destinations_unsupported: unsupported_destination_set
    overlay: profile_overlay_must_declare_mapping_members
    input: required_profile_input_absent
    bindings: required_service_role_binding_absent
    service: required_service_manifest_absent
    disabled: required_service_disabled
    declaration: selector_catalog_declaration_invalid
  refusal: Independent profile composition or required service admission failed before activation.
  merge_order: [base_profile, database_profile, telemetry_profile, operator]
  axes:
    - id: database
      field: lme_database_profile
      options:
        dual-owned-ha:
          profile_overlay: {vars: {}, lme_global: {}, services: {}}
          required_roles: [postgresql.hertzbeat, postgresql.vector, postgresql.control, postgresql.writer_proxies, postgresql.backup, postgresql.fencing]
          required_inputs: [lme_deployment_identity, lme_database_membership, lme_database_owners, lme_database_providers, lme_database_backup, lme_database_slot_guard_standby]
        shared-ha:
          profile_overlay: {vars: {}, lme_global: {}, services: {}}
          required_roles: [postgresql.shared, postgresql.control, postgresql.writer_proxies, postgresql.backup, postgresql.fencing]
          required_inputs: [lme_deployment_identity, lme_database_membership, lme_database_owners, lme_database_providers, lme_database_backup, lme_database_slot_guard_standby]
    - id: telemetry
      field: lme_telemetry_profile
      options:
        elastic-only:
          destinations: [elastic]
          profile_overlay:
            vars: {install_otel: true, install_legacy_beats: false}
            lme_global: {}
            services: {}
          required_roles: [telemetry.otel, telemetry.hertzbeat_collection, telemetry.wazuh, telemetry.durable_delivery, destination.elastic]
          required_inputs: []
        elastic-plus-hertzbeat:
          destinations: [elastic, hertzbeat]
          profile_overlay:
            vars: {install_otel: true, install_legacy_beats: false}
            lme_global: {}
            services: {}
          required_roles: [telemetry.otel, telemetry.hertzbeat_collection, telemetry.wazuh, telemetry.durable_delivery, destination.elastic, destination.hertzbeat]
          required_inputs: []
        full-mirror:
          destinations: [elastic, hertzbeat, malcolm]
          profile_overlay:
            vars: {install_otel: true, install_legacy_beats: false}
            lme_global: {}
            services: {}
          required_roles: [telemetry.otel, telemetry.hertzbeat_collection, telemetry.wazuh, telemetry.durable_delivery, destination.elastic, destination.hertzbeat, destination.malcolm]
          required_inputs: []
  binding_policy:
    role_names: Semantic requirements, never provisional service IDs.
    data_home: lme_global.application_service_bindings
    shape: role to mapping containing service_refs as a nonempty unique list of declared service IDs
    overrides: Base global then composed profile global then operator override LAST.
    absence: Required missing, disabled or undeclared services fail; runtime discovery cannot shrink requirements.
    destinations: Effective selection controls new admissions only; no historical obligation removal or adapter cleanup is implemented here.
    database: No fallback between profiles; initialized-storage migration admission remains a separate mandatory activation dependency.
    omitted: No overlays, required roles or collector changes when independent selectors are absent.
    placement: This gate checks the full service catalog and enable predicates only. All-host declared placement coverage remains mandatory for application activation; a host-local rendered subset cannot establish that coverage.
  registry_fields:
    lme_telemetry_profile: {type: str, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: ''}
    lme_telemetry_destinations: {type: str, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: ''}
    lme_effective_telemetry_profile: {type: str, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: ''}
    lme_effective_telemetry_destinations: {type: list, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: []}
  existing_registry_field_updates:
    lme_database_profile: {bridge_absent: ''}
