        # OWNER KEY (J-KEY, B status: proposal): OPTIONAL member of target_prereq; checked only when declared
        target_prereq_owner_key:
          root: controller.bootstrap.target_prereq.owner_key
          when_present: controller.bootstrap.target_prereq.owner_key
          checks:
            - {path: '', keys: [status, generator_tool, key_type, storage_rel, dir_mode, file_mode, rotation, never_rotated]}
            - {path: status, enum: [proposal]}
            # J-KEY (codex-tick328-329 ssh_keygen): the generator is a CONTROLLER executable required_by owner_key_generation
            # (never target-only). Since J-KEY JK-1 the canonical os_tools.ssh-keygen carries that label (the J-KEY node
            # itself is controller.bootstrap.owner_key, contract owner_key); without such a tool this legacy node refuses
            # here (no conditional-missing bypass).
            - {path: generator_tool, subject: scalar, within: [controller.bootstrap.os_tools], having: {field: required_by, contains: owner_key_generation}}
            - {path: key_type, enum: [ed25519]}
            - {path: storage_rel, pattern: rel_segment}
            - {path: dir_mode, enum: ['0700']}
            - {path: file_mode, enum: ['0600']}
            - {path: rotation, enum: [[admit_replacement, prove_access, retire_prior]]}
            - {path: never_rotated, enum: [[privileged_bootstrap_key]]}
        # OS-TOOL CONSUMER PARTITION (codex-tick328-329 os_tool_partition; C1 owns it, route testing/remote_harness/
        # package.yml consumes it): controller.bootstrap.os_tool_consumers is the ONE closed vocabulary of os_tools
        # required_by labels -- EXACTLY {controller, target}, each a nonempty distinct list, the two disjoint, and each
        # pinned to the registered vocabulary below (not tunable; a changed, extended or reordered set refuses). Every
        # os_tools entry must carry required_by, a nonempty distinct list naming only registered labels: an unknown or
        # empty label list refuses here, at resolve (never silently skipped by packaging). Controller-admission rule
        # (route): an entry with ANY controller label is a controller precondition; only exclusively-target entries are
        # skipped by controller packaging, and their target admission is unchanged. owner_key_generation binds
        # os_tools.ssh-keygen (J-KEY JK-1; contract owner_key). ALWAYS checked (no when_present): package.yml needs the
        # partition on every policy.
        os_tool_consumers:
          root: controller.bootstrap
          checks:
            - {path: os_tool_consumers, keys: [controller, target]}
            - {path: os_tool_consumers, each: true, strings: {nonempty: true, distinct: true}}
            - {path: os_tool_consumers.controller, disjoint_from: [os_tool_consumers.target]}
            # + preparation (C1 hunk 4, P-x; preparation.tool_label): a controller consumer admitted at its own use boundary
            # (tasks/admit_prep_tools.yml); package.yml :107-114 skips preparation-only entries (required_by a subset of
            # target + [preparation]), so "ANY controller label = packaging precondition" now reads "any controller label
            # other than preparation".
            - {path: os_tool_consumers.controller, enum: [[seed, uv_installer, package_source_binding, source_edition_binding, owner_key_generation, preparation, entry_generation, source_admission]]}
            - {path: os_tool_consumers.target, enum: [[target_adapter, privileged_contact, target_prereq, guest, observation]]}
            - {path: os_tools, each: true, has_keys: [required_by]}
            - {path: os_tools.*.required_by, strings: {nonempty: true, distinct: true}}
            - {path: os_tools.*.required_by, subject: list, within: [controller.bootstrap.os_tool_consumers.controller, controller.bootstrap.os_tool_consumers.target]}
        # J-KEY OWNER KEY (B-graph c1-jkey-proposal JK-3; codex-graph-critical-path-key-and-profile-20260925,
        # codex-tick341; MAIN relay: decl 9c26b51e adds encryption): controller.bootstrap.owner_key, the declaration
        # copied verbatim from testing/e2e/target_prereq/owner_key.decl.yml (revision 1), EXACT keys at every level.
        # Every non-tunable leaf is pinned (a changed mode, regex, schema, step list or passphrase/encryption mode is a
        # NEW revision, never a retune); the tunables (tunable_paths) are generation (integer >= 1) and storage.keys_rel
        # (one bounded segment). The generator is the os_tools entry ssh-keygen: declared, EXACTLY {path, required_by,
        # identity} (so never `conditional`) and required_by EXACTLY [owner_key_generation]. NOT expressible without an
        # engine change (reported gap, enforced by the consumer owner_key.yml): "no OTHER os_tools entry also carries
        # owner_key_generation" (no exactly-one check kind). Checked only when declared (when_present).
        # JK-6 (c1-jkey-proposal b27057d8, FROZEN decl 4d3ef888; MAIN relay): + passphrase_argv (the declared mode's
        # ssh-keygen argv, pinned; `encryption` must NAME an entry), + storage.pub_suffix [.pub], + location_rule_rel
        # (rel_path, pinned), + run_order (pinned); - storage.deployment_regex (the identity is validated ONLY by
        # lme_validated_deployment_identity). None of the added leaves is tunable.
        owner_key:
          root: controller.bootstrap.owner_key
          when_present: controller.bootstrap.owner_key
          checks:
            - {path: '', keys: [revision, runner, refusal, tool_consumer, key_type, pubkey_regex, name_regex, passphrase, encryption,
                                passphrase_argv, comment_template, generation, storage, ops, record_schema, record_states, obligations,
                                never_rotated, readback, pub_digest, entry_guard, cases_rel, location_rule_rel, run_order]}
            - {path: revision, enum: [1]}
            - {path: runner, enum: [controller_non_root]}
            - {path: refusal, enum: [JKEY]}
            - {path: tool_consumer, enum: [owner_key_generation]}
            - {path: tool_consumer, subject: scalar, within: [controller.bootstrap.os_tool_consumers.controller]}
            - {at: controller.bootstrap.os_tools.ssh-keygen, keys: [path, required_by, identity]}
            - {at: controller.bootstrap.os_tools.ssh-keygen.required_by, enum: [[owner_key_generation]]}
            - {path: key_type, enum: [ed25519]}
            - {path: pubkey_regex, enum: ['^ssh-ed25519 [A-Za-z0-9+/]+={0,3}( [ -~]*)?$']}
            - {path: name_regex, enum: ['^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$']}
            - {path: passphrase, enum: [none]}
            # a passphrase-protected owner key is a different declared mode (a new revision), never a variant
            - {path: encryption, enum: [unencrypted_by_declaration]}
            - {path: passphrase_argv, keys: [unencrypted_by_declaration]}
            - {path: encryption, subject: scalar, within: [controller.bootstrap.owner_key.passphrase_argv]}
            - {path: passphrase_argv.unencrypted_by_declaration, keys: [generate, pair_check]}
            - {path: passphrase_argv.unencrypted_by_declaration.generate, enum: [['-N', '']]}
            - {path: passphrase_argv.unencrypted_by_declaration.pair_check, enum: [['-P', '']]}
            - {path: comment_template, enum: ['lme-owner:{deployment}:{target}:{owner}:g{generation}']}
            - {path: generation, positive_int: true}
            - {path: storage, keys: [sub_root, keys_rel, key_name, pub_suffix, next_suffix, record_name, dir_mode, file_mode, pub_modes,
                                     target_regex, owner_regex]}
            - {path: storage.sub_root, enum: [credentials]}
            - {path: storage.sub_root, subject: scalar, within: [controller.bootstrap.work_roots.sub_roots]}
            - {at: controller.bootstrap.work_roots.sub_roots.credentials, pattern: bounded_segment}
            - {path: storage.sub_root, pattern: bounded_segment}
            - {path: storage.keys_rel, pattern: bounded_segment}
            - {path: storage.key_name, pattern: bounded_segment}
            - {path: storage.record_name, pattern: bounded_segment}
            - {path: storage.key_name, enum: [id_ed25519]}
            - {path: storage.pub_suffix, enum: [.pub]}
            - {path: storage.next_suffix, enum: [.next]}
            - {path: storage.record_name, enum: [owner_key.record.json]}
            - {path: storage.dir_mode, enum: ['0700']}
            - {path: storage.file_mode, enum: ['0600']}
            - {path: storage.pub_modes, strings: {nonempty: true, distinct: true}}
            - {path: storage.pub_modes, each: true, enum: ['0644', '0600']}
            - {path: storage.target_regex, enum: ['^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$']}
            - {path: storage.owner_regex, enum: ['^[a-z_][a-z0-9_-]{0,31}$']}
            - {path: ops, enum: [[ensure, rotate, locate]]}
            - {path: record_schema, pattern: schema_tag}
            - {path: record_schema, enum: [lme-owner-key-record/1]}
            - {path: record_states, enum: [[started, done]]}
            - {path: obligations, keys: [kinds, steps, closed_by, retirement_condition]}
            - {path: obligations.kinds, enum: [[rotation, generation_change]]}
            - {path: obligations.steps, enum: [[admit_replacement, prove_access, retire_prior]]}
            - {path: obligations.closed_by, enum: [owner_rotate_leg]}
            - {path: obligations.retirement_condition, strings: {nonempty: true, distinct: true}}
            - {path: obligations.retirement_condition, enum: [[admit_replacement_readback, prove_access_next_only, retire_prior_readback]]}
            - {path: never_rotated, enum: [[privileged_bootstrap_key]]}
            - {path: readback, keys: [fingerprint_hash, compare_fields]}
            - {path: readback.fingerprint_hash, enum: [sha256]}
            - {path: readback.compare_fields, enum: [2]}
            - {path: entry_guard, keys: [derived, family]}
            - {path: entry_guard.derived, enum: [[jk, jk_dir]]}
            - {path: entry_guard.family, enum: [reserved_owner_key_vars]}
            - {path: cases_rel, pattern: rel_path}
            - {path: location_rule_rel, pattern: rel_path}
            - {path: location_rule_rel, enum: [testing/e2e/target_prereq/templates/owner_key_location.j2]}
            - {path: run_order, keys: [after, before]}
            - {path: run_order.after, enum: [[controller_package_apply, run_binding_render]]}
            - {path: run_order.before, enum: [[target_prereq, target_bootstrap]]}
