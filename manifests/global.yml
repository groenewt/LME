                    - sha256
                services:
                  fact: lme_services
                  path: []
                global_manifest:
                  fact: lme_global
                  path: []
                host_rendered:
                  fact: lme_host_rendered_services
                  path: []
          - path: receipt_field
            enum:
            - configuration_revision
          - path: producers
            enum:
            - - ansible.roles.podman.load_manifests
          - path: texts
            enum:
            - version: the resolved-configuration record carries no schema_version or one outside supported_versions
              shape: the resolved-configuration record is not a mapping carrying exactly the declared fields
              configuration: the configuration or origins field is null, a scalar or a mapping the resolver verification refuses, whatever its digest
              identity: the configuration revision recomputed from the record does not equal its configuration_revision field
              producer: the record names a producer outside the admitted producers
              binding: the record names another cell, source commit, source tree or profile than the bound run
          - path: producer_binding
            enum:
            - cell:
