            # record words, pinned (a word change is a declared migration of package.yml, package_bundle.yml and genesis N7).
            # Field lists are whole-list enums; class_records is a whole-mapping enum plus the type-exact follow row.
            - {path: receipt, keys: [bundle_fields, class_fields, class_records, coverage, fields, format, mode, outcomes, record_rel, refusal, schema, source_fields]}
            - {path: receipt.schema, pattern: schema_tag}
            - {path: receipt.schema, enum: [lme-package-publication/2]}
            - {path: receipt.format, enum: [yaml]}
            - {path: receipt.record_rel, enum: [package-publication.yml]}
            - {path: receipt.mode, enum: ['0600']}
            - {path: receipt.fields, enum: [[act, classes, resumed, schema, source, stage]]}
            - {path: receipt.source_fields, enum: [[declaration_rel, declaration_sha256, edition]]}
            - {path: receipt.source_fields, subject: list, within: [controller.bootstrap.source_admission.bootstrap_input.record_keys]}
            - {path: receipt.class_fields, enum: [[bundle, lock_sha256, outcome, trusted_oid]]}
            - {path: receipt.bundle_fields, enum: [[bytes, checksum_file_sha256, class_key, dir, expected_generation, launcher_sha256, manifest_sha256, members, seed_sha256]]}
            - {path: receipt.outcomes, enum: [[published, unchanged, observed_on_resume]]}
            - {path: receipt.coverage, enum: [partition]}
            - {path: receipt.class_records, enum: [{dir_rel: package-publication.classes, dir_mode: '0700', name: '{class_key}.yml', format: yaml, mode: '0600', follow: false, create: exclusive}]}
            - {path: receipt.class_records.follow, enum: [false]}
