          entry_count: 2
          templates:
            - testing/remote_harness/templates/lme-genesis-entry.sh.j2
            - testing/remote_harness/templates/source_bootstrap.yml.j2
            - testing/remote_harness/templates/macros/genesis_entry.j2
            - testing/remote_harness/templates/macros/controller_seed.j2
          inputs: {lme_entry_binding: controller.bootstrap.genesis.entry.render.context_binding, lme_entry_context: controller.bootstrap.source_admission.early_view.context_fields, lme_entry_struct: controller}
          checkout_inputs: {}
          consumers: [seed, uv_installer, source_admission]
          not_embedded_fields: []
          when_present: controller.bootstrap.genesis
