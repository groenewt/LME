                  path: []
                admission:
                  fact: _lme_rh_admission
                  path: []
                source:
                  fact: lme_resolved_verification_source
                  path: []
              revision:
                registry:
                  fact: _lme_global_file
                  path:
                  - lme_config_registry
                profile:
                  name:
                    fact: lme_profile
                    path: []
                  sha256:
                    fact: lme_profile_loaded
