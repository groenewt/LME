            # F05-S3 S3-SEAM-04 (OD-S3-01 a): launch_context_fields = field -> key path under the RESOLVED
            # controller.bootstrap (rel_path -> the loader-projected source_admission.rel_path_grammar); its keys are disjoint
            # from context_fields (exact key sets above and here) and the launch record's context key set is their union.
            # rel_path_field names the launch_context_fields entry the pre-path-use rel check reads.
            # records-dkjoin-01 DKJ-02: + documents -> the engine-projected source_admission.document_rels (policy_projections
            # source_document_rels); document_rels_field names it for the pre-import admission (never a profile value walk)
            # records-dkjoin-02 (codex-tick724 OD-DKJ02-INCLUDE): + git -> source_admission.git, the launch-bound include
            # selection and git argv; git_field names it for the pre-import admission
            # C1-INVOCATION-CONTEXT-01 G13-08 (F-E; SR-309-07): + document_parse (records-dk03-launch-01, the DK03 parse
            # contract s22..s27 already carry; the exact-key row lacked it inside the C1 lineage) and + invocation (codex 895
            # RP07: the declared invocation requirement read before resolve, source_admission_invocation below).
            - {path: launch_context_fields, keys: [document_parse, documents, git, invocation, rel_path]}
            - {path: launch_context_fields.documents, enum: [[source_admission, document_rels]]}
            - {path: launch_context_fields.git, enum: [[source_admission, git]]}
            - {path: launch_context_fields.rel_path, enum: [[source_admission, rel_path_grammar]]}
            - {path: launch_context_fields.document_parse, enum: [[source_admission, document_parse]]}
            - {path: launch_context_fields.invocation, enum: [[source_admission, invocation]]}
            - {path: rel_path_field, subject: scalar, within: [controller.bootstrap.source_admission.early_view.launch_context_fields]}
            - {path: document_rels_field, subject: scalar, within: [controller.bootstrap.source_admission.early_view.launch_context_fields]}
            - {path: git_field, subject: scalar, within: [controller.bootstrap.source_admission.early_view.launch_context_fields]}
            # records-lg-compose-08 (records-lrh-als-04 OW-ALS4-GL-02 / CF-ALS4-01): the CLOSED attribute role set the first-entry ALS
            # reads (registry contract_admission.vocabulary.attributes, LG6-01); a missing or undeclared role refuses at manifest load,
            # before any read (LH-3 registry row: the subject is the admitted registry node).
            - {at: contract_admission.vocabulary.attributes, registry: true, keys: [item_key, item_value, item_value_var, loop_result_item, result_stat, stat_checksum]}
        # C1-INVOCATION-CONTEXT-01 G13-08 (codex 895 RP07; SR-309-07): source_admission.invocation, the declared invocation
        # requirement resolve_policy reads before resolve (early_view launch_context_fields.invocation). Exact keys; every
        # word equals the ONE registry literal of invocation_context (no second vocabulary); lease_from names the
        # resolved-run var and one of its fields; the lease field and kind sources are the resolved_run pointers; the
        # refusal is a playbook code with declared texts.
        source_admission_invocation:
          root: controller.bootstrap.source_admission.invocation
          checks:
            - {path: '', keys: [capture_fields_from, capture_kinds_from, lease_absent, lease_from, lease_var, mode_var, modes, refusal, requirement_var, requirements, texts]}
            - {path: mode_var, equals_registry: {path: invocation_context.inputs.mode}}
            - {path: lease_var, equals_registry: {path: invocation_context.inputs.lease}}
            - {path: modes, keys: [leased, ordinary]}
            - {path: modes.leased, equals_registry: {path: invocation_context.words.modes.leased}}
            - {path: modes.ordinary, equals_registry: {path: invocation_context.words.modes.ordinary}}
            - {path: requirement_var, equals_registry: {path: invocation_context.leased_requirement.var}}
            - {path: requirements, keys: [leased, ordinary_permitted]}
            - {path: requirements.leased, equals_registry: {path: invocation_context.leased_requirement.words.leased}}
            - {path: requirements.ordinary_permitted, equals_registry: {path: invocation_context.leased_requirement.words.ordinary_permitted}}
            - {path: lease_from, keys: [field, var_from]}
            - {path: lease_from.var_from, enum: [work_roots.run_local.resolved_run.var]}
            - {path: lease_from.field, subject: scalar, within: [controller.bootstrap.work_roots.run_local.resolved_run.fields]}
            - {path: lease_absent, enum: [null]}
            - {path: capture_fields_from, enum: [work_roots.run_local.resolved_run.capture_fields]}
            - {path: capture_kinds_from, enum: [work_roots.run_local.resolved_run.capture_kinds]}
            - {path: refusal, pattern: refusal_code}
            # C1-SR323-CENSUS-05 (route caller census RH-INVOCATION-LEASE pin): the code, pinned (the RH-PROFILE-CAPTURE form).
            - {path: refusal, enum: [RH-INVOCATION-LEASE]}
            - {path: refusal, subject: scalar, within: [controller.bootstrap.playbook_refusals]}
            - {path: texts, keys: [malformed, missing, mode, requirement]}
            - {path: 'texts.*', pattern: text_line}
        # F05-S3 LD-06 (codex-tick530; br-fixed RRP-01 / RRP-02): the pre-import document admission refusal code and its
        # two texts (pre-import admission; resolved-view readback) are admitted here, distinct from the loader channel
        # code (document_channel.refusal).
        source_admission_document_codes:
          root: controller.bootstrap.source_admission
          checks:
            - {path: refusals, has_keys: [document]}
            - {path: refusals.document, pattern: refusal_code}
            - {path: texts, has_keys: [document, document_view]}
            - {path: texts.document, pattern: text_line}
            - {path: texts.document_view, pattern: text_line}
        # FR-CONSTRUCTION OD-CON-01 (codex-tick631): the record value kinds (keys == record_keys, each a word of the ONE
        # kind-test map) and the construction text. NOT gated (codex-tick637: the seed consumes the construction on every
        # render). RESIDUE: the RESOLVED path / kind of each policy field is judged after the projections by resolve_policy.yml.
        source_bootstrap_record_kinds:
          root: controller.bootstrap.source_admission
          checks:
            - {path: bootstrap_input.record_kinds, subject: keys, within: [controller.bootstrap.source_admission.bootstrap_input.record_keys]}
            - {path: bootstrap_input.record_keys, subject: list, within: [controller.bootstrap.source_admission.bootstrap_input.record_kinds]}
            - {path: bootstrap_input.record_kinds, each: true, subject: scalar, within: [controller.entry_generation.struct_kind_tests]}
            - {path: texts.construction, pattern: text_line}
            - {path: refusals.input, pattern: refusal_code}
        # OD_RF_02 / codex-tick673 (IF-S14-PHASE-1): the resolve phase declaration. words is the identity enum; every caller
        # row is a word; caller_param / output are reserved names never listed as retired; N2 compares the three interface
        # names with its literals after the parse (interface constants).
        source_admission_resolve_phases:
          root: controller.bootstrap.source_admission.resolve_phases
          checks:
            - {path: '', keys: [caller_param, callers, names, output, record_free_admissions, retired_inputs, words]}
            - {path: words, keys: [full, record_free]}
            - {path: words.full, enum: [full]}
            - {path: words.record_free, enum: [record_free]}
            - {path: caller_param, pattern: var_name}
            - {path: output, pattern: var_name}
            - {path: retired_inputs, strings: {nonempty: true, distinct: true}}
            - {path: retired_inputs, each: true, pattern: var_name}
            - {path: caller_param, subject: scalar, not_within: [controller.bootstrap.source_admission.resolve_phases.retired_inputs]}
            - {path: output, subject: scalar, not_within: [controller.bootstrap.source_admission.resolve_phases.retired_inputs]}
            - {path: callers, key_pattern: rel_path}
            - {path: callers, each: true, subject: scalar, within: [controller.bootstrap.source_admission.resolve_phases.words]}
            # C1-SR922G (codex 929 SOURCE_BOOTSTRAP_FAILURE_STAGE; paired with profile s44): the generated source bootstrap is a
            # declared resolve caller. Its rel is pinned at both homes (the stage playbook and the producer output, which are
            # the same file) and each must be a callers key; its phase is full (the callers each/within words row above
            # admits it; a key holding '/' and '.' is not addressable by a dotted path, so no per-key enum is written).
            - {at: controller.bootstrap.genesis.launch.stages.source_bootstrap.playbook_rel, enum: [testing/remote_harness/source_bootstrap.yml]}
            - {at: controller.bootstrap.genesis.entry.producer.generated_rel, enum: [testing/remote_harness/source_bootstrap.yml]}
            - {at: controller.bootstrap.genesis.launch.stages.source_bootstrap.playbook_rel, subject: scalar, within: [controller.bootstrap.source_admission.resolve_phases.callers]}
            - {at: controller.bootstrap.genesis.entry.producer.generated_rel, subject: scalar, within: [controller.bootstrap.source_admission.resolve_phases.callers]}
            - {path: record_free_admissions, strings: {nonempty: true, distinct: true}}
            - {path: record_free_admissions, each: true, pattern: var_name}
            # records-c1-framework-17 / -20 / -22 (J-FW20-SA-GL completed by FW22-BOOT-OWNER): the post-view name node carries
            # _rh_sa_caller only; every pre-view name is authored once in the registry contract_admission.early_names.
            - {path: names, keys: [_rh_sa_caller]}
            - {path: 'names.*', keys: [var]}
            - {path: 'names.*.var', pattern: var_name}
            - {path: names._rh_sa_caller.var, enum: [_rh_sa_caller]}
        # records-ctx-producer-02 (codex-tick740 implementation_order): the source admission stages. words is the stage
        # vocabulary; order is the ruled sequence; partial names the stages that carry an explicit partial admission and
        # complete the ONE stage that carries the completed receipt. Pinned by enum: the order is the ruling, not a tunable.
        source_admission_admission_stages:
          root: controller.bootstrap.source_admission.admission_stages
          checks:
            - {path: '', keys: [complete, order, partial, words]}
            - {path: words, keys: [complete_projection_and_carrier, executable_closure, external_trust, identity_and_tools, single_engine_document_reader]}
            - {path: words, each: true, pattern: var_name}
            - {path: words, values_distinct: true}
            - {path: order, enum: [[external_trust, identity_and_tools, executable_closure, single_engine_document_reader, complete_projection_and_carrier]]}
            - {path: partial, enum: [[executable_closure, single_engine_document_reader]]}
            - {path: complete, enum: [complete_projection_and_carrier]}
        # records-ctx-producer-02 (codex-tick744): the record-free carrier override-state schema (profile carrier_state_schema).
        # Set equality with the carrier_state registry (SK-GL-02 equals_registry_set) for the codex-tick738 field and state sets; complete_only and protected
        # are record keys; admitted_at is a declared stage; the state-specific text sits beside the existing texts.
        source_admission_carrier_state_schema:
          root: controller.bootstrap.source_admission
          checks:
            - {path: carrier_state_schema, keys: [admitted_at, complete_only, node_fields, protected, root_input_nodes, states]}
            # records-contract-set-kind-01 (codex-tick755 option ii): each set is the canonical carrier_state set (exact set
            # equality, order not significant), not a second ordered copy.
            - {path: carrier_state_schema.node_fields, equals_registry_set: {path: contract_admission.carrier_state.node, projection: keys}}
            - {path: carrier_state_schema.states, equals_registry_set: {path: contract_admission.carrier_state.node.words, projection: keys}}
            - {path: carrier_state_schema.complete_only, equals_registry_set: {path: contract_admission.carrier_state.complete_only, projection: members}}
            - {path: carrier_state_schema.protected, equals_registry_set: {path: contract_admission.carrier_state.protected, projection: members}}
            - {path: carrier_state_schema.complete_only, subject: list, within: [controller.bootstrap.source_admission.bootstrap_input.record_keys]}
            - {path: carrier_state_schema.protected, subject: list, within: [controller.bootstrap.source_admission.bootstrap_input.record_keys]}
            - {path: carrier_state_schema.admitted_at, subject: scalar, within: [controller.bootstrap.source_admission.admission_stages.words]}
            # records-vocab-keys-01 (codex-tick761 O2): the root_input node pointers. Exactly three, plain words, distinct,
            # each naming a key of the genesis root_input node; not pinned by enum (a renamed node moves with its pointer).
            - {path: carrier_state_schema.root_input_nodes, keys: [carried, pair, state]}
            - {path: carrier_state_schema.root_input_nodes, each: true, pattern: var_name}
            - {path: carrier_state_schema.root_input_nodes, values_distinct: true}
            - {path: carrier_state_schema.root_input_nodes.state, subject: scalar, within: [controller.bootstrap.genesis.initializer.root_input]}
            - {path: carrier_state_schema.root_input_nodes.pair, subject: scalar, within: [controller.bootstrap.genesis.initializer.root_input]}
            - {path: carrier_state_schema.root_input_nodes.carried, subject: scalar, within: [controller.bootstrap.genesis.initializer.root_input]}
            - {path: texts, has_keys: [override_state]}
            - {path: texts.override_state, pattern: text_line}
            - {path: refusals.input, pattern: refusal_code}
        # INITIAL RELEASE ARTIFACT custody (codex-tick633 asks 1-2; codex-tick637 OD_REL_01 = ALT-B; genesis owns the block and
        # its runtime keys, admitted by has_keys). N7 and its binding are published TOGETHER in the declared owned release
        # directory (dest_var) OUTSIDE the checkout, never committed. The binding carries the artifact identity: its declared
        # file name, its bytes digest, the owned publication directory, the template / inputs / policy / profile digests,
        # the declaration digest, the builder and the source. consume = the INDEPENDENT bind-before-use row of the cold shell
        # consumer: it re-measures N7 (regular, not a link, the declared mode, the declared name inside the admitted owned
        # release directory; sha256 == binding; source edition == its own; baked pin == its own admitted declaration digest)
        # BEFORE invoking it. The fresh render + readback is the producer's (N9), not a consume check (OD_REL_02).
        initializer_release_custody:
          root: controller.bootstrap.genesis.initializer.custody
          when_present: controller.bootstrap.genesis.initializer
          checks:
            - {path: '', has_keys: [template_rel, macros_rel, entry_rel, artifact, dest_var, pin, binding, consume, refusals, texts, input_admission]}
            - {path: template_rel, equals_registry: {path: host_scope.shared_artifacts.initializer_release.templates, index: 0}}
            - {path: macros_rel, equals_registry: {path: host_scope.shared_artifacts.initializer_release.templates, index: 1}}
            - {path: entry_rel, pattern: rel_path}
            - {path: artifact, keys: [file, mode]}
            - {path: artifact.file, pattern: rel_segment}
            - {path: artifact.mode, enum: ['0500']}
            - {path: dest_var, pattern: var_name}
            - {path: dest_var, enum: [rh_release_dir]}
            # C1-SR328 (codex 914 controller_inventory): the controller inventory inputs of the two publication dirs, the
            # inventory.target_inputs form; each var IS its consumer's dest_var (equality by a scalar within), the two vars
            # distinct; kind a declared inventory kind; custody the existing destination custody node; the relation words
            # pinned (outside the checkout, pairwise disjoint, disjoint from the X2P output dir); MAIN selects the values.
            - {path: controller_inventory, keys: [custody_from, inputs, kind, relation, selected_by]}
            - {path: controller_inventory.kind, subject: scalar, within: [controller.bootstrap.genesis.launch.inventory_kinds]}
            - {path: controller_inventory.kind, enum: [operator_controller_inventory]}
            - {path: controller_inventory.custody_from, enum: [[work_roots, destination_custody]]}
            - {path: controller_inventory.inputs, keys: [cold_launch_dir, release_dir]}
            - {path: 'controller_inventory.inputs.*', keys: [consumer_from, pattern, required_for, type, var]}
            - {path: 'controller_inventory.inputs.*.type', enum: [string]}
            - {path: 'controller_inventory.inputs.*.pattern', enum: [abs_path]}
            - {path: 'controller_inventory.inputs.*.var', pattern: var_name}
            - {path: 'controller_inventory.inputs.*.required_for', subject: list, within: [controller.bootstrap.genesis.launch.stages]}
            - {path: controller_inventory.inputs.release_dir.var, subject: scalar, within: [controller.bootstrap.genesis.initializer.custody.dest_var]}
            - {path: controller_inventory.inputs.cold_launch_dir.var, subject: scalar, within: [controller.bootstrap.genesis.initializer.custody.cold_launch.dest_var]}
            - {path: controller_inventory.inputs.release_dir.var, distinct_from: [controller_inventory.inputs.cold_launch_dir.var]}
            - {path: controller_inventory.inputs.release_dir.consumer_from, enum: [[genesis, initializer, custody, dest_var]]}
            - {path: controller_inventory.inputs.cold_launch_dir.consumer_from, enum: [[genesis, initializer, custody, cold_launch, dest_var]]}
            - {path: controller_inventory.inputs.release_dir.required_for, enum: [[release]]}
            - {path: controller_inventory.inputs.cold_launch_dir.required_for, enum: [[cold_launch_release]]}
            - {path: controller_inventory.relation, keys: [checkout, disjoint_from, inputs]}
            - {path: controller_inventory.relation.checkout, enum: [outside]}
            - {path: controller_inventory.relation.inputs, enum: [disjoint]}
            - {path: controller_inventory.relation.disjoint_from, enum: [[[genesis, initializer, custody, external_invocation, envelope_projection, output_dir]]]}
            - {path: controller_inventory.selected_by, enum: [main]}
            - {path: pin, keys: [a_receipt, controller_pair, declaration_sha256, edition, inventory_digest, override_digest, registry_digest]}
            - {path: pin.declaration_sha256, pattern: marker_word}
            # records-lrh-profile-p6-04 OW-64-GL-04 (P64-05; records-b-ggen-cold-launch-03 OWED-GL-PIN / OWED-RH-PIN): the six carried
            # prelaunch context words, each a MARKER of its declared shape; N9 substitutes the admitted values at render.
            - {path: pin.edition, pattern: marker_word}
            - {path: pin.registry_digest, pattern: marker_word}
            - {path: pin.override_digest, pattern: marker_word}
            - {path: pin.a_receipt, keys: [path, sha256]}
            - {path: pin.a_receipt, each: true, pattern: marker_word}
            - {path: pin.controller_pair, keys: [connection, target]}
            - {path: pin.controller_pair, each: true, pattern: marker_word}
            - {path: pin.inventory_digest, strings: {nonempty: true}}
            - {path: pin.inventory_digest, each: true, pattern: marker_word}
            # C1-SR327 DEF-C1-SR327-REL-BINDING-ROW (pre-existing): the profile binding carries override_none and the fields
            # override / inventory since mr03 records-profile-02 P-06V (DEV-N9-01); r18 still pinned the four keys and the ten
            # fields, refusing s31 :827-832. Restored to the profile words (the cold_launch binding rows below point at them).
            - {path: binding, keys: [fields, mode, override_none, rel, schema]}
            - {path: binding.rel, pattern: rel_segment}
            - {path: binding.rel, distinct_from: [artifact.file]}
            - {path: binding.mode, enum: ['0400']}
            - {path: binding.schema, pattern: schema_tag}
            - {path: binding.fields, enum: [[artifact_file, artifact_sha256, publication_dir, template_sha256, inputs_sha256, policy_sha256, profile_sha256, declaration_sha256, override, inventory, builder, source]]}
            - {path: binding.override_none, pattern: var_name}
            - {path: consume, keys: [before, checks]}
            - {path: consume.before, enum: [invoke]}
            - {path: consume.checks, enum: [[artifact_regular_mode, artifact_file, publication_dir, artifact_sha256, source_edition, declaration_pin]]}
            - {path: refusals, has_keys: [staged, binding, consume]}
            - {path: refusals.staged, pattern: refusal_code}
            - {path: refusals.binding, pattern: refusal_code}
            - {path: refusals.consume, pattern: refusal_code}
            - {path: texts, has_keys: [staged, binding, consume]}
            - {path: texts.staged, pattern: text_line}
            - {path: texts.binding, pattern: text_line}
            - {path: texts.consume, pattern: text_line}
            # records-lg-compose-14 (records-lrh-profile-p6-19; SR-283-01): the cold admission binding of N8 and g01_launch
            - {path: input_admission, keys: [admission_from, kinds_from]}
            - {path: input_admission.admission_from, enum: [[genesis, launch, operator_inputs]]}
            - {path: input_admission.kinds_from, enum: [[genesis, launch, operator_input_kinds]]}
            # records-lg-compose-09 LG9-02 (records-lrh-profile-p6-09 OW-69-GL-01 / P69-01; records-b-ggen-cold-launch-09 OW-B09-GL-ADM):
            # the COLD CONSUMER declaration cd, a sibling of the N7 words of this node in the same form; tools, tool_argv, retain_impl,
            # mode_globs, end_of_options and parent_rels are the custody ones, read by path and never restated (no row here).
            # records-lg-compose-12 LG12-02 (records-lrh-profile-p6-14 P614-01 / OW-614-GL-01): + override_params_from (sorted).
            # records-lg-compose-13 LG13-01 (records-c1-framework-39 OW-639-GL-01; records-lrh-profile-p6-16 OW-616-GL-01): + lifecycle_inputs (sorted).
            # C1-SR327 (HOLE-B-OP1-PUB, HOLE-B-OP1-ENV-REL): + binding, budget, consume, dest_var, macros_rel (sorted).
            # C1-SR328 (B op1b c1_couplings C1-912-W-INITIAL / -LAUNCH-STEP / -PIN-DECL / -PUBLISH-ROWS): + initial, launch_step,
            # pin_declaration_key, publish_rows (sorted).
            - {path: cold_launch, keys: [artifact, binding, budget, consume, dest_var, entry_rel, extra_var_params, initial, launch_step, lifecycle_inputs, macros_rel, markers, never_uid, override_params_from, param_roles, params,
                                         path_params, phase_prefix, phases, pin, pin_declaration_key, publish_rows, refusals, statuses, template_rel, template_vars, texts, texts_from, texts_shared_from, umask]}
            # C1-SR328 C1-912-W-INITIAL: the checkout_members_render.initial form (exact keys, pinned empty starts).
            - {path: cold_launch.initial, keys: [rows, text]}
            - {path: cold_launch.initial.rows, enum: [[]]}
            - {path: cold_launch.initial.text, enum: ['']}
            # C1-SR328 C1-912-W-PIN-DECL: a pin key, never a step-record context key word.
            - {path: cold_launch.pin_declaration_key, pattern: var_name}
            - {path: cold_launch.pin_declaration_key, subject: scalar, within: [controller.bootstrap.genesis.initializer.custody.cold_launch.pin]}
            - {path: cold_launch.pin_declaration_key, subject: scalar, not_within: [controller.bootstrap.genesis.launch.step_record.context.keys.*]}
            # C1-SR328 C1-912-W-PUBLISH-ROWS: row role -> payload key; values distinct, mutually within the budget roles.
            - {path: cold_launch.publish_rows, keys: [record, render]}
            - {path: cold_launch.publish_rows, values_distinct: true}
            - {path: 'cold_launch.publish_rows.*', subject: scalar, within: [controller.bootstrap.genesis.initializer.custody.cold_launch.budget.payload_max_bytes]}
            - {at: controller.bootstrap.genesis.initializer.custody.cold_launch.budget.payload_max_bytes, subject: keys, within: [controller.bootstrap.genesis.initializer.custody.cold_launch.publish_rows.*]}
            # C1-SR328 C1-912-W-LAUNCH-STEP: the plan-step form; stage is the s1_result stage, inventory_kind one of its inventories.
            - {path: cold_launch.launch_step, keys: [extra_vars, inventory_kind, stage]}
            - {path: cold_launch.launch_step.stage, enum: [genesis_generate]}
            - {at: controller.bootstrap.genesis.s1_result.stage, enum: [genesis_generate]}
            - {path: cold_launch.launch_step.stage, subject: scalar, within: [controller.bootstrap.genesis.launch.stages]}
            - {path: cold_launch.launch_step.inventory_kind, subject: scalar, within: [controller.bootstrap.genesis.launch.stages.genesis_generate.inventory]}
            - {path: cold_launch.launch_step.extra_vars, enum: [{}]}
            - {path: cold_launch.template_rel, pattern: rel_path}
            - {path: cold_launch.template_rel, distinct_from: [template_rel, macros_rel]}
            # C1-SR327 HOLE-B-OP1-ENV-REL: the consumer's own macros file (the custody template_rel / macros_rel pair form).
            - {path: cold_launch.macros_rel, pattern: rel_path}
            - {path: cold_launch.macros_rel, distinct_from: [template_rel, macros_rel, cold_launch.template_rel, cold_launch.entry_rel]}
            - {path: cold_launch.entry_rel, pattern: rel_path}
            - {path: cold_launch.entry_rel, distinct_from: [entry_rel]}
            - {path: cold_launch.artifact, keys: [file, mode]}
            - {path: cold_launch.artifact.file, pattern: rel_segment}
            - {path: cold_launch.artifact.file, distinct_from: [artifact.file, binding.rel]}
            - {path: cold_launch.artifact.mode, enum: ['0500']}
            # C1-SR327 HOLE-B-OP1-PUB: the N9 publication words of this node mirrored for the consumer (dest_var, binding,
            # consume, budget). dest_var differs from the release one (N13 renames its staging onto the whole destination).
            - {path: cold_launch.dest_var, pattern: var_name}
            - {path: cold_launch.dest_var, enum: [rh_cold_launch_dir]}
