    # SR-321-04 / Codex 905: the ONE declared decoding contract of every split-character word (G14-01 detection words
    # here; the s29 render delimiter words of controller.entry_generation.render, whose word_form names this node and is
    # held equal to template_detection.word_form by contract_admission entry_generation_render_engine). A word is a
    # non-empty list of strings each fully matching contract_admission.patterns.<element_pattern>; it decodes to the
    # join of its elements with `separator`, the declared empty string, which every decode site (L11 filters, engine
    # E12-04 scans, the cases, the route consumer) passes EXPLICITLY by pointer (never the join filter's implicit
    # default). Placed under remote_harness_schema beside template_detection because both declarations that use it are
    # read from there by the same consumers (the engine reads the global registry by _lme_global_file / the include_vars
    # register), and it is not an exact-key node, so the node adds no shape change. SR-321-08: the route reads render
