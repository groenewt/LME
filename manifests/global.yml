          checks:
            - {path: '', keys: [revision, operation, runner, playbook_rel, refusal, report, measurement, connection_profile,
                                endpoint_kind, controller_operation, inventory_kind, ssh_auth_mode, host_group, host_identity, contact,
                                reuse, record_var, reviewed_record, record_checks, install_module, state, selects, then, name_family,
                                report_fields, diagnostics]}
            - {path: revision, enum: [3]}
            - {path: inventory_kind, enum: [controller_operation_binding]}
            - {path: inventory_kind, subject: scalar, within: [controller.bootstrap.genesis.launch.inventory_kinds]}
            - {path: report_fields, keys: [packages, reviewed_record, host, contract, contract_keys, binding_receipt, path, sha256, then]}
            - {path: report_fields, enum: [{packages: packages, reviewed_record: reviewed_record, host: host, contract: contract, contract_keys: [alias, auth_mode, key_source], binding_receipt: binding_receipt, path: path, sha256: sha256, then: then}]}
            - {path: endpoint_kind, enum: [controller_operation]}
            - {path: controller_operation, enum: [controller_prerequisite]}
            - {path: controller_operation, subject: scalar, within: [controller.bootstrap.inventory.controller_operations]}
            - {path: contact, enum: [{variant: privileged, paths: []}]}
            - {path: reuse, enum: [{transfer_dir_rel: testing/e2e/transfer, transfer_decl: transfer.decl.yml, family_rel: tasks/refuse_reserved_families.yml, resolver_rel: tasks/resolve_contract.yml, endpoint_rel: tasks/endpoint_bind.yml, contact_rel: testing/remote_harness/tasks/initial_contact.yml}]}
            - {path: record_checks, enum: [[schema, operation, candidate, self_authorizing, deployment_identity, missing_packages]]}
            - {path: operation, enum: [controller_preparation_prerequisite]}
            - {path: runner, enum: [MAIN_only]}
            - {path: playbook_rel, enum: [testing/remote_harness/controller_prereq.yml]}
            - {path: refusal, pattern: refusal_code}
            - {path: refusal, enum: [RH-CONTROLLER-PREREQ]}
