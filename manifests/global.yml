      # C1 records-contract-set-kind-01 (codex-tick755 OPEN-S17-RF-MEMBER-GRAMMAR-CONSUMER / OPEN-S18-LATE-BINDING-KIND): the
      # shared consumer vocabulary. Each role maps a role key to the WORD a consumer passes as a quoted selector: tests
      # (select / reject test names), attributes (selectattr / map attribute paths), projections (the projection words of
      # the equals_registry_set contract kind). Consumers source every quoted selector here, never as a literal. fullmatch:
      # the match test is a full match only for a pattern text the path ERE syntax admits (anchored) on a value free of
      # the path_law terminator; the member_rel_grammar macro checks both first.
