      # form. pattern equals document_channel.rel_pattern (loader-checked). The consumer is the member_rel_grammar macro
      # (entry_rel imports macros_rel, both admitted by this grammar); output names its result words.
      member_rel_grammar:
        pattern: rel_path
        grammar_fields: [pattern, refused_components]
        law_fields: [separator, terminator]
        entry_rel: testing/remote_harness/templates/member_rel_grammar.j2
        macros_rel: testing/remote_harness/templates/macros/member_rel_grammar.j2
        macro: member_rel_grammar
        output: {form: form, refused: refused}
