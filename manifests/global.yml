            - {path: kinds.keyring, enum: [{declared_root: preparation, declared_member: keyring, resolve: false, checks: [absent, link, not_regular, unreadable], otherwise: present, record_field: keyrings}]}
            - {path: custody, keys: [rule, states, precedence, otherwise, absent, reasons, finding, result]}
