            - {path: custody.finding, enum: [{path: path, reason: reason}]}
            - {path: custody.result, enum: [{state: state, findings: findings}]}
            - {path: claims, enum: [{status: candidate, disposition: separate_source_disposition_pending, scope: [custody, candidate_adoptable]}]}
            - {path: package_basis, enum: [declared_association_not_verified_provenance]}
            - {path: record_values, enum: [{candidate: true, self_authorizing: false}]}
            - {path: observed_fields, enum: [[exists, islnk, lnk_source, lnk_target, isreg, isdir, executable, uid, gid, pw_name, gr_name, mode, wgrp, woth, size, dev, inode, mtime, ctime]]}
            - {path: dispositions, enum: [{present: present, absent: absent, link: link, not_regular: not_regular, not_executable: not_executable, unreadable: unreadable}]}
            - {path: record_fields, keys: [schema, candidate, self_authorizing, claims, operation, measured_at_utc, act, stage,
                                           deployment_identity, inventory_sources, binding_receipt, receipt_fields, admission, profile_sha256,
                                           config_revision, engine_revision,
                                           builder, declaration, tools, keyrings, missing_packages, package_basis, complete, path,
                                           declared, link_view, resolved_view, digest_algorithm, digest, disposition, custody,
                                           custody_findings, declared_logical_package, declared_package, candidate_adoptable, record,
                                           record_sha256]}
            - {path: record_fields, each: true, pattern: var_name}
            - {path: record_fields, values_distinct: true}
            - {path: diagnostics, keys: [names, scope, scope_map, inputs, provides, launch_kind, checks, dispatch, root, record, report, stop]}
