        # GENESIS STAGE OPERATIONS (route-r4b R4-MODE-WITHOUT-DECLARATION; acquire.yml 210d3e15 :71-139): the acquire
        # stage's selector declaration is REQUIRED (the gate has no default), keyed exactly; every selector names a
        # declared operation; the operation pins its node revision, mode selector / value and tasks file. NOT expressible
        # without an engine change (reported gap; no cross-path equality kind): operations.<op>.mode_selector /
        # mode_value == the node's mode_var / mode_value, and selectors == {mode_var, root_var} -> both sides PINNED to
        # identical enums here and in contract preparation_measurement.
        genesis_stage_operations:
          root: controller.bootstrap.genesis.launch.stages.acquire
          when_present: controller.bootstrap.genesis.launch.stages
          checks:
            - {path: '', has_keys: [playbook_rel, selectors, operations, refusal, diagnostics]}
            - {path: selectors, enum: [{rh_measurement_mode: preparation_measurement, rh_measurement_root: preparation_measurement}]}
            - {path: selectors, key_pattern: var_name}
            - {path: operations, keys: [preparation_measurement]}
            - {path: operations.preparation_measurement, keys: [revision, mode_selector, mode_value, tasks_rel, inventory_kind, controller_operation]}
            - {path: operations.preparation_measurement.revision, enum: [5]}
            - {path: operations.preparation_measurement.inventory_kind, enum: [controller_operation_binding]}
            - {path: operations.preparation_measurement.inventory_kind, subject: scalar, within: [controller.bootstrap.genesis.launch.inventory_kinds]}
            - {path: operations.preparation_measurement.controller_operation, enum: [preparation_measurement]}
            - {path: operations.preparation_measurement.controller_operation, subject: scalar, within: [controller.bootstrap.inventory.controller_operations]}
            - {path: operations.preparation_measurement.mode_selector, enum: [rh_measurement_mode]}
            - {path: operations.preparation_measurement.mode_value, enum: [measure]}
            - {path: operations.preparation_measurement.tasks_rel, enum: [testing/remote_harness/tasks/measure_controller_tools.yml]}
            - {path: refusal, enum: [RH-ACQUIRE-SELECTOR]}
            - {path: diagnostics, keys: [selectors, stop]}
        # PREPARATION MEASUREMENT (route-r4b; codex-tick393-r4 verdict + codex-tick394 R4_representation_addendum):
        # controller.bootstrap.preparation_measurement REVISION 5, EXACT keys at every level, every non-text leaf PINNED
        # (a change of selection, vocabulary, field name or policy value is a new reviewed declaration; diagnostics /
        # adoption prose is key-pinned). Checked only when declared. Gaps enforced by the consumer (reported): adopt_as
        # pinned by enum (registry executable_identity.kinds is not a policy path); each resources.keyring key is a
        # preparation node WITH a keyring (the macro reads preparation.<key>.keyring); custody.rule names a key of
        # path_admission.ancestry (asserted by the task).
        preparation_measurement:
          root: controller.bootstrap.preparation_measurement
          when_present: controller.bootstrap.preparation_measurement
