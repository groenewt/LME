      # per-target INVENTORY input ONCE as {<role>: {var, type (string | bool | string_list), required, pattern (a
      # contract_admission.patterns name; string / string_list)}}. The loader selects every target's values
      # (lme_rh_connection_values; presence kept apart from the value), types them (type-exact; no default; a required
      # role refuses when absent) and binds them into binding.deployment.target_inputs.<target>.<role> -- part of every
      # scope_sha256 and re-typed by lme_verify_resolved. Consumers read the BOUND value, never a raw host var. A key
      # or credential is only a PATH reference (the loader never reads it). Inert until the policy declares the node.
      # Intended roles (producer hunks pending, serialized through C1; contract target_input_roles pins the ones
      # that restate an existing declaration): owner / toolchain_root / bundle_dir / owner_key / privileged_key (the
      # existing vars inventory.owner_var / root_var / bundle_var / connection_profiles.{owner,privileged}.key_var),
