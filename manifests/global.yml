        # context_kind must be a key of context_kinds; struct_roles is the bound struct mapping (values bound by the
        # generation consumer, GEN2-J-RENDER).
        rendered:
          when_present: controller.bootstrap.genesis
          render_artifact: genesis_render
          context_kind: controller.bootstrap.genesis.entry.render.context_kind
          context_kinds: controller.entry_generation.contexts.kinds
          struct_roles: controller.bootstrap.genesis.entry.render.struct_roles
          # F05-S4 RENDER-CONTEXT (genesis render-interface-01 70c993c4; OD-S2-RENDER-CONTEXT / OD-S2-RNP03-STRUCT-SOURCE):
          # struct_sources = the ONE runtime role -> source binding (keys EXACTLY the struct_roles keys; each exactly
          # {fact, path}, fact an EXACT member of the registry list named by source_facts); context_binding = {key, value}:
          # a rendered row's context is the early context PLUS ONE nested key (key, never an early context field) whose
          # value is the render-contract mapping named by value (the struct_roles leaf). Rendered rows only.
          struct_sources: controller.bootstrap.genesis.entry.render.struct_sources
          context_binding: controller.bootstrap.genesis.entry.render.context_binding
          source_facts: reserved_outputs
          # F05-S4 RENDER-CONTEXT-02 (genesis render-interface-02 08d45353; Codex578 OD-S06-STRUCT-SOURCE-TYPE): the
          # declaration-owned struct_sources ENTRY shape -- role -> entry key name (exactly the fact / path / kind roles;
          # every entry carries EXACTLY these keys, published as rendered_source_entry_keys) -- and the permitted result
          # kinds: a subset of the SEVEN supported kind words of the loader's _rh_kind (bool, int, str, float, mapping,
          # list, null; its type-name fallback is never admitted; no second vocabulary).
          source_entry_fields: {fact: fact, path: path, kind: kind}
          source_kinds: [mapping, str]
          # parent successor-07 J-S07-PROFILE-KEY-ADMISSION / Codex580 J-S07-KIND-ADMISSION: the ONE profile map kind
          # word -> {test, excludes} the generator applies; keys among the seven words, COVERING source_kinds; test a
          # supported Jinja test distinct across kinds; excludes the tests of other declared kinds (unknown, missing or
          # ambiguous refuses at admission, before render); digest-bound while the rendered kind is active.
          kind_tests: controller.entry_generation.struct_kind_tests
          # parent successor-08 J-S07-KIND-RANGE: the CLOSED set of supported Jinja test names a kind_tests test or
          # exclude may name (each a Jinja builtin test; an unknown name refuses at admission, never in select() at render)
          kind_test_names: [boolean, integer, string, float, mapping, sequence, none]
          outputs: [controller.bootstrap.genesis.entry, controller.bootstrap.genesis.entry.producer]
          output_fields: {output: generated_rel, template: template_rel}
        template_vars: controller.entry_generation.template_vars
        template_var_roles: {context: context, struct: struct, decl: decl}
        declaration_rel: controller.entry_generation.declaration_rel
        never_generated: [controller.entry_generation.task_rel, controller.entry_generation.verifier_rel]
        importers: source_importers                    # policy_projections name: its B member guard closures join never_generated_rel
        bodies: source_importer_bodies                 # policy_projections name: body_rel
        context: controller.bootstrap.source_admission.early_view.context_fields
        context_root: controller.bootstrap
        policy_path_separator: controller.bootstrap.source_admission.early_view.override.audit_join
        interface: {base: route_interface.base, files: controller.bootstrap.consumer_interface.files}
        render_artifact: entry_render
        record_codes: [absent, adoption_prestate, adoption_repeat, adoption_retention, adoption_unbound, changed_input,
