        # OS-TOOL CONSUMER PARTITION (codex-tick328-329 os_tool_partition; C1 owns it, route testing/remote_harness/
        # package.yml consumes it): controller.bootstrap.os_tool_consumers is the ONE closed vocabulary of os_tools
        # required_by labels -- EXACTLY {controller, target}, each a nonempty distinct list, the two disjoint, and each
        # pinned to the registered vocabulary below (not tunable; a changed, extended or reordered set refuses). Every
        # os_tools entry must carry required_by, a nonempty distinct list naming only registered labels: an unknown or
        # empty label list refuses here, at resolve (never silently skipped by packaging). Controller-admission rule
        # (route): an entry with ANY controller label is a controller precondition; only exclusively-target entries are
        # skipped by controller packaging, and their target admission is unchanged. owner_key_generation binds
        # os_tools.ssh-keygen (J-KEY JK-1; contract owner_key). ALWAYS checked (no when_present): package.yml needs the
        # partition on every policy.
        os_tool_consumers:
          root: controller.bootstrap
          checks:
            - {path: os_tool_consumers, keys: [controller, target]}
            - {path: os_tool_consumers, each: true, strings: {nonempty: true, distinct: true}}
            - {path: os_tool_consumers.controller, disjoint_from: [os_tool_consumers.target]}
            # + preparation (C1 hunk 4, P-x; preparation.tool_label): a controller consumer admitted at its own use boundary
            # (tasks/admit_prep_tools.yml); package.yml :107-114 skips preparation-only entries (required_by a subset of
            # target + [preparation]), so "ANY controller label = packaging precondition" now reads "any controller label
            # other than preparation".
            # C1-SR922Q (route op1x CPL-OP1X-C1-OS-TOOLS-REQUIRED-BY; profile s57): + staging_reap (controller) and
            # staging_reap_subject (target), the reaper's two host sides; os_tools stat / findmnt / readlink name them.
            - {path: os_tool_consumers.controller, enum: [[seed, uv_installer, package_source_binding, source_edition_binding, owner_key_generation, preparation, entry_generation, source_admission, staging_reap]]}
            # C1-SR915 (G-SR328-PREEXISTING-8): + launch_record_readback (custody-lease s02; os_tools.base64 required_by; a target
            # consumer: its emitter is the target initial_contact shell), in the profile's order; the r1 labels guest_reader,
            # exposure_observer, guardian_custody are kept (the profile now carries them: producer repair, nothing reduced).
            - {path: os_tool_consumers.target, enum: [[target_adapter, privileged_contact, target_prereq, guest, observation, launch_record_readback, guest_reader, exposure_observer, guardian_custody, staging_reap_subject]]}
            - {path: os_tools, each: true, has_keys: [required_by]}
            - {path: os_tools.*.required_by, strings: {nonempty: true, distinct: true}}
            - {path: os_tools.*.required_by, subject: list, within: [controller.bootstrap.os_tool_consumers.controller, controller.bootstrap.os_tool_consumers.target]}
