            # refused regex and the program root runs are pinned literals
            - {path: endpoint, keys: [ancestry_max_depth, admitted_server_exe_regex, refused_exe_regex, refusal, ancestry_program]}
            - {path: endpoint.ancestry_max_depth, int_range: {min: 1, max: 64}}
            - {path: endpoint.admitted_server_exe_regex, rejects: ['', '/usr/sbin/tailscaled', '/usr/bin/tailscaled', '/usr/sbin/sshd-evil', '/tmp/usr/sbin/sshd', '/usr/sbin/sshd/x', 'usr/sbin/sshd']}
            - {path: endpoint.refused_exe_regex, enum: ['(^|/)tailscaled$']}
            - {path: endpoint.refusal, pattern: refusal_code}
            - {path: endpoint.refusal, distinct_from: [refusal]}
            - {path: endpoint.ancestry_program, enum: ['p=$PPID; n=0; while [ "$p" -gt 1 ] && [ "$n" -lt "$1" ]; do "$2" -e "/proc/$p/exe" 2>/dev/null || echo "?"; p=$("$3" -n ''s/^PPid:[[:space:]]*//p'' "/proc/$p/status"); n=$((n+1)); done']}
            # the tools the prereq observation hashes on the TARGET: both label lists name only TARGET consumers of the
            # os-tool partition (B rev 3: seed / uv_installer dropped -- controller labels never select a target hash)
            - {path: observation, keys: [required_by, hypervisor_required_by, override_path, identity_kind, record_suffix, record_schema]}
            - {path: observation.required_by, strings: {nonempty: true, distinct: true}}
            - {path: observation.required_by, subject: list, within: [controller.bootstrap.os_tool_consumers.target]}
            - {path: observation.hypervisor_required_by, strings: {nonempty: true, distinct: true}}
            - {path: observation.hypervisor_required_by, subject: list, within: [controller.bootstrap.os_tool_consumers.target]}
            - {path: observation.override_path, enum: [[remote_harness, controller, bootstrap, os_tools]]}
            - {path: observation.identity_kind, enum: [file_sha256]}
            - {path: observation.record_suffix, pattern: record_suffix}
            - {path: observation.record_schema, pattern: schema_tag}
            # PRESERVATION (rev 4; codex-tick360 rules 1-5; B r4 proposal f4b03157 `added.preservation`). Exact keys at
            # every level; the leaves the consumers read (consumed_by_source) are value-checked; rationale leaves (means,
            # evidence, absence, requires, check, action, obstruction, glob_to_regex, limit) are key-pinned only. Null is
            # an admitted value form (enum [null], type-exact): routes.as_expected and routes.{absent, load_refused,
            # probe_unknown}.mechanism.
            - {path: preservation, keys: [refusal, applies_to, unit_regex, bases, expected_states, absent_status, absent_states, probe, routes, discovery]}
            - {path: preservation.refusal, pattern: refusal_code}
            - {path: preservation.refusal, distinct_from: [refusal, endpoint.refusal, hypervisor.capacity.refusal]}
            - {path: preservation.applies_to, enum: [every_target_group_member]}
            - {path: preservation.unit_regex, equals_registry: {path: contract_admission.patterns.service_name}}
            - {path: preservation.bases, keys: [known_set, verified_none]}
            - {path: preservation.bases.known_set, keys: [means, evidence, absence]}
            - {path: preservation.bases.verified_none, keys: [means, role, requires, check]}
            - {path: preservation.bases.verified_none.role, subject: scalar, within: [controller.bootstrap.inventory.target_inputs]}
            - {path: preservation.bases.verified_none.role, enum: [prereq_verified_no_prior_deployment]}
            - {path: preservation.bases.verified_none.requires, strings: {nonempty: true, distinct: true}}
            - {path: preservation.expected_states, keys: [inactive_not_enabled, retired_absent]}
            - {path: preservation.expected_states.inactive_not_enabled, keys: [role, present, load_states, active_states, unit_file_states]}
            - {path: preservation.expected_states.inactive_not_enabled.role, subject: scalar, within: [controller.bootstrap.inventory.target_inputs]}
