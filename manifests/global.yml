        # FR-CONSTRUCTION-CONTRACT-MISSING (codex-tick628): SHAPE admission of the ONE launch-record construction map
        # source_admission.bootstrap_input.construction (a declaration its consumers walk; no projection). Exact key sets;
        # sources is the role -> word IDENTITY map (pinned by enum); fields keys == record_keys (mutual within); every field
        # source is a sources role; every policy field carries a non-empty key path of var_name steps. NOT gated (codex-tick637
        # C1-S2-SEED-ADMISSION-COVERAGE): the seed source_admit consumes it on every render, genesis or not. RESIDUE: exactly
        # one edition / digest / context field is consumer-enforced; a path on a non-policy field is ignored, not refused;
        # policy-path RESOLUTION is admitted after the projections by resolve_policy.yml (OD-CON-01).
        source_bootstrap_construction:
          root: controller.bootstrap.source_admission.bootstrap_input
          checks:
            - {path: construction, keys: [fields, runtime_mark, sources]}
            # C1-SR327 HOLE-OP1B-R18-CONSTRUCTION (route records-route-op1b-01 88c6e503): the records-c1-framework-22 FW22-DELEGATE
            # J-FW22-DL-GL rows (:220-223), never carried into the r-lineage, restored against the profile sources (s31 :5567,
            # seven keys) and the two binding fields carrying pinned (s31 :5571-5572). registry: the same identity-map enum form.
            - {path: construction.sources, keys: [binding, context, digest, edition, launch_transport, policy, registry]}
            - {path: construction.sources.binding, enum: [binding]}
            - {path: construction.sources.context, enum: [context]}
            - {path: construction.sources.digest, enum: [digest]}
            - {path: construction.sources.edition, enum: [edition]}
            - {path: construction.sources.launch_transport, enum: [launch_transport]}
            - {path: construction.sources.policy, enum: [policy]}
            - {path: construction.sources.registry, enum: [registry]}
            - {path: construction.fields, subject: keys, within: [controller.bootstrap.source_admission.bootstrap_input.record_keys]}
            - {path: record_keys, subject: list, within: [controller.bootstrap.source_admission.bootstrap_input.construction.fields]}
            - {path: 'construction.fields.*', key_set: {required: [source], optional: [path, pinned]}}
            - {path: construction.fields, each: true, where: {field: source, equals_at: controller.bootstrap.source_admission.bootstrap_input.construction.sources.binding}, has_keys: [pinned, source]}
            - {path: 'construction.fields.*.pinned', subject: scalar, within: [controller.bootstrap.work_roots.run_local.pinned_vars], optional: true}
            - {path: 'construction.fields.*.source', subject: scalar, within: [controller.bootstrap.source_admission.bootstrap_input.construction.sources]}
            - {path: construction.fields, each: true, where: {field: source, equals_at: controller.bootstrap.source_admission.bootstrap_input.construction.sources.policy}, has_keys: [path, source]}
            - {path: construction.fields, each: true, where: {field: source, equals_at: controller.bootstrap.source_admission.bootstrap_input.construction.sources.context}, has_keys: [source]}
            - {path: construction.fields, each: true, where: {field: source, equals_at: controller.bootstrap.source_admission.bootstrap_input.construction.sources.edition}, has_keys: [source]}
            - {path: construction.fields, each: true, where: {field: source, equals_at: controller.bootstrap.source_admission.bootstrap_input.construction.sources.digest}, has_keys: [source]}
            - {path: 'construction.fields.*.path', strings: {nonempty: true}}
            - {path: 'construction.fields.*.path', each: true, pattern: var_name}
            - {path: construction.runtime_mark, pattern: marker_word}
        # BODY DOMAIN (R1 C1-S9-BODY-DOMAIN; codex-tick446 R1S8-PLAINTEXT-BODY-BYTES, credit R1S9-PLAINTEXT-BODY-READ
        # codex-tick458): plaintext UTF-8 bodies read byte-exact (no strip); undecodable_regex names the surrogateescape
        # range. Scope: plaintext bodies only, no claim about encrypted or binary inputs (RV-20).
        body_domain:
          root: controller.bootstrap.body_domain
          checks:
            - {path: '', keys: [encoding, undecodable_regex, read]}
            - {path: encoding, enum: [utf-8]}
            - {path: read, keys: [lstrip, rstrip]}
            - {path: read.lstrip, enum: [false]}
            - {path: read.rstrip, enum: [false]}
        # MR03 S14 RQ_1 (codex-tick669 / 675 / 676): the ONE shared renderer declaration, per core, per render scope. The
        # module consumer is a REFERENCE to the task_rel authority (no copied rel); the obligation words are the walk and
        # the diagnostic locus; the lookup provenance is the complete ordered search and context.
        entry_generation_render_engine:
          root: controller.entry_generation.render
          when_present: controller.entry_generation
          checks:
            - {path: engine, keys: [by_core, obligation]}
            # C1-SR922B (B HOLE-SR918R-W-N10 / C1-SR917-W-N10; codex 923 N13_CALLER_AND_DECLARATION_JOIN; paired with profile s39):
            # n10, the shared render + fresh-readback step: its task rel (a members_rel member), the scope words (exactly the
            # engine scope keys), the op words, and write_bound -- MOVED here whole from the X2P envelope_projection.capacity
            # (retired there) as the ONE home every N13 caller site reads: one copies shape (role -> paths to integer
            # allocations), per-site render_scope / uid, and for the module site its row / view / expansion paths. Pinned whole;
            # any change is an auditable revision of this row and the profile. The lookup sites' empty copies are
            # HOLE-SR922B-LOOKUP-SITE-COPIES (declared, not waived).
            - {path: n10, keys: [ops, rel, scopes, write_bound]}
            - {path: n10.rel, pattern: rel_path}
            - {path: n10.rel, subject: scalar, within: [controller.bootstrap.source_admission.members_rel]}
            - {path: n10.scopes, enum: [{lookup: lookup, module: module}]}
            - {path: n10.ops, enum: [{render: render, verify: verify}]}
            # C1-SR922C (codex 924 LOOKUP_SITE_COPIES / caller identity; B CPL-OP1G-B-N10-SITE-BY-SCOPE; paired with profile
            # s40; closes HOLE-SR922B-LOOKUP-SITE-COPIES): the pinned whole gains copies_roots, copies_leaf, locations,
            # aggregation, obligations and identity (additions only), each site copies_root and renders_from, the module site
            # multiplicity_from, and the lookup sites' copies from their own admitted rows (copies_root call: [rows] / [total]).
            # The sites' renders_from sets are pairwise distinct (the identity rule requires it; visible in this pin).
            # C1-SR922D (codex 926 CALLER_AUTHORITY_JOIN, OBLIGATION_METADATA_ADMISSION, COPY_LIFETIME_CONSISTENCY,
            # MALFORMED_OBLIGATION_RECORD; paired with profile s41): + lifetime, identity.role, authority, callers.params
            # rh_rsv_include_rel, each site's authority, obligations.record_admission and obligations.unaccountable
            # (additions only; no existing word changed).
            # C1-SR922E (B op1h DEV-B-OP1H-DF-ARGS, CPL-OP1H-B-RECORD-SRC-IN-RENDER-SET, CPL-OP1H-B-UID-RESERVED-RUNTIME; paired
            # with profile s42): + locations.df_probe_args / df_columns / fs_type_probe_args, identity.render_set and
            # identity.uid_reserved (additions only). THIS pin is the static closure uid_reserved names: every site's uid
            # first word below (_rh_clp_uid, rh_builder) is a reserved_outputs row; a changed word revises both together.
            # C1-SR922L (codex 938 C1-TARGET-NONE-APPLICABILITY; B op1m PENDING-C1-WORDs; paired with profile s51):
            #   - obligations.registry_hosts is WITHDRAWN and replaced by obligations.registry_applicability;
            #   - additions: obligations.recovery_inputs_order, record_grammar.staging_placeholders / string_class,
            #     transaction.program_tools.decode, transaction.temp_glob / unread_detail, and lifetime.dead_holder.relock / output;
            #   - relock_witnesses gains machine (first).
            # C1-SR922M (codex 939 C1-REGISTRY-STORAGE-VIEW-PROOF; paired with profile s52): registry_applicability gains
            #   views (EVERY outstanding record's destination and paths on the owner, plus the subject destination and its
            #   parent, all of a local_fs_types type), not_applicable_requires and known_empty. one_kernel compares among
            #   local views only, and cross_kernel is all_local -> separate_storage. The SR922L registry/parent sampling
            #   is withdrawn.
            # C1-SR922N (seat SEAT-SR922M-SAME-DEVICE-BIND-ALIAS; paired with profile s53): one_kernel is now
            #   filesystem_path_disjoint. Views are matched by filesystem identity (lstat dev for ext2/ext3 and xfs, the
            #   mount UUID for btrfs), then compared by filesystem path (findmnt FSROOT plus the path below TARGET), so a
            #   same-device bind alias is APPLICABLE. The path-walked (dev, inode) chain is withdrawn.
            # C1-SR922O (seat SEAT-SR922N-SAME-DEVICE-NESTED-MOUNT; paired with profile s54): views.nested_mount is replaced
            #   by views.nested_mounts. Every mount strictly below a compared view is examined, on any device; it is admitted
            #   only when local and, on one kernel, FSROOT-disjoint; otherwise that view is unknown. ext2/ext3 and xfs identity
            #   now reads mount MAJ:MIN, and the mount probe adds FSTYPE and MAJ:MIN.
