---
# manifests/global.yml -- cross-cutting deployment values for the whole LME stack.
#
# This is a DATA file: value literals live HERE (and in manifests/profiles/*,
# manifests/services/*). They are banned from the render templates
# (ansible/templates/units/*.j2) AND from the filter plugin
# (filter_plugins/lme_manifests.py) -- the engine holds only arithmetic +
# structure and reads every value/pattern/default from this tree. (Per
# operator-rulings lme-renderer-literals + generated_artifact_exemption:false;
# supersedes the earlier note that permitted literals in the filter plugin.)
#
# Load order (ansible/roles/podman/tasks/load_manifests.yml):
#   lme_global = global.yml
#              | combine(<active profile overlay>, recursive=True)
#              | combine(lme_global_override | default({}), recursive=True)
# i.e. profiles overlay the baseline, and an operator host_var override wins LAST.

lme_global:

  # --- userns / cert-owner derivation seeds -------------------------------
  # THE only place these numbers live. Every id-mapping base and every cert
  # owner uid is DERIVED from them by filter_plugins/lme_manifests.py:
  #   userns_base(svc) = subuid_base + slot(svc) * slot_size
  #   cert key owner   = userns_base(svc) + in_container_uid
  subuid_base: 165536
  # /etc/subuid & /etc/subgid range length for the rootless 'containers' user
  # (the outer range userns slots carve into); base setup_directories renders it.
  subuid_range: 65536
  slot_size: 3048
  # Logical service -> slot index. A service absent here has no pinned id-mapping
  # and resolves to subuid_base (the observed lme_backups owner, 165536).
  slots:
    elasticsearch: 0      # base 165536
    kibana: 1             # base 168584
    fleet-server: 2       # base 171632
    wazuh-manager: 3      # base 174680
    elastalert: 4         # base 177728

  # --- userns directive rendering (render_userns) -- FORMAT/PATTERN strings ----
  # The STRING patterns render_userns() emits. The numeric base/size are still
  # DERIVED from subuid_base/slot_size above; only the format templates and the
  # mode default live here (hoisted out of filter_plugins/lme_manifests.py per
  # operator-rulings finding lme-renderer-literals -- the engine keeps arithmetic,
  # values live in YAML). Format fields: {base},{size} (auto), {name} (share_ref).
  userns:
    default_mode: auto
    auto_format: 'auto:uidmapping=0:{base}:{size},gidmapping=0:{base}:{size}'
    unpinned_value: auto
    share_ref: 'container:lme-{name}'

  # --- systemd unit naming (svc_unit) -- FORMAT/PATTERN strings ----------------
  # The unit names quadlet generates for each logical service, as format strings
  # (field {name}). Hoisted out of the filter plugin (lme-renderer-literals): the
  # engine picks WHICH pattern by kind; the pattern text is a value and lives here.
  unit_naming:
    target: lme.service
    network: lme-network.service
    volume: 'lme-{name}-volume.service'
    service: 'lme-{name}.service'

  # --- podman network (renders lme.network) -------------------------------
  network:
    name: lme
    driver: bridge
    subnet: 10.89.4.0/24
    gateway: 10.89.4.1
    ipam_driver: host-local

  # --- images -------------------------------------------------------------
  # image_tag is the sentinel tag the build/load path retags every image to.
  # Units reference the `local` ref (localhost/<name>:LME_LATEST) which is stable
  # across online/offline installs; `pull` is the upstream source used at
  # build/prefetch time and is what profiles/offline.yml re-points. `group` gates
  # which services a given install renders (core | elastic_services | llm).
  # image_tag is a LITERAL tag string (there is no substitution step; the build
  # path retags every upstream image to localhost/<name>:LME_LATEST and the units
  # reference that verbatim). `pull` refs and versions are extracted from
  # config/containers.txt, config/containers-llm.txt and
  # config/containers-elastic-services.txt -- the current sources of truth.
  image_tag: LME_LATEST
  images:
    # Registry-pinned 0.161.0 multiarch index; runtime qualification is a separate gate.
    otel-collector: {local: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, pull: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, group: telemetry}
    elasticsearch:  {local: localhost/elasticsearch:LME_LATEST,      pull: docker.elastic.co/elasticsearch/elasticsearch:8.18.8,     group: core}
    kibana:         {local: localhost/kibana:LME_LATEST,             pull: docker.elastic.co/kibana/kibana:8.18.8,                  group: core}
    elastic-agent:  {local: localhost/elastic-agent:LME_LATEST,      pull: docker.elastic.co/beats/elastic-agent:8.18.8,            group: core}
    distribution:   {local: localhost/distribution:LME_LATEST,       pull: docker.elastic.co/package-registry/distribution:lite-8.18.8, group: core}
    wazuh-manager:  {local: localhost/wazuh-manager:LME_LATEST,      pull: docker.io/wazuh/wazuh-manager:4.9.1,                     group: core}
    elastalert2:    {local: localhost/elastalert2:LME_LATEST,        pull: docker.io/jertel/elastalert2:2.20.0,                     group: core}
    logstash:       {local: localhost/logstash:LME_LATEST,           pull: docker.elastic.co/logstash/logstash:8.18.8,              group: elastic_services}
    filebeat:       {local: localhost/filebeat:LME_LATEST,           pull: docker.elastic.co/beats/filebeat:8.18.8,                 group: elastic_services}
    metricbeat:     {local: localhost/metricbeat:LME_LATEST,         pull: docker.elastic.co/beats/metricbeat:8.18.8,               group: elastic_services}
    heartbeat:      {local: localhost/heartbeat:LME_LATEST,          pull: docker.elastic.co/beats/heartbeat:8.18.8,                group: elastic_services}
    apm-server:     {local: localhost/apm-server:LME_LATEST,         pull: docker.elastic.co/apm/apm-server:8.18.8,                 group: elastic_services}
    # llama-cpp: dot->dash rename is intentional (llama.cpp -> llama-cpp); the
    # same image backs lme-embeddings. pgvector is pg17. litellm is main-latest.
    pgvector:       {local: localhost/pgvector:LME_LATEST,           pull: docker.io/pgvector/pgvector:pg17,                        group: llm}
    llama-cpp:      {local: localhost/llama-cpp:LME_LATEST,          pull: ghcr.io/ggml-org/llama.cpp:server,                       group: llm}
    litellm:        {local: localhost/litellm:LME_LATEST,            pull: ghcr.io/berriai/litellm:main-latest,                     group: llm}
    # Built locally from a Dockerfile (no upstream pull source).
    lme-log-analyzer: {local: localhost/lme-log-analyzer:LME_LATEST, build: lme-log-analyzer/Dockerfile, group: llm}
    lme-dashboard:  {local: localhost/lme-dashboard:LME_LATEST,      build: lme-dashboard/Dockerfile,    group: llm}

  # --- cert tree (B4) -----------------------------------------------------
  certs:
    volume: lme_certs               # private workspace volume (setup-certs generates here)
    host_tree: /opt/lme/certs       # per-service published bundles live under here
    ca_public_rel: ca/ca.crt        # the ONLY CA material that leaves the workspace
    default_in_container_uid: 0

  # --- filesystem paths ---------------------------------------------------
  paths:
    opt: /opt/lme
    config: /opt/lme/config
    env_file: /opt/lme/lme-environment.env
    vault_pass: /etc/lme/pass.sh
    models: /opt/lme/llama-models

  # --- container storage (overridable via podman -g / install.sh -g) ------
  storage:
    graphroot: /var/lib/containers/storage
    runroot: /run/containers/storage

  # --- co-residency memory budget (SF-8) ----------------------------------
  # Aggregate ceiling for a single-node install. The `memory_budget` filter
  # (filter_plugins/lme_manifests.py) sums the MemoryMax of every ENABLED
  # container service that declares a resources cap -- JVM heap-derived
  # (elasticsearch: heap 4g -> 8G max) OR a direct memory_max (the non-JVM caps
  # added under SF-8) -- and compares the total against usable = host_ram_gb -
  # reserve_gb. Services with no cap (e.g. fleet-server, logstash, the beats) are
  # EXCLUDED from the sum and surfaced separately, so the number is a floor, not
  # the whole footprint. over_budget means OVER-COMMITTED (ceilings exceed usable
  # RAM) -- MemoryMax is a per-service KILL CEILING, not a reservation, so this is
  # ADVISORY: the preflight (container_setup.yml SF-8) WARNS on it, never blocks
  # (the default+llm stack over-commits yet ran end-to-end on a 14G host). The hard
  # gate is the `oversized` list -- any single service whose own MemoryMax exceeds
  # usable RAM (a deterministic OOM-kill) fails the install. Overridable per profile
  # / host_var (e.g. a 32G node raises host_ram_gb).
  budget:
    host_ram_gb: 16       # target single-node host RAM
    reserve_gb: 2         # kept free for the OS + podman/systemd overhead

  # --- canonical published ports (host<->container), per profile-overridable.
  # DEFAULT NETWORK POSTURE = CLOSED (exposure-binds fix): EVERY host-published
  # port binds to 127.0.0.1 by default, so nothing is reachable off-box on a fresh
  # install. render_port() (filter_plugins/lme_manifests.py) only emits 0.0.0.0
  # when a port carries NO bind -- so a bind:127.0.0.1 here is the loopback wall.
  # LAN exposure is an EXPLICIT profile opt-in: a profile that must reach a service
  # off-box re-declares that service's publish_ports with bind:0.0.0.0 on the
  # specific entry (combine(recursive=True) REPLACES the list, so the full list is
  # given). "Open" is always a PRESENT bind:0.0.0.0, never an absent bind (see
  # cluster.yml, which opens ONLY the ES transport port). Services publishing
  # nothing are omitted.
  ports:
    elasticsearch_http:  {host: 9200, container: 9200, bind: 127.0.0.1}
    elasticsearch_transport: {host: 9300, container: 9300, bind: 127.0.0.1}   # cluster only (cluster.yml opens it)
    kibana:              {host: 5601, container: 5601, bind: 127.0.0.1}
    kibana_https:        {host: 443,  container: 5601, bind: 127.0.0.1}
    fleet_server:        {host: 8220, container: 8220, bind: 127.0.0.1}
    fleet_distribution:  {host: 8080, container: 8080, bind: 127.0.0.1}
    wazuh_registration:  {host: 1514, container: 1514, bind: 127.0.0.1}
    wazuh_enrollment:    {host: 1515, container: 1515, bind: 127.0.0.1}
    wazuh_syslog:        {host: 514,  container: 514, protocol: udp, bind: 127.0.0.1}
    wazuh_api:           {host: 55000, container: 55000, bind: 127.0.0.1}
    apm_server:          {host: 8200, container: 8200, bind: 127.0.0.1}
    pgvector:            {host: 5432, container: 5432, bind: 127.0.0.1}
    embeddings:          {host: 8081, container: 8081, bind: 127.0.0.1}
    litellm:             {host: 4000, container: 4000, bind: 127.0.0.1}
    log_analyzer:        {host: 8501, container: 8501, bind: 127.0.0.1}
    dashboard:           {host: 8502, container: 8502, bind: 127.0.0.1}
    logstash_beats:      {host: 5044, container: 5044, bind: 127.0.0.1}
    logstash_http:       {host: 8085, container: 8085, bind: 127.0.0.1}

  # --- shared material catalog (typed obligation payload DEFINITIONS) ----------
  # codex-manager-material-and-membership-contract-decisions-20260923-0430 decision 1;
  # C convergence (ack 0429); D b87f313 record_shape. THE canonical home for material
  # payload DEFINITIONS that per-service `material_requirements` obligations
  # (manifests/services/<svc>.yml) reference by id. C1 OWNS this shared file; C/D/E
  # contribute reviewed definitions for their services (one writer, no competing edits).
  #
  # A definition declares the payload SEMANTICS ONLY (kind + validity), NEVER a
  # placement: placement_class / destination / owner_role / mode / consumer live on the
  # per-service obligation that REFERENCES this definition. So two guardian.pub
  # placements are TWO obligations (a secrets-dir one and a proxy config-dir one) that
  # reference the ONE `guardian_public_key` definition here; a shared reference NEVER
  # authorizes distributing private material -- `kind` distinguishes public_key from
  # private_key. `payload_validity` is the declared rule a producer / recovery preflight
  # validates the ACTUAL bytes against (C's RESTORE-EMPTY-SECRET-PREFLIGHT class:
  # decryptable-but-malformed => FAIL before replacing).
  material_catalog:
    guardian_public_key:
      kind: public_key
      payload_validity: non_empty_pem_public_key
      description: >-
        The fencing guardian's PUBLIC signing key (F1). Published (never the private
        key) to each fenced proxy's config dir, and separately referenced where trust
        is pinned. The private key is NOT a catalog-distributable material.
    # EXTENSION CONTRACT (reviewed here; sole writer C1): C adds certificate /
    # private_key(host-local, non-distributable) / password_file / json / conf payload
    # definitions for credential material; D adds DB replicator/etcd cert + pgpass
    # definitions; E adds telemetry/app material definitions. Each is a payload
    # definition ONLY -- the per-service obligation carries the placement.

  # --- material_catalog schema (C1-MATERIAL-CATALOG-DEFINITION-VALIDATION) -------
  # The DECLARED shape every material_catalog definition is validated against by
  # lme_manifests.py::lme_validate_material_catalog. A null/empty definition, an
  # unknown/absent kind or an absent payload_validity now FAIL (previously a bare
  # catalog membership passed). `distributable_kinds` is the closure that makes a
  # catalog NAME alone insufficient to authorize private-material distribution: an
  # obligation may only reference a definition whose kind is distributable, so
  # flipping guardian_public_key.kind to private_key makes every obligation that
  # references it FAIL (the private key is host-local, never a catalog-distributed
  # obligation payload). Value-pure: the vocab/closure is read from HERE.
  material_catalog_schema:
    definition:
      kind:             {type: str, required: true,  vocab: [public_key, private_key, certificate, password_file, json, conf, pgpass, dsn]}
      payload_validity: {type: str, required: true}
      description:      {type: str, required: false}
    # Kinds an obligation MAY reference (material distributed to a consumer). A kind
    # NOT listed here (e.g. private_key) is host-local / non-distributable.
    distributable_kinds: [public_key, certificate, password_file, json, conf, pgpass, dsn]

# =============================================================================
# lme_config_registry -- the DECLARED SCHEMA for every operator/profile-managed
# config field (C1 shared contract; codex-manager-caller-contract-decisions-
# 20260923-0200 + registry-and-consumer-decisions-20260923-0145).
#
# This is the SINGLE source of truth for: which config keys exist, their type,
# whether they are required or optional, their declared default (tier 5), whether
# they carry a schema-permitted upgrade-preservation fallback (tier 4), and which
# keys are enable-flags (members of lme_enable_flags that is_enabled() consults).
#
# The canonical resolver (filter_plugins/lme_manifests.py::lme_resolve_config,
# called from load_manifests.yml) composes each field by DECLARED PRECEDENCE,
# highest wins:
#   1. explicit extra-vars                    (operator -e)                 origin: extra_var
#   2. explicit inventory / host_var          (operator inventory)          origin: inventory
#   3. explicitly-selected profile overlay    (profile_overlay.vars.<k>)    origin: profile
#   4. declared upgrade-preservation fallback (only where upgrade_fallback:  origin: observation
#      true, and ONLY backed by a verified read-only observation supplied by
#      the caller; NEVER a bare default dressed as observed state)
#   5. declared default                       (this file, `default:`)       origin: default
#
# Rules the resolver enforces (Codex preservation_rules):
#   * A profile that omits a field leaves its permitted preservation fallback /
#     default available (it does NOT force a value).
#   * An auto-INFERRED profile is not an explicit operator profile choice; the
#     caller passes profile origin so an inferred profile never masquerades as -e.
#   * Explicit false / 0 / null / empty keep their declared semantics -- they are
#     real selections and are NOT overwritten by detection because they look falsey.
#   * A REQUIRED field with no value from any tier FAILS validation before any
#     mutation. An OPTIONAL field with no value is ABSENT from lme_resolved
#     (not defaulted to a fabricated value) -- e.g. tailscale_require_vip_live.
#   * NO snapshot-once: every resolution re-reads the current declared inputs +
#     current permitted observations. Outputs live under lme_resolved.* /
#     lme_enable_flags (never re-read as input), so re-evaluation is self-capture-free.
#
# Adding a field or a profile var is a YAML change HERE (+ the profile), never a
# new code roster: load_manifests.yml asserts every profile_overlay.vars key is
# declared here, and is_enabled() treats any enable token not present in the
# resolved flag set as a typo.
#
# type: bool|str.  required: true|false.  nullable: true|false.
# default: <tier-5 value> (OMITTED for a truly-optional field -> absent when unset).
# enable_flag: true  -> member of lme_enable_flags (is_enabled consults it).
# upgrade_fallback: true -> tier-4 observation-backed fallback is permitted for
#   this field (install_elastic_services <- installed-pack-quadlet detection;
#   offline_mode <- offline-marker detection). install_llm's compat `true` is a
#   DECLARED DEFAULT (tier 5), NOT observed state, so its upgrade_fallback is false.
lme_config_registry:
  schema_version: 1
  # Precedence tiers, high -> low, ENFORCED by lme_resolve_config: it ITERATES this
  # list, so reordering it changes resolution (C1-DECLARED-PRECEDENCE / A2). Each
  # tier's SOURCE is declared in `channels` below, so the declaration is the sole
  # authority -- there is no hardcoded tier->source map in the engine.
  precedence: [extra_var, inventory, profile, observation, default]
  channels:
    # extra_var + inventory are the OPERATOR tier: native Ansible precedence has
    # already selected the winning explicit value into `selections` (Q2 -- native
    # selection is permitted WITHIN the operator tier only). provenance:caller means a
    # caller-VERIFIED finer origin (extra_var|inventory) is preserved when supplied,
    # else the honest combined label `operator` is recorded -- never a false
    # attribution (C1-ORIGIN-VALIDATION / A5).
    extra_var:   {source: selections, provenance: caller}
    inventory:   {source: selections, provenance: caller}
    profile:     {source: profile_vars}
    # observation applies ONLY to a field that declares itself eligible
    # (upgrade_fallback): a detected/inferred value may fill an omitted field but
    # never outrank an explicit operator/profile choice. Origin gates defaultability
    # elsewhere: a field declaring origin observation/build MUST NOT carry a default.
    observation: {source: observations, requires_field: upgrade_fallback}
    default:     {source: field_default}
  # Declared origin vocabulary -- every emitted origin label MUST be one of these.
  # `operator` = a natively-selected explicit value with no caller-verified finer source.
  origin_vocabulary: [extra_var, inventory, operator, profile, observation, default]
  fields:
    install_llm:              {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    install_elastic_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    offline_mode:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    install_otel:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: false}
    install_legacy_beats:     {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    tailscale_serve_ingress:  {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_egress:   {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    # OPTIONAL, NO default: absent from lme_resolved unless an operator supplies it;
    # every reader uses `| default(false)`, so absence is the intended "unset" state.
    # bridge_absent is the loader-only reset value for the BARE compat fact when this
    # optional is absent from lme_resolved (C1-OPTIONAL-VALUE-RESET): it clears a stale
    # true carried across a profile switch. It is NOT a resolver `default` (the field
    # stays absent from lme_resolved -- the tested optional-absent contract); it only
    # governs the un-migrated bare-name compat bridge in resolve.yml.
    tailscale_require_vip_live: {type: bool, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: false}
    # es_discovery has a sensible default and every profile currently sets it; it
    # has no live task consumer yet (see manifests/profiles/multinode.yml note).
    es_discovery:             {type: str,  required: true,  nullable: false, default: single-node, enable_flag: false, upgrade_fallback: false}
    lme_consumer_profile:     {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    # DEPLOYMENT-IDENTITY-NOW-REQUIRED (codex-0430 decision 5; codex-0445
    # decision_deployment_identity; D FROZEN lme_runtime_inventory.deployment_identity).
    # STABLE operator/inventory input, OPTIONAL here with NO default: the resolver MUST NOT
    # mint it or derive it from run_id/config/hostname/directory. Absent for profiles that
    # own no persistent resources; a persistent-resource / DB profile REQUIRES it (that hard
    # gate arms with the DB selectors, still rejected at load_manifests.yml:87-95). The
    # projection derives lme_resolved.deployment_identity from it via
    # lme_validate_deployment_identity (shape [A-Za-z0-9_-]+; missing/conflicting REJECTS
    # before mutation once armed). Kept OUT of the content-addressed config revision
    # (three-identity binding: identity keys storage/fence, NOT the config revision).
    lme_deployment_identity:  {type: str, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, exclude_from_revision: true}
    # Declared DB domain / etcd-group membership (codex-0430 decision 4). OPTIONAL map, NO
    # default. Projected to lme_resolved.database.{domains,etcd_groups}.<id>.members by
    # lme_project_database_membership (members validated; dup/self/absent rejected).
    lme_database_membership:  {type: map, required: false, nullable: false, enable_flag: false, upgrade_fallback: false}
    # OBSERVED cluster_uuid fold (P3; codex-0915/0930 shared_registry_ownership -> C1). Elasticsearch
    # MINTS cluster_uuid at bootstrap; LME only ever READS it as a live observation (restore_
    # elasticsearch_snapshot.yml reads cluster_root.json.cluster_uuid). It is NEVER hand-set, so this
    # is an OBSERVATION-ONLY registry field: origin observation (so it carries NO default -- the shape
    # gate forbids a default on an observation origin -- and its honest origin is `observation`),
    # observation_only:true (added at the canonical fold; E's proposal lacked it -- so the operator/
    # profile/default channels are REJECTED and only a verified read-only observation may supply it,
    # closing C1-OBSERVATION-ORIGIN-DOES-NOT-RESTRICT-CHANNEL for this field), upgrade_fallback:true
    # (so the observation channel's requires_field fires and the field can actually resolve),
    # required:false + nullable:true (absent from lme_resolved unless observed; optional-absent
    # contract), exclude_from_revision:true (identity-like; must not churn the config revision, mirrors
    # lme_deployment_identity). It must NOT be minted/derived from run_id/config/hostname. NB the LIVE
    # observation SOURCE (what supplies the observed value to the loader at resolve time) is NOT wired
    # by this fold -- only the canonical representation is declared here (see the sitrep).
    lme_observed_cluster_uuid: {type: str, required: false, nullable: true, enable_flag: false, origin: observation, observation_only: true, upgrade_fallback: true, exclude_from_revision: true}

  # --- typed material_requirements schema (SCHEMA-REQUIRED-MATERIAL) -----------
  # codex-manager-material-and-membership-contract-decisions-20260923-0430 decision 1+2;
  # C convergence (ack 0429); D b87f313 record_shape. EXTENDS this registry (codex-0430:
  # "Schema EXTENDS the existing lme_config_registry"). A per-service
  # `material_requirements` map (authored in manifests/services/<svc>.yml, keyed by a
  # stable service-local obligation id) resolves to
  # lme_resolved.required_material.<node-id>.<service-id>.<obligation-id>. A record is a
  # TYPED obligation (NOT a basename): each `required` field must be present. `material_ref`
  # points at a lme_global.material_catalog definition (payload semantics). Existing
  # secrets / cert / mount / env references MUST resolve to an obligation id here
  # (validated references, not a second copy of paths/perms/names). The engine filter
  # lme_manifests.py::lme_validate_material_requirements enforces this shape value-purely
  # (vocab read from here, never hardcoded in Python).
  material_requirements_schema:
    # ALWAYS-required base fields carry required:true. destination/owner_role/mode are
    # NOT base-required: they are placement-FORM conditional (a file-backed placement
    # needs them; an env-backed secret must NOT fabricate a path/mode) -- see
    # placement_forms (C1-MATERIAL-CANONICAL-REFERENCE-SHAPE). trust/producer/custody/
    # lifecycle/retention are the lifecycle-and-retention references
    # (C1-MATERIAL-LIFECYCLE-AND-RETENTION); producer_ref/custody_ref resolve against
    # canonical producer/custody declarations that C/D still OWE (their reference
    # closure arms when those declarations land -- shape is validated now).
    record:
      material_ref:      {type: str, required: true}    # -> lme_global.material_catalog.<id> (must be a DISTRIBUTABLE kind)
      placement_class:   {type: str, required: true, vocab: [secrets, config, mount, env]}
      consumer:          {type: str, required: true}    # what mounts/reads it (nonempty)
      profile_condition: {type: str, required: true}    # validated against profile_condition_vocab
      destination:       {type: str, required: false}   # file-backed placement only (placement_forms)
      owner_role:        {type: str, required: false}   # file-backed placement only
      mode:              {type: str, required: false}   # file-backed placement only; octal, validated against mode_pattern
      trust_ref:         {type: str, required: false}   # optional CA/credential reference (-> catalog def when it names one)
      producer_ref:      {type: str, required: false}   # canonical producer declaration (C/D owe the producer registry)
      custody_ref:       {type: str, required: false}   # canonical custody/recovery declaration (C/D owe the custody registry)
      lifecycle:         {type: str, required: false, vocab: [bootstrap, rotate, adopt, static]}
      retention:         {type: str, required: false, vocab: [none, prior_revision, durable]}
    # Obligation map keys MUST match this -- stable service-local names, never integers
    # or empties (C1-MATERIAL-IDENTIFIER-AND-REFERENCE-VALIDATION).
    obligation_id_pattern: '\A[a-z][a-z0-9_-]*\Z'
    # Complete anchored octal mode -- \A...\Z rejects "0644\n" and " 0644"
    # (C1-MATERIAL-MODE-TRAILING-NEWLINE).
    mode_pattern: '\A[0-7]{3,4}\Z'
    # Per-placement-form field requirements (value-pure; replaces mode/path dispatch
    # embedded in Python -- codex-0515 value_purity). A file-backed form REQUIRES the
    # path/owner/mode triple; the env form FORBIDS a fabricated path/mode.
    placement_forms:
      secrets: {requires: [destination, owner_role, mode], forbids: []}
      config:  {requires: [destination, owner_role, mode], forbids: []}
      mount:   {requires: [destination, owner_role, mode], forbids: []}
      env:     {requires: [], forbids: [destination, mode]}
    # profile_condition tokens: always | an enable flag | a db-profile. Declared here so
    # an unknown condition FAILS (C1-MATERIAL-SEMANTIC-REFERENCE-CLOSURE); drift-checkable
    # against lme_config_registry enable flags + the DB profile enum like lme_known_enable_flags.
    profile_condition_vocab: [always, install_llm, install_elastic_services, install_otel, install_legacy_beats, offline_mode, shared-ha, dual-owned-ha]
    # Declared namespaces a COLON-FORM trust_ref (`<ns>:<name>`) may use (A3 reference
    # closure). EMPTY today: no colon namespace is declared, so EVERY colon-form trust_ref is
    # unresolved and REJECTED (a bare-name trust_ref must still resolve to a catalog def or a
    # sibling obligation). The producer/custody registries C/D owe will add their namespaces
    # here when they land -- until then a `:`-prefixed trust_ref cannot silently bypass closure.
    trust_ref_namespaces: []
    # THE THREE empty-list cases (codex-0430 decision 2; C RESTORE-EMPTY-SECRET-PREFLIGHT).
    # ALL THREE keys are REQUIRED and MUST be boolean true: an omitted key, a non-bool,
    # or a value that would DISABLE a required failure (e.g. declared_none_passes:false)
    # is an UNSUPPORTED policy and is REJECTED, never silently honored/ignored
    # (C1-MATERIAL-REFERENCE-INPUT-AND-EMPTY-POLICY).
    empty_semantics:
      declared_none_passes: true              # explicit `material_requirements: {}` = legitimately requires none = PASS
      missing_field_fails: true               # a SELECTED service OMITTING the field = INCOMPLETE = FAIL (never implicitly empty)
      empty_contradicting_refs_invalid: true  # {} while cred/trust/mount refs point at an obligation = INVALID
    reference_resolution:
      rule: >-
        Every material_requirement_ref (from datastore_clients, secrets or mounts) MUST
        resolve to an obligation id declared here; an UNRESOLVED reference is a
        PRE-GENERATION CONFIGURATION error (a missing/invalid DECLARATION), distinct from
        a valid declared production that legitimately yields an absent payload
        (codex-0515 stage_and_evidence_corrections + material_stage_clarification: validate
        the full plan BEFORE generation; keep desired/produced/installed/validated
        distinct). material_ref MUST resolve to a material_catalog definition of a
        DISTRIBUTABLE kind.
    enforcement_status:
      # loader_wired = the production loader invokes COMPLETE validation over the MIGRATED
      # declarations (every selected service authoring material_requirements). It stays
      # FALSE until C/D/E finish that migration -- flipping it earlier would either fail
      # every current service (0/29 declare the field) or hide the gap by treating omission
      # as empty (codex-0615: not early, no implicit-empty hiding).
      loader_wired: false
      # projection_emitted = load_manifests.yml composes + EMITS lme_resolved.required_material
      # .<node>.<svc>.<obligation> on the live path (+ required_material_status marking each
      # selected service declared|declared_none|undeclared with structural evidence).
      projection_emitted: true
      # validator_invoked = the emitter calls lme_validate_material_requirements for every
      # service that DECLARES the field, and FAILS a declared-none ({}) service that still
      # bears material evidence (secrets/certs). It does NOT fail an undeclared service
      # (missing_field_fails is not armed) -- it marks it status:undeclared instead.
      validator_invoked: true
      # missing_field_enforced = arming missing_field_fails on EVERY selected service.
      # Arms in the coordinated wave AFTER the migration; that flip also sets loader_wired.
      missing_field_enforced: false
      # activation_qualified = a live loader run / deploy acceptance of the emitted
      # projection. NOT established by this wiring wave; stays open.
      activation_qualified: false
      note: >-
        The DECLARATION schema, the value-pure validator AND the loader projection emitter
        are LIVE. An undeclared-but-material-bearing service surfaces as status:undeclared
        (visible debt) rather than being failed or hidden as empty. C's materializer
        PRODUCES against these records; D's completeness loop + restore/rollback preflight
        VERIFY; F2's rollback gate CONSUMES the union. loader_wired flips (and
        missing_field arms) only when every selected service is migrated.
