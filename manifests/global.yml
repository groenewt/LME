        # 904a7e6a, macro installed_set_gate in controller_seed.j2): a controller-bootstrap export rendered from the SAME
        # canonical macros file, following the launcher_params contract (declared-reference import rooted at
        # lme_seed_bs.seed_fragments.installed_set_gate_rel; one checkout input, the lock file). NOT a bundle member;
        # consumers: [] (a rendered fragment no executed tool is declared against). when_present: a scope whose policy
        # declares no controller.bootstrap.seed_fragments binds neither its inputs nor its import (optional fragment);
        # the template proof stays total. The renderer consumes the RESOLVED reference (rh.controller.bootstrap.
        # seed_fragments.installed_set_gate_rel) -- no runtime raw-profile reload, no second merge.
        installed_set_gate:
          entry_count: 1
          templates:
            - testing/remote_harness/templates/lme-seed-installed-set-gate.sh.j2
            - testing/remote_harness/templates/macros/controller_seed.j2
          inputs: {lme_seed_bs: controller.bootstrap}
          checkout_inputs: {lme_seed_lock: controller.lock_file_rel}
          consumers: []
          not_embedded_fields: [identity]
          when_present: controller.bootstrap.seed_fragments
