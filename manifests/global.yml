---
# manifests/global.yml -- cross-cutting deployment values for the whole LME stack.
#
# This is a DATA file: value literals live HERE (and in manifests/profiles/*,
# manifests/services/*). They are banned from the render templates
# (ansible/templates/units/*.j2) AND from the filter plugin
# (filter_plugins/lme_manifests.py) -- the engine holds only arithmetic +
# structure and reads every value/pattern/default from this tree. (Per
# operator-rulings lme-renderer-literals + generated_artifact_exemption:false;
# supersedes the earlier note that permitted literals in the filter plugin.)
#
# Load order (ansible/roles/podman/tasks/load_manifests.yml):
#   lme_global = global.yml
#              | combine(<active profile overlay>, recursive=True)
#              | combine(lme_global_override | default({}), recursive=True)
# i.e. profiles overlay the baseline, and an operator host_var override wins LAST.

lme_global:

  # --- userns / cert-owner derivation seeds -------------------------------
  # THE only place these numbers live. Every id-mapping base and every cert
  # owner uid is DERIVED from them by filter_plugins/lme_manifests.py:
  #   userns_base(svc) = subuid_base + slot(svc) * slot_size
  #   cert key owner   = userns_base(svc) + in_container_uid
  subuid_base: 165536
  # /etc/subuid & /etc/subgid range length for the rootless 'containers' user
  # (the outer range userns slots carve into); base setup_directories renders it.
  subuid_range: 65536
  slot_size: 3048
  # Logical service -> slot index. A service absent here has no pinned id-mapping
  # and resolves to subuid_base (the observed lme_backups owner, 165536).
  slots:
    elasticsearch: 0      # base 165536
    kibana: 1             # base 168584
    fleet-server: 2       # base 171632
    wazuh-manager: 3      # base 174680
    elastalert: 4         # base 177728

  # --- userns directive rendering (render_userns) -- FORMAT/PATTERN strings ----
  # The STRING patterns render_userns() emits. The numeric base/size are still
  # DERIVED from subuid_base/slot_size above; only the format templates and the
  # mode default live here (hoisted out of filter_plugins/lme_manifests.py per
  # operator-rulings finding lme-renderer-literals -- the engine keeps arithmetic,
  # values live in YAML). Format fields: {base},{size} (auto), {name} (share_ref).
  userns:
    default_mode: auto
    auto_format: 'auto:uidmapping=0:{base}:{size},gidmapping=0:{base}:{size}'
    unpinned_value: auto
    share_ref: 'container:lme-{name}'

  # --- systemd unit naming (svc_unit) -- FORMAT/PATTERN strings ----------------
  # The unit names quadlet generates for each logical service, as format strings
  # (field {name}). Hoisted out of the filter plugin (lme-renderer-literals): the
  # engine picks WHICH pattern by kind; the pattern text is a value and lives here.
  unit_naming:
    target: lme.service
    network: lme-network.service
    volume: 'lme-{name}-volume.service'
    service: 'lme-{name}.service'

  # --- podman network (renders lme.network) -------------------------------
  network:
    name: lme
    driver: bridge
    subnet: 10.89.4.0/24
    gateway: 10.89.4.1
    ipam_driver: host-local

  # --- images -------------------------------------------------------------
  # image_tag is the sentinel tag the build/load path retags every image to.
  # Units reference the `local` ref (localhost/<name>:LME_LATEST) which is stable
  # across online/offline installs; `pull` is the upstream source used at
  # build/prefetch time and is what profiles/offline.yml re-points. `group` gates
  # which services a given install renders (core | elastic_services | llm).
  # image_tag is a LITERAL tag string (there is no substitution step; the build
  # path retags every upstream image to localhost/<name>:LME_LATEST and the units
  # reference that verbatim). `pull` refs and versions are extracted from
  # config/containers.txt, config/containers-llm.txt and
  # config/containers-elastic-services.txt -- the current sources of truth.
  image_tag: LME_LATEST
  images:
    # Registry-pinned 0.161.0 multiarch index; runtime qualification is a separate gate.
    otel-collector: {local: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, pull: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, group: telemetry}
    elasticsearch:  {local: localhost/elasticsearch:LME_LATEST,      pull: docker.elastic.co/elasticsearch/elasticsearch:8.18.8,     group: core}
    kibana:         {local: localhost/kibana:LME_LATEST,             pull: docker.elastic.co/kibana/kibana:8.18.8,                  group: core}
    elastic-agent:  {local: localhost/elastic-agent:LME_LATEST,      pull: docker.elastic.co/beats/elastic-agent:8.18.8,            group: core}
    distribution:   {local: localhost/distribution:LME_LATEST,       pull: docker.elastic.co/package-registry/distribution:lite-8.18.8, group: core}
    wazuh-manager:  {local: localhost/wazuh-manager:LME_LATEST,      pull: docker.io/wazuh/wazuh-manager:4.9.1,                     group: core}
    elastalert2:    {local: localhost/elastalert2:LME_LATEST,        pull: docker.io/jertel/elastalert2:2.20.0,                     group: core}
    logstash:       {local: localhost/logstash:LME_LATEST,           pull: docker.elastic.co/logstash/logstash:8.18.8,              group: elastic_services}
    filebeat:       {local: localhost/filebeat:LME_LATEST,           pull: docker.elastic.co/beats/filebeat:8.18.8,                 group: elastic_services}
    metricbeat:     {local: localhost/metricbeat:LME_LATEST,         pull: docker.elastic.co/beats/metricbeat:8.18.8,               group: elastic_services}
    heartbeat:      {local: localhost/heartbeat:LME_LATEST,          pull: docker.elastic.co/beats/heartbeat:8.18.8,                group: elastic_services}
    apm-server:     {local: localhost/apm-server:LME_LATEST,         pull: docker.elastic.co/apm/apm-server:8.18.8,                 group: elastic_services}
    # llama-cpp: dot->dash rename is intentional (llama.cpp -> llama-cpp); the
    # same image backs lme-embeddings. pgvector is pg17. litellm is main-latest.
    pgvector:       {local: localhost/pgvector:LME_LATEST,           pull: docker.io/pgvector/pgvector:pg17,                        group: llm}
    llama-cpp:      {local: localhost/llama-cpp:LME_LATEST,          pull: ghcr.io/ggml-org/llama.cpp:server,                       group: llm}
    litellm:        {local: localhost/litellm:LME_LATEST,            pull: ghcr.io/berriai/litellm:main-latest,                     group: llm}
    # Built locally from a Dockerfile (no upstream pull source).
    lme-log-analyzer: {local: localhost/lme-log-analyzer:LME_LATEST, build: lme-log-analyzer/Dockerfile, group: llm}
    lme-dashboard:  {local: localhost/lme-dashboard:LME_LATEST,      build: lme-dashboard/Dockerfile,    group: llm}

  # --- cert tree (B4) -----------------------------------------------------
  certs:
    volume: lme_certs               # private workspace volume (setup-certs generates here)
    host_tree: /opt/lme/certs       # per-service published bundles live under here
    ca_public_rel: ca/ca.crt        # the ONLY CA material that leaves the workspace
    default_in_container_uid: 0

  # --- filesystem paths ---------------------------------------------------
  paths:
    opt: /opt/lme
    config: /opt/lme/config
    env_file: /opt/lme/lme-environment.env
    vault_pass: /etc/lme/pass.sh
    models: /opt/lme/llama-models

  # --- container storage (overridable via podman -g / install.sh -g) ------
  storage:
    graphroot: /var/lib/containers/storage
    runroot: /run/containers/storage

  # --- co-residency memory budget (SF-8) ----------------------------------
  # Aggregate ceiling for a single-node install. The `memory_budget` filter
  # (filter_plugins/lme_manifests.py) sums the MemoryMax of every ENABLED
  # container service that declares a resources cap -- JVM heap-derived
  # (elasticsearch: heap 4g -> 8G max) OR a direct memory_max (the non-JVM caps
  # added under SF-8) -- and compares the total against usable = host_ram_gb -
  # reserve_gb. Services with no cap (e.g. fleet-server, logstash, the beats) are
  # EXCLUDED from the sum and surfaced separately, so the number is a floor, not
  # the whole footprint. over_budget means OVER-COMMITTED (ceilings exceed usable
  # RAM) -- MemoryMax is a per-service KILL CEILING, not a reservation, so this is
  # ADVISORY: the preflight (container_setup.yml SF-8) WARNS on it, never blocks
  # (the default+llm stack over-commits yet ran end-to-end on a 14G host). The hard
  # gate is the `oversized` list -- any single service whose own MemoryMax exceeds
  # usable RAM (a deterministic OOM-kill) fails the install. Overridable per profile
  # / host_var (e.g. a 32G node raises host_ram_gb).
  budget:
    host_ram_gb: 16       # target single-node host RAM
    reserve_gb: 2         # kept free for the OS + podman/systemd overhead

  # --- canonical published ports (host<->container), per profile-overridable.
  # DEFAULT NETWORK POSTURE = CLOSED (exposure-binds fix): EVERY host-published
  # port binds to 127.0.0.1 by default, so nothing is reachable off-box on a fresh
  # install. render_port() (filter_plugins/lme_manifests.py) only emits 0.0.0.0
  # when a port carries NO bind -- so a bind:127.0.0.1 here is the loopback wall.
  # LAN exposure is an EXPLICIT profile opt-in: a profile that must reach a service
  # off-box re-declares that service's publish_ports with bind:0.0.0.0 on the
  # specific entry (combine(recursive=True) REPLACES the list, so the full list is
  # given). "Open" is always a PRESENT bind:0.0.0.0, never an absent bind (see
  # cluster.yml, which opens ONLY the ES transport port). Services publishing
  # nothing are omitted.
  ports:
    elasticsearch_http:  {host: 9200, container: 9200, bind: 127.0.0.1}
    elasticsearch_transport: {host: 9300, container: 9300, bind: 127.0.0.1}   # cluster only (cluster.yml opens it)
    kibana:              {host: 5601, container: 5601, bind: 127.0.0.1}
    kibana_https:        {host: 443,  container: 5601, bind: 127.0.0.1}
    fleet_server:        {host: 8220, container: 8220, bind: 127.0.0.1}
    fleet_distribution:  {host: 8080, container: 8080, bind: 127.0.0.1}
    wazuh_registration:  {host: 1514, container: 1514, bind: 127.0.0.1}
    wazuh_enrollment:    {host: 1515, container: 1515, bind: 127.0.0.1}
    wazuh_syslog:        {host: 514,  container: 514, protocol: udp, bind: 127.0.0.1}
    wazuh_api:           {host: 55000, container: 55000, bind: 127.0.0.1}
    apm_server:          {host: 8200, container: 8200, bind: 127.0.0.1}
    pgvector:            {host: 5432, container: 5432, bind: 127.0.0.1}
    embeddings:          {host: 8081, container: 8081, bind: 127.0.0.1}
    litellm:             {host: 4000, container: 4000, bind: 127.0.0.1}
    log_analyzer:        {host: 8501, container: 8501, bind: 127.0.0.1}
    dashboard:           {host: 8502, container: 8502, bind: 127.0.0.1}
    logstash_beats:      {host: 5044, container: 5044, bind: 127.0.0.1}
    logstash_http:       {host: 8085, container: 8085, bind: 127.0.0.1}

# =============================================================================
# lme_config_registry -- the DECLARED SCHEMA for every operator/profile-managed
# config field (C1 shared contract; codex-manager-caller-contract-decisions-
# 20260923-0200 + registry-and-consumer-decisions-20260923-0145).
#
# This is the SINGLE source of truth for: which config keys exist, their type,
# whether they are required or optional, their declared default (tier 5), whether
# they carry a schema-permitted upgrade-preservation fallback (tier 4), and which
# keys are enable-flags (members of lme_enable_flags that is_enabled() consults).
#
# The canonical resolver (filter_plugins/lme_manifests.py::lme_resolve_config,
# called from load_manifests.yml) composes each field by DECLARED PRECEDENCE,
# highest wins:
#   1. explicit extra-vars                    (operator -e)                 origin: extra_var
#   2. explicit inventory / host_var          (operator inventory)          origin: inventory
#   3. explicitly-selected profile overlay    (profile_overlay.vars.<k>)    origin: profile
#   4. declared upgrade-preservation fallback (only where upgrade_fallback:  origin: observation
#      true, and ONLY backed by a verified read-only observation supplied by
#      the caller; NEVER a bare default dressed as observed state)
#   5. declared default                       (this file, `default:`)       origin: default
#
# Rules the resolver enforces (Codex preservation_rules):
#   * A profile that omits a field leaves its permitted preservation fallback /
#     default available (it does NOT force a value).
#   * An auto-INFERRED profile is not an explicit operator profile choice; the
#     caller passes profile origin so an inferred profile never masquerades as -e.
#   * Explicit false / 0 / null / empty keep their declared semantics -- they are
#     real selections and are NOT overwritten by detection because they look falsey.
#   * A REQUIRED field with no value from any tier FAILS validation before any
#     mutation. An OPTIONAL field with no value is ABSENT from lme_resolved
#     (not defaulted to a fabricated value) -- e.g. tailscale_require_vip_live.
#   * NO snapshot-once: every resolution re-reads the current declared inputs +
#     current permitted observations. Outputs live under lme_resolved.* /
#     lme_enable_flags (never re-read as input), so re-evaluation is self-capture-free.
#
# Adding a field or a profile var is a YAML change HERE (+ the profile), never a
# new code roster: load_manifests.yml asserts every profile_overlay.vars key is
# declared here, and is_enabled() treats any enable token not present in the
# resolved flag set as a typo.
#
# type: bool|str.  required: true|false.  nullable: true|false.
# default: <tier-5 value> (OMITTED for a truly-optional field -> absent when unset).
# enable_flag: true  -> member of lme_enable_flags (is_enabled consults it).
# upgrade_fallback: true -> tier-4 observation-backed fallback is permitted for
#   this field (install_elastic_services <- installed-pack-quadlet detection;
#   offline_mode <- offline-marker detection). install_llm's compat `true` is a
#   DECLARED DEFAULT (tier 5), NOT observed state, so its upgrade_fallback is false.
lme_config_registry:
  precedence: [extra_var, inventory, profile, observation, default]   # high -> low (documented; enforced in lme_resolve_config)
  fields:
    install_llm:              {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    install_elastic_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    offline_mode:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    install_otel:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: false}
    install_legacy_beats:     {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    tailscale_serve_ingress:  {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_egress:   {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    # OPTIONAL, NO default: absent from lme_resolved unless an operator supplies it;
    # every reader uses `| default(false)`, so absence is the intended "unset" state.
    tailscale_require_vip_live: {type: bool, required: false, nullable: false, enable_flag: false, upgrade_fallback: false}
    # es_discovery has a sensible default and every profile currently sets it; it
    # has no live task consumer yet (see manifests/profiles/multinode.yml note).
    es_discovery:             {type: str,  required: true,  nullable: false, default: single-node, enable_flag: false, upgrade_fallback: false}
    lme_consumer_profile:     {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
