            - {path: genesis.entry.statuses, values_distinct: true}
        genesis_builder:
          root: controller.bootstrap.genesis.builder
          when_present: controller.bootstrap.genesis
          checks:
            # C1-SR327 CPL-OP1B-C1-TCROLE: + toolchain_role (sorted).
            - {path: '', keys: [authoring, checkout_members_render, collections, config_file, core, env_allow, executable, filter_plugins_rel, messages,
                                python, python_major_minor, refusal, root, toolchain, toolchain_role]}
            # records-genesis-plugin-env-02: the checkout_members render entry (exact keys and values; the refusal_grammar form)
            - {path: checkout_members_render, keys: [entry_rel, initial, macro, macros_rel, plugin]}
            - {path: checkout_members_render.initial, keys: [dirs, pairs]}
            - {path: checkout_members_render.initial.dirs, enum: [[]]}
            - {path: checkout_members_render.initial.pairs, enum: [[]]}
            - {path: checkout_members_render.plugin, enum: [ansible.builtin.template]}
            - {path: checkout_members_render.entry_rel, enum: [testing/remote_harness/templates/checkout_members.j2]}
            - {path: checkout_members_render.macros_rel, enum: [testing/remote_harness/templates/macros/genesis_entry.j2]}
            - {path: checkout_members_render.macro, enum: [cmembers]}
            # MR03 FIRST-SOURCE-BUILD (codex-tick622 / tick627 / tick629 / tick630 OD-FR1-04; codex-tick637 Q1): the authoring builder
            # -- exact keys; its root a declared sub_root DISTINCT from the managed root; its purposes (stages) launch stages; a
            # purpose's operation a declared mode; the initializer-bound and the release-bound purposes disjoint subsets; seed /
            # bundle digests sha256_hex; the pin fields EXACTLY the recipe-required seed field (mutual within with
            # genesis.entry.render.struct_sources.seed_sha256.path, SHARED-WITH-C1) and keys of this node; boundary / refusal /
            # texts exact.
            # C1-SR915 (G-SR328-PREEXISTING-8; OBS-C1-SR327-AUTHORING-KEYS): + operation_admission, the reserved admission fact of
            # an operations purpose (records-c1-framework-13; profile authoring.operation_admission), the {var} form of
            # genesis.initializer.admission / custody.admission; its var is the genesis_generate record-free admission.
            - {path: authoring, keys: [boundary, bundle, initializer, operation_admission, operations, pin, refusal, releases, root, seed_sha256, stages, texts]}
            - {path: authoring.operation_admission, keys: [var]}
            - {path: authoring.operation_admission.var, pattern: var_name}
            - {path: authoring.operation_admission.var, subject: scalar, within: [controller.bootstrap.source_admission.resolve_phases.record_free_admissions]}
            - {path: authoring.root, keys: [sub]}
            - {path: authoring.root.sub, subject: scalar, within: [controller.bootstrap.work_roots.sub_roots]}
            - {path: authoring.root.sub, distinct_from: [root.sub]}
            - {path: authoring.stages, strings: {nonempty: true, distinct: true}}
            - {path: authoring.stages, subject: list, within: [controller.bootstrap.genesis.launch.stages]}
            - {path: authoring.operations, subject: keys, within: [controller.bootstrap.genesis.builder.authoring.stages]}
            - {path: 'authoring.operations.*', subject: scalar, within: [controller.entry_generation.operation.modes]}
            - {path: authoring.initializer, strings: {nonempty: true, distinct: true}}
            # codex-tick715 (C1-PKG records-dispatch-01): initializer purposes are launch stages run only inside the admitted
            # initializer, not authoring stages (FORM-G keeps authoring.stages unchanged).
            - {path: authoring.initializer, subject: list, within: [controller.bootstrap.genesis.launch.stages]}
            - {path: authoring.releases, strings: {nonempty: true, distinct: true}}
            # releases are launch stages (release), not authoring stages (P-01V); GL-01W fixes GL-01U.
            - {path: authoring.releases, subject: list, within: [controller.bootstrap.genesis.launch.stages]}
            - {path: authoring.releases, subject: list, not_within: [controller.bootstrap.genesis.builder.authoring.initializer]}
            # the initializer-bound purposes are disjoint from the release-bound and the authoring-stage purposes by an existing
            # kind (disjoint_from), independent of the not_within kind.
            - {path: authoring.initializer, disjoint_from: [authoring.releases, authoring.stages]}
            - {path: authoring.seed_sha256, pattern: sha256_hex}
            - {path: authoring.bundle, keys: [checksum_file_sha256, manifest_sha256]}
            - {path: authoring.bundle, each: true, pattern: sha256_hex}
            - {path: authoring.pin, keys: [fields]}
            - {path: authoring.pin.fields, strings: {nonempty: true, distinct: true}}
            - {path: authoring.pin.fields, subject: list, within: [controller.bootstrap.genesis.builder.authoring]}
            - {path: authoring.pin.fields, subject: list, within: [controller.bootstrap.genesis.entry.render.struct_sources.seed_sha256.path]}
            - {path: authoring.boundary, keys: [initial, resume, unchanged]}
            - {path: authoring.refusal, pattern: refusal_code}
            - {path: authoring.refusal, distinct_from: [refusal]}
            # records-lg-compose-11 LG11-07 (records-lrh-profile-p6-13 P613-01 / OW-613-GL-01; route records-route-life-17): + a_receipt.
            - {path: authoring.texts, keys: [a_receipt, act, boundary, distinct, initializer, pin, release]}
            - {path: authoring.texts, each: true, pattern: text_line}
            - {path: authoring.boundary, each: true, pattern: var_name}
            - {path: toolchain, enum: [seed_generation]}
            # C1-SR327 CPL-OP1B-C1-TCROLE: the builder's toolchain role word, a declared role (input_binding.roles, recipe_at key).
            - {path: toolchain_role, subject: scalar, within: [controller.bootstrap.lock_capture.input_binding.roles]}
            - {path: toolchain_role, subject: scalar, within: [controller.bootstrap.lock_capture.recipe_at]}
            - {path: executable, keys: [gen_dir, rel]}
            - {path: python, keys: [gen_dir, rel]}
            - {path: root, keys: [sub]}
            - {path: root.sub, subject: scalar, within: [controller.bootstrap.work_roots.sub_roots]}
            - {path: executable.gen_dir, subject: scalar, within: [controller.bootstrap.layout.gen_dirs]}
