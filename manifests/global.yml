        # VALUES): the roles R1's consumer reads by name (rh_early_view.context / .binding), the three context fields
        # it reads (refusal_grammar, path_separator, body_domain), the binding fields it compares with the launcher record
        # (edition, declaration_rel, declaration_sha256) and the refusal code it raises (RH-SOURCE-EARLY-VIEW).
        source_admission_early_view:
          root: controller.bootstrap.source_admission.early_view
          checks:
            - {path: '', keys: [binding_fields, context_fields, launch_context_fields, override, refusal, rel_path_field, roles, text]}
            - {path: roles, keys: [binding, context]}
            - {path: roles.context, enum: [context]}
            - {path: roles.binding, enum: [binding]}
            - {path: context_fields, keys: [body_domain, path_separator, refusal_grammar]}
            - {path: context_fields.refusal_grammar, strings: {nonempty: true, distinct: true}}
            - {path: context_fields.path_separator, strings: {nonempty: true, distinct: true}}
            - {path: context_fields.body_domain, strings: {nonempty: true, distinct: true}}
            - {path: binding_fields, strings: {nonempty: true, distinct: true}}
