      # record envelope var is declared ONCE at source_admission.bootstrap_input.var; launch.envelope_fields
      # {record: var} selects it and envelope.record is RESOLVED here. The authored envelope keeps resolved_run; an
      # authored envelope.record is a second authority and refuses (lookup_merge collision check). F05-S4 (MAIN ruling
      # 1, codex-tick546 inactive_profiles; preserves codex-tick543 OD-BRR-07): gated by `when` (the ONE activity rule)
      # -- active: genesis.launch is REQUIRED (absent refuses typed) and envelope.record projected; inactive: no
      # envelope is fabricated and nothing refuses here (a declared genesis.launch stays under its when_present contracts).
      source_record_envelope:
        kind: lookup_merge
        after: []
        when: entry_generation_contract
        at: controller.bootstrap.genesis.launch
        from: envelope_fields
        to: envelope
        source: controller.bootstrap.source_admission.bootstrap_input
      # L-11 (codex-tick498 R2N-L11-NONROLE-REUSE): the seed's packaged tools record {role: {<tool_fields.path>: path,
      # <tool_fields.sha256>: identity.sha256}} for exactly the source_admission.tool_roles roles. The seed entry reads
      # it (never os_tools identity), so every template keeps not_embedded_fields [identity] under the full proof, the
      # selected identities enter the seed reuse key (host-scoped projected leaves) and unrelated identities do not.
      seed_packaged_tools:
        kind: select_record
        after: []
        at: controller.bootstrap
        to: packaged_tools
        roles: controller.bootstrap.source_admission.tool_roles
        source: controller.bootstrap.os_tools
        fields_from: controller.bootstrap.source_admission.tool_fields
        fields: {path: path, sha256: identity.sha256}
        segment_pattern: var_name     # to / role keys / output names are single dot-free path steps (codex-tick500)
      receipt_loader_path:
        kind: path_list
        after: []
        at: controller.bootstrap.run_binding.receipt_bindings.loader_source_sha256
        from: path_from
        to: path
        parts:
          - {key: container, in: controller.bootstrap.source_admission.record_fields}
          - {key: member, in: controller.bootstrap.source_admission}
          - {key: field, in: controller.bootstrap.source_admission.member_fields}
      # LI-07 (codex-tick507 LI-07-RENDER-STAGE-INPUTS; B LI-07 / B-OD-02 b; codex-tick461 R5P-TRANSITION-ROLE-COLLISION
      # "no second editable list"): the render stage's extra-var NAMES are the sorted values of the ONE render-input role
      # mapping run_binding.inputs. The authored stage never carries extra_vars (contract genesis_inventory_kinds
      # stages.render_binding keys [playbook_rel, inventory, stage_inputs]); the stage is bound to run_binding.entry_rel
      # by that same contract (stages.render_binding.playbook_rel within run_binding.entry_rel), so `at` restates no
      # new literal. Consumer: testing/e2e/inventory_binding/render_run_binding.yml :447-455 (RUN-BINDING-RENDER-INPUT).
      # F05-S4 (MAIN ruling 1, codex-tick546 inactive_profiles): gated by `when` like source_record_envelope -- active:
