        # F05-S4 rh-source-status (F05-GEN4-02; codex-tick546): the seed refusal vocabulary controller.bootstrap.refusals
        # is a code -> exit status map (refusal_fn renders one case arm per key; the catch-all is never a declaration):
        # keys refusal codes, values distinct integers in [1, 125]. Every RH-SOURCE-* code source_admission declares
        # (refusals incl. every git cause, bootstrap_input.refusals, early_view.refusal, git.input_refusal) must be a key,
        # so no source code reaches the catch-all. source_admission.refusals keys are exact (a new role cannot slip past
        # the status requirement) and refusals.git keys equal git.cause_keys (both directions; no restated list).
        # RESIDUE: an orphan key (a status for a code no declaration raises) is not refused by this flat map.
        # C1-SR915 (G-SR328-PREEXISTING-8; codex-tick656 OD-BOOT-02 "park unused boot-record transport/construction and its
        # dependent first-build rows together"): the boot-record carrier key (boot_key) and its ABI keys (boot_keys) are not
        # declared by the profile and have no consumer; their three rows are parked here byte-for-byte, NOT dropped, and bind
        # in full the moment a declaration revision re-declares bootstrap_input.boot_key (when_present). A boot_keys without
        # a boot_key is caught by its own row once boot_key is present; the profile today declares neither.
        # C1-SR919 (codex 919 SR915_PARKED_BOOT_ROWS, 6db9d001): applicability is bound to the DECLARED CONSUMER GRAPH
        # (profile source_admission.bootstrap_input.boot_carrier), not to boot_key alone. The three rows below stay verbatim
        # (retained obligation); the condition on boot_key is kept and supplemented: (1) under boot_key, boot_keys is
        # required too and a consumer must be declared (an unused boot_key refuses: OD-BOOT-02 parks it); (2)
        # bootstrap_boot_keys_need_key rejects boot_keys without boot_key INDEPENDENTLY of this condition; (3) each declared
        # consumer role (bootstrap_boot_carrier_consumer_n9 / _n7 / _n1) requires both keys, so a consumer makes this
        # contract apply (absence never silently deactivates a required consumer); (4) bootstrap_boot_carrier_graph (always
        # active) requires the graph itself, so absence of the graph refuses.
        bootstrap_boot_carrier_parked:
          root: controller.bootstrap
          when_present: controller.bootstrap.source_admission.bootstrap_input.boot_key
          checks:
            - {path: source_admission.bootstrap_input.boot_key, pattern: var_name}
            - {path: source_admission.bootstrap_input.boot_key, not_in: [reserved_outputs, resolver_outputs]}
            - {path: source_admission.bootstrap_input.boot_keys, enum: [[declaration_abs, digest_algorithm, refusals]]}
            - {path: source_admission.bootstrap_input, has_keys: [boot_key, boot_keys]}
            - {path: source_admission.bootstrap_input.boot_carrier.consumers, subject: keys, within: [controller.bootstrap.source_admission.bootstrap_input.boot_carrier.roles]}
        # C1-SR919: boot_keys without boot_key refuses, independently of the boot_key condition above.
        bootstrap_boot_keys_need_key:
          root: controller.bootstrap
          when_present: controller.bootstrap.source_admission.bootstrap_input.boot_keys
          checks:
            - {path: source_admission.bootstrap_input, has_keys: [boot_key, boot_keys]}
        # C1-SR919: the consumer graph, ALWAYS active (no when_present): declared, ruling and roles pinned, every role key
        # a declared role, every consumer an admitted member rel; an empty consumers mapping is the parked state.
        bootstrap_boot_carrier_graph:
          root: controller.bootstrap.source_admission.bootstrap_input
          checks:
            - {path: boot_carrier, keys: [consumers, roles, ruling]}
            - {path: boot_carrier.ruling, enum: [OD-BOOT-02]}
            - {path: boot_carrier.roles, enum: [[n9, n7, n1]]}
            - {path: boot_carrier.consumers, key_pattern: boot_consumer_role}
            - {path: 'boot_carrier.consumers.*', subject: scalar, within: [controller.bootstrap.source_admission.members_rel], empty_mapping: true}
        # C1-SR919: a declared consumer (per OD-BOOT-02 role) makes the carrier ACTIVE: both keys required, which in turn
        # applies bootstrap_boot_carrier_parked in full.
        bootstrap_boot_carrier_consumer_n9:
          root: controller.bootstrap.source_admission.bootstrap_input
          when_present: controller.bootstrap.source_admission.bootstrap_input.boot_carrier.consumers.n9
          checks:
            - {path: '', has_keys: [boot_key, boot_keys]}
        bootstrap_boot_carrier_consumer_n7:
          root: controller.bootstrap.source_admission.bootstrap_input
          when_present: controller.bootstrap.source_admission.bootstrap_input.boot_carrier.consumers.n7
          checks:
            - {path: '', has_keys: [boot_key, boot_keys]}
        bootstrap_boot_carrier_consumer_n1:
          root: controller.bootstrap.source_admission.bootstrap_input
          when_present: controller.bootstrap.source_admission.bootstrap_input.boot_carrier.consumers.n1
          checks:
            - {path: '', has_keys: [boot_key, boot_keys]}
        bootstrap_refusal_statuses:
          root: controller.bootstrap
          checks:
            - {path: refusals, key_pattern: refusal_code}
            - {path: refusals, each: true, int_range: {min: 1, max: 125}}
            - {path: refusals, values_distinct: true}
            - {path: source_admission.refusals, keys: [document, git, input, member, replaced, tool]}
            - {path: source_admission.refusals.input, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.refusals.tool, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.refusals.member, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.refusals.replaced, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.refusals.document, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.refusals.git, subject: keys, within: [controller.bootstrap.source_admission.git.cause_keys]}
            - {path: source_admission.git.cause_keys, subject: list, within: [controller.bootstrap.source_admission.refusals.git]}
            - {path: source_admission.refusals.git, each: true, subject: scalar, within: [controller.bootstrap.refusals]}
            # codex-tick637 boot_shape: the named bootstrap refusals mapping; every value a declared status code and equal to
            # the ONE registry literal (no literal in any consumer); the boot ABI keys pinned here
            - {path: source_admission.bootstrap_input.refusals, keys: [bytes, input]}
            - {path: source_admission.bootstrap_input.refusals, each: true, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.bootstrap_input.refusals.input, equals_registry: {path: contract_admission.bootstrap_input_refusal.input}}
            - {path: source_admission.bootstrap_input.refusals.bytes, equals_registry: {path: contract_admission.bootstrap_input_refusal.bytes}}
            # C1-SR915 (G-SR328-PREEXISTING-8): the three boot_key / boot_keys rows moved VERBATIM to bootstrap_boot_carrier_parked.
            - {path: source_admission.early_view.refusal, subject: scalar, within: [controller.bootstrap.refusals]}
            - {path: source_admission.git.input_refusal, subject: scalar, within: [controller.bootstrap.refusals]}
        genesis_act:
          root: controller.bootstrap.genesis.launch.stage_root
          when_present: controller.bootstrap.genesis.launch
          checks:
            - {path: '', keys: [sub, rel, act]}
            - {path: sub, subject: scalar, within: [controller.bootstrap.work_roots.sub_roots]}
            - {path: rel, pattern: rel_segment}
            - {path: act, keys: [var, regex, match, created]}
            - {path: act.var, pattern: var_name}
            - {path: act.var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: act.regex, ere: anchored}
            - {path: act.regex, rejects: ['', '.', '..', 'a/b']}
            - {path: act.match, enum: [fullmatch]}
            - {path: act.created, enum: [exclusive]}
