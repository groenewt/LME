        # records-dk03-launch-01 (codex-tick764 / 765 DK03 option A): the seed plugin search policy. The env names are
        # the Ansible configuration interface (core base.yml DEFAULT_FILTER / LOOKUP / TEST_PLUGIN_PATH env), so they are
        # pinned exactly; the filter dirs are source_admission.import_closure.filter_dirs (launcher-owned, genesis-optional:
        # records-seed-runlocal-01); none pins every other plugin search type; none_rel is one segment.
        source_admission_plugin_search:
          root: controller.bootstrap.source_admission
          checks:
            - {path: plugin_search, keys: [bytecode, join, members, none, none_rel]}
            - {path: plugin_search.members, keys: [ANSIBLE_FILTER_PLUGINS]}
            - {path: plugin_search.members.ANSIBLE_FILTER_PLUGINS, enum: [[source_admission, import_closure, filter_dirs]]}
            - {path: plugin_search.none, enum: [[ANSIBLE_ACTION_PLUGINS, ANSIBLE_BECOME_PLUGINS, ANSIBLE_CACHE_PLUGINS,
                                                 ANSIBLE_CALLBACK_PLUGINS, ANSIBLE_CLICONF_PLUGINS, ANSIBLE_CONNECTION_PLUGINS,
                                                 ANSIBLE_DOC_FRAGMENT_PLUGINS, ANSIBLE_HTTPAPI_PLUGINS, ANSIBLE_INVENTORY_PLUGINS,
                                                 ANSIBLE_LIBRARY, ANSIBLE_LOOKUP_PLUGINS, ANSIBLE_MODULE_UTILS, ANSIBLE_NETCONF_PLUGINS,
                                                 ANSIBLE_ROLES_PATH, ANSIBLE_STRATEGY_PLUGINS, ANSIBLE_TERMINAL_PLUGINS,
                                                 ANSIBLE_TEST_PLUGINS, ANSIBLE_VARS_PLUGINS]]}
