        refusal: RH-ENTRY-DECLARATION-MISSING
        message: 'the transfer declaration named by entry_generation.declaration_rel is absent, carries no generation node, or a generation input the resolver projects from is absent'   # OD-19 draft (r2 open-decisions :141), widened; review
      # F05-S2 (proposals/f05-s2/spec.yml P5; codex stage_two_corrections + OD-F05-01/05/09/11): the entry-generation
      # view, published ONLY while `when` is active; active + any input absent refuses with that contract's refusal
