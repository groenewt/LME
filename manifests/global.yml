    # DETECTION words of the admitted ansible-core: what the core treats as a possible template (source below,
    # is_possibly_template: the value starts with the override header, or contains a block, variable or comment start
    # string, _contains_start_string). These are detection words, not renderer settings (the s28 render words configure
    # a renderer and are loaded only with the remote-harness profile). Placed beside profile_identity under
    # remote_harness_schema because its one consumer is the capture binding (resolve.yml E12-04 requires the captured
    # global to carry none of them) and profile_identity / document_channel are exact-key nodes in L8. Each word is
    # declared as its list of single characters (split-character form), so this declaration itself carries no start
    # string and no override header and never trips detection when the global is loaded; a consumer decodes a word by
