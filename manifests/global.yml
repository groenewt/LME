        omitted: Preserve existing resolved enable flags and existing loader rendered roster; do not synthesize telemetry selections.
        selected: Every selected required source, signal, sink, case and service family remains required when its implementation is missing.
        database_profiles: Both declared database profiles remain in campaign scope; no fallback between them.
        telemetry_profiles: All three declared telemetry profiles remain in campaign scope.
        historical: Removed destinations remain in outstanding obligations until verified completion.
        matrix_axes: Inventory names, placement, source rosters, sinks and route values are inputs, never executable constants.
      atoms:
        'true': true
        'false': false
        absent: null
        empty_mapping: {}
        empty_sequence: []
        zero: 0
        statuses:
          available: declared
          missing: blocked
          unselected: declared_not_selected
        structural:
          schema_version: schema_version
          phase: phase
          node: node
          selectors: selectors
          services: services
          enable_flags: enable_flags
          resolved_projection_refs: resolved_projection_refs
          missing_producer_bindings: missing_producer_bindings
          required_family_bindings: required_family_bindings
          consumer_join: consumer_join
          id: id
          selected: selected
          source_record: source_record
          declared_values: declared_values
          field_references: field_references
          unprojected_fields: unprojected_fields
          runtime_owner: runtime_owner
          available: available
          value: value
          fact: fact
          path: path
          role: role
          required: required
          applicable: applicable
          applicability_reason: applicability_reason
          executed: executed
          status: status
          evidence: evidence
          descriptor: descriptor
          family: family
        applicability:
          missing: Missing required producer binding; no not-applicable inference is authorized.
          runtime_owner: Owner and runtime namespace admission are required for each selected container.
          family: Producer family-to-service relation is missing; campaign requirement remains open.
      render:
        template: resolved_roster.yml.j2
        macros: macros/resolved_roster.j2
        lookup: ansible.builtin.template
        sort_keys: false
        indent: 2
        width: 110
      diagnostics:
        input_missing: Required post-load roster fact is absent; resolve-only input cannot establish application roster.
        input_shape: Post-load roster facts disagree with declared types or contain unknown rendered service IDs.
        projection_shape: Projection does not conserve the complete composed service roster and selected subset.
        source_boundary: Projection fact differs from the exact bound post-load facts.
        service_shape: Service record identity or kind is absent or disagrees with its composed mapping key.
legacy_service_override_projection:
  elasticsearch:
    gate_source: node_name
    environment:
      - {key: 'node.name',                    source: node_name,            emit_when: present}
      - {key: 'network.publish_host',         source: publish_host,         emit_when: truthy_not_omit}
      - {key: 'discovery.seed_hosts',         source: seed_hosts,           emit_when: nonempty, normalize: list_join}
      - {key: 'cluster.initial_master_nodes', source: initial_master_nodes, emit_when: flag, flag_source: is_initial_master, normalize: list_join, default_when_absent: lme-elasticsearch}
