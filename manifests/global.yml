          root: controller.bootstrap.python
          checks:
            - {path: uv_added_files, records: {fields: {rel: rel_path, sha256: sha256_hex}}}
            - {path: uv_added_files, rel_disjoint: {field: rel, ref_pattern: rel_path, from: [uv_patched_rel], from_under: {base: installed_rel, paths: [interpreter_rel]}}}
        # GUEST LIFECYCLE POLICY (GRAPH-SHARED-CONTRACT, codex-tick304; RS proposal .scratchpad-14bbf94b/RS/
        # guest-policy-proposal.yml sha256 a51cc226 (supersedes 671e5ede), A1 shape + B1 cloud_init / lifecycle leaves; consumer testing/e2e/guest/guest.yml + tasks/{admit,
        # provision,verify,retire}.yml): remote_harness.guest is ONE section of the resolved policy (rh.guest), declared by
        # the profile, never read raw and never merged at runtime. Admitted when present (inert until the profile declares
        # it). EXACT key set (key_set): every leaf is typed here; `allocation` is the one optional member (a hypervisor
        # target scope's own override; absent on the controller scope). NOT keys of this section (one authority each):
        # hypervisor_group (the ONE declared group name is controller.bootstrap.inventory.role_groups.hypervisors,
        # required below while guest is declared), allocation_fields (the allocation key set is contract
        # guest_allocation), the RUNTIME lifecycle record's values (uuid, generation, endpoint, host keys: observations).
        # tools maps a lifecycle role to the NAME of a controller.bootstrap.os_tools entry required_by guest (path and
        # identity come from the one executable registry, per host).
        guest_lifecycle:
          root: guest
          when_present: guest
          checks:
            - {path: '', key_set: {required: [schema_version, modes, tools, kvm_device, proc_meminfo, proc_root, uuid_source,
                                              linger_dir, boot_timeout_s, endpoint_timeout_s, layout, lease, recovery,
                                              preserved_physical_prefixes, unit, qemu, cloud_init, record, refusals],
                                   optional: [allocation]}}
            - {path: schema_version, enum: [1]}
            - {at: controller.bootstrap.inventory.role_groups.hypervisors, pattern: var_name}
            - {path: modes, keys: [var, allowed]}
            - {path: modes.var, pattern: var_name}
            - {path: modes.var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: modes.allowed, enum: [[provision, verify, retire]]}
            # C1-GUEST-TOOL-ROLES (codex-tick328, MEDIUM): the EXACT logical role set the consumer uses (RS admit.yml asserts
            # the same set; RS proposal B1_registry.contract_delta_32d26c0d) -- a missing, empty or partial map refuses;
            # each role names a declared executable required_by guest (path / identity: the one registry, per host).
            # RS FINAL delta tick336: 11 roles, + env (fence: env --chdir=<epoch>/<live_dir> refuses to exec once the
            # epoch's live token is revoked) + flock (fence: the storage-root lock held through the whole command); both
            # name the EXISTING os_tools entries env / flock, whose required_by the route extends to [seed, guest]
            - {path: tools, keys: [cloud_localds, df, env, flock, mkdir, mv, qemu_img, qemu_system, systemctl, systemd_run, timeout]}
            - {path: tools, each: true, subject: scalar, within: [controller.bootstrap.os_tools], having: {field: required_by, contains: guest}}
            - {path: kvm_device, pattern: abs_path}
            - {path: proc_meminfo, pattern: abs_path}
            - {path: uuid_source, pattern: abs_path}
            - {path: linger_dir, pattern: abs_path}
            - {path: proc_root, pattern: abs_path}
