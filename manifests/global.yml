    # GRAPH-SHARED-CONTRACT (codex-tick304): reserved OUTPUT name FAMILIES, as contract_admission.patterns names. The
    # loader honours them wherever it honours reserved_outputs (not_in [reserved_outputs], declared target-input vars).
    # The route entry guard (refuse_pinned_outputs.yml) compares EXACT names only: a family's runtime -e/inventory
    # refusal stays its consumer's inline guard (RS guest.yml for the guest vars) until that guard reads this list.
    reserved_output_patterns: [reserved_guest_vars, reserved_obs_vars, reserved_transfer_vars, reserved_prereq_vars,
