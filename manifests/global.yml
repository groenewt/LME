      words: {modes: {ordinary: ordinary, leased: leased}, kinds: {implicit: implicit, host: host, group: group}, anchors: {checkout: checkout}, connections: [local, ansible.builtin.local], context_fields: [mode, kind, delegate, connection, owner, root, run, run_identity], lease_fields: [delegate, owner, root, run], identity: {field: run_identity, stat_fields: [dev, inode], separator: ':', observe_format: '%d:%i'}, capture_sub: capture, record_rel: context.yml, run_prefix: run., digest_algorithm: sha256, uid_observe: [id, -u], fs_observe: {argv: [stat, -f, -c, '%T %a %S %d'], fields: [fs_type, free_blocks, block_size, free_inodes], domains: {free_blocks: {min: 0}, block_size: {min: 1}, free_inodes: {min: 0}}}, stat_mode_digits: 3, admission: {dir_mode: '0700', file_mode: '0400', refused_fs_types: [tmpfs, ramfs], free_bytes_min: 100000000, free_inodes_min: 1000}, refusal: LME-INVOCATION-CONTEXT}
