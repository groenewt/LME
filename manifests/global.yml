    # C1-TYPED-OUTPUT-REVISION (codex 022716) defence in depth: the names the C1 LOADER publishes (resolve.yml /
    # load_manifests.yml set_fact / include_vars / register). reserved_outputs omits them, so a route entry guard
    # did not refuse e.g. -e lme_resolved; the loader's type-aware read-back guards + lme_verify_resolved refuse
    # such a pin. A consumer entry guard MAY additionally refuse these names, but ONLY at a host's FIRST entry
    # before any loader include in the run: set_facts persist per host across plays (site.yml / elasticsearch.yml
    # include the loader repeatedly), so a later play legitimately sees them -- there the loader read-backs are
    # the defence, not a `select('in', vars)` refusal. Kept SEPARATE from reserved_outputs (route-owned, exactly
    # 574 at the C1 join: 457 + 69 route R2 names, OD-17, + 48 route R2 r2d initial-contact names, C1-R2D-5). Every name is an OUTPUT: the loader asserts none is a declared config field; declared caller inputs
    # (lme_profile, lme_manifests_dir, lme_inputs, lme_global_override, lme_service_overrides,
    # lme_runtime_inventory, the bare registry field names) are deliberately NOT listed and stay usable.
    resolver_outputs: ["lme_resolved", "lme_resolved_origins", "lme_enable_flags", "lme_resolved_revision", "lme_remote_harness_overridden_paths", "lme_global", "lme_services", "lme_service_kinds", "lme_host_rendered_services", "_lme_resolution", "_lme_operator_selections", "_lme_rh_scope", "_lme_rh_documents", "_lme_rh_admission", "_lme_global_file", "_lme_profile_file", "_lme_declared_service_ids", "_lme_service_files", "_lme_profile_load", "lme_profile_loaded", "lme_global_loaded", "lme_source_binding", "lme_invocation_context", "lme_cluster_topology", "_lme_global_load", "_lme_pctx_delegate", "_lme_pctx_scan", "_lme_pctx_uid", "_lme_pctx_root", "_lme_pctx_root_st", "_lme_pctx_fs", "_lme_pctx_tmp", "_lme_pctx_run_st", "_lme_pctx_rec", "_lme_pcap_src_st", "_lme_pcap_copy", "_lme_pcap_cap_st", "lme_resolved_verification_source", "lme_resolved_configuration_record", "lme_resolved_configuration_record_text", "lme_resolved_configuration_record_sha256", "lme_resolved_configuration_artifact", "lme_roster_facts", "_lme_roster_projection", "_rr", "_rc", "_rr_sf", "_rr_pi", "_sb", "_af", "lme_roster_contract", "_roster_input_names", "_roster_fields"]
    # C1-PROFILE-IDENTITY-02 (codex 892 Q1-A, codex 894 bootstrap_order; Q4 ruling): the engine-published identity of
    # the global and profile bytes resolve.yml actually consumed. resolve.yml captures each member's exact bytes FIRST,
    # then loads the retained copies natively, binds each native load to its capture path and publishes var (profile)
    # and global_var (global) = exactly fields in order: path = the member's source file, sha256 = the digest_algorithm
    # digest of the consumed capture's exact bytes (digest_of: nothing stripped), capture_path = the file the native
    # load read. Any failure raises refusal. lme_profile_load_identity is retired. The scope edition profile_sha256 (the
    # rstripped lookup digest of the revision convention) is a different value and is never compared with it.
    profile_identity:
      var: lme_profile_loaded
      global_var: lme_global_loaded
      fields: [path, sha256, capture_path]
      digest_algorithm: sha256
      digest_of: exact_file_bytes
      encoding: utf-8
      refusal: LME-PROFILE-LOAD-IDENTITY
    # C1-RECIPE-PUB-02 (OW-H11-C1-01-PUB-02; codex-tick884 Q290_2 b, c; codex-tick886 Q_R2_PROV_02; SR-292-04): the
    # engine-published generation binding of every role and class. The loader publishes <to> beside policy_sha256 in the
    # section and in every scope entry (one scope = one class), outside the policy (a class key inside it would digest
    # itself), and lme_verify_resolved re-derives it. Per role: role; leg and recipe_sha256 as <projection> published
    # them; class_key = the serving scope's <value at class_key_from> section digest (PUB-01's class identity); lock_rel =
    # the role recipe's <value at lock_field_from>; lock_sha256 = the observed digest the protected source-admission record
    # (document_channel.admission) holds for lock_rel -- the admitted lock bytes, lock_algorithm equal to the channel
    # algorithm; bundle_provenance = applicability.applies exactly for the role at payload_role, else not_applicable.
    # Route captures verify against it; no receipt or bundle claim is a source.
    generation_binding:
      to: generation_bindings
      projection: resolved_recipe
      class_key_from: controller.bootstrap.bundle.per_class.key_field
      payload_role: controller.bootstrap.bundle.payload_role
      lock_field_from: controller.bootstrap.lock_capture.input_binding.field
      roles_from: controller.bootstrap.lock_capture.input_binding.roles
      lock_algorithm: controller.bootstrap.lock_capture.digest_algorithm
      fields: {role: role, leg: leg, recipe_sha256: recipe_sha256, class_key: class_key, lock_rel: lock_rel, lock_sha256: lock_sha256, bundle_provenance: bundle_provenance}
      # SR-300-09/10 HOLE-RT3-PROV-FIELD-MAP (SR-301): provenance_block names the record_schemas block the R3 provenance
      # attests; provenance_fields maps each of its keys to the fields role it carries. The values and not_attested
      # together are exactly the fields roles, disjoint. lock_rel is not attested by R3 (attesting it changes the
      # canonical r3 bytes: a new record epoch; OW-RT3-LOCK-REL); bundle_provenance is the applicability word the record
      # root carries. The block's role key enum equals the role list at roles_from (lme_source_binding refuses otherwise).
      provenance_block: provenance
      provenance_fields: {class_key: class_key, leg: leg, lock_sha256: lock_sha256, recipe_sha256: recipe_sha256, role: role}
      not_attested: [lock_rel, bundle_provenance]
      applicability: {applies: applies, not_applicable: not_applicable}
    # C1-SOURCE-BINDING-01 (codex 892 source_edition_join; answers HOLE-PUB2-ADMISSION-EDITION-TIE; SR-301-02): ONE
    # source-admission binding per resolve invocation, published as var beside, never inside, lme_resolved (outside
    # policy_sha256 and the revision payload: no self-reference; the source revision stays distinct from the
    # configuration revision). root = the manifests dir with its trailing manifests_rel removed; members = {<source path
    # relative to root>: <consumed capture sha256>} for the two published identities (profile_identity global_var and
    # var). The member key is the SOURCE path, never the capture path: a harness capture lives inside the leased run
    # directory and is never required below root. When lme_resolved carries policy_key, applicability is applies: every
    # member must equal the protected admission record's observed digest (document_channel.admission members / observed;
    # the channel digest_algorithm must be profile_identity.digest_algorithm), commit is the admission record value under
    # the field named at edition_from and must full-match the pattern at edition_regex_from, and expectations hold one row
    # per scope entry and role: scope {kind, id} (null for an unscoped section), class_key, role and binding_sha256 (the
    # digest of that generation binding). Otherwise applicability is not_applicable, the admission must be
    # admission_absent, commit is null and expectations are empty. lme_verify_source_binding re-derives it independently.
    source_binding:
      var: lme_source_binding
      fields: {applicability: applicability, root: root, commit: commit, members: members, expectations: expectations}
      expectation_fields: {scope: scope, class_key: class_key, role: role, binding_sha256: binding_sha256}
      manifests_rel: manifests
      edition_from: controller.bootstrap.source_admission.record_fields.edition
      edition_regex_from: controller.bootstrap.source_admission.git.edition_regex
      applicability: {applies: applies, not_applicable: not_applicable}
      admission_absent: null
      # C1-INVOCATION-CONTEXT-01 G13-04 (codex 896 DEV-L7-03 join; SR-302-05): lme_verify_resolved is the ONE complete
      # verification. requirement is the DECLARED applicability word (requirements its closed set), never inferred from the
      # presence of evidence: required = every complete call passes source_arg with exactly source_fields (role -> key),
      # carrying the published binding, the authoritative captures, the manifests dir and the record blocks, and the
      # complete verifier runs lme_verify_source_binding on the same resolved object and admission; a call without it
      # raises refusal, nothing downgrades to configuration-only verification. lme_verify_resolved_structure is the narrow
      # structural check and never claims completeness.
      verification:
        requirement: required
        requirements: [required]
        source_arg: source
        source_fields: {binding: binding, captures: captures, manifests_dir: manifests_dir, record_blocks: record_blocks}
      refusal: LME-SOURCE-BINDING
