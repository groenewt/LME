---
# manifests/global.yml -- cross-cutting deployment values for the whole LME stack.
#
# This is a DATA file: value literals live HERE (and in manifests/profiles/*,
# manifests/services/*). They are banned from the render templates
# (ansible/templates/units/*.j2) AND from the filter plugin
# (filter_plugins/lme_manifests.py) -- the engine holds only arithmetic +
# structure and reads every value/pattern/default from this tree. (Per
# operator-rulings lme-renderer-literals + generated_artifact_exemption:false;
# supersedes the earlier note that permitted literals in the filter plugin.)
#
# Load order (ansible/roles/podman/tasks/load_manifests.yml):
#   lme_global = global.yml
#              | combine(<active profile overlay>, recursive=True)
#              | combine(lme_global_override | default({}), recursive=True)
# i.e. profiles overlay the baseline, and an operator host_var override wins LAST.

lme_global:

  # --- userns / cert-owner derivation seeds -------------------------------
  # THE only place these numbers live. Every id-mapping base and every cert
  # owner uid is DERIVED from them by filter_plugins/lme_manifests.py:
  #   userns_base(svc) = subuid_base + slot(svc) * slot_size
  #   cert key owner   = userns_base(svc) + in_container_uid
  subuid_base: 165536
  # /etc/subuid & /etc/subgid range length for the rootless 'containers' user
  # (the outer range userns slots carve into); base setup_directories renders it.
  subuid_range: 65536
  slot_size: 3048
  # Logical service -> slot index. A service absent here has no pinned id-mapping
  # and resolves to subuid_base (the observed lme_backups owner, 165536).
  slots:
    elasticsearch: 0      # base 165536
    kibana: 1             # base 168584
    fleet-server: 2       # base 171632
    wazuh-manager: 3      # base 174680
    elastalert: 4         # base 177728

  # --- userns directive rendering (render_userns) -- FORMAT/PATTERN strings ----
  # The STRING patterns render_userns() emits. The numeric base/size are still
  # DERIVED from subuid_base/slot_size above; only the format templates and the
  # mode default live here (hoisted out of filter_plugins/lme_manifests.py per
  # operator-rulings finding lme-renderer-literals -- the engine keeps arithmetic,
  # values live in YAML). Format fields: {base},{size} (auto), {name} (share_ref).
  userns:
    default_mode: auto
    auto_format: 'auto:uidmapping=0:{base}:{size},gidmapping=0:{base}:{size}'
    unpinned_value: auto
    share_ref: 'container:lme-{name}'

  # --- systemd unit naming (svc_unit) -- FORMAT/PATTERN strings ----------------
  # The unit names quadlet generates for each logical service, as format strings
  # (field {name}). Hoisted out of the filter plugin (lme-renderer-literals): the
  # engine picks WHICH pattern by kind; the pattern text is a value and lives here.
  unit_naming:
    target: lme.service
    network: lme-network.service
    volume: 'lme-{name}-volume.service'
    service: 'lme-{name}.service'

  # --- podman network (renders lme.network) -------------------------------
  network:
    name: lme
    driver: bridge
    subnet: 10.89.4.0/24
    gateway: 10.89.4.1
    ipam_driver: host-local

  # --- images -------------------------------------------------------------
  # image_tag is the sentinel tag the build/load path retags every image to.
  # Units reference the `local` ref (localhost/<name>:LME_LATEST) which is stable
  # across online/offline installs; `pull` is the upstream source used at
  # build/prefetch time and is what profiles/offline.yml re-points. `group` gates
  # which services a given install renders (core | elastic_services | llm).
  # image_tag is a LITERAL tag string (there is no substitution step; the build
  # path retags every upstream image to localhost/<name>:LME_LATEST and the units
  # reference that verbatim). `pull` refs and versions are extracted from
  # config/containers.txt, config/containers-llm.txt and
  # config/containers-elastic-services.txt -- the current sources of truth.
  image_tag: LME_LATEST
  images:
    # Registry-pinned 0.161.0 multiarch index; runtime qualification is a separate gate.
    otel-collector: {local: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, pull: docker.io/otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1, group: telemetry}
    elasticsearch:  {local: localhost/elasticsearch:LME_LATEST,      pull: docker.elastic.co/elasticsearch/elasticsearch:8.18.8,     group: core}
    kibana:         {local: localhost/kibana:LME_LATEST,             pull: docker.elastic.co/kibana/kibana:8.18.8,                  group: core}
    elastic-agent:  {local: localhost/elastic-agent:LME_LATEST,      pull: docker.elastic.co/beats/elastic-agent:8.18.8,            group: core}
    distribution:   {local: localhost/distribution:LME_LATEST,       pull: docker.elastic.co/package-registry/distribution:lite-8.18.8, group: core}
    wazuh-manager:  {local: localhost/wazuh-manager:LME_LATEST,      pull: docker.io/wazuh/wazuh-manager:4.9.1,                     group: core}
    elastalert2:    {local: localhost/elastalert2:LME_LATEST,        pull: docker.io/jertel/elastalert2:2.20.0,                     group: core}
    logstash:       {local: localhost/logstash:LME_LATEST,           pull: docker.elastic.co/logstash/logstash:8.18.8,              group: elastic_services}
    filebeat:       {local: localhost/filebeat:LME_LATEST,           pull: docker.elastic.co/beats/filebeat:8.18.8,                 group: elastic_services}
    metricbeat:     {local: localhost/metricbeat:LME_LATEST,         pull: docker.elastic.co/beats/metricbeat:8.18.8,               group: elastic_services}
    heartbeat:      {local: localhost/heartbeat:LME_LATEST,          pull: docker.elastic.co/beats/heartbeat:8.18.8,                group: elastic_services}
    apm-server:     {local: localhost/apm-server:LME_LATEST,         pull: docker.elastic.co/apm/apm-server:8.18.8,                 group: elastic_services}
    # llama-cpp: dot->dash rename is intentional (llama.cpp -> llama-cpp); the
    # same image backs lme-embeddings. pgvector is pg17. litellm is main-latest.
    pgvector:       {local: localhost/pgvector:LME_LATEST,           pull: docker.io/pgvector/pgvector:pg17,                        group: llm}
    llama-cpp:      {local: localhost/llama-cpp:LME_LATEST,          pull: ghcr.io/ggml-org/llama.cpp:server,                       group: llm}
    litellm:        {local: localhost/litellm:LME_LATEST,            pull: ghcr.io/berriai/litellm:main-latest,                     group: llm}
    # Built locally from a Dockerfile (no upstream pull source).
    lme-log-analyzer: {local: localhost/lme-log-analyzer:LME_LATEST, build: lme-log-analyzer/Dockerfile, group: llm}
    lme-dashboard:  {local: localhost/lme-dashboard:LME_LATEST,      build: lme-dashboard/Dockerfile,    group: llm}

  # --- cert tree (B4) -----------------------------------------------------
  certs:
    volume: lme_certs               # private workspace volume (setup-certs generates here)
    host_tree: /opt/lme/certs       # per-service published bundles live under here
    ca_public_rel: ca/ca.crt        # the ONLY CA material that leaves the workspace
    default_in_container_uid: 0

  # --- filesystem paths ---------------------------------------------------
  paths:
    opt: /opt/lme
    config: /opt/lme/config
    env_file: /opt/lme/lme-environment.env
    vault_pass: /etc/lme/pass.sh
    models: /opt/lme/llama-models

  # --- container storage (overridable via podman -g / install.sh -g) ------
  storage:
    graphroot: /var/lib/containers/storage
    runroot: /run/containers/storage

  # --- co-residency memory budget (SF-8) ----------------------------------
  # Aggregate ceiling for a single-node install. The `memory_budget` filter
  # (filter_plugins/lme_manifests.py) sums the MemoryMax of every ENABLED
  # container service that declares a resources cap -- JVM heap-derived
  # (elasticsearch: heap 4g -> 8G max) OR a direct memory_max (the non-JVM caps
  # added under SF-8) -- and compares the total against usable = host_ram_gb -
  # reserve_gb. Services with no cap (e.g. fleet-server, logstash, the beats) are
  # EXCLUDED from the sum and surfaced separately, so the number is a floor, not
  # the whole footprint. over_budget means OVER-COMMITTED (ceilings exceed usable
  # RAM) -- MemoryMax is a per-service KILL CEILING, not a reservation, so this is
  # ADVISORY: the preflight (container_setup.yml SF-8) WARNS on it, never blocks
  # (the default+llm stack over-commits yet ran end-to-end on a 14G host). The hard
  # gate is the `oversized` list -- any single service whose own MemoryMax exceeds
  # usable RAM (a deterministic OOM-kill) fails the install. Overridable per profile
  # / host_var (e.g. a 32G node raises host_ram_gb).
  budget:
    host_ram_gb: 16       # target single-node host RAM
    reserve_gb: 2         # kept free for the OS + podman/systemd overhead

  # --- canonical published ports (host<->container), per profile-overridable.
  # DEFAULT NETWORK POSTURE = CLOSED (exposure-binds fix): EVERY host-published
  # port binds to 127.0.0.1 by default, so nothing is reachable off-box on a fresh
  # install. render_port() (filter_plugins/lme_manifests.py) only emits 0.0.0.0
  # when a port carries NO bind -- so a bind:127.0.0.1 here is the loopback wall.
  # LAN exposure is an EXPLICIT profile opt-in: a profile that must reach a service
  # off-box re-declares that service's publish_ports with bind:0.0.0.0 on the
  # specific entry (combine(recursive=True) REPLACES the list, so the full list is
  # given). "Open" is always a PRESENT bind:0.0.0.0, never an absent bind (see
  # cluster.yml, which opens ONLY the ES transport port). Services publishing
  # nothing are omitted.
  ports:
    elasticsearch_http:  {host: 9200, container: 9200, bind: 127.0.0.1}
    elasticsearch_transport: {host: 9300, container: 9300, bind: 127.0.0.1}   # cluster only (cluster.yml opens it)
    kibana:              {host: 5601, container: 5601, bind: 127.0.0.1}
    kibana_https:        {host: 443,  container: 5601, bind: 127.0.0.1}
    fleet_server:        {host: 8220, container: 8220, bind: 127.0.0.1}
    fleet_distribution:  {host: 8080, container: 8080, bind: 127.0.0.1}
    wazuh_registration:  {host: 1514, container: 1514, bind: 127.0.0.1}
    wazuh_enrollment:    {host: 1515, container: 1515, bind: 127.0.0.1}
    wazuh_syslog:        {host: 514,  container: 514, protocol: udp, bind: 127.0.0.1}
    wazuh_api:           {host: 55000, container: 55000, bind: 127.0.0.1}
    apm_server:          {host: 8200, container: 8200, bind: 127.0.0.1}
    pgvector:            {host: 5432, container: 5432, bind: 127.0.0.1}
    embeddings:          {host: 8081, container: 8081, bind: 127.0.0.1}
    litellm:             {host: 4000, container: 4000, bind: 127.0.0.1}
    log_analyzer:        {host: 8501, container: 8501, bind: 127.0.0.1}
    dashboard:           {host: 8502, container: 8502, bind: 127.0.0.1}
    logstash_beats:      {host: 5044, container: 5044, bind: 127.0.0.1}
    logstash_http:       {host: 8085, container: 8085, bind: 127.0.0.1}

  # --- shared material catalog (typed obligation payload DEFINITIONS) ----------
  # codex-manager-material-and-membership-contract-decisions-20260923-0430 decision 1;
  # C convergence (ack 0429); D b87f313 record_shape. THE canonical home for material
  # payload DEFINITIONS that per-service `material_requirements` obligations
  # (manifests/services/<svc>.yml) reference by id. C1 OWNS this shared file; C/D/E
  # contribute reviewed definitions for their services (one writer, no competing edits).
  #
  # A definition declares the payload SEMANTICS ONLY (kind + validity), NEVER a
  # placement: placement_class / destination / owner_role / mode / consumer live on the
  # per-service obligation that REFERENCES this definition. So two guardian.pub
  # placements are TWO obligations (a secrets-dir one and a proxy config-dir one) that
  # reference the ONE `guardian_public_key` definition here; a shared reference NEVER
  # authorizes distributing private material -- `kind` distinguishes public_key from
  # private_key. `payload_validity` is the declared rule a producer / recovery preflight
  # validates the ACTUAL bytes against (C's RESTORE-EMPTY-SECRET-PREFLIGHT class:
  # decryptable-but-malformed => FAIL before replacing).
  material_catalog:
    guardian_public_key:
      kind: public_key
      payload_validity: non_empty_pem_public_key
      description: >-
        The fencing guardian's PUBLIC signing key (F1). Published (never the private
        key) to each fenced proxy's config dir, and separately referenced where trust
        is pinned. The private key is NOT a catalog-distributable material.
    # --- fix_3 TLS material definitions (the ES/Kibana/Fleet TLS surface; grounded from
    #     ansible/roles/certs at b8095d0, per claude-C-TLS-catalog-...-1332 +
    #     corrections-addendum-1338). Payload SEMANTICS ONLY (kind + payload_validity);
    #     placement lives on the per-service obligation (certs) / the leaf_key_provision
    #     entry (keys). Certificates are DISTRIBUTABLE; the *_key defs are kind
    #     private_key -> NON-distributable, so NO material_requirements obligation may
    #     material_ref them (fail-closed by construction). Their delivery is declared in
    #     lme_global.material_provision.leaf_key_provision (ca_key: material_provision.
    #     ca_key_rule), NEVER as an obligation. This fold catalogues ONLY the three-service
    #     TLS surface; per-backend CA aliases, the LLM pack leaves and beats CA-only
    #     consumers are OUT of scope (see material_provision.open_scope).
    ca_cert:
      kind: certificate
      payload_validity: non_empty_pem_certificate
      description: >-
        Shared PUBLIC CA trust anchor (ca/ca.crt). Every server obligation's trust_ref
        resolves to this bare name. NEVER the CA private key -- ca_key is a separate
        non-distributable private_key def governed by material_provision.ca_key_rule.
    elasticsearch_cert:
      kind: certificate
      payload_validity: non_empty_pem_certificate
      description: >-
        ES TRANSPORT leaf (xpack.security.transport.ssl.certificate),
        elasticsearch/elasticsearch.crt. ONE shared leaf whose SANs cover every es_hosts
        entry (instances.yml.j2 mints one 'elasticsearch' entry, not one leaf per node).
    elasticsearch_chain:
      kind: certificate
      payload_validity: non_empty_pem_certificate_chain_to_ca
      description: >-
        ES HTTP leaf-first chain (xpack.security.http.ssl.certificate),
        elasticsearch/elasticsearch.chain.pem. SPLIT from elasticsearch_cert on codex/
        advisor guidance: a leaf-first chain has a DIFFERENT (chain-to-ca) validity than a
        single transport leaf. NB non_empty_pem_certificate_chain_to_ca REFERENCES ca_cert
        (a richer rule) -- it is an UNENFORCED name today (payload_validity rule registry
        is OPEN debt, see material_provision.open_scope.payload_validity_rule_registry).
    kibana_cert:
      kind: certificate
      payload_validity: non_empty_pem_certificate
      description: Kibana SERVER_SSL_CERTIFICATE leaf (kibana/kibana.crt).
    fleet_server_cert:
      kind: certificate
      payload_validity: non_empty_pem_certificate
      description: Fleet FLEET_SERVER_CERT leaf (fleet-server/fleet-server.crt).
    ca_key:
      kind: private_key
      payload_validity: non_empty_pem_private_key
      description: >-
        CA signing key (ca/ca.key). NON-distributable. Governed by
        material_provision.ca_key_rule (non-publication + the 0:0/0600 workspace carve-out);
        it is NOT a leaf provision entry, and its rule does NOT constrain leaf-key delivery.
    elasticsearch_key:
      kind: private_key
      payload_validity: non_empty_pem_private_key
      description: >-
        ES leaf private key (elasticsearch/elasticsearch.key). NON-distributable; delivered
        via material_provision.leaf_key_provision.elasticsearch_key (certs_workspace).
    kibana_key:
      kind: private_key
      payload_validity: non_empty_pem_private_key
      description: >-
        Kibana leaf private key (kibana/kibana.key). NON-distributable; delivered via
        material_provision.leaf_key_provision.kibana_key (TWO-HOP: workspace residual + bundle).
    fleet_server_key:
      kind: private_key
      payload_validity: non_empty_pem_private_key
      description: >-
        Fleet leaf private key (fleet-server/fleet-server.key). NON-distributable; delivered
        via material_provision.leaf_key_provision.fleet_server_key (TWO-HOP: workspace residual + bundle).
    # EXTENSION CONTRACT (reviewed here; sole writer C1): C adds certificate /
    # private_key(host-local, non-distributable) / password_file / json / conf payload
    # definitions for credential material; D adds DB replicator/etcd cert + pgpass
    # definitions; E adds telemetry/app material definitions. Each is a payload
    # definition ONLY -- the per-service obligation carries the placement.

  # --- material_catalog schema (C1-MATERIAL-CATALOG-DEFINITION-VALIDATION) -------
  # The DECLARED shape every material_catalog definition is validated against by
  # lme_manifests.py::lme_validate_material_catalog. A null/empty definition, an
  # unknown/absent kind or an absent payload_validity now FAIL (previously a bare
  # catalog membership passed). `distributable_kinds` is the closure that makes a
  # catalog NAME alone insufficient to authorize private-material distribution: an
  # obligation may only reference a definition whose kind is distributable, so
  # flipping guardian_public_key.kind to private_key makes every obligation that
  # references it FAIL (the private key is host-local, never a catalog-distributed
  # obligation payload). Value-pure: the vocab/closure is read from HERE.
  material_catalog_schema:
    definition:
      kind:             {type: str, required: true,  vocab: [public_key, private_key, certificate, password_file, json, conf, pgpass, dsn]}
      payload_validity: {type: str, required: true}
      description:      {type: str, required: false}
    # Kinds an obligation MAY reference (material distributed to a consumer). A kind
    # NOT listed here (e.g. private_key) is host-local / non-distributable.
    distributable_kinds: [public_key, certificate, password_file, json, conf, pgpass, dsn]

  # --- fix_3 producer registry (producer_ref targets) --------------------------
  # The CANONICAL producers of catalog materials. A material_requirements obligation's
  # producer_ref, and a leaf_key_provision entry's producer, resolve to a BARE name here
  # (reference_closure armed by lme_validate_material_registries on the loader path). This
  # lands the registry codex-1300 flagged as owed; content grounded from ansible/roles/certs
  # (claude-C-TLS-...-1332 section 2), host_scope vocab aligned to C's 1410 schema. Authored
  # ONLY here (C1 sole writer of lme_global); an override must not add/relabel a producer (A2
  # file-equality gate in load_manifests.yml).
  producer_registry:
    certs_role:
      id: certs_role
      implementation: ansible/roles/certs (lme-setup-certs oneshot -> config/setup/init-setup.sh)
      host_scope: source_host               # runs ONCE on the cert SOURCE host (first ES-group host; degenerate self on single-node)
      produces_materials:                   # each MUST resolve to a material_catalog def (closure)
        - ca_cert
        - ca_key
        - elasticsearch_cert
        - elasticsearch_chain
        - elasticsearch_key
        - kibana_cert
        - kibana_key
        - fleet_server_cert
        - fleet_server_key
      reference_form: bare_name

  # --- fix_3 custody registry (custody_ref / delivery-channel targets) ----------
  # The TWO delivery channels, with the desired/observed/drift split adopted from C's 1410
  # schema. DESIRED custody scope is consumer_host; TODAY's all-host replication + controller
  # transit is recorded as observed_host_scope: every_host + drift: true -- RECORDED, never
  # blessed as the target (codex: do not make current all-host replication the desired scope).
  # The schema's desired_host_scope_vocab OMITS every_host, so an all-host DESIRED scope is
  # rejected by construction for the channel too (not only the leaf). transits_controller
  # records the 1338 controller-slurp of ALL leaf keys + ca_key. Content grounded from certs
  # main.yml (1332 section 3 + 1338 corr 2). Cert PLACEMENTS stay OFF this registry -- placement
  # lives on the per-service obligation (schema contract); only the non-distributable KEY
  # provision lives in material_provision.leaf_key_provision below.
  custody_registry:
    certs_workspace:
      id: certs_workspace
      backing: podman_volume:lme_certs      # the minted-cert WORKSPACE
      consumers: [elasticsearch]            # ES mounts the workspace directly (TLS terminator + generator context)
      desired_host_scope: consumer_host     # ES is the only workspace consumer
      observed_host_scope: every_host       # whole-workspace tarball to EVERY play host (no run_once/host filter)
      transits_controller: true             # slurped through the controller (ALL leaf keys + ca.key), 1338 corr 2
      drift: true                           # observed != desired -> RECORDED nonconformance, not endorsed
      non_publication: [ca_key]             # ca.key present (0:0/0600 carve-out) but NEVER published / service-readable
      modes:
        leaf_key:  '0640'
        leaf_cert: '0644'
        ca_cert:   '0644'
        ca_key:    '0600'                    # 0:0 userns-root, CA-MITM carve-out
      reference_form: bare_name
    certs_bundle_publish:
      id: certs_bundle_publish
      backing: host_tree_bundle             # <certs.host_tree>/<svc>, mounted cert:<svc> ro
      consumers: [kibana, fleet-server]     # + CA-only consumers (beats) receive ca/ca.crt only (out of this fold)
      desired_host_scope: consumer_host
      observed_host_scope: every_host       # B4 publish loops all enabled bundles on EVERY host
      transits_controller: true             # bundle copied from the controller-slurped workspace
      drift: true
      non_publication: [ca_key]             # certs main.yml find -name ca.key -delete belt-and-suspenders; ca.crt only published
      modes:
        leaf_key:  '0640'
        leaf_cert: '0644'
        ca_cert:   '0644'
      reference_form: bare_name

  # --- fix_3 material provision (private-key delivery + CA-key rule) ------------
  # private_key is NON-distributable, so a leaf key CANNOT be a material_requirements
  # obligation. option_a (C recommendation, my 1347 choice): each leaf key is a declared
  # PROVISION entry -- producer + delivery channels + placement/owner/mode + consumer +
  # host_scope + lifecycle. The two-hop delivery (1338 corr 2) is DATA here (channels list),
  # not prose. ca_key is a SEPARATE rule (non-publication + carve-out), never a provision
  # entry, and does NOT constrain leaf delivery (codex private_key_correction).
  # lme_validate_material_registries CONSUMES this on the loader path (machine-validated, not
  # a descriptive registry): material -> a private_key catalog def; producer -> producer_
  # registry; every channel -> custody_registry; host_scope != every_host; mode octal.
  material_provision:
    leaf_key_provision:
      elasticsearch_key:
        material: elasticsearch_key
        producer: certs_role                    # MEMBERSHIP: elasticsearch_key is in certs_role.produces_materials
        delivery_mode: central_mint_delivery   # NOT local_generation for any of the three this deployment
        channels: [certs_workspace]            # SINGLE-HOP: ES mounts the workspace directly
        custody_hops:                          # TYPED ORDERED hops + residual locations (order == channels order)
          - {channel: certs_workspace, order: 1, residual_copy: true, host_scope: every_host, transits_controller: true}
        terminal_channel: certs_workspace      # DECLARED terminal (consumer must be a certs_workspace consumer)
        consumer: elasticsearch
        host_scope: consumer_host
        placement: /usr/share/elasticsearch/config/certs/elasticsearch/elasticsearch.key
        owner_role: elasticsearch              # workspace uid -> host subuid
        mode: '0640'
        lifecycle: bootstrap
      kibana_key:
        material: kibana_key
        producer: certs_role                    # MEMBERSHIP: kibana_key is in certs_role.produces_materials
        delivery_mode: central_mint_delivery
        channels: [certs_workspace, certs_bundle_publish]   # TWO-HOP (1338 corr 2): workspace residual + published bundle
        custody_hops:
          - {channel: certs_workspace,      order: 1, residual_copy: true, host_scope: every_host, transits_controller: true}
          - {channel: certs_bundle_publish, order: 2, residual_copy: true, host_scope: every_host, transits_controller: true}
        terminal_channel: certs_bundle_publish  # kibana is a certs_bundle_publish consumer
        consumer: kibana
        host_scope: consumer_host
        placement: /usr/share/kibana/config/certs/kibana/kibana.key
        owner_role: 'cert_owner:kibana'        # manifest-DERIVED host subuid (no uid literal; derivation in lme_manifests.py cert_owner)
        mode: '0640'
        lifecycle: bootstrap
      fleet_server_key:
        material: fleet_server_key
        producer: certs_role                    # MEMBERSHIP: fleet_server_key is in certs_role.produces_materials
        delivery_mode: central_mint_delivery
        channels: [certs_workspace, certs_bundle_publish]   # TWO-HOP
        custody_hops:
          - {channel: certs_workspace,      order: 1, residual_copy: true, host_scope: every_host, transits_controller: true}
          - {channel: certs_bundle_publish, order: 2, residual_copy: true, host_scope: every_host, transits_controller: true}
        terminal_channel: certs_bundle_publish  # fleet-server is a certs_bundle_publish consumer
        consumer: fleet-server
        host_scope: consumer_host
        placement: /certs/fleet-server/fleet-server.key
        owner_role: 'cert_owner:fleet-server'
        mode: '0640'
        lifecycle: bootstrap
    ca_key_rule:
      material: ca_key
      non_publication: true                  # never in a published bundle; never delivered to a bundle consumer
      distributable: false
      carve_out:
        where: workspace_mounted             # elasticsearch, setup-certs mount lme_certs
        owner: '0:0'                         # userns-root
        mode: '0600'                         # no service uid can read it (CA-MITM ownership+mode fix, NOT distribution)
      observed_host_scope: every_host        # whole-workspace tarball replicates ca.key (0:0/0600) to every play host
      transits_controller: true              # + transits the controller via slurp (1338 corr 2)
      conformance: open_nonconformance
    # ENFORCED by lme_validate_material_registries on the loader A2 gate (fix_3 v5): non-
    # publication by REFERENCED MATERIAL IDENTITY (a renamed leaf referencing ca_key is
    # rejected, not only a leaf keyed ca_key); producer MEMBERSHIP (a leaf's producer must
    # actually produce the material it delivers); map-key/record-id coherence (producer /
    # custody key == its id field); typed ORDERED custody_hops with per-hop residual_copy +
    # host_scope; consumer / terminal-channel coherence (a leaf consumer must consume its
    # terminal channel); and the PRODUCER PARTITION (every produced private key is classified
    # exactly once -- a leaf delivery or non_publication, never both, never neither).
    #
    # STILL OPEN (split by owner; each remains a required obligation, not resolved here):
    open_scope:
      consumer_host_delivery_scoping: 'DESIRED = consumer_host; OBSERVED = every_host + drift:true (both channels), now carried per hop as residual_copy + host_scope. Live target-scoped DELIVERY (making observed == desired) is C-owned + OPEN.'
      residual_controller_copies: 'The typed custody_hops now DECLARE that every leaf key transits the controller and leaves a residual copy at every_host; the CA key carries the same via ca_key_rule. Making the live pipeline STOP leaving those residuals is C-owned + OPEN.'
      live_republish_atomicity: 'certs main.yml re-run can empty a running bundle consumer /certs until restart. C-owned + OPEN.'
      payload_validity_rule_registry: 'C-owned. payload_validity names (incl non_empty_pem_certificate_chain_to_ca, which references ca_cert) are declared but NOT byte-enforced -- no rule registry resolves them to a structural check. Content owed by C (payload_validity_rules + ed25519_spki_public_key + a lme_validate_material_catalog resolution change); the guardian/envelope material definitions live in the same C lane.'
      obligation_custody_mode_cross_check: 'CLOSED in v6.2: the declared kind->mode-key map (material_provision_schema.custody_mode_key_kinds) classifies every custody mode key, rejects unknown/aliased keys, ceilings every non-distributable class and requires each leaf-key channel to declare a mode for the key kind. STILL OPEN (C1 lane): equality of a per-service OBLIGATION or leaf-provision mode with its channel per-kind mode (e.g. an ES cert obligation 0644 vs the channel leaf_cert mode) is not enforced; per-service obligations are not yet wired (see per_service_obligations_unwired).'
      guardian_registry_closure: 'C-owned. guardian_signer_producer / guardian_custody producer+custody ids and the guardian_private_key catalog def are NOT declared here -- the FIRST service that declares a guardian obligation FAILS CLOSED until C lands them. Guardian/envelope lane.'
      per_service_obligations_unwired: 'E / manifest-owner-owned. The 3 per-service cert obligations are NOT authored onto lme-{elasticsearch,kibana,fleet-server}.yml (would also require declaring their env-password material). loader_wired stays FALSE; arming is the coordinated material_requirements migration wave.'
      tailscale_and_other_profiles: 'OPEN + required. Tailscale Serve certificate/profile behavior, independent file-certificate, self-signed/internal-trust profiles and wider inventory/profile lifecycle are not modelled here (separate profiles).'
      out_of_scope_materials: 'per-backend CA aliases (elasticsearch-ca.crt/litellm-ca.crt/embeddings-ca.crt), LLM-pack (litellm/embeddings) leaves and beats CA-only consumers are not catalogued yet (additive catalog defs, later wave).'

  # --- fix_3 material provision schema (validates the three blocks above) -------
  # The DECLARED shape lme_validate_material_registries enforces value-purely (vocab/closure
  # read from HERE, never hardcoded in the filter). desired/observed/drift split + host_scope
  # tokens adopted from C's 1410 schema. Part of the material security boundary: the A2 loader
  # gate asserts producer_registry / custody_registry / material_provision /
  # material_provision_schema each equal the declared file value (no override may rebind custody).
  material_provision_schema:
    producer_record:
      required: [id, implementation, host_scope, produces_materials, reference_form]
      host_scope_vocab: [source_host, signer_host, controller, every_host]
      reference_form_vocab: [bare_name]
      id_pattern: '\A[a-z][a-z0-9_-]*\Z'
    custody_record:
      required: [id, backing, consumers, desired_host_scope, observed_host_scope, drift, modes, reference_form]
      # every_host DELIBERATELY absent from DESIRED -> an all-host desired custody scope is rejected for the channel itself.
      desired_host_scope_vocab: [consumer_host, signer_host, controller_transit, source_host]
      observed_host_scope_vocab: [consumer_host, signer_host, controller_transit, source_host, every_host]
      reference_form_vocab: [bare_name]
    leaf_key_provision_record:
      required: [material, producer, delivery_mode, channels, custody_hops, terminal_channel, consumer, host_scope, placement, owner_role, mode, lifecycle]
      delivery_mode_vocab: [central_mint_delivery, local_generation]
      lifecycle_vocab: [bootstrap, rotate, adopt, static]
      host_scope_vocab: [consumer_host, source_host]      # NOTE: every_host DELIBERATELY absent -- a private_key provision must not declare an all-host DESIRED scope
    # TYPED ORDERED custody hop (fix_3 v5, codex still_required typed custody hops + residual
    # locations). Each hop records WHICH channel, its ORDER, whether a residual_copy persists,
    # WHERE it lands (host_scope), and whether it transits_controller -- a per-hop typed model,
    # not a single opaque boolean. observed host_scope vocab (every_host is a real residual).
    custody_hop_record:
      required: [channel, order, residual_copy, host_scope, transits_controller]
      host_scope_vocab: [consumer_host, signer_host, controller_transit, source_host, every_host]
    ca_key_rule_record:
      required: [material, non_publication, distributable, carve_out, observed_host_scope, conformance]
      carve_out_required: [where, owner, mode]
      # The CA private key MUST stay userns-root 0:0 (the CA-MITM ownership fix). Declared here in
      # the material_provision_schema, which the loader sources from _lme_global_file (byte-bound to
      # this on-disk manifest by resolve.yml), so an override cannot reach it to both re-own the key
      # and relax the rule -- policy authority is the declared source, not an equality gate (v6.1).
      carve_out_owner: '0:0'
      observed_host_scope_vocab: [consumer_host, signer_host, controller_transit, source_host, every_host]
      conformance_vocab: [conformant, open_nonconformance]
    # Complete anchored octal mode -- \A...\Z rejects "0644\n" / " 0644".
    mode_pattern: '\A[0-7]{3,4}\Z'
    # RESTRICTIVENESS CEILING for every delivered private-key leaf mode + the CA carve-out mode
    # (C1-COMPOSED-MATERIAL-DECLARATIONS-REJECTED, codex-1625). The octal permission bits a
    # private key mode may NEVER grant: 0027 = group-write (020) + all world/other bits (007).
    # 0640 (owner rw, group r) and 0600 pass; 0644 (world-read) and 0660 (group-write) are
    # REJECTED. This is the absolute invariant that lets an override recompose placement/owner/
    # consumer while it can never widen a private key -- it replaces the removed whole-registry
    # equality gate for the one security field (mode) that is a free-form string, not a bool.
    leaf_mode_forbidden_mask: '0027'
    # CUSTODY MODE-KEY KIND CLOSURE (fix_3 v6.2, codex-1812 C1-CUSTODY-MODE-KIND-CLOSURE). Every
    # custody_registry.*.modes KEY must be classified here to a material_catalog KIND; the
    # restrictiveness ceiling above applies to a custody mode by its DECLARED class (a
    # non-distributable class is ceilinged). An unclassified / unknown / aliased mode key is
    # REJECTED, a key that also names a catalog id must carry that material's own kind, and every
    # channel a leaf key travels through must declare a mode for the key's kind. This is POLICY:
    # it lives in the schema, admitted only from this declared source (the loader refuses a
    # material schema supplied through the override or profile channel), so composed data cannot
    # reclassify a private-key mode key as a certificate to escape the ceiling.
    custody_mode_key_kinds:
      leaf_key:  private_key
      leaf_cert: certificate
      ca_cert:   certificate
      ca_key:    private_key

# =============================================================================
# lme_config_registry -- the DECLARED SCHEMA for every operator/profile-managed
# config field (C1 shared contract; codex-manager-caller-contract-decisions-
# 20260923-0200 + registry-and-consumer-decisions-20260923-0145).
#
# This is the SINGLE source of truth for: which config keys exist, their type,
# whether they are required or optional, their declared default (tier 5), whether
# they carry a schema-permitted upgrade-preservation fallback (tier 4), and which
# keys are enable-flags (members of lme_enable_flags that is_enabled() consults).
#
# The canonical resolver (filter_plugins/lme_manifests.py::lme_resolve_config,
# called from load_manifests.yml) composes each field by DECLARED PRECEDENCE,
# highest wins:
#   1. explicit extra-vars                    (operator -e)                 origin: extra_var
#   2. explicit inventory / host_var          (operator inventory)          origin: inventory
#   3. explicitly-selected profile overlay    (profile_overlay.vars.<k>)    origin: profile
#   4. declared upgrade-preservation fallback (only where upgrade_fallback:  origin: observation
#      true, and ONLY backed by a verified read-only observation supplied by
#      the caller; NEVER a bare default dressed as observed state)
#   5. declared default                       (this file, `default:`)       origin: default
#
# Rules the resolver enforces (Codex preservation_rules):
#   * A profile that omits a field leaves its permitted preservation fallback /
#     default available (it does NOT force a value).
#   * An auto-INFERRED profile is not an explicit operator profile choice; the
#     caller passes profile origin so an inferred profile never masquerades as -e.
#   * Explicit false / 0 / null / empty keep their declared semantics -- they are
#     real selections and are NOT overwritten by detection because they look falsey.
#   * A REQUIRED field with no value from any tier FAILS validation before any
#     mutation. An OPTIONAL field with no value is ABSENT from lme_resolved
#     (not defaulted to a fabricated value) -- e.g. tailscale_require_vip_live.
#   * NO snapshot-once: every resolution re-reads the current declared inputs +
#     current permitted observations. Outputs live under lme_resolved.* /
#     lme_enable_flags (never re-read as input), so re-evaluation is self-capture-free.
#
# Adding a field or a profile var is a YAML change HERE (+ the profile), never a
# new code roster: load_manifests.yml asserts every profile_overlay.vars key is
# declared here, and is_enabled() treats any enable token not present in the
# resolved flag set as a typo.
#
# type: bool|str.  required: true|false.  nullable: true|false.
# default: <tier-5 value> (OMITTED for a truly-optional field -> absent when unset).
# enable_flag: true  -> member of lme_enable_flags (is_enabled consults it).
# upgrade_fallback: true -> tier-4 observation-backed fallback is permitted for
#   this field (install_elastic_services <- installed-pack-quadlet detection;
#   offline_mode <- offline-marker detection). install_llm's compat `true` is a
#   DECLARED DEFAULT (tier 5), NOT observed state, so its upgrade_fallback is false.
lme_config_registry:
  schema_version: 1
  # Precedence tiers, high -> low, ENFORCED by lme_resolve_config: it ITERATES this
  # list, so reordering it changes resolution (C1-DECLARED-PRECEDENCE / A2). Each
  # tier's SOURCE is declared in `channels` below, so the declaration is the sole
  # authority -- there is no hardcoded tier->source map in the engine.
  precedence: [extra_var, inventory, profile, observation, default]
  channels:
    # extra_var + inventory are the OPERATOR tier: native Ansible precedence has
    # already selected the winning explicit value into `selections` (Q2 -- native
    # selection is permitted WITHIN the operator tier only). provenance:caller means a
    # caller-VERIFIED finer origin (extra_var|inventory) is preserved when supplied,
    # else the honest combined label `operator` is recorded -- never a false
    # attribution (C1-ORIGIN-VALIDATION / A5).
    extra_var:   {source: selections, provenance: caller}
    inventory:   {source: selections, provenance: caller}
    profile:     {source: profile_vars}
    # observation applies ONLY to a field that declares itself eligible
    # (upgrade_fallback): a detected/inferred value may fill an omitted field but
    # never outrank an explicit operator/profile choice. Origin gates defaultability
    # elsewhere: a field declaring origin observation/build MUST NOT carry a default.
    observation: {source: observations, requires_field: upgrade_fallback}
    default:     {source: field_default}
  # Declared origin vocabulary -- every emitted origin label MUST be one of these.
  # `operator` = a natively-selected explicit value with no caller-verified finer source.
  origin_vocabulary: [extra_var, inventory, operator, profile, observation, default]
  fields:
    install_llm:              {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    install_elastic_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    offline_mode:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: true}
    install_otel:             {type: bool, required: true,  nullable: false, default: false, enable_flag: true,  upgrade_fallback: false}
    install_legacy_beats:     {type: bool, required: true,  nullable: false, default: true,  enable_flag: true,  upgrade_fallback: false}
    tailscale_serve_ingress:  {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_egress:   {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    tailscale_serve_services: {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    # OPTIONAL, NO default: absent from lme_resolved unless an operator supplies it;
    # every reader uses `| default(false)`, so absence is the intended "unset" state.
    # bridge_absent is the loader-only reset value for the BARE compat fact when this
    # optional is absent from lme_resolved (C1-OPTIONAL-VALUE-RESET): it clears a stale
    # true carried across a profile switch. It is NOT a resolver `default` (the field
    # stays absent from lme_resolved -- the tested optional-absent contract); it only
    # governs the un-migrated bare-name compat bridge in resolve.yml.
    tailscale_require_vip_live: {type: bool, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, bridge_absent: false}
    # es_discovery has a sensible default and every profile currently sets it; it
    # has no live task consumer yet (see manifests/profiles/multinode.yml note).
    es_discovery:             {type: str,  required: true,  nullable: false, default: single-node, enable_flag: false, upgrade_fallback: false}
    lme_consumer_profile:     {type: bool, required: true,  nullable: false, default: false, enable_flag: false, upgrade_fallback: false}
    # DEPLOYMENT-IDENTITY-NOW-REQUIRED (codex-0430 decision 5; codex-0445
    # decision_deployment_identity; D FROZEN lme_runtime_inventory.deployment_identity).
    # STABLE operator/inventory input, OPTIONAL here with NO default: the resolver MUST NOT
    # mint it or derive it from run_id/config/hostname/directory. Absent for profiles that
    # own no persistent resources; a persistent-resource / DB profile REQUIRES it (that hard
    # gate arms with the DB selectors, still rejected at load_manifests.yml:87-95). The
    # projection derives lme_resolved.deployment_identity from it via
    # lme_validate_deployment_identity (shape [A-Za-z0-9_-]+; missing/conflicting REJECTS
    # before mutation once armed). Kept OUT of the content-addressed config revision
    # (three-identity binding: identity keys storage/fence, NOT the config revision).
    lme_deployment_identity:  {type: str, required: false, nullable: false, enable_flag: false, upgrade_fallback: false, exclude_from_revision: true}
    # Declared DB domain / etcd-group membership (codex-0430 decision 4). OPTIONAL map, NO
    # default. Projected to lme_resolved.database.{domains,etcd_groups}.<id>.members by
    # lme_project_database_membership (members validated; dup/self/absent rejected).
    lme_database_membership:  {type: map, required: false, nullable: false, enable_flag: false, upgrade_fallback: false}
    # OBSERVED cluster_uuid fold (P3; codex-0915/0930 shared_registry_ownership -> C1). Elasticsearch
    # MINTS cluster_uuid at bootstrap; LME only ever READS it as a live observation (restore_
    # elasticsearch_snapshot.yml reads cluster_root.json.cluster_uuid). It is NEVER hand-set, so this
    # is an OBSERVATION-ONLY registry field: origin observation (so it carries NO default -- the shape
    # gate forbids a default on an observation origin -- and its honest origin is `observation`),
    # observation_only:true (added at the canonical fold; E's proposal lacked it -- so the operator/
    # profile/default channels are REJECTED and only a verified read-only observation may supply it,
    # closing C1-OBSERVATION-ORIGIN-DOES-NOT-RESTRICT-CHANNEL for this field), upgrade_fallback:true
    # (so the observation channel's requires_field fires and the field can actually resolve),
    # required:false + nullable:true (absent from lme_resolved unless observed; optional-absent
    # contract), exclude_from_revision:true (identity-like; must not churn the config revision, mirrors
    # lme_deployment_identity). It must NOT be minted/derived from run_id/config/hostname. NB the LIVE
    # observation SOURCE (what supplies the observed value to the loader at resolve time) is NOT wired
    # by this fold -- only the canonical representation is declared here (see the sitrep).
    #   REMOVAL/ABSENCE SEMANTICS (C1-OBSERVATION-FIELD-REPEATED-LOAD-STALE-BRIDGE, codex-1045
    #   decision B -- select GENERICALLY by the observation_only property): an observation_only
    #   field is EXCLUDED from the compatibility bare-name bridge entirely (resolve.yml never
    #   set_facts a bare alias for it). So no stale bare alias is ever manufactured, a REPEATED
    #   load where the observation is now ABSENT leaves NOTHING to reset, and no bridge_absent
    #   sentinel is needed (a null sentinel in a consumerless legacy bridge would only add state).
    #   The canonical value lives ONLY in lme_resolved.lme_observed_cluster_uuid (+ its origin);
    #   lme_resolved stays ABSENT when unobserved (optional-absent contract preserved). Operator/
    #   inventory/profile injection of this bare name is REJECTED fail-closed by the observation-
    #   only channel guard (lme_manifests.py: obs_only in selections/profile -> raise), and an
    #   UNEXPECTED preexisting bare fact in scope is still caught by the post-bridge split-brain
    #   invariant (resolve.yml:307) -- decision B does NOT silence the split-brain check for the
    #   observation_only class, it only stops manufacturing the alias. A FUTURE wired consumer
    #   reads lme_resolved.lme_observed_cluster_uuid, never a bare name; the live observation
    #   SOURCE remains UNWIRED by this fold.
    lme_observed_cluster_uuid: {type: str, required: false, nullable: true, enable_flag: false, origin: observation, observation_only: true, upgrade_fallback: true, exclude_from_revision: true}

  # --- typed material_requirements schema (SCHEMA-REQUIRED-MATERIAL) -----------
  # codex-manager-material-and-membership-contract-decisions-20260923-0430 decision 1+2;
  # C convergence (ack 0429); D b87f313 record_shape. EXTENDS this registry (codex-0430:
  # "Schema EXTENDS the existing lme_config_registry"). A per-service
  # `material_requirements` map (authored in manifests/services/<svc>.yml, keyed by a
  # stable service-local obligation id) resolves to
  # lme_resolved.required_material.<node-id>.<service-id>.<obligation-id>. A record is a
  # TYPED obligation (NOT a basename): each `required` field must be present. `material_ref`
  # points at a lme_global.material_catalog definition (payload semantics). Existing
  # secrets / cert / mount / env references MUST resolve to an obligation id here
  # (validated references, not a second copy of paths/perms/names). The engine filter
  # lme_manifests.py::lme_validate_material_requirements enforces this shape value-purely
  # (vocab read from here, never hardcoded in Python).
  material_requirements_schema:
    # ALWAYS-required base fields carry required:true. destination/owner_role/mode are
    # NOT base-required: they are placement-FORM conditional (a file-backed placement
    # needs them; an env-backed secret must NOT fabricate a path/mode) -- see
    # placement_forms (C1-MATERIAL-CANONICAL-REFERENCE-SHAPE). trust/producer/custody/
    # lifecycle/retention are the lifecycle-and-retention references
    # (C1-MATERIAL-LIFECYCLE-AND-RETENTION); producer_ref/custody_ref resolve against
    # canonical producer/custody declarations that C/D still OWE (their reference
    # closure arms when those declarations land -- shape is validated now).
    record:
      material_ref:      {type: str, required: true}    # -> lme_global.material_catalog.<id> (must be a DISTRIBUTABLE kind)
      placement_class:   {type: str, required: true, vocab: [secrets, config, mount, env]}
      consumer:          {type: str, required: true}    # what mounts/reads it (nonempty)
      profile_condition: {type: str, required: true}    # validated against profile_condition_vocab
      destination:       {type: str, required: false}   # file-backed placement only (placement_forms)
      owner_role:        {type: str, required: false}   # file-backed placement only
      mode:              {type: str, required: false}   # file-backed placement only; octal, validated against mode_pattern
      trust_ref:         {type: str, required: false}   # optional CA/credential reference (-> catalog def when it names one)
      producer_ref:      {type: str, required: false}   # canonical producer declaration (C/D owe the producer registry)
      custody_ref:       {type: str, required: false}   # canonical custody/recovery declaration (C/D owe the custody registry)
      lifecycle:         {type: str, required: false, vocab: [bootstrap, rotate, adopt, static]}
      retention:         {type: str, required: false, vocab: [none, prior_revision, durable]}
    # Obligation map keys MUST match this -- stable service-local names, never integers
    # or empties (C1-MATERIAL-IDENTIFIER-AND-REFERENCE-VALIDATION).
    obligation_id_pattern: '\A[a-z][a-z0-9_-]*\Z'
    # Complete anchored octal mode -- \A...\Z rejects "0644\n" and " 0644"
    # (C1-MATERIAL-MODE-TRAILING-NEWLINE).
    mode_pattern: '\A[0-7]{3,4}\Z'
    # Per-placement-form field requirements (value-pure; replaces mode/path dispatch
    # embedded in Python -- codex-0515 value_purity). A file-backed form REQUIRES the
    # path/owner/mode triple; the env form FORBIDS a fabricated path/mode.
    placement_forms:
      secrets: {requires: [destination, owner_role, mode], forbids: []}
      config:  {requires: [destination, owner_role, mode], forbids: []}
      mount:   {requires: [destination, owner_role, mode], forbids: []}
      env:     {requires: [], forbids: [destination, mode]}
    # profile_condition tokens: always | an enable flag | a db-profile. Declared here so
    # an unknown condition FAILS (C1-MATERIAL-SEMANTIC-REFERENCE-CLOSURE); drift-checkable
    # against lme_config_registry enable flags + the DB profile enum like lme_known_enable_flags.
    profile_condition_vocab: [always, install_llm, install_elastic_services, install_otel, install_legacy_beats, offline_mode, shared-ha, dual-owned-ha]
    # Declared namespaces a COLON-FORM trust_ref (`<ns>:<name>`) may use (A3 reference
    # closure). EMPTY today: no colon namespace is declared, so EVERY colon-form trust_ref is
    # unresolved and REJECTED (a bare-name trust_ref must still resolve to a catalog def or a
    # sibling obligation). The producer/custody registries C/D owe will add their namespaces
    # here when they land -- until then a `:`-prefixed trust_ref cannot silently bypass closure.
    trust_ref_namespaces: []
    # THE THREE empty-list cases (codex-0430 decision 2; C RESTORE-EMPTY-SECRET-PREFLIGHT).
    # ALL THREE keys are REQUIRED and MUST be boolean true: an omitted key, a non-bool,
    # or a value that would DISABLE a required failure (e.g. declared_none_passes:false)
    # is an UNSUPPORTED policy and is REJECTED, never silently honored/ignored
    # (C1-MATERIAL-REFERENCE-INPUT-AND-EMPTY-POLICY).
    empty_semantics:
      declared_none_passes: true              # explicit `material_requirements: {}` = legitimately requires none = PASS
      missing_field_fails: true               # a SELECTED service OMITTING the field = INCOMPLETE = FAIL (never implicitly empty)
      empty_contradicting_refs_invalid: true  # {} while cred/trust/mount refs point at an obligation = INVALID
    reference_resolution:
      rule: >-
        Every material_requirement_ref (from datastore_clients, secrets or mounts) MUST
        resolve to an obligation id declared here; an UNRESOLVED reference is a
        PRE-GENERATION CONFIGURATION error (a missing/invalid DECLARATION), distinct from
        a valid declared production that legitimately yields an absent payload
        (codex-0515 stage_and_evidence_corrections + material_stage_clarification: validate
        the full plan BEFORE generation; keep desired/produced/installed/validated
        distinct). material_ref MUST resolve to a material_catalog definition of a
        DISTRIBUTABLE kind.
    enforcement_status:
      # loader_wired = the production loader invokes COMPLETE validation over the MIGRATED
      # declarations (every selected service authoring material_requirements). It stays
      # FALSE until C/D/E finish that migration -- flipping it earlier would either fail
      # every current service (0/29 declare the field) or hide the gap by treating omission
      # as empty (codex-0615: not early, no implicit-empty hiding).
      loader_wired: false
      # projection_emitted = load_manifests.yml composes + EMITS lme_resolved.required_material
      # .<node>.<svc>.<obligation> on the live path (+ required_material_status marking each
      # selected service declared|declared_none|undeclared with structural evidence).
      projection_emitted: true
      # validator_invoked = the emitter calls lme_validate_material_requirements for every
      # service that DECLARES the field, and FAILS a declared-none ({}) service that still
      # bears material evidence (secrets/certs). It does NOT fail an undeclared service
      # (missing_field_fails is not armed) -- it marks it status:undeclared instead.
      validator_invoked: true
      # missing_field_enforced = arming missing_field_fails on EVERY selected service.
      # Arms in the coordinated wave AFTER the migration; that flip also sets loader_wired.
      missing_field_enforced: false
      # activation_qualified = a live loader run / deploy acceptance of the emitted
      # projection. NOT established by this wiring wave; stays open.
      activation_qualified: false
      note: >-
        The DECLARATION schema, the value-pure validator AND the loader projection emitter
        are LIVE. An undeclared-but-material-bearing service surfaces as status:undeclared
        (visible debt) rather than being failed or hidden as empty. C's materializer
        PRODUCES against these records; D's completeness loop + restore/rollback preflight
        VERIFY; F2's rollback gate CONSUMES the union. loader_wired flips (and
        missing_field arms) only when every selected service is migrated.

  # SEED-06 (codex-tick121-223811; C1 + route author): the remote-harness policy is the COMPOSED
  # lme_global.remote_harness (global | profile | operator override LAST -- the ONE composition, resolve.yml).
  # Immutability is THIS registry's policy, deny-by-default: an override leaf is admitted only under a
  # tunable path and only with the declared leaf's type. Profile data cannot relax it (a recursive combine
  # REPLACES lists, so a deny-list kept in the profile could be emptied by the very override it guards).
  remote_harness_schema:
    projection_schema_version: 3            # 3: + adapter {name, tools} derived view (codex-tick144)
    policy_key: remote_harness            # lme_resolved.<policy_key> = {schema_version, policy, policy_sha256}; revision-bound
    policy_schema_version: 3
    # Override leaves are admitted ONLY under these paths ('*' = any key of a declared mapping), and only
    # with the declared leaf's type. Everything else is pinned to the declaration.
    tunable_paths:
      - controller.local_envelope
      - controller.bootstrap.budget
      - controller.bootstrap.os_tools.*.path       # an ADMITTED executable at another location ...
      - controller.bootstrap.os_tools.*.identity   # ... always together with its identity (path_requires)
      - packages.by_os_family
      - transfer.adapter
    extensible_paths: [packages.by_os_family]                        # the only tunables that accept NEW keys (a new family / package mapping)
    path_requires: {controller.bootstrap.os_tools.*.path: identity}   # a path override must carry the sibling identity
    path_leaves: [controller.bootstrap.os_tools.*.path]                # absolute, normalized
    executable_identity:
      entries: controller.bootstrap.os_tools
      field: identity
      kinds: {file_sha256: {value_field: sha256, value_pattern: '^[0-9a-f]{64}$'}}
    positive_int_paths:
      - controller.local_envelope.vcpu
      - controller.local_envelope.memory_bytes
      - controller.bootstrap.budget.memory_max_bytes
      - controller.bootstrap.budget.cpu_quota_percent
      - controller.bootstrap.budget.tasks_max
      - controller.bootstrap.budget.generation_max_bytes
      - controller.bootstrap.budget.free_required_bytes
    bounds:                                # value <= max * scale (resource bounds inside the declared envelope)
      - {path: controller.bootstrap.budget.memory_max_bytes, max: controller.local_envelope.memory_bytes, scale: 1}
      - {path: controller.bootstrap.budget.cpu_quota_percent, max: controller.local_envelope.vcpu, scale: 100}
      - {path: controller.bootstrap.budget.generation_max_bytes, max: controller.bootstrap.budget.free_required_bytes, scale: 1}
    adapter:
      selector: transfer.adapter
      members: transfer.adapters
      status_field: status
      refused_statuses: [not_admitted]
      tool_lists: [controller.os_tools]     # each names a key of executable_identity.entries
      package_lists: [target.packages]      # each names a key of every package_mapping.families mapping
      # CANONICAL-TOOL-OVERRIDES (codex-tick144): adapter tool maps name executables (keys of
      # executable_identity.entries) and NEVER re-declare them; these fields are DERIVED into
      # lme_resolved.remote_harness.adapter.tools.<map>.<tool> from the effective entry (a declared copy is refused).
      tool_maps: [target.tools]
      derived_tool_fields: [path, identity]
    package_mapping: {families: packages.by_os_family, required: packages.required}
    inventory_var_path: controller.bootstrap.inventory
    inventory_vars: {root_var: lme_toolchain_root, owner_var: lme_toolchain_owner}
    # Registry-owned now; a profile copy would be a parallel field (codex-232517): refused if still present.
    retired_policy_paths: [controller.immutable_fields, controller.bootstrap.derived_outputs]
    # Variable names the remote-harness route DERIVES (facts, registers, task/include vars). The route deletes its
    # profile derived_outputs and its pre-resolve guard reads THIS list inline from global.yml, refusing any name
    # pre-supplied (extra-vars outrank task vars, so a pinned task var could steer reap or identity). 72 names from
    # the route live derived_outputs (f77e6da6) + 89 from route r3e for_C1_reserved_outputs_additions (21 facts +
    # 68 task/include vars) = 161; route r3f for_C1.reserved_outputs_delta (a5db4ed4): +11 derived names, -3 retired
    # (_rh_reap_cgprocs, _rh_reap_sprocs, _rh_tb_unpack) = 169; route r3g (coordinator relay, MAIN byte-verified):
    # +_ep (admit_transport endpoint list), -_addr (no longer derived) = 169. NOT reserved (operator/inventory INPUTS, not route
    # outputs): lme_profile (the declared selector; its profile sha256 is revision-bound), lme_manifests_dir,
    # connection vars (inventory; admitted via connection profiles, tick134 b), clone_directory (a core-playbook var
    # from clone_dir; no route reader). rh_repo_root needs no entry: refuse_pinned_outputs guards it inline.
    reserved_outputs: [rh, rh_config_revision, rh_engine_revision, rh_profile_sha256, rh_seed_lock,
      rh_controller_toolchain, rh_owned_root, rh_toolchain, rh_tc_expected, rh_tc_root, rh_tc_owner, _rh_tc_gen,
      _rh_tc_anc, _rh_tc_files, _rh_tc_bytes, _rh_tc_markers, _rh_tc_list_now, _rh_pkg_src, _rh_pkg_dst,
      rh_builder, rh_bundle, rh_transfer, _rh_bld_stat, _rh_bld_head, _rh_bld_pkg, _rh_src_tool, _rh_src_git,
      _rh_src_filters, _rh_src_inputs, _rh_pkg_sum, _rh_acq_have, _rh_bnd_list, _rh_bnd_stat, _rh_bnd_manifest,
      _rh_tb_archive, _rh_tb_uid, _rh_tb_pre, _rh_tb_anc, _rh_tb_bdir, _rh_tb_list, _rh_tb_sum,
      _rh_tb_sumfile, _rh_tb_apply, _rh_tc_uid, _rh_tc_desc, _rh_pkg_anc, _rh_pkg_stage, _rh_pkg_final,
      _rh_pkg_finalsum, _rh_pkg_publish, _rh_tb_stage, _rh_tb_extract, _rh_tb_publish, _rh_tb_kat, _rh_tb_final,
      _rh_pkg_mv, _rh_pkg_man, _rh_tb_manfile, lme_seed_bs, lme_seed_ctl, lme_seed_lock, rh_conn, _rh_reap_top,
      _rh_reap_desc, _rh_reap_mv, _rh_reap_rm, _rh_reap_after, _rh_reap_df, _rh_reap_sel, rh_staging_lease,
      _rh_lease_self, _rh_acq_after, _rh_acq_before, _rh_acq_rcpt, _rh_lease_ns, _rh_lease_rec, _rh_pkg_ident,
      _rh_reap_cg, _rh_reap_kat, _rh_reap_own, _rh_reap_pid, _rh_reap_probe, _rh_reap_pstat,
      _rh_reap_quiet, _rh_reap_recmap, _rh_reap_recs, _rh_reap_rmrec, _rh_reap_sessions,
      _rh_reap_tok, _rh_tb_ident, _acq, _anc, _anc_exist, _at, _bd, _bdir, _bn, _busy, _cmdfail, _cr, _d, _decl,
      _desc, _disp, _dst, _empty, _expect_members, _f, _fresh_seed_sha256, _gone, _keys, _left, _lock, _lp, _lz,
      _m, _missing_names, _missing_paths, _mode, _mode_args, _ns, _ot, _out, _owner, _ownl, _p, _pkgs, _pre,
      _rec, _ret, _root, _rows, _rp, _rt, _run_mode, _sa, _shape, _skip, _sp, _src, _st, _ti, _tok, _tools, _tq,
      _tst, _uid, _want, rh_reap_dest, rh_reap_df, rh_reap_flock, rh_reap_members, rh_reap_mv, rh_reap_need,
      rh_reap_remote, rh_reap_reserve, rh_reap_rm, rh_reap_uid,
      _ad, _ep, _rh_pkg_left, _rh_pkg_present, _rh_reap_cgev, _rh_reap_katlock, _rh_reap_sev, _rh_reap_uslice,
      _rh_tb_left, _rh_tb_present, _tg]

# =============================================================================
# legacy_service_override_projection -- DATA declaration of the legacy es_* ->
# lme_service_overrides.<service>.environment.* compatibility shim
# (C1-LEGACY-CONFIGURATION-MOVED-INTO-ENGINE, codex-1100 architecture finding).
#
# install.sh --cluster / ansible/inventory/cluster_example.yml supply LEGACY es_*
# inventory vars (es_node_name, es_publish_host, es_cluster_seed_hosts,
# es_initial_master_nodes, es_is_initial_master). This projection maps them into the
# MODERN per-node lme_service_overrides.elasticsearch.environment.* form (the same form
# host_vars/es1.yml authors by hand) so an `-i` run WITHOUT per-node host_vars still gets
# the cluster discovery env. The SERVICE id, the env KEYS, the source WIRING and the
# single-node master DEFAULT (`lme-elasticsearch`, the canonical single-node node.name --
# see manifests/services/lme-elasticsearch.yml env node.name, convert_to_cluster.yml
# es_initial_masters default, cluster_example.yml es_node_name) ALL live HERE as DATA.
# lme_manifests.py::lme_effective_service_overrides is a GENERIC consumer that carries NO
# embedded service id or deployment default -- the sole permitted Python file holds no
# deployment configuration debt.
#
# Per-service value is {gate_source, environment:[<entry>...]}. The whole service block is
# inert unless gate_source is PRESENT (defined and not null) in the es context, so a bare
# localhost run with no es_* inventory produces NO legacy override. Each environment entry:
#   key                 -- the flat dotted environment key written under <service>.environment.
#   source              -- the es-context key (a legacy es_* inventory var) feeding this key.
#   emit_when           -- generic gate the consumer evaluates (closed vocab):
#                            present         = source defined and not null (absent OR null skip);
#                            truthy_not_omit = source truthy AND not an Ansible omit placeholder;
#                            nonempty        = the (normalized) value is a non-empty string;
#                            flag            = ctx[flag_source] is truthy (the value MAY be empty;
#                                              the branch still emits -- matches the legacy Jinja
#                                              cluster.initial_master_nodes else-branch).
#   normalize           -- optional generic transform: list_join = the legacy es list->CSV join
#                            (a string is bracket-stripped / comma-split / trimmed / empty-dropped;
#                            a list is str-cast / trimmed / joined, no empty-drop).
#   flag_source         -- (emit_when: flag only) the es-context bool key gating the branch.
#   default_when_absent -- (emit_when: flag only) the value emitted when source is ABSENT (never
#                            defined). An EXPLICIT null source is PRESERVED as null (null-env-skip
#                            drops the key at render), NOT replaced by this default
#                            (C1-LEGACY-EXPLICIT-NULL-CONFLATED-WITH-ABSENCE, codex-1100).
legacy_service_override_projection:
  elasticsearch:
    gate_source: node_name
    environment:
      - {key: 'node.name',                    source: node_name,            emit_when: present}
      - {key: 'network.publish_host',         source: publish_host,         emit_when: truthy_not_omit}
      - {key: 'discovery.seed_hosts',         source: seed_hosts,           emit_when: nonempty, normalize: list_join}
      - {key: 'cluster.initial_master_nodes', source: initial_master_nodes, emit_when: flag, flag_source: is_initial_master, normalize: list_join, default_when_absent: lme-elasticsearch}
