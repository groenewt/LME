            # controller.bootstrap (rel_path -> the loader-projected source_admission.rel_path_grammar); its keys are disjoint
            # from context_fields (exact key sets above and here) and the launch record's context key set is their union.
            # rel_path_field names the launch_context_fields entry the pre-path-use rel check reads.
            - {path: launch_context_fields, keys: [rel_path]}
            - {path: launch_context_fields.rel_path, enum: [[source_admission, rel_path_grammar]]}
