      # every row's bound.<struct> keys are the entry_forms.select VALUES of the struct.roles keys. record_codes is the
      # ONE declaration of the codes the generator consumes directly; record_code_refs names every admitted DYNAMIC
      # selector (under generation.records) whose values / items are codes (generate_entries.yml :1034-1035 indexes
      # precedence.missing_record_with_outputs[op]); every code reached either way must be a records.refusals entry
