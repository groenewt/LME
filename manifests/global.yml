            - {path: os_tool_consumers.controller, enum: [[seed, uv_installer, package_source_binding, source_edition_binding, owner_key_generation, preparation]]}
            - {path: os_tool_consumers.target, enum: [[target_adapter, privileged_contact, target_prereq, guest, observation]]}
            - {path: os_tools, each: true, has_keys: [required_by]}
