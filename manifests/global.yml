      # verified_no_prior_deployment (bool; rev-4 preservation) (B-graph prerequisite play,
      # testing/remote_harness/target_prereq.yml) and obs_paths / obs_prior_dirs / obs_unit_patterns (route observation
      # runner; run-selection inputs -- adding a host is inventory data only). "required" applies to EVERY target of the
      # group (the workload guest too), so only owner / toolchain_root are loader-required; a role one consumer needs on
