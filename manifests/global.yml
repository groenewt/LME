        # REPORT FRAME (route-r4e, codex-tick421 R4D-REPORT-FRAME-PRE-EFFECT): checked whenever a CONSUMING node is declared,
        # not merely when the frame is (a consumer with no frame refuses at resolve). Profiles without either node: unaffected.
        report_frame_measurement:
          root: controller.bootstrap.report_frame
          when_present: controller.bootstrap.preparation_measurement
          checks:
            - {path: '', enum: [{text: report, stop: stop}]}
        report_frame_prerequisite:
          root: controller.bootstrap.report_frame
          when_present: controller.bootstrap.controller_prerequisite
          checks:
            - {path: '', enum: [{text: report, stop: stop}]}
        consumer_interface_implements:
          root: controller.bootstrap.consumer_interface
          checks:
            - {path: '', keys: [revision, implements, files, interface_sha256]}
            - {path: implements, enum: [{controller_prerequisite: 3, binding_admission: 2}]}
        # COMMON REFUSAL GRAMMAR (route-r4c; B r5g C1-R5G-7 / r5h C1-R5H-1): ALWAYS checked -- every route refusal formats
        # through it, and its declaration code / text exist whenever a resolve exists.
        refusal_grammar:
          root: controller.bootstrap.refusal_grammar
          checks:
            - path: ''
              keys:
              - marker
              - code_separator
              - delimiter
              - detail_separator
              - macros_rel
              - macro
              - entry_rel
              - declaration_codes
              - declaration_texts
              - plugin
            - path: marker
              enum:
              - REFUSED
            - path: code_separator
              enum:
              - ' '
            - path: delimiter
              enum:
              - ':'
            - path: detail_separator
              enum:
              - ' '
            - path: macros_rel
              enum:
              - testing/remote_harness/templates/macros/refusal.j2
            - path: macro
              enum:
              - refused
            - path: entry_rel
              enum:
              - testing/remote_harness/templates/refusal.j2
            - path: declaration_codes
              keys:
              - run_binding
            - path: declaration_codes
              each: true
              pattern: marker_word
            - path: declaration_codes.run_binding
              enum:
              - RUN-BINDING-RENDER-DECLARATION
            - path: declaration_texts
              keys:
              - run_binding
            - path: plugin
              enum:
              - ansible.builtin.template
        path_admission_grammar:
          root: controller.bootstrap.path_admission
          checks:
            - {path: '', has_keys: [separator, admission_texts, include_refusal, include_inputs]}
            - {path: separator, equals_registry: {path: contract_admission.path_law.separator}}   # F05-S4 CORRECTIONS S4-D04: the one separator home
            - {path: include_refusal, enum: [RH-ANCESTRY-INCLUDE]}
            - {path: include_inputs, enum: [[rh_anc_bs, rh_anc_repo_root, rh_anc_path, rh_anc_refusal]]}
            - {path: admission_texts, keys: [inputs, components, include]}
            - {path: case_sensitive, enum: [true]}
        # C1 s14 records-pkg-optb-04 (codex721 C1PKG-REQ-PATH-SEP / OD-PKG-OPTB2-FXSEP-01): the POLICY-NODE segment
        # separator (a {policy: <path>} role or source is walked segment by segment) is the existing node
        # source_admission.early_view.override.audit_join, published as entry_generation.policy_path_separator. It is
        # NOT the filesystem separator path_admission.separator (bound to path_law above): pinned, and kept distinct.
        policy_segment_separator:
          root: controller.bootstrap
          checks:
            - {path: source_admission.early_view.override.audit_join, enum: ['.']}
            - {path: source_admission.early_view.override.audit_join, distinct_from: [path_admission.separator]}
        # C1 s14 records-pkg-optb-05 (codex721 LOCKSHA-01; C1PKG-REQ-LOCKCAP-CTL): the ONE lock capture law and its
        # verification source, pinned (a word change is a declared migration of every capture reader).
        lock_capture:
          root: controller.bootstrap.lock_capture
          checks:
            - {path: '', keys: [digest_algorithm, digest_of, fields, input_binding, recipe_at, refusal, verify]}
            - {path: fields, enum: [[text, sha256, packages, collections]]}
            - {path: digest_algorithm, enum: [sha256]}
            - {path: verify, keys: [by, digest_field, follow, require]}
            - {path: verify.by, enum: [stat]}
            - {path: verify.follow, enum: [false]}
            - {path: verify.require, enum: [[exists, isreg]]}
            - {path: verify.digest_field, enum: [checksum]}
            # C1-H11 (codex 870 Q273_1): the capture input is the lock_file_rel of the engine-resolved recipe of each role
            # and class; builder and test keep separate identities; a missing or conflicting binding refuses before any effect.
            - {path: input_binding, keys: [conflict, field, keyed_by, missing, roles, source]}
            - {path: input_binding.source, enum: [resolved_recipe]}
            - {path: input_binding.field, enum: [lock_file_rel]}
            - {path: input_binding.keyed_by, enum: [[role, class_key]]}
            - {path: input_binding.roles, enum: [[builder, test]]}
            - {path: input_binding.missing, enum: [refuse_before_effect]}
            - {path: input_binding.conflict, enum: [refuse_before_effect]}
