        # OUTPUTS (J-FIN-F05-01 / F05 render-context-02 J-RC2-GENESIS-ENTRY-COUNT: entry_count 2 = the two LEADING
        # entry templates, each with free variables EQUAL inputs + checkout_inputs, EQUAL the declared rendered output
        # templates; the macros files after them stay free-variable-less -- no macro is widened). checkout_inputs {}
        # (J-RC2-GENESIS-CHECKOUT): no genesis template reads lme_entry_decl, so the rendered rows' checkout input
