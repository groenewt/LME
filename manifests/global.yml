                path:
                - source_tree
              profile:
                fact: lme_profile
                path: []
          - path: application_roster
            enum:
            - configuration_path:
              - application_roster
              comparison_filter: lme_type_aware_equal
              expected:
                fact: lme_resolved
                path:
                - application_roster
              missing_obligations: retain_and_block_application_activation
