            # staging <stage_prefix><nonce> (holder_file + <live_dir>), and carries a RECORDED term (holder_fields incl.
            # term_end_epoch = acquired_epoch + ttl_s) and a live token; the successor (or the holder on release) revokes
            # it by renaming <N>/<live_dir> to <N>/<revoked_prefix><nonce>; released_file is written once by the holder
