        # C1 s14 erratum-02, amended by records-pkg-optb-01 (codex711 option B): this node holds the pre-publication check
        # only; the byte allocation is per artifact (contracts bundle_member_max_bytes, bootstrap_artifact_max_bytes and
        # the lock rows), derived per class by the PKG-CALLER binder and admitted by N13 reserve_publish.
        package_publish:
          root: controller.bootstrap.package_publish
          checks:
            - {path: '', keys: [pre_publish, receipt]}
            # C1-REQ-PKG-04: the pre-publication check node. terminators: words of the checksum grammar only, each the
            # LF string (checksum_format.terminator is enum [newline], :3012; sha256sum --check and lme_bundle_check read
            # LF-terminated lines). rows: keyed by the checksum file; form an N13-implemented form; terminator equal to the
            # grammar's word and a terminators key; covers distinct N13 staged groups. Exact cover of the caller's check rows,
            # the line text and the sealed digest are N13 s04 runtime admissions.
            - {path: pre_publish, keys: [rows, terminators]}
            - {path: pre_publish.terminators, subject: keys, within: [controller.bootstrap.bundle.checksum_format.terminator]}
            - {path: pre_publish.terminators, each: true, enum: ["\n"]}
            - {path: pre_publish.rows, subject: keys, within: [controller.bootstrap.bundle.checksum_file]}
            - {path: 'pre_publish.rows.*', keys: [covers, form, terminator]}
            - {path: 'pre_publish.rows.*.form', enum: [digest_lines]}
            - {path: 'pre_publish.rows.*.terminator', subject: scalar, within: [controller.bootstrap.bundle.checksum_format.terminator]}
            - {path: 'pre_publish.rows.*.terminator', subject: scalar, within: [controller.bootstrap.package_publish.pre_publish.terminators]}
            - {path: 'pre_publish.rows.*.covers', strings: {nonempty: true, distinct: true}}
            - {path: 'pre_publish.rows.*.covers', each: true, enum: [renders, copies]}
