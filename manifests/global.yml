      # rule's endpoint_key components} derived by the ONE declared connection rule the route and B consume (named
      # here by path, never copied): address var (absent -> inventory id, lower-cased); port var (explicit -> its
      # canonical decimal by explicit_regex/explicit_max; absent -> absent_key, DELEGATED to the owner's ssh
      # configuration -- an unresolved dependency, never a guessed number); proxy_jump = the FIRST accepted
      # inventory_forms entry whose test holds (absent / empty / exactly the host mode's ssh_common_args -> '';
      # the ProxyJump form -> its capture), any other value refuses; owner var (absent -> the value the policy
      # DECLARES at owner_rule_path = inventory.owner {var, absent}; owner.var must equal owner_var; a missing or
      # malformed owner rule refuses -- route r3h OWNER-ABSENT RULE, no resolver default). auth_path names the
      # modes and the host mode var the equals_mode_args test reads. Part of every scope_sha256: a changed declared
      # endpoint under the same inventory id moves every scope identity.
      endpoint:
        rule_path: controller.bootstrap.ssh_auth.composition
        owner_var_path: controller.bootstrap.inventory.owner_var
        owner_rule_path: controller.bootstrap.inventory.owner
        auth_path: controller.bootstrap.ssh_auth
        # H-FORM-VOCAB (route r4j; C1 join): where the form vocabulary lives (the rule's own form_semantics member), and
        # the two SET-EQUALITY joins with the interpreter: its primitive table and its cause-emission roles (== the key
