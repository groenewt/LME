        # J-KEY OWNER KEY (B-graph c1-jkey-proposal JK-3; codex-graph-critical-path-key-and-profile-20260925,
        # codex-tick341; MAIN relay: decl 9c26b51e adds encryption): controller.bootstrap.owner_key, the declaration
