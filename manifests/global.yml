        observed: controller.bootstrap.source_admission.member_fields.observed
      refusal: RH-SOURCE-DOCUMENT-INPUT
      message: 'a declared document input is absent, unreadable, not the declared encoding, not a mapping with its declared root, carries no value at its rel_at, or is declared while the generation contract is inactive'   # draft wording (review)
    # C1-BOOTSTRAP-CONTRACT-VALUE-ADMISSION (codex-C1-four-contract-admission-audit-20260924-191117, MEDIUM; route
    # codex-tick213-215-route-C1-caller-decisions-20260924-191017 (2)). The controller.bootstrap contracts the seed
    # (controller_seed.j2), the route (reap_staging / package_bundle / admit_builder / target_bootstrap) and B consume are
    # admitted HERE by shape, enum and reference -- at resolve, on the COMPOSED policy, before any mutation -- instead of
    # failing at render (seed_launch.derive.home.tool: missing_tool used to resolve and only break at controller_seed.j2
    # x(bs, dh.tool)). It widens nothing: every leaf below stays declaration-pinned (tunable_paths unchanged; a malformed
    # profile declaration is REFUSED, never admitted by a wider allowlist), and references follow the composed policy,
    # so an admitted os_tools.<t>.path/identity override keeps satisfying them. The enums are the consumers' closed
    # vocabularies (the only branches the templates/tasks implement), never deployment values.
    # Closed check vocabulary (lme_manifests.py _rh_admit_contracts; exactly one kind per check):
    #   keys [..] exact key set | has_keys [..] required subset | enum [..] (type-exact) | positive_int
    #   int_range {min[, max]} (codex-tick304): a type-exact integer (never a bool, float or decimal string) in [min, max]
    #   key_set {required, optional} (codex-tick304): exact keys, the optional members may be absent
    #   int_gt_sum [{path, times}..] (RS a51cc226 lease bound): a type-exact integer STRICTLY greater than the sum of
    #     times * each root-relative integer leaf (times >= 1; an absent / non-integer leaf is a missing dependency)
    #   pattern <patterns name> (full match) | key_pattern <name> (every mapping key) | strings {nonempty, distinct}
    #   within [policy paths]: every member of the value (a string; list elements; mapping keys) is a member of the
    #     union of the referenced nodes (mapping keys, list elements, a scalar; '*' expands); having {field, contains}:
    #     only mapping entries whose <field> list contains <contains> count (e.g. a tool the seed hash-admits);
    #     subject (REQUIRED, C1-CONTRACT-SCALAR-SHAPE codex 193253): the declared shape of the value -- scalar = ONE
    #     non-empty string (a key a consumer indexes with, e.g. os_tools[dh.tool]); list = a non-empty list of strings;
    #     keys = a non-empty mapping, its keys checked. A value of another shape refuses (never vacuous membership).
    #   ere fragment|anchored: a BOUNDED, conservative ERE subset -- NOT a complete portable-ERE grammar check
    #     (codex 193337 regex scope): it compiles under Python re AND contains none of the substrings backslash,
    #     newline, '|', '[:', '(?', a lazy quantifier; fragment: no '^'/'$' anywhere (it is composed inside ^...$);
    #     anchored: '^' first, '$' last, no other '^'/'$'. The '^' rule is a substring rule, so bracket NEGATION
    #     ('[^/]+') is UNSUPPORTED (refused), deliberately; admitting it would need a bounded structural check first.
    #     sed_delimited: additionally no '/' (the fragment sits inside a sed s/.../.../ expression)
    #   ere_compose [paths relative to the value]: '^' + the fragments concatenated + '$' compiles (the ONE grammar)
    #   rejects [probe strings]: the (anchored) regex value must NOT fullmatch any declared probe (C1-ACT-REQUIRED-
    #     COMPONENT codex 193337). A FINITE resolve-time screen over exactly the listed probes: it refuses a pattern
    #     that admits one of them (e.g. '^$', '^[.]{1,2}$'), NOT every pattern admitting an empty / dot / multi-
    #     component value ('^x/y$', '^[.][.]/x$', '^[.]hidden$' pass it). The component GUARANTEE is the runtime
    #     registry fullmatch (required_values below: the consumer admits the VALUE against patterns.<pattern> before
    #     its configurable pattern and before any path; codex 212700: the two give different guarantees)
    #   umask_yields <path relative to the contract root>: 0666 & ~value == that octal mode
    #   not_in [names of lists of THIS schema]: the value is none of their members
    #   matches_ere <path relative to the contract root>: the value fully matches '^' + that ERE fragment + '$'
    #   distinct_from [paths relative to the contract root]: each is declared and the value equals none of them
    #   placeholder_words {known, whole_word, params, refused} (codex-tick217 R1 launcher; controller_seed.j2
    #     launch_word / launch_params / launch_exec): the value is a list of argv words; every '{' opens a
    #     placeholder closed by the next '}' (unterminated or empty refuses); a whole_word name only as an entire
    #     word '{name}'; a known name anywhere; a refused name never; any other name is a positional parameter only
    #     when `params` names a pattern it fully matches (the launcher re-splits parameter names on whitespace), else
    #     undeclared.
    #   equals_registry {path[, index]}: the value equals (type-exact) the node at that path of THIS registry schema
    #     (remote_harness_schema; index selects one list element), so the registry holds the ONE literal; an absent
    #     path or an index outside the list refuses (missing dependency, never vacuous). SCALARS ONLY (codex 203817
    #     C1-EQUALS-REGISTRY-NESTED-TYPES): both sides must be str / int / bool (type-exact); a container node on
    #     either side refuses, so a nested bool-vs-int can never compare equal.
    #   records {fields: {<name>: <patterns name>}} (C1-UV-ADDED-FILES, codex-d649-runtime-refusal-repair-20260924-235616):
    #     the value is a LIST (empty admitted: the strictest declaration) of mappings with EXACTLY those keys, each
    #     field a string fully matching its pattern. A missing value refuses ('is not declared'), a non-list refuses.
    #   rel_disjoint {field[, ref_pattern <patterns name>, from [paths relative to the contract root], from_under {base,
    #     paths}]}: the <field> relative paths of a record list are pairwise distinct and never nested, and are neither
    #     equal to, an ancestor of nor a descendant of any member of each `from` list (same base) or any `from_under`
    #     path rebased onto the string at `base` (it must lie strictly under base + '/'). Compared BY PATH COMPONENT
    #     (a == b, or one is the other + '/' + more; 'bin/python3.13x' is NOT under 'bin/python3.13'). ref_pattern is
    #     REQUIRED with any reference: the base, each from_under path and each from member must fully match it BEFORE
    #     rebasing / comparison, even for an empty record list (codex 001124: an unnormalized reference would hide an
    #     overlap; it refuses, never normalized away). Shapes and references are checked by the kind itself (a
    #     malformed or absent reference is a missing dependency, never vacuous). No other primitive can
    #     do this: distinct_from compares whole scalars, strings {distinct} only string lists, '*' expands mappings
    #     only, and nothing expresses ancestor / descendant.
    # Modifier each: the check applies to every list element / mapping value; with `where {field, equals_at}` only
    # the mapping entries whose <field> equals the value at equals_at count, and selecting none REFUSES (never
    # vacuous). within modifiers: key_at <absolute path>: each referenced node is a mapping and only its entry keyed
    # by the value at key_at counts (absent -> missing dependency); placeholders [excluded]: the members a word list
    # contributes are its placeholder names minus the excluded ones. `path` is relative to the contract root
    # ('' = the root); `at` is an absolute policy path; a '*' segment expands every mapping key (no match refuses).
    # when_present: the contract applies only when that policy path is declared (genesis is declared on the m1-1g
    # lineage only); otherwise its root is REQUIRED.
    # derive.runtime / derive.names are pinned (enum) to the pointers controller_seed.j2 actually reads
    # (bs.target_bootstrap.user_manager, bs.work_roots.run_local.user_manager_env): a resolvable but different pointer
    # would be silently ignored by the template, so it refuses here; the pointed-to nodes are admitted by `at`.
    contract_admission:
      # F05-S4 CORRECTIONS (codex-tick558 S4-D04 + F05-S4-PATH-LAW-FLOOR + F05-S4-ERE-PARITY): the ONE law of every path
      # grammar (patterns.<n> declared as {pattern, refused_components}), declared here and never as a loader constant.
      # separator: the component separator (the policy controller.bootstrap.path_admission.separator and
      # target_prereq reuse.path_separator are bound to it by equals_registry, so the literal has one home). traversal:
      # the components EVERY path grammar refuses; the loader requires refused_components to include all of them, and a
      # path is admitted iff it fully matches `pattern` and none of its separator-split components is refused -- the
      # invariant holds by construction for every pattern (no sample probes). syntax: the patterns entry whose Python
      # regex the pattern TEXT must fully match: the bounded ERE subset Python re.fullmatch and POSIX grep -E -x decide
      # identically (see patterns.path_ere). terminator (codex-tick560): the line terminator of the shell consumer, in
      # BOTH its roles -- a value holding it is refused BEFORE grep (grep -x decides per line), and it ends the one record
      # piped to grep -E -x (printf '%s<terminator>'): one byte by grep's own line semantics, so one key, no second
      # spelling. The loader refuses it inside a value too. All four values are projected with the grammar.
      path_law:
        separator: '/'
        terminator: "\n"
        traversal: ['.', '..']
        syntax: path_ere
        # F05-S4 GROUPS CORRECTIONS (codex-tick564 F05-GROUP-PATH-READER-COMPATIBILITY): the declared readers of the
        # path law and the values each one SUPPORTS. posix_path: a projected rel is a POSIX filesystem pathname (the
        # kernel splits it on '/' and resolves '.' / '..'), so separator and traversal must be the POSIX ones, else a
        # component check on another separator hides a real '..' (a/../b under ':'). grep_ere_record: the shell
        # consumer pipes ONE record (value + terminator) to grep -E -x, which decides per newline-terminated line, so
        # the terminator must be grep's line end, else value + terminator never fully matches (a + '@'). The loader
        # requires every separator / terminator / traversal value to be bound by at least one reader and to be
        # in EVERY binding reader's supported list, and refuses an unsupported law before any projection.
        consumers:
          posix_path:
            separator: ['/']
            traversal: [['.', '..']]
          grep_ere_record:
            terminator: ["\n"]
      patterns:
        env_name: '^[A-Z_][A-Z0-9_]*$'
        var_name: '^[a-z_][a-z0-9_]*$'
        refusal_code: '^RH-[A-Z0-9]+(-[A-Z0-9]+)*$'
        mode_word: '^[a-z]+(-[a-z]+)*$'
        rel_segment: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        file_mode: '^0[0-7]{3}$'
        lock_mode: '^0[0-7][0145][0145]$'          # never group/other-writable (lock_file.existing refuses those)
        dir_mode: '^[0-7]{3,4}$'                    # stat %a form
        uid_rule: '^/[^{}]*\{uid\}[^{}]*$'          # absolute, exactly one {uid} placeholder
        literal_separator: '^[^\n\\/.\[\]()*+?{}|^$]+$'   # composed literally into ERE and sed: no metacharacter
        abs_word: '^/\S*$'                          # absolute and ONE whitespace-free word (a #! interpreter path)
        sha256_hex: '^[0-9a-f]{64}$'                # a sha256 digest: exactly 64 LOWERCASE hex characters
        # a NORMALIZED relative path (UV-REL-NAMING, codex 001124): '/'-joined components, each one or more of ASCII
        # letters, digits, '.', '_', '-' (a LEADING '_', '.' or '-' is admitted: _sysconfigdata..., .uv-state, -x) and
        # never exactly '.' or '..'. Refused: absolute, an empty component (//), a trailing slash, a '.' / '..'
        # component (traversal), a backslash or any other separator, whitespace and control characters. The ONE
        # normalized-relative contract of the uv files AND of their references (installed_rel, uv_patched_rel,
        # interpreter_rel via rel_disjoint ref_pattern) AND of the genesis shell entry.
        # F05-S4 F05-GEN3-01 (codex-tick554 GEN2-PATH-GRAMMAR-ENGINE): a PATH GRAMMAR, admitted by the loader
        # (_rh_path_grammar) under contract_admission.path_law: `pattern` fully matches patterns.<path_law.syntax>, and
        # a path is admitted iff it fully matches `pattern` and no path_law.separator-component is in refused_components
        # (which includes every path_law.traversal component). Loader and shell run the SAME two steps over this ONE
        # declaration, projected as source_admission.rel_path_grammar = {pattern, refused_components, separator,
        # terminator} (separator / terminator = path_law.*); there is no second spelling.
        rel_path:
          pattern: '^[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$'
          refused_components: ['.', '..']
        # F05-S4 CORRECTIONS (codex-tick558 F05-S4-ERE-PARITY): the PRECISE bounded ERE subset of a path grammar pattern,
        # as a positive token grammar over the pattern TEXT (no blacklist): '^' + one or more units + '$'. A unit is an
        # atom with AT MOST ONE quantifier ('*', '+', '?', '{m}', '{m,}', '{m,n}'; a quantifier never follows a
        # quantifier, so possessive '*+', lazy '*?' and stacked forms cannot occur), or ONE flat group '(' atoms ')' with
        # at most one quantifier (no nested group, no empty group). An atom is a literal [A-Za-z0-9_/-] or a bracket
        # expression of literals [A-Za-z0-9._/] and same-class ranges (a-z / A-Z / 0-9 sub-ranges) with an optional
        # trailing '-' (no '^' negation, no ']' or '[' inside, so no class name / collating symbol / equivalence class).
        # No bare '.', no backslash, no alternation, no back-reference, no anchor inside. Within this subset Python
        # re.fullmatch and POSIX ERE grep -E -x (LC_ALL C / C.UTF-8 codepoint ranges; newline-free values -- every
        # shell consumer refuses a newline BEFORE grep) decide the same regular language.
        path_ere: '^\^(([A-Za-z0-9_/-]|\[([A-Za-z0-9._/]|[a-z]-[a-z]|[A-Z]-[A-Z]|[0-9]-[0-9])+-?\])([*+?]|\{[0-9]{1,3}(,[0-9]{0,3})?\})?|\((([A-Za-z0-9_/-]|\[([A-Za-z0-9._/]|[a-z]-[a-z]|[A-Z]-[A-Z]|[0-9]-[0-9])+-?\])([*+?]|\{[0-9]{1,3}(,[0-9]{0,3})?\})?)+\)([*+?]|\{[0-9]{1,3}(,[0-9]{0,3})?\})?)+\$$'
        # GRAPH-SHARED-CONTRACT (codex-tick304 / tick307): patterns of the guest carrier, the observation job binding and
        # the declared target inputs (host_scope.target_inputs). An ABSOLUTE normalized path: '/'-joined components as
        # rel_path (plus '+'), never '/' alone, never a '.' / '..' / empty component, no trailing slash.
        abs_path: '^/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+(?:/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+)*$'
        abs_mount: '^/(?:(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+(?:/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+)*)?$'   # abs_path or '/' itself (a mount point)
        account_name: '^[a-z_][a-z0-9_-]{0,31}$'   # a POSIX account name (useradd NAME_REGEX default, <= 32 characters)
        package_class: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        unit_glob: '^[A-Za-z0-9@_.:*-]+$'          # a systemd unit-name glob (observation host input)
        unit_name: '^[A-Za-z0-9@_.:-]+[.](service|socket|timer|mount|target|path|slice|scope)$'   # one exact systemd unit name
        guest_run_id: '^[a-z0-9][a-z0-9-]{2,39}$'  # owned-resource identity: run dir, unit and record are keyed by it
        guest_hostname: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'   # one DNS label (RFC 1123), never ending in '-'
        qcow2_file: '^[A-Za-z0-9_+-][A-Za-z0-9._+-]*[.]qcow2$'   # one file name (no '/', no leading '.')
        sha512_hex: '^[0-9a-f]{128}$'
        guest_refusal_code: '^GUEST-[A-Z0-9]+(-[A-Z0-9]+)*$'
        guest_unit_name: '^[a-z0-9-]*\{run_id\}[a-z0-9-]*[.]service$'   # exactly one {run_id} placeholder
        abs_dir_prefix: '^/(?:(?!\.\.?/)[A-Za-z0-9._+-]+/)+$'   # an absolute directory PREFIX: normalized, trailing '/'
        qemu_word: '^[a-z0-9][a-z0-9._-]*$'        # one QEMU option value (q35, host, virtio-blk-pci)
        serial_prefix: '^[a-z0-9][a-z0-9-]{0,11}$'  # a virtio disk serial prefix (serial <= 20 bytes with the run suffix)
        fs_label: '^[a-z0-9][a-z0-9-]{0,15}$'      # an ext4 filesystem label (<= 16 bytes)
        schema_tag: '^[a-z0-9]+(-[a-z0-9]+)*/v?[0-9]+$'   # a record schema tag (lme-guest-record/1, lme-target-prereq/v1)
        record_suffix: '^[.][a-z0-9]+([.-][a-z0-9]+)*[.]json$'
        gecos_text: '^[A-Za-z0-9][A-Za-z0-9 ()._-]{0,63}$'   # a passwd GECOS value: never ':' / ',' / newline
        # RS a51cc226 guest lifecycle leaves: a HIDDEN single-segment name or prefix (lease dir, broken-lease and claim
        # prefixes: never '.' / '..', never a '/'), a partial-file name, a mount-option list, a console marker word
        hidden_prefix: '^[.][a-z][a-z.-]*$'
        partial_file: '^[A-Za-z0-9][A-Za-z0-9._-]*[.]partial$'
        mount_options: '^[a-z0-9_.=-]+(,[a-z0-9_.=-]+)*$'
        marker_word: '^[A-Z0-9]+(-[A-Z0-9]+)*$'
        text_line: '^[^\n]*\S[^\n]*$'              # F05-S3 LD-06: one non-blank declared text line (refusal texts)
        # RS FINAL contract delta (codex-tick335-336 contract-source verdict; RS proposal 91f9f744
        # B1_registry.FINAL_contract_delta_tick336): the lease /3 fence leaves' exact patterns, applied IN ADDITION to
        # the earlier (stronger-shaped) hidden_prefix / rel_segment / var_name checks -- no earlier closure is widened
        hidden_dash_prefix: '^\.[a-z-]+-$'         # lease epoch / stage prefixes, layout.epoch_partial_infix
        lower_word: '^[a-z]+$'                     # lease.live_dir (the live token every fenced command chdirs into)
        dash_prefix: '^[a-z-]+-$'                  # lease.revoked_prefix (<N>/<revoked_prefix><nonce>)
        lower_file: '^[a-z._-]+$'                  # lease holder / released file names
        guest_input_var: '^lme_guest_[a-z_]+$'     # a guest operator INPUT name (lease.break_var, lease.recover_var)
        service_name: '^[A-Za-z0-9@_.:-]+[.]service$'   # one exact systemd .service unit (B preserved dev-stack units)
        # guest host keys (RS 86abbf8f console_host_keys): short type (cloud-init genkeytypes) and its OpenSSH algorithm;
        # ed25519 / ecdsa only, the same algorithm policy as target_prereq.authorized_keys (no rsa, no dss)
        host_key_type: '^(ed25519|ecdsa)$'
        key_algorithm: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521))$'
        console_begin: '^-----BEGIN [A-Z][A-Z ]*[A-Z]-----$'   # a cloud-init keys-to-console block marker
        console_end: '^-----END [A-Z][A-Z ]*[A-Z]-----$'
        # reserved OUTPUT name families (reserved_output_patterns below): RS guest task vars / registers / facts, and the
        # route observation runner's rh_obs_* names
        reserved_guest_vars: '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$'
        reserved_obs_vars: '^_?rh_obs_[A-Za-z0-9_]+$'
        # F05-S2 (spec.yml P5 names_family; generate_entries.yml :70-72 names this registry family): every rh_eg_* /
        # _rh_eg_* name of the entry-generation consumer. The exact names reserved_outputs :2761-2771 lists stay.
        reserved_entry_gen_vars: '^_?rh_eg_[A-Za-z0-9_]+$'
        # B-graph transfer / prerequisite families (codex-tick333 lifecycle-prefix decisions; B proposal 2a28228a hunk A;
        # MAIN relay): every tr_* / _tr_* name of testing/e2e/transfer and every tp_* / _tp_* name of
        # testing/remote_harness/target_prereq.yml + tasks/prereq_*.yml. B's refuse_reserved_families.yml refuses
        # RESERVED-FAMILY-REGISTRY until reserved_output_patterns names both. (reserved_reclaim_vars is HELD for codex.)
        reserved_transfer_vars: '^_?tr_[A-Za-z0-9_]+$'
        reserved_prereq_vars: '^_?tp_[A-Za-z0-9_]+$'
        # J-KEY (B-graph c1-jkey-proposal JK-4; MAIN relay): every jk_* / _jk_* name of testing/e2e/target_prereq/
        # owner_key.yml + tasks/*.yml (the bare derived name jk is an exact reserved_outputs entry). B's family guard
        # and owner_key.yml's entry assert refuse until reserved_output_patterns names it (atomic join).
        reserved_owner_key_vars: '^_?jk_[A-Za-z0-9_]+$'
        # RUN BINDING (B render entry testing/e2e/inventory_binding/render_run_binding.yml; C1 hunk 2 MAIN relay): every
        # rb_* / _rb_* name the render entry derives (facts, registers, task vars, macro inputs). Its inline assert and
        # B's family guard refuse a supplied member (extra-vars / inventory outrank derivations).
        reserved_rb_vars: '^_?rb_[A-Za-z0-9_]+$'
        # PREPARATION (C1 hunk 4, P-x; route tasks/prepare.yml :30-41 / admit_preparation.yml :21-28 proposal): every
        # rh_prep_* / _rh_prep_* name the preparation phase derives (facts, registers, loop vars rh_prep_img / rh_prep_pkg).
        # The route's inline asserts and B's family guard refuse a supplied member. The INPUT host var
        # preparation.root_var (rh_preparation_root) is NOT a member (no '_' after 'rh_prep').
        reserved_prep_vars: '^_?rh_prep_[A-Za-z0-9_]+$'
        # PREPARATION MEASUREMENT (route-r4b; tasks/measure_controller_tools.yml + templates/measurement_record.j2
        # macros/measurement.j2 template_vars; acquire.yml selector gate): every rh_meas_* / _rh_meas_* name the
        # measurement derives (facts, registers, task vars). Its inline family guard refuses a supplied member; the
        # INPUT host vars preparation_measurement.mode_var / root_var (rh_measurement_*) are NOT members.
        reserved_meas_vars: '^_?rh_meas_[A-Za-z0-9_]+$'
        # CONTROLLER PREREQUISITE (route-r4b; testing/remote_harness/controller_prereq.yml): every rh_cpq_* / _rh_cpq_*
        # name the privileged prerequisite entry derives. Its inline family guard (both plays) refuses a supplied member;
        # the INPUT controller_prerequisite.record_var (rh_prereq_record) is NOT a member.
        reserved_cpq_vars: '^_?rh_cpq_[A-Za-z0-9_]+$'
        # SHARED BINDING-RECEIPT ADMISSION (route-r4d; testing/remote_harness/tasks/admit_binding_receipt.yml): its registers
        # and task vars _rh_rcpt_*. Its include parameters / outputs rh_rcpt_* are EXACT reserved_outputs (N-G3), not members.
        reserved_rcpt_vars: '^_rh_rcpt_[A-Za-z0-9_]+$'
        # one BOUNDED path segment (J-KEY owner_key.name_regex, byte-identical): 1..64 of [A-Za-z0-9._-], never a
        # leading '.', '_' or '-' (so never '.' / '..'), never '/'
        bounded_segment: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      contracts:
        # UV-ADDED FILES (C1-UV-ADDED-FILES, codex-d649-runtime-refusal-repair-20260924-235616; route owns the
        # declaration and the seed validator, G the regression controls): uv 0.12.18 adds files to the installed Python
        # tree beyond the independent unpack and the declared uv-patched files (BUILD, lib/python3.13/EXTERNALLY-MANAGED).
        # python.uv_added_files declares them as {rel, sha256} rows, rel RELATIVE TO python.installed_rel (the same base
        # as uv_patched_rel). Refused at resolve: a missing or non-list value; an entry whose keys are not exactly
        # {rel, sha256}; a sha256 not 64 lowercase hex; a rel not a normalized relative path; duplicate or nested
        # rels; a rel equal to / an ancestor of / a descendant of a uv_patched_rel entry or of the interpreter
        # (interpreter_rel rebased onto installed_rel, i.e. bin/python3.13). An empty list is admitted (uv adds
        # nothing: the strictest declaration; the runtime verify then refuses any addition). The REFERENCES
        # installed_rel, every uv_patched_rel entry and interpreter_rel must themselves fully match rel_path
        # (ref_pattern; codex 001124) before any comparison -- also with an empty list; never normalized away.
        python_uv_added_files:
          root: controller.bootstrap.python
          checks:
            - {path: uv_added_files, records: {fields: {rel: rel_path, sha256: sha256_hex}}}
            - {path: uv_added_files, rel_disjoint: {field: rel, ref_pattern: rel_path, from: [uv_patched_rel], from_under: {base: installed_rel, paths: [interpreter_rel]}}}
        # GUEST LIFECYCLE POLICY (GRAPH-SHARED-CONTRACT, codex-tick304; RS proposal .scratchpad-14bbf94b/RS/
        # guest-policy-proposal.yml sha256 a51cc226 (supersedes 671e5ede), A1 shape + B1 cloud_init / lifecycle leaves; consumer testing/e2e/guest/guest.yml + tasks/{admit,
        # provision,verify,retire}.yml): remote_harness.guest is ONE section of the resolved policy (rh.guest), declared by
        # the profile, never read raw and never merged at runtime. Admitted when present (inert until the profile declares
        # it). EXACT key set (key_set): every leaf is typed here; `allocation` is the one optional member (a hypervisor
        # target scope's own override; absent on the controller scope). NOT keys of this section (one authority each):
        # hypervisor_group (the ONE declared group name is controller.bootstrap.inventory.role_groups.hypervisors,
        # required below while guest is declared), allocation_fields (the allocation key set is contract
        # guest_allocation), the RUNTIME lifecycle record's values (uuid, generation, endpoint, host keys: observations).
        # tools maps a lifecycle role to the NAME of a controller.bootstrap.os_tools entry required_by guest (path and
        # identity come from the one executable registry, per host).
        guest_lifecycle:
          root: guest
          when_present: guest
          checks:
            - {path: '', key_set: {required: [schema_version, modes, tools, kvm_device, proc_meminfo, proc_root, uuid_source,
                                              linger_dir, boot_timeout_s, endpoint_timeout_s, layout, lease, recovery,
                                              preserved_physical_prefixes, unit, qemu, cloud_init, record, refusals],
                                   optional: [allocation]}}
            - {path: schema_version, enum: [1]}
            - {at: controller.bootstrap.inventory.role_groups.hypervisors, pattern: var_name}
            - {path: modes, keys: [var, allowed]}
            - {path: modes.var, pattern: var_name}
            - {path: modes.var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: modes.allowed, enum: [[provision, verify, retire]]}
            # C1-GUEST-TOOL-ROLES (codex-tick328, MEDIUM): the EXACT logical role set the consumer uses (RS admit.yml asserts
            # the same set; RS proposal B1_registry.contract_delta_32d26c0d) -- a missing, empty or partial map refuses;
            # each role names a declared executable required_by guest (path / identity: the one registry, per host).
            # RS FINAL delta tick336: 11 roles, + env (fence: env --chdir=<epoch>/<live_dir> refuses to exec once the
            # epoch's live token is revoked) + flock (fence: the storage-root lock held through the whole command); both
            # name the EXISTING os_tools entries env / flock, whose required_by the route extends to [seed, guest]
            - {path: tools, keys: [cloud_localds, df, env, flock, mkdir, mv, qemu_img, qemu_system, systemctl, systemd_run, timeout]}
            - {path: tools, each: true, subject: scalar, within: [controller.bootstrap.os_tools], having: {field: required_by, contains: guest}}
            - {path: kvm_device, pattern: abs_path}
            - {path: proc_meminfo, pattern: abs_path}
            - {path: uuid_source, pattern: abs_path}
            - {path: linger_dir, pattern: abs_path}
            - {path: proc_root, pattern: abs_path}
            - {path: boot_timeout_s, int_range: {min: 1}}
            - {path: endpoint_timeout_s, int_range: {min: 1}}
            - {path: layout, keys: [bases_dir, runs_dir, preserved_dir, claim_prefix, epoch_partial_infix, run_files, dir_mode, file_mode]}
            - {path: layout.claim_prefix, pattern: hidden_prefix}
            - {path: layout.run_files, keys: [os_disk, data_disk, seed, user_data, meta_data, console, qmp, record,
                                              os_disk_partial, data_disk_partial, seed_partial]}
            - {path: layout.run_files.os_disk_partial, pattern: partial_file}
            - {path: layout.run_files.data_disk_partial, pattern: partial_file}
            - {path: layout.run_files.seed_partial, pattern: partial_file}
