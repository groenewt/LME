            - {path: probe.argv, enum: [['{bound.tool}', '{bound.flags.kill_after}', '{bound.kill_after_seconds}', '{bound.flags.signal}', '{bound.signal}', '{bound.seconds}', '{tool}', '{flags}', '{conflict_flag}', '{conflict_status}', '{subject}', '{command_tool}']]}
