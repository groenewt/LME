      distinct_across_targets: [guest.allocation.run_id, guest.allocation.name]
    # required_lists (GRAPH-SHARED-CONTRACT, codex-tick304): further declared logical package lists that, WHEN DECLARED,
    # need a mapping in every os family exactly like `required` (the target prerequisite's hypervisor packages).
    package_mapping: {families: packages.by_os_family, required: packages.required, required_lists: [controller.bootstrap.target_prereq.packages.hypervisor_required]}
    inventory_var_path: controller.bootstrap.inventory
    inventory_vars: {root_var: lme_toolchain_root, owner_var: lme_toolchain_owner}
    # LI-MAIN-1 (B-OD-09 b, codex-tick497) + LI-03: RESOLVED projections the loader (_rh_project_policy) writes into a copy of
    # the admitted policy after contract admission and before policy_sha256; the authored node never carries `to`.
    # parts are ordered: to = [<policy node at in>[<at.from.key>] ...]. receipt_loader_path: the loader-source receipt
    # selector names the record's members container, the declared loader member and the observed-digest field; the
    # VALUE stays the pre-execution rh_src_admission fact (admit_binding_receipt walks var + path); path_from membership
    # is checked by contract run_binding.
    # LI-03 (B-OD-10 a, codex-tick461 C1-R5P-4): receipt_roles resolves the four overlapping roles from R4
    # binding_admission.fields through run_binding.receipt_role_fields (role -> fields key); the authored receipt_roles
    # holds only the producer-only roles. policy_partitions.receipt_ownership: the resolved receipt_roles values,
    # the receipt_bindings keys and history.key are pairwise disjoint and cover receipt_keys exactly.
    policy_projections:
      receipt_roles:
        kind: lookup_merge
        after: []
        at: controller.bootstrap.run_binding
        from: receipt_role_fields
        to: receipt_roles
        source: controller.bootstrap.binding_admission.fields
