        env_name: '^[A-Z_][A-Z0-9_]*$'
        var_name: '^[a-z_][a-z0-9_]*$'
        refusal_code: '^RH-[A-Z0-9]+(-[A-Z0-9]+)*$'
        mode_word: '^[a-z]+(-[a-z]+)*$'
        rel_segment: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
        file_mode: '^0[0-7]{3}$'
        lock_mode: '^0[0-7][0145][0145]$'          # never group/other-writable (lock_file.existing refuses those)
        dir_mode: '^[0-7]{3,4}$'                    # stat %a form
        uid_rule: '^/[^{}]*\{uid\}[^{}]*$'          # absolute, exactly one {uid} placeholder
        literal_separator: '^[^\n\\/.\[\]()*+?{}|^$]+$'   # composed literally into ERE and sed: no metacharacter
        abs_word: '^/\S*$'                          # absolute and ONE whitespace-free word (a #! interpreter path)
        sha256_hex: '^[0-9a-f]{64}$'                # a sha256 digest: exactly 64 LOWERCASE hex characters
        # a NORMALIZED relative path (UV-REL-NAMING, codex 001124): '/'-joined components, each one or more of ASCII
        # letters, digits, '.', '_', '-' (a LEADING '_', '.' or '-' is admitted: _sysconfigdata..., .uv-state, -x) and
        # never exactly '.' or '..' (the per-component lookahead). Refused: absolute, an empty component (//), a
        # trailing slash, a '.' / '..' component (traversal), a backslash or any other separator, whitespace and
        # control characters. The ONE normalized-relative contract of the uv files AND of their references
        # (installed_rel, uv_patched_rel, interpreter_rel via rel_disjoint ref_pattern).
        rel_path: '^(?!\.\.?(?:/|$))[A-Za-z0-9._-]+(?:/(?!\.\.?(?:/|$))[A-Za-z0-9._-]+)*$'
        # GRAPH-SHARED-CONTRACT (codex-tick304 / tick307): patterns of the guest carrier, the observation job binding and
        # the declared target inputs (host_scope.target_inputs). An ABSOLUTE normalized path: '/'-joined components as
        # rel_path (plus '+'), never '/' alone, never a '.' / '..' / empty component, no trailing slash.
        abs_path: '^/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+(?:/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+)*$'
        abs_mount: '^/(?:(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+(?:/(?!\.\.?(?:/|$))[A-Za-z0-9._+-]+)*)?$'   # abs_path or '/' itself (a mount point)
        account_name: '^[a-z_][a-z0-9_-]{0,31}$'   # a POSIX account name (useradd NAME_REGEX default, <= 32 characters)
        package_class: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
        unit_glob: '^[A-Za-z0-9@_.:*-]+$'          # a systemd unit-name glob (observation host input)
        unit_name: '^[A-Za-z0-9@_.:-]+[.](service|socket|timer|mount|target|path|slice|scope)$'   # one exact systemd unit name
        guest_run_id: '^[a-z0-9][a-z0-9-]{2,39}$'  # owned-resource identity: run dir, unit and record are keyed by it
        guest_hostname: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$'   # one DNS label (RFC 1123), never ending in '-'
        qcow2_file: '^[A-Za-z0-9_+-][A-Za-z0-9._+-]*[.]qcow2$'   # one file name (no '/', no leading '.')
        sha512_hex: '^[0-9a-f]{128}$'
        guest_refusal_code: '^GUEST-[A-Z0-9]+(-[A-Z0-9]+)*$'
        guest_unit_name: '^[a-z0-9-]*\{run_id\}[a-z0-9-]*[.]service$'   # exactly one {run_id} placeholder
        abs_dir_prefix: '^/(?:(?!\.\.?/)[A-Za-z0-9._+-]+/)+$'   # an absolute directory PREFIX: normalized, trailing '/'
        qemu_word: '^[a-z0-9][a-z0-9._-]*$'        # one QEMU option value (q35, host, virtio-blk-pci)
        serial_prefix: '^[a-z0-9][a-z0-9-]{0,11}$'  # a virtio disk serial prefix (serial <= 20 bytes with the run suffix)
        fs_label: '^[a-z0-9][a-z0-9-]{0,15}$'      # an ext4 filesystem label (<= 16 bytes)
        schema_tag: '^[a-z0-9]+(-[a-z0-9]+)*/v?[0-9]+$'   # a record schema tag (lme-guest-record/1, lme-target-prereq/v1)
        record_suffix: '^[.][a-z0-9]+([.-][a-z0-9]+)*[.]json$'
        gecos_text: '^[A-Za-z0-9][A-Za-z0-9 ()._-]{0,63}$'   # a passwd GECOS value: never ':' / ',' / newline
        # RS a51cc226 guest lifecycle leaves: a HIDDEN single-segment name or prefix (lease dir, broken-lease and claim
        # prefixes: never '.' / '..', never a '/'), a partial-file name, a mount-option list, a console marker word
        hidden_prefix: '^[.][a-z][a-z.-]*$'
        partial_file: '^[A-Za-z0-9][A-Za-z0-9._-]*[.]partial$'
        mount_options: '^[a-z0-9_.=-]+(,[a-z0-9_.=-]+)*$'
        marker_word: '^[A-Z0-9]+(-[A-Z0-9]+)*$'
        # RS FINAL contract delta (codex-tick335-336 contract-source verdict; RS proposal 91f9f744
        # B1_registry.FINAL_contract_delta_tick336): the lease /3 fence leaves' exact patterns, applied IN ADDITION to
        # the earlier (stronger-shaped) hidden_prefix / rel_segment / var_name checks -- no earlier closure is widened
        hidden_dash_prefix: '^\.[a-z-]+-$'         # lease epoch / stage prefixes, layout.epoch_partial_infix
        lower_word: '^[a-z]+$'                     # lease.live_dir (the live token every fenced command chdirs into)
        dash_prefix: '^[a-z-]+-$'                  # lease.revoked_prefix (<N>/<revoked_prefix><nonce>)
        lower_file: '^[a-z._-]+$'                  # lease holder / released file names
        guest_input_var: '^lme_guest_[a-z_]+$'     # a guest operator INPUT name (lease.break_var, lease.recover_var)
        service_name: '^[A-Za-z0-9@_.:-]+[.]service$'   # one exact systemd .service unit (B preserved dev-stack units)
        # guest host keys (RS 86abbf8f console_host_keys): short type (cloud-init genkeytypes) and its OpenSSH algorithm;
        # ed25519 / ecdsa only, the same algorithm policy as target_prereq.authorized_keys (no rsa, no dss)
        host_key_type: '^(ed25519|ecdsa)$'
        key_algorithm: '^(ssh-ed25519|ecdsa-sha2-nistp(256|384|521))$'
        console_begin: '^-----BEGIN [A-Z][A-Z ]*[A-Z]-----$'   # a cloud-init keys-to-console block marker
        console_end: '^-----END [A-Z][A-Z ]*[A-Z]-----$'
        # reserved OUTPUT name families (reserved_output_patterns below): RS guest task vars / registers / facts, and the
        # route observation runner's rh_obs_* names
        reserved_guest_vars: '^(gd|gg|gp|gt|g_[A-Za-z0-9_]+|_g_[A-Za-z0-9_]+)$'
        reserved_obs_vars: '^_?rh_obs_[A-Za-z0-9_]+$'
        # B-graph transfer / prerequisite families (codex-tick333 lifecycle-prefix decisions; B proposal 2a28228a hunk A;
        # MAIN relay): every tr_* / _tr_* name of testing/e2e/transfer and every tp_* / _tp_* name of
        # testing/remote_harness/target_prereq.yml + tasks/prereq_*.yml. B's refuse_reserved_families.yml refuses
        # RESERVED-FAMILY-REGISTRY until reserved_output_patterns names both. (reserved_reclaim_vars is HELD for codex.)
        reserved_transfer_vars: '^_?tr_[A-Za-z0-9_]+$'
        reserved_prereq_vars: '^_?tp_[A-Za-z0-9_]+$'
        # J-KEY (B-graph c1-jkey-proposal JK-4; MAIN relay): every jk_* / _jk_* name of testing/e2e/target_prereq/
        # owner_key.yml + tasks/*.yml (the bare derived name jk is an exact reserved_outputs entry). B's family guard
        # and owner_key.yml's entry assert refuse until reserved_output_patterns names it (atomic join).
        reserved_owner_key_vars: '^_?jk_[A-Za-z0-9_]+$'
        # RUN BINDING (B render entry testing/e2e/inventory_binding/render_run_binding.yml; C1 hunk 2 MAIN relay): every
        # rb_* / _rb_* name the render entry derives (facts, registers, task vars, macro inputs). Its inline assert and
        # B's family guard refuse a supplied member (extra-vars / inventory outrank derivations).
        reserved_rb_vars: '^_?rb_[A-Za-z0-9_]+$'
        # PREPARATION (C1 hunk 4, P-x; route tasks/prepare.yml :30-41 / admit_preparation.yml :21-28 proposal): every
        # rh_prep_* / _rh_prep_* name the preparation phase derives (facts, registers, loop vars rh_prep_img / rh_prep_pkg).
        # The route's inline asserts and B's family guard refuse a supplied member. The INPUT host var
        # preparation.root_var (rh_preparation_root) is NOT a member (no '_' after 'rh_prep').
        reserved_prep_vars: '^_?rh_prep_[A-Za-z0-9_]+$'
        # one BOUNDED path segment (J-KEY owner_key.name_regex, byte-identical): 1..64 of [A-Za-z0-9._-], never a
        # leading '.', '_' or '-' (so never '.' / '..'), never '/'
        bounded_segment: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'
      contracts:
        # UV-ADDED FILES (C1-UV-ADDED-FILES, codex-d649-runtime-refusal-repair-20260924-235616; route owns the
        # declaration and the seed validator, G the regression controls): uv 0.12.18 adds files to the installed Python
        # tree beyond the independent unpack and the declared uv-patched files (BUILD, lib/python3.13/EXTERNALLY-MANAGED).
        # python.uv_added_files declares them as {rel, sha256} rows, rel RELATIVE TO python.installed_rel (the same base
        # as uv_patched_rel). Refused at resolve: a missing or non-list value; an entry whose keys are not exactly
        # {rel, sha256}; a sha256 not 64 lowercase hex; a rel not a normalized relative path; duplicate or nested
        # rels; a rel equal to / an ancestor of / a descendant of a uv_patched_rel entry or of the interpreter
        # (interpreter_rel rebased onto installed_rel, i.e. bin/python3.13). An empty list is admitted (uv adds
        # nothing: the strictest declaration; the runtime verify then refuses any addition). The REFERENCES
        # installed_rel, every uv_patched_rel entry and interpreter_rel must themselves fully match rel_path
        # (ref_pattern; codex 001124) before any comparison -- also with an empty list; never normalized away.
        python_uv_added_files:
          root: controller.bootstrap.python
          checks:
            - {path: uv_added_files, records: {fields: {rel: rel_path, sha256: sha256_hex}}}
            - {path: uv_added_files, rel_disjoint: {field: rel, ref_pattern: rel_path, from: [uv_patched_rel], from_under: {base: installed_rel, paths: [interpreter_rel]}}}
        # GUEST LIFECYCLE POLICY (GRAPH-SHARED-CONTRACT, codex-tick304; RS proposal .scratchpad-14bbf94b/RS/
        # guest-policy-proposal.yml sha256 a51cc226 (supersedes 671e5ede), A1 shape + B1 cloud_init / lifecycle leaves; consumer testing/e2e/guest/guest.yml + tasks/{admit,
        # provision,verify,retire}.yml): remote_harness.guest is ONE section of the resolved policy (rh.guest), declared by
        # the profile, never read raw and never merged at runtime. Admitted when present (inert until the profile declares
        # it). EXACT key set (key_set): every leaf is typed here; `allocation` is the one optional member (a hypervisor
        # target scope's own override; absent on the controller scope). NOT keys of this section (one authority each):
        # hypervisor_group (the ONE declared group name is controller.bootstrap.inventory.role_groups.hypervisors,
        # required below while guest is declared), allocation_fields (the allocation key set is contract
        # guest_allocation), the RUNTIME lifecycle record's values (uuid, generation, endpoint, host keys: observations).
        # tools maps a lifecycle role to the NAME of a controller.bootstrap.os_tools entry required_by guest (path and
        # identity come from the one executable registry, per host).
        guest_lifecycle:
          root: guest
          when_present: guest
          checks:
            - {path: '', key_set: {required: [schema_version, modes, tools, kvm_device, proc_meminfo, proc_root, uuid_source,
                                              linger_dir, boot_timeout_s, endpoint_timeout_s, layout, lease, recovery,
                                              preserved_physical_prefixes, unit, qemu, cloud_init, record, refusals],
                                   optional: [allocation]}}
            - {path: schema_version, enum: [1]}
            - {at: controller.bootstrap.inventory.role_groups.hypervisors, pattern: var_name}
            - {path: modes, keys: [var, allowed]}
            - {path: modes.var, pattern: var_name}
            - {path: modes.var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: modes.allowed, enum: [[provision, verify, retire]]}
            # C1-GUEST-TOOL-ROLES (codex-tick328, MEDIUM): the EXACT logical role set the consumer uses (RS admit.yml asserts
            # the same set; RS proposal B1_registry.contract_delta_32d26c0d) -- a missing, empty or partial map refuses;
            # each role names a declared executable required_by guest (path / identity: the one registry, per host).
            # RS FINAL delta tick336: 11 roles, + env (fence: env --chdir=<epoch>/<live_dir> refuses to exec once the
            # epoch's live token is revoked) + flock (fence: the storage-root lock held through the whole command); both
            # name the EXISTING os_tools entries env / flock, whose required_by the route extends to [seed, guest]
            - {path: tools, keys: [cloud_localds, df, env, flock, mkdir, mv, qemu_img, qemu_system, systemctl, systemd_run, timeout]}
            - {path: tools, each: true, subject: scalar, within: [controller.bootstrap.os_tools], having: {field: required_by, contains: guest}}
            - {path: kvm_device, pattern: abs_path}
            - {path: proc_meminfo, pattern: abs_path}
            - {path: uuid_source, pattern: abs_path}
            - {path: linger_dir, pattern: abs_path}
            - {path: proc_root, pattern: abs_path}
            - {path: boot_timeout_s, int_range: {min: 1}}
            - {path: endpoint_timeout_s, int_range: {min: 1}}
            - {path: layout, keys: [bases_dir, runs_dir, preserved_dir, claim_prefix, epoch_partial_infix, run_files, dir_mode, file_mode]}
            - {path: layout.claim_prefix, pattern: hidden_prefix}
            - {path: layout.run_files, keys: [os_disk, data_disk, seed, user_data, meta_data, console, qmp, record,
                                              os_disk_partial, data_disk_partial, seed_partial]}
            - {path: layout.run_files.os_disk_partial, pattern: partial_file}
            - {path: layout.run_files.data_disk_partial, pattern: partial_file}
            - {path: layout.run_files.seed_partial, pattern: partial_file}
            # C1-GUEST-RUN-FILE-ALIASES (codex-tick328, MEDIUM): EVERY run-file role value (finals, partials, record,
            # console, qmp, seed, user/meta data) is distinct from every other -- one file per role, never an alias
            # (os_disk_partial == os_disk refuses). No basename is pinned.
            - {path: layout.run_files, values_distinct: true}
            # LEASE /3 (codex GUEST-LIFECYCLE-SERIALIZATION + GUEST-LEASE-SUCCESSOR + tick331 fence; RS tasks/lease.yml,
            # proposal 7af38949 B1_registry.FINAL_contract_delta_tick336 (supersedes 91f9f744; tick339-340 adds
            # recover_var / evidence_prefix / holder recovered / 30 ops), superseding the v2 shape of 32d26c0d): an epoch
            # <storage_root>/<epoch_prefix><N> appears ONLY complete, by the fenced no-replace rename of the acquirer's
            # staging <stage_prefix><nonce> (holder_file + <live_dir>), and carries a RECORDED term (holder_fields incl.
            # term_end_epoch = acquired_epoch + ttl_s) and a live token; the successor (or the holder on release) revokes
            # it by renaming <N>/<live_dir> to <N>/<revoked_prefix><nonce>; released_file is written once by the holder
            # into its own epoch. Every fenced command runs under flock --wait lock_wait_s --conflict-exit-code busy_rc
            # (typed GUEST-LEASE-LOST; route convention 75). ttl_s strictly exceeds boot + console host-key wait +
            # endpoint + 30 * (lock_wait + step + kill_after) + margin (int_gt_sum; 30 = the declared operations of the
            # longest path, a fresh provision incl. an ownership-proven recovery: RS lifecycle_leaves.constraint).
            # break_var and recover_var are operator INPUT names: never a reserved / resolver OUTPUT name or family
            # (guest family incl.). evidence_prefix names the recovery observation file and moved-aside stagings. The
            # prefix checks are equality only (distinct_from): "neither a prefix of the other" is not a check kind
            # (consumer-enforced).
            - {path: lease, keys: [schema, epoch_prefix, stage_prefix, live_dir, revoked_prefix, lock_wait_s, busy_rc, holder_file,
                                   holder_fields, released_file, released_fields, break_var, recover_var, evidence_prefix,
                                   ttl_s, step_s, kill_after_s, margin_s]}
            - {path: lease.schema, pattern: schema_tag}
            - {path: lease.schema, enum: [lme-guest-lease/3]}
            - {path: lease.schema, distinct_from: [record.schema]}
            - {path: lease.epoch_prefix, pattern: hidden_prefix}
            - {path: lease.epoch_prefix, pattern: hidden_dash_prefix}
            - {path: lease.epoch_prefix, distinct_from: [layout.claim_prefix, lease.stage_prefix]}
            - {path: lease.stage_prefix, pattern: hidden_prefix}
            - {path: lease.stage_prefix, pattern: hidden_dash_prefix}
            - {path: lease.stage_prefix, distinct_from: [layout.claim_prefix, lease.epoch_prefix]}
            - {path: lease.live_dir, pattern: lower_word}
            - {path: lease.live_dir, distinct_from: [lease.holder_file, lease.released_file]}
            - {path: lease.revoked_prefix, pattern: dash_prefix}
            - {path: lease.revoked_prefix, distinct_from: [lease.live_dir]}
            - {path: lease.lock_wait_s, int_range: {min: 1, max: 300}}
            - {path: lease.busy_rc, int_range: {min: 1, max: 125}}
            - {path: lease.holder_file, pattern: rel_segment}
            - {path: lease.holder_file, pattern: lower_file}
            - {path: lease.released_file, pattern: rel_segment}
            - {path: lease.released_file, pattern: lower_file}
            - {path: lease.released_file, distinct_from: [lease.holder_file]}
            # holder / released marker shapes: EXACT sets (distinct strings, each a member, every member present)
            - {path: lease.holder_fields, strings: {nonempty: true, distinct: true}}
            - {path: lease.holder_fields, each: true, enum: [acquired_epoch, broke, epoch, hypervisor, mode, nonce, owner_uid, recovered, run_id, schema, term_end_epoch, ttl_s]}
            - {path: lease.holder_fields, includes: [acquired_epoch, broke, epoch, hypervisor, mode, nonce, owner_uid, recovered, run_id, schema, term_end_epoch, ttl_s]}
            - {path: lease.released_fields, strings: {nonempty: true, distinct: true}}
            - {path: lease.released_fields, each: true, enum: [epoch, nonce, released_epoch, schema]}
            - {path: lease.released_fields, includes: [epoch, nonce, released_epoch, schema]}
            - {path: lease.break_var, pattern: var_name}
            - {path: lease.break_var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: lease.break_var, pattern: guest_input_var}
            # distinct from recovery.var: judged by recovery.var's own distinct_from [modes.var, lease.break_var] below
            - {path: lease.break_var, distinct_from: [modes.var]}
            # recover_var (tick339-340 ownership-proven recovery; explicit token <entry>:<dev>:<inode>): an INPUT, as break_var
            - {path: lease.recover_var, pattern: var_name}
            - {path: lease.recover_var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: lease.recover_var, pattern: guest_input_var}
            - {path: lease.recover_var, distinct_from: [modes.var, recovery.var, lease.break_var]}
            - {path: lease.step_s, int_range: {min: 1}}
            - {path: lease.kill_after_s, int_range: {min: 1}}
            - {path: lease.margin_s, int_range: {min: 0}}
            - {path: lease.ttl_s, int_range: {min: 1}}
            - {path: lease.ttl_s, int_gt_sum: [{path: boot_timeout_s, times: 1}, {path: cloud_init.console_host_keys.wait_s, times: 1},
                                               {path: endpoint_timeout_s, times: 1}, {path: lease.lock_wait_s, times: 30},
                                               {path: lease.step_s, times: 30}, {path: lease.kill_after_s, times: 30},
                                               {path: lease.margin_s, times: 1}]}
            # RS FINAL delta tick336 (fence): every MODULE write lands only in <file><layout.epoch_partial_infix><N> (N =
            # the writer's lease epoch); a fenced mv publishes it. The infix is none of the other hidden prefixes. Judged
            # AFTER the lease block (it references lease leaves; a malformed lease refuses on its own check first).
            - {path: layout.epoch_partial_infix, pattern: hidden_prefix}
            - {path: layout.epoch_partial_infix, pattern: hidden_dash_prefix}
            - {path: layout.epoch_partial_infix, distinct_from: [layout.claim_prefix, lease.epoch_prefix, lease.stage_prefix]}
            # evidence_prefix (tick339-340): observation file + moved-aside stagings (never deleted); none of the other
            # hidden prefixes. Judged after epoch_partial_infix (it references it).
            - {path: lease.evidence_prefix, pattern: hidden_prefix}
            - {path: lease.evidence_prefix, pattern: hidden_dash_prefix}
            - {path: lease.evidence_prefix, distinct_from: [layout.claim_prefix, lease.epoch_prefix, lease.stage_prefix, layout.epoch_partial_infix]}
            # SAME-GENERATION RECOVERY (codex GUEST-SAME-GENERATION-RECOVERY; RS provision_stages.yml S7): var is an
            # explicit provision INPUT (never an output name / family, never another input's name); a loaded unit counts
            # as gone only in these active states; the previous console is kept under console_evidence_infix
            - {path: recovery, keys: [var, gone_active_states, console_evidence_infix]}
            - {path: recovery.var, pattern: var_name}
            - {path: recovery.var, not_in: [reserved_outputs, resolver_outputs]}
            - {path: recovery.var, distinct_from: [modes.var, lease.break_var]}
            - {path: recovery.gone_active_states, strings: {nonempty: true, distinct: true}}
            - {path: recovery.gone_active_states, each: true, enum: [failed, inactive]}
            - {path: recovery.console_evidence_infix, pattern: rel_segment}
            - {path: layout.bases_dir, pattern: rel_segment}
            - {path: layout.runs_dir, pattern: rel_segment}
            - {path: layout.preserved_dir, pattern: rel_segment}
            - {path: layout.runs_dir, distinct_from: [layout.bases_dir, layout.preserved_dir]}
            - {path: layout.preserved_dir, distinct_from: [layout.bases_dir]}
            - {path: layout.run_files, key_pattern: var_name}
            - {path: layout.run_files, each: true, pattern: rel_segment}
            - {path: layout.dir_mode, enum: ['0700']}
            - {path: layout.file_mode, enum: ['0600']}
            - {path: preserved_physical_prefixes, strings: {nonempty: true, distinct: true}}
            - {path: preserved_physical_prefixes, each: true, pattern: abs_dir_prefix}
            - {path: unit, keys: [name, properties]}
            - {path: unit.name, pattern: guest_unit_name}
            - {path: unit.properties, strings: {nonempty: true, distinct: true}}
            - {path: qemu, keys: [accel, machine, cpu, display, net, disk_device, data_serial_prefix, os_serial_prefix]}
            - {path: qemu.accel, enum: [kvm]}
            - {path: qemu.display, enum: [none]}
            - {path: qemu.machine, pattern: qemu_word}
            - {path: qemu.cpu, pattern: qemu_word}
            - {path: qemu.disk_device, pattern: qemu_word}
            - {path: qemu.net, keys: [mode, bind, guest_port, device]}
            - {path: qemu.net.mode, enum: [user]}
            - {path: qemu.net.bind, enum: ['127.0.0.1']}
            - {path: qemu.net.guest_port, int_range: {min: 1, max: 65535}}
            - {path: qemu.net.device, pattern: qemu_word}
            - {path: qemu.data_serial_prefix, pattern: serial_prefix}
            - {path: qemu.os_serial_prefix, pattern: serial_prefix}
            - {path: qemu.data_serial_prefix, distinct_from: [qemu.os_serial_prefix]}
            # CLOUD-INIT (codex GUEST-CLOUDINIT-DECLARATION; rendered ONLY through RS templates/macros/cloud_init.j2): every
            # value typed; the security pins are closed enums (lock_passwd true, pwauth false, deletekeys true, overwrite
            # false); host-key types are ed25519 / ecdsa only (the authorized-key policy refuses rsa / dss as well); the
            # console fingerprint block is cloud-init's own fixed literal format (pinned, not configurable).
            - {path: cloud_init, keys: [privileged_account, ssh, data_fs, identity_check, console_fingerprints, console_host_keys]}
            - {path: cloud_init.privileged_account, keys: [name, disable_root, lock_passwd]}
            - {path: cloud_init.privileged_account.name, pattern: account_name}
            - {path: cloud_init.privileged_account.disable_root, enum: [false, true]}
            - {path: cloud_init.privileged_account.lock_passwd, enum: [true]}
            - {path: cloud_init.ssh, keys: [pwauth, deletekeys, genkeytypes]}
            - {path: cloud_init.ssh.pwauth, enum: [false]}
            - {path: cloud_init.ssh.deletekeys, enum: [true]}
            - {path: cloud_init.ssh.genkeytypes, strings: {nonempty: true, distinct: true}}
            - {path: cloud_init.ssh.genkeytypes, each: true, enum: [ed25519, ecdsa]}
            - {path: cloud_init.data_fs, keys: [label, filesystem, partition, overwrite, mount, mount_options, dump, pass, device_prefix]}
            - {path: cloud_init.data_fs.label, pattern: fs_label}
            - {path: cloud_init.data_fs.filesystem, enum: [ext4, xfs]}
            - {path: cloud_init.data_fs.partition, enum: [none]}
            - {path: cloud_init.data_fs.overwrite, enum: [false]}
            - {path: cloud_init.data_fs.mount, pattern: abs_path}
            - {path: cloud_init.data_fs.mount_options, pattern: mount_options}
            - {path: cloud_init.data_fs.dump, enum: ['0', '1']}
            - {path: cloud_init.data_fs.pass, enum: ['0', '1', '2']}
            - {path: cloud_init.data_fs.device_prefix, pattern: abs_path}
            - {path: cloud_init.identity_check, keys: [shell, source, marker, console, on_mismatch]}
            - {path: cloud_init.identity_check.shell, enum: [sh]}
            - {path: cloud_init.identity_check.source, pattern: abs_path}
            - {path: cloud_init.identity_check.marker, pattern: marker_word}
            - {path: cloud_init.identity_check.console, pattern: abs_path}
            - {path: cloud_init.identity_check.on_mismatch, enum: [[poweroff]]}
            - {path: cloud_init.console_fingerprints, keys: [begin_marker, end_marker, line_regex]}
            # markers: typed (BEGIN / END form), pairwise distinct across both blocks (a marker names ONE block); the line
            # regexes are pinned literals (the consumers index their capture groups; a group count is not a check kind)
            - {path: cloud_init.console_fingerprints.begin_marker, pattern: console_begin}
            - {path: cloud_init.console_fingerprints.end_marker, pattern: console_end}
            - {path: cloud_init.console_fingerprints.line_regex, enum: ['([0-9]+) (SHA256:[A-Za-z0-9+/]+) .* \(([A-Z0-9-]+)\)\s*$']}
            # PUBLIC host-key block (RS 86abbf8f; OBSERVATIONS the privileged leg re-derives and binds). type_map: short
            # type -> OpenSSH algorithm, keys and values typed; it MUST COVER ssh.genkeytypes (every generated host-key
            # type has an algorithm) -- expressed by `within` (subject list) against the type_map keys; no new kind
            - {path: cloud_init.console_host_keys, keys: [begin_marker, end_marker, wait_s, line_regex, type_map]}
            - {path: cloud_init.console_host_keys.wait_s, int_range: {min: 1}}   # bounded S8 wait (GUEST-PUBLIC-KEY-COMPLETION)
            - {path: cloud_init.console_host_keys.begin_marker, pattern: console_begin}
            - {path: cloud_init.console_host_keys.end_marker, pattern: console_end}
            - {path: cloud_init.console_host_keys.begin_marker, distinct_from: [cloud_init.console_fingerprints.begin_marker]}
            - {path: cloud_init.console_host_keys.end_marker, distinct_from: [cloud_init.console_fingerprints.end_marker]}
            - {path: cloud_init.console_host_keys.line_regex, enum: ['^((ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521) ([A-Za-z0-9+/]+={0,3}))( [ -~]*)?$']}
            - {path: cloud_init.console_host_keys.type_map, key_pattern: host_key_type}
            - {path: cloud_init.console_host_keys.type_map, each: true, pattern: key_algorithm}
            - {path: cloud_init.ssh.genkeytypes, subject: list, within: [guest.cloud_init.console_host_keys.type_map]}
            - {path: record, keys: [schema, fields, states]}
            - {path: record.states, enum: [[claimed, starting, started, retired]]}
            - {path: record.schema, pattern: schema_tag}
            # RECORD VERSION (codex tick331; RS FINAL delta tick336, MAIN relay of RS 91f9f744): the producer writes only
            # /2 and every reader accepts only /2; any other version (/1, missing, future) is refused GUEST-RECORD-VERSION
            # before any shape check or effect and preserved byte-identical (no migration; consumer-enforced)
            - {path: record.schema, enum: [lme-guest-record/2]}
            - {path: record.fields, strings: {nonempty: true, distinct: true}}
            - {path: record.fields, each: true, pattern: var_name}
            # the recovery round's record members (the consumer compares record keys to this list)
            - {path: record.fields, includes: [lease_epoch, recoveries]}
            - {path: refusals, key_pattern: var_name}
            - {path: refusals, each: true, pattern: guest_refusal_code}
            # host keys (RS 86abbf8f; codex-tick318-321 (a)): the console host-key readback has its OWN declared refusal,
            # never folded into the endpoint refusal. Recovery round: disk identity and recovery have their own. Every
            # refusal code names ONE cause (values_distinct subsumes the pairwise distinct_from). The record version has
            # its own (RS FINAL delta tick336); the lease fence adds none (GUEST-LEASE-LOST / GUEST-LEASE-HELD reused);
            # an ownership-proven lease recovery refused / ambiguous has its own (tick339-340).
            - {path: refusals, has_keys: [endpoint, host_keys, disk_identity, recovery, record_version, lease_recovery]}
            - {path: refusals.host_keys, enum: [GUEST-HOST-KEYS]}
            - {path: refusals.disk_identity, enum: [GUEST-DISK-IDENTITY]}
            - {path: refusals.recovery, enum: [GUEST-RECOVERY]}
            - {path: refusals.record_version, enum: [GUEST-RECORD-VERSION]}
            - {path: refusals.lease_recovery, enum: [GUEST-LEASE-RECOVERY]}
            - {path: refusals, values_distinct: true}
        # GUEST ALLOCATION (per hypervisor; tunable_paths / extensible_paths / override_only_paths guest.allocation):
        # EXACTLY these keys, typed, from THAT host's override only (no default anywhere). Desired config only: a run
        # UUID, generation, endpoint address or host key is observed identity, never admitted here (exact keys). The
        # privileged guest account's authorized keys are a controller-side PATH REFERENCE (never key material in policy).
        # host_headroom_mib >= 2048 (codex: the minimum aggregate reservation). Capacity / MemAvailable >= memory_mib +
        # host_headroom_mib / KVM / base-image custody are RUNTIME admissions on the hypervisor (RS tasks/admit.yml).
        # run_id and name are distinct across the deployment's targets (host_scope.distinct_across_targets).
        guest_allocation:
          root: guest.allocation
          when_present: guest.allocation
          checks:
            - {path: '', keys: [run_id, name, vcpus, memory_mib, os_disk_gib, data_disk_gib, storage_root, storage_mount,
                                physical_reserve_gib, host_headroom_mib, forward_port, base_image, privileged_authorized_keys_file]}
            - {path: run_id, pattern: guest_run_id}
            - {path: name, pattern: guest_hostname}
            - {path: vcpus, int_range: {min: 1}}
            - {path: memory_mib, int_range: {min: 1024}}
            - {path: os_disk_gib, int_range: {min: 8}}
            - {path: data_disk_gib, int_range: {min: 1}}
            - {path: physical_reserve_gib, int_range: {min: 0}}
            - {path: host_headroom_mib, int_range: {min: 2048}}
            - {path: forward_port, int_range: {min: 1024, max: 65535}}
            - {path: storage_root, pattern: abs_path}
            - {path: storage_mount, pattern: abs_mount}
            - {path: storage_root, distinct_from: [storage_mount]}
            - {path: base_image, keys: [file, sha512]}
            - {path: base_image.file, pattern: qcow2_file}
            - {path: base_image.sha512, pattern: sha512_hex}
            - {path: privileged_authorized_keys_file, pattern: abs_path}
        # INVENTORY ROLE GROUPS (codex-graph-guest-security-prerequisite-decisions-20260925 (2)): the ONE declaration of
        # each role group NAME the inventory, the guest runner, the prerequisite play and the gate consume (hypervisors =
        # lme_hypervisors, replacing RS's lme_guest_hypervisors; telemetry_sources; workload = the Debian 13 guest). Names
        # only (membership is inventory); each distinct from the others and from the bootstrap target_group.
        inventory_role_groups:
          root: controller.bootstrap.inventory
          when_present: controller.bootstrap.inventory.role_groups
          checks:
            - {path: role_groups, keys: [hypervisors, telemetry_sources, workload]}
            - {path: role_groups, each: true, pattern: var_name}
            - {path: role_groups.hypervisors, distinct_from: [role_groups.telemetry_sources, role_groups.workload, target_group]}
            - {path: role_groups.telemetry_sources, distinct_from: [role_groups.workload, target_group]}
            - {path: role_groups.workload, distinct_from: [target_group]}
        # DECLARED TARGET INPUT ROLES (host_scope.target_inputs): a role that restates an existing inventory declaration
        # reads THAT variable (never a second name for one input): owner = inventory.owner_var, toolchain_root =
        # inventory.root_var, bundle_dir = inventory.bundle_var, owner_key / privileged_key =
        # connection_profiles.{owner,privileged}.key_var (PATH references; never read by the loader), owner_pubkey =
        # connection_profiles.owner.pubkey_var (B rev 2 J-KEY: the PATH of the owner key's public half). Every other role
        # (route obs_*, B prereq_*) is optional and admitted generically by _rh_target_inputs; a MAPPING-typed role is
        # not in the frozen contract (codex-tick315: bool / string / string_list), so B's work parent is four string roles.
        # REQUIRED-NESS is the declaration's own (frozen contract: a declared-required role missing on a target refuses;
        # an absent optional role is omitted). The contract does NOT force owner / toolchain_root required: the profile's
        # OWNER-ABSENT RULE (codex/MAIN r3h: inventory.owner {absent: ''}) binds an absent owner to '' at resolve and
        # refuses it at admit_transport before any target effect; resolve-time refusal of the same host would contradict
        # that decided rule and fail existing target resolves (C1's earlier enum [true] pin, withdrawn).
        target_input_roles:
          root: controller.bootstrap.inventory
          when_present: controller.bootstrap.inventory.target_inputs
          checks:
            - {path: target_inputs, has_keys: [owner, toolchain_root, bundle_dir, owner_key, privileged_key, owner_pubkey]}
            - {path: target_inputs.owner_pubkey.var, subject: scalar, within: [controller.bootstrap.inventory.connection_profiles.owner.pubkey_var]}
            - {path: target_inputs.owner.var, subject: scalar, within: [controller.bootstrap.inventory.owner_var]}
            - {path: target_inputs.toolchain_root.var, subject: scalar, within: [controller.bootstrap.inventory.root_var]}
            - {path: target_inputs.bundle_dir.var, subject: scalar, within: [controller.bootstrap.inventory.bundle_var]}
            - {path: target_inputs.owner_key.var, subject: scalar, within: [controller.bootstrap.inventory.connection_profiles.owner.key_var]}
            - {path: target_inputs.privileged_key.var, subject: scalar, within: [controller.bootstrap.inventory.connection_profiles.privileged.key_var]}
        # TARGET PREREQUISITE POLICY (codex-graph-guest-security-prerequisite-decisions-20260925 (1); B-graph proposal
        # testing/remote_harness/target_prereq.decl.yml REVISION 2 as READ sha256 06005861 (MAIN-relayed); consumer
        # testing/remote_harness/target_prereq.yml, MAIN-only privileged leg): remote_harness.controller.bootstrap.
        # target_prereq is ONE section of the resolved policy (rh.controller.bootstrap.target_prereq); the decl file is
        # proposal input only, never a raw-lookup authority beside rh. STRUCTURAL admission (exact keys, closed
        # vocabularies, references, hostile-probe regex checks). NOT keys of this section (one authority each):
        # inputs (-> inventory.{owner_var, root_var, bundle_var} and connection_profiles.{owner,privileged}.key_var /
        # owner.pubkey_var, read there), target_inputs (-> the roles of inventory.target_inputs; the loader binds them),
        # packages.source (rh.packages is the contract), hypervisor.group (-> inventory.role_groups.hypervisors),
        # linger.runtime_dir / bus_rel (-> target_bootstrap.user_manager.runtime_dir / bus). linger.tool and
        # owner_key.generator_tool NAME os_tools entries (no path here). Every mode regex must refuse group / other-
        # writable modes: STRUCTURALLY (mode_regex_domain: no admitted mode string carries 0022; codex-tick328). The endpoint's refused-exe regex and root-run ancestry program are pinned
        # literals (a registry change, serialized through C1). Cross-input relations (root == <work root>/<toolchain_rel>,
        # work parent == dirname(work root)) stay the consumer's pre-contact checks on the BOUND target inputs.
        target_prereq:
          root: controller.bootstrap.target_prereq
          when_present: controller.bootstrap.target_prereq
          checks:
            # REVISION 3 (B handback c1-delta-from-B-20260925T0250, decl_sha256_after 0a254bd7; lands together with B's
            # rev-3 declaration and callers): + resume (re-entry semantics, pinned words) + preflight (the read-only
            # record) + hypervisor.capacity.alternatives + observation.hypervisor_required_by; owner_key stays OPTIONAL
            # (B removed it from its section until J-KEY; contract target_prereq_owner_key still checks it when declared)
            # REVISION 4 (C1 hunk 2, MAIN relay; B proposal testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml
            # sha256 f4b03157 (C1 hunk 4 rebind, TP4-ACTIVESTATE-PROBE; was d96f4ed9, before that eb7362cd; the proposal and
            # both consumers keep REVISION 4, so the enum stays [4]) = r3 + changed + added - removed): + preservation (codex-tick360 rules 1-5) + observe (the
            # read-only MAIN observation leg) + reuse.preflight_rel; preflight.record_schema v2; - hypervisor.
            # preserved_refused_states / _status (moved into preservation.expected_states.inactive_not_enabled)
            - {path: '', key_set: {required: [revision, runner, connection_profile, refusal, reuse, layout, owner_account,
                                              authorized_keys, journal, linger, packages, hypervisor, endpoint, observation,
                                              resume, preflight, preservation, observe],
                                   optional: [owner_key]}}
            - {path: revision, enum: [4]}
            - {path: resume, keys: [done_ops, owner_home_writes, after_key_install, existing_account, file_tasks]}
            - {path: resume.done_ops, enum: [readback_refuse_on_drift]}
            - {path: resume.owner_home_writes, enum: [only_while_authorized_key_pending]}
            - {path: resume.after_key_install, enum: [observation_only]}
            - {path: resume.existing_account, enum: [observation_only]}
            - {path: resume.file_tasks, enum: [only_when_absent]}
            - {path: preflight, keys: [record_suffix, record_schema, listener_sources]}
            - {path: preflight.record_suffix, pattern: record_suffix}
            - {path: preflight.record_suffix, distinct_from: [observation.record_suffix, journal.file_suffix]}
            - {path: preflight.record_schema, pattern: schema_tag}
            - {path: preflight.record_schema, distinct_from: [observation.record_schema, journal.schema]}
            - {path: preflight.listener_sources, each: true, pattern: abs_path}
            - {path: runner, enum: [MAIN_only]}
            - {path: connection_profile, subject: scalar, within: [controller.bootstrap.inventory.connection_profiles]}
            - {path: refusal, pattern: refusal_code}
            - {path: reuse, keys: [transfer_dir_rel, transfer_decl, controller_prelude, contact_rel, contact_variant, preflight_rel]}
            # the shared B preflight tasks file; target_prereq.yml / prereq_observe.yml assert rh_repo_root/<this> equals it
            - {path: reuse.preflight_rel, pattern: rel_path}
            - {path: reuse.preflight_rel, enum: [testing/e2e/target_prereq/tasks/prereq_preflight.yml]}
            - {path: reuse.transfer_dir_rel, pattern: rel_path}
            - {path: reuse.transfer_decl, pattern: rel_path}
            - {path: reuse.controller_prelude, pattern: rel_path}
            - {path: reuse.contact_rel, pattern: rel_path}
            - {path: reuse.contact_variant, pattern: mode_word}
            - {path: layout, keys: [toolchain_rel, bundles_rel, bundle_leaf_regex, owner_dir_mode, work_parent_rule]}
            - {path: layout.toolchain_rel, subject: scalar, within: [controller.bootstrap.work_roots.sub_roots.toolchain]}
            - {path: layout.bundles_rel, pattern: rel_segment}
            - {path: layout.bundles_rel, distinct_from: [layout.toolchain_rel]}
            - {path: layout.bundle_leaf_regex, ere: anchored}
            - {path: layout.bundle_leaf_regex, rejects: ['', '.', '..', 'a/b', '../x']}
            - {path: layout.owner_dir_mode, enum: ['0700']}
            - {path: layout.work_parent_rule, keys: [path, owner, mode_regex]}
            - {path: layout.work_parent_rule.path, enum: [dirname_of_work_root]}
            - {path: layout.work_parent_rule.owner, enum: [root]}
            - {path: layout.work_parent_rule.mode_regex, ere: anchored}
            # C1-PREREQ-MODE-DOMAIN (codex-tick328, HIGH): the WHOLE admitted domain carries no group/other write bit
            # (structural; the earlier reject examples missed 0712 / 0752)
            - {path: layout.work_parent_rule.mode_regex, mode_regex_domain: {forbidden_bits: '0022'}}
            - {path: owner_account, keys: [gecos, create_home, system, passwd_fields, home_mode_regex]}
            - {path: owner_account.home_mode_regex, ere: anchored}
            - {path: owner_account.home_mode_regex, mode_regex_domain: {forbidden_bits: '0022'}}
            - {path: owner_account.gecos, pattern: gecos_text}
            - {path: owner_account.create_home, enum: [true]}
            - {path: owner_account.system, enum: [false]}
            - {path: owner_account.passwd_fields, keys: [gecos, home, shell]}
            - {path: owner_account.passwd_fields.gecos, enum: [3]}
            - {path: owner_account.passwd_fields.home, enum: [4]}
            - {path: owner_account.passwd_fields.shell, enum: [5]}
            - {path: authorized_keys, keys: [dir_rel, dir_mode, file_rel, file_mode, pubkey_regex]}
            - {path: authorized_keys.dir_rel, pattern: rel_path}
            - {path: authorized_keys.dir_mode, enum: ['0700']}
            - {path: authorized_keys.file_rel, pattern: rel_path}
            - {path: authorized_keys.file_mode, enum: ['0600']}
            - {path: authorized_keys.pubkey_regex, rejects: ['', '-----BEGIN OPENSSH PRIVATE KEY-----', 'ssh-rsa AAAAB3NzaC1yc2E=', 'ssh-dss AAAAB3NzaC1kc3M=']}
            # PARTIAL-BOOTSTRAP JOURNAL (codex): root-owned, one per owner; the ORDER of ops is the contract (key before
            # linger; the work root handed over last) and so is pinned, as are the op states and the binding fields
            - {path: journal, keys: [dir, dir_mode, file_mode, file_suffix, schema, ops, states, binding]}
            - {path: journal.dir, pattern: abs_path}
            - {path: journal.dir_mode, enum: ['0700']}
            - {path: journal.file_mode, enum: ['0600']}
            - {path: journal.file_suffix, pattern: record_suffix}
            - {path: journal.file_suffix, distinct_from: [observation.record_suffix]}
            - {path: journal.schema, pattern: schema_tag}
            - {path: journal.schema, distinct_from: [observation.record_schema]}
            - {path: journal.ops, enum: [[account, ssh_dir, authorized_key, linger, work_root, work_children, work_handover, storage_root]]}
            - {path: journal.states, enum: [[pending, started, done]]}
            - {path: journal.binding, enum: [[owner, uid, gecos, pubkey_sha256]]}
            - {path: linger, keys: [tool, marker_dir, wait]}
            - {path: linger.tool, subject: scalar, within: [controller.bootstrap.os_tools], having: {field: required_by, contains: target_prereq}}
            - {path: linger.marker_dir, pattern: abs_path}
            - {path: linger.wait, keys: [retries, delay]}
            - {path: linger.wait, each: true, int_range: {min: 1}}
            - {path: packages, keys: [install_module, hypervisor_required]}
            - {path: packages.install_module, enum: [ansible.builtin.package]}
            - {path: packages.hypervisor_required, strings: {nonempty: true, distinct: true}}
            - {path: hypervisor, keys: [kvm_group, storage_mode, base_image_checksum, capacity]}
            - {path: hypervisor.kvm_group, pattern: account_name}
            - {path: hypervisor.storage_mode, enum: ['0700']}
            - {path: hypervisor.base_image_checksum, enum: [sha512]}
            - {path: hypervisor.capacity, keys: [meminfo, admits_provision, refusal, alternatives]}
            - {path: hypervisor.capacity.alternatives, enum: [[another_hypervisor_member, not_a_hypervisor_member, more_host_memory, raise_budget_and_fail]]}
            - {path: hypervisor.capacity.meminfo, pattern: abs_path}
            - {path: hypervisor.capacity.admits_provision, enum: [false]}
            - {path: hypervisor.capacity.refusal, pattern: refusal_code}
            - {path: hypervisor.capacity.refusal, distinct_from: [refusal, endpoint.refusal]}
