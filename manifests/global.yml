    # F05-S4 MAIN ruling 6 (OD-S3-06): resolve.yml is the SOLE producer of the facts named by document_channel.fact and
    # document_channel.admission.fact (both resolver_outputs). A direct filter caller outside resolve.yml (loader tests,
    # harness tasks) passes documents= / admission= by binding THOSE facts read-only, after resolve.yml ran in the same
    # play; it never builds, copies or pins them (no second reader, no new engine).
    document_channel:
