            - {path: layout.bases_dir, pattern: rel_segment}
            - {path: layout.runs_dir, pattern: rel_segment}
            - {path: layout.preserved_dir, pattern: rel_segment}
            - {path: layout.runs_dir, distinct_from: [layout.bases_dir, layout.preserved_dir]}
            - {path: layout.preserved_dir, distinct_from: [layout.bases_dir]}
            - {path: layout.run_files, key_pattern: var_name}
