    # F-05 (codex-tick507 R2-F05-ACTUAL-CONSUMER; route R2 C1-R2I-3, C1-R2J-12, OD-19): PUBLISHED VIEWS. The loader
    # publishes each declared view as a TOP-LEVEL key of lme_resolved.<policy_key>, beside the base projection keys,
    # never inside a scopes entry. A view is DERIVED from the resolved policy (after policy_projections, so a
