            - {path: plugin_search.bytecode, keys: [PYTHONDONTWRITEBYTECODE]}
            - {path: plugin_search.bytecode.PYTHONDONTWRITEBYTECODE, enum: ['1']}
            - {path: plugin_search.join, enum: [':']}
