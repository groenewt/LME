        # UV-ADDED FILES (C1-UV-ADDED-FILES, codex-d649-runtime-refusal-repair-20260924-235616; route owns the
        # declaration and the seed validator, G the regression controls): uv 0.12.18 adds files to the installed Python
        # tree beyond the independent unpack and the declared uv-patched files (BUILD, lib/python3.13/EXTERNALLY-MANAGED).
        # python.uv_added_files declares them as {rel, sha256} rows, rel RELATIVE TO python.installed_rel (the same base
        # as uv_patched_rel). Refused at resolve: a missing or non-list value; an entry whose keys are not exactly
        # {rel, sha256}; a sha256 not 64 lowercase hex; a rel not a normalized relative path; duplicate or nested
