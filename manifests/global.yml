              source_tree: source_tree
              profile: profile
              configuration: configuration
              origins: origins
              configuration_revision: configuration_revision
          - path: sources
            enum:
            - configuration:
                fact: lme_resolved
                path: []
                kind: mapping
              origins:
                fact: lme_resolved_origins
                path: []
                kind: mapping
              configuration_revision:
                fact: lme_resolved_revision
                path: []
                kind: str
          - path: filters
            enum:
            - verify: lme_verify_resolved
