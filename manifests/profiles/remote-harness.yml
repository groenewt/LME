              receipt_var: rh_acquisition_receipt   # localhost host var: the receipt file path (YAML; mode 0400)
              # OD-GEN-09 (codex-tick542): the store host var, declared ONCE (today a package.yml / acquire.yml literal; the
              # parent moves both readers here). The genesis producer binds it to the genesis.entry store: the store the entry
              # acquired cold is the one the acquire stage reconciles warm (separate cold / warm evidence).
              source_var: rh_artifact_source        # localhost host var: the artifact store directory
              # FS3-Q3 (genesis final): the controller bundle-directory host var, declared ONCE (was named only in comments);
              # an ACQUISITION input like source_var / receipt_var: present in a flow whose plan declares acquisition_inputs,
              # absent otherwise (the producer refuses either way). NOT the TARGET bundle_var (target_bootstrap; another host).
              bundle_var: rh_bundle_dir             # localhost host var: the controller bundle directory
              # C1-PKG records-pkg-receipt-words-01 (codex727 OD_LOCKSHA_ACQ_RECEIPT_01 / SCHEMA_01): /2 = lock_sha256 means
              # lock_capture.digest_of; the receipt also carries receipt_identity_fields (act = the acquire launch act,
              # revision = this revision). The receipt_var file is never replaced: pre-stat (no link followed); absent ->
              # written once (force false), read back equal, stat mode / owner / digest; present -> admitted only as a receipt
              # of THIS act and revision whose every row re-verifies in the store at its declared sha256 (verified reuse;
              # current checks are reported, never written into it); other bytes refuse (refusal) before any acquisition
              # effect, the file untouched. A new act writes its own receipt at its own path (cold and warm both retained).
              receipt_schema: lme-acquisition-receipt/3
              revision: 2
              receipt_identity_fields: [act, revision]
              receipt_format: yaml
              # records-c1-h11-yaml-receipts-02 (codex 873 Q278_3): revision 2 is the fixed declared revision of the /3 YAML
              # contract (never a runtime counter); an unchanged reapply neither increments it nor rewrites an admitted receipt.
              # historical: the earlier receipt binding, preserved with its original schema, revision and format; such a receipt
              # at the receipt_var path is never replaced, adopted or read as a current receipt (refusal before any effect).
              historical: {receipt_schema: lme-acquisition-receipt/2, revision: 1, receipt_format: json, disposition: retained_unread}
              report: ACQUIRED
              dispositions: [fetched, reused]
              cold_qualification: 'store_empty_before and every row disposition == fetched'
              refusal: RH-ACQUIRE
            # HOST BINDING PRODUCER CONTRACT (codex-tick571 H-Q1..H-Q6, codex-tick572 S2-ISOLATED-FIXTURE-COMMIT,
            # codex-tick579 repairs; HBP-C1-CONTRACT-03 d9557e09, CR8-04 cdf709ab, CR9-01 9b1b1779, CR10-07 / CR10-08 27bfd08e): guest-lifecycle mode host_binding
            # (testing/e2e/guest/tasks/host_binding.yml) produces the file genesis_case.yml reads (CASES
            # harness.genesis.host_binding). Producer and consumer read THIS node (producer:
