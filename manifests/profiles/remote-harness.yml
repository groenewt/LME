            # names: earlier immutable records, kept as regular files that nothing this declaration introduces reads, writes,
            # renames or deletes; never a satisfaction of a current schema. An active generation lacking receipt_files refuses.
            receipt_files: {toolchain: toolchain.yml}
            historical:
              root_files: [active-toolchain.json]
              check_file_cases: ['controller-receipt.*.json']
              generation_receipt_files: [toolchain.json]
              disposition: retained_unread
              # records-c1-h11-yaml-receipts-02 (codex 873 Q278_1 / Q278_2): each historical name is an accounted entry with
              # its own schemas, format and owner; accounted is never removable. purge names a present historical entry and
              # refuses with the whole root preserved: no name, case or glob authorizes its deletion, and an entry of any other
              # schema, an unowned or a malformed one keeps the unknown-entry preserve / refuse rule. recovery (codex 880
              # F-880-HISTORICAL-RECOVERY-ABANDON; supersedes the -02 recovery words): a pending genesis act (interrupted or
              # failed) whose identity names a historical generation, edition or source is refused by the current edition with
              # RH-GENESIS-RECOVERY and stays pending: the refusal writes no record, discharges no obligation and touches no
              # byte; the generation, its receipt bytes, its bundle and the act dirs are kept. Its continuation path is
              # undeclared (HOLE H-Q278-2-RUNNABLE), so the act stays blocked (blocks_fresh) until a runnable pinned historical
              # edition or a bounded migration is declared. The separate operator operation of prepare.recovery is neither
              # selected nor implied here.
              entries:
                root_files: {schemas: [lme-controller-toolchain/v3], format: json, owner: running_uid}
                check_file_cases: {schemas: [lme-controller-receipt/v3], format: json, owner: running_uid}
                generation_receipt_files: {schemas: [lme-controller-toolchain/v3], format: json, owner: running_uid}
              purge: refuse_preserve
              recovery: {generation: kept, act: pending_preserved, writes: none, continuation: blocked_undeclared, refusal: RH-GENESIS-RECOVERY}
            config_file: ansible.cfg              # written from ansible_config_content, sealed, in tree.sha256
            gen_dirs: {uv: uv-bin, venv: venv, collections: collections, tmp: tmp, verify: verify}
            sealed: [uv-bin, python, venv, collections, ansible.cfg]
          # S4 / codex-tick127: `seed run` scratch state. Every run gets <root>/run/<UTC>.XXXXXXXX (ANSIBLE_HOME, TMPDIR);
          # it lives inside the seed's budget scope (memory/cpu/tasks) and on the owned root (storage_check). Retention:
          # at the start of every run, UNDER THE EXCLUSIVE LOCK, after verify and before the new run dir is created,
          # entries beyond the newest `keep - 1` are removed, oldest first (the UTC prefix sorts chronologically). Only
          # entries matching name_case (the exact mktemp shape) are counted and removed; such an entry that is not a real
          # directory owned by the owner uid refuses (RH-SEED-ROOT-NOT-OWNED) and is preserved; other names (verify.log,
          # controller/target receipts in check/) are neither counted nor touched. Each removal is an
          # operations-log line `pruned <op> run/<name>`. The same rule, keep = layout.check_retention.keep, prunes check/.
          run_retention:
            keep: 8
            name_case: '[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]T[0-9][0-9][0-9][0-9][0-9][0-9]Z.????????'
            max_bytes_each: 1000000000            # a run dir above this is reported (not silently kept) at the next run
            # Q-D17 (codex-001716): routine run retention looks ONLY at seed-shaped names (name_case); a foreign entry in
            # run/ is TOLERATED -- preserved untouched, never pruned, never adopted -- and `seed run` proceeds (the
            # positive retention case keeps its coverage). Whole-root `purge` never deletes an unknown entry: its
            # ownership inventory refuses RH-SEED-ROOT-NOT-OWNED before any removal.
            foreign_entries: tolerated_preserved
            free_required_bytes: 500000000        # free space on the root required before a run dir is created
            # C1-SR922F (codex 928 ROUTE_FAILED_SIZE_STATUS + DIAGNOSTIC_VALUE_SOURCING; route op1o CPL-OP1O-C1-RETENTION-TEXT;
            # additions only): the max_bytes_each REPORT rule and its texts (route controller_seed op1o dedd9675 :741
            # entry_not_owned, :748-753 the size report). size_report: the size of a pruning candidate is MEASURED only
            # when the measuring command (os_tools.du with measure_args, then the entry) exits with status zero AND its
            # standard output begins with a decimal byte count (the leading run of decimal digits); a nonzero status
            # (with or without numeric output) or no leading digits is UNMEASURED and is reported with the unmeasured
            # text, never compared and never counted as 0. A measured size above max_bytes_each is reported with the
            # oversize text. Reports go to the stream named by `stream`; reporting never changes retention selection.
            # {placeholders} are exactly diagnostics.fields: path (the run entry), bytes (the measured count).
            # entry_not_owned is the refusal text (code text_codes.entry_not_owned, a seed refusal vocabulary key) of a
            # seed-shaped entry that is not an owned real directory (preserved).
            size_report:
              measure_args: [-sb, --]
              measured: [status_zero, leading_decimal]
              unmeasured: [status_nonzero, no_leading_decimal]
              compare: greater_than_max_bytes_each
              stream: stderr
            diagnostics:
              fields: [path, bytes]
            texts:
              oversize: 'lme-controller-seed: oversize {bytes} bytes: {path}'
              unmeasured: 'lme-controller-seed: oversize unmeasured: {path}'
              entry_not_owned: 'entry is not an owned real directory (preserved): {path}'
            text_codes: {entry_not_owned: RH-SEED-ROOT-NOT-OWNED}
          # S2 / codex-tick127: ONE exclusive lock per owned root (flock on the root directory fd), taken by every mode
          # after the budget scope is entered and held BY THE SEED PROCESS until it exits -- for `run`, the seed stays
          # the parent of the playbook for its whole duration, so no apply/purge can swap or remove the generation under
          # a running playbook. The playbook is started with the lock fd CLOSED, so ssh ControlPersist masters (which
          # outlive the playbook) never retain the lock. Consequences (declared): gate legs sharing one controller root
          # are SERIAL; a concurrent second operation refuses immediately with RH-SEED-BUSY (15, non-blocking; never
          # queued, never counted as executed coverage); parallel legs need separate owned roots. NESTING: a seed call
          # made FROM a playbook under `seed run` on the SAME root finds the lock held by its ancestor seed and refuses
          # BUSY at once -- non-blocking, so it cannot deadlock. The playbook env carries LME_SEED_SCOPED=1 (Q-D12): the
          # nested seed stays in the run's budget scope and re-verifies the declared limits from its own cgroup before
          # it reaches the lock (budget enforcement kept; no runtime-dir dependency). On a DIFFERENT root (e.g. a target owner's root on
          # another host) there is no conflict. Interruption: the seed and the playbook share one budget scope.
          # SEED2-PURGE-OWNERSHIP: purge first ADMITS an exact owned-removal inventory and destroys nothing unless every
          # entry is accounted for; any unknown, unrecorded or foreign-owned entry refuses (RH-SEED-ROOT-NOT-OWNED) and
          # the whole root is preserved. A repeat purge of an absent root is `ABSENT` (0).
          #   root level:     exactly the layout names below (+ publish temp files layout.publish_tmp_prefix*, regular)
          #   generations/*:  a real dir with a `start <op> <name>` line, or a staging dir .<creating_infix>.<op> with a
          #                   `start <op> ` line
          #   abandoned/*:    a real dir with an `abandon <op> <name>` line
          #   check/*:        verify.log, controller-receipt.*.yml (regular) or a run_retention.name_case dir; a layout.historical entry is accounted and never removed (purge refuses, root preserved)
          #   run/*:          a run_retention.name_case dir
          #   whole tree:     no entry owned by another uid (find -P ! -user); root entries are not links
          #   (root_entries are not repeated here: files = layout.root_marker, operations_log, active_file and
          #   toolchain_receipt; dirs = layout.generations_dir, abandoned_dir, check_dir, run_dir.)
          purge:
            check_files: [verify.log]
            check_file_case: 'controller-receipt.*.yml'
          # CONTROLLER RECEIPT (C1-PKG records-pkg-receipt-words-01; codex727 OD_LOCKSHA_SCHEMA_01 + collision_finding;
          # req-pkg-receipt-01 W2 / row 2 b): the words of the controller.yml receipt in <owned root>/<layout.check_dir>, in
          # their owning declaration. name_form is content-addressed ({sha256} = sha256 of the receipt bytes); pre-stat (no
          # link followed): absent -> written once (force false), read back equal, stat mode / owner / digest; present ->
          # admitted only when byte-equal, never overwritten; anything else refuses. name_case is the purge glob:
          # purge.check_file_case is pinned equal to it. Its lock_sha256 means lock_capture.digest_of.
          controller_receipt:
            schema: lme-controller-receipt/v4
            name_form: 'controller-receipt.{sha256}.yml'
            name_case: 'controller-receipt.*.yml'
            mode: '0600'
            refusal: RH-CONTROLLER-RECEIPT
          lock:
            scope: owned_root
            mode: exclusive
            blocking: false
            held: 'by the seed process until it exits (run: the whole playbook; lock fd closed for the playbook)'
            busy: RH-SEED-BUSY
            concurrency: serial per owned root; parallelism = separate owned roots
            nested_same_root: refused BUSY immediately (no deadlock)
          # Refusal vocabulary: every refusal prints `REFUSED <code> <detail>` on stderr and exits with the code's
          # status. Controls (testing/remote_harness/tests/controls, G) assert on these.
          refusals:
            RH-SEED-USAGE: 2
            RH-SEED-PRIVILEGED: 3
            RH-SEED-UNSUPPORTED-COMBINATION: 4
            RH-SEED-UNSUPPORTED-PLATFORM: 5
            RH-SEED-OS-TOOL-MISSING: 6
            RH-SEED-BUDGET-UNAVAILABLE: 7
            RH-SEED-ROOT-NOT-OWNED: 8
            RH-SEED-STORAGE: 9
            RH-SEED-ARTIFACT-MISSING: 10
            RH-SEED-DIGEST-MISMATCH: 11
            RH-SEED-INSTALL-FAILED: 12
            RH-SEED-IDENTITY-MISMATCH: 13
            RH-SEED-GENERATION-DRIFT: 14
            RH-SEED-BUSY: 15
            RH-SEED-AUTH: 16
            RH-SEED-ENTRY-VERIFY: 17
            RH-SEED-ENTRY-DRIFT: 18
            # J-LRH-REFUSALS-EFFECTIVE-CODE (C1 option (b), seat relay; Codex 807 direction, code 19 a seat report until source
            # review): the effective-outcome refusal of source_admission.custody_lease.refusals.effective.
            RH-SEED-OUTCOME-UNACCEPTED: 19
            # F05-S4 rh-source-status (F05-GEN4-02; codex-tick546): ONE exit status per RH-SOURCE-* code of
            # source_admission (refusals, bootstrap_input.refusals, early_view.refusal, git.input_refusal). The shell
            # raisers (seed source_admit, genesis entry) render refusal_fn(bs.refusals), so none of these codes reaches the
            # catch-all. Distinct from RH-SEED 2..19 and from genesis.entry.statuses 30..37 (render check render_codes);
            # registry contract bootstrap_refusal_statuses binds every source code to a key here. A code raised inside an
            # Ansible task exits with ansible-playbook's own status (the status applies to shell raisers only).
            RH-SOURCE-ABSENT: 40
            RH-SOURCE-BOOTSTRAP-BYTES: 41
            RH-SOURCE-BOOTSTRAP-DECL: 42
            RH-SOURCE-BOOTSTRAP-INPUT: 43
            RH-SOURCE-COMMIT-BYTES: 44
            RH-SOURCE-DOCUMENT-ADMISSION: 45
            RH-SOURCE-EARLY-VIEW: 46
            RH-SOURCE-EDITION: 47
            RH-SOURCE-GIT-CONFIG: 48
            RH-SOURCE-GIT-CONVERSION: 49
            RH-SOURCE-GIT-INPUT: 50
            RH-SOURCE-GIT-OBJECT-FORMAT: 51
            RH-SOURCE-GIT-TOOL: 52
            RH-SOURCE-MEMBER: 53
            RH-SOURCE-RECORD-REPLACED: 54
            RH-SOURCE-STAGED: 55
            RH-SOURCE-UNCOMMITTED: 56
            RH-SOURCE-UNTRACKED: 57
          # Playbook refusal codes (NOT exit codes: ansible-playbook exits 2). The fail_msg line carrying the code is
          # produced by refusal_grammar below (controls bind that line). Each names the task file that raises it.
          playbook_refusals:
            RH-ACQUIRE: acquire.yml (source dir custody, present-wrong digest, row without url, lock url/file mismatch, a present receipt at receipt_var that is not of this act and revision or whose rows do not re-verify, a receipt write that does not read back as exactly the written word)
            RH-ACQUIRE-SELECTOR: acquire.yml (a declared acquire-stage selector was supplied but its operation is undeclared at the stage revision, ambiguous, or its mode selector is absent / not the declared value -- before any fetch, with or without acquisition inputs)
            RH-PREPARE-MEASURE: tasks/measure_controller_tools.yml (supplied rh_meas_* names; a resolve or inventory that is not controller-only; mode / acquisition-input / record-root / resource / package-association admission; an inventory source that is not an existing regular non-link file; a launch that is not exactly the stage operation's inventory kind (its ordered files) or whose binding receipt is absent / not regular / does not vouch for exactly those files; a macro selector outside preparation_measurement.macros; a record root whose ancestry the ONE rule refuses (tasks/admit_ancestry.yml) or that is not an owned root_mode real directory; a record name whose bytes differ; an absent / link / unreadable resource or an incomplete custody chain is RECORDED, never refused)
            RH-CONTROLLER-PREREQ: controller_prereq.yml (supplied rh_cpq_* names; declaration / profile admission; a launch that is not exactly the declared inventory kind's ordered files, or whose binding receipt is absent / not regular / does not vouch for exactly those files (binding_sha256 / lab_sha256) under this resolve's policy digest (policy_sha256), or whose effective inputs differ from the vouched binding (tasks/admit_binding_receipt.yml, with this code); a scope other than the controller plus ONE alias in role_groups[host_group]; B's contract for a peer that is not that alias, another auth mode or key source; play vars that are not the contract; a record that is not the declared reviewed digest or not this declaration's candidate; a package outside the declared association set; an observed family outside preparation_measurement.controller_families or not the association family; a machine id that differs (supporting evidence))
            RH-BUILDER-UNSUPPORTED: admit_builder.yml / package.yml (builder, destination custody, a different bundle at the destination)
            RH-PACKAGE-ARTIFACT: package.yml (a declared artifact missing or with another digest; offline admission)
            RH-PACKAGE-STAGED-MISMATCH: package.yml (a staged copy or the rendered seed differs from the declarations)
            RH-PACKAGE-RECEIPT: package.yml (publication receipt -- a partition class without an admitted bundle row; a class-records dir of another kind, owner, mode or entry; a present class record or receipt not re-admitted (keys, lock digest, trusted oid, admit_bundle bundle, an N13 publication on a recorded class, or bytes unequal to the rebuilt word); a write that fails or does not read back as exactly the written word; or a written file of another mode, owner or digest)
            RH-STAGING-BUDGET: tasks/reap_staging.yml (reap did not converge, or free bytes below the declared budget)
            RH-STAGING-BUSY: package.yml / target_bootstrap.yml (the publish fence could not take the destination lock within publish_wait_seconds; own staging and lease record released)
            RH-STAGING-LEASE: tasks/reap_staging.yml (holder lease not provable -- not an ansible-playbook main process, no machine/boot id, namespaces/cgroup v2 not observable; or flock fails its known answers on this run's PRIVATE scratch lock -- destination-lock contention never produces it)
            RH-STAGING-REVOKED: package.yml / target_bootstrap.yml (the no-replace publish rename failed with its token-named source gone -- publication authority revoked by recovery, teardown or retirement; nothing published, the revoker's staging untouched)
            RH-CONTROLLER-TOOLCHAIN-UNSUPPORTED: tasks/resolve_harness.yml (executor is not the declared root's managed generation)
            RH-CONTROLLER-CONNECTION: tasks/admit_controller.yml (second task of every controller play, right after refuse_pinned_outputs -- the effective connection is not local on localhost, or become is set -- an extra-var or inventory ansible_connection override; r3g)
            RH-SCOPE-BINDING: target_bootstrap.yml, tasks/scope_classes.yml (package.yml and the target_bootstrap controller play), tasks/admit_bundle.yml (a missing class bundle) (PER-HOST-SCOPE-CONTRACT + bundle.per_class -- the controller resolve is not the controller scope, or a target's own resolved scope is not the controller's expected scopes.targets entry for its inventory identity -- scope_sha256, policy_sha256, scopes_sha256, deployment/edition/operation binding; scope_invariant_sha256 only as an additional compatibility check; or its artifact class has no admitted bundle, a bundle recording another class_key, or a seed that is not the target's own fresh render; or rh_bundle_dir is itself a class sibling)
            RH-TRANSPORT-AUTH: tasks/admit_transport.yml (mode, ssh arguments, ProxyJump form, key/agent reference)
            RH-TARGET-BOOTSTRAP: target_bootstrap.yml, tasks/admit_transport.yml, tasks/admit_bundle.yml (owner, effective transport, declared connection key (ssh_auth.composition.endpoint_key = address, port, proxy_jump rules + inventory.owner_var) colliding with another declared target, connection aliases, preflight, identity, readback with the present class_key, a class bundle that is not exactly the class's (members, fresh render, recorded class_key), a publish that did not replace an appeared destination, bundle admission)
            RH-POLICY-UNRESOLVED: tasks/resolve_policy.yml (no lme_resolved.remote_harness section of the declared shape from the engine resolve)
            RH-INVOCATION-LEASE: tasks/resolve_policy.yml (C1-INVOCATION-CONTEXT-01 S28-05, codex 895 RP07; order per codex 907 lease_kind_boundary, C1-SR323-907d -- refused before resolve, the include site declares no requirement word of source_admission.invocation.requirements, a caller requiring the leased run context whose lease is missing or not exactly the declared capture fields, or a mode other than the requirement declares; a lease field of the wrong kind (owner a string or a bool) is first refused by the engine early check PCTX-13 with LME-INVOCATION-CONTEXT before any controller work or capture write, and the later per-field kind check after resolve is a consistency check only -- never an ordinary run in its place)
            RH-POLICY-INPUT-CONFLICT: tasks/resolve_policy.yml (the engine's EFFECTIVE lme_profile / lme_manifests_dir / loaded profile bytes differ from this helper's admitted binding -- an extra-var override of a declared input)
            RH-LOCK-CAPTURE: tasks/resolve_policy.yml and package.yml (controller.bootstrap.lock_capture -- the lock at controller.lock_file_rel is absent, a link or not a regular file, its stat digest differs from the digest of the bytes read once, or the capture does not parse to exactly lock_capture.fields with the declared rows)
            RH-PROFILE-CAPTURE: tasks/resolve_policy.yml (controller.bootstrap.profile_capture -- the profile at source_admission.bootstrap_input.declaration_rel is unadmitted, absent, a link or not a regular file, its stat digest or its admitted member observed digest differs from the digest of the bytes read once, or the capture does not parse under the strict construction to a mapping with exactly profile_capture.fields)
            RH-DERIVED-OUTPUT-PINNED: tasks/refuse_pinned_outputs.yml (a derived output supplied from outside, or the registry reserved_outputs list unreadable)
            RH-OS-TOOL-IDENTITY: package.yml / target_bootstrap.yml (a PRESENT selected executable's stat sha256 differs from its declared identity; adapter divergence -- the engine-derived adapter tool set differs from the declared names, or an adapter tool no adapter package provides; a declared adapter path/identity copy or a name outside os_tools is refused earlier by the engine resolve). An ABSENT tool never raises it
            RH-OS-TOOL-CONSUMER: package.yml (before any hash -- the controller.bootstrap.os_tool_consumers partition is absent, has an empty controller set or overlapping sets, or an os_tools entry's required_by is absent, empty or names a label outside controller + target; codex-tick328-329; the engine resolve refuses the same shapes first by contract_admission.os_tool_consumers)
            RH-OS-TOOL-MISSING: package.yml (a declared controller executable absent or not executable, named with its logical package; raised after the git source-binding check, which keeps RH-BUILDER-UNSUPPORTED for git -- D05; on targets a missing tool is RH-TARGET-BOOTSTRAP, D08)
            RH-TOOLCHAIN-RECEIPT: tasks/verify_toolchain_receipt.yml (root/receipt/generation custody, pointers, seal, tree digests)
            RH-CONTROLLER-RECEIPT: controller.yml (controller.bootstrap.controller_receipt -- a content-addressed receipt name already present with other bytes, a write that fails or does not read back as exactly the written word, or a written receipt of another mode, owner or digest)
            RH-TARGET-PRIVILEGED-CONTACT: >-
              tasks/initial_contact.yml rh_ic_variant=privileged (codex 155203; before any module of a privileged target play -- the actual uid/account is not the declared privileged principal, a privileged tool or the system interpreter fails its known answer/digest, any selected tool's custody (declared lexical chain, the complete chain of every resolved prefix, the resolved regular file: uid 0, free of group/other write, links uid-0 owned) is not admitted -- the interpreter is executed only AFTER that, once, and then exits nonzero (its own status, recorded before its output) or fails its version -- a component of the root module temp or a caller path is not a uid-0 real directory free of group/other write (path_admission.ancestry.root_only), the module temp is not absent-or-uid-0-0700, is on another device than its parent (a mount of another filesystem; a same-filesystem bind mount is not detected by this) or lies inside the owner's work root / bundle dir, storage of the actual staging filesystem (the existing module temp, else its parent) below work_roots.admission, or the effective interpreter / module temp / become is not the admitted one -- an extra-var or include parameter override)
            RH-ANCESTRY-INCLUDE: 'tasks/admit_ancestry.yml (stage 1b -- the caller code or the path to admit is not supplied; stage 1a, the inputs the refusal itself needs, has NO code: Ansible''s native assertion report, the one disclosed exception to the REFUSED form)'
            RH-BINDING-RECEIPT-INCLUDE: tasks/admit_binding_receipt.yml (first task -- a pre-supplied _rh_rcpt_* name, a binding_admission revision other than consumer_interface.implements.binding_admission, or a missing include parameter; every later refusal carries the includer's code)
          # COMMON REFUSAL GRAMMAR (codex-tick399 / codex-tick400; route-r4c): every route playbook refusal is
          # <marker><code_separator><code><delimiter><detail_separator><detail joined by detail_separator> -- the emitted
          # line every playbook_refusals code is raised in. ONE formatting macro (macros_rel / macro), reached
          # from YAML through ONE entry template (entry_rel, template_vars rh_rf_grammar / rh_rf_code / rh_rf_detail)
          # and from Jinja by import. The detail is a list of declared texts and observed values (never a free string).
          refusal_grammar:
            marker: REFUSED
            code_separator: ' '
            delimiter: ':'
            detail_separator: ' '
            macros_rel: testing/remote_harness/templates/macros/refusal.j2
            macro: refused
            entry_rel: testing/remote_harness/templates/refusal.j2
            # MISSING-DECLARATION CODES and TEXTS (B r5g / r5h; codex-tick410-412 R5F-NEW-LITERAL-SOURCING, codex-tick419
            # R5G-CHANGED-DIAGNOSTIC-VALUES): the code and text a consumer emits when its OWN conditional declaration (a
            # when_present contract root) is absent and so cannot carry them itself. This node is ALWAYS admitted
            # (contract refusal_grammar, no when_present), and it is in the resolved work-root payload (_wrp.bootstrap;
            # codex-tick480 option a), so the code exists whenever a resolve exists.
            declaration_codes: {run_binding: RUN-BINDING-RENDER-DECLARATION}
            declaration_texts:
              run_binding: 'the resolved controller.bootstrap lacks run_binding {launches, run_data, refusals (with refusals.receipt and refusals.placement), texts, lab_role, receipt_suffix (a non-empty string), lab_basename (one safe relative basename), receipt_keys (a list), receipt_bindings (a non-empty mapping), binding_roles, history}, inventory.controller_operations or genesis.launch {inventory_kinds, stages} (C1 join); nothing was derived or rendered.'
          # REPORT FRAME (route-r4d, codex-tick409 measure :506-511 / prereq :428-430): the two framing keys of every route
          # report mapping: the operation's report word and its stop text (values are the node's report / diagnostics.stop).
          report_frame: {text: report, stop: stop}
          # Runtime environment of every managed executable (install smoke, verify smoke, `seed run`). ANSIBLE_CONFIG is
          # NOT here (SEED-01): ansible-core 2.19 refuses /dev/null ("Unsupported configuration file extension") and an
          # unset value falls back to ambient ansible.cfg discovery, so the seed always sets
          # ANSIBLE_CONFIG=<generation>/<layout.config_file>, this declared, sealed, receipt-bound file:
          managed_env:
            PYTHONDONTWRITEBYTECODE: '1'
            ANSIBLE_NOCOLOR: '1'
          # records-seed-runlocal-01 (O-R7-764-SEED-BINDING; codex-tick764 / 768): Ansible configuration settings exported in
          # the run-local env -i exec of the runners named here (controller_seed.j2 run_local_args / run_local_exec), never
          # from the ambient environment and not in ansible_config_content (that would change every managed start). Key: the
          # core setting; env: its env interface; value: one core choice (managed core config/base.yml :1393-1407);
          # runners: run_local.runners keys.
          runner_config_env:
            DUPLICATE_YAML_DICT_KEY: {env: ANSIBLE_DUPLICATE_YAML_DICT_KEY, value: error, runners: [provenance]}
          # F05-S4 F05-GEN3-02 (codex-tick554 GEN2-INVENTORY-PREEXEC-ADMISSION; brr-follow SC-MM-37 / OD-BRR-19 consume
          # it): THE ONE home of the inventory parser binding of every managed-generation Ansible start (genesis stages,
          # seed run / run-local, admit_builder). Only the two data parsers the declared inventories use load: yaml (lab
          # 10-lab.yml, render_binding 20-binding.yml, the operator controller inventory) and host_list (run-local's
          # `-i localhost,`); script / auto / ini / toml / constructed / advanced_host_list never load, and any given
          # inventory source no enabled parser accepts FAILS the run (any_unparsed_is_failed; no ambient fallback). A
          # start with no -i keeps implicit localhost (unparsed_is_failed is NOT set, so --version / smoke still start).
          ansible_config_content: "# LME managed generation config. ANSIBLE_CONFIG points here so no ambient ansible.cfg is discovered.\n[inventory]\nenable_plugins = ansible.builtin.host_list, ansible.builtin.yaml\nany_unparsed_is_failed = True\n"
          # $HOME-relative files that must be unchanged (stat inode/size/mtime) across an install.
          startup_files_unchanged:
            - .profile
            - .bashrc
            - .bash_profile
            - .bash_login
            - .zshrc
            - .zshenv
            - .config/fish/conf.d/uv.env.fish
            - .local/bin/env
            - .config/uv
            - .cache/uv
            - .local/share/uv
            - .ansible
          # Toolchain receipt (codex-tick119 R2, tick121 SEED-03/04; C1-H11): YAML (record toolchain_v4) produced by the seed operation, sealed at
          # <generation>/<layout.receipts_dir>/<layout.receipt_files.toolchain> and published byte-identically at <owned root>/<toolchain_receipt>.
          # The generation id is core<core>-py<python>-uv<uv>-<first 12 hex of sha256(seed bytes)>; the seed embeds
          # every pin, config byte, layout name and env value, so ANY change converges to a new revision.
          toolchain_receipt: active-toolchain.yml
          toolchain_receipt_schema: lme-controller-toolchain/v4
          # C1 OW-C1-RECORD-BINDING-01 (records-c1-record-binding-01; SR-290-15): the declared record word of the toolchain
          # receipt (toolchain_receipt and layout.receipt_files.toolchain), read by every reader instead of a literal.
          toolchain_receipt_record: toolchain_v4
          # OWNER TRUST (SEED-04 boundary): the owner account is the code authority for its own root. A receipt proves
          # consistency with a FRESH render of these declarations (expected seed sha256 and generation id are derived
          # by the consumer, never read from the receipt), not provenance against the owner. Residual window: the
          # owner can change files between a consumer's checks and its use. Privileged consumers therefore neither
          # verify nor execute the toolchain: ONLY the owner account reads (verify_toolchain_receipt.yml refuses any
          # other reading uid, SEED2-MANIFEST-READ-CUSTODY) and executes it.
          owner_trust: {code_authority: owner_account, reader: owner_only, privileged_verification: forbidden, privileged_execution_of_toolchain: forbidden, residual: owner-controlled check-to-use window}
          # S3 / codex-tick127 -- SSH authentication mode: ONE declared mode, consumed identically by every stage.
          # The seed's env -i drops the ambient SSH agent. There is no universal topology assumption: the operator
          # SELECTS a mode (seed `run --ssh-auth <mode>`, no default) and every target host carries the same mode in
          # the inventory variable mode_var (no default). tasks/admit_transport.yml refuses before any effect when the
          # host's mode differs from the run's mode, a required reference is absent/unadmitted, or the host overrides
          # the declared ssh arguments. B's bash path reads THIS block (same args, same refusals). Credential VALUES are
          # never read: only the reference (a key-file path or the agent socket path) is admitted.
          ssh_auth:
            mode_var: lme_ssh_auth_mode
            env_mode: LME_SSH_AUTH_MODE          # exported by `seed run` into the managed env
            refusal: RH-TRANSPORT-AUTH
            modes:
              explicit_key:
                agent: disabled
                key_var: ansible_ssh_private_key_file      # inventory reference (path, admitted); required
                ssh_common_args: '-o IdentityAgent=none -o IdentitiesOnly=yes'
              agent:
                agent: carried                             # seed run carries SSH_AUTH_SOCK deliberately, validated:
                socket_env: SSH_AUTH_SOCK                  # an admitted path, a socket, owned by the owner uid
                ssh_common_args: '-o IdentitiesOnly=no'
              tailnet_identity:
                agent: disabled                            # tailnet SSH authorizes by node identity; no key, no agent
                ssh_common_args: '-o IdentityAgent=none -o PubkeyAuthentication=no'
            unsupported: refuse                            # any other value, or a missing value, refuses
            # C1-SR922F (codex 928 DIAGNOSTIC_VALUE_SOURCING; route op1o CPL-OP1O-C1-SEED-LAUNCH-TEXTS, the seed's
            # ssh_auth_check; additions only): the SEED's mode / agent-socket refusal texts (route controller_seed op1o
            # dedd9675 :1271 mode_absent, :1272 mode_unsupported, :1275 socket_absent, :1278 not_socket, :1279 not_owned).
            # `refusal` above stays the admit_transport code; the seed's codes are seed_check.text_codes (seed refusal
            # vocabulary keys). {placeholders} are exactly seed_check.diagnostics.fields: modes (the sorted mode keys joined
            # by mode_join), mode (the caller's word), socket_env (modes.<mode>.socket_env), path (the socket path). The
            # rendered texts equal the op1o literals byte for byte. The path_arg_check texts of the socket path (op1o :373-
            # :380, a shared seed macro) are not in this node.
            seed_check:
              mode_join: ', '
              diagnostics:
                fields: [modes, mode, socket_env, path]
              texts:
                mode_absent: 'run needs --ssh-auth <mode> (no default): {modes}'
                mode_unsupported: 'unsupported ssh auth mode: {mode}'
                socket_absent: 'agent mode needs {socket_env}'
                not_socket: '{socket_env} is not a socket: {path}'
                not_owned: '{socket_env} is not owned by this account: {path}'
                # C1-SR922G (HOLE-SR922F-SEED-LITERAL-TEXTS; additions only): op1o :1283, --ssh-auth given to a mode other than run.
                mode_not_run: '--ssh-auth applies to run only'
              text_codes: {mode_absent: RH-SEED-USAGE, mode_unsupported: RH-SEED-AUTH, socket_absent: RH-SEED-AUTH, not_socket: RH-SEED-AUTH, not_owned: RH-SEED-AUTH,
                           mode_not_run: RH-SEED-USAGE}
            # R-B1 (B entrypoint requirement): the ONE run argv and how ssh arguments compose. Every stage of a
            # deployment (controller play, owner-scoped target bootstrap, MAIN's privileged legs) runs under ONE
            # `seed run` with ONE mode; each host's mode_var must equal it (admit_transport.yml). The mode is an
            # operator selection per deployment (no default); the privileged legs use the SAME mode with their own
            # connection profile (inventory.connection_profiles).
            # Caller form = controller.bootstrap.seed_launcher.caller_argv for mode run (documentation; nothing reads this
            # value): the bundle's generated launcher, by ABSOLUTE path, positional <root> then run's mode param
            # <ssh auth mode>, then the ansible-playbook words as-is (no --). The launcher execs seed_launch.argv
            # (`<bundle>/<bundle.seed_file> run --root <root> --ssh-auth <mode> -- ...`) under env -i; callers never
            # start the seed directly.
            run_argv: ['<bundle>/<bundle.launcher_file>', run, '<controller owned root>', '<mode>', -i, '<inventory>', '<playbook>', '<further ansible-playbook args>']
            # brr-follow R2 (selected-dispatch admission): the run words after `--` are positional by THIS grammar, never by
            # classifying file-valued words: word 1 = inventory_flag, word 2 = the inventory, word 3 = the ONE selected playbook
            # (admitted against source_admission importers / dispatch), then only run_local.arg_flags <value> pairs (further:
            # arg_flag_pairs). Any other shape refuses RH-SEED-USAGE before any effect (OD-BRR-06: other ansible-playbook options).
            run_grammar: {inventory_flag: -i, further: arg_flag_pairs}
            # C1-SR922G (HOLE-SR922F-SEED-LITERAL-TEXTS; additions only): the seed's run_grammar refusal texts (route
