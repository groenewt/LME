              # written content == <pubkey line> + "\n"; an existing file must equal it byte-for-byte (sha256), else REFUSED
            # PARTIAL-BOOTSTRAP OWNERSHIP AND RECOVERY. A ROOT-OWNED journal on the target, written BEFORE the first effect and
            # after each op, binds the campaign state to: owner name, the uid observed right after creation, the GECOS marker, the
            # owner public-key sha256 and the ordered op list. A run resumes ONLY the first op that is not `done`; every later op
            # must still be `pending`. The journal is never trusted alone: see `resume`. Ancestry is re-admitted (root-only rule,
            # fresh stat, no link) immediately before every write. The journal is never deleted by this leg.
            journal:
              dir: /var/lib/lme-target-prereq              # root:root, dir_mode; admitted by the privileged contact (rh_ic_paths)
              dir_mode: '0700'
              file_mode: '0600'
              file_suffix: .journal.json                   # <dir>/<owner><suffix>
              schema: lme-target-prereq-journal/v1
              # ORDER is the contract: the key is installed BEFORE linger; the work root is handed over LAST.
              ops: [account, ssh_dir, authorized_key, linger, work_root, work_children, work_handover, storage_root]
              states: [pending, started, done]
              binding: [owner, uid, gecos, pubkey_sha256]
            # RESUME RULES (tick320 (1) PREREQ-KEY-RESUME, (2) PREREQ-DONE-READBACK). Pinned words, enforced by
            # target_prereq.yml + tasks/prereq_readback.yml:
            #   done_ops            every op the journal says `done` is READ BACK against the actual target state (the one
            #                       predicate set of tasks/prereq_readback.yml) after classification and before any effect, and
            #                       ALL ops again at the end; drift refuses and preserves (never trust the journal, never repair).
            #   owner_home_writes   root writes inside the owner's home (.ssh, authorized_keys) ONLY while authorized_key is
            #                       still `pending`: before it no key has ever existed, so no key-authenticated owner process can.
            #                       (Linger marker / /run/user absence is RECORDED, never proof of quiescence.)
            #   after_key_install   authorized_key `started` (interrupted after or during the install): OBSERVATION ONLY -- the
            #                       exact file (home, .ssh, file: no link, uid, gid, mode, sha256) marks it done with no write;
            #                       anything else, ABSENT included, refuses (an absent file after `started` does not prove the key
            #                       was never usable). No root write to an owner path follows the key install at all, so no
            #                       quiescence/adoption rule is needed; any future one is a new declared revision.
            #   existing_account    the account op never re-runs the account module on an existing account (groups + append can
            #                       usermod): an existing campaign account is observation-only.
            #   file_tasks          every directory task runs only when its path is ABSENT (journal dir, work parent, .ssh, work
            #                       root, each child, storage root); the handover chown only while the work root is uid 0.
            resume:
              done_ops: readback_refuse_on_drift
              owner_home_writes: only_while_authorized_key_pending
              after_key_install: observation_only
              existing_account: observation_only
              file_tasks: only_when_absent
