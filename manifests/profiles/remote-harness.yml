              # actual preparation per run in the sidecar. source preparation_package = installed through the existing guest
              # preparation path from the admitted preparation record (controller.bootstrap.preparation, by digest);
              # source base_image = shipped in the admitted base image edition. Identities stay UNMEASURED (fail-closed:
              # the producer refuses) until MAIN measures them on the admitted edition / package.
              # codex-tick579 HBP-OBSERVATION-BEFORE-ADMISSION: EVERY guest executable the producer runs is declared here
              # (the declared shell for shell syntax, the observation tools, the read tool for the receipt and step record,
              # the stat tool for the ancestry and the mkdir of the evidence dirs) and is admitted through the EXISTING
              # initial-contact boundary (target_bootstrap.initial_contact) before it runs: controller-side, every identity
              # kind must be initial_contact.identity_kind and roles.sha256 must have a known answer in
              # os_tool_identity.known_answers (else refused before any guest contact: an unmeasured tool never runs);
              # then a presence probe of transport-shell builtins only; then the known answer of the roles.sha256 tool
              # (run by the roles.shell tool) and the digests of every declared path, compared with the declared identities
              # BEFORE any other declared tool is invoked -- the trust basis of INITIAL CONTACT 1, not a new one.
