                    render_binding: {path: 'absolute: the rendered binding (its receipt is config.binding_receipt of the next step)', sha256: 'sha256 of that file'}
                    source_bootstrap: {path: 'absolute: <evidence dir>/<files.retained.source_bootstrap.rel>', sha256: 'sha256 (== the stage-root record it copies)'}
