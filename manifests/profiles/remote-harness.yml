                  - not_a_hypervisor_member                # remove this target from role_groups.hypervisors (non-hypervisor target)
                  - more_host_memory                       # raise the host's RAM, then re-run the preflight
                  - raise_budget_and_fail                  # a larger declared budget refuses the same way (capacity stays failed)
            # SSH INTERCEPT (codex; tick320 sequencing). Read in the PREFLIGHT after the privileged contact and before any
            # effect: the session's process ancestry must contain an OpenSSH server process and no Tailscale daemon. This proves
            # the SERVER PROCESS serving the session (and, recorded only, a listener on the connected port) -- NOT which auth
            # method succeeded. A Tailscale SSH intercept REFUSES; the remedy is an inventory-declared OpenSSH endpoint or an
            # explicitly admitted Tailscale SSH profile. UNVERIFIED on graph (Debian 13 OpenSSH layout; sshd-session >= 9.8).
            endpoint:
              ancestry_max_depth: 16
              admitted_server_exe_regex: '^/usr/(sbin/sshd|lib/openssh/sshd-session)$'
              refused_exe_regex: '(^|/)tailscaled$'
              refusal: RH-TARGET-PREREQ-SSH-INTERCEPT
