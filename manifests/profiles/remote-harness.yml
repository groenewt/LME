            # every member: target_adapter, privileged_contact, target_prereq (loginctl) and observation (the route observation
            # runner's target tools); hypervisor members additionally guest (the RS guest tools the hypervisor packages provide).
            # Controller labels are never hashed here (not target tools); that never waives this leg's own target identity
            # checks (the privileged contact's tools, the linger tool at its use boundary). The record carries a CANDIDATE
            # per-host lme_global_override ONLY for differing digests; MAIN decides and admits it through the per-run binding;
            # this leg never applies it. A required tool that is still missing after packages REFUSES.
            observation:
              required_by: [target_adapter, privileged_contact, target_prereq, observation]
              hypervisor_required_by: [guest]
              override_path: [remote_harness, controller, bootstrap, os_tools]   # lme_global_override nesting (tunable_paths)
              identity_kind: file_sha256
              record_suffix: .prereq.json                  # <state dir>/gate.<label><suffix>
              record_schema: lme-target-prereq/v1
            # J-KEY (codex: a new leg inside the manifest/credential lifecycle) is NOT a key of this section: it is its own
            # producer, testing/e2e/target_prereq/owner_key.yml, whose policy source is testing/e2e/target_prereq/owner_key.decl.yml
            # (registered by C1 as rh.controller.bootstrap.owner_key, JK-1..4 landed; JK-6 delta pending). The generator
            # (ssh-keygen) is the CONTROLLER os_tools entry required_by [owner_key_generation], delivered through the declared
            # toolchain (never hand-installed, never target-only). The former proposal text here ('storage_rel: keys',
            # '<controller state root>/keys/<deployment>/<owner>') is SUPERSEDED: the owned location is
            #   <W>/<sub_roots.credentials>/<owner_key.storage.keys_rel>/<deployment>/<target>/<owner>/<key_name> (+ pub_suffix),
            # rendered only by owner_key.location_rule_rel (templates/owner_key_location.j2). The leg's shape, for reference:
            #   generate  the NON-ROOT controller generates the owner key at that owned location (per target)
            #   install   MAIN installs the initial authorized key through THIS leg (authorized_key op)
            #   rotate    an owner-side leg over the CURRENT key: admit the replacement, prove access with it, retire the prior
          # J-KEY OWNER KEY (B-graph c1-jkey-proposal JK-3; codex-graph-critical-path-key-and-profile-20260925,
