                                                          # identity, root_only ancestry) immediately before the one command
              marker_dir: /var/lib/systemd/linger         # <marker_dir>/<owner> exists <=> linger enabled (root-owned regular file)
              wait: {retries: 20, delay: 1}               # user manager runtime dir + bus: target_bootstrap.user_manager
