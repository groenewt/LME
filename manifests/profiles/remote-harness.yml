          # labels. The reaper still admits each tool by identity at its own use boundary (reap_staging_controller_views.yml
          # tasks :25 and :42, op1x 66962028) before use.
          os_tool_consumers:
            controller: [seed, uv_installer, package_source_binding, source_edition_binding, owner_key_generation, preparation, entry_generation, source_admission, staging_reap]
            # C1-SR915 (G-SR328-PREEXISTING-8 os_tool_consumers target; producer repair): + guest_reader, exposure_observer,
            # guardian_custody, the target labels the registry row has pinned since r1 (records-c1-r1-typed-admission-01 :161;
