              # The REQUIRED extra-var <op_var> (no default) selects one of `ops` before any contact. measure_op = read-only
              # measurement on the privileged initial contact, BEFORE (instead of) the shared preflight; it needs only the
              # target binding, the hypervisor allocation check and the initial contact (no observe.required_roles). Every
              # record key, emitted unset / initial / status value, type word, contact state, finding class,
              # dispatch selector and text below is the ONLY source the macros at import_rel use (dispatcher call_rel).
              measure:
