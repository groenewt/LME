            # PREFLIGHT (codex-tick318-321 item 3): a declared READ-ONLY phase (play prereq-preflight) on the admitted
            # privileged contact, BEFORE any owner creation or effect. It depends on nothing an effect provides (no package, no
            # account, no directory). It observes: the principal and interpreter (the contact itself), the SSH ancestry, the
            # connected port's listeners (record only), every component of the root-only paths (work parent incl. /data, home
            # parent, journal dir, linger marker dir, the linger tool's dir, the guest storage parent) with owner/group/mode, the
            # work root / home / storage root leaves, the owner account (getent), the os family and the package mapping, the
            # preserved units (rev 4: preservation, every member) and memory (hypervisor members), and the linger tool's identity. It ALWAYS writes a scoped record
            # <state dir>/gate.<label><record_suffix> (0600; scope id + scope_sha256 + label + target) -- also when it refuses
            # (refusals listed; a contact or observation failure is rescued into the record). Only then does the record play
            # refuse. Not recorded (nothing contacted): a controller-side pre-contact refusal, an UNREACHABLE target (Ansible
