            PATH: /usr/bin:/bin
            LC_ALL: C.UTF-8
          # SEED LAUNCH CONTRACT (codex decision 183510; RH-SEED-LAUNCH). The COMPLETE initial launch of the generated
          # seed (lme-controller-seed.sh, every mode: the genesis seed apply, target_bootstrap.yml's apply, G's seed
          # acts, a `seed run` / `run-local` caller) -- built from base_env and target_bootstrap.user_manager, bound
          # to the ACTUAL invoker, never to a constant uid or runtime path:
          #   caller argv   (executed by the generated launcher, controller.bootstrap.seed_launcher; callers invoke that)
          #                 argv below: env -i with EXACTLY env.order (base_env values; HOME = the invoker's passwd
          #                 home) + env.carried when it applies, then the mode and its mode_args. The runtime dir and
          #                 bus are NOT passed: the seed derives them (a caller that does pass XDG_RUNTIME_DIR /
          #                 DBUS_SESSION_BUS_ADDRESS / USER / HOME must pass exactly the derived value).
          #   ENFORCED by the seed (below): base_env values, HOME, the runtime/bus/user names. NOT inspected: any
          #                 OTHER ambient name a caller leaks past this contract (e.g. LD_PRELOAD) reaches the pre-scope
          #                 tool calls (id, getent, stat, the known answers); it is cleared at the scope's env -i
          #                 (step 3). The exact name set is a CALLER obligation (argv), not a seed proof.
          #   the seed      (templates/macros/controller_seed.j2, consumed there, not prose):
          #                 (1) FIRST, before any pattern match (the pre-scope checks use locale-dependent bracket
          #                     ranges): every base_env name must equal its declared value (base_check), else refusal;
          #                 (2) after the os-tool identity checks (derive.home.tool is hash-admitted there): uid = `id -u`,
          #                     home = field derive.home.field of `getent passwd <uid>` -- an absolute, real directory
          #                     owned by uid; HOME must equal it; runtime dir = target_bootstrap.user_manager.runtime_dir
          #                     with {uid} = uid -- a real directory owned by uid, mode user_manager.runtime_dir_mode;
          #                     bus = <runtime dir>/<user_manager.bus> -- a socket; caller-supplied runtime/bus names
          #                     (work_roots.run_local.user_manager_env) must be unset or equal (caller_values); USER =
          #                     `id -un` (admitted name). This is the ONE derivation: run-local reuses it (no second one);
          #                 (3) `systemd-run --user` (the budget probe AND the scope exec) runs as `env -i` with EXACTLY
          #                     scope_env: HOME, base_env, the runtime dir and bus names -- no ambient variable reaches
          #                     the user manager; inside the scope the seed re-runs under its own env -i (managed env).
          seed_launch:
            argv: ['{os_tools.env.path}', '-i', '{env_pairs}', '{bundle_dir}/{bundle.seed_file}', '{mode}', '--root', '{root}', '{mode_args}']
            # {mode_args}: the mode's remaining words, in order (the seed's own usage; {args} = the caller's
            # ansible-playbook words after --, screened by the seed)
            mode_args:
              apply: []
              verify: []
              purge: ['--confirm', '{root}']
              run: ['--ssh-auth', '{ssh_auth_mode}', '--', '{args}']
              run-local: ['--runner', '{runner}', '--', '{args}']
            env:
              clear: true
              order: [PATH, LC_ALL, HOME]
              base: base_env
              inherited: {HOME: invoker_passwd_home}
              # appended after `order` ONLY for mode run with a mode whose ssh_auth.modes.<mode>.agent is `carried`:
              # its socket_env (SSH_AUTH_SOCK), the caller's agent socket, validated by the seed's ssh_auth_check
              carried: {when: {mode: run, ssh_auth_agent: carried}, name_from: ssh_auth.modes.<mode>.socket_env}
            base_check: exact                  # every base_env name == its declared value before any pattern match
            derive:
              home: {tool: getent, database: passwd, field: 6}   # passwd(5) field 6 = home directory
              runtime: target_bootstrap.user_manager            # runtime_dir ({uid}) + runtime_dir_mode + bus
              names: work_roots.run_local.user_manager_env      # runtime_dir_env / bus_env / user_env
              caller_values: refuse_if_different
            scope_env: [HOME, base_env, runtime_dir_env, bus_env]   # the ONLY environment of systemd-run --user
            # C1-SR922C (codex 924 D; route op1j CPL-OP1J-C1-SEED-ENV-SEP): the separator of ONE env -i operand
            # <name><sep><value> of THIS seed's environments, read at the ONE env-pair home genesis.launch.env_pair_separator
            # (no second separator word, no literal). Consumers (route controller_seed.j2, op1b 7bf76414): the scope_env pairs
            # (launch_scope_env :162, incl. the HOME pair), the seed_launch.env {env_pairs} pairs and the carried pair
            # (:222 / :293 region), the managed env pairs and their split (managed_env / managed_pairs) and the resolved-run
            # env record split (:1919): every compose joins name + sep + value, every parse splits at the FIRST sep (a name
            # never contains it). C1-SR922D (route op1n CPL-OP1N-C1-SEP-CONSUMER-SCOPE; ruled the SAME contract: each is an
            # operand of the declared env tool after -i, <name><sep><value>, the value shell-quoted or a quoted shell
            # expansion, the separator outside the quotes): the scope also covers, in op1b 7bf76414 numbering, env_i :60 (the
            # HOME pair, every base_env and extra_literal pair, and every runtime word -- a runtime word is a <name, value>
            # composed with the separator by its caller, never a pre-joined literal: the callers :579 LME_SEED_SCOPED, :787,
            # :812, :891, :896 TMPDIR / UV_* words), plugin_env :83 (members, none and bytecode pairs), work_env :713 (each
            # run_env pair) and run_launch :950 (LME_SEED_SCOPED, the ssh_auth env_mode pair, ANSIBLE_SSH_COMMON_ARGS and the
            # carried socket pair). Distinct contracts, never read for this: shell assignment (a NAME=value shell statement or
            # command prefix; the seed never emits an env pair as one: each pair is an operand after env -i, shell-quoted
            # on its value only, the separator outside the quotes); the -e name_eq_value word
            # (work_roots.run_local.caller_vars.form_separators); git.write.env_assign.
            env_pair_separator_from: [genesis, launch, env_pair_separator]
            refusal: RH-SEED-USAGE            # base env, HOME / passwd home, caller-supplied runtime or bus mismatch
            budget_refusal: RH-SEED-BUDGET-UNAVAILABLE   # no user manager: runtime dir or bus missing / not owned
            # C1-SR922F (codex 928 DIAGNOSTIC_VALUE_SOURCING; route op1o CPL-OP1O-C1-SEED-LAUNCH-TEXTS; additions only): the
            # seed launch refusal TEXTS, one per refusal site of route controller_seed (op1o dedd9675 lines: base_env :103,
            # base_check_mode :106, uid_read :117, uid_value :118, passwd_entry :119, home_relative :122, home_not_owned
            # :145, home_unset :146, home_mismatch :147, runtime_dir :149, bus :150, account_read :152, account_name :153,
            # caller_value :156, caller_values_mode :159, derivation_absent :1922, home_absolute :2293 and :2294). Each text
            # is emitted as the detail of `REFUSED <code> <detail>` with the code named by text_refusal (a word of THIS node:
            # refusal or budget_refusal). {placeholders} are exactly diagnostics.fields; the consumer substitutes each from
            # its declared source (a declared word at render time, or the seed's own observed shell value, quoted) and
            # never adds wording. The rendered texts equal the op1o literals byte for byte (refusal semantics unchanged).
            # fields: name / expected (a base_env name and its declared value), check_mode (the undeclared mode word),
            # database (derive.home.database), uid, home (the passwd home), observed_home (the caller HOME), dir (the
            # runtime dir), dir_mode (user_manager.runtime_dir_mode), bus (user_manager.bus), account, caller_name /
            # caller_value / derived (a user_manager_env name, the caller's value, the derived value), launch_mode (the
            # run-local mode word).
            diagnostics:
              fields: [name, expected, check_mode, database, uid, home, observed_home, dir, dir_mode, bus, account, caller_name, caller_value, derived, launch_mode,
