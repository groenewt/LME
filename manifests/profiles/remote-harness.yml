            # MR03 S14 (codex-tick669 OD-S13-B64-HOME; codex-tick672): the ONE canonical base64 grammar / encoding declaration.
            # part_regex is the complete encoded-part language, fully anchored (\A ... \Z: no trailing line end admitted);
            # it MAY represent empty bytes (the empty string). group / bytes / pad: the length law (decoded byte count =
            # length / group * bytes - pads). Consumers hold a typed key-path reference [source_admission, encodings, base64]
