              # route (target_bootstrap.yml projection rh_conn, tasks/admit_transport.yml) and by C1's scope binding
              # (binding.deployment.endpoints proxy_jump) -- never copied. Exactly these four forms are accepted, in
              # this order; any other value (another option, ProxyCommand, a ProxyJump plus other options, extra
              # args) refuses. Test vocabulary (the only defined one; any other refuses):
              #   undefined          -> `var` is not set for the host
              #   equals_empty       -> `var` is the empty string
