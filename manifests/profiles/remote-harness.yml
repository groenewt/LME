                  # nested below a compared path (the existing nested_mount refuse_other_device rule of
                  # envelope_projection.capacity temp storage), else that view is UNKNOWN. A view is LOCAL only when its
                  # type is in views.local_fs_types. Every view of every record and of the subject must be local.
                  #   not_applicable requires all three: the owner registry known (read, route op1s :620-682), every record
                  #     accountable, and every view local. Then:
                  #     one kernel (equal boot ids), C1-SR922N (seat SEAT-SR922M-SAME-DEVICE-BIND-ALIAS; SUPERSEDES the SR922M
                  #       path-walked (dev, inode) chain): a bind mount keeps st_dev, so a chain walked by path cannot see an
                  #       alias of a subtree (/srv/dest/sub bound at /srv/other/x is "disjoint" from /srv/dest by chains).
                  #       The relation is decided per pair of views by FILESYSTEM IDENTITY and then by FILESYSTEM PATH:
                  #       identity: ext2/ext3 and xfs views are the same filesystem when their lstat dev is equal. btrfs is
                  #         different: subvolumes give one filesystem several st_dev values, so an unequal dev proves nothing.
                  #         Two btrfs views are one filesystem unless the filesystem UUIDs of their mounts are both observed
                  #         and differ. Views of different types are different filesystems.
                  #       different filesystems: disjoint, subject to the nested-mount rule above.
                  #       same filesystem: each view's FILESYSTEM PATH = the FSROOT of the mount containing it (findmnt
                  #         --target; for a bind mount, the bound subtree, e.g. /srv/dest/sub) joined with the view's path
                  #         below that mount's TARGET. The two filesystem paths must be never equal, inside or above one
                  #         another, compared as canonical text (directories cannot be hard-linked, and custody admits no
                  #         links). Anything else makes D APPLICABLE.
                  #       unknown: a findmnt failure, an escaped (\x) field, an empty TARGET or FSROOT (an empty UUID matters
                  #         only for btrfs), a TARGET that is not a prefix of the
                  #         view path, a missing btrfs UUID, or a non-canonical path.
                  #       The seat's counterexample: D has FSROOT /srv/dest/sub and the record has /srv/dest, so D is inside
                  #       the record: APPLICABLE.
                  #     different kernels: all-local views on both sides are separate storage, so D is not_applicable.
                  #   Network, FUSE, overlay, unlisted or unreadable types, a nested other-device mount, an unobservable
                  #     path, an unknown registry or a busy lock make D UNKNOWN, never not_applicable. Unequal tuples across
                  #     an unqualified view prove nothing, even on one kernel (a network client and its local export have
                  #     different tuples).
                  #   known_empty: a KNOWN registry that holds no record names nothing, so D is not_applicable with no view
                  #     sampled. A registry the route cannot read stays unknown, and an absent registry counts as empty only
                  #     where route op1s already decides it known.
                  #   The owner registry's own location is not a view: it decides what is recorded, not what a record protects.
                  #   RESIDUALS, each of which falls to unknown (correct, fail-closed): a record path on an NFS / CIFS / FUSE
                  #     client view (for example the target's export mounted on the controller; its type shows nfs); a
                  #     cluster or shared-block filesystem (none is listed); a type outside local_fs_types. NOT covered: one
                  #     local filesystem mounted read-write by two kernels at once (a block device or disk image attached to
                  #     both). That is an unsupported, corrupting configuration, and the boot ids cannot see it.
                  # Effects: applicable -> the owner registry is consulted for D exactly as for an owner destination (a record
                  # naming D retains its lease and charge until dead_holder recovery removes it); not_applicable -> registry
                  # state none (known, holds no token); unknown -> every candidate lease and its charge are retained and the
                  # recovery metadata preserved (route op1s :1128-1130). known-none exists ONLY under not_applicable. The
                  # owner's own destinations are always applicable. NOTHING here requires physical separation, a fixed host
                  # name or a profile ban: co-location, inventory renames and role relocation stay supported, because the
                  # state follows observations, not names or roles.
                  registry_applicability:
                    owner: n13_publishing_host
                    states: [applicable, not_applicable, unknown]
                    placement: {owner: run_controller, subject: reap_destination_host, names_are_identity: false, call_role_is_identity: false}
                    identity:
                      kernel_from: [bundle, staging_retention, lease, boot_id_path]
                      machine_from: [bundle, staging_retention, lease, machine_id_path]
                      machine_role: supporting_evidence_only
                      observed_on: [owner, subject]
                    views:
                      fs_type_from: [locations, fs_type_probe_args]
                      measure_at_from: [locations, storage, measure_at]
                      # C1-SR922O (seat SEAT-SR922N-SAME-DEVICE-NESTED-MOUNT; SUPERSEDES nested_mount unknown_if_other_device,
                      # which only saw other-device mounts. As the temp_storage note at :6588 says, device equality misses a
                      # same-filesystem bind). EVERY mount whose TARGET lies strictly below a compared view (subject or
                      # record, any device) is examined, found by listing all mounts with mount_listing (os_tools.findmnt)
                      # and keeping the TARGETs under the view as canonical text. A nested mount N is admitted only when:
                      #   - N's FSTYPE is in local_fs_types;
                      #   - on ONE kernel, wherever N is the same filesystem as a compared view (one_kernel.filesystem_identity),
                      #     N's FSROOT is never equal, inside or above that view's filesystem path (one_kernel.same_filesystem
                      #     relation). On different kernels, a local N cannot alias the other kernel's storage.
                      # Any other N makes its view UNKNOWN. So do a stacked mount at the view's own TARGET (a second entry
                      # with the same TARGET) and any probe failure, escaped field or empty TARGET / FSROOT / FSTYPE.
                      # Seat example: /c/d/inner (FSROOT /a) under the record /c/d; D's parent has filesystem path /a, so
                      # FSROOT equals it and the view is UNKNOWN, never not_applicable. The reverse (a record path bound
                      # below D or its parent) is caught the same way.
                      # COST: a view with nested mounts is retained unless every nested mount is observed local and disjoint.
                      # C1-SR922P (codex 940 C1-PARENT-SUBTREE-POSITIVE-CONFLICT; SUPERSEDES the SR922N/O subject
                      # [reap_destination, reap_destination_parent] compared as two whole subtrees). The parent is ABOVE every
                      # sibling, so comparing it whole made the disjoint-sibling positive (record /srv/a, D /srv/b)
                      # applicable. The compared SUBJECT is now what the reaper actually acts on:
                      #   - D's own subtree;
                      #   - each AFFECTED PARENT ENTRY: the parent entries the reaper's declared scope selects (route op1v
                      #     reap_staging 475f15de scope :29, globs :496-498: `.<D basename>.<staging_infix>.*`,
                      #     `.<D basename>.<reaping_infix>.*` and `.<D basename>.<lease_infix>.*`), observed by listing the
                      #     parent. Each entry is compared as its own subtree; its filesystem path is the parent's filesystem
                      #     path plus '/' plus the entry name.
                      # The destination lock `.<D basename>.<lock_suffix>` is not an affected entry: it is persistent and never
                      # reaped (route op1v :29-30).
                      # The parent is still a view for CUSTODY and TYPE admission (local type, mount probe for its FSROOT), but
                      # nested-mount examination covers only mounts at or below D and at or below each affected entry, not
                      # every mount under the parent. Alias and nested-mount protection of every affected path is unchanged.
                      nested_mounts:
                        listing: {tool: findmnt, args: [--list, --noheadings, --raw, --output, 'TARGET,FSROOT,FSTYPE,MAJ:MIN,UUID'], fields: [target, fsroot, fstype, majmin, uuid], separator: ' '}
                        select: target_strictly_below_view
                        select_subject: target_at_or_below_destination_or_affected_entry
                        # C1-SR922R (codex 941 ROUTE-OP1X-NESTED-PAIR-COVERAGE): admit now QUALIFIES a nested mount as a
                        # view (local domain type, no unknown_when); the overlap test it carried
                        # (one_kernel_same_filesystem_fsroot) moves to one_kernel.pairs, which compares every nested view
                        # with every view of the OTHER side, nested ones included.
                        admit: {fstype_domain_in: local_fs_domain, cross_kernel: local_only, becomes: nested_view, overlap_by: [one_kernel, pairs]}
                        stacked_at_view: unknown
                        unknown_when: [probe_failed, escaped_field, empty_target_fsroot_or_fstype, fstype_unmapped]
                        other: unknown
                      # C1-SR922P (codex 940 C1-MOUNT-PRODUCER-TYPE-VOCABULARY; SUPERSEDES local_fs_types, which used the
                      # GNU stat %T spelling while nested listings read the findmnt FSTYPE spelling). Each producer has its own
                      # declared vocabulary, mapped into ONE shared domain. A producer value outside its mapping is UNKNOWN,
                      # and no template normalizes privately.
                      #   - Direct views: stat_f_T (write_bound.locations.fs_type_probe_args), cross-checked against the same
                      #     view's mount_probe FSTYPE (findmnt_fstype). If the two domain values differ, the view is UNKNOWN.
                      #   - Nested listings: findmnt_fstype.
                      #   - Filesystem identity: keyed by the domain value.
                      type_vocabulary:
                        domain: [ext, xfs, btrfs]
                        producers:
                          stat_f_T: {from: [locations, fs_type_probe_args], map: {'ext2/ext3': ext, xfs: xfs, btrfs: btrfs}}
                          findmnt_fstype: {from: [obligations, registry_applicability, one_kernel, same_filesystem, mount_probe], field: fstype, map: {ext2: ext, ext3: ext, ext4: ext, xfs: xfs, btrfs: btrfs}}
                        feeds: {direct_view: stat_f_T, direct_view_crosscheck: findmnt_fstype, nested_listing: findmnt_fstype, filesystem_identity: domain}
                        unmapped: unknown
                        crosscheck_differs: unknown
                      local_fs_domain: [ext, xfs, btrfs]
                      owner: [record_destination, record_paths]
                      subject: [reap_destination, affected_parent_entries]
                      admission_only: [reap_destination_parent]
                      affected_parent_entries: {scope_from: route_reap_staging_scope, globs: [staging_infix, reaping_infix, lease_infix], prefix: destination_basename, listing: parent, compared_as: subtree, excluded: [destination_lock]}
                      per: every_outstanding_record
                      other_type: unknown
                    not_applicable_requires: [owner_registry_known, every_record_accountable, every_view_local]
                    known_empty: not_applicable
                    one_kernel:
                      relation: filesystem_path_disjoint
                      compare: {subject: [reap_destination, affected_parent_entries], against: [record_destination, record_paths], among: local_views_only}
                      # C1-SR922R (codex 941 ROUTE-OP1X-NESTED-PAIR-COVERAGE, HIGH). compare names the BASE views only, and
                      # route op1x built base x base and nested x base pairs but never nested x nested. Counterexample: owner
                      # bases on filesystem A, subject bases on B, each side with a nested bind of the same FSROOT subtree of C:
                      # no constructed pair overlapped, so the result was not_applicable. THE COMPLETE PAIR SET:
                      #   subject side = the subject base views (compare.subject) PLUS every admitted nested view under them
                      #     (nested_mounts.select_subject);
                      #   owner side = the owner base views (compare.against, per every_outstanding_record) PLUS every
                      #     admitted nested view under them (nested_mounts.select);
                      #   pairs = EVERY subject-side view x EVERY owner-side view: base x base, base x nested, nested x base
                      #     and nested x nested.
                      # A nested view's filesystem is its listing row's (identity by filesystem_identity of its domain type:
                      # MAJ:MIN, or UUID for btrfs) and its filesystem path is its FSROOT; it covers that subtree. A base view
                      # is as before (mount_probe FSROOT joined with the path below TARGET).
                      # Each pair: different filesystem -> disjoint; same filesystem -> disjoint only when the two filesystem
                      # paths are never_equal_inside_or_above; otherwise OVERLAP. A base x base overlap is applicable (as
                      # before). A nested-involved overlap is UNKNOWN (the SR922o rule route applies today: the lease is
                      # retained and charged). A pair with an unqualified member (probe failed, escaped field, empty field,
                      # unmapped type, non-canonical path, missing btrfs UUID, stacked at the view) is UNKNOWN.
                      # The verdict over the set: any unknown pair -> unknown; else any overlap -> applicable; else
                      # not_applicable. A known-none result (not_applicable) therefore requires EVERY pair of the complete
                      # set to be proven disjoint, not merely every producer row.
                      pairs:
                        subject_side: [subject_base_views, subject_nested_views]
                        owner_side: [owner_base_views, owner_nested_views]
                        set: every_subject_side_view_x_every_owner_side_view
                        kinds: [base_base, base_nested, nested_base, nested_nested]
                        nested_view: {filesystem_identity_from: listing_row, filesystem_path: fsroot, covers: subtree}
                        base_view: {filesystem_path: fsroot_joined_with_path_below_target}
                        pair_rule: {different_filesystem: disjoint, same_filesystem: {never_equal_inside_or_above: disjoint, other: overlap}}
                        overlap: {base_base: applicable, nested_involved: unknown}
                        unqualified_member: unknown
                        verdict: {any_unknown: unknown, any_overlap: applicable, all_disjoint: not_applicable}
                        known_none_requires: every_pair_proven_disjoint
                      # C1-SR922O: ext and xfs identity is read as the containing mount's MAJ:MIN, which for these types
                      # equals the lstat dev. C1-SR922P: the identity keys are the shared type_vocabulary domain values.
                      filesystem_identity:
                        ext: {by: mount_majmin}
                        xfs: {by: mount_majmin}
                        btrfs: {by: mount_uuid, same_unless: both_observed_and_differ, unobserved: unknown}
                        other_type_pair: different
                      different_filesystem: disjoint
                      same_filesystem:
                        mount_probe: {tool: findmnt, args: [--noheadings, --raw, --output, 'TARGET,FSROOT,FSTYPE,MAJ:MIN,UUID', --target], fields: [target, fsroot, fstype, majmin, uuid], separator: ' '}
                        filesystem_path: fsroot_joined_with_path_below_target
                        relation: never_equal_inside_or_above
                        text: canonical
                        # C1-SR922Q (route op1x HOLE-OP1X-C1-CANONICAL-TEXT-ERE). `canonical` is text matching canonical_re:
                        # `/`, or one or more `/<segment>` where a segment is non-empty, holds no `/` and no control
                        # character (0x00-0x1f, 0x7f), and is not `.` or `..`; no trailing `/` except the root. Engine:
                        # Python `re` (ansible-core's `match` test is re.match, anchored at the start only), NOT POSIX ERE:
                        # it uses a lookahead and `\Z`. Route spelled `^/$|^(/(?!\.\.?(/|$))[^/]+)+$` (op1x
                        # reap_staging.yml :1422). Not adopted as written: Python `$` also matches before a final newline
                        # and `[^/]` admits a newline, so `/a` + newline was accepted (measured). canonical_re replaces
                        # `$` by `\Z` and excludes control characters. No awk or grep consumer may use it.
                        canonical_re: {re: '^/\Z|^(/(?!\.\.?(/|\Z))[^/\x00-\x1f\x7f]+)+\Z', engine: python_re, ansible_test: match, anchored: start_and_Z}
                      unknown_when: [probe_failed, escaped_field, empty_target_or_fsroot, target_not_prefix, btrfs_uuid_missing, non_canonical_path]
                      overlap: applicable
                    cross_kernel: {all_local: separate_storage}
                    owner_destinations: applicable
                    effects: {applicable: consult_owner_registry, not_applicable: registry_state_none, unknown: retain_lease_and_charge}
                    unobservable: unknown
                    # C1-SR922P (codex 940 MOUNT BOUNDARY decision). Every view, type, mount-probe and nested-listing
                    # observation is taken INSIDE the destination-lock + writer-quiescence sequence, after both hold and
                    # before any reap mutation. The mount and namespace evidence used is RECORDED with the verdict: per view
                    # the mount_probe row and nested rows used, plus the mount namespace of the observing process (readlink
                    # of <proc_root>/self/ns/mnt). The observation is repeated after the decision and before the first
                    # mutation; a changed observation, or one that does not qualify, RETAINS (no reap this pass; the next
                    # owned pass retries from the start). Mount changes made outside this coordination (an external mount or
                    # unmount between observation and mutation) are OUTSIDE the snapshot proof. No race safety against them
                    # is claimed from the lock alone.
                    # C1-SR922Q (seat item 3, OBSERVATION BOUNDARY UNDER ANSIBLE; SUPERSEDES `within` / `before` /
                    # `reobserve` above). flock holds the destination lock only for the ONE command it runs, so no lock
                    # spans several Ansible tasks and "inside the destination lock" cannot cover a task sequence. The
                    # ADMITTED form:
                    #   - Decision observations: each probe task is its own command (route runs each under
                    #     `flock -x -n` on the destination lock; reap_staging.yml op1x :1314/:1342/:1373/:1402). No lock
                    #     is held between them or across the decision. Their only role is to produce the evidence.
                    #   - Gated mutation: every subject mutation the decision releases (rename of an entry to its reaping
                    #     name, removal, lease-record removal) runs as ONE declared re-observe-then-mutate program, the
                    #     program run by `flock -x -n` on the destination lock. It is given the recorded subject evidence
                    #     as params, re-reads it inside that same command (mount_probe rows, nested rows used, type
                    #     values, the observer mount namespace link), and mutates ONLY when every value equals. Any
                    #     difference, failed read or unqualified value: no mutation, a retained word, the next owned pass
                    #     retries from the start.
                    #   - Writer quiescence is proven before the decision, as now; the program does not re-prove it.
                    #   - Owner-side views (on the run controller, a different host in the delegated context) cannot be
                    #     re-read in the subject's command. A change to them between their observation and the subject
                    #     mutation is an uncoordinated change, OUTSIDE the snapshot proof; no cross-host atomicity is
                    #     claimed. In the local context (owner and subject one host) the program re-reads the owner views
                    #     too.
                    #   - The recover program (dead_holder, under the registry lock) is gated by its own relock witnesses,
                    #     not by these views, and is unchanged.
                    # C1 owns this word; route owns the program text (its tasks invoke it). Its tools are the subject's
                    # stat, findmnt and readlink (os_tools required_by staging_reap_subject) under flock.
                    # C1-SR922Q2 (SEAT-SR922Q-BOUNDARY-GATE-SCOPE; CORRECTS the "Gated mutation" line above by append).
                    # The applicability decision releases ONLY the lease-record removal. The words show it: effects.unknown
                    # is retain_lease_and_charge, and not_applicable gives registry_state_none, the state the lease release
                    # reads (dead_holder release_order [obligation_record, lease_record]). No registry_applicability word
                    # gates staging. The staging rename and removal are released by the lease quiescence proof
                    # (staging_retention (1) and (2)), and recovery needs staging already observed absent
                    # (dead_holder.proof.observe_absent). They run BEFORE any applicability evidence exists (route op1x
                    # reap_staging 1658e8ea :1180, :1205; decision :1417), so they have no recorded evidence to pass.
                    # gates is therefore [remove_lease_record] (route :1769, through the keep set :1727-1738). The rename and
                    # removal of staging and reaping entries stay quiescence-gated, each under its own per-command flock,
                    # with no re-observation of these views. No reorder is declared. local_context_also (the owner-view
                    # re-read when owner and subject are one host) applies to that SAME gate, the lease-record removal
                    # command, and to nothing else.
                    # C1-SR922S (route op1y NOTE-OP1Y-LOCAL-CONTEXT-NO-VIEWS, records-route-op1y-01 8a0d4163 :43/:94;
                    # CORRECTS SR922Q / SR922Q2 local_context_also and local_context_gate by append). WITHDRAWN as
                    # unreachable in this placement. The route's local context is the genesis owner destination:
                    # owner_destinations is applicable and no view is observed, so there is no view evidence to re-read.
                    # Every view decision happens in the decided (delegated) context, where owner views are read on the
                    # run controller and the subject's command cannot re-read them (owner_view_change_after_observation:
                    # outside_snapshot_proof). That stays true when the subject and owner share one kernel, because the
                    # two observations are still separate commands on separate connections. No other site is declared.
                    # local_context records the placement instead; control C-SR922Q2-LOCAL-OWNER-VIEW-NEG is withdrawn.
                    observation_boundary:
                      observe: per_command_destination_lock
                      decision: outside_any_lock
                      after: [writer_quiescence_proven]
                      admitted_form: reobserve_then_mutate_one_command
                      reobserve_then_mutate_one_command:
                        lock: destination_lock
                        lock_form: flock_exclusive_nonblocking_one_command
                        gates: [remove_lease_record]
                        not_gated: {mutations: [rename_to_reaping, remove_entry], released_by: lease_quiescence_proof, order: before_applicability_decision}
                        params: recorded_subject_evidence
                        reobserve: [view_mount_probe_rows, nested_rows_used, type_values, observer_mount_namespace]
                        local_context: {placement: genesis_owner_destination, verdict_from: owner_destinations_applicable, views: none, reobserve: none}
                        withdrawn: [local_context_also, local_context_gate]
                        all_equal: mutate
                        differs: no_mutation_retained
                        unreadable_or_unqualified: no_mutation_retained
                        program_owner: route
                        # C1-SR922U (CPL-OP2A-C1-MALFORMED-INVOCATION-DISPOSITION; route op2a reap_staging c24be88a
                        # :2131-2168 program, :2257-2263 _cmdfail). Ruling: route's word and status stand,
                        # malformed_invocation with status 2.
                        #   argv_transport: the nine fixed parameters, then the three group LENGTHS (each the length of the
                        #     same declared list the argv appends), then the groups in that order, then view_count triples.
                        #     Every group is located by its declared length; no fixed group offset or size is used. Each
                        #     count is the WHOLE text matching the transaction decimal_ere, and each is at least count_min.
                        #   malformed_invocation: fewer than 12 parameters, a count that is not a canonical decimal or is
                        #     below count_min, fewer words than the counts declare, or a trailing word count other than
                        #     3 * view_count. The program prints the word, exits 2, reads nothing and mutates nothing. It
                        #     is a COMMAND FAILURE, never a retention.
                        #   outcomes: the (status, stdout) PAIR classifies. A retention needs status 1 AND a retained word.
                        #     Any pair not declared below (for example status 1 with an empty stdout from a shell error) is a
                        #     command failure.
                        #   status_distinct: 0, the retained status 1, the malformed status 2 and busy_rc are pairwise
                        #     distinct; registry r49 pins busy_rc to int_range 3..125.
                        argv_transport:
                          fixed: [readlink, namespace_path, recorded_namespace, findmnt, recorded_listing, stat, rm, lease_record, view_count]
                          lengths: [listing_args, mount_probe_args, fs_type_probe_args]
                          lengths_position: after_fixed_before_groups
                          length_source: same_declared_list_as_appended
                          groups: [listing_args, mount_probe_args, fs_type_probe_args]
                          then: view_triples
                          triple: [view_path, recorded_stat_stdout, recorded_mount_probe_stdout]
                          fixed_group_offsets: none
                          count_grammar_from: [transaction, grammar, decimal_ere]
                          count_match: whole_text
                          count_min: {view_count: 1, listing_args: 1, mount_probe_args: 1, fs_type_probe_args: 1}
                        malformed_invocation:
                          when: [fewer_than_fixed_and_lengths, count_not_canonical_decimal, count_below_min, fewer_words_than_counts, trailing_words_not_three_per_view]
                          stdout: malformed_invocation
                          status: 2
                          reads: none
                          mutation: none
                          classification: command_failure
                          retention: never
                        outcomes:
                          removed: {status: 0, stdout: removed}
                          retained: {status: 1, stdout_one_of: [namespace_unreadable, namespace_differs, listing_unreadable, listing_differs, type_unreadable, type_differs, mount_probe_unreadable, mount_probe_differs]}
                          busy: {status_from: [bundle, staging_retention, lease, busy_rc]}
                          command_failure: [{status: 1, stdout: remove_failed}, {status: 2, stdout: malformed_invocation}, undeclared_pair]
                        status_distinct: [0, 1, 2, busy_rc]
                      record: [view_mount_probe_rows, nested_rows_used, type_values, observer_mount_namespace]
                      # C1-SR922S (B op1q NOTE-B-OP1Q-OF-SEGMENT-WORDS): of_segments is the explicit path below proc_root.
                      # C1-SR922U (NOTE-SEAT-OP2A-NAMESPACE-PROBE-JOIN): the segments are joined, and appended to proc_root,
                      # with the lease proc_paths join word (join_from); no literal separator.
                      namespace_probe: {tool: readlink, of: [proc_root, self_ns_mnt], of_segments: [self, ns, mnt], root_from: [bundle, staging_retention, lease, proc_root], join_from: [bundle, staging_retention, lease, proc_paths, join]}
                      changed: retain
                      unqualified: retain
                      retry: next_owned_pass
                      owner_view_change_after_observation: outside_snapshot_proof
                      cross_host_atomicity: not_claimed
                      recover_program: unchanged_own_relock_witnesses
                      external_uncoordinated_mount_change: outside_snapshot_proof
                      lock_alone_race_safety: not_claimed
                  lock_from: [bundle, staging_retention, lease, lock_suffix]
                  lock_custody_from: [bundle, staging_retention, lease, lock_file]
                  token_from: [bundle, staging_retention, lease, token_regex]
                  liveness_from: [bundle, staging_retention, lease]
                  # C1-SR922G PART 2 (codex 930 N13_PEER_METADATA_CHARGE; B op1j N13 s11 :849 serializes device_bytes only,
                  # :1143-1145 charge a peer its map + its record lstat size): + metadata_copies, per device the COUNT of the
                  # holder's OWN writer copies of its record text (writer_local_temp / writer_remote_temp at copy_locations)
                  # held while the record exists. A count, not bytes: each is charged at the record's OBSERVED lstat size, so
                  # the record never states its own size (no fixed point). See peer_charge for the no-double-count rule.
                  # C1-SR922I (codex 933 recovery_join_direction; PERSISTED RECOVERY INPUTS): the record also carries what a
                  # NON-holder needs to prove cleanup after the holder dies (no in-memory state survives it). All are known
                  # before the FIRST admission (the staging dir is reserved and the temp roots are the call's env before
                  # N13 runs), so the holder writes them in the ONE first record text (transaction landing
                  # first_admission), before its first charged write; later admissions never rewrite them.
                  #   destination: the absolute destination path whose staging this call fills (the reaper selects ONLY
                  #     records whose destination is its own rh_reap_dest, so recovery stays inside its declared scope);
                  #   paths: role -> absolute path, exactly recovery_path_roles: staging (the call's staging dir,
                  #     `.<dest>.<staging_infix>.<token>.<random>`), local_temp and remote_temp (the values of
                  #     write_bound.locations local_temp.env / remote_temp.env for this call, i.e. the copy_locations
                  #     writer_local_temp / writer_remote_temp roots);
                  #   lease: the holder's staging lease record, EXACTLY staging_retention.lease.record_fields (ten JSON
                  #     strings, same grammars, token equal to this record's token): the quiescence proof inputs (machine,
                  #     boot, uid, pid, start, pidns, cgroupns, cgroup_b64) persisted in the obligation record itself.
                  # NOT a field: the registry temp path. Its name is `.<token>.<8 mktemp chars>` (transaction.temp_name),
                  # chosen by mktemp AFTER the record text is fixed, so it cannot be stated in that text; the set of every
                  # registry temp of a token is fully named by the token and temp_name (registry_temp_set below), and
                  # tokens are unique per holder, so no other holder's entry matches.
                  # Size accounting (counts-based rule unchanged): these fields only add bytes to the record TEXT. The
                  # holder measures the exact canonical text in memory before the write (record_admission
                  # measured_canonical_json) and peers charge lstat(R).size (peer_charge record_self_size
                  # observed_never_stated): no field states a size, metadata_copies stays a count, so no fixed point.
                  record_fields: {token: token, device_bytes: device_bytes, metadata_copies: metadata_copies, destination: destination, paths: paths, lease: lease}
                  recovery_path_roles: [staging, local_temp, remote_temp]
                  # C1-SR922L (B op1m HOLE-B-OP1M-STAGING-PATH-ORDER): B measured that N13 reserves the staging dir AFTER
                  # the first record, so the SR922I premise above ("the staging dir is reserved ... before N13 runs") did not
                  # hold. RULING: the staging path STAYS a persisted recovery input (paths.staging, a record field), and
                  # the ORDER is fixed: the lease record, then the staging reservation (mkdtemp of
                  # `.<dest>.<staging_infix>.<token>.<random>`, the staging_retention rule "immediately BEFORE the
                  # reservation the run writes its LEASE RECORD"), then the FIRST record write (carrying that path), then
                  # the first charged write. The reserved dir is empty and is not a copy (composition.copy_write charges
                  # staged files, not the dir), so reserving it first charges nothing. Crash windows: lease only, or lease
                  # and staging with no record, are the pre-N13 staging_retention cases (no record exists, the registry
                  # gives no retention for that token); once the record exists it names every recovery path. A refused
                  # first admission releases its own staging and then its lease (the existing refusal cleanup).
                  # C1-SR922P (DEV-B-OP1N-REFUSED-FIRST-CLEANUP; CORRECTS the last sentence above by append). A first
                  # admission refused BEFORE its record is written does NOT release its staging and lease immediately. They
                  # stay in place for the NEXT owned reap, which recovers them as a pre-N13 staging_retention case: no
                  # record names that token, so the registry gives no retention for it, and the lease verdict and writer
                  # quiescence then decide as for any record-less staging. Nothing is lost: the reserved dir is empty and
                  # uncharged, and the lease is released after its staging is gone (release_order).
                  refused_before_record: {staging_and_lease: left_to_next_owned_reap, recovered_as: pre_n13_record_less, immediate_release: false}
                  recovery_inputs_order: [lease_record, staging_reservation, first_record_write, first_charged_write]
                  record_grammar:
                    destination: {type: string, grammar_at: controller.bootstrap.path_admission.regex}
                    paths: {type: mapping, keys_from: recovery_path_roles, value: {type: string, grammar_at: controller.bootstrap.path_admission.regex}}
                    staging_name: {in: paths.staging, form: '.<destination basename>.<staging_infix>.<token>.<random>', parent: destination_parent}
                    # C1-SR922L (B op1m HOLE-B-OP1M-REPR-FORM-PLACEHOLDERS, template :87-93): each placeholder of
                    # staging_name.form and its source. Every other character of the form is literal text.
                    # C1-SR922O addendum 2 (B op1n HOLE-B-OP1N-MKDTEMP-RANDOM-CLASS; SUPERSEDES the SR922L class
                    # [A-Za-z0-9]+, which the reservation tool does not produce: about 1 in 5 suffixes contain '_' and
                    # were refused). <random> is EXACTLY what the reservation tool writes. The staging dir is reserved by
                    # ansible.builtin.tempfile state directory with prefix `.<dest>.<staging_infix>.<token>.` and no suffix
                    # (B successor-15 :1086-1092; package_bundle.yml :150-162, mkdtemp 0700; bundle comment :300-301,
                    # staging_retention :353-354). That module is Python tempfile.mkdtemp, whose name is
                    # prefix + _RandomNameSequence + suffix: 8 characters drawn from "abcdefghijklmnopqrstuvwxyz0123456789_"
                    # (/usr/lib/python3.13/tempfile.py :323-345, :551-575, sha256 58f93535...; read, not executed).
                    # Hence the class is [a-z0-9_] and the length exactly 8. The ere spells the class 8 times with no {8}
                    # interval, so every ERE engine reads it the same way: B matches it with os_tools.awk, and interval
                    # support differs across awk builds. No broader class is declared: a wider class
                    # would let the reaper and the record grammar recognize names this tool never writes (weaker staging
                    # recognition). '_' is inside path_admission.regex, and there is no '.' or '/', so the token stays
                    # the text between the prefix and the LAST '.'. A different reservation tool, or a Python whose
                    # alphabet or length differs, is a revision of this word.
                    # HOLE-B-OP1M-REPR-STRING-CLASS: every record string value (destination, paths, lease values, token) is
                    # a JSON string WITHOUT escapes. A quote, a backslash or a control character never occurs in a value
                    # (every field grammar above excludes them), so a value is the raw text between its two quotes, and any
                    # escape sequence makes the record not_one_json_object.
                    staging_placeholders: {'<destination basename>': destination_basename, '<staging_infix>': [bundle, staging_infix], '<token>': record_token, '<random>': {ere: '[a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_][a-z0-9_]', reserved_by: ansible.builtin.tempfile, source: python_tempfile_random_name_sequence, alphabet: 'abcdefghijklmnopqrstuvwxyz0123456789_', length: 8}}
                    string_class: {escapes: none, excluded: [quote, backslash, control], else: not_one_json_object}
                    lease: {type: mapping, keys_from: [bundle, staging_retention, lease, record_fields], value: string, token: equals_record_token}
                    registry_temp_set: {dir: registry, name_from: [transaction, temp_name], token: record_token}
                  record_mode: '0400'
                  charged: [live, unknown, failed_retained]
                  charge: full
                  # peer_charge (no double count): the charge of one charged record R on device d is
                  #   R.device_bytes[d]                      the holder's cumulative render / verification / write copies
                  #                                          (lifetime.composition) and NOTHING of the record itself;
                  #   + R.metadata_copies[d] x lstat(R).size  the holder's writer copies of the record text on d;
                  #   + lstat(R).size when R is on d          registry_record, observed, never a field;
                  #   + lstat(T).size per adjacent temp T on d registry_temp (dot-named beside the records), observed.
                  # Every copy is in exactly ONE term. device_bytes never includes a record copy; metadata_copies never
                  # counts registry_temp / registry_record (observed by lstat). A writer counts its OWN record the same way
                  # through record_admission (each copy once, at the measured bytes), never twice through a peer read of
                  # itself (the own record is skipped by token in the peer sum).
                  peer_charge:
                    fields: [device_bytes, metadata_copies]
                    metadata_unit: record_lstat_size
                    observed: [registry_record, registry_temp]
                    own_record: by_record_admission
                    each_copy_once: true
                    # CPL-OP1K-B-RECORD-METADATA-FIELD fixed point: NONE is needed. The record never states its own size:
                    # peers read it by lstat (record_self_size observed_never_stated); the holder measures its exact
                    # canonical text in memory before the write (record_admission payload measured_canonical_json), and
                    # that text carries counts only (metadata_copies), whose digits do not depend on the record bytes.
                    record_self_size: observed_never_stated
                    # C1-SR922J (codex 936 finding B-OP1L-PEER-METADATA-INODES, standing as found): explicit peer inode terms.
                    # C1 INTERPRETATION, not an operator ruling (codex 937; record sr922j_c1_attribution): record_admission
                    # `inodes: per_copy` was read as covering the holder's OWN record copies only; the terms below meet the
                    # 936 accounting requirement at declaration level.
                    # Declared here: on device d a charged peer record R is charged one inode per copy of its record text:
                    #   R.metadata_copies[d]          (its writer copies on d, a count)
                    #   + 1 when R is on d            (registry_record, observed)
                    #   + 1 per adjacent temp T on d  (registry_temp, observed)
                    # added to the device's inode need (beside the own copies and inodes_from) in the SAME locked admission.
                    # R.device_bytes copies keep the rule own write copies have (aggregation inodes_from reserve; no per-copy
                    # inode term), so peers and the holder are charged alike.
                    inodes:
                      per_copy: [metadata_copies, registry_record, registry_temp]
                      device_bytes: aggregation_inodes_from
                      admission: same_locked_admission
                  # copy_locations (CPL-OP1I-B-RECORD-COPY-LOCATIONS: B's map RATIFIED as a word; B op1j N13 s11 :872-873):
                  # where each record_admission copy lives. registry = the obligations.registry directory; the other values
                  # are write_bound.locations keys. Keys == record_admission.copies (r32 pins both).
                  copy_locations: {registry_temp: registry, registry_record: registry, writer_local_temp: local_temp, writer_remote_temp: remote_temp}
                  # registry_bootstrap (CPL-OP1I-B-REGISTRY-BOOTSTRAP-INODES; N13 s11 :1198-1203 mkdir -m 0700, :1215-1226 lock
                  # create, :1144-1146 the +1 inode charges): the registry directory is created ONLY when absent (no parents:
                  # its parent was admitted on the work root device), with dir_mode; the lock with lease lock_file rules via
                  # commands.lock_create. While absent, each is one inode on the registry device, charged at the admission
                  # that creates it (bootstrap_inodes); registry_temp is a declared copy (inodes per_copy), so the temp needs
                  # no separate placeholder inode once the transaction program creates it (no Ansible tempfile placeholder).
                  registry_bootstrap:
                    dir_mode: '0700'
                    create: absent_only_no_parents
                    bootstrap_inodes: {registry_dir: when_absent, lock: when_absent}
                    inode_count: 1
                  # commands (HOLE-OP1J-LITERAL-TOOL-FLAGS ruling, sr922g_c1: the consuming node owns its flags): the argument
                  # words of every N13 registry / publish-fence command. argv forms (tool = os_tools[<tool>].path):
                  #   lock:        <flock> exclusive_arg wait_arg <lock_wait> conflict_exit_arg <busy_rc> <lock file> <command...>
                  #                (N13 s11 :1285-1289, :1693-1697, :1757-1761); lock_wait / busy_rc from lock_wait_from /
                  #                busy_rc_from (the values N13 s11 :870 already reads).
                  #   rename:      <mv> no_target_directory_arg <lease authority noreplace_arg> end_of_options <src> <dest>
                  #                (:1290-1294, :1698-1702).
                  #   remove:      <rm> end_of_options <path> (:1762-1764).
                  #   mkdir:       <mkdir> mode_arg <registry_bootstrap.dir_mode> end_of_options <dir> (:1202).
                  #   lock_create: <sh> inline_arg script arg0 <lock_file.create_umask> <lock> (:1220-1225; the reap_staging
                  #                creation form; the umask binds this one child; append-open never truncates).
                  #   program:     <sh> inline_arg <transaction program text> arg0 <params...> (transaction below).
                  commands:
                    lock: {tool: flock, exclusive_arg: '-x', wait_arg: '-w', conflict_exit_arg: '-E'}
                    lock_wait_from: [bundle, staging_retention, lease, publish_wait_seconds]
                    busy_rc_from: [bundle, staging_retention, lease, busy_rc]
                    rename: {tool: mv, no_target_directory_arg: '-T', noreplace_from: [bundle, staging_retention, lease, authority, noreplace_arg], end_of_options: '--'}
                    remove: {tool: rm, end_of_options: '--'}
                    mkdir: {tool: mkdir, mode_arg: '-m', end_of_options: '--'}
                    lock_create: {shell_tool: sh, inline_arg: '-c', script: 'umask "$1" && : >> "$2"', arg0: sh, params: [create_umask, lock]}
                    program: {shell_tool: sh, inline_arg: '-c', arg0: sh}
                    # C1-SR922I (codex 933 item 3): the RECOVERY invocation of the same registry lock never waits: a reaper
                    # that finds the registry lock held exits busy_rc (flock's conflict exit) and RETAINS every record it
                    # was recovering (reported busy), so the reap of its destination never blocks on a publisher's
                    # transaction. The holder's own transaction and release keep `lock` (bounded wait).
                    #   recovery_lock: <flock> exclusive_arg nonblocking_arg conflict_exit_arg <busy_rc> <lock file> <command...>
                    recovery_lock: {tool: flock, exclusive_arg: '-x', nonblocking_arg: '-n', conflict_exit_arg: '-E'}
                  # transaction (codex 930 N13_LOCKED_ADMISSION; s43/s44 record_admission point before_record_write under
                  # registry_lock): the scan, the unaccountable refusal, the measure, the per-device charge, the admission,
                  # the temp write and the noreplace landing run as ONE command under the registry lock (commands.lock
                  # running commands.program): nothing between the first registry read and the landing runs outside the
                  # lock, so of two publishers the second always scans the first's landed record (N13 s11 :924-1194 scan,
                  # :1261-1277 temp, :1284-1296 rename are replaced by this one command; the write-then-reread linearization
                  # DEV-B-OP1I-LOCK-SPAN is not an equivalent). program_template_rel renders the program TEXT in memory
                  # (passed as the inline argument; no program file, so no copy to charge); program_tool is the os_tools
                  # entry that runs it; program_tools are the os_tools entries the program may execute, by role (each
                  # hash-admitted as every os_tools entry; the owner_private_group facts_tools pattern). params are the
                  # positional arguments in this order. The program prints exactly ONE line: admitted marker, separator,
                  # the token -- on rc 0 only; anything else (another rc, no line, two lines, another word) refuses with
                  # the code by `codes` (busy: rc == busy_rc). Each later write's re-admission (admit before_each_write)
                  # is the same program with landing none (the record is already this holder's; it re-scans peers).
                  transaction:
                    point: before_record_write
                    under: registry_lock
                    form: one_command_under_lock
                    program_template_rel: testing/remote_harness/templates/obligation_transaction.j2
                    program_tool: sh
                    # C1-SR922L (B op1m HOLE-B-OP1M-RELOCK-WITNESS-WORDS item 1): + decode: base64 (os_tools.base64), the role
                    # that decodes lease.cgroup_b64 in the recover mode (dead_holder.program.relock.decode).
                    # C1-SR922Q: + link: readlink and mount: findmnt, the recover-mode roles of dead_holder.relock.namespace.
                    program_tools: {lstat: stat, read: cat, parse: awk, measure: df, temp: mktemp, mode: chmod, digest: sha256sum, rename: mv, decode: base64, link: readlink, mount: findmnt}
                    # C1-SR922I (HOLE-B-OP1L-LSTAT-ARGS; B obligation_transaction.j2 66b68e02 :17-21 rh_ot_lstat, :155-158): the
                    # argument words of the program_tools.lstat role (GNU stat; without -L it does not follow a link, so it
                    # reports the entry itself) and the names of its ONE output line's space-separated fields, in order:
                    # size (%s bytes), mode (%f: the RAW st_mode in hex, file type bits included, so a link / dir / fifo is
                    # visible in the unaccountable detail), uid (%u), inode (%i), dev (%d: decimal device number, admitted
                    # like device_probe_args by round trip and device_domain). end_of_options last; the entry path follows.
                    # C1-SR922J (codex 936 B-C1-LSTAT-MODE-REPRESENTATION-JOIN; SUPERSEDES the SR922I %f representation above):
                    # ONE admitted representation, no mask anywhere. GNU stat %a prints the permission bits as octal digits
                    # without leading zeros; %F prints the file type as text. The type text is the LAST field and is the rest
                    # of the line (it contains spaces), the other five are single words. A record (and a registry temp) is
                    # admitted only when type is one of regular_types (a symbolic link, directory, fifo, socket or device
                    # never is) AND perms equals record_mode_perms, the %a spelling of record_mode ('0400' -> '400'); the two
                    # spellings are pinned together in the registry, so no normalization runs anywhere.
                    lstat: {args: [-c, '%s %a %u %i %d %F', --], fields: [size, perms, uid, inode, dev, type], type_field: rest_of_line,
                            regular_types: [regular file, regular empty file], record_mode_perms: '400'}
                    steps: [scan, unaccountable, measure, charge, admit, temp_write, noreplace_landing, readback]
                    landing: {first_admission: noreplace_landing, later_admissions: none}
                    params: [registry_dir, lock_name, token, record_text, record_mode, own_device_bytes, own_metadata_copies, probe_dirs, reserve_bytes, reserve_inodes, landing]
                    temp_name: {lead: '.', from: token, trail: '.XXXXXXXX'}
                    # C1-SR922L (B op1m HOLE-B-OP1M-REPR-TEMP-GLOB): registry_temp_set as a shell glob. Each template_char of
                    # trail becomes glob_char (one character), and every other trail character is matched literally.
                    # HOLE-B-OP1M-REPR-UNREAD-DETAIL: unread_detail is the sha256_or_read_error text of a record that was not
                    # read (not a readable regular file).
                    temp_glob: {template_char: X, glob_char: '?'}
                    unread_detail: 'not a readable regular file (not read)'
                    # CPL-OP1K-B-LOCKED-ADMISSION-PROGRAM (B op1k N13 s12 :770-776 refuses until these exist):
                    #   output (result grammar): exactly ONE stdout line. Admit: `ADMITTED<separator><token>` with rc 0.
                    #     Refuse: one line in the common refusal grammar (controller.bootstrap.refusal_grammar: marker REFUSED,
                    #     code_separator, the code by `codes`, delimiter, detail_separator, the text by `texts` with its
                    #     fields substituted) with rc != 0 (busy: rc == busy_rc, flock's own conflict exit, no line).
                    #     Any other shape (a line on rc 0 that is not the admit line, two lines, an unknown code) refuses with
                    #     the output text.
                    #   admission (before it runs, the owner_private_group pattern s44 :4352-4356): the TEMPLATE is a source
                    #     admission member (digest-admitted by N12 like private_group_program.j2; its member row lands with
                    #     the file, CPL-SR922G2-PROGRAM-MEMBER); the program_tool and every program_tools entry is an
                    #     os_tools entry whose identity is stat-admitted before use (N13 s12 :459-504 tool identity task); the
                    #     TEXT is rendered in memory from that admitted member with exactly `params` as its inputs and is
                    #     passed as the inline argument (no program file is written, read back or charged).
                    output: {lines: 1, admitted: ADMITTED, separator: ' ', refused_grammar_from: [refusal_grammar]}
                    admission: {template: source_admission_member, tools: os_tools_identity_before_use, text: in_memory_render_of_admitted_member, inputs: params_only, file: none}
                    decision: rc_zero_and_one_admitted_line
                    codes:
                      capacity: call_refusal
                      landing: call_refusal
                      unaccountable_from: [bundle, staging_retention, lease, refusal]
                      busy_from: [bundle, staging_retention, lease, busy_refusal]
                    call_refusal_param: rh_rsv_refusal
                    # C1-SR922J (codex 936 representation follow-up; B obligation_transaction.j2 66b68e02 :54, :94-101,
                    # :112-119, :127): the values the program used as private literals, declared so the template sources each.
                    #   decimal_ere: the canonical non-negative decimal (no sign, space or leading zero), an UNANCHORED ERE
                    #     fragment the template anchors where it matches; it is the ONE numeric grammar of the program (the
                    #     device map keys and values, df cells, lstat size / dev, own_device_bytes): :54 dec and the :127
                    #     ot_dec test are both this word (ot_dec matches it with the parse role; no second shell spelling);
                    #   record_parse: the unaccountable checks in their declared ORDER (the first failing one is the reason;
                    #     each a member of unaccountable.when), the read rule (exactly one line whose read length equals the
                    #     lstat size, else not_one_json_object) and the device-map key order (strictly ascending as text, the
                    #     canonical JSON sort; out of order is not_one_json_object) -- :94-101 and the map loop;
                    #   unmeasured: the diagnostic value printed for a device with no measurement (:112-119).
                    #   producer_status (codex 936 item 4, B-OP1L-MEASUREMENT-PRODUCER-STATUS): a producer (measure df, lstat,
                    #     read, digest) is never piped into its parser: its output is captured by its own command, its status
                    #     decides, and only then the parse role reads the captured text (capture_then_parse). No shell option
                    #     (no pipefail) is relied on.
                    # C1-SR922W (NOTE-OP2B-DECIMAL-ERE-SHELL-FORM): decimal_shell_case is the POSIX `case` form of the SAME
                    # language, for a consumer with no ERE (the route reobserve program's count check; the observation_boundary
                    # argv_transport count_grammar_from names this grammar). A text is refused when any glob in refuse
                    # matches it: '' (empty), '0?*' (a 0 followed by anything: leading zero), '*[!0-9]*' (any non-digit,
                    # LF included). An unrefused text is exactly the whole-text decimal_ere language. B keeps ot_dec on
                    # the ERE (no second spelling inside B).
                    grammar: {decimal_ere: '(0|[1-9][0-9]*)', decimal_shell_case: {refuse: ['', '0?*', '*[!0-9]*'], language_equals: decimal_ere, match: whole_text}}
                    record_parse:
                      check_order: [unreadable, not_one_json_object, keys_not_record_fields, device_bytes_not_device_to_nonneg_integer, metadata_copies_not_device_to_nonneg_integer,
                                    token_not_token_regex, token_not_file_name, destination_not_admitted_path, paths_not_role_to_admitted_path,
                                    staging_not_token_staging_name, lease_not_lease_record_fields, lease_token_not_record_token]
                      read: {lines: 1, read_bytes_equal_lstat_size: true, else: not_one_json_object}
                      map_key_order: {order: strictly_ascending_text, else: not_one_json_object}
                    unmeasured: unmeasured
                    producer_status: {rule: capture_then_parse, producers: [measure, lstat, read, digest], shell_options: none}
                    diagnostics:
                      fields: [registry, device, need_bytes, need_inodes, avail, iavail, own, others, reserve, rel, why, lstat, sha256_or_read_error, lock, wait, record, status, output]
                    texts:
                      capacity: 'obligation registry {registry}: device {device} needs {need_bytes} bytes and {need_inodes} inodes, has {avail} and {iavail} (own {own}, others {others}, reserve {reserve}); no record byte was written'
                      unaccountable: 'obligation registry {registry}: record {rel} cannot be accounted ({why}; lstat {lstat}; {sha256_or_read_error}); preserved, every new write refuses'
                      busy: 'obligation registry lock {lock} stayed held for {wait}s; no record byte was written'
                      landing: 'obligation record {record} did not land exactly (status {status}); its temp and any landed record stay charged'
                      output: 'obligation transaction did not print one admitted line (status {status}): {output}'
                    text_codes: {capacity: capacity, unaccountable: unaccountable_from, busy: busy_from, landing: landing, output: landing}
                  record_admission:
                    point: before_record_write
                    under: registry_lock
                    payload: measured_canonical_json
                    unit: encoded_bytes
                    copies: [registry_temp, registry_record, writer_local_temp, writer_remote_temp]
                    inodes: per_copy
                    against: [aggregation, obligations.charged]
                    held_while: record_exists
                  unaccountable:
                    # C1-SR922I: + the persisted recovery inputs fail their record_grammar (a record without them cannot be
                    # recovered by a non-holder, so it is not accountable: new writes refuse, the record is preserved).
                    when: [unreadable, not_one_json_object, keys_not_record_fields, token_not_token_regex, token_not_file_name, device_bytes_not_device_to_nonneg_integer, metadata_copies_not_device_to_nonneg_integer,
                           destination_not_admitted_path, paths_not_role_to_admitted_path, staging_not_token_staging_name, lease_not_lease_record_fields, lease_token_not_record_token]
                    outcome: refuse_new_writes
                    preserve: [record, adjacent_temp]
                    detail: [rel, lstat, sha256_or_read_error]
                    zero_charge: never
                    refusal_from: [bundle, staging_retention, lease, refusal]
                # C1-SR922G PART 2 (codex 930 N13_RELEASE_PROOF; CPL-OP1I-B-ACT-END NOT ratified): release is no longer the
                # end of the N13 call. The holder removes its record (commands.lock running commands.remove) only after
                # release_proof holds, which is the s44 "removed every temp and staging path it made" rule made observable:
                #   observe_absent: the call's staging dir (_rh_rsv_stage; N13 s11 :1744-1749 observes only this) and every
                #     registry entry named by temp_name for its token (registry_temp);
                #   observe_subset: the recursive entry listing of the local_temp and remote_temp locations (the act's own
                #     temp roots, writer copies included) is a SUBSET of the listing taken right before the first write of
                #     the call (listing_tool / listing_args; the snapshot is held in memory). An entry made during the call
                #     and still present, an unreadable listing, or a busy lock keeps the record CHARGED (failed_or_unknown:
                #     retained) with its recovery metadata (the record, its token liveness fields) for the reaper.
                # composition (codex 930 N13_CUMULATIVE_COPY_CHARGE; N13 s11 :834-849 summed each allocation leaf ONCE): the
                # cumulative per-device charge is DERIVED from the copies the call actually makes, never from a leaf total:
                #   each N10 call of op o at scope s makes op_copies[s][each op it runs] (module render: the template write's
                #     local temp, remote temp and staged file, then the fresh check-mode render's local and remote temp;
                #     N10 s07 :288-294 and :333-355); n10_call_ops[o] lists the ops one call runs;
                #   each N13 copy-module write (copied member, check row, content record) makes copy_write;
                #   each copy is charged at per_copy_charge = the admitted row bytes of ITS write (copy_bound row; the
                #     row's cap from the call's rows), on the device of its role's location;
                #   device_charge = the sum over every copy made so far in the call plus the next write's copies, grouped
                #     by device (concurrent_roles sum, reuse none); the copies_leaf allocation stays the PER-COPY check only;
                #   record copies are excluded here (record_admission / peer_charge charge them once).
                # So three module rows make six local-temp and six remote-temp copies at their own row bounds plus three
                # staged files: the rule, not a total.
                lifetime:
                  removal_proof: observed
                  charge: cumulative
                  release: release_proof
                  in_flight_proves_removal: false
                  concurrent_roles: sum
                  admit: before_each_write
                  failed_or_unknown_cleanup: charged
                  release_proof:
                    observe_absent: [staging, registry_temp]
                    observe_subset: {roots: [local_temp, remote_temp], baseline: before_first_write}
                    listing_tool: find
                    listing_args: [-mindepth, '1', -printf, '%y %P\0']
                    then: remove_record_under_lock
                    failed_or_unknown: retained
                    # C1-SR922I RULING (B review question D; codex 930 "release only on observed removal"; lifetime
                    # removal_proof observed): the HOLDER's record counts as released ONLY when, after commands.remove, the
                    # record path is OBSERVED absent (program_tools.lstat / a no-link stat reporting no such entry). rc 0
                    # of rm alone is NOT the proof (B s13 :2020-2025 binds released on rc 0: it must also require the
                    # observation); an rc != 0, a present record or a failed observation keeps it charged, and the lease
                    # record is then NOT released (release_order). Same rule as dead_holder removal_proof.
                    after_remove: observe_record_absent
                  # C1-SR922W (B op1u NOTE-B-OP1U-OBSERVE-ABSENT-NO-LISTING; B obligation_transaction.j2 9ebe9c97). On a disk
                  # filesystem a stat that fails with EIO or ENOMEM fails `test -e` and `test -L` exactly as ENOENT does, and
                  # a shell glob drops a readdir error silently (the unexpanded pattern then fails -e). So every absence
                  # DECISION that releases a charge or a record needs the complete listing (relock.absence_proof
                  # leaf_listing words: os_tools.find on the proven parent, status 0, exact name records), unless the
                  # decision rests on an earlier exclusive operation that already failed safely. Sites (B op1u lines):
                  #   observe_absent staging / reaping (:1049): needs the listing. A false absent removes the record and
                  #     drops its charge while the staging or reaping dir remains, leaving those bytes uncharged. No
                  #     exclusive create or rename follows.
                  #   observe_absent registry_temp (:1051-1052): needs the listing of the proven registry dir, not a glob.
                  #     A member is a record that starts with temp_name.lead + token and has the temp_name shape. Any
                  #     member listed means present (retained). A false absent drops a live temp's charge.
                  #   observe_absent_or_empty, absent arm (:1060): needs the listing of the root's proven parent. A false
                  #     absent releases while the act's temp root may still hold entries. The empty arm already rests on
                  #     the listing tool with status 0.
                  #   observe_record_absent (:1066, and release_proof after_remove): needs the listing of the registry dir.
                  #     The rm status is not the proof (C1-SR922I). A false absent reports removed and releases the lease
                  #     (release_order) while the record stays.
                  #   admission scan (:481-482, `[ -e ] || [ -L ] || continue` over a glob): needs the listing. A listed
                  #     name that fails both tests is unaccountable (refuse), never skipped. A skip under-charges and
                  #     over-admits.
                  #   readback temp check (:520, after the noreplace rename returned 0): rests on that rename, so NO
                  #     listing is needed. A rename that returns 0 has moved the temp name atomically, and a failed
                  #     rename has already refused (noreplace_landing).
                  #   release_proof observe_absent [staging, registry_temp]: the same rules as the dead_holder sites above.
                  absence_observation:
                    listing_from: [dead_holder, relock, absence_proof, leaf_listing]
                    glob_decides: never
                    needs_listing: [observe_absent_staging, observe_absent_reaping, observe_absent_registry_temp, observe_absent_or_empty_absent_arm, observe_record_absent, release_proof_observe_absent, release_proof_after_remove, admission_scan]
                    rests_on_exclusive_op: {readback_temp_absent: noreplace_rename_status_0}
                    registry_temp_member: {prefix_from: [obligations, transaction, temp_name, lead], then: token, shape_from: [obligations, transaction, temp_name]}
                    # C1-SR922Y (B op1v NOTE-B-OP1V-UNSTATABLE-WHY). A listed name that fails both -e and -L had nothing
                    # read about it. Its unaccountable detail is therefore check_order's first word, unreadable, with
                    # sha256_or_read_error = unread_detail and an empty lstat field. That is sufficient; no new why
                    # word is added.
                    # A registry is a disk filesystem, so a name may hold LF. The listing then cuts it into fragments,
                    # and the same name may appear more than once. In the admission scan, a fragment that fails both
                    # tests, or a record seen twice, is that same unaccountable refusal. In an observe site, a fragment
                    # can never equal an admitted leaf (no admitted leaf holds LF), so it can only add a present
                    # match, never a false absence.
                    listed_but_unstatable:
                      admission_scan: unaccountable
                      observe: present
                      admission_scan_detail: {why_from: [record_parse, check_order, first], sha256_or_read_error_from: unread_detail, lstat: empty}
                      record_seen_twice: {admission_scan: unaccountable, same_detail_as: admission_scan_detail}
                    # C1-SR922Y (B op1v OPEN-B-OP1V-RELEASE-PARENT-CHAIN). Which parent proof each site uses:
                    #   - dead_holder sites (the recover program run by a non-holder, and proc/cgroup leaves) keep the
                    #     relock.absence_proof.each_ancestor chain.
                    #   - release_proof sites are the holder's own N13 call over its admitted staging parent and
                    #     registry dir. For those, ONE no-follow stat of the parent (exists, is a directory, not a link,
                    #     in the same context as the listing) is sufficient, given two facts:
                    #     - path_admission.ancestry admitted every ancestor at the use boundary of the SAME call, before
                    #       its first write (real directories, owned by uid 0 or the owner, not other-writable,
                    #       group-writable only through owner_private_group). So no principal other than uid 0 or the
                    #       holder can replace a component.
                    #     - the release observation is the ansible form: not_found only, plus a listing with status 0.
                    #       An unsearchable component therefore gives unknown, never absent.
                    #   - A release_proof call whose ancestry admission did not run in that call has no parent proof,
                    #     and is unknown (retained).
                    parent_proof:
                      dead_holder_sites: {by: [dead_holder, relock, absence_proof, each_ancestor]}
                      release_proof_sites:
                        parent: {module: ansible.builtin.stat, follow: false, proven_when: [exists, isdir, not_islnk], same_context_as: listing}
                        ancestors_by: {word: path_admission.ancestry, when: use_boundary_of_the_same_call, before: first_write}
                        observation_form: [dead_holder, relock, absence_proof, leaf_absent, ansible_consumer]
                        # C1-SR922Z (seat SR922z item 4): a SHELL release observation (test -e and test -L after one
                        # parent stat) is NOT admitted at release_proof sites; it is unknown (retained).
                        #   - test -e fails on EACCES, EIO and ENOMEM exactly as on ENOENT (C1-SR922W).
                        #   - One parent stat proves type and no-link, not searchability.
                        #   - No consumer runs a shell release today: B release_proof is ansible (successor-23).
                        # Revision trigger: a consumer that needs a shell release asks C1 for a measured form.
                        shell_observation: unknown
                        ancestry_unadmitted: unknown
                    nonzero_listing: unknown
                  # C1-SR922H RULING (CPL-OP1Q-REAPER-REGISTRY-RELEASE; option (a) HOLDER-ONLY; codex 930 rule kept): only
                  # the holder removes its obligation record, by release_proof above. The staging reaper (lease revoker
                  # `recovery`, tasks/reap_staging.yml) NEVER reads, locks or removes a registry record or registry temp:
                  # its scope stays the destination's staging / reaping / lease entries. A dead holder's record STAYS
                  # CHARGED (its device_bytes and metadata_copies keep counting at admission; the capacity refusal is the
                  # visible backpressure). It is recovered ONLY by a dead_holder remover (teardown or retirement, owned
                  # by their callers; never recovery) under commands.lock, and only when EVERY proof below is observed;
                  # the holder's in-memory baseline died with it, so the act's temp roots must be observed EMPTY (a
                  # reaper-observable superset of observe_subset), never compared with a baseline. Any proof failed,
                  # unreadable or unknown (a live or unproven lease, a present entry, an unreadable listing, a busy lock)
                  # RETAINS the record charged; an absent record is never synthesised, and removal is observed (the
                  # record path absent after commands.remove) before the charge is dropped.
                  # C1-SR922I RULING (codex 933 recovery_join_direction; SUPERSEDES the SR922H paragraph above where they
                  # differ): "permanent dead-holder charges cannot be the final recovery behavior, and process death alone
                  # cannot justify deletion". The remover is the EXISTING recovery path: the lease revoker `recovery`
                  # (tasks/reap_staging.yml), which already proves quiescence for its destination's tokens. Teardown and
                  # retirement are NOT removers (no implementation exists). The reaper removes a dead holder's record
                  # ONLY by the cleanup proof below, from PERSISTED inputs (record_fields destination / paths / lease and
                  # the token), so it survives a process interruption and a controller restart (no baseline, nothing in
                  # memory). Sequence (each step observed; any failed, unknown, unreadable or busy result RETAINS the
                  # record charged with its recovery metadata, reported, and the lease record is NOT released):
                  #   select:    records in this host's registry whose destination == rh_reap_dest (read, parsed and
                  #              grammar-checked as unaccountable.when; an unaccountable record is never recovered);
                  #   quiescent: the token's verdict by the lease's OWN proof (staging_retention.lease: controller (1),
                  #              and target (2) for a target registry; retired_controller_machine_ids as declared there),
                  #              taken from record.lease, which must equal the destination lease record
                  #              `.<dest>.<lease_infix>.<token>` byte-for-field (present, parses, same ten fields); an absent or
                  #              different lease record is UNKNOWN (lease ordering below makes it present while charged);
                  #   staging:   record.paths.staging and its reaping name (same path, reaping_infix for staging_infix)
                  #              observed ABSENT (lstat: no such entry). The destination reap above them removes a quiescent
                  #              owned staging first, under its destination lock, so a proven dead holder's staging is gone;
                  #   temp roots: each of record.paths.local_temp / remote_temp observed ABSENT or EMPTY (find -mindepth 1
                  #              lists nothing, rc 0). Why empty and not a subset: no baseline survives the holder, and these
                  #              roots are the act's OWN per-run temp roots (lifetime: never shared with another act), so any
                  #              entry may be a holder copy; emptiness (or absence) is the one proof that needs no baseline.
                  #              A root shared with a live act stays non-empty and so RETAINS (fail-closed, never deletes);
                  #   registry temp: no entry of registry_temp_set (`.<token>.` + 8 chars in the registry) is present;
                  #   remove:    commands.remove of the record, then the record path observed ABSENT; only then the charge
                  #              drops (the next scan no longer finds it);
                  #   lease:     only AFTER that observed removal, the destination lease record is released by the reaper's
                  #              existing locked lease-record removal (release_order).
                  # Locking: quiescent is the reaper's existing verdict, observed before any mutation as today; the steps
                  # staging .. remove run as ONE command under commands.recovery_lock (non-blocking; busy retains) running
                  # the B transaction program in its recover mode, which also re-observes inside the lock the holder
                  # witnesses the verdict rests on (boot id, /proc/<pid>/stat start, the recorded cgroup absent or
                  # populated 0, the lease words); any difference from the verdict RETAINS. The registry lock and the
                  # destination lock are never held together (both non-blocking for the reaper), so no lock order exists
                  # to violate.
                  dead_holder:
                    removers: [recovery]
                    removers_within: [bundle, staging_retention, lease, authority, revokers]
                    reaper_removes_record: true
                    under: commands_recovery_lock
                    inputs: persisted_record_fields
                    select: {field: destination, equals: rh_reap_dest}
                    proof:
                      holder_quiescent: lease_quiescence_proof
                      # C1-SR923B: the cgroup half of lease_quiescence_proof (the pre-lock verdict) and of the in-lock
                      # re-observation reads the SAME input, relock.dead_rule.cgroup_input (the combination verdict).
                      holder_quiescent_cgroup_from: [relock, dead_rule, cgroup_input]
                      lease_inputs: {from: record_lease, equals: destination_lease_record, absent_or_different: unknown}
                      # C1-SR922L: + machine (first). A record in this registry whose lease machine is not THIS machine is
                      # another controller's: UNKNOWN, retained (the staging_retention cross-controller rule). Without this
                      # check, its foreign boot id would read as "another boot = dead".
                      # C1-SR922Q (SEAT-SR922P-RELOCK-NAMESPACE-BINDING): + namespace, after boot and before pid_start. The
                      # in-lock pid and cgroup witnesses are read in the recover command's own view; namespace binds that
                      # view to the record (relock.namespace below). It is judged on the same boot only.
                      relock_witnesses: [machine, boot, namespace, pid_start, cgroup_populated]
                      observe_absent: [staging, reaping, registry_temp]
                      observe_absent_or_empty: {roots: [local_temp, remote_temp], listing_tool_from: [release_proof, listing_tool], listing_args_from: [release_proof, listing_args]}
                      baseline: none
                    program: {template_from: [obligations, transaction, program_template_rel], mode: recover, form: one_command_under_lock,
                              steps: [read_record, relock_witnesses, observe_absent, observe_absent_or_empty, remove_record, observe_record_absent],
                              params: [registry_dir, lock_name, token, record_sha256, staging, reaping, local_temp, remote_temp, verdict]}
                    # C1-SR922L (B op1m HOLE-B-OP1M-RELOCK-WITNESS-WORDS): the in-lock re-observation words of
                    # relock_witnesses. A failed, unreadable or malformed observation retains (step relock_witnesses).
                    #   verdict: the raw positional param. Only `dead` (the reaper's pre-lock lease verdict) may proceed;
                    #     any other text retains.
                    #   machine: the first line of lease.machine_id_path must equal record lease.machine (32 lowercase hex),
                    #     else retained.
                    #   boot_id: the first line of lease.boot_id_path must match form_ere. Its dashes are removed, and the
                    #     result (32 lowercase hex) is compared with record lease.boot.
                    #   proc_stat: <proc_root>/<record pid>/stat. comm runs from the FIRST '(' to the LAST ')' (it may hold
                    #     spaces and parentheses). The text after the last ')' and its one separator splits on that
                    #     separator into fields numbered from after_comm_first; start is field start_field (22). The start
                    #     must match the decimal grammar (transaction.grammar.decimal_ere).
                    #   decode: lease.cgroup_b64 is given on stdin to program_tools.decode with args (base64 -d). That tool
                    #     is a producer: its output is captured and its status decides (producer_status). The decoded
                    #     text must match path_ere and contain no `.` or `..` segment. The cgroup dir is
                    #     <cgroup_root><decoded>, and its events_file is read against unpopulated_regex.
                    #   dead_rule: another boot is dead. On the same boot the holder is dead only when its stat is absent
                    #     or its start differs, AND its cgroup dir is absent or its events_file reads unpopulated. Anything
                    #     else retains. A retired machine never reaches recovery here: its lease machine is not this machine.
                    relock:
                      verdict: {param: verdict, proceed: [dead], other: retained}
                      machine: {path_from: [bundle, staging_retention, lease, machine_id_path], read: first_line, equals: record_lease_machine}
                      boot_id: {path_from: [bundle, staging_retention, lease, boot_id_path], read: first_line, form_ere: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$', normalize: remove_dashes, equals: record_lease_boot}
                      # C1-SR922V (open item 4 of SR922u): ONE source for the path. proc_stat consumes
                      # lease.proc_paths.reaper_reads.record_holder_stat (path_from) for its <proc_root><join><pid><join>stat
                      # path, and record_holder_presence (presence_from) for the pid dir leaf of absence_proof. root_from
                      # and file stay and must AGREE: root_from equals proc_paths.root_from, and file equals the last
                      # of_segments entry of record_holder_stat (as B op1s/op1t already gates).
                      proc_stat: {root_from: [bundle, staging_retention, lease, proc_root], file: stat, comm: {open: first_paren, close: last_paren}, separator: ' ', after_comm_first: 3, start_field: 22, grammar_from: [transaction, grammar, decimal_ere], path_from: [bundle, staging_retention, lease, proc_paths, reaper_reads, record_holder_stat], presence_from: [bundle, staging_retention, lease, proc_paths, reaper_reads, record_holder_presence], agree: {root_from: proc_paths_root_from, file: last_of_segments}}
                      decode: {role: decode, args: [-d], input: stdin, producer_status_from: [transaction, producer_status], path_ere: '^(/[^/[:cntrl:]]+)+$', dot_segments: retained}
                      cgroup: {root_from: [bundle, staging_retention, lease, cgroup_root], events_from: [bundle, staging_retention, lease, events_file], unpopulated_from: [bundle, staging_retention, lease, unpopulated_regex]}
                      # C1-SR922P (B op1n B-OP1N-AMBIGUOUS-ABSENCE; C1 owns the word). Non-existence counts as ABSENT only
                      # when it is PROVEN, and the dead_rule's `absent` arms now name these words.
                      #   absence_proof: the leaf is <proc_root>/<record pid> (the proc_stat dir) or <cgroup_root><decoded>
                      #     (the cgroup dir). EVERY ancestor from the declared root (proc_root or cgroup_root itself) down to
                      #     the leaf's parent is observed, without following links, as a real directory (os_tools.stat
                      #     -c '%F' prints `directory`; a symbolic link or any other type fails), and as searchable by the
                      #     observer (shell `test -x`). Only then does a leaf seen neither by `test -e` nor by `test -L`
                      #     count as absent. An unobservable, non-directory, linked or unsearchable ancestor makes the
                      #     leaf UNKNOWN, and unknown retains.
                      #   process_visibility: an absent pid dir proves nothing if the proc mount hides other users'
                      #     processes. Visibility is proven by ONE of these bases, else UNKNOWN (retained):
                      #     - proc_mount_unrestricted: `findmnt --noheadings --raw --output OPTIONS --target <proc_root>`
                      #       gives exactly one row: the mount OPTIONS list. The list is split on ',' and has no
                      #       `hidepid=` entry, or only `hidepid=0` / `hidepid=off`. Any other hidepid value (1, 2,
                      #       invisible, noaccess, ptraceable) or a failed or multi-row probe is not this basis.
                      #     - same_uid: the lease record file's owner uid (the owned-record check: regular file of this uid)
                      #       equals the observer's uid. hidepid never hides a user's own processes.
                      #   Process visibility gates ONLY the stat_absent arm. A present stat with a different start is
                      #   observed directly and needs no visibility basis.
                      absence_proof:
                        roots: {proc: [bundle, staging_retention, lease, proc_root], cgroup: [bundle, staging_retention, lease, cgroup_root]}
                        ancestors: from_root_through_leaf_parent
                        # C1-SR922Y (route op2c CPL-OP2C-C1-SEARCHABLE-CONSUMER-FORM; codex 948). The shell forms (test -x,
                        # test -e, test -L) stay. Route runs no shell on the controller, so its consumer forms are declared
                        # here. They were measured read-only in the admitted wheels (2.19.11 c39612b1, 2.17.14 34a49582)
                        # and in linux-source-6.12 (tar dcb52c568b7f906e, tar -xJOf to stdout):
                        #   - searchable: ansible.builtin.stat sets `executable` from os.access(path, X_OK)
                        #     (modules/stat.py 2.19.11 :468-469; 2.17.14 :484-485). os.access returns false on any error
                        #     and never raises. The no-follow lstat result of the SAME stat call must also show exists,
                        #     isdir and not islnk, because os.access follows links.
                        #   - os.access without effective_ids checks with the real ids (Python documentation; the CPython
                        #     source is not measured here). access(2) is do_faccessat with flags 0 (fs/open.c :548-550).
                        #     It checks with the REAL uid/gid (access_override_creds :409-463). For a non-root uid it
                        #     clears the effective capabilities (:430-431), which is stricter and leaves the ancestor unproven, so unknown. Only uid 0 with
                        #     effective != permitted capabilities can over-report. An over-report is bounded: the
                        #     ansible leaf and segment observations are absent only on not_found (lstat ENOENT), and the
                        #     listing must exit 0, so an unsearchable parent still yields unknown, never absent.
                        #     `test -x` uses the effective ids; the two agree for a module process whose real and
                        #     effective ids are equal.
                        #   - leaf_absent / segment_absent: a no-follow stat whose result is exists false is lstat
                        #     FileNotFoundError ONLY (stat.py 2.19.11 :453-462, 2.17.14 :469-478). No directory entry
                        #     means neither `test -e` nor `test -L` succeeds, and any other errno fails the call
                        #     (unknown). So this form is never weaker than the shell pair.
                        each_ancestor:
                          type_probe: {tool: stat, args: [-c, '%F', --], equals: directory, follows_links: false}
                          searchable:
                            test: '-x'
                            ansible_consumer: {module: ansible.builtin.stat, follow_from: [type_probe, follows_links], same_path_as: type_probe, proven_when: [exists, isdir, not_islnk, executable], executable_basis: access_x_ok_real_ids, over_report_bounded_by: [leaf_absent, leaf_listing], other: unknown}
                        leaf_absent:
                          not_exists: {test: '-e'}
                          not_link: {test: '-L'}
                          ansible_consumer: {module: ansible.builtin.stat, follow: false, absent_when: exists_false, exists_false_only_on: not_found, failed_or_missing: unknown}
                        # C1-SR922V (B op1t NOTE-B-OP1T-NOT-FOUND-ONLY; B obligation_transaction.j2 b8046efe :821 ot_gone,
                        # :917-928). Ruling (c), measured in linux-source-6.12 (tar dcb52c568b7f906e, read to stdout):
                        #   (a) NOT sufficient. A proven-searchable parent does not make a failed leaf lookup mean absence.
                        #   (b) NOT sufficient for the proc leaf. No errno tool helps there, because the kernel itself
                        #     reports ENOENT for a LIVE pid when its inode allocation fails:
                        #     - fs/proc/base.c :3470-3473: proc_pid_instantiate returns -ENOENT when
                        #       proc_pid_make_base_inode (new_inode, :1942-1944) returns NULL;
                        #     - fs/proc/root.c :325-328: proc_root_lookup then falls through to proc_lookup;
                        #     - fs/proc/generic.c :262: proc_lookup_de returns -ENOENT for a numeric name.
                        #     Ansible stat (ansible-core 2.19.11 modules/stat.py b2a23204 :455-462) reports exists false
                        #     exactly on FileNotFoundError, so it inherits the same ambiguity.
                        #     The cgroup leaf is the same in kind: kernfs_iop_lookup (fs/kernfs/dir.c :1214-1216) returns
                        #     -ENOMEM on inode failure, but `test -e` conflates that with ENOENT.
                        #   (c) The declared rule: a leaf is absent only when BOTH hold:
                        #     - leaf_absent (test -e and test -L both fail, the parent proven by the ancestor chain);
                        #     - leaf_listing: a COMPLETE listing of the proven parent, by os_tools.find with args below,
                        #       exits 0 and no output record equals the leaf name.
                        #     Readdir does not depend on the leaf's inode:
                        #     - proc_pid_readdir (base.c :3555-3600) emits every visible tgid's name through
                        #       proc_fill_cache, which emits the name even when instantiate fails (:2108-2141,
                        #       end_instantiate);
                        #     - kernfs_fop_readdir (dir.c :1843-1873) emits names with no inode allocation.
                        #     A listed name means PRESENT (the stat read then decides, and a failed read is unknown).
                        #     A non-zero status, or a record that is not a plain name, is UNKNOWN (retained).
                        #     Output and status are locale-free (env LC_ALL from base_env). No stderr text is parsed.
                        #     Names hold no LF: proc names are decimal, and cgroup_mkdir refuses '\n' (cgroup.c :5863).
                        #     The leaf name is compared as an exact string, never a pattern, and never passed through
                        #     awk -v (which processes escapes).
                        #   Residuals:
                        #     - proc_pid_readdir skips a pid whose TGID task is NULL (next_tgid, base.c :3536-3544);
                        #       a live thread-group leader has one.
                        #     - The GNU find status and raw %f output are taken from findutils documentation, not
                        #       measured source (controls C-SR922V-*).
                        #     - hidepid=invisible would hide names; the visibility basis already excludes it.
                        leaf_listing:
                          tool: find
                          start: proven_leaf_parent
                          args: [-mindepth, '1', -maxdepth, '1', -printf, '%f\n']
                          env_from: [base_env, LC_ALL]
                          record_separator: LF
