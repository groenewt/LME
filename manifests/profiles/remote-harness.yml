              # (kB floor-divided to MiB) and RECORDS MemTotal, MemAvailable, the budget and the shortfall. It REFUSES exactly
              # when MemTotal < budget (class never_fits) or when /proc/meminfo cannot be measured (class unmeasured; fail-closed,
