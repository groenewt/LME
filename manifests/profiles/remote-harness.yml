          # SEED-06 os_tools_integrity (codex-232517): a declared tool path is a LOCATION, not an identity. Every selected
          # executable (seed/uv_installer tools on every host; adapter tools on targets) is admitted INDEPENDENTLY of the
          # tool verifying itself BEFORE the first effect: the resolved file is a regular file owned by owner_uid and
          # not group/other-writable, and each known_answers tool must reproduce the declared output for the declared
          # input (a supplied /usr/bin/true as sha256sum prints nothing and refuses). A valid alternate path is selected
          # by changing `path` (declaration-driven, once C1's registry admits the override); no generic code changes.
          os_tool_identity:
            owner_uid: 0
            refuse_group_other_writable: true
            regular_file: true
            refusal: RH-SEED-OS-TOOL-MISSING
            known_answers:
              - {tool: sha256sum, stdin: abc, stdout: 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad  -'}
              - {tool: sort, stdin: "b\na\n", stdout: "a\nb"}          # real newlines; compared without trailing newlines
