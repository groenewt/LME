              # producer_status_from: capture_then_parse, as that transaction declares (df captured alone, status
              # decides before any parse, no shell option). Refusal code stays each caller's (refusal below for the work
              # root; RH-SEED-STORAGE for storage_check).
              df_capacity:
                args: {avail: [-B1, --output=avail, --], iavail: [--output=iavail, --]}
                rows: {header_rows: 1, data_rows: 1}
                cell: {blanks: removed}
                grammar_from: [entry_generation, render, n10, write_bound, obligations, transaction, grammar, decimal_ere]
                producer_status_from: [entry_generation, render, n10, write_bound, obligations, transaction, producer_status]
              refusal: RH-SEED-STORAGE
          # ONE path-admission rule for the seed (shell case patterns) and every consumer (Jinja regex): absolute,
          # these characters only, and none of the forbidden forms. Ancestry: every existing ancestor of the root is
          # a real directory (no link), owned by uid 0 or the owner, and NOT group/other-writable -- sticky
          # world-writable directories such as /tmp are refused too (throwaway roots live under an owned $HOME dir).
          path_admission:
            charset: 'A-Za-z0-9._/+-'
            forbidden: ['/', '*//*', '*/', '*/./*', '*/../*', '*/.', '*/..']
            regex: '^/[A-Za-z0-9._+-]+(/[A-Za-z0-9._+-]+)*$'
            forbidden_segment_regex: '(^|/)\.{1,2}(/|$)'
            # PATH GRAMMAR (route-r4c, codex-tick400 R4-NEW-VALUE-CONSTRUCTION: the separator a playbook consumer joins /
            # splits paths with is DECLARED, here, beside the rule it serves; regex / charset already imply it).
            separator: '/'
            # diagnostic texts of the ONE playbook ancestry admission (tasks/admit_ancestry.yml; codes are the caller's)
            # include contract of tasks/admit_ancestry.yml (route-r4d): its declared code and input names
            include_refusal: RH-ANCESTRY-INCLUDE
