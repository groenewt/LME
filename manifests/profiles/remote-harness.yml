              refused_fs_types: [tmpfs, ramfs]
              free_bytes_min: 3000000000
              free_inodes_min: 200000
              refusal: RH-SEED-STORAGE
          # ONE path-admission rule for the seed (shell case patterns) and every consumer (Jinja regex): absolute,
          # these characters only, and none of the forbidden forms. Ancestry: every existing ancestor of the root is
          # a real directory (no link), owned by uid 0 or the owner, and NOT group/other-writable -- sticky
