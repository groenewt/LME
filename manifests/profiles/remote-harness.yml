              # enables, disables or masks a unit, and never touches a unit outside the declared selection.
              routes:
                as_expected: null
                absent:
                  mechanism: null
                  action: >-
                    MAIN reconciles the preservation record (an interrupted retirement is declared retired_absent only on
                    retirement evidence; evidence loss is reported). The known set is never shrunk by observation.
                # running / enabled / present_after_retirement: ONE route (the proposal's &retire anchor, written out)
                running:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove                    # reclaim.decl.yml :74-78 (exact removal of ONE owned native service)
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                enabled:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                present_after_retirement:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                # listed, absent_status, state not in absent_states (every basis) -- the same &retire route, written out
                loaded_without_unit_file:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                # inactive_not_enabled member with probe ActiveState failed (codex-tick375-377) -- the same &retire route, written out
                failed:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
