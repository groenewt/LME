              base_image_checksum: sha512                  # observed only (MAIN acquires it; never fetched or rewritten here)
              # (rev 4: preserved_refused_states / preserved_refused_status removed -- the per-member expected-state
              # vocabulary preservation.expected_states replaces them; the values move into
              # expected_states.inactive_not_enabled; nothing is weakened.)
              # memory (codex-tick308-309; tick318-321 item 3): budget = rh.guest.allocation.memory_mib (13312) +
