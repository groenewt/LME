            admission_texts:
              include: 'admit_ancestry.yml: the include contract is not met (every declared input is required, the caller code non-empty); declared inputs, then the ones supplied:'
              inputs: 'admit_ancestry.yml: the ancestry rule or the path to admit is not admitted (normalized absolute path, no forbidden segment):'
              components: 'has a component that is a link, not a directory, owned by a uid other than 0 / the running uid, other-writable (sticky included), or group-writable without being owned by the running uid (path_admission.ancestry); running uid and offending components:'
            # PATH IDENTITY (B r5s C1-R5S-1; codex-tick482 R2L-SHARED-IDENTITY-AND-RECORD-VALUES, codex-tick486): path
            # identity is EXACT (no case folding) -- the ONE declared identity policy for B and R2. Consumers read this
            # node (e.g. unique(case_sensitive=<this>)); no consumer holds a private `true` as policy. Not a tunable.
            case_sensitive: true
            # ANCESTRY -- the ONE resolved rule (codex 143342 WORK-ROOT-ANCESTRY-PRIVATE-GROUP). Consumers read
            # rh.controller.bootstrap.path_admission.ancestry (lme_resolved.remote_harness.policy.controller.bootstrap
            # .path_admission.ancestry): the seed (macros ancestry_check + private_group_admit), and every playbook
            # consumer through tasks/admit_ancestry.yml (controller-local) or the target initial-contact boundary
            # (target_bootstrap.yml), all deciding with the SAME generated program (macro private_group_program,
            # rendered for playbooks by templates/private_group_program.j2 and run by tasks/decide_private_group.yml).
            # Every existing ancestor: a real directory (links refuse), owned by uid 0 or the owner, NEVER other-writable
            # (sticky included). group-writable refuses UNLESS owner_private_group admits that directory; nothing else
            # relaxes it. No user, gid or directory name is declared here: the owner is the running uid.
            ancestry:
              allow_owner_uids: [0, owner]
              # C1-SR922H (C1-GAP-ANCESTRY-UID-GRAMMAR): the grammar admit_ancestry applies to the observed `id -u` line
              # (op1q :125 register) and to each stat uid BEFORE any `| int` (op1q :146-163); a value that does not fully
              # match refuses with the caller's code, never coerces. It is the SAME literal as controller.entry_generation
              # .uid_regex (registry r34 pins both to one enum value), carried here because the include reads only
              # rh_anc_bs (= rh.controller.bootstrap) and entry_generation is outside it.
              uid_regex: '^[0-9]+$'
              refuse_group_other_writable: true      # kept for existing readers; group-writable is refused unless
              refuse_links: true                     # owner_private_group below admits the directory
              sticky_exception: false
              # A group-writable ancestor is admitted ONLY when every condition holds (else REFUSED <refusal>):
              #   dir: owned by the owner uid (never uid 0 or another uid), not other-writable, a real directory;
              #   primary group: the dir's gid is the owner's primary gid, the owner uid has exactly ONE passwd record,
              #     and a FULL passwd enumeration shows NO other account with that primary gid (and no other account
              #     reusing an owner account name);
              #   supplementary: exactly ONE group record has that gid and its member list is empty or names only the
              #     owner's account(s) -- an empty list alone is not the proof, the primary-gid scan above is;
              #   identity provider: nsswitch `<db>:` lines for every database in `databases` exist exactly once and
              #     their source list is exactly one of `allowed_sources` (actions such as [NOTFOUND=return], or any
              #     remote/dynamic backend such as sss, winbind, ldap, nis, are unsupported and refuse); every
              #     enumeration step exits 0 (a failed, empty or malformed enumeration refuses);
              #   ACL: getfacl (numeric, physical) of the dir, access AND default entries: a write-granting named user
              #     other than the owner uid, a write-granting named group other than the dir's gid, or a write-granting
              #     other entry refuses; an unknown entry tag refuses. (With an ACL the mode's group bits ARE the mask,
              #     so an effective foreign writer through a named entry always makes the dir group-writable and is
              #     judged here; mask entries themselves are not writers.)
              owner_private_group:
                enabled: true
                applies_to: owner_owned_group_writable   # uid-0 or foreign group-writable ancestors always refuse
                identity_provider:
                  nsswitch_file: /etc/nsswitch.conf
                  databases: [passwd, group]
                  allowed_sources: [[files], [files, systemd]]
                  enumeration_tool: getent               # os_tools.getent (hash-admitted)
                acl_tool: getfacl                        # os_tools.getfacl (hash-admitted); argv -c -n -p -P -- <dir>
                # codex-tick395 R2: the other os_tools entries the facts program executes (macros/controller_seed.j2
                # private_group_facts; private_group_program.j2 facts prefix), by role; on a target each is a member of
                # target_bootstrap.initial_contact.tools (admitted by tasks/initial_contact.yml before INITIAL CONTACT 1)
                facts_tools: {principal: id, stat: stat, read: cat, filter: sed}
                decision_tool: awk                       # os_tools.awk runs the generated program (controller for playbooks)
                facts_schema: private-group-facts/1      # tags: owner path dir rc nsl pwl grl acl (tests/private_group_fixtures.yml)
                program_template_rel: testing/remote_harness/templates/private_group_program.j2   # rh_pg_part program|facts
                consumer_tasks_rel: testing/remote_harness/tasks/admit_ancestry.yml               # controller-local consumers (B, G)
                decide_tasks_rel: testing/remote_harness/tasks/decide_private_group.yml
                fixtures_rel: testing/remote_harness/tests/private_group_fixtures.yml
                refusal: RH-SEED-ROOT-NOT-OWNED
                # C1-SR922D (SR922d item 2, CPL-OP1M-CONTROLLER-BINDINGS-UNCOVERED; codex 926 PRIVATE_GROUP_SCOPE): WHERE a
                # playbook consumer may ATTEMPT the exception. tasks/admit_ancestry.yml DERIVES its launch context (never an
                # include parameter, never a caller-supplied word) right after it selects the owner-owned group-writable
                # components and BEFORE the facts program or the decide_private_group.yml include; with no such component
                # nothing here is read. The first context whose `when` holds is the context; order is `order`.
                #   genesis_launch: the admitted caller fact (source_admission.resolve_phases.names._rh_sa_caller, set by N2
                #     after the callers row admitted the caller) is the playbook_rel of a genesis.launch.stages row. The
                #     exception is REFUSED here, before any facts or decision, with the caller's code (rh_anc_refusal) in the
                #     common grammar and detail [text, the component paths]: the genesis.launch admission declares no
                #     private-group exception (its decision tools are not yet identity-admitted). The refusal names THIS
                #     rule, never the delegation code, and no binding is read.
                #   run_local_leased: lme_invocation_mode is in vars and equals work_roots.run_local.pinned_vars
                #     .lme_invocation_mode (a reserved name the seed pins as the final -e of every run-local launch). The
                #     decision runs with the pinned bindings `bindings` read at bindings_from; the controller remote temp is
                #     REQUIRED and equal to the controller TMPDIR (route op1m stage 1b / stage 2), scoped to THIS context
                #     only (codex 926: not generalized).
                #   seed_run: lme_invocation_mode is not in vars and every `bindings` name is in vars (the `seed run`
                #     final -e of work_roots.run_pinned_vars, below; a registry-ingress companion name, refused from a
                #     caller -e). The decision runs with those bindings; the delegated controller tasks bind
                #     ansible_remote_tmp as a TASK var from the controller env (remote_tmp: task_var_controller_env, see
                #     work_roots.remote_tmp_authority.delegated_controller); the target play var (target placement) is
                #     never the delegated controller temp.
                #   otherwise (no context holds): REFUSED with the caller's code and the `otherwise.text`, before any facts or
                #     decision (fail-closed, not a missing-binding accident). C1-SR922E: a genesis.launch stage whose caller
                #     fact is absent (membership) or names a helper rather than the stage playbook lands here, not in
                #     genesis_launch: a genesis argv carries neither the run-local pins nor the seed run pins (env -i with
                #     the stage's declared extra_vars only), so it still refuses before any facts; only the text differs.
                #     C1-SR922G CORRECTION (codex 929 SOURCE_BOOTSTRAP_FAILURE_STAGE; the SR922E sentence above is kept as
                #     authored and is WRONG for an undeclared caller): "only the text differs" does not hold. A stage whose
                #     resolve_policy include passes no rh_rp_caller (the generated source bootstrap before route transports
                #     its caller, source_bootstrap.yml.j2 :131-132) refuses EARLIER, at source admission (admit_loader_source
                #     als05 :94-111 asserts rh_rp_caller before N2), and one naming a rel that is not a resolve_phases.callers
                #     key refuses at N2 caller membership: source admission and resolution are blocked whether or not an
                #     ancestry exception is ever needed; this decision is never reached. Fix: the caller row
                #     testing/remote_harness/source_bootstrap.yml (source_admission.resolve_phases.callers, s44) plus the
                #     route caller transport; only then does a source_bootstrap stage reach genesis_launch here.
                #   by_runner (C1-SR922E, CPL-SR922D-MAIN-ONLY-BINDING): how each runner word's launches land, declared, not a
                #     new context. MAIN_only: every MAIN_only playbook launches through the seed launcher `run` (worktree
                #     headers target_prereq.yml, prereq_observe.yml, owner_key.yml; controller_prerequisite above: "under
                #     the seed launcher `run`"), so its controller-local plays (hosts localhost: the admit_ancestry includes
                #     of the record plays) are seed_run and decide with the run_pinned_vars bindings; its privileged target
                #     plays judge ancestry by root_only (below: owner_private_group not_applicable; initial_contact
                #     variant privileged), so the exception is never attempted there; a MAIN_only OPERATION that runs
                #     inside a genesis.launch stage (preparation_measurement, stage acquire: measure_controller_tools in
                #     acquire.yml) is genesis_launch and refuses. No MAIN_only binding beyond run_pinned_vars is declared.
                applicability:
                  derive: first_match
                  order: [genesis_launch, run_local_leased, seed_run]
                  caller_fact_from: [source_admission, resolve_phases, names, _rh_sa_caller, var]
                  contexts:
                    genesis_launch:
                      when: {caller_in: [genesis, launch, stages], caller_field: playbook_rel}
                      exception: refused
                      remote_tmp_launch: genesis_launch
                      text: 'owner_private_group: no private-group exception at genesis (genesis.launch admission: its decision tools are not yet identity-admitted); an owner-owned group-writable component refuses before any facts or decision'
                    run_local_leased:
                      when: {var: lme_invocation_mode, equals_from: [work_roots, run_local, pinned_vars, lme_invocation_mode]}
                      exception: decided
                      bindings_from: [work_roots, run_local, pinned_vars]
                      bindings: [rh_controller_target, rh_controller_connection, ansible_remote_tmp]
                      # C1-SR922G (CPL-OP1P-C1-CTX-LAUNCH-KEY-MAP): remote_tmp_launch is the ONE map from a context name to
