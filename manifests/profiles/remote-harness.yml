              # (kB floor-divided to MiB) and RECORDS MemTotal, MemAvailable, the budget and the shortfall. It REFUSES exactly
              # when MemTotal < budget (class never_fits) or when /proc/meminfo cannot be measured (class unmeasured; fail-closed,
              # never reported as a measurement) -- the check is never weakened; the guest is never shrunk; headroom is never
              # cut. It NEVER
              # admits a provision (admits_provision false): RS admit.yml re-reads MemAvailable immediately before a fresh
              # provision. A refusal is recorded with the measured values and the declared alternatives below; until MAIN's
              # preflight record measures a host, any obstruction is PREDICTED only.
              capacity:
                meminfo: /proc/meminfo
                admits_provision: false
                refusal: RH-TARGET-PREREQ-CAPACITY
                alternatives:                              # inventory / profile choices only; never a host name; never a shrink
                  - another_hypervisor_member              # place the guest on another role_groups.hypervisors member
                  - not_a_hypervisor_member                # remove this target from role_groups.hypervisors (non-hypervisor target)
                  - more_host_memory                       # raise the host's RAM, then re-run the preflight
                  - raise_budget_and_fail                  # a larger declared budget refuses the same way (capacity stays failed)
            # SSH INTERCEPT (codex; tick320 sequencing). Read in the PREFLIGHT after the privileged contact and before any
            # effect: the session's process ancestry must contain an OpenSSH server process and no Tailscale daemon. This proves
            # the SERVER PROCESS serving the session (and, recorded only, a listener on the connected port) -- NOT which auth
            # method succeeded. A Tailscale SSH intercept REFUSES; the remedy is an inventory-declared OpenSSH endpoint or an
            # explicitly admitted Tailscale SSH profile. UNVERIFIED on graph (Debian 13 OpenSSH layout; sshd-session >= 9.8).
            endpoint:
              ancestry_max_depth: 16
              admitted_server_exe_regex: '^/usr/(sbin/sshd|lib/openssh/sshd-session)$'
              refused_exe_regex: '(^|/)tailscaled$'
              refusal: RH-TARGET-PREREQ-SSH-INTERCEPT
              # program text run with the admitted privileged `sh` (argv: sh -c <text> lme-endpoint-ancestry <max depth>
              # <admitted realpath> <admitted sed>; no PATH lookup); prints one resolved exe per ancestor, nearest first.
              ancestry_program: >-
                p=$PPID; n=0;
                while [ "$p" -gt 1 ] && [ "$n" -lt "$1" ]; do
                "$2" -e "/proc/$p/exe" 2>/dev/null || echo "?";
                p=$("$3" -n 's/^PPid:[[:space:]]*//p' "/proc/$p/status"); n=$((n+1)); done
            # PREFLIGHT (codex-tick318-321 item 3): a declared READ-ONLY phase (play prereq-preflight) on the admitted
            # privileged contact, BEFORE any owner creation or effect. It depends on nothing an effect provides (no package, no
            # account, no directory). It observes: the principal and interpreter (the contact itself), the SSH ancestry, the
            # connected port's listeners (record only), every component of the root-only paths (work parent incl. /data, home
            # parent, journal dir, linger marker dir, the linger tool's dir, the guest storage parent) with owner/group/mode, the
            # work root / home / storage root leaves, the owner account (getent), the os family and the package mapping, the
            # preserved units (rev 4: preservation, every member) and memory (hypervisor members), and the linger tool's identity. It ALWAYS writes a scoped record
            # <state dir>/gate.<label><record_suffix> (0600; scope id + scope_sha256 + label + target) -- also when it refuses
            # (refusals listed; a contact or observation failure is rescued into the record). Only then does the record play
            # refuse. Not recorded (nothing contacted): a controller-side pre-contact refusal, an UNREACHABLE target (Ansible
            # does not rescue it). Owner-side observation is NOT here: it follows the owner bootstrap (target_bootstrap.yml);
