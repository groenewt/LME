---
# manifests/profiles/remote-harness.yml -- remote-harness / managed-controller policy (value overlay).
#
# Selected through the shared early-resolve entrypoint (ansible/roles/podman/tasks/resolve.yml,
# lme_profile=remote-harness), which byte-binds this file as _lme_profile_file. SEED-06 (JOINT with C1): the
# harness consumes the canonical projection lme_resolved.remote_harness = {schema_version, policy, policy_sha256}
# (resolve.yml composes lme_global ONCE: global | profile | lme_global_override LAST), bound into lme_resolved_revision,
# with immutability, executable identity form and reserved outputs owned by C1's protected registry
# (manifests/global.yml lme_config_registry.remote_harness_schema; codex-232517). tasks/resolve_policy.yml reads ONLY
# that section; admitted overrides are the registry's tunable paths, audited in lme_remote_harness_overridden_paths.
# This consumer lands atomically with C1's source (C1 seed06 94ab131); against an engine without the section it refuses
# RH-POLICY-UNRESOLVED.
#
# NEUTRAL for LME services: profile_overlay.vars and profile_overlay.services are EMPTY.
#
# SLICE 1 (codex-tick117 order 1; corrected per codex-tick121 SEED-01..08 and codex-tick127 genesis/python_policy/
# B_route_seams S1-S6) carries the managed-toolchain bootstrap declarations for the controller AND target roles.
# Jobs, units and legs arrive in later slices.
#
# Bootstrap arrangement: NO committed non-YAML/Jinja source.
#   declarations below + toolchains/core-2.19.11.lock.yml
#     -> testing/remote_harness/acquire.yml (MAIN, the only network stage): sha256-pinned get_url of rows with a
#        declared url into the artifact source; rows without one are refused by name
#     -> testing/remote_harness/package.yml (GENESIS package-builder stage, declared builder admitted first):
#        admits the artifacts offline, renders the seed into a LOCAL bundle (never committed) with bundle.sha256
#        (Ansible-free consumer check) and bundle.json (builder, source, input, output identities)
#     -> <bundle>/lme-controller-seed.sh apply --root <owned root>                    (controller owner)
#     -> <bundle>/lme-controller-seed.sh run --root <owned root> --ssh-auth <mode> -- -i <inv> controller.yml
#     -> ... run ... -- -i <inv> target_bootstrap.yml: the SAME bundle/seed/apply/verifier on every target of the
#        declared group, as the declared non-root owner (no become)

# PRIVATE VALUES ARE NOT DECLARED HERE: the owned root, the artifact source and the bundle directory are
# REQUIRED inputs with no default; the owner is the invoking non-root account. Consumers name the root/owner
# through inventory host vars (controller.bootstrap.inventory, no defaults).
profile_overlay:
  services: {}
  vars: {}
  lme_global:
    remote_harness:
      schema_version: 3
      operator_directives:
        - id: OP-DIRECT-20260923-UV-OFFICIAL-INSTALLER
          source: operator_direct_in_author_session
          relayed: false
          verbatim: >-
            and ot install per offical uv docs: curl -LsSf https://astral.sh/uv/install.sh | sh <<
            https://docs.astral.sh/uv/getting-started/installation/
          adopted_as:
            - controller.bootstrap.uv.install_method = official_installer_pinned (the same official installer script,
              version-pinned, sha256-checked as a local artifact, run with UV_UNMANAGED_INSTALL; never piped)
        - id: OP-DIRECT-20260923-SILMARIL-FRUGALITY
          source: operator_direct_to_claude_main
          relayed: true
          recorded_by: claude-tick104-operator-silmaril-allocation-answer-20260923-2101 (sha256 fd0d5a7459964e664ac3e0468fff9b83615e953c992ed829a6b39fb524ee26a7)
          verbatim: >-
            the silmaril allocation is current per most recent and this isnt "bc we are starving" but like
            this machine is a race horse and we can easily get too greedy and all of the sudden our platform
            only works on more expensive machines (consider the implications the OPERATOR bought his ram
            sticks for $400 and they $2000, thats why!)
          adopted_as:
            - controller.local_envelope (8 vCPU / 24e9 bytes, SI reading)
            - controller.bootstrap.budget (the seed's own scope limits, a small fraction of that envelope)


      # ---- managed controller (codex-route-v2-D1-D2-decisions-and-artifact-custody-20260923-214304, D1 option a) ----
      controller:
        decision: {ref: codex-route-v2-D1-D2-decisions-and-artifact-custody-20260923-214304, sha256: 40c16205b4394d2f67e92f4a5c0a835b0d26fb388e61d0d510f9d8d30863e2bb, option: a}
        decision_status: RESOLVED
        expect_core: 2.19.11
        lock_file_rel: testing/remote_harness/toolchains/core-2.19.11.lock.yml
        local_envelope: {vcpu: 8, memory_bytes: 24000000000, memory_unit_interpretation: SI_decimal, source: [tick104 fd0d5a74, codex-210822 b6e76364]}
        # SEED-06 (codex-232517): immutability is REGISTRY-owned (C1 lme_config_registry.remote_harness_schema, deny by
        # default); the former controller.immutable_fields deny-list is removed (it lived inside the data it protected).
        bootstrap:
          template_rel: testing/remote_harness/templates/lme-controller-seed.sh.j2
          macros_rel: testing/remote_harness/templates/macros/controller_seed.j2
          package_playbook_rel: testing/remote_harness/package.yml
          # The seed is a BUILD OUTPUT inside an operator bundle directory (never committed):
          bundle:
            seed_file: lme-controller-seed.sh
            # SEED LAUNCHER MEMBER (codex-tick217 R1): the generated caller entry of seed_launch (controller.bootstrap
            # .seed_launcher), rendered by package_bundle.yml NEXT TO seed_file. Custody = seed_file's, exactly: a
            # regular file of launcher_mode (the seed's executable mode, find %m 500) in the bundle's exact member set,
            # a line of checksum_file, named with its digest in manifest_file, admitted by admit_bundle.yml (fresh
            # render), transferred / read back / published / reaped with the bundle, and in the seed's lme_bundle_check
            # member and name sets. The launcher runs BEFORE the seed's own checks, so its boundary is the admitted
            # generated artifact plus this bundle custody (a swapped launcher is NOT guaranteed to be refused by the
            # seed it starts); the seed's bundle check is additional.
            launcher_file: lme-seed-launch.sh
            launcher_mode: '0500'
            launcher_custody: seed_file
            artifacts_dir: artifacts          # the seed reads its artifacts ONLY from <its own dir>/artifacts
            manifest_file: bundle.json
            checksum_file: bundle.sha256      # sha256sum --check format: the Ansible-free consumer check
            # CHECKSUM FORMAT CONTRACT (codex 183510; RH-BUNDLE-CHECKSUM-FORMAT): the ONE grammar of checksum_file,
            # consumed by BOTH sides -- the producer (tasks/package_bundle.yml writes each line as
            # <digest><separator><name><terminator> and refuses before publish any line not matching
            # ^<digest><separator><name>$ or a file not exactly those lines each terminated) and the controller seed
            # (controller_seed.j2 lme_bundle_check: grep -x -E <digest><separator><name> on every line, the name set
            # stripped with sed -E 's/^<digest><separator>//', the running seed line "<sha><separator><seed_file>",
            # the last byte a terminator). The regexes are POSIX ERE and Python-re compatible (no backslash, no class
            # names); the separator is literal (two spaces: sha256sum text mode, never ' *' binary mode).
            checksum_format:
              digest: '[0-9a-f]{64}'
              separator: '  '
              name: '[A-Za-z0-9._/+-]+'
              terminator: newline             # every line, the last included
            schema: lme-controller-bundle/v1
            # SEED2-PACKAGE-RESERVATION / SEED2-BUNDLE-COMPLETION: a bundle is built (package.yml) or extracted (target)
            # ONLY inside an exclusively reserved sibling staging dir `.<bundle basename>.<staging_infix>.<random>`
            # (mkdtemp) and published by ONE rename (mv -T) onto an absent destination. A destination that already
            # holds the byte-identical bundle.sha256 AND bundle.json (same provenance) is UNCHANGED (staging removed); any other content refuses and is
            # preserved. Interrupted staging never occupies the destination, so a rerun resumes at the same path.
            # Stale staging is recovered by `staging_retention` below (M1-STAGING-RECOVERY), never left unbounded.
            # The seed's `apply` independently refuses, before any mutation, unless its own directory holds exactly
            # members (type mode path) and bundle.sha256 lists exactly the declared names, the seed line carries the
            # running seed's digest, `sha256sum --check --strict` passes and bundle.json names that seed digest and
            # the check file's digest.
            staging_infix: staging
            reaping_infix: reaping
            # G-PACKAGE-REFUSAL-CODE: package.yml fail_msgs start `REFUSED <code>` (catalogue: playbook_refusals)
            refusals: {artifacts: RH-PACKAGE-ARTIFACT, staged: RH-PACKAGE-STAGED-MISMATCH}
            # r3g PER-CLASS PUBLICATION (codex 023332 path_composition: shared artifacts are reused when their declared
            # effective inputs agree; C1 field contract 033500). The deployment's scopes (lme_resolved.remote_harness
            # .scopes: controller + every target) are partitioned by C1's PUBLISHED `key_field` -- never re-derived or
            # re-merged by the route. Each distinct key is ONE class with ONE full publication destination
            # (tasks/scope_classes.yml -> package.yml -> tasks/package_bundle.yml per class): the controller's class at
            # rh_bundle_dir itself (a homogeneous deployment publishes the one bundle it always did), every other class
            # at the sibling `<rh_bundle_dir><separator><infix><separator><key>` (the full key). A sibling's basename
            # never begins with `<rh_bundle_dir basename>.`, so each destination's staging/reaping/lease/lock names
            # (`.<basename>.<infix>.*`) are disjoint from every other class's; an rh_bundle_dir whose basename already
            # matches the sibling rule refuses. Each class destination has its own custody admission, lock, lease
            # records, publish fence and E26/E32 semantics. bundle.json records `class_key` (bundle identity = class key
            # + rendered artifact digests; never a member set, never a member's policy digest). A sibling that matches
            # the rule but is not a class of this deployment is PRESERVED and reported (`undeclared_marker`), never
            # reaped, never judged by age. A target whose class bundle is missing, or whose bundle records another
            # class key, refuses (`refusal`) before any target mutation; it never falls back to the controller bundle.
            # Defence in depth: each target re-renders the seed under its OWN policy and refuses unless it equals its
            # class bundle's seed (an equal key that renders unequally names the key as insufficient).
            per_class:
              key_field: shared_artifact_inputs_sha256
              key_regex: '^[0-9a-f]{64}$'
              separator: '-'
              infix: class
              undeclared_marker: PRESERVED-UNDECLARED-CLASS
              refusal: RH-SCOPE-BINDING
            # M1-STAGING-RECOVERY (codex-000256; tasks/reap_staging.yml, used by package.yml on the controller and by
            # target_bootstrap.yml on each target, BEFORE a new staging dir is reserved). Scope: ONLY entries named
            # `.<destination basename>.<staging_infix>.*` or `.<destination basename>.<reaping_infix>.*` in the
            # destination's own (admitted, not group/other-writable) parent. No age rule, no broad pattern.
            staging_retention:
              policy: reap_dead_owned_on_next_attempt
              # an entry is OWNED only when ALL hold; the owned manifest is the declared member set of the
              # destination (package: the bundle members; target: the archive copy + `b/` + the bundle members):
              owned_when:
                - a real directory (not a link), owned by the acting uid, not group/other-writable
                - every descendant is a regular file or directory (no link, device, fifo, socket), owned by the acting uid
                - every descendant's relative path is in the owned manifest, or is a transient write of the declared
                  modules (transient_member_regex); nothing under it was unreadable to find
              transient_member_regex: '(^|/)\.ansible_tmp[^/]*$'
              target_members: {archive: transfer.tar.gz, extract_dir: b}
              # LIVENESS + QUIESCENCE (codex-001716 E20-CONCURRENCY; codex-tick138 Q-LEASE-AS-LIVENESS: a holder lease
              # alone is NOT authority to reap). Identity: every staging dir is reserved (mkdtemp) with its holder token
              # in its name, `.<name>.<staging_infix>.<token>.<random>`, token = L<machine>-<boot>-<uid>-<pid>-<start>;
              # immediately BEFORE the reservation the run writes its LEASE RECORD `.<name>.<lease_infix>.<token>`
              # (JSON, lease.record_fields: EXACTLY those ten keys, every value a JSON string; mode 0400) next to it
              # (copy: temp + rename).
              # The holder is the controller's ansible-playbook MAIN process (derived read-only on the controller:
              # /proc/self of the templating process, then its parent when the parent has the identical cmdline -- a
              # forked worker -- asserted the top of that chain and an ansible-playbook argv); its pid namespace and
              # cgroup namespace (lnk_target of /proc/<pid>/ns/{pid,cgroup}) and its cgroup v2 path (/proc/<pid>/cgroup)
              # are recorded. Every process of the run -- workers, module children, ssh clients and their ControlPersist
              # masters -- stays in that cgroup even when reparented.
              # An owned entry is reaped ONLY when BOTH hold (else it is LIVE or UNKNOWN, preserved, bytes charged):
              #  (1) CONTROLLER WRITERS QUIESCENT, observed on the controller in an ADMITTED view: the lease record is
              #      present, owned, parses and names this token; machine and uid equal this controller's; and either
              #      boot differs (the whole previous boot is gone), or pidns AND cgroupns equal the reaper's own AND
              #      (a) the holder is positively absent (stat /proc/<pid> exists=false) or a readable
              #      /proc/<pid>/stat shows another start time, AND (b) the recorded cgroup is positively gone
              #      (stat=false while its parent directory is present) or its cgroup.events reads `populated 0` (subtree).
              #      Any failed, unreadable, hidden, malformed or incomparable observation is UNKNOWN, never dead. A
              #      zombie holder or a dead holder with a non-empty cgroup is NOT dead (workers may still run).
              #  (2) TARGET WRITERS QUIESCENT (target staging only; target_quiescence): the reaper's own module runs in
              #      a logind session scope of the owner (admitted view: pam_systemd tracks this connection path), and
              #      no OTHER session scope of the owner is populated (every cgroup.events readable). Remote module,
              #      tar and mv processes of any run -- live, stale or in transit -- live in such a session scope.
              # Recovery across controllers: an entry whose recorded machine is another controller stays UNKNOWN
              # (preserved, charged; the refusal names the recorded owner) until that controller reaps it, or MAIN
              # declares the machine retired (recovery.retired_controller_machine_ids); a retired controller's entries
              # skip (1) but still require (2). Never deleted to meet a count.
              # BOTH properties hold, neither replaces the other (codex-tick139):
              #  NO LIVE-WRITER DELETION = the quiescence proofs (1) and (2) above, observed BEFORE any mutation.
              #  NO STALE PUBLICATION = the publish fence: publication is ONE declared rename of this run's own staging
              #  path onto the absent destination, run as `flock -x -w <publish_wait_seconds> -E <busy_rc>` on the SAME
              #  destination lock as every reap mutation. Ownership of a staging dir changes ONLY by the reaper's locked
              #  rename of that path to its reaping name, so the two are linearized: a publish either lands first (the
              #  staging path is gone before any reap) or finds its source moved away (mv fails; nothing lands). A
              #  publish never overwrites: `mv -T -n` (lease.authority.noreplace_arg) never replaces a present destination,
              #  even an empty one; landed iff rc 0 AND the source is gone. A publish that cannot
              #  take the lock within the bound refuses (busy_refusal) and releases its own staging and lease record.
              # Serialization: every reap mutation (rename to reaping, removal, lease-record removal) is ONE declared
              # command under `flock -x -n` on the destination lock `.<name>.<lock_suffix>` (created in the admitted
              # parent, persistent, never reaped), so competing reapers and publishers serialize; a busy lock preserves
              # (reported BUSY) rather than waits. No helper process is added: flock holds the lock exactly for the one
              # declared command it runs and releases it when that command exits.
              # WHEN RECOVERY FIRES (declared, not implied): (1) needs the recorded controller cgroup EMPTY. A controller
              # run launched from a login shell, tmux or an ssh session shares that session's scope, so an interrupted
              # run's staging stays PRESERVED-LIVE-STAGING until that session ends, the controller reboots (another boot =
              # dead), or MAIN retires the machine id. (2) needs every OTHER owner session on the target empty, so any
              # other owner login holds target reaping at PRESERVED-BUSY-STAGING. Both fail closed; the budget refusal
              # is the visible backpressure.
              lease:
                token_regex: '^L[0-9a-f]{32}-[0-9a-f]{32}-[0-9]+-[1-9][0-9]*-[0-9]+$'
                proc_root: /proc
                cgroup_root: /sys/fs/cgroup
                cgroup_v2_marker: /sys/fs/cgroup/cgroup.controllers
                machine_id_path: /etc/machine-id
                boot_id_path: /proc/sys/kernel/random/boot_id
                holder_argv_regex: '(^|/)ansible-playbook([^-_./A-Za-z0-9]|$)'
                ns_regex: '^(pid|cgroup):\[[0-9]+\]$'
                record_schema: lme-staging-lease/1
                # r3f (G O01/S01 plant foreign records): the record is ONE flat JSON object with EXACTLY these keys, every
                # value a JSON STRING matching its format; any other key, type or format = no record (UNKNOWN, preserved)
                record_fields:
                  schema: 'string == record_schema'
                  token: 'string, token_regex, == the file name suffix and == L<machine>-<boot>-<uid>-<pid>-<start>'
                  machine: 'string, 32 lowercase hex (/etc/machine-id of the reserving controller)'
                  boot: 'string, 32 lowercase hex (boot_id without dashes)'
                  uid: 'string, decimal (controller uid)'
                  pid: 'string, decimal >= 1 (holder ansible-playbook main pid)'
                  start: 'string, decimal (field 22 of /proc/<pid>/stat)'
                  pidns: 'string, ns_regex pid:[<inode>]'
                  cgroupns: 'string, ns_regex cgroup:[<inode>]'
                  cgroup_b64: 'string, base64 of the holder cgroup v2 path (/proc/<pid>/cgroup without 0::)'
                lease_infix: lease
                lock_suffix: lock
                # DESTINATION LOCK CUSTODY (codex 183510; RH-STAGING-LOCK-CUSTODY). `.<dest basename>.<lock_suffix>` in the
                # destination parent (the controller's <work root>/.bundle.lock; each target's bundle-dir sibling) is
                # persistent state of the SAME owner as the staging it serializes (the acting uid, rh_reap_uid). It is
                # admitted by tasks/reap_staging.yml BEFORE any flock on it (the reap mutations and both callers'
                # publish fences run after that include), never created implicitly by flock (O_CREAT 0666 & ~umask):
                #   absent  -> created ONCE by the declared sh as `umask <create_umask> && : >> <lock>`: O_CREAT|O_APPEND,
                #              so it never truncates or replaces an inode (a lock another process already holds keeps
                #              its identity) and the umask binds only that one child process (no host or play change);
                #   present -> never recreated, never chmod-ed: it must be a regular file (not a link) owned by `owner`
                #              and not group/other-writable (existing), else refusal (preserved for the operator);
                #   read back after creation: regular, owner, exactly `mode`.
                lock_file:
                  owner: acting_uid                  # rh_reap_uid on this host
                  mode: '0600'
                  create_umask: '0177'               # 0666 & ~0177 = 0600
                  create: append_open_if_absent
                  existing: {regular_file: true, refuse_links: true, owner: acting_uid, refuse_group_other_writable: true}
                  refusal: RH-STAGING-LEASE
                busy_rc: 75
                publish_wait_seconds: 30     # bounded wait of the publish fence for the destination lock
                kat_lock_suffix: lme-flock-kat   # r3f: flock known answers run on a PRIVATE temp lock, never the destination lock
                # r3f R3E-WRITER-CONTAINMENT: subtree liveness is cgroup.events `populated` (cgroup v2: the cgroup AND
                # every descendant), never an empty direct cgroup.procs
                events_file: cgroup.events
                populated_regex: '^populated [01]$'
                unpopulated_regex: '(?m)^populated 0$'
                refusal: RH-STAGING-LEASE
                busy_refusal: RH-STAGING-BUSY
                # PUBLICATION AUTHORITY / EPOCH (r3f, codex-tick144 E26-INFLIGHT-COMPLETION). A lock around the rename
                # alone proves nothing about revocation, so the authority is declared:
                #  AUTHORITY = this run's staging path, which carries its lease token (`.<name>.<staging_infix>.<token>.*`).
                #   It is checked by the publish rename ITSELF: renameat2(source, destination, RENAME_NOREPLACE) run as the
                #   child of `flock -x -w` on the destination lock. flock (no -o) keeps the locked descriptor in that
                #   child, so the lock is held continuously through the rename even if the flock parent is killed.
                #  REVOCATION = renaming that staging path away (to its reaping name) under the SAME lock. Every revoker --
                #   recovery (tasks/reap_staging.yml), teardown and machine retirement (owned by their callers) -- MUST
                #   (1) take the destination lock, (2) hold the SAME quiescence proof for every lease of that destination,
                #   (3) rename each staging away, then remove its lease record, and only then touch the destination; a
                #   live or unknown lease makes the revoker REFUSE (busy), never delete. So a writer that could still
                #   resume (stopped, in flight, orphaned) is never revoked under it, and no revoker mutates a live
                #   writer's staging.
                #  OUTCOMES: (i) the rename finds its source gone -> it failed atomically, nothing lands: RH-STAGING-REVOKED
                #   (a resumed old writer never mutates the revoker's staging: its own path no longer exists and its
                #   release steps name only its own token). (ii) an interrupted run's publisher that already holds the
                #   lock completes its admitted rename of the exact verified extraction: ADMITTED only because no revoker
                #   can have acted (the lock is held and its writers are live); the next run reads the destination back
                #   and converges (identical check file + manifest) or refuses reporting the present config_revision.
                #   A destination that appeared, even an EMPTY dir, is never replaced (noreplace_arg): a successor that
                #   landed first cannot be published over, and an older publisher that landed first makes the successor
                #   refuse with the present revision (never silently accepted).
                #  A publish LANDED iff the rename exited 0 AND its source is gone. The exit status of a no-replace skip
                #  differs across coreutils versions (0 on 9.7, verified locally), so landing is decided by the source
                #  still being present, never by the exit status alone.
                authority:
                  token_in: staging_path
                  check: noreplace_rename_under_destination_lock
                  noreplace_arg: '-n'            # coreutils mv: renameat2 RENAME_NOREPLACE (verified locally, coreutils 9.7)
                  revokers: [recovery, teardown, retirement]
                  revoker_contract: [take_destination_lock, prove_quiescence_of_every_lease, rename_staging_away, remove_lease_record, then_destination]
                  revoked_refusal: RH-STAGING-REVOKED
              # CONTAINMENT (r3f R3E-WRITER-CONTAINMENT; source reasoning, not executed). Controller: the recorded cgroup
              # is the holder's (the seed's own `systemd-run --user --scope`, or the login session scope when package.yml
              # runs directly); every writer of the run is forked inside it and no declared operation re-scopes a
              # process, and `populated` covers nested cgroups. Target: writers run over SSH, so pam_systemd puts them in
              # a root-owned session scope they cannot leave (cgroup-v2 migration needs write access to the common
              # ancestor, the root-owned user slice, admitted by stat); the user slice may contain ONLY session scopes
              # and manager_unit (no staging-writing operation spawns via the user manager); any other child, failed
              # read or unproven own scope is not quiescent. The reaper's own session is excluded ONLY because it was
              # opened by this run's own connection (control path in the seed's fresh per-run ANSIBLE_HOME; ssh args
              # pinned by admit_transport), so everything in it descends from this run.
              target_quiescence:
                user_slice: 'user.slice/user-{uid}.slice'
                session_glob: 'session-*.scope'
                session_path_regex: '/session-[^/]+[.]scope$'
                manager_unit: 'user@{uid}.service'
                own_cgroup_regex: '^0::/user[.]slice/user-{uid}[.]slice/session-[^/]+[.]scope$'
              recovery:
                retired_controller_machine_ids: []   # MAIN-declared; empty = no controller is retired
              live_report: 'PRESERVED-LIVE-STAGING'
              busy_report: 'PRESERVED-BUSY-STAGING'
              reaped_report: 'REAPED-STAGING'
              # removal: each reapable staging dir is first RENAMED to its reaping name (token kept), then every
              # reapable reaping dir is removed, then each lease record whose token is reapable and no longer named by
              # any entry; all three under the destination lock (above), then the scope is re-listed. An interrupted
              # reap leaves a reaping dir / record that the next attempt removes (same admission, same proofs).
              # A live concurrent builder's staging is never renamed or removed: concurrent builders each keep their
              # own staging, exactly one publish rename lands, and the loser returns UNCHANGED (identical check file +
              # manifest) or REFUSED (different bundle), releasing only its own staging and lease record.
              # any other entry in scope (foreign owner, a link or file with the staging name, an off-manifest member,
              # no/unreadable lease record, an unproven view): PRESERVED untouched and reported; never pruned.
              unknown: preserve_and_report
              unknown_report: 'PRESERVED-UNKNOWN-STAGING'
              # BOUND: after the reap step NO reapable owned staging/reaping dir or record remains (keep 0); each run
              # reserves exactly one per destination (max_reserved_per_run 1). Live, busy and unknown entries are NOT
              # bounded by a count: they are charged by the free-space measure, and the budget refusal is the honest
              # backpressure (it names them, with their recorded owners).
              # Bytes: the reservation is refused unless no reapable entry remains and the destination filesystem has
              # free_bytes_factor x the bundle's bytes available AFTER the reap (declared df, identity-admitted).
              keep: 0
              max_reserved_per_run: 1
              budget: {free_bytes_factor_package: 2, free_bytes_factor_target: 3, refusal: RH-STAGING-BUDGET}
              # task names (G: controls wait on them in the recorded stdout; tasks/reap_staging.yml)
              task_names:
                lease: 'Derive this run''s staging holder lease (controller ansible-playbook main process; read-only /proc)'
                entry: 'List this destination''s staging, reaping and lease entries (any type; no links followed)'
                classify: 'Classify each candidate (owned manifest, lease record, controller and target quiescence)'
                live: 'Report every live, busy or unknown entry (preserved untouched, bytes charged)'
                rename: 'Take each reapable staging dir out of the publish path (flock -x -n on the destination lock; mv -T)'
                remove: 'Remove every reapable reaping dir (flock -x -n on the destination lock; rm -rf)'
                budget: 'Refuse if the reap did not converge or the reservation does not fit (backpressure; nothing reserved)'
                record: 'Record this run''s lease next to the destination (before the reservation)'
                reaped: 'Report the reap result (reaped entries; entries left by a busy lock stay preserved)'
                publish_package: 'Publish by ONE rename onto the absent destination under the destination lock (publish fence; declared flock + mv)'
                publish_target: 'Publish the verified extraction by ONE rename onto the absent bundle dir under the destination lock (publish fence; declared flock + mv)'
                landed_package: 'Observe whether the publish rename consumed this run''s staging (landed iff rc 0 AND the source is gone)'
                landed_target: 'Observe whether the publish rename consumed this run''s staging source (landed iff rc 0 AND the source is gone)'
                revoked_package: 'Refuse a publish whose authority was revoked (its staging was moved away under the destination lock)'
