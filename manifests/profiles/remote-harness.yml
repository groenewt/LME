          # digest re-declared here (serialized through C1). Host / path / unit selections are declared target inputs
          # (inventory.target_inputs obs_*), never job-file edits. jobs_sha256 = the m1-1 file after route's repair,
          # verified by MAIN.
          observation:
            playbook_rel: testing/remote_harness/observe.yml
            jobs_rel: testing/remote_harness/jobs/observations.yml
            jobs_sha256: db08c451005cb8ba671b752936ce99041705ee9b5bf3c6454eac48121bbd46eb
            jobs_schema: lme-observation-jobs/1
            step_template_rel: testing/remote_harness/templates/observation_step.j2
            macros_rel: testing/remote_harness/templates/macros/observation.j2
            connect_as: owner
            channel: raw
            refusal: RH-OBSERVATION
            inputs: {job_var: lme_obs_job, attempt_var: lme_obs_attempt, attempt_regex: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$'}
            evidence:
              run_rel: observations
              dir_mode: '0700'
              file_mode: '0600'
              attempt_file: attempt.json
              host_dir: hosts
              host_name_regex: '^[A-Za-z0-9][A-Za-z0-9._-]*$'
              attempt_schema: lme-observation-attempt/1
              host_schema: lme-observation-host/1
          # TARGET PREREQUISITE POLICY (TP-REG, BLOCKER-A; codex-tick356; B c1-jkey-proposal b27057d8 TP-REG): registered
          # ONCE, VERBATIM (values and comments) from testing/remote_harness/target_prereq.decl.yml `target_prereq`
          # REVISION 3 at the FROZEN sha256 743b68e8067d5aebf9f6c1c61ab6df629e35efe77d31f9f0b39777627440d064 (decl lines
          # 33-213). REVISION 4 (C1 hunk 2, MAIN relay): r3 + the delta of B's
          # testing/e2e/target_prereq/target_prereq.decl.r4-proposal.yml at sha256
          # d96f4ed9f969debe482cde040edf9717bec9b3f5c1eca0581fc3917f5b8a1e23 (C1 hunk 3 rebind; was eb7362cd: + absent_states,
          # + routes.loaded_without_unit_file, reworded verified_none.check / discovery.limit; C1 hunk 4 rebind to
          # f4b03157d50338c09e9174ddc86da09a811265a64f0766e9aae2e82da1b73ca1 = join TP4-ACTIVESTATE-PROBE, codex-tick375-377:
          # + preservation.probe, inactive_not_enabled load_states / active_states / unit_file_states replacing
          # refused_states / refused_status, + routes failed / load_refused / probe_unknown, reworded text leaves; the
          # proposal keeps REVISION 4 and both consumers still assert revision 4, so no bump) (changed: revision, preflight.record_schema,
          # reuse.preflight_rel; removed: hypervisor.preserved_refused_states / _status; added: preservation, observe),
          # values and comments verbatim except: the proposal's YAML anchor &retire (routes.running, aliased by
          # routes.enabled / routes.present_after_retirement) is written out as three identical mappings (this profile
          # carries no YAML aliases; parsed value unchanged). Contract contract_admission.target_prereq (key_set; revision
          # [4]); consumers testing/remote_harness/target_prereq.yml, testing/e2e/target_prereq/prereq_observe.yml and
          # tasks/prereq_preflight.yml (read ONLY rh.controller.bootstrap.target_prereq). Its
          # packages.hypervisor_required needs a mapping in EVERY os family (package_mapping.required_lists): see packages.
          target_prereq:
            revision: 4
            runner: MAIN_only                     # privileged connection profile; subagents and owner runs never start it
            connection_profile: privileged        # rh.controller.bootstrap.inventory.connection_profiles.<this> (user root)
            refusal: RH-TARGET-PREREQ
            reuse:
              transfer_dir_rel: testing/e2e/transfer          # tr_dir == <rh_repo_root>/<this> (derived at first entry; asserted)
              transfer_decl: transfer.decl.yml
              controller_prelude: tasks/bind_controller.yml   # tr_conn, tr_bs, tr_state, tr_scope_expect (the ONE contract)
              contact_rel: testing/remote_harness/tasks/initial_contact.yml
              contact_variant: privileged
              # reuse gains the shared B-owned preflight tasks file (was inline in target_prereq.yml)
              preflight_rel: testing/e2e/target_prereq/tasks/prereq_preflight.yml
              # codex-tick397 R1-s3: the POSIX separator joining rh_repo_root and every reuse / evaluation rel path the shared
              # evaluation and its control compose (was an inline '/' in those joins)
              path_separator: /
            layout:
              toolchain_rel: toolchain                    # toolchain root == <work root>/<this> (== work_roots.sub_roots.toolchain)
              bundles_rel: bundles                        # bundle root == <work root>/<this>
              bundle_leaf_regex: '^[0-9a-f]{64}$'         # bundle dir == <bundle root>/<immutable identity leaf>
              owner_dir_mode: '0700'
