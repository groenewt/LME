            # carries, per operation the per-run data NAMES (controller.operation; there is NO default operation).
            #   inputs_in_run_data  true: the role values come from the run data's controller.inputs; false: from the
            #                       operator controller inventory's localhost vars <inputs.<role>.var> (presence-checked)
            #   identity_nullable   true: a lab with no lme_deployment_identity renders, as null DIAGNOSTIC attribution
            #   run_hosts           false: the run data may name no host (zero-target operation)
            #   placement_keys      the member_of keys a run host may carry; placement_required: each host carries one
            #   inputs              role -> {var: the localhost var the binding sets, path: bool, regex (path false only)}
            controller_operations:
              acquisition:
                inputs_in_run_data: false
                identity_nullable: false
                run_hosts: true
                placement_keys: [target, hypervisors, telemetry_sources, workload]
                placement_required: false
                inputs:
                  bundle_dir: {var: rh_bundle_dir, path: true}
                  artifact_source: {var: rh_artifact_source, path: true}
                  acquisition_receipt: {var: rh_acquisition_receipt, path: true}
              preparation_measurement:
                inputs_in_run_data: true
                identity_nullable: true
                run_hosts: false
                placement_keys: []
                placement_required: false
