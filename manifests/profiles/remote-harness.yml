              # correction of the r3g rows, which were stale on B: B's contract reads the ONE run mode and refuses any
              # other before effects -- testing/e2e/transfer/tasks/resolve_contract.yml:24-41 (host mode_var ==
              # lookup(env ssh_auth.env_mode), mode in ssh_auth.modes, mode in contract.auth_modes_admitted, else
              # TRANSFER-CONTRACT-AUTH-MODE) and testing/e2e/transfer/transfer.decl.yml:119-122 (auth_modes_admitted
              # [explicit_key, tailnet_identity]; auth_modes_refused {agent}); its identity options come ONLY from the
