          # carries no YAML aliases; parsed value unchanged). Contract contract_admission.target_prereq (key_set; revision
          # [4]); consumers testing/remote_harness/target_prereq.yml, testing/e2e/target_prereq/prereq_observe.yml and
          # tasks/prereq_preflight.yml (read ONLY rh.controller.bootstrap.target_prereq). Its
          # packages.hypervisor_required needs a mapping in EVERY os family (package_mapping.required_lists): see packages.
          target_prereq:
            revision: 4
            runner: MAIN_only                     # privileged connection profile; subagents and owner runs never start it
            connection_profile: privileged        # rh.controller.bootstrap.inventory.connection_profiles.<this> (user root)
            refusal: RH-TARGET-PREREQ
            reuse:
              transfer_dir_rel: testing/e2e/transfer          # tr_dir == <rh_repo_root>/<this> (derived at first entry; asserted)
              transfer_decl: transfer.decl.yml
              controller_prelude: tasks/bind_controller.yml   # tr_conn, tr_bs, tr_state, tr_scope_expect (the ONE contract)
              contact_rel: testing/remote_harness/tasks/initial_contact.yml
              contact_variant: privileged
              # reuse gains the shared B-owned preflight tasks file (was inline in target_prereq.yml)
              preflight_rel: testing/e2e/target_prereq/tasks/prereq_preflight.yml
              # codex-tick397 R1-s3: the POSIX separator joining rh_repo_root and every reuse / evaluation rel path the shared
              # evaluation and its control compose (was an inline '/' in those joins)
              path_separator: /
            layout:
              toolchain_rel: toolchain                    # toolchain root == <work root>/<this> (== work_roots.sub_roots.toolchain)
              bundles_rel: bundles                        # bundle root == <work root>/<this>
              bundle_leaf_regex: '^[0-9a-f]{64}$'         # bundle dir == <bundle root>/<immutable identity leaf>
              owner_dir_mode: '0700'
              # the work root's parent (codex ACCEPTED: a root-owned intermediate as a declared, overridable INVENTORY choice,
              # the four prereq_work_parent_* roles). Its path must be dirname(<work root>), its owner root, its mode never
              # group/other-writable (C1: the regex refuses 0722, 0702, 0620 ...: only 0/1/4/5 in the group and other digits).
              work_parent_rule: {path: dirname_of_work_root, owner: root, mode_regex: '^0[0-7][0145][0145]$'}
            # ADOPTION (codex-tick302; tick320 (3)): observe first. Absent -> created. Matching campaign state -> OBSERVATION ONLY
            # (no write; "matching" is the COMPLETE metadata: type, no link, uid, gid, mode, and content digest where declared).
            # Anything else -> REFUSED before any mutation: preserved untouched and reported. Never a usermod, chown or chmod of
            # state that neither this run nor a recorded unfinished run of this leg created.
            owner_account:
              # the campaign marker: an owner account is campaign state ONLY with exactly this GECOS, the declared shell and
              # home, and a same-named primary group. A historical account (e.g. shell nologin) is NEVER converted.
              gecos: 'LME remote-harness deployment owner (target_prereq)'
              create_home: true
              system: false
              passwd_fields: {gecos: 3, home: 4, shell: 5}        # getent passwd value index (after the name key)
              home_mode_regex: '^0[0-7][0145][0145]$'             # the created home is never group/other-writable
