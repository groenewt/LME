                  types: {link: link, dir: dir, file: file, other: other}
                  contact_states: {admitted: admitted, not_admitted: not_admitted}
                  # finding classes, first match wins in this order: absent, not_regular, checksum_missing,
                  # declared_unmeasured, differs
                  findings: {absent: absent, not_regular: not_regular, checksum_missing: checksum_missing,
                             declared_unmeasured: declared_unmeasured, differs: differs}
                  cleared_on_failure: [measured, chain, absent, candidate_override, candidate_sources, findings, evidence]
                texts:
                  op: >-
                    the operation extra-var tp.observe.measure.op_var is absent or not one of tp.observe.measure.ops (no
                    default; MAIN names the operation explicitly)
                  pre_contact: Nothing was contacted.
                  selection: >-
                    the measurement selection (os_tools entries labelled with observation.required_by, plus
                    observation.hypervisor_required_by only when this host is a hypervisors role-group member with a
                    resolved guest.allocation, i.e. its QEMU work is declared) is empty, lost the preservation probe tool
                    or the linger tool, names a path outside path_admission.regex, or an entry without a declared identity kind
                  expectation: >-
                    accepted as a DIAGNOSTIC MEASUREMENT (not as an admission) only when the privileged initial contact is
                    admitted and every selected entry has a recorded lstat (present or absent) and, when present, a digest
                    attempt; absent / not-regular / checksum-missing / declared-unmeasured / differing entries are findings
                    for MAIN, never refusals
                  contact: >-
                    the privileged initial contact was not admitted; its refusal is recorded and no measurement or candidate
                    identity is derived (measurement never establishes its own initial trust; a failed core initial-contact
