              - {name: UV_CACHE_DIR, sub: cache, rel: uv, kind: dir}
              - {name: PIP_CACHE_DIR, sub: cache, rel: pip, kind: dir}
              - {name: XDG_DATA_HOME, sub: engine_storage, rel: xdg-data, kind: dir}
              - {name: CONTAINERS_STORAGE_CONF, sub: engine_storage, rel: storage.conf, kind: engine_storage_conf}
              - {name: CONTAINERS_CONF, sub: engine_storage, rel: containers.conf, kind: engine_containers_conf}
