      # GUEST LIFECYCLE (C1 hunk 4, MAIN relay; RS .scratchpad-14bbf94b/RS/guest-join-frozen-r2.yml 8f7a0070
      # profile_guest_section, registered ONCE, values and comments VERBATIM -- the trailing :NNNN citations are RS r2's,
      # against global.yml 07472d7b; the checks now live in contract_admission.guest_lifecycle, global.yml :1166+). Lands
      # together with its profile_companion_deltas (os_tools qemu-img / qemu-system-x86_64 / cloud-localds, identity
      # UNMEASURED = fail-closed, paths == preparation.tool_packages members; required_by += guest on env, df, mkdir, mv,
      # systemd-run, flock, timeout, systemctl; packages.provides qemu_utils / qemu_system_x86 / cloud_image_utils).
      # NO allocation (override_only_paths): graph's lme_global_override.remote_harness.guest.allocation is B's, with
      # base_image {file, sha512} = a candidate of the ADMITTED preparation record (admit_preparation.yml).
      guest:
        schema_version: 1                                  # global.yml:1154 enum [1]
        modes: {var: lme_guest_mode, allowed: [provision, verify, retire]}   # :1156-1159 (allowed is order-exact)
        tools:                                             # :1166 exact 11 roles; :1167 each names os_tools entry required_by guest
          cloud_localds: cloud-localds                     # NEW entry (profile_companion_deltas.add)
          df: df                                           # profile:682 (+guest)
          env: env                                         # profile:673 (+guest)
          flock: flock                                     # profile:706 (+guest)
          mkdir: mkdir                                     # profile:685 (+guest)
          mv: mv                                           # profile:687 (+guest)
          qemu_img: qemu-img                               # NEW entry
          qemu_system: qemu-system-x86_64                  # NEW entry
          systemctl: systemctl                             # profile:731 (+guest)
          systemd_run: systemd-run                         # profile:705 (+guest)
          timeout: timeout                                 # profile:727 (+guest)
        kvm_device: /dev/kvm                               # :1168 abs_path
        proc_meminfo: /proc/meminfo                        # :1169
        proc_root: /proc                                   # :1172
        uuid_source: /proc/sys/kernel/random/uuid          # :1170
        linger_dir: /var/lib/systemd/linger                # :1171 (equals target_prereq.linger.marker_dir profile:1656)
        boot_timeout_s: 900                                # :1173
        endpoint_timeout_s: 120                            # :1174
        layout:                                            # :1175 exact keys
          bases_dir: bases                                 # :1270 rel_segment
          runs_dir: runs                                   # :1271, :1273 distinct
          preserved_dir: preserved                         # :1272, :1274 distinct
          claim_prefix: .claim-                            # :1176 hidden_prefix
          epoch_partial_infix: .partial-epoch-             # :1252-1254 hidden_prefix + hidden_dash_prefix + distinct
          run_files:                                       # :1177 exact keys; :1185 values_distinct; :1275-1276
            os_disk: os.qcow2
            data_disk: data.qcow2
            seed: seed.img
            user_data: user-data
            meta_data: meta-data
            console: console.log
            qmp: qmp.sock
            record: record.json
            os_disk_partial: os.qcow2.partial              # :1179 partial_file
            data_disk_partial: data.qcow2.partial          # :1180
            seed_partial: seed.img.partial                 # :1181
          dir_mode: '0700'                                 # :1277 enum ['0700'] (string)
          file_mode: '0600'                                # :1278 enum ['0600'] (string)
        lease:                                             # :1201-1203 exact 18 keys
          schema: lme-guest-lease/3                        # :1204-1206
          epoch_prefix: .lease-epoch-                      # :1207-1209
          stage_prefix: .lease-stage-                      # :1210-1212
          live_dir: live                                   # :1213-1214 lower_word
          revoked_prefix: revoked-by-                      # :1215-1216 dash_prefix
          lock_wait_s: 30                                  # :1217 [1,300]
          busy_rc: 75                                      # :1218 [1,125]
          holder_file: holder.json                         # :1219-1220
          holder_fields: [acquired_epoch, broke, epoch, hypervisor, mode, nonce, owner_uid, recovered, run_id, schema, term_end_epoch, ttl_s]   # :1225-1227 exact set
          released_file: released.json                     # :1221-1223
          released_fields: [epoch, nonce, released_epoch, schema]   # :1228-1230 exact set
          break_var: lme_guest_lease_break                 # :1231-1235 var_name, not reserved/resolver, guest_input_var
          recover_var: lme_guest_lease_recover             # :1237-1240
          evidence_prefix: .lease-evidence-                # :1257-1259
          ttl_s: 9000                                      # :1244-1248 int_gt_sum; 900+120+120+30*(30+180+10)+60 = 7800 < 9000
          step_s: 180                                      # :1241
          kill_after_s: 10                                 # :1242
          margin_s: 60                                     # :1243
        recovery:                                          # :1263 exact keys
          var: lme_guest_recover                           # :1264-1266
          gone_active_states: [failed, inactive]           # :1267-1268
          console_evidence_infix: evidence                 # :1269 rel_segment
        preserved_physical_prefixes: [/var/lib/containers/, /run/containers/, /etc/containers/, /etc/lme/, /opt/lme/, /root/]   # :1279-1280 abs_dir_prefix
        unit:                                              # :1281-1283
          name: 'lme-guest-{run_id}.service'               # guest_unit_name :1072
          properties: [Type=exec, KillMode=mixed, TimeoutStopSec=120]
        qemu:                                              # :1284 exact keys
          accel: kvm                                       # :1285
          machine: q35                                     # :1287 qemu_word
          cpu: host                                        # :1288
          display: none                                    # :1286 enum [none] (YAML string 'none', not null)
          net: {mode: user, bind: 127.0.0.1, guest_port: 22, device: virtio-net-pci}   # :1290-1294
          disk_device: virtio-blk-pci                      # :1289
          data_serial_prefix: lme-data-                    # :1295, :1297 (9 + 8 uuid chars = 17 <= 20 serial bytes)
          os_serial_prefix: lme-os-                        # :1296
        cloud_init:                                        # :1302 exact keys
          privileged_account: {name: root, disable_root: false, lock_passwd: true}   # :1303-1306
          ssh: {pwauth: false, deletekeys: true, genkeytypes: [ed25519, ecdsa]}     # :1307-1311
          data_fs:                                         # :1312-1321
            label: lme-data
            filesystem: ext4
            partition: none
            overwrite: false
            mount: /data
            mount_options: 'defaults,nofail,x-systemd.device-timeout=30'
            dump: '0'
            pass: '2'
            device_prefix: /dev/disk/by-id/virtio-
          identity_check: {shell: sh, source: /sys/class/dmi/id/product_uuid, marker: LME-GUEST-IDENTITY-MISMATCH, console: /dev/console, on_mismatch: [poweroff]}   # :1322-1327
          console_fingerprints:                            # :1328-1333
            begin_marker: '-----BEGIN SSH HOST KEY FINGERPRINTS-----'
            end_marker: '-----END SSH HOST KEY FINGERPRINTS-----'
            line_regex: '([0-9]+) (SHA256:[A-Za-z0-9+/]+) .* \(([A-Z0-9-]+)\)\s*$'
          console_host_keys:                               # :1337-1346
            begin_marker: '-----BEGIN SSH HOST KEY KEYS-----'
            end_marker: '-----END SSH HOST KEY KEYS-----'
            wait_s: 120
            line_regex: '^((ssh-ed25519|ecdsa-sha2-nistp256|ecdsa-sha2-nistp384|ecdsa-sha2-nistp521) ([A-Za-z0-9+/]+={0,3}))( [ -~]*)?$'
            type_map: {ed25519: ssh-ed25519, ecdsa: ecdsa-sha2-nistp256}
        record:                                            # :1347 exact keys
          schema: lme-guest-record/2                       # :1349, :1353
          fields: [schema, run_id, name, hypervisor, owner_uid, uuid, generation, state, lease_nonce, lease_epoch, storage_root, run_dir, base, base_sha512, disks, unit, endpoint, allocation, host_key_fingerprints, host_public_keys, recoveries, observed_at_utc]   # :1354-1357
          states: [claimed, starting, started, retired]    # :1348 order-exact
        refusals:                                          # :1358-1371 (22 keys, 22 distinct GUEST- codes)
          decl_invalid: GUEST-DECL-INVALID
          scope: GUEST-HYPERVISOR-SCOPE
          tool: GUEST-TOOL-MISSING
          kvm: GUEST-KVM-ACCESS
          user_manager: GUEST-USER-MANAGER
          storage: GUEST-STORAGE-ROOT
          capacity: GUEST-CAPACITY
          memory: GUEST-MEMORY
          base: GUEST-BASE-IMAGE
          present: GUEST-RECORD-PRESENT
          mismatch: GUEST-RECORD-MISMATCH
          unit: GUEST-UNIT
          endpoint: GUEST-ENDPOINT
          ambiguous: GUEST-STATE-AMBIGUOUS
          unit_reused: GUEST-UNIT-REUSED
          lease_held: GUEST-LEASE-HELD
          lease_lost: GUEST-LEASE-LOST
          host_keys: GUEST-HOST-KEYS
          disk_identity: GUEST-DISK-IDENTITY
          recovery: GUEST-RECOVERY
          record_version: GUEST-RECORD-VERSION
          lease_recovery: GUEST-LEASE-RECOVERY
        # NO allocation key, not even {}. override_only_paths global.yml:806 plus lme_manifests.py:3080-3085 refuse a
        # global or profile allocation. key_set global.yml:1150-1153 admits allocation only as optional.
      # OS packages of the bootstrap closure (logical name -> package per os_family). On a TARGET the root setup step of
      # the managed target bootstrap installs the missing ones (later slice); on the CONTROLLER they are asserted
      # preconditions (controller.bootstrap.os_tools), never installed by the unprivileged seed.
      # The target end of the deploy transfer needs tar + gzip (remote_harness.transfer), already listed.
      # The seed runs UNCHANGED on targets (one operation), so the target closure is every os_tools entry
      # required_by seed/uv_installer PLUS the transfer adapter's target tools; `provides` maps each tool name to its
      # logical package so a preflight refusal names what MAIN must install (root step, MAIN-only, not in this slice).
      packages:
        by_os_family:
          Debian: {git: git, jq: jq, curl: curl, ca_certificates: ca-certificates, tar: tar, gzip: gzip, xz: xz-utils, coreutils: coreutils, diffutils: diffutils, findutils: findutils, util_linux: util-linux, systemd: systemd, libc_tools: libc-bin, sed: sed, grep: grep, awk: mawk, dash: dash, acl: acl, openssh_client: openssh-client, qemu_utils: qemu-utils, qemu_system_x86: qemu-system-x86, cloud_image_utils: cloud-image-utils, gpgv: gpgv, dpkg: dpkg, debian_archive_keyring: debian-archive-keyring}
          RedHat: {git: git, jq: jq, curl: curl, ca_certificates: ca-certificates, tar: tar, gzip: gzip, xz: xz, coreutils: coreutils, diffutils: diffutils, findutils: findutils, util_linux: util-linux, systemd: systemd, libc_tools: glibc-common, sed: sed, grep: grep, awk: gawk, dash: bash, acl: acl, openssh_client: openssh, qemu_utils: qemu-img, qemu_system_x86: qemu-kvm, cloud_image_utils: cloud-utils, gpgv: gnupg2, dpkg: dpkg}
        # qemu_utils / qemu_system_x86 / cloud_image_utils (TP-REG): controller.bootstrap.target_prereq.packages
        # .hypervisor_required, which package_mapping.required_lists (global) requires in EVERY family once the node is
        # declared. Names from B (graph-shared PKGS fixture / target_prereq.decl 743b68e8 packages comment); the RedHat
        # names are UNVERIFIED (B).
        # openssh_client (J-KEY JK-1b) is a CONTROLLER-only logical package (ssh-keygen, required_by owner_key_generation):
        # mapped in every family and named in provides so a refusal names it, but NOT in `required` (the TARGET install list).
        # gpgv / dpkg (C1 hunk 4, P-x) are CONTROLLER-only PREPARATION packages (os_tools gpgv / dpkg-deb, required_by
        # [preparation]; xz already mapped): named in provides so admit_prep_tools.yml's refusal names them (its fail_msg
        # extracts every provides key from by_os_family.Debian, so each needs a Debian mapping); NOT in `required`. The
        # RedHat names (gnupg2 ships gpgv; dpkg from EPEL) are UNVERIFIED. qemu_utils / qemu_system_x86 / cloud_image_utils
        # gain provides entries (RS guest-join-frozen-r2 packages_provides_add; refusal naming only).
        required: [jq, curl, ca_certificates, tar, gzip, xz, coreutils, diffutils, findutils, util_linux, systemd, libc_tools, sed, grep, awk, dash, acl]
        conditional: {git: [package_source_binding, source_edition_binding]}
        provides:
          dash: [sh]
          coreutils: [env, id, uname, cut, stat, realpath, df, du, date, mkdir, mktemp, mv, rm, rmdir, chmod, cat, head, tail, base64, sort, sha256sum, 'true', timeout, readlink]
          libc_tools: [ldd, getent]
          grep: [grep]
          sed: [sed]
          awk: [awk]
          tar: [tar]
          gzip: [gzip]
          diffutils: [cmp, diff]
          findutils: [find, xargs]
          curl: [curl]
          systemd: [systemd-run, systemctl, systemd-analyze, busctl, loginctl]
          util_linux: [flock, findmnt, lsblk]
          git: [git]
          acl: [getfacl]
          openssh_client: [ssh-keygen]
          gpgv: [gpgv]
          dpkg: [dpkg-deb]
          xz: [xz]
          qemu_utils: [qemu-img]
          qemu_system_x86: [qemu-system-x86_64]
          cloud_image_utils: [cloud-localds]

      # ---- deploy transfer (codex-tick119 R1_R3_seam_direction R1) ----
      # The transfer operation's dependencies are declared on BOTH ends. Selected: the managed_archive adapter, which
      # needs NO rsync anywhere: the controller end runs inside the seed-installed generation (Python tarfile via the
      # locked community.general collection), the target end uses ansible.builtin.unarchive with the target's tar + gzip
      # (packages.required, installed by the same managed target bootstrap). The Silmaril controller therefore needs
      # no preinstalled transfer tool and stays user-owned. Switching to rsync later = admit a user-owned, digest-pinned
      # rsync artifact row into controller.bootstrap.artifacts (none is admitted today), add rsync to
      # packages.required, and flip `adapter`; nothing else changes.
      transfer:
        operation: deploy_transfer
        adapter: managed_archive
        adapters:
          managed_archive:
            controller: {provided_by: managed_generation, modules: [community.general.archive], format: gz, os_tools: []}
            # S5 / codex-tick127: the COMPLETE target-side tool closure of the selected adapter's operations (extract,
            # readback, pruning), keyed like os_tools and invoked by these paths. The ONE target bootstrap
            # (target_bootstrap.yml) stats every entry (exists, regular or link-to-regular, executable) BEFORE any
            # target effect and refuses naming each missing tool and its package (packages.provides).
            # Extraction runs the DECLARED tar/gzip by path (command argv; no PATH lookup, no unarchive) into an
            # exclusively reserved staging dir, is read back THERE, and is published by one declared `mv -T`.
            # R-B3 publish models (codex to rule on deploy_edition):
            #   toolchain_bundle (route, target_bootstrap.yml): IMMUTABLE; staged extraction + readback + ONE `mv -T`;
            #     present = readback only; nothing reconciles in place.
            #   deploy_edition (B): IN-PLACE reconcile is permitted because install.sh writes into the tree; the
            #     tools B uses are in this closure (identity-admitted before effects like every other entry); if B
            #     keeps ansible.builtin.unarchive, its PATH-resolved tar/gzip must equal the declared paths (preflight
            #     `command -v` under the target PATH), else refuse. Persistent in-tree state B preserves across a
            #     reconcile (offline_resources, install outputs) MUST be declared by B as out_of_edition paths; the
            #     route declares none. A whole-tree mv -T model for the edition would require those paths to live
            #     outside the edition dir first.
            publish_models:
              toolchain_bundle: staged_rename
              deploy_edition: {model: in_place_reconcile, owner: B, out_of_edition: declared_by_B, unarchive_path_equality: required}
            target:
              modules: [ansible.builtin.tempfile, ansible.builtin.copy, ansible.builtin.stat, ansible.builtin.file, ansible.builtin.command, ansible.builtin.find, ansible.builtin.slurp]
              # every adapter tool's logical package (packages.provides) is listed here -- target_bootstrap.yml refuses
              # an adapter tool no listed package provides (r3f G: cmp from diffutils, flock from util_linux)
              packages: [tar, gzip, coreutils, findutils, diffutils, util_linux]
              # r3f CANONICAL-TOOL-OVERRIDES: NAMES of controller.bootstrap.os_tools entries with their uses. Path and
              # identity are DERIVED by C1's projection (registry adapter.tool_maps / derived_tool_fields) into
              # lme_resolved.remote_harness.adapter.tools['target.tools'], never declared here (a declared copy, or a
              # name outside os_tools, is refused by the engine resolve); target_bootstrap.yml reads that derivation.
              tools:
                tar: {used_by: [extract]}
                gzip: {used_by: [extract]}
                find: {used_by: [readback, prune]}
                xargs: {used_by: [prune]}
                sha256sum: {used_by: [readback]}
                sort: {used_by: [readback, prune]}
                mv: {used_by: [publish, prune, reap]}
                mkdir: {used_by: [extract]}
                rm: {used_by: [prune, reap]}
                flock: {used_by: [reap, publish]}
                id: {used_by: [identity]}
                cmp: {used_by: [deploy_edition_reconcile]}
                chmod: {used_by: [deploy_edition_reconcile]}
                rmdir: {used_by: [deploy_edition_reconcile]}
                cat: {used_by: [deploy_edition_reconcile]}
          rsync:
            status: not_admitted
            controller: {provided_by: user_owned_artifact, artifact: none_admitted}
            target: {modules: [ansible.posix.synchronize], packages: [rsync]}
        consumer: B deploy_gate / install.sh rework (declared exclusions are the consumer's transfer manifest)
        # Edition contents (coordinator question; .gitattributes `testing export-ignore`): the route ships to targets
        # ONLY the toolchain bundle (seed, artifacts, bundle.json, bundle.sha256); target_bootstrap.yml and every
        # route task run on the CONTROLLER from the worktree, so no target needs testing/remote_harness. What the
        # deploy edition contains (and whether testing/ is in it despite export-ignore) is B's transfer manifest.
        edition_contents: {route_to_targets: toolchain_bundle_only, deploy_edition: declared_by_B}
