---
# manifests/profiles/remote-harness.yml -- remote-harness / managed-controller policy (value overlay).
#
# Selected through the shared early-resolve entrypoint (ansible/roles/podman/tasks/resolve.yml,
# lme_profile=remote-harness), which loads this file's retained exact-byte capture as _lme_profile_file and publishes lme_profile_loaded. SEED-06 (JOINT with C1): the
# harness consumes the canonical projection lme_resolved.remote_harness = {schema_version, policy, policy_sha256}
# (resolve.yml composes lme_global ONCE: global | profile | lme_global_override LAST), bound into lme_resolved_revision,
# with immutability, executable identity form and reserved outputs owned by C1's protected registry
# (manifests/global.yml lme_config_registry.remote_harness_schema; codex-232517). tasks/resolve_policy.yml reads ONLY
# that section; admitted overrides are the registry's tunable paths, audited in lme_remote_harness_overridden_paths.
# This consumer lands atomically with C1's source (C1 seed06 94ab131); against an engine without the section it refuses
# RH-POLICY-UNRESOLVED.
#
# NEUTRAL for LME services: profile_overlay.vars and profile_overlay.services are EMPTY.
#
# SLICE 1 (codex-tick117 order 1; corrected per codex-tick121 SEED-01..08 and codex-tick127 genesis/python_policy/
# B_route_seams S1-S6) carries the managed-toolchain bootstrap declarations for the controller AND target roles.
# Jobs, units and legs arrive in later slices.
#
# Bootstrap arrangement: NO committed non-YAML/Jinja source.
#   declarations below + toolchains/core-2.19.11.lock.yml
#     -> testing/remote_harness/acquire.yml (MAIN, the only network stage): sha256-pinned get_url of rows with a
#        declared url into the artifact source; rows without one are refused by name
#     -> testing/remote_harness/package.yml (GENESIS package-builder stage, declared builder admitted first):
#        admits the artifacts offline, renders the seed into a LOCAL bundle (never committed) with bundle.sha256
#        (Ansible-free consumer check) and bundle.json (builder, source, input, output identities)
#     -> <bundle>/lme-controller-seed.sh apply --root <owned root>                    (controller owner)
#     -> <bundle>/lme-controller-seed.sh run --root <owned root> --ssh-auth <mode> -- -i <inv> controller.yml
#     -> ... run ... -- -i <inv> target_bootstrap.yml: the SAME bundle/seed/apply/verifier on every target of the
#        declared group, as the declared non-root owner (no become)

# PRIVATE VALUES ARE NOT DECLARED HERE: the owned root, the artifact source and the bundle directory are
# REQUIRED inputs with no default; the owner is the invoking non-root account. Consumers name the root/owner
# through inventory host vars (controller.bootstrap.inventory, no defaults).
profile_overlay:
  services: {}
  vars: {}
  lme_global:
    remote_harness:
      schema_version: 3
      operator_directives:
        - id: OP-DIRECT-20260923-UV-OFFICIAL-INSTALLER
          source: operator_direct_in_author_session
          relayed: false
          verbatim: >-
            and ot install per offical uv docs: curl -LsSf https://astral.sh/uv/install.sh | sh <<
            https://docs.astral.sh/uv/getting-started/installation/
          adopted_as:
            - controller.bootstrap.uv.install_method = official_installer_pinned (the same official installer script,
              version-pinned, sha256-checked as a local artifact, run with UV_UNMANAGED_INSTALL; never piped)
        - id: OP-DIRECT-20260923-SILMARIL-FRUGALITY
          source: operator_direct_to_claude_main
          relayed: true
          recorded_by: claude-tick104-operator-silmaril-allocation-answer-20260923-2101 (sha256 fd0d5a7459964e664ac3e0468fff9b83615e953c992ed829a6b39fb524ee26a7)
          verbatim: >-
            the silmaril allocation is current per most recent and this isnt "bc we are starving" but like
            this machine is a race horse and we can easily get too greedy and all of the sudden our platform
            only works on more expensive machines (consider the implications the OPERATOR bought his ram
            sticks for $400 and they $2000, thats why!)
          adopted_as:
            - controller.local_envelope (8 vCPU / 24e9 bytes, SI reading)
            - controller.bootstrap.budget (the seed's own scope limits, a small fraction of that envelope)


      # ---- managed controller (codex-route-v2-D1-D2-decisions-and-artifact-custody-20260923-214304, D1 option a) ----
      controller:
        decision: {ref: codex-route-v2-D1-D2-decisions-and-artifact-custody-20260923-214304, sha256: 40c16205b4394d2f67e92f4a5c0a835b0d26fb388e61d0d510f9d8d30863e2bb, option: a}
        decision_status: RESOLVED
        expect_core: 2.19.11
        lock_file_rel: testing/remote_harness/toolchains/core-2.19.11.lock.yml
        # C1-RECIPE-PUB-02 (OW-H11-C1-01-PUB-02; codex-tick884 Q290_2 a): the builder recipe's own declared leg word, published
        # as lock_capture.resolved_recipe.builder.leg. Never read from test_leg, inferred or converted; builder and test may
        # share the word while their roles and digests stay independently bound. Another builder recipe needs its own binding.
        builder_leg: core_2_19_11
        # C1-RECIPES-01 (OW-H11-C1-01; fw42 X2-CORR-01 :503-526, X2-CORR-03 :565-575; codex 855, 870 Q273_1): the test role
        # recipes keyed by leg (fw42 :508 leg key grammar) and their ONE mandatory selector test_leg (registry tunable,
        # operator override last). The builder role recipe stays this node: expect_core and lock_file_rel above, bootstrap
        # below. X2-D4 restate: the recipe leaves restate s21 :69-70, :1934, :1950-1992, :1993 and :1999-2001.
        test_leg: core_2_19_11
        test_recipes:
          core_2_19_11:
            expect_core: 2.19.11
            lock_file_rel: testing/remote_harness/toolchains/core-2.19.11.lock.yml
            bootstrap:
              artifacts:
                - {key: uv_installer, file: uv-install-0.12.18.sh, sha256: e62a5ea089de9c6a9b1f767166c9f33194e18d350e9f375c6355fac3ba0fb42b, source: 'tick107 observation: installer_pinned_url below, byte-identical to this sha256', url: 'https://astral.sh/uv/0.12.18/install.sh', max_bytes: 1048576}
                - {key: uv_archive, file: uv-x86_64-unknown-linux-gnu.tar.gz, sha256: 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16, url: 'https://github.com/astral-sh/uv/releases/download/0.12.18/uv-x86_64-unknown-linux-gnu.tar.gz', max_bytes: 67108864}
                - {key: python_archive, file: 'cpython-3.13.15+20260901-x86_64-unknown-linux-gnu-install_only.tar.gz', sha256: 0651dd7157d3debf769e15a52c1de9de7fbcdc36ba72faf79fde3c44f14d9461, url: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.13.15%2B20260901-x86_64-unknown-linux-gnu-install_only.tar.gz', max_bytes: 134217728}
              core_supported_python: ['3.11', '3.12', '3.13']
              python:
                version: 3.13.15
                major_minor: '3.13'
                pbs_release: '20260901'
                artifact: python_archive
                # codex-tick127 python_policy: uv_managed. The pinned uv installs EXACTLY this interpreter from a custom
                # downloads JSON the seed writes into the generation tmp: ONE entry (download_key) whose url is
                # file://<bundle>/artifacts/<python_archive file> and whose sha256 is the admitted digest (the PBS
                # build/artifact mapping is bound here). Install dir, cache and tmp are inside the generation, --no-bin,
                # no config, python preference only-managed, no other download source: any other build or an online
                # fetch fails the install. Independent identity: the installed interpreter ELF is byte-equal to the
                # archive member, `python -I` reports version/implementation/base_prefix, and the installed tree differs
                # from an independent unpack ONLY in the declared uv-patched files and the declared, digest-validated
                # uv-added files (uv_added_files). The downloads-JSON field set is
                # taken from uv's embedded metadata (0.11.12 strings); the pinned 0.12.18 acceptance of it, the
                # bookkeeping names and the patched-file list are QUALIFIED ONLY by control C-PY (fail-closed until then).
                approved_policy: uv_managed
                install_mode: uv_python_install_local_json
                decision: {ref: codex-tick127-bootstrap-and-E-B-decisions-20260923-231751, field: python_policy}
                download_key: cpython-3.13.15-linux-x86_64-gnu
                download_entry: {name: cpython, major: 3, minor: 13, patch: 15, prerelease: '', os: linux, libc: gnu, variant: null, build: '20260901', arch: {family: x86_64, variant: null}}
                install_dir: python                                   # UV_PYTHON_INSTALL_DIR = <generation>/python
                installed_rel: python/cpython-3.13.15-linux-x86_64-gnu
                install_dir_bookkeeping: ['.lock', '.temp', '.cache', '.gitignore']   # the only other names allowed
                uv_patched_rel: ['lib/python3.13/_sysconfigdata__linux_x86_64-linux-gnu.py', 'lib/pkgconfig/python-3.13.pc', 'lib/pkgconfig/python-3.13-embed.pc', 'bin/python3.13-config']
                # uv-ADDED files (codex-d649-runtime-refusal-repair-20260924-235616): present in the install, absent from the
                # independent unpack. Provenance: the step-3 refusal on d649c27d (RH-SEED-IDENTITY-MISMATCH) under THIS
                # pinned combination only -- uv 0.12.18 installing PBS 20260901 CPython 3.13.15 -- not a universal uv
                # promise; a different uv or PBS pin must re-derive this list. Separate from uv_patched_rel (content-differs
                # policy, unchanged). Each row: rel = normalized path under installed_rel, sha256 = exact content digest. The
                # seed admits a row only if it is absent from the unpack, a regular non-symlink owned file under a real
                # (non-symlink) parent chain, and digest-exact; only then its exact "Only in" diff line. Admitted by C1.
                uv_added_files:
                  - {rel: BUILD, sha256: 1061e114e628d6bbc3211b89fd2b7a3cdb10fefb8fe89d2023a03105e65f5f07}
                  - {rel: lib/python3.13/EXTERNALLY-MANAGED, sha256: d9464392449b553040ca45de3dbce3bb5c3af66e4c807bbd720ab8fd98bb4c54}
                # uv may create a minor-version link dir ("Missing expected target directory for Python minor version
                # link" is in the binary). OPTIONAL: if present it must be a symlink that resolves to installed_rel; any
                # other form refuses. Qualified by C-PY together with the downloads-JSON fields and bookkeeping names.
                minor_link: cpython-3.13-linux-x86_64-gnu
                archive_top: python
                archive_interpreter_rel: python/bin/python3.13
                interpreter_rel: python/cpython-3.13.15-linux-x86_64-gnu/bin/python3.13
                interpreter_dir_rel: python/cpython-3.13.15-linux-x86_64-gnu/bin
          # C1-SR323-G-F1 (G handoff-02 J-08 / J-10; codex 906 Q-G-01 / Q-G-03; codex 908 Q-G-09: 2.17 coverage is REQUIRED):
          # the 2.17 test leg recipe, the same key set as core_2_19_11. Every value is bound to a measured source:
          #   expect_core / lock_file_rel: the route lock P/route-217-qg5 core-2.17.14.lock.yml (84b85784; leg :25, py 3.12
          #     :26; selection source-reviewed by codex 853, lock rows max_bytes OWED to route, J-09) -- landed with this file;
          #   core_supported_python: the admitted wheel ansible_core-2.17.14-py3-none-any.whl (34a49582, acquisition
          #     FINAL.SHA256SUMS c19da300 :3) METADATA Requires-Python >=3.10 and classifiers 3.10 / 3.11 / 3.12;
          #   uv rows: the SAME artifact identities as core_2_19_11 (shared content-addressed store; one fetch, one digest);
          #   python_archive: acquisition FINAL.SHA256SUMS c19da300 :12 and plan ba36cf2f row 23 (url), re-measured by C1
          #     with sha256sum on the retained artifact (111368545 bytes, under the declared max_bytes ceiling below);
          #   python block: the archive member names measured with tar -t on that artifact (python/bin/python3.12,
          #     python/bin/python3.12-config, lib/pkgconfig/python-3.12{,-embed}.pc, lib/python3.12/_sysconfigdata__linux_x86_64-
          #     linux-gnu.py present; BUILD and lib/python3.12/EXTERNALLY-MANAGED absent), the uv naming of core_2_19_11.
          # uv_patched_rel, the downloads-JSON fields and the bookkeeping names are QUALIFIED ONLY by control C-PY (as on
          # core_2_19_11). uv_added_files is the strictest declaration (none admitted): the uv 0.12.18 + PBS 20260901 CPython
          # 3.12.14 added-file list is NOT measured (HOLE-SR323-217-UV-ADDED, producer: the seed identity refusal
          # RH-SEED-IDENTITY-MISMATCH of the first managed 2.17 apply, read back by G control C-PY, then a C1 successor); the
          # seed therefore refuses any uv-added file until then -- fail-closed, never a pass.
          core_2_17_14:
            expect_core: 2.17.14
            lock_file_rel: testing/remote_harness/toolchains/core-2.17.14.lock.yml
            bootstrap:
              artifacts:
                - {key: uv_installer, file: uv-install-0.12.18.sh, sha256: e62a5ea089de9c6a9b1f767166c9f33194e18d350e9f375c6355fac3ba0fb42b, source: 'tick107 observation: installer_pinned_url below, byte-identical to this sha256', url: 'https://astral.sh/uv/0.12.18/install.sh', max_bytes: 1048576}
                - {key: uv_archive, file: uv-x86_64-unknown-linux-gnu.tar.gz, sha256: 89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16, url: 'https://github.com/astral-sh/uv/releases/download/0.12.18/uv-x86_64-unknown-linux-gnu.tar.gz', max_bytes: 67108864}
                - {key: python_archive, file: 'cpython-3.12.14+20260901-x86_64-unknown-linux-gnu-install_only.tar.gz', sha256: 936c246dfdbbfa7cb22dd01814a21f582a892689fae96b06071a5e433baffa22, url: 'https://github.com/astral-sh/python-build-standalone/releases/download/20260901/cpython-3.12.14%2B20260901-x86_64-unknown-linux-gnu-install_only.tar.gz', max_bytes: 134217728}
              core_supported_python: ['3.10', '3.11', '3.12']
              python:
                version: 3.12.14
                major_minor: '3.12'
                pbs_release: '20260901'
                artifact: python_archive
                approved_policy: uv_managed
                install_mode: uv_python_install_local_json
                decision: {ref: codex-tick127-bootstrap-and-E-B-decisions-20260923-231751, field: python_policy}
                download_key: cpython-3.12.14-linux-x86_64-gnu
                download_entry: {name: cpython, major: 3, minor: 12, patch: 14, prerelease: '', os: linux, libc: gnu, variant: null, build: '20260901', arch: {family: x86_64, variant: null}}
                install_dir: python
                installed_rel: python/cpython-3.12.14-linux-x86_64-gnu
                install_dir_bookkeeping: ['.lock', '.temp', '.cache', '.gitignore']
                uv_patched_rel: ['lib/python3.12/_sysconfigdata__linux_x86_64-linux-gnu.py', 'lib/pkgconfig/python-3.12.pc', 'lib/pkgconfig/python-3.12-embed.pc', 'bin/python3.12-config']
                uv_added_files: []
                minor_link: cpython-3.12-linux-x86_64-gnu
                archive_top: python
                archive_interpreter_rel: python/bin/python3.12
                interpreter_rel: python/cpython-3.12.14-linux-x86_64-gnu/bin/python3.12
                interpreter_dir_rel: python/cpython-3.12.14-linux-x86_64-gnu/bin
        local_envelope: {vcpu: 8, memory_bytes: 24000000000, memory_unit_interpretation: SI_decimal, source: [tick104 fd0d5a74, codex-210822 b6e76364]}
        # SEED-06 (codex-232517): immutability is REGISTRY-owned (C1 lme_config_registry.remote_harness_schema, deny by
        # default); the former controller.immutable_fields deny-list is removed (it lived inside the data it protected).
        bootstrap:
          template_rel: testing/remote_harness/templates/lme-controller-seed.sh.j2
          macros_rel: testing/remote_harness/templates/macros/controller_seed.j2
          package_playbook_rel: testing/remote_harness/package.yml
          # The seed is a BUILD OUTPUT inside an operator bundle directory (never committed):
          bundle:
            seed_file: lme-controller-seed.sh
            # SEED LAUNCHER MEMBER (codex-tick217 R1): the generated caller entry of seed_launch (controller.bootstrap
            # .seed_launcher), rendered by package_bundle.yml NEXT TO seed_file. Custody = seed_file's, exactly: a
            # regular file of launcher_mode (the seed's executable mode, find %m 500) in the bundle's exact member set,
            # a line of checksum_file, named with its digest in manifest_file, admitted by admit_bundle.yml (fresh
            # render), transferred / read back / published / reaped with the bundle, and in the seed's lme_bundle_check
            # member and name sets. The launcher runs BEFORE the seed's own checks, so its boundary is the admitted
            # generated artifact plus this bundle custody (a swapped launcher is NOT guaranteed to be refused by the
            # seed it starts); the seed's bundle check is additional.
            launcher_file: lme-seed-launch.sh
            launcher_mode: '0500'
            launcher_custody: seed_file
            # C1 s14 records-pkg-02 (C1-REQ-PKG-02): the ONE declaration of the bundle member modes, read by the producer
            # (package_bundle through N13), the admission (admit_bundle) and the seed member set (lme_bundle_check). Each value
            # is the 4-digit octal string ansible stat reports; the seed and admit_bundle member forms (f 400 <rel>, d 700 <rel>)
            # take its [1:], the derivation launcher_mode already uses. The launcher keeps launcher_mode above as its one source.
            member_modes: {seed_file: '0500', artifact: '0400', manifest_file: '0400', checksum_file: '0400', artifacts_dir: '0700'}
            # C1 s14 records-pkg-optb-01 (option B, DEP-OPTB-C1-FIXEDCAP): the declared byte allocation of each fixed bundle
            # member in ONE bundle publication, keyed by its bundle ROLE (the file name is that role's value in this node).
            # A ceiling, not a measurement; the artifacts rows and the lock rows carry the others.
            member_max_bytes: {seed_file: 8388608, launcher_file: 4194304, checksum_file: 65536, manifest_file: 1048576}
            # C1 s14 records-pkg-optb-02 (C-PKG-FX-01): the ONE grammar of a bundle member form, the line GNU find -printf
            # prints for each bundle member and the forms admit_bundle builds: fields joined by separator, in this order;
            # type = types.dir or types.file (find %y), mode = the stat-form member mode (member_modes / launcher_mode)
            # with its leading mode_prefix removed (find %m), rel = the path relative to the bundle dir (find %P). A
            # consumer that reads a form back re-adds mode_prefix; directives are the find -printf directive of each field.
            member_form: {fields: [type, mode, rel], separator: ' ', directives: {type: '%y', mode: '%m', rel: '%P'}, types: {dir: d, file: f}, mode_prefix: '0'}
            # C1 s14 records-pkg-optb-02 (C-PKG-FX-02): the member ROLES that have NO line in checksum_file. The check file
            # holds one line per remaining member (the seed and launcher renders, then every artifact copy, pre_publish covers),
            # so its line count is the member count minus the length of this list.
            checksum_excluded_roles: [artifacts_dir, manifest_file, checksum_file]
            # C1 s14 records-pkg-02 (C1-REQ-PKG-03): the manifest_file (bundle.json) record of schema below. fields, source_fields
            # and genesis_fields are its exact key sets (top level, source, genesis); a field change is a schema change, and the
            # contract pins both. row_separator joins each artifacts and source.inputs row as <file><row_separator><sha256>; it
            # is NOT checksum_format.separator (other order, other grammar), equal to it by value only.
            manifest_record:
              fields: [schema, seed_file, seed_sha256, launcher_file, launcher_sha256, expected_generation, profile_sha256, lock_sha256, class_key, artifacts, allocation, checksum_file, checksum_file_sha256, builder, source, genesis, provenance]
              source_fields: [checkout, repo_head, worktree_status_sha256, worktree_dirty, inputs]
              genesis_fields: [status, decision]
              row_separator: '  '
              # C1 s14 records-pkg-optb-02 (codex714 REC-01 = R1): the ROLE of every record field, keyed BY FIELD NAME, so a
              # value is paired with its field by name, never by position. A role is {policy: a path relative to the
              # controller node, walked by segment}, {derived: a value word the producer implements} or {nested: the roles
              # node of a sub-record}. roles / source_roles / genesis_roles carry exactly the names of fields / source_fields /
              # genesis_fields. Every construction (top level and each nested one) is built field by field through its roles
              # node and its key set is checked equal to the declared field list before publication.
              roles:
                schema: {policy: bootstrap.bundle.schema}
                seed_file: {policy: bootstrap.bundle.seed_file}
                seed_sha256: {derived: seed_render_sha256}
                launcher_file: {policy: bootstrap.bundle.launcher_file}
                launcher_sha256: {derived: launcher_render_sha256}
                expected_generation: {derived: generation_id}
                profile_sha256: {derived: profile_sha256}
                lock_sha256: {derived: class_lock_sha256}
                class_key: {derived: class_key}
                artifacts: {derived: artifact_rows}
                checksum_file: {policy: bootstrap.bundle.checksum_file}
                checksum_file_sha256: {derived: checksum_file_sha256}
                builder: {derived: builder}
                source: {nested: source_roles}
                genesis: {nested: genesis_roles}
                allocation: {derived: class_allocation}       # _rh_pkg_alloc[class] (package.optb-after-08 P8 :691-705): {rows: {rel: max_bytes}, total}
                provenance: {derived: recipe_provenance}      # the resolved recipe of the class and role (codex 855 / 870)
              source_roles:
                checkout: {derived: repo_root}
                repo_head: {derived: repo_head}
                worktree_status_sha256: {derived: worktree_status_sha256}
                worktree_dirty: {derived: worktree_dirty}
                inputs: {derived: source_input_rows}
              genesis_roles:
                status: {policy: bootstrap.genesis.status}
                decision: {policy: bootstrap.genesis.decision}
              # C1 s14 records-pkg-optb-03 (codex717 OPEN-OPTB2-POLICY-SCOPE = a): the SCOPE of every {policy: <path>} role.
              # executing_controller = the publication policy of the controller EXECUTING this package run: <path> is walked
              # by segment from the run-scope controller node (fact rh, key path [controller]), never from the class-scope
              # publication policy (rh_pub_policy). members: exactly the roles that take this scope, per roles node (today the six
              # policy roles). Class content -- the artifacts, the admitted class lock, the rendered seed inputs and the expected
              # generation -- stays derived from rh_pub_policy through derived roles and is never a policy role. A new policy role,
              # or any class-specific role, needs its own declared scope here plus a coherent producer / staging / readback /
              # consumer change; a scope is never inferred from equal values in both nodes, and no host is named.
              policy_scope:
                scope: executing_controller
                fact: rh
                path: [controller]
                members:
                  roles: [checksum_file, launcher_file, schema, seed_file]
                  genesis_roles: [decision, status]
            artifacts_dir: artifacts          # the seed reads its artifacts ONLY from <its own dir>/artifacts
            manifest_file: bundle.yml
            checksum_file: bundle.sha256      # sha256sum --check format: the Ansible-free consumer check
            # CHECKSUM FORMAT CONTRACT (codex 183510; RH-BUNDLE-CHECKSUM-FORMAT): the ONE grammar of checksum_file,
            # consumed by BOTH sides -- the producer (tasks/package_bundle.yml writes each line as
            # <digest><separator><name><terminator> and refuses before publish any line not matching
            # ^<digest><separator><name>$ or a file not exactly those lines each terminated) and the controller seed
            # (controller_seed.j2 lme_bundle_check: grep -x -E <digest><separator><name> on every line, the name set
            # stripped with sed -E 's/^<digest><separator>//', the running seed line "<sha><separator><seed_file>",
            # the last byte a terminator). The regexes are POSIX ERE and Python-re compatible (no backslash, no class
            # names); the separator is literal (two spaces: sha256sum text mode, never ' *' binary mode).
            checksum_format:
              digest: '[0-9a-f]{64}'
              separator: '  '
              name: '[A-Za-z0-9._/+-]+'
              terminator: newline             # every line, the last included
            schema: lme-controller-bundle/v2
            # C1 OW-C1-RECORD-BINDING-01 (records-c1-record-binding-01; SR-290-15): the declared record word of manifest_file,
            # read by every bundle manifest reader and writer instead of a literal (lme_render_record / lme_admit_record).
            manifest_file_record: bundle_v2
            # C1-RECIPE-PUB-02 (codex-tick883 Q290_1; codex-tick884 Q290_2 c): the role whose engine-resolved recipe a class
            # bundle carries and its seed installs (the run generation's role); no builder-role bundle is declared.
            payload_role: test
            # SEED2-PACKAGE-RESERVATION / SEED2-BUNDLE-COMPLETION: a bundle is built (package.yml) or extracted (target)
            # ONLY inside an exclusively reserved sibling staging dir `.<bundle basename>.<staging_infix>.<random>`
            # (mkdtemp) and published by ONE rename (mv -T) onto an absent destination. A destination that already
            # holds the byte-identical bundle.sha256 AND bundle.json (same provenance) is UNCHANGED (staging removed); any other content refuses and is
            # preserved. Interrupted staging never occupies the destination, so a rerun resumes at the same path.
            # Stale staging is recovered by `staging_retention` below (M1-STAGING-RECOVERY), never left unbounded.
            # The seed's `apply` independently refuses, before any mutation, unless its own directory holds exactly
            # members (type mode path) and bundle.sha256 lists exactly the declared names, the seed line carries the
            # running seed's digest, `sha256sum --check --strict` passes and bundle.json names that seed digest and
            # the check file's digest.
            staging_infix: staging
            reaping_infix: reaping
            # G-PACKAGE-REFUSAL-CODE: package.yml fail_msgs start `REFUSED <code>` (catalogue: playbook_refusals)
            refusals: {artifacts: RH-PACKAGE-ARTIFACT, staged: RH-PACKAGE-STAGED-MISMATCH}
            # r3g PER-CLASS PUBLICATION (codex 023332 path_composition: shared artifacts are reused when their declared
            # effective inputs agree; C1 field contract 033500). The deployment's scopes (lme_resolved.remote_harness
            # .scopes: controller + every target) are partitioned by C1's PUBLISHED `key_field` -- never re-derived or
            # re-merged by the route. Each distinct key is ONE class with ONE full publication destination
            # (tasks/scope_classes.yml -> package.yml -> tasks/package_bundle.yml per class): the controller's class at
            # rh_bundle_dir itself (a homogeneous deployment publishes the one bundle it always did), every other class
            # at the sibling `<rh_bundle_dir><separator><infix><separator><key>` (the full key). A sibling's basename
            # never begins with `<rh_bundle_dir basename>.`, so each destination's staging/reaping/lease/lock names
            # (`.<basename>.<infix>.*`) are disjoint from every other class's; an rh_bundle_dir whose basename already
            # matches the sibling rule refuses. Each class destination has its own custody admission, lock, lease
            # records, publish fence and E26/E32 semantics. bundle.json records `class_key` (bundle identity = class key
            # + rendered artifact digests; never a member set, never a member's policy digest). A sibling that matches
            # the rule but is not a class of this deployment is PRESERVED and reported (`undeclared_marker`), never
            # reaped, never judged by age. A target whose class bundle is missing, or whose bundle records another
            # class key, refuses (`refusal`) before any target mutation; it never falls back to the controller bundle.
            # Defence in depth: each target re-renders the seed under its OWN policy and refuses unless it equals its
            # class bundle's seed (an equal key that renders unequally names the key as insufficient).
            per_class:
              key_field: shared_artifact_inputs_sha256
              key_regex: '^[0-9a-f]{64}$'
              separator: '-'
              infix: class
              undeclared_marker: PRESERVED-UNDECLARED-CLASS
              refusal: RH-SCOPE-BINDING
            # M1-STAGING-RECOVERY (codex-000256; tasks/reap_staging.yml, used by package.yml on the controller and by
            # target_bootstrap.yml on each target, BEFORE a new staging dir is reserved). Scope: ONLY entries named
            # `.<destination basename>.<staging_infix>.*` or `.<destination basename>.<reaping_infix>.*` in the
            # destination's own (admitted, not group/other-writable) parent. No age rule, no broad pattern.
            staging_retention:
              policy: reap_dead_owned_on_next_attempt
              # an entry is OWNED only when ALL hold; the owned manifest is the declared member set of the
              # destination (package: the bundle members; target: the archive copy + `b/` + the bundle members):
              owned_when:
                - a real directory (not a link), owned by the acting uid, not group/other-writable
                - every descendant is a regular file or directory (no link, device, fifo, socket), owned by the acting uid
                - every descendant's relative path is in the owned manifest, or is a transient write of the declared
                  modules (transient_member_regex); nothing under it was unreadable to find
              transient_member_regex: '(^|/)\.ansible_tmp[^/]*$'
              target_members: {archive: transfer.tar.gz, extract_dir: b}
              # LIVENESS + QUIESCENCE (codex-001716 E20-CONCURRENCY; codex-tick138 Q-LEASE-AS-LIVENESS: a holder lease
              # alone is NOT authority to reap). Identity: every staging dir is reserved (mkdtemp) with its holder token
              # in its name, `.<name>.<staging_infix>.<token>.<random>`, token = L<machine>-<boot>-<uid>-<pid>-<start>;
              # immediately BEFORE the reservation the run writes its LEASE RECORD `.<name>.<lease_infix>.<token>`
              # (JSON, lease.record_fields: EXACTLY those ten keys, every value a JSON string; mode 0400) next to it
              # (copy: temp + rename).
              # The holder is the controller's ansible-playbook MAIN process (derived read-only on the controller:
              # /proc/self of the templating process, then its parent when the parent has the identical cmdline -- a
              # forked worker -- asserted the top of that chain and an ansible-playbook argv); its pid namespace and
              # cgroup namespace (lnk_target of /proc/<pid>/ns/{pid,cgroup}) and its cgroup v2 path (/proc/<pid>/cgroup)
              # are recorded. Every process of the run -- workers, module children, ssh clients and their ControlPersist
              # masters -- stays in that cgroup even when reparented.
              # An owned entry is reaped ONLY when BOTH hold (else it is LIVE or UNKNOWN, preserved, bytes charged):
              #  (1) CONTROLLER WRITERS QUIESCENT, observed on the controller in an ADMITTED view: the lease record is
              #      present, owned, parses and names this token; machine and uid equal this controller's; and either
              #      boot differs (the whole previous boot is gone), or pidns AND cgroupns equal the reaper's own AND
              #      (a) the holder is positively absent (stat /proc/<pid> exists=false) or a readable
              #      /proc/<pid>/stat shows another start time, AND (b) the recorded cgroup is positively gone
              #      (stat=false while its parent directory is present) or its cgroup.events reads `populated 0` (subtree).
              #      C1-SR923B: (b) is decided ONLY by the combination verdict
              #      (n10.write_bound.lifetime.dead_holder.relock.dead_rule.cgroup_input). The absent route needs
              #      (none, gone) or (gone, unknown); the populated 0 route needs (none, gone), i.e. every candidate
              #      0..n-1 proven. A populated 0 read with an unproven ancestor is UNKNOWN.
              #      Any failed, unreadable, hidden, malformed or incomparable observation is UNKNOWN, never dead. A
              #      zombie holder or a dead holder with a non-empty cgroup is NOT dead (workers may still run).
              #  (2) TARGET WRITERS QUIESCENT (target staging only; target_quiescence): the reaper's own module runs in
              #      a logind session scope of the owner (admitted view: pam_systemd tracks this connection path), and
              #      no OTHER session scope of the owner is populated (every cgroup.events readable). Remote module,
              #      tar and mv processes of any run -- live, stale or in transit -- live in such a session scope.
              # Recovery across controllers: an entry whose recorded machine is another controller stays UNKNOWN
              # (preserved, charged; the refusal names the recorded owner) until that controller reaps it, or MAIN
              # declares the machine retired (recovery.retired_controller_machine_ids); a retired controller's entries
              # skip (1) but still require (2). Never deleted to meet a count.
              # BOTH properties hold, neither replaces the other (codex-tick139):
              #  NO LIVE-WRITER DELETION = the quiescence proofs (1) and (2) above, observed BEFORE any mutation.
              #  NO STALE PUBLICATION = the publish fence: publication is ONE declared rename of this run's own staging
              #  path onto the absent destination, run as `flock -x -w <publish_wait_seconds> -E <busy_rc>` on the SAME
              #  destination lock as every reap mutation. Ownership of a staging dir changes ONLY by the reaper's locked
              #  rename of that path to its reaping name, so the two are linearized: a publish either lands first (the
              #  staging path is gone before any reap) or finds its source moved away (mv fails; nothing lands). A
              #  publish never overwrites: `mv -T -n` (lease.authority.noreplace_arg) never replaces a present destination,
              #  even an empty one; landed iff rc 0 AND the source is gone. A publish that cannot
              #  take the lock within the bound refuses (busy_refusal) and releases its own staging and lease record.
              # Serialization: every reap mutation (rename to reaping, removal, lease-record removal) is ONE declared
              # command under `flock -x -n` on the destination lock `.<name>.<lock_suffix>` (created in the admitted
              # parent, persistent, never reaped), so competing reapers and publishers serialize; a busy lock preserves
              # (reported BUSY) rather than waits. No helper process is added: flock holds the lock exactly for the one
              # declared command it runs and releases it when that command exits.
              # WHEN RECOVERY FIRES (declared, not implied): (1) needs the recorded controller cgroup EMPTY. A controller
              # run launched from a login shell, tmux or an ssh session shares that session's scope, so an interrupted
              # run's staging stays PRESERVED-LIVE-STAGING until that session ends, the controller reboots (another boot =
              # dead), or MAIN retires the machine id. (2) needs every OTHER owner session on the target empty, so any
              # other owner login holds target reaping at PRESERVED-BUSY-STAGING. Both fail closed; the budget refusal
              # is the visible backpressure.
              lease:
                token_regex: '^L[0-9a-f]{32}-[0-9a-f]{32}-[0-9]+-[1-9][0-9]*-[0-9]+$'
                proc_root: /proc
                cgroup_root: /sys/fs/cgroup
                cgroup_v2_marker: /sys/fs/cgroup/cgroup.controllers
                machine_id_path: /etc/machine-id
                boot_id_path: /proc/sys/kernel/random/boot_id
                holder_argv_regex: '(^|/)ansible-playbook([^-_./A-Za-z0-9]|$)'
                ns_regex: '^(pid|cgroup):\[[0-9]+\]$'
                # C1-SR922T (route op1z NOTE-OP1Z-LEASE-NS-LITERAL-SEGMENTS, records-route-op1z-01 c0562cbe; seat ruling
                # "no literal path segments"). EVERY /proc path the lease DERIVATION and the reaper's pre-lock reads use
                # is built from these words: <proc_root> + '/' + the of_segments joined with '/'. route op1z spelled
                # them literally (reap_staging 03a16547 :93-100 derivation, :342-345 namespace stats, :988 holder stat,
                # :1086 own cgroup; reap_staging_controller_ns f1059fdf :25-28).
                #   pid_placeholder: the segment `<pid>` is replaced by ONE pid text that must fully match pid_ere
                #     (decimal, >= 1, no sign, space or leading zero). Its sources are named per path: the reader's
                #     parent pid (field 4 of self/stat, after the last ')'), the derived holder pid, the holder's parent
                #     (field 4 of the holder's stat) and a record's pid. A text that does not match is REFUSED in the
                #     derivation (no lease is written, nothing reserved) and UNKNOWN (retained) in a reaper read.
                #   derivation: the holder lease (record_fields machine .. cgroup_b64).
                #   namespace_paths: the holder's pidns / cgroupns (recorded) and this reader's own (compared,
                #     staging_retention (1)); the same segments as dead_holder.relock.namespace of_segments for self.
                #   holder_cgroup: YES, the cgroup_b64 source needs the same treatment: <proc_root>/<holder pid>/cgroup,
                #     exactly one line, prefix `0::`, the path is the rest and must start with '/'; any other shape
                #     leaves the derivation unproven (refused).
                #   reaper_reads: a record holder's stat (record pid) and this reader's own cgroup (target quiescence).
                proc_paths:
                  root_from: [bundle, staging_retention, lease, proc_root]
                  join: '/'
                  pid_placeholder: {segment: '<pid>', ere: '^[1-9][0-9]*$', derivation_mismatch: refused, reaper_read_mismatch: unknown}
                  # C1-SR922U (CPL-OP2A-C1-PID-ERE-FLAVOUR): the ere text is unchanged; it is the same in Python re and POSIX
                  # ERE. What the words below fix is the MATCHING semantics: the WHOLE pid text must match, and a text holding a
                  # line terminator or any other control byte ([\x00-\x1f\x7f]) is a mismatch, even where the regex engine
                  # would match a prefix of it (Python `$` matches before a final LF). Each consumer's form:
                  #   python_re (route): p is a string, p is match(ere), and (p | regex_search(ere)) == p. The equality makes
                  #     the match the whole text, so '12' + LF fails (the match is '12'). No other Python form is admitted.
                  #   awk_ere (B): the text holds no control byte (checked BEFORE awk; LF is one), so it is exactly one
                  #     record; the test is NR == 1 with $0 ~ ere, and a record count other than 1 is a mismatch.
                  #   shell_case (route controller_seed consumption shell, no ERE available): the pid text is refused when
                  #     a case arm matches any glob in refuse (empty, leading 0 including '0' itself, any non-digit
                  #     including LF); an unrefused text is exactly the ere's language.
                  pid_match: {whole_text: required, control_bytes: mismatch, ere_change: none,
                              consumers: {python_re: {form: 'p is string and p is match(ere) and (p | regex_search(ere)) == p'},
                                          awk_ere: {before: no_control_bytes, records: 1, form: 'NR == 1 && $0 ~ ere'},
                                          shell_case: {refuse: ['', '0*', '*[!0-9]*']}}}
                  # C1-SR922U (NOTE-SEAT-OP2A-DERIVATION-FAILED-LOOKUP; route op2a reap_staging c24be88a :137-185 reads
                  # parent_cmdline and holder_parent_cmdline with errors='ignore'). A failed lookup is NEVER absence and
                  # never a "differs": every derivation path and every namespace_paths stat is read and must yield a
                  # non-empty text; a read that fails or yields empty text REFUSES the derivation (no lease written,
                  # nothing reserved). An ignored error and an empty file are indistinguishable after errors='ignore', so
                  # both are refused. Only a READ text decides:
                  #   parent_cmdline: read and equal to self_cmdline -> the holder is the parent; read and different ->
                  #     the holder is this process; failed or empty -> refused (never "holder is self").
                  #   holder_parent_cmdline: read and different from self_cmdline -> top true; read and equal -> top
                  #     false; failed or empty -> refused (never "top true").
                  derivation_reads:
                    applies_to: [self_stat, self_cmdline, parent_cmdline, holder_stat, holder_parent_cmdline, self_status, holder_cgroup, holder_pidns, holder_cgroupns, self_pidns, self_cgroupns]
                    failed: refused
                    empty: refused
                    failed_is_absence: false
                    outcomes:
                      parent_cmdline: {read_equal: holder_is_parent, read_differs: holder_is_self, failed_or_empty: refused}
                      holder_parent_cmdline: {read_differs: top_true, read_equal: top_false, failed_or_empty: refused}
                      compared_with: self_cmdline
                  derivation:
                    self_stat: {of_segments: [self, stat]}
                    self_cmdline: {of_segments: [self, cmdline]}
                    parent_cmdline: {of_segments: ['<pid>', cmdline], pid_from: self_stat_field_4}
                    holder_stat: {of_segments: ['<pid>', stat], pid_from: holder_pid}
                    holder_parent_cmdline: {of_segments: ['<pid>', cmdline], pid_from: holder_stat_field_4}
                    self_status: {of_segments: [self, status]}
                    holder_cgroup: {of_segments: ['<pid>', cgroup], pid_from: holder_pid, lines: 1, prefix: '0::', path: rest_after_prefix, path_starts: '/', other: refused}
                  namespace_paths:
                    holder_pidns: {of_segments: ['<pid>', ns, pid], pid_from: holder_pid}
                    holder_cgroupns: {of_segments: ['<pid>', ns, cgroup], pid_from: holder_pid}
                    self_pidns: {of_segments: [self, ns, pid]}
                    self_cgroupns: {of_segments: [self, ns, cgroup]}
                  reaper_reads:
                    record_holder_stat: {of_segments: ['<pid>', stat], pid_from: record_lease_pid}
                    self_cgroup: {of_segments: [self, cgroup]}
                    # C1-SR922U (CPL-OP2A-C1-PROC-PID-PRESENCE-PATH; route op2a reap_staging :1077, _holders :25): the pid
                    # directory itself, <proc_root><join><pid>, probed with no follow. Only a not-found result is absence;
                    # any other probe failure is unknown (retained).
                    # C1-SR922V (NOTE-B-OP1T-NOT-FOUND-ONLY): not_found alone is NOT absence. Absence also needs the
                    # absence_proof leaf_listing of proc_root to exit 0 without listing the pid; a listed pid is present.
                    record_holder_presence: {of_segments: ['<pid>'], pid_from: record_lease_pid, follow: false, absent_when: not_found, other_failure: unknown, absent_also_requires: [entry_generation, render, n10, write_bound, lifetime, dead_holder, relock, absence_proof, leaf_listing]}
                  # C1-SR922U (CPL-OP2A-C1-SEED-PROC-SEGMENTS; route op2a controller_seed.j2 9273815e :1123-1135, read):
                  # the custody consumption shell spells "/$1", "/$1/stat" and "/$$/ns/" + supervision.namespaces.{pid,
                  # cgroup}. Those are /proc paths and they are inside this word. The shell's own pid ($$) is the subject of
                  # the namespace reads, not `self`: the stat runs in a command substitution child, where self would name
                  # the child process. consumption_start takes the shell's own pid (:1208, :1302) or a recorded consumer
                  # pid (:1291); every pid passes pid_match.consumers.shell_case first. The stat start time is field 22
                  # (after the last ')'). supervision.namespaces is kept; its pid and cgroup values must equal the last
                  # segment of consumer_pidns and consumer_cgroupns, and the shell builds the path from of_segments.
                  consumer_reads:
                    consumer: controller_seed_custody_consumption
                    pid_check: [pid_match, consumers, shell_case]
                    # C1-SR922V: the same for the seed's `[ -e ]` (controller_seed :1123): absence also needs leaf_listing.
                    # C1-SR922W (CPL-OP2B-SEED-PRESENCE-ERRNO). Even with the listing, one residual is NOT acceptable:
                    #   hidepid. Under hidepid=invisible, a pid the reader may not ptrace both stats ENOENT (pid_getattr,
                    #   base.c :2021-2027) and is left out of the listing (proc_pid_readdir checks HIDEPID_INVISIBLE). The
                    #   same uid does not make it visible: a non-dumpable process fails ptrace_may_access (ptrace.c
                    #   :330-336, measured SR922r). So a live consumer can read absent. consumption_presence therefore
                    #   gains visibility_from: the same process_visibility basis as the reaper (proc_mount_unrestricted,
                    #   namespace_bound). Without that basis the presence is unknown, and lme_consume_start must not return
                    #   "absent" (its `[ -e ] || return 0`).
                    # Residuals that remain (safe direction or documented):
                    #   - next_tgid skips a pid with no TGID task (base.c :3536-3544).
                    #   - the GNU find exit status is documented, not measured.
                    #   - the pid may die between the lookup and the listing: that reads present, then the stat read
                    #     fails, which refuses.
                    #   - names are decimal and compared byte-exact in the shell, so name decoding is not a residual.
                    consumption_presence: {of_segments: ['<pid>'], pid_from_one_of: [consumer_shell_pid, consumption_record_pid], absent_when: not_found, absent_also_requires: [entry_generation, render, n10, write_bound, lifetime, dead_holder, relock, absence_proof, leaf_listing], visibility_from: [entry_generation, render, n10, write_bound, lifetime, dead_holder, relock, process_visibility], visibility_unproven: unknown}
                    consumption_stat: {of_segments: ['<pid>', stat], pid_from_one_of: [consumer_shell_pid, consumption_record_pid], start_field: 22, comm_close: last_paren}
                    consumer_pidns: {of_segments: ['<pid>', ns, pid], pid_from: consumer_shell_pid, last_segment_equals: [source_admission, custody_lease, supervision, namespaces, pid]}
                    consumer_cgroupns: {of_segments: ['<pid>', ns, cgroup], pid_from: consumer_shell_pid, last_segment_equals: [source_admission, custody_lease, supervision, namespaces, cgroup]}
                  consistent_with: [entry_generation, render, n10, write_bound, lifetime, dead_holder, relock, namespace]
                record_schema: lme-staging-lease/1
                # r3f (G O01/S01 plant foreign records): the record is ONE flat JSON object with EXACTLY these keys, every
                # value a JSON STRING matching its format; any other key, type or format = no record (UNKNOWN, preserved)
                record_fields:
                  schema: 'string == record_schema'
                  token: 'string, token_regex, == the file name suffix and == L<machine>-<boot>-<uid>-<pid>-<start>'
                  machine: 'string, 32 lowercase hex (/etc/machine-id of the reserving controller)'
                  boot: 'string, 32 lowercase hex (boot_id without dashes)'
                  uid: 'string, decimal (controller uid)'
                  pid: 'string, decimal >= 1 (holder ansible-playbook main pid)'
                  start: 'string, decimal (field 22 of /proc/<pid>/stat)'
                  pidns: 'string, ns_regex pid:[<inode>]'
                  cgroupns: 'string, ns_regex cgroup:[<inode>]'
                  cgroup_b64: 'string, base64 of the holder cgroup v2 path (/proc/<pid>/cgroup without 0::)'
                lease_infix: lease
                lock_suffix: lock
                # DESTINATION LOCK CUSTODY (codex 183510; RH-STAGING-LOCK-CUSTODY). `.<dest basename>.<lock_suffix>` in the
                # destination parent (the controller's <work root>/.bundle.lock; each target's bundle-dir sibling) is
                # persistent state of the SAME owner as the staging it serializes (the acting uid, rh_reap_uid). It is
                # admitted by tasks/reap_staging.yml BEFORE any flock on it (the reap mutations and both callers'
                # publish fences run after that include), never created implicitly by flock (O_CREAT 0666 & ~umask):
                #   absent  -> created ONCE by the declared sh as `umask <create_umask> && : >> <lock>`: O_CREAT|O_APPEND,
                #              so it never truncates or replaces an inode (a lock another process already holds keeps
                #              its identity) and the umask binds only that one child process (no host or play change);
                #   present -> never recreated, never chmod-ed: it must be a regular file (not a link) owned by `owner`
                #              and not group/other-writable (existing), else refusal (preserved for the operator);
                #   read back after creation: regular, owner, exactly `mode`.
                lock_file:
                  owner: acting_uid                  # rh_reap_uid on this host
                  mode: '0600'
                  create_umask: '0177'               # 0666 & ~0177 = 0600
                  create: append_open_if_absent
                  existing: {regular_file: true, refuse_links: true, owner: acting_uid, refuse_group_other_writable: true}
                  refusal: RH-STAGING-LEASE
                busy_rc: 75
                # C1-SR922H (C1-GAP-REAP-FLOCK-NONBLOCK-WORD): the argument words of the REAPER's destination-lock flock
                # (route op1q reap_staging :393 known-answer pair, :809 rename-away, :827 reaping removal, :850 record
                # removal): <flock> exclusive_arg nonblocking_arg conflict_exit_arg <busy_rc> <lock> <command...>. A lock
                # already held makes flock exit busy_rc (never wait): the entry stays PRESERVED-BUSY-STAGING. This is the
                # destination lock of THIS lease, not the obligation registry lock (write_bound.obligations.commands.lock,
                # which waits publish_wait_seconds and carries no nonblocking word).
                reap_lock: {tool: flock, exclusive_arg: '-x', nonblocking_arg: '-n', conflict_exit_arg: '-E'}
                publish_wait_seconds: 30     # bounded wait of the publish fence for the destination lock
                kat_lock_suffix: lme-flock-kat   # r3f: flock known answers run on a PRIVATE temp lock, never the destination lock
                # r3f R3E-WRITER-CONTAINMENT: subtree liveness is cgroup.events `populated` (cgroup v2: the cgroup AND
                # every descendant), never an empty direct cgroup.procs
                events_file: cgroup.events
                populated_regex: '^populated [01]$'
                unpopulated_regex: '(?m)^populated 0$'
                refusal: RH-STAGING-LEASE
                busy_refusal: RH-STAGING-BUSY
                # PUBLICATION AUTHORITY / EPOCH (r3f, codex-tick144 E26-INFLIGHT-COMPLETION). A lock around the rename
                # alone proves nothing about revocation, so the authority is declared:
                #  AUTHORITY = this run's staging path, which carries its lease token (`.<name>.<staging_infix>.<token>.*`).
                #   It is checked by the publish rename ITSELF: renameat2(source, destination, RENAME_NOREPLACE) run as the
                #   child of `flock -x -w` on the destination lock. flock (no -o) keeps the locked descriptor in that
                #   child, so the lock is held continuously through the rename even if the flock parent is killed.
                #  REVOCATION = renaming that staging path away (to its reaping name) under the SAME lock. Every revoker --
                #   recovery (tasks/reap_staging.yml), teardown and machine retirement (owned by their callers) -- MUST
                #   (1) take the destination lock, (2) hold the SAME quiescence proof for every lease of that destination,
                #   (3) rename each staging away, then remove its lease record, and only then touch the destination; a
                #   live or unknown lease makes the revoker REFUSE (busy), never delete. So a writer that could still
                #   resume (stopped, in flight, orphaned) is never revoked under it, and no revoker mutates a live
                #   writer's staging.
                #  OUTCOMES: (i) the rename finds its source gone -> it failed atomically, nothing lands: RH-STAGING-REVOKED
                #   (a resumed old writer never mutates the revoker's staging: its own path no longer exists and its
                #   release steps name only its own token). (ii) an interrupted run's publisher that already holds the
                #   lock completes its admitted rename of the exact verified extraction: ADMITTED only because no revoker
                #   can have acted (the lock is held and its writers are live); the next run reads the destination back
                #   and converges (identical check file + manifest) or refuses reporting the present config_revision.
                #   A destination that appeared, even an EMPTY dir, is never replaced (noreplace_arg): a successor that
                #   landed first cannot be published over, and an older publisher that landed first makes the successor
                #   refuse with the present revision (never silently accepted).
                #  A publish LANDED iff the rename exited 0 AND its source is gone. The exit status of a no-replace skip
                #  differs across coreutils versions (0 on 9.7, verified locally), so landing is decided by the source
                #  still being present, never by the exit status alone.
                authority:
                  token_in: staging_path
                  check: noreplace_rename_under_destination_lock
