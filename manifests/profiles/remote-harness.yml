              object_format: 'the repository object format is not the declared object format'
              config: 'the effective git configuration sets a refused key'
              conversion: 'a conversion attribute is specified for a generation path'
              untracked: 'a generation path is not tracked at the admitted edition'
              staged_change: 'a generation path has a staged change in the index'
