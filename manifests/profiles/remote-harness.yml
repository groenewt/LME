          # (temp, Ansible local temp + AnsiballZ payloads, tool caches, rootless engine storage, runner evidence)
          # lives under ONE declared, admitted work root. Nothing here is an ambient or manually exported default.
          #   controller: the work root is <checkout>/<root_rel> (the checkout the harness resolved, rh_repo_root);
          #               the controller seed root (`--root`) is exactly <work root>/<sub_roots.toolchain>; each
          #               `seed run` dir is <toolchain>/<layout.run_dir>/<run>, whose tmp/ is TMPDIR,
