                      when: {var_absent: lme_invocation_mode, bindings_present: true}
                      exception: decided
                      bindings_from: [work_roots, run_pinned_vars]
                      bindings: [rh_controller_target, rh_controller_connection]
                      remote_tmp_launch: run
                      remote_tmp: task_var_controller_env
                  by_runner:
                    MAIN_only: {launch: seed_run, controller_plays: seed_run, privileged_target_plays: root_only_not_applicable, genesis_stage_operations: genesis_launch}
                  otherwise:
                    exception: refused
                    text: 'owner_private_group: no controller binding is declared for this launch context (neither genesis.launch, a leased run-local launch nor a seed run carrying its pinned controller bindings); an owner-owned group-writable component refuses before any facts or decision'
              # ROOT-ONLY variant of this rule (codex 155203 / rev8 RH-PRIVILEGED-TOOL-ANCESTRY): the privileged first
              # contact (target_bootstrap.initial_contact.privileged.ancestry). Same component facts as the owner rule
              # (the ONE raw initial-contact fact collection), stricter decision: owners [0] only, never group- or
              # other-writable, so owner_private_group (and its decision program) can never admit anything here --
              # nothing the unprivileged owner controls survives. tasks/admit_ancestry.yml cannot be its executor: it
              # is module-backed (the interpreter is not admitted yet) and keeps refusing uid 0 (owner_trust).
              root_only:
                allow_owner_uids: [0]
                refuse_group_other_writable: true
                refuse_links: true                     # a traversed symlink is admitted only as a tool path component
                                                       # owned by uid 0 whose resolution chain is admitted in full
                owner_private_group: not_applicable
          # LOCK CAPTURE (C1 s14 records-pkg-optb-05; codex721 LOCKSHA-01; C1PKG-REQ-LOCKCAP-CTL): the ONE capture law of a
          # toolchain lock (the lock_file_rel of the resolved recipe named by input_binding). The file is read ONCE as exact bytes: text =
          # those bytes; sha256 = their digest_algorithm digest; packages / collections = the rows parsed from that same text.
          # verify: before the read, in the same flow, the reader stats the same joined path (follow false, checksum by
          # digest_algorithm); every require field must be true and digest_field must equal sha256, else it refuses before
          # any row is used. Readers: package.yml once per class lock; resolve_policy.yml once for the executing controller
          # lock (the reserved fact rh_seed_lock). One law, two readers (replaces package_publish.lock_capture).
          lock_capture:
            fields: [text, sha256, packages, collections]
            digest_algorithm: sha256
            verify: {by: stat, follow: false, require: [exists, isreg], digest_field: checksum}
            # C1-H11 (codex 870 Q273_1; fw42 X2-CORR-01 :507-524): every capture reads the lock_file_rel of the engine-resolved
            # recipe of the reading role (builder | test) and class; the two roles keep separate lock identities. Readers consume
            # this binding as published and never reselect, merge or substitute a lock path.
            input_binding: {source: resolved_recipe, field: lock_file_rel, keyed_by: [role, class_key], roles: [builder, test], missing: refuse_before_effect, conflict: refuse_before_effect}
            # C1-RECIPES-01 (OW-H11-C1-01; codex 870 Q273_1): where each role's recipe sits in a class scope policy P (class_key
            # selects the class's own registry-resolved P: bootstrap.bundle.per_class.key_field). Paths are walked by segment
            # from the root of P. builder: the recipe node itself; test: the entry of recipes keyed by the value at selector.
            recipe_at:
              builder: {recipe: controller, leg: controller.builder_leg}
              test: {recipes: controller.test_recipes, selector: controller.test_leg}
            # C1-RECIPE-PUB-01 (OW-H11-C1-01-PUB; codex-tick883): the loader resolves recipe_at ONCE (registry
            # policy_projections.resolved_recipe) into lock_capture.resolved_recipe {builder: {recipe, leg, recipe_sha256}, test: {recipe, leg, recipe_sha256}}
            # of each scope policy; readers dereference that node and never walk these addresses. It is never authored here.
            # refusal (C1 s14 records-pkg-optb-06; C1PKG-REQ-LOCKCAP-REFUSAL): the ONE code every reader of this law raises
            # for any capture failure (stat, require, digest, read, parse, shape); no reader borrows another code.
            refusal: RH-LOCK-CAPTURE
            # digest_of (C1-PKG records-pkg-receipt-words-01 W4; codex727 OD_LOCKSHA_SCHEMA_01): what every lock_sha256
            # digests, for every writer and reader (package, controller and acquisition receipts, preparation record): the
            # exact file bytes of the one capture, never re-serialized text. The bumped schema words are the epoch; this
            # is the meaning.
            digest_of: exact_file_bytes
          # PROFILE CAPTURE (C1-PROFILE-IDENTITY-01; codex 882 SR-290-05): the ONE capture law of the selected profile's own
          # admitted bytes, distinct from lock_capture (no lock value reaches it). resolve_policy.yml reads the profile at
          # source_admission.bootstrap_input.declaration_rel ONCE as exact bytes, after the stat under verify; sha256 = their
          # digest_algorithm digest and must equal the admitted member observed digest; the text is parsed ONCE by the strict
          # unique-key construction (lme_manifest_strict). The engine identity (registry remote_harness_schema.profile_identity,
          # published by resolve.yml as {path, sha256} of the bytes bound to its native load) must name that path and digest,
          # else conflict_refusal. digest_of is what every profile_sha256 digests (rh_profile_sha256, the controller, bundle
          # and acquisition receipts, the preparation record): the exact file bytes, never stripped or re-serialized text.
          # lme_global_override is no part of it: an override moves policy_sha256 and lme_resolved_revision only.
          # C1-PROFILE-IDENTITY-02 (SR-301): the engine identity also carries capture_path (the retained copy the engine
          # loaded); this check compares path and sha256 only.
          profile_capture:
            fields: [text, sha256]
            digest_algorithm: sha256
            digest_of: exact_file_bytes
            verify: {by: stat, follow: false, require: [exists, isreg], digest_field: checksum}
            refusal: RH-PROFILE-CAPTURE
            conflict_refusal: RH-POLICY-INPUT-CONFLICT
          # N13 PACKAGE PUBLICATION (C1 s14 erratum-02, amended by records-pkg-optb-01 for codex711 OD-PKG-CLASS-01 option
          # B): the byte allocation of ONE bundle publication is declared PER ARTIFACT, never as one universal map: max_bytes
          # on every controller.bootstrap.artifacts row, on every lock packages / collections row (lock owner), and
          # bundle.member_max_bytes for the four fixed members. The PKG-CALLER binder derives each class's rows (staged rel ->
          # cap), total (their sum) and need from the class policy and the class lock before any write; N13 reserve_publish
          # admits them. A CEILING, not a measurement, and NOT generation_max_bytes (budget below, a different object).
          package_publish:
            # C1 s14 records-pkg-01 (C1-REQ-PKG-04; codex696 OPEN-PKG-03 (a); genesis N13 s04 N13-PREPUBLISH): the declared
            # pre-publication check of each staged CHECK file, consumed by N13 after SEAL and before the ONE rename. rows: check
            # rel -> {form: the line form N13 implements (digest_lines: its grammar is bundle.checksum_format, bound by the
            # caller, never re-declared here), covers: the N13 staged groups the file lists, one line each, in this order (the
            # seed and launcher renders, then every artifact copy), terminator: a terminators word}. terminators: word -> the
            # terminator STRING as DATA -- a YAML double-quoted scalar, so the byte comes from the YAML loader and never from a
            # template constant (the 9683d53d backslash-n incident cannot pass). Read from the class scope policy.
            pre_publish:
              terminators: {newline: "\n"}
              rows:
                bundle.sha256: {form: digest_lines, covers: [renders, copies], terminator: newline}
            # PUBLICATION RECEIPT (C1-PKG records-pubrcpt-02; codex729 729-RECOVERY-RECEIPT-REUSE; B-CLS-4). Read from the
            # executing controller policy (rh), never a class policy. CLASS RECORDS: at the class loop start the dir
            # <act dir>/<class_records.dir_rel> is stat-ed (no link followed): absent -> one mkdir without -p at dir_mode,
            # resumed false; present -> resumed true, admitted only as a real invoker-owned dir of dir_mode holding only
            # <partition key>.json regular files of mode and owner. After each class admit_bundle and before the next class
            # its record (keys exactly class_fields: bundle = admit_bundle rh_bundle, keys exactly bundle_fields; lock_sha256
            # = the class capture sha256; trusted_oid = the admitted source record member_fields.trusted of the class own
            # lock rel; outcome) is written once: pre-stat refuse if present, force false, read back equal, stat mode, owner,
            # digest. A PRESENT class record is re-admitted, never rewritten: keys exact, lock_sha256 and trusted_oid equal to
            # this run, N13 reports unchanged and the full admit_bundle rh_bundle equals record.bundle; its historical outcome
            # is kept. outcome on a class without a record: the N13 word, except observed_on_resume when resumed and N13 finds
            # it unchanged. RECEIPT <act dir>/<record_rel> after the loop: keys exactly fields, classes the partition exactly
            # (coverage), source = source_fields of the admitted source record. Absent -> written once (force false), read
            # back equal, stat; present -> re-admitted only when its bytes equal the word rebuilt with its own resumed value;
            # never rewritten. Any failure refuses with refusal; nothing is deleted or overwritten.
            receipt:
              schema: lme-package-publication/2
              format: yaml
              record_rel: package-publication.yml
              mode: '0600'
              fields: [act, classes, resumed, schema, source, stage]
              source_fields: [declaration_rel, declaration_sha256, edition]
              class_fields: [bundle, lock_sha256, outcome, trusted_oid]
              bundle_fields: [bytes, checksum_file_sha256, class_key, dir, expected_generation, launcher_sha256, manifest_sha256, members, seed_sha256]
              outcomes: [published, unchanged, observed_on_resume]
              coverage: partition
              class_records: {dir_rel: package-publication.classes, dir_mode: '0700', name: '{class_key}.yml', format: yaml, mode: '0600', follow: false, create: exclusive}
              refusal: RH-PACKAGE-RECEIPT
          # The seed re-executes itself once inside a transient user scope with these limits and reads the limits
          # back from its own cgroup. No scope -> refusal; it never runs unbudgeted (apply, verify, purge and run).
          budget:
            memory_max_bytes: 2000000000
            cpu_quota_percent: 200
            tasks_max: 512
            generation_max_bytes: 1200000000
            free_required_bytes: 3000000000
            cgroup_self: /proc/self/cgroup
            cgroup_mount: /sys/fs/cgroup
          layout:
            root_marker: .lme-controller-root
            generations_dir: generations          # every revision retained (auditable); only the active one is published
            # SEED2-EARLY-INTERRUPTION: nothing becomes visible under its final name before it is attributable.
            #   root:       <parent>/.<root basename>.<creating_infix>.<op> (0700) + marker, then ONE rename to <root>
            #   generation: <root>/generations/.<creating_infix>.<op> + .operation, then ONE rename to <generation>,
            #               after the `start <op> <generation>` operations.log line.
            # Recovery (apply, under a lock): root staging -- under the PARENT-directory lock (fd 8, taken by every
            # first apply; the creator keeps it until it holds the root lock) a root staging dir that is a real dir of
            # this uid and EMPTY or holding only the marker file is removed (REMOVED-STALE-ROOT-STAGING); generation
            # staging -- under the root lock, a staging dir whose <op> has a recorded start line is removed
            # (`removed-staging`); anything else is preserved and reported (apply) or refused (purge).
            creating_infix: creating
            # M1-STAGING-RECOVERY (codex-000256 / codex-001716 E12-E21-E22-D09c): ONE bounded recovery requirement for
            # the three staging kinds. Phase identities (G binds them; process death may leave any intermediate state,
            # the requirement is a deterministic safe retry):
            staging_recovery:
              root:
                phases: [parent-lock, root-staging-created (mkdir), root-staging-marked (marker written), root-published (mv -T), root-locked (fd 9), parent-unlocked]
                ownership: 'real dir, this uid, EMPTY or exactly the marker file'
                cleanup: 'next first apply, under the parent lock: REMOVED-STALE-ROOT-STAGING; other entries PRESERVED-UNKNOWN'
                bound: 'no owned root staging remains after the next first apply'
              generation:
                phases: [root-locked, start-logged, gen-staging-created (mkdir), gen-staging-operation (.operation written), gen-published (mv -T)]
                ownership: 'real dir, this uid, <op> with a recorded start line'
                cleanup: 'next apply, under the root lock: `removed-staging <op>`; others PRESERVED-UNKNOWN / refused by purge'
                bound: 'no owned generation staging remains after the next apply'
              bundle:
                phases: [lease-derived (controller holder), reap (dead owned only), budget, staging-reserved (mkdtemp, lease in the name), staged, published (mv -T), own-staging-released]
                ownership: 'bundle.staging_retention.owned_when AND a lease record whose controller writers are PROVABLY QUIESCENT (and, on a target, no other owner session active)'
                liveness: 'root: the parent flock (fd 8) held from root-staging creation to root-locked; generation: the root flock (fd 9); bundle: the quiescence proofs (lease record + holder pid + run cgroup in an admitted namespace view; target owner sessions) plus the publish fence (flock on the destination lock around the one publish rename)'
                cleanup: 'next attempt at the same destination, under the destination lock: quiescent owned staging renamed to reaping, removed (REAPED-STAGING); live PRESERVED-LIVE-STAGING; target not quiescent or lock busy PRESERVED-BUSY-STAGING; others PRESERVED-UNKNOWN-STAGING'
                bound: 'no quiescent owned staging/reaping dir or record remains after the next attempt (package parent on the controller, bundle-dir parent on each target); live/busy/unknown entries are charged, not counted'
              bytes: >-
                admission measures the filesystem's actual free bytes (df / the seed's storage_check) AFTER recovery, so
                every retained byte -- owned leftovers of an interrupted cleanup and preserved foreign entries alike --
                is charged to the next reservation; a reservation that does not fit refuses (RH-SEED-STORAGE /
                RH-STAGING-BUDGET) before anything is created
            abandoned_dir: abandoned              # only generations recorded in operations_log by THIS seed are moved/removed
            check_dir: check
            run_dir: run                          # ANSIBLE_HOME / temp of `seed run` (retention: run_retention)
            check_retention: {keep: 8}            # <root>/check/<UTC>.XXXXXXXX verify scratch dirs, same rule as runs
            operations_log: operations.log        # start/complete/abandon lines: <verb> <op-id> <generation-id>
            operation_file: .operation            # inside an in-progress generation: the op id that created it
            publish_tmp_prefix: .publish.         # mktemp prefix for atomic publication inside the root
            active_file: active-generation        # plain text: the active generation id
            # C1 s14 records-pkg-02 (C1-REQ-PKG-03): the toolchain generation id words. The id is prefixes.core, then
            # controller.expect_core, prefixes.python, bootstrap.python.version, prefixes.uv, bootstrap.uv.version, prefixes.seed,
            # then the first seed_digest_chars hex characters of the seed sha256. Read by the seed (GEN_ID), by
            # derive_toolchain_generation, by package_bundle (bundle.json expected_generation) and by admit_bundle
            # (rh_bundle.expected_generation). Pinned by contract: existing generations (the verified G that OPT-C reuses) carry
            # names of this form, so a word change is a declared migration, never a value edit.
            generation_id:
              prefixes: {core: core, python: '-py', uv: '-uv', seed: '-'}
              seed_digest_chars: 12
              # C1 s14 records-pkg-optb-01 (VS-PKG2-GENID-ORDER; codex711 value_sources): the id is, for each role of order
              # in turn, prefixes[role] then the role's value. sources: policy = a path relative to the controller node,
              # walked by segment (a missing segment refuses); digest = the consumer's own seed sha256, its first
              # seed_digest_chars characters. Pinned by contract: an order or source change is a declared migration.
              # C1 s14 records-pkg-optb-04 (codex721 OD-PKG-GENID-RULE-NODE): SCOPE. This naming rule (order, prefixes,
              # the seed_digest_chars precision, sources) is ONE rule of the EXECUTING publication controller's contract:
              # every consumer reads it from rh.controller, never from a class policy. Its INPUTS (each policy source,
              # walked in the class policy of the bundle being built or admitted, and that bundle's seed sha256) and the
              # resulting expected generation stay class-bound. This comment is the scope declaration (no scope node).
              order: [core, python, uv, seed]
