            anchor: repository_checkout
            root_rel: .work
            sub_roots:
              toolchain: toolchain        # controller seed --root == <work root>/toolchain
              run: run                    # runner evidence dirs: <work root>/run/<runners.<name>>
              tmp: tmp                    # persistent-free temp of a work root (target remote temp lives here)
              cache: cache
              engine_storage: engine-storage
