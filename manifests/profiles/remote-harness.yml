                    format: format
                    flow: flow
                    stage: stage
                    act: act
                    stage_root: stage_root
                    argv: argv
                    cwd: cwd
                    env: {key: env, declaration: declaration, pairs: pairs}
                    source: {key: source, checkout: checkout, commit: commit, tree: tree, status: status}
                    config: {key: config, profile_rel: profile_rel, profile_sha256: profile_sha256, inventory_kind: inventory_kind,
                             inventory: {key: inventory, role: role, path: path, sha256: sha256},
                             binding_receipt: {key: binding_receipt, path: path, sha256: sha256}, ansible_config_file: ansible_config_file}
