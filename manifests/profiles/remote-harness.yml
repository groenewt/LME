            # admitted and digest-verified rows are REUSED (warm reapply is idempotent; nothing is rewritten). Each run
            # writes ONE receipt OUTSIDE the store, at the path given by the localhost host var named receipt_var (no
            # default; path-admitted; its parent an existing real dir owned by the builder; not inside the store; an
            # existing receipt is never replaced: acquisition.receipt_schema rules below), so the store snapshot is
            # untouched by the receipt and each step's receipt can be kept. It records, from OBSERVED state only,
            # store_empty_before, store_entries_before, store_foreign_entries (entries that are not declared rows;
            # never removed) and, per row, file / declared origin url / declared sha256 / disposition (fetched =
            # absent at the pre-fetch stat and present with the declared digest after get_url; reused = present with
            # the declared digest at the pre-fetch stat). COLD QUALIFICATION = store_empty_before AND every row
            # fetched; a warm or manually prefilled store can never produce it.
            # get_url (2.19.11, SOURCE-READ ONLY): downloads into a mkstemp file of the module tmpdir, checks the sha256
            # BEFORE atomic_move and removes the temp on mismatch, so a mismatch never lands a declared file name.
            # atomic_move tries os.rename; across filesystems it copies to a `.ansible_tmp*` mkstemp file IN the store
            # and renames that. A KILLED module skips its cleanup, so an interrupted download can leave a stray temp
            # (module tmpdir, or `.ansible_tmp*` in the store) but never a declared row name; the next run reports it
            # in store_foreign_entries and it disqualifies cold qualification until MAIN supplies a fresh store.
