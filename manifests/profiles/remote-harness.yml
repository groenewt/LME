                  # state/status (these three REPLACE refused_states [running] / refused_status [enabled, enabled-runtime]).
                  load_states: [loaded]                        # a preserved unit keeps its unit file (masked/error/... -> load_refused)
                  active_states: [inactive]                    # failed -> outcome failed; probe.running_states -> outcome running
                  # UnitFileState admitted; every other enum value -> outcome enabled (enabled, enabled-runtime, linked,
                  # linked-runtime, alias, indirect, transient, masked, masked-runtime, bad, ''). TIGHTENED over r3 (linked /
                  # indirect / alias / transient now refuse); `generated` (podman quadlet) stays ADMITTED despite possible
                  # autostart through generator wants links -- the existing limit, until ownership/lifecycle evidence is joined;
                  # `static` stays admitted (no [Install]; started only as a dependency).
                  unit_file_states: [disabled, static, generated]
                retired_absent:
                  role: prereq_retired_units                   # NEW role (C1 join TP4-ROLE-RETIRED)
                  present: refused                             # present again = an interrupted / reverted retirement
