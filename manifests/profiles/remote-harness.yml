          # `preparation` (C1 hunk 4, P-x; controller.bootstrap.preparation.tool_label) is a controller consumer admitted at
          # its OWN use boundary (tasks/admit_prep_tools.yml, acquire stage): package.yml :107-114 skips entries whose
          # required_by is a subset of target + [preparation] (gpgv, dpkg-deb, xz), so "any controller label" makes an
          # entry a PACKAGING precondition only when it names a controller label other than preparation (tar stays hashed).
