            # SEED-LAUNCH STEP RECORD (codex 235900): the evidence layout of ONE seed-launcher invocation by MAIN's route
            # (controller.bootstrap.seed_launcher caller_argv, any seed_launch.mode_args mode). DECLARATION ONLY, through
            # the same runner/record contract as the genesis stage step record (lme-genesis-step/2): written by MAIN's
            # declared runner -- no second recorder, no execution engine. EVIDENCE VALIDITY is separate from the
            # OUTCOME: a record with a missing or malformed field is INVALID EVIDENCE (evidence_validity), never a success
            # and never a rewrite of what the process did -- exit_status and result stay exactly as captured. Field names
            # reuse the lme-genesis-step/2 vocabulary where they apply (argv, cwd, env, source, config, started_at_utc,
            # ended_at_utc, capture, exit_status); the launcher-specific ones are mode, attempt, root, bundle,
            # caller_boundary, evidence_validity and result. The CALLER environment (caller -> launcher) is recorded by
            # NAME only; the launcher -> seed environment is the generated seed_launch.env declaration, referenced apart.
            seed_step_record:
              schema: lme-seed-launch-step/1
              format: yaml
              evidence_dir: '<work root>/<work_roots.sub_roots.run>/seed-launch/<mode>/<attempt>'
              # attempt: fullmatch of the whole value; the evidence dir is created exclusively (an existing one refuses, never reused)
              attempt: {regex: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$', match: fullmatch, created: exclusive}
              files: {record: step.yml}                      # the ONLY file; no stdout/stderr capture files
              fields:
                mode: 'the seed_launch.mode_args key invoked (apply | verify | purge | run | run-local)'
                attempt: 'this launch''s attempt identity (attempt.regex; its evidence dir name)'
                root: 'absolute: the {root} word of seed_launcher.caller_argv (the seed --root)'
                argv: 'the exact caller vector (seed_launcher.caller_argv after placeholder substitution), as a list'
                cwd: 'absolute'
                env:
                  caller_names: 'the exact NAME list of the environment the runner (caller) gave the launcher process, in order -- names only, never values or secrets'
                  caller_boundary: 'acknowledged NON-HOSTILE caller boundary (codex 234857 LAUNCHER-CALLER-BOUNDARY): this caller environment reaches the launcher''s interpreter startup, realpath and HOME derivation BEFORE its final env -i; recorded, not proven clean'
                  launcher_to_seed_declaration: 'controller.bootstrap.seed_launch.env -- the DOWNSTREAM generated launcher -> seed environment (after the launcher''s final env -i); a reference only, NOT the recorded caller names'
                caller_boundary:
                  launcher: 'absolute: <bundle_dir>/<bundle.launcher_file> exactly as exec''d (argv[0])'
                  mode_params: 'the {mode_params} words, in order (seed_launcher.mode_params; empty for apply / verify / purge)'
                  args: 'the {args} words after the mode_args'' own `--`, in order (empty for apply / verify / purge)'
                bundle:
                  dir: 'absolute: the launcher''s own directory (seed_launcher.self_path)'
                  launcher_sha256: 'sha256 of <bundle_dir>/<bundle.launcher_file> (recorded measurement)'
                  seed_sha256: 'sha256 of <bundle_dir>/<bundle.seed_file> (recorded measurement)'
                  checksum_file_sha256: 'sha256 of <bundle_dir>/<bundle.checksum_file> (recorded measurement)'
                source: {checkout: 'absolute', commit: 'git HEAD', tree: 'git HEAD^{tree}', status: 'porcelain output (empty = clean)'}
                config: {profile_rel: manifests/profiles/remote-harness.yml, profile_sha256: 'sha256'}
                started_at_utc: 'ISO-8601 UTC, taken immediately before exec'
                ended_at_utc: 'ISO-8601 UTC, taken immediately after the process exits'
                capture:
                  reference: 'the runner tool''s native capture of this process (its own identifier / location for the output and status, exactly as the tool reports it)'
                  fidelity:
                    streams: 'merged | separate -- as the tool actually captured them; not_captured when the recorder did not capture'
                    complete: 'bool -- false when the tool truncated or the capture was cut off'
                  retained_output: 'OPTIONAL: the captured output as YAML text (a block scalar), or YAML !!binary when not text; one entry when merged, {stdout, stderr} only when separate; stated as retained, never as more than fidelity says'
                exit_status: 'the process''s actual exit status as the tool captured it (int; signal -> 128+n); never coerced, never inferred from output'
                result: 'the product result as the capture shows it, verbatim (the seed''s printed refusal code such as RH-SEED-*, or its completion report); none_observed when the capture holds none -- never inferred from exit_status, never rewritten'
                evidence_validity: 'valid | invalid -- invalid when any field above is missing or malformed or the capture cannot be bound to this process; it qualifies the EVIDENCE only and never replaces or rewrites exit_status or result'
            # Acquisition route (MAIN, network-permitted stage): testing/remote_harness/acquire.yml fetches ONLY rows
            # with a declared `url` into the admitted artifact source, sha256-pinned (ansible.builtin.get_url
            # checksum). Rows without a source are named in one refusal, never guessed.
            acquire_playbook_rel: testing/remote_harness/acquire.yml
