                    operation: operation
                    target: target
                    label: label
                    scope: scope
                    scope_id: id
                    scope_sha256: scope_sha256
                    hypervisor: hypervisor
                    contact: contact
                    principal: principal
                    uid: uid
                    user: user
                    python: python
                    module_tmp: module_tmp
                    contact_tools: contact_tools
                    declared: declared
                    labels: labels
                    closure: closure
                    member_labels: member_labels
                    guest_labels: guest_labels
                    guest_selected: guest_selected
                    basis: basis
                    hypervisor_member: hypervisor_member
                    role_group: role_group
                    guest_allocation_declared: guest_allocation_declared
                    tools: tools
                    path: path
                    required_by: required_by
                    identity: identity
                    kind: kind
                    sha256: sha256
                    identity_kind: identity_kind
                    override_path: override_path
                    checksum_algorithm: checksum_algorithm
                    expectation: expectation
                    measured: measured
                    required: required
                    text: text
                    declared_path: declared_path
                    executed_by_contact: executed_by_contact
                    declared_identity: declared_identity
                    declared_measured: declared_measured
                    exists: exists
                    lstat: lstat
                    type: type
                    gid: gid
                    owner: owner
                    group: group
                    mode: mode
                    link_target: link_target
                    resolved: resolved
                    resolved_stat: resolved_stat
                    regular: regular
                    size: size
