              # codex-tick579 HBP-EVIDENCE-ANCESTRY: every component of that path is observed BEFORE any effect and on
              # every resume with the admitted stat tool (ancestry.stat_format; fields ancestry.stat_fields, in order) and
              # admitted by the ONE rule path_admission.ancestry (allow_owner_uids, owner = the run user's passwd uid;
              # links and non-directories refuse; other-writable refuses, sticky included). The owner_private_group
              # program is not run on the guest (its tools are outside this boundary), so ancestry.group_writable: refuse
