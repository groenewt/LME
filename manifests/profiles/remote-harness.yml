            # current states and evaluates each member against ITS expected state. The scope is never derived by filtering on
            # observed state. Applies to EVERY member of inventory.target_group (a hypervisor does not imply a prior stack; a
            # non-hypervisor may carry one). Only MAIN runs the privileged observation.
            preservation:
              refusal: RH-TARGET-PREREQ-PRESERVATION
              applies_to: every_target_group_member
              unit_regex: '^[A-Za-z0-9@_.:-]+[.]service$'      # == the registry pattern service_name (global.yml :1094)
              # BASIS vocabulary (explicit; no default; rule 3). Exactly one per member; anything else refuses before contact
              # in target_prereq.yml (prereq_observe.yml also admits `undeclared`: it records matches and evaluates nothing).
              bases:
                known_set:
                  means: the member units are KNOWN (prior deployment declarations / preservation records); each has an expected state
                  evidence: at least one member role (expected_states.<state>.role) is bound; the verified_none role is absent
                  absence: an absent member REFUSES (outcome absent); observation never shrinks the declared set
                verified_none:
                  means: verified no prior deployment on this member
                  role: prereq_verified_no_prior_deployment    # bool target input; must be true when present (false refuses)
                  requires: [the discovery selector role is bound (non-empty), no member role is bound]
                  check: any LISTED unit matching the discovery selectors is PROBED and REFUSES unless its probe LoadState is in absent_status AND its probe ActiveState is in absent_states (probe_unknown refuses)
              # EXPECTED-STATE vocabulary (per member; rule 1). One string_list target-input role per state (no new pattern:
              # both roles use the registered service_name pattern). A unit named in two roles refuses (conflicting basis).
              expected_states:
                inactive_not_enabled:
                  role: prereq_preserved_units                 # existing role (var lme_lab_preserved_units)
                  present: required
