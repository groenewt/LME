                ops: [measure, observe]
                measure_op: measure
                observe_op: observe
                refusal: RH-TARGET-PREREQ-MEASURE
                record_suffix: .prereq-measure.json            # <state dir><reuse.path_separator><tr.outputs.prefix><label><suffix>, mode 0600
                record_schema: lme-target-prereq-measure/v1
