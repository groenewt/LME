            missing: 'a declared generated entry is absent from the checkout'
            modified: 'a generated entry differs from its recorded digest'
            stale: 'a generated entry was not rendered from the current admitted inputs'
            staging: 'the staging directory is not a fresh owned private directory under the run root'
            staged: 'a staged entry differs from the entry rendered from the admitted inputs'
            evidence: 'the generation evidence does not carry exactly the declared fields'
            transition: 'a transition input outside a genesis generate act, an undeclared kind, or a rebind with nothing to rebind'
            adoption_input: 'an adoption digest input was supplied without the adopt transition, or the adopt transition has no adoption digest input of the declared digest form'
            include_resolution: 'an earlier search location shadows, or could shadow, the admitted shared member'
            # MR03 S14 C1 (genesis R-W1-01S, records-w1-gen-03 dcc774de): generate_entries stage selection by the admitted caller
            caller_input: 'the genesis-context run carries no protected caller fact set by the source admission after the callers row admitted the caller, or that fact is not a string'
            stage_absent: 'no genesis.launch.stages row names the admitted caller as its playbook_rel'
            stage_duplicate: 'more than one genesis.launch.stages row names the admitted caller as its playbook_rel'
            # brr-follow-s2 successor-06 (Codex576 J-RC-02): the rendered rows' runtime struct-source refusal text (code: roster)
            struct_source: 'a rendered row''s struct source does not resolve at render time: its fact is not a play variable, a path step is not a key of the mapping reached so far, or the value reached is not accepted by exactly one kind definition that is its declared kind -- none (an unsupported value) or more than one (ambiguous definitions) refuses (row, role, fact, steps resolved or null when the fact is absent, declared path, declared kind, matching kind words):'
            # brr-follow-s2 successor-08 (Codex580 J-S07-KIND-ADMISSION; Codex581): pre-render texts of the roster code
            struct_kind_definition: 'the struct kind definitions are missing or malformed (not a non-empty mapping of definitions each with a string test and a list of string excluded tests), or a rendered struct source declares a kind that is not a defined word (declared kinds):'
            git:
              tool: 'the git or env executable is not an absolute admitted path'
