            schema_version: 1
            supported_versions: [1]
            location: {env: LME_RESOLVED_CONFIGURATION_DIR, file_suffix: .resolved-configuration.yml}
            file_mode: '0600'
            record_digest: {algorithm: sha256}
            revision_kind: config_only                 # resolve.yml :36-40: the role resolve path (no load_manifests rebind)
            fields:
              schema_version: schema_version
              producer: producer
              cell: cell
              source_commit: source_commit
              source_tree: source_tree
              profile: profile
              configuration: configuration
              origins: origins
              configuration_revision: configuration_revision
            # field role -> the play fact the producer binds (walked along path; kind in the loader _rh_kind range)
            sources:
              configuration: {fact: lme_resolved, path: [], kind: mapping}
              origins: {fact: lme_resolved_origins, path: [], kind: mapping}
              configuration_revision: {fact: lme_resolved_revision, path: [], kind: str}
