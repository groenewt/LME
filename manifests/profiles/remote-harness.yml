            engine_storage_conf: {graphroot_rel: graph, runroot_rel: runroot}
            # rootless engine config: the seed writes <engine_storage>/containers.conf with ONLY [engine]
            # image_copy_tmp_dir = <engine_storage>/<image_copy_tmp_rel> (the /var/tmp default of image pulls/copies moves
            # to the work root; TMPDIR = the run tmp covers the same path). CONTAINERS_CONF makes this the only
            # containers.conf read (built-in defaults otherwise). [engine] tmp_dir is NOT moved: it is libpod runtime
            # state under XDG_RUNTIME_DIR (tmpfs by design, reboot detection). UNVERIFIED against the installed podman
            # (nothing was run): an engine that ignores the key keeps /var/tmp -> listed unresolved until observed.
            engine_containers_conf: {image_copy_tmp_rel: image-copy}
