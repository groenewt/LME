              manifest_field_checkout: checkout            # bundle.json source.checkout (package_bundle.yml)
              file_rel: manifests/profiles/remote-harness.yml   # bundle.json source.inputs "<rel>  <sha256>" entry
              refusal: RH-SEED-USAGE
            # STORAGE ADMISSION ORDER + CUSTODY (codex 143844 RH-STORAGE-ADMISSION-ORDER, RH-ENGINE-CONFIG-CUSTODY). In
            # apply, verify, run and run-local the seed admits, BEFORE any create, prune, log write or install (right
            # after the budget scope, before root creation and the root lock), the storage it will write:
            #   the admitted work root (run / run-local: W above; apply / verify: the root's parent): refused_prefixes,
            #   refused_fs_types, free_bytes_min and free_inodes_min (admission below);
            #   every EXISTING destination (R and its layout dirs; run / run-local also every declared sub-root dir,
            #   config file and runner evidence dir): not a link, owned by the running uid, not group/other-writable,
            #   directory or regular file as declared, on the SAME device as the admitted work root (a nested mount
