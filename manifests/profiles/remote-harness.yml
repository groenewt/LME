              schema_fields:
                schema: lme-target-prereq-observe/v1
                target: inventory alias
                label: lme_transfer_label
                scope: '{id, scope_sha256}'
                declared: '{preservation: {basis, members: {<unit>: <expected state>}, selectors}, obs_paths}'
                preflight: 'the lme-target-prereq-preflight/v2 body (contact, principal, endpoint, paths incl. the work parent chain, account, os_family, packages, preservation, capacity, linger_tool, refusals)'
                preservation: 'preflight.preservation: {basis, selectors, selector_regex, evaluated, members: {<unit>: {expected, observed: {state, status, source, selected_by}, probe: {ok, rc, fields, stderr, error}, outcome, route}}, outside_known: {<unit>: {state, status, source, selected_by, probe}}, limit, probe: {tool, tool_admitted, fields, units, results}, refusals}'
                obs_paths: '{<entry>: {chain: {<ancestor or entry>: {exists, type, uid, gid, owner, group, mode}}, listing: {<child path>: {type, uid, gid, owner, group, mode}} | null, listing_skipped: [...]}}'
                findings: preflight refusals + preservation refusals (collected; not enforced by this leg)
                contact: admitted | not_admitted
