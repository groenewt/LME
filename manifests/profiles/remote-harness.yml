              refused_prefixes: [/tmp/, /var/tmp/, /dev/shm/, /run/]
              refused_fs_types: [tmpfs, ramfs]
              free_bytes_min: 3000000000
              free_inodes_min: 200000
              # C1-SR922K SEED DF WORDS (route op1t controller_seed 4ef3d91b df_value :680-696; storage_check :700;
              # work_root_check :716): the seed's ONE df capacity read, as words. args: the os_tools.df argument words per
              # measured value, end_of_options last, then the measured path (the template appends the path only): avail =
              # free bytes in 1-byte blocks (storage_check, every caller), iavail = free inodes (work_root_check). The seed
              # reads ONE value per call (storage_check also runs alone for the bundle and run_retention needs), so its
              # words are per value and are NOT write_bound.locations.df_probe_args (one two-column N13 read); the column
              # names are the same df_columns words and the units are the same (-B1 bytes, inode count). rows: the
              # captured df output is exactly header_rows header lines then data_rows data lines (2 lines); any other count
              # refuses. cell: the data row with its blanks removed is the value. grammar_from: the value must fully
              # match the ONE canonical decimal of the program, write_bound.obligations.transaction.grammar.decimal_ere
