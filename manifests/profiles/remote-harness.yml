          # concrete dated directory is PRODUCED from the release index by the stage and recorded; a moving alias such as
          # latest / daily never matches edition_regex and is never the admitted edition).
          preparation:
            revision: 1
            refusal: RH-PREPARE
            record_schema: lme-preparation-record/1
            root_var: rh_preparation_root              # localhost host var (NOT in the ^_?rh_prep_ derived family)
            layout:                                    # <root>/<value>, each created 0700 if absent, never chmod-repaired
              records: records
              bases: bases
              partial: partial
              metadata: metadata
              debs: debs
              extract: extract
              gpg_home: gpg-home
            fetch:                                     # tasks/prepare_fetch.yml: every hop admitted BEFORE contact
              scheme: https
              port: 443
              max_hops: 5                              # RS r2 redirects (proposed 5)
              redirect_status: [301, 302, 303, 307, 308]
              timeout_s: 60
              ca_file: /etc/ssl/certs/ca-certificates.crt   # the builder's declared trust store (Debian ca-certificates bundle)
            trust_modes: [debian_official_tls_sha512, signed_detached, debian_archive_inrelease]
            trust_boundaries:
              debian_official_tls_sha512: >-
                Web PKI / TLS (certificate chain + hostname) to the declared official Debian origin, then content pinning
                by SHA512 of one exact checksum entry of one dated edition. NOT an OpenPGP signature: no protection against
                compromise of the official publishing origin or a mis-issued certificate the trust store accepts. No
                DNSSEC validation is claimed. Receipts record signature_verified false and dnssec_verified false.
              signed_detached: >-
                A detached OpenPGP signature over the exact metadata bytes, verified with ONLY a declared, reviewed full
                40-hex fingerprint pin in an isolated keyring; absent / bad / unknown / expired / revoked refuses. NOT
                implemented by this producer: a descriptor selecting it REFUSES (prepare_image.yml :32), with no fallback
                to debian_official_tls_sha512 -- a mode change is a new reviewed declaration.
              debian_archive_inrelease: >-
                The suite InRelease verified by the admitted gpgv against ONLY the declared keyring (file admitted by
                sha256) with every VALIDSIG primary fingerprint declared and no bad-status line, then the byte chain
                InRelease -> Packages.xz -> Packages -> exactly one stanza -> .deb (sha256 each) -> the extracted member
                (native stat). No Valid-Until for this suite: replay of an older signed InRelease is not excluded (its
                Date is recorded). No DNSSEC validation is claimed.
            base_images:
              debian_13_genericcloud_amd64:
                trust_mode: debian_official_tls_sha512
                origin_hosts: [cloud.debian.org, cdimage.debian.org]   # tick372 approved origins; no mirror admitted
                edition_select: {mode: listed_newest}
                index_url: https://cloud.debian.org/images/cloud/trixie/
                index_path_regex: '^/images/cloud/trixie/$'
                index_href_regex: 'href="([0-9]{8}-[0-9]{4})/"'
                edition_regex: '^[0-9]{8}-[0-9]{4}$'
                edition_url: 'https://cloud.debian.org/images/cloud/trixie/{edition}/'
                edition_path_regex: '^/images/cloud/trixie/{edition}/'
                metadata_file: SHA512SUMS
                line_grammar: '^([0-9a-f]{128})  ([A-Za-z0-9._+~-]+)$'
                file_regex: 'debian-13-genericcloud-amd64-{edition}[.]qcow2'
            tool_packages:
              trust_mode: debian_archive_inrelease
              origin_hosts: [deb.debian.org]
              archive_url: https://deb.debian.org/debian
              archive_path_regex: '^/debian/'
              suite: trixie
              index: main/binary-amd64/Packages.xz
              architecture: amd64
              keyring:
                path: /usr/share/keyrings/debian-archive-keyring.gpg   # HYPOTHESIS (package debian-archive-keyring); a link refuses
                sha256: UNMEASURED                     # fail-closed marker: never matches ^[0-9a-f]{64}$
                fingerprints: []                       # fail-closed: RS r2 names none; MAIN declares the full 40-hex primaries
              packages:                                # keys = logical packages of packages.by_os_family.Debian
                qemu_utils: {members: {qemu-img: /usr/bin/qemu-img}}
                qemu_system_x86: {members: {qemu-system-x86_64: /usr/bin/qemu-system-x86_64}}
                cloud_image_utils: {members: {cloud-localds: /usr/bin/cloud-localds}}
            tools: [gpgv, dpkg-deb, xz, tar]           # EXACTLY the os_tools entries required_by tool_label
            tool_label: preparation                    # a CONTROLLER consumer (os_tool_consumers.controller)
            measures_for: [guest]                      # os_tools used only by these consumers are the record's candidates
            admitted_record: {sha256: null}            # fail-closed until C1 lands the admitted record digest
          # PREPARATION MEASUREMENT (codex-r2-r4-r5-bootstrap-decisions-20261006 R4; route-r4b; codex-tick393-r4 verdict
          # R4-RECORD-ANCESTRY / R4-ADOPTABLE-CUSTODY / R4-CONTROLLER-ONLY-SCOPE / R4-MODE-WITHOUT-DECLARATION; codex-tick394
          # R4_representation_addendum). REVISION 5: a CONTROLLER MEASUREMENT-ONLY operation inside the genesis acquire
          # stage, requested through genesis.launch.stages.acquire.selectors and run from its operations entry
          # (tasks/measure_controller_tools.yml) right after builder admission, before any fetch. Controller-only scope
          # first; native stat of each resource (kinds: where it is declared, whether links are resolved, the disposition
          # checks); the custody CHAIN of every traversed component under path_admission.ancestry[custody.rule]
          # (candidate_adoptable only when complete); ONE content-addressed CANDIDATE record rendered by the macros
          # (record_template_rel -> macros_rel); the record root's ancestry admitted at the use boundary by
          # tasks/admit_ancestry.yml; then the play ENDS. Nothing here is trust: a digest pins bytes; custody and
          # candidate_adoptable are candidate claims (claims); package names are declared associations (package_basis).
          # Contract contract_admission.preparation_measurement (exact keys, pinned).
          preparation_measurement:
            revision: 5
            operation: controller_preparation_measurement
            runner: MAIN_only
            stage: acquire                             # genesis.launch.stages key it runs inside
            stage_operation: preparation_measurement   # genesis.launch.stages.<stage>.operations key
            refusal: RH-PREPARE-MEASURE
            report: MEASURED
            record_schema: lme-preparation-measurement/4   # /4: + binding_receipt.admission (the shared admission evidence)
            mode_var: rh_measurement_mode              # == genesis.launch.stages.acquire.operations.preparation_measurement.mode_selector
            mode_value: measure                        # == genesis.launch.stages.acquire.operations.preparation_measurement.mode_value
            root_var: rh_measurement_root              # localhost host var: existing real dir, builder-owned, root_mode
            refused_inputs: [rh_artifact_source, rh_acquisition_receipt]   # acquisition inputs: refused in measurement mode
            root_mode: '0700'
            record_mode: '0400'
            record_suffix: .json                       # <root>/<digest of the record bytes><suffix>
            digest: sha256                             # stat checksum_algorithm and the record-name hash
            unset: null                                # the DECLARED missing-evidence value (digest / member not observed or declared)
            adopt_as: file_sha256                      # executable_identity kind a reviewed tool digest is adopted as
            time_format: '%Y-%m-%dT%H:%M:%SZ'
            family: Debian                             # packages.by_os_family key naming the declared packages (declared association, not observed)
            controller_families: [Debian]              # controller families the measurement / prerequisite pair supports (declared ONCE)
            name_family: '^_?rh_meas_[A-Za-z0-9_]+$'   # == registry contract_admission.patterns.reserved_meas_vars
            record_template_rel: testing/remote_harness/templates/measurement_record.j2
            macros_rel: testing/remote_harness/templates/macros/measurement.j2   # imported by record_template_rel through relpath (drives the import)
            macros: {resources: resources, custody_paths: custody_paths, record: record}   # the dispatch selectors (entry refuses any other)
            # intermediate resource schema (macro resources -> stat loops -> record): the item keys, declared
            intermediate: {kind: kind, name: name, path: path, declared: declared, package: package}
            # condition vocabulary: kinds.<kind>.checks are drawn from these values (each also a disposition word)
            conditions: {absent: absent, link: link, not_regular: not_regular, not_executable: not_executable, unreadable: unreadable}
            # the record keys the MEASURED report shows (values from the written record; framing: controller.bootstrap.report_frame)
            report_fields: [complete, missing_packages, candidate, self_authorizing]
            resources:                                 # <kind>: {<name>: {package: <packages.by_os_family logical name>}}
              tool: {gpgv: {package: gpgv}, dpkg-deb: {package: dpkg}, xz: {package: xz}}   # os_tools names (preparation.tools)
              keyring: {tool_packages: {package: debian_archive_keyring}}                    # preparation.<key>.keyring
            # ONE construction for both kinds (macros/measurement.j2 resource); the differences, declared:
            kinds:
              tool: {declared_root: os_tools, declared_member: null, resolve: true, checks: [absent, not_regular, not_executable, unreadable], otherwise: present, record_field: tools}
              keyring: {declared_root: preparation, declared_member: keyring, resolve: false, checks: [absent, link, not_regular, unreadable], otherwise: present, record_field: keyrings}
            # CUSTODY CHAIN (R4-ADOPTABLE-CUSTODY): every traversed component of the declared path and of a link's
            # resolution, the link hop (one hop whose target is the resolution, else hop_unverified) and the resolved file,
            # judged by path_admission.ancestry[rule] (root_only: uid 0, never group/other-writable, links only as
            # measured hops). Any unmeasured hop / link component -> incomplete; a rule breach -> violated.
            custody:
              rule: root_only
              states: {complete: complete, incomplete: incomplete, violated: violated, not_applicable: not_applicable}
              precedence: [violated, incomplete]
              otherwise: complete
              absent: not_applicable
              reasons:
                absent_component: {label: absent_component, state: incomplete}
                unobserved_component: {label: unobserved_component, state: incomplete}   # no stat result for a component: missing evidence, never fabricated
                link_component: {label: link_component, state: incomplete}
                hop_unverified: {label: hop_unverified, state: incomplete}
                link_not_followed: {label: link_not_followed, state: incomplete}
                not_directory: {label: not_directory, state: violated}
                owner: {label: owner, state: violated}
                writable: {label: writable, state: violated}
              finding: {path: path, reason: reason}
              result: {state: state, findings: findings}
            # codex R4_extra_scope: custody / adoptable are CANDIDATE claims with a SEPARATE source disposition
            claims: {status: candidate, disposition: separate_source_disposition_pending, scope: [custody, candidate_adoptable]}
            package_basis: declared_association_not_verified_provenance
            record_values: {candidate: true, self_authorizing: false}   # policy values written into every record
            observed_fields: [exists, islnk, lnk_source, lnk_target, isreg, isdir, executable, uid, gid, pw_name, gr_name, mode, wgrp, woth, size, dev, inode, mtime, ctime]
            dispositions: {present: present, absent: absent, link: link, not_regular: not_regular, not_executable: not_executable, unreadable: unreadable}
            record_fields:
              schema: schema
              candidate: candidate
              self_authorizing: self_authorizing
              claims: claims
              operation: operation
              measured_at_utc: measured_at_utc
              act: act
              stage: stage
              deployment_identity: deployment_identity
              inventory_sources: inventory_sources
              binding_receipt: binding_receipt
              receipt_fields: receipt_fields
              admission: admission                # binding_receipt.admission = rh_rcpt_admission (r4e macro binding_receipt)
              profile_sha256: profile_sha256
              config_revision: config_revision
              engine_revision: engine_revision
              builder: builder
              declaration: declaration
              tools: tools
              keyrings: keyrings
              missing_packages: missing_packages
              package_basis: package_basis
              complete: complete
              path: path
              declared: declared
              link_view: link_view
              resolved_view: resolved_view
              digest_algorithm: digest_algorithm
              digest: digest
              disposition: disposition
              custody: custody
              custody_findings: custody_findings
              declared_logical_package: declared_logical_package
              declared_package: declared_package
              candidate_adoptable: candidate_adoptable
              record: record
              record_sha256: record_sha256
            diagnostics:
              names: 'derived measurement names were supplied from outside (extra-vars / inventory):'
              scope: 'measurement runs only under a controller-only resolve and inventory (no target scope, no target- or role-group member, no inventory host besides the controller delegation host):'
              scope_map: 'the resolve publishes no target scope map (lme_resolved.remote_harness.scopes.targets)'
              provides: 'a measured tool is not provided by its declared logical package:'
              launch_kind: 'the launch is not exactly the stage operation''s declared inventory kind (ordered files) or its controller operation is not this node''s inputs:'
              dispatch: 'the record entry was asked for a macro outside preparation_measurement.macros:'
              inputs: 'the measurement declaration, mode or inputs are not admitted (mode must equal mode_value; no acquisition input; record root a normalized absolute path; kinds and resources consistent; resources within preparation.tools / preparation keyrings; each declared package mapped in the family and, for a tool, providing it):'
              checks: 'a measurement kind declares a disposition check outside the implemented vocabulary:'
              root: 'the record root must be an existing real directory owned by the builder with mode root_mode (never created or re-moded here)'
              record: 'the record on disk is not the rendered record (a pre-existing file of that name is preserved)'
              report: 'the report frame (controller.bootstrap.report_frame {text, stop}), the record fields record / record_sha256 or the report fields are not declared; refused before any effect:'
              stop: 'Measurement only: nothing was fetched, measured-by-execution or prepared; the record is a CANDIDATE for MAIN review, never self-authorizing, and asserts no upstream key trust.'
            prerequisites: {operation: controller_prerequisite}   # the MAIN-only privileged install of a REVIEWED record's missing_packages
            # ADOPTION: a MAIN review of the record, then C1 lands the exact values as the NEXT declared configuration
            # revision; the strict preparation path (admit_prep_tools.yml / prepare_tools.yml) then runs unchanged.
            adoption:
              by: MAIN_review
              tools: 'os_tools.<tool>.identity := {kind: adopt_as, sha256: the record resolved-view digest} (candidate_adoptable entries only, after the separate custody disposition)'
              keyrings: 'preparation.<keyring>.keyring.sha256 := the record digest -- pins BYTES, not trust'
              fingerprints: 'NEVER from this record: preparation.<keyring>.keyring.fingerprints stays [] until MAIN declares the full 40-hex primaries from an independently reviewed authority; checked later by the admitted gpgv (prepare_tools.yml)'
              never: [self_authorizing_pin, insecure_fallback, silent_profile_substitution]
          # CONTROLLER PREREQUISITE (codex-tick393 R4_privilege; route-r4b): the MAIN-only PRIVILEGED operation that
          # installs EXACTLY the missing_packages of ONE MAIN-REVIEWED measurement record on THIS controller, outside the
          # non-root builder: testing/remote_harness/controller_prereq.yml under the seed launcher `run` (ssh_auth_mode),
          # its one privileged play connecting as connection_profiles[connection_profile] (ssh root, explicit key
          # reference, become false) to the ONE member of role_groups[host_group] (this controller's privileged alias; the
          # target group stays empty), proven to be this controller by host_identity. install_module at `state` only;
          # then MAIN re-measures (then). AUTHORED, UNRUN; the connection contract and the alias binding are OPEN
          # (route-r4b r4b-invocations.yml). reviewed_record.sha256 null = fail-closed until MAIN review lands it.
          # Contract contract_admission.controller_prerequisite.
          controller_prerequisite:
            revision: 3
            operation: controller_preparation_prerequisite
            runner: MAIN_only
            playbook_rel: testing/remote_harness/controller_prereq.yml
            refusal: RH-CONTROLLER-PREREQ
            report: PREREQUISITES
            measurement: preparation_measurement
            connection_profile: privileged               # == B transfer.contract.connection_profile (asserted)
            endpoint_kind: controller_operation          # B transfer.contract.endpoint_kinds key (tr_peer.kind)
            controller_operation: controller_prerequisite   # B inventory.controller_operations key (placement)
            inventory_kind: controller_operation_binding    # B genesis.launch.inventory_kinds key (shared receipt admission)
            ssh_auth_mode: explicit_key                  # == tr_contract.auth_mode (asserted)
            host_group: controller_prerequisite          # inventory.role_groups key; tr_peer.role_group
            host_identity: {gather_subset: ['!all', '!min', platform, distribution], fact: machine_id, family_fact: os_family, role: supporting_evidence_only}
            contact: {variant: privileged, paths: []}    # initial_contact rh_ic_variant / rh_ic_paths (rh_ic_paths reserved at first entry, C1-R2D-5)
            reuse: {transfer_dir_rel: testing/e2e/transfer, transfer_decl: transfer.decl.yml, family_rel: tasks/refuse_reserved_families.yml, resolver_rel: tasks/resolve_contract.yml, endpoint_rel: tasks/endpoint_bind.yml, contact_rel: testing/remote_harness/tasks/initial_contact.yml}
            record_var: rh_prereq_record                 # extra var: absolute path of the reviewed record (outside name_family)
            reviewed_record: {sha256: null, regex: '^[0-9a-f]{64}$'}   # MAIN review lands the exact digest (fail-closed until then)
            record_checks: [schema, operation, candidate, self_authorizing, deployment_identity, missing_packages]   # record_fields keys present before values are compared
            # the report mapping keys (framing: controller.bootstrap.report_frame); contract_keys selects tr_contract keys
            report_fields: {packages: packages, reviewed_record: reviewed_record, host: host, contract: contract, contract_keys: [alias, auth_mode, key_source], binding_receipt: binding_receipt, path: path, sha256: sha256, then: then}
            install_module: ansible.builtin.package
            state: present
            selects: missing_packages                    # preparation_measurement.record_fields key
            then: remeasure
            name_family: '^_?rh_cpq_[A-Za-z0-9_]+$'      # == registry contract_admission.patterns.reserved_cpq_vars
            diagnostics:
              contract: 'B''s privileged contract was not resolved for exactly this alias, the declared endpoint kind, auth mode and bound-input key, or the bound play vars are not the contract:'
              names: 'derived prerequisite names were supplied from outside (extra-vars / inventory):'
              inputs: 'the prerequisite declaration, connection profile, auth mode, reviewed digest or record path are not admitted:'
              scope: 'the prerequisite runs only with no target scope and exactly ONE privileged alias of this controller in role_groups[host_group]:'
              record: 'the record is not the declared reviewed digest, or not this declaration''s candidate for this deployment:'
              packages: 'a selected package is outside the declared association set of the measured resources:'
              identity: 'the privileged host''s observed family is outside preparation_measurement.controller_families or not the association family, or its machine id differs (supporting evidence):'
              report: 'the report frame (controller.bootstrap.report_frame {text, stop}), the report word / then or a report field role the report uses is not declared; refused before any effect:'
              stop: 'Nothing else was installed, configured or repaired; MAIN repeats the measurement and only the NEW record is a candidate.'
          # SHARED BINDING-RECEIPT ADMISSION (route-r4d, codex-tick409 R4C-SHARED-RECEIPT-ADMISSION): the ONE route admission
          # of a controller-operation launch's files and B's binding receipt (tasks_rel), included by the measurement and
          # the prerequisite, never cloned. B single sources it joins: run_binding.receipt_suffix / lab_role,
          # genesis.launch.inventory_kinds / file_roles, inventory.controller_operations. Contract binding_admission (N-G4).
          binding_admission:
            revision: 2                                  # == consumer_interface.implements.binding_admission (asserted by the file)
            tasks_rel: testing/remote_harness/tasks/admit_binding_receipt.yml
            digest: sha256                               # stat checksum_algorithm and the receipt's *_sha256 algorithm
            binding_role: run_binding                    # genesis.launch.file_roles key of the binding among the kind's files
            name_family: '^_rh_rcpt_[A-Za-z0-9_]+$'       # == registry contract_admission.patterns.reserved_rcpt_vars
            include_refusal: RH-BINDING-RECEIPT-INCLUDE  # the include-contract code (the includer's code for everything else)
            # receipt fields naming the admitted launch files (the receipt-binding comparison is B's run_binding.receipt_bindings,
            # never a second pair mapping here -- codex-tick421 J-B8)
            fields: {binding: binding, binding_sha256: binding_sha256, lab: lab, lab_sha256: lab_sha256}
            # receipt fields COPIED into a consumer record (present in the receipt; subset of B run_binding.receipt_keys);
            # a list of record fields, not a role (the compared / attributed ROLES are run_binding.binding_roles)
            attributed: [binding, binding_sha256, data, data_sha256, deployment_identity, engine_revision, interface_sha256, lab, lab_sha256, policy_sha256, source_edition]
            # the rendered binding inventory layout (Ansible YAML inventory): <root>.<hosts>.<host>, <root>.<children>.<group>.<hosts>
            inventory_schema: {root: all, hosts: hosts, children: children}
            # the admission's published outputs (each an EXACT registry reserved_outputs name, refused pre-supplied by the first task)
            outputs: [rh_rcpt_inventory, rh_rcpt_receipt_path, rh_rcpt_receipt_stat, rh_rcpt_receipt, rh_rcpt_admission]
            # rh_rcpt_admission: role -> key (B's consumer gate reads its roles through this map)
            result_keys: {operation: operation, kind: kind, files: files, file_sha256: file_sha256, receipt: receipt, receipt_sha256: receipt_sha256, bindings: bindings, compared: compared, producer: producer, consumer: consumer, inputs: inputs, members: members, scope: scope, scope_sha256: scope_sha256}
            digest_regex: '^[0-9a-f]{64}$'                # a digest value of `digest` (scope_sha256 is checked against it)
            diagnostics:
              include: 'admit_binding_receipt.yml: a pre-supplied admission name, a declaration revision this file does not implement, or a missing include parameter; supplied names, revision, implemented revisions:'
              kind: 'the launch is not exactly the declared inventory kind (a receipt role, the binding and lab roles, its file count) or the operation does not carry its inputs in the run data:'
              sources: 'every inventory source must be an existing regular readable non-link FILE (no directory):'
              receipt: 'the binding receipt is absent, a link, not a regular readable file, its read bytes differ from its stat digest, its key set is not run_binding.receipt_keys, the receipt contract is malformed, or the binding does not declare the controller delegation host:'
              join: 'the receipt does not name exactly the given binding and lab copy (path and sha256):'
              binding: 'a COMPARED receipt binding differs from this resolve''s record (J-B6: equal effective policy, not identical overrides), a declared binding names no single present record or path, or the history does not attribute exactly the bound fields; differing fields with receipt and current values:'
              members: 'a placement group''s effective members or a member''s effective declared var differ from the receipt-vouched binding (an inventory or extra-var override outranks the binding):'
              result: 'the published admission outputs are not exactly the declared outputs, or the evidence is not keyed by result_keys or not bound to this receipt, files, bindings and scope digest:'
              input: 'an effective declared input of the operation differs from the receipt-vouched binding value (an override outranks the binding):'
              stop: 'Nothing was measured, installed or contacted.'
          # SEED FRAGMENTS (codex-tick313 R2(a); codex-tick318-321 (c): the SOLE authority, no extra-var fallback):
          # the installed-set gate fragment the seed imports (global.yml host_scope.shared_artifacts.installed_set_gate,
          # entry template; contract seed_fragments: the rel must EQUAL that entry template byte-for-byte).
          seed_fragments:
            installed_set_gate_rel: testing/remote_harness/templates/lme-seed-installed-set-gate.sh.j2
          # S1 / codex-tick127: the managed TARGET bootstrap is the SAME operation (same bundle, same seed bytes, same
          # receipt schema, same verifier), transported by remote_harness.transfer and applied by the declared NON-ROOT
          # owner (testing/remote_harness/target_bootstrap.yml). It connects AS the owner (ansible_user == owner var,
          # no become anywhere): an SSH login session gives the owner a systemd user manager and XDG_RUNTIME_DIR,
          # which the seed's budget scope needs. Absence of any precondition refuses BEFORE the first target effect.
          target_bootstrap:
            playbook_rel: testing/remote_harness/target_bootstrap.yml
            connect_as: owner                        # ansible_user must equal the owner var; become must be off
            user_manager:
              runtime_dir: /run/user/{uid}           # must exist, owned by uid, mode runtime_dir_mode
              runtime_dir_mode: '700'                # stat %a form; checked by the seed launch derivation
              bus: bus                               # <runtime_dir>/bus must be a socket
              linger: >-
                NOT required for the bootstrap itself (the SSH session carries the user manager). A MAIN-only root
                precondition (`loginctl enable-linger <owner>`, privileged, performed through the declared MAIN
                runner) only if a later slice runs owner jobs outside an SSH session.
            # INITIAL CONTACT (codex 143844 RH-TARGET-FIRST-STAGING). Everything target_bootstrap.yml asserts before this
            # point is a PRE-CONTACT DECLARATION CHECK (inventory values, derived remote temp, scope binding; nothing on
            # the target is observed). The first contact is `ansible.builtin.raw` ONLY (no module staging, no remote
            # temp created), read-only, running exactly these os_tools by their declared paths:
            #   1 identity: the declared sha256sum answers its known answer (os_tool_identity) and reports the digest of
            #     every tool below; the controller compares each with os_tools.<tool>.identity (a digest reported by the
            #     tool under test -- the KAT is the complement; the INDEPENDENT stat-module re-hash of every selected
            #     executable follows once the staging boundary below is admitted);
            #   2 staging boundary: every component of the bundle dir, the root and <target work root>/<sub_roots.tmp>/
            #     <remote_tmp_rel> (the module temp), the work root's fs type, free bytes and inodes. Admitted on the
            #     controller by path_admission.ancestry (group-writable only through owner_private_group, facts over
            #     raw + decision by the controller program), work_roots.admission, and the module temp chain
            #     (absent, or an owned real dir, not group/other-writable, same device as the work root);
            #   3 owner_private_group facts for each owner-owned group-writable component (private_group_program.j2 facts).
            # Only after all three are admitted does the first module (stat) stage anything under the module temp.
            initial_contact:
              channel: raw
              tools: [sh, sha256sum, id, stat, df, sed, cat, getent, getfacl]   # raw commands run as `<sh> -c <generated>`
