                    matches_declared: matches_declared
                    chain: chain
                    absent: absent
                    candidate_override: candidate_override
                    candidate_sources: candidate_sources
                    findings: findings
                    evidence: evidence
                    selected: selected
                    digested: digested
                    missing_required: missing_required
                    missing_selected: missing_selected
                    required_complete: required_complete
                    error: error
                    refusals: refusals
                    refusal: refusal
                    task: task
                    detail: detail
                    complete: complete
                    custody: custody
                    claim: claim
                    adoption: adoption
