              record_schema: lme-target-prereq-preflight/v2
              listener_sources: [/proc/net/tcp, /proc/net/tcp6]
            # PRESERVATION (codex-tick360 rules 1-5). Inventory DECLARES the selection (members + expected state per member,
            # or verified_none) as desired lab configuration; the read-only preflight OBSERVES all selected units and their
            # current states and evaluates each member against ITS expected state. The scope is never derived by filtering on
            # observed state. Applies to EVERY member of inventory.target_group (a hypervisor does not imply a prior stack; a
            # non-hypervisor may carry one). Only MAIN runs the privileged observation.
            preservation:
              refusal: RH-TARGET-PREREQ-PRESERVATION
              applies_to: every_target_group_member
              unit_regex: '^[A-Za-z0-9@_.:-]+[.]service$'      # == the registry pattern service_name (global.yml :1094)
              # BASIS vocabulary (explicit; no default; rule 3). Exactly one per member; anything else refuses before contact
              # in target_prereq.yml (prereq_observe.yml also admits `undeclared`: it records matches and evaluates nothing).
              bases:
                known_set:
                  means: the member units are KNOWN (prior deployment declarations / preservation records); each has an expected state
                  evidence: at least one member role (expected_states.<state>.role) is bound; the verified_none role is absent
                  absence: an absent member REFUSES (outcome absent); observation never shrinks the declared set
                verified_none:
                  means: verified no prior deployment on this member
                  role: prereq_verified_no_prior_deployment    # bool target input; must be true when present (false refuses)
                  requires: [the discovery selector role is bound (non-empty), no member role is bound]
                  check: any LISTED unit matching the discovery selectors is PROBED and REFUSES unless its probe LoadState is in absent_status AND its probe ActiveState is in absent_states (probe_unknown refuses)
              # EXPECTED-STATE vocabulary (per member; rule 1). One string_list target-input role per state (no new pattern:
              # both roles use the registered service_name pattern). A unit named in two roles refuses (conflicting basis).
              expected_states:
                inactive_not_enabled:
                  role: prereq_preserved_units                 # existing role (var lme_lab_preserved_units)
                  present: required
                  # codex-tick375-377 SERVICE-FACTS-BAD-STATES-MASKING: decided from the PROBE fields, never from service_facts
                  # state/status (these three REPLACE refused_states [running] / refused_status [enabled, enabled-runtime]).
                  load_states: [loaded]                        # a preserved unit keeps its unit file (masked/error/... -> load_refused)
                  active_states: [inactive]                    # failed -> outcome failed; probe.running_states -> outcome running
                  # UnitFileState admitted; every other enum value -> outcome enabled (enabled, enabled-runtime, linked,
                  # linked-runtime, alias, indirect, transient, masked, masked-runtime, bad, ''). TIGHTENED over r3 (linked /
                  # indirect / alias / transient now refuse); `generated` (podman quadlet) stays ADMITTED despite possible
                  # autostart through generator wants links -- the existing limit, until ownership/lifecycle evidence is joined;
                  # `static` stays admitted (no [Install]; started only as a dependency).
                  unit_file_states: [disabled, static, generated]
                retired_absent:
                  role: prereq_retired_units                   # NEW role (C1 join TP4-ROLE-RETIRED)
                  present: refused                             # present again = an interrupted / reverted retirement
              absent_status: [not-found]                       # PROBE LoadState of a unit without a unit file (value unchanged)
              # ABSENT (codex-tick370 PREREQ-RUNNING-NOTFOUND-ABSENCE; codex-tick375-377 TP4-ACTIVESTATE-PROBE) == probe LoadState in
              # absent_status AND probe ActiveState in absent_states, and service_facts does not list the unit in
              # probe.service_facts_running_states. Any other ActiveState with an absent_status LoadState is outcome
              # loaded_without_unit_file (refuses, route recorded) for every basis. service_facts alone never proves absence
              # (it reports a not-found unit only as running / stopped, and keeps failed / masked / not-found over the real
              # UnitFileState).
              absent_states: [inactive]                        # probe ActiveState (value unchanged)
              # the declared read-only EXACT-UNIT PROBE (TP4-ACTIVESTATE-PROBE, approved codex-tick375-377). Scope: every declared
              # member (inactive_not_enabled AND retired_absent, listed or not) and, on a verified_none member, every discovery
              # match; nothing on basis undeclared. ok == rc 0 AND every field exactly once AND no other line AND every value in
              # its enum; anything else (incl. a tool not admitted, a name outside unit_regex, a skipped item, service_facts
              # listing it running while ActiveState is not in running_states) is outcome probe_unknown -- REFUSED by
              # target_prereq.yml before any effect, RECORDED (findings, never enforced) by prereq_observe.yml.
              # C1 hunk 4: the tool NAMES the os_tools entry (contract: within os_tools, NO required_by condition). Its
              # privileged admission (initial_contact.privileged.tools / executed_after_custody, os_tools.systemctl.required_by
              # += target_prereq, graph's per-host identity) is the route join TP4-PROBE-TOOL, NOT landed here: until it is,
              # every probe item is skipped and every probed unit is probe_unknown (fail-closed).
              probe:
                tool: systemctl                                # os_tools ROLE (path + identity from os_tools; admission = join TP4-PROBE-TOOL)
                argv: ['{tool}', show, '--property={properties}', --no-pager, '--', '{unit}']   # {tool} admitted path; {properties} fields joined by ','; {unit} ONE exact name
                fields: [LoadState, ActiveState, SubState, UnitFileState]
                enums:                                         # closed typed domains (systemd unit / service vocabulary); outside -> probe_unknown
                  LoadState: [stub, loaded, not-found, bad-setting, error, merged, masked]
                  ActiveState: [active, reloading, inactive, failed, activating, deactivating, maintenance, refreshing]
                  SubState: [dead, condition, start-pre, start, start-post, running, exited, reload, reload-signal, reload-notify,
                             stop, stop-watchdog, stop-sigterm, stop-sigkill, stop-post, final-watchdog, final-sigterm,
                             final-sigkill, failed, dead-before-auto-restart, failed-before-auto-restart, dead-resources-pinned,
                             auto-restart, auto-restart-queued, cleaning]
                  UnitFileState: [enabled, enabled-runtime, linked, linked-runtime, alias, masked, masked-runtime, static, indirect,
                                  disabled, generated, transient, bad, '']   # '' == no unit file (a not-found unit)
                running_states: [active, reloading, activating, deactivating, maintenance, refreshing]   # ActiveState -> outcome running
                service_facts_running_states: [running]        # discovery state that contradicts a non-running probe -> probe_unknown
                stderr_max: 500                                # retained stderr characters per probe
              # outcome -> route (rule 5). The preflight RECORDS the outcome and the route and refuses; it never starts, stops,
              # enables, disables or masks a unit, and never touches a unit outside the declared selection.
              routes:
                as_expected: null
                absent:
                  mechanism: null
                  action: >-
                    MAIN reconciles the preservation record (an interrupted retirement is declared retired_absent only on
                    retirement evidence; evidence loss is reported). The known set is never shrunk by observation.
                # running / enabled / present_after_retirement: ONE route (the proposal's &retire anchor, written out)
                running:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove                    # reclaim.decl.yml :74-78 (exact removal of ONE owned native service)
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                enabled:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                present_after_retirement:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                # listed, absent_status, state not in absent_states (every basis) -- the same &retire route, written out
                loaded_without_unit_file:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                # inactive_not_enabled member with probe ActiveState failed (codex-tick375-377) -- the same &retire route, written out
                failed:
                  mechanism: testing/e2e/reclaim/reclaim.yml
                  op: native_service_remove
                  service_var: lme_reclaim_service
                  status: obstructed
                  obstruction: >-
                    reclaim acts only on units named in the target's NATIVE OWNERSHIP LEDGER (/var/lib/lme-owned/ledger.json,
                    reclaim.decl.yml :109-124); ops.native_service_remove.absent_ledger.native is refuse (:78) and the ledger
                    producer is the open join JOIN-NATIVE-LEDGER-PRODUCER (:174). The pre-observability development stack is in
                    no ledger, so no owned retirement authority exists for it today; the legacy blanket wipe
                    (scripts/wipe_lme.sh via deploy_gate.sh do_wipe) is quarantined by reclaim.decl.yml (:7-12, :152-168) and is
                    never a route.
                load_refused:                                  # inactive_not_enabled member with LoadState outside load_states (masked, error, ...)
                  mechanism: null
                  action: MAIN reconciles the declaration against the probe record (a masked / broken unit is never adopted or repaired here).
                probe_unknown:                                 # probe not ok / disagreeing (codex-tick375-377)
                  mechanism: null
                  action: >-
                    MAIN resolves the probe obstruction recorded per unit (tool admission TP4-PROBE-TOOL, rc, missing field,
                    enum value) through the declared observation; never an ad hoc systemctl run, never adoption or absence by default.
              # DISCOVERY (rule 2): a declared bounded selector where names are not recorded. Matches outside the member set
              # are RECORDED (unclassified). Observation alone grants no ownership or retirement authority.
              discovery:
                selector_role: obs_unit_patterns               # existing role (var lme_obs_unit_patterns, pattern unit_glob)
                selector_regex: '^[A-Za-z0-9@_.:*-]+$'         # == the registry pattern unit_glob (global.yml :1065)
                glob_to_regex: '"^" ~ (glob | regex_escape | replace("\*", ".*")) ~ "$"'   # the one translation (prereq_preflight.yml)
                source: ansible.builtin.service_facts
                limit: >-
                  service_facts lists SYSTEM .service units only (loaded units and unit files). .path / .timer / .socket
                  units (e.g. lme-llama-model.path) and user-manager units are NOT seen; the route's observe.yml O-PRIOR-STATE
                  job (system-units / user-units) covers those as recorded evidence. A clean RERUN (cases DR07 / PF14) stays
                  positive only because the new stack's units are owner (user-manager) units: a SYSTEM unit named by a
                  selector (lme-*) that runs refuses as an unclassified running match. service_facts only DISCOVERS; every
                  declared expectation and every absence is decided from the exact-unit probe (preservation.probe).
                  inactive_not_enabled admits UnitFileState disabled / static / generated: a podman-quadlet unit reports
