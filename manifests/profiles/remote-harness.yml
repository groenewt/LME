              transfer_controls: transfer-controls
              loader_integration: loader-integration
              acceptance: acceptance
              transfer_check: transfer-check
              loader_cases: loader-cases  # C1 loader-case suite (testing/loader-tests-r4/run_loader_tests.yml reads this key)
              private_group_fixtures: private-group-fixtures   # route: owner-private-group synthetic fixtures (E51)
            # WORKSPACE ANCHOR (codex 143844 RH-WORKSPACE-ANCHOR). `run` / `run-local` never take W as dirname(R):
            #   W = the prefix of R through its LAST `/<root_rel>/` component (R must contain one), <checkout> = W's
            #   parent; `run-local` additionally requires R == W/<sub_roots.toolchain> exactly (`run` admits any root
            #   under W, e.g. G's throwaway roots under W/<sub_roots.run>/...). Before any write or exec the seed binds
            #   that checkout to the bundle it was packaged from: the bundle manifest (bundle.json, next to the seed,
