          # G-M3-CONFIG-ENVELOPE): the ONE canonical serialized record of the resolved configuration a cell runs under, and
          # the ONE admission contract its consumers (G cell_binding, the gate) apply. The producer writes it once, owned,
          # file_mode, at <work root>/<run_env[location.env] dir>/<cell><location.file_suffix> (the dir is a run_env row:
          # created by the seed before exec). Record = a mapping with EXACTLY the fields values as keys. Admission, in
          # order, before any probe: (1) the record bytes digest (record_digest.algorithm over the exact bytes) equals the
          # digest the consumer was handed; (2) the document is a mapping with exactly the declared keys; (3) schema_version
          # is an integer in supported_versions (else texts.version); (4) configuration and origins are mappings, never null
          # or a scalar, and configuration passes filters.verify (else texts.configuration) -- a matching digest of
          # malformed content is refused; (5) filters.revision over configuration and profile equals configuration_revision
          # (else texts.identity); (6) producer is a member of producers, cell / source_commit / source_tree equal the
          # bound run (else texts.producer / texts.binding). The admitted configuration identity is
          # fields.configuration_revision, which the result receipt carries (receipt_field).
