                  sh: {path: /usr/bin/dash, package: dash, source: base_image, identity: {kind: unmeasured, sha256: UNMEASURED}}
                  env: {path: /usr/bin/env, package: coreutils, source: base_image, identity: {kind: unmeasured, sha256: UNMEASURED}}
                  git: {path: /usr/bin/git, package: git, source: preparation_package, identity: {kind: unmeasured, sha256: UNMEASURED}}
                  sha256sum: {path: /usr/bin/sha256sum, package: coreutils, source: base_image, identity: {kind: unmeasured, sha256: UNMEASURED}}
                  getent: {path: /usr/bin/getent, package: libc_tools, source: base_image, identity: {kind: unmeasured, sha256: UNMEASURED}}
                  stat: {path: /usr/bin/stat, package: coreutils, source: base_image, identity: {kind: unmeasured, sha256: UNMEASURED}}
