            # names the seed `run` binds from the work root (sub_root + relative dir); the per-run temp names
            # (TMPDIR, ANSIBLE_LOCAL_TEMP, ANSIBLE_HOME, ANSIBLE_GALAXY_CACHE_DIR) stay in the run dir (managed_env).
