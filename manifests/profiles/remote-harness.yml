                interface: 'the rendered producer interface was overridden, or differs from the resolved declaration it was rendered from'
                input: 'the anchor input is absent, not exactly the declared record keys, or names another declaration rel, path, delegate or edition grammar than the rendered interface; or the selection input is absent or not a declared flow word'
                builder: 'the running builder is not the managed generation of the shared recipe (core, ansible-playbook python, executable, its first line, a pre-supplied interpreter, or the verified receipt)'
