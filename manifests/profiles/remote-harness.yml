                      # key's delegated_controller rule word (aligned: required_equal_controller_tmpdir ->
                      # pinned_required_equal_controller_tmpdir). Consumers read the rule through the map, never a literal.
                      remote_tmp_launch: run_local
                      remote_tmp: pinned_required_equal_controller_tmpdir
