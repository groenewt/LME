            # states the exact key set of its words and of its fields; complete_only the record keys absent before the staged
            # reader and constructed at the complete stage; protected the record keys the entry adds from N2. Admitted with this
            # digest-bound declaration at admitted_at (N2 digest-before-parse) and read by every later consumer: N2 at
            # identity_and_tools, the entry rows at executable_closure, resolve_policy and the N11 render at the complete stage.
