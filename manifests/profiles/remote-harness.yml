                  format: 'step_record.format, exactly'
                  stage: 'launch.stages key'
                  act: 'launch.stage_root.act: this launch''s act identity (act.regex; its exclusive stage root and evidence dir name)'
                  stage_root: 'absolute: <work root>/<sub_roots.tmp>/<stage_root.rel>/<stage>/<act>'
                  argv: 'the exact exec vector, as a list (after placeholder substitution)'
                  cwd: 'absolute'
                  env: {declaration: controller.bootstrap.genesis.launch.env, pairs: 'the exact NAME=value list passed to env -i, in order'}
                  source: {checkout: 'absolute', commit: 'git HEAD', tree: 'git HEAD^{tree}', status: 'porcelain output (empty = clean)'}
                  flow: 'genesis.entry.selection.flows word of the selected plan (genesis final; one value per entry run); the cold G01 occurrence, a step of no plan, carries the word of its declared key genesis.s1_result.flow'
                  # lme-genesis-step/3 (B N-GEN-STEP-CONFIG folded): the step's inventory kind and its ORDERED files, each with
