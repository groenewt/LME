---
# manifests/profiles/offline.yml -- air-gapped install profile (value overlay).
#
# The real offline mechanism is TAR-BASED, not a registry mirror: prepare_offline.sh
# saves each upstream image to a tar + an image_manifest.tsv, and on the target
# offline_mode=true makes container_setup.yml skip every `podman pull`/`podman build`
# and instead `podman load` + retag from the tars. The rendered units are therefore
# IDENTICAL online vs offline (they reference the stable localhost/<name>:LME_LATEST
# local ref, never the upstream pull source). This overlay does NOT invent a mirror.
#
# What it forces (compute_effective_flags): offline_mode on, and the air-gapped
# fleet distribution path on. The fleet-distribution unit already self-gates on
# ConditionPathExists=/opt/lme/OFFLINE_MODE; setting offline_mode here makes the
# install lay that sentinel down and configure Kibana's registry for air-gap.
profile_overlay:
  lme_global:
    # Keep upstream pull refs as-is (documentation of provenance); offline load
    # uses the tar manifest, not these, so no mirror swap is fabricated here.
    images: {}
  services: {}
  vars:
    offline_mode: true
    # Elastic-services beats are NOT included in the offline bundle upstream; an
    # air-gapped install runs core + (optionally) llm only unless the operator
    # stages those tars themselves.
    install_elastic_services: false
