---
# manifests/profiles/cluster.yml -- multi-node Elasticsearch profile (value overlay).
#
# Proves two G1 mechanisms on the elasticsearch service:
#   * B1: cgroup memory caps + JVM heap are rendered UNCONDITIONALLY. The current
#     lme-elasticsearch.container.j2 gates both behind single-node, so a cluster
#     data node currently renders with NO MemoryHigh/MemoryMax and NO -Xms/-Xmx
#     (it can OOM the host and its heap floats). Under this profile the derived
#     caps and heap appear -- that is the intended B1 behaviour change.
#   * per-node heap/memory sizing: resources.heap is overridable; MemoryHigh and
#     MemoryMax derive from it (8g -> 12G / 16G via mem_derive).
#   * the transport port (9300) is published in addition to http (9200).
#
# Discovery mode-switch: setting environment.discovery.type to null drops the key
# from the render (container.j2 skips null env values), because recursive combine
# cannot delete a key but CAN replace its scalar with null. So a cluster node
# renders WITHOUT discovery.type=single-node. The per-node cluster discovery
# keys (node.name, discovery.seed_hosts, cluster.initial_master_nodes,
# network.publish_host) are per-node/per-deployment, NOT static profile values,
# so they live in host_vars and combine LAST via lme_service_overrides -- see the
# documented skeleton in ansible/inventory/host_vars/es{1,2,3}.yml.
profile_overlay:
  lme_global: {}
  services:
    elasticsearch:
      # combine(recursive=True) REPLACES lists, so the FULL port list is given.
      publish_ports:
        - {host: 9200, container: 9200}
        - {host: 9300, container: 9300}
      environment:
        discovery.type: null       # dropped from render (no single-node in a cluster)
      resources:
        heap: 8g
        jvm_base: "-Des.entitlements.enabled=false"
        memory_high_factor: 1.5
        memory_max_factor: 2
  vars:
    es_discovery: cluster
