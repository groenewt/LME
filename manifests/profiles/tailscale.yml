---
# manifests/profiles/tailscale.yml -- tailnet-fronted profile (value overlay).
#
# When the stack sits behind tailscale, host-published UI/API ports must NOT be
# reachable on the LAN: they bind to loopback and the opt-in tailscale ingress
# (tailscale_ingress.yml) fronts them on the tailnet. Container->container
# traffic is unaffected (it uses the `lme` podman network alias, independent of
# the host publish bind). This overlay flips the loopback binds and turns the
# ingress on.
#
# combine(recursive=True) REPLACES lists, so each overridden service supplies its
# COMPLETE publish_ports list with bind:127.0.0.1 added. Services not listed keep
# their global bind (logstash's raw beats/http ports are already loopback in
# global.yml).
profile_overlay:
  lme_global: {}
  services:
    kibana:
      publish_ports:
        - {host: 5601, container: 5601, bind: 127.0.0.1, tailnet_serve: true}   # VIP front port (marker; K1)
        - {host: 443,  container: 5601, bind: 127.0.0.1}
    dashboard:
      publish_ports:
        - {host: 8502, container: 8502, bind: 127.0.0.1}
    log-analyzer:
      publish_ports:
        - {host: 8501, container: 8501, bind: 127.0.0.1}
    # litellm is intentionally NOT overridden here. Its base manifest (lme-litellm.yml)
    # already binds 4000 -> 127.0.0.1 AND carries the `tailnet_ingress: https` host-ingress
    # marker. combine(recursive=True) list-REPLACES, so re-declaring litellm here WITHOUT the
    # marker would CLOBBER it and silently drop litellm's tailnet ingress (a regression vs the
    # old hardcoded list). The base loopback bind already matches this profile, so omitting it
    # loses nothing and lets the marked base entry compose. (kibana/dashboard/log-analyzer stay
    # above: kibana needs the overlay to carry its 2-port list + the 5601 `tailnet_serve` mark.)
  vars:
    # Gate names the include READERS actually consult (elastic_services_setup.yml
    # reads tailscale_serve_ingress; main.yml reads tailscale_serve_egress and
    # tailscale_serve_services). The old `tailscale_ingress` matched no reader.
    tailscale_serve_ingress: true
    tailscale_serve_egress: true
    tailscale_serve_services: true
    # R6 arm-point (topology.md:58). The tailnet policy now DEFINES + auto-approves
    # the four svc:lme-* names (autoApprovers.services -> tag:machine-graph et al),
    # so the post-publish CapMap liveness assert can move from default-warn to
    # fail-loud: a silent-dead VIP now HARD-FAILS the deploy instead of WARN-passing.
    # This is the one proof that the SVC leg actually composed (R5). Do NOT arm this
    # on a tailnet whose policy has not yet defined the names -- it would hard-fail
    # every deploy (that is why it defaults false and is armed here, per-profile).
    tailscale_require_vip_live: true
