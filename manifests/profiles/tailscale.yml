---
# manifests/profiles/tailscale.yml -- tailnet-fronted profile (value overlay).
#
# When the stack sits behind tailscale, host-published UI/API ports must NOT be
# reachable on the LAN: they bind to loopback and the opt-in tailscale ingress
# (tailscale_ingress.yml) fronts them on the tailnet. Container->container
# traffic is unaffected (it uses the `lme` podman network alias, independent of
# the host publish bind). This overlay flips the loopback binds and turns the
# ingress on.
#
# combine(recursive=True) REPLACES lists, so each overridden service supplies its
# COMPLETE publish_ports list with bind:127.0.0.1 added. Services not listed keep
# their global bind (logstash's raw beats/http ports are already loopback in
# global.yml).
profile_overlay:
  lme_global: {}
  services:
    kibana:
      publish_ports:
        - {host: 5601, container: 5601, bind: 127.0.0.1}
        - {host: 443,  container: 5601, bind: 127.0.0.1}
    dashboard:
      publish_ports:
        - {host: 8502, container: 8502, bind: 127.0.0.1}
    log-analyzer:
      publish_ports:
        - {host: 8501, container: 8501, bind: 127.0.0.1}
    litellm:
      publish_ports:
        - {host: 4000, container: 4000, bind: 127.0.0.1}
  vars:
    # Gate names the include READERS actually consult (elastic_services_setup.yml
    # reads tailscale_serve_ingress; main.yml reads tailscale_serve_egress and
    # tailscale_serve_services). The old `tailscale_ingress` matched no reader.
    tailscale_serve_ingress: true
    tailscale_serve_egress: true
    tailscale_serve_services: true
