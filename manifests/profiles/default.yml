---
# manifests/profiles/default.yml -- the baseline profile (single-node, all-in-one).
#
# Profiles are VALUE OVERLAYS, not host descriptions. They are merged over
# global.yml + the per-service manifests at load time (see load_manifests.yml):
#   * profile_overlay.lme_global  -> combine()'d into lme_global
#   * profile_overlay.services.<k> -> combine()'d into lme_services[<k>]
#   * profile_overlay.vars        -> set as plain facts (feed is_enabled / tasks)
#
# The default profile changes nothing: the service manifests already encode the
# single-node baseline, so every overlay here is empty. It exists so the load
# path is uniform (there is always an active profile) and so operators have an
# obvious file to copy when authoring a new profile.
profile_overlay:
  lme_global: {}
  services: {}
  vars:
    es_discovery: single-node
