---
# manifests/profiles/default.yml -- the baseline profile (single-node, all-in-one).
#
# Profiles are VALUE OVERLAYS, not host descriptions. They are merged over
# global.yml + the per-service manifests at load time (see load_manifests.yml):
#   * profile_overlay.lme_global  -> combine()'d into lme_global
#   * profile_overlay.services.<k> -> combine()'d into lme_services[<k>]
#   * profile_overlay.vars        -> set as plain facts (feed is_enabled / tasks)
#
# The default profile changes nothing: the service manifests already encode the
# single-node baseline, so every overlay here is empty. It exists so the load
# path is uniform (there is always an active profile) and so operators have an
# obvious file to copy when authoring a new profile.
#
# NETWORK POSTURE = CLOSED (default). Every host-published port binds to 127.0.0.1
# (see manifests/global.yml + each service manifest), so a fresh single-node install
# exposes NOTHING on the LAN. This default profile keeps that: it opts NO service
# back open.
#
# LAN OPT-IN MECHANISM: to expose a service off-box, a profile re-declares that
# service's COMPLETE publish_ports list (combine(recursive=True) REPLACES lists,
# never merges them) with bind:0.0.0.0 on the specific entry to open. "Open" is
# always a PRESENT bind:0.0.0.0, never an absent bind -- so an audit can grep for
# bind:0.0.0.0 to find every LAN-exposed port. Example, to expose Kibana:
#
#   profile_overlay:
#     services:
#       kibana:
#         publish_ports:
#           - {host: 5601, container: 5601, bind: 0.0.0.0}   # LAN opt-in
#           - {host: 443,  container: 5601, bind: 0.0.0.0}   # LAN opt-in
#
# See cluster.yml for a live example (it opens ONLY the ES transport port, 9300).
profile_overlay:
  lme_global: {}
  services: {}
  vars:
    es_discovery: single-node
