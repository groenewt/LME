---
# LLM API-key watcher -- kind: path_service. Exemplar for the path_service kind:
# ONE manifest renders a PAIR of units to /etc/systemd/system:
#   lme-llm-keys.path     (watches a trigger file)
#   lme-llm-keys.service  (oneshot run when the trigger changes)
# Gated with the litellm stack (enabled_when:[install_llm]). Fidelity targets =
# systemd/lme-llm-keys.path and systemd/lme-llm-keys.service (byte-identical).
id: llm-keys
name: lme-llm-keys
kind: path_service
enabled_when: [install_llm]

path:
  description: Watch for LLM API key changes
  path_modified: /opt/lme/config/.llm-keys-updated
  wanted_by: [multi-user.target]

service:
  description: Sync LLM API keys and restart LiteLLM
  after: [litellm]                       # -> After=lme-litellm.service
  type: oneshot
  exec_start: /usr/bin/python3 /opt/lme/scripts/sync_llm_keys.py
  environment:
    LLM_KEYS_PATH: /opt/lme/config/llm_keys.enc
    VAULT_PASS_FILE: /etc/lme/pass.sh
