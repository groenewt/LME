---
# pgvector -- kind: container. PostgreSQL + pgvector, the LiteLLM vector store.
# Gated with the LLM stack (enabled_when:[install_llm]); not rendered when the
# stack is off. Fidelity target = static quadlet/lme-pgvector.container (the only
# expected diff is directive REORDER within sections -- quadlet ignores order).
#
# NOTE (cross-group): this container initializes POSTGRES_DB=lme_vectors only.
# LiteLLM expects a SEPARATE `litellm` database (its PGVECTOR_DB=litellm); that db
# is created out-of-band by ansible/roles/podman/tasks/llama_cpp_setup.yml:203-204
# (`podman exec lme-pgvector psql -U lme -d lme_vectors -c "CREATE DATABASE litellm"`),
# which runs only under install_llm -- i.e. THIS single-node POC store owns BOTH
# lme_vectors AND litellm in the POC deployment.
#
# DATA-INTEGRITY HAZARD (dual authority): the HA platform
# (scripts/postgresql_platform + ansible/roles/postgresql_platform, profiles
# dual-owned-ha/shared-ha) places lme_vectors AND litellm under the `vector` (or
# `shared`) domain, fronted by proxy alias pg-vector-rw -- a SECOND authoritative
# home for the SAME two databases. They must NEVER both be authoritative at once.
# Today they cannot coexist: load_manifests.yml hard-asserts lme_database_profile
# is empty, and the postgresql_platform role has no site.yml invoker (its only
# caller, lme_lab, is quarantined). enabled_when:[install_llm] is therefore a SAFE
# sole gate ONLY while that failure boundary stands. When the HA database profile
# becomes an integrated selector, this gate MUST also require "no HA domain owns
# lme_vectors" (is_enabled is AND-only / no negation -> C1 must add a DERIVED
# positive flag). See the ACTIVATION MUTUAL-EXCLUSION CONTRACT REQUEST to C1
# (D3a). Do NOT leave [install_llm] as the sole gate once HA is wired.
id: pgvector
name: lme-pgvector
kind: container
enabled_when: [install_llm]
image: pgvector
description: pgvector - PostgreSQL with vector similarity search

dependencies:
  requires: [network]
  after: [network]
  partof: [lme]
install:
  wanted_by: [default.target, lme]

behavior:
  restart: always
  restart_sec: 5
  timeout_start_sec: 90
  start_limit_interval: 120
  start_limit_burst: 10
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

environment:
  POSTGRES_DB: lme_vectors
  POSTGRES_USER: lme

secrets:
  - {name: pgvector, type: env, target: POSTGRES_PASSWORD}

# SF-8 co-residency cap (non-JVM: direct memory_high/memory_max). Postgres pg17 +
# pgvector as LiteLLM's vector store: modest default shared_buffers/work_mem; 1G soft
# / 2G hard covers the litellm logging + vector workload on a single node.
resources:
  memory_high: 1G
  memory_max: 2G

network_aliases: [lme-pgvector]
publish_ports:
  - {host: 5432, container: 5432, bind: 127.0.0.1}   # default-closed; consumers reach it over the podman alias
volumes:
  - {source: lme_pgvectordata, dest: /var/lib/postgresql/data, options: [z]}

health:
  cmd: pg_isready -U lme -d lme_vectors
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s
