---
# The podman network -- kind: network. Exemplar for the network kind.
# Renders to lme.network (NOT lme-network.network): the `name` field is the
# authoritative unit basename, so the special network/target names stay exact.
# All [Network] values come from lme_global.network. Fidelity target =
# quadlet/lme.network (cosmetic-only: trailing space after `[Unit]`).
id: network
name: lme                   # renders lme.network (NOT lme-network.network)
kind: network
enabled_when: [always]

dependencies:
  partof: [lme]
  after: [lme]
