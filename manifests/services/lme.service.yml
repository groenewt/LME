---
# The umbrella orchestrator -- kind: target (a oneshot .service, not a .target
# unit type, but the "target" role in the dependency graph: everything is
# PartOf=lme.service / WantedBy=lme.service). Renders to /etc/systemd/system/lme.service.
# Fidelity target = quadlet/lme.service (the descriptive `#` comment lines are
# dropped -- cosmetic; systemd behaviour is identical).
id: lme
name: lme                   # renders /etc/systemd/system/lme.service
kind: target
enabled_when: [always]

description: LME service orchestrator runs all the service files
install:
  wanted_by: [default.target]
service:
  type: oneshot
  exec_start: /bin/true
  remain_after_exit: true
