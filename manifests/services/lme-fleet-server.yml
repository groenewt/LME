---
# Fleet Server (elastic-agent) -- kind: container. B4 per-service cert consumer.
#
# Fidelity target = quadlet/lme-fleet-server.container with exactly these INTENDED
# changes:
#   * B4: `lme_certs:/certs:ro,idmap` -> the per-service bundle `cert:fleet-server`
#     (-> /opt/lme/certs/fleet-server) at /certs, read-only, NO idmap. Fleet reads
#     /certs/ca/ca.crt and /certs/fleet-server/*, all provided by the bundle;
#     ca.key is no longer mounted anywhere.
#   * the whitespace-joined `Environment=` line becomes one Environment= per key.
# Health is intentionally ABSENT: the static unit's HealthCmd/Notify are commented
# out (`#TODO: fix this...`), i.e. not real.
id: fleet-server
name: lme-fleet-server
kind: container
enabled_when: [always]
image: elastic-agent
description: Fleet Container Service

dependencies:
  requires: [elasticsearch]
  after: [elasticsearch, kibana]
  partof: [lme]
  condition_path_exists: [/opt/lme/FLEET_SETUP_FINISHED]
install:
  wanted_by: [default.target, lme]

behavior:
  restart: always
  restart_sec: 5
  timeout_start_sec: 5400
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

environment:
  FLEET_SERVER_POLICY_ID: fleet-server-policy
  KIBANA_HOST: https://lme-kibana:5601
  FLEET_URL: https://lme-fleet-server:8220
  FLEET_SERVER_ELASTICSEARCH_HOST: https://lme-elasticsearch:9200
  FLEET_CA: /certs/ca/ca.crt
  FLEET_SERVER_CERT: /certs/fleet-server/fleet-server.crt
  FLEET_SERVER_CERT_KEY: /certs/fleet-server/fleet-server.key
  FLEET_SERVER_ELASTICSEARCH_CA: /certs/ca/ca.crt
  KIBANA_FLEET_CA: /certs/ca/ca.crt
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
  ELASTICSEARCH_HOST: https://lme-elasticsearch:9200
  ELASTICSEARCH_HOSTS: https://lme-elasticsearch:9200
  ES_HOSTS: https://lme-elasticsearch:9200
  ELASTIC_AGENT_ELASTICSEARCH_HOST: https://lme-elasticsearch:9200

secrets:
  - {name: elastic, type: env, target: KIBANA_FLEET_PASSWORD}
environment_files: [/opt/lme/lme-environment.env]

hostname: lme-fleet-server
network_aliases: [lme-fleet-server]
podman_args: ["--requires 'lme-elasticsearch,lme-kibana'"]
publish_ports:
  - {host: 8220, container: 8220}

volumes:
  - {source: "cert:fleet-server", dest: /certs, options: [ro, Z]}   # B4 bundle (was lme_certs:/certs:ro,idmap); Z=SELinux relabel
  - {source: lme_fleet_data, dest: /usr/share/elastic-agent}
# B4 cert-owner metadata (G5 chown input; emits nothing into the unit).
certs:
  slot: fleet-server
  in_container_uid: 0        # elastic-agent runs as root inside its pinned userns; owner = 171632 (UNVERIFIED image uid -- G5 to confirm)
  needs_ca: true

userns:
  mode: auto
  slot: fleet-server         # base 171632, size 3048
