---
# setup-accts -- kind: container. The account-init oneshot (Type=oneshot,
# RemainAfterExit=yes). Runs acct-init.sh to create ES/Kibana accounts. It shares
# elasticsearch's user namespace (UserNS=container:lme-elasticsearch) so it can
# write into the lme_certs workspace with matching ownership.
#
# Fidelity target = quadlet/lme-setup-accts.container, MINUS appended annotations.
# (The unit's leading comment mislabels it; ContainerName is lme-setup-accts.)
#
# PROPOSED-SANCTIONED lme_certs exception: the task explicitly sanctions ONLY
# setup-certs keeping lme_certs. setup-accts also keeps it (setup/generation
# context: it writes accounts into the workspace under ES's shared userns, it is
# not a long-running runtime consumer). Flagged for the orchestrator (see report).
#
# NOTE (suspected latent bug, PRESERVED faithfully): every sibling unit has
# `WantedBy=default.target lme.service`; this one has ONLY `default.target`
# despite `PartOf=lme.service`. Not on the fix list -> reproduced exactly; routed
# to the orchestrator rather than silently "fixed".
id: setup-accts
name: lme-setup-accts
kind: container
enabled_when: [always]
image: elasticsearch

dependencies:
  requires: [network, setup-certs, elasticsearch]
  after: [network, setup-certs, elasticsearch]
  partof: [lme]
install:
  wanted_by: [default.target]   # faithful: NO lme.service here (see NOTE above)

behavior:
  type: oneshot
  remain_after_exit: true
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

secrets:
  - {name: elastic, type: env, target: ELASTIC_PASSWORD}
  - {name: kibana_system, type: env, target: KIBANA_PASSWORD}
environment_files: [/opt/lme/lme-environment.env]

exec: /bin/bash /usr/share/elasticsearch/config/setup/acct-init.sh
network_aliases: [lme-setup]
podman_args: ["--health-interval=2s"]

# PROPOSED-SANCTIONED lme_certs workspace mount (account-setup context).
volumes:
  - {source: lme_certs, dest: /usr/share/elasticsearch/config/certs}
  - {source: /opt/lme/config/setup, dest: /usr/share/elasticsearch/config/setup}

run_as:
  user: "0"
userns:
  mode: share_with
  service: elasticsearch      # renders UserNS=container:lme-elasticsearch
