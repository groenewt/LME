---
# Fleet Distribution (package-registry) -- kind: container. B4 cert consumer.
#
# Fidelity target = quadlet/lme-fleet-distribution.container with exactly this
# INTENDED change:
#   * B4: `lme_certs:/certs:ro,idmap` -> the per-service bundle
#     `cert:fleet-distribution` (-> /opt/lme/certs/fleet-distribution) at /certs,
#     read-only, NO idmap. EPR_TLS_CERT/KEY and the healthcheck's --cacert
#     /certs/ca/ca.crt all resolve inside the bundle.
# This unit has NO UserNS= (runs in the host user namespace as real root), so it is
# the host_userns cert-owner case: owner = in_container_uid (0), no subuid offset.
# The real (non-commented) HealthCmd/Interval/Timeout/Retries are preserved.
id: fleet-distribution
name: lme-fleet-distribution
kind: container
enabled_when: [always]
image: distribution
description: Fleet Distribution Server Container Service

dependencies:
  requires: [elasticsearch, setup-certs]
  after: [elasticsearch, setup-certs]
  partof: [lme]
  condition_path_exists: [/opt/lme/OFFLINE_MODE]
install:
  wanted_by: [default.target, lme]

behavior:
  restart: always
  restart_sec: 5
  timeout_start_sec: 300
  start_limit_interval: 120
  start_limit_burst: 10

environment:
  EPR_ADDRESS: 0.0.0.0:8080
  EPR_TLS_CERT: /certs/fleet-distribution/fleet-distribution.crt
  EPR_TLS_KEY: /certs/fleet-distribution/fleet-distribution.key

hostname: lme-fleet-distribution
network_aliases: [lme-fleet-distribution]
publish_ports:
  - {host: 8080, container: 8080, bind: 127.0.0.1}   # default-closed; Kibana reaches it over the podman alias (xpack.fleet.registryUrl)

volumes:
  - {source: "cert:fleet-distribution", dest: /certs, options: [ro, Z]}   # B4 bundle (was lme_certs:/certs:ro,idmap); Z=SELinux relabel
# B4 cert-owner metadata (G5 chown input; emits nothing into the unit).
certs:
  host_userns: true          # no UserNS= remap -> owner = in_container_uid directly
  in_container_uid: 0        # runs as host root; owner = 0 (UNVERIFIED image uid -- G5 to confirm)
  needs_ca: true

health:
  cmd: "CMD-SHELL curl -f --cacert /certs/ca/ca.crt https://localhost:8080/health || exit 1"
  interval: 30s
  timeout: 10s
  retries: 3
