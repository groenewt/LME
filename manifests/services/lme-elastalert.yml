---
# ElastAlert2 -- kind: container.
#
# Fidelity target = quadlet/lme-elastalert.container with exactly these INTENDED
# changes (FIX #3, two copy-paste artifacts removed):
#   * DROPPED `lme_certs:/etc/wazuh-manager/certs:ro` -- that is WAZUH's cert path
#     pasted into elastalert. ElastAlert's own config.yaml sets
#     `use_ssl: true, verify_certs: false` and there is NO `elastalert` entry in
#     config/setup/instances.yml (no cert is generated for it), so elastalert is
#     NOT a TLS-verifying cert consumer: it mounts NO cert bundle and carries no
#     `certs:` metadata. (Deviation from task text that named `cert:elastalert`;
#     evidence: verify_certs:false + absent instances.yml entry. See report.)
#   * OMITTED health -- the static unit's only HealthCmd is a commented-out KIBANA
#     healthcheck (`#HealthCmd=... https://localhost:5601 ...`), i.e. not real.
#   * the whitespace-joined `Environment=` line becomes one Environment= per key.
# UserNS slot 4 is KEPT (id-mapping, independent of certs). ContainerName /
# HostName / network-alias keep the image's `2` suffix; the unit basename does not.
id: elastalert
name: lme-elastalert
kind: container
enabled_when: [always]
image: elastalert2
description: Elastalert Service
container_name: lme-elastalert2      # explicit: default(name) would drop the '2'

dependencies:
  requires: [elasticsearch]
  after: [elasticsearch]
  partof: [lme]
install:
  wanted_by: [default.target, lme]

behavior:
  restart: always
  restart_sec: 5
  limit_nofile: 655360
  start_limit_interval: 120
  start_limit_burst: 10
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

environment:
  ES_HOST: lme-elasticsearch
  ES_PORT: "9200"
  ES_USERNAME: elastic

secrets:
  - {name: elastic, type: env, target: ES_PASSWORD}
environment_files: [/opt/lme/lme-environment.env]

hostname: elastalert2
network_aliases: [lme-elastalert2]

volumes:
  - {source: lme_elastalert2_logs, dest: /opt/elastalert/logs}
  - {source: /opt/lme/config/elastalert2/rules, dest: /opt/elastalert/rules, options: [ro]}
  - {source: /opt/lme/config/elastalert2/misc, dest: /opt/elastalert/misc, options: [ro]}
  - {source: /opt/lme/config/elastalert2/config.yaml, dest: /opt/elastalert/config.yaml, options: [ro]}
  - {source: /etc/ssl/certs/ca-certificates.crt, dest: /etc/ssl/certs/ca-certificates.crt, options: [ro]}
  # FIX #3: the wazuh cert bundle `lme_certs:/etc/wazuh-manager/certs:ro` is gone.

userns:
  mode: auto
  slot: elastalert           # base 177728, size 3048
