---
# kibanadata -- kind: volume. Kibana's persistent data volume.
# Fidelity target = quadlet/lme-kibanadata.volume (byte-clean already; no
# annotations). The static User=/Group=169584 is the DERIVED kibana owner:
# cert_owner({slot:kibana, in_container_uid:1000}) = 168584 + 1000 = 169584.
id: kibanadata
name: lme-kibanadata         # invariant: name == 'lme-' + id
kind: volume
enabled_when: [always]

volume_name: lme_kibanadata
driver: local
# base(kibana slot 1) = 165536 + 1*3048 = 168584 ; + in_container_uid 1000 = 169584
owner:
  slot: kibana
  in_container_uid: 1000

dependencies:
  partof: [lme]
  after: [lme]
