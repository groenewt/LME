---
# llama-model -- kind: path_service. ONE manifest renders a PAIR of units to
# /etc/systemd/system:
#   lme-llama-model.path     (watches the model-switch trigger file)
#   lme-llama-model.service  (oneshot: switch the local model + restart llama.cpp)
# Gated with the LLM stack (enabled_when:[install_llm]). Same kind as the
# lme-llm-keys exemplar. Fidelity targets = systemd/lme-llama-model.path and
# systemd/lme-llama-model.service (byte-identical modulo blank-line cosmetics).
# NOTE: unlike llm-keys.service, this .service has NO Environment= lines.
id: llama-model
name: lme-llama-model
kind: path_service
enabled_when: [install_llm]

path:
  description: Watch for llama.cpp model switch requests
  path_modified: /opt/lme/config/.llama-model-updated
  wanted_by: [multi-user.target]

service:
  description: Switch llama.cpp local model and restart service
  after: [llama-cpp]                     # -> After=lme-llama-cpp.service
  type: oneshot
  exec_start: /usr/bin/python3 /opt/lme/scripts/switch_llama_model.py
