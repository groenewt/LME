---
# setup-certs -- kind: container. The cert GENERATOR oneshot (Type=oneshot,
# RemainAfterExit=yes). It runs init-setup.sh which creates the CA + every
# per-service key/cert inside the private lme_certs workspace, then publishes the
# per-service bundles to /opt/lme/certs/<svc> (G5).
#
# Fidelity target = quadlet/lme-setup-certs.container, MINUS the appended
# annotations / trailing whitespace. (The unit's leading comment mislabels it
# `lme-elasticsearch-security-setup.container`; ContainerName is lme-setup-certs.)
#
# SANCTIONED lme_certs exception: this is the generator, so it KEEPS the shared
# lme_certs workspace mount (rw) -- the task explicitly sanctions it. UserNS=auto
# (unpinned) and User=0 preserved so it can write the workspace as root.
id: setup-certs
name: lme-setup-certs
kind: container
enabled_when: [always]
image: elasticsearch

dependencies:
  requires: [network, esdata01, kibanadata]
  after: [lme, network, esdata01, kibanadata]
  partof: [lme]
install:
  wanted_by: [default.target, lme]

behavior:
  type: oneshot
  remain_after_exit: true
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

secrets:
  - {name: elastic, type: env, target: ELASTIC_PASSWORD}
  - {name: kibana_system, type: env, target: KIBANA_PASSWORD}
environment_files: [/opt/lme/lme-environment.env]

exec: /bin/bash /usr/share/elasticsearch/config/setup/init-setup.sh
network_aliases: [lme-setup]
podman_args: ["--health-interval=2s"]

# SANCTIONED lme_certs workspace mount (cert generator context).
volumes:
  - {source: lme_certs, dest: /usr/share/elasticsearch/config/certs}
  - {source: lme_esdata01, dest: /usr/share/elasticsearch/data}
  - {source: /opt/lme/config/setup, dest: /usr/share/elasticsearch/config/setup}

run_as:
  user: "0"
userns:
  mode: auto_unpinned        # renders UserNS=auto
