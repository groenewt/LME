---
# pgvectordata -- kind: volume. Backing store for the pgvector Postgres data dir.
# Gated with the LLM stack (enabled_when:[install_llm]).
#
# LIVE-BUG CURE: the static quadlet/lme-pgvectordata.volume is literally just
# `[Volume]` with NO VolumeName -- podman then auto-creates an UNMANAGED volume
# (not owned by the lme lifecycle, never torn down by wipe). There is no fidelity
# to preserve against that stub; the cure is the canonical volume shape (compare
# structurally to the rendered lme-esdata01.volume): a pinned VolumeName plus the
# lme lifecycle deps so `lme-pgvectordata-volume.service` is a first-class member.
#
# INVARIANT (hard rule): name == 'lme-' + id, because svc_unit builds volume deps
# as `lme-<id>-volume.service`. Here id=pgvectordata, name=lme-pgvectordata.
# The container (lme-pgvector.yml) mounts the podman volume `lme_pgvectordata`.
id: pgvectordata
name: lme-pgvectordata
kind: volume
enabled_when: [install_llm]

volume_name: lme_pgvectordata
driver: local

dependencies:
  partof: [lme]
  after: [lme]

# DATA-SAFETY / AUTHORITY (codex-manager-check-0300 initialized_storage clause).
# This volume holds pgvector's INITIALIZED lme_vectors + litellm storage; its
# authority is DERIVED (see the `authority` block in
# manifests/services/lme-pgvector.yml). The rule below is a PROPOSED invariant, NOT
# current behavior: a profile change that would move that authority off this store
# MUST route through config/postgresql-platform/migration-workflow.contract.yaml, and
# an ordinary apply that would re-initialize or orphan this volume MUST be REJECTED,
# fail-closed (never drop / orphan / initialize-over existing data). NO renderer
# accessor reads the keys below, so unit fidelity is unchanged.
preservation:
  status: proposed
  role: authoritative-initialized-storage
  migration_contract: config/postgresql-platform/migration-workflow.contract.yaml
  on_authority_change: preserve-and-route-to-migration      # TARGET: never wiped or re-initialized
  current_behavior: >-
    NOT yet preserved. scripts/wipe_lme.sh (podman volume rm -a) removes this volume
    wholesale; ansible/restore_lme_master.yml removes it (it rejects only lme_backups);
    and disabling install_llm stops rendering this volume unit, orphaning the on-disk
    data. Closing these is the migration/retirement + install_llm:false authority-`none`
    seam.
