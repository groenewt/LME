---
# filebeatdata -- kind: volume (elastic-services pack). Backs filebeat's registry.
# Optional: enabled_when:[install_elastic_services] (renders only with the pack;
# the filebeat exemplar requires it via lme-filebeatdata-volume.service).
#
# INVARIANT (svc_unit volume-dep naming): name == 'lme-' + id, so the dep filebeat
# declares -- requires:[...filebeatdata] -> lme-filebeatdata-volume.service --
# resolves to THIS unit. No owner block: this is plain container data, not a cert
# bundle, so volume.j2 emits no User=/Group= (the static unit has neither).
#
# Fidelity target = quadlet-optional/elastic-services/lme-filebeatdata.volume
# (byte-equivalent modulo section/blank cosmetics).
id: filebeatdata
name: lme-filebeatdata
kind: volume
enabled_when: [install_elastic_services]

volume_name: lme_filebeatdata
driver: local

dependencies:
  partof: [lme]
  after: [lme]
