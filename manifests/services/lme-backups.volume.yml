---
# backups -- kind: volume. The Elasticsearch snapshot/backup volume.
# Fidelity target = quadlet/lme-backups.volume, MINUS the appended
# `#@@TODO:OPERATOR: HARDCODED` annotations that corrupt the User/Group/Driver
# values (a `#` mid systemd value is NOT a comment). No pinned userns slot, so the
# owner derives to subuid_base (165536 = 165536 + 0*3048 + 0) -- exactly the
# observed static owner.
id: backups
name: lme-backups            # invariant: name == 'lme-' + id
kind: volume
enabled_when: [always]

volume_name: lme_backups
driver: local
# cert_owner({in_container_uid:0}) = subuid_base + 0 = 165536 (User=/Group=)
owner:
  in_container_uid: 0

dependencies:
  partof: [lme]
  after: [lme]
