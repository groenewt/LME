---
# backups -- kind: volume. The Elasticsearch snapshot/backup volume.
# Fidelity target = quadlet/lme-backups.volume, MINUS the appended
# `#@@TODO:OPERATOR: HARDCODED` annotations that corrupt the User/Group/Driver
# values (a `#` mid systemd value is NOT a comment). No pinned userns slot, so the
# owner derives to subuid_base (165536 = 165536 + 0*3048 + 0) -- exactly the
# observed static owner.
id: backups
name: lme-backups            # invariant: name == 'lme-' + id
kind: volume
enabled_when: [always]

volume_name: lme_backups
driver: local
# cert_owner({in_container_uid:0}) = subuid_base + 0 = 165536 (User=/Group=)
owner:
  in_container_uid: 0

dependencies:
  partof: [lme]
  after: [lme]

# DATA-SAFETY (migration evidence; codex-manager-check-0300 initialized_storage
# clause). Beyond the Elasticsearch snapshot role above, ansible/roles/backup_lme
# archives lme_pgvectordata AND captures the pgvector / llm-keys podman secrets INTO
# this volume (see ansible/BACKUP_README.md: volumes/lme_pgvectordata/ +
# secrets/pgvector.vault). It therefore holds PRE-MIGRATION EVIDENCE of pgvector
# authority. The rule below is a PROPOSED invariant: the scoped-retirement step in
# config/postgresql-platform/migration-workflow.contract.yaml MUST retain this volume
# (retiring an OLD authority NEVER prunes lme_backups). NO renderer accessor reads the
# keys below, so unit fidelity is unchanged.
preservation:
  status: proposed
  role: migration-evidence-store
  migration_contract: config/postgresql-platform/migration-workflow.contract.yaml
  on_authority_change: retain      # TARGET: never pruned by scoped retirement
  current_behavior: >-
    Partially preserved: ansible/restore_lme_master.yml and ansible/roles/backup_lme
    treat lme_backups as the retained backup destination, but scripts/wipe_lme.sh
    (podman volume rm -a) and ansible/rollback_lme.yml still remove it wholesale. The
    scoped-retirement "retain" guarantee is a PROPOSED migration invariant, not current
    teardown behavior.
