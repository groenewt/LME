---
# log-analyzer -- kind: container. The LME Log Analyzer (Streamlit web UI).
# LOCALLY BUILT: image ref `lme-log-analyzer` in global.images carries a `build:`
# (lme-log-analyzer/Dockerfile), no upstream pull.
#
# GATING NOTE (cross-group / orchestrator): this is an LLM-stack service (its
# image is global.images group:llm, it lives in quadlet/ not quadlet-optional/,
# and it Wants=lme-litellm.service). It is therefore gated enabled_when:[install_llm]
# -- NOT install_elastic_services. The fan-out plan's MA2 line mistakenly lists
# "log-analyzer" among the elastic-services beats; that agent MUST NOT also emit
# this manifest (it would flip the flag via last-writer-wins and could render the
# UI with no litellm present). See the MA3 report.
#
# Fidelity target = static quadlet/lme-log-analyzer.container; expected diffs are
# directive REORDER plus the ONE B4 cert-mount line change below. PublishPort=8501
# is a SINGLE port (no comma-join bug).
#
# B4 cert isolation (WAVE-2): this unit mounts ONLY its own published bundle
# (cert:log-analyzer -> /opt/lme/certs/log-analyzer) at /certs, read-only, NO idmap
# -- NOT the shared lme_certs workspace (which holds ca/ca.key). ca/ca.key is now
# mounted into NOTHING, closing the CA-MITM exposure. The published bundle mirrors
# the workspace SUBDIR layout, so in-container paths are UNCHANGED: the exec still
# reads /certs/log-analyzer/log-analyzer.{crt,key}. needs_ca:true records that this
# UI needs the CA (it is a TLS client to https ES/litellm); the certs-role publisher
# copies ca/ca.crt into every bundle unconditionally, ca.key into none.
#
# This unit carries NO `userns:` and NO `run_as:` today (VERIFIED) -> it renders
# no UserNS= and runs in the HOST user namespace (container-root == host-root), and
# it already read lme_certs AS ROOT. The `,idmap` option was therefore VESTIGIAL
# (meaningless with no userns map). So certs.host_userns:true + in_container_uid:0
# keeps IDENTICAL read semantics (root reads a root-owned 0640 key) while isolating
# the bundle. cert_owner => 0 (host_userns base 0 + in_container_uid 0).
#
# DEPLOY-TIME RE-VERIFY FLAG: images were wiped from graph. This image is BUILT
# in-repo (lme-log-analyzer/Dockerfile: FROM python:3.11-slim, no USER -> runs root),
# so in_container_uid:0 is expected-correct; still confirm at first deploy that no
# USER <non-root> was introduced (Config.User != 0 would make the 0640 bundle key
# unreadable -- SAME accepted risk class as G5's fleet/wazuh). Re-verify:
# podman inspect --format '{{.Config.User}}' <image>.
id: log-analyzer
name: lme-log-analyzer
kind: container
enabled_when: [install_llm]
image: lme-log-analyzer
description: LME Log Analyzer - Streamlit Web UI

dependencies:
  wants: [elasticsearch, litellm]
  after: [elasticsearch, litellm]
  partof: [lme]
install:
  wanted_by: [default.target, lme]

behavior:
  restart: always
  restart_sec: 5
  timeout_start_sec: 300
  start_limit_interval: 120
  start_limit_burst: 10
service_environment:
  ANSIBLE_VAULT_PASSWORD_FILE: /etc/lme/pass.sh

environment:
  ELASTICSEARCH_URL: "https://lme-elasticsearch:9200"
  ELASTICSEARCH_USER: elastic
  LITELLM_URL: "https://lme-litellm:4000"
  LITELLM_MODEL: lfm2.5-1.2b-instruct

secrets:
  - {name: elastic, type: env, target: ELASTICSEARCH_PASSWORD}
  # B2: LITELLM_API_KEY comes from the shared per-install podman secret
  # litellm_master_key (same secret litellm exposes as LITELLM_MASTER_KEY), replacing
  # the former hardcoded proxy-key literal. app_simple.py's os.getenv fallback is now overridden.
  - {name: litellm_master_key, type: env, target: LITELLM_API_KEY}

network_aliases: [lme-log-analyzer]
publish_ports:
  - {host: 8501, container: 8501}
volumes:
  - {source: "cert:log-analyzer", dest: /certs, options: [ro, Z]}          # B4: per-svc bundle, no idmap; Z=SELinux relabel

# B4 cert-owner metadata (consumed by the certs role / init-setup.sh, NOT emitted
# into the unit -> zero effect on rendered fidelity). host_userns:true -> no UserNS
# remap, so cert_owner = in_container_uid directly (0 = root). needs_ca:true records
# that this consumer needs the CA (TLS client to internal https endpoints).
certs:
  host_userns: true
  in_container_uid: 0
  needs_ca: true

exec: 'streamlit run app_simple.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true --server.sslCertFile=/certs/log-analyzer/log-analyzer.crt --server.sslKeyFile=/certs/log-analyzer/log-analyzer.key'
